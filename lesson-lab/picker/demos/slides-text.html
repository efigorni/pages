<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שקפים — שאלה אחת גדולה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
<link rel="stylesheet" href="../../theme/slides.css">
</head>
<body>
<div class="reveal"><div class="slides">
  <section class="s-q">
    <div class="kicker">קדימה ללמידה</div>
    <h2>איפה אתם מרגישים הכי בבית?<br>כתבו מקום אחד — ולמה.</h2>
    <div class="foot"><span>3 דקות, לבד ובשקט</span><span class="timer" data-sec="180"></span></div>
  </section>
  <section class="s-q">
    <div class="kicker">כדור שלג מתגלגל</div>
    <h2>בזוגות: 10 משפטים שכל אחד מכם שומע בבית.</h2>
    <div class="foot"><span>4 דקות · אחר כך מצטרפים לזוג הסמוך</span><span class="timer" data-sec="240"></span></div>
  </section>
  <section class="s-q">
    <div class="kicker">מה זאת שייכות?</div>
    <h2>אהוב · נחוץ · יכול</h2>
    <p class="sub">לפעמים לוקח זמן למצוא מקום חדש.</p>
  </section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="../../theme/lesson.js"></script>
<script src="deck-init.js"></script>
</body>
</html>
