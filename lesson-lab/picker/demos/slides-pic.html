<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שקפים — איור גדול ומעט מילים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
<link rel="stylesheet" href="../../theme/slides.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <g id="kid"><circle cx="0" cy="-34" r="15"/><path d="M-22 18 C-22 -8 -14 -16 0 -16 C14 -16 22 -8 22 18 Z"/></g>
  </defs>
</svg>
<div class="reveal"><div class="slides">
  <section class="s-pic">
    <div>
      <div class="kicker">קדימה ללמידה</div>
      <h2>איפה אתם מרגישים הכי בבית?</h2>
      <p class="sub">מקום אחד — ולמה. 3 דקות, בכתב.</p>
    </div>
    <div class="pic">
      <svg viewBox="0 0 620 520" role="img" aria-label="בית קטן ובתוכו דמות, ולידו מפה עם סימון">
        <g filter="url(#rough)">
          <path d="M120 270 L310 110 L500 270 Z" fill="#f7ae4d"/>
          <rect x="160" y="262" width="300" height="200" rx="10" fill="#fff" stroke="#13100e" stroke-width="7"/>
          <rect x="286" y="352" width="56" height="110" rx="8" fill="#63b1af"/>
          <rect x="196" y="300" width="64" height="56" rx="6" fill="#eeecf7" stroke="#13100e" stroke-width="5"/>
          <rect x="362" y="300" width="64" height="56" rx="6" fill="#eeecf7" stroke="#13100e" stroke-width="5"/>
          <path d="M470 130 C470 92 530 92 530 130 C530 160 500 186 500 200 C500 186 470 160 470 130 Z" fill="#8c82c1"/>
          <circle cx="500" cy="128" r="12" fill="#fff"/>
          <g fill="#13100e"><use href="#kid" x="94" y="452"/></g>
        </g>
      </svg>
    </div>
  </section>
  <section class="s-pic">
    <div>
      <div class="kicker">כדור שלג מתגלגל</div>
      <h2>2 ← 4 ← 8</h2>
      <p class="sub">בזוגות: 10 משפטים ששומעים בבית. אחר כך מצטרפים.</p>
    </div>
    <div class="pic">
      <svg viewBox="0 0 620 540" role="img" aria-label="זוג, רביעייה ושמינייה של דמויות">
        <g filter="url(#rough)">
          <g fill="#63b1af"><use href="#kid" x="530" y="90"/><use href="#kid" x="584" y="90"/></g>
          <path d="M500 130 C470 160 450 170 420 190" stroke="#847c74" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 12"/>
          <g fill="#8c82c1"><use href="#kid" x="310" y="210"/><use href="#kid" x="364" y="210"/><use href="#kid" x="310" y="284"/><use href="#kid" x="364" y="284"/></g>
          <path d="M280 320 C250 350 230 365 200 380" stroke="#847c74" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 12"/>
          <g fill="#f7ae4d"><use href="#kid" x="36" y="420"/><use href="#kid" x="90" y="420"/><use href="#kid" x="144" y="420"/><use href="#kid" x="198" y="420"/><use href="#kid" x="36" y="500"/><use href="#kid" x="90" y="500"/><use href="#kid" x="144" y="500"/><use href="#kid" x="198" y="500"/></g>
        </g>
      </svg>
    </div>
  </section>
  <section class="s-pic">
    <div>
      <div class="kicker">מה זאת שייכות?</div>
      <h2>אהוב · נחוץ · יכול</h2>
      <p class="sub">לפעמים לוקח זמן למצוא מקום חדש.</p>
    </div>
    <div class="pic">
      <svg viewBox="0 0 620 540" role="img" aria-label="שלושה עיגולים חופפים: אהוב, נחוץ, יכול">
        <g filter="url(#rough)" font-family="Secular One, Arial Hebrew, sans-serif" font-size="38" text-anchor="middle">
          <circle cx="230" cy="210" r="150" fill="#63b1af" fill-opacity=".55"/>
          <circle cx="390" cy="210" r="150" fill="#f7ae4d" fill-opacity=".6"/>
          <circle cx="310" cy="350" r="150" fill="#8c82c1" fill-opacity=".55"/>
          <text x="180" y="170" fill="#13100e">אהוב</text><text x="440" y="170" fill="#13100e">נחוץ</text><text x="310" y="450" fill="#13100e">יכול</text>
          <g fill="#13100e"><use href="#kid" x="310" y="275"/></g>
        </g>
      </svg>
    </div>
  </section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="../../theme/lesson.js"></script>
<script src="deck-init.js"></script>
</body>
</html>
