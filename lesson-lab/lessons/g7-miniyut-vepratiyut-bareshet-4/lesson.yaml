sensitivity: med

sub: >-
  בבית קל לסגור דלת. ברשת — הרבה פחות. בשיעור הזה בודקים כמה הפרטיות חשובה לנו, למה היא חשובה במיוחד בגיל
  ההתבגרות, ומה קורה לה ברשת ובעידן הבינה המלאכותית.
format: עמידה בין הקירות, זוגות ומליאה
question: למה קשה יותר לשמור על פרטיות ברשת — ואיך שומרים על הפרטיות שלנו ושל אחרים?
takeaways:
  - לכל אחד יש זכות לפרטיות — ובגיל ההתבגרות היא חשובה לנו במיוחד.
  - >-
    ברשת קשה יותר לשלוט: תמונה או הודעה יכולות לעבור הלאה, גם כשלא רצינו.
  - הפצה או עריכה של תמונה אינטימית של מישהו היא פגיעה ועבירה — והאומץ הוא לעצור ולא לשתף.
prep:
  - >-
    שני שלטים — ״חשוב לי מאוד״ על הקיר הימני ו״לא חשוב לי בכלל״ על הקיר השמאלי — ומעבר פנוי ביניהם
  - חלוקה מראש לזוגות לפי השולחנות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פרטיות, התפתחות מינית בגיל ההתבגרות, והפצה ועריכה של תמונות. שאלי אם היה
      לאחרונה בשכבה אירוע של תמונה שהופצה, ואם יש בכיתה מי שנפגע מכזה — אם כן, החליטו יחד אם ואיך ללמד את
      השיעור. בקשי שתהיה זמינה אחריו.
  - head: מי עלול להיפגע
    text: >-
      מי שתמונה שלו הופצה, או שלחצו עליו לשלוח תמונה, עלול להרגיש חשוף. מדברים על מה שקורה לתמונה ועל מי
      שמפיץ אותה — לא על ״מי ששולח תמונות״, ואף פעם לא מאשימים את מי שמופיע בה. ולא לכולם יש חדר משלהם —
      כשמדברים על פרטיות בבית, לא מניחים שיש.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח: ״מספרים רק על עצמנו, ובלי שמות״. על התפתחות מינית שואלים מה נערים ונערות בגיל הזה חושבים — לא
      מה עובר על מישהו מסוים. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל תמונה שהופצה, סחיטה, או לחץ לשלוח תמונה — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.
  - head: עמידה מול הכיתה
    text: >-
      בין הקירות עומדים לפי כמה הדבר חשוב לכל אחד. המשפטים נבחרו כך שלא יחשפו מה קורה בבית של אף אחד; מותר
      לעמוד באמצע, ומסבירים רק מתנדבים ורק על עצמם. מי שלא נוח לו לזוז — עונה מהמקום, בעמידה או בישיבה. צחוק
      על המקום של מישהו — עוצרים מיד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״עוד סבב בין הקירות״; פחות
    — ישר ל״חשוב לזכור״.
  short:
    steps:
      - space
      - online
    text: >-
      בין הקירות עוברים שני משפטים בלבד, ובשאלת ׳פיזי או מקוון׳ מוותרים על הזוגות — הצבעה ונימוק אחד מכל צד

brain_break:
  signs: עיניים כבדות, ראשים על השולחן, שקט שלא נשבר גם אחרי שאלה.
  ideas:
    - name: חמש־ארבע־שלוש
      text: בשקט, כל אחד מוצא חמישה דברים שהוא רואה, ארבעה שהוא שומע ושלושה שהוא מרגיש בגוף.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
    - name: סופרים עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר את המספר הבא, בלי סדר ובלי סימנים. שניים מדברים יחד?
        מתחילים מאחת.
  from: wrap

