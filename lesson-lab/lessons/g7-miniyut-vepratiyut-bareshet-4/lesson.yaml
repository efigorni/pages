steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: space
    title: זה רק אני והמרחב הפרטי שלי
    minutes: 7
    stance: true
    practices:
      - מה הקשר?
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      ארבעה משפטים על פרטיות בבית ובחפצים שלנו; כל אחד נעמד בין ׳חשוב לי מאוד׳ ל׳לא חשוב לי בכלל׳, ומתנדבים
      מסבירים
    body:
      - slide:
          kicker: זה רק אני והמרחב הפרטי שלי · בין הקירות
          title: כמה זה חשוב לכם?
          sub: קיר אחד — חשוב לי מאוד. הקיר השני — לא חשוב לי בכלל.
          echo: true
          alt: קו בין שני קירות, כוכב בקצה אחד ופנים ניטרליות בשני, ודמות עומדת באמצע
          art: {file: art/walls-line.svg}
      - moves:
          - >-
            הכיתה קמה. הראי את שני הקירות — הימני ״חשוב לי מאוד״, השמאלי ״לא חשוב לי בכלל״ — ואמרי שכל מקום
            ביניהם הוא תשובה.
          - הקריאי משפט, וחכי חמש שניות של שקט לפני שזזים.
          - שאלי מתנדב אחד או שניים, ממקומות שונים, למה בחרו במקום שלהם. חשוב לשמוע דעות מגוונות.
          - אחרי המשפט הרביעי — שאלת סיכום, וחוזרים למקומות.
      - say: >-
          לפני כל משפט חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז זזים. אין תשובה נכונה, ומסבירים רק על
          עצמנו.
      - slide:
          kicker: משפט 1
          title: כל אחד צריך פרטיות, גם בבית שלו.
          verbatim: true
          echo: true
          cue: אחרי ההסבר —
          alt: בית
          art: house
      - slide:
          kicker: משפט 2
          title: כשאני באמבטיה צריך לדפוק על הדלת ולא לפתוח אותה.
          verbatim: true
          echo: true
          cue: המשפט הבא —
          alt: דלת, ובועת דיבור עם ״טוק טוק״
          art:
            - {use: door, x: 330, y: 150, w: 200}
            - {use: speech, x: 60, y: 80, w: 230}
            - text: טוק טוק
              x: 175
              y: 156
              size: 44
      - slide:
          kicker: משפט 3
          title: אף אחד לא יכול לגעת בתיק שלי או בטלפון שלי בלי רשותי
          sub: אפילו חברים טובים.
          verbatim: true
          echo: true
          cue: המשפט הבא —
          alt: טלפון, ועיגול עם איקס לידו
          art:
            - {use: phone, x: 300, y: 120, w: 170}
            - {use: cross, x: 90, y: 230, w: 150}
      - slide:
          kicker: משפט 4
          title: בגיל ההתבגרות במיוחד חשוב שיכבדו את הפרטיות שלי בבית.
          verbatim: true
          echo: true
          cue: המשפט האחרון —
          alt: נבט בעציץ, ובית לידו
          art:
            - {use: sprout, x: 290, y: 150, w: 230}
            - {use: house, x: 70, y: 260, w: 180}
      - ask: איפה עמדנו קרוב זה לזה — ולמה, לדעתכם, על פרטיות בבית קל לנו להסכים?
      - say: >-
          הצורך בפרטיות ברור ומוחשי כשאנחנו במרחב הפיזי: דלת סגורה, תיק שלא פותחים. ובגיל ההתבגרות הפרטיות חשובה
          לנו במיוחד — בואו נבין למה.

  # ------------------------------------------------------------------ 7′–13′
  - id: grow
    title: פרטיות והתבגרות
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      הזכות לפרטיות בחוק; ובזוגות — מה הקשר בין התפתחות מינית לשמירה על פרטיות בגיל ההתבגרות
    body:
      - slide:
          kicker: הזכות לפרטיות
          title: לכל אדם יש זכות לפרטיות
          sub: חוק יסוד — כבוד האדם וחירותו (1992)
          echo: true
          alt: מנעול, וספר פתוח לידו
          art:
            - {use: lock, x: 340, y: 130, w: 190}
            - {use: book, x: 70, y: 230, w: 230}
      - quote:
          title: מהמקור — להקריא
          text: >-
            חוק יסוד כבוד האדם וחירותו שנחקק ב1992 קובע בין השאר כי לכל אדם יש זכות לפרטיות ולהגנה על צנעת חייו.
            זו לא סתם תחושה או המלצה — זה עיקרון חשוב, זכות בסיסית של האדם הקבוע בחוק יסוד.
      - moves:
          - >-
            הקריאי מהמקור, והוסיפי שפרטיות היא גם הזכות לשלוט במידע עלינו — ולמנוע את הפרסום שלו בלי הסכמה.
          - שאלי על מה, לדעתם, נערים ונערות בגילם מדברים, ושמעי שתיים־שלוש תשובות.
          - >-
            הציגי את השאלה: חצי דקה לבד, דקה בזוגות, ושלושה זוגות במליאה.
          - סכמי בתשובה של המקור — הקריאי אותה.
      - whisper: >-
          דוגמאות מהמקור לפרטיות בגיל ההתבגרות: שידפקו על הדלת, שלא ייכנסו כשמתלבשים, שלא יגידו לנו איך לסדר את
          החדר, שייתנו לנו עצמאות ושליטה. ותשובות שעולות על ״על מה מדברים״: התאהבות, הגוף שגדל ומשתנה.
      - ask: על מה, לדעתכם, נערים ונערות בגיל שלכם מדברים?
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה הקשר בין התפתחות מינית ושמירה על פרטיות בגיל ההתבגרות?
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          verbatim:
            - title
          echo: true
          cue: אחרי כמה תשובות —
          alt: דמות, ומעליה ענן מחשבה ובתוכו לב
          art:
            - {use: thought, x: 60, y: 40, w: 300}
            - {use: heart, x: 158, y: 110, w: 110}
            - {use: kid-stand, x: 380, y: 210, w: 140, color: teal}
      - ladder:
          help: מה משתנה בגיל ההתבגרות — בגוף, ברגשות, ביחסים עם חברים?
          challenge: מתי כדאי לשתף משהו אישי — ועם מי? ומתי עדיף לשמור לעצמכם?
      - quote:
          title: תשובה אפשרית מהמקור — להקריא בסוף
          text: >-
            מיניות היא תמיד דבר פרטי בכל גיל. בגיל ההתבגרות היא עוברת לקדמת הבמה והופכת למרכזית מאד בגלל השינויים
            הרבים והמהירים שמתרחשים בעקבות ההתפתחות והגדילה: שינויים גופניים, חברתיים, רגשיים, קוגניטיביים.
            בגיל ההתבגרות, זה טבעי ורצוי שיהיו לכם שאלות על מיניות, על שינויים שקורים בגוף, על רגשות חדשים – ואפילו
            על דברים אישיים שעוברים עליכם. זה לגמרי בסדר לרצות לדבר על זה, לשתף, להתייעץ – עם חברים, עם מבוגרים
            שאתם סומכים עליהם, עם יועצת או מורה. מצד שני, חשוב גם לדעת שיש דברים שלא חייבים לשתף עם כולם. פרטיות
            זה דבר חשוב בהקשר למיניות וצריך לבחור את מי משתפים, מתי, ואיך.
      - say: >-
          גם לדבר זה חשוב, וגם לשמור על פרטיות זה חשוב — העיקר שתרגישו שאתם שולטים בסיפור שלכם. ועכשיו: איפה
          קשה יותר לשלוט?

  # ------------------------------------------------------------------ 13′–19′
  - id: online
    title: פיזי או מקוון?
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      איפה קל יותר לשמור על פרטיות — במרחב הפיזי או ברשת? הצבעה, נימוקים בזוגות, ויכוח במליאה, והסיכום של המקור
    body:
      - slide:
          kicker: שמירה על פרטיות במרחב המקוון
          title: איפה קל יותר לשמור על פרטיות
          sub: במרחב הפיזי או במרחב המקוון?
          verbatim: true
          echo: true
          alt: בית, ולידו טלפון עם התראה
          art:
            - {use: house, x: 330, y: 170, w: 250}
            - {use: phone-notify, x: 60, y: 170, w: 190}
      - moves:
          - >-
            שאלי את השאלה, ועשי הצבעה מהירה: מי חושב שבמרחב הפיזי קל יותר? מי חושב שברשת?
          - >-
            דקה בזוגות: כל זוג מוצא נימוק אחד לכל צד.
          - במליאה — שמעי נימוקים משני הצדדים, ותני לתלמידים להתווכח זה עם זה. חשוב לתת מקום לתשובות מגוונות.
          - סכמי בשקף ״מי שולט בפרטיות שלי?״ — חשפי שורה אחרי שורה.
      - whisper: >-
          מרחבים ברשת שתלמידים נמצאים בהם, לפי המקור: אינסטגרם, טיקטוק, סנאפצ׳אט, וואטסאפ, פייסבוק, פיפ״א,
          פורטנייט, יוטיוב, רובלוקס.
      - say: דקה בזוגות — מצאו נימוק אחד לכל צד, פיזי ומקוון.
      - ladder:
          help: מה קורה לדלת אחרי שסגרתם אותה — ומה קורה לתמונה אחרי שלחצתם ׳שלח׳?
          challenge: האם הגדרות פרטיות יכולות להבטיח שתמונה לא תגיע לאנשים שלא רציתם? למה?
      - ask: מי מסכים עם הנימוק הזה? מי חושב אחרת — ולמה?
      - slide:
          kicker: פיזי או מקוון
          title: מי שולט בפרטיות שלי?
          points:
            - במרחב הפיזי — בוחרים מי נכנס
            - ברשת — תמונות עוברות הלאה
            - מידע אינטימי ברשת — סיכון לפגיעה
            - פרטיות אמיתית מול פרטיות מדומה
          echo: true
          cue: אחרי הנימוקים —
          alt: טלפון, וחץ ממנו אל רשת של עיגולים מחוברים
          art:
            - {use: phone, x: 400, y: 150, w: 140}
            - {use: arrow, x: 250, y: 220, w: 140, color: gray}
            - {use: network, x: 40, y: 170, w: 210}
      - whisper: >-
          הסיכום של המקור: במרחב הפיזי קל יותר לשלוט — סוגרים דלת, ובוחרים עם מי לשתף מידע אינטימי (שאלות על גיל
          ההתבגרות, התאהבות, איך הגוף נראה) — וחוויית הפרטיות אמיתית. ברשת קשה יותר לשלוט: גם כשחוסמים ומגדירים
          פרטיות, תמונות והודעות יכולות לעבור הלאה ולהגיע לאנשים שלא רצינו, ושיתוף של מידע אינטימי עלול להוביל
          לסיכון ולפגיעה — חוויית הפרטיות מדומה.
      - say: >-
