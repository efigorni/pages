steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: שיר שעושה טוב
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה קצרה כשנכנסים — מילה או שורה משיר שעושה לי טוב; שומעים ארבעה–חמישה שירים
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: שיר שאתם אוהבים במיוחד
          sub: כתבו מילה או שורה ממנו — ומה בו עושה לכם טוב.
          timer: 180
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו תווי נגינה
          art: {file: art/song.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת; מתחילים לכתוב בלי הסבר נוסף.
          - >-
            בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. רשמי לעצמך שניים־שלושה שירים שעלו — הם יתנגנו ברקע
            בשלב הבא.
          - שמעי ארבעה–חמישה, ושאלי אם הם אוהבים רק להאזין לשיר, או גם להצטרף ולשיר.
      - say: שלוש דקות, לבד. מילה מהשיר, שורה מהפזמון, או מה שהמנגינה עושה לכם.
      - ladder:
          help: איזה שיר אתם שמים כשאתם רוצים להרגיש טוב יותר?
          challenge: מה בשיר עושה לכם טוב — המילים, המנגינה, או הזיכרון שקשור אליו?
      - ask: מי רוצה לשתף — איזה שיר, ומה הוא עושה לכם?
      - say: >-
          שירים הם דוגמה אחת לדברים שממלאים אותנו ונותנים לנו כוחות. יש עוד — מילה טובה שמישהו אומר, תחביב,
          רגע קטן ביום. היום ניתן מקום לדברים הטובים.

  # ------------------------------------------------------------------ 5′–13′
  - id: flags
    title: אלה דברים שאותי משמחים
    minutes: 8
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - עניין ורלוונטיות
      - דיפרנציאליות וגיוון
    summary: כל אחד כותב על דגלון חמישה דברים קטנים שמשמחים אותו, ועוד אחד; ברקע מתנגנים השירים מהפתיחה
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הדגלונים — ההוראה נשארת על המסך כל הזמן.
          - חלקי דגלונים וטושים, והשמיעי ברקע את השירים שרשמת בפתיחה.
          - הסתובבי בין השולחנות. מי שנתקע — הציעי לו את פתיחי המשפט של שאלת העזר.
          - דקה לפני הסוף — בקשי מכולם להוסיף לרשימה עוד דבר אחד.
      - slide:
          kicker: לבד · 6 דקות
          title: חמישה דברים שמשמחים אתכם
          sub: גם דברים קטנים ויומיומיים — ובסוף, עוד אחד.
          timer: 360
          echo: true
          alt: דגלון גדול עם חמש שורות כתובות, ועיפרון לידו
          art: {file: art/pennant.svg}
      - say: >-
          היום נעצור לרגע ונדבר על שמחה — על רגעים קטנים שעושים לנו טוב, ושדווקא אותם קל לשכוח בתוך הלחץ
          והשגרה. אז מה משמח אתכם?
      - task:
          what: >-
            כל אחד כותב על הדגלון חמישה דברים שמשמחים אותו — גם דברים קטנים ויומיומיים, שפשוט עושים הרגשה טובה
            — ובסוף מוסיף עוד דבר אחד. אפשר לקשט ולצייר.
          time: 6 דקות
          group: לבד
          rules: כותבים בשקט, והשירים ברקע; אין דבר קטן מדי; לא חייבים לכתוב שם
          plenary: אין — ממשיכים ישר לזוגות ולשרשרת
          help: השלימו — ״משמח אותי ש…״, ״עושה לי טוב כש…״, ״הרגע הכי טוב שלי ביום הוא…״
          challenge: הוסיפו דבר אחד שמשמח אתכם ותלוי רק בכם — משהו שאפשר לעשות גם ביום קשה.
      - say: עכשיו נשתף — דבר אחד בזוגות, ואז נבנה מכל הדגלונים שרשרת אחת לכל הכיתה.

  # ------------------------------------------------------------------ 13′–21′
  - id: chain
    title: שרשרת השמחה של הכיתה
    minutes: 8
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      בזוגות — דבר אחד מהדגלון; תולים את הדגלונים על חוט, עוברים לאורך השרשרת וקוראים; במליאה — איך היה
      להתמקד בטוב
    body:
      - moves:
          - בזוגות עם השכן — כל אחד מספר על דבר אחד שכתב. דקה וחצי.
          - >-
            שני תלמידים מותחים את החוט לאורך הקיר, וכל אחד תולה את הדגלון שלו. מי שמעדיף — שומר את הדגלון
            אצלו.
          - הזמיני את כולם לעבור לאורך השרשרת ולקרוא. המוזיקה ממשיכה ברקע.
          - חוזרים למקומות. שאלי את השאלה, והזמיני את הכיתה להגיב זה לזה.
      - slide:
          kicker: שרשרת השמחה
          title: תולים — ועוברים לקרוא
          sub: יש משהו שתרצו להוסיף לדגלון שלכם?
          timer: 180
          echo: true
          alt: שרשרת של דגלונים צבעוניים, ושלוש דמויות מתחתיה
          art: {file: art/chain.svg}
      - task:
          what: >-
            בזוגות — כל אחד מספר על דבר אחד שכתב. אחר כך תולים את הדגלונים על החוט, עוברים לאורך השרשרת וקוראים
            מה כתבו אחרים. מצאתם משהו שמתאים גם לכם? הוסיפו אותו לדגלון שלכם.
          time: דקה וחצי בזוגות, 3 דקות לתלייה ולהליכה
          group: זוגות לפי השולחנות, ואז כל הכיתה
          rules: מספרים רק על מה שבחרתם; קוראים בלי להעיר על דגלון של אחר; מי שלא רוצה — לא תולה
          plenary: שאלה אחת על החוויה; שלושה–ארבעה עונים, והכיתה מגיבה
          help: על איזה דבר מהדגלון הכי קל לכם לספר?
          challenge: מצאו בשרשרת משהו שלא חשבתם עליו — ולמה הוא מתאים גם לכם?
      - ask: איך הרגשתם בפעילות? ואיך היה לכם להתמקד בדברים שעושים טוב ומכניסים שמחה לחיים?
      - say: אז מה שהרגשת זה ___ — הבנתי נכון? מי עוד הרגיש ככה? מי הרגיש אחרת?
      - say: אם שמחה עושה לנו כל כך טוב — אולי היא יותר מסתם ״נחמד״. בואו נבדוק.

  # ------------------------------------------------------------------ 21′–26′
  - id: resource
    title: שמחה היא לא מותרות
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: למה שמחה חשובה דווקא בזמנים קשים? חושבים, אומרים, ומחברים להסבר של המקור — ״תחנת דלק רגשית״
    body:
      - slide:
          kicker: רגע לחשוב
          title: למה שמחה חשובה דווקא בזמנים קשים?
          alt: ענן גשם, ושמש מציצה מאחוריו
          art:
            - {use: sun, x: 330, y: 50, w: 200}
            - {use: rain-cloud, x: 110, y: 150, w: 300}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - רשמי על הלוח מילים מתוך מה שנאמר.
          - הציגי את השקף הבא, וחשפי משפט אחד בכל פעם. לכל משפט — חברי מילה מהלוח.
      - ask: למה, לדעתכם, שמחה חשובה דווקא בזמנים קשים?
      - slide:
          kicker: שמחה היא לא מותרות
          title: שמחה היא משאב חיוני לרווחה נפשית
          points:
            - מחזקת ביטחון, שייכות ותקווה
            - ״תחנת דלק רגשית״ לימים קשים
            - מקרבת אנשים, מגינה מבדידות
            - גם לרגעים קטנים יש משמעות
          verbatim:
            - title
          echo: true
          cue: אחרי שנרשמו מילים על הלוח —
          alt: סוללה מלאה, ושמש מעליה
          art:
            - {use: sun, x: 225, y: 40, w: 170}
            - {use: battery-full, x: 140, y: 260, w: 340}
      - quote:
          title: ההסבר המלא מהמקור
          text: |-
            כשאנחנו מרגישים שמחה המוח שלנו מפריש הורמונים כמו דופמין ואוקסיטוצין אשר מחזקים בנו תחושות של בטחון, רוגע, שייכות ותקווה. זה עוזר לנו להרגיש מחוברים לעצמנו ולסביבה, לחשוב בבהירות ולתפקד טוב יותר.
            שמחה היא כמו ״תחנת דלק רגשית״. היא מעניקה לנו כוחות בזמנים של אתגר או משבר. גם אם היא זמנית היא עוזרת לנו להתאושש ולצבור אנרגיות מחודשות להתמודדות.
            שמחה מקרבת בין אנשים. כשאנחנו צוחקים, רוקדים או משתפים ברגעים טובים אנחנו מחזקים את תחושת ה״יחד״ וזה מגן עלינו מתחושות של בדידות וייאוש.
            שמחה מכניסה לחיים שלנו תקווה ומזכירה לנו שיש משמעות גם ברגעים הקטנים. היא מחברת אותנו אל מה שחשוב באמת – משפחה, חברים, מוסיקה, יצירה, ספורט ועוד.
      - say: >-
          שמחה היא לא מותרות. גם כשהיא רגעית, היא נותנת לנו כוחות להתמודד — ולכן כדאי לשים לב אליה, ולפעמים
          אפילו ליצור אותה בכוונה.

  # ------------------------------------------------------------------ 26′–30′
  - id: keep
    title: איך ממשיכים את השרשרת?
    minutes: 4
    practices:
      - Think–Pair–Share
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: לבד, בזוגות ובמליאה — רעיונות לזכור לשים לב לדברים הטובים ביום־יום
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: איך נמשיך את השרשרת?
          sub: ונזכור לשים לב לדברים הטובים שקורים לנו ביום־יום.
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          alt: זכוכית מגדלת, וכוכב לידה
          art:
            - {use: magnifier, x: 230, y: 130, w: 310}
            - {use: star, x: 60, y: 70, w: 150}
      - moves:
          - שאלי, וחכי 30 שניות של שקט לפני שמשהו נאמר.
          - דקה בזוגות — כל זוג מחפש רעיון אחד שאפשר לעשות כבר מחר.
          - שמעי שלושה–ארבעה זוגות, ורשמי את הרעיונות על הלוח.
      - ladder:
          help: מתי ביום הכי קל לכם לשים לב למשהו טוב — בבוקר, בדרך, לפני השינה?
          challenge: איזה רעיון יעזור לכם לזכור את הדברים הטובים דווקא ביום שבו קשה?
      - ask: איך נוכל להמשיך את השרשרת, ולזכור לשים לב גם לדברים הטובים שקורים לנו ביום־יום?
      - say: אז הרעיון שלכם זה ___ — הבנתי נכון? מי מוסיף רעיון אחר?

