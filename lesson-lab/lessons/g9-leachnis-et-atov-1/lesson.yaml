sub: >-
  שמחה היא לא מותרות. בשיעור הזה כל אחד כותב על דגלון מה משמח אותו, הכיתה תולה שרשרת שמחה, ומדברים על
  שמחה כמשאב שנותן כוחות — גם בימים קשים.
format: כתיבה אישית, זוגות ומליאה
question: מה משמח אותי ביום־יום — ולמה כדאי לתת לזה מקום?
takeaways:
  - שמחה נמצאת גם ברגעים קטנים ויומיומיים — ואפשר ללמוד לשים לב אליה ולתת לה מקום.
  - שמחה היא משאב — היא נותנת כוחות, מקרבת בין אנשים ועוזרת להתאושש גם בזמנים קשים.
  - כשמשתפים בדברים הטובים הם מתחזקים — אצל כל אחד, ובכיתה כולה.
prep:
  - >-
    דגלון נייר לכל תלמיד — מהשקף האחרון במצגת המקורית, או משולש מבריסטול צבעוני — וטושים וצבעים
  - חוט ארוך ואטבים או נייר דבק, לשרשרת הדגלונים על הקיר
  - רמקול או מחשב, להשמעת שירים ברקע בזמן העבודה
  - פתק לכל תלמיד (להרחבה ״הפלייליסט שלנו״)

safe:
  - head: תיאום עם היועצת
    text: >-
      השיעור פותח את ״בוחרים בחיים״ — תוכנית למניעת אובדנות ולחיזוק חוסן. לפי המקור, לפני שמתחילים ממפים עם
      היועצת את מעגלי הפגיעות בכיתה: מי שאיבד לאחרונה אדם קרוב, מי שעובר משבר או מצוקה, ומי שמישהו במשפחתו
      במצב קשה — כדי להיערך מראש למענה אישי. ספרי לה מתי השיעור, ובקשי שתהיה זמינה אחריו. במצגת המקורית יש
      גם מכתב קצר להורים על השיעור — החליטו יחד אם ומתי לשלוח אותו.
  - head: מי עלול להיפגע
    text: >-
      מי שעובר תקופה קשה עלול להתקשות למצוא חמישה דברים משמחים, ולהרגיש שזה עוד סימן שמשהו לא בסדר אצלו.
      אמרי מראש שדברים קטנים נחשבים, ושגם שניים או שלושה זה בסדר. הדגלונים נתלים בלי שמות, ואף אחד לא סופר
      או משווה דגלונים.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. בזוגות כל
      אחד בוחר דבר אחד לספר עליו. מי שלא רוצה לתלות את הדגלון — שומר אותו אצלו, בלי הסברים. מותר לוותר, ולא
      קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים
      לשמור בסוד. דגלון ריק, ״כלום לא משמח אותי״ או רמז לייאוש — לא מחכים לפתקים: מדברים בשקט ומעדכנים את
      היועצת עוד היום.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 15 דקות ומעלה — שתי ההרחבות; 10–14 דקות — רק ״הפלייליסט שלנו״;
    פחות — ישר לכרטיס היציאה.
  short:
    steps:
      - chain
      - resource
    text: >-
      בשרשרת מוותרים על ההליכה לאורך החוט — מספרים בזוגות ותולים; ובשקף ״שמחה היא לא מותרות״ מקריאים את ארבעת
      המשפטים בלי לאסוף קודם תשובות

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
    - name: מחיאות בקצב
      text: מחאי קצב קצר, והכיתה חוזרת עליו. בכל סבב — קצב קצת יותר מסובך.
  from: video

