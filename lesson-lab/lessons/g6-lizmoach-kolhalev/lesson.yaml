sub: >-
  לגדול זה גם בגוף וגם בלב. בשיעור הזה כותבים איך זה מרגיש לגדול, שומעים מתבגרים מספרים על השינויים,
  מגלים שאנחנו לא לבד, ובודקים מה מתאים לגיל שלנו — ומה עוד יחכה.
format: כתיבה אישית, סרטון, זוגות ומליאה
question: איך זה מרגיש לגדול — ולמה חשוב לזכור שכל אחד גדל בקצב שלו?
takeaways:
  - גיל ההתבגרות מעורר רגשות שונים, ולפעמים הפוכים — וזה טבעי.
  - כולם עוברים את השינויים, כל אחד בקצב שלו, ואפשר לדבר עליהם.
  - עם ההתבגרות מגיעה גם אחריות — לכל דבר יש את הזמן שלו.
prep:
  - עשרת ״הדברים של גדולים״ מהשלב ״מה מתאים לגיל שלנו?״ — כתובים על הלוח לפני השיעור

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — רגשות ושינויים בגיל ההתבגרות, וכתיבה אישית שאחרים קוראים בלי שמות. שאלי
      מי בכיתה שהנושא קרוב אליו מדי: מי שמתפתח מוקדם או מאוחר ושומע על זה הערות, מי שעובר תקופה קשה בבית,
      ומי שמתמודד עם בדידות או עצב. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שגדל מהר או לאט מהאחרים, ומי שהבדידות או הקשר עם ההורים כואבים לו. מדברים על מתבגרים בגיל הזה, לא
      על מי שבחדר. בסיבוב ״גם אני״ הדפים בלי שמות ומסמנים רק וי, כך שאף אחד לא נחשף. על אלכוהול ונהיגה
      ב״דברים של גדולים״ — מסר ברור של חוק ואחריות, בלי לשאול מי ניסה.
  - head: לא לוחצים לשתף
    text: >-
      כותבים בלי שם, ורק מה שרוצים שאחרים יקראו. משתפים רק מתנדבים, ורק על עצמם; מותר לוותר, ולא קוראים בשם
      למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל עצב שלא עובר, פגיעה בבית, או לחץ לשתות — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 19 דקות ומעלה — שתי ההרחבות; 14–18 דקות — רק ״קטן או גדול?״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - gallery
      - grown-ups
    text: >-
      בגלריה מסתובבים שתי דקות בלבד, ואת ״הדברים של גדולים״ ממיינים יחד במליאה, בלי זוגות

brain_break:
  signs: ראשים על השולחן, פיהוקים, שקט שלא נשבר גם אחרי שאלה.
  ideas:
    - name: גדלים לאט
      text: >-
        כולם מתכופפים כמו זרע קטן. בספירה איטית עד עשר ״גדלים״ — נמתחים לאט עד קצות האצבעות, ובעשר הידיים
        למעלה. פעמיים.
    - name: נשימת קופסה
      text: שואפים עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
    - name: מחיאות מראה
      text: >-
        בזוגות, פנים מול פנים. אחד מוחא קצב קצר, והשני חוזר עליו בדיוק. אחרי שלושה קצבים מתחלפים.
  from: big-small

