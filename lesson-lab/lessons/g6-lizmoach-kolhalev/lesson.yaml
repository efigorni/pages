steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: write
    title: איך זה מרגיש לגדול?
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: כתיבה אישית בלי שם, עם בנק רגשות והיבטים — איך זה מרגיש לגדול, ובמה זה מורגש
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: איך זה מרגיש לגדול?
          sub: רגש אחד או יותר — ובמה בחיים זה מורגש. בלי שם.
          timer: 240
          echo: true
          alt: דמות כותבת ליד שולחן, ולב מעליה
          art:
            - {use: kid-desk, x: 150, y: 140, w: 288}
            - {use: heart, x: 450, y: 40, w: 140}
      - moves:
          - הדפים על השולחנות והשקף על המסך עוד לפני שהכיתה נכנסת. מתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. מי שתקוע — הפני אותו לבנק הרגשות שבדף.
          - אחרי ארבע דקות הדפים נשארים הפוכים על השולחן — חוזרים אליהם אחרי הסרטון.
      - say: >-
          כתבו בלי שם — את הדפים יקראו אחר כך גם אחרים, אז כתבו רק מה שאתם רוצים שיקראו.
      - ladder:
          help: בחרו מבנק הרגשות מילה אחת שמתאימה לכם, והשלימו — ״זה מרגיש ___ כש…״
          challenge: כתבו על שני רגשות הפוכים שמרגישים בבת אחת — ובמה בחיים זה קורה.
      - handout:
          title: איך זה מרגיש לגדול?
          copies: דף לכל תלמיד, על השולחן לפני שהכיתה נכנסת — השאלה, שני הבנקים ומקום לכתיבה, בלי שורת שם
          text: |-
            **בנק רגשות** — מפחיד · מרגש · מאכזב · משמח · מעציב · מסקרן · מכעיס · מביך · משמעותי · בלבול · לחץ · כיף · מסעיר · מלחיץ · מערער · מלהיב · מעצבן · מעצים

            **בנק היבטים** — משפחה · חברים · התפתחות גופנית · עצמאות · מודעות לעצמי · ילדות לעומת בגרות
      - say: אף אחד לא חייב להקריא. את הדפים נפגוש שוב בעוד כמה דקות.

  # ------------------------------------------------------------------ 5′–12′
  - id: video
    title: המתבגרים מספרים
    minutes: 7
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      חיזוי — מה מדאיג מתבגרים? צופים במתבגרים מספרים על השינויים, ובזוגות — אילו רגשות ומחשבות זה עורר
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים–שלוש השערות.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה.
          - אחרי הצפייה — דקה בזוגות על שתי השאלות שעל המסך, ואז שלושה–ארבעה זוגות במליאה.
      - video:
          title: המתבגרים — שינויים
          url: https://www.youtube.com/watch?v=rCV0pxlsEPA
          length: "1:37"
          before: מה לדעתכם מדאיג מתבגרים בשינויים שעוברים עליהם?
          watch: שימו לב — מה מדאיג את המתבגרים בסרטון, ומה מרגיע אותם?
          pauses:
            - at: "0:30"
              moment: >-
                מיד אחרי המשפט ״זה יכול להוריד לך מהביטחון מלא״, לפני שהנער בחולצה הכתומה מספר איך צמח 15
                סנטימטרים בקיץ אחד.
              ask: למה לראות שמישהו אחר גבה או התפתח יכול להוריד מהביטחון?
          alt: שתי דמויות בגבהים שונים עומדות זו לצד זו
          art:
            - {use: kid-stand, x: 150, y: 140, w: 190, color: teal}
            - {use: kid-stand, x: 360, y: 300, w: 110, color: orange}
      - whisper: >-
          בסרטון — השוואה לאחרים שמורידה מהביטחון, צמיחה מהירה ״בין לילה ללילה״ ו״קצב מטורף״, ובסוף המשפט
          שאנשים צומחים עד גיל 18–20, ושהגובה בגיל 11–12 הוא לא הגובה הקבוע.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: אילו רגשות התעוררו בכם בצפייה?
          sub: ואילו מחשבות עלו בכם?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי הצפייה —
          alt: שתי דמויות בגבהים שונים, ולידן שתי בועות צ׳אט
          art:
            - {use: kid-stand, x: 60, y: 200, w: 160, color: teal}
            - {use: kid-stand, x: 230, y: 300, w: 110, color: orange}
            - {use: chat, x: 360, y: 60, w: 240}
      - ladder:
          help: בחרו משפט אחד מהסרטון שנשאר לכם בראש. מה הרגשתם כששמעתם אותו?
          challenge: מה מהסרטון מתאים למה שכתבתם בדף בתחילת השיעור — ומה לא?
      - say: >-
          המתבגרים בסרטון אומרים בעצם שכל אחד גדל בקצב שלו. ההתפתחות וההתבגרות מתרחשות בסדר דומה — אבל בקצב שונה
          אצל כל אחד. בואו נראה מה כתבתם אתם.

  # ------------------------------------------------------------------ 12′–20′
  - id: gallery
    title: גם אני!
    minutes: 8
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      סיבוב שקט בין הדפים — וי ליד משפט שמזדהים איתו; במליאה — האם כולנו חווים את זה באותה צורה?
    body:
      - moves:
          - הדפים מתהפכים ונשארים על השולחנות, בלי שמות. כל אחד לוקח עט.
          - >-
            שלוש דקות של סיבוב שקט — קוראים דפים של אחרים, וליד משפט שמזדהים איתו מסמנים וי קטן. הסתובבי גם את.
          - חוזרים למקומות, וכל אחד מסתכל בדף שלו — ליד אילו משפטים יש סימנים?
          - במליאה שאלי, וחכי עשר שניות. הדהדי כל תשובה, והזמיני את הכיתה להגיב לה.
      - slide:
          kicker: סיבוב שקט · 3 דקות
          title: גם אני!
          sub: קראו דפים של אחרים, וסמנו וי ליד משפט שמתאים גם לכם.
          timer: 180
          echo: true
          alt: דף כתוב ועליו סימן וי, ודמות שקוראת אותו
          art:
            - {use: note, x: 110, y: 110, w: 200}
            - {use: check, x: 250, y: 300, w: 140}
            - {use: kid-stand, x: 420, y: 210, w: 150, color: teal}
      - task:
          what: >-
            מסתובבים בשקט בין השולחנות וקוראים את הדפים של אחרים. ליד משפט שמזדהים איתו — מסמנים וי קטן.
          time: 3 דקות
          group: כל הכיתה, כל אחד לבד
          rules: בלי שמות ובלי הערות על הדפים — רק וי. לא מחפשים מי כתב מה
          plenary: חוזרים למקומות ושומעים — עם אילו משפטים הזדהיתם?
          help: חפשו משפט שמתאר רגש שגם אתם מכירים — אפילו אם במילים אחרות.
          challenge: חפשו שני דפים שמתארים את אותו דבר בדרכים הפוכות. מה זה אומר?
      - whisper: >-
          צפויים לעלות פחד לגדול, תהיות, שמחה, התרגשות ובושה — וגם ״פתיל קצר״, תחושה שלא מבינים אותנו, ביקורת על
          ההורים ורצון לעצמאות. תני לכל אלה מקום; ״מפחיד וגם מלהיב״ באותו דף הוא בדיוק העניין.
      - ask: עם אילו משפטים הזדהיתם?
      - ask: האם כולנו חווים את גיל ההתבגרות באותה צורה?
      - say: >-
          בגיל ההתבגרות אנחנו נעים בין רצון להישאר קטנים לבין רצון להיות כבר גדולים — וזה טבעי ונחמד. כך או כך,
          זה הזמן ליהנות משני העולמות: להיות קצת קטנים וקצת גדולים, ולהתבגר בקצב שלכם.

  # ------------------------------------------------------------------ 20′–26′
  - id: grown-ups
    title: מה מתאים לגיל שלנו?
    minutes: 6
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - עניין ורלוונטיות
    summary: ״דברים של גדולים״ — בזוגות ממיינים עשרה דברים לעכשיו, לאחר כך או לתלוי; במליאה — אחריות, חוק ודעה
    body:
      - ask: אילו דברים תוכלו לעשות כבוגרים, שלא ניתן לעשותם בהיותנו ילדים?
      - moves:
          - שאלי, ושמעי שלוש–ארבע הצעות. אחר כך הצביעי על הרשימה שעל הלוח.
          - שתי דקות בזוגות — כל זוג ממיין את הרשימה לשלושה טורים במחברת.
          - >-
            במליאה עברי על שלושה–ארבעה פריטים שהכיתה חלוקה עליהם. משוחחים ומבררים — בלי להטיף ובלי לסתום פיות,
            אבל עם מסר ברור של אחריות, של חוק ושל דעה אישית.
      - slide:
          kicker: בזוגות · 2 דקות
          title: מה מתאים לגיל שלנו?
          sub: עכשיו, אחר כך — או תלוי?
          timer: 120
          echo: true
          alt: גבעול שמתפצל לשלושה חיצים, ודמות מתלבטת לידו
          art:
            - {use: arrows-fork, x: 260, y: 100, w: 300}
            - {use: kid-stand, x: 70, y: 250, w: 130, color: teal}
      - board:
          - למרוח לק
          - להתאפר
          - לנהל חשבון בנק
          - לפתוח דף ברשת חברתית
          - ללמוד נהיגה
          - להצביע בבחירות
          - לעבוד
          - לנהוג
          - לבחור אם ללכת או לא ללכת לבית הספר
          - לשתות אלכוהול
      - task:
          what: >-
            כל זוג ממיין את הרשימה שעל הלוח לשלושה טורים — מתאים לגיל שלנו עכשיו, מתאים רק אחר כך, או תלוי.
          time: 2 דקות
          group: זוגות
          rules: כותבים במחברת שלושה טורים; ״תלוי״ — רק עם הסבר במה זה תלוי
          plenary: שומעים זוגות על פריטים שהכיתה חלוקה עליהם
          help: התחילו מהקל — מה ברור לכם שמתאים עכשיו, ומה ברור שלא?
          challenge: בחרו פריט אחד מ״תלוי״, וכתבו במה בדיוק זה תלוי.
      - ask: מה מבין כל הרשימה יכול להתאים לגיל שלכם, לדעתכם, ומה לא?
      - say: עם ההתבגרות מגיעה גם אחריות — ולכל דבר יש את הזמן שלו.

  # ------------------------------------------------------------------ +5′
  - id: big-small
    title: קטן או גדול?
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: מה עדיף — להיות קטן או גדול? מה קוסם בלהיות מתבגרים, ומה קשה
    body:
      - slide:
          kicker: אם נשאר זמן · חושבים · בזוגות · משתפים
          title: מה עדיף — להיות קטן או גדול?
