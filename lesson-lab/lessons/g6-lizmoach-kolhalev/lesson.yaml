  # ------------------------------------------------------------------ 36′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: חמשת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              השינויים הגופניים שמתחוללים במשך גיל ההתבגרות עשויים להיחוות כחוויה מטלטלת עבור חלק מהילדים, בפרט
              אם השינויים מקדימים להתרחש.
            - >-
              שינויים אלו, מעוררים במתבגרים תחושות אמביוולנטיות כלפי ההתבגרות, ועמדות שונות שלעיתים עומדות בסתירה
              האחת מול השנייה, למשל פחד ושמחה, התפעלות ותחושת סלידה, גאווה ובושה, סקרנות וגועל, ציפייה ואדישות ועוד.
            - >-
              מה הרגיע את הדוברים? הידיעה שהשינויים מתרחשים אצל כולם, ההבנה שכל אחד צומח בקצב אישי, ההבנה שזו
              תקופה שתעבור, היכולת לדבר על הדברים.
            - >-
              לפעמים מתוך סקרנות טבעית, יש ילדים שרוצים להתנסות בהתנהגויות שאינן תואמות את גילם, הדבר עשוי לגרום
              לנזק בהווה ולפעמים בעתיד. רצוי לחכות בסבלנות ולא להקדים את המאוחר.
            - >-
              מי שגובה לפני כולם או שמנצנצים בגופו סימני ההתבגרות לפני שאר חבריו – יבין שבקרוב כולם יגדלו, יתפתחו.
              ולהיפך, מי שגופו עדיין ילדי וטרם גבה או התפתח יבין שברגע הנכון גם גופו יתפתח וישתנה.
          ask: >-
            איזה משפט הייתם רוצים לשמוע ביום שבו נדמה לכם שאתם גדלים מהר מדי, או לאט מדי? חשבו רגע, ואז הצביעו
            כשאקרא את המספר שלו.
          tip: >-
            ״אמביוולנטיות״ במסר השני — רגשות מעורבים, שמושכים לכיוונים הפוכים. המסרים הולכים מהטלטלה (1–2), דרך מה
            שמרגיע (3), אל הסבלנות והקצב האישי (4–5).
          alt: לב גדול, ונבט בעציץ לידו
          art:
            - {use: heart, x: 300, y: 90, w: 260}
            - {use: sprout, x: 70, y: 270, w: 190}

