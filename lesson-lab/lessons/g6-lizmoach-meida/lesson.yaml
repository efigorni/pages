    body:
      - slide:
          kicker: אם נשאר זמן · מסתובבים
          title: מה התחדש לכם?
          sub: קראו את הכללים של קבוצות אחרות, והעתיקו כלל אחד שלא חשבתם עליו.
          timer: 180
          echo: true
          alt: שלושה דפים תלויים על הקיר, ודמות קוראת אותם
          art:
            - {use: note, x: 60, y: 60, w: 120}
            - {use: note, x: 250, y: 60, w: 120}
            - {use: note, x: 440, y: 60, w: 120}
            - {use: kid-stand, x: 240, y: 236, w: 140, color: purple}
      - moves:
          - הדפים תלויים; הקבוצות מסתובבות בשקט שלוש דקות.
          - כל אחד מעתיק למחברת כלל אחד של קבוצה אחרת.
          - שמעי שניים־שלושה — איזה כלל העתקתם, ולמה.
      - say: קראו בשקט, ומצאו כלל אחד שלא חשבתם עליו.
      - ladder:
          help: חפשו כלל שעוסק במי שכתב את המידע.
          challenge: איזה כלל הייתם מוסיפים לדף של הקבוצה שלכם — ולמה?
      - ask: איזה כלל העתקתם — ולמה דווקא אותו?

