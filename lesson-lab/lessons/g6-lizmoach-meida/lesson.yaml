# מקורות מידע מהימנים ולא מהימנים — כיתה ו׳, "לצמוח ולגדול", שיעור 3 (מקור: sources/text/6/Lizmoach_Meida.md)
# ענן המילים המקוון (AnswerGarden) הוחלף בגרסה בלי מסך — כמו שהמקור עצמו מציע (D46). "מסרים לדיון הכיתתי"
# (שקף 13) הוא שקף המסרים המפורש: המשפטים שפונים לתלמידים — מילה במילה; ההנחיה המותנית על סרטי פורנו — למורה.
