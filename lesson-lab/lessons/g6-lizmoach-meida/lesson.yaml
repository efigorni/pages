steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: איפה מחפשים?
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית — באילו מקורות מחפשים מידע על גיל ההתבגרות; רשימה על הלוח, ווי לכל מקור שחוזר
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: איפה אפשר למצוא מידע על גיל ההתבגרות?
          sub: כתבו שלושה מקורות שאתם מכירים.
          timer: 120
          echo: true
          alt: זכוכית מגדלת, ספר ומחשב נייד
          art:
            - {use: magnifier, x: 300, y: 140, w: 260}
            - {use: book, x: 60, y: 110, w: 180}
            - {use: laptop, x: 60, y: 320, w: 200}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. כותבים במחברת, בלי הסבר נוסף.
          - אחרי שתי דקות — כל אחד אומר מקור אחד מהרשימה שלו. רשמי על הלוח; מקור שחוזר — סמני לידו וי.
          - בסוף — ספרי את הווים, והקיפי את שלושת המקורות השכיחים.
      - say: שתי דקות, לבד ובשקט — כתבו כמה מקורות שאתם מכירים. כל מקור נרשם, ואין תשובה לא נכונה.
      - ladder:
          help: חשבו על מישהו בבית, על משהו בטלפון ועל משהו בבית הספר.
          challenge: איזה מהמקורות שכתבתם הכי מהימן בעיניכם — ולמה?
      - whisper: >-
          בשלב הזה לא שוללים ולא שופטים אף מקור — כך במקור. מה שעולה בדרך כלל: הורים, אחים גדולים, חברים, ספרים,
          רשת, סרטים, בני דודים, שיחות של מבוגרים, בית הספר. על ספרים, סרטים ואתרים — שאלי בעדינות לאילו התכוונו.
          עולים סרטים או תכנים שלא מתאימים לגיל? בלי בהלה ובלי חסימה: רושמים, ובודקים אחר כך עם היועצת.
      - say: יש לנו הרבה מקורות. אבל על איזה מהם אפשר לסמוך?

  # ------------------------------------------------------------------ 5′–13′
  - id: sort
    title: מהימן, מוטל בספק או לא מהימן?
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: בזוגות ממיינים חמישה־עשר מקורות לשלוש קבוצות; במליאה — רק המקורות שעליהם חלקו
    body:
      - slide:
          kicker: בזוגות · 4 דקות
          title: מהימן, מוטל בספק — או לא מהימן?
          sub: מיינו את המקורות לשלוש קבוצות. לא בטוחים? סימן שאלה.
          timer: 240
          echo: true
          alt: חמישה־עשר מקורות מידע — ויקיפדיה, חברים, ספרים, שמועות, אינסטגרם ועוד
          art: {file: art/sources.svg}
      - moves:
          - >-
            הסבירי במשפט: יש מקורות מהימנים — שאפשר לסמוך עליהם, ויש שלא. הציגי את המקורות, והראי את שלושת הטורים
            שעל הלוח.
          - ארבע דקות בזוגות. הסתובבי, ושימי לב באילו מקורות הזוגות מתלבטים.
          - >-
            במליאה — עברי רק על שלושה־ארבעה מקורות שהזוגות לא הסכימו עליהם. רשמי כל אחד בטור שהכיתה מסכימה עליו, או
            עם סימן שאלה.
      - say: בזוגות — מיינו את המקורות לשלוש קבוצות. על מקור שאתם לא בטוחים בו, שימו סימן שאלה.
      - task:
          what: >-
            כל זוג מעתיק למחברת שלושה טורים — ״מהימנים״, ״מוטלים בספק״, ״לא מהימנים״ — וממיין לתוכם את המקורות שעל
            המסך.
          time: 4 דקות
          group: זוגות
          rules: מותר לחלוק; מקור שלא בטוחים בו — עם סימן שאלה; זוג שמסיים מוסיף מקור מהרשימה של הכיתה
          plenary: על כל מקור שעליו חלקו, שני זוגות מסבירים את הבחירה שלהם
          help: שאלו על כל מקור — מי כתב את זה, והאם הוא מבין בנושא?
          challenge: מצאו מקור שיכול להיות גם מהימן וגם לא — במה זה תלוי?
      - ask: על איזה מקור היה הכי קשה להחליט — ולמה?
      - say: ולמה בכלל זה משנה, על איזה מקור סומכים? בואו נדבר על זה.

  # ------------------------------------------------------------------ 13′–19′
  - id: discuss
    title: למה זה חשוב?
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: דיון — למה מסוכן להסתמך על מקורות לא מהימנים, ולמה בכל זאת חשוב ללמוד גם לבד
    body:
      - slide:
          kicker: שאלות לדיון כיתתי
          title: מדוע מסוכן להסתמך על מקורות מידע לא מהימנים?
          verbatim:
            - title
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו איקס
          art:
            - {use: thought, x: 250, y: 30, w: 300}
            - {use: cross, x: 336, y: 70, w: 120}
            - {use: kid-stand, x: 90, y: 230, w: 130, color: teal}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב לה — מי מסכים? מי חושב אחרת?
          - >-
            עברי לשאלה השנייה. בסוף — שאלי ״חשוב לכם לקבל מידע על גיל ההתבגרות — לאילו מקורות כדאי לפנות?״
      - ask: מדוע מסוכן להסתמך על מקורות מידע לא מהימנים?
      - slide:
          kicker: שאלות לדיון כיתתי
          title: ולמה בכל זאת חשוב ללמוד גם לבד?
          sub: על גיל ההתבגרות, ועל כל מה שקשור למיניות.
          echo: true
          cue: אחרי כמה תשובות —
          alt: דמות כותבת ליד שולחן, וספר פתוח לידה
          art:
            - {use: kid-desk, x: 300, y: 150, w: 260, color: teal}
            - {use: book, x: 60, y: 120, w: 180}
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי רוצה להוסיף?
      - whisper: >-
          אם עולים סרטי פורנו כמקור מידע: תני לגיטימציה לסקרנות הטבעית לדעת וללמוד, והסבירי בבירור — אלה סרטים
          למבוגרים, הם לא מומלצים, ובטח לא כמקור מידע. הם תעשייה כלכלית שמציירת תמונה שקרית של יחסים ושל מיניות —
          ניצול, חפצון, אי־שוויון, איום וכפייה — לא כך נראים יחסים, ולא כך נראים איברי האדם; וצפייה בהם עלולה להזיק
          מבחינה רגשית ומינית. בלי בהלה, ועם היועצת אחר כך (כך במקור).
      - say: אז איך יודעים אם מידע מהימן? בואו ננסח כללי אצבע.

  # ------------------------------------------------------------------ 19′–26′
  - id: rules
    title: כללי אצבע
    minutes: 7
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: בקבוצות — שלוש שאלות או ״כללי אצבע״ שיעזרו לדעת אם מידע אמין; כל קבוצה מקריאה כלל אחד
    body:
      - slide:
          kicker: בקבוצות · 4 דקות
          title: איך יודעים אם מידע אמין?
          sub: נסחו שלוש שאלות או ״כללי אצבע״ — וכתבו אותם על דף.
          timer: 240
          echo: true
          alt: אגודל למעלה, ודף לידו
          art:
            - {use: thumb-up, x: 320, y: 130, w: 220}
            - {use: note, x: 80, y: 190, w: 170}
      - moves:
          - חלקי לקבוצות לפי השולחנות, ודף לכל קבוצה.
          - ארבע דקות לנסח שלושה כללים. הסתובבי; לקבוצה שנתקעה — תני את הדוגמה הראשונה מהרשימה שלמטה.
          - במליאה — כל קבוצה מקריאה כלל אחד. השלימי מהדוגמאות של המקור רק מה שלא עלה, ותלי את הדפים על הקיר.
      - say: נסחו שלוש שאלות שאפשר לשאול על כל מידע — ברשת, בספר, או כשחבר מספר.
      - task:
          what: >-
            כל קבוצה מנסחת שלוש שאלות או ״כללי אצבע״ שיעזרו לדעת אם מידע שנתקלים בו אמין, וכותבת אותם על דף.
          time: 4 דקות
          group: קבוצות של 4–5 לפי השולחנות
          rules: כלל אחד בשורה, במילים שכל אחד בכיתה יבין; קבוצה שמסיימת — מקשטת את הדף
          plenary: כל קבוצה מקריאה את הכלל שהכי חשוב לה; הדפים נתלים על הקיר
          help: חשבו על מידע שהתברר כלא נכון — מה היה יכול להזהיר אתכם?
          challenge: נסחו כלל שעוזר גם כשחבר מספר לכם משהו, ולא רק ברשת.
      - quote:
          title: דוגמאות לשאלות ולכללי אצבע מהמקור — להשלים מה שלא עלה
          text: |-
            האם המידע חוזר על עצמו באתרים אחרים? האם ניתן לאמת את המידע?
            סיומות כמו gov.il , org.il , ac.il (אתר ממשלתי, ארגון או מקור אקדמי) מסייעות לנו להעלות את רמת האמינות של המידע הכתוב שם.
            האם הכותב הוא אנונימי או שפרטיו ידועים וניתן לבדוק מה הידע שלו וההכשרה שלו?
            האם המידע נשמע לנו מוזר מדי, מופרך, לא סביר?
      - ask: איזה כלל הכי יעזור לכם בפעם הבאה שתחפשו מידע — ולמה?

  # ------------------------------------------------------------------ +5′
  - id: gallery
    title: מה התחדש לכם?
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - שיתופיות בלמידה
