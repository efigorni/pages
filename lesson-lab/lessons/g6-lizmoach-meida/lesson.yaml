sub: >-
  על גיל ההתבגרות יש מידע בכל מקום — אבל לא על כל מקור אפשר לסמוך. בשיעור הזה אוספים את המקורות שלנו,
  ממיינים אותם, ומנסחים כללי אצבע לבדיקה.
format: לבד, זוגות, קבוצות ומליאה
question: על איזה מידע על גיל ההתבגרות אפשר לסמוך — ואיך בודקים?
takeaways:
  - יש מקורות מידע מהימנים, ויש כאלה שעלולים להטעות — גם כשהם נשמעים בטוחים בעצמם.
  - כדאי לשאול על כל מידע — מי כתב אותו, האם אפשר לאמת אותו, והאם הוא נשמע סביר.
  - על גיל ההתבגרות אפשר תמיד לשאול מבוגר שסומכים עליו — הורה, מורה או יועצת.
prep:
  - >-
    שלושה טורים על הלוח לפני השיעור — ״מהימנים״, ״מוטלים בספק״, ״לא מהימנים״ — ומקום פנוי לידם לרשימת המקורות
    של הכיתה
  - דף ריק לכל קבוצה, לכללי האצבע, וטושים

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מקורות מידע על גיל ההתבגרות ומיניות. המקור מזהיר שבכיתות מסוימות יעלו סרטים או
      תכנים שאינם מתאימים לגיל, ושזו ״נורה אדומה״ לגבי מה שהילדים חשופים אליו. סכמי איתה מראש מה עושים אם זה
      עולה, ואם יש בכיתה מי שידוע שנחשף לתכנים כאלה. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שכבר ראה פורנו או תכנים מיניים — לפעמים בלי שרצה; מי שבבית לא מדברים על הנושא; ומי שהמקור העיקרי שלו הוא
      חברים או אחים גדולים. מדברים על המקורות, לא על מי שמשתמש בהם, ולא מבהילים — כדי שאף אחד לא יתבייש במה שכתב.
  - head: לא לוחצים לשתף
    text: >-
      בפתיחה כל מקור נרשם בלי שיפוט — כך במקור. אף אחד לא מספר במה צפה או מה קרא. מותר לוותר, ולא קוראים בשם למי
      שלא הצביע. שורת השאלה בסופשי — בלי שם, אלא אם רוצים תשובה אישית.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים
      לשמור בסוד. ילד שמספר שמישהו שולח לו תכנים מיניים, או שחושף אותו אליהם — זו פגיעה: מטפלים בזה עוד היום.

