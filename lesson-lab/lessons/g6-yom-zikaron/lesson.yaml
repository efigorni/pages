            - {use: note, x: 200, y: 130, w: 220}
            - {use: pencil, x: 380, y: 60, w: 170}
      - ask: אילו רגשות מעוררים בכם הצבעים השונים שבשיר?
      - quote:
          title: מהמקור — לסיכום השיחה
          text: >-
            הכתיבה מאפשרת לבטא רגשות, במיוחד במצבים מורכבים שמעוררים רגשות שונים. השימוש בצבעים השונים מסייע לטלי
            לבטא את הרגשות שלה.
      - say: >-
          וזה הקשר לקופסת הצבעים מתחילת השיעור: טלי בחרה צבעים כדי לומר מה היא מרגישה. ועכשיו — תורכם להוסיף
          צבע.

  # ------------------------------------------------------------------ 22′–27′
  - id: addcolor
