    body:
      - slide:
          kicker: להוסיף צבע · כולם כותבים
          title: איזה צבע הייתם מוסיפים לשיר — ולמה?
          sub: כתבו שורה משלכם — צבע, ומה הוא מבטא.
          timer: 120
          echo: true
          alt: קופסת צבעים, ועיפרון סגול חדש לידה
          art: {file: art/add-color.svg}
      - moves:
          - הציגי את השאלה. שתי דקות של כתיבה בשקט — כל אחד בוחר צבע ומוסיף לשיר שורה משלו.
          - הסתובבי בין השולחנות. למי שנתקע — הציעי לבחור צבע אחד, ושאלי מה הוא מזכיר לו.
          - הזמיני ארבעה–חמישה מתנדבים להקריא את השורה שלהם, בלי הסבר ובלי תגובה — כמו שיר אחד של הכיתה.
      - say: שתי דקות, לבד ובשקט. אין שורה נכונה — רק צבע שלכם.
      - ladder:
          help: השלימו — ״היה לי ___ של ___״ — צבע, ומה הוא מסמל בשבילכם.
          challenge: כתבו גם שורה על צבע שלא הייתם רוצים בקופסה — ולמה.
      - ask: מי רוצה להקריא את השורה שלו?

  # ------------------------------------------------------------------ +7′
  - id: page
    title: שני ימים על דף אחד
    kind: extension
    minutes: 7
    practices:
      - כולם כותבים
    spotlights:
      - דיפרנציאליות וגיוון
      - הערכה ורפלקטיביות
    summary: מחלקים דף לשניים — יום הזיכרון ויום העצמאות — ומציירים או כותבים את הרגשות של כל יום
    body:
      - slide:
          kicker: אם נשאר זמן · לסיום
          title: יום הזיכרון ויום העצמאות על דף אחד
          sub: חלקו את הדף לשניים, וציירו או כתבו את הרגשות של כל יום.
          timer: 300
          echo: true
          alt: דף מחולק לשניים — נר זיכרון בצד אחד, דגל ישראל בצד השני
          art: {file: art/split-page.svg}
      - moves:
          - חלקי לכל אחד דף, והניחי צבעים על השולחנות.
          - כל אחד מחלק את הדף לשניים, ומצייר בצבעים, כותב מילים ומשפטים — או גם וגם.
          - בשתי הדקות האחרונות — מי שרוצה מראה את הדף לשכן, או לכיתה.
      - task:
          what: >-
            מחלקים את הדף לשניים — יום הזיכרון ויום העצמאות — ובכל חצי מציירים בצבעים, או כותבים מילים ומשפטים,
            שמבטאים את הרגשות של אותו יום.
          time: 5 דקות, ושתי דקות לשיתוף
          group: לבד
          rules: בוחרים לצייר, לכתוב או גם וגם; הדף נשאר אצלכם
          plenary: מי שרוצה מראה לשכן או לכיתה
          help: התחילו בצבע אחד לכל יום — איזה צבע מתאים לו?
          challenge: מה מחבר בין שני חצאי הדף? הוסיפו משהו שעובר מצד לצד.
      - say: הדף הזה שלכם. מותר לצייר, לכתוב או גם וגם — ואף אחד לא חייב להראות.
      - ask: מי רוצה להראות את הדף שלו — ומה בחר לשים בכל צד?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלוש התובנות משקף הסיכום של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - יום הזיכרון ולאחריו יום העצמאות הינם מועדים המעלים רגשות שונים.
            - ברגעי עצב או קושי ישנן דרכים שונות שמסייעות לנו להתמודד.
            - ציור וכתיבה מסייעים לנו לבטא את הרגשות שלנו.
          ask: איזה משפט מהשלושה תרצו לזכור ביום הזיכרון? חשבו רגע — ומי שרוצה, יצביע כשאקרא את המספר שלו.
          tip: >-
            הראשון נותן מקום לכל הרגשות; השני מזכיר שיש דרכים להתמודד; השלישי מחזיר אל הכתיבה ואל הציור — כמו
            הצבעים של טלי.
          alt: קופסת צבעים ובה שלושה עפרונות צבעוניים
          art: {file: art/color-box.svg}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — צבע ומילה
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
    summary: צבע ומילה לכל אחד משני הימים, ואדם אחד לשתף; פתקים נאספים בדלת
    body:
      - say: >-
          שלוש שאלות קצרות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: לפני שיוצאים
          prompts:
            - צבע ומילה ליום הזיכרון.
            - צבע ומילה ליום העצמאות.
            - אדם אחד שאוכל לשתף ברגשות שעולים בי בימים האלה.
          look_for: >-
            חפשי פתק בלי אדם לשתף, ופתק שמספר על אבדן, על חרדה או על הצפה. עם אלה מדברים בשקט עוד השבוע, ומה
            שמדאיג עובר ליועצת עוד היום.
          timer: 180
          alt: דמות כותבת ליד שולחן, ופתק כתום לידה
          art:
            - {use: kid-desk, x: 290, y: 130, w: 288}
            - {use: sticky, x: 70, y: 290, w: 150}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
