sub: >-
  יום הזיכרון ויום העצמאות צמודים זה לזה, ומעוררים בנו רגשות שונים. בשיעור הזה מדברים על מה שעולה בנו ועל
  מה שעוזר בזמן עצב, ומכירים שיר שכתבה טלי שורק כשהייתה בת 13.
format: מליאה, זוגות וכתיבה אישית
question: אילו רגשות מעוררים בנו יום הזיכרון ויום העצמאות — ואיך אפשר לבטא אותם?
takeaways:
  - >-
    ביום הזיכרון זוכרים את הנופלים ואת כאב המשפחות, ולמחרתו חוגגים את העצמאות — ומותר להרגיש גם עצב וגם
    שמחה.
  - יש דרכים שונות להתמודד עם עצב, ואנחנו לא לבד — אפשר לשתף מישהו קרוב.
  - כתיבה וציור — כמו הצבעים בשיר של טלי שורק — עוזרים לנו לבטא את מה שאנחנו מרגישים.
prep:
  - >-
    מילות השיר ״קופסת צבעים״ — פתוחות להקרנה במחשב הכיתה, ועותק מודפס אצלך למקרה שאין רשת. הן באתר שירונט,
    ״קופסת הצבעים״ בביצוע עופרה חזה (הקישור גם בשקף 13 של המצגת המקורית). קראי את השיר בקול לפני השיעור,
    וסמני לעצמך את הצבעים שבו.
  - דף לכל תלמיד וצבעים על השולחנות — להרחבה ״שני ימים על דף אחד״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה, ובקשי שתהיה זמינה אחריו. מפי איתה את מעגלי הפגיעות בכיתה: מי ממשפחה שכולה,
      מי שאיבד אדם קרוב במערכות ישראל או בפעולות איבה, ומי שאיבד את יקירו בדרך אחרת — האבל הציבורי מעורר לא
      פעם את האבל הפרטי. עם תלמידים כאלה שוחחי לפני השיעור: אם וכיצד ירצו לשתף, ומה יעזור להם. ייתכן שייעדרו
      סביב יום הזיכרון — שימי לב שלא יישארו לבד.
  - head: מי עלול להיפגע
    text: >-
      מעבר למשפחות השכולות — מי שבן משפחה שלו משרת עכשיו, ומי שימים כאלה מעוררים אצלו חרדה. בשיר יש גם צבעים
      של כאב ושל מוות: הקריאי אותו לאט, בקול רגוע, בלי לעצור על השורות האלה. בשיחה על הרגשות מדברים על הימים,
      לא על אבדן אישי, והשיח נשען על ביטחון, על תקווה ועל ערבות הדדית.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. מותר לוותר על כל שאלה, ולא קוראים בשם
      למי שלא הצביע. את השורה שכל אחד מוסיף לשיר מקריאים רק מתנדבים. מי שצריך לצאת לרגע — יוצא, ועדכני את
      היועצת.
  - head: אם מישהו מוצף או משתף אבדן
    text: >-
      עוצרים בעדינות, מודים, ומשאירים לו מקום — בלי לחקור מול הכיתה. אחרי השיעור — שיחה אישית, והתייעצות עם היועצת
      עוד באותו יום, ובמידת הצורך גם עם הפסיכולוג של בית הספר. לא מבטיחים לשמור בסוד. לצד היועצת: ער״ן 1201 — עזרה
      ראשונה נפשית, 24/7, גם בלי לומר שם.

time:
