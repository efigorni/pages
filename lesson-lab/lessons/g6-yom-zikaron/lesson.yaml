    body:
      - quote:
          title: על השיר — מהמקור, לספר לכיתה
          text: >-
            השיר ״קופסת צבעים״ לקוח מתוך הספר ״השלום שלי״ בעריכת אוריאל אופק (1974). הספר מציג ציורים ושירים של ילדי
            ישראל בנושא השלום. השיר נכתב על ידי טלי שורק מבאר שבע, שהייתה בת 13 בעת כתיבת השיר. המלחין קובי אושרת
            הלחין את השיר והוא בוצע על ידי הזמרת עופרה חזה בטקס קבלת פרס נובל לשלום בשנת 1994.
      - slide:
          kicker: לפני שמקשיבים
          title: אילו צבעים מוזכרים בשיר?
          sub: ״קופסת צבעים״ — כתבה טלי שורק, כשהייתה בת 13.
          echo: true
          alt: קופסת צבעים ובה שלושה עפרונות צבעוניים
          art: {file: art/color-box.svg}
      - moves:
          - ספרי בקצרה על השיר, והציגי את השאלה. כל אחד רושם במחברת את הצבעים שהוא שומע.
          - הקריאי את השיר לאט, בקול רגוע. אחר כך הקריני את המילים, והקריאי אותו פעם שנייה.
          - >-
            שאלי אילו צבעים שמעו, ורשמי אותם על הלוח בשני טורים — הצבעים שהיו לטלי, והצבעים שלא היו לה. חברי
            אליהם את המילים מתחילת השיעור.
          - שאלי מה התפקיד של כל צבע, ומה ביטאה טלי בשיר. הדהדי, והזמיני את הכיתה להגיב זה לזה.
      - say: הקשיבו לשיר, ורשמו במחברת כל צבע שאתם שומעים.
      - ladder:
          help: בחרו צבע אחד מהשיר — איזה רגש הוא מבטא?
          challenge: למה לדעתכם טלי כתבה דווקא על צבעים — ולא ישר על רגשות?
      - slide:
          kicker: קופסת צבעים
          title: מה ביטאה טלי באמצעות השיר?
          sub: ומה התפקיד של כל צבע בשיר?
