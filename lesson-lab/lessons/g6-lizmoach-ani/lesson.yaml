sub: >-
  יש בנו הרבה יותר ממה שרואים מבחוץ. בשיעור הזה מעצבים דמות שמייצגת אותנו, כותבים פרופיל אישי, ומנחשים בחידון
  ״מי הכותב?״.
format: לבד, שולחנות ומליאה
question: מה מאפיין אותי — מעבר למה שרואים מבחוץ?
takeaways:
  - לכל אחד מאיתנו יש תכונות, חלומות וכוחות שלא רואים מבחוץ.
  - להכיר את עצמנו טוב יותר עוזר לנו גם בגיל ההתבגרות — ולהכיר את החברים עוזר לכולנו.
  - אפשר להציג את עצמנו כמו שאנחנו — בכבוד ובפרגון, לעצמנו ולאחרים.
prep:
  - דף ריק לכל תלמיד, לציור הדמות
  - חלוקה לקבוצות לפי השולחנות, 4–5 בכל שולחן, לחידון ״מי הכותב?״

