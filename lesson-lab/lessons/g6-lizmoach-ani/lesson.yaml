            הלאה.
          - כמה דפים שהזמן מאפשר. הדפים שלא הוקראו חוזרים לכותבים.
      - say: הקשיבו עד הסוף — מנחשים רק אחרי שלושה פריטים, ורק עם רשות דיבור.
      - ask: מה עזר לכם לזהות את הכותב?

