      - task:
          what: >-
            כל אחד כותב פרופיל אישי בדף ״מי אני?״ — לפחות שישה פריטים, רק על עצמו. את השם כותבים בגב הדף.
          time: 7 דקות
          group: לבד
          rules: כותבים בשקט ובלי שם; רק דברים שנעים לכם שהשולחן ישמע; מי שמסיים — בוחר עוד פריט
