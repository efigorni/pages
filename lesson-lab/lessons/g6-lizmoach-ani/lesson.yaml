steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: avatar
    title: בחרי מסלול — דמות או פרופיל
    minutes: 5
    summary: פתיחה — מה מאפיין אותי, בציור או בשיחה
    body:
      - tracks:
          - title: דמות שמייצגת אותי
            text: >-
              כל אחד מצייר על דף דמות שמייצגת אותו וכותב לידה שלושה מאפיינים; בשולחן מספרים באילו היבטים היא
              מאפיינת אותו.
            when: >-
              רוצים פתיחה יצירתית ושקטה שכל אחד עושה לבד. במקור זו דמות (אווטאר) באפליקציה — כאן היא על דף, בלי
              טלפונים ובלי להוריד אפליקציה.
            practices:
              - מה הקשר?
              - כולם כותבים
            spotlights:
              - עניין ורלוונטיות
              - אחריות ובחירה
            body:
              - slide:
                  kicker: מה הקשר? · לבד, על דף
                  title: דמות שמייצגת אתכם
                  sub: אילו מאפיינים שלכם הייתם בוחרים עבורה?
                  verbatim:
                    - sub
                  timer: 120
                  echo: true
                  alt: דמות גדולה, ולידה עיפרון וכוכב
                  art:
                    - {use: kid-stand, x: 330, y: 150, w: 170, color: teal}
                    - {use: pencil, x: 80, y: 300, w: 170}
                    - {use: star, x: 110, y: 80, w: 130}
              - moves:
                  - >-
                    השקף על המסך כשהכיתה נכנסת. כל אחד מצייר על דף דמות פשוטה שמייצגת אותו, וכותב לידה שלושה מאפיינים.
                    מי שלא אוהב לצייר — כותב רק מילים.
                  - אחרי שתי דקות — בכל שולחן, כל אחד מראה את הדמות ומספר במשפט באילו היבטים היא מאפיינת אותו.
                  - שמעי שניים־שלושה במליאה, ושאלי מה בדמות נוח להם, ומה פחות.
              - say: >-
                  שתי דקות: ציירו דמות פשוטה שמייצגת אתכם, וכתבו לידה שלושה מאפיינים. לא צריך לדעת לצייר.
              - ladder:
                  help: התחילו ממשהו שאתם אוהבים לעשות — מה הדמות מחזיקה ביד?
                  challenge: איזה מאפיין שלכם לא רואים מבחוץ — ואיך תראו אותו בדמות?
              - ask: באילו היבטים הדמות שיצרתם מאפיינת אתכם — ומה פחות?
          - title: הפרופיל האישי שלי
            text: >-
              שיחה במליאה — מה זה פרופיל אישי, מה יכול להופיע בו, ומה יכול להיות משמח או מורכב בכתיבה שלו.
            when: הכיתה אוהבת לדבר, או שאין זמן לציור — השיחה מכינה ישר לכתיבת הפרופיל.
            practices:
              - זמן חשיבה
              - מהלכי שיח
            spotlights:
              - עניין ורלוונטיות
              - הערכה ורפלקטיביות
            body:
              - slide:
                  kicker: שיחה · הפרופיל האישי
                  title: מה זה ״פרופיל אישי״?
                  sub: מה יכול להופיע בו — ומה יכול להיות משמח או מורכב בכתיבה שלו?
                  echo: true
                  alt: דף, ודמות עומדת לידו
                  art:
                    - {use: note, x: 320, y: 100, w: 240}
                    - {use: kid-stand, x: 110, y: 200, w: 140, color: teal}
              - moves:
                  - שאלי מה זה פרופיל אישי, וחכי עשר שניות לפני שאת מזמינה תשובות.
                  - >-
                    רשמי על הלוח את ההיבטים שעולים — שם, תחביבים, תכונות, מקום במשפחה — ושאלי אילו עוד היבטים מגדירים
                    אותנו.
                  - עברי לשאלה מה משמח ומה מורכב בכתיבת פרופיל, והזמיני את הכיתה להגיב — מי מסכים? מי חושב אחרת?
              - ask: מה יכול להיות משמח בכתיבת הפרופיל האישי שלי — ומה עלול להיות מורכב?
              - say: אז מה שאמרת זה ___ — הבנתי נכון? מי רוצה להוסיף?
      - say: בדמות ובפרופיל רואים חלק מאיתנו. עכשיו נחשוב על מה שלא רואים מבחוץ.

