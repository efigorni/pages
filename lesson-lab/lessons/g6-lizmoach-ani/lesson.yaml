# נעים להכיר, אני! — כיתה ו׳, "לצמוח ולגדול", שיעור 4 (מקור: sources/text/6/Lizmoach_Ani.md)
# במקור — אולי שיעור כפול, כדי שכל תלמיד יופיע בחידון (D37): כאן כל אחד מופיע בחידון של השולחן שלו, בליבה,
# והחידון הכיתתי הוא הרחבה. האווטאר באפליקציה הוחלף בדמות על דף (D46). אין במקור שקף מסרים (D50–D51).
