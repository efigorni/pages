steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: bottle
    title: בקבוק האכפתיות
    minutes: 5
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      הבקבוק עובר מיד ליד; מי שמחזיק אותו כשהמורה מוחאת כף שולף פתק ועונה — ומה אפשר ללמוד מהמשחק?
    body:
      - slide:
          kicker: מה הקשר? · משחק
          title: בקבוק האכפתיות
          sub: הבקבוק עובר מיד ליד. כשהוא נעצר אצלכם — שולפים פתק ועונים.
          echo: true
          alt: בקבוק ובו פתקים מגולגלים, ופתק אחד שנשלף
          art: {file: art/care-bottle.svg}
      - moves:
          - הראי את הבקבוק ואת הפתקים שבתוכו, והסבירי את הכלל לפני שמתחילים.
          - >-
            הבקבוק עובר מיד ליד. אחרי כמה שניות מחאי כף — מי שמחזיק אותו שולף פתק, מקריא ועונה. מותר להעביר את
            הפתק לחבר שמתנדב.
          - ארבעה–חמישה סבבים. אחרי כל תשובה — הדהדי בקצרה, ושאלי מי עוד רוצה להוסיף.
          - סיימי בשאלה למה חשוב לנו להרגיש שאכפת מאיתנו.
      - say: >-
          בבקבוק יש פתקים על אכפתיות. מי שהבקבוק אצלו כשאני מוחאת כף — שולף פתק ועונה. מותר להעביר את הפתק לחבר
          שרוצה לענות.
      - handout:
          title: בקבוק האכפתיות — הפתקים
          copies: עותק אחד, גזור לשישה פתקים ומגולגל לתוך הבקבוק
          verbatim: true
          lines: false
          items:
            - באלו דרכים אני מבטא/ת אכפתיות כלפי מישהו אחר?
            - כשלמישהו אכפת ממני, אני מרגיש/ה ש..
            - אני מרגיש/ה שלאנשים אחרים אכפת ממני כאשר...
            - >-
              איך נראה אחד לשני שאכפת לנו זה מזה ביום יום של הכיתה? באלו מצבים? (בהקשר ללימודים, בהקשר למפגשים
              חברתיים)
            - משהו שמישהו עשה למעני וריגש אותי
            - מה זו אכפתיות בעיניי? מה היא מאפשרת?
      - ask: מדוע חשוב לנו להרגיש שלאחרים אכפת מאיתנו — ואיך זה קשור למפגשים של הכיתה?

  # ------------------------------------------------------------------ 5′–14′
  - id: charter
    title: אמנה למדורה אכפתית
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      מה נכניס לתרמיל הכיתתי; בקבוצות של ארבעה — מה כן ומה לא במדורה, על פתקיות בשני צבעים; האמנה נבנית
      על הלוח
    body:
      - slide:
          kicker: מתכוננים למדורה כיתתית אכפתית
          title: מה חשוב שנכניס לתרמיל הכיתתי?
          sub: כדי שכל התלמידים בכיתה ירגישו טוב וייהנו.
          echo: true
          alt: לוח, ועליו שלושה פתקים צבעוניים
          art:
            - {use: board, x: 196, y: 70, w: 400}
            - {use: sticky, x: 236, y: 110, w: 90}
            - {use: sticky, x: 350, y: 150, w: 90, color: teal}
            - {use: sticky, x: 466, y: 108, w: 90, color: purple}
      - moves:
          - >-
            שאלי מה חשוב שנכניס לתרמיל הכיתתי לקראת המדורה, ורשמי על הלוח שלוש–ארבע תשובות — כמו מצב רוח טוב,
            שיתוף פעולה ועזרה הדדית.
          - הסבירי את המשימה לפני שמחלקים את הפתקיות; ההוראות נשארות על המסך.
          - חלקי לכל קבוצה פתקיות כתומות וצהובות. הסתובבי בין הקבוצות, ודקה לפני הסוף — הודיעי.
          - >-
            במליאה — כל קבוצה מקריאה פתקית כתומה אחת ופתקית צהובה אחת, ומדביקה אותן בטור המתאים על הלוח. שני
            הטורים הם האמנה של הכיתה למדורה.
      - ask: מה חשוב שנכניס לתרמיל הכיתתי — כדי שכולם ירגישו טוב וייהנו?
      - slide:
          kicker: כותבים אמנה אכפתית לל״ג בעומר
          title: מה כן ומה לא במדורה שלנו?
          sub: כתבו על פתקית כתומה מה כן, ועל פתקית צהובה מה לא.
          timer: 240
          cue: אחרי התרמיל —
          echo: true
          alt: ארבעה סביב שולחן, וי מצד אחד ואיקס מהצד השני
          art:
            - {use: circle4, x: 150, y: 170, w: 300}
            - {use: check, x: 460, y: 40, w: 120}
            - {use: cross, x: 40, y: 40, w: 120}
      - say: >-
          בקבוצות של ארבעה. על הפתקיות הכתומות — מעשים שהייתם רוצים שיהיו בכיתה שלנו בהכנות למדורה ובערב עצמו; על
          הצהובות — מעשים שלא הייתם רוצים.
      - task:
          what: >-
            כל קבוצה כותבת לפחות שתי פתקיות כתומות — מעשים שהיינו רוצים שיהיו בהכנות למדורה ובערב עצמו — ולפחות
            שתי פתקיות צהובות — מעשים שלא היינו רוצים. כל מעשה בפתקית משלו.
          time: 4 דקות
          group: קבוצות של ארבעה לפי השולחנות
          rules: >-
            כותבים מעשים, בלי שמות; כל אחד בקבוצה מציע לפחות מעשה אחד; קבוצה שמסיימת מוקדם חושבת גם על
            הכסף, הציוד והכיבוד
          plenary: כל קבוצה מקריאה פתקית אחת מכל צבע, ומדביקה אותן בטור המתאים על הלוח
          help: >-
            חשבו על מפגש כיתתי שהיה — מה גרם לכם להרגיש טוב, ומה לא? למשל, להתקשר לחבר כדי להזמין אותו, או לא
            להזמין מישהו.
          challenge: מה יעזור למי שלא מכיר הרבה ילדים בכיתה להרגיש שייך במדורה?
      - say: זו האמנה שלנו. ועכשיו, עם יד על הלב — נסתכל רגע על הטור של ״מה לא״.

  # ------------------------------------------------------------------ 14′–19′
  - id: heart
    title: עם יד על הלב
    minutes: 5
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
    summary: >-
      כתיבה לעצמם, שלא נאספת — האם הייתי שותף למעשה מהטור ״מה לא״, ומה אעשה אחרת; במליאה — איך מרגיש מי
      שחווה אותו
    body:
      - slide:
          kicker: עם יד על הלב · לעצמכם
          title: האם הייתם שותפים לאחד המעשים בטור ״מה לא״?
          points:
            - איך אתם מרגישים לגבי זה?
            - מה תוכלו לעשות אחרת במפגש הכיתתי הקרוב?
          timer: 90
          echo: true
          alt: דמות יושבת, ומעליה ענן מחשבה ובו לב
          art:
            - {use: thought, x: 60, y: 40, w: 260}
            - {use: heart, x: 138, y: 94, w: 110}
            - {use: kid-sit, x: 360, y: 200, w: 200, color: purple}
      - moves:
          - הציגי את השאלות, ואמרי בבירור שהכתיבה לעצמם ולא נאספת. דקה וחצי בשקט.
          - >-
            במליאה — שאלי רק מה אפשר לעשות אחרת. מי שמספר שהיה שותף — חזקי אותו על הכנות, ואמרי שאפשר לנהוג
            אחרת.
          - שאלי איך ירגישו מי שחווים את המעשים מהטור ״מה לא״, ותני לכיתה להגיב זה לזה.
          - סיימי בהקראת ״כיתה שנעים להיות בה״.
      - ladder:
          help: בחרו מעשה אחד מהטור ״מה לא״ — מה הייתם עושים במקומו?
          challenge: מה קשה לעשות אחרת — ומה יעזור לכם בכל זאת?
      - ask: איך לדעתכם ירגישו תלמידים שיחוו את המעשים מהטור ״מה לא״?
      - say: אז מה שאפשר לעשות אחרת זה ___ — הבנתי נכון? מי עוד רוצה להוסיף?
      - quote:
          title: כיתה שנעים להיות בה — מהמקור, להקריא
          text: >-
            ככל שיהיו בינינו, במצבים שונים, יותר התנהגויות אכפתיות ופחות התנהגויות לא אכפתיות, כך נרגיש כולנו נעים
            יותר.
      - say: יש כלי שעוזר להוסיף מעשים אכפתיים — במדורה, ובכל יום בכיתה.

  # ------------------------------------------------------------------ 19′–26′
  - id: simcha
    title: מכניסים שמח״ה לכיתה
    minutes: 7
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      ארבעת השלבים של הכלי ודוגמה מהמפגש הכיתתי; בזוגות — מצב נוסף בחיי הכיתה, ואיך מפעילים בו את שמח״ה
    body:
      - slide:
          kicker: כלי לכל יום · ארבעה שלבים
          title: מכניסים שמח״ה לכיתה
          points:
            - שמים לב
            - מתעניינים
            - חושבים ומתחשבים
            - מגישים עזרה
          echo: true
          alt: ארבעה ריבועים עם האותיות ש, מ, ח, ה, ושמש מעליהם
          art: {file: art/simcha.svg}
      - moves:
          - >-
            הציגי את הכלי שלב אחרי שלב — כל שלב נחשף לבד, והקריאי אותו מהמקור (למטה). על כל שלב בקשי דוגמה
            מהכיתה.
          - הקריאי את הדוגמה מהמקור — ילד שנמצא לבד במפגש הכיתתי.
          - >-
            בזוגות — כל זוג בוחר מצב נוסף בחיי הכיתה, ומתכנן מה עושים בו בכל אחד מארבעת השלבים. הסתובבי
            והקשיבי.
          - שמעי שלושה זוגות, ושאלי למה זה יתרום. סיימי בהסבר למה הכלי נקרא כך.
      - quote:
          title: ארבעת השלבים — מהמקור, להקריא
          text: |-
            שמים לב, מתייחסים, מברכים לשלום, מחייכים
            מתעניינים באחרים, שואלים שאלות ומקשיבים
            חושבים ומתחשבים ברגשות ובצרכי האחר/ת (מזהים מה האחרים מרגישים ומה יעזור להם להרגיש טוב יותר)
            הגשת עזרה שתענה על הצורך של האחרים
      - quote:
          title: הדוגמה מהמקור — להקריא
          text: |-
            שמים לב – במפגש הכיתתי אני אשים לב לילד/ה שנמצא/ת לבד, אגיד לו שלום
            מתעניינים – אפנה לחבר/ה שנמצא/ת לבד ואשאל אותו מה שלומו/ה
            חושבים ומתחשבים ברגשות ובצרכי האחר/ת – אזהה את רצונו/רצונה של החבר/ה ואת תחושותיו/ ואשאל אותו מה יכול לעזור לו להרגיש טוב יותר
            הגשת עזרה – אציע לו/לה שנהיה ביחד
      - slide:
          kicker: מכניסים שמח״ה · בזוגות
