    body:
      - messages:
          items:
            - מעשי אכפתיות, התחשבות ונדיבות תורמים לאווירה בכיתה.
            - מעשים מתחשבים ואכפתיים מובילים לרגשות חיוביים אצל המעניקים והמקבלים.
            - כשאני עושה טוב לאחרים, ההשפעה החיובית מתרחבת למעגלים נוספים.
            - מעשים מתחשבים כוללים נתינה, עזרה ותשומת לב לזולת ולסביבה.
            - מעשים אכפתיים אינם חייבים להיות מורכבים - כל אחד/ת יכול/ה לעשותם, במצבים שונים.
            - כשעורכים אירועים כיתתיים – הדרך המרכזית לגלות אכפתיות היא לדאוג ולוודא שכולם משתתפים!
            - יש לנו היכולת להשפיע על האווירה בכיתה, דרך הגברת התנהגויות חיוביות וצמצום התנהגויות שליליות.
            - דרך מעשים מתחשבים, גם בשעות הלימודים וגם במפגשים כיתתיים, אנחנו מוסיפים שמח״ה לכיתה.
          ask: איזה משפט מהשמונה הכי חשוב לכם לקראת המדורה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהמעשה הקטן (1–5), אל המפגש הכיתתי (6), ואל הכוח שלנו להשפיע על האווירה — ולהוסיף שמח״ה
            (7–8).
          alt: שתי ידיים מושטות זו לזו, ולב לידן
          art:
