sub: >-
  לקראת מדורת ל״ג בעומר — איך דואגים שכולם ירגישו טוב וייהנו? בשיעור הזה משחקים בבקבוק האכפתיות, כותבים
  אמנה כיתתית למדורה, ולומדים כלי פשוט: מכניסים שמח״ה לכיתה.
format: משחק, קבוצות, זוגות ומליאה
question: מה כל אחד מאיתנו יכול לעשות כדי שכולם ירגישו שאכפת מהם — במדורה ובכיתה?
takeaways:
  - מעשים אכפתיים ומתחשבים עושים טוב גם למי שמקבל וגם למי שנותן — והכיתה נעשית מקום נעים יותר.
  - במפגש כיתתי, הדרך המרכזית לגלות אכפתיות היא לדאוג שכולם משתתפים.
  - שמח״ה — שמים לב, מתעניינים, חושבים ומתחשבים, מגישים עזרה — כלי שכל אחד יכול להפעיל.
prep:
  - בקבוק ריק, שקוף אם יש — לפתקים של ״בקבוק האכפתיות״
  - פתקיות בשני צבעים — כתומות וצהובות (או כל שני צבעים) — כמה מכל צבע לכל קבוצה
  - חלוקה מראש לקבוצות של ארבעה לפי השולחנות
  - שני טורים על הלוח, מוכנים לפני השיעור — ״מה כן במדורה שלנו״ ו״מה לא במדורה שלנו״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — אכפתיות במפגשים כיתתיים, לקראת מדורת ל״ג בעומר. שאלי מי בכיתה נשאר לא פעם
      בחוץ — לא מוזמן, לא מגיע למפגשים, בלי חבר קרוב — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שלא הוזמן, מי שנשאר לבד במפגשים, ומי שלמשפחה שלו קשה לשלם על ציוד וכיבוד. בפתקיות ובאמנה כותבים
      מעשים, לא שמות ולא סיפורים שמזהים מישהו — ״לא להזמין מישהו״, ולא ״לא הזמינו את…״. מי שמספר שהיה שותף
      להתנהגות לא אכפתית — חזקי אותו על הכנות, והדגישי שאפשר לנהוג אחרת.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו״. את ״עם יד על הלב״ כותבים לעצמם, והכתיבה לא נאספת; במליאה
      משתפים רק מתנדבים, ורק במה שיעשו אחרת. בבקבוק — מותר להעביר את הפתק לחבר שמתנדב לענות.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל חרם, הצקה שחוזרת, או ילד שמרחיקים אותו מכל מפגש — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 19 דקות ומעלה — שתי ההרחבות; 14–18 דקות — רק ״כסף, ציוד וכיבוד״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - bottle
      - simcha
    text: >-
      בבקבוק משחקים שלושה סבבים בלבד, ובשמח״ה מוותרים על הזוגות — מפעילים את הכלי יחד, במליאה, על הדוגמה
      מהמקור

brain_break:
  signs: רעש שעולה, קושי לשבת במקום, תשובות של מילה אחת.
  ideas:
    - name: סופרים עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר את המספר הבא, בלי סדר ובלי סימנים. שניים מדברים יחד?
        מתחילים מאחת.
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: אף ואוזן
      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
  from: example

