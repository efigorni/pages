steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: החלטה משמעותית
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: כתיבה אישית בכניסה — החלטה משמעותית, בין אילו אפשרויות התלבטתם ומה הרגשתם; משתפים רק מילה של רגש
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: היזכרו בהחלטה משמעותית שקיבלתם לאחרונה.
          sub: בין אילו אפשרויות התלבטתם? מה הרגשתם כשהתעורר הצורך להחליט באותו עניין?
          verbatim: true
          timer: 180
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובו דרך שמתפצלת
          art:
            - {use: thought, x: 24, y: 16, w: 300}
            - {use: arrows-fork, x: 95, y: 48, w: 130}
            - {use: kid-desk, x: 312, y: 140, w: 288, color: teal}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף. בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות.
          - אמרי בבירור שאת ההחלטה עצמה לא מספרים — הכתיבה נשארת במחברת.
          - אחרי שלוש דקות — שמעי מכמה מתנדבים מילה אחת של רגש, ורשמי את המילים בצד הלוח. הן יחזרו במפגש עם החברים.
      - say: >-
          שלוש דקות, לבד ובשקט. את ההחלטה עצמה לא משתפים — היא נשארת אצלכם. והיום, כמו תמיד, מספרים רק על עצמנו,
          ומה שנאמר כאן נשאר כאן.
      - ladder:
          help: גם החלטה קטנה נחשבת — לאיזה חוג להירשם, עם מי לשבת, מה לעשות בסוף השבוע.
          challenge: היזכרו גם במצב שבו הושפעתם מאחרים והחלטתם בניגוד לרצונכם. מה הרגשתם בזמן ההתלבטות?
      - ask: בלי לספר מה החלטתם — מילה אחת, מה הרגשתם כשהיה צריך להחליט?
      - say: >-
          היום נתבונן באופן שבו אנחנו מחליטים ובסגנון שלנו, ונלמד כמה רעיונות שיעזרו לנו לקבל החלטות שמיטיבות
          איתנו.

  # ------------------------------------------------------------------ 5′–10′
  - id: aware
    title: מודעת או ״על אוטומט״?
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      איזה בדיקות עושים לפני קנייה שחלמנו עליה, ומתי מחליטים ״על אוטומט״; יתרונות וחסרונות לשתי הדרכים, וההגדרה
      של המקור
    body:
      - slide:
          kicker: מודעות בקבלת החלטות
          title: חסכתם כסף זמן רב לדבר שחלמתם עליו.
          sub: קונים את הדבר הראשון שרואים — או בודקים קודם? איזה בדיקות הייתם עושים?
          echo: true
          alt: מחשב נייד, וזכוכית מגדלת לידו
          art:
            - {use: laptop, x: 40, y: 170, w: 330}
            - {use: magnifier, x: 384, y: 250, w: 200}
      - moves:
          - הציגי את המצב. כל אחד חושב לבד על דבר אחד שהיה רוצה לקנות, ועל הבדיקות שהיה עושה לפני הקנייה — 30 שניות בשקט.
          - דקה עם השכן — משווים בדיקות.
          - שמעי שלושה זוגות, ורשמי את הבדיקות על הלוח בטור ״מודעת״. ואז — השקף ״על אוטומט״, ויתרונות וחסרונות לשני הטורים.
          - לסיום הקריאי את ההגדרה מהמקור.
      - ask: איזה בדיקות הייתם עושים לפני שאתם קונים?
      - ladder:
          help: חשבו על המחיר, על החנות, ועל מה שמספרים מי שכבר קנו.
          challenge: האם יש מצב שבו דווקא בדיקה ארוכה מדי גורמת להפסיד?
      - slide:
          kicker: מודעות בקבלת החלטות
          title: ומתי מחליטים ״על אוטומט״?
          sub: מה היתרונות בהחלטה ״אוטומטית״ — ומה החסרונות?
          echo: true
          cue: אחרי הבדיקות —
          alt: מאזניים, שתי כפות בגובה שווה
          art:
            - {use: scale, x: 150, y: 130, w: 320}
      - board:
          - החלטה מודעת — מה מרוויחים? מה מפסידים?
          - החלטה ״על אוטומט״ — מה מרוויחים? מה מפסידים?
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: >-
            בכל פעם שאנו רוצים לעשות משהו, וחושבים שקיימות כמה דרכים לעשותו, עלינו לקבל החלטה. לעיתים החלטות
            מתקבלות מתוך התייחסות מודעת למצב קיים ובחירה רציונלית של דרך פעולה מתוך חלופות בתגובה לאותו מצב. ולעיתים
            מדובר בתהליך שאינו רציונלי.
      - say: >-
          החלטה מודעת לא תמיד נגמרת טוב, והחלטה ״אוטומטית״ לא תמיד נגמרת רע. כדאי לבדוק עם עצמנו מתי אנחנו עוצרים
          ובודקים, ומתי לא — ועד כמה ההחלטות ״האוטומטיות״ שלנו חשובות ומשפיעות עלינו.
      - say: ולכל אחד מאיתנו יש גם סגנון משלו. בואו נבדוק מה הסגנון שלכם.

  # ------------------------------------------------------------------ 10′–17′
  - id: styles
    title: הסגנון שלי בקבלת החלטות
    minutes: 7
    practices:
      - כולם כותבים
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      שבעה סגנונות, מ״ניצה אינטואיציה״ ועד ״ורד יוצאת למרד״; כל אחד כותב מה הסגנון שלו, ובזוגות — מה מרוויחים ומה
      מפסידים בו
    body:
      - slide:
          kicker: הסגנון שלי בקבלת החלטות · 1 מתוך 2
          title: מה הסגנון שלכם?
          points:
            - ניצה אינטואיציה — מה שמרגיש נכון
            - נטע רולטה — משאירה הכול למזל
            - גילי אתה תגיד לי — אחרים מחליטים
            - אמיר המהיר — העיקר להחליט מהר
          alt: עמוד עם שלטי כיוון, ולידו דמות שמרימה יד
          art:
            - {use: signpost, x: 60, y: 190, w: 240}
            - {use: kid-hand, x: 380, y: 154, w: 165, color: teal}
      - moves:
          - חשפי את הסגנונות אחד־אחד — כל קליק חושף סגנון — והקריאי כל אחד במלואו, מהציטוט למטה. מותר לחייך; השמות נועדו לזה.
          - כל אחד כותב במחברת איזה סגנון — אחד או יותר — הכי מתאר אותו, ובאיזה מצב. שתי דקות.
          - דקה עם השכן — מה מרוויחים ומה מפסידים בסגנון של כל אחד.
          - במליאה — שאלי, וחכי עשר שניות לפני שאת מזמינה תשובות.
      - slide:
          kicker: הסגנון שלי בקבלת החלטות · 2 מתוך 2
          title: ואולי אתם…
          points:
            - משולם המושלם — בודק הכול, הרבה זמן
            - מאשה חשה — לפי הרגש, בלי לחשוב על התוצאות
            - ורד יוצאת למרד — תמיד ההפך מכולם
            - סגנון אחר — כתבו אותו
          cue: אחרי ארבעת הסגנונות הראשונים —
          alt: עמוד עם שלטי כיוון, ולידו דמות חושבת
          art:
            - {use: signpost, x: 60, y: 190, w: 240}
            - {use: thought, x: 350, y: 16, w: 200}
            - {use: kid-stand, x: 380, y: 194, w: 165, color: teal}
      - quote:
          title: שבעת הסגנונות מהמקור — להקריא כשחושפים
          text: |-
            ״ניצה אינטואיציה״ — בוחרת לפי רגש פנימי, לפי מה שמרגיש.ה לנכון.
            ״נטע רולטה״ — לא מחליטה דבר בעצמי, משאירה הכל למזל ולגורל.
            ״גילי אתה תגיד לי״ — תמיד משאיר את ההחלטה לאחרים (חברים, הורים, או בעלי סמכות אחרים).
            ״אמיר המהיר״ — אני מחליט כמה שיותר מהר, לא חשוב מה. העיקר בשבילי הוא להימנע ממצב עמימות שאיני יכול לסבול אותו.
            ״משולם המושלם״ — אני מהסס הרבה זמן, מנתח ובודק את כל הצדדים בכל עניין, בניסיון להגיע להחלטה המושלמת.
            ״מאשה חשה״ — אני לוקחת החלטות אימפולסיביות המבוססות על רגשות ללא מחשבה על התוצאות.
            ״ורד יוצאת למרד״ — מחליטה תמיד את ההיפך מכולם רק כדי להיות שונה.
            מקבל/ת החלטות אחר/ת — רשמו את הסגנון…
      - say: כתבו איזה סגנון — אחד או יותר — הכי מתאר אתכם, ובאיזה מצב.
      - ladder:
          help: חשבו על החלטה מהשבוע — מה ללבוש, מה לאכול, עם מי לצאת. איך החלטתם?
          challenge: באיזה מצב הייתם רוצים להחליף סגנון — ולאיזה?
      - ask: האם אפשר לשנות סגנון של קבלת החלטה? מתי זה נחוץ?
      - say: >-
          לכל אחד מאיתנו יכולים להיות כמה סגנונות, ואפשר להתאים את הסגנון למצב. אבל גם הסגנון הכי זהיר לא רואה
          הכול — בואו נבדוק את זה.

  # ------------------------------------------------------------------ 17′–22′
  - id: gorilla
    title: מה לא ראינו?
    minutes: 5
    practices:
      - מה הקשר?
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: סרטון קצר — סופרים מסירות של כדור, ומגלים מה עוד היה שם; מה זה מלמד על הדרך שבה אנחנו מחליטים
    body:
      - moves:
          - הציגי את שאלת הצפייה, והפעילי את הסרטון. אל תגלי מה עוד יש בו — ומי שמכיר אותו שומר את זה לעצמו.
          - בעצירה — שאלי כמה מסירות ספרו, ומי ראה עוד משהו. אחר כך הריצי עד הסוף.
          - אחרי הסרטון — שאלי מה אפשר ללמוד מזה. הדהדי תשובות, ובקשי מהכיתה להגיב זו לזו.
      - video:
          title: מבחן הקשב הסלקטיבי
          url: https://www.youtube.com/watch?v=vJG698U2Mvo
          length: "1:22"
          clip:
            start: "0:05"
          before: כמה פעמים השחקנים בחולצות הלבנות מוסרים את הכדור?
          watch: ספרו בשקט רק את המסירות של השחקנים בלבן — בלי לדבר עד הסוף.
          pauses:
            - at: "?"
              moment: >-
                סוף המשחק — המסירות נגמרות, ועוד לפני שהסרטון מגלה את התשובה. צפי בסרטון לפני השיעור, ורשמי כאן
                את הזמן.
              ask: כמה מסירות ספרתם? ומי ראה עוד משהו?
          alt: שתי דמויות מאותה קבוצה מוסרות כדור זו לזו
          art: {file: art/passes.svg}
      - whisper: >-
          בערך מחצית מהצופים בפעם הראשונה לא שמים לב לגורילה. מי שלא ראה אותה — בחברה טובה; זו בדיוק הנקודה.
      - ask: מה אפשר ללמוד מזה על הדרך שבה אנחנו מחליטים?

  # ------------------------------------------------------------------ 22′–30′
  - id: party
    title: מפגש עם החברים
    minutes: 8
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      החלטה בדמיון — החברים מעשנים ושותים: מחליטים לבד, בזוגות בודקים מה השפיע ומה קיבלנו והפסדנו, ובמליאה — למה
      אנחנו בוחרים גם במה שיכול לסכן אותנו; ארבע שאלות לפני החלטה משמעותית
    body:
      - say: >-
          כשאנחנו מחליטים, אנחנו לא תמיד שמים לב לכל המידע שלפנינו — ולפעמים בוחרים להניח חלק ממנו בצד. בואו נבדוק
          את זה בהחלטה שהרבה בני נוער פוגשים.
      - slide:
          kicker: קבלת החלטות לגבי עישון ושתייה
          title: דמיינו — שבוע מהיום, מפגש עם החברים.
          sub: הם מעשנים ושותים. אתם מצטרפים — או מחליטים לא להצטרף?
          echo: true
          alt: שלושה חברים יחד, ולידם דמות שחושבת לאן ללכת
          art:
            - {use: thought, x: 24, y: 16, w: 250}
            - {use: arrows-fork, x: 82, y: 44, w: 115}
            - {use: kid-stand, x: 50, y: 200, w: 160, color: teal}
            - {use: group3, x: 270, y: 272, w: 330}
      - moves:
          - הקריאי את המצב. כל אחד מחליט לבד, בשקט, מה הוא עושה — ושם לב מה הוא מרגיש. אפשר להיעזר במילות הרגש שעל הלוח מהפתיחה. 30 שניות.
          - שתי דקות בזוגות, לפי השאלות שעל המסך. מדברים על ההחלטה בדמיון — לא על מקרים אמיתיים ולא על אנשים.
          - שמעי שלושה–ארבעה זוגות, ורשמי על הלוח מה השפיע — החברים, מה שזמין שם, הלחץ להחליט מהר, ״לי זה לא יקרה״.
          - שאלי ״למה זה קורה לנו?״, וחכי עשר שניות לפני שאת מזמינה תשובות.
          - לסיום — חשפי את ארבע השאלות של ״אתם מחליטים!״ אחת־אחת, והקריאי כל אחת מהציטוט.
      - slide:
          kicker: מבררים · מהרהרים
          title: איך קיבלתם את ההחלטה?
          points:
            - מה השפיע על ההחלטה שלכם?
            - מה ״קיבלתם״ — ומה ״הפסדתם״?
          timer: 120
          echo: true
          cue: אחרי 30 השניות של השקט —
          alt: מאזניים, ומתחתם וי ואיקס
          art:
            - {use: scale, x: 160, y: 50, w: 300}
            - {use: check, x: 380, y: 340, w: 130}
            - {use: cross, x: 110, y: 340, w: 130}
      - ladder:
          help: חשבו על החברים, על מה שזמין שם, על הזמן שיש להחליט, ועל מה שכבר עשיתם בעבר.
          challenge: מה מההחלטה הזאת לא רואים ״כאן ועכשיו״ — ואיך היא עשויה להשפיע עליכם בעוד שנה?
      - slide:
          kicker: שאלות לדיון בכיתה
          title: למה זה קורה לנו?
          sub: למה לעיתים אנחנו בוחרים להתנהג באופן שיכול לסכן אותנו, למרות הידיעה שזה כך?
          verbatim: true
          echo: true
          cue: אחרי הזוגות —
          alt: דמות עומדת, ומעליה ענן מחשבה ובו סימן שאלה
          art:
            - {use: thought, x: 60, y: 30, w: 300}
            - text: '?'
              x: 210
              y: 150
              size: 120
            - {use: kid-stand, x: 400, y: 200, w: 150, color: teal}
      - ask: למה זה קורה לנו?
      - say: >-
          בכל אפשרות יש משהו מושך ומשהו דוחה. הרצון להתנסות ולהיות חלק מהחבר׳ה יכול לדחוק הצידה את מה שאנחנו
          יודעים — ״לי זה לא יקרה״, ״רק פעם אחת״. לכן בהחלטה משמעותית כדאי לעצור, לחשוב ולתכנן — לקחת עוד רגע
          או שניים.
      - slide:
          kicker: אתם מחליטים! · לפני החלטה משמעותית
          title: עוצרים ושואלים
          points:
            - הבאתי בחשבון את ההשלכות של כל אפשרות?
            - עד כמה חשובה לי כל השלכה?
            - איך הבחירה תשפיע עלי — ועל אחרים?
            - איזה מידע יש לי? האם הוא אמין ומדויק?
          echo: true
          cue: לסיום —
          alt: רמזור, ודמות עומדת לידו
          art:
            - {use: traffic-light, x: 340, y: 90, w: 170}
            - {use: kid-stand, x: 110, y: 110, w: 165, color: teal}
      - quote:
          title: ארבע השאלות מהמקור — להקריא כשחושפים
          text: |-
            האם הבאתי בחשבון את כל ההשלכות שתהיינה לכל אפשרות?
            עד כמה חשובה לי כל השלכה?
            כיצד הבחירה באפשרות מסוימת תשפיע עלי? ועל אחרים?
            איזה מידע יש ברשותי? האם יש לי את כל המידע הנדרש? האם הוא אמין? מדויק?

  # ------------------------------------------------------------------ +5′
  - id: blind
    title: העיוורים והפיל
    kind: extension
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: סרטון על עיוורים שפוגשים פיל — מה השפיע על ההחלטה של כל אחד, ומה הקשר להחלטה לעשן או לשתות
    body:
      - video:
          title: העיוורים והפיל
          url: https://www.youtube.com/watch?v=ckR4A069pf0
          length: "2:33"
          before: חמישה עיוורים פוגשים פיל. מה כל אחד מהם יגיד שהוא ״ראה״?
          watch: שימו לב לכל אחד מהחמישה — באיזה חלק של הפיל הוא נוגע, ומה הוא מחליט.
          pauses:
            - at: "?"
              moment: אחרי שכל העיוורים תיארו את הפיל, ולפני סוף הסיפור.
              ask: מה השפיע על ההחלטה של כל אחד מבין החמישה?
          alt: פיל גדול, ושלוש דמויות שכל אחת נוגעת בחלק אחר שלו
          art: {file: art/elephant.svg}
      - moves:
          - הציגי את השאלה שלפני הצפייה, והפעילי את הסרטון.
          - בעצירה — שאלי, וחכי עשר שניות. אחר כך הריצי עד הסוף.
          - אחרי הסרטון — שאלת הקשר, ותני לכיתה להגיב זו לזו. שאלות המשך מההערות — האם ההחלטה לעשן או לשתות לוקחת בחשבון את כל התמונה, ומה בוחרים ״לא לראות״ ברגע כזה?
      - p: >-
          מה לומר אחרי כמה תשובות (מההערות): כל אחד מישש חלק אחר של הפיל, ״ראה״ רק חלק מהתמונה, אבל היה בטוח שהוא
          רואה הכול — והחליט. ההחלטה התבססה רק על חלק מהמידע.
      - slide:
          kicker: מבררים · מהרהרים
          title: מה הקשר בין העיוורים והפיל — לעישון ולשתייה?
          echo: true
          cue: אחרי הסרטון —
          alt: חלק פאזל, וזכוכית מגדלת לידו
          art:
            - {use: puzzle, x: 270, y: 110, w: 280}
            - {use: magnifier, x: 60, y: 290, w: 180}
      - ask: מה הקשר בין ההחלטות של העיוורים לבין ההחלטה לעשן או לשתות?

  # ------------------------------------------------------------------ +5′
  - id: factors
    title: מה משפיע עלינו כשאנחנו מחליטים?
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: שמונה גורמים שמשפיעים על החלטות; כל אחד בוחר שניים שהכי משפיעים עליו, ובזוגות — דוגמה מחיי מתבגר
    body:
      - slide:
          kicker: גורמים המשפיעים על קבלת החלטות · 1 מתוך 2
          title: מה משפיע עליכם כשאתם מחליטים?
          points:
            - תנאים פיזיים
            - העדפות והרגלים
            - תכונות אופי
            - ניסיון עבר
          verbatim: [points]
          echo: true
          alt: דמות עומדת, וסוללה כמעט ריקה לידה
          art:
            - {use: kid-stand, x: 350, y: 150, w: 170, color: teal}
            - {use: battery-low, x: 80, y: 300, w: 200}
      - slide:
          kicker: גורמים המשפיעים על קבלת החלטות · 2 מתוך 2
          title: ועוד…
          points:
            - נסיבות
            - זמינות
            - לחץ זמן
            - אנשים אחרים
          verbatim: [points]
          echo: true
          cue: אחרי ארבעת הגורמים הראשונים —
          alt: שעון, דמות עומדת ושלושה חברים לידה
          art:
            - {use: clock, x: 60, y: 30, w: 130}
            - {use: kid-stand, x: 60, y: 210, w: 140, color: teal}
            - {use: group3, x: 300, y: 280, w: 280}
      - moves:
          - הקריאי את הגורמים. כשצריך — דוגמה מההערות (ברשימה למטה).
          - כל אחד בוחר לבד שני גורמים שהכי משפיעים עליו — 30 שניות; ואז דקה וחצי עם השכן — דוגמה מחיי מתבגר לכל גורם.
          - שמעי שלושה זוגות.
      - list:
          - תנאים פיזיים — עייפות, רעב ואפילו חום וקור מקשים להתרכז ולהחליט החלטה מושכלת.
          - העדפות והרגלים — ״טייס אוטומטי״ שחוזר על החלטה שכבר הוכיחה את עצמה.
          - תכונות אופי — מי שמוציא את כל דמי הכיס ביום הראשון, ומי שחוסך לאורך זמן לדבר יקר.
          - ניסיון עבר — נמנעים ממה שהתחרטנו עליו, אבל לא תמיד לומדים מהטעויות.
          - זמינות — מעדיפים את מה שקרוב ומיידי.
          - לחץ זמן — בודקים פחות אפשרויות.
          - אנשים אחרים — בגיל ההתבגרות, במיוחד החברים.
      - ladder:
          help: חשבו על ההחלטה מהפתיחה — מה מהרשימה השפיע עליה?
          challenge: איזה גורם הכי קשה לשים לב אליו ברגע האמת — ולמה?
      - ask: איזה גורם הכי משפיע עליכם? תנו דוגמה.
      - say: הגורמים האלה פועלים גם במפגש עם החברים — ולכן כדאי לשים לב אליהם לפני שמחליטים.

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
