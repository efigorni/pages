    summary: החלטה אחת לפי הדגם — שתי אפשרויות, מה יכול לקרות בכל אחת, ואיזה מידע חסר; פתקים נאספים בדלת
    body:
      - say: >-
          שלוש שאלות קצרות, לבד ובשקט. בחרו החלטה אחת — החלטה שעומדת לפניכם, או ההחלטה מהמפגש עם החברים. כולם מוסרים
