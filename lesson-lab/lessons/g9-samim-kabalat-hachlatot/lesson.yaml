      - exit:
          form: board
          title: אתם מחליטים!
          prompts:
            - מהן שתי האפשרויות — ומה יכול לקרות אם אבחר בכל אחת מהן?
            - איזה מידע חסר לי כדי להחליט — ואיפה אמצא מידע אמין?
            - רשות — הסגנון שלי, ומתי כדאי לי לנסות סגנון אחר.
          look_for: >-
            חפשי אפשרויות בלי השלכות (״לא יקרה כלום״), מידע שמגיע רק מחברים, ופתקים שמספרים על לחץ לעשן או לשתות
            שקורה עכשיו — עם אלה מדברים בשקט השבוע, ומה שנוגע בפגיעה עובר ליועצת עוד היום.
          timer: 180
