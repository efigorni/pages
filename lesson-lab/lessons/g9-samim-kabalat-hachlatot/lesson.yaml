sub: >-
  כל יום אנחנו מחליטים — לפעמים אחרי בדיקה, ולפעמים ״על אוטומט״. בשיעור הזה מזהים את הסגנון שלנו, מגלים
  כמה קל לפספס חלק מהתמונה, ובודקים איך מחליטים כשהחברים מעשנים ושותים.
format: כתיבה אישית, זוגות ומליאה
question: איך אני מחליט — ומה יעזור לי לעצור ולראות את כל התמונה, גם כשכולם סביבי מחליטים אחרת?
takeaways:
  - יש החלטות שמתקבלות אחרי בדיקה ושיקול דעת, ויש החלטות ״על אוטומט״ — ולשתיהן יתרונות וחסרונות.
  - לכל אחד יש סגנון החלטה אחד או יותר, ואפשר להתאים את הסגנון למצב.
  - >-
    בהחלטה משמעותית, כמו להצטרף לעישון או לשתייה, כדאי לעצור: לראות את כל האפשרויות ואת ההשלכות שלהן, ולבדוק
    אם המידע שלנו אמין.
prep: []

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — קבלת החלטות, ובסופו החלטה בדמיון על עישון ושתייה במפגש עם חברים. שאלי אם יש
      בכיתה מי שהנושא קרוב אליו מדי: מי שכבר מעשן או שותה, מי שמעשנים או שותים אצלו בבית יותר מדי, או מי שחבורה
      לוחצת עליו עכשיו. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      בפתיחה כל אחד נזכר בהחלטה משמעותית, ואולי גם בהחלטה שקיבל בניגוד לרצונו — אצל חלק מהתלמידים זו החלטה
      שעוד כואבת (מעבר, פרידה, עניין משפחתי). לכן את ההחלטה עצמה לא מספרים, ומשתפים רק מילה של רגש. במפגש עם
      החברים מדברים על החלטה בדמיון, לא על מי שמעשן או שותה באמת, ולא שואלים מי כבר ניסה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. הכתיבה נשארת במחברת, ובמליאה משתפים רק
      מתנדבים. מותר לוותר, ולא קוראים בשם למי שלא הצביע. גם בסגנונות — כל אחד מזהה רק את הסגנון שלו, בלי להדביק
      סגנון לחבר.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל לחץ לעשן או לשתות שקורה עכשיו, או החלטה קשה שעוד מכאיבה — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית
      אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת — ער״ן (1201): עזרה ראשונה
      נפשית בטלפון, 24/7, גם בלי לומר שם.

