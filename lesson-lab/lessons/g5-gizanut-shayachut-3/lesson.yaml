safe:
- head: תיאום עם היועצת
  text: תאמי מראש כיצד לפנות לשיחה אישית בעקבות זהות ושייכות. הכיני אפשרות לצאת לזמן קצר בליווי מבוגר מוכר.
- head: מי עלול להיפגע
  text: מפת שייכות עלולה לגעת במשפחה, דת או בדידות. אפשר למפות דמות דמיונית, לבחור רק כיתה ותחביב, ולשמור את
    הדף פרטי.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על אדם או על דמות דמיונית, לכתוב במקום לדבר או לעבור. אין מבקשים פרטים אישיים או שמות של
    ילדים.
- head: אם מישהו משתף פגיעה
  text: הודי לו על האמון, עצרי שאלות מהכיתה והמשיכי בפרטיות עם היועצת; אל תבטיחי סודיות כשנדרשת הגנה. המבוגרים
    אחראים לטפל בפגיעה.
