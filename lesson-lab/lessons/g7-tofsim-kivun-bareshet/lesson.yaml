  - ZOOM IN
  - ZOOM OUT

sub: >-
  ברשת יש הכול — גם תכנים שלא מתאימים לגיל שלנו. בשיעור הזה קוראים פוסט של נער שמתלבט, לומדים לעשות ״זום
  אין״ ו״זום אאוט״, ומחליטים מה עושים כשמגיע קישור מפתה — ולמי פונים כשמשהו מטריד.
format: מליאה, זוגות ורביעיות
question: מה עושים כשמשהו ברשת מסקרן אותנו — אבל עלול לפגוע בנו?
takeaways:
  - ברשת יש תכנים שמעשירים ומשמחים — וגם תכנים שלא מתאימים לגילנו ועלולים לפגוע בנו.
  - >-
    ״זום אין״ שואל מה אני צריך עכשיו; ״זום אאוט״ שואל מה זה יעשה לי לאורך זמן — ושני המבטים עוזרים להחליט.
  - כשמשהו ברשת מטריד אותנו, לא נשארים עם זה לבד — פונים למבוגר שסומכים עליו.
prep:
  - >-
    חלוקה מראש לזוגות לפי השולחנות ולרביעיות (שני זוגות סמוכים), ואיזה מקרה מקבלת כל רביעייה — כל מקרה
    לשתיים–שלוש רביעיות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — תכנים שלא מתאימים לגיל: אלימים, מיניים ופוגעניים, קישורים מפתים ואתגרי
      רשת. שאלי אם יש בכיתה מי שנחשף לאחרונה למשהו קשה, או מי שנמצא בקבוצה שעולים בה תכנים כאלה. בקשי שתהיה
      זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שכבר ראה משהו שלא יוצא לו מהראש, ומי שמתבייש במה שצפה בו. מדברים על כותב הפוסט ועל ההודעות במקרים,
      לא על מה שכל אחד ראה; לא מתארים תכנים, ולא שואלים מי נכנס לאיזה קישור. ב״מי אי פעם ומי אף פעם?״ מצביעים
      בעיניים עצומות, ביד מול החזה; מותר לא להרים, וכל אחד סופר לעצמו — אף אחד לא מספר כמה אצבעות הרים.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום, מהמקור: ״אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. מותר לוותר, ולא קוראים בשם למי
      שלא הצביע. הכתיבה בהרחבה ״מה מניע אותנו?״ היא לעצמנו, ולא נאספת.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל תוכן שנשלח אליו, קבוצה שלוחצים בה להיכנס לקישור, או מבוגר זר שפנה אליו ברשת — עוצרים בעדינות, מודים,
      וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת: מוקד
      105 — המטה הלאומי להגנה על ילדים ונוער ברשת, 24/7; ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם. שניהם
      מופיעים גם בשקף ״למי אפשר לפנות?״.

