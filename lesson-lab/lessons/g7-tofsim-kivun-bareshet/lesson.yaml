steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: מי אי פעם ומי אף פעם?
    minutes: 5
    practices:
      - מה הקשר?
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: אגרוף, ואצבע לכל משפט על הרשת שנכון לי; כל אחד סופר לעצמו — ומה למדנו על עצמנו ועל הכיתה
    body:
      - slide:
          kicker: מי אי פעם ומי אף פעם?
          title: משפט שנכון לכם? מיישרים אצבע.
          sub: עיניים עצומות, אגרוף מול החזה. מי שלא רוצה — לא מרים. בסוף סופרים לעצמכם.
          echo: true
          alt: דמות מרימה יד, וטלפון לידה
          art:
            - {use: kid-hand, x: 310, y: 170, w: 165, color: orange}
            - {use: phone, x: 110, y: 270, w: 130}
      - moves:
          - >-
            כולם עוצמים עיניים ומקמצים אגרוף, והיד נשארת מול החזה. הקריאי כל משפט בקול, וחשפי אותו על המסך — הכיתה
            תראה את המשפטים כשתפקח עיניים.
          - אחרי כל משפט — שלוש שניות של שקט, ומי שהמשפט נכון לגביו מיישר אצבע אחת. מי שלא רוצה — לא מרים.
          - >-
            אחרי המשפט העשירי פוקחים עיניים, וכל אחד סופר לעצמו כמה אצבעות הרים. תארי במילים מה ראית (״במשפט על
            הפחד עלו הרבה אצבעות…״) — בלי שמות.
          - שאלי, והזמיני את הכיתה להגיב זה לזה — ״מי מסכים? מי ראה משהו אחר?״
      - say: >-
          עוצמים עיניים, אגרוף מול החזה. משפט שנכון לכם — מיישרים אצבע; מי שלא רוצה — לא מרים. אין תשובה נכונה,
          ואף אחד לא צריך לספר כמה אצבעות הרים.
      - slide:
          kicker: מי אי פעם ומי אף פעם?
          title: משפטים 1–4
          points:
            - מי אף פעם לא עזב את הטלפון שלו לשעה שלמה?
            - מי אי פעם היה פעיל בשתי רשתות חברתיות בבת אחת?
            - מי אף פעם לא העלה תמונה שלו לרשת?
            - מי אף פעם לא פתח לעצמו ערוץ יוטיוב?
          verbatim: [points]
          echo: true
          cue: אחרי ההסבר —
          alt: טלפון ומצלמה
          art:
            - {use: phone, x: 350, y: 110, w: 180}
            - {use: camera, x: 80, y: 250, w: 220}
      - slide:
          kicker: מי אי פעם ומי אף פעם?
          title: משפטים 5–7
          points:
            - מי אי פעם הפיץ הודעת שרשרת?
            - מי אי פעם צפה בתמונה/סרטון שעוררו בו פחד?
            - מי אי פעם צפה בתמונה או בסרטון שעוררו בו בבת אחת תחושות מעורבות?
          verbatim: [points]
          echo: true
          cue: אחרי המשפט הרביעי —
          alt: בועות צ׳אט, ופנים עם הבעה מעורבת לידן
          art:
            - {use: chat, x: 250, y: 60, w: 320}
            - {use: face-meh, x: 80, y: 300, w: 150}
      - slide:
          kicker: מי אי פעם ומי אף פעם?
          title: משפטים 8–10
          points:
            - מי אף פעם לא צפה בתמונה או בסרטון שעוררו בו סלידה?
            - מי אי פעם העביר מדבקה והתחרט לגביה?
            - מי אי פעם חשב שתוכן מסוים אליו הוא נחשף היה בלתי הולם?
          verbatim: [points]
          echo: true
          cue: אחרי המשפט השביעי —
          alt: מחשב נייד, ומעליו ענן מחשבה עם סימן שאלה
          art:
            - {use: laptop, x: 170, y: 250, w: 330}
            - {use: thought, x: 330, y: 24, w: 230}
            - text: '?'
              x: 446
              y: 108
              size: 90
      - ask: מה למדתם על עצמכם מהפעילות — ומה על הכיתה שלנו?
      - say: >-
          ברשת אנחנו פוגשים הכול — גם תכנים שמעוררים פחד, מבוכה או סלידה. בואו נקרא פוסט של נער שמתלבט בדיוק
          בזה.

  # ------------------------------------------------------------------ 5′–12′
  - id: post
    title: מדברים על זה
    minutes: 7
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: קוראים פוסט של נער שמתלבט אם לצאת מקבוצת ווטסאפ; בזוגות — מהי הדילמה שלו?
    body:
      - slide:
          kicker: מדברים על זה · פורום לבני נוער
          title: מה הייתם עושים במקומו?
          sub: פוסט שיכול היה לעלות בכל פורום לבני נוער.
          echo: true
          alt: דמות יושבת מול מחשב נייד
          art:
            - {use: laptop, x: 290, y: 190, w: 300}
            - {use: kid-sit, x: 70, y: 230, w: 180, color: teal}
      - moves:
          - חלקי עותק של הפוסט לכל זוג, והקריאי אותו בקול — הכיתה עוקבת בדף.
          - שאלי בקצרה מה הרגישו כשקראו — מילה או שתיים, בלי הסבר.
          - >-
            Think–Pair–Share על הדילמה — חצי דקה לבד (שורה אחת בכתב), דקה בזוגות, ושלושה זוגות במליאה.
          - חדדי את שני הצדדים — סקרנות ו״להיות בעניינים״, מול תמונות שלא יוצאות מהראש ופוגעות.
      - handout:
          title: ״מדברים על זה״ — פוסט שיכול היה לעלות בפורום לבני נוער
          copies: עותק לכל זוג
          verbatim: true
          lines: false
          items:
            - |-
              טוב, אז אני לא יודע אם לעוד מישהו זה קרה, אבל הייתי שמח לשמוע מה דעתכם...
              בתקופה האחרונה ראיתי תכנים ברשת...
              ת׳אמת זה מסקרן ואפילו מעניין, אבל מצד שני זה גם מטריד את המחשבות. למשל, אני בקבוצת וואטסאפ עם ילדים מהשכבה. כל הזמן עולים שם סטיקרים, תמונות וסרטונים שיכולים להיות אלימים בטירוף, ממש מביכים או מעליבים... זה מגיע למצב שלפעמים חלק מהתמונות לא יוצאות לי מהראש...
              בינינו, בא לי להישאר בקבוצה ולהיות בעניינים ומצד שני אני רוצה לצאת מהקבוצה כי אני קולט שזה פוגע בי...
              מה הייתם עושים במקומי?
      - ask: מה הרגשתם כשקראתם את הפוסט? מילה או שתיים.
      - ask: מהי הדילמה של כותב הפוסט?
      - ladder:
          help: השלימו — ״מצד אחד הוא רוצה… ומצד שני…״
          challenge: מה הוא מפסיד בכל אחת משתי הבחירות?
      - say: >-
          מצד אחד סקרנות ו׳להיות בעניינים׳, ומצד שני תמונות שלא יוצאות מהראש. בואו נראה מה ענו לו בפורום.

  # ------------------------------------------------------------------ 12′–17′
  - id: zoom
    title: זום אין, זום אאוט
    minutes: 5
    practices:
      - מהלכי שיח
      - זמן חשיבה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      ארבע תגובות לפוסט — לאיזו מתחברים ומה עומד מאחורי כל הצעה; ואז כלי לשיקול דעת — זום אין וזום אאוט
    body:
      - slide:
          kicker: מדברים על זה · התגובות
          title: לאיזו תגובה התחברתם — ולאיזו לא?
          sub: ומה עומד, לדעתכם, מאחורי כל הצעה?
          echo: true
          alt: בועות צ׳אט, ודמות עומדת לידן
          art:
            - {use: chat, x: 230, y: 60, w: 340}
            - {use: kid-stand, x: 60, y: 220, w: 140, color: teal}
      - moves:
          - חלקי את התגובות לכל זוג — דקה לקרוא ולבחור.
          - >-
            שאלי, וחכי כמה שניות. על כל תשובה — הדהדי, ושאלי את הכיתה ״מי מסכים? למה?״
          - >-
            חברי לכל תגובה את מה שעומד מאחוריה — השתקה (להישאר בעניינים), יציאה מהקבוצה, לעג להתלבטות (״מה
            אתה, ילד?״), ו״זה חלק מגיל ההתבגרות״.
          - הציגי את הכלי — זום אין וזום אאוט — ובדקי אותו מיד על כותב הפוסט.
      - handout:
          title: תגובות לפוסט
          copies: עותק לכל זוג
          verbatim: true
          lines: false
          items:
            - היי אני גם נמצא בקבוצות כאלו, אני מציע לך לשים את הקבוצה על השתק ולא לקרוא את כל ההודעות בקבוצה.
            - >-
              אם אתה קולט שהתכנים שאתה נחשף אליהם פוגעים בך אז מציעה לך לעזוב את הקבוצה, גם ככה אתה בטח חבר
              בהרבה קבוצות אחרות...
            - מה אתה עושה מזה סיפור??? מה אתה ילד???
            - >-
              לא ציינת את הגיל שלך אבל אם אתה בגיל ההתבגרות זה חלק מהעניין, נחשפים לתכנים... זה נמצא בכל
              מקום.. ואם זה מטריד אותך אז תצא מהקבוצה.
      - ask: לאיזו תגובה התחברתם — ולאיזו לא? למה?
      - slide:
          kicker: כלי לשיקול דעת
          title: זום אין, זום אאוט
          points:
            - זום אין — מה אני צריך עכשיו?
            - זום אאוט — מה זה יעשה לי לאורך זמן?
          echo: true
          cue: אחרי התגובות —
          alt: שתי זכוכיות מגדלות — באחת פלוס, ובשנייה מינוס
          art: {file: art/zoom.svg}
      - quote:
          title: ההסבר מהמקור — להקריא, או לספר במילים שלך
          text: |-
            בחיבור לגלישה בטוחה ברשת Zoom in משקף את הבחירה שלנו "כאן עכשיו". בהתבוננות זו, אנו מתמקדים במתן מענה לצרכים מיידיים, כגון: סקרנות, שעמום, ריגוש, עניין, צורך במידע, הימנעות מהתמודדות וכדומה.

            בחיבור לגלישה בטוחה ברשת Zoom out משקף את הבחירה שלנו מתוך התבוננות רחבה והבנה של השלכות הבחירה. בהתבוננות זו, אנו מסתכלים מעבר לרגע הנוכחי ומענה לצורך מיידי, אלא מרחיבים את ההסתכלות שלנו ובוחנים את ההשפעות וההשלכות של הבחירה שלנו לאורך זמן.
      - say: >-
          כותב הפוסט, בזום אין, רוצה להישאר בעניינים. ומה הוא רואה בזום אאוט? בואו ננסה את הכלי על שלוש הודעות
          עם קישור.

