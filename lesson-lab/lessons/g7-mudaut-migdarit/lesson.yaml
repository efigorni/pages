  - id: shelly
    title: שלי הכובשת
    kind: extension
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: קטע מהסדרה ״שלי הכובשת״ על ספורט של בנים ושל בנות — האם בנים ובנות יכולים לעשות הכול?
    body:
      - moves:
          - >-
            הפרק ארוך; הקריני רק את הקטע שמתחיל בדקה 3:29 — כך מסומן במקור. צפי בו לפני השיעור, וקבעי איפה לעצור
            ואיפה הקטע נגמר — ״עד הסוף״ כאן הוא סוף הקטע, לא סוף הפרק.
          - הציגי את השאלה שלפני הצפייה, והפעילי את הקטע. עצרי בנקודת העצירה.
          - אחרי הצפייה — שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
      - video:
          title: שלי הכובשת, פרק 1 — עכשיו הכדור אצלי
          url: https://www.youtube.com/watch?v=_GWV9sDZuq0
          before: שלי רוצה רק לשחק כדורגל. מה יכול לעצור אותה?
          watch: שימו לב לשלי — מה אומרים לה, ומה היא עושה עם זה.
          pauses:
            - at: "?"
              moment: >-
                בקטע שמתחיל בדקה 3:29: הרגע שבו מתברר לשלי שהיא כבר לא יכולה לשחק בקבוצה עם הבנים — לפני שהיא
                מחליטה מה לעשות. רשמי כאן את הזמן.
              ask: מה הייתם עושים במקום שלי?
          alt: דמות עומדת, ודגל של קבוצה לידה
          art:
            - {use: flag, x: 300, y: 177, w: 240}
            - {use: kid-stand, x: 110, y: 190, w: 140, color: orange}
      - ask: האם בנים ובנות יכולים לעשות הכול? במה דומים? במה שונים? האם שווים?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ארבעת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - קיימת שונות בחברה וקיימות עמדות שונות כלפי מגדר ותפיסות שונות של המושגים גבריות ונשיות.
            - >-
              השונות מאפשרת לכולנו להתפתח, ללמוד ולהעשיר את עולמנו, ומאפשרת גם לנו להיות שונים ולהתאמן בקבלת האחר
              ובפיתוח נקודות מבט רחבות יותר על העולם.
            - >-
              כיום, מתנהל שיח ציבורי נרחב המערער על התפיסות המסורתיות. מגדר נתפס לפעמים כאמת מוחלטת – חשוב שנפתח
              מודעות לעמדות שלנו, נשים סימני שאלה ונזכור כי העמדות שלנו יכולות להשתנות.
            - >-
              נגלה כבוד וסובלנות כלפי עמדות ותפיסות, גם אם הן שונות מהעמדות שלנו, כדי שכולנו נוכל להרגיש שייכים,
              מוגנים ובטוחים.
          ask: איזה משפט מהארבעה הכי חשוב לכם לזכור? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהשונות שבחברה (1–2), דרך סימני השאלה על העמדות שלנו (3), אל הכבוד לעמדה שונה (4) — מה
            שתרגלו על הקו.
          alt: שלוש דמויות שונות עומדות יחד
          art: group3

