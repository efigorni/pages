  # ------------------------------------------------------------------ +5′
  - id: live
    title: לייב עם הדמויות
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - דיפרנציאליות וגיוון
    summary: שני ראיונות ״לייב״ עם הדמויות; הכיתה מקשיבה — לאיזו דמות התחברו, ולאיזו לא
    body:
      - slide:
          kicker: אם נשאר זמן · לייב
          title: לייב עם…
          sub: ראיון עם הדמויות שתיארתם — דקה וחצי לכל ראיון.
          alt: שתי דמויות, ובועת דיבור ביניהן ובתוכה מצלמה
          art:
            - {use: kid-stand, x: 395, y: 190, w: 150, color: teal}
            - {use: kid-stand, x: 75, y: 190, w: 150, color: orange}
            - {use: speech, x: 200, y: 30, w: 220}
            - {use: camera, x: 260, y: 64, w: 100}
      - moves:
          - >-
            הזמיני שני זוגות מתנדבים — מראיין ומרואיין — אחד לכל דמות. המרואיין מציג את הדמות כמו שהקבוצה שלו
            תיארה אותה.
          - תני לכל מראיין את דף השאלות. הוא בוחר שלוש–ארבע שאלות.
          - אחרי שני הראיונות — שאלי לאיזו דמות התחברו ולאיזו לא, והזמיני את הכיתה להגיב זה לזה.
      - say: מי שמקשיב — שימו לב מה בתיאור של הדמות מפתיע אתכם, ומה מוכר לכם.
      - task:
          what: >-
            שני ראיונות קצרים, אחד לכל דמות: המראיין שואל מהדף, והמרואיין עונה כמו הדמות שהקבוצה שלו תיארה. כל
            השאר מקשיבים.
          time: דקה וחצי לכל ראיון
          group: שני זוגות מתנדבים מול הכיתה; כל השאר מקשיבים
          rules: מציגים רק מתנדבים, ורק את הדמות — לא את עצמם; מחיאות כפיים בסוף, בלי הערות על המציגים
          plenary: לאיזו דמות התחברתם — ולאיזו לא?
          help: בחרו שאלה אחת מהדף שהכי מעניין אתכם לשמוע עליה.
          challenge: שאלו את הדמות שאלה שאין בדף — כזאת שתבדוק אם היא באמת כמו שתיארו אותה.
      - handout:
          title: ראיון לדוגמה
          copies: שני עותקים — אחד לכל מראיין
          verbatim: true
          lines: false
          items:
            - מהו סגנון הלבוש הייחודי שלך – מה מאפיין אותו?
            - מהם התחביבים שלך? תחומי העיסוק העיקריים שלך?
            - איך נראית שגרת היום שלך?
            - מה את/ה אוהב/ת לעשות בזמנך הפנוי?
            - מה מאפיין אותך?
            - אלו ערכים חשובים לך במיוחד בחברות?
            - מה מכעיס אותך? מה מרגש אותך?
            - מוזיקה מועדפת
            - מהם החלומות שלך לעתיד?
      - ask: לאיזו דמות התחברתם? לא התחברתם? אילו רגשות, מחשבות ושאלות עלו בכם?

