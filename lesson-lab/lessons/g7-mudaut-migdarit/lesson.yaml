sub: >-
  מי מחליט מה גברי ומה נשי? בשיעור הזה מתארים דמות שיודעים עליה רק אם היא אישה או גבר, עומדים על הקו מול
  היגדים על בנים ובנות, ומגלים מה מסתתר במילה ׳מגדר׳.
format: קבוצות, עמידה על קו ומליאה
question: מאיפה באות הציפיות שלנו מבנים ומבנות — ולמה כדאי לשים עליהן סימני שאלה?
takeaways:
  - מין הוא הבחנה ביולוגית; מגדר הוא מה שהחברה מצפה מנשים ומגברים — ואת זה אפשר לבחון.
  - העמדות שלנו נבנות מהערכים, מהמשפחה, מהחברים, מהמדיה ומהתפקידים בחברה — לפעמים בלי שנשים לב.
  - יש עמדות שונות כלפי מגדר; מכבדים גם עמדה שונה משלנו, כדי שכולם ירגישו שייכים ובטוחים.
prep:
  - >-
    שתי הצלליות של המקור — אישה וגבר — מודפסות מהמצגת המקורית של שפ״י (שקף 9 או 10 שם; הקישור בתחתית
    המערך): תמונה אחת לכל קבוצה, חצי מהקבוצות אישה וחצי גבר
  - חלוקה מראש לארבע עד שש קבוצות לפי השולחנות, ודף ריק לכל קבוצה
  - קו ארוך של נייר דבק על רצפת הכיתה, ושלט בכל קצה — ״מסכימים לגמרי״ ו״לא מסכימים בכלל״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מגדר, סטריאוטיפים ועמידה על הקו. שאלי אם יש בכיתה מי שהנושא קרוב אליו
      במיוחד: מי שמתלבט בזהות שלו, מי שספג הערות על המראה או על כך שהוא ״לא מתנהג כמו בן״ או ״לא מתנהגת כמו
      בת״, או מי שבבית שלו הנושא טעון. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהמראה, הבגדים או התחביבים שלו לא תואמים את הציפיות עלול להפוך למטרה. לכן מתארים רק את הדמות
      שבתמונה — אף פעם לא תלמיד מהכיתה — וההיגדים על הקו לא מצביעים על אף אחד. ותלמידים מבתים שמרניים
      צריכים לשמוע שגם העמדה שלהם לגיטימית, כשהיא נאמרת בכבוד.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מדברים על עמדות, לא על אנשים — ומספרים רק על עצמנו״. מותר לוותר, ולא קוראים בשם
      למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל הצקות או חרם בגלל המראה או הזהות — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.
  - head: עמידה מול הכיתה
    text: >-
      על הקו עומדים לפי מה שחושבים, וכל עמדה לגיטימית — שמרנית ושוויונית כאחת. מותר לעמוד באמצע; מנמקים רק
      מתנדבים, ורק בשם עצמם. אם אחד ההיגדים קרוב מדי לתלמיד מסוים בכיתה — דלגי עליו. צחוק על המקום של מישהו
      על הקו — עוצרים מיד.

