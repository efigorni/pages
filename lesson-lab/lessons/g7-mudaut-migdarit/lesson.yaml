steps:
  # ------------------------------------------------------------------ 0′–9′
  - id: who
    title: מי אני?!
    minutes: 9
    practices:
      - מה הקשר?
      - הוצאה למשימה
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      בקבוצות — כל קבוצה מקבלת צללית של דמות וכותבת מי היא; המאפיינים עולים ללוח, בטור של כל דמות
    body:
      - slide:
          kicker: מי אני?! · בקבוצות
          title: מי הדמות שקיבלתם?
          sub: כתבו עליה הכול — מה היא עושה, מה היא אוהבת, על מה היא חולמת.
          timer: 300
          echo: true
          alt: צללית של דמות, ובועת דיבור עם סימן שאלה
          art:
            - {use: kid-stand, x: 340, y: 140, w: 185, color: ink}
            - {use: speech, x: 70, y: 40, w: 260}
            - text: '?'
              x: 200
              y: 126
              size: 110
      - moves:
          - הסבירי את המשימה לפני שמחלקים את התמונות; השקף נשאר על המסך כל הזמן.
          - >-
            חלקי לכל קבוצה תמונה אחת — חצי מהקבוצות את האישה, חצי את הגבר. אל תספרי עליה דבר; הקבוצה מחליטה מי
            היא.
          - הסתובבי בין הקבוצות. דקה לפני הסוף — בקשי מכל קבוצה לסמן ארבעה מאפיינים בולטים.
          - >-
            שרטטי על הלוח שני טורים, אחד לכל דמות, ורשמי בכל טור את המאפיינים שהקבוצות מקריאות — בלי הערות בשלב
            הזה.
      - say: >-
          כל קבוצה מקבלת דמות. אתם לא יודעים עליה כלום — אתם מחליטים מי היא. כתבו עליה כמה שיותר.
      - task:
          what: >-
            כל קבוצה כותבת תיאור של הדמות שקיבלה: עיסוק, מה היא אוהבת, תחביבים, תכונות אופי, ערכים, חברים, לבוש,
            מוזיקה, חלומות לעתיד, מה מכעיס אותה ומה מרגש אותה, ואיך נראה היום שלה.
          time: 5 דקות
          group: ארבע עד שש קבוצות לפי השולחנות; דמות אחת לכל קבוצה
          rules: כותב אחד, וכולם מציעים; כל רעיון נרשם — אין תשובה לא נכונה
          plenary: כל קבוצה מקריאה ארבעה מאפיינים, והם נרשמים על הלוח בטור של הדמות
          help: מה הדמות עושה כשהיא קמה בבוקר — ומה היא עושה אחרי הצהריים?
          challenge: מה הדמות הייתה רוצה לשנות בחיים שלה — ולמה?
      - say: תסתכלו על שני הטורים שעל הלוח. מה אתם רואים?

  # ------------------------------------------------------------------ 9′–14′
  - id: decide
    title: מי מחליט מה גברי ומה נשי?
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      מסתכלים על שני הטורים — מה השפיע על התיאור, ומי מחליט מה גברי ומה נשי; ומה מעצב את העמדות שלנו
    body:
      - slide:
          kicker: מסתכלים על הלוח
          title: מה השפיע על ההחלטה כיצד לתאר את הדמויות?
          sub: מי מחליט מה נחשב גברי ומה נחשב נשי?
          verbatim: true
          echo: true
          alt: לוח, ועליו שני פתקים — אחד לכל דמות
          art:
            - {use: board, x: 110, y: 110, w: 400}
            - {use: sticky, x: 175, y: 172, w: 110, color: orange}
            - {use: sticky, x: 335, y: 172, w: 110, color: teal}
      - moves:
          - >-
            הצביעי על שני הטורים, ושאלי מה השפיע על ההחלטה כיצד לתאר את הדמויות. ספרי בלב עד עשר לפני שאת מזמינה
            תשובות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב לה — ״מי חושב אחרת?״.
          - שאלי מי מחליט מה נחשב גברי ומה נחשב נשי, והציגי את השקף ״מה מעצב את העמדות שלנו?״.
          - תני תוקף לכל מה שעולה, גם לעמדות שמרניות — ובקשי שכל עמדה תיאמר בכבוד.
      - whisper: >-
          תשובות שעולות בדרך כלל: לפי משהו מוכר, לפי מה שהייתי רוצה להיות, דמות מוכרת, דווקא הפוך ממה שמצופה,
          מתוך רצון לשבור סטריאוטיפים.
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי חושב אחרת? למה?
      - slide:
          kicker: העמדות שלנו
          title: מה מעצב את העמדות שלנו?
          sub: ערכים, משפחה, חברים, מדיה ותפקידים חברתיים.
          cue: אחרי כמה תשובות —
          alt: ״עמדות״ במרכז, ומסביב ערכים, משפחה, חברים, מדיה ותפקידים חברתיים
          art: {file: art/attitudes.svg}
      - say: >-
          העמדות שלנו נבנות מכל אלה — ולפעמים אנחנו בכלל לא שמים לב אליהן. בואו נבדוק איפה כל אחד מאיתנו עומד.

  # ------------------------------------------------------------------ 14′–21′
  - id: line
    title: מסכים או לא מסכים?
    minutes: 7
    stance: true
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: ארבעה היגדים על בנים ובנות; כל אחד נעמד על הקו לפי כמה הוא מסכים, ומתנדב מכל צד מנמק
    body:
      - slide:
          kicker: מסכים או לא מסכים? · על הקו
          title: איפה אתם עומדים?
          sub: קצה אחד — מסכימים לגמרי. הקצה השני — לא מסכימים בכלל.
          echo: true
          alt: קו על הרצפה, אגודל למעלה בקצה אחד ואגודל למטה בשני, ודמות עומדת עליו
          art: {file: art/agree-line.svg}
      - moves:
          - >-
            הכיתה קמה ונעמדת לאורך הקו. הראי את שני הקצוות, ואמרי שגם כל נקודה באמצע היא תשובה. בכיתה צפופה —
            עשרה תלמידים אחרים בכל היגד, והשאר מצביעים מהמקום.
          - הקריאי היגד, וחכי חמש שניות של שקט לפני שזזים.
          - כשכולם במקום, שאלי מתנדב אחד מכל צד למה בחר במקום שלו. תני תוקף לכל עמדה.
          - אחרי ההיגד הרביעי — שאלת סיכום, וחוזרים למקומות.
      - say: >-
          לפני כל היגד חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז זזים. אין תשובה נכונה, מותר לעמוד
          באמצע, ומדברים רק בשם עצמנו.
      - slide:
          kicker: היגד 1
          title: בנים באקס בוקס ובנות בטיק טוק
          verbatim: true
          echo: true
          cue: אחרי ההסבר —
          alt: מחשב נייד וטלפון
          art:
            - {use: laptop, x: 250, y: 170, w: 320}
            - {use: phone, x: 70, y: 196, w: 120}
      - slide:
          kicker: היגד 2
          title: גברים לא בוכים
          verbatim: true
          echo: true
          cue: ההיגד הבא —
          alt: פנים עצובות עם דמעה
          art: face-sad
      - slide:
          kicker: היגד 3
          title: בנות פחות טובות בספורט
          verbatim: true
          echo: true
          cue: ההיגד הבא —
          alt: מטרה עם חץ באמצע, ודמות מרימה יד
          art:
            - {use: target, x: 50, y: 140, w: 270}
            - {use: kid-hand, x: 380, y: 150, w: 165, color: orange}
      - slide:
          kicker: היגד 4
          title: חשוב לי שבמבחנים ובעבודות, לשון הפנייה תהיה לגברים ולנשים
          verbatim: true
          echo: true
          cue: ההיגד האחרון —
          alt: דף מבחן ועיפרון
          art:
            - {use: note, x: 240, y: 90, w: 240}
            - {use: pencil, x: 60, y: 262, w: 180}
      - ask: מה הבנתם מהפיזור על הקו? מי רוצה להגיב למשהו שנאמר?
      - say: שמענו עמדות שונות — וזה בסדר. עכשיו בואו נבין מה בעצם אומרת המילה ׳מגדר׳.

  # ------------------------------------------------------------------ 21′–27′
  - id: fence
    title: גדר והגדרה
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      מה מסתתר במילה ׳מגדר׳ — גדר והגדרה; ההבחנה בין מין למגדר; ושמים סימני שאלה על ההיגדים
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה זה מגדר?
          sub: בתוך המילה מגדר נמצאות המילים ״גדר״ ו״הגדרה״.
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          verbatim:
            - title
            - sub
          echo: true
          alt: גדר, וספר פתוח לידה
          art: {file: art/fence-book.svg}
      - moves:
          - הציגי את השקף, ושאלי מה המשמעות של גדר ושל הגדרה בהקשר של מגדר. חצי דקה לבד, דקה בזוגות.
          - >-
            שמעי שלושה–ארבעה זוגות, ורשמי על הלוח מה גדר והגדרה עושות — במה הן עוזרות, ובמה הן מקשות.
          - הקריאי את ההבחנה בין מין למגדר.
          - הציגי שוב ארבעה מההיגדים, הפעם עם סימני שאלה, ושאלי למה חשוב לשים אותם.
      - say: >-
          חצי דקה לבד, ואז ספרו לשכן: מה גדר עושה, מה הגדרה עושה — ומה זה אומר על המילה ׳מגדר׳?
      - ladder:
          help: מה גדר עושה בחצר של בית — ומה קורה למי שרוצה לעבור אותה?
          challenge: תנו דוגמה להגדרה של ׳גברי׳ או ׳נשי׳ שהתאימה פעם — ואולי היום כבר לא.
      - whisper: >-
          גדר תוחמת, מפרידה ועוזרת לשמור — אבל גם מקשה לעבור במקום שבו היא כבר לא מתאימה. הגדרה עוזרת לסדר את
          העולם ולהבין אותו — אבל לפעמים כופים אותה גם על מי שלא מתאים לה, והיא נשארת גם כשהזמנים משתנים.
      - slide:
          kicker: הבחנה בין מין למגדר
          title: מין ומגדר — מה ההבדל?
          points:
            - מין — הבחנה ביולוגית בין זכר לנקבה
            - מגדר — אמונות וציפיות של החברה, איך נשים וגברים ׳צריכים׳ להיראות ולהתנהג
          echo: true
          cue: אחרי השיתוף במליאה —
          alt: דמות במרכז, ומשני צדיה בועות דיבור עם סימני קריאה
          art:
            - {use: kid-stand, x: 230, y: 200, w: 160, color: teal}
            - {use: speech, x: 30, y: 40, w: 200}
            - {use: speech-l, x: 390, y: 40, w: 200}
            - text: '!'
              x: 130
              y: 106
              size: 90
