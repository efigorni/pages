steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: icecream
    title: רגע של גלידה
    minutes: 6
    practices:
      - מה הקשר?
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      שאלה מפתיעה על גלידה בחופש; כל אחד כותב את טעמי החופשה שלו, ואחרי הנחיות השיח שומעים מה המתיק לנו
      אותה
    body:
      - slide:
          kicker: מה הקשר? · רגע של גלידה
          title: למי יצא לאכול גלידה בחופשת הקיץ?
          sub: עם מי? מתי? איפה? איזו גלידה?
          verbatim: [title, sub]
          echo: true
          alt: גביע גלידה, ושמש של קיץ לידו
          art: {file: art/summer.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי, ושמעי שניים־שלושה רגעים קצרים — עם מי, איפה, איזו גלידה.
          - עברי לשקף הטעמים. דקה וחצי של כתיבה במחברת, בשקט.
          - לפני שמשתפים — הציגי את הנחיות השיח, והקריאי אותן.
          - שמעי שלושה–ארבעה — מה המתיק להם את החופשה. מי שרוצה, מספר גם על טעם חמוץ.
      - ask: למי יצא לאכול גלידה בחופשת הקיץ — עם מי, איפה, ואיזו גלידה?
      - slide:
          kicker: כולם כותבים · דקה וחצי
          title: אם החופשה שלכם הייתה גלידה — אילו טעמים היו בה?
          sub: כתבו שלושה — מתוקים, חמוצים, מה שהיה. וסמנו משהו שהמתיק לכם את החופשה.
          timer: 90
          echo: true
          cue: אחרי שניים־שלושה רגעים של גלידה —
          alt: כוס גלידה עם שלושה כדורים בשלושה צבעים
          art: {file: art/flavors.svg}
      - ladder:
          help: חשבו על רגע אחד מכל חודש בחופשה — איזה טעם היה לו?
          challenge: תנו לטעם הכי מיוחד שלכם שם משלו — ומה עשה אותו לכזה?
      - slide:
          kicker: לפני שמשתפים
          title: הנחיות לשיח מיטבי
          sub: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          cue: אחרי הכתיבה —
          alt: שתי דמויות יד ביד, ובועת דיבור עם לב מעליהן
          art:
            - {use: pair, x: 60, y: 250, w: 250}
            - {use: speech-l, x: 290, y: 40, w: 280}
            - {use: heart, x: 370, y: 74, w: 120}
      - ask: מה המתיק לכם את החופשה?
      - say: ועכשיו — לגלידה מסוג אחר. כזאת שמקבלים רק בשנה השלישית.

  # ------------------------------------------------------------------ 6′–15′
  - id: third
    title: פעם שלישית גלידה!
    minutes: 9
    practices:
      - זמן חשיבה
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      מה אומר הביטוי, ומאיפה הגיע; ואז שני צדדיו — מה לא השתנה בשלוש השנים וטוב לנו כך, ומה היינו רוצים
      שיהיה אחרת: לבד, בזוגות, במליאה
    body:
      - slide:
          kicker: מתחילים שנה שלישית בחטיבה
          title: פעם שלישית גלידה!
          sub: מתי משתמשים בביטוי הזה — ומה הוא אומר?
          verbatim: [title]
          echo: true
          alt: גביע גלידה גבוה עם שלושה כדורים, אחד על השני, ושני כוכבים
          art: {file: art/three.svg}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות. שמעי שתיים־שלוש.
          - ספרי בקצרה מאיפה הביטוי הגיע, וברכי את הכיתה על פתיחת השנה השלישית בחטיבה.
          - >-
            הציגי את שני הצדדים של הביטוי, והקריאי את שניהם. חצי דקה לבד — כל אחד כותב דבר אחד לכל צד; ושתי
            דקות עם השכן.
          - הזכירי שב״צרחה״ מדברים על מצבים ועל דברים, לא על אנשים — ובלי שמות.
          - במליאה — שמעי זוג אחד על ״גלידה״ וזוג אחד על ״צרחה״.
      - ask: מתי אתם משתמשים בביטוי ׳פעם שלישית גלידה׳ — ומה הוא אומר?
      - tip: >-
          מאיפה הביטוי? לפי רוביק רוזנטל (״הזירה הלשונית״), המקור הקרוב ביותר הוא ביטוי באנגלית: באנגלית
          הבריטית אומרים אחרי שתי פגישות או שני ניסיונות שלא עלו ״בפעם השלישית יתמזל מזלנו״, ובאמריקאית — ״בפעם
          השלישית יתרחש הקסם״. והגלידה? ייתכן שהשפיע ביטוי אחר — ״אם אראה אותך עוד פעם, אצרח!״ — ומשחק המילים
          ״איי סקרים״ (אני צורח) — ״אייס קרים״ (גלידה).
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: גלידה — או צרחה?
          sub: הביטו על הכיתה, על בית הספר ועל עצמכם.
          points:
            - גלידה! משהו שלא השתנה בשלוש השנים — וטוב לכם שכך.
            - צרחה! משהו שלא השתנה — ושהשנה תעדיפו שיתנהל מעט אחרת.
          verbatim: [sub]
          timer: 120
          echo: true
          cue: אחרי הברכה —
          alt: מימין גביע גלידה, ומשמאל דמות שצועקת בבועת דיבור
          art: {file: art/two-sides.svg}
      - quote:
          title: גלידה — להקריא
          text: >-
            איזה כיף, חייבים לחגוג את זה. הביטו על הכיתה, על בית הספר ועל עצמכם וחשבו על דברים בכם או סביבכם
            שלא השתנו במשך שלוש השנים, וטוב לכם שכך הדבר.
      - quote:
          title: צרחה — להקריא
          text: >-
            עוד פעם אחת ואתחיל לצרוח. הביטו על הכיתה, על בית הספר ועל עצמכם וחשבו על דברים בכם או סביבכם שלא
            השתנו במשך שלוש השנים, ושהשנה תעדיפו שיתנהלו מעט אחרת.
      - ladder:
          help: התחילו ממשהו קטן — המקום שלכם בכיתה, ההפסקה, הדרך לבית הספר.
          challenge: מצאו דבר אחד שהוא גם ׳גלידה׳ וגם ׳צרחה׳ — ולמה?
      - ask: מה כתבתם לכל צד — ומה יצא בשיחה עם השכן?
      - say: >-
          שמענו גם ׳גלידה׳ וגם ׳צרחה׳ — ושניהם בסדר. ומה קורה לנו, בכלל, כשחוזרים לאותו מקום בפעם השלישית?

  # ------------------------------------------------------------------ 15′–20′
  - id: again
    title: המפגש החוזר
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      דיון במליאה — מה קורה לנו במפגש החוזר, ומה היתרון בלהכיר אנשים לאורך זמן; מקום גם למי ששמח בשגרה וגם
      למי שרוצה שינוי
    body:
      - slide:
          kicker: במליאה
          title: מה קורה לכם במפגש החוזר עם בית הספר, הכיתה והלמידה?
          sub: מה היתרון בלהכיר אנשים לאורך זמן ולהיפגש עמם שוב ושוב?
          verbatim: true
          echo: true
          alt: בית ספר, ושלוש דמויות נפגשות לפניו
          art:
            - {use: school, x: 290, y: 40, w: 300}
            - {use: group3, x: 40, y: 280, w: 320}
      - moves:
          - שאלי את השאלה הראשונה, וחכי עשר שניות לפני שאת מזמינה תשובות.
          - >-
            על כל תשובה — הדהדי, ושאלי מי מרגיש אחרת. תני תוקף לשני הצדדים: למי ששמח בשגרה ונהנה מהקביעות, ולמי
            שמרגיש צורך בשינוי.
          - עברי לשאלה השנייה, ורשמי על הלוח שתיים־שלוש תשובות.
          - שימי לב למי שמתקשה לדבר על המפגש החוזר, ואל תלחצי — בכרטיס היציאה תהיה לו שורת רשות.
      - say: אז בשבילך דווקא מה שלא משתנה הוא מה שטוב — הבנתי נכון? ומי מרגיש דווקא שחסר לו משהו חדש?
      - ask: ומה היתרון בלהכיר אנשים לאורך זמן, ולהיפגש איתם שוב ושוב?
      - say: >-
          שתי התחושות יכולות להופיע בבת אחת: השמחה במוכר, לצד השמחה במה שמתחדש. חשוב לתת מקום לשתיהן — ועכשיו
          נבנה משהו לשנה שלנו, יחד.

  # ------------------------------------------------------------------ 20′–27′
  - id: together
    title: בחרי מסלול — השנה שלנו יחד
    minutes: 7
    summary: רשימה כיתתית לשנה השלישית, על הלוח
    body:
      - tracks:
          - title: טודו ליסט כיתתי
            text: >-
              בקבוצות מציעים דברים שנרצה לעשות השנה יחד, ככיתה. הפתקים עולים ללוח, וכל אחד מצביע על שלושה.
            when: הכיתה אוהבת לתכנן ולעשות, ויש על הקיר מקום לרשימה שתישאר שם.
            practices:
              - הוצאה למשימה
            spotlights:
              - אחריות ובחירה
              - שיתופיות בלמידה
            prep:
              - פתקים — שלושה לכל קבוצה — ונייר דבק
            body:
              - slide:
                  kicker: טודו ליסט · בקבוצות
                  title: מה נרצה לעשות השנה יחד, ככיתה?
                  sub: שלושה רעיונות לקבוצה — כל רעיון על פתק.
                  timer: 180
                  echo: true
                  alt: לוח, ועליו שני פתקים וסימן וי
                  art:
                    - {use: board, x: 110, y: 90, w: 400}
                    - {use: sticky, x: 150, y: 140, w: 100}
                    - {use: sticky, x: 270, y: 158, w: 100, color: teal}
                    - {use: check, x: 390, y: 140, w: 100}
              - moves:
                  - חלוקה לקבוצות של ארבעה לפי השולחנות. הסבירי, וחלקי שלושה פתקים לכל קבוצה.
                  - הסתובבי בין הקבוצות. דקה לפני הסוף — הודיעי.
                  - >-
                    כל קבוצה מקריאה את הפתקים ותולה אותם על הלוח; רעיון שחוזר — מצטרף לפתק שכבר שם. אחר כך הצבעה
                    בהרמת יד — כל אחד מצביע על שלושה רעיונות.
              - say: כתבו דברים שאפשר באמת לעשות השנה, ושכל הכיתה יכולה להשתתף בהם.
              - task:
                  what: כל קבוצה מציעה שלושה דברים שנרצה לעשות השנה יחד, ככיתה — כל רעיון על פתק.
                  time: 3 דקות בקבוצות, ועוד 3 לקריאה ולהצבעה
                  group: קבוצות של ארבעה, לפי השולחנות
                  rules: רעיון שכל הכיתה יכולה להשתתף בו, ושאפשר באמת לעשות השנה
                  plenary: הפתקים עולים ללוח, וכל אחד מצביע על שלושה
                  help: חשבו על משהו שעשיתם יחד בשנים הקודמות ונהניתם — או משהו שעוד לא יצא לכם לעשות.
                  challenge: הציעו רעיון שתורם גם למישהו מחוץ לכיתה — לשכבות הצעירות, או לבית הספר.
              - ask: אילו שלושה רעיונות מהלוח הכי הייתם רוצים שיקרו? הצביעו.
          - title: טוב לי בט׳
            text: >-
              כל אחד כותב שני דברים משמחים בעצם היותו תלמיד כיתה ט׳, ובסבב מהיר נבנית על הלוח רשימה כיתתית.
            when: הכיתה צריכה חיזוק בפתיחת השנה, ושיחה קלה ושמחה מתאימה לה יותר מתכנון.
            practices:
              - כולם כותבים
            spotlights:
              - עניין ורלוונטיות
              - שיתופיות בלמידה
            body:
              - slide:
                  kicker: טוב לי בט׳ · כולם כותבים
                  title: מה משמח בעצם היותנו תלמידי כיתה ט׳?
                  sub: כתבו שניים — ואחר כך כל אחד אומר אחד.
                  timer: 90
                  echo: true
                  alt: פנים שמחות גדולות, וכוכב לידן
                  art:
                    - {use: face-happy, x: 260, y: 100, w: 300}
                    - {use: star, x: 70, y: 70, w: 160}
              - moves:
                  - דקה וחצי של כתיבה בשקט, במחברת.
                  - >-
                    סבב מהיר לאורך השורות — כל אחד אומר דבר אחד, בלי הסבר. מותר לומר ״עובר״. רשמי על הלוח, ולצד
                    דבר שחוזר — סמני קו.
                  - שאלי מה רואים על הלוח, ושמעי שתיים־שלוש תשובות.
              - ladder:
                  help: חשבו על דבר קטן ביום רגיל בכיתה ט׳ — חבר, הפסקה, שיעור — שעושה לכם טוב.
                  challenge: מה מהרשימה תלוי בנו — ואיך נשמור עליו כל השנה?
              - ask: תסתכלו על הלוח — מה הכי מפתיע ברשימה שלנו?
      - say: מה שעל הלוח הוא של כולנו — ככה מתחילה כיתה ט׳ את השנה השלישית, יחד.

  # ------------------------------------------------------------------ +5′
  - id: unique
    title: המקום הייחודי שלנו
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: לבד, בזוגות ובמליאה — איזה מקום ייחודי יש לנו כשכבה הבוגרת, ולאן נרצה לקחת אותו
    body:
      - slide:
          kicker: אם נשאר זמן · לבד, בזוגות, במליאה
          title: איזה מקום ייחודי אתם מרגישים שיש לכם כשכבה הבוגרת בבית הספר
          sub: ולאן תרצו למנף זאת?
          verbatim: true
          echo: true
          alt: הר, ודגל על הפסגה
          art:
            - {use: mountain, x: 120, y: 200, w: 380}
            - {use: flag, x: 344, y: 100, w: 120}
      - moves:
          - שאלי, ותני חצי דקה לחשוב לבד.
          - דקה וחצי בזוגות — כל זוג מוצא מקום אחד, ולאן אפשר לקחת אותו.
          - במליאה — שמעי ארבעה–חמישה זוגות, ורשמי על הלוח במילה או שתיים.
      - ladder:
          help: מה אפשרי בבית הספר רק לכיתות ט׳ — ומה השכבות הצעירות רואות כשהן מסתכלות עליכם?
          challenge: בחרו מקום אחד, והציעו צעד אחד שאפשר לעשות כבר החודש.
      - ask: איזה מקום ייחודי יש לנו — ולאן נרצה לקחת אותו השנה?
      - say: אז מה שאתם מציעים זה ___ — הבנתי נכון? מי רוצה להוסיף?

  # ------------------------------------------------------------------ +5′
  - id: year
    title: מה מחכה לנו השנה?
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כל אחד כותב נושא אחד שחשוב לו שידברו עליו השנה בשיעורים האלה, ושומעים על הנושאים המרכזיים של השנה
    body:
      - slide:
          kicker: אם נשאר זמן · הכ״חות שבדרך
          title: מה מחכה לנו השנה?
          sub: כתבו נושא אחד שחשוב לכם שנדבר עליו השנה בשיעורים האלה.
          timer: 60
          echo: true
          alt: דרך מתפתלת אל האופק, ולוח שנה לידה
          art:
            - {use: road, x: 210, y: 140, w: 370}
            - {use: calendar, x: 40, y: 300, w: 170}
      - moves:
          - דקה של כתיבה בשקט.
          - סבב מהיר — מי שרוצה אומר את הנושא שלו. רשמי על הלוח, ולצד נושא שחוזר — סמני קו.
          - >-
            ספרי בקצרה על הנושאים המרכזיים של השיעורים האלה השנה — למשל פיתוח חוסן אישי ורווחה נפשית, וחיזוק
            תחושת השייכות — וחברי אותם לנושאים שעל הלוח.
      - ladder:
          help: חשבו על שיחה מהשנים הקודמות בשיעורים האלה שנשארה איתכם — על מה היא הייתה?
          challenge: כתבו גם למה דווקא השנה, בכיתה ט׳, חשוב לדבר על זה.
      - ask: על מה חשוב לכם שנדבר השנה?
      - say: אז חשוב לך שנדבר על ___ — הבנתי נכון? למי עוד זה חשוב?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ארבעת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - בהתחלות חדשות טמונה הזדמנות להיכרויות חדשות ולהתנסויות שונות.
            - בהתחלות חדשות אפשר גם לחפש את המוכר, הידוע והאהוב.
            - >-
              בכל מקום ובכל תפקיד אנחנו יכולים לתרום לעצמנו ולקהילה (למשל, כתלמידי כיתה ט׳ נוכל לתרום לבית
              הספר).
            - בכל מקום ובכל תפקיד יש לנו הזדמנות לביטוי אישי ולהגשמת חלומות.
          ask: >-
            איזה משפט מהארבעה הכי מתאים לכם בפתיחת השנה השלישית? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            שני המסרים הראשונים הם שני צדי השיעור — החדש והמוכר. השניים האחרונים מדברים על המקום של כיתה ט׳ — לתרום,
            ולהגשים.
          alt: שתי ידיים מושטות זו לזו, וכוכב מעליהן
          art:
            - {use: hands-help, x: 190, y: 170, w: 340}
            - {use: star, x: 70, y: 40, w: 150}

