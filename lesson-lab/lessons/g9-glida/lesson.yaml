sub: >-
  מתחילים שנה שלישית בחטיבה — פעם שלישית גלידה! בשיעור הזה טועמים שוב את החופשה, בודקים מה טוב לנו במוכר
  ומה היינו רוצים לחדש, ובונים יחד רשימה לשנה שלנו ככיתה ט׳.
format: מליאה, זוגות וקבוצות
question: מה טוב לנו במוכר, ומה נרצה לחדש בשנה השלישית?
takeaways:
  - בהתחלה חדשה יש מקום גם למוכר ולאהוב וגם להיכרויות ולהתנסויות חדשות — ואפשר לשמוח בשניהם.
  - להכיר אנשים לאורך זמן ולפגוש אותם שוב ושוב — זה יתרון.
  - לכיתה ט׳ יש מקום ייחודי בבית הספר — הזדמנות לתרום, לבטא את עצמנו ולהגשים חלומות.
