  - id: exit
    title: כרטיס יציאה — מסכמים שיעור
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
    summary: משהו מוכר שטוב לי ומשהו חדש שאנסה, ומה אוכל לתרום השנה, ושורת רשות למורה; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: מסכמים שיעור
          prompts:
            - משהו מוכר שטוב לי שנשאר — ומשהו חדש שאנסה השנה.
            - משהו שאוכל לתרום השנה, בכיתה ט׳ — לכיתה או לבית הספר.
            - רשות — משהו שחשוב לי שהמורה תדע על הפתיחה של השנה.
          look_for: >-
            חפשי פתקים בלי ״משהו מוכר שטוב לי״, ומה כתוב בשורת הרשות — אלה אולי מתקשים במפגש החוזר. איתם מדברים
            בשקט השבוע, ומה שנוגע בפגיעה עובר ליועצת עוד היום. ובשאלה השנייה — מי כבר רואה במה יוכל לתרום, ומי עוד
            לא.
          timer: 180
          alt: דף עם שורות, ודלת פתוחה לידו
          art:
            - {use: note, x: 280, y: 40, w: 250}
            - {use: door, x: 40, y: 180, w: 220}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
