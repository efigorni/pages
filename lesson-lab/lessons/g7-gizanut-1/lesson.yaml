    summary: כל אחד בוחר פתיח אחד ומשלים אותו בלב; חמישה אומרים בקול
    body:
      - slide:
          kicker: אם נשאר זמן · מסכמים שיעור
          title: בחרו משפט אחד והשלימו אותו
          points:
            - משהו שריגש אותי…
            - משהו שהפתיע אותי…
            - משהו חדש שלמדתי היום…
            - מה אני רוצה לקחת איתי הלאה?
