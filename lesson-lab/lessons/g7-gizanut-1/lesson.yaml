steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: name
    title: מה הסיפור של השם שלכם?
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית קצרה — למה קוראים לי כך, ומה השם מסמל בשבילי; שומעים שלושה–ארבעה
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: למה קוראים לכם בשם שלכם?
          sub: ומה השם שלכם מסמל בשבילכם?
          timer: 180
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובו ״השם שלי״
          art:
            - {use: kid-desk, x: 300, y: 146, w: 280, color: teal}
            - {use: thought, x: 150, y: 36, w: 240}
            - text: השם שלי
              x: 273
              y: 132
              size: 40
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת. מתיישבים וכותבים — בלי הסבר נוסף.
          - >-
            בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש–ארבע תשובות שונות זו מזו: גאווה,
            מבוכה, שם שיש מאחוריו סיפור משפחתי.
          - >-
            לפני השיתוף — הזכירי את כלל השיח: ״מה שנאמר כאן נשאר כאן, ומספרים רק על עצמנו״. אחר כך הזמיני
            את מי שסימנת לשתף — רק אם הוא מסכים.
      - say: שלוש דקות, לבד ובשקט. כתבו את הסיפור של השם שלכם — מי בחר אותו, ולמה.
      - ladder:
          help: מי בחר את השם שלכם — ומה סיפרו לכם על הבחירה?
          challenge: מה השם שלכם מספר על המשפחה, או על המקום שממנו באתם?
      - ask: מי מוכן לספר את הסיפור של השם שלו — ומה הוא מרגיש כלפיו?
      - whisper: >-
          גאווה, מבוכה, כעס על הבחירה — כולן תשובות. כשעולה רגש מעורב כלפי השם, אמרי שזה מוכר לרבים.
      - say: >-
          לכל אחד מאיתנו יש סיפור. וכדי באמת לשמוע סיפור של מישהו אחר — צריך לדעת להקשיב. אז מה זה בעצם
          להקשיב?

  # ------------------------------------------------------------------ 6′–11′
  - id: listen
    title: מה זו הקשבה פעילה?
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
    summary: הכיתה מציעה מה עושה מי שמקשיב באמת, ומשווה את מה שעלה לכללי ההקשבה הפעילה
    body:
      - slide:
          kicker: רגע לחשוב
          title: מתי הרגשתם שמישהו באמת מקשיב לכם?
          sub: מה הוא עשה?
          echo: true
          alt: שתי דמויות יושבות זו מול זו — אחת מדברת מהלב, והשנייה מקשיבה
          art:
            - {use: kid-sit, x: 40, y: 232, w: 185, color: purple}
            - {use: kid-sit, x: 395, y: 232, w: 185, color: teal, flip: true}
            - {use: speech, x: 330, y: 36, w: 220}
            - {use: heart, x: 395, y: 68, w: 90}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - >-
            רשמי על הלוח, במילים של הכיתה, מה עושה מי שמקשיב באמת. על כל תשובה — הדהדי, ושאלי מי מסכים
            ולמה.
          - הציגי את כללי ההקשבה הפעילה אחד־אחד, וחברי כל כלל למשהו שכבר כתוב על הלוח.
      - ask: מתי הרגשתם שמישהו באמת מקשיב לכם — ומה הוא עשה?
      - say: אז מה שעזר לך להרגיש שמקשיבים לך זה ___ — הבנתי נכון? מי עוד מכיר את זה?
      - slide:
          kicker: כללי הקשבה פעילה
          title: איך מקשיבים באמת?
          points:
            - מקשיבים באמת — בלי להיות מוסחים או שקועים בדברים אחרים
            - לא מפריעים ולא קוטעים, ומסתכלים לדובר בעיניים
            - בלי שיפוטיות — גם כשמה שמסופר שונה מעולמנו
            - כותבים את הדברים העיקריים שנאמרים
          echo: true
          cue: אחרי שהלוח התמלא —
          alt: דמות יושבת ומקשיבה, וסימן וי לידה
          art:
            - {use: kid-sit, x: 210, y: 180, w: 220, color: purple}
            - {use: check, x: 420, y: 50, w: 150}
      - say: עכשיו מתרגלים — כל אחד יספר את הסיפור שלו, וכל אחד גם יקשיב.

  # ------------------------------------------------------------------ 11′–23′
  - id: story
    title: מה הסיפור שלי?
    minutes: 12
    practices:
