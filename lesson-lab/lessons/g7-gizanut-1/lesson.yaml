    summary: >-
      זוגות אקראיים — כל אחד מספר סיפור שנותן לו כוח, גאווה או שייכות, והמקשיב מחזיר ״שמעתי שסיפרת ש…״;
      בסוף — דבר אחד דומה ודבר אחד ייחודי
    body:
      - moves:
          - הסבירי את המשימה לפני שמתחלקים לזוגות; השקף נשאר על המסך כל הזמן.
          - >-
            חלוקה אקראית לזוגות: הכיתה סופרת בקול עד חצי ממספר התלמידים, ושוב מההתחלה — שני בעלי אותו מספר
            הם זוג. אם המספר אי־זוגי — שלישייה אחת.
          - הפעילי את הטיימר. אחרי ארבע דקות — ״שמעתי שסיפרת ש…״, ומתחלפים.
          - >-
            הסתובבי בין הזוגות והקשיבי, בלי להתערב. בדקה האחרונה — בקשי מכל זוג למצוא דבר אחד דומה ודבר אחד
            ייחודי בשני הסיפורים.
      - slide:
          kicker: בזוגות · ארבע דקות לכל אחד
          title: מה הסיפור שלי?
          points:
            - מה אני עושה בשעות הפנאי?
            - איפה אני גר — ומה מאפיין את השכונה שלי?
            - המשפחה שלי — מסורות ומנהגים
            - על מה אני גאה במיוחד?
          timer: 240
          echo: true
          alt: שתי דמויות יושבות זו מול זו, ובבועה של אחת מהן בית
          art:
            - {use: kid-sit, x: 40, y: 255, w: 170, color: purple}
            - {use: kid-sit, x: 410, y: 255, w: 170, color: teal, flip: true}
            - {use: speech, x: 330, y: 36, w: 240}
            - {use: house, x: 390, y: 60, w: 120}
      - say: >-
          כל אחד יספר סיפור שנותן לו כוח, גאווה או תחושת שייכות — על הבית, על המשפחה, או על המקום שממנו
          הוא בא. מי שמקשיב — לא קוטע, רושם שלוש מילים, ובסוף אומר: ״שמעתי שסיפרת ש…״.
      - task:
          what: >-
            כל אחד מספר לבן הזוג סיפור אישי — על הבית, על המשפחה, על המקום שממנו הוא בא או על מסורת — סיפור
            שנותן לו כוח, גאווה או תחושת שייכות. המקשיב לא קוטע, רושם שלוש מילים חשובות, ובסוף מחזיר ״שמעתי
            שסיפרת ש…״. ואז מתחלפים.
          time: 4 דקות לכל מספר, ועוד דקה ל״שמעתי שסיפרת ש…״
          group: זוגות אקראיים
          rules: >-
            מספרים רק מה שבוחרים לספר — אפשר גם על תחביב או על הישג; השאלות שעל המסך הן רק עזרה
          plenary: >-
            אין — הסיפורים נשארים בזוג. בסוף כל זוג מוצא דבר אחד דומה ודבר אחד ייחודי בשני הסיפורים
          help: בחרו שאלה אחת מהמסך והתחילו ממנה — למשל, על מה אתם גאים במיוחד?
          challenge: ספרו גם למה דווקא הסיפור הזה חשוב לכם — מה הוא אומר עליכם?
      - slide:
          kicker: בסוף, בזוג
          title: מה דומה בשני הסיפורים — ומה ייחודי?
          echo: true
          cue: בדקה האחרונה —
          alt: שתי דמויות יד ביד, ומעליהן חלק פאזל
          art:
            - {use: pair, x: 190, y: 228, w: 260}
            - {use: puzzle, x: 245, y: 48, w: 150}
      - say: מצאו דבר אחד שדומה בשני הסיפורים שלכם, ודבר אחד שייחודי רק לאחד מהם.
      - say: חוזרים למקומות. עכשיו נבדוק איך היה — לספר, ולהקשיב.

  # ------------------------------------------------------------------ 23′–27′
  - id: talk
