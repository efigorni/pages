      - ask: מה משותף למשפטים ששמענו?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שני המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - say: >-
          היום למדנו מה זו הקשבה פעילה ותרגלנו אותה, והכרנו לעומק חברים לכיתה. שני משפטים לקחת איתכם:
      - messages:
          items:
            - יש מאפיינים דומים ומאפיינים ייחודיים בסיפורים האישיים שלנו.
            - כאשר אנחנו מקשיבים באופן פעיל אנחנו מבינים טוב יותר את הדובר.
          ask: איזה משפט מהשניים הכי נכון בשבילכם היום? חשבו רגע, ואז הצביעו.
          tip: >-
            הראשון מחזיר אותנו לחיפוש של ״דומה וייחודי״ בזוגות; השני — למה שהרגישו כשהקשיבו להם.
          alt: שתי דמויות יד ביד, ושתי בועות צ׳אט לידן
          art:
            - {use: pair, x: 330, y: 250, w: 240}
            - {use: chat, x: 70, y: 60, w: 230}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — בכוונתי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: משהו שלמדתי על עצמי כמספר או כמקשיב, ודבר אחד שבכוונתי לעשות מחר; פתקים נאספים בדלת
    body:
      - say: שתי שאלות קצרות, לבד ובשקט — שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: בכוונתי…
          prompts:
            - משהו שלמדתי היום על עצמי — כמספר או כמקשיב.
            - דבר אחד שבכוונתי לעשות כבר מחר כדי להקשיב טוב יותר — למי, ומתי?
          look_for: >-
            חפשי כוונות כלליות (״להקשיב יותר״) לעומת מעשה ברור (״להסתכל בעיניים כשאחי מספר משהו״), ופתקים
            שמספרים שקשה לספר, או שלא מקשיבים לכותב. עם אלה מדברים בשקט השבוע — ומה שנוגע בפגיעה עובר ליועצת
            עוד היום.
          timer: 180
          alt: תלמיד כותב ליד שולחן, ופתק כתום לידו
          art:
            - {use: kid-desk, x: 250, y: 120, w: 288, color: teal}
            - {use: sticky, x: 80, y: 300, w: 150}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
