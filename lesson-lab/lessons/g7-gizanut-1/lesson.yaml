          title: באיזה כלל הצלחתם לעמוד?
          sub: ואיזה כלל עוד צריך לתרגל?
          echo: true
          cue: אחרי כמה תשובות —
          alt: דמות עומדת, וסימן וי גדול לידה
          art:
            - {use: kid-stand, x: 370, y: 170, w: 170, color: teal}
            - {use: check, x: 110, y: 130, w: 200}
      - ask: באיזה כלל הצלחתם לעמוד, ואיזה עוד צריך לתרגל? מה עזר לכם — ומה הפריע?
      - say: אז מה שעזר לך זה ___ — הבנתי נכון? מי עוד?

  # ------------------------------------------------------------------ +5′
  - id: circle
    title: מעגל סיום
    kind: extension
    minutes: 5
    practices:
      - מהלכי שיח
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: מה מקדם הקשבה ומה מעכב אותה — על הלוח; ואיזו מיומנות אני רוצה לפתח — במחברת, לעצמי
    body:
      - slide:
          kicker: אם נשאר זמן · מעגל סיום
          title: מה עוזר להקשיב — ומה מפריע?
          echo: true
          alt: מאזניים — מה עוזר להקשיב, ומה מפריע
          art: scale
      - moves:
          - שרטטי על הלוח שני טורים, ורשמי בהם את מה שעולה.
          - על כל תשובה — שאלי את הכיתה לאיזה טור היא שייכת, ולמה.
          - לסיום — כל אחד כותב במחברת, לעצמו, מיומנות אחת שהוא רוצה להמשיך לפתח.
      - board: מקדם הקשבה · מעכב הקשבה
      - ask: מה עוזר לנו להקשיב — ומה מפריע לנו?
      - say: >-
          הקשבה היא מיומנות — ואפשר ללמוד אותה. כתבו לעצמכם: איזו מיומנות הייתם רוצים להמשיך לפתח, כדי
          להקשיב טוב יותר?
      - ladder:
          help: חשבו על הכללים מהשיעור — איזה מהם הכי קשה לכם?
          challenge: איך תתרגלו את המיומנות הזאת השבוע — עם מי, ובאיזה מצב?

  # ------------------------------------------------------------------ +5′
  - id: clouds
    title: ענני סיכום
    kind: extension
