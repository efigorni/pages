sub: >-
  לכל אחד יש סיפור — על השם שלו, על הבית, על מה שהוא גאה בו. בשיעור הזה מספרים את הסיפור של השם,
  לומדים מה זו הקשבה פעילה, ומתרגלים אותה בזוגות.
format: כתיבה אישית, זוגות ומליאה
question: מה עוזר לנו להקשיב באמת — ומה מגלים כשמקשיבים לסיפור של מישהו אחר?
takeaways:
  - לכל אחד מאיתנו יש סיפור משלו — ובסיפורים שלנו יש גם דברים דומים וגם דברים ייחודיים.
  - >-
    הקשבה פעילה היא מיומנות שאפשר ללמוד: מקשיבים באמת, לא קוטעים, מסתכלים בעיניים ולא שופטים.
  - כשמקשיבים באמת — מבינים טוב יותר את מי שמדבר.
prep: []

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — השם, הבית והמקום שממנו באים, בזוגות אקראיים. שאלי אם יש בכיתה מי
      שהנושאים האלה קרובים אליו מדי: מי שעלה לא מזמן, מי שמשפחתו עוברת תקופה קשה, מי שנקרא על שם קרוב
      שנפטר. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהשם שלו גורר הקנטות, מי ששינה את שמו (בעלייה, באימוץ), ומי שבבית שלו לא פשוט. הסיפור בזוגות
      הוא לבחירת המספר — אפשר לספר על תחביב או על הישג, ולא חייבים על המשפחה. אם בחלוקה האקראית יצאו
      יחד שני תלמידים שיש ביניהם סכסוך — החליפי בשקט, בלי הסבר.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מה שנאמר כאן נשאר כאן, ומספרים רק על עצמנו״. בפתיחה ובמליאה משתפים רק מתנדבים,
      ולא קוראים בשם למי שלא הצביע. ״שמעתי שסיפרת ש…״ נאמר רק לבן הזוג, לא מול הכיתה.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא
      מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״מעגל סיום״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - story
      - talk
    text: >-
      בסיפור — שלוש דקות לכל מספר במקום ארבע, ובשיח במליאה שואלים רק ״איך הרגשתם כשהקשיבו לכם?״

