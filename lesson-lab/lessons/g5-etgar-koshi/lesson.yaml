sensitivity: med-high
sub: מארגנים את סיפורו של אדם בארבעה תחומים, מתרגלים הקשבה ומזהים עזרה וכוחות בלי להיכנס לחוויות קשות
  בכיתה.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך עושים סדר בין עובדות, מחשבות ורגשות אחרי קושי?
takeaways:
- 'עיבוד חוויה: לעיתים אנו חווים אירועים המשפיעים עלינו מאוד. כדי שנוכל לא להיבהל מהזיכרון שלהם ואפילו
  ללמוד ממנו, כדאי לעשות עם עצמנו עיבוד חוויה.'
- עובדות, מחשבות ורגשות הם חלקים שונים בסיפור; אין חובה לעבד קושי לבד.
prep:
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
