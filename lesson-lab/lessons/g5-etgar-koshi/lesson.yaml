    w: 250
  alt: זכוכית מגדלת
steps:
- id: part-1
  title: קרה או חשבתי?
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: קרה או חשבתי? — מה ההבדל בין עובדה לבין מחשבה?
  body:
  - slide:
      title: מה ההבדל בין עובדה לבין מחשבה?
      art:
      - use: magnifier
        x: 180
        y: 120
        w: 250
      alt: זכוכית מגדלת
      echo: true
  - moves:
    - 'כתבי שני משפטים: הכדור לא נכנס לסל; לעולם לא אצליח.'
    - תני שלוש דקות לכתיבת ההבדל.
    - אספי תשובות והדגישי שמחשבה היא אמיתית כחוויה, אך אינה בהכרח עובדה.
  - ask: מה ההבדל בין עובדה לבין מחשבה?
  - ladder:
      help: איזה משפט אפשר לתעד במצלמה?
      challenge: איזה משפט עשוי להשתנות כשמגיע מידע חדש?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: אדם וטופי
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: אדם וטופי — מה ידוע ומה התערבב ברגע הקשה?
  body:
  - slide:
      title: מה ידוע ומה התערבב ברגע הקשה?
      art:
      - use: hands-help
        x: 180
        y: 120
        w: 250
      alt: ידיים מושטות
      echo: true
      sub: ''
  - moves:
    - 'ספרי בעדינות: בטיול כלבתו של אדם נפגעה ברגל, והוא חש פחד ואשמה.'
    - מבוגר עזר להגיע הביתה ולטיפול אצל וטרינר.
    - אין צורך בתיאור התאונה.
    - בזוגות מיינו פרטים לעובדה, מחשבה ורגש; צייני שמחשבת אשמה אינה קביעה של אחריות.
  - ask: מה ידוע ומה התערבב ברגע הקשה?
  - task:
      what: מיינו פרטים מסיפור אדם וטופי לעובדות, מחשבות ורגשות. ציינו גם מי עזר ומה ידוע על הטיפול.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה אנחנו יודעים על הטיפול שקיבלה טופי?
      challenge: איך מידע על עזרה וטיפול משנה את הסיפור בלי למחוק את הפחד?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: ארבעה חלונות לסיפור
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: ארבעה חלונות לסיפור — מה עוזר לספר קושי בצורה מסודרת?
  body:
  - slide:
      title: מה עוזר לספר קושי בצורה מסודרת?
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף
      echo: true
      sub: ''
  - moves:
    - 'חלקי דף לארבעה: עובדות, רגשות, מחשבות וצידה לדרך.'
    - כל זוג ממלא אותו על אדם; בחלון האחרון כותבים מי עזר ואיזו יכולת סייעה.
    - אפשר לבחור חלופה קלה של דמות ששכחה תיק בחוג.
    - הקשיבי ותקני ערבוב בין מה שקרה לבין מה שחשבו.
  - ask: מה עוזר לספר קושי בצורה מסודרת?
  - task:
      what: 'מלאו ארבעה חלונות על אדם או על דמות ששכחה תיק: עובדות, רגשות, מחשבות וצידה לדרך.'
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: התחילו בשאלה מי היה שם ומה נעשה בפועל.
      challenge: מה למדנו על בקשת עזרה שנוכל להשתמש בו במקרה אחר?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: מקשיבים וסוגרים בעדינות
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מקשיבים וסוגרים בעדינות — מה נרצה לקחת מהסיפור הלאה?
  body:
  - slide:
      title: מה נרצה לקחת מהסיפור הלאה?
      art:
      - use: umbrella
        x: 180
        y: 120
        w: 250
      alt: מטרייה
      echo: true
      sub: ''
  - moves:
    - אחד מספר את הדוגמה הדמיונית בארבעת החלונות והשני שואל שאלת הבהרה אחת; מתחלפים.
    - הציעי לדמיין בלון שמתרחק, בלי חובה לנפח או לשחרר בלון אמיתי.
    - 'חזרי להווה: מבט בחדר, כפות רגליים על הרצפה ובחירת מבוגר לפנייה.'
  - ask: מה נרצה לקחת מהסיפור הלאה?
  - task:
      what: ספרו בזוג את הדוגמה בארבעת החלונות. המקשיב שואל שאלת בירור אחת; החליפו תפקידים וסיימו בבחירת
        מקור עזרה.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה מתוך הסיפור כבר הסתיים ומה יכול לעזור עכשיו?
      challenge: איך נסיים שיחה בלי לדרוש שהרגש ייעלם?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - 'עיבוד חוויה: לעיתים אנו חווים אירועים המשפיעים עלינו מאוד. כדי שנוכל לא להיבהל מהזיכרון שלהם
        ואפילו ללמוד ממנו, כדאי לעשות עם עצמנו עיבוד חוויה.'
      - בעיבוד חוויה מפרידים בין מה שקרה, מה שחשבנו והרגשנו אז ואיך אנחנו מרגישים בנוגע למה שקרה וחושבים
        עליו עכשיו. זה עוזר לנו במידה רבה להשתחרר מההרגשה הכבדה וגם עוזר ללמוד ממנה לעתיד.
      - בעיבוד חוויה עולים רגשות חזקים, שחלקם יכולים להיות מאד לא נעימים. כדי להקל על התחושות האלו אפשר
        להיעזר בבלונים שננפח ונשחרר לאוויר.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - כתבו שאלה שמבררת עובדה ושאלה שמבררת רגש.
      - מי יכול לעזור כשקשה להישאר לבד עם החוויה?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: פגיעה בחיית מחמד ואשמה. תיאום מראש עם היועצת; אין לעבד טראומה אישית מול הכיתה. אפשר לבחור מקרה
    קל ודמיוני בכל שלב.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
