grade: 5
grades_served:
- 5
slide_kickers: false
month: מרץ–אפריל
section: הרגשות שלנו (מרץ–אפריל)
unit: חוסן - עיבוד חוויות אישיות
src_text: sources/text/5/Etgar_Koshi.md
