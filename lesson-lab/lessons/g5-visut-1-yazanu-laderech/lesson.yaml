safe:
- head: תיאום עם היועצת
  text: תאמי מראש כיצד לפנות לשיחה אישית בעקבות יוצאים לדרך משותפת. הכיני אפשרות לצאת לזמן קצר בליווי מבוגר
    מוכר.
- head: מי עלול להיפגע
  text: מאזני האתגרים עלולים לחשוף קושי משפחתי או לימודי. אפשר להסתפק במאזניים של אדם; אל תתלי קושי אישי ללא
    רשות.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על אדם או על דמות דמיונית, לכתוב במקום לדבר או לעבור. אין מבקשים פרטים אישיים או שמות של
    ילדים.
- head: אם מישהו משתף פגיעה
  text: 'הודי לו על האמון, עצרי שאלות מהכיתה והמשיכי בפרטיות עם היועצת; אל תבטיחי סודיות כשנדרשת הגנה. המבוגרים
    אחראים לטפל בפגיעה. לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם.'
