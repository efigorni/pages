sub: >-
  מה הייתם לוקחים לאי בודד? בשיעור הזה מגלים את ההבדל בין מה שאנחנו צריכים לבין מה שמצמיח אותנו, בוחרים
  קלף ״חשוב לי…״, ובשלשות מחפשים רעיונות להגשים את מה שחשוב לנו.
format: כתיבה אישית, זוגות, שלשות ומליאה
question: מה באמת חשוב לי — ואיך זה נותן לחיים שלי תכלית ומשמעות?
takeaways:
  - יש צרכים בסיסיים, שבלעדיהם קשה לנו, וצרכים מיטביים, שעוזרים לנו לצמוח.
  - הדברים שחשובים לנו באמת — מטרות, תחומי עניין, תפקידים — נותנים לנו תכלית ומשמעות.
  - כשמגשימים מטרה צעד אחרי צעד, ובעזרת רעיונות של אחרים, מרגישים מסוגלים.
prep:
  - חלוקה מראש לשלשות לפי השולחנות; מי שאת יודעת שקשה לו לשתף — בשלשה עם מי שנוח לו
  - חמשת השלבים של ״הקלף שלי״ — כתובים על הלוח לפני השיעור
  - פתקיות ודפים ריקים (להרחבה ״ממחשבה לביצוע״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מה חשוב לנו, מטרות וחלומות, ובקלפים גם ״תפקידים שלי במשפחה״ ו״קושי שחשוב לי
      להתגבר עליו״. שאלי אם יש בכיתה מי שהנושאים האלה קרובים אליו מדי — מצב קשה בבית, אובדן, מי שמתמודד עכשיו
      עם קושי גדול — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      באי המטמון יש מי שיכתוב אדם או דבר שחסר לו, ויש מי שיתבייש ברשימה שלו — לכן משתפים רק מתנדבים, ורק
      פריט אחד. הקלפים על המשפחה ועל קושי יכולים לפתוח דבר כואב — בוחרים בהם רק מי שרוצה, ואף אחד לא מתבקש
      להסביר למה בחר קלף. בשלשות, ״רעיונות למימוש״ הם הצעות, לא עצות שמחייבות ולא ביקורת.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״הנאמר בשיח נשאר בינינו, ומספרים רק על עצמנו״. מה שכתוב במחברת לא נאסף. בשלשה כל
      אחד בוחר מה לספר, מותר לבחור קלף קל, ומותר לא לענות על שאלה. במליאה משתפים רק מתנדבים, ולא קוראים בשם
      למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל קושי בבית, אובדן או מצוקה שעולה מקלף — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״ממחשבה לביצוע״;
    פחות — ישר ל״חשוב לזכור״.
