steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: island
    title: אי המטמון שלי
    minutes: 7
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - אחריות ובחירה
    summary: כתיבה אישית — 10 דברים שלוקחים לאי בודד, ואז רק 5 ולמה; שלושה־ארבעה משתפים פריט אחד
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, במחברת
          title: אתם עומדים לעבור לאי בודד!
          sub: רשמו 10 דברים שאתם לוקחים אתכם אל האי. אין מקום ליותר במסוק
          verbatim: [title, sub]
          timer: 180
          echo: true
          alt: אי קטן עם עץ דקל באמצע הים, ושמש מעליו
          art: {file: art/island.svg}
      - moves:
          - >-
            השקף על המסך כשהכיתה נכנסת, ומתחילים לכתוב במחברת בלי הסבר נוסף. בזמן הכתיבה — נוכחות, וסיבוב בין
            השולחנות.
          - אחרי שלוש דקות — השקף הבא. כל אחד בוחר 5 מתוך ה־10, וכותב ליד כל אחד למה.
          - הזמיני שלושה־ארבעה מתנדבים לשתף דבר אחד שהיו לוקחים, ולמה.
      - say: שלוש דקות, לבד ובשקט. אין רשימה נכונה — יש רק הרשימה שלכם.
      - ladder:
          help: חשבו על יום רגיל — במה אתם משתמשים מהבוקר ועד הערב?
          challenge: יש ברשימה שלכם משהו שאי אפשר לארוז בתיק? מה הוא אומר עליכם?
      - slide:
          kicker: אי המטמון שלי
          title: אופססס... אפשר לקחת רק 5 דברים.
          sub: בחרו 5 מהרשימה — ורשמו ליד כל אחד למה הייתם לוקחים אותו.
          verbatim: [title]
          timer: 120
          echo: true
          cue: אחרי שלוש דקות —
          alt: דף רשימה עם איקס, ודמות שבועה מעליה אומרת ״מה???״
          art:
            - {use: note, x: 40, y: 200, w: 190}
            - {use: cross, x: 95, y: 268, w: 80}
            - {use: speech, x: 250, y: 24, w: 250}
            - text: מה???
              x: 375
              y: 106
              size: 60
            - {use: kid-stand, x: 400, y: 212, w: 150, color: teal}
      - ask: דבר אחד שהייתם לוקחים — מדוע?
      - say: כל דבר שבחרתם עונה על צורך כלשהו. בואו נבדוק — על איזה?

  # ------------------------------------------------------------------ 7′–13′
  - id: needs
    title: על איזה צורך זה עונה?
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      צרכים בסיסיים וצרכים מיטביים; כל אחד מסמן ליד הפריטים שלו על איזה צורך הם עונים, משווה עם השכן, ושומעים
      מי היה משנה את הבחירה
    body:
      - slide:
          kicker: צרכים
          title: צרכים בסיסיים
          sub: ביטחון, שייכות, הערכה עצמית.
          verbatim: [title, sub]
          echo: true
          alt: מגן, ולידו לב וכוכב
          art:
            - {use: shield, x: 200, y: 130, w: 230}
            - {use: heart, x: 430, y: 66, w: 150}
            - {use: star, x: 50, y: 300, w: 150}
      - quote:
          title: צרכים בסיסיים — להקריא
          text: >-
            צרכים בסיסיים: צרכים התורמים לבריאות פיזית ופסיכולוגית של האדם. אי סיפוקם של צרכים בסיסיים לאורך זמן
            מוביל למצב רגשי שלילי ואף לחולי. צרכים אלו הם: ביטחון, שייכות, הערכה עצמית.
      - slide:
          kicker: צרכים
          title: צרכים מיטביים
          sub: אוטונומיה, תחושת מסוגלות, מימוש עצמי וביטוי כנה ואמיתי של עצמי.
          verbatim: [title, sub]
          echo: true
          cue: אחרי ההגדרה הראשונה —
          alt: נבט צומח בעציץ, ושמש מעליו
          art:
            - {use: sprout, x: 180, y: 190, w: 250}
            - {use: sun, x: 420, y: 40, w: 160}
      - quote:
          title: צרכים מיטביים — להקריא
          text: >-
            צרכים מיטביים: צרכים שסיפוקם מקדם את הפרט ממצב ניטרלי למצב חיובי. הם עשויים לתרום להתפתחות, לצמיחה
            אישית ולתחושת משמעות וערך. מצב של חוסר סיפוק הצרכים המיטביים עלול לבוא
            לידי ביטוי בשעמום, בניכור ובהתרחקות מאתגרים משמעותיים. צרכים אלו הם: אוטונומיה, תחושת מסוגלות, מימוש
            עצמי וביטוי כנה ואמיתי של עצמי.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: על איזה צורך עונה החפץ שבחרתם?
          sub: בעקבות הדיון — האם הייתם משנים את בחירתכם?
          points:
            - לבד — ב׳ או מ׳ ליד כל פריט
            - בזוגות — משווים
            - במליאה
          echo: true
          cue: אחרי שתי ההגדרות —
          alt: דמות חושבת על סוללה מלאה
          art:
            - {use: thought, x: 40, y: 30, w: 320}
            - {use: battery-full, x: 105, y: 110, w: 180}
            - {use: kid-stand, x: 380, y: 226, w: 140, color: teal}
      - moves:
          - הציגי את שני סוגי הצרכים, והקריאי את ההגדרות.
          - >-
            כל אחד מסמן ליד כל אחד מחמשת הפריטים שלו — ב׳ לצורך בסיסי, מ׳ לצורך מיטבי — ומשווה עם השכן. דקה
            לסימון, דקה לזוג.
          - >-
            הזמיני שלושה־ארבעה תלמידים להסביר את הבחירה שלהם עכשיו, והאם היו משנים אותה. על כל תשובה — שאלי את
            הכיתה מי מסכים, ולמה.
      - whisper: >-
          דוגמה מהמקור, אם הדיון לא מתחיל — מטען לטלפון: צורך בסיסי (הטלפון נותן ביטחון ושייכות) או מיטבי (ביטוי
          כנה ואמיתי, תחושת מסוגלות)?
      - ladder:
          help: בלי הפריט הזה — היה חסר לי ביטחון או חברה? אם כן, הוא כנראה צורך בסיסי.
          challenge: מצאו פריט שעונה על שני הצרכים יחד — והסבירו איך.
      - ask: על איזה צורך עונה החפץ שבחרתם? ובעקבות הדיון — האם הייתם משנים את בחירתכם?
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי רואה את זה אחרת?
      - say: >-
          באי בחרנו חפצים. אבל מה שנותן לנו משמעות הוא לא רק חפצים — אלה הדברים שחשובים לנו באמת.

  # ------------------------------------------------------------------ 13′–17′
  - id: card
    title: חשוב לי…
    minutes: 4
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: תזכורת לכללי השיח; כל אחד בוחר קלף ״חשוב לי…״ שהוא מתחבר אליו, וכותב במחברת מה חשוב לו
    body:
      - slide:
          kicker: לפני שמשתפים · הנחיות לשיח מיטבי
          title: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          alt: שתי דמויות יושבות זו מול זו, ולב ביניהן
          art:
            - {use: kid-sit, x: 30, y: 262, w: 160, color: purple}
            - {use: kid-sit, x: 430, y: 262, w: 160, color: teal, flip: true}
            - {use: heart, x: 245, y: 150, w: 130}
      - moves:
          - הקריאי את ההנחיות לשיח — הן ילוו את השלשות.
          - >-
            חלקי לכל שלשה דף קלפים. כל אחד בוחר קלף אחד שהוא מתחבר למשפט שבו — מותר גם ״אחר…״ — וכותב במחברת
            מה חשוב לו בהתייחס אליו.
          - שתי דקות של כתיבה בשקט. הסתובבי, ועזרי למי שמתלבט לבחור קלף קל להתחלה.
      - slide:
          kicker: חשוב לי… · לבד, במחברת
          title: בחרו קלף שאתם מתחברים למשפט שבו.
          sub: כתבו במחברת מה חשוב לכם בהתייחס לקלף שבחרתם.
          verbatim: [title]
          timer: 120
          echo: true
          cue: אחרי ההנחיות —
          alt: שלושה קלפים פרושים, ועיפרון לידם
          art:
            - {use: note, x: 110, y: 110, w: 170, rotate: -14}
            - {use: note, x: 225, y: 90, w: 170}
            - {use: note, x: 340, y: 110, w: 170, rotate: 14}
            - {use: pencil, x: 400, y: 340, w: 150}
      - handout:
          title: קלפי ״חשוב לי…״
          copies: עותק לכל שלשה — או גזורים לקלפים ופזורים על שולחן, גלויים או הפוכים
          verbatim: true
