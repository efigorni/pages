            - מה הייתי רוצה להשיג בעתיד?
            - תפקידים שלי, שחשובים לי בקבוצת החברים
            - משהו שחשוב לי לעשות. למה חשוב לי?
            - עקרון שחשוב לי שיתקיים. מדוע?
            - דבר שהשפעתי עליו. איך השפעתי?
            - משהו שחשוב לי להצליח בו
            - משהו שחשוב לי ללמוד. מדוע?
            - קושי שחשוב לי להתגבר עליו
            - אחר…
            - תחביב שלי ומדוע אני עוסק/ת בו
            - במה אני עסוק/ה?
            - תפקידים שלי, שחשובים לי בכיתה
            - דבר שחשוב לי להשפיע עליו
            - משהו שהייתי רוצה לממש
      - ladder:
          help: התחילו מקלף פשוט — תחביב שלכם, או משהו שחשוב לכם ללמוד.
          challenge: בחרו קלף שקשה לכם יותר, וכתבו גם למה זה חשוב לכם.
      - say: בחרו קלף אחד שמדבר אליכם. אין קלף נכון — יש קלף שלכם.
      - say: מה שתכתבו נשאר במחברת. בשלשה כל אחד מספר רק מה שהוא בוחר.

  # ------------------------------------------------------------------ 17′–27′
  - id: trios
    title: הקלף שלי — בשלשות
    minutes: 10
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      בשלשות, כל אחד בתורו משתף בקלף שלו — שאלות בלי שיפוטיות, רעיונות למימוש וסיכום; במליאה — מה התחדש
      לכם
    body:
