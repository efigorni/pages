# מקום בעולם — כיתה ז׳, למצוא מקום, שיעור 1 (מקור: sources/text/7/Makom_Baolam.md)
slug: g7-makom-baolam
title: מקום בעולם
grade: 7
month: אוקטובר
section: חברות, סובלנות ומניעת אלימות (אוקטובר)
unit: למצוא מקום
unit_order: 1
unit_size: 2
src_text: sources/text/7/Makom_Baolam.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/7Grade/Mamlachti/Makom_Baolam.pptx
sensitivity: med-high

sub: >-
  בכיתה חדשה, למצוא מקום לוקח זמן. בשיעור הזה מגלים מה משותף לנו, משרטטים את מעגלי השייכות,
  ובוחרים צעד אחד שיעזור לכולם למצוא מקום בכיתה.
format: זוגות, רביעיות ומליאה
question: מה צריך כדי להרגיש שיש לי מקום — ואיך עושים מקום לכולם?
takeaways:
  - שייכות היא צורך של כולנו — להרגיש אהובים, נחוצים ומסוגלים.
  - לכולנו יש כמה מעגלי שייכות, ומעגל אחד יכול לחזק אותנו כשבאחר עוד קשה.
  - למצוא מקום לוקח זמן — וכל אחד מאיתנו יכול להשפיע על השייכות שלו ושל אחרים בכיתה.
prep:
  - חלוקה מראש לזוגות לפי השולחנות, ואילו שני זוגות מתחברים לרביעייה
  - פתקים ונייר דבק לקיר (להרחבה ״פתקים לקיר״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה, ושאלי אם יש בכיתה מי שמרגיש כרגע בחוץ — תלמיד חדש, מי שעבר מעבר קשה,
      מי שעוד אין לו חבר בכיתה. בקשי שתהיה זמינה אחרי השיעור, וסכמי איתה מה עושים עם פתק ״רציתי לומר לך
      ש…״ שמבקש עזרה.
  - head: מי עלול להיפגע
    text: >-
      השיעור עוסק בשייכות, ולכן נוגע במי שעוד לא מצא מקום. בכדור השלג סופרים כדי לשמוח, לא כדי לנצח.
      ״משפטים ששומעים בבית״ — מכל מי שגר בבית, לא דווקא מההורים. מי שנשאר בלי זוג — צרפי אותו בעצמך,
      בלי להעיר על זה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו״. מותר לוותר, ולא קוראים בשם למי שלא הצביע. השמש והדף
      האישי נשארים במחברת — משתפים רק מי שרוצה, ורק מה שהוא בוחר.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום,
      ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק הפתקים לקיר;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - snowball
      - sun
    text: כדור השלג נשאר בזוגות בלבד, והשמש נעשית בעל פה — כל אחד אומר מעגל אחד

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: אף ואוזן
      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
  from: sheet

cover:
  alt: בית גדול, ולידו שתי דמויות — אחת מהן מרימה יד
  art:
    - {use: house, x: 134, y: 24, w: 352}
    - {use: kid-stand, x: 40, y: 240, w: 140, color: teal}
    - {use: kid-hand, x: 440, y: 240, w: 140, color: orange}

steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: איפה הכי בבית?
    minutes: 4
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית קצרה — מקום אחד שבו מרגישים בבית, ולמה; שומעים שלוש תשובות
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: איפה אתם מרגישים הכי בבית?
          sub: מקום אחד — ומה יש שם שעושה לכם טוב.
          timer: 180
          echo: true
          alt: בית, ולב מעליו
          art:
            - {use: house, x: 120, y: 170, w: 350}
            - {use: heart, x: 400, y: 40, w: 170}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש תשובות שונות זו מזו.
          - הזמיני את שלושת הכותבים לשתף. ה״למה״ שלהם יחזור בהמשך השיעור.
      - say: שלוש דקות, לבד ובשקט. אין תשובה נכונה — רק מקום שהוא שלכם.
      - ladder:
          help: איפה אתם אוהבים להיות אחרי בית הספר — ועם מי?
          challenge: מה היה צריך לקרות כדי שגם הכיתה תרגיש ככה?
      - ask: נשמע שלושה — איזה מקום כתבתם, ומה גורם לכם להרגיש שם בבית?

  # ------------------------------------------------------------------ 4′–12′
  - id: snowball
    title: כדור שלג מתגלגל
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
    summary: זוגות ואז רביעיות מחפשים כמה שיותר דברים משותפים
    body:
      - moves:
          - הסבירי את שני הסבבים לפני שקמים מהמקומות; השקף נשאר על המסך כל הסבב.
          - בדקי הבנה בשאלה אחת (״מה מחפשים בסבב הראשון?״), וצאו לדרך.
          - הסתובבי בין הזוגות, הקשיבי ועודדי. דקה לפני המעבר — הודיעי.
          - במעבר סופרים באצבעות כמה מצאו, וכל זוג מצטרף לזוג שלידו.
      - slide:
          kicker: כדור שלג מתגלגל · סבב 1
          title: בזוגות — 10 משפטים ששומעים בבית
          sub: כמו ״מי השאיר את האור דולק?״
          timer: 180
          alt: זוג יד ביד, ומעליו בועת דיבור עם נורה דולקת
          art:
            - {use: pair, x: 110, y: 226, w: 270}
            - {use: speech, x: 280, y: 16, w: 320}
            - {use: bulb, x: 381, y: 46, w: 118}
      - say: עכשיו נשחק ב׳כדור שלג מתגלגל׳ — מתחילים בזוגות, ובכל סבב הקבוצה גדלה.
      - task:
          what: >-
            מוצאים דברים משותפים בקבוצה שהולכת וגדלה. בזוגות — לפחות 10 משפטים ששניכם שומעים בבית
            (מההורים, מהאחים, מסבא וסבתא). ברביעיות — לפחות 10 מאכלים שכולכם אוהבים לאכול בבית
            ויודעים להכין בעצמכם.
          time: 3 דקות לכל סבב
          group: זוגות לפי השולחנות ← רביעיות
          rules: דף אחד לקבוצה; קבוצה שמגיעה ל־10 ממשיכה לחפש
          plenary: נשארים ברביעיות לשאלה הבאה
          help: מה אומרים אצלכם בבית בבוקר, או לפני השינה?
          challenge: מצאו משפט שכולכם שומעים — כל אחד במילים קצת אחרות.
      - slide:
          kicker: כדור שלג מתגלגל · סבב 2
          title: ברביעיות — 10 מאכלים שאוהבים ויודעים להכין
          timer: 180
          cue: אחרי שלוש דקות, כשהזוגות מתאחדים —
          alt: ארבעה סביב שולחן, ולידם רימון
          art:
            - {use: circle4, x: 120, y: 110, w: 330}
            - {use: pomegranate, x: 440, y: 330, w: 150}
      - say: עצרו. הרימו אצבעות — כמה מצאתם? עכשיו כל זוג מצטרף לזוג שלידו.

  # ------------------------------------------------------------------ 12′–16′
  - id: together
    title: מה עזר לכם לשתף פעולה?
    minutes: 4
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: שאלה אחת לעומק — לבד, בזוגות, במליאה; גשר לקבוצות הקבועות שבחיים
    body:
      - p: זה הרגע שהכי קל לדלג עליו — אל תדלגי. כאן המשחק הופך ללמידה.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה עזר לכם לשתף פעולה בקבוצה?
          echo: true
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          alt: זוג, ולידו שתי בועות צ׳אט
          art:
            - {use: pair, x: 40, y: 260, w: 240}
            - {use: chat, x: 300, y: 60, w: 280}
      - moves:
          - חוזרים למקומות. שאלי, וחכי 30 שניות של שקט לפני שמשהו נאמר.
          - דקה בזוגות, עם מי שהתחילו איתו את כדור השלג.
          - שמעי שלושה–ארבעה זוגות. על כל תשובה — הדהדי, והזמיני עוד קולות.
      - say: אז מה שעזר לכם זה ___ — הבנתי נכון? למי עוד זה היה ככה?
      - say: >-
          הקבוצות שלנו היום היו אקראיות, והן נגמרות כשחוזרים למקומות. אבל בחיים יש לנו גם קבוצות
          קבועות, שאנחנו שייכים אליהן. בואו נראה אילו.

  # ------------------------------------------------------------------ 16′–22′
  - id: sun
    title: שמש מעגלי השתייכות
    minutes: 6
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: כל אחד משרטט את מעגלי השייכות שלו; במליאה — באיזה מעגל הכי נוח, ומה עושה אותו לנוח
    body:
      - slide:
          kicker: שמש מעגלי השתייכות
          title: לאילו קבוצות אתם שייכים?
          sub: משפחה, חוג, חברים… ומה עוד?
          alt: שמש — ״אני״ במרכז, ומסביב משפחה, חברים, כיתה, חוג, תנועת נוער ושכונה
          art: {file: art/sun-circles.svg}
      - moves:
          - הציגי את השמש, וקראי בקול את הקבוצות שעליה.
          - שלוש דקות של שרטוט בשקט. הסתובבי ושימי לב אילו מעגלים חוזרים.
          - במליאה — רשמי על הלוח את הדוגמאות שעולות, ושאלי באיזה מעגל הכי נוח ולמה.
      - task:
          what: >-
            כל אחד משרטט במחברת שמש: ״אני״ במרכז, ובכל קרן — קבוצה שהוא שייך אליה. מקיפים את המעגל
            שבו הכי נוח, וכותבים לידו מילה אחת: מה עושה אותו לנוח.
          time: 3 דקות
          group: לבד
          rules: כותבים בשקט; מה שבמחברת לא חייב לצאת ממנה
          plenary: שלושה–ארבעה מספרים על מעגל אחד, ורושמים דוגמאות על הלוח
          help: איפה אתם אחרי בית הספר, ועם מי?
          challenge: מה משותף לשני המעגלים שבהם הכי נוח לכם?
      - slide:
          kicker: שמש מעגלי השתייכות
          title: באיזה מעגל הכי נוח לכם?
          sub: ומה עושה אותו לנוח?
          echo: true
          cue: אחרי השרטוט, כשעוברים למליאה —
          alt: שלוש דמויות יחד, ולב מעליהן
          art:
            - {use: group3, x: 120, y: 236, w: 380}
            - {use: heart, x: 220, y: 30, w: 180}
      - ask: באיזה מעגל הכי נוח לכם — ומה מאפשר לכם להרגיש שם שייכים?
      - say: אז מה שעוזר לך שם זה ___ — הבנתי נכון? למי עוד זה מוכר?

  # ------------------------------------------------------------------ 22′–27′
  - id: belong
    title: אהוב · נחוץ · יכול
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: מגדירים יחד מהי שייכות, ומחברים להגדרה את המילים של הכיתה
    body:
      - slide:
          kicker: רגע לחשוב
          title: ובעצם, מהי שייכות בשבילכם?
          alt: דמות חושבת, וענן מחשבה גדול
          art:
            - {use: kid-stand, x: 60, y: 200, w: 160, color: teal}
            - {use: thought, x: 250, y: 30, w: 320}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - רשמי על הלוח מילים מתוך מה שנאמר.
          - רק אחר כך הציגי את ההגדרה, וחברי אליה את המילים מהלוח.
      - ask: ובעצם — מהי שייכות בשבילכם?
      - slide:
          kicker: הצורך בשייכות
          title: אהוב · נחוץ · יכול
          sub: שייכות היא צורך בסיסי של כולנו.
          cue: אחרי שנרשמו מילים על הלוח —
          alt: שלושה עיגולים חופפים — אהוב, נחוץ, יכול — ודמות באמצע
          art: {file: art/venn.svg}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: >-
            הצורך בשייכות הינו צורך בסיסי שפירושו הצורך להיות נאהב, שייך לקבוצה אנושית ומקובל על ידי
            אחרים. לפעמים לוקח זמן 'למצוא מקום' במקום חדש.
      - say: >-
          ומקום שבו אוהבים אותנו וצריכים אותנו — למשל תנועת הנוער — יכול לחזק אותנו גם כשבכיתה עוד
          לא ממש נוח.

  # ------------------------------------------------------------------ +5′
  - id: notes
    title: פתקים לקיר
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
    summary: כל זוג כותב פעולה אחת שתעזור לכולם להרגיש שייכים, ותולה על הקיר
    body:
      - slide:
          kicker: אם נשאר זמן
          title: מה נעשה כדי שכולם בכיתה ירגישו שייכים?
          alt: לוח, ועליו שלושה פתקים צבעוניים
          art:
            - {use: board, x: 102, y: 100, w: 416}
            - {use: sticky, x: 142, y: 150, w: 104}
            - {use: sticky, x: 260, y: 168, w: 104, color: teal}
            - {use: sticky, x: 376, y: 146, w: 104, color: purple}
      - task:
          what: כל זוג כותב על פתק פעולה אחת קטנה שתעזור לכולם להרגיש שייכים בכיתה, ותולה על הקיר.
          time: 3 דקות
          group: זוגות
          rules: פעולה שאפשר לעשות כבר השבוע; בלי שמות
          plenary: קוראים בקול חמישה פתקים
          help: מה עזר לכם היום בכדור השלג?
          challenge: מה נוכל לעשות בשביל מי שעוד לא מכיר אף אחד בכיתה?
      - say: כתבו משהו שעושים — לא ״להיות נחמדים״, אלא מה בדיוק עושים.

  # ------------------------------------------------------------------ +5′
  - id: sheet
    title: הדף האישי
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: כתיבה אישית בדף להתבוננות — לא לשיתוף
    body:
      - slide:
          kicker: אם נשאר זמן · דף להתבוננות אישית
          title: מה יכול לעזור לי כדי להשתייך לכיתה?
          sub: כתיבה אישית — לא לשיתוף.
          alt: דף עם שורות ועיפרון
          art:
            - {use: note, x: 170, y: 60, w: 256}
            - {use: pencil, x: 390, y: 290, w: 190}
      - moves:
          - חלקי את הדף, ואמרי בבירור שהוא אישי ולא לשיתוף.
          - מי שלא מספיק — לוקח את הדף הביתה, לעצמו.
      - say: הדף הזה שלכם. אף אחד לא יקרא אותו, אלא אם תבחרו להראות.
      - task:
