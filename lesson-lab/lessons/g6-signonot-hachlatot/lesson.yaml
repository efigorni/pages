          - שתי דקות בזוגות — בודקים כל החלטה לפי שני הגורמים, ומחליטים יחד באיזה סגנון כדאי לקבל אותה.
          - שמעי שלושה זוגות, ושאלי את הכיתה אם הייתה בוחרת באותו סגנון.
      - ladder:
