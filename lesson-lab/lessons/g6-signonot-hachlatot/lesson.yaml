sub: >-
  יש מי שמחליט מהר, לפי התחושה, ויש מי שבודק כל אפשרות. בשיעור הזה מכירים ארבעה סגנונות של קבלת
  החלטות, מגלים מה הסגנון שלנו, ובודקים מה עוזר לבחור את הסגנון המתאים.
format: מליאה, עבודה אישית וזוגות
question: מה הסגנון שלי בקבלת החלטות — ואיך יודעים איזה סגנון מתאים לכל החלטה?
takeaways:
  - >-
    יש כמה סגנונות של קבלת החלטות — הימור, לפי הרגש, שיקול דעת וניסיון העבר — ולכל אחד מאיתנו יש סגנון
    מועדף.
  - >-
    שני דברים עוזרים לבחור את הסגנון המתאים: כמה ההחלטה חשובה, ולכמה זמן היא תשפיע.
  - כשאנחנו מכירים את הסגנון שלנו, אפשר לבחור — כשצריך — דרך אחרת להחליט.
