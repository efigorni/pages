steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: bear
    title: התור של הדוב
    minutes: 6
    practices:
      - מה הקשר?
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: סרטון קצר על דוב שלא מצליח לבחור תור — מה הבעיה שלו, ומה היינו עושים במקומו
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש תשובות מהירות.
          - הפעילי את הסרטון, ועצרי בנקודה שסימנת.
          - >-
            אחרי הצפייה — שאלי מה הבעיה של הדוב, וספרי בלב עד עשר לפני שאת מזמינה תשובות. על כל תשובה —
            הדהדי, ותני לתלמידים להגיב זה לזה.
      - video:
          title: התור של הדב
          url: https://www.youtube.com/watch?v=IXNyOdMCBww
          length: "1:32"
          before: שני תורים, והתור שלידכם נראה מהיר יותר — עוברים אליו?
          watch: שימו לב לדוב — מה הוא מרגיש, ולמה הוא לא נשאר באותו תור.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו הדוב עובר בפעם הראשונה לתור האחר, כי נדמה לו שהוא מתקדם מהר יותר. צפי בסרטון לפני
                השיעור, ורשמי כאן את הזמן.
              ask: מה הייתם עושים במקומו עכשיו?
          alt: שני תורים לשני דלפקים — תור ארוך ותור קצר — ודמות אחת שעוד לא בחרה
          art: {file: art/queues.svg}
      - ask: מהי לדעתכם הבעיה של הדוב?
      - say: אז הבעיה שלו היא ___ — הבנתי נכון? מי מסכים? מי רואה את זה אחרת?
      - say: לדוב היה קשה להחליט. ולנו — קרה לכם מקרה דומה?

  # ------------------------------------------------------------------ 6′–10′
  - id: week
    title: החלטה מהשבוע
    minutes: 4
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      כתיבה אישית — מצב אחד מהשבוע שבו היה צריך להחליט: מה הייתה ההתלבטות, והחלטנו בשיקול דעת או
      אוטומטית
    body:
      - slide:
          kicker: כולם כותבים · לבד
          title: מתי השבוע הייתם צריכים להחליט?
          points:
            - בחרו מקרה אחד — מה הייתה ההתלבטות?
            - החלטתם בשיקול דעת, או באופן אוטומטי?
          timer: 120
          echo: true
          alt: לוח שנה עם יום מסומן, ותלמיד כותב ליד שולחן
          art:
            - {use: calendar, x: 290, y: 110, w: 280, color: purple}
            - {use: kid-desk, x: 50, y: 215, w: 220, color: teal}
      - moves:
          - הציגי את השאלות, ותני שתי דקות של כתיבה בשקט.
          - >-
            הסתובבי בין השולחנות, וסמני לעצמך שתי החלטות שונות — אחת שהתקבלה אחרי מחשבה, ואחת שהתקבלה
            אוטומטית.
          - הזמיני שלושה לשתף — רק את ההתלבטות, ואת הדרך שבה החליטו.
      - say: כותבים לעצמכם, שתי דקות. כל החלטה נחשבת — קטנה או גדולה.
      - ladder:
          help: חשבו על אחר הצהריים — מה עשיתם, ולמה דווקא את זה?
          challenge: אם הייתם צריכים להחליט שוב — הייתם מחליטים באותה דרך?
      - ask: מי מוכן לספר — מה הייתה ההתלבטות, ואיך החלטתם?
      - say: >-
          יש מי שמחליט מהר, ויש מי שבודק הכול. לדרכים האלה קוראים סגנונות של קבלת החלטות — בואו נכיר
          ארבעה.

  # ------------------------------------------------------------------ 10′–15′
  - id: styles
    title: ארבעה סגנונות
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: ארבעה סגנונות של קבלת החלטות — מנחשים מה מאפיין כל אחד, ורק אז חושפים את ההסבר
    body:
      - slide:
          kicker: סגנון 1 מתוך 4 · מה מאפיין אותו?
          title: הימור
          points:
            - מה שיהיה אני אסתדר איתו, התוצאה פחות חשובה לי
            - ״מה שיוצא אני מרוצה״, ״יהיה בסדר״.
          verbatim: true
          echo: true
          alt: שתי קוביות משחק, ודמות עומדת לידן
          art: {file: art/dice.svg}
      - moves:
          - לכל סגנון — הציגי את השם, שאלי מה מאפיין אותו, וחכי עשר שניות לפני שמזמינים תשובות.
          - >-
            שמעי שתיים־שלוש השערות, ותני לכיתה להגיב — ״מי מסכים? מי חושב אחרת?״ — ורק אז חשפי את ההסבר,
            שורה אחר שורה.
          - הדגישי — אין סגנון טוב או רע, ולרוב לכל אחד יש יותר מסגנון אחד.
      - ask: מה לדעתכם מאפיין את מי שמחליט בסגנון הזה?
      - say: אז לפי מה שאמרת, מי שמחליט ככה ___ — הבנתי נכון? מי רואה את זה אחרת?
      - slide:
          kicker: סגנון 2 מתוך 4
          title: באופן ספונטני על פי הרגש
          points:
            - החלטה על פי הרגש שעולה בי כרגע.
            - מה מרגיש לי הכי נכון לעשות?
            - ״תחושת בטן״
          verbatim: true
          echo: true
          cue: הסגנון הבא —
          alt: לב גדול, ודמות עומדת לידו
          art:
            - {use: heart, x: 260, y: 110, w: 300, color: rose}
            - {use: kid-stand, x: 80, y: 250, w: 130, color: teal}
      - slide:
          kicker: סגנון 3 מתוך 4
          title: שיקול דעת לפי ניתוח כל האפשרויות
          points:
            - בדיקה מעמיקה של כל האפשרויות שיש בפניי.
            - השוואה ביניהן, בדיקת יתרונות וחסרונות.
            - קבלת החלטה לפי תוצאות הבדיקה וההשוואה.
          verbatim: true
          echo: true
          cue: הסגנון הבא —
          alt: מאזניים, וזכוכית מגדלת לידם
          art:
            - {use: scale, x: 250, y: 110, w: 330}
            - {use: magnifier, x: 60, y: 300, w: 150, color: teal}
      - slide:
          kicker: סגנון 4 מתוך 4
          title: ניסיון העבר
          points:
            - החלטה על פי ניסיון שיש לי,
            - החלטה על פי החלטות קודמות שקיבלתי ולמדתי מהן.
          verbatim: true
          echo: true
          cue: הסגנון האחרון —
          alt: ספר פתוח, וחץ שמצביע אחורה
          art:
            - {use: book, x: 240, y: 200, w: 330, color: purple}
            - {use: arrow, x: 40, y: 90, w: 180, color: gray, flip: true}
      - say: ואיזה מהסגנונות הכי מוכר לכם? בואו נבדוק.

  # ------------------------------------------------------------------ 15′–22′
  - id: quiz
    title: מה הסגנון שלי?
    minutes: 7
    practices:
      - הוצאה למשימה
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: שאלון אישי של 14 היגדים — מקיפים, סופרים לפי ארבעת הסגנונות, ומשתפים בזוגות
    body:
      - slide:
          kicker: שאלון אישי · לבד
          title: אז מה הסגנון שלי?
          sub: הקיפו בדף את ההיגדים שמתאימים לכם — אפשר יותר מאחד.
          timer: 180
          echo: true
          alt: תלמיד כותב ליד שולחן, וזכוכית מגדלת לידו
          art:
            - {use: kid-desk, x: 270, y: 130, w: 280, color: teal}
            - {use: magnifier, x: 60, y: 80, w: 150, color: teal}
      - moves:
          - >-
            חלקי את השאלון, והסבירי: ההיגדים נאמרו על ידי ילדים שהתקשו להחליט. כל אחד מקיף את ההיגדים
            שמתאימים לו כשהוא צריך להחליט.
          - >-
            שלוש דקות של עבודה בשקט. אחר כך הציגי את המפתח — כל אחד סופר כמה היגדים סימן בכל סגנון, וכותב
            את המספרים במחברת.
          - דקה בזוגות — ״מה הסגנון שלכם, ומה הפתיע אתכם?״ — ואחר כך שמעי שניים־שלושה מתנדבים.
      - say: >-
          ההיגדים נאמרו על ידי ילדים שהתקשו להחליט. הקיפו כל היגד שמתאים לכם — אין תשובה נכונה, ואף אחד לא
          יאסוף את הדף.
      - task:
          what: >-
            כל אחד מקיף בשאלון את ההיגדים שמתאימים לו, סופר לפי המפתח שעל המסך כמה היגדים סימן בכל סגנון,
            וכותב את המספרים במחברת. אחר כך — דקה בזוגות.
          time: 3 דקות להקפה, דקה לספירה, דקה בזוגות
          group: לבד ← זוגות
          rules: אפשר לסמן כמה היגדים בכל סגנון; הדף נשאר אצלכם; בזוג משתפים רק במה שרוצים
          plenary: שניים־שלושה מתנדבים מספרים מה הסגנון שלהם, והאם זה הפתיע אותם
          help: קראו כל היגד ושאלו את עצמכם — ככה אני מחליט בדרך כלל?
          challenge: באיזה מצב הייתם רוצים להחליט בסגנון אחר מהסגנון המועדף שלכם?
      - handout:
          title: אז מה הסגנון שלי?
          copies: עותק לכל תלמיד
          verbatim: true
          lines: false
          items:
            - אני מחליט/ה מה שנראה לי באותו הרגע, לפי התחושה שלי.
            - אהיה מוכן/ה להחליט רק אחרי שאבחן את כל האפשרויות שעומדות בפניי.
            - זו בעיה שנתקלתי בה בעבר. אפעל לפי מה שהחלטתי בפעם הקודמת.
            - לא משנה מה אחליט, עם כל החלטה אסתדר בסוף.
            - אני לא יכול/ה להחליט, אבקש ממישהו אחר להחליט במקומי, ומה שיהיה – יהיה.
            - אני מנסה להיזכר אם נתקלתי בדבר כזה בעבר. אם כן, אני פשוט מחליט/ה אותו דבר.
            - אני מעדיף/ה להטיל מטבע ולסמוך על המזל.
            - רק אם חושבים היטב על העניין ובוחנים את כל האפשרויות, אפשר לקבל החלטה נכונה.
            - אני שונא/ת להתלבט, לכן אני מחליט/ה מהר, לפי מה שמתאים לי באותו רגע.
            - אני מתלבט/ת ומתלבט/ת... ומחכה עד הרגע האחרון, ואז מחליט/ה בלי לחשוב יותר מדי.
            - קשה לי להחליט, בכל רגע אני משנה את דעתי. בסוף אני מחליט/ה לפי מה שמרגיש לי הכי נכון.
            - אני בודק/ת את כל הדברים, ורק כשאני בטוח/ה שזו ההחלטה הנכונה, אני מחליט/ה.
            - אני סומך/ת רק על עצמי, ולכן אני מחליט/ה רק על פי מה שהצליח לי בעבר.
            - אני צריך/ה לברר מידע לפני שאני מחליט/ה.
      - slide:
          kicker: מנתחים · אז מה הסגנון שלי?
          title: כמה היגדים סימנתם בכל סגנון?
          points:
            - הימור — 4, 5, 7, 10
            - ספונטני, לפי הרגש — 1, 9, 11
            - שיקול דעת — 2, 8, 12, 14
            - ניסיון העבר — 3, 6, 13
          echo: true
          cue: אחרי שלוש דקות של הקפה —
          alt: קובייה, לב, מאזניים וספר — סמל לכל סגנון
          art: {file: art/key.svg}
      - slide:
          kicker: בזוגות · ואז במליאה
          title: מה הסגנון שלכם — ומה הפתיע אתכם?
          sub: הסגנון עם הכי הרבה היגדים הוא המועדף. אפשר שיהיו כמה.
          echo: true
          cue: אחרי הספירה —
          alt: זוג יד ביד, ובועת דיבור מעליו
          art:
            - {use: pair, x: 110, y: 226, w: 260}
            - {use: speech-l, x: 360, y: 40, w: 200}
      - ask: מה הסגנון שלכם — והאם אתם מופתעים לגלות שכך אתם מקבלים החלטות?
      - whisper: >-
          ״הימור״ עלול להישמע כמו עלבון. מי שמתבייש בסגנון שלו — הזכירי שלכל סגנון יש מצבים שבהם הוא מתאים,
          ושאף אחד לא חייב לספר.

  # ------------------------------------------------------------------ 22′–27′
  - id: factors
    title: מה עוזר לבחור סגנון?
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: שני גורמים — החשיבות וטווח הזמן — ודוגמאות של החלטה קטנה מול החלטה גדולה
    body:
      - slide:
          kicker: גורמים המשפיעים על בחירת הסגנון
          title: מה עוזר לבחור את הסגנון המתאים?
          points:
            - מידת החשיבות של נושא ההחלטה
            - טווח הזמן עליו משפיעה ההחלטה
          verbatim: [points]
          echo: true
