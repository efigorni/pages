<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540">
  <!-- שני תורים לשני דלפקים: תור ארוך רחוק, תור קצר קרוב, ודמות אחת שעוד לא בחרה (ציור ייעודי) -->
  <g filter="url(#rough)">
    <!-- הדלפק הרחוק -->
    <rect x="24" y="96" width="100" height="160" rx="10" fill="#ffffff" stroke="#13100e" stroke-width="5" stroke-linejoin="round"/>
    <rect x="24" y="96" width="100" height="30" rx="8" fill="#847c74"/>
    <rect x="42" y="146" width="64" height="44" rx="6" fill="#e6f2f1" stroke="#13100e" stroke-width="4"/>
    <!-- התור הרחוק: שלושה -->
    <use href="#kid-stand" x="140" y="88" width="84" height="168" color="#8c82c1"/>
    <use href="#kid-stand" x="222" y="88" width="84" height="168" color="#f7ae4d"/>
    <use href="#kid-stand" x="304" y="88" width="84" height="168" color="#8c82c1"/>
    <!-- הדלפק הקרוב -->
    <rect x="20" y="300" width="118" height="200" rx="12" fill="#ffffff" stroke="#13100e" stroke-width="5" stroke-linejoin="round"/>
    <rect x="20" y="300" width="118" height="36" rx="10" fill="#847c74"/>
    <rect x="40" y="360" width="78" height="54" rx="6" fill="#e6f2f1" stroke="#13100e" stroke-width="4"/>
    <!-- התור הקרוב: שניים -->
    <use href="#kid-stand" x="150" y="292" width="104" height="208" color="#f7ae4d"/>
    <use href="#kid-stand" x="252" y="292" width="104" height="208" color="#8c82c1"/>
    <!-- מי שעוד לא בחר -->
    <use href="#kid-stand" x="440" y="240" width="130" height="260" color="#63b1af"/>
  </g>
  <text x="505" y="222" font-family="Secular One, Arial Hebrew, sans-serif" font-size="90" text-anchor="middle" fill="#13100e">?</text>
</svg>
