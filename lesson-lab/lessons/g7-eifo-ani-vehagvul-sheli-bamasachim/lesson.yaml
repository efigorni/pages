              התחומים.
            - >-
              זמן ממושך במסך עלול לפגוע בתפקוד היומיומי שלנו, עם זאת, למסכים יתרונות רבים היכולים לשפר את חיינו.
            - >-
              חשוב שנהיה מודעים לשימוש שלנו במסכים — מה אנחנו עושים? מתי? האם זה מיטיב איתנו? עד כמה השימוש שלנו
              במסכים מאוזן ואינו מפריע לנו בקשרים שלנו עם אחרים, במשימות ובתחומי עניין נוספים.
