# איפה אני ומה הגבול שלי? — כיתה ז׳, נורמות התנהגות וגבולות ברשת, שיעור 2 (מקור: sources/text/7/Eifo_Ani_Vehagvul_Sheli_Bamasachim.md)
slug: g7-eifo-ani-vehagvul-sheli-bamasachim
title: איפה אני ומה הגבול שלי?
grade: 7
grades_served: [7]
month: פברואר
section: התנהלות מיטבית ברשת ומניעת פגיעה (פברואר)
unit: נורמות התנהגות וגבולות לקידום מרחב בטוח וחיובי ברשת
unit_order: 2
unit_size: 3
