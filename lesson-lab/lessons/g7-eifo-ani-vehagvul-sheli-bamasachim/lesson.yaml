          group: רביעיות לפי השולחנות; כל אירוע — לשתיים–שלוש רביעיות
          rules: כל אחד אומר משהו לפני שמנסחים את המשפט; מספרים רק על עצמנו, ומותר לוותר על שאלה
          plenary: נציג מכל רביעייה אומר את המשפט
          help: מה הדמות באירוע מרגישה — ומה היא מפספסת?
          challenge: מה הייתם מציעים לדמות לעשות, כך שיהיה מקום גם למסך וגם לדבר האחר?
      - board:
          - שתפו את חבריכם לקבוצה ברגשות ובמחשבות שלכם לגבי האירוע.
          - האם נחשפתם למצבים דומים בבית או בבית הספר? ספרו בקבוצה כיצד התמודדתם.
          - מה לדעתכם עלול להיות המחיר של שימוש לא מאוזן במסכים?
      - handout:
          title: כרטיסי אירוע
          copies: שלושה עותקים, גזורים לכרטיסים — כרטיס אחד לכל רביעייה
          verbatim: true
          items:
