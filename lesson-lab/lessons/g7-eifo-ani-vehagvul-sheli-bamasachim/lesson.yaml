steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: line
    title: מסכימומטר
    minutes: 7
    stance: true
    practices:
      - מה הקשר?
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: ארבעה משפטים על יום עם הטלפון; כל אחד נעמד על הקו לפי כמה הוא מסכים, ומתנדב מכל צד מסביר
    body:
      - slide:
          kicker: מסכימומטר · על הקו
          title: מסכימים או לא מסכימים?
          sub: קצה אחד — מסכימים לגמרי. הקצה השני — לא מסכימים בכלל.
          alt: קו על הרצפה, אגודל למעלה בקצה אחד ואגודל למטה בשני, ודמות עומדת עליו
          art: {file: art/agree-line.svg}
      - moves:
          - הכיתה נכנסת ונעמדת לאורך הקו. הראי את שני הקצוות, ואמרי שגם כל נקודה באמצע היא תשובה.
          - הקריאי משפט, וחכי חמש שניות של שקט לפני שזזים.
          - >-
            כשכולם במקום, שאלי מתנדב אחד מכל צד למה בחר במקום שלו. אחר כך תארי במילים את הפיזור — איפה רוב
            הכיתה, ואיפה הקו מתרוקן.
          - אחרי המשפט הרביעי — שאלת סיכום, וחוזרים למקומות.
      - say: >-
          לפני כל משפט חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז זזים. אין תשובה נכונה, מותר לעמוד
          באמצע, ומסבירים רק על עצמנו.
      - slide:
          kicker: משפט 1 · בבוקר
          title: הטלפון הוא הדבר הראשון שאני רואה בבוקר
          sub: לפני השירותים, מברשת שיניים או ארוחת בוקר.
          verbatim: true
          echo: true
          cue: אחרי ההסבר —
          alt: שמש, וטלפון גדול לידה
          art:
            - {use: phone, x: 170, y: 150, w: 170}
            - {use: sun, x: 390, y: 40, w: 190}
      - slide:
          kicker: משפט 2 · במשך היום
          title: סוללה נמוכה בטלפון מלחיצה אותי.
          verbatim: true
          echo: true
          cue: המשפט הבא —
          alt: סוללה עם פס אדום אחד
          art: battery-low
      - slide:
          kicker: משפט 3 · בלילה
          title: כשאני עייף/ה מאוד והולך לישון
          sub: אני עדיין מוצא/ת את עצמי מעביר/ה עוד שעה מול הטלפון במיטה.
          verbatim: true
          echo: true
          cue: המשפט הבא —
          alt: טלפון, ירח ושעון
          art: {file: art/night.svg}
      - slide:
          kicker: משפט 4 · ובסך הכול
          title: אני נמצא ברשתות החברתיות יותר זמן מכפי שהייתי רוצה.
          verbatim: true
          echo: true
          cue: המשפט האחרון —
          alt: רשת של עיגולים מחוברים, ושעון בפינה
          art:
            - {use: network, x: 90, y: 150, w: 320}
            - {use: clock, x: 430, y: 50, w: 150}
      - ask: מה הפתיע אתכם בפיזור של הכיתה? מי רוצה להגיב למשהו שנאמר על הקו?
      - say: עמדנו על הקו לפי מה שאנחנו עושים עם הטלפון. עכשיו נבדוק מה קורה כשהוא לא איתנו.

  # ------------------------------------------------------------------ 7′–13′
  - id: phone
    title: בחרי מסלול — בלי הטלפון
    minutes: 6
    summary: פרידה מהטלפון, באמת או בדמיון
    body:
      - tracks:
          - title: אני והנייד
            text: >-
              הטלפונים עוברים לסלסלה עד סוף השיעור. כל אחד כותב איך הוא מרגיש ואיזה דימוי עולה בו, ושומעים סבב
              מהיר.
            when: מותר להחזיק טלפונים בשיעור, ואפשר לאסוף אותם בלי מאבק — הפרידה עצמה היא הגירוי.
            practices:
              - כולם כותבים
            spotlights:
              - עניין ורלוונטיות
              - הערכה ורפלקטיביות
            prep:
              - סלסלה לטלפונים
            body:
              - slide:
                  kicker: אני והנייד · לבד, בכתב
                  title: איך אתם מרגישים כשלוקחים לכם את הטלפון?
                  sub: איזה דימוי עולה בכם? מילה, משפט או תמונה.
                  timer: 90
                  echo: true
                  alt: דמות, ומעליה ענן מחשבה ובתוכו טלפון
                  art:
                    - {use: thought, x: 60, y: 24, w: 300}
                    - {use: phone, x: 168, y: 74, w: 84}
                    - {use: kid-stand, x: 330, y: 230, w: 130, color: teal}
              - moves:
                  - הציגי את השקף, ותני דקה וחצי לכתיבה בשקט. בזמן הכתיבה הסלסלה עוברת בין השולחנות.
                  - מי שאין לו טלפון בשיעור כותב על רגע שבו נשאר בלי.
                  - סבב מהיר — כל אחד אומר מילה או דימוי, בלי הסבר. מותר לעבור.
                  - רשמי את הדימויים על הלוח תוך כדי הסבב.
              - p: >-
                  הטלפונים נשארים בסלסלה עד הדלת: בסוף השיעור, מי שמוסר את כרטיס היציאה לוקח את הטלפון שלו.
              - ladder:
                  help: השלימו את המשפט ״בלי הטלפון אני מרגיש כמו…״
                  challenge: יש גם משהו טוב ברגע הזה? כתבו דימוי שני, הפוך.
              - ask: מה משותף לדימויים שעל הלוח?
          - title: ניסוי המסכים הגדול
            text: >-
              מקריאים מכתב שמזמין כיתה ז׳ לשבוע בלי סמארטפון. חצי כיתה מחפשת נימוקים בעד וחצי נגד, ובסוף כל אחד
              מצביע בשביל עצמו.
            when: הטלפונים לא נמצאים בכיתה בכל מקרה, או שהכיתה אוהבת ויכוח.
            practices:
              - הוצאה למשימה
            spotlights:
              - שיתופיות בלמידה
              - אחריות ובחירה
            body:
              - p: >-
                  המכתב הוא הזמנה דמיונית — הציגי אותו כך, ואל תציגי אותו כמכתב אמיתי ממשרד החינוך. הכיתה לא
                  מתבקשת להתחייב לשום דבר.
              - slide:
                  kicker: ניסוי המסכים הגדול
                  title: שבוע שלם בלי סמארטפון
                  sub: מכתב לכיתות ז׳ — דמיינו שהוא הגיע אלינו.
                  alt: מעטפה סגורה, ולוח שנה לידה
                  art:
                    - {use: envelope, x: 150, y: 180, w: 320}
                    - {use: calendar, x: 430, y: 40, w: 150}
              - say: דמיינו שהמכתב הזה הגיע אלינו.
              - quote:
                  title: המכתב — להקריא
                  text: |
                    שלום רב תלמידי כיתה ז׳ יקרים!
                    כחלק מהמאמצים החינוכיים לשימוש מאוזן במסכים, החלטנו השנה להכריז על ׳ניסוי חברתי׳ מיוחד במינו.
                    אנחנו מחפשים כיתה ז׳ שכל תלמידיה יסכימו להשתתף ב״ניסוי המסכים הגדול!״
                    ומה כולל הניסוי? במשך שבוע יילקחו מהתלמידים הסמארטפונים הפרטיים שלהם.
                    התלמידים יתחייבו לא להשתמש כל אותו שבוע בטלפון של מישהו אחר למטרות גלישה, התכתבות, משחק, שימוש באפליקציות...
                    בנוסף, התלמידים יתחייבו לא להשתמש כל אותו שבוע במחשבים, באייפדים, בטאבלטים, בשעוני גוגל וכולי – אלא למטרות למידה.
                    באותו שבוע נחלק לכל תלמיד מכשיר טלפון פשוט שאין בו חיבור לרשת אך ניתן לקבל ולהוציא ממנו שיחות.
                    הניסוי יסתמך על אמון אישי ויותנה בהסכמת הורים.
                    את הכיתה, שכל תלמידיה יעמדו במשימה, נראיין בסוף אותו שבוע ונלמד מניסיונה.
                    חשוב לציין שלאורך כל אותו שבוע התלמידים יזכו לפעילויות פנאי והעשרה במסגרת תכנית הלימודים בכיתה.
                    ההרשמה לניסוי תתבצע בעזרת המחנכת דרך מזכירות בית הספר.
              - moves:
                  - הקריאי את המכתב כמו שהוא.
                  - חלקי את הכיתה לשני צדדים לפי מקומות הישיבה — צד אחד בעד, הצד השני נגד.
                  - שמעי שלושה נימוקים מכל צד, ועברי להצבעה. בהצבעה כל אחד בוחר בשביל עצמו.
              - slide:
                  kicker: בעד או נגד · עם השכנים
                  title: למה כן להצטרף — ולמה לא?
                  sub: חצי כיתה בעד, חצי נגד. שתי דקות למצוא נימוקים.
                  timer: 120
                  cue: אחרי ההקראה —
                  alt: מאזניים, אגודל למעלה מצד אחד ואגודל למטה מהצד השני
                  art:
                    - {use: scale, x: 160, y: 60, w: 300}
                    - {use: thumb-up, x: 440, y: 330, w: 130}
                    - {use: thumb-down, x: 50, y: 330, w: 130}
              - task:
                  what: מחפשים נימוקים לצד שקיבלנו — גם אם אנחנו חושבים אחרת.
                  time: 2 דקות
                  group: חצי כיתה בעד וחצי נגד, לפי צד הכיתה; מדברים עם השכנים
                  rules: כל זוג מוצא לפחות נימוק אחד; מותר להיעזר בפרטים מהמכתב
                  plenary: שלושה נימוקים מכל צד, ואז הצבעה — כל אחד בשביל עצמו, לא לפי הצד שקיבל
                  help: מה הייתם מרוויחים משבוע כזה — ומה הייתם מפסידים?
                  challenge: מצאו נימוק שהצד השני יתקשה לענות עליו.
              - slide:
                  kicker: הצבעה
                  title: ואם המכתב היה אמיתי — הייתם נרשמים?
                  cue: אחרי הנימוקים —
                  alt: דמות אחת מרימה יד, ודמות שנייה עומדת לידה
                  art:
                    - {use: kid-hand, x: 330, y: 150, w: 150}
                    - {use: kid-stand, x: 150, y: 170, w: 140, color: purple}
              - ask: ואם המכתב היה אמיתי — מי היה נרשם? הצביעו.
      - say: >-
          שמענו כמה הטלפון חשוב לנו. ובכל זאת, יש רגעים שבהם דווקא הוא לוקח מאיתנו משהו. בואו נפגוש כמה כאלה.

  # ------------------------------------------------------------------ 13′–22′
  - id: events
    title: שלושה אירועים מהחיים
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      ברביעיות — אירוע אחד מתוך שלושה, שיחה לפי שאלות ומשפט מסר; במליאה — מה המסך עלול לקחת מאיתנו
    body:
      - slide:
          kicker: שלושה אירועים · ברביעיות
          title: מה קורה כאן — ומה המחיר?
          sub: קראו את האירוע, דברו לפי השאלות שעל הלוח, ונסחו משפט אחד.
          timer: 240
          alt: ארבעה סביב שולחן עגול, ודף לידם
          art:
            - {use: circle4, x: 160, y: 110, w: 300}
            - {use: note, x: 450, y: 280, w: 130}
      - moves:
          - חלקי לכל רביעייה כרטיס אירוע. שלוש השאלות כבר על הלוח.
          - בדקי הבנה בשאלה אחת (״עם מה יוצאים מהשיחה?״), ושלחי לעבודה.
          - הסתובבי בין הרביעיות. דקה לפני הסוף — הזכירי לנסח את המשפט ולכתוב אותו על הכרטיס.
          - >-
            במליאה — רביעייה אחת לכל אירוע מספרת בקצרה מה קרה בו, ואחריה כל הרביעיות עם אותו אירוע אומרות את
            המשפט שלהן.
          - אחרי המשפטים — שקף ״המחיר״. חשפי תחום אחד בכל פעם, וחברי אליו משפט ששמעת מרביעייה.
      - say: >-
          כל רביעייה מקבלת אירוע אחד מהחיים. קראו אותו בקול, דברו עליו לפי השאלות שעל הלוח, ובסוף נסחו משפט
          אחד — המסר שלכם.
      - task:
          what: >-
            כל רביעייה קוראת אירוע אחד, מדברת עליו לפי השאלות שעל הלוח, ומנסחת משפט אחד — המסר של האירוע —
