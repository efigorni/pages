              פיזיולוגיים: חוסר בפעילות גופנית, ישיבה ממושכת, העדר שעות שינה, בעיות שינה.
            - >-
              קוגניטיביים: פגיעה בלמידה, בריכוז וביכולת המיקוד במשימה.
            - >-
              רגשיים: השפעה על היכולת לפתח אמפתיה, הקצנה של רגשות, תחושת בדידות (מול הפער של ריבוי חברים ברשת),
