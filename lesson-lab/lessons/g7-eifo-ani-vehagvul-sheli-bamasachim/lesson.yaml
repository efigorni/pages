              בחט״ב שבה לומדת אחותי, ההנהלה החליטה שניתן להשתמש בטלפונים במהלך ההפסקות רק בתוך הכיתה, לא בחצר.
              אחותי סיפרה לי שכמעט כל הילדים לא יוצאים החוצה בהפסקה, כי הם נשארים בכיתה עם הטלפונים.
            - >-
              במשפחת שושני עסוקים בהכנות לארוחת ערב בה חוגגים גם יום הולדת לדן. דן, ילד יום ההולדת משחק FIFA
              באקס בוקס, אחותו, דניאל, רואה סרטון בסמארטפון ומיכל, אחות נוספת, משחקת בטאבלט. כאשר מגיעה שעת
              הארוחה, ההורים קוראים לכולם לגשת לשולחן לארוחה משפחתית חגיגית...
            - >-
              לגילי יש מחר בחינה בספרות, אליה היא מתכוננת כבר כמה שעות, חשוב לה להצליח. תוך כדי הלמידה, גילי
              מקבלת חמש התראות באינסטגרם. היא מתלבטת מה לעשות ומחליטה לפתוח ולקרוא אותן. היא רואה תמונות מהמסיבה
              האחרונה שהייתה בשכבה, אליה היא לא הוזמנה. נכנסת שיחה מחברה טובה שלה...
