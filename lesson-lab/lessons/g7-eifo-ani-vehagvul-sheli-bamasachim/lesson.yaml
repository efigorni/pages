sensitivity: low

sub: >-
  הטלפון איתנו מהבוקר ועד הלילה. בשיעור הזה בודקים איפה כל אחד עומד, מה המסך נותן ומה הוא לוקח —
  ובוחרים גבול אחד שמתאים לנו.
format: עמידה על קו, רביעיות ומליאה
question: מתי המסך עושה לנו טוב, מתי הוא לוקח מאיתנו — ואיזה גבול מתאים לנו?
takeaways:
  - >-
    למסכים יש יתרונות רבים — אבל בלי מודעות ובלי גבול, הם עלולים לקחת מהשינה, מהלמידה, מהרגשות ומהקשרים
    שלנו.
  - >-
    כדאי לשאול את עצמנו: מה אני עושה במסך, מתי, והאם זה מיטיב איתי?
  - >-
    גבול קטן וברור — ארוחה בלי טלפונים, הטלפון מחוץ לחדר בלילה — עוזר לי לנהל את המסך, ולא שהמסך ינהל
    אותי.
prep:
  - >-
    קו ארוך של נייר דבק באלכסון על רצפת הכיתה, ושלט בכל קצה — ״מסכימים לגמרי״ ו״לא מסכימים בכלל״. פני
    מעבר לאורך הקו.
  - חלוקה מראש לרביעיות לפי השולחנות, ואיזה אירוע מקבלת כל רביעייה — כל אירוע לשתיים–שלוש רביעיות
  - שלוש השאלות של ״שלושה אירועים מהחיים״ — כתובות על הלוח לפני השיעור

safe:
  - head: עמידה מול הכיתה
    text: >-
      במסכימומטר עומדים לפי הרגלים אמיתיים, לא לפי מצב דמיוני — ולכן המשפטים נבחרו כך שלא יביכו. מותר
      לעמוד באמצע; מסבירים רק מתנדבים, ורק על עצמם. מי שאין לו טלפון עומד לפי מה שנכון לו — ״לא מסכים״
      היא תשובה מלאה. צחוק על המקום של מישהו על הקו — עוצרים מיד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״במה לאירוע״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps: [line, events]
    text: במסכימומטר עוברים שני משפטים בלבד, ובמליאת האירועים שומעים רביעייה אחת לכל אירוע

brain_break:
  signs: עיניים כבדות, ראשים על השולחן, שקט שלא נשבר גם אחרי שאלה.
  ideas:
    - name: סופרים עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר את המספר הבא, בלי סדר ובלי סימנים. שניים מדברים
        יחד? מתחילים מאחת.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
  from: again

