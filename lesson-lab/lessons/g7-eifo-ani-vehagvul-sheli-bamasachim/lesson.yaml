          title: איפה אני ומה הגבול שלי?
          prompts:
            - משהו שלמדתי על עצמי היום — על הטלפון ביום שלי.
            - צעד אחד שאני מוכן לנסות השבוע — מתי ואיפה?
            - מה יעזור לי לעמוד בו?
          look_for: >-
            חפשי צעדים כלליים מדי (״להשתמש פחות״) לעומת צעדים עם זמן ומקום, ופתקים שמספרים על לחץ, שינה או
            בדידות סביב הטלפון — עם אלה מדברים בשקט השבוע.
          timer: 180
          alt: תלמיד כותב ליד שולחן, ופתק כתום לידו
          art:
            - {use: kid-desk, x: 230, y: 110, w: 288}
            - {use: sticky, x: 40, y: 70, w: 170}
      - p: >-
          עמדי בדלת ואספי את הפתקים אחד־אחד. במסלול ״אני והנייד״ — כאן גם מחזירים את הטלפונים מהסלסלה.
