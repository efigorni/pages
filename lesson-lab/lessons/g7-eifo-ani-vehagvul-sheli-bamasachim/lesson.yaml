          tip: >-
            חמשת הראשונים חוזרים על ״המחיר״ שבנינו מהאירועים, תחום בכל שקף. השישי מסביר את גילי ואת משפחת
            שושני — אי אפשר להיות בכמה מקומות בבת אחת; השביעי שומר על איזון — למסכים יש גם יתרונות; האחרון
