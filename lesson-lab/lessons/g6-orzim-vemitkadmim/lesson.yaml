  # ------------------------------------------------------------------ +5′
  - id: unit
    title: מסכמים את היחידה
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: שתי שאלות מסיכום היחידה — מה איפשרו לכם המפגשים, ומה למדתם מההתבוננות על עצמכם
    body:
      - whisper: >-
          היחידה ״המעבר לחטיבת הביניים״ עוסקת בחששות שאפשר לראות כהזדמנויות, במשאבים שיעזרו במעבר
          (״העוגנים״), בזיכרונות מהכיתה, בדברים שלוקחים לדרך ובחותם שמשאירים, בדברים שמשאירים מאחור — השיעור
          הזה — ובשאלות לקראת החטיבה. מי שלא היה במפגשים עונה מתוך השיעור הזה.
      - slide:
          kicker: אם נשאר זמן · מסכמים יחידה
          title: מה למדתם מהתבוננות על עצמכם?
          sub: על התנהגותכם כלפי אחרים?
          verbatim: true
          echo: true
          timer: 120
          alt: דרך מתפתלת אל האופק, ודגל לידה
          art:
            - {use: road, x: 60, y: 150, w: 340}
            - {use: flag, x: 410, y: 80, w: 170}
      - moves:
          - שתי דקות של כתיבה בשקט, במחברת — משפט או שניים.
          - שאלי את השאלה השנייה בעל פה, ושמעי שלושה־ארבעה מתנדבים.
      - say: מי שלא היה בכל המפגשים — ענו מתוך השיעור של היום.
      - ladder:
          help: השלימו — ״גיליתי שאני…״.
          challenge: מה תעשו אחרת בחטיבה בגלל מה שגיליתם על עצמכם?
      - ask: מה איפשרו לכם המפגשים שלנו?

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — הדרך האחרת שלי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: הזדמנות ללמידה אחת שלוקחים לחטיבה, ומה יעזור להצליח בה; שורת רשות — פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כותבים רק על הדרך האחרת, לא על מה שמשאירים
          מאחור. כולם מוסרים פתק בדלת.
      - exit:
          form: board
          title: הדרך האחרת שלי
          prompts:
            - הזדמנות ללמידה אחת שאני לוקח איתי לחטיבה — מה אעשה אחרת?
            - מה יעזור לי להצליח בזה?
            - רשות — ״רציתי לומר לך ש…״
          look_for: >-
            חפשי פתקים שחוזרים למה שמשאירים מאחור במקום לדרך האחרת, הזדמנויות כלליות מדי (״להיות יותר
            טוב״), ו״רציתי לומר לך״ שמבקש שיחה. עם אלה מדברים בשקט השבוע — ומה שנוגע בפגיעה עובר ליועצת עוד
            היום.
          timer: 180
          alt: דלת פתוחה ואור בפנים, ופתק לידה
          art:
            - {use: door, x: 290, y: 70, w: 240}
            - {use: sticky, x: 50, y: 300, w: 190}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
