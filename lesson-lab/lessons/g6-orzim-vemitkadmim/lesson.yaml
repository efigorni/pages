brain_break:
  signs: מבטים בחלון, ראשים על השולחן, שקט כבד אחרי הכתיבה האישית.
  ideas:
    - name: ניעור
      text: קמים ומנערים יד ימין חמש פעמים, יד שמאל, רגל ימין ורגל שמאל — ואז ארבע, שלוש, שתיים ואחת. בכל סבב מהר יותר.
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: חמש נשימות
      text: עיניים עצומות או מבט לרצפה. שואפים באף בספירה עד ארבע ונושפים לאט בפה. חמש פעמים.
  from: unit

