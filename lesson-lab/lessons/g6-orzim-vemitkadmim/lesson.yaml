sub: >-
  יש דברים שכולנו היינו מעדיפים להשאיר מאחור. בשיעור הזה כל אחד כותב לעצמו מה הוא משאיר, מוצא בזה
  הזדמנות ללמידה — מה יעשה אחרת בחטיבה — ומשאיר לחברים טיפ או איחול לדרך.
format: עבודה אישית, זוגות ומליאה
question: מה הייתי מעדיף להשאיר מאחור — ומה אפשר ללמוד מזה לדרך החדשה?
takeaways:
  - טבעי שיש דברים שנרצה להשאיר מאחור — כישלונות, מריבות, התנהגויות שאנחנו מצטערים עליהן.
  - אפשר להשאיר דברים מאחור, אבל חבל לפספס את ההזדמנות ללמוד מהם — להפוך את הלימון ללימונדה.
  - הזדמנות ללמידה היא דרך אחרת — מה אעשה יותר, מה אעשה פחות, ואיך.
prep:
  - חצי דף ריק לכל תלמיד — לרשימה האישית, שלא נאספת
  - פתקיות לכל תלמיד, ומקום על הלוח (או גיליון גדול על הקיר) עם הכותרת ״טיפים ואיחולים לדרך החדשה״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — היזכרות בדברים שהתלמידים היו מעדיפים להשאיר מאחור: כישלונות, מריבות,
      אכזבות והתנהגויות שהם מצטערים עליהן. שאלי מי בכיתה עבר שנה קשה — חרם, מריבה מתמשכת, כישלון שמלווה
      אותו או משבר בבית — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שנפגע בבית הספר עלול להיזכר בפגיעה, ולהרגיש ש״להשאיר מאחור״ פירושו שהאשמה עליו. אמרי בבירור
      שמתמקדים בהתנהגויות ובהרגלים שלנו שהיינו רוצים לשנות — לא במה שאחרים עשו לנו. בדוגמאות לא מזכירים
      אירועים מהכיתה ולא שמות.
  - head: לא לוחצים לשתף
    text: >-
      הרשימה האישית לא נאספת, לא מוקראת ולא נבדקת. בזוגות ובמליאה מספרים רק על ההזדמנות, לא על מה
      שמאחוריה. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא
      מבטיחים לשמור בסוד.

time:
