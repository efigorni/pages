# אורזים ומתקדמים — כיתה ו׳, המעבר לחטיבת הביניים, שיעור 5 (מקור: sources/text/6/Orzim_Vemitkadmim.md)
# במקור אין שקף מסרים ואין שקף סיכום שמנוסח כמסר — לכן אין "חשוב לזכור" (D50–D51). סיכום היחידה — הרחבה (D49).
