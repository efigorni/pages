# אלכוהול לא מדבר אליי — כיתה ז׳, מתבגרים בבריאות, שיעור 4 (מקור: sources/text/7/Alkohol4.md)
# מצגת לשני שיעורים (D37): ליבה של 35′ והרחבות. סיכום היחידה — הרחבה שעומדת בפני עצמה (D49).
