steps:
  # ------------------------------------------------------------------ 0′–9′
  - id: line
    title: הקו האדום שלי
    minutes: 9
    stance: true
    practices:
      - מה הקשר?
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - אחריות ובחירה
    summary: >-
      סרט אדום לאורך הכיתה ושלוש סיטואציות — כל אחד מחליט אם לעבור את הקו, ומתנדב מכל צד מסביר
    body:
      - slide:
          kicker: הקו האדום שלי · עומדים על הקו
          title: האם לעבור את הקו?
          sub: עוברים את הקו — עושים את המעשה. נשארים — לא.
          echo: true
          alt: קו אדום, דמות עומדת לידו, וחץ שעובר אותו
          art:
            - {use: red-line, x: 150, y: 234, w: 320, rotate: 90}
            - {use: kid-stand, x: 400, y: 140, w: 150, color: teal}
            - {use: arrow, x: 180, y: 250, w: 150, color: gray}
      - moves:
          - >-
            הכיתה נכנסת ונעמדת בצד אחד של הסרט. הסבירי: עוברים את הקו — עושים את המעשה; נשארים — לא. מותר לעמוד
            על הקו עצמו.
          - הקריאי סיטואציה, וחכי חמש שניות של שקט — ורק אז זזים.
          - >-
            כשכולם במקום, שאלי מתנדב אחד מכל צד למה בחר במקום שלו. אחר כך תארי במילים את הפיזור — איפה רוב
            הכיתה, ואיפה הקו מתרוקן.
          - אחרי הסיטואציה השלישית — שאלת סיכום, וחוזרים למקומות.
      - say: >-
          לפני כל סיטואציה חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז זזים. אין תשובה נכונה, מותר לעמוד
          על הקו, ומסבירים רק על עצמנו.
      - slide:
          kicker: קו אדום · 1
          title: תחצו או לא תחצו?
          sub: אתם עומדים לחצות את הכביש. הרמזור אדום, אתם רואים שאין מכוניות.
          verbatim: true
          echo: true
          cue: אחרי ההסבר —
          alt: רמזור, ודמות עומדת לידו
          art:
            - {use: traffic-light, x: 330, y: 70, w: 170}
            - {use: kid-stand, x: 120, y: 130, w: 140, color: teal}
      - slide:
          kicker: קו אדום · 2
          title: הזמינו אתכם למסיבה.
          sub: ידוע שכל מי שבא למסיבה – שותה.
          points:
            - כל המקובלים של הכיתה יהיו שם והם מתכוונים להשתכר.
            - האם תלכו?
          verbatim: true
          echo: true
          cue: הסיטואציה הבאה —
          alt: שלושה חברים ובקבוק, וקו אדום לפניהם
          art:
            - {use: group3, x: 290, y: 120, w: 300}
            - {use: bottle, x: 160, y: 200, w: 130}
            - {use: red-line, x: 150, y: 400, w: 320}
      - slide:
          kicker: קו אדום · 3
          title: נסעתם לסופ״ש אצל בן דוד שלכם בת״א.
          sub: הוא לקח אתכם למסיבה. כשהגעתם לשם רואים שהרבה מהנמצאים שם שותים.
          verbatim: true
          echo: true
          cue: הסיטואציה האחרונה —
          alt: שני בני דודים יד ביד, וקו אדום לפניהם
          art:
            - {use: pair, x: 190, y: 90, w: 250}
            - {use: red-line, x: 150, y: 410, w: 320}
      - slide:
          kicker: קו אדום · 3
          title: תיקחו את הכוס ותשתו?
          sub: >-
            בן־הדוד שלכם הזמין שתי כוסות שתיה, נתן לכם אחת ולחש לכם באוזן:
          points:
            - ״אל תדאגו, כולם פה עושים את זה, יהיה לכם כיף״.
          verbatim: true
          echo: true
          cue: ממשיכים לקרוא — ורק אחרי השקף הזה זזים
          alt: בועת דיבור ובה המילה כיף, בקבוק, וקו אדום
          art:
            - {use: speech, x: 280, y: 40, w: 280}
            - text: כיף
              x: 420
              y: 150
              size: 64
            - {use: bottle, x: 110, y: 200, w: 140}
            - {use: red-line, x: 150, y: 410, w: 320}
      - ask: מה השפיע על ההחלטה שלכם — ומי זז ממקומו בין הסיטואציות?
      - say: כל אחד שם את הקו האדום שלו במקום אחר. בואו נבדוק מה משפיע על ההחלטות האלה.

  # ------------------------------------------------------------------ 9′–13′
  - id: factors
    title: מה משפיע על ההחלטות שלנו?
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      שש השפעות על ההחלטות שלנו, מהתרשים של המקור — הכיתה מחברת אליהן את מה שהזיז אותה על הקו
    body:
      - slide:
          kicker: רגע חושבים
          title: מה משפיע על ההחלטות שלנו?
          sub: ערכים, מצפון, רגשות, נורמות וחוקים, ידע ומחשבות.
          echo: true
          alt: דמות במרכז, ומסביבה שישה עיגולים — ידע, מחשבות, רגשות, ערכים, נורמות וחוקים, מצפון
          art: {file: art/factors.svg}
      - moves:
          - שאלי מה השפיע על ההחלטות שלהם על הקו, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - על כל תשובה — הדהדי, והראי באיזה עיגול בתרשים היא נמצאת.
          - הזמיני את הכיתה להגיב — ״למי עוד זה השפיע? מי החליט אחרת, ולמה?״
      - list:
          - ידע — מה למדתי, החינוך שקיבלתי, התנסויות קודמות שהשפיעו עליי.
          - מחשבות — מה יחשבו עליי החברים? מה יגידו ההורים? איך זה מסתדר עם מה שאני חושב?
          - רגשות — פחד, דאגה, בלבול ומתח — או שלווה, ביטחון ואומץ.
          - ערכים — כבוד, כנות, יושר, צדק, שוויון.
          - נורמות וחוקים — ההכרה שאני חי בחברה שיש בה חוק וגבולות.
          - מצפון — האם אפגע באנשים שאני אוהב? בושה, אשמה, אחריות.
      - ask: מה השפיע על ההחלטה שלכם על הקו — ומאיזה עיגול זה מגיע?
      - say: אז מה שעצר אותך זה ___ — הבנתי נכון? למי עוד זה מוכר?
      - say: עכשיו נראה מה קרה לשמוליק, כשכל החבר׳ה שתו בירה.

  # ------------------------------------------------------------------ 13′–19′
  - id: video
    title: ללכת עם ולהרגיש בלי
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: סרטון על שמוליק בבר עם החבר׳ה — עצירה לחיזוי, ואחרי הצפייה למה הוא שתה בירה
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש תשובות.
          - הפעילי את הסרטון, ועצרי בנקודה שסימנת לשאלת החיזוי.
          - אחרי הצפייה — 20 שניות לבד, דקה בזוגות, ושמעי שלושה–ארבעה זוגות.
      - video:
          title: אלכוהול לחץ חברתי
          url: https://www.youtube.com/watch?v=DiNOUgm72e0
          length: "1:50"
          before: מה עושים כשכל החבר׳ה שותים בירה — ואתם בכלל לא אוהבים בירה?
          watch: שימו לב לשמוליק — מה הוא מרגיש, ולמה הוא עושה את מה שהוא עושה.
          pauses:
            - at: "?"
              moment: >-
                הרגע שלפני ששמוליק שותה את הבירה. צפי בסרטון (1:50) לפני השיעור, וסמני כאן את הזמן.
              ask: מה הוא יעשה עכשיו — ולמה?
          alt: דמות לבד, קו אדום, ומעבר לו קבוצת חברים ובקבוק
          art:
            - {use: kid-stand, x: 30, y: 160, w: 140, color: teal}
            - {use: red-line, x: 70, y: 254, w: 320, rotate: 90}
            - {use: group3, x: 290, y: 215, w: 300}
            - {use: bottle, x: 420, y: 60, w: 120}
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: למה לדעתכם שמוליק שתה בירה?
          echo: true
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          cue: אחרי הצפייה —
          alt: דמות חושבת על קבוצת חברים
          art:
            - {use: thought, x: 220, y: 30, w: 320, flip: true}
            - {use: group3, x: 300, y: 90, w: 190}
            - {use: kid-stand, x: 70, y: 220, w: 140, color: teal}
      - ladder:
          help: מה שמוליק רצה שהחבר׳ה יחשבו עליו — ומה הוא עצמו רצה?
          challenge: מה היה יכול לעזור לשמוליק להישאר עם החבר׳ה — בלי לשתות?
      - whisper: >-
          לפי המקור: לשמוליק היה חשוב לא להיראות שונה ולהיות ״כמו כולם״ בבר עם החבר׳ה. הוא לא הקשיב לקול
          הפנימי שלו, ולא עמד בלחץ שהרגיש — ושתה, אף שלא אהב בירה ולא רצה.
      - say: >-
          שמוליק הלך עם החבר׳ה — והרגיש בלי. מצבים כאלה הם מצבי פיתוי. ואילו עוד פיתויים יש בגיל שלכם?

  # ------------------------------------------------------------------ 19′–22′
  - id: temptations
    title: מצבי פיתוי
    minutes: 3
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כל אחד כותב פיתוי אחד להתנהגות מסוכנת בגיל הזה; רשימה כיתתית על הלוח
    body:
      - slide:
          kicker: כולם כותבים · ואז מליאה
          title: אילו עוד פיתויים יש בחיי נערות ונערים בגילכם?
          sub: פיתויים להתנהגות מסוכנת — כתבו אחד.
          timer: 30
          echo: true
          alt: עמוד שלטים, ולידו בקבוק, סיגריה וטלפון עם התראה
          art:
            - {use: signpost, x: 220, y: 60, w: 210}
            - {use: bottle, x: 40, y: 310, w: 130}
            - {use: cigarette, x: 440, y: 400, w: 150}
            - {use: phone-notify, x: 450, y: 110, w: 130}
      - moves:
          - חצי דקה — כל אחד כותב במחברת פיתוי אחד.
          - >-
            שמעי שש–שמונה תשובות, ורשמי אותן על הלוח כרשימה ממוספרת — ממנה הקבוצות יבחרו. גם הסיטואציות מהקו
            נכנסות לרשימה.
      - ladder:
          help: חשבו על מסיבה, על הרשת או על ההפסקה — מה מפתה שם לעשות משהו מסוכן?
          challenge: כתבו פיתוי שנראה תמים — ומה המחיר שלו.
      - ask: אילו עוד פיתויים יש בגיל שלכם?
      - say: לכל פיתוי צריך דרך להתמודד. עכשיו נבנה לכיתה ארגז כלים.

  # ------------------------------------------------------------------ 22′–30′
  - id: toolbox
    title: ארגז הכלים הכיתתי
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      בקבוצות — בוחרים פיתוי מהלוח ותמרור שעוזר להתמודד איתו, מציירים ומסבירים; התמרורים נתלים על הקיר
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הדפים; השקף עם התמרורים על המסך כל הזמן.
          - חלקי לכל קבוצה דף וטושים. אחרי דקה — ודאי שכל קבוצה כבר בחרה פיתוי ותמרור.
          - הסתובבי בין הקבוצות; דקה לפני הסוף — הודיעי.
          - נציג מכל קבוצה מראה את התמרור, קורא את המשפט ותולה על הקיר — זה ארגז הכלים הכיתתי.
      - slide:
          kicker: ארגז הכלים · בקבוצות · 5 דקות
          title: איזה תמרור עוזר להתמודד עם הפיתוי?
          sub: בחרו פיתוי מהלוח ותמרור — ואיך הוא עוזר גם מול הפיתוי לשתות?
          points:
            - עקומה חדה שמאלה · רמזור
            - מעגל תנועה · אבנים מתגלגלות
            - צומת הצטלבות · דרך מפותלת
            - סע/י ישר
          verbatim:
            - points
          timer: 300
          echo: true
          alt: שלושה תמרורים — עקומה חדה שמאלה, רמזור, וסע ישר
          art: {file: art/signs.svg}
      - say: >-
          כל קבוצה בוחרת פיתוי אחד מהלוח ותמרור אחד שעוזר להתמודד איתו — ומציירת אותו לארגז הכלים של הכיתה.
      - task:
          what: >-
            כל קבוצה בוחרת פיתוי מהרשימה שעל הלוח ותמרור שעוזר להתמודד איתו, מציירת את התמרור על הדף, וכותבת מתחתיו
            משפט אחד — איך הוא עוזר גם מול הפיתוי לשתות אלכוהול.
          time: 5 דקות — דקה לבחירה, שתיים לשיחה, שתיים לציור
          group: קבוצות של 4–5 לפי השולחנות
          rules: בוחרים יחד; אחד מצייר, אחד כותב, וכולם מציעים; מי שמסיים מוקדם מוסיף תמרור שני
          plenary: נציג מכל קבוצה מראה את התמרור, קורא את המשפט ותולה על הקיר
          help: מה התמרור אומר לנהג — ומה הוא יכול להגיד לנו מול פיתוי? למשל, רמזור — עוצרים וחושבים.
          challenge: בחרו תמרור שנראה בלי שום קשר לפיתוי — ומצאו בכל זאת איך הוא עוזר.
      - ask: איזה תמרור הייתם רוצים שיהיה איתכם במסיבה — ולמה?

  # ------------------------------------------------------------------ +5′
  - id: line2
    title: עוד שתי סיטואציות על הקו
    kind: extension
    minutes: 5
    stance: true
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: שתי סיטואציות נוספות מהמקור — חברים חדשים עם סיגריה, וחוף הים — באותו כלל של הקו
    body:
      - moves:
          - חוזרים לקו, ועובדים כמו בפתיחה — חמש שניות של שקט, ואז זזים. מתנדב מכל צד מסביר.
          - אחרי הסיטואציה השנייה — שאלת סיכום, וחוזרים למקומות.
      - say: עוד שתי סיטואציות על הקו. אותו כלל — חושבים לבד חמש שניות, בלי להסתכל על אף אחד, ורק אז זזים.
      - slide:
          kicker: אם נשאר זמן · קו אדום · 4
          title: סוף סוף מצאתם חברים חדשים,
          sub: חברים שמעניינים אתכם אחרי שנים של שעמום בבית ספר יסודי.
          points:
            - אתם נמצאים במרפסת של אחד מהם, מדברים על סיגריות ומעשנים.
          verbatim: true
          echo: true
          alt: שלושה חברים יחד, וקו אדום לפניהם
          art:
            - {use: group3, x: 150, y: 110, w: 320}
            - {use: red-line, x: 150, y: 400, w: 320}
      - slide:
          kicker: קו אדום · 4
          title: האם תעשנו?
          sub: מעבירים לכם בטבעיות את הסיגריה, ואתם לא יודעים מה לעשות.
          points:
            - פתאום אתם קולטים שמסתכלים עליכם.
          verbatim: true
          echo: true
          cue: ממשיכים לקרוא — ורק אחרי השקף הזה זזים
          alt: קבוצה גדולה של דמויות, סיגריה, וקו אדום לפניהן
          art:
            - {use: crowd, x: 270, y: 60, w: 320}
            - {use: cigarette, x: 90, y: 250, w: 160}
            - {use: red-line, x: 150, y: 400, w: 320}
      - slide:
          kicker: קו אדום · 5
          title: אתם על חוף הים.
          sub: מישהי ממש מוצאת חן בעיני החבר שלכם. הוא מתלבט אם לגשת ולדבר איתה או לא.
          points:
            - פתאום היא מתקרבת אליכם.
            - אתם מחכים שהיא תפתח בשיחה עם החבר שלכם אבל היא בוחרת להתחיל דווקא אתכם.
            - האם ״תקפצו״ על ההזדמנות?
          verbatim: true
          echo: true
          cue: הסיטואציה הבאה —
          alt: שמש, שני חברים, ודמות שלישית מתקרבת אליהם
          art:
            - {use: sun, x: 440, y: 30, w: 140}
            - {use: pair, x: 60, y: 200, w: 240}
            - {use: kid-stand, x: 380, y: 230, w: 120, color: purple}
      - ask: באיזו סיטואציה היה הכי קשה להחליט — ולמה?

  # ------------------------------------------------------------------ +5′
  - id: unit
    title: מסכמים את היחידה
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: למה היחידה נקראת ״מתבגרים בבריאות״, וכתיבה אישית — משהו שאני לוקח על עצמי לעשות אחרת
    body:
      - whisper: >-
          ביחידה ״מתבגרים בבריאות״ ארבעה שיעורים — השפעה חברתית ולחץ של הקבוצה, הסיבות שבגללן בני נוער מתחילים
          לעשן, מידע על טבק ומוצריו, והשיעור הזה — פיתויים ואלכוהול. לא כולם היו בכל השיעורים: מי שלא היה
          עונה מתוך השיעור הזה.
      - slide:
          kicker: אם נשאר זמן · מסכמים את היחידה
          title: למה לדעתכם קוראים ליחידה ״מתבגרים בבריאות״?
          echo: true
          alt: נבט בעציץ ושמש מעליו
          art:
            - {use: sprout, x: 230, y: 180, w: 220}
            - {use: sun, x: 60, y: 40, w: 170}
      - ask: ומה זה אומר — להתבגר בבריאות, בגיל שיש בו כל כך הרבה פיתויים?
      - moves:
          - שאלי, ושמעי שלוש–ארבע תשובות.
          - דקה וחצי של כתיבה בשקט — כל אחד לעצמו, במחברת.
          - הזמיני שניים־שלושה מתנדבים לשתף במה שכתבו.
      - slide:
          kicker: כותבים לעצמכם
          title: משהו שאני לוקח/ת על עצמי לעשות אחרת בעקבות המפגשים...
          verbatim:
            - title
          timer: 90
          echo: true
          cue: אחרי כמה תשובות —
          alt: דמות כותבת ליד שולחן, ועיפרון לידה
          art:
            - {use: kid-desk, x: 230, y: 120, w: 270}
            - {use: pencil, x: 60, y: 300, w: 140}
      - say: הכתיבה הזאת שלכם. מי שרוצה — משתף; מי שלא — שומר לעצמו.
      - ladder:
          help: חשבו על רגע אחד מהשיעור — על הקו, בסרטון או בתמרורים — שתרצו לזכור.
          challenge: כתבו גם מתי בדיוק תעשו את זה, ומה יעזור לכם לעמוד בזה.

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — הקו האדום שלי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: פיתוי ותמרור שיעזור מולו, ומה יעזור לי לשמור על הקו; שורת רשות; פתקים נאספים בדלת
    body:
      - moves:
          - הציגי את השאלות, והפעילי את הטיימר.
          - עמדי בדלת ואספי את הפתקים אחד־אחד.
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: הקו האדום שלי
          prompts:
            - פיתוי אחד שעלול לפגוש בני נוער בגילי — ותמרור אחד שיעזור מולו.
            - מה יעזור לי לשמור על הקו האדום שלי, גם כשכולם סביבי שותים?
            - רשות — ״רציתי לומר לך ש…״
          look_for: >-
            חפשי תשובות כלליות (״פשוט לא לשתות״) לעומת דרכים ממשיות; פתקים שמספרים על מסיבות עם אלכוהול או על לחץ
            שקורה עכשיו; וכל שורת ״רציתי לומר לך״ שמבקשת שיחה. עם אלה מדברים בשקט השבוע — ומה שנוגע בפגיעה עובר
            ליועצת עוד היום.
          timer: 180
          alt: דמות עומדת ליד קו אדום
          art:
            - {use: red-line, x: 90, y: 224, w: 320, rotate: 90}
            - {use: kid-stand, x: 320, y: 80, w: 190, color: teal}
