sub: >-
  בגיל הזה יש לא מעט פיתויים — מסיבות, אלכוהול, ״כולם עושים את זה״. בשיעור הזה עומדים על הקו האדום, בודקים
  מה משפיע על ההחלטות שלנו, ובונים ארגז כלים כיתתי להתמודדות עם פיתויים.
format: עמידה על קו, זוגות וקבוצות
question: מה קובע את הקו האדום שלי — ואיך עומדים בפיתוי, גם כשכולם סביבי שותים?
takeaways:
  - על ההחלטות שלנו משפיעים ערכים, רגשות, מחשבות, ידע, נורמות ומצפון — וכדאי לדעת מה משפיע עליי.
  - גם כשכולם שותים, מותר ואפשר לא להצטרף — להיות עם החבר׳ה בלי לוותר על עצמי.
  - כשיודעים מראש מה הקו האדום ומה יעזור לשמור עליו, קל יותר לעמוד בפיתוי.
prep:
  - >-
    סרט אדום ארוך — מודבק בנייר דבק לאורך רצפת הכיתה, או ששני מתנדבים מותחים אותו; מקום פנוי משני צידיו
  - דף לבן וטושים לכל קבוצה, לתמרור של ארגז הכלים

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פיתויים, מסיבות ואלכוהול. שאלי אם יש בכיתה מי שהנושא קרוב אליו מדי: מי
      ששותים אצלו בבית יותר מדי, מי שכבר שתה במסיבות, או מי שעבר לאחרונה אירוע קשה סביב שתייה. בקשי שתהיה
      זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי ששותים אצלו בבית עלול לשמוע ״שיכורים״ כמילה של לעג — מדברים על פיתויים ועל החלטות, לא על ״אנשים
      ששותים״. הסיטואציות על הקו דמיוניות: לא שואלים מי כבר שתה או עישן, ולא מבקשים ממי שלא התנדב להסביר
      למה עמד איפה שעמד.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. ברשימת הפיתויים כותבים פיתוי של בני נוער
      בגיל הזה, לא סיפור אישי. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל ששותים אצלו בבית יותר מדי, ששתה במסיבה ונפגע, או שלוחצים עליו עכשיו לשתות — עוצרים בעדינות, מודים,
      וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.
  - head: עמידה מול הכיתה
    text: >-
      על הקו עומדים לפי סיטואציה דמיונית, לא לפי מה שקרה. מותר לעמוד על הקו עצמו; מסבירים רק מתנדבים, ורק על
      עצמם. צחוק על מקום של מישהו — עוצרים מיד. אם סיטואציה מעוררת הקנטות (למשל ״חוף הים״ בהרחבה) — מדלגים עליה.

