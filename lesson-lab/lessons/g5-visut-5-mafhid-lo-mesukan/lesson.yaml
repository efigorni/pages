safe:
- head: תיאום עם היועצת
  text: תאמי מראש כיצד לפנות לשיחה אישית בעקבות מפחיד, אבל לא מסוכן. הכיני אפשרות לצאת לזמן קצר בליווי מבוגר
    מוכר.
- head: מי עלול להיפגע
  text: סיפורי סכנה עלולים לעורר בהלה. אין צעקות הפתעה או הכרזה על מבחן מדומה; כשילד אינו בטוח בבטיחות מפנים
    אותו למבוגר.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על אדם או על דמות דמיונית, לכתוב במקום לדבר או לעבור. אין מבקשים פרטים אישיים או שמות של
    ילדים.
- head: אם מישהו משתף פגיעה
  text: 'הודי לו על האמון, עצרי שאלות מהכיתה והמשיכי בפרטיות עם היועצת; אל תבטיחי סודיות כשנדרשת הגנה. המבוגרים
    אחראים לטפל בפגיעה. לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם.'
src_fixes:
- from: 'אם יש במציאות סכנה ברורה וּודאית הגוף שלי יידרך ויכוון אותי באופן אוטומטי לפעולה מיידית (הילחם או
    ברח). זוהי התגובה המתאימה! ונשאר רק להחליט אם להילחם או לברוח. '
  to: ''
