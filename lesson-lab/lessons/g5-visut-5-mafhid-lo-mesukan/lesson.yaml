  body:
  - messages:
      items:
      - ברוב המצבים שבהם אנו נתקלים בחיי היום-יום ונבהלים לא מדובר במצב של סכנה מיידית, אלא במצב שמפחיד אותנו
        אך אין בו סכנה. הגוף שלנו מגיב מיד, אך התגובה הזאת בדרך כלל לא יעילה עבורנו (בוודאי לא בעוצמות שהיא
        מופיעה).
