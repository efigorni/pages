steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: open
    title: ציר הזמן שלנו
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      כתיבה קצרה כשנכנסים — באיזו שנה קרה כל אירוע? — ואז מדביקים יחד את האירועים על ציר הזמן של
      הכיתה, מכיתה א׳ ועד היום
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: באיזו שנה זה קרה?
          sub: כתבו במחברת את המספר של כל אירוע מהלוח, ולידו את השנה.
          timer: 180
          echo: true
          alt: ציר זמן — ב־2020 דמות קטנה, וב־2026 אותה דמות, גבוהה יותר
          art: {file: art/timeline.svg}
      - moves:
          - הציר והכרטיסים כבר על הלוח, והשקף על המסך כשהכיתה נכנסת. מתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. שימי לב אילו אירועים קשה להם לתארך.
          - >-
            שאלי מתי הם עלו לכיתה א׳ ומתי לכיתה ז׳, והדביקי את שני הכרטיסים. אחר כך — כרטיס אחרי כרטיס:
            הכיתה אומרת שנה, ומתנדב מדביק.
          - את מלחמת התקומה, השבת החטופים ומבצע שאגת הארי — הדביקי בעצמך, בקצרה.
          - שאלי איזה אירוע חסר, וכתבי על הציר אחד או שניים.
      - whisper: >-
          השנים לפי המקור: הקורונה (ההתפרצות), הסכמי אברהם והעלייה לכיתה א׳ — 2020; הבינה המלאכותית — 2023
          (פותחה בסוף 2022); מלחמת התקומה (״חרבות ברזל״) — 2023, מה־7 באוקטובר; שבע המדליות בפריז — 2024;
          השבת כל החטופים — 2025/2026; מבצע שאגת הארי והעלייה לכיתה ז׳ — 2026.
      - ladder:
          help: התחילו מהאירוע שאתם הכי בטוחים בו — באיזו שנה עליתם לכיתה א׳?
          challenge: הוסיפו אירוע שחסר — מבית הספר, מהיישוב או מהעולם — ואת השנה שלו.
      - handout:
          title: מחסן האירועים
          copies: עותק אחד, גזור לתשעה כרטיסים
          verbatim: true
          lines: false
          items:
            - מלחמת התקומה
            - מגפת הקורונה
            - זכייה ב-7 מדליות באולימפיאדת פריז
            - עלייה לכיתה א׳
            - הסכמי אברהם
            - עלייה לכיתה ז׳
            - מבצע שאגת הארי
            - השבת כל החטופים לישראל
            - הבינה המלאכותית נכנסת לחיים שלנו
      - ask: באיזו שנה עליתם לכיתה א׳? ובאיזו שנה — לכיתה ז׳?
      - say: >-
          שש שנים בין שתי הנקודות האלה, והראשונה שבהן — שנת הקורונה. בואו נראה מה עוד קרה בדרך, לכולנו
          יחד.
      - ask: איזה עוד אירוע מהשנים האלה חסר על הציר שלנו — בבית הספר, ביישוב או בעולם?

  # ------------------------------------------------------------------ 6′–11′
  - id: strengths
    title: מה נדרש מאיתנו — ומה עזר לנו
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      שיחה במליאה על הדור כולו: מה נדרש מבני הגיל שלכם בשנים האלה, ואילו כוחות ויכולות עזרו לעבור אותן
    body:
      - slide:
          kicker: מסתכלים על הציר
          title: חשבו על השנים האחרונות
          sub: ועל האירועים השונים שחווינו...
          points:
            - מה נדרש מכם?
            - אילו כוחות ויכולות סייעו לכם לאורך התקופה?
          verbatim: true
          echo: true
          alt: קבוצה גדולה של דמויות, ומטרייה פתוחה מעליה מול ענן גשם
          art:
            - {use: rain-cloud, x: 110, y: 16, w: 150}
            - {use: umbrella, x: 190, y: 110, w: 240, color: purple}
            - {use: crowd, x: 170, y: 340, w: 280}
      - moves:
          - הצביעי על הציר, וחשפי את השאלה הראשונה. ספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - >-
            שרטטי על הלוח שני טורים. רשמי מילה מכל תשובה בטור שלה, ועל כל תשובה שאלי את הכיתה ״מי עוד?״.
          - חשפי את השאלה השנייה, וחכי שוב עשר שניות. הדהדי, והזמיני את הכיתה להוסיף.
      - whisper: המיקוד הוא הדור — מה עבר על בני הגיל שלהם, לא הסיפור של כל אחד.
      - board: מה נדרש מאיתנו · אילו כוחות ויכולות עזרו לנו
      - ladder:
          help: חשבו על תקופת הקורונה — מה הייתם צריכים ללמוד לעשות לבד?
          challenge: איזה כוח שגיליתם אז יעזור לכם גם השנה, בחטיבה?
      - ask: מה נדרש מבני הגיל שלכם בשנים האלה? מי עוד הרגיש ככה?
      - say: אז מה שעזר לכם זה ___ — הבנתי נכון? מי רוצה להוסיף?
      - say: >-
          זה הסיפור של הדור שלכם. ולכל אחד מכם יש גם ציר זמן משלו — עם רגעים מצחיקים, עם יכולות ועם
          ציפיות. בואו נקבע עליו פגישות.

  # ------------------------------------------------------------------ 11′–15′
  - id: schedule
    title: קובעים פגישות על הציר
    minutes: 4
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      כל אחד מסתובב בכיתה עם ציר הזמן האישי שלו וקובע שלוש פגישות — לכל אחת בן זוג אחר, לפי מה שכתוב
      ליד השנה
    body:
      - say: >-
          לכל אחד מכם יש על השולחן ציר זמן משלו. לפני שמספרים — קובעים פגישות: שלוש פגישות, ובכל אחת בן
          זוג אחר.
      - slide:
          kicker: קובעים פגישות · מסתובבים בכיתה
          title: שלוש פגישות על ציר הזמן
          points:
            - 2020 — עם מישהו שאתם כבר מכירים
            - 2022 — עם מישהו שיש לכם תחביב משותף
            - 2024 — עם מישהו שאתם עוד לא מכירים
          timer: 180
          echo: true
          alt: לוח שנה גדול, ושתי דמויות יד ביד לידו
          art:
            - {use: calendar, x: 330, y: 50, w: 250}
            - {use: pair, x: 60, y: 270, w: 220}
      - moves:
          - הציגי את שלוש הפגישות, ואמרי ששני בני הזוג כותבים את השם זה של זה באותה שורה.
          - בדקי הבנה בשאלה אחת — ״כמה בני זוג שונים יהיו לכם?״ — והפעילי את הטיימר.
          - הסתובבי וחפשי מי עומד לבד או מחזיק דף ריק — חברי אותו למישהו, או קבעי איתו פגישה בעצמך.
          - בסוף הזמן כולם חוזרים למקומות, עם הדף.
      - task:
          what: >-
            כל אחד מסתובב בכיתה וקובע שלוש פגישות, לפי מה שכתוב בדף ליד כל שנה. כשמוצאים בן זוג — שניכם
            כותבים את השם זה של זה, באותה שורה.
          time: 3 דקות
          group: כל הכיתה בתנועה; לכל פגישה בן זוג אחר
          rules: >-
            מי שעוד לא מכיר אף אחד — פגישה 1 עם מי שיושב לידו; מספר אי־זוגי — שלישייה אחת; מי שנשאר בלי
            בן זוג מרים יד ומקבל עזרה
          plenary: אין — חוזרים למקומות, והפגישה הראשונה מתחילה
          help: התחילו מהפגישה הכי קלה — מישהו שאתם כבר מכירים.
          challenge: לפגישה 3 בחרו מישהו שעוד לא החלפתם איתו מילה השנה.
      - handout:
          title: ציר הזמן שלי
          copies: עותק לכל תלמיד, מונח על השולחנות לפני השיעור
          items:
            - '2020 · פגישה 1 (מישהו שאתם כבר מכירים) · עם:'
            - '2021'
            - '2022 · פגישה 2 (מישהו שיש לכם תחביב משותף) · עם:'
            - '2023'
            - '2024 · פגישה 3 (מישהו שאתם עוד לא מכירים) · עם:'
            - '2025'
            - 2026 · כיתה ז׳
            - '2027'
            - '2028'
            - 2029 · סוף החטיבה
      - ask: למי חסרה פגישה? הרימו יד — נמצא לכם בן זוג עכשיו.

  # ------------------------------------------------------------------ 15′–27′
  - id: meetings
    title: נפגשים על ציר הזמן
    minutes: 12
    practices:
      - זמן חשיבה
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      שלוש פגישות של שלוש דקות — חוויה מצחיקה, יכולת שרכשתם, והכיתה שהייתם רוצים השנה; כל אחד נותן
      לחוויה שם וממקם אותה על הציר שלו
    body:
      - slide:
          kicker: פגישה 1 · נפגשים ב־2020
          title: חוויה מצחיקה שזכורה לכם מהשנים האחרונות
          sub: המציאו לה שם, ומקמו אותה על הציר שלכם — בשנה שבה היא קרתה.
          timer: 180
          echo: true
          alt: שתי דמויות זו מול זו, ובועת דיבור עם פנים צוחקות מעליהן
          art:
            - {use: kid-stand, x: 400, y: 260, w: 125, color: teal}
            - {use: kid-stand, x: 110, y: 260, w: 125, color: orange}
            - {use: speech, x: 210, y: 40, w: 260}
            - {use: face-happy, x: 283, y: 72, w: 110}
      - moves:
          - הקריאי את השאלה, ותני עשרים שניות לחשוב בשקט לפני שקמים.
          - קראי ״נפגשים ב־2020!״ — כל אחד מוצא את מי שכתב באותה שורה — והפעילי את הטיימר.
          - באמצע הזמן הזכירי להתחלף, כדי שיהיה זמן לשניהם.
          - >-
            בסוף כל פגישה כל אחד כותב על הציר שלו את השם שנתן לחוויה, ליד השנה שבה היא קרתה. כך גם בפגישה
            השנייה ובשלישית.
          - אחרי הפגישה השלישית שמעי שניים־שלושה מתנדבים — רק על הכיתה שהם רוצים, לא על מה שסיפר בן הזוג.
      - say: >-
          השנה על המסך היא רק השם של הפגישה. את החוויה עצמה מקמים על הציר שלכם, בשנה שבה היא באמת קרתה.
      - task:
          what: >-
            שלוש פגישות, ובכל אחת שאלה אחרת על המסך. כל אחד מספר בתורו, ובסוף נותנים לחוויה שם, וכל אחד
            כותב אותו על הציר שלו — ליד השנה שבה היא קרתה.
          time: 3 דקות לכל פגישה
          group: זוגות, לפי הפגישות שנקבעו בדף
          rules: >-
            דקה וחצי לכל אחד — שימו לב שיש זמן לשניכם; כל אחד בוחר מה לספר, ומותר לבחור משהו קטן
          plenary: אחרי הפגישה השלישית — שניים־שלושה מתנדבים מספרים איזו כיתה הם רוצים
          help: התחילו ב״פעם אחת…״, ותנו לחוויה שם קצר — כמו שם של סרט.
          challenge: מה משותף לחוויה שלכם ולחוויה של בן הזוג? תנו לשתיהן שם אחד.
      - slide:
          kicker: פגישה 2 · נפגשים ב־2022
          title: יכולת שרכשתם או חיזקתם בשנים האחרונות
          sub: ספורט, אומנות, בישול, שפה — כל תחום. תנו לה שם, ומקמו אותה על הציר.
          timer: 180
          echo: true
          cue: אחרי שלוש דקות — ״נפגשים ב־2022!״
          alt: דמות מרימה יד, וכוכב גדול לידה
          art:
            - {use: kid-hand, x: 110, y: 196, w: 160, color: teal}
            - {use: star, x: 320, y: 60, w: 230}
      - slide:
          kicker: פגישה 3 · נפגשים ב־2024
          title: איך הייתם רוצים שתיראה הכיתה שלכם השנה?
          sub: בלימודים, בחברה, בהפסקות. תנו לציפייה שם, ומקמו אותה ב־2026.
          timer: 180
          echo: true
          cue: ואחרי עוד שלוש — ״נפגשים ב־2024!״
          alt: בית ספר, ושלוש דמויות יחד לפניו
          art:
            - {use: school, x: 250, y: 30, w: 330}
            - {use: group3, x: 40, y: 290, w: 300}
      - ask: איך הייתם רוצים שתיראה הכיתה שלנו השנה? מי מוכן לספר מה עלה בפגישה?
      - say: >-
          הסתכלו רגע על הציר שלכם: יש בו רגע מצחיק, יכולת שלכם, וציפייה לשנה הזאת. ככה נראה סיפור של
          מישהו שממשיך קדימה.

