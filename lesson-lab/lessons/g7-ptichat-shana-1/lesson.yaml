sub: >-
  שש שנים עברו מאז כיתה א׳, והן לא היו פשוטות. בשיעור הזה מסמנים יחד את ציר הזמן של הדור, מדברים על
  הכוחות שעזרו בדרך, ונפגשים בזוגות על ציר הזמן האישי — אחורה וקדימה.
format: כתיבה אישית, מליאה וזוגות מתחלפים
question: מה גילינו על עצמנו בדרך עד כיתה ז׳ — ואיך נרצה להמשיך מכאן?
takeaways:
  - כולנו עברנו יחד שנים לא פשוטות, וגילינו בדרך כוחות — אנחנו לא לבד.
  - כשמסתכלים אחורה על הדרך שלנו, קל יותר לצעוד קדימה.
  - כשמשתפים ומקשיבים זה לזה, מתחילים להכיר את הכיתה החדשה.
prep:
  - >-
    ציר זמן ארוך על הלוח, לפני השיעור: השנים 2020 עד 2029, ו־2020 בקצה הימני. לידו — תשעת כרטיסי
    האירועים, ממוספרים 1–9, ונייר דבק.

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה: ציר זמן של השנים 2020–2026, ועליו הקורונה, מלחמת התקומה מה־7 באוקטובר,
      השבת החטופים ומבצע שאגת הארי. שאלי מי בכיתה קרוב לאירועים האלה — משפחה שכולה, קרוב שנחטף או
      נפגע, משפחה שפונתה מהבית, הורה במילואים, מי שאיבד מישהו בקורונה — והחליטי איתה איך מציגים אותם
      בכיתה הזאת. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שאיבד מישהו בשנים האלה, או שמשפחתו עדיין בתוך האירועים — הציר הכיתתי עלול להחזיר אותו לשם.
      לכן את שלושת הכרטיסים של המלחמה, החטופים והמבצע — הדביקי בעצמך, בקצרה, ובלי לשאול ״איפה הייתם
      אז?״. בשיחה על הכוחות מדברים על הדור כולו, לא על מה שעבר כל אחד. ותלמיד חדש, או מי שעוד אין לו
      חברים בכיתה, עלול להישאר בלי פגישה — חברי אותו בעצמך.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום, מתוך המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על
      עצמי״. בפגישות כל אחד בוחר מה לספר, ומותר לבחור משהו קטן. במליאה משתפים רק מתנדבים, ולא מספרים את
      מה ששמעו מבן הזוג. לא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל אובדן במלחמה או בקורונה, פחד שלא עובר, או פגיעה שקורית עכשיו — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת, למי שצריך לדבר גם אחרי
      שעות בית הספר: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; נט״ל 3362* — סיוע נפשי לנפגעי טראומה
      ממלחמה וטרור ולבני משפחותיהם, 24/7.

