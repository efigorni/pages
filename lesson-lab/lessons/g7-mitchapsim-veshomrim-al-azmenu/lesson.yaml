  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ששת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              אם החלטתם לחגוג השנה — תכנון, התארגנות, וקבלת החלטות מושכלת לפני היציאה לבילוי, כולל מה עושים לגבי
              שתיית אלכוהול וכיצד נמנעים ממנה — יכולים להעלות את הסיכוי שהבילוי יהיה מהנה וללא סיכונים.
            - >-
              לשימוש בחומרים פסיכו־אקטיביים בגיל ההתבגרות יש השלכות על ההתפתחות ועל ההתנהגות. אלכוהול הוא סם מדכא,
              המשפיע על מערכת העצבים המרכזית ומדכא את המעצורים והעכבות הטבעיים שלנו. שיווי המשקל מתערער, מאבדים
              שליטה על הגוף. עלולים לפנות לאלימות, לפגוע באחר ולהיפגע.
            - >-
              לשתות במסיבה/ לעשן במסיבה נחשבים לנורמה ולחלק מבילוי, אך רוב בני הנוער לא משתמשים בקנאביס, וגם לא
              כולם שותים או רוצים לשתות אלכוהול. יש הרבה סיבות וגורמים שמאפשרים לכם הנאה בבילוי.
            - >-
              כשבאים לבילוי או מסיבה בשביל לשתות / לעשן וההנאה תלויה בזה — כל שאר המרכיבים שמשפיעים על ההנאה
              (חברים/ חברות, מוזיקה, ריקודים) הופכים ל״מיותרים״.
            - >-
              אלכוהול משתלט על המסיבה, שיכרות אינה מצב של שמחה. ה״שחרור״ שבהתחלה נחווה ככיף וצחוק הופך בהמשך
              לסיכוני, הכיף מתחלף בטיפול בחברים, פוגע בשמחה ובהנאה.
            - תחת השפעת אלכוהול נוצרת אשליית קירבה ופתיחות, אך כשהשפעתו מתפוגגת האדם נשאר לבד.
          ask: איזה משפט הייתם רוצים לזכור לפני פורים? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהתכנון לפני הבילוי (1), דרך מה שאלכוהול עושה לגוף ולהתנהגות (2), אל הנורמה שאינה של
            כולם ואל מה ששתייה עושה למסיבה ולחברים (3–6).
          alt: מגן גדול, ומסכת פורים לידו
          art:
            - {use: shield, x: 300, y: 130, w: 260}
            - {use: mask, x: 60, y: 300, w: 200}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — התוכנית שלי לפורים
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: תוכנית לפורים ומשפט ׳לא׳ אחד, ושורת רשות; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: התוכנית שלי לפורים
          prompts:
            - איך אבלה בפורים — ומה אעשה כדי שהבילוי יהיה מהנה וללא סיכונים?
            - משפט אחד שאוכל לומר, או משהו שאוכל לעשות, אם יציעו לי לשתות או לעשן.
            - רשות — משהו שהפתיע אותי היום.
          look_for: >-
            חפשי תוכניות שהשתייה בהן מובנת מאליה, משפטים שאפשר באמת לומר לעומת ״פשוט לא״, ופתקים שמספרים על לחץ,
            על שתייה בבית או על משהו שקרה במסיבה. עם אלה מדברים בשקט השבוע — ומה שנוגע בפגיעה עובר ליועצת עוד היום.
          timer: 180
          alt: דמות כותבת ליד שולחן, ומסכת פורים לידה
          art:
            - {use: kid-desk, x: 280, y: 130, w: 288}
            - {use: mask, x: 40, y: 70, w: 210}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
