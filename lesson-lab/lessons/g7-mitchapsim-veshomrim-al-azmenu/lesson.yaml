sub: >-
  פורים הוא חג של שמחה, תחפושות ומסיבות. בשיעור הזה שואלים מה באמת משמח אותנו כשאנחנו יחד, שמים את
  האלכוהול על המאזניים, ומחפשים איך משמיעים קול אחר — וממשיכים ליהנות.
format: מליאה וזוגות
question: מה משמח אותנו כשאנחנו יחד — ואיך שומרים על עצמנו בפורים?
takeaways:
  - אפשר לשמוח וליהנות בפורים בלי שתייה ועישון — השמחה נמצאת בנו ובחברים.
  - לאלכוהול יש השפעה על הגוף ועל ההתנהגות, והוא עלול לקלקל את המסיבה ולסכן אותנו.
  - תכנון מראש וקול אחד שאומר ׳לא׳ יכולים לשמור עלינו ועל החברים.
prep: []

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פורים, מסיבות, אלכוהול ועישון, ונגיעה בקנאביס. שאלי אם יש בכיתה מי שהנושא קרוב
      אליו מדי: מי שבבית שלו שותים הרבה או מתמודדים עם התמכרות, מי שכבר שותה או מעשן, ומי שעבר משהו קשה
      במסיבה. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שבבית שלו שותים הרבה עלול לשמוע את השיעור כאילו הוא על המשפחה שלו — מדברים על מצבים ועל החלטות, לא על
      ״שתיינים״ או ״מעשנים״ כאנשים, ולא שואלים מי ניסה. אם עולה ״עד דלא ידע״, מדברים על המשמעות שלו בכבוד, בלי
      ללעוג למי שהמנהג קרוב אליו.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. על רגע לא נעים במסיבה כל אחד חושב
      לעצמו, ולא משתפים בו; במליאה מדברים על מצבים, בלי שמות ובלי סיפורים אישיים. מותר לוותר, ולא קוראים בשם
      למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל אלימות, הטרדה, או מישהו שהשקו אותו במסיבה — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. מחוץ לבית הספר, בכל שעה: ער״ן 1201 — עזרה ראשונה
      נפשית, זמין 24/7; ובחשד להרעלת אלכוהול במסיבה — מזמינים מיד את מד״א ב־101.

