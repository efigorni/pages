          challenge: כתבו ליד המילה איך היא תעזור לכם בשינוי שבחרתם.

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלושת משפטי הסיכום של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - מצד אחד, לעיתים אנו רוצים לעשות שינויים, ומצד שני, אנחנו חוששים מכך.
            - גם שינוי קטן ומעשי הוא משמעותי.
            - חשוב למצוא את הכלים והדרכים, שיעזרו לנו בדרך ליישם את השינוי.
          ask: איזה משפט מהשלושה הכי נכון בשבילכם היום? חשבו רגע, ואז הצביעו.
          tip: >-
            שלושת המשפטים הולכים בדרך של השיעור: הרצון והחשש (הקירות והמאזניים), השינוי הקטן (״בחרתי״) והכלים
            (הסימנים).
