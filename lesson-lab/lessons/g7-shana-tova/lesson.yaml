# סימנים לראש השנה — שכבות ז׳–ט׳, לקראת ראש השנה (מקור: sources/text/7/Shana_Tova.md)
slug: g7-shana-tova
title: סימנים לראש השנה
grade: 7
grades_served: [7, 8, 9]
month: ספטמבר
section: בזיקה ללוח השנה – שיעורי הכ"חות שבדרך למועדים מיוחדים
unit: לקראת ראש השנה
unit_order: 1
unit_size: 1
src_text: sources/text/7/Shana_Tova.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/7Grade/Mamlachti/Shana_Tova.pptx
sensitivity: low

sub: >-
  שנה חדשה היא נקודת זמן לעצור ולבחור שינוי. בשיעור הזה בודקים מה אנחנו מרגישים כלפי שינוי, כל אחד בוחר
  שינוי קטן משלו, ומוצאים ״סימן״ שיעזור לשמור עליו לאורך השנה.
format: תנועה בכיתה, כתיבה אישית ורביעיות
question: מה ארצה לשנות בשנה החדשה — ומה יעזור לי להתחיל?
takeaways:
  - כולנו רוצים להשתנות, וגם חוששים משינוי — שני הקולות טבעיים.
  - גם שינוי קטן ומעשי הוא משמעותי.
  - כלים טובים וצעד ראשון ברור עוזרים לשמור על השינוי לאורך השנה.
prep:
  - >-
    מדבקות — חמש לכל תלמיד — ונייר דבק לתליית עשרת הדפים (אפשר לבקש מכמה תלמידים לתלות אותם בהפסקה שלפני
    השיעור). אין מדבקות? כל אחד מסמן בעט צורה קטנה, כמו משולש או עיגול, בלי שם.
  - חלוקה מראש לרביעיות לפי השולחנות

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 14 דקות ומעלה — השיר ״יש בך הכל״; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - walls
      - simanim
    text: >-
      בפעילות הקירות מקריאים רק את שלושת המשפטים שקיבלו הכי הרבה מדבקות, וברביעיות כל אחד מספר רק על הכרטיס
      שבחר ולמה

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: אף ואוזן
      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
  from: song

cover:
  alt: תפוח ודבש, ורימון לידם
  art:
    - {use: apple-honey, x: 220, y: 170, w: 320}
    - {use: pomegranate, x: 50, y: 258, w: 170}

steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: ראש השנה · לעשות שינוי
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה קצרה בכניסה — מילים שעולות ל״ראש השנה״ ול״לעשות שינוי״; ומה ביניהם?
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: אילו מילים עולות לכם?
          points:
            - ראש השנה — שלוש מילים
            - לעשות שינוי — שלוש מילים
          timer: 120
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובתוכו רימון
          art:
            - {use: kid-desk, x: 330, y: 175, w: 250}
            - {use: thought, x: 40, y: 30, w: 250}
            - {use: pomegranate, x: 118, y: 77, w: 100}
      - moves:
          - >-
            השקף על המסך כשהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף. בזמן הכתיבה — נוכחות, ואז סיבוב בין
            השולחנות.
          - >-
            שרטטי על הלוח שני עננים, ״ראש השנה״ ו״לעשות שינוי״, ורשמי בהם מילים שהתלמידים מקריאים. קבלי כל
            מילה — גם מילה שמסתייגת מהנושא או מבטאת קושי.
          - הדגישי שהשיעור עוסק בשינוי שאנחנו בוחרים לעשות, לא בשינוי שקורה לנו.
          - הציגי את ״ומה ביניהם?״, שמעי שתיים–שלוש תשובות, וסכמי במשפט הגשר.
      - say: שתי דקות, לבד ובשקט. אין תשובה נכונה — כל מילה שעולה.
      - ladder:
          help: חשבו על ארוחת החג, ועל מה שמתחיל אצלכם עכשיו, בתחילת השנה.
          challenge: מצאו מילה אחת שמתאימה לשני הצירופים יחד.
      - slide:
          kicker: ראש השנה · לעשות שינוי
          title: ומה ביניהם?
          cue: כשבשני העננים כבר כמה מילים —
          alt: תפוח ודבש מצד אחד, נבט מהצד השני, וסימן שאלה ביניהם
          art:
            - {use: apple-honey, x: 340, y: 210, w: 260}
            - {use: sprout, x: 24, y: 193, w: 200}
            - text: '?'
              x: 282
              y: 300
              size: 150
      - ask: ראש השנה, ולעשות שינוי — ומה ביניהם?
      - say: >-
          תחילת שנה היא נקודת זמן שבה אפשר לעצור ולהתבונן בעצמנו — ברצונות, ביעדים ובשאיפות — ולסמן מקום אחד
          שבו נרצה לעשות שינוי, ולו קטן. על זה השיעור היום.

  # ------------------------------------------------------------------ 5′–15′
  - id: walls
    title: עשרה משפטים על שינוי
    minutes: 10
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      מסתובבים בין עשרה משפטים על הקירות ומדביקים חמש מדבקות, בלי שם; סופרים, מדברים על מה שהמספרים מספרים,
      ומניחים את הרצון ואת החשש על כפות המאזניים
    body:
      - moves:
          - >-
            הסבירי את המשימה לפני שמחלקים מדבקות, והקריאי משפט אחד או שניים כדוגמה. במשפט עם שלוש נקודות — כל
            אחד משלים לעצמו בראש, לא בכתב.
          - חלקי חמש מדבקות לכל תלמיד, והפעילי את הטיימר. מדביקים וממשיכים הלאה — לא נשארים ליד הדף.
          - >-
            כשכולם במקומות, עשרה מתנדבים — אחד ליד כל דף — סופרים את המדבקות. כל מתנדב בתורו מקריא את המשפט ואת
            המספר, ואת רושמת על הלוח את המספר ליד מספר המשפט.
          - שאלי את שאלת הדיון, וספרי בלב עד עשר לפני שאת מזמינה תשובות. הדהדי, והזמיני את הכיתה להגיב זה לזה.
          - סכמי בשקף ״כפות המאזניים״ — הקריאי את הצד האחד ואת הצד השני.
      - slide:
          kicker: פעילות כיתתית · חמש מדבקות
          title: בחרו 5 משפטים שאתם מתחברים אליהם
          sub: והדביקו לצידם מדבקה
          verbatim: true
          timer: 180
          echo: true
          alt: דמות מרימה יד אל דף על הקיר, ועל הדף מדבקות של כוכבים
          art:
            - {use: note, x: 300, y: 40, w: 230}
            - {use: star, x: 370, y: 110, w: 90}
            - {use: star, x: 420, y: 210, w: 80}
            - {use: kid-hand, x: 90, y: 210, w: 150}
      - say: >-
          על הקירות עשרה משפטים על שינוי. הסתובבו, קראו את כולם, והדביקו מדבקה לצד כל משפט שאתם מתחברים אליו —
          חמש בסך הכול, בלי שם.
      - task:
          what: >-
            מסתובבים בין עשרת המשפטים שעל הקירות, ומדביקים חמש מדבקות — אחת לצד כל משפט שמתחברים אליו.
          time: 3 דקות
          group: לבד, בתנועה בכיתה
          rules: בלי שמות ובלי לדבר על הבחירות; מדביקים וממשיכים; מי שסיים — חוזר למקום
          plenary: עשרה מתנדבים סופרים, ומקריאים כל משפט עם מספר המדבקות שלו
          help: התחילו במשפט שהכי מזכיר לכם את עצמכם, ומשם המשיכו.
          challenge: בחרו גם משפט אחד שאתם לא מסכימים איתו, וחשבו מה הייתם כותבים במקומו.
      - handout:
          title: עשרת המשפטים לקירות
          copies: דף לכל משפט, באות גדולה וממוספר — תלויים על הקירות בפיזור לפני השיעור
          verbatim: true
          lines: false
          items:
            - לעשות שינוי בגיל שלנו זה לא קל
            - אני מאד רוצה להשתנות בתחום של.....
            - הלוואי שהייתי מצליח/ה להשתנות
            - אין לי סיכוי להשתנות בתחום ה.....
            - כשאצליח להשתנות ב..... אדע שגדלתי
            - קשה לי להשתנות כי זה דורש להיפרד מהאופן שבו עשיתי משהו עד היום
            - לעשות שינוי בגיל שלנו זה ממש קל
            - כשאני עושה שינוי זה ממלא אותי באנרגיה
            - מתחשק לי להשתנות ב.....
            - ניסיתי לעשות שינויים ותמיד התייאשתי מהר
      - slide:
          kicker: איסוף
          title: מה הפתיע אתכם במספרים?
          sub: ומה הם מספרים על הכיתה שלנו?
          cue: כשכל המספרים על הלוח —
          echo: true
          alt: קהל של דמויות, וזכוכית מגדלת מעליו
          art:
            - {use: crowd, x: 30, y: 262, w: 400}
            - {use: magnifier, x: 390, y: 50, w: 200}
      - ask: מה הפתיע אתכם במספרים — ומה הם מספרים על הכיתה שלנו? מישהו גילה משהו חדש על עצמו?
      - slide:
          kicker: כפות המאזניים
          title: מה עומד על כפות המאזניים?
          points:
            - מצד אחד — כולנו רוצים להשתנות
            - ומצד שני — לא קל לעשות שינוי
          verbatim: true
          cue: אחרי הדיון —
          echo: true
          alt: מאזניים, ומעליהם נבט בצד אחד והר בצד השני
          art:
            - {use: scale, x: 130, y: 190, w: 360}
            - {use: sprout, x: 365, y: 83, w: 130}
            - {use: mountain, x: 105, y: 108, w: 170}
      - quote:
          title: כפות המאזניים — מהמקור, להקריא
          text: |-
            מצד אחד, כולנו רוצים להשתנות. שינוי מסמל גדילה, התפתחות והתקדמות. עשיית שינוי מאפשרת לנו לממש את הרצונות והחלומות שלנו. החלטה על שינוי מעוררת ציפייה והתרגשות.

            ומצד שני, לא קל לעשות שינוי. שינוי דורש החלטה חזקה, סבלנות והתמדה. עשיית שינוי דורשת מאיתנו להיפרד מהדרך המוכרת, ולעיתים זה מאתגר.
      - say: >-
          שני הקולות — ׳רוצה׳ ו׳קשה׳ — נמצאים אצל כולנו, וזה טבעי. אז איך בכל זאת מתחילים? בוחרים שינוי אחד,
          קטן.

  # ------------------------------------------------------------------ 15′–20′
  - id: choose
    title: משתנה בשנה החדשה
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: כל אחד בוחר תחום — אישי, משפחתי, חברתי או לימודי — ושינוי קטן ומעשי, וכותב אותם בדף ״בחרתי״
    body:
      - slide:
          kicker: משתנה בשנה החדשה
          title: בחרו תחום שבו תרצו לעשות שינוי
          points:
            - בתחום האישי
            - בתחום המשפחתי
            - בתחום החברתי
            - בתחום הלימודי
          verbatim: true
          timer: 180
          echo: true
          alt: עמוד עם שלטי כיוון, ודמות עומדת מולו
          art:
            - {use: signpost, x: 260, y: 120, w: 260}
            - {use: kid-stand, x: 80, y: 172, w: 130, color: teal}
      - moves:
          - הציגי את ארבעת התחומים, ותני דוגמה קטנה לכל תחום (ברשימה למטה).
          - חלקי את דף ״בחרתי״. שלוש דקות של כתיבה בשקט; הסתובבי, ועזרי למי שבחר שינוי גדול מדי להקטין אותו.
          - אמרי בבירור שהדף נשאר אצלם, ושאין חובה לשתף את התחום שבחרו.
      - list:
          - בתחום האישי — לבצע פעילות גופנית פעמיים בשבוע.
          - בתחום המשפחתי — עזרה מסוימת בבית, או שינוי ביחס לאח או לאחות.
          - בתחום החברתי — להימנע ממריבות עם חבר לכיתה, או ליצור קשר עם חבר חדש.
          - >-
            בתחום הלימודי — להשקיע במקצוע מסוים, לתכנן מראש זמן למידה לפני מבחן, או להקפיד על שיעורי הבית במקצוע
            אחד.
      - say: שינוי קטן ומעשי — לא ״להיות תלמיד טוב יותר״, אלא מה בדיוק תעשו, ומתי.
      - ladder:
          help: בחרו אחת מהדוגמאות, ושנו אותה כך שתתאים לכם.
          challenge: איך תדעו, בעוד חודש, שהשינוי באמת קרה?
      - handout:
          title: בחרתי
          copies: עותק לכל תלמיד — הדף נשאר אצלו
          verbatim: true
          items:
            - >-
              התחום שבחרתי:
            - >-
              השינוי שבחרתי לעשות:
      - say: >-
          הדף הזה שלכם — שמרו אותו בקלסר, במקום שתראו אותו גם בהמשך השנה. ועכשיו נמצא לשינוי ״סימן״: כלי שיעזור
          לשמור עליו.

  # ------------------------------------------------------------------ 20′–27′
  - id: simanim
    title: סימנים לשנה טובה
    minutes: 7
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      ברביעיות — כל אחד בוחר כרטיס (תמונה, משפט, או שניהם) שמסמל כלי שיעזור לו לעשות את השינוי, ומספר לקבוצה
    body:
      - moves:
          - הסבירי את המשימה והדגימי בעצמך לפני שמחלקים את הכרטיסים — אפשר בדוגמה של שירה, למטה.
          - חלקי ערכת כרטיסים לכל רביעייה, והפעילי את הטיימר. הסתובבי בין הקבוצות; דקה לפני הסוף — הודיעי.
          - במליאה — שאלי מה אפשרה להם השיחה בקבוצה, והדגישי את השיתוף, את המיקוד ואת החשיבה על כלים.
      - slide:
          kicker: סימנים לשנה טובה · ברביעיות
          title: בחרו כרטיס, וספרו באמצעותו
          points:
            - מהו השינוי שבחרתם לעשות?
            - כיצד אתם מרגישים עם הרצון לשנות?
            - מה יעזור לכם לבצע את השינוי?
          verbatim:
            - points
          timer: 240
          echo: true
          alt: ארבעה סביב שולחן עגול, ותפוח ודבש לידם
          art:
            - {use: circle4, x: 60, y: 200, w: 300}
            - {use: apple-honey, x: 380, y: 40, w: 200}
      - quote:
          title: ההדגמה של שירה — מהמקור, להקריא
          text: >-
            אני רוצה השנה להשתנות ולהאמין שאצליח להגשים את המטרות שלי. בחרתי את הכרטיסיה: ״אופטימיות״ כי אני
            רוצה לא להתייאש מנפילות, להסתכל על הטוב שאני מצליחה לעשות ולא רק על המקומות בהם נכשלתי.
      - say: >-
          בחרו כרטיס — תמונה, משפט, או שניהם — שמסמל כלי שיעזור לכם לעשות את השינוי. כל אחד מספר לקבוצה בעזרתו,
          דקה לכל אחד.
      - task:
          what: >-
            כל אחד בוחר כרטיס שמסמל כלי שיעזור לו לעשות את השינוי, ומספר לקבוצה בעזרתו: מה השינוי, איך הוא מרגיש
            עם הרצון לשנות, ומה יעזור לו.
          time: 4 דקות — דקה לכל אחד
          group: רביעיות לפי השולחנות; ערכת כרטיסים לכל רביעייה
          rules: >-
            מספרים רק מה שבוחרים לספר — אפשר לספר על הכלי בלי לפרט את השינוי; אחרי כל אחד, מישהו בקבוצה מציע לו
            עוד כרטיס שיכול לעזור
          plenary: שניים–שלושה מספרים מה אפשרה להם השיחה בקבוצה
          help: התחילו במשפט ״בחרתי את הכרטיס ___ כי…״, כמו בדוגמה של שירה.
          challenge: הציעו לחבר בקבוצה עוד כלי — כרטיס שהוא לא בחר — והסבירו למה הוא יכול לעזור לו.
      - handout:
          title: כרטיסי הסימנים
          copies: >-
            ערכה לכל רביעייה, גזורה לכרטיסים — כל מילה או משפט על כרטיס משלו. את הכרטיסים המאוירים אפשר להדפיס
            מהמצגת המקורית (הקישור בתחתית המערך)
          verbatim: true
          lines: false
          items:
            - ניהול זמן · חלומות · הצלחה · שינוי · בחירה · מטרות · צעד ראשון · פרפרים בבטן
            - אהבה · אומץ · קבלה עצמית · הבנה · גילוי · אתגרים · מימוש עצמי · גילוי עצמי
            - עצירה · חישוב מסלול מחדש · התחלה ברגל ימין · צמיחה · שיפור · הקשבה · חברות · תקווה
            - ישן - חדש · משאלות · אופטימיות · עצמאות · מציאת מקום · רצון · מציאת אוצר · פופולריות
            - להרבות זכויותינו כרימון · מצפן · ביטוי אישי · התלבטות · התחלה מתוקה · ניסיון · להשמיע קול
            - >-
              להאמין ששינוי יכול לקרות · לחלק את השינוי לגרגרים קטנים · לבחור משהו שהוא לא מדי קשה · להאמין
              בעצמי שאני יכול/ה · להתמקד במתוק ובמה שהצלחתי · לעשות לי סימן שיעזור לי לזכור גם לאורך השנה את
              השינוי שבחרתי בו · להאמין שאני אצליח · לסלק את המחשבות הלא טובות לגבי עצמי
            - >-
              לזכור את השינוי גם לאורך השנה · לגלות סלחנות וחמלה כלפי עצמי גם כשאני נכשל/ת · לראות את כל מה
              שהשגתי · לבחור בשינוי מתוק שישמח אותי · לעצור ולבדוק אם אני בדרך ליעד · להתמיד ולא להפסיק · לכתוב
              לי משפט שמחזק אותי בדרך לשינוי · לזכור ששינוי זה תהליך שלוקח זמן
      - ask: מה אפשרה לכם הפעילות בקבוצות?

  # ------------------------------------------------------------------ +6′
  - id: song
    title: יש בך הכל
    kind: extension
    minutes: 6
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: מקשיבים לשיר ״יש בך הכל״, כל אחד בוחר ממנו מילה או משפט, ושומעים סבב מהיר
    body:
      - moves:
          - >-
            ספרי שזה השיר ״יש בך הכל״ — מילים: עקיבא תורגמן וצורית תורגמן, לחן: עקיבא תורגמן — הציגי את השאלה,
            והפעילי את השיר.
          - >-
            אחרי השיר — סבב מהיר: כל אחד אומר את המילה או המשפט שבחר, בלי הסבר. מותר לעבור.
          - קבלי כל מילה, גם כשהיא חוזרת על עצמה — מילה שחוזרת היא קול של הכיתה.
      - video:
          title: יש בך הכל
          url: https://www.youtube.com/watch?v=zACyHq8pY4s
          length: "3:42"
          before: איזו מילה מהשיר תלווה אתכם השנה?
          watch: בזמן ההאזנה, בחרו מתוך השיר מילה או משפט משמעותיים עבורכם.
          pauses:
            - at: "?"
              moment: סוף הבית הראשון. עוצרים לרגע, וממשיכים.
              ask: כבר יש לכם מילה? כתבו אותה — ואם תשמעו מילה חזקה יותר, החליפו.
          alt: דמות יושבת ומקשיבה, ותווים מרחפים לידה
