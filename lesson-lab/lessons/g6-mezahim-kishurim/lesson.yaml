                  - שתי דקות — כל אחד מוסיף לשכן תשובה לפחות לשניים מהמשפטים.
                  - הסתובבי וקראי מעבר לכתפיים — רק מחמאות. אחר כך מחזירים את הדפים, וכל אחד קורא מה קיבל.
              - say: מחליפים דפים, ובצבע אחר מוסיפים לשכן מתנה — רק מילים טובות.
              - task:
