          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובתוכו כוכב
          art:
            - {use: thought, x: 40, y: 30, w: 260}
            - {use: star, x: 115, y: 76, w: 110}
            - {use: kid-desk, x: 300, y: 160, w: 270, color: teal}
      - moves:
