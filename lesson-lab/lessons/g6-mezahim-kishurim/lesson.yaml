          alt: כרטיס בינגו של 3 על 3 עם כוכבים ועננים, ועיפרון לידו
          art: {file: art/bingo-card.svg}
      - say: >-
          בוחרים לבד, ורק אחר כך קמים. כשמוצאים מישהו שכתב אותו היגד — רושמים את השם שלו ליד ההיגד,
          וממשיכים הלאה.
      - task:
          what: >-
            בוחרים מהמאגר 9 היגדים שמתאימים לכם — גם כישורים וגם קשיים — וכותבים אותם בטבלה. אחר כך
            מסתובבים בכיתה ומחפשים מי שכתב היגד זהה, ורושמים את שמו ליד ההיגד.
          time: 3 דקות לבחירה, 4 דקות להסתובב
          group: לבד, ואז כל הכיתה בתנועה
          rules: >-
            רק היגדים שנוח לכם שאחרים יראו; שם אחד בכל משבצת; מי שממלא שורה או טור — קורא ״בינגו!״
          plenary: חוזרים למקומות, ושומעים מה הפתיע
          help: התחילו מכישור אחד וקושי אחד שאתם בטוחים בהם, ורק אחר כך המשיכו.
          challenge: מצאו חבר שכתב את אותו קושי כמוכם — ושאלו אותו מה עוזר לו להתמודד איתו.
      - handout:
          title: מאגר ההיגדים לבינגו
          copies: על גב הדף ״מתנות גדולות״
          verbatim: true
          lines: false
          items:
