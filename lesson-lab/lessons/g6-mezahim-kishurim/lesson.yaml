          - במחיאת כף קמים ומסתובבים. מי שממלא שורה או טור קורא ״בינגו!״, וכולם חוזרים למקומות.
          - במקומות — שאלי מה הפתיע. שמעי שניים־שלושה.
      - slide:
          kicker: בינגו · שלב 1, לבד
          title: בחרו 9 היגדים — כישורים וגם קשיים
