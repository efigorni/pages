sub: >-
  לכל אחד יש דברים שהוא טוב בהם, ודברים שקשה לו. בשיעור הזה כותבים על הכוחות שלנו, מגלים במשחק
  בינגו שאנחנו לא לבד גם בקשיים, ומדברים על מה שעוזר לשתף בקושי ולבקש עזרה.
format: כתיבה אישית, בינגו בתנועה, שלשות ומליאה
question: מה אנחנו יודעים על הכוחות ועל הקשיים שלנו — ומה עוזר לנו לשתף בקושי?
takeaways:
  - לכל אחד יש כוחות וכישורים — ולומר אותם בקול זו הכרה בכוחות, לא התרברבות.
  - גם לאחרים יש קשיים, לפעמים בדיוק כמו שלנו.
  - חשוב לדעת לשתף בקושי ולבקש עזרה — ואפשר לגלות מה עוזר לנו לעשות את זה.
prep:
  - חלוקה מראש לשלשות לפי מקומות הישיבה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — כוחות וקשיים, ושיתוף בקושי — ושאלי מי בכיתה עלול להרגיש חשוף: תלמידים
      עם לקויות למידה או קשב, מי שמתקשה חברתית, מי שמתמודד עכשיו עם קושי בבית. בקשי שתהיה זמינה אחרי
      השיעור.
  - head: מי עלול להיפגע
    text: >-
      בבינגו כל אחד רושם גם קשיים, וחברים רואים אותם — ומי שמתקשה בלימודים, בחברה או בכעס עלול להרגיש
      מסומן. לכן הכלל: בוחרים רק קשיים שנוח לנו שאחרים יראו. במחמאות — רק מילים טובות; מי שמקבל פחות,
      הוסיפי לו אחת בעצמך. מי שנשאר בלי שלשה — צרפי אותו בלי להעיר על זה.
  - head: לא לוחצים לשתף
    text: >-
      כללי השיח של המקור על המסך לפני שמשתפים: ״הנאמר בשיח נשאר בינינו… לספר רק על עצמי״. בשלשות כל
      אחד בוחר על איזה היגד לספר — גם כישור; מותר לוותר, ולא קוראים בשם למי שלא הצביע. הדף האישי
      לא נאסף.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל קושי בבית, חרם או פגיעה מחברים — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 13 דקות ומעלה — ההרחבה; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - bingo
      - discuss
    text: בבינגו ממלאים שש משבצות במקום תשע, ובשיחה במליאה נשארים עם השאלה הראשונה בלבד

brain_break:
  after: triads
  signs: ראשים על השולחן, פיהוקים, שקט שלא נשבר גם אחרי שאלה.
  ideas:
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי חצי דקה מתחלפים.
    - name: נשימת בלון
      text: יד על הבטן. שואפים לאט וממלאים את הבטן כמו בלון, ונושפים לאט עד הסוף. חמש פעמים.
    - name: מחיאה בשלוש
      text: סופרים יחד בקול עד שלושים, ובמקום כל מספר שמתחלק בשלוש — מוחאים כף.
  from: people

