              לסלוח · אני טוב/ה ב… · להקשיב · לעזור להורים · לעזור לחברים · להצחיק · לארגן אירועים · שירה ·
              לשמור על סדר · בישול · אני מוכשר/ת ב… · נגינה · כדורסל/כדורגל · אני מצליח/ה… · ריקוד · קריאת
              ספרים · עריכת סרטים · אומנות · אני יודע/ת… · טכנולוגיה · ספורט · חשבון · שפה · ציור · לשלוט
              בכעס שלי · מחשבים
            - >-
              קשה לי בחשבון · קשה לי… · קשה לי בשפה · קשה לי באנגלית · קשה לי בספורט · קשה לי לקרוא ספרים ·
              אני מבולגן/ת · אני מתקשה לסלוח · אני כועס/ת מהר · אני ממהר/ת להאשים · אני לא כל כך מצליח/ה ב… ·
              אני ביישן/ית · קשה לי לסמוך על אחרים · קשה לי ליצור קשרים חברתיים · קשה לי לבקש עזרה · קשה לי
              להקשיב בשיעור · אני פחות טוב/ה ב… · קשה לי להתאפק · קשה לי לשבת הרבה זמן · קשה לי לעשות שיעורי
              בית · קשה לי לארגן פעילויות · אני לא יודע/ת לצייר יפה · קשה לי לעזור בבית · קשה לי לסלוח
      - slide:
          kicker: בינגו · שלב 2, בתנועה
          title: מצאו מי שכתב כמוכם
