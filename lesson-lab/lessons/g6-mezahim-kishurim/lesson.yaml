steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: מתנות גדולות
    minutes: 4
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: כתיבה אישית בדף שמחכה על השולחן — חמישה משפטים להשלים על הכוחות שלי
    body:
      - slide:
