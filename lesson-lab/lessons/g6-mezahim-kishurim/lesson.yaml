            spotlights:
              - שיתופיות בלמידה
            body:
              - slide:
                  kicker: מתנות גדולות · במליאה
                  title: מה עוד אנחנו יודעים עליכם?
                  sub: מתנדב מקריא משפט מהדף — והכיתה מוסיפה מילה טובה.
