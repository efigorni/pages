          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. מי שתקוע — הפני אותו לשאלת העזר.
          - אחרי שלוש דקות — מניחים את העטים. את התשובות שומעים בשלב הבא.
      - say: שלוש דקות, לבד ובשקט. כתבו מה שנכון לכם — אין כאן תשובות נכונות או לא נכונות.
      - handout:
          title: מתנות גדולות
          copies: עותק לכל תלמיד, על השולחן לפני שהכיתה נכנסת; על גב הדף — מאגר ההיגדים של הבינגו
          verbatim: true
          items:
            - התכונה הבולטת שלי היא…
            - הדבר שאני ממש טוב/ה בו הוא…
            - אני מאוד מוכשר/ת ב…
            - אני אוהב/ת מאד…
            - כשרוצים להחמיא לי, בדרך כלל אומרים לי שאני…
      - ladder:
          help: חשבו על מה שאתם אוהבים לעשות אחרי בית הספר — במה אתם טובים שם?
          challenge: איזה מהכוחות שכתבתם עוזר לכם גם כשקשה? כתבו מתי.
      - say: עכשיו נשמע — וגם נוסיף. לפעמים אחרים רואים בנו דברים שאנחנו עוד לא רואים.

