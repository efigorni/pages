    body:
      - moves:
          - הציגי את השאלות, והפעילי את הטיימר.
          - עמדי בדלת ואספי את הפתקים אחד־אחד.
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: מה אני יודע עכשיו
          prompts:
            - היגד אחד מהחידון שבו טעיתי או הופתעתי — ומה נכון במקומו.
            - איך אבדוק בפעם הבאה שמידע על אלכוהול הוא אמין?
            - רשות — ״רציתי לומר לך ש…״
          look_for: >-
            חפשי מי שעדיין מחזיק במיתוס (״קפה מפכח״, ״אלכוהול מחמם״), דרכי בדיקה כלליות מדי (״לחפש ברשת״), ופתקים
            שמספרים על שתייה בבית או על לחץ לשתות. עם אלה מדברים בשקט השבוע — ומה שנוגע בפגיעה עובר ליועצת עוד היום.
          timer: 180
