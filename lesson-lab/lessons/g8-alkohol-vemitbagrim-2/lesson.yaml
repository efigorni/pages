            - אלכוהול מחמם — לא נכון. מרגישים חום, אבל הגוף מאבד חום ומתקרר.
            - קפה, מקלחת קרה ואוויר צונן מפכחים — לא נכון. רק הזמן מוריד את האלכוהול בדם.
          echo: true
          cue: הקבוצה הראשונה מגלה את התשובות —
