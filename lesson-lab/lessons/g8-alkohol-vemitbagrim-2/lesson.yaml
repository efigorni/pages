          challenge: מה ההבדל, לפי הפס, בין שתייה של פעם אחת לשתייה לאורך זמן?
      - handout:
          title: איברים בגוף
          copies: עותק אחד, גזור ל־11 פסים — פס לכל זוג
          verbatim: true
          lines: false
          items:
            - >-
              מוח - אלכוהול עלול להפחית את זרימת החמצן למוח. ייתכנו חשיבה מעורפלת, חוסר יציבות, ודיבור מבולבל.
              בכמויות גדולות, אלכוהול עלול לגרום לנזק מוחי, לאובדן ההכרה, או למוות. בכמויות קטנות אלכוהול עלול
              להפריע לשנת לילה רגועה.
            - >-
              עיניים - אלכוהול מרפה את שרירי העיניים ומקשה על מיקוד הראייה. התוצאה היא ראייה מעורפלת. בכמויות
              גדולות, אלכוהול עלול להפחית את היכולת לראות ימינה ושמאלה.
            - אף, לשון - אלכוהול, אפילו בכמויות קטנות, עלול להפחית את היכולת להריח ולטעום.
            - >-
              לב - אלכוהול עלול להגביר את העומס על הלב. שימוש רב באלכוהול לתקופה של שנים עלול להזיק לשריר הלב
              המרכזי. אלכוהול עלול גם לגרום לדופק לא סדיר. דופק לא סדיר יכול במקרים מסוימים להוביל לאי ספיקת הלב.
              אלכוהול עלול להעלות את לחץ הדם.
            - >-
              כבד - לאחר תקופה מסוימת של שתייה רבה עלול האלכוהול לגרום לנפיחות ולרגישות בכבד. הדבר יכול למנוע מן
              הכבד לתפקד כראוי ובכך לגרום למחלות קטלניות. כבד שנפגע מאלכוהול עלול להפחית את ייצורם של חומרים
              הגורמים לקרישת דם.
            - >-
              קיבה - אלכוהול מגרה את הציפוי הפנימי של הקיבה ויכול לגרום להקאה. שימוש חוזר בו עלול לגרום לכיבים.
              אלכוהול עלול לגרום לסרטן הוושט, האיבר שמוביל את המזון לקיבה.
            - >-
              לבלב - אלכוהול עלול לגרום לנפיחות בציפוי הפנימי של הלבלב. הנפיחות עלולה לחסום את המעבר למעי הדק.
              חומרים כימיקלים הדרושים למעי הדק לצורך תהליך העיכול אינם יכולים לעבור. החומרים הללו מתחילים לעכל את
              הלבלב עצמו, יוצרים כאב, גורמים להקאות, ועלולים אף לגרום למוות.
            - >-
              כליות - אלכוהול עלול לפגוע ביכולת הכליות לשמור על איזון הנוזלים בגוף. עודף נוזלים עלול לגרום ליתר
              לחץ דם.
            - >-
              ורידים ועורקים - אלכוהול מרחיב את כלי הדם הסמוכים לעור, ובכך גורם לאובדן חום הגוף. עורקים נפוחים
              בראש עלולים ללחוץ על עצבים ולגרום לכאבי ראש.
            - >-
              דם - אלכוהול מפחית את היכולת של מח העצמות לייצר תאי דם אדומים, ובכך גורם למצב הקרוי אנמיה. אדם הלוקה
              באנמיה חש עייף וחלש. אלכוהול גם מקטין את מספר תאי הדם הלבנים ואת יכולתם ללחום בזיהומים. אלכוהול
              מפריע לקרישת הדם.
            - שרירים - אלכוהול עלול לגרום לחולשת שרירים ולהרס שרירים.
      - ask: איזה איבר הפתיע אתכם — ולמה?

