# D57: מילים לועזיות בציטוט מילולי מהמקור — נשארות כמו במקור, ורשומות כאן
latin_ok:
  - HANGOVER

sub: >-
  מה באמת ידוע לנו על אלכוהול? בשיעור הזה בודקים את עצמנו בחידון נכון או לא נכון, מגלים את התשובות בקבוצות,
  רואים מה אלכוהול עושה לחלבון של ביצה — ושואלים איך יודעים שמידע הוא אמין.
format: חידון אישי, קבוצות ומליאה
question: מה אני באמת יודע על אלכוהול — ואיך ידע עוזר לי להחליט?
takeaways:
  - אלכוהול הוא סם חוקי שמשפיע על המוח ועל הגוף — ובגיל ההתבגרות הוא פוגע יותר.
  - לא כל מה ש״כולם יודעים״ נכון — קפה או מקלחת קרה לא מפכחים, ואלכוהול לא מחמם.
  - לפני החלטה במצב של סיכון כדאי לדעת — ולבדוק שהמידע שלנו אמין.
prep:
  - חלוקה מראש לחמש קבוצות לפי השולחנות, ואיזה כרטיס מידע מקבלת כל קבוצה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מידע על אלכוהול והשפעותיו. שאלי אם יש בכיתה מי שהנושא קרוב אליו מדי: מי
      ששותים אצלו בבית יותר מדי, מי שבן משפחה שלו נפגע מאלכוהול (תאונה, אלימות, התמכרות), או מי שכבר שתה
      ונפגע. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      המידע על התמכרות, אלימות, תאונות והרעלה עלול לפגוע במי שמכיר את זה מהבית. מדברים על החומר ועל ההשפעות
      שלו, לא על ״אלכוהוליסטים״ או על ״שיכורים״ כאנשים, ולא שואלים מי שותה או מי מכיר מישהו ששותה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. החידון אישי ולא נאסף, וההצבעות הן על
      ההיגדים, לא על הרגלים. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל שתייה מרובה בבית, אלימות של מבוגר ששתה, או לחץ לשתות שקורה עכשיו — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת: ער״ן 1201 — עזרה
      ראשונה נפשית, 24/7, גם בלי לומר שם; במצב חירום רפואי — מד״א 101 (למשל חשד להרעלת אלכוהול).

