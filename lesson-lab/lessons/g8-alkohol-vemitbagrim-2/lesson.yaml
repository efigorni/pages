  # ------------------------------------------------------------------ 16′–22′
  - id: egg
    title: בחרי מסלול — הביצה והאלכוהול
    minutes: 6
    summary: ניסוי שמראה מה אלכוהול מרוכז עושה לחלבון — ומה הקשר לגוף שלנו
    body:
      - tracks:
          - title: ניסוי על השולחן
            text: >-
              את שוברת ביצה לכלי שקוף ומוסיפה אלכוהול 90%. הכיתה מנחשת מה יקרה, מסתכלת על השינוי, ומחפשת את הקשר
              לגוף.
            when: >-
              יש לך אלכוהול 90% ומעלה, ואת יכולה לעשות את הניסוי בעצמך, על השולחן שלך ורחוק מכל להבה.
            practices:
              - מה הקשר?
              - זמן חשיבה
            spotlights:
              - עניין ורלוונטיות
            prep:
              - ביצה, כלי זכוכית שקוף ובקבוק קטן של אלכוהול 90% ומעלה
            body:
              - slide:
                  kicker: ניסוי · על השולחן
                  title: מה יקרה לביצה, כשנשפוך עליה אלכוהול?
                  sub: בלי אש ובלי חום. נחשו — ואז נסתכל.
                  echo: true
                  alt: ביצה בכלי שקוף, ובקבוק אלכוהול 90% וחץ ממנו אל הביצה
                  art: {file: art/egg.svg}
              - moves:
                  - שברי את הביצה לכלי השקוף מול הכיתה. שאלי, וחכי חמש שניות לפני שאת מזמינה ניחושים.
                  - שפכי אלכוהול עד שהביצה מכוסה. הבקבוק נשאר אצלך, והכלי — על השולחן שלך.
                  - >-
                    תני לכיתה דקה להסתכל ולתאר מה קורה לחלבון. הניחי את הכלי בצד, והראי אותו שוב בסוף השלב — השינוי
                    ממשיך.
              - ask: מה קורה לחלבון — ומה, לדעתכם, הקשר לגוף שלנו?
          - title: צופים בניסוי
            text: >-
              צופים בסרטון קצר שבו שופכים אלכוהול על ביצה. עוצרים לניחוש, ואחרי הצפייה חושבים בזוגות מה הקשר לגוף.
            when: אין לך אלכוהול 90%, או שאת מעדיפה לא לעבוד איתו בכיתה.
            practices:
              - מה הקשר?
              - Think–Pair–Share
            spotlights:
              - עניין ורלוונטיות
              - שיתופיות בלמידה
            body:
              - moves:
                  - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש השערות.
                  - הפעילי את הסרטון, ועצרי בנקודת העצירה לניחוש.
                  - אחרי הצפייה — 20 שניות לבד, דקה בזוגות, ושמעי שלושה זוגות.
              - video:
                  title: ניסוי ביצה ואלכוהול
                  url: https://youtu.be/fs2drTBbaNA
                  length: "1:52"
                  before: מה יקרה לביצה, כששופכים עליה אלכוהול?
                  watch: שימו לב לחלבון — מה קורה לו, בלי שום אש.
                  pauses:
                    - at: "?"
                      moment: >-
                        רגע לפני שהחלבון מתחיל להלבין, אחרי שהאלכוהול כבר נשפך על הביצה. צפי בסרטון (1:52) לפני
                        השיעור, וסמני כאן את הזמן.
                      ask: מה יקרה לחלבון עכשיו? מילה אחת, בלחישה לשכן.
                  alt: ביצה בכלי שקוף, ובקבוק אלכוהול 90% וחץ ממנו אל הביצה
                  art: {file: art/egg.svg}
              - slide:
                  kicker: חושבים · בזוגות · משתפים
                  title: מה הקשר בין הביצה לגוף שלנו?
                  points:
                    - לבד — 20 שניות
                    - בזוגות — דקה
                    - במליאה
                  echo: true
                  cue: אחרי הצפייה —
                  alt: דמות, ומעליה ענן מחשבה ובתוכו נורה
                  art:
                    - {use: kid-stand, x: 60, y: 230, w: 140, color: teal}
                    - {use: thought, x: 250, y: 24, w: 320, flip: true}
                    - {use: bulb, x: 360, y: 74, w: 100}
              - ladder:
                  help: מה קרה לחלבון — ואפשר להחזיר אותו למצב הקודם?
                  challenge: במה הביצה בניסוי שונה מהגוף של מי ששותה?
      - whisper: >-
          ההסבר מהמקור: אלכוהול גורם לתגובה כימית, דנטורציה, שמשנה את מולקולת החלבון — החלבון נהרס, ואי אפשר להחזיר
          אותו למצב הקודם. אמרי גם שזו המחשה בלבד: בניסוי האלכוהול מרוכז מאוד (90%), הרבה יותר מבכל משקה — בבירה
          כ־5%, ביין כ־12%, במשקה חריף כ־40% — ולכן אין לומר שזה מה שקורה בגוף. מה שהניסוי מראה הוא שאלכוהול הוא
          חומר שפוגע, ומה הוא עושה למוח ולאיברים — סיפרו כרטיסי המידע.
      - quote:
          title: מהמקור — להקריא
          text: |-
            אלכוהול פוגע/הורס את חלבון הביצה
            הנזק הוא בלתי הפיך
      - say: >-
          הביצה לא תחזור להיות כמו שהייתה — הנזק בלתי הפיך. אז איך אנחנו יודעים שמה ששמענו היום נכון?

