    body:
      - slide:
          kicker: קדימה ללמידה · לבד
          title: מה אני יודע על אלכוהול?
          sub: כתבו בדף ליד כל אחד מ־14 ההיגדים — נכון או לא נכון.
          timer: 240
          echo: true
          alt: דף חידון, ולידו סימן וי וסימן איקס
          art:
            - {use: note, x: 170, y: 110, w: 240}
            - {use: check, x: 450, y: 110, w: 130}
            - {use: cross, x: 450, y: 300, w: 130}
      - moves:
          - הדפים על השולחנות והשקף על המסך כשהכיתה נכנסת; עונים לבד, בלי הסבר נוסף.
          - בזמן החידון — נוכחות, ואז סיבוב. סמני לעצמך שניים־שלושה היגדים שבהם התשובות בכיתה חלוקות.
          - >-
            על ההיגדים שסימנת — ״מי כתב נכון? מי לא נכון?״ — רשמי על הלוח כמה ידיים לכל צד. את התשובות עוד לא
            מגלים.
      - say: ארבע דקות, לבד. אין ציון — זה חידון בשבילכם, כדי לגלות מה אתם כבר יודעים.
      - ladder:
          help: התחילו מההיגדים שאתם בטוחים בהם, וחזרו לאחרים בסוף.
          challenge: ליד היגד אחד שאתם לא בטוחים בו — כתבו איך הייתם בודקים אותו.
      - handout:
          title: מה אני יודע על אלכוהול? נכון או לא נכון
          copies: עותק לכל תלמיד
          verbatim: true
          items:
            - אלכוהול הוא סם חוקי במדינת ישראל?
            - אלכוהול מחמם?
            - קפה, מקלחת קרה וטיול באוויר הצונן גורמים להפסקת השפעת האלכוהול על האדם?
            - בפחית בירה בחצי כוסית יין ובכוסית משקה חריף יש אותה מידת אלכוהול?
            - אין קשר בין שתיית אלכוהול ואלימות?
            - אפשר להתמכר לאלכוהול?
            - אלכוהול יכול לפגוע במוח ובזיכרון?
            - אם שני אנשים באותו הגיל ישתו את אותו משקה עם אותה כמות ההשפעה תהיה דומה?
            - הרעלת אלכוהול יכולה לגרום לאיבוד הכרה ומוות?
            - שילוב אלכוהול ומשקה אנרגיה אינו מסוכן יותר ממנת אלכוהול רגילה?
            - שתיית אלכוהול עלולה לפגוע בכישורי הנהיגה?
            - לאחר ששותים תמיד מרגישים תופעות לוואי, חמרמורת?
            - שתיית אלכוהול משפיעה רק על ההליכה והדיבור?
            - שילוב של אלכוהול ותרופות עלול להיות מסוכן?
      - say: >-
          את התשובות לא תשמעו ממני. כל קבוצה תקבל כרטיס מידע — ותגלה לנו אותן.

  # ------------------------------------------------------------------ 5′–16′
  - id: answers
    title: בודקים את התשובות
    minutes: 11
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      חמש קבוצות, כרטיס מידע לכל קבוצה עם שניים־שלושה היגדים; כל קבוצה מגלה לכיתה את התשובות ומסבירה, וכולם
      מתקנים בדף שלהם
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הכרטיסים; השקף נשאר על המסך כל זמן ההכנה.
          - >-
            חלקי לכל קבוצה כרטיס מידע אחד. הסתובבי, ובדקי שכל קבוצה מנסחת הסבר של משפט אחד — ולא מקריאה את כל
            הכרטיס.
          - >-
            במליאה, לפי סדר ההיגדים: הקבוצה אומרת את התשובה ומסבירה, ואת מראה את השקף שלה. כולם מתקנים בדף שלהם.
          - אחרי כל קבוצה — שאלי ״מה הפתיע אתכם?״, ושמעי תשובה אחת.
      - slide:
          kicker: בודקים · בקבוצות · 4 דקות
          title: מה התשובה — ולמה?
          sub: קראו את הכרטיס, החליטו נכון או לא נכון, ונסחו הסבר במשפט אחד.
          timer: 240
          alt: דף מידע, וזכוכית מגדלת מעליו
          art:
            - {use: note, x: 110, y: 170, w: 230}
            - {use: magnifier, x: 330, y: 60, w: 240}
      - say: >-
          כל קבוצה מקבלת כרטיס מידע על שניים־שלושה היגדים. אתם המומחים להיגדים האלה — אתם תגלו לנו את התשובה.
      - task:
          what: >-
            קוראים את כרטיס המידע, מחליטים על כל היגד בכרטיס אם הוא נכון או לא נכון, ומנסחים הסבר של משפט אחד לכל
            היגד — כדי לגלות אותו לכיתה.
          time: 4 דקות הכנה, ודקה לכל קבוצה במליאה
          group: חמש קבוצות לפי השולחנות; כרטיס מידע אחד לכל קבוצה
          rules: קורא אחד, כותב אחד, וכולם מציעים; מי שמסיים מוקדם — מחפש בכרטיס עובדה אחת שתפתיע את הכיתה
          plenary: לפי סדר ההיגדים — התשובה וההסבר; כולם מתקנים בדף שלהם
          help: חפשו בכרטיס את המשפט שעונה ישר על ההיגד — ונסחו אותו במילים שלכם.
          challenge: אם ההיגד לא נכון — למה לדעתכם אנשים מאמינים בו? אם הוא נכון — מה הכי חשוב לדעת עליו?
      - handout:
          title: כרטיס מידע א׳ — היגדים 1–3
          copies: עותק אחד, לקבוצה הראשונה
          verbatim: true
          lines: false
          items:
            - >-
              אלכוהול הוא סם חוקי במדינת ישראל? אלכוהול הוא שמו העממי של חומר הנקרא אתנול. אלכוהול הוא סם.
              אלכוהול חודר למוח, מדכא את הפעילות שלו, משפיע על מערכת העצבים המרכזית, פוגם בשליטה ובבקרה האישית
              ויוצר שיבוש ברמה הפיזית התנהגותית של השותה. אלכוהול גורם לתלות נפשית ופיזית וכל שנה הוא גובה מספר רב
              של קורבנות. אלכוהול הוא סם חוקי. המגבלות בחוק הישראלי קשורות למקום בו שותים, לנהיגה תחת השפעת
              אלכוהול ולמכירת משקאות אלכוהוליים למי שטרם מלאו לו 18 שנה.
            - >-
              אלכוהול מחמם? אלכוהול מקרר את הגוף. לאחר שתיית משקה אלכוהולי כלי הדם המצויים קרוב לעור מתרחבים.
              עקב ההתרחבות גדלה כמות הדם המגיע לעור. הוא נעשה חם יותר ומקנה הרגשת חמימות לכל הגוף. בעקבות
              התרחבות כלי הדם באזור העור, הגוף מאבד חום ומתקרר.
            - >-
              קפה, מקלחת קרה וטיול באוויר הצונן גורמים להפסקת השפעת האלכוהול על האדם? שום דבר לא עוזר להתפכח
              מאלכוהול כל עוד הוא נמצא במחזור הדם. ככל שעובר הזמן יורדת רמת האלכוהול בדם בעקבות פירוקו בכבד עד
              לאפס אחוזי אלכוהול בדם. הקפה יגרום לתחושת ערנות אך השפעת האלכוהול עדיין קיימת.
      - handout:
          title: כרטיס מידע ב׳ — היגדים 4–6
          copies: עותק אחד, לקבוצה השנייה
          verbatim: true
          lines: false
          items:
            - >-
              בפחית בירה בחצי כוסית יין ובכוסית משקה חריף יש אותה מידת אלכוהול? פחית בירה 330 מ״ל = כוס יין
              100 מ״ל = כוס משקה חריף 30 מ״ל
            - >-
              אין קשר בין שתיית אלכוהול ואלימות? אלכוהול מגביר את הביטחון העצמי ומשפיע על יכולת החשיבה. אלכוהול
              משחרר מעצורים ומוריד את סף הגירוי של השותה, והוא מגיב באגרסיביות מהר מתמיד. אלכוהול יכול להוביל
              להתנהגות מסוכנת ומסכנת כמו אלימות פיזית, התנהגות מינית לא מבוקרת ופגיעות מיניות. הוא יכול לגרום לנו
              לעשות דברים שאנחנו עלולים להתחרט עליהם.
            - >-
              אפשר להתמכר לאלכוהול? אלכוהול עלול לגרום לתלות ואף להתמכרות. אלכוהוליסט הוא אדם ששותה לאורך
              חודשים ושנים ומגביר את התדירות ואת כמות המשקה לאורך זמן, עד כדי התמכרות שלא מאפשרת למכור לתפקד ללא
              המשקה האלכוהולי.
      - handout:
          title: כרטיס מידע ג׳ — היגדים 7–9
          copies: עותק אחד, לקבוצה השלישית
          verbatim: true
          lines: false
          items:
            - >-
              אלכוהול יכול לפגוע במוח ובזיכרון? צריכת אלכוהול פוגעת באזורים שונים במוח שמשפיעים על התפתחות
              יכולת הזיכרון בהווה ובעתיד, ועלולה לגרום לתופעות של בעיות מוטוריות. במקרים של שתייה עד כדי שכרות עלול
              להיגרם נזק מוחי רב יותר.
            - >-
              אם שני אנשים באותו הגיל ישתו את אותו משקה עם אותה כמות ההשפעה תהיה דומה? אותה כמות אלכוהול יכולה
              להשפיע באופן שונה על אנשים שונים בהתאם לגיל/מין/משקל/ סבילות. כמו כן גם אם אדם לא מרגיש ״שיכור״ באופן
              גלוי יכול להיות שקיימים סממנים סמויים. נשים רגישות יותר לאלכוהול עקב כמות נמוכה יותר של האנזים
              המפרק אלכוהול בקיבתן וכמות מים נמוכה יותר בגופן בהשוואה לרמתם בקיבתם של גברים. ככל שהמשקל נמוך יותר
              ההשפעה של האלכוהול גדולה יותר. בנוסף, חשוב לדעת ילדים ובני נוער פגיעים יותר ממבוגרים לנזקי אלכוהול, מכיוון שהמוח לא מסיים את ההבשלה
              שלו עד גיל 25, תגובת המוח של המתבגרים לחומרים בעייתית יותר מאשר של מבוגרים (התמכרות מהירה יותר).
            - >-
              הרעלת אלכוהול יכולה לגרום לאיבוד הכרה ומוות? הרעלת אלכוהול יכולה להגיע למצב של דום נשימה ומוות.
      - handout:
          title: כרטיס מידע ד׳ — היגדים 10–11
          copies: עותק אחד, לקבוצה הרביעית
          verbatim: true
          lines: false
          items:
            - >-
              שילוב אלכוהול ומשקה אנרגיה אינו מסוכן יותר ממנת אלכוהול רגילה? שילוב של משקאות אנרגיה עם אלכוהול
              מגדיל את הסיכוי להרעלת אלכוהול. בשלב מסוים לאחר ששתית משקה אלכוהולי תחוש צורך לנמנם או לישון.
              העייפות היא תגובה גופנית המודיעה לך ששתית יותר מידי וכדאי שתעצור. משקה האנרגיה מנטרל את תחושת
              העייפות ואתה הופך להיות ״שיכור ערני״. עובדה זו מאפשרת לך להמשיך לשתות ולהשתכר יותר ויותר מבלי
              שתהיה מודע למצבך.
            - >-
              שתיית אלכוהול עלולה לפגוע בכישורי הנהיגה? יש אנשים החושבים שהם מסוגלים לנהוג לאחר שתיית אלכוהול,
              אולם הם טועים. שתיית אלכוהול פוגעת ביכולת הנהיגה — בראייה, בקואורדינציה, בכושר השיפוט, זיכרון וזמן
              התגובה ובריכוז החיוניים לנהיגה בטוחה. נמצא כי אלכוהול הוא אחד הגורמים לתאונות דרכים.
      - handout:
          title: כרטיס מידע ה׳ — היגדים 12–14
          copies: עותק אחד, לקבוצה החמישית
          verbatim: true
          lines: false
          items:
            - >-
              לאחר ששותים תמיד מרגישים תופעות לוואי, חמרמורת, HANGOVER? החמרמורת נגרמת כתוצאה מהתייבשות שהיא
              התוצאה של סילוק האלכוהול מהגוף. האלכוהול מעודד יצירת שתן וכך מביא לאובדן ניכר של מים, דבר הגורם
              להתייבשות ולתסמינים המתוארים. ככל שכמות האלכוהול שנצרכה היא גדולה יותר, כך התסמינים חדים יותר וקשים
              יותר.
            - >-
              שתיית אלכוהול משפיעה רק על ההליכה והדיבור? אומנם האלכוהול משפיע על ההליכה שלנו, היכולת שלנו
              לארגן מחשבות, לקבל החלטות ולהתבטא, אך הוא גם משפיע על התפיסה שלנו את הסביבה, הזיכרון והרגשות שלנו.
              הוא משפיע על הכבד, הוא גורם לרפיון שרירים, קשיי ראיה ועייפות.
            - >-
              שילוב של אלכוהול ותרופות עלול להיות מסוכן? תרופות מסוגים שונים עלולות ליצור תגובה כימית עם
              האלכוהול וכתוצאה מכך לפגיעות קשות ומסוכנות. גם ריטלין/ קונסרטה וכו׳ הן תרופות. אסור לערבב אלכוהול
              עם תרופות!
      - whisper: >-
          להיגד 4: לפי המקור, בבירה כ־5% אלכוהול, ביין כ־12% ובמשקה חריף 40% ומעלה — ולכן פחית בירה (330 מ״ל), חצי
          כוס יין (100 מ״ל) וכוסית משקה חריף (30 מ״ל) מכילות כמות דומה של אלכוהול. התשובה: נכון.
