      - moves:
          - שאלי, וחכי 30 שניות. דקה בזוגות — כל אחד מנסח משפט שהיה אומר לחבר.
          - שמעי שלושה–ארבעה משפטים, ושאלי את הכיתה איזה מהם היה עובד עליהם.
      - say: עכשיו כשאנחנו יודעים יותר — מה תגידו לחבר? משפט אחד, כזה שאפשר באמת להגיד.
      - ladder:
          help: התחילו ב״אכפת לי ממך, ולכן…״
          challenge: מה תעשו אם החבר יענה ״כולם שותים, אין לך מה לדאוג״?
      - ask: ומה תרגישו אם חבר יזמין אתכם למפגש שבו שותים אלכוהול?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: חמשת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - ידע הינו משמעותי וחשוב לפני קבלת החלטות, בעיקר במצבים הכרוכים בסיכון.
            - >-
              אלכוהול הוא חומר שמשפיע על המוח, מסכן ומסוכן. הוא יכול להשפיע ולגרום להתנהגויות סיכון שלא התכוונתם
              אליהן.
            - שתיית אלכוהול בגיל ההתבגרות עשויה לגרום לפיתוח תלות.
            - >-
              כשאתה שותה כדי לתרגל משהו או להשיג משהו או לחוות את עצמך מתמודד עם משהו שקשה לך — אתה לא באמת אתה
              ואינך מפתח שרירים של התמודדות. לחוות את עצמך מתמודד עם משהו שקשה לך — זו תחושת סיפוק עצומה! ״יותר
              אלכוהול — פחות אתה״
            - האלכוהול משלה כפתרון — הוא לא פותר דבר, רק משכר ומשקר.
          ask: >-
            איזה משפט מהחמישה הכי שווה לזכור — ולמה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: המסרים הולכים מהידע (1), דרך מה שאלכוהול עושה (2–3), אל ״יותר אלכוהול — פחות אתה״ (4–5).
          alt: ספר פתוח, ונורה דולקת מעליו
          art:
            - {use: book, x: 150, y: 290, w: 300}
            - {use: bulb, x: 220, y: 30, w: 170}

