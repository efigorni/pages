sub: >-
  כל אחד מגיע לחטיבה עם מסע למידה משלו — עליות, ירידות ושותפים לדרך. בשיעור הזה מוצאים דימוי
  ללמידה, מציירים את המסע, ופוגשים רץ אחד שלא ויתר.
format: לבד, זוגות ומליאה
question: איך נראה מסע הלמידה שלי — ומה עוזר לי להמשיך בו, גם כשקשה?
takeaways:
  - בלמידה יש עליות וירידות — הנאה וסיפוק לצד קושי ותסכול, וכולם חלק מהמסע.
  - לכל אחד מסע משלו ובקצב משלו. אין מסע טוב או לא טוב, ושום ציון לא מגדיר אותנו.
  - מאמץ, התמדה ואנשים שהולכים איתנו בדרך עוזרים להמשיך — גם אחרי נפילה.
prep:
  - דף לבן לכל תלמיד, וטושים או צבעים לכל שולחן
  - חלוקה מראש לזוגות לפי השולחנות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה שהשיעור פותח את היחידה ״מסע הלמידה שלי״, ושהתלמידים מציירים את מסע הלמידה שלהם — גם
      את הירידות. שאלי מי בכיתה מתמודד עכשיו עם קושי לימודי, לקות למידה או מעבר קשה לחטיבה, ובקשי
      שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהלמידה קשה לו, מי שנכשל לא מזמן, ומי שהחטיבה עוד זרה לו. בשאלה ״מי היה איתכם בדרך?״ אפשר
      לבחור כל אחד — מורה, חבר, מאמן או אח — לא רק הורים. לא משווים בין מסעות ולא מדרגים ציורים.
  - head: לא לוחצים לשתף
    text: >-
      הציור שייך למי שצייר אותו. בזוגות מספרים רק מה שבוחרים, ומול הכיתה מראים רק מתנדבים. מותר
      לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף מצוקה או פגיעה
    text: >-
      למשל ייאוש מהלימודים, קושי בבית או בדידות — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״ממשיכים את
    הדרך״; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - draw
      - share
    text: הציור מתקצר לשש דקות, ובמליאה שומעים שני מתנדבים בלבד

brain_break:
  signs: ראשים על השולחן, פיהוקים, עיניים שבורחות לחלון.
  ideas:
    - name: שם באוויר
      text: כותבים את השם באוויר — קודם באצבע, אחר כך במרפק, ובסוף באף.
    - name: אף ואוזן
      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
  from: gallery

