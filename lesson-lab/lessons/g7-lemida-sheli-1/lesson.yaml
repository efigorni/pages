steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: למידה בשבילי זה כמו…
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: משלימים בכתב ״למידה בשבילי זה כמו…״, ושומעים דימוי אחד מכל אחד בסבב מהיר
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: למידה בשבילי זה כמו…
          sub: השלימו את המשפט — בכל דימוי שתבחרו.
          timer: 120
          echo: true
          alt: דמות חושבת, ובענן המחשבה — דרך מתפתלת
          art:
            - {use: thought, x: 214, y: 24, w: 320, flip: true}
            - {use: road, x: 266, y: 76, w: 200}
            - {use: kid-stand, x: 185, y: 244, w: 140, color: teal}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת. כותבים בשקט, בלי הסבר נוסף; בינתיים — נוכחות.
          - >-
            אחרי שתי דקות — סבב מהיר: כל אחד אומר רק את הדימוי שלו (״כמו טיפוס על הר״), בלי הסבר ובלי
            תגובות. מותר לעבור.
          - >-
            בסוף הסבב שקפי לכיתה את התמונה שעלתה — כמה דימויים של הנאה, כמה של קושי וכמה של שניהם. בלי
            לשפוט אף דימוי.
      - say: שתי דקות, לבד ובשקט. אין דימוי נכון — כל מה שעולה לכם.
      - ladder:
          help: חשבו על משהו שאתם אוהבים לעשות — טיול, משחק, בישול. במה הלמידה דומה לו?
          challenge: הוסיפו ״…אבל לפעמים זה כמו…״ — דימוי שני, לרגעים שבהם קשה.
      - say: >-
          שמענו טיפוס, רכבת הרים וגם חופש — לכל אחד מסע משלו. עכשיו נצייר אותו.

  # ------------------------------------------------------------------ 5′–15′
  - id: draw
    title: מסע הלמידה שלי
    minutes: 10
    practices:
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - דיפרנציאליות וגיוון
    summary: כל אחד מצייר את מסע הלמידה שלו מהגן והיסודי ועד היום — עליות, ירידות ומי היה איתו בדרך
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים דפים; השקף נשאר על המסך כל זמן הציור.
          - הקריאי את שאלות החשיבה של המקור (למטה), ותני לכיתה רגע לחשוב לפני שמתחילים.
          - חלקי דפים, וטושים לכל שולחן. הסתובבי בין השולחנות; מי שתקוע — הציעי לו את קו הזמן.
          - דקה לפני הסוף — הודיעי, ובקשי מכל אחד לסמן במסע נקודה אחת — ״כאן אני היום״.
      - slide:
          kicker: מסע הלמידה שלי · לבד, 8 דקות
          title: ציירו את מסע הלמידה שלכם
          sub: מהגן והיסודי — ועד היום.
          points:
            - כמו מה הוא נראה — ובאילו צבעים?
            - איפה היו העליות, ואיפה הירידות?
            - מי היה איתכם בדרך?
          timer: 480
          echo: true
          alt: דף, ועליו דרך מתפתלת, ועיפרון לידו
          art:
            - {use: note, x: 170, y: 100, w: 256}
            - {use: road, x: 223, y: 196, w: 150}
            - {use: pencil, x: 380, y: 296, w: 150}
      - quote:
          title: שאלות החשיבה מהמקור — להקריא לפני הציור
          text: |-
            כמו מה המסע נראה? למה הייתם מדמים אותו? באילו צבעים תשתמשו, מדוע?
            מה היה נעים וטוב, ומה מאתגר, מתסכל או קשה? מה היו העליות ורגעי הסיפוק ומה היו הירידות?
            מי נמצא אתכם בדרך? מי השותפים שלכם במסע?
      - say: >-
          כל אחד מאיתנו כבר עבר דרך ארוכה בלמידה — בגן, ביסודי, בבית ועם חברים. ציירו אותה, בכל דימוי
          שתבחרו. אין ציור ״נכון״ או ״יפה״.
      - ask: לפני שמתחילים — מה מסמנים בציור, חוץ מהדרך עצמה?
      - task:
          what: >-
            כל אחד מצייר את מסע הלמידה שלו מהגן והיסודי ועד היום — דרך, הר, ים או כל דימוי אחר. מסמנים
            עליות וירידות, ומי היה שותף לדרך.
          time: 8 דקות
          group: לבד
          rules: כל צורה מותרת — ציור, מפה או קו זמן; כותבים מילים רק אם רוצים
          plenary: בזוגות, ואחר כך מתנדבים מראים לכיתה
          help: לא בא לכם לצייר? שרטטו קו זמן מכיתה א׳ ועד היום, ולכל שנה סמנו — למעלה או למטה.
          challenge: סמנו רגע אחד שבו הצלחתם אחרי קושי — ומה עזר לכם אז?
      - tip: >-
          אם נוח לך — שירים על דרכים ומסעות ברקע, בשקט, בזמן הציור (כמו שהמקור מציע).
      - say: הניחו את הטושים. עכשיו נסתכל על המסעות — אבל קודם, איך מדברים על דברים אישיים.

  # ------------------------------------------------------------------ 15′–21′
  - id: share
    title: מסע במבט מחודש
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      כללי השיח, ואז שאלה אחת לעומק — לבד, בזוגות מול הציורים, ובמליאה עם שניים־שלושה מסעות
    body:
      - slide:
          kicker: הנחיות לשיח מיטבי
          title: שיח מעודד ומקבל
          sub: שיתוף מהלב
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו
            - אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
          verbatim: true
          echo: true
          alt: זוג יד ביד, ומעליו בועת דיבור ובה לב
          art:
            - {use: speech-l, x: 300, y: 28, w: 260}
            - {use: heart, x: 384, y: 66, w: 100}
            - {use: pair, x: 70, y: 220, w: 250}
      - moves:
          - הציגי את ההנחיות וקראי אותן בקול — אלה כללי השיח של כל היחידה.
          - >-
            שאלי, וחכי חצי דקה של שקט. אחר כך בזוגות — כל אחד מראה לבן הזוג את הציור ומספר מה גילה בו.
            דקה לכל אחד.
          - >-
            במליאה — הזמיני שניים־שלושה מתנדבים להראות את המסע לכיתה. על כל אחד — הדהדי, ושאלי מי עוד
            מכיר רגע כזה.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה גיליתם על הלמידה שלכם?
          sub: כשהסתכלתם על המסע מחדש.
          points:
            - לבד — חצי דקה
            - בזוגות — דקה לכל אחד
            - במליאה
          echo: true
          cue: אחרי ההנחיות —
          alt: שני תלמידים יושבים זה מול זה, ודף ביניהם
          art:
            - {use: kid-sit, x: 50, y: 240, w: 170, color: teal}
            - {use: kid-sit, x: 400, y: 240, w: 170, flip: true}
            - {use: note, x: 250, y: 200, w: 120}
      - ladder:
          help: הסתכלו על הירידה הכי גדולה במסע — מה עזר לכם לעלות ממנה?
          challenge: מה דומה ומה שונה בין המסע שלכם למסע של בן הזוג?
      - ask: מה גיליתם על הלמידה שלכם, כשהסתכלתם על המסע מחדש?
      - say: אז מה שגילית זה ___ — הבנתי נכון? למי עוד זה מוכר?
      - say: >-
          לכל אחד מסע אחר, עם עליות וירידות. עכשיו נראה מסע של רץ אחד — ונחשוב מה עזר לו להמשיך.

  # ------------------------------------------------------------------ 21′–27′
  - id: race
    title: המרוץ של דרק רדמונד
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: צופים ברץ שנפצע באמצע חצי הגמר בברצלונה 1992, ומתווכחים — האם הוא ניצח או הפסיד?
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש תשובות קצרות.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה.
          - >-
            אחרי הצפייה — שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות. על כל תשובה: ״מי מסכים? מי
            חושב אחרת? למה?״
      - video:
          title: דרק רדמונד — אולימפיאדת ברצלונה 1992
          url: https://www.youtube.com/watch?v=YaVDJ_8PgcU
          length: "3:15"
          before: מה זה לנצח במרוץ?
          watch: שימו לב לרץ — מה קורה לו באמצע המרוץ, ומה הוא בוחר לעשות.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו דרק נפצע ונופל על המסלול, אחרי כ־150 מטרים בחצי הגמר — לפני שהוא קם. צפי בסרטון
                לפני השיעור, ורשמי כאן את הזמן.
              ask: מה הוא יעשה עכשיו? מילה אחת, בלחישה לשכן.
          alt: דגל בקו הסיום, ודמות בדרך אליו
          art:
            - {use: flag, x: 330, y: 100, w: 230}
            - {use: kid-stand, x: 90, y: 236, w: 130, color: teal}
      - slide:
          kicker: אחרי הצפייה
          title: האם דרק ניצח או הפסיד?
          sub: ומה עזר לו להמשיך במסע?
          echo: true
          cue: אחרי הצפייה —
          alt: מאזניים, ודגל לידם
          art:
            - {use: scale, x: 60, y: 140, w: 330}
            - {use: flag, x: 420, y: 230, w: 140}
      - ask: אז מה אתם חושבים — האם דרק ניצח או הפסיד? ומה עזר לו להמשיך במסע?

  # ------------------------------------------------------------------ +5′
  - id: ahead
    title: ממשיכים את הדרך
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
    summary: חוזרים לציור ומוסיפים את ההמשך — לאן ממשיכים מכאן, ומי יעזור בדרך
    body:
      - slide:
          kicker: אם נשאר זמן · ממשיכים את הדרך
          title: לאן תרצו להמשיך ללכת?
          sub: הוסיפו לציור את הדרך מכאן — ומי יעזור לכם בה.
          timer: 180
          echo: true
          alt: דרך מתפתלת, ובסופה דגל
          art:
            - {use: road, x: 40, y: 190, w: 400}
            - {use: flag, x: 217, y: 201, w: 120}
      - moves:
          - הקריאי את שלוש השאלות של המקור. חוזרים לציורים.
          - שלוש דקות של ציור. אחר כך שניים־שלושה מספרים לאן הם רוצים להגיע.
      - say: חזרו לציור שלכם. עד עכשיו ציירתם את הדרך שכבר עברתם — עכשיו ציירו את ההמשך.
      - quote:
          title: מהמקור — להקריא
          text: |-
            מהי הנקודה בה אתם נמצאים היום ולאן תרצו להמשיך ללכת?
            איך תראה הדרך לשם? מי יעזור לכם להגיע לשם?
            איך תדעו שהגעתם? איך תראה ההצלחה? מי ישמח בהצלחתכם?
      - task:
          what: כל אחד מוסיף לציור את ההמשך — לאן הוא רוצה להגיע, ומה או מי יעזור לו בדרך.
          time: 3 דקות
          group: לבד
          rules: ממשיכים מהנקודה ״כאן אני היום״; מספרים רק מה שרוצים
          plenary: שניים־שלושה מספרים לאן הם רוצים להגיע
          help: חשבו על סוף השנה — מה הייתם רוצים לדעת או לעשות אז?
          challenge: הוסיפו לדרך גם מכשול אחד שאתם צופים — ואיך תעברו אותו.
      - ask: לאן אתם רוצים להגיע — ומי יעזור לכם בדרך?

  # ------------------------------------------------------------------ +5′
  - id: gallery
