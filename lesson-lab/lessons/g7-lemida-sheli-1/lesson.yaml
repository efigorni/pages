  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ארבעת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              תהליך הלמידה כולל רגשות חיוביים של הנאה, סיפוק, צמיחה, סקרנות וגם רגשות המתייחסים לקושי,
              תסכול, מאמץ וחוסר הצלחה.
            - >-
              כל אחד חווה את ״מסע הלמידה״ האישי שלו באופן אחר. אין מסע ״טוב״ או ״מסע לא טוב״.
            - >-
              מסע הלמידה — גם אם בעבר לא כל כך הצלחנו — נוכל להצליח בעתיד. שום ציון לא מגדיר אותנו, בטח לא
              ציון בודד. אם נתאמץ ונתרגל — נצליח!
            - >-
              ההתאקלמות בחט״ב לוקחת זמן ולכל אחד מאיתנו יש קצב אחר. לכן, חשוב לא להיות שיפוטיים או
              ביקורתיים כלפי עצמנו או כלפי אחרים.
          ask: איזה משפט מהארבעה הכי מתאים למסע שלכם? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהרגשות שבדרך, דרך ״אין מסע טוב או לא טוב״ ו״שום ציון לא מגדיר אותנו״, אל
            הסבלנות למעבר לחטיבה — כמו העליות והירידות בציורים.
          alt: הר עם דגל בפסגה, ודמות למרגלותיו
          art:
            - {use: mountain, x: 140, y: 196, w: 330}
            - {use: flag, x: 336, y: 76, w: 108}
            - {use: kid-stand, x: 466, y: 270, w: 110, color: teal}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — בכוונתי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: שתי שאלות על המסע, ו״בכוונתי״ לצעד אחד כבר מחר; פתקים נאספים בדלת
    body:
      - say: >-
          שלוש שאלות קצרות, לבד ובשקט — שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: מסע הלמידה שלי
          prompts:
            - משהו שלמדתי היום על מסע הלמידה שלי.
            - מה עוזר לי להמשיך, גם כשקשה?
            - בכוונתי… — דבר אחד שאעשה כבר מחר.
          look_for: >-
            חפשי מי שכתב רק על קושי, בלי שום דבר שעוזר לו; כוונות כלליות מדי (״ללמוד יותר״) לעומת צעד עם
            זמן ומקום; ופתקים שמספרים על ייאוש או על מצוקה. עם אלה מדברים בשקט השבוע — ומה שנוגע במצוקה
            עובר ליועצת עוד היום.
          timer: 180
          alt: דף ועיפרון
          art:
            - {use: note, x: 100, y: 60, w: 256}
            - {use: pencil, x: 300, y: 270, w: 190}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
