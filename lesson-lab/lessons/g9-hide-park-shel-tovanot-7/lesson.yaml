  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלושת המסרים המרכזיים של ״בוחרים בחיים״, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          title: מסרים מרכזיים של ״בוחרים בחיים״
          items:
            - >-
              **לכל בעיה יש פתרון!** גם במצבי מצוקה וקושי נזכור שניתן לעזור לאחר וגם לקבל עזרה עבור עצמי. חשוב לדעת לזהות
              את המצבים שבהם נדרש לפנות לעזרה.
            - >-
              **שיתוף מציל חיים!** לא נשארים לבד עם הכאב. שיתוף פותח דלת לקשר, להבנה ולעזרה ומחזק גם את מי שמשתף וגם את מי
              שמקשיב.
            - >-
              **לכולנו יש משאבים וכוחות התמודדות!** לכל אחד ואחת יש עוגנים שמסייעים בשמירה על החוסן ובהתמודדות במצבי קושי
              ומצוקה.
          ask: איזה מסר מהשלושה הייתם רוצים להעביר הלאה — ולמי? חשבו רגע, ואז הצביעו.
          tip: >-
            שלושת המסרים של התוכנית כולה: פתרון ועזרה, שיתוף, וכוחות. בשקף האחרון של המצגת המקורית יש גרסה שלהם להדפסה
            ולתלייה בכיתה.
          alt: שמש, וזוג חברים מתחתיה
          art:
            - {use: sun, x: 210, y: 30, w: 200}
            - {use: pair, x: 195, y: 260, w: 230}

