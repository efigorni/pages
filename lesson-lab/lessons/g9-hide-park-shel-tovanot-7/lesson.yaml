sensitivity: med

sub: >-
  ידע מציל חיים. בשיעור הזה נזכרים בנושאים של ״בוחרים בחיים״, כל אחד בוחר מה לקחת איתו, ובקבוצות יוצרים תוצר
  שמעביר תובנה אחת הלאה.
format: כתיבה אישית, קבוצות ומליאה
question: איזה מסר חשוב לי לקחת איתי — ולמי אעביר אותו?
takeaways:
  - מכל מה שלמדנו על התמודדות, אפשר לבחור את מה שהכי חשוב לנו — ולקחת אותו לחיים.
  - שיתוף מציל חיים — ולכל אחד יש כוחות, ויש למי לפנות.
  - כשמעבירים מסר הלאה, הוא יכול להגיע גם למי שזקוק לו עכשיו.
prep:
  - חלוקה מראש לקבוצות של עד שש, לפי השולחנות
  - שלושת שלבי העבודה בקבוצות — כתובים על הלוח לפני השיעור
  - בריסטולים, טושים וצבעים — לקבוצות שיבחרו כרזה

safe:
  - head: תיאום עם היועצת
    text: >-
      השיעור מסכם את ״בוחרים בחיים״ — תוכנית למניעת אובדנות ולחיזוק חוסן. ספרי לה מתי השיעור, וסכמו מראש שהיא תעבור על
      התוצרים לפני שהם יוצאים מהכיתה — להורים, לשכבה או לרשת. המקור מציע גם מפגש סיכום חגיגי עם הורים — אם רוצים,
      מתכננים אותו איתה. בקשי שתהיה זמינה אחרי השיעור. במצגת המקורית יש מכתב להורים — החליטו יחד אם לשלוח אותו.
  - head: מי עלול להיפגע
    text: >-
      תוצרים על ״הצלת חיים״ נוגעים באובדנות, ומי שאיבד אדם קרוב או פגע בעצמו עלול להיפגע ממסר שמתאר פגיעה. כווני את
      הקבוצות למסרים של עזרה, שיתוף ותקווה — בלי תיאור של פגיעה או של דרכים לפגוע, ועם מקום שאפשר לפנות אליו. נושאי
      האובדנות והדיכאון בכרטיס — רק אם נלמדו בכיתה; אחרת מוחקים אותם לפני שמחלקים.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. הכרטיס האישי נשאר אצל
      הכותב; בקבוצה כל אחד בוחר מה לספר, ומציגות רק קבוצות שהתנדבו. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.
      תוצר או פתק שרומז על מצוקה של מי שכתב — לא מחכים: מדברים בשקט ומעדכנים את היועצת עוד היום.

time:
  clock: >-
