      - task:
          what: >-
            כל זוג בוחר דרך אחת משבע הדרכים. אחד משחק חבר שמתלבט אם להשתמש בקנאביס, והשני ניגש אליו בדרך שבחרו,
            במילים שלו. אחרי דקה מתחלפים, עם דרך אחרת.
          time: 2 דקות, ועוד 2 למליאה
          group: זוגות לפי השולחנות
          rules: כל אחד משחק דמות, לא את עצמו; בלי להטיף ובלי להרים את הקול
          plenary: שניים־שלושה זוגות מספרים איזו דרך הרגישה הכי טבעית
          help: התחילו במילה שעל הלוח, למשל ״אכפתיות — אכפת לי ממך, ולכן…״
          challenge: נסו את הדרך שנראית לכם הכי קשה — מה עזר לכם לומר אותה?
      - ask: איזו דרך הרגישה הכי טבעית — ואיזו הכי קשה?

