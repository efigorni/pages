      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: ספירה עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים, ובכל פעם מישהו אחר אומר מספר אחד. אם שניים אומרים יחד — מתחילים מאחת.
    - name: נשימת קופסה
