  # ------------------------------------------------------------------ 22′–27′
  - id: friend
    title: ובקשר לחברים ולחברות
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
