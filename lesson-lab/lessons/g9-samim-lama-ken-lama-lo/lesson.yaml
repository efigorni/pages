sensitivity: med

sub: >-
  הדעות על קנאביס רבות, ולא פעם מבלבלות. בשיעור הזה בודקים מה אנחנו יודעים ומרגישים, נחשפים לעמדות של
  אחרים, ומחפשים איך ניגשים לחבר טוב שמתלבט.
format: לבד, קבוצות, זוגות ומליאה
question: על מה מתבססת העמדה שלי כלפי קנאביס — ואיך אפשר לעזור לחבר שמתלבט?
takeaways:
  - קנאביס הוא סם שמשנה את התודעה, והמוח של מתבגרים — שעוד מתפתח — רגיש להשפעות שלו במיוחד.
  - כדאי לבדוק על מה מתבססות העמדות שלנו, ולהקשיב גם לעמדות של אחרים.
  - בכוחנו להשפיע על החברים שלנו — מתוך קרבה ואכפתיות, לא מתוך שיפוט.
prep:
  - פתק ״ממו״ לכל תלמיד, ועוד כמה פתקים ריקים לכל קבוצה
  - חלוקה מראש לקבוצות של 4–6 לפי השולחנות, לסבב הפתקים

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — עמדות כלפי קנאביס, ומה אומרים לחבר שמתלבט. שאלי אם יש בכיתה מי שהנושא
      קרוב אליו: מי שבבית משתמשים (גם ברישיון רפואי), מי שכבר התנסה, או מי שחבר קרוב שלו משתמש. בקשי שתהיה
      זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שבמשפחה שלו מטופלים בקנאביס רפואי — ההבחנה של המקור חשובה כאן: שימוש רפואי מותר רק באישור רופא
      ובמעקב. מדברים על השימוש ועל הסיכון, לא על ״מי שמשתמשים״ כאנשים. בסבב הפתקים יופיע גם ״כן כדאי״ — זה
      חלק מהפעילות; את המסר הברור נותנים ב״חשוב לזכור״, לא בתגובה לפתק של מישהו.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו״. הפתקים בלי שמות, ואף אחד לא מנחש מי כתב מה. לא שואלים מי ראה,
      הריח או ניסה. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל שימוש שקורה עכשיו, אצלו או אצל חבר, או לחץ להשתמש — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית
      אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״שבע דרכים, בזוגות״;
    פחות — ישר ל״חשוב לזכור״.
  short:
