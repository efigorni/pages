    summary: כתיבה קצרה כשנכנסים — מה אני יודע על קנאביס; שומעים, ובודקים מול ארבע עובדות מהמקור
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: מהו קנאביס?
          sub: כתבו שלושה דברים שאתם יודעים — או ששמעתם — על קנאביס.
          timer: 180
          echo: true
          alt: תלמיד כותב ליד שולחן, ומעליו ענן מחשבה עם סימן שאלה
          art:
            - {use: kid-desk, x: 260, y: 136, w: 285, color: teal}
            - {use: thought, x: 40, y: 30, w: 230}
            - text: '?'
              x: 155
              y: 122
              size: 96
      - moves:
          - השקף על המסך כשהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - >-
            בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך משפטים כמו ״יש סמים קלים״ או ״זה טבעי״ —
            נחזור אליהם.
          - שמעי ארבע–חמש תשובות, והדהדי בלי לתקן. רשמי על הלוח את מה שעוד צריך לבדוק.
          - הציגי את שקף העובדות נקודה אחרי נקודה, וחברי כל נקודה למשהו שנאמר.
      - say: שלוש דקות, לבד ובשקט. אפשר לכתוב גם משהו ששמעתם ואתם לא בטוחים שהוא נכון.
      - ladder:
          help: אילו עוד שמות של קנאביס אתם מכירים? איפה שמעתם עליו?
          challenge: כתבו משהו ששמעתם על קנאביס ואתם לא בטוחים שהוא נכון — ומה יעזור לבדוק אותו.
      - slide:
          kicker: מהו קנאביס?
          title: מה כדאי לדעת?
          points:
            - צמח שממנו מפיקים חומרים משני תודעה, שמשפיעים על המוח
            - בישראל השימוש אסור בחוק; שימוש רפואי — רק באישור רופא מוסמך ובמעקב
          echo: true
          cue: אחרי שמיעת התשובות —
          alt: ספר פתוח, ונורה דולקת לידו
          art:
            - {use: book, x: 220, y: 230, w: 330, color: purple}
            - {use: bulb, x: 60, y: 60, w: 150, color: orange}
      - slide:
          kicker: מהו קנאביס?
          title: ובגיל ההתבגרות?
          points:
            - מוח המתבגר עוד מתפתח, והקנאביס יכול לפגוע בלמידה, בזיכרון ובמוטיבציה
            - אין סמים ״קלים״ — וככל שמתחילים מוקדם יותר, הסיכון להתמכרות גבוה יותר
          echo: true
          cue: והמשך —
          alt: מוח, ונבט קטן לידו
          art: {file: art/brain-sprout.svg}
      - whisper: >-
          אם עולה ״זה תרופה, אז זה בטוח״ — לפי המקור, השימוש הרפואי מותר רק באישור רופא ובמעקב, וצריכה ממושכת
          יכולה להוביל להתמכרות. השימוש בגיל ההתבגרות גם מגביר סיכון לפגיעה נפשית ולהתפרצות פסיכוזה.
      - say: >-
          יש דברים שאנחנו יודעים, ויש דברים שרק שמענו. עכשיו נעבור ממה שאנחנו יודעים — למה שאנחנו מרגישים.

