          kicker: חושבים · בזוגות · משתפים
          title: איך הייתם ניגשים לחבר טוב?
          sub: ומה הייתם אומרים לו, כדי לעודד אותו להימנע מקנאביס?
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          alt: זוג יד ביד, ובועת דיבור עם לב
          art:
            - {use: pair, x: 60, y: 250, w: 230}
            - {use: speech-l, x: 300, y: 50, w: 250}
            - {use: heart, x: 376, y: 86, w: 100}
      - moves:
          - שאלי, וחכי 30 שניות של שקט.
          - דקה בזוגות — כל אחד אומר לשני את המשפט שלו, כאילו השני הוא החבר.
          - שמעי שלושה זוגות, ואז הציגי את שבע הדרכים של המקור. שאלי איזו דרך כבר נשמעה כאן.
      - ladder:
          help: התחילו ב״אכפת לי ממך, ולכן…״
          challenge: מה תגידו אם החבר עונה ״כולם עושים את זה״?
      - slide:
          kicker: שבע דרכים · 1–4
          title: אז בקשר לחברים ולחברות
          points:
            - קשר קרוב — הוא חשוב לנו
            - נאמנות — אנחנו נאמנים לו
            - אכפתיות — אכפת לנו ממנו
            - ביחד — נמצא משהו כיפי אחר לעשות
          verbatim:
            - title
          echo: true
          cue: אחרי שלושה זוגות —
          alt: שתי ידיים מושטות זו לזו
          art: hands-help
      - slide:
          kicker: שבע דרכים · 5–7
          title: ועוד שלוש דרכים
          points:
            - יש לכם כוח — הוא חזק, ולא זקוק לקנאביס
            - סוף פסוק — נלך יחד לבילוי אחר
            - סלע איתן — אנחנו לצדו
          echo: true
          cue: והמשך —
          alt: הר גבוה, ודמות עומדת לידו
          art:
            - {use: mountain, x: 200, y: 140, w: 360}
            - {use: kid-stand, x: 60, y: 230, w: 130, color: teal}
      - quote:
          title: שבע הדרכים, כמו במקור — להקריא כשמציגים את השקפים
          text: |-
            קשר קרוב – נאמר לחבר או לחברה שהם חשובים לנו ולכן חשוב לנו שלא ישתמשו בקנאביס.
            נאמנות – נסביר להם שאנחנו נאמנים להם וחשוב לנו שהם יהיו מוגנים ובטוחים.
            אכפתיות – נדגיש להם שאכפת לנו מהם.
            ביחד – נציע להם שנמצא משהו כיפי אחר לעשות ביחד, או משהו אחר שיעזור להם.
            יש לכם כוח – נזכיר להם שהם חזקים ואחראים ואלופים, ושהם לא זקוקים לקנאביס.
            סוף פסוק – נלך יחד ונמצא לעצמנו בילוי שיסיח את הדעת ויספק את הצורך בהנאה או בהסחת דעת.
            סלע איתן – נזכיר להם שאנחנו לצדם ושהם תמיד יכולים לסמוך עלינו ושאנחנו סומכים עליהם
      - whisper: >-
          ראשי התיבות של שש הדרכים הראשונות יוצרים ״קנאביס״. אפשר לתת לכיתה לגלות את זה לבד.
      - ask: איזו דרך הייתה עובדת עליכם — ולמה דווקא היא?

