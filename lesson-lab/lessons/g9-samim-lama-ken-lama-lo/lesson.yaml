  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: חמשת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - הדעות על הקנאביס הן רבות, מגוונות ולא פעם אף מבלבלות.
            - לאמירות ולנורמות חברתיות יש השפעה על ההחלטות, על הבחירות ועל ההתנהגות שלנו.
            - >-
              לצד העובדה שכיום יותר אנשים טוענים שקנאביס אינו מסוכן, ואף תומכים בלגליזציה שלו, הרי שהמחקרים
              מעידים על סיכונים ועל ההשלכות השליליות של השימוש בו, במיוחד בגיל ההתבגרות.
            - >-
              כשמדובר בנושא מורכב ובהתנהגות סיכונית, חשוב שנבדוק על מה מתבססות העמדות שלנו, ונחפש ידע ומידע אמין
              בנושא שיסייעו לנו לבחון אותן ולקבל החלטות מבוססות ושקולות שיעזרו לנו להימנע מהתנהגויות שיכולות לסכן
              אותנו.
            - >-
              בכוחנו להשפיע על הבחירות של החברים והחברות שלנו, לשכנע אותם לא להשתמש בסם ולעודד אותם לבחור דרכים
              אחרות כדי לשמוח, להתנתק, לבלות…
          ask: איזה משפט הייתם רוצים שחבר טוב ישמע? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהבלבול ומהנורמות (1–2), דרך מה שהמחקרים אומרים (3), אל בדיקת העמדות שלנו (4) והכוח
            להשפיע על חברים (5) — מה שתרגלו בשיעור.
          alt: זוג יד ביד, ולב מעליהם
          art:
            - {use: pair, x: 300, y: 220, w: 260}
            - {use: heart, x: 110, y: 90, w: 150}

