steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: speed
    title: ספיד דייט
    minutes: 5
    practices:
      - מה הקשר?
      - הוצאה למשימה
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: שלוש שאלות על החיים ברשת, דקה לכל אחת, בכל פעם עם בן זוג אחר; במליאה — מה התחדד
    body:
      - slide:
          kicker: ספיד דייט · 1 מתוך 3
          title: אפליקציה אחת לאי בודד
          sub: איזו אפליקציה תבחרו לקחת לאי בודד, אם יותר לכם לקחת רק אפליקציה אחת? הסבירו.
          verbatim: [sub]
          timer: 60
          echo: true
          alt: טלפון, ושמש מעליו
          art:
            - {use: phone, x: 250, y: 200, w: 170}
            - {use: sun, x: 420, y: 40, w: 150}
      - moves:
          - >-
            הסבירי לפני שקמים: בכל סבב בן זוג אחר, דקה לכל שאלה, ובאות שלך מחליפים. אפשר שני מעגלים, פנימי
            וחיצוני, פנים מול פנים — רק המעגל הפנימי זז כיסא ימינה.
          - בכל סבב הציגי את השאלה והפעילי את הטיימר. דקה — ומחליפים.
          - אחרי השאלה השלישית חוזרים למקומות. את התשובות לשאלה הזו לא שומעים במליאה.
          - במליאה — שאלי מה התחדד, ושמעי שתיים־שלוש תשובות.
      - task:
          what: מדברים בזוגות מתחלפים — דקה לכל שאלה, ובכל סבב בן זוג אחר.
          time: 3 סבבים, דקה לכל סבב
          group: זוגות מתחלפים
          rules: כל אחד מדבר חצי דקה; מותר לענות קצר או לעבור
          plenary: שתיים־שלוש תשובות לשאלה ״מה התחדד לנו?״
          help: בחרו אפליקציה אחת שאתם פותחים כל יום — מה היא נותנת לכם?
          challenge: מה הרשת נותנת לכם שאין במקום אחר — ומה המחיר?
      - slide:
          kicker: ספיד דייט · 2 מתוך 3
          title: ספרו אחד לשני על יתרונות הרשת בעיניכם.
          verbatim: true
          timer: 60
          echo: true
          cue: בן זוג חדש —
          alt: רשת של עיגולים מחוברים, ואגודל למעלה
          art:
            - {use: network, x: 80, y: 160, w: 300}
            - {use: thumb-up, x: 420, y: 60, w: 150}
      - slide:
          kicker: ספיד דייט · 3 מתוך 3
          title: למי תפנה לעזרה אם נפגעת ברשת?
          verbatim: true
          timer: 60
          echo: true
          cue: בן זוג חדש —
          alt: שתי ידיים מושטות זו לזו
          art:
            - {use: hands-help, x: 160, y: 130, w: 300}
      - ask: מה התחדד לכם בעקבות הספיד דייט — על עצמכם ועל החברים שלכם?
      - say: >-
          הרשת היא חלק מהחיים שלנו — היא נותנת שייכות, עניין וחברים. ובאותה רשת יש גם סכנות. היום נלמד לזהות
          אותן.

  # ------------------------------------------------------------------ 5′–12′
  - id: flags
    title: שמים ״על השולחן״
    minutes: 7
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: בקבוצות מרימים כרטיסיות שיח על מצבים ברשת; במליאה — איך מזהים מצב סיכון, והנורות האדומות
    body:
      - slide:
          kicker: שמים ״על השולחן״ · בקבוצות
          title: מרימים כרטיס — ומדברים
          sub: כל פעם כרטיס אחד — מה דעתכם, ומה אתם מכירים?
          timer: 240
          alt: ארבעה סביב שולחן, ודף לידם
          art:
            - {use: circle4, x: 150, y: 170, w: 300}
            - {use: note, x: 460, y: 40, w: 130}
      - moves:
          - חלקי לכל קבוצה ערכת כרטיסים, הפוכה על השולחן.
          - >-
            חברי הקבוצה מרימים כל פעם כרטיס אחד ומשוחחים עליו — כמה כרטיסים שמספיקים. הסתובבי והקשיבי.
          - במליאה — שאלי, ואחר כך הציגי את הנורות האדומות. השלימי מהמידע שלמטה.
      - task:
          what: >-
            מרימים כל פעם כרטיס אחד, משוחחים על הסוגיה שבו ומשתפים בעמדות — כמה כרטיסים שמספיקים.
          time: 4 דקות
          group: קבוצות של 4–5 לפי השולחנות; כל הכרטיסים לכל קבוצה
          rules: מדברים על הסוגיה, לא על אנשים בכיתה; מספרים רק על עצמנו, ומותר לעבור כרטיס
          plenary: איך מזהים מצב סיכון ברשת, ומה עושים כשהוא קורה
          help: בכל כרטיס שאלו — מה יכול להשתבש כאן?
          challenge: איזה כרטיס הכי קשה לזהות בזמן אמת — ולמה?
      - handout:
          title: כרטיסיות שיח
          copies: עותק לכל קבוצה, גזור לתשעה כרטיסים
          verbatim: true
          lines: false
          items:
            - >-
              שמירת תמונות וסרטונים אינטימיים בטלפון הנייד, שליחתם (לחברים טובים, לאנשים שמכירים ברשת,
              לזרים)
            - הפצת תיעוד פרטי ללא הסכמה.
            - >-
              הגדרות פרטיות ביישומים השונים. חוזק סיסמא, למי חשוף המידע? האם נחשוף מיקום? עד כמה חשופים הרגלי
              הבלוי שלנו?
            - התחזות ברשת.
            - שיח ברשת עם אנשים שאינם מוכרים לנו מהמרחב הפיזי (אנשים שעוד לא פגשנו)
            - איך נוצר אמון באדם אתו אני משוחח ברשת.
            - הצעות עבודה ברשת.
            - מסירת פרטים אישיים ברשת.
            - כשמשהו מרגיש לנו לא טוב/לא בטוח את מי נשתף?
      - slide:
          kicker: שיתוף במליאה
          title: איך נזהה מצבי סיכון ברשת?
          verbatim: [title]
          points:
            - אמון שנבנה ברשת — לא תמיד אמיתי
            - הרבה עוקבים — לא בהכרח פרופיל אמיתי
            - הצעת עבודה בלי אישור הורים — נורה אדומה
            - נפגעתם? מתעדים — צילום מסך
          echo: true
          cue: אחרי ארבע דקות —
          alt: רמזור, וטלפון לידו
          art:
            - {use: traffic-light, x: 350, y: 110, w: 150}
            - {use: phone, x: 120, y: 200, w: 150}
      - ask: איך נזהה מצבי סיכון ברשת — ומה עובד כשזה קורה?
      - quote:
          title: נורות אדומות — המידע מהמקור, להשלמה במליאה
          text: |-
            אנשים שהכרנו ברשת עשויים לפגוע בנו לאחר שרכשו את האמון שלנו
            אנשים שאינם מוכרים לנו עלולים להיות מתחזים (גם מבוגרים עלולים ליפול בפח)
            כשפרופיל מעלה הרבה ״סטוריז״ ונראה פעיל או כשלפרופיל יש הרבה עוקבים, זה לא בהכרח מעיד עליו שהוא פרופיל אמיתי ואמין (לעיתים אנשים מתחזים מייצרים עוקבים רבים בצורה מתוחכמת)
            בקבוצות ואטסאפ פתוחות יתכן ונמצאים אנשים שאנחנו לא מכירים שעלולים לקיים תקשורת פוגענית עמנו, כגון: שליחת תמונות פורנוגרפיות. אנשים אלה אוספים מידע אישי של פרטי ההתקשרות שלנו ועלולים ליצור עמנו קשר אישי ולהמשיך בתקשורת הפוגענית.
      - quote:
          text: |-
            כשמגיעה הצעת עבודה לילדים ובני נוער ברשת לצורך הופעה או פרסום כגון דוגמנות- זה מצריך אישור הורים על פי חוק. אם אין בקשה לאישור הורים מצד המציע או אם יש מצדו הפצרה להתחיל לעבוד ללא ידיעת הורים- זה צריך להדליק נורה אדומה שמדובר אולי בניסיון פגיעה.
            חשוב לא לשמור בנייד תמונות וסרטונים אינטימיים, ולא לשלוח אותם לאף אחד, גם לא לחברים טובים. כך נמנע אפשרות להפצת תיעוד פרטי ללא הסכמתנו.
            חשוב לשים לב להגדרות פרטיות ביישומים השונים. סיסמא בטוחה, למי חשוף המידע האישי, כדי למנוע אפשרות של חשיפת הרגלי הבלוי שלנו למי שאנו לא מעוניינים בכך.
            במקרה של פגיעה חשוב לתעד את המידע הפוגעני (צילום מסך).
      - say: ואם תמונה אישית כבר נשלחה — מה עושים כשהיא מגיעה אלינו? בואו נראה סרטון קצר.

