          time: 4 דקות
          group: ארבע או שמונה קבוצות; כרטיס דמות לכל קבוצה
          rules: עונים בשם הדמות, לא בשם עצמנו; מדברים על הדמויות, לא על אנשים שאנחנו מכירים
          plenary: נציג מכל קבוצה — משפט אחד שהדמות הייתה רוצה לומר
          help: התחילו מהשאלה הראשונה בכרטיס, ותנו לדמות לענות במשפט אחד.
          challenge: מה הדמות שלכם הייתה רוצה לומר לדמות אחרת בסרטון — ולמה?
      - handout:
          title: כרטיסי דמות
          copies: עותק לכל קבוצה, גזור לארבעה כרטיסים — כרטיס דמות אחד לכל קבוצה
          verbatim: true
          lines: false
          items:
            - |-
              נועה- הנערה ששלחה את התמונה לחברה שלה
              1. מדוע בחרת לצלם את התמונה ולשלוח אותה לשיר?
              2. האם חשבת על ההשלכות שיכולות להיות לשליחת התמונה?
              3. כיצד היית מרגישה אם שאול היה מחליט לשלוח את התמונה שלך לקבוצה בוואטסאפ?
              4. מה היית רוצה לומר לשיר על תגובתה לשאול?
            - |-
              שאול- הנער שרצה להפיץ את התמונה
              1. מה גרם לך לשלוח את התמונה של נועה אליך לנייד?
              2. על מה חשבת רגע לפני שתכננת להעביר את התמונה לקבוצת החברים בוואטסאפ?
              3. כיצד לדעתך נועה הייתה מרגישה במידה ותמונתה הייתה מופצת ברבים?
              4. מה עלולות להיות ההשפעות של שליחת התמונה על נועה? עליך?
              5. מה היית רוצה לומר לשיר בהמשך לשיחה שלכם?
            - |-
              שיר- החברה שקיבלה את התמונה
              1. איך הרגשת כשקבלת אלייך לנייד את התמונה של נועה?
              2. כששאול הסתקרן לדעת מה קבלת בנייד, לא הראית לו את התמונה שקבלת מנועה. מדוע?
              3. איך את היית מרגישה אם שאול היה מפיץ את התמונה?
              4. מה לדעתך האחריות שלך לגבי קבלת תמונה מסוג זה?
              5. מה היית רוצה לומר לנועה בהמשך לכך ששלחה לך את התמונה?
            - |-
              תמר- אמא של שיר
              שיר הגיעה הביתה וסיפרה לך על האירוע.
              1. מה היא תגובתך הראשונה לאירוע שחוותה בתך?
              2. אם התמונה הייתה מופצת ע״י שאול, כיצד היית מגיבה לבתך שיר?
              3. אילו מסרים חשוב לך להעביר לבתך בעקבות האירוע שחוותה?
              4. מהו לדעתך תפקידם של ההורים לגבי התנהלות ילדיהם ברשת, והפצת תמונות וסרטונים בפרט
      - ask: האם שליחת תמונה לחבר, או לקבוצת חברים, היא הסכמה להפיץ אותה ברבים?
      - say: >-
          שיר בחרה לא להראות. ורגע לפני שמישהו לוחץ ״העבר״, יש עוד מישהו שיכול לעצור אותו — אנחנו.

