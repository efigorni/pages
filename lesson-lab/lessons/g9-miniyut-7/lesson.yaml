sub: >-
  הרשת היא חלק מהחיים שלנו — עם הרבה הזדמנויות, וגם סכנות. בשיעור הזה מזהים נורות אדומות, מסתכלים על
  הפצה של תמונה מארבע נקודות מבט, ומתרגלים מה אומרים לחבר רגע לפני שהוא פוגע.
format: זוגות מתחלפים, קבוצות ומליאה
question: איך מזהים סכנה ברשת — ומה עושים כשתמונה של מישהו אחר מגיעה אלינו?
takeaways:
  - ברשת יש הזדמנויות וגם סכנות — ואפשר ללמוד לזהות נורות אדומות.
  - תמונה שנשלחה לאדם אחד אינה הסכמה להפיץ אותה, ומי שקיבל אותה אחראי למה שהוא עושה בה.
  - מי שנפגע לא נשאר לבד — פונים למבוגר, או למוקד 105.
prep:
  - חלוקה מראש לקבוצות של 4–5 לפי השולחנות, ואיזו דמות מקבלת כל קבוצה בסרטון
  - לספיד דייט — שני מעגלים, פנימי וחיצוני, פנים מול פנים; או זוגות לפי השולחנות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פגיעה ברשת, הפצת תמונות אינטימיות והחוק. שאלי אם יש בכיתה מי שהנושא קרוב
      אליו מדי: מי שתמונה שלו הופצה, מי שהוטרד או נסחט ברשת, או מי שמתכתב עכשיו עם זר. בקשי שתהיה זמינה אחרי
      השיעור, וסכמי איתה מראש מה עושים אם מישהו מספר על פגיעה.
  - head: מי עלול להיפגע
    text: >-
      מי שתמונה שלו הופצה עלול לשמוע בשיעור האשמה — ״למה היא שלחה?״. האחריות על הפצה היא של מי שמפיץ, לא של
      מי שצולם — זה גם המסר השני של השיעור. בסרטון ובכרטיסים מדברים על הדמויות, לא על מקרים מהשכבה, ובלי
      שמות.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בספיד דייט מותר לענות קצר או לעבור,
      והתשובה לשאלה ״למי תפנה לעזרה?״ נשארת בזוג. בכרטיסיות השיח משתפים בעמדות, לא בסיפורים אישיים; מותר
      לעבור כרטיס, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל תמונה שהופצה, סחיטה או הטרדה שקורות עכשיו — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. מוקד 105 של המטה הלאומי להגנה על ילדים
      ברשת פתוח 24/7, גם לתלמידים עצמם. לצידו: ער״ן, 1201 — תמיכה נפשית 24/7; ובפגיעה מינית — מרכזי הסיוע,
      1202 (עונות נשים) או 1203 (עונים גברים), 24/7.

