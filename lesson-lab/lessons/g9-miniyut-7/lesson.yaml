          watch: שימו לב לארבע הדמויות — נועה, שאול, שיר ותמר. מה כל אחד עושה, ומה הוא מרגיש?
          pauses:
            - at: "?"
              moment: >-
                הרגע שלפני ששאול מחליט אם להעביר את התמונה לקבוצת החברים בוואטסאפ. צפי בסרטון לפני השיעור, ורשמי
