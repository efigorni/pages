# שומרים על קשר בטוח ברשת — כיתה ט׳, נקודת מבט, שיעור 3 (מקור: sources/text/9/Miniyut_7.md)
# המצגת היא שיעור 7 של כיתה י׳ (יחידת "מיניות במרחב בטוח"), ומותאמת לט׳ (D37). מתוכננת לשיעור כפול: ליבה של 35′ ושתי
# הרחבות. סיכום היחידה של י׳ (שקפים 36–38) לא נכנס — הוא נשען על מפגשים של יחידה אחרת (D49).
