      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
    - name: ספירה עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים, ובכל פעם מישהו אחר אומר מספר אחד. אם שניים אומרים יחד — מתחילים מאחת.
  from: numbers

