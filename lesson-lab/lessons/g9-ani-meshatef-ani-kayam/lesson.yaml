sub: >-
  מצלמים, מתעדים ומשתפים — אבל מה זה עושה לחוויה עצמה? בשיעור הזה צופים בקטע קצר, דנים בקבוצות בשלושה
  מקרים מהחיים, ומכירים את ה״זהות המלוטשת״ שמאחורי השיתופים.
format: מליאה, זוגות וקבוצות
question: מה התיעוד והשיתוף ברשת עושים לחוויות שלנו — ואיך מסתכלים על מה שאחרים משתפים?
takeaways:
  - תיעוד ושיתוף ברשת יכולים להיות כיף — וכדאי לבדוק שהם לא באים על חשבון החוויה עצמה.
  - ברשת רואים לרוב ״זהות מלוטשת״ — רק מה שאנשים בחרו להראות, ולא את החיים כולם.
  - אפשר ליהנות מחוויה גם בלי לשתף אותה, ולהחליט בעצמנו מה לשתף, מתי ולמה.
prep:
  - חלוקה מראש לקבוצות של 5–6 לפי השולחנות, ואיזה מקרה מקבלת כל קבוצה — כל מקרה לשתי קבוצות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — תיעוד ושיתוף ברשת, שיתוף שמצטערים עליו, והשוואה ל״חיים המושלמים״ של
      אחרים. שאלי אם יש בכיתה מי שתמונה או סרטון שלו הופצו לאחרונה, מי שזוגיות או חרם ברשת מעסיקים אותו
      עכשיו, או מי שההשוואה ברשתות קשה לו במיוחד. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי ששיתוף פגע בו, או שתמונה שלו הופצה בלי רשות, עלול לזהות את עצמו בשאלה על שיתוף שמצטערים עליו —
      לכן היא נשארת במחברת. במקרה של דנה מדברים על השיתופים ועל התחושה, לא על מי בכיתה עובד בחופש ומי
      נוסע לים; במקרה של עמית ורועי — על השיתוף, לא על זוגות בכיתה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום, מהמקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״.
      הכתיבה האישית לא נאספת, ובקבוצות מותר לוותר על השאלה האישית שבכרטיס. במליאה מספרים בלי שמות ובלי
      צילומי מסך, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל תמונה או סרטון שלו שמסתובבים עכשיו, לחץ לשלוח תמונות, או מצוקה מול מה שהוא רואה ברשתות — עוצרים
      בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור
      בסוד — אומרים שזה כדי שאפשר יהיה לעזור.

