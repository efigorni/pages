sensitivity: med

sub: >-
  יש חפצים שמספרים את הסיפור של המשפחה. בשיעור הזה נזכרים בחפץ אהוב מהילדות, מספרים בקבוצות על חפץ
  משפחתי, ומגלים למה חפץ פשוט יכול להיות יקר כל כך.
format: כתיבה אישית, קבוצות ומליאה
question: למה חפצים מסוימים יקרים לנו כל כך — גם כשהם לא שווים הרבה כסף?
takeaways:
  - לחפצים יכול להיות ערך רגשי — ערך סנטימנטלי — שלא תלוי בכמה הם שווים בכסף.
  - חפץ יכול להיות גשר לאדם אחר, לתקופה או לרגש.
  - לכל משפחה יש זיכרונות, חפצים וחוויות שכל אחד מבני המשפחה נושא בלב.
prep:
  - >-
    כמה ימים לפני השיעור — בקשי מהתלמידים להביא חפץ משפחתי שיש לו משמעות ומספר סיפור על המשפחה, או תמונה
    שלו. חפץ יקר או שביר — עדיף תמונה. מי שלא יביא, יספר על חפץ מהזיכרון.
  - חלוקה מראש לקבוצות של ארבעה לפי השולחנות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — חפצים משפחתיים וזיכרונות מהבית. שאלי אם יש בכיתה מי שאיבד לא מזמן מישהו
      קרוב, מי שעלה לארץ והשאיר בית מאחור, מי שהמשפחה שלו נפרדה, או מי שגדל מחוץ לבית. בקשי שתהיה זמינה
      אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      חפץ משפחתי יכול להיות של מי שכבר לא בחיים, לבוא ממדינה שעזבו, או להזכיר בית שהתפרק. חפצים מעוררים
      בבת אחת רגשות שונים — התרגשות, געגוע, עצב, גאווה ושמחה — וכולם מותרים. מי שלא הביא חפץ, או שאין לו
      חפץ כזה, מספר על חפץ מהזיכרון, בלי הסבר ובלי הערה. מדברים על הערך הרגשי ולא על המחיר: חפץ פשוט שווה
      כאן כמו חפץ יקר.
  - head: לא לוחצים לשתף
    text: >-
      הכלל של היום, מהמקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. כל אחד
      בוחר מה לספר על החפץ שלו ומה לא; מותר לוותר על שאלה, וגם על התור כולו. במליאה משתפים רק מתנדבים, ולא
      קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל אבל שמתעורר, או סיפור קשה מהבית שעולה דרך החפץ — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית
      אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״מה נוסיף בבית?״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - stories
      - discuss
    text: >-
      בקבוצות כל אחד עונה רק על שתי שאלות — מה החפץ, ומה סיפרו לו עליו — ובמליאה שואלים רק על הרגשות שעלו

brain_break:
  signs: עיניים כבדות, תשובות של מילה אחת, שקט שלא נשבר גם אחרי שאלה.
  ideas:
    - name: זרת ואגודל
      text: יד אחת מראה אגודל והשנייה זרת; במחיאת כף מחליפים. כל סבב מהר יותר.
    - name: תיפוף קצב
      text: תופפי על השולחן קצב קצר, והכיתה חוזרת אחרייך. כל פעם קצב קצת יותר מסובך.
    - name: הקשבה לצלילים
      text: >-
        עוצמים עיניים לדקה ומקשיבים לכל הצלילים שמחוץ לכיתה. אחר כך כל אחד סופר לעצמו כמה צלילים שמע.
  from: unit

