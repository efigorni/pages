  # ------------------------------------------------------------------ 24′–27′
  - id: locket
    title: תמונה בתליון
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      גם לפעילויות משפחתיות יש ערך סנטימנטלי — כל אחד מדמיין תליון ובו תמונה משמחת מפעילות כזאת, ושניים־שלושה
