    body:
      - slide:
          kicker: חפץ, לב
          title: איזו תמונה הייתם שמים בתליון?
          sub: תמונה משמחת של פעילות משפחתית שיש לה ערך סנטימנטלי בשבילכם.
          echo: true
          alt: שרשרת ועליה תליון בצורת לב, ובו תמונה של שלוש דמויות
