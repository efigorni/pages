steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: child
    title: כשהייתם קטנים
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית קצרה על חפץ אהוב מהילדות — מה היה, ממי קיבלו, ואיפה הוא היום; שומעים שלושה
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: חפץ שאהבתם במיוחד כשהייתם קטנים
          sub: כתבו עליו — מה היה, ממי קיבלתם אותו, ואיפה הוא היום.
          timer: 180
          echo: true
          alt: דמות יושבת, ומעליה ענן מחשבה ובו דובי
          art: {file: art/teddy.svg}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלושה חפצים שונים זה מזה.
          - הזמיני את שלושת הכותבים לספר, וסיימי במשפט הגשר.
      - ladder:
          help: חשבו על שעת השינה, על טיול או על משחק — מה היה תמיד איתכם?
          challenge: למה, לדעתכם, קשה לפעמים להיפרד מחפץ — גם כשכבר אין בו שימוש?
      - ask: נשמע שלושה — איזה חפץ, ולמה אהבתם אותו כל כך?
      - say: >-
          לפעמים גם לחפצים יש ערך רגשי בשבילנו. יש חפצים שנותנים לנו ביטחון ונחמה, חפצים שמחברים אותנו לסיפור
          שלנו, וחפצים שקשה להיפרד מהם גם כשכבר אין בהם שימוש. ויש חפצים שמספרים את הסיפור של המשפחה כולה.

  # ------------------------------------------------------------------ 6′–16′
  - id: stories
    title: חפצים מספרים סיפור
    minutes: 10
    practices:
      - זמן חשיבה
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      ״החפץ הוא גשר״ — דקה של שקט עם החפץ המשפחתי, ואז בקבוצות כל אחד מספר עליו: מה, מאיפה, ומה סיפרו לו
    body:
      - slide:
          kicker: החפץ כגשר
          title: החפץ הוא פשוט גשר לאדם אחר או לרגש אחר
          verbatim:
            - title
          sub: אילו רגשות החפץ שלכם מעורר? למי, או לאיזו תקופה, הוא מחבר אתכם?
          echo: true
          alt: גשר, ועל שני קצותיו מבוגר וילד, ולב ביניהם
          art:
            - {use: bridge, x: 128, y: 278, w: 364}
            - {use: teacher, x: 150, y: 150, w: 95, color: moss}
            - {use: kid-stand, x: 375, y: 150, w: 95, color: teal}
            - {use: heart, x: 250, y: 60, w: 120}
      - moves:
          - הקריאי את המשפט שעל המסך. כל אחד מוציא את החפץ שהביא, או חושב על חפץ משפחתי שנמצא בבית.
          - דקה של שקט — מסתכלים על החפץ, וכותבים שתי מילים — איזה רגש הוא מעורר, ולמי הוא מחבר.
          - הסבירי את המשימה לפני שעוברים לקבוצות; השאלות נשארות על המסך כל הזמן.
          - הסתובבי בין הקבוצות. בדקי שכל אחד מקבל תור; דקה לפני הסוף — הודיעי.
      - say: >-
          רגע לפני שמספרים — דקה של שקט עם החפץ. מי שלא הביא, חושב על חפץ שנמצא בבית ומדמיין אותו כאן, על
          השולחן.
      - slide:
          kicker: בקבוצות · 7 דקות
          title: חפצים מספרים סיפור
          points:
            - מהו החפץ, ולמה בחרתם בו?
            - מאיפה הוא הגיע אליכם, ובאילו נסיבות?
            - כמה שנים הוא במשפחה?
            - מה סיפרו לכם עליו?
          timer: 420
          echo: true
          cue: אחרי דקת השקט —
          alt: ארבעה סביב שולחן, ובועת דיבור ובה מפתח
          art:
            - {use: circle4, x: 40, y: 220, w: 290}
            - {use: speech-l, x: 360, y: 40, w: 220}
            - {use: key, x: 418, y: 80, w: 100}
      - say: >-
          בקבוצות, כל אחד בתורו: מציגים את החפץ ומספרים עליו לפי השאלות. השאר מקשיבים, ושואלים שאלה אחת.
      - task:
          what: >-
            כל אחד מציג לקבוצה את החפץ שהביא, או מתאר חפץ משפחתי מהזיכרון, ומספר עליו לפי השאלות שעל המסך.
            השאר מקשיבים, ושואלים שאלה אחת.
          time: 7 דקות — קצת פחות משתי דקות לכל אחד
          group: ארבעה לפי השולחנות
          rules: >-
            מקשיבים בלי לשפוט; כל אחד בוחר מה לספר ומה לא; מותר לוותר על שאלה; נוגעים בחפץ של מישהו אחר רק
            ברשות
          plenary: נשארים בקבוצות לשאלה הבאה
          help: התחילו במשפט ״החפץ שלי הוא… והוא הגיע אלינו מ…״
          challenge: מה החפצים בקבוצה מספרים על המשפחות — מה דומה, ומה שונה?

  # ------------------------------------------------------------------ 16′–20′
  - id: discuss
    title: מה עלה בקבוצות?
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      דיון במליאה — אילו רגשות עלו כשסיפרו וכשהקשיבו, ומה משותף; החפצים המשפחתיים שלנו מסוגים שונים
    body:
      - slide:
          kicker: במליאה
          title: אילו רגשות עלו בכם — כשסיפרתם, וכשהקשבתם?
          echo: true
          alt: לב, ולידו פנים שמחות ופנים עצובות
          art:
            - {use: heart, x: 180, y: 40, w: 260}
            - {use: face-happy, x: 420, y: 330, w: 140}
            - {use: face-sad, x: 60, y: 330, w: 140}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הדהדי, והזמיני את הכיתה להגיב — ״למי עוד זה היה ככה? למי אחרת?״
          - שאלי מה מצאו משותף בין הסיפורים, וסכמי את סוגי החפצים שעלו בכיתה.
      - ask: אילו רגשות עלו בכם כשסיפרתם על החפץ — ואילו כשהקשבתם לסיפורים של אחרים?
      - say: אז מה שהרגשת זה ___ — הבנתי נכון? מי עוד הרגיש ככה?
      - say: >-
          החפצים המשפחתיים שלנו מסוגים שונים — חלקם עוברים במשפחה מדור לדור, חלקם קשורים לחוויה משפחתית, ויש
          כאלה שהגיעו ממדינה אחרת.

  # ------------------------------------------------------------------ 20′–24′
  - id: sentimental
    title: ערך סנטימנטלי
    minutes: 4
