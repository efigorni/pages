          - הציגי את ההגדרה והקריאי אותה. הדגישי שבדרך כלל נקשרים לחפץ בלי קשר למחיר שלו.
          - תני את שתי הדוגמאות מהמקור, ושאלי מי מכיר דוגמה משלו.
      - ask: מה גורם לאנשים להיקשר לחפץ מסוים — גם כשהוא לא שווה הרבה כסף?
      - slide:
          kicker: ההגדרה
          title: ערך סנטימנטלי
          sub: שילוב של מחשבה, דעה או רעיון המתבססים על רגש כלפי סיטואציה מסוימת
          verbatim: true
          echo: true
          cue: אחרי כמה תשובות —
          alt: לב גדול, ושעון קיר לידו
          art:
            - {use: heart, x: 220, y: 150, w: 320}
            - {use: clock, x: 40, y: 40, w: 150}
      - say: >-
          סנטימנטים, להבדיל מרגשות, נשארים בנו לאורך זמן — כמו ספר שהיה של סבא בצעירותו, או שרשרת שעוברת מאם
