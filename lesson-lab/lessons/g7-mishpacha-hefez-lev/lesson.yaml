          - הזמיני שניים־שלושה מתנדבים לתאר מה רואים בתמונה.
      - ask: לאילו פעילויות משפחתיות יש ערך סנטימנטלי בשבילכם?
      - say: >-
          דמיינו שאתם משבצים בתליון של שרשרת את התמונה המשמחת של הפעילות הזאת. מה רואים בתמונה?

  # ------------------------------------------------------------------ +5′
  - id: add
    title: מה נוסיף בבית?
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      שאלת ההרחבה של המקור — איזו פעילות בעלת ערך סנטימנטלי הייתם רוצים להוסיף בבית; לבד, בזוגות ובמליאה
    body:
      - slide:
          kicker: אם נשאר זמן · חושבים · בזוגות · משתפים
          title: איזו פעילות משפחתית הייתם רוצים להוסיף?
          sub: פעילות שיום אחד יהיה לה ערך סנטימנטלי.
          points:
            - לבד — 30 שניות
