      text: כל אחד מצייר באוויר את השם שלו — פעם ביד ימין, פעם ביד שמאל, ופעם במרפק.
    - name: סיבובי כתפיים
      text: קמים, שלושה סיבובי כתפיים לאחור ושלושה קדימה, מתיחה של הידיים למעלה — ומתיישבים בשקט.
    - name: מקשיבים לשקט
      text: דקה של שקט מוחלט. כל אחד סופר בלב כמה קולות שונים הוא שומע — ובסוף, כמה ספרתם?
  from: talk

