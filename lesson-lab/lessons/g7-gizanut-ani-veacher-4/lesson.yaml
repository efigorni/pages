  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ארבעת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              כל אדם שייך לקבוצות רבות. לעיתים אותו אדם שייך לקבוצת הרוב במקום אחד, ובמקום אחר לקבוצת המיעוט.
              כך ניתן להכיר במידת מה הן את התחושות של להיות בשוליים והן התחושות של להיות במרכז.
            - >-
              לעיתים אנחנו יכולים להעריך את השונות שלנו בקבוצת מיעוט ולהיות גאים במאפיינים שלנו. אך לעיתים,
              נהיה במצבים בהם לא נרגיש בנוח להיות מיעוט ונרצה שקבוצת הרוב תכיר בשונות שלנו ותקבל אותה כמו
              שהיא.
            - >-
              דווקא כשאנחנו נמצאים בקבוצת הרוב, חשוב לחזור לתחושות ולרגשות שלנו כשאנו במיעוט — ברגע שנתחבר
              לתחושות הללו, נוכל להביע יותר אמפתיה והבנה למי שנמצא לידינו במיעוט, למי ששונה ולא מרגיש שייך
              לקבוצה כמו שאנחנו מרגישים.
            - >-
              בכיתה שלנו ובשכבה שלנו יש קבוצות ולכל אחד/ת ישנה השתייכות אחרת. חשוב לנסות ולחצות לפעמים את
              הקבוצות הללו ולהיות במקומות בהם אנחנו מעט אחרים, כדי להכיר יותר ולא לפספס הזדמנויות לחברויות
              חדשות.
          ask: איזה משפט הכי חשוב לזכור, לדעתכם? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            שני הראשונים מתארים את מה שהרגשנו היום — לפעמים ברוב ולפעמים במיעוט; השניים האחרונים אומרים מה
            עושים עם זה: אמפתיה, ולחצות קבוצות.
          alt: גשר, ודמות בכל צד שלו
          art:
            - {use: bridge, x: 140, y: 230, w: 340}
            - {use: kid-stand, x: 40, y: 252, w: 100, color: teal}
            - {use: kid-stand, x: 480, y: 252, w: 100, color: purple}

