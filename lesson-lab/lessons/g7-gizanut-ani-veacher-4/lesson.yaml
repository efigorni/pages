steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: video
    title: האחר הוא אני — טיטי איינאו
    minutes: 7
    practices:
      - מה הקשר?
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      סרטון של דקה — טיטי איינאו על ההשתלבות שלה בכיתה ז׳; כל אחד כותב לעצמו מה הרגיש ומה היה אומר לה,
      ושומעים מתנדבים
    body:
      - moves:
          - הקריני את השאלה שלפני הצפייה, ושמעי שתיים־שלוש השערות.
          - הפעילי את הסרטון — הוא באורך דקה. בעצירה שאלה אחת, וממשיכים עד הסוף.
          - אחרי הצפייה — שתי דקות של כתיבה אישית בשקט, ואז שמעי שלושה–ארבעה מתנדבים.
          - שאלי אם מישהו חש פעם תחושות דומות — מתנדבים בלבד, ורק על עצמם.
      - video:
          title: טיטי איינאו — האחר הוא אני
          url: https://youtu.be/XU4EM15Q2uo
          length: "1:00"
          before: איך מרגישה ילדה שמגיעה לכיתה ז׳ — בארץ חדשה?
          watch: שימו לב מה טיטי מספרת על כיתה ז׳ — ומה השתנה אצלה עם השנים.
          pauses:
            - at: "?"
              moment: >-
                באמצע הסרטון, כשטיטי מספרת איך הרגישה כשהגיעה לכיתה — לפני שהיא מספרת מה השתנה. הסרטון באורך
                דקה: צפי בו לפני השיעור, ורשמי כאן את הזמן.
              ask: איך היא מרגישה עכשיו, לדעתכם? ומה יכול לשנות את ההרגשה הזאת?
          alt: דלת פתוחה, ודמות עומדת מולה
          art:
            - {use: door, x: 330, y: 167, w: 220}
            - {use: kid-stand, x: 140, y: 230, w: 130, color: purple}
      - slide:
          kicker: כולם כותבים · לעצמכם
          title: מה הייתם רוצים לומר לטיטי?
          sub: ומה הרגשתם כשצפיתם?
          timer: 120
          echo: true
          cue: אחרי הצפייה —
          alt: דמות כותבת ליד שולחן, ומעטפה לידה
          art:
            - {use: kid-desk, x: 300, y: 170, w: 260, color: teal}
            - {use: envelope, x: 70, y: 100, w: 170}
      - ladder:
          help: התחילו ב״טיטי, רציתי לומר לך ש…״.
          challenge: מה הייתם שואלים את טיטי — ולמה דווקא את זה?
      - say: >-
          כולנו היינו פעם החדשים, או השונים — ופעם חלק מהרוב. בואו נדבר על זה בזוגות.

  # ------------------------------------------------------------------ 7′–16′
  - id: interview
    title: שיח בזוגות — ברוב ובמיעוט
    minutes: 9
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      ראיון הדדי על קבוצה שבה אני ברוב ועל קבוצה שבה אני במיעוט — איך מרגישים, מה מצפים ומה עושים;
      המראיין רושם ומהדהד
    body:
      - say: >-
          כל אחד מאיתנו שייך להרבה קבוצות. בחלק מהן אנחנו ״הרוב״ — דומים לרוב האנשים שם; ובחלק אנחנו
          ״המיעוט״ — מעטים, קצת שונים. למשל, מי שמגיע לחוג שבו כולם מבית ספר אחר.
      - slide:
          kicker: לפני שמתחילים
          title: כללי הקשבה פעילה
          points:
            - מקשיבים באמת — בלי להיות מוסחים או שקועים בדברים אחרים
            - לא מפריעים ולא קוטעים, ומסתכלים לדובר בעיניים
            - בלי שיפוטיות — גם כשמה שמסופר שונה מעולמנו
            - כותבים את הדברים העיקריים שנאמרים
          echo: true
          alt: דמות יושבת ומקשיבה, וסימן וי לידה
          art:
            - {use: kid-sit, x: 210, y: 180, w: 220, color: purple}
            - {use: check, x: 420, y: 50, w: 150}
      - moves:
          - הסבירי בשני משפטים מה זה ״רוב״ ו״מיעוט״, ותני דוגמה אחת.
          - >-
            הזכירי את כלל השיח — ״מה שנאמר כאן נשאר כאן, ומספרים רק על עצמנו״ — ואת כללי ההקשבה, ועברי לשקף
            השאלות.
          - >-
            זוגות לפי השולחנות. המראיין שואל לפי השאלות שעל המסך, רושם מילים בולטות, ובסוף מהדהד: ״שמעתי
            שסיפרת ש…״. אחרי שלוש דקות — מתחלפים.
          - הסתובבי בין הזוגות בלי להתערב.
      - slide:
          kicker: שיח בזוגות · שלוש דקות לכל אחד
          title: ברוב ובמיעוט
          points:
            - באיזו קבוצה אני ברוב — ובאיזו במיעוט?
            - איך זה מרגיש בתוכה? יש לי תחושת שייכות?
            - מה אני מצפה מהצד השני?
            - מה עשיתי כדי להשתלב — או כדי לשלב?
          timer: 180
          echo: true
          cue: אחרי הכללים —
          alt: שתי דמויות יושבות זו מול זו, ובבועה של אחת מהן חלק פאזל
          art:
            - {use: kid-sit, x: 40, y: 255, w: 170, color: purple}
            - {use: kid-sit, x: 410, y: 255, w: 170, color: teal, flip: true}
            - {use: speech, x: 330, y: 36, w: 240}
            - {use: puzzle, x: 403, y: 66, w: 95}
      - say: >-
          כל אחד חושב על שתי קבוצות — אחת שבה הוא ברוב, ואחת שבה הוא במיעוט. המראיין שואל, מקשיב ורושם,
          ובסוף אומר ״שמעתי שסיפרת ש…״.
      - task:
          what: >-
            ראיון בזוגות. כל אחד חושב על קבוצה אחת שבה הוא ברוב ועל קבוצה אחת שבה הוא במיעוט, ועונה על השאלות
            שעל המסך. המראיין שואל, מקשיב, רושם, ובסוף מהדהד ״שמעתי שסיפרת ש…״. ואז מתחלפים.
          time: 3 דקות לכל ראיון, וחצי דקה להדהוד
          group: זוגות לפי השולחנות
          rules: כל אחד בוחר בעצמו את שתי הקבוצות; מספרים רק מה שרוצים, ומי שמקשיב — לא שופט
          plenary: אין — הדברים נשארים בזוג, וממשיכים ברביעיות
          help: חשבו על חוג, תנועת נוער, המשפחה המורחבת או השכונה — איפה אתם כמו כולם, ואיפה קצת אחרים?
          challenge: מה הייתם רוצים שהצד השני ידע עליכם — ומה אתם עשיתם בשבילו?
      - say: ועכשיו נחבר את מה ששמעתם — ברביעיות.

  # ------------------------------------------------------------------ 16′–22′
  - id: table
    title: מה מרגישים ברוב — ומה במיעוט?
    minutes: 6
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: ברביעיות ממלאים טבלה משותפת — תחושות, מחשבות, ציפיות ופעולות, ברוב ובמיעוט; שאלה אחת במליאה
    body:
      - slide:
          kicker: ברביעיות · 4 דקות
          title: מה מרגישים ברוב — ומה במיעוט?
          points:
            - תחושות ורגשות
            - מחשבות
            - ציפיות שיש לי מהסביבה
            - פעולות שעשיתי כדי להשתלב
          timer: 240
          echo: true
          alt: ארבעה סביב שולחן, ודף לידם
          art:
            - {use: circle4, x: 270, y: 190, w: 300}
            - {use: note, x: 80, y: 100, w: 130}
      - board: >-
          קבוצת רוב · קבוצת מיעוט — תחושות ורגשות · מחשבות · ציפיות שיש לי מהסביבה · פעולות שעשיתי כדי
          להשתלב
      - moves:
          - כל זוג מצטרף לזוג שלידו. כל רביעייה מעתיקה את הטבלה שעל הלוח לדף אחד.
          - ממלאים יחד — בכל משבצת מילה או שתיים מתוך השיחות בזוגות, בלי שמות.
          - דקה לפני הסוף — הודיעי. במליאה שאלה אחת, ותני לתלמידים להגיב זה לזה.
      - task:
          what: >-
            כל רביעייה ממלאת יחד טבלה אחת: מה מרגישים, חושבים, מצפים ועושים — כשאנחנו ברוב, וכשאנחנו במיעוט.
          time: 4 דקות
          group: רביעיות — שני זוגות סמוכים
          rules: מילה או שתיים בכל משבצת, מתוך מה שעלה בזוגות; בלי שמות
          plenary: שאלה אחת לכולם — מה גיליתם?
          help: התחילו בשורה הראשונה — איך הרגשתם בכל אחת מהקבוצות?
          challenge: מה ההבדל הכי גדול בין שני הטורים — ולמה, לדעתכם?
      - ask: מה גיליתם על התחושות של מי שנמצא ברוב — ושל מי שנמצא במיעוט?
      - say: אז מה שגיליתם זה ___ — הבנתי נכון? מי רואה את זה אחרת?
      - say: ועכשיו — מה כל אחד מאיתנו חושב? נבדוק בעמידה, כל אחד לפי הדעה שלו.

  # ------------------------------------------------------------------ 22′–27′
  - id: stance
    title: מסכימים או לא מסכימים?
    minutes: 5
    stance: true
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: שלושה משפטים מהמקור; כל אחד עומד ליד השלט שמתאים לו, ומתנדב מכל צד מסביר
    body:
      - slide:
          kicker: שני שלטים · עמדה בחלל
          title: מסכימים או לא מסכימים?
          sub: עומדים ליד השלט שמתאים לכם — או באמצע.
          echo: true
          alt: אגודל למעלה בצד אחד, אגודל למטה בצד השני, ודמות עומדת באמצע
          art:
            - {use: thumb-up, x: 420, y: 200, w: 160}
            - {use: thumb-down, x: 40, y: 200, w: 160}
            - {use: kid-stand, x: 245, y: 240, w: 130, color: teal}
      - moves:
          - השלטים על הקירות. הסבירי — עומדים ליד השלט שמתאים, ומותר לעמוד באמצע.
          - הקריאי משפט, וחכי חמש שניות של שקט לפני שזזים.
          - כשכולם במקום — מתנדב אחד מכל צד מסביר, רק על עצמו. תארי במילים את הפיזור.
          - אחרי המשפט השלישי — שאלת סיכום, וחוזרים למקומות.
      - say: >-
          לפני כל משפט חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז זזים. אין תשובה נכונה, מותר
          לעמוד באמצע, ומסבירים רק על עצמנו.
      - slide:
          kicker: משפט 1
