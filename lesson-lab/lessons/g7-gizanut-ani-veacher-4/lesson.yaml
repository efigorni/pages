sub: >-
  כל אחד מאיתנו היה פעם החדש, או השונה — ופעם חלק מהרוב. בשיעור הזה פוגשים את טיטי איינאו, מדברים
  בזוגות על קבוצה שבה אנחנו ברוב ועל קבוצה שבה אנחנו במיעוט, ובודקים איפה אנחנו עומדים.
format: סרטון, זוגות, רביעיות ועמידה ליד שלטים
question: איך מרגישים ברוב ואיך במיעוט — ומה אפשר לעשות כדי להכיר את מי ששונה מאיתנו?
takeaways:
  - כולנו שייכים גם לקבוצות רוב וגם לקבוצות מיעוט — ולכן כולנו מכירים גם את המרכז וגם את השוליים.
  - מי שזוכר איך הרגיש במיעוט — יכול להבין טוב יותר את מי שנמצא לידו במיעוט.
  - כדאי לחצות לפעמים את הקבוצות שלנו ולהכיר חברים השונים מאיתנו.
prep:
  - >-
    שני שלטים — ״מסכימים״ ו״לא מסכימים״ — תלויים על שני קירות מנוגדים לפני השיעור
  - >-
    הטבלה של ״רוב ומיעוט״ משורטטת על הלוח לפני השיעור — שני טורים (קבוצת רוב · קבוצת מיעוט) וארבע
    שורות (תחושות ורגשות · מחשבות · ציפיות שיש לי מהסביבה · פעולות שעשיתי כדי להשתלב); ודף ריק לכל רביעייה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — סרטון של טיטי איינאו על ההשתלבות שלה בכיתה ז׳ אחרי העלייה, שיחה בזוגות
      על קבוצה שבה אני במיעוט, ועמידה ליד שלטים. שאלי אם יש בכיתה מי שהנושא קרוב אליו מדי — מי שעלה לא
      מזמן, מי שחווה יחס מעליב בגלל המוצא או הצבע — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      עולים חדשים, יוצאי אתיופיה, וכל מי שהוא ״המיעוט״ בכיתה — הסרטון והשיחה עלולים לגעת בהם ישירות. לא
      מבקשים מהם לספר, ולא מסתכלים עליהם כשמדברים על מיעוט. כל אחד בוחר בעצמו על אילו קבוצות לדבר —
      אפשר גם על חוג, על תנועת נוער או על המשפחה המורחבת.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מה שנאמר כאן נשאר כאן, ומספרים רק על עצמנו״. מה שנאמר בזוג נשאר בזוג; בטבלה של
      הרביעייה כותבים בלי שמות; במליאה משתפים רק מתנדבים, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל יחס מעליב או הדרה בגלל המוצא, הצבע או השפה — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.
  - head: עמידה מול הכיתה
    text: >-
      ליד השלטים עומדים לפי דעה, לא לפי זהות, והמשפטים נבחרו כך. מותר לעמוד באמצע; מסבירים רק מתנדבים,
      ורק על עצמם. צחוק או הערה על המקום של מישהו — עוצרים מיד. מי שעומד ליד ״לא מסכימים״ לא ״טועה״ —
      שאלי אותו מה גורם לו לחשוב כך.

time:
