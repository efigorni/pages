sub: >-
  חבילה עטופה ופתק ״נא לא לגעת״ — מה עשיתם? בשיעור הזה מגלים מה זה פיתוי, מה עוזר לעמוד מולו, ואיפה כל
  אחד מציב את הגבול שלו — גם מול אלכוהול.
format: מליאה, זוגות וסרטון
question: מה עוזר לי לעמוד מול פיתוי — ואיפה אני מציב את הגבול שלי?
takeaways:
  - פיתוי יכול לעורר סקרנות והתרגשות, וגם חשש — והוא לא תמיד שלילי.
  - מול פיתוי עוזרים לנו כוחות פנימיים, כמו ערכים ושליטה, וכוחות חיצוניים, כמו חבר טוב וסביבה תומכת.
  - יש גבולות שאחרים מציבים לנו וגבולות שאנחנו מציבים לעצמנו — ואת הקו האדום כדאי להציב לפני שהפיתוי מגיע.
prep: []

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פיתויים, גבולות ואלכוהול. שאלי אם יש בכיתה מי שהנושא קרוב אליו מדי: מי ששותים
      אצלו בבית, מי שהגבולות בבית שלו נוקשים מאוד או חסרים לגמרי, או מי שנאבק עכשיו בהרגל שקשה לו לעצור. בקשי
      שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      חשיפת החבילה עלולה לבייש את מי שנגע בה — לא שואלים מי נגע, וכולם שומעים שזה היה ניסוי ושכולנו מתפתים
      לפעמים. בשאלה על גבולות שההורים מציבים — יש בתים נוקשים ויש בתים בלי גבולות; מדברים על סוגי גבולות, לא על
      בית מסוים.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בזוגות מספרים על פיתוי רק כמה שנוח — אפשר
      לבחור פיתוי קטן (מתוק, הטלפון), ומותר לענות רק על השאלות בלי לספר את הסיפור. מותר לוותר, ולא קוראים בשם
      למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל שתייה שיצאה משליטה, פיתוי שהוביל לפגיעה, או לחץ שקורה עכשיו — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת: ער״ן 1201 — עזרה
      ראשונה נפשית, 24/7; ובמצב חירום, כמו מישהו ששתה ולא מגיב — מד״א 101.

