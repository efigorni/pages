    body:
      - messages:
          items:
            - >-
              החיים מזמנים לנו הרבה פיתויים. לכל אחד מאיתנו יש אפשרות ויכולת להפעיל שיקול דעת ולהתמודד איתם.
            - >-
              התמודדות מול פיתוי מאתגרת אותנו. הפיתוי מציג לנו משהו שנתפס כרצוי, כמסייע וכפותר קושי. יחד עם זאת יכול
              להיות בו גם סיכון עבורנו. לדוגמה אלכוהול.
            - >-
              בהתמודדות עם פיתוי נפגשים עם מגוון ״קולות״ שבתוכנו — להיענות או לסרב ולסגת. לא פעם קשה להכריע בדילמה,
              מכיוון שבכל אחת מהאפשרויות יש יתרון וגם חיסרון.
            - לכולנו יש גבולות שנובעים מעולם הערכים, התפיסות והחינוך שלנו.
            - לפיתוי יש נטייה לנסות להזיז את הגבול.
          ask: >-
            איזה משפט מהחמישה הכי עוזר לכם מול פיתוי? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: המסרים הולכים מהפיתוי ומההתלבטות (1–3) אל הגבול שלנו — ולמה צריך לשמור עליו (4–5).
          alt: מגן, ומתחתיו קו אדום
          art:
            - {use: shield, x: 180, y: 30, w: 260}
            - {use: red-line, x: 130, y: 380, w: 360}

