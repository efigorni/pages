          - חלקי לקבוצות של ארבעה לפי השולחנות. שלוש דקות לשלוש השאלות.
          - הסתובבי, וכווני מגבול מדיני או גאוגרפי לגבול חיצוני ולגבול פנימי.
          - במליאה — קבוצה אחת לכל שאלה.
      - say: שלוש שאלות על גבולות, שלוש דקות. מדברים על סוגי גבולות — לא על בית מסוים.
      - task:
          what: משוחחים על שלוש השאלות שעל המסך, ורושמים תשובה קצרה לכל אחת.
          time: 3 דקות, ודקה למליאה
          group: קבוצות של ארבעה לפי השולחנות
          rules: כל אחד מביא דוגמה אחת לפחות; מדברים על סוגי גבולות, לא על בית מסוים
          plenary: קבוצה אחת לכל שאלה
          help: חשבו על תינוק, על ילד בכיתה ב׳ ועל בני גילכם — מי מציב להם גבולות?
          challenge: איך גבול שמישהו אחר הציב לכם הופך לגבול שלכם?
      - whisper: >-
          לפי המקור: בינקות ובילדות צריך יותר גבולות חיצוניים, ועם הגיל אפשר פחות; גבול פנימי נוצר מהפנמה, מלמידה
          מניסיון וממשברים.
      - ask: איך נוצר גבול פנימי — מה עלה אצלכם בקבוצה?

