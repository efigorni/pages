steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: package
    title: בחרי מסלול — החבילה
    minutes: 6
    summary: חבילה עטופה ופתק ״נא לא לגעת״ — מה הרגשנו, חשבנו ועשינו, ואיזו כותרת ניתן לזה
    body:
      - tracks:
          - title: החבילה על השולחן
            text: >-
              יום או יומיים לפני השיעור הנחת בכיתה חבילה עטופה ופתק ״נא לא לגעת״. עכשיו שומעים מה הרגישו, חשבו
              ועשו — ומגלים שזה היה ניסוי.
            when: הספקת להניח את החבילה מראש, והיא נשארה בכיתה עד השיעור.
            practices:
              - מה הקשר?
              - זמן חשיבה
            spotlights:
              - עניין ורלוונטיות
              - הערכה ורפלקטיביות
            prep:
              - >-
                חבילה עטופה יפה ובתוכה חפץ מפתה, ולידה פתק ״נא לא לגעת״ — על שולחן בכיתה, יום או יומיים לפני השיעור
            body:
              - slide:
                  kicker: החבילה ואני
                  title: מה הרגשתם? מה חשבתם? מה עשיתם?
                  sub: כשראיתם את החבילה בכיתה, ואת הפתק שלידה.
                  echo: true
                  alt: קופסת מתנה עטופה, ולידה כרטיס ״נא לא לגעת״
                  art: {file: art/package.svg}
              - moves:
                  - החבילה על השולחן שלך כשהכיתה נכנסת. הציגי את השאלות, וחכי חמש שניות לפני שאת מזמינה תשובות.
                  - שמעי ארבעה–חמישה מתנדבים. לא שואלים מי נגע — רק מה הרגשתם וחשבתם.
                  - שאלי איזו כותרת הייתם נותנים לאירוע, ורק אחרי כמה כותרות — גלי שזה היה ניסוי.
              - ask: איזו ״כותרת״ הייתם נותנים לאירוע הזה?
              - say: >-
                  זה היה ניסוי — ניסוי בפיתוי. מי שהיה סקרן, מי שחשב לגעת ומי שנגע — כולנו מתפתים לפעמים.
          - title: חבילה בדמיון
            text: >-
              לא הנחת חבילה מראש: הכיתה מדמיינת חבילה עטופה ופתק ״נא לא לגעת״, וכל אחד כותב מה היה מרגיש, חושב
              ועושה.
            when: לא הספקת להכין חבילה, או שאת מחליפה בכיתה.
            practices:
              - מה הקשר?
              - כולם כותבים
            spotlights:
              - עניין ורלוונטיות
            body:
              - slide:
                  kicker: דמיינו
                  title: חבילה עטופה, ולידה פתק ״נא לא לגעת״
                  sub: מה הייתם מרגישים? חושבים? עושים?
                  timer: 60
                  echo: true
                  alt: קופסת מתנה עטופה, ולידה כרטיס ״נא לא לגעת״
                  art: {file: art/package.svg}
              - moves:
                  - הציגי את השקף, ובקשי מכל אחד לכתוב במחברת שלוש מילים — רגש, מחשבה ומעשה.
                  - שמעי ארבעה–חמישה מתנדבים.
                  - שאלי איזו כותרת הייתם נותנים למצב כזה.
              - ladder:
                  help: מה הייתם עושים אם אף אחד לא היה רואה?
                  challenge: מה ההבדל בין מה שהייתם רוצים לעשות לבין מה שהייתם עושים?
              - ask: איזו ״כותרת״ הייתם נותנים למצב כזה?
      - say: לחבילה כזאת קוראים פיתוי. בואו נבדוק מה המילה הזאת מעוררת בנו.

  # ------------------------------------------------------------------ 6′–10′
  - id: what
    title: פיתוי — מה הוא מעורר בנו?
    minutes: 4
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - דיפרנציאליות וגיוון
    summary: כל אחד כותב רגש ומחשבה שהמילה ״פיתוי״ מעוררת; סבב של מילה אחת, מיון על הלוח, והגדרה מהמילון
    body:
      - slide:
          kicker: כולם כותבים · ואז סבב
          title: פיתוי
          sub: הרגשות שמתעוררים בי הם… המחשבות שלי הן…
          timer: 60
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו קופסת מתנה
          art: {file: art/tempt.svg}
      - moves:
          - כל אחד כותב במחברת מילה אחת לכל משפט — רגש אחד ומחשבה אחת.
          - סבב מהיר — כל אחד אומר מילה אחת, בלי הסבר. מותר לעבור.
          - >-
            רשמי על הלוח בשלושה טורים — מחשבות, רגשות, התנהגויות — ושימי לב שיש גם רגשות נעימים: סקרנות, שמחה,
            התרגשות.
          - הציגי את ההגדרה, וחברי אליה מילים מהלוח.
      - say: מילה אחת לכל משפט — רגש אחד ומחשבה אחת. בסבב כל אחד אומר אחת מהן, בלי הסבר.
      - ladder:
          help: חשבו על משהו שמאוד רציתם, ומישהו אמר לכם ״אסור״ — מה הרגשתם?
          challenge: מתי פיתוי יכול להיות דווקא חיובי?
      - slide:
          kicker: פיתוי מהו?
          title: השפעה על אדם לעשות דבר אסור או מוטעה
          sub: בהבטחה שיפיק ממנו תענוג או תועלת (האקדמיה ללשון העברית)
          verbatim: true
          echo: true
          cue: אחרי הסבב —
          alt: קופסת מתנה עטופה, ולידה כרטיס ״נא לא לגעת״
          art: {file: art/package.svg}
      - say: >-
          פיתוי לא תמיד שלילי — אבל יש פיתויים שיש להם מחיר. עכשיו כל אחד יחשוב על פיתוי משלו.

  # ------------------------------------------------------------------ 10′–17′
  - id: mine
    title: כשאני נפגש עם פיתוי
    minutes: 7
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      כל אחד נזכר בפיתוי שהוא מתמודד איתו; בזוגות אחד מספר והשני מקשיב, ומתחלפים; במליאה — מה עוזר מול פיתוי,
      בטבלת כוחות פנימיים וחיצוניים
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: היזכרו בפיתוי שאתם מתמודדים איתו
          sub: מה מאתגר מולו? ומה — או מי — יכול לעזור לכם?
          points:
            - לבד — דקה, בכתב
            - בזוגות — אחד מספר והשני מקשיב, ומתחלפים
            - במליאה — מה עוזר?
          echo: true
          alt: שני חברים יד ביד, ושתי בועות שיחה מעליהם
          art:
            - {use: pair, x: 50, y: 236, w: 250}
            - {use: chat, x: 300, y: 40, w: 280}
      - moves:
          - "דקה של כתיבה לבד: הפיתוי, ומה מאתגר מולו. אפשר לבחור פיתוי קטן."
          - "בזוגות, שתי דקות: אחד מספר והשני מקשיב, ואז מתחלפים. מספרים רק כמה שנוח."
          - במליאה — שאלי מה עזר או יכול לעזור. כל תשובה נרשמת בטבלה על הלוח, והכיתה מחליטה לאיזה טור היא שייכת.
      - say: מספרים רק כמה שנוח לכם. אפשר לספר את הסיפור, ואפשר רק לענות על השאלות.
      - ladder:
          help: חשבו על פיתוי מהיום־יום — מתוק, הטלפון לפני השינה, או להישאר עוד במסיבה כשאמרו לכם לחזור.
          challenge: מה יכול להוביל אותנו להיענות לפיתוי, גם כשאנחנו יודעים שיהיה לכך ״מחיר״?
      - board: כוחות פנימיים · כוחות חיצוניים
      - slide:
          kicker: כוחות מסייעים
          title: מה עוזר לנו לעמוד מול פיתוי?
          sub: כוחות פנימיים — וכוחות חיצוניים.
          echo: true
          cue: כשעוברים למליאה —
          alt: מגן, ולידו שתי ידיים מושטות
          art:
            - {use: shield, x: 50, y: 150, w: 210}
            - {use: hands-help, x: 300, y: 140, w: 270}
      - whisper: >-
          דוגמאות מהמקור — כוחות פנימיים: שליטה, אסרטיביות, ערכים, קביעת גבולות, מידע רלוונטי, מודעות לסכנות, תפיסת
          העצמי כמסוגל, קול פנימי חיובי. כוחות חיצוניים: סביבה מעצימה, השתייכות לקבוצה מיטיבה, חבר טוב.
      - ask: מה עזר לכם — או יכול לעזור — לעמוד מול הפיתוי? לאיזה טור זה שייך?
      - say: ויש עוד כוח שעוזר — גבול. בואו נראה איך הורים מנסים להציב גבול.

  # ------------------------------------------------------------------ 17′–22′
  - id: limits
    title: גבול שמציבים לי, וגבול שאני מציב
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      קטע מ״משפחה בהסעה״ — הורים מנסים להציב גבול לנערה; ואחריו — מה ההבדל בין גבול שמציבים לי לגבול שאני מציב
      לעצמי
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, והפעילי את הסרטון. עצרי בנקודה שסימנת.
          - אחרי הצפייה — שמעי שתיים־שלוש תשובות, והזמיני את הכיתה להגיב זו לזו.
          - הציגי את שקף הגבולות, וחכי חמש שניות לפני שאת מזמינה תשובות.
      - video:
          title: גבולות מתוך משפחה בהסעה
          url: https://www.youtube.com/watch?v=6n1safVOdG4
          length: "0:54"
          before: מה ההורים מנסים לעשות — וכיצד מגיבה הנערה?
          watch: שימו לב להורים ולנערה — מה כל אחד מהם רוצה.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו ההורים מציבים לנערה גבול, רגע לפני שהיא מגיבה. צפי בקטע (0:54) לפני השיעור, וסמני כאן
                את הזמן.
              ask: איך היא תגיב, לדעתכם?
          alt: מבוגר ונערה, וקו אדום ביניהם
          art:
            - {use: teacher, x: 40, y: 220, w: 140, color: moss}
            - {use: red-line, x: 150, y: 314, w: 320, rotate: 90}
            - {use: kid-stand, x: 440, y: 220, w: 140, color: orange}
      - slide:
          kicker: גבולות
          title: גבול שמציבים לי — וגבול שאני מציב לעצמי
          sub: איזה גבול אתם מציבים לעצמכם? ואיזה קשה לכם להציב?
          echo: true
          cue: אחרי הצפייה והתגובות —
          alt: דמות עומדת, ורמזור לידה
          art:
            - {use: kid-stand, x: 110, y: 200, w: 150, color: teal}
            - {use: traffic-light, x: 340, y: 150, w: 170}
      - ask: מה ההבדל בין גבול שמישהו אחר מציב לנו לבין גבול שאנחנו מציבים לעצמנו?

  # ------------------------------------------------------------------ 22′–27′
  - id: redline
    title: האם צריך קו אדום?
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - אחריות ובחירה
      - עניין ורלוונטיות
    summary: >-
      שאלות הדיון של המקור — האם אלכוהול הוא פיתוי, ולמה בני נוער שותים למרות ה״מחירים״; האם צריך קו אדום, והיכן
      להציב אותו
    body:
      - slide:
          kicker: שאלות לדיון
          title: האם האלכוהול הוא פיתוי? למה?
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו בקבוק
          art:
            - {use: kid-stand, x: 50, y: 230, w: 140, color: teal}
            - {use: thought, x: 250, y: 24, w: 320, flip: true}
            - {use: bottle, x: 350, y: 80, w: 120}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - על כל תשובה — הדהדי, ושאלי ״מי מסכים? מי חושב אחרת? למה?״
          - עברי לשקף הקו האדום. כל אחד חושב לבד איפה הקו שלו — ורק מתנדבים מספרים.
      - ask: חלק מבני הנוער שותים אלכוהול גם כשהם יודעים שיש לזה ״מחירים״ — מדוע זה קורה?
      - slide:
          kicker: קו אדום
          title: האם צריך ״קו אדום״ בנוגע לשתיית אלכוהול?
          sub: היכן צריך להציב אותו — ולמה?
          echo: true
          cue: אחרי כמה תשובות —
          alt: דמות, קו אדום, ומעבר לו בקבוק
          art:
            - {use: kid-stand, x: 50, y: 220, w: 140, color: teal}
            - {use: red-line, x: 150, y: 314, w: 320, rotate: 90}
            - {use: bottle, x: 430, y: 330, w: 140}
      - whisper: >-
          לפי המקור: אלכוהול נתפס כנותן מענה לצרכים של מתבגרים — שייכות, סקרנות, התנסות, להתנהג כמו אחרים ולבדוק
          את הגבולות של העצמי. בני נוער אומרים לעצמם ״לי זה לא יקרה״ ומעריכים שיעצרו בזמן — הנחה שגויה, כי ברגע
          שנכנס אלכוהול ״אתה פחות אתה״. קשה להציב גבול כשנמצאים תחת השפעה, ולכן ההמלצה של המקור: להציב את הקו האדום
          לפני ההתנהגות הזו — כלומר להימנע משתיית אלכוהול.
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי רוצה להוסיף?

