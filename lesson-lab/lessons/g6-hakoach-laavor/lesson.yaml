              y: 128
              size: 96
      - source_slide:
          slides: 16
          why: >-
            הציור של המקור — גשר מעל מים, ולידו ציפור ששרה, פיל מודאג, כלב נבהל, כבשים צמודות זו לזו, חתול
            רוקד, דוב ישן, צב, קוף שמגרד בראש ופרפר. בוחרים ממנו חיה, ולכן מציגים אותו מהמצגת המקורית.
