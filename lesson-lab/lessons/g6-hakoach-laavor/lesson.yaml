steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: who-moved
    title: מי עבר?
    minutes: 4
    stance: true
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: משחק פתיחה — מרימים יד על מעברים שעברנו, ומוסיפים מעברים משלנו
    body:
      - slide:
          kicker: משחק פתיחה · מרימים יד
          title: מי עבר?
          sub: אקריא משפטים. אם המשפט נכון לגביכם — הרימו יד.
          echo: true
          alt: דמות מרימה יד, וחץ ממנה אל בית
          art:
            - {use: house, x: 30, y: 300, w: 220}
            - {use: arrow, x: 250, y: 330, w: 132, color: gray}
            - {use: kid-hand, x: 400, y: 160, w: 175}
      - moves:
          - הכיתה במקומות. הקריאי את המשפטים אחד־אחד, ואחרי כל משפט חכי חמש שניות של שקט לפני שהידיים עולות.
          - ספרי בקול כמה ידיים, בלי לשאול מי ולמה. מי שרוצה לספר על המעבר שלו — רק מתנדבים, ובמשפט אחד.
          - אחרי המשפט השישי — שאלי אילו עוד מעברים הם מכירים, ורשמי על הלוח שלושה–ארבעה.
      - say: >-
          אקריא משפטים. אחרי כל משפט חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז מי שהמשפט נכון לגביו
          מרים יד. מרימים רק אם רוצים.
      - list:
          - כל מי שעבר לחדר אחר…
          - כל מי שעבר דירה…
          - כל מי שעבר בית ספר…
          - כל מי שנולד לו אח או אחות…
          - כל מי שעבר לגור בעיר אחרת…
          - כל מי שעבר לגור במדינה אחרת…
      - slide:
          kicker: משחק פתיחה
          title: אילו עוד מעברים אתם מכירים?
          sub: חוג, קבוצת ספורט… ומה עוד?
          echo: true
          cue: אחרי המשפט השישי —
          alt: עמוד עם שלושה שלטי כיוון, ודמות עומדת לידו
          art:
            - {use: signpost, x: 250, y: 120, w: 300}
            - {use: kid-stand, x: 90, y: 230, w: 125, color: teal}
      - ask: אילו עוד מעברים אתם מכירים?
      - say: כמעט כולנו הרמנו יד לפחות פעם אחת. מעברים הם חלק מהחיים — בואו נבדוק אילו מעברים עברתם אתם.

  # ------------------------------------------------------------------ 4′–9′
  - id: my-moves
    title: המעברים שלי
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: כל אחד רושם את המעברים שעבר ומקיף את המשמעותי ביותר; בזוגות ובמליאה — מה משותף לכל המעברים?
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: המעבר שהכי זכור לכם
          sub: רשמו במחברת את המעברים שעברתם, והקיפו את המשמעותי ביותר.
          points:
            - לבד — דקה וחצי
            - בזוגות — ספרו על המעבר שהקפתם, ולמה הוא
            - במליאה — מה משותף לכל המעברים?
          timer: 90
          echo: true
          alt: דרך מתפתלת אל האופק, ודמות בתחילתה
          art:
            - {use: road, x: 120, y: 110, w: 390}
            - {use: kid-stand, x: 470, y: 290, w: 115, color: teal}
      - moves:
          - הציגי את השקף והפעילי את הטיימר. כותבים במחברת, בשקט, כמה שיותר מעברים — דירה, גן לבית ספר, חדר, שכונה, עיר, ארץ.
          - בזוגות, דקה — כל אחד מספר על המעבר שהקיף, ולמה דווקא הוא. הזוג מחפש מה משותף לשני המעברים.
          - במליאה — שמעי שלושה זוגות, ושאלי אם יש מישהו שלא עבר מעבר בחייו.
      - ladder:
          help: התחילו מהבית — חדר חדש, דירה חדשה, אח או אחות שנולדו.
          challenge: מה הבדיל בין מעבר שהיה לכם קל לבין מעבר שהיה קשה?
      - ask: מה משותף למעברים השונים? והאם יש מישהו שלא עבר מעבר בחייו?
      - say: >-
          כל אחד מאיתנו עובר מעברים לאורך החיים. חלקם קטנים ויומיומיים, וחלקם גדולים ודורשים מאיתנו הרבה
          כוחות. ואחד המעברים הגדולים כבר קרוב — המעבר לחטיבה.

  # ------------------------------------------------------------------ 9′–15′
  - id: notes
    title: מחשבה, הרגשה, שאלה
    minutes: 6
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: כל אחד כותב על פתקיות מה עולה בו לקראת החטיבה, וממיין אותן בטבלה אישית — לימודי או חברתי, הזדמנות או חשש
    body:
      - slide:
          kicker: לקראת החטיבה
          title: מה מלווה אתכם לקראת המעבר?
          sub: חשש · ציפייה · דאגה · התרגשות · שמחה · ?
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובו פנים שמחות ופנים עצובות
          art:
            - {use: thought, x: 180, y: 24, w: 320, flip: true}
            - {use: face-happy, x: 232, y: 100, w: 100}
            - {use: face-sad, x: 348, y: 100, w: 100}
            - {use: kid-stand, x: 90, y: 266, w: 125, color: teal}
      - moves:
          - הציגי את השקף, וקראי את המילים. שאלי מה עוד — ואל תסכמי.
          - חלקי ארבע פתקיות לכל אחד. על כל פתקית — מחשבה, הרגשה או שאלה אחת על המעבר לחטיבה.
          - אחרי שלוש דקות — הציגי את הטבלה. כל אחד משרטט במחברת ארבע משבצות, ומדביק בהן את הפתקיות שלו.
          - בסוף — כל אחד בודק לעצמו, בשקט, איפה יש לו יותר פתקים.
      - say: על כל פתקית — דבר אחד שעולה בכם כשאתם חושבים על החטיבה. אין פתק נכון או לא נכון, ואין פתק קטן מדי.
      - task:
          what: >-
            כל אחד כותב על ארבע פתקיות מחשבה, הרגשה או שאלה על המעבר לחטיבה — אחת בכל פתקית. אחר כך משרטט
            במחברת טבלה של ארבע משבצות, ומדביק כל פתקית במקום שלה — לימודי או חברתי, הזדמנות או חשש.
          time: 3 דקות לכתיבה, 2 למיון
          group: לבד
          rules: כותבים בשקט, בלי שם; פתקית שמתאימה לשתי משבצות — מדביקים על הקו ביניהן
          plenary: עוד לא — הפתקים עולים ללוח בשלב הבא
          help: התחילו ממה שהכי מסקרן אתכם בחטיבה — מורים, חברים, מקצועות, הדרך לבית הספר.
          challenge: מצאו פתק אחד שהוא גם חשש וגם הזדמנות — ואיפה תדביקו אותו?
      - slide:
          kicker: מיפוי אישי
          title: מיינו את הפתקים לטבלה
          sub: יש לכם יותר חששות או יותר הזדמנויות? בתחום הלימודי או בחברתי?
          echo: true
          cue: אחרי שלוש דקות של כתיבה —
          alt: טבלה של ארבע משבצות — לימודי וחברתי, הזדמנויות וחששות — ופתקים בתוכה
          art: {file: art/map.svg}
      - say: עכשיו נראה איך נראית המפה של כל הכיתה.

  # ------------------------------------------------------------------ 15′–21′
  - id: class-map
    title: המפה של הכיתה
    minutes: 6
    practices:
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: כל אחד מדביק פתק אחד או שניים בטבלה שעל הלוח, או פתקית ריקה; במליאה — מה חוזר על עצמו, ומה למדנו על החברים
    body:
      - slide:
          kicker: מיפוי כיתתי
          title: מה עולה מהמפה של הכיתה?
          sub: האם יש דברים שחוזרים על עצמם?
          echo: true
          alt: לוח, ועליו פתקים צבעוניים
          art:
            - {use: board, x: 102, y: 100, w: 416}
            - {use: sticky, x: 142, y: 150, w: 104}
            - {use: sticky, x: 260, y: 168, w: 104, color: teal}
            - {use: sticky, x: 376, y: 146, w: 104, color: purple}
      - moves:
          - >-
            כל אחד בוחר פתק אחד או שניים ומדביק בטבלה שעל הלוח. מי שלא רוצה לשתף — מדביק פתקית ריקה
            במשבצת שלו. שולחן אחרי שולחן, כדי שלא ייווצר תור.
          - בזמן ההדבקה — הקריאי בקול כמה פתקים מכל משבצת, בלי לשאול של מי הם.
          - שאלי מה חוזר על עצמו, וחכי לשלוש–ארבע ידיים לפני שאת מזמינה. על כל תשובה — הדהדי, ושאלי מי עוד מרגיש כך.
          - בסוף — הצביעי על המשבצת שיש בה הכי הרבה פתקים, ושאלי מה למדנו על החברים בכיתה.
      - whisper: הפתקיות הריקות הן חלק מהמפה — ספרי אותן בקול כמו את כל השאר.
      - ask: מה חוזר על עצמו בפתקים? ומה למדתם על התחושות של החברים בכיתה לקראת החטיבה?
      - say: אז מה שאתה אומר זה ש___ — הבנתי נכון? מי עוד מרגיש ככה?
      - say: בואו נסתכל על הפתקים מזווית אחרת — על הסימן שבסוף המשפט.

  # ------------------------------------------------------------------ 21′–27′
  - id: question-mark
    title: מנקודה לסימן שאלה
    minutes: 6
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: כל אחד בוחר את החשש הגדול שלו, מוסיף לו סימן שאלה, ועונה לו בתשובה שמדגישה הזדמנות — עם סימן קריאה
    body:
      - slide:
          kicker: מנקודה… לסימן שאלה
          title: באיזה סימן פיסוק מסתיימים הפתקים שלכם?
          echo: true
          alt: נקודה, חץ, סימן שאלה, חץ, סימן קריאה
          art: {file: art/marks.svg}
      - moves:
          - שאלי, ושמעי שתיים–שלוש תשובות — רוב החששות נכתבים כמו קביעה, עם נקודה.
          - הציגי את הדוגמה. הקריאי את המשפט עם הנקודה, אחר כך עם סימן השאלה, ובסוף את התשובה.
          - הפעילי את הטיימר. כל אחד בוחר את החשש הגדול שלו ועובד עליו במחברת; הסתובבי, ועזרי למי שנתקע בתשובה.
