sub: >-
  כולנו עוברים מעברים, והמעבר לחטיבה כבר קרוב. בשיעור הזה נזכרים במעברים שכבר עברנו, נותנים מקום לכל מה
  שמרגישים לקראת החטיבה, והופכים חשש לשאלה.
format: מליאה, זוגות ועבודה אישית
question: מה מלווה אותנו לקראת המעבר לחטיבה — ואיך אפשר לראות בו גם הזדמנויות?
takeaways:
  - מעברים הם חלק טבעי מהחיים — כולנו כבר עברנו כמה.
  - לקראת החטיבה מותר להרגיש הכול — חשש, ציפייה, התרגשות — ולא מעט חברים בכיתה מרגישים כמונו.
  - כשהופכים חשש לשאלה, נפתח מקום לראות גם את ההזדמנויות שבמעבר.
prep:
  - פתקיות דביקות — ארבע לכל תלמיד, ועוד ערימה קטנה של פתקיות ריקות ליד הלוח
  - >-
    טבלה גדולה של ארבע משבצות על הלוח, לפני השיעור — השורות ״לימודי״ ו״חברתי״, הטורים ״הזדמנויות״
    ו״חששות״ (כמו בשקף המיפוי)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — המעבר לחטיבה והחששות סביבו. שאלי מי בכיתה עבר מעבר קשה — עלייה, פינוי
      מהבית, פרידה של ההורים או מעבר בין שני בתים — ומי חושש במיוחד מהחטיבה, למשל מי שעובר לבית ספר אחר
      מחבריו. בקשי שתהיה זמינה אחרי השיעור, ושתקבל ממך את השאלות על החטיבה שיעלו בכרטיסי היציאה.
  - head: מי עלול להיפגע
    text: >-
      מי שעבר מעבר שלא בחר בו — מארץ אחרת, מבית שפונה, בין שני בתים — ומי שחושש מהחטיבה במיוחד. בפתקים יעלו
      חששות אמיתיים — מחברים, מציונים, מללכת לאיבוד — ואף חשש אינו מצחיק או קטן.
  - head: עמידה מול הכיתה
    text: >-
      ב״מי עבר?״ מרימים יד כשמזדהים עם משפט — וזו חשיפה מול הכיתה. מרימים על המעבר, לא על הסיבה שלו,
      ולא שואלים ״למה עברתם?״. מותר לא להרים, ומי שנשאל יכול להעביר את השאלה למתנדב. מי שמעיר או צוחק על
      יד מורמת — עוצרים מיד.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו; אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. הפתקים על
      הלוח בלי שמות, ומי שלא רוצה לשתף מדביק פתקית ריקה במשבצת שלה — גם היא נספרת. במליאה משתפים רק
      מתנדבים, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל פחד גדול מהחטיבה, או מעבר שעוד כואב — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

