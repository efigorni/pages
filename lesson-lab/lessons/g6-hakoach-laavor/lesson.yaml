          - שמעי ארבעה–חמישה מתנדבים. על כל חיה — שאלי איזה רגש מסתתר מאחוריה, ורשמי אותו על הלוח.
          - בסוף — שאלי אם מישהו היה בוחר בתחילת השיעור חיה אחרת.
      - ask: כמו איזו חיה אתם מרגישים לקראת המעבר לחטיבה — ולמה?
      - say: אז החיה שלך מרגישה ___ — הבנתי נכון? למי עוד זה מוכר?
      - ask: מי היה בוחר בתחילת השיעור חיה אחרת? מה השתנה?

