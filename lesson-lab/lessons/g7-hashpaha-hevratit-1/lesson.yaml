  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ששת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - say: כמה משפטים שכדאי לקחת מהשיעור — אחד־אחד.
      - messages:
          items:
            - >-
              השפעה חברתית יכולה לגרום לנו לחוש מתח או לחץ שמשפיע על דרך החשיבה שלנו ועל ההתנהגות בכלל.
            - >-
              הצורך בשייכות והשתייכות לקבוצת בני הגיל המשמעותית כל כך עבורנו, מניע אותנו לא פעם להיענות
              להשפעה חברתית.
            - >-
              יש סיכוי שנמצא את עצמנו עושים דברים שהיינו מעדיפים להימנע מהם, או כאלה שעלולים להזיק לנו
              בטווח הקצר ו/או הארוך, למשל לעשן ולשתות אלכוהול.
            - >-
              בנוגע לעישון — לעתים מתקיים קונפליקט פנימי הגורם לנו למצוקה — הקונפליקט הוא בין הצורך להשתייך
              לחבורה ולעשן בהתאם לנורמת ההתנהגות בה, לבין הרצון והערכים שלנו, הידע שיש לנו והחינוך שקיבלנו
              ביחס לעישון.
            - >-
              חשוב לנו לחזק את היכולת להביע את דעתנו מול החברים שלנו, גם אם היא שונה משלהם, בוודאי ביחס
              להתנהגויות המסכנות אותנו או אחרים סביבנו.
            - >-
              אמירת ה״לא״ נותנת תחושת ביטחון-עצמי, מחזקת את הדימוי-העצמי, מהווה ביטוי להיותך אסרטיבי
              (תקיף), והתוצאה הינה — פעולה על-פי הרצון הפנימי וקבלת הערכה מהסביבה.
          ask: איזה משפט הייתם רוצים לזכור ברגע של לחץ? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהלחץ (1–2), דרך המחיר והקונפליקט (3–4), אל הכוח לומר ׳לא׳ (5–6) — ה׳לא׳ שתרגלו
            בקבוצות.
          alt: מגן גדול, ודמות עומדת לידו
          art:
            - {use: shield, x: 300, y: 100, w: 288, color: purple}
            - {use: kid-stand, x: 90, y: 200, w: 140, color: teal}

