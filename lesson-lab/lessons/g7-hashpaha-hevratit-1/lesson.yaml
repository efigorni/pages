sub: >-
  כולנו רוצים להשתייך, ולכן הקבוצה משפיעה עלינו — לפעמים גם כשאנחנו יודעים אחרת. בשיעור הזה צופים
  בניסוי של אש, נזכרים ברגע של השפעה, ומתרגלים לומר ׳לא׳ בשלושה מקרים של עישון.
format: מליאה, זוגות וקבוצות
question: למה קשה לעמוד מול הקבוצה — ואיך אומרים ׳לא׳ כשצריך?
takeaways:
  - כולנו מושפעים מהקבוצה — לפעמים גם כשאנחנו יודעים את התשובה הנכונה.
  - הרצון להשתייך יכול לדחוף אותנו לדברים שהיינו מעדיפים להימנע מהם, כמו עישון.
  - אפשר להביע דעה ולומר ׳לא׳ גם מול חברים — וזה מחזק את הביטחון העצמי.
prep:
  - חלוקה לקבוצות של 4–5 לפי השולחנות, ודף ריק לכל קבוצה לכתיבת הדיאלוג
  - ארבע ההוראות לקבוצות (״ברק, נועה וטלי״) — כתובות על הלוח לפני השיעור

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — השפעה חברתית ועישון, בשיעור הראשון של היחידה. שאלי אם יש בכיתה מי
      שהנושא קרוב אליו מדי: מי שכבר מעשן, מי שמעשנים אצלו בבית, מי שעבר לא מזמן בית ספר ועוד מחפש
      חברים, או מי שחבורה לוחצת עליו עכשיו. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שמעשן, או שמעשנים לידו — מדברים על הלחץ ועל ההחלטה, לא על ״מעשנים״ כאנשים, ולא שואלים מי ניסה
      או למי הציעו. מי שמרגיש בודד עלול לזהות את עצמו בנועה — הסיפור שלה הוא על הרצון להשתייך, לא על
      חולשה. בדיאלוגים כל אחד משחק דמות: מי שגילם את מי שמציע סיגריה חוזר להיות הוא עצמו כשהדיאלוג
      נגמר, בלי כינויים.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. הכתיבה על רגע של השפעה נשארת
      במחברת ולא נאספת; במליאה משתפים רק מתנדבים, ורק את התשובה — בלי פרטים ובלי שמות. מותר לוותר,
      ולא קוראים בשם למי שלא הצביע. מול הכיתה מציגות רק קבוצות שהתנדבו.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל לחץ לעשן או לשתות שקורה עכשיו, או חבר שהרחיקו כי סירב — עוצרים בעדינות, מודים, וממשיכים
      בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״על הבמה״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - cases
      - recall
    text: >-
      בקבוצות מוותרים על כתיבת הדיאלוג — כל קבוצה מסכמת משפט ׳לא׳ אחד ואומרת אותו בקול; ובהיזכרות
      רק כותבים, בלי שיתוף במליאה

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: חמש־ארבע־שלוש
      text: בשקט, כל אחד מוצא חמישה דברים שהוא רואה, ארבעה שהוא שומע ושלושה שהוא מרגיש בגוף.
    - name: ספירה עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים, ובכל פעם מישהו אחר אומר מספר אחד. אם שניים אומרים יחד — מתחילים
        מאחת.
    - name: מתיחה בשלוש
      text: קמים, מותחים ידיים למעלה, מתכופפים לימין ולשמאל, ובספירה עד שלוש מתיישבים.
  from: discuss

