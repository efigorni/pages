steps:
  # ------------------------------------------------------------------ 0′–9′
  - id: asch
    title: ניסוי הקווים
    minutes: 9
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      שאלה קלה על אורך של קווים — ומה קורה כשכל הקבוצה עונה אחרת? צופים בניסוי של אש, ובזוגות חושבים
      למה הנבדק טעה
    body:
      - slide:
          kicker: מה הקשר? · כולם עונים יחד
          title: איזה קו באורך של הקו הבודד?
          sub: הראו באצבעות — 1, 2 או 3.
          echo: true
          alt: כרטיס עם קו אחד, ולידו כרטיס עם שלושה קווים ממוספרים
          art: {file: art/asch-cards.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי, ובספירה עד שלוש כולם מרימים אצבעות יחד.
          - כמעט כולם יראו 2. חייכי — זה היה קל — ועברי לשאלה שלפני הצפייה. שמעי שתיים־שלוש השערות.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה לחיזוי.
          - אחרי הצפייה — שמעי שתיים־שלוש תגובות חופשיות (מה הרגשתם, מה חשבתם), ועברי לשאלה בזוגות.
      - whisper: מי שמכיר את הניסוי — בקשי ממנו לשמור את הסוף לעצמו.
      - video:
          title: ניסוי הקונפורמיות של אש
          url: https://www.youtube.com/watch?v=l_YMx1cZX0A
          length: "2:16"
          before: מה תענו, אם כל מי שעונה לפניכם בוחר בקו אחר?
          watch: שימו לב לנבדק — איך הוא מגיב כשכל הקבוצה עונה לפניו, ומה הוא עונה בסוף.
          pauses:
            - at: "?"
              moment: >-
                הרגע שלפני תשובת הנבדק, אחרי שכל הקבוצה כבר ענתה תשובה שגויה. צפי בסרטון לפני השיעור, ורשמי
                כאן את הזמן.
              ask: מה הוא יענה עכשיו — ׳נכון׳ או ׳כמו כולם׳? מילה אחת, בלחישה לשכן.
          alt: שלושה חברים אומרים 1, ודמות אחת לידם חושבת 2
          art:
            - {use: group3, x: 300, y: 275, w: 300}
            - {use: speech, x: 400, y: 100, w: 170}
            - text: '1'
              x: 485
              y: 168
              size: 64
            - {use: kid-stand, x: 70, y: 260, w: 120, color: teal}
            - {use: thought, x: 150, y: 90, w: 170, flip: true}
            - text: '2'
              x: 235
              y: 168
              size: 64
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: למה הנבדק ענה תשובה שגויה?
          echo: true
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          cue: אחרי הצפייה והתגובות החופשיות —
          alt: דמות, ומעליה שתי בועות — במחשבה וי, בדיבור איקס
          art:
            - {use: speech, x: 24, y: 24, w: 240}
            - {use: cross, x: 84, y: 50, w: 120}
            - {use: thought, x: 356, y: 24, w: 240, flip: true}
            - {use: check, x: 416, y: 67, w: 120}
            - {use: kid-stand, x: 237, y: 234, w: 145, color: teal}
      - ladder:
          help: מה הנבדק ראה בעיניים — ומה הוא שמע מהקבוצה?
          challenge: האם הוא באמת השתכנע שהקבוצה צודקת, או רק אמר כמוה? מה ההבדל?
      - say: >-
          בניסוי המקורי (1956), כשענו לבד — כ־99% ענו נכון. בקבוצה — כ־75% ענו לפחות פעם אחת כמו כולם,
          גם כשראו שהקבוצה טועה. כלומר, גם כשאנחנו יודעים את התשובה, הקבוצה יכולה לשנות את מה שנגיד ונעשה.
          וזה קורה לכולנו.

  # ------------------------------------------------------------------ 9′–13′
  - id: recall
    title: רגע שבו הקבוצה השפיעה
    minutes: 4
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      כתיבה אישית שלא נאספת — רגע שבו הקבוצה השפיעה עליי; במליאה, רק מתנדבים — למה ההשפעה חזקה דווקא
      בגיל הזה?
    body:
      - slide:
          kicker: כולם כותבים · לעצמכם
          title: רגע שבו הקבוצה השפיעה עליכם
          echo: true
          points:
            - מה הרגשתם? מה חשבתם?
            - נעניתם? למה?
            - במבט לאחור — זה היה נכון בשבילכם?
          timer: 120
          alt: דמות כותבת ליד שולחן, ומנעול לידה
          art:
            - {use: kid-desk, x: 186, y: 180, w: 248}
            - {use: lock, x: 450, y: 70, w: 128}
      - moves:
          - הציגי את השאלות, ואמרי בבירור שהכתיבה לא נאספת.
          - שתי דקות של כתיבה בשקט. הסתובבי בין השולחנות בלי להציץ בדפים.
          - הזמיני שניים־שלושה מתנדבים לספר רק אם נענו ואם זה היה נכון בשבילם — בלי פרטים.
          - שאלי למה ההשפעה חזקה דווקא בגיל שלהם, ותני לתלמידים להגיב זה לזה — ״מי מסכים? למה?״
      - say: >-
          כותבים לעצמכם — אף אחד לא יאסוף את זה. קשה להיזכר? אפשר לכתוב על מישהו שאתם מכירים, בלי שם.
      - ladder:
          help: חשבו על משהו קטן — בגד, מילה, משחק או שיר שהתחלתם כי כולם.
          challenge: מה היה עוזר לכם באותו רגע לעשות את מה שבאמת רציתם?
      - ask: מי מוכן לספר, בלי פרטים ובלי שמות — נעניתם? ובמבט לאחור, זה היה נכון בשבילכם?
      - ask: השפעה חברתית חזקה במיוחד בגיל שלכם — האמנם? למה?

  # ------------------------------------------------------------------ 13′–17′
  - id: conform
    title: קונפורמיות
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      ההסבר של המקור על השפעה חברתית וקונפורמיות; הכיתה ממיינת דוגמאות — קונפורמיות שמקדמת אותנו
      ושעלולה לסכן
    body:
      - slide:
          kicker: על השפעה חברתית
          title: קונפורמיות
          sub: עושים מה שמקובל בקבוצה — כדי להיות חלק ממנה.
          alt: קבוצה גדולה, וחץ ממנה אל דמות אחת
          art:
            - {use: crowd, x: 296, y: 252, w: 300}
            - {use: arrow, x: 150, y: 290, w: 150, color: gray}
            - {use: kid-stand, x: 30, y: 190, w: 125, color: teal}
      - quote:
          title: ההסבר מהמקור — להקריא
          text: |-
            אדם מרגיש תחושת לחץ פנימית בשל רצונו להרגיש שייכות לקבוצה חברתית.
            בשל הרצון להרגיש חלק מהקבוצה, להיות כמו האחרים, להימנע ממבוכה או שיפוט שלילי מצד האחרים ומתגובות שליליות מצידם —
            היענות, התנהגות התואמת את הנורמה הקבוצתית.
      - moves:
          - הקריאי את ההסבר, והציגי את המילה ״קונפורמיות״.
          - שאלי איפה ראינו את זה היום, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - שרטטי על הלוח שני טורים, ובקשי דוגמאות לכל טור. על כל דוגמה — שאלי את הכיתה לאיזה טור היא שייכת.
          - רשמי שתיים־שלוש דוגמאות בכל טור.
      - say: >-
          ראינו את זה כבר היום — בניסוי, ואולי גם במה שכתבתם. ללכת עם הקבוצה זה לא תמיד רע. מתי זה עוזר,
          ומתי זה מסכן?
      - board: קונפורמיות שמקדמת אותנו · קונפורמיות שעלולה לסכן אותנו
      - slide:
          kicker: קונפורמיות
          title: מתי זה עוזר — ומתי זה מסכן?
          cue: כשעוברים לדוגמאות —
          alt: מאזניים
          art:
            - {use: scale, x: 140, y: 121, w: 340}
      - ask: מי מסכים שהדוגמה הזאת עוזרת לנו? מי חושב שהיא דווקא מסכנת — ולמה?
      - say: >-
          ויש מצבים שבהם הקבוצה דוחפת אותנו למשהו שלא היינו עושים לבד — למשל לעשן. בואו נראה שלושה
          כאלה.

  # ------------------------------------------------------------------ 17′–27′
  - id: cases
    title: ברק, נועה וטלי
    minutes: 10
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      בקבוצות, מקרה אחד לכל קבוצה — מחיר ורווח, ודיאלוג עם ׳לא׳ אחד לפחות; כל קבוצה מקריאה את ה׳לא׳
      החזק שלה
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הכרטיסים; ההוראות על הלוח כל הזמן.
          - חלקי כרטיס מקרה אחד לכל קבוצה, בסבב — ברק, נועה, טלי, ושוב מההתחלה.
          - הסתובבי בין הקבוצות. דקה לפני הסוף — הודיעי, ובקשי מכל קבוצה לסמן את משפט ה׳לא׳ הכי חזק שלה.
          - במליאה — כל קבוצה מקריאה את המשפט שסימנה. רשמי שלושה־ארבעה על הלוח.
      - slide:
          kicker: בקבוצות · 6 דקות
          title: מה הייתם עושים במקומם?
          sub: ברק, נועה או טלי — ודיאלוג עם ׳לא׳ אחד לפחות.
          timer: 360
          alt: ארבעה סביב שולחן, ודף מקרה לידם
          art:
            - {use: circle4, x: 140, y: 170, w: 320}
            - {use: note, x: 456, y: 40, w: 144}
      - board:
          - קוראים בקול את המקרה.
          - מה המחיר ומה הרווח של כל אחת מהאפשרויות?
          - מה הייתם עושים במקום הדמות?
          - כותבים דיאלוג קצר בין הדמויות, עם משפט אחד לפחות שאומר ׳לא׳ להשפעה.
      - say: >-
          בקבוצות לפי השולחנות. כל קבוצה מקבלת מקרה אחד — קוראים, דנים בשתי השאלות, וכותבים דיאלוג קצר
          שיש בו לפחות משפט ׳לא׳ אחד.
      - task:
          what: >-
            קוראים את המקרה, דנים בשתי השאלות שעל הלוח, וכותבים דיאלוג קצר בין הדמויות — עם משפט אחד לפחות
            שאומר ׳לא׳ להשפעה. במקרה של נועה כותבים את הרגע שבו הזמינו אותה, לפני שהחליטה.
          time: 6 דקות — 2 לדיון, 4 לדיאלוג
          group: קבוצות של 4–5 לפי השולחנות; מקרה אחד לכל קבוצה
          rules: כותב אחד, וכולם מציעים משפטים; מי שמסיים מוקדם — מוסיף ׳לא׳ בדרך אחרת
          plenary: כל קבוצה מקריאה את משפט ה׳לא׳ הכי חזק שלה
          help: איך הדמות יכולה לומר ׳לא׳ בלי לריב? התחילו ב״לא, תודה, כי…״
          challenge: כתבו גם מה החבר עונה ל׳לא׳ — ואיך הדמות עומדת בזה בפעם השנייה.
      - handout:
          title: כרטיסי מקרה
          copies: 3 עותקים, גזורים לשלושה כרטיסים; כרטיס אחד לכל קבוצה
          verbatim: true
          lines: false
          items:
            - >-
              במהלך ההפסקה, ברק נכנס עם חברים שלו לחדר השירותים שבבית הספר. אחד מהם הוציא חפיסת
              סיגריות ששייכת לאחיו הבכור, ושאל אותו אם הוא רוצה לעשן. אחד החברים ענה בחיוב. ברק לא ממש
              רצה לעשן, אך מכיוון ששאר חבריו מעשנים סביבו, הוא התלבט ולא ידע מה להחליט.
            - >-
              נועה תלמידת כתה ז', עברה דירה לאחרונה. בביה"ס הקודם הייתה מאד אהובה ומקובלת, ובביה"ס החדש
              הרגישה בודדה, לא מצאה חברות והיה לה קשה. שתי בנות שקטות העריכו אותה והחלו להתקרב אליה.
              באחד הימים הזדמנה לפארק ליד ביה"ס וראתה חבורת ילדים מהכיתה — כולם ביחד, צוחקים ומעשנים
              סיגריות רגילות וסיגריות אלקטרוניות. להפתעתה, הזמינו אותה להצטרף אליהם, והציעו לה לעשן
              איתם. נועה התלבטה, היא ממש מתנגדת לעישון. אולם זו פעם ראשונה שהרגישה רצויה בביה"ס החדש.
              היא הצטרפה והסכימה לעשן.
            - >-
              טלי לומדת בכתה ז'. היא ספורטאית וחשוב לה לשמור על כושר. לפני כמה ימים ראתה באינסטגרם
              תמונה שהעלתה חברה טובה שלה. בתמונה היא נראית עם חברים ומחזיקה סיגריה אלקטרונית. טלי
              הוזמנה למסיבה בסוף השבוע. היא יודעת שהחברות מתכוונות לעשן. טלי לא יודעת מה לעשות…
      - p: ההקראה בסוף היא התרגול של השיעור — לומר ׳לא׳ בקול, גם אם זה רק משפט אחד.
      - slide:
