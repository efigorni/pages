          - על כל תשובה — שאלי מי הרגיש אחרת, ותני לתלמידים להגיב זה לזה.
      - say: >-
          כל קבוצה מתכננת פעילות לגיבוש הכיתה — מה עושים, איפה, ומה צריך. חמש דקות, וכותבים את התוכנית על
          דף אחד.
      - task:
          what: כל קבוצה מתכננת פעילות לגיבוש הכיתה — מה עושים, איפה ומתי, ומה צריך כדי שזה יקרה.
          time: 5 דקות
