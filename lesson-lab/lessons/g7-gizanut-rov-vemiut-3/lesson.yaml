steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: axis
    title: ציר השייכות שלי
    minutes: 6
    stance: true
    practices:
      - מה הקשר?
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: עומדים על ציר מ־1 עד 10 לפי תחושת השייכות לשתי קבוצות; מתנדב מכל צד מסביר
    body:
      - slide:
          kicker: ציר השייכות · על הרצפה
          title: עד כמה אתם מרגישים שייכים?
          sub: צד ימין — שייכות רבה. צד שמאל — שייכות מועטה.
          echo: true
          alt: קו על הרצפה, 1 בקצה אחד ו־10 בקצה השני, ושתי דמויות עומדות עליו במקומות שונים
          art: {file: art/axis.svg}
      - moves:
          - >-
            הכיתה נכנסת ונעמדת לאורך הקו. הראי את שני הקצוות, ואמרי שגם כל נקודה באמצע היא תשובה.
          - הקריאי קבוצה אחת בכל פעם. חמש שניות של שקט — ורק אז זזים.
          - >-
            כשכולם במקום — שאלי מתנדב אחד מכל צד מה גרם לו לעמוד שם, ותארי במילים את הפיזור: איפה רוב
            הכיתה, ואיפה הקו מתרוקן.
          - אחרי הקבוצה השנייה — שאלת סיכום, וחוזרים למקומות.
      - say: >-
          לפני כל קבוצה חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז זזים. אין תשובה נכונה, מותר
          לעמוד באמצע, ומסבירים רק על עצמנו.
      - slide:
          kicker: ציר השייכות · שתי קבוצות
          title: עמדו לפי השייכות שלכם ל…
          points:
            - השכונה שלי
            - העיר או היישוב שלי
          echo: true
          cue: אחרי ההסבר —
          alt: בית, ודרך מתפתלת לידו
          art:
            - {use: house, x: 250, y: 140, w: 280}
            - {use: road, x: 30, y: 300, w: 200}
      - ask: מה הפתיע אתכם בפיזור? מה גורם לנו להרגיש שייכים יותר — או פחות?
      - say: לכל אחד מאיתנו יש הרבה קבוצות — ובכל אחת אנחנו מרגישים אחרת. בואו נדבר על זה בזוגות.

  # ------------------------------------------------------------------ 6′–13′
  - id: aquarium
    title: לאן אנחנו שייכים?
    minutes: 7
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      שיחות בזוגות מתחלפים — בכל סבב כל אחד בוחר קבוצה מהרשימה ומספר עליה לפי ארבע שאלות; שאלה אחת
      במליאה
    body:
      - slide:
          kicker: בזוגות · שני סבבים
          title: לאן אנחנו שייכים?
          points:
            - האם זו קבוצה שאת/ה מרגיש/ה שייך אליה?
            - מאילו אנשים מורכבת הקבוצה?
            - מתי הצטרפת לקבוצה?
            - מה יש בקבוצה הזאת שגורם לך להרגיש טוב בתוכה או אולי להרגיש בה פחות טוב?
          verbatim:
            - points
          timer: 180
          echo: true
          alt: שתי דמויות יושבות זו מול זו, ובבועה של אחת מהן חלק פאזל
          art:
            - {use: kid-sit, x: 40, y: 255, w: 170, color: purple}
            - {use: kid-sit, x: 410, y: 255, w: 170, color: teal, flip: true}
            - {use: speech, x: 330, y: 36, w: 240}
            - {use: puzzle, x: 403, y: 66, w: 95}
      - board: >-
          הכיתה שלי · המשפחה שלי · השכונה שלי · בית הספר · קבוצת הספורט שלי · חוג · תנועת נוער · החברים
          שלי
      - moves:
          - הסבירי את שני הסבבים לפני שמתחילים; הרשימה על הלוח והשאלות על המסך.
          - >-
            סבב ראשון — שלוש דקות, דקה וחצי לכל אחד. בסופו, מי שיושב בצד ימין של כל שולחן עובר שולחן אחד
            קדימה (מהשולחן הראשון — לאחרון), ובסבב השני כל אחד בוחר קבוצה אחרת.
          - הסתובבי והקשיבי, בלי להתערב.
          - בסוף — חוזרים למקומות, ושאלה אחת למליאה. תני לתלמידים להגיב זה לזה.
      - say: >-
          בכל סבב — כל אחד בוחר קבוצה אחת מהרשימה ומספר עליה לבן הזוג. אתם בוחרים על מה לספר, ומי שמקשיב
          — מקשיב בלי לשפוט.
      - task:
          what: >-
            כל אחד בוחר קבוצה אחת מהרשימה שעל הלוח ומספר עליה לבן הזוג לפי השאלות שעל המסך, ואז מתחלפים.
            בסוף הסבב מחליפים בן זוג, ובוחרים קבוצה אחרת.
          time: שני סבבים, 3 דקות לכל סבב — דקה וחצי לכל אחד
          group: זוגות לפי השולחנות; אחרי הסבב הראשון מי שיושב בצד ימין עובר שולחן אחד קדימה
          rules: כל אחד בוחר בעצמו על איזו קבוצה לספר; מספרים רק מה שרוצים, ומי שמקשיב — לא שופט
          plenary: שאלה אחת לכולם — האם אנחנו דומים לשאר חברי הקבוצה שלנו?
          help: בחרו קבוצה שאתם אוהבים להיות בה, והתחילו ממה שעושים בה.
          challenge: האם אתם דומים לשאר חברי הקבוצה — או שונים מהם? ואיך זה משפיע על ההרגשה שלכם בה?
      - ask: >-
          האם אתם דומים לשאר חברי הקבוצה שלכם — או שונים מהם? והאם זה משפיע על כמה אתם מרגישים שייכים?
      - say: ומה קורה כשאנחנו המעטים — שונים משאר הקבוצה? בואו ננסה.

  # ------------------------------------------------------------------ 13′–23′
  - id: minority
    title: רוב ומיעוט בקבוצה
    minutes: 10
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      בקבוצות של חמישה עם רוב ברור מתכננים פעילות גיבוש לכיתה; אחר כך — איך היה להיות מעטים, ואיך היה
      להיות רבים
    body:
      - slide:
          kicker: בקבוצות · 5 דקות
          title: תכננו פעילות לגיבוש הכיתה
          sub: מה עושים, איפה, ומה צריך כדי שזה יקרה?
          timer: 300
          echo: true
          alt: ארבעה סביב שולחן עגול, ונורה דולקת לידם
          art:
            - {use: circle4, x: 280, y: 200, w: 300}
