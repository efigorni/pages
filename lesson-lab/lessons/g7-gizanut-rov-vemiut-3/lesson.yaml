      - moves:
          - הקריאי את רשימת הקבוצות, ותני דקה להתיישב יחד.
          - >-
            הציגי את המשימה, והפעילי את הטיימר. הסתובבי בין הקבוצות בלי להתערב בדיון — רק הקשיבי מי מדבר
            ומי לא.
          - >-
            אחרי חמש דקות — עוצרים, ונשארים בקבוצות. שאלי קודם את מי שהיה לבד בקבוצה, אחר כך את הרוב, ובסוף
