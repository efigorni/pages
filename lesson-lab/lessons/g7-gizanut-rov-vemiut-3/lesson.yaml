sub: >-
  כל אחד מאיתנו שייך להרבה קבוצות — ובחלק מהן אנחנו ברוב, ובחלק במיעוט. בשיעור הזה עומדים על ציר
  השייכות, מדברים בזוגות על הקבוצות שלנו, ומרגישים לרגע איך זה להיות מעטים מול רבים.
format: עמידה על ציר, זוגות, קבוצות ומליאה
question: מתי אנחנו ברוב ומתי במיעוט — ומה כל אחד יכול לעשות כדי שכולם בקבוצה ירגישו שייכים?
takeaways:
  - כולנו שייכים להרבה קבוצות — ובכל אחת אנחנו יכולים להיות פעם ברוב ופעם במיעוט.
  - מי שזוכר איך הרגיש במיעוט — יכול להבין טוב יותר את מי שנמצא לידו במיעוט.
  - על כל חברי הקבוצה מוטלת האחריות לדאוג שכולם ירגישו בה שייכים.
prep:
  - >-
    ציר על הרצפה — פס נייר דבק לאורך הכיתה, ושלט בכל קצה: ״10״ בצד ימין (שייכות רבה) ו״1״ בצד שמאל
    (שייכות מועטה). פני מעבר לאורכו.
  - רשימת הקבוצות לשיחה בזוגות — כתובה על הלוח לפני השיעור
  - >-
    חלוקה מראש לקבוצות של חמישה עם רוב מגדרי ברור — ארבעה בנים ובת אחת, או ארבע בנות ובן אחד (ראי ״מי
    עלול להיפגע״ בתיבה)

safe:
  - head: תיאום עם היועצת
    text: >-
      השיעור רגיש במיוחד: עמידה על ציר שייכות מול הכיתה, ותרגיל שבו תלמיד אחד בכל קבוצה הוא ״המיעוט״
      מבחינה מגדרית. ספרי לה מתי השיעור, עברי איתה על חלוקת הקבוצות, ושאלי מי בכיתה עלול להיפגע — תלמיד
      חדש או בודד, מי שמשפחתו במשבר, מי שעלה לא מזמן, ומי שהזהות המגדרית שלו רגישה. בקשי שתהיה זמינה
      אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שמרגיש בחוץ — בכיתה, בבית או בין החברים. לכן על הציר יש רק קבוצות של מקום — השכונה, והעיר או
      היישוב. בית הספר לא נכנס לציר: מי שעומד ליד 1 מסמן מול כולם שהוא מרגיש בו בחוץ. המשפחה, הכיתה והחברים
      עולים רק בשיחה בזוגות, ורק אצל מי שבוחר בהם. ליחיד בכל קבוצה בתרגיל בחרי
      תלמידים בטוחים בעצמם ובמעמדם — לא תלמיד חדש, לא מי שכבר בשוליים, ולא מי שהשיוך המגדרי רגיש אצלו
      (אותו שבצי בלי קשר למגדר). קבוצה שמתעלמת מהיחיד שבה או לועגת לו — עצרי בשקט, והעלי את זה בשיחה בלי
      שמות.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מה שנאמר כאן נשאר כאן, ומספרים רק על עצמנו״. בשיחה בזוגות כל אחד בוחר על איזו
      קבוצה לספר, ומה. במליאה מדברים רק מתנדבים; היחידים בקבוצות לא חייבים לספר איך היה להם, ולא קוראים
      בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל בדידות, חרם או יחס מעליב בגלל המוצא או המגדר — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם
      בלי לומר שם.
  - head: עמידה מול הכיתה
    text: >-
      על הציר עומדים לפי תחושה אמיתית, ולכן הוא כולל רק קבוצות שלא מביכות בעמידה פומבית. מותר לעמוד
      באמצע, ומי שאין לו תשובה עומד במרכז; מסבירים רק מתנדבים, ורק על עצמם. צחוק או הערה על המקום של
      מישהו — עוצרים מיד.

