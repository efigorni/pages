          rules: כל רעיון נשמע; כותבים את התוכנית על דף אחד
          plenary: לא מציגים את התוכנית — מדברים על איך היה בקבוצה
          help: מה אתם הכי אוהבים לעשות יחד אחרי בית הספר? התחילו משם.
          challenge: איך תדאגו שכל אחד בכיתה ימצא בפעילות משהו בשבילו?
      - slide:
