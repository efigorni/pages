            - {use: bulb, x: 165, y: 93, w: 70}
      - whisper: >-
          אם עולה הכללה (״הבנות תמיד…״) — שאלי ״זה נכון לכל הבנות בקבוצה שלכם?״. ואם מי שהיה לבד מספר
          שהתעלמו ממנו — הודי לו, ואל תחפשי אשמים.
      - ask: איך זה הרגיש — להיות אחד מול ארבעה? ואיך זה הרגיש להיות ברוב?
      - say: >-
