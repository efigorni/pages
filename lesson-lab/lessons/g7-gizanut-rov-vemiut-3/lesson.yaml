  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: חמשת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - say: >-
          היום ראינו שכולנו נמצאים לפעמים ברוב ולפעמים במיעוט, ושחשוב לשים לב לכל חברי הקבוצה ולדאוג שכולם
          ירגישו שייכים. חמישה משפטים לקחת איתכם:
      - messages:
          items:
            - >-
              כל אדם שייך לקבוצות רבות, הדבר גורם לכך שלעיתים אותו אדם שייך לקבוצת הרוב במקום אחד ובמקום
              אחר — לקבוצת המיעוט.
            - >-
              לעיתים אנחנו יכולים להעריך מאוד את השונות שלנו בקבוצת מיעוט, להיות גאים במאפיינים שלנו ולנצל
              אותם לטובתנו, אך לעיתים, נהיה במצבים בהם לא נרגיש בנוח להיות בקבוצת המיעוט ונרצה שקבוצת הרוב
              תכיר בשונות שלנו ותקבל אותה כמו שהיא.
            - >-
              גם כשאנחנו נמצאים בקבוצת הרוב, חשוב תמיד לחזור לתחושות ולרגשות שלנו כשאנו במיעוט — ברגע
              שנתחבר לתחושות הללו, נוכל להביע יותר אמפתיה למי שנמצא לידינו במיעוט, למי ששונה ולא מרגיש שייך
              לקבוצה כמו שאנחנו מרגישים.
            - בכיתה שלנו ובשכבה שלנו יש קבוצות ולכל אחד/ת ישנה השתייכות אחרת.
            - >-
              חשוב לנסות ולחצות לפעמים את הקבוצות הללו, ולהיות במקומות בהם אנחנו מעט אחרים, כדאי לנסות
              ולהכיר יותר ולא לפספס הזדמנויות לחברויות חדשות.
          ask: איזה משפט הכי חשוב לזכור, לדעתכם? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מההבנה שכולנו לפעמים ברוב ולפעמים במיעוט (1–2), דרך האמפתיה שזה מאפשר (3), אל
            מה שאפשר לעשות בכיתה ובשכבה — לחצות לפעמים את הקבוצות ולהכיר (4–5).
          alt: שלוש דמויות יחד, וחלק פאזל לידן
          art:
            - {use: group3, x: 260, y: 270, w: 320}
            - {use: puzzle, x: 70, y: 80, w: 150}

