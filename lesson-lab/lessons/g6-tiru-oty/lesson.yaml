  # (ppt/diagrams/data1.xml, data2.xml), לפי סדר הקריאה בשקף, מימין לשמאל. התיקון מוסיף אותם למקור לפני ההשוואה.
  - from: "## שקף 20"
    to: |-
      ## שקף 20

      אנחנו יכולים לכתוב, לצלם ולשתף ברשתות חברתיות בחוויות שמכניסות עניין לחיינו.

      אתם שווים יותר מפוסט! מי שאתם ומה שאתם חושבים על עצמכם נובע מסך כל החוויות שלכם בחיי היומיום ולא רק ממה שקורה ברשת החברתית.

      מפעילים שיקול דעת לפני פרסום: האם מה שאנחנו רוצים לפרסם על עצמנו מכבד אותנו? עלול לפגוע בנו? האם נרצה שהאנשים הקרובים לנו יראו את הפרסום?
  - from: "## שקף 21"
    to: |-
      ## שקף 21

      ה"סטורי" של השכן ירוק יותר? כשאנחנו רואים תמונות וסרטונים של אחרים, חשוב שנזכור שלעתים הם מציגים חלק קטן מחייהם וחלקם עברו עריכה.

      מתחשבים ומגלים אכפתיות כלפי אחרים: אל תפרסמו על אחרים מה שלא הייתם רוצים שיפרסמו עליכם או על חבריכם.

      זוכרים שפרסום שמצחיק אותנו עלול להעליב אחרים וליצור דחייה חברתית.
