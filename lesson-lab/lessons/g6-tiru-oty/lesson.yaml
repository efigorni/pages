      - ask: >-
          מי מכיר את התחושה שכולם נהנים — ורק אני בבית? מה עוזר לזכור שרואים רק חלק קטן מהתמונה?

  # ------------------------------------------------------------------ 22′–27′
  - id: inner
    title: הלייק הפנימי
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: כל אחד כותב בדף את נקודות החוזק שלו — הלייק הפנימי; מתנדבים מקריאים לייק אחד
    body:
      - say: >-
          האם אפשר להרגיש מוערכים ואהובים גם בלי לייקים, בלי עוקבים ובלי תגובות? בואו ננסה — עם הלייק שאף אחד
          לא צריך לתת לנו.
      - slide:
          kicker: כולם כותבים · לבד
          title: הלייק האמיתי הוא הלייק הפנימי!
          points:
            - מהן נקודות החוזק שבי?
            - במה אני מוכשר/ת?
            - אילו התנהגויות או מעשים שלי אני מעריך/כה בעצמי?
          verbatim: true
          timer: 180
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו אגודל למעלה
          art:
            - {use: thought, x: 60, y: 30, w: 300}
            - {use: thumb-up, x: 152, y: 90, w: 110}
            - {use: kid-stand, x: 390, y: 228, w: 140, color: teal}
      - moves:
          - חלקי את הדף, והקריאי שתיים־שלוש דוגמאות מהדף לדוגמה של המקור.
          - שלוש דקות של כתיבה בשקט. מי שנתקע מקבל ממך התחלה — ״אני טוב ב…״ או ״אני יודע ל…״.
          - בסוף — מי שרוצה מקריא לייק פנימי אחד. הדף נשאר אצל הכותב.
      - quote:
          title: דוגמאות מהדף לדוגמה במקור — להקריא שתיים־שלוש
          text: |-
            אני לא מוותרת לעצמי
            אני לא מפחדת אם משהו קשה לי
            אני ממש טובה בקיר טיפוס
            אני יודע להקשיב לחברים שלי
            אני מעולה בריקוד היפ-הופ
            אני אוהב בעלי חיים ודואג להם
            אני מתקדם במקצוע אנגלית
      - handout:
          title: הלייק האמיתי הוא הלייק הפנימי!
          copies: עותק לכל תלמיד
          verbatim: true
          items:
            - מהן נקודות החוזק שבי?
            - במה אני מוכשר/ת?
            - אילו התנהגויות או מעשים שלי אני מעריך/כה בעצמי?
      - ladder:
          help: חשבו על משהו שחבר או מישהו מהמשפחה אמר שאתם טובים בו.
          challenge: כתבו גם מעשה אחד שעשיתם השבוע — ומה הוא אומר עליכם.
      - ask: מי רוצה להקריא לייק פנימי אחד שלו?

