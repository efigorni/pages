          text: >-
            "זהות מלוטשת": הזהות שאנחנו יוצרים לעצמנו ברשת כוללת לעתים רק צדדים מסוימים שלנו, כאלו שמחמיאים
            לנו. ישנם מקרים בהם ילדים ובני נוער עורכים תכנים, תמונות וסרטונים כדי לקבל אהדה גדולה יותר (לייקים,
