          text: >-
            תדמית דיגיטלית: נוצרת כתוצאה מהדרך שבה אנחנו מציגים את עצמנו ברשת (באמצעות תמונות, סרטונים, כתיבה
            ושיתופים). חשוב לוודא שהתדמית שלנו ברשת מייצגת אותנו נאמנה ולא כוללת תכנים שעלולים לפגוע בנו.
      - slide:
