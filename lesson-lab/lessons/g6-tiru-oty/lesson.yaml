          title: מהי ״זהות מלוטשת״?
          points:
            - זהות ברשת עם הצדדים שמחמיאים לנו בלבד
            - עריכת תמונות כדי לקבל יותר לייקים
            - משהו שעלול לעורר בנו קנאה, אכזבה ועצב
            - כל התשובות נכונות
          echo: true
          cue: אחרי ההסבר —
