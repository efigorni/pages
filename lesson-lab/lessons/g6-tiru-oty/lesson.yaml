steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: likes
    title: אינסטגרם בלי לייקים?
    minutes: 4
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: רשת שבה לא רואים כמה לייקים קיבלו אחרים — מה זה מעורר, ואיך זה היה משנה את מה שמשתפים
    body:
      - slide:
          kicker: מה הקשר? · כתבה מ־2019
          title: אינסטגרם בלי לייקים?
          sub: אפשר לסמן לייק — אבל לא רואים כמה לייקים קיבלו אחרים.
          echo: true
          alt: טלפון ועל המסך אגודל למעלה, ובועת דיבור עם סימן שאלה
          art:
            - {use: phone, x: 330, y: 120, w: 190}
            - {use: thumb-up, x: 380, y: 210, w: 90}
            - {use: speech-l, x: 70, y: 50, w: 220}
            - text: '?'
              x: 180
              y: 125
              size: 90
      - moves:
          - >-
            השקף על המסך כשהכיתה נכנסת. ספרי בשני משפטים: ב־2019 אינסטגרם ניסתה שינוי — אפשר לסמן לייק, אבל
            מספר הלייקים של אחרים לא מופיע על המסך.
          - שאלי את השאלה הראשונה, וספרי בלב עד עשר לפני שאת מזמינה תשובות. שמעי שלוש.
          - עברי לשאלה השנייה, ושמעי עוד שתיים־שלוש תשובות.
      - ask: מה דעתכם על רשת שבה לא רואים כמה לייקים קיבלו אחרים? איזו תחושה זה מעורר בכם?
      - ask: >-
          אם זה היה קורה בכל הרשתות — איך זה היה משפיע על מה שתבחרו לשתף, מתי וכמה?
      - say: >-
          לייקים חשובים לנו — לפעמים יותר ממה שנדמה. בואו נשמע סיפור על ילד שהתגובות היו חשובות לו מאוד.

  # ------------------------------------------------------------------ 4′–9′
  - id: ziv
    title: הסיפור של זיו
    minutes: 5
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      מקריאים את הסיפור של זיו בשני חלקים — ניחוש אחרי החלק הראשון, ותגובה ראשונה בסוף
    body:
      - slide:
          kicker: חקר מקרה
          title: הסיפור של זיו
          sub: שקית גדולה של סליים מגיעה למזכירות בית הספר.
          alt: בית ספר, וילד עומד לפניו
          art:
            - {use: school, x: 250, y: 200, w: 330}
            - {use: kid-stand, x: 70, y: 240, w: 130, color: purple}
      - moves:
          - הקריאי את החלק הראשון, ועצרי בסופו.
          - שאלי מה לדעתם קורה כאן, וחכי חמש שניות לפני שאת מזמינה תשובות. שמעי שתי השערות.
          - הקריאי את החלק השני, ושאלי מה המחשבה או ההרגשה הראשונה. שמעי שתיים־שלוש.
      - quote:
          title: הסיפור של זיו, חלק ראשון — להקריא
          text: |-
            אבא של זיו, הלומד בכיתה ה', הגיע למזכירות בית הספר עם שקית גדולה של סליים וביקש למסור לבנו את השקית. האב ציין כי בנו ביקש את שקית הסליים לטובת פעילות בשיעור מדעים והשאיר את השקית במזכירות.
            המורה למדעים קיבלה לידיה את השקית, הופתעה לגלות בה סליים וקראה לזיו לשיחה.
            זיו הגיע לשיחה וכשראה את הסליים בידיה של המורה נלחץ ואמר: "הסליים בשביל משחק אחר הצהריים, זה בעצם בשביל הצופים, זה בכלל לא קשור לבית ספר". המורה הרגיעה את זיו ואמרה שחשוב לה לדעת במה מדובר כי בשקית יש הרבה סליים שמספיק לכל ילדי הכיתה.
      - ask: מה לדעתכם קורה כאן? למה זיו נלחץ?
      - slide:
          kicker: הסיפור של זיו
          title: ״חיובים״ — משחק אתגרים באינסטגרם
          sub: מי שמעלה את המשימה לסטורי ומקבל הכי הרבה תגובות — זוכה.
          cue: לפני החלק השני —
          alt: טלפון עם התראה, וקבוצה גדולה של דמויות
          art:
            - {use: crowd, x: 30, y: 300, w: 300}
            - {use: phone-notify, x: 360, y: 80, w: 210}
      - quote:
          title: הסיפור של זיו, חלק שני — להקריא
          text: |-
            זיו התלבט אם לשתף את המורה או לא, ולאחר מספר רגעים של שתיקה אמר: "כל ילדי הכיתה משתתפים במשחק "חיובים" באינסטגרם. זה משחק "אמת או חובה" שמתקיים ברשת. בקבוצת הווטסאפ הכיתתית מכריזים על משימה. מי שמבצע ומעלה אותה לסטורי שלו ומקבל הכי הרבה תגובות זוכה באותו סבב. לפני יומיים, דנה מהכיתה הכריזה על משימה חדשה: לחרוט על ספסל בגינה השכונתית את השם שלנו, ולהצטלם ליד הספסל. השתתפתי במשימה, חרטתי את השם שלי והעליתי לסטורי.
            הייתי הראשון שהעלה את התמונה והייתי בטוח שאני אקבל המון תגובות. אבל זה לא קרה. התאכזבתי ממש, זו לא פעם ראשונה שהילדים בכיתה מתעלמים ממני. החלטתי לכתוב לילדים שמי שיפרסם תגובה, יקבל ממני סליים. כמות התגובות התחילה לעלות ובערב דנה הכריזה עליי כזוכה במשימה.
            הבוקר שכחתי לקחת איתי את הסליים, אז בקשתי מאבא שלי שיביא לי את השקית בדחיפות. לא רציתי שידע מה הסיבה, אז אמרתי לו שזה לשיעור מדעים".
      - ask: מה המחשבה שעלתה בראשכם, או ההרגשה, בעקבות הסיפור?

  # ------------------------------------------------------------------ 9′–17′
  - id: why
    title: מה הניע את זיו?
    minutes: 8
    practices:
