  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ששת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - אנחנו יכולים לכתוב, לצלם ולשתף ברשתות חברתיות בחוויות שמכניסות עניין לחיינו.
            - >-
              אתם שווים יותר מפוסט! מי שאתם ומה שאתם חושבים על עצמכם נובע מסך כל החוויות שלכם בחיי היומיום ולא
              רק ממה שקורה ברשת החברתית.
            - >-
              מפעילים שיקול דעת לפני פרסום: האם מה שאנחנו רוצים לפרסם על עצמנו מכבד אותנו? עלול לפגוע בנו? האם
              נרצה שהאנשים הקרובים לנו יראו את הפרסום?
            - >-
              ה״סטורי״ של השכן ירוק יותר? כשאנחנו רואים תמונות וסרטונים של אחרים, חשוב שנזכור שלעתים הם מציגים
              חלק קטן מחייהם וחלקם עברו עריכה.
            - >-
              מתחשבים ומגלים אכפתיות כלפי אחרים: אל תפרסמו על אחרים מה שלא הייתם רוצים שיפרסמו עליכם או על
              חבריכם.
            - זוכרים שפרסום שמצחיק אותנו עלול להעליב אחרים וליצור דחייה חברתית.
          ask: >-
            איזה משפט מהשישה תרצו לזכור לפני הפרסום הבא שלכם? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהרשות לשתף (1), דרך הערך שלנו ושיקול הדעת לפני פרסום (2–3), אל ההשוואה לאחרים ואל
            מה שאנחנו מפרסמים עליהם (4–6).
          alt: דמות עומדת, וכוכב גדול לידה
          art:
            - {use: kid-stand, x: 80, y: 150, w: 180, color: teal}
            - {use: star, x: 330, y: 70, w: 210}

