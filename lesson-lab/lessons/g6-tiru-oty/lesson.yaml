          title: מהי ״השוואה חברתית ברשת״?
          points:
            - משווים למי יש סמארטפון חדש יותר
            - צפייה בשיתופים מלוטשים, שגורמת להרגיש פחות מאושרים
            - משווים למי יש יותר קבוצות בווטסאפ
          echo: true
          cue: אחרי ההסבר —
          alt: טלפון ועל המסך פנים שמחות, ודמות שחושבת על פנים עצובות
