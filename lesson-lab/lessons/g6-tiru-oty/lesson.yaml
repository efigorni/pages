      לנושאים, ושואלים מה היינו עושים בכיתה שלנו
    body:
      - slide:
          kicker: כולם כותבים · בחרו שאלה אחת
          title: מה הניע את זיו — ומה זה צריך להדליק?
          points:
            - מה, לדעתכם, הניע את זיו לפעול כפי שפעל?
            - אילו ״נורות אדומות״ התנהגותו של זיו אמורה להדליק בקרב הסובבים אותו?
          verbatim:
            - points
          timer: 120
          echo: true
          alt: ילד עומד ליד רמזור
          art:
            - {use: kid-stand, x: 130, y: 220, w: 140, color: purple}
            - {use: traffic-light, x: 390, y: 200, w: 150}
      - say: כל אחד בוחר שאלה אחת מהשתיים, וכותב לבד שניים־שלושה משפטים. שתי דקות.
      - moves:
          - שתי דקות של כתיבה בשקט. הסתובבי, וסמני לעצמך תשובות שכדאי לשמוע.
          - >-
            במליאה — שמעי תשובות לשתי השאלות. רשמי כל אחת על הלוח תחת נושא: הרצון להשתייך ולקבל הכרה, לחץ
            חברתי, תדמית ברשת, סיכון ופגיעה, מי יכול לעזור.
          - הזמיני את הכיתה להגיב זה לזה — ״מי מסכים? מי רואה את זה אחרת?״
          - סיימי בשאלה על הכיתה שלנו, ושמעי שלוש תשובות.
      - ladder:
          help: חשבו מה זיו הרגיש כשאף אחד לא הגיב לתמונה שלו.
          challenge: מה היה יכול לעזור לזיו להרגיש שרואים אותו — בלי משחק ובלי סליים?
      - ask: במידה ומקרה דומה היה מתרחש בכיתתכם — כיצד הייתם מגיבים?
      - say: >-
          הרצון שיראו אותנו טבעי לגמרי. יש לו כמה מילים שכדאי להכיר — נבדוק אותן בחידון קצר.

  # ------------------------------------------------------------------ 17′–22′
  - id: quiz
    title: רגע ממשיגים!
    minutes: 5
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: >-
      חידון של שלושה מושגים — תדמית דיגיטלית, זהות מלוטשת, השוואה חברתית ברשת: מנחשים באצבעות, ואז ההסבר
    body:
      - say: >-
          על שלוש — כולם מראים באצבעות את מספר התשובה. אין כאן עונש על טעות; ככה לומדים מילים חדשות.
      - moves:
          - לכל שאלה — הקריאי אותה ואת התשובות, ספרי עד שלוש, וכולם מראים באצבעות.
          - שאלי שניים שבחרו תשובות שונות למה, ורק אז אמרי את התשובה הנכונה והקריאי את ההסבר.
          - בשאלה השלישית — שאלי אם הם מכירים את התחושה.
      - slide:
          kicker: רגע ממשיגים! · 1 מתוך 3
          title: מהי תדמית דיגיטלית?
          points:
            - אין דבר כזה
            - מה שאני חושב/ת על מה שאני מפרסמ/ת ברשת
            - נוצרת כתוצאה מהדרך שבה אנחנו מציגים את עצמנו ברשת
