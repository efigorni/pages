sub: >-
  כולנו רוצים שיראו אותנו — גם ברשת. בשיעור הזה שומעים את הסיפור של זיו, שחילק סליים תמורת תגובות, מכירים
  שלוש מילים על הזהות שלנו ברשת, ומוצאים את הלייק שלא צריך לבקש מאף אחד.
format: סיפור, כתיבה אישית ומליאה
question: למה כל כך חשוב לנו שיראו אותנו ברשת — ואיך מרגישים מוערכים גם בלי לייקים?
takeaways:
  - הרצון שיראו אותנו ושנהיה שייכים טבעי לכולנו — וברשת הוא נמדד בלייקים ובתגובות.
  - ברשת רואים לרוב רק את הצדדים המלוטשים של אחרים, וההשוואה אליהם עלולה להעציב אותנו.
  - הלייק האמיתי הוא הלייק הפנימי — מה שאנחנו מעריכים בעצמנו, בלי אישור מבחוץ.
prep:
  - >-
    פתקים דביקים, וכותרת ״הלייק הפנימי של הכיתה״ על הקיר — להרחבה ״קיר הלייקים הפנימיים״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — לייקים, השוואה ברשת, ומקרה של ילד שהכיתה מתעלמת ממנו ושמשתתף במשחק
      אתגרים ברשת. שאלי אם יש בכיתה מי שנמצא עכשיו בשוליים החברתיים או מי שנפגע מפרסום, ואם ידוע על משחקי
      אתגר בשכבה. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שמתעלמים ממנו בכיתה עלול לזהות את עצמו בזיו (״זו לא פעם ראשונה שהילדים בכיתה מתעלמים ממני״).
      מדברים על מה שזיו הרגיש ועל מה שהכיתה שלו הייתה יכולה לעשות — לא על ״מי אצלנו כמו זיו״, ובלי ללעוג
      לו. מי שמשווה את עצמו לאחרים — הלייק הפנימי אישי, והדף נשאר אצלו.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. על משחקי אתגר ועל פרסומים בכיתה שלנו
      מדברים באופן כללי, בלי שמות ובלי פרטים. את הלייק הפנימי מקריאים רק מתנדבים. מותר לוותר, ולא קוראים
      בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל משחק אתגרים שקורה עכשיו, מתנה או תשלום תמורת לייקים, או תמונה מביכה שהופצה — עוצרים בעדינות,
      מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.
      אפשר להזכיר גם את מוקד 105, שמטפל בפגיעה ברשת.

