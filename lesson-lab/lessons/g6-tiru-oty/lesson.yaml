            - שאלה אחת שאשאל את עצמי לפני שאפרסם משהו.
            - רשות — משהו שהפתיע אותי היום.
          look_for: >-
            חפשי מי שמבין שמאחורי הלייקים יש צורך — להשתייך ולהרגיש שרואים אותו — לעומת ״זיו טיפש״, ושאלות
            לפני פרסום שאפשר באמת לשאול. פתק שמספר על משחק אתגרים, על תשלום תמורת לייקים או על פרסום פוגע —
            שיחה שקטה השבוע, ומה שנוגע בפגיעה עובר ליועצת עוד היום.
          timer: 180
          alt: דף כתוב, ועיפרון לידו
          art:
