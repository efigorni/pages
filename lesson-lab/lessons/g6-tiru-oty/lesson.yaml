            - {use: face-sad, x: 312, y: 62, w: 100}
            - {use: kid-stand, x: 450, y: 250, w: 130, color: teal}
      - quote:
          title: התשובה — 2. להקריא
          text: >-
            "השוואה חברתית באמצעות הרשת": החשיפה לשיתופים מלוטשים יוצרת 'השוואה חברתית באמצעות הרשת' ועלולה
