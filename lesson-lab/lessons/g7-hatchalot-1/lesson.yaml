steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: open
    title: כל מי ש…
    minutes: 6
    stance: true
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: ארבעה משפטים; כל מי שהמשפט נכון לגביו קם ואומר את שמו, ומתנדב אחד מוסיף משפט
    body:
      - slide:
          kicker: נכון לגביכם? קמים ואומרים את השם
          title: כל מי ש…
          points:
            - מגיע/ה לבית הספר באוטובוס
            - פיתח/ה תחביב מעניין בחופשה
            - חיכה/חיכתה לעלות לחטיבה
            - מרגיש/ה ״פרפרים של התרגשות בבטן״ לקראת התחלת החטיבה
          verbatim: [title, points]
          echo: true
          alt: דמות אחת קמה ומרימה יד, ושתי דמויות יושבות משני צדיה
          art:
            - {use: kid-sit, x: 24, y: 274, w: 160, color: purple}
            - {use: kid-hand, x: 226, y: 174, w: 170, color: orange}
            - {use: kid-sit, x: 436, y: 274, w: 160, color: teal, flip: true}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. הסבירי במשפט אחד, וחשפי משפט אחד בכל פעם.
          - אחרי כל משפט — חמש שניות של שקט, ורק אז קמים.
          - >-
            מי שעומד אומר את שמו, בשרשרת ומהר. שאלי אם מישהו מהעומדים רוצה להוסיף משפט — אחד מספיק — ויושבים.
          - אחרי המשפט הרביעי — שאלת סיכום, ועוברים למעגלים.
      - say: >-
          לפני כל משפט חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז קמים. מי שקם אומר רק את השם
          שלו. מותר גם להישאר לשבת.
      - ask: מה הפתיע אתכם — מי קם יחד איתכם?
      - say: עכשיו נכיר קצת יותר מקרוב — לא את כל הכיתה בבת אחת, אלא אחד־אחד.

  # ------------------------------------------------------------------ 6′–14′
  - id: circles
    title: נעים להכיר — שני מעגלים
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: שני מעגלים וזוגות מתחלפים — בכל החלפה אומרים את השם ומשלימים משפט; במליאה — מה שמעתם
    body:
      - slide:
          kicker: נעים להכיר · שני מעגלים
          title: אומרים את השם — ומשלימים את המשפט
          points:
            - מאכל שאני לא יכול/ה לעמוד בפניו…
            - דבר מצחיק / נחמד שקרה לי בחופשה…
            - משהו שאני מצפה לו בחטיבה…
            - חשוב לי שבכיתה שלנו יהיה…
          verbatim: [points]
          timer: 90
          echo: true
          alt: שני מעגלים של דמויות, מעגל בתוך מעגל, וכל דמות מול בן זוג
          art: {file: art/circles.svg}
      - moves:
          - >-
            הסבירי את המשחק לפני שקמים, ובדקי הבנה בשאלה אחת (״מה אומרים בכל החלפה?״). אחר כך הכיתה קמה
            ונעמדת בשני מעגלים, כל אחד מול בן זוג.
          - מי שנשאר בלי זוג — עומד מולך בסבב הראשון, ואחר כך נכנס למעגל.
          - >-
            חשפי משפט אחד בכל סבב. אחרי דקה וחצי — מחיאת כף, והמעגל הפנימי זז מקום אחד ימינה.
          - אחרי הסבב הרביעי חוזרים למקומות, ושומעים שניים־שלושה.
      - say: >-
          עכשיו מכירים בזוגות. בכל החלפה אומרים את השם, ומשלימים את המשפט שעל המסך — כל אחד בתורו.
      - task:
          what: >-
            בכל סבב עומדים מול בן זוג חדש. כל אחד בתורו אומר את שמו ומשלים את המשפט שעל המסך, והשני מקשיב
            עד הסוף. בסוף הסבב המעגל הפנימי זז מקום אחד ימינה.
          time: דקה וחצי לכל סבב, ארבעה סבבים
          group: זוגות מתחלפים, בשני מעגלים — או בשתי שורות זו מול זו
          rules: מקשיבים עד הסוף; מותר לבחור משפט אחר מהרשימה, או לומר רק את השם
          plenary: חוזרים למקומות, ושניים־שלושה מספרים מה מעניין שמעו
          help: תקועים? ספרו על משהו מהשבוע האחרון — מה אכלתם, מה שיחקתם, מה הצחיק אתכם?
          challenge: שאלו את בן הזוג שאלת המשך אחת, כמו ״למה דווקא זה?״, לפני שמתחלפים.
      - ask: מה מעניין שמעתם — ואיך היה לספר על עצמכם למי שעוד לא מכירים?

  # ------------------------------------------------------------------ 14′–19′
  - id: butterflies
    title: פרפרים של התחלה חדשה
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: כל אחד כותב מילה אחת — איך הוא מרגיש בהתחלה בחטיבה; סבב מילים, ומה עוזר להכיר חברים חדשים
    body:
      - slide:
          kicker: פרפרים של התחלה חדשה · מילה אחת
          title: כיצד אתם מרגישים היום, עם הגיעכם לחטיבה?
          sub: כתבו מילה אחת — ואחר כך נשמע את כולם.
          verbatim: [title]
          timer: 30
          echo: true
          alt: דמות עומדת, ושלושה פרפרים עפים סביבה
          art: {file: art/butterflies.svg}
      - moves:
          - >-
            חצי דקה לכתיבה, בשקט. אחר כך סבב מהיר לאורך השורות — כל אחד אומר את המילה שלו, בלי הסבר. מותר
            לומר ״עובר״.
          - רשמי את המילים על הלוח תוך כדי. מילה שחוזרת — סמני לידה קו.
          - שאלי מה רואים על הלוח, ותני מקום לכל המילים — גם לחשש ולמבוכה, לא רק לשמחה.
          - עברי לשאלה השנייה, ורשמי על הלוח שלוש־ארבע הצעות.
      - ladder:
          help: איזו מילה הכי קרובה למה שאתם מרגישים — חשש, התרגשות, סקרנות, מבוכה, שמחה? או מילה משלכם?
          challenge: כתבו שתי מילים שמרגישים יחד, כמו ״שמחה וקצת חשש״ — ומה גורם לכל אחת.
      - say: >-
          תסתכלו על הלוח — כמעט אף אחד לא מרגיש רק דבר אחד. ומה שאתם מרגישים, מרגישים גם אחרים כאן.
      - slide:
          kicker: פרפרים של התחלה חדשה
          title: מה יכול לעזור להכיר טוב יותר חברים חדשים?
          verbatim: [title]
          echo: true
          cue: אחרי סבב המילים —
          alt: גשר, ושתי דמויות הולכות זו לקראת זו על הגשר
          art:
            - {use: bridge, x: 130, y: 250, w: 360}
            - {use: kid-stand, x: 160, y: 130, w: 100, color: teal}
            - {use: kid-stand, x: 360, y: 130, w: 100, color: orange}
      - ask: מה יכול לעזור להכיר טוב יותר חברים חדשים?
      - say: אחת הדרכים היא לגלות מה משותף לנו — גם עם מי שלא הייתם מנחשים. בואו ננסה.

  # ------------------------------------------------------------------ 19′–27′
  - id: common
    title: 20 דברים משותפים
    minutes: 8
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: בשלשות מחפשים 20 דברים שנכונים לשלושה; בסבב דופק — המכנה המשותף הכי מפתיע, ולמה חיפשנו
    body:
      - slide:
          kicker: בשלשות · 5 דקות
          title: 20 דברים משותפים
          sub: דברים שנכונים לשלושתכם — ובסוף מסמנים את המפתיע ביותר.
          timer: 300
          echo: true
          alt: שלוש דמויות יחד, ודף לידן
          art:
            - {use: group3, x: 30, y: 232, w: 380}
            - {use: note, x: 436, y: 60, w: 150}
      - moves:
          - הסבירי לפני שמתחלקים, ובדקי הבנה בשאלה אחת (״מה נחשב משותף?״ — רק מה שנכון לשלושה).
          - >-
            חלוקה לשלשות בספירה לאורך השורות; מי שקיבלו אותו מספר יושבים יחד. דף אחד לשלשה — ויוצאים לדרך.
          - >-
            הסתובבי בין השלשות. שלשה שנתקעה — הציעי תחום (סדרות, מאכלים, חגים, משחקים). דקה לפני הסוף —
            הודיעי, ובקשי לסמן את המפתיע ביותר.
          - >-
            סבב דופק — כל שלשה אומרת משפט אחד. אחר כך שאלי למה חיפשנו מכנים משותפים, וחכי עשר שניות לפני
            שאת מזמינה תשובות. על כל תשובה — הדהדי, ושאלי מי מסכים ולמה.
      - say: >-
          מוצאים 20 דברים שנכונים לשלושתכם. אחרי הדברים הקלים צריך לשאול שאלות ולהכיר באמת — ושם מתחיל הכיף.
      - task:
          what: >-
            כל שלשה כותבת על דף דברים שנכונים לשלושתכם — תחביבים, ספורט, תנועת נוער, סרטים, סדרות, שירים,
            מאכלים. המטרה היא 20. בסוף מסמנים את המכנה המשותף הכי מפתיע.
          time: 5 דקות
          group: שלשות מעורבות, בספירה לאורך השורות
          rules: דף אחד לשלשה; מה שנכון רק לשניים — לא נחשב; שלשה שמגיעה ל־20 ממשיכה לחפש את המפתיע ביותר
          plenary: סבב דופק — כל שלשה מקריאה את המכנה המשותף הכי מפתיע שלה
          help: התחילו מהקל — מה אתם אוהבים לאכול, לשמוע, לראות, לשחק?
          challenge: מצאו משהו משותף שאי אפשר לנחש מבחוץ — הרגל, חלום, או משהו שמצחיק את שלושתכם.
      - slide:
          kicker: סבב דופק
          title: מה המכנה המשותף הכי מפתיע שמצאתם?
          echo: true
          cue: אחרי חמש דקות —
          alt: שלושה עיגולים חופפים, דמות בכל אחד, וכוכב במקום שבו שלושתם נפגשים
          art: {file: art/common.svg}
      - ask: מדוע, לדעתכם, התבקשתם לחפש מכנים משותפים בקבוצה?
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי מסכים? מי רוצה להוסיף?

  # ------------------------------------------------------------------ +5′
  - id: notes
    title: דרך אחת להכיר
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: כל זוג כותב על פתק דרך אחת להכיר מישהו חדש בכיתה, ותולה על הקיר
    body:
      - slide:
          kicker: אם נשאר זמן · בזוגות
          title: דרך אחת להכיר מישהו חדש בכיתה
          sub: משהו שאפשר לעשות כבר השבוע — על פתק, ולקיר.
          timer: 120
          echo: true
          alt: שתי ידיים מושטות זו לזו, ופתק לידן
          art:
            - {use: hands-help, x: 236, y: 90, w: 340}
            - {use: sticky, x: 40, y: 290, w: 170}
      - moves:
          - חלקי פתק לכל זוג, והפעילי את הטיימר.
          - זוג שנתקע — הפני אותו להצעות שעל הלוח, מ״פרפרים של התחלה חדשה״.
          - הזוגות תולים את הפתקים על הקיר. הקריאי בקול ארבעה־חמישה, ושאלי מי מוכן לנסות.
      - say: כתבו משהו שעושים — לא ״להיות נחמדים״, אלא מה בדיוק עושים, ומתי.
      - task:
          what: כל זוג כותב על פתק דרך אחת להכיר מישהו חדש בכיתה, ותולה אותו על הקיר.
          time: 2 דקות
          group: זוגות, עם השכן
          rules: משהו שאפשר לעשות כבר השבוע; בלי שמות של תלמידים
          plenary: קוראים בקול ארבעה־חמישה פתקים
          help: מה עזר לכם היום להכיר מישהו — במעגלים או בשלשות?
          challenge: מה אפשר לעשות בשביל מי שעוד לא מכיר אף אחד בכיתה?
      - ask: איזו הצעה מהקיר תנסו כבר מחר?

  # ------------------------------------------------------------------ +5′
  - id: learn
    title: מה חשוב לכם ללמוד השנה?
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: מה עושים בשיעורי הכ״חות שבדרך — ומה חשוב לכם ללמוד בהם השנה
    body:
      - slide:
          kicker: אם נשאר זמן · לבד, בזוגות, במליאה
          title: מה חשוב לכם ללמוד השנה בשיעורים האלה?
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          alt: דרך מתפתלת לאופק, וספר פתוח לידה
          art:
            - {use: road, x: 210, y: 130, w: 370}
            - {use: book, x: 40, y: 340, w: 180}
      - moves:
          - הציגי את השאלה, ואמרי במשפט אחד מה עושים בשיעורים האלה.
          - חצי דקה לבד, דקה בזוגות. אחר כך שמעי ארבעה־חמישה זוגות, ורשמי את הנושאים על הלוח.
      - say: >-
          בשיעורי הכ״חות שבדרך מדברים על מה שחשוב לנו כמתבגרים — רגשות, חברים, אתגרים — ומתרגלים דרכים
          להתמודד איתם.
      - ladder:
          help: איזה שיעור מכישורי חיים ביסודי זכור לכם במיוחד — ולמה?
          challenge: בחרו נושא אחד, והסבירו איך הוא יעזור לכם כבר החודש.
      - ask: מה חשוב לכם ללמוד השנה — ולמה דווקא זה?
      - say: אז מה שחשוב לך זה ___ — הבנתי נכון? למי עוד זה חשוב?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלושת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - טבעי שתרגישו רגשות שונים עם תחילת השנה בחטיבה – חשש בצד התרגשות גדולה.
            - זכרו – אתם לא לבד.
            - >-
              ביחד, במסגרת שיעורי הכ״חות שבדרך, נלמד מיומנויות שונות שיעזרו לנו בחיי היום יום: לשתף ברגשות
              ובחוויות הכרוכות בהתחלה החדשה, להכיר חברים, להתמודד עם אתגרים שונים בהצלחה. להיות בטוב עם עצמנו
              ובטוב בכיתה.
          ask: איזה משפט מהשלושה הכי נכון בשבילכם היום? חשבו רגע, ואז הצביעו.
          tip: >-
            הראשון והשני מחברים את מה שעלה על הלוח בסבב המילים למשפט ״אתם לא לבד״; השלישי מספר מה עושים
            בשיעורים האלה.
          alt: שלוש דמויות יחד
          art: group3

