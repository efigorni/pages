sub: >-
  כיתה חדשה, בית ספר חדש, הרבה פנים חדשות. בשיעור הזה קמים, מדברים בזוגות מתחלפים ומחפשים מה משותף
  לנו — ומגלים שאנחנו לא לבד עם הפרפרים בבטן.
format: מליאה, זוגות מתחלפים ושלשות
question: מה מרגישים בהתחלה חדשה — ומה עוזר להכיר את מי שלידנו?
takeaways:
  - בהתחלה חדשה טבעי להרגיש גם חשש וגם התרגשות — ואנחנו לא לבד בזה.
  - מכירים צעד אחרי צעד — בשיחה, בשאלה, ובחיפוש אחר מה שמשותף לנו.
  - לכל אחד לוקח זמן אחר להרגיש בנוח בקבוצה, וחשוב לכבד את זה.
prep:
  - >-
    מקום לשני מעגלים, פנימי וחיצוני, באמצע הכיתה — או לשתי שורות זו מול זו במעבר בין השולחנות. החליטי
    מראש איפה עומדים.
  - כמה שלשות יהיו בכיתה (מספר התלמידים חלקי שלוש) — עד המספר הזה סופרים בחלוקה לשלשות; ודף ריק לכל שלשה
  - פתקיות ונייר דבק לקיר (להרחבה ״דרך אחת להכיר״)

safe:
  - head: עמידה מול הכיתה
    text: >-
      ב״כל מי ש…״ קמים לפי עובדות אמיתיות מהחיים, ולכן נבחרו משפטים שלא מביכים — ירד ״נסע הקיץ לחופשה
      מחוץ לבית״, שמסמן מי לא נסע. מי שקם אומר רק את השם; מוסיפים משפט רק מתנדבים, ורק על עצמם. גם מי
      שהמשפט נכון לגביו רשאי להישאר לשבת. צחוק או הערה על מי שקם, או על מי שלא קם — עוצרים מיד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״דרך אחת להכיר״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - circles
      - common
    text: בשני המעגלים עושים שלושה סבבים במקום ארבעה, ובסבב הדופק משתפות רק שלוש שלשות

brain_break:
  signs: ראשים על השולחן, פיהוקים, או דיבורים שלא נרגעים אחרי התנועה במעגלים.
  ideas:
    - name: נשימת בלון
      text: >-
        יד על הבטן. שואפים לאט באף עד ארבע, והבטן מתנפחת כמו בלון; נושפים לאט בפה עד שש. חמש פעמים.
    - name: מחיאה בשרשרת
      text: מחיאת כף אחת עוברת מתלמיד לתלמיד לאורך השורות, כמה שיותר מהר. בסבב השני — בכיוון ההפוך.
    - name: שמונה באוויר
      text: עוצמים עיניים ומציירים באצבע שמונה גדולה באוויר — לאט, עשר פעמים, ואז ביד השנייה.
  from: learn

