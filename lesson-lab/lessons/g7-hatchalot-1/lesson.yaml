    summary: משהו חדש שגיליתי על מישהו, ומה יעזור לי להרגיש בנוח, ושורת רשות למורה; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: ההתחלה שלי
          prompts:
            - משהו חדש שגיליתי היום על מישהו בכיתה.
            - דבר אחד שיעזור לי להרגיש בנוח בכיתה החדשה.
            - רשות — משהו שחשוב לי שהמורה תדע על ההתחלה שלי.
          look_for: >-
            חפשי פתקים בלי ״משהו חדש״ על אף אחד, ופתקים שכתוב בהם שלא נוח — ומה חוזר ב״מה יעזור לי״. עם מי
            שנשמע בודד מדברים בשקט השבוע, ומה שנוגע בפגיעה עובר ליועצת עוד היום.
          timer: 180
          alt: דמות כותבת ליד שולחן, ודף לידה
          art:
