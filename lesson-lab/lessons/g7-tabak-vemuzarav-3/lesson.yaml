steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: know
    title: מה ידוע לי?
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      כשנכנסים, כל אחד כותב על שתי פתקיות — עובדה שהוא יודע על עישון ושאלה שמעניינת אותו — ומדביק על הלוח
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: מה ידוע לכם על עישון?
          sub: על פתקית אחת — עובדה שאתם יודעים. על השנייה — שאלה שמעניינת אתכם.
          timer: 120
          echo: true
          alt: שתי פתקיות — באחת נורה דולקת, ובשנייה סימן שאלה
          art:
            - {use: sticky, x: 330, y: 70, w: 220, color: teal}
            - {use: bulb, x: 390, y: 105, w: 100}
            - {use: sticky, x: 80, y: 250, w: 220, color: purple}
            - text: '?'
              x: 190
              y: 395
              size: 110
      - moves:
          - >-
            השקף על המסך כשהכיתה נכנסת, והפתקיות כבר על השולחנות. כותבים בלי הסבר נוסף; בזמן הכתיבה — נוכחות,
            ואז סיבוב בין השולחנות.
          - כל אחד מדביק את שתי הפתקיות על הלוח — עובדות מתחת ל״עובדות״, שאלות מתחת ל״שאלות״.
          - >-
            הקריאי בקול שלוש עובדות ושלוש שאלות. אל תתקני עכשיו — את העובדות בודקים בחידון, והשאלות נשארות על
            הלוח עד הסוף.
      - say: שתי דקות, לבד. כתבו מה שאתם יודעים — גם אם אתם לא בטוחים שזה נכון.
      - ladder:
          help: חשבו על משהו ששמעתם על עישון — בבית, בטלוויזיה או מחברים.
          challenge: כתבו שאלה שלדעתכם גם לחברים שלכם אין עליה תשובה.
      - ask: באילו עובדות שעל הלוח אתם בטוחים — ועל אילו כדאי לבדוק?

  # ------------------------------------------------------------------ 5′–15′
  - id: quiz
    title: נכון או לא נכון?
    minutes: 10
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      שבעה היגדים על טבק ומוצריו — כל אחד חושב לבד, ובספירה עד שלוש כולם מראים אגודל; אחרי כל הצבעה נחשפים
      התשובה וההסבר
    body:
      - slide:
          kicker: נכון או לא נכון? · כולם עונים יחד
          title: חושבים לבד — ובשלוש מראים אגודל
          sub: למעלה — נכון. למטה — לא נכון.
          echo: true
          alt: אגודל למעלה ואגודל למטה
          art:
            - {use: thumb-up, x: 340, y: 140, w: 200}
            - {use: thumb-down, x: 80, y: 180, w: 200}
      - moves:
          - הציגי היגד, ותני חמש שניות של שקט. בספירה עד שלוש — כולם מראים אגודל יחד.
          - ספרי בעין כמה אגודלים לכל צד, ורשמי בטבלה שעל הלוח.
          - חשפי את התשובה ואת ההסבר — לחיצה לכל שורה — ועברי להיגד הבא. כדקה להיגד.
          - אחרי ההיגד האחרון — הצביעי בטבלה על ההיגד שבו הכי הרבה טעו, ושאלי למה דווקא בו.
      - say: חושבים לבד, בלי להסתכל על השכנים — ורק בשלוש מראים. כך רואים מה כל אחד באמת חושב.
      - ladder:
          help: לא בטוחים? שאלו את עצמכם — מי מרוויח אם תאמינו להיגד הזה?
          challenge: בחרו היגד אחד, וחשבו איך הייתם בודקים אם הוא נכון.
      - slide:
          kicker: נכון או לא נכון? · 1 מתוך 7
          title: לעישון של שתיים או שלוש סיגריות ליום אין השפעה על הגוף.
          points:
            - לא נכון.
            - תוך שלוש שניות הלב פועם בחוזקה, ולחץ הדם עולה.
            - העשן מכניס לדם פחמן חד־חמצני במקום חמצן.
          verbatim:
            - title
          echo: true
          cue: ההיגד הראשון —
          alt: שעון גדול, ולב לידו
          art:
            - {use: clock, x: 250, y: 60, w: 290}
            - {use: heart, x: 60, y: 300, w: 170}
      - slide:
          kicker: נכון או לא נכון? · 2 מתוך 7
          title: הניקוטין הוא חומר הגורם להתמכרות.
          points:
            - נכון.
            - חוקרים שבדקו התמכרות לסמים קבעו שהניקוטין הוא סם ממכר.
            - מי שמנסה להפסיק לעשן מרגיש עצבנות, רגזנות וחשק עז לסיגריה.
          verbatim:
            - title
          echo: true
          cue: ההיגד הבא —
          alt: מנעול גדול, ומפתח לידו
          art:
            - {use: lock, x: 300, y: 70, w: 230}
            - {use: key, x: 60, y: 330, w: 190}
      - slide:
          kicker: נכון או לא נכון? · 3 מתוך 7
          title: הסיגריות מאפשרות להירגע.
          points:
            - לא נכון.
            - העישון הוא שיוצר בגוף את הצורך להירגע.
            - בלי ניקוטין הגוף נעשה עצבני ומתוח, והסיגריה רק מרגיעה את החוסר.
          verbatim:
            - title
          echo: true
          cue: ההיגד הבא —
          alt: דמות חושבת על סיגריה
          art:
            - {use: thought, x: 200, y: 30, w: 300, flip: true}
            - {use: cigarette, x: 270, y: 110, w: 150}
            - {use: kid-stand, x: 80, y: 230, w: 140, color: teal}
      - slide:
          kicker: נכון או לא נכון? · 4 מתוך 7
          title: בטבק שבנרגילה בטעם פירות יש כ־80% פרי.
          points:
            - לא נכון.
            - זו הטעיה מכוונת של יצרני הטבק.
            - מטפטפים על הטבק חומרי טעם וריח, כדי שלא נקשר את הריח הנעים לטבק.
          verbatim:
            - title
          echo: true
          cue: ההיגד הבא —
          alt: רימון גדול, וסיגריה לידו
          art:
            - {use: pomegranate, x: 280, y: 70, w: 260}
            - {use: cigarette, x: 60, y: 380, w: 160}
      - slide:
          kicker: נכון או לא נכון? · 5 מתוך 7
          title: סיגריה אלקטרונית מכילה בדרך כלל ניקוטין.
          points:
            - נכון.
            - בתוכה ניקוטין נוזלי, וסוללה שמחממת אותו והופכת אותו לאדים.
            - עדיין אין מחקרים ארוכי טווח על מה שהאדים האלה עושים לבריאות.
          verbatim:
            - title
          echo: true
          cue: ההיגד הבא —
          alt: זכוכית מגדלת, וסוללה לידה
          art:
            - {use: magnifier, x: 290, y: 70, w: 260}
            - {use: battery-full, x: 50, y: 340, w: 200}
      - slide:
          kicker: נכון או לא נכון? · 6 מתוך 7
          title: הניקוטין משפיע על המוח — במיוחד כשמעשנים בגיל ההתבגרות.
          points:
            - נכון.
            - בגיל ההתבגרות המוח עוד מתפתח.
            - ניקוטין בגיל הזה עלול לפגוע בזיכרון ובריכוז לאורך שנים.
          verbatim:
            - title
          echo: true
          cue: ההיגד הבא —
          alt: דמות, ומעליה ענן מחשבה ובו נורה דולקת
          art:
            - {use: thought, x: 200, y: 30, w: 300, flip: true}
            - {use: bulb, x: 300, y: 70, w: 100}
            - {use: kid-stand, x: 80, y: 230, w: 140, color: teal}
      - slide:
          kicker: נכון או לא נכון? · 7 מתוך 7
          title: ניתן לקבוע ולהקים פינת עישון מסודרת בבית הספר.
          points:
            - לא נכון.
            - החוק אוסר לעשן בכל שטח בית הספר, גם בחצר ובכניסה.
            - ויש גם חוק שמגביל פרסום ושיווק של מוצרי טבק.
          verbatim:
            - title
          echo: true
          cue: ההיגד האחרון —
          alt: בית ספר, וסיגריה לידו
          art:
            - {use: school, x: 260, y: 90, w: 300}
            - {use: cigarette, x: 60, y: 380, w: 160}
      - ask: באיזה היגד הכי הרבה טעו — ולמה דווקא בו?
      - say: >-
          את רוב המידע הזה מכירים כבר שנים — ובכל זאת יש בני נוער שמתחילים לעשן. למה?

  # ------------------------------------------------------------------ 15′–19′
  - id: despite
    title: למרות הכול
    minutes: 4
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: למה, למרות הידע, האזהרות והחוקים, יש בני נוער שמתחילים לעשן? לבד, בזוגות ובמליאה
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: למה, למרות הכול, יש בני נוער שמתחילים לעשן?
          sub: למרות הידע, האזהרות על הקופסאות והחוקים.
          echo: true
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          alt: ספר פתוח, ולידו עמוד שלטים שמצביעים לכיוונים שונים
          art:
            - {use: signpost, x: 340, y: 90, w: 230}
            - {use: book, x: 60, y: 260, w: 240}
      - moves:
          - שאלי, וחכי 20 שניות של שקט.
          - דקה בזוגות — כל זוג מוצא שתי סיבות.
          - שמעי ארבעה–חמישה זוגות, ורשמי את הסיבות בצד הלוח. על כל סיבה — ״מי מסכים? מי חושב אחרת?״
      - ladder:
          help: חשבו על בני נוער בגילכם — מה הם רוצים להרגיש, ומה העישון מבטיח להם?
          challenge: אם כולם יודעים שזה מזיק — מה חסר במידע, כדי שישפיע?
      - ask: אילו סיבות מצאתם? מי מסכים — ומי חושב אחרת?
      - say: >-
          אז מה יגרום למידע לעבוד? עכשיו תנסו בעצמכם — עם אזהרה אחת מקופסת סיגריות.

  # ------------------------------------------------------------------ 19′–27′
  - id: poster
    title: פוסטר לאזהרה אחת
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      בקבוצות — בוחרים אזהרה אחת מקופסת סיגריות שבעיניכם היא סיבה טובה לא לעשן, ומעצבים לה פוסטר; תולים על
      הקיר
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הדפים; ההוראות על המסך כל הזמן.
          - חלקי לכל קבוצה דף אזהרות, דף גדול וטושים.
          - הסתובבי בין הקבוצות. אחרי דקה — ודאי שכל קבוצה כבר בחרה אזהרה. דקה לפני הסוף — הודיעי.
          - כל קבוצה תולה את הפוסטר על הקיר, ונציג אומר במשפט אחד למה בחרו דווקא בה.
      - slide:
          kicker: בקבוצות · 5 דקות
          title: איזו אזהרה הכי משכנעת אתכם לא לעשן?
          sub: בחרו אחת מהדף ועצבו לה פוסטר עם כותרת, ציור ומשפט אחד.
          timer: 300
          echo: true
          alt: דף גדול עם סימן קריאה, ועיפרון לידו
          art:
            - {use: note, x: 200, y: 50, w: 240}
            - text: '!'
              x: 320
              y: 260
              size: 130
            - {use: pencil, x: 400, y: 300, w: 180}
      - say: >-
          בקבוצות לפי השולחנות. כל קבוצה בוחרת אזהרה אחת — זו שבעיניכם הכי משכנעת לא לעשן — ומעצבת לה פוסטר.
      - task:
          what: >-
            כל קבוצה בוחרת מהדף אזהרה אחת, שהיא בעיניה סיבה טובה לבחור לא לעשן, ומעצבת לה פוסטר — כותרת, ציור
            ומשפט אחד שמסביר.
          time: 5 דקות — דקה לבחירה, ארבע לפוסטר
          group: קבוצות של 4–5 לפי השולחנות
          rules: >-
            בוחרים יחד, לא בהצבעה; כל אחד אחראי על חלק — כותרת, ציור או משפט; מי שמסיים מוקדם מוסיף לפוסטר
            שאלה לקורא
          plenary: תולים על הקיר, ונציג אומר במשפט אחד למה בחרו דווקא בה
          help: איזו אזהרה מפחידה אתכם יותר — זו על הבריאות שלכם, או זו על האנשים הקרובים אליכם?
          challenge: כתבו את האזהרה במילים שבני נוער באמת היו עוצרים לקרוא — בלי לשנות את העובדה.
      - handout:
          title: אזהרות מקופסאות סיגריות
          copies: עותק לכל קבוצה
          verbatim: true
          lines: false
          items:
