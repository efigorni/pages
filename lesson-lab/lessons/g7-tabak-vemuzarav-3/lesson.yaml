  - id: exit
    title: כרטיס יציאה — מיתוס ועובדה
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
    summary: מיתוס אחד ומה נכון במקומו, ושאלה שנשארה — על שתי פתקיות, ליד הפתקיות מתחילת השיעור
    body:
      - moves:
          - הציגי את השאלות, והפעילי את הטיימר.
          - בסוף — אספי את הפתקיות מהלוח, כדי לקרוא אותן אחרי השיעור.
      - say: >-
          שתי שאלות, שתי פתקיות — אחת לכל שאלה. כותבים לבד, שלוש דקות, ומדביקים על הלוח ליד הפתקיות מתחילת השיעור.
      - exit:
          form: sticky
          title: מיתוס ועובדה
          prompts:
            - מיתוס אחד על עישון שהתברר היום כלא נכון — ומה נכון במקומו.
            - שאלה שעוד נשארה לי, או משהו שהפתיע אותי.
          look_for: >-
            חפשי מיתוסים שעוד נשארו (״נרגילה פחות מזיקה״, ״סיגריה אלקטרונית לא ממכרת״) ושאלות שחוזרות על עצמן — הן
            מראות מה עוד לא הובן. השווי בין השאלות מתחילת השיעור לשאלות שבסופו.
          timer: 180
          alt: שתי פתקיות דביקות — כתומה וסגולה
          art:
            - {use: sticky, x: 200, y: 30, w: 260}
            - {use: sticky, x: 50, y: 250, w: 260, color: purple}
