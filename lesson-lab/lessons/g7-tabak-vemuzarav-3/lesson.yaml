sub: >-
  על עישון מסתובבים הרבה מיתוסים — על נרגילה בטעם פירות, על סיגריה אלקטרונית, ועל ״רק כמה סיגריות״. בשיעור
  הזה בודקים מה אנחנו יודעים, מבחינים בין מיתוס לעובדה, ומעצבים פוסטר לאזהרה אחת.
format: מליאה, זוגות וקבוצות
question: מה באמת ידוע על טבק ומוצריו — ואיך מבחינים בין מיתוס לעובדה?
takeaways:
  - הרבה ממה ש״כולם יודעים״ על עישון הוא מיתוס — למשל שנרגילה בטעם פירות היא בעיקר פרי.
  - הניקוטין ממכר, גם בסיגריה אלקטרונית, ומשפיע במיוחד על המוח בגיל ההתבגרות.
  - מידע אמין עוזר להבחין בין שמועה לעובדה, ולבחור במה שטוב לי.
prep:
  - פתקיות דביקות בשני צבעים — שתיים לכל תלמיד, על השולחנות לפני שהכיתה נכנסת
  - >-
    על הלוח, לפני השיעור: שתי כותרות — ״עובדות״ ו״שאלות״ — עם מקום לפתקיות; וטבלה לחידון: מספרי ההיגדים
    1–7, טור ״נכון״ וטור ״לא נכון״
  - דף גדול וטושים לכל קבוצה, לפוסטר

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״אל תהיה שפן
    ניסיונות״; פחות — ישר ל״חשוב לזכור״.
