safe:
- head: תיאום עם היועצת
  text: תאמי מראש כיצד לפנות לשיחה אישית בעקבות הכללה ודעה קדומה. הכיני אפשרות לצאת לזמן קצר בליווי מבוגר מוכר.
- head: מי עלול להיפגע
  text: ההתבוננות במראה חיצוני עלולה להציף סטריאוטיפים. עצרי אמירה פוגענית מיד; אל תבקשי לנחש מוצא, דת, יכולת
    או אופי של המצולמים.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על אדם או על דמות דמיונית, לכתוב במקום לדבר או לעבור. אין מבקשים פרטים אישיים או שמות של
    ילדים.
- head: אם מישהו משתף פגיעה
  text: הודי לו על האמון, עצרי שאלות מהכיתה והמשיכי בפרטיות עם היועצת; אל תבטיחי סודיות כשנדרשת הגנה. המבוגרים
    אחראים לטפל בפגיעה.
