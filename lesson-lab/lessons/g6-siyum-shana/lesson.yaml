steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: recall
    title: רגע נזכרים
    minutes: 7
    practices:
      - תרגילי שליפה
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: >-
      בלי עזרים, כל אחד כותב את השיעורים והנושאים שהוא זוכר מכישורי חיים השנה; אחר כך רואים את הנושאים
      ומשלימים בצבע אחר; במליאה — איזה שיעור הכי זכור, ולמה
    body:
      - whisper: >-
          השנה עסקו שיעורי ״הכ״חות שבדרך״ בכיתה ו׳, בין השאר, באושר (״מהו אושר?״, ״מוסיפים אושר לחיים״,
          ״אני היוצר של חיי״), ביעדים ובניהול זמן (״כל יעד מתחיל בחלום״), בייצוג עצמי (״מזהים כישורים וקשיים
          ומשתפים״, ״לומדים לייצג את עצמנו״, מודל פתר״תי), בקבלת החלטות (מודל וסגנונות), בתוכנית ״לצמוח
          ולגדול״, במעבר לחטיבת הביניים, באחריות (״עומדים לצד ולא מהצד״) ובמוגנות ברשת (״תראו אותי!״, ״רשת של
          חברים״). מי שהצטרף באמצע השנה או החסיר הרבה — כותב על כל שיעור שזכור לו מהשנה, או עובד בזוג עם
          חבר.
      - slide:
          kicker: רגע נזכרים · לבד, בלי עזרים
          title: אילו שיעורים אתם זוכרים מהשנה?
          sub: כתבו כל שיעור או נושא מכישורי חיים שעולה לכם — מהזיכרון.
          timer: 120
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובו לוח שנה
          art:
            - {use: thought, x: 24, y: 24, w: 290}
            - {use: calendar, x: 122, y: 88, w: 100}
            - {use: kid-desk, x: 300, y: 140, w: 288, color: teal}
      - moves:
          - הציגי את השקף. שתי דקות של כתיבה מהזיכרון — עוד לא מראים שום רשימה.
          - אחרי שתי דקות — הציגי את הנושאים, הקריאי אותם, ותני דקה להשלים בצבע אחר.
          - שאלי איזה שיעור הכי זכור להם, ולמה. שמעי שלוש־ארבע תשובות.
      - say: >-
          כתבו מהזיכרון — עוד לא מסתכלים במחברת ולא בשום מקום אחר. מה שלא זוכרים — זה בסדר; בעוד שתי דקות
          נראה את הנושאים, ותשלימו בצבע אחר.
      - slide:
          kicker: רגע נזכרים · משלימים בצבע אחר
          title: הדרך שעברנו השנה
          points:
            - אושר, חוזקות ויעדים
            - ייצוג עצמי וקבלת החלטות
            - לצמוח ולגדול, ומעברים
            - אחריות ומוגנות ברשת
          echo: true
          cue: אחרי שתי דקות של כתיבה —
          alt: לוח שנה גדול, וסימן וי בפינתו
          art:
            - {use: calendar, x: 150, y: 100, w: 320}
            - {use: check, x: 100, y: 320, w: 150}
      - ladder:
          help: חשבו על פעילות שעשינו — משחק, סרטון או עבודה בקבוצה. על מה היא הייתה?
          challenge: ליד כל שיעור שכתבתם — מילה אחת על מה שלמדתם בו.
      - ask: איזה שיעור אתם הכי זוכרים — ולמה דווקא אותו?

  # ------------------------------------------------------------------ 7′–15′
  - id: triads
    title: מסכמים שנה — בשלשות
    minutes: 8
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      כל אחד בוחר את השיעור שהיה הכי משמעותי בשבילו, וכותב מה הפך אותו למשמעותי ומה למד ממנו; בשלשות —
      כל אחד מספר
    body:
      - slide:
          kicker: מסכמים שנה · לבד, בכתב
          title: השיעור שהיה הכי משמעותי בשבילכם
          sub: מה הפך אותו למשמעותי — ומה למדתם ממנו?
          timer: 120
          echo: true
          alt: ספר פתוח, וכוכב מעליו
          art:
            - {use: book, x: 60, y: 220, w: 330}
            - {use: star, x: 410, y: 60, w: 150}
      - moves:
          - הציגי את השקף. שתי דקות של כתיבה לבד.
          - עוברים לשלשות לפי החלוקה שהכנת. ארבע דקות — כל אחד מספר על השיעור שבחר, ועל מה שלמד ממנו.
          - הסתובבי בין השלשות, ובדקי שכל אחד מקבל תור. דקה לפני הסוף — הודיעי.
      - say: >-
          בחרו שיעור אחד מהשנה — שהיה הכי משמעותי בשבילכם, או שאתם זוכרים היטב. כתבו מה היה בו שהפך אותו
          למשמעותי, ומה למדתם ממנו.
      - task:
          what: >-
            כל אחד בוחר שיעור אחד שהיה המשמעותי ביותר בשבילו — או שהוא זוכר היטב — וכותב מה הפך אותו למשמעותי
            ומה למד ממנו. אחר כך, בשלשות, כל אחד מספר על השיעור שבחר ועל מה שלמד ממנו.
          time: 2 דקות לכתיבה, 4 דקות בשלשה
          group: לבד ← שלשות לפי השולחנות
          rules: >-
            כל אחד מקבל תור של בערך דקה; מקשיבים בלי לשפוט, ומספרים רק על עצמנו; מי שהחסיר הרבה שיעורים — בוחר
            רגע מהשנה בכיתה
          plenary: ממשיכים לשיחה במליאה — מה גילינו על עצמנו
          help: קשה לבחור? הסתכלו בנושאים שעל המסך, ובחרו את השיעור שעלה לכם ראשון בראש.
          challenge: כתבו גם איפה השתמשתם במה שלמדתם — בבית, עם חברים או בכיתה.
      - slide:
          kicker: מסכמים שנה · בשלשות
          title: ספרו על השיעור שבחרתם
          sub: ועל מה שלמדתם ממנו — כל אחד בתורו.
          timer: 240
          echo: true
          cue: אחרי שתי דקות של כתיבה —
          alt: שלוש דמויות יחד, ובועת דיבור ובה ספר
          art:
            - {use: group3, x: 40, y: 230, w: 380}
            - {use: speech-l, x: 380, y: 24, w: 220}
            - {use: book, x: 440, y: 60, w: 100}
      - say: עכשיו בשלשות — כל אחד מספר על השיעור שבחר. מקשיבים עד הסוף, ורק אז שואלים.

  # ------------------------------------------------------------------ 15′–19′
  - id: discuss
    title: מה גילינו על עצמנו
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: במליאה — מה אנחנו לומדים על עצמנו מהתשובות, ואילו נקודות דמיון עלו בשלשות
    body:
      - slide:
          kicker: שתפו מהלמידה האישית ומהעבודה בקבוצה
          title: מה אתם לומדים על עצמכם מהתשובות שכתבתם?
          sub: ויש נקודות דמיון בין החוויות בשלשה שלכם?
          echo: true
          alt: דמות עומדת, וזכוכית מגדלת לידה
          art:
            - {use: magnifier, x: 50, y: 170, w: 240}
            - {use: kid-stand, x: 330, y: 150, w: 170, color: teal}
      - moves:
          - שאלי את השאלה הראשונה, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב לה — ״למי עוד זה קרה? מי גילה משהו אחר?״
          - עברי לשאלה השנייה — מה היה דומה בשלשות — ושמעי שתיים־שלוש תשובות.
      - ask: מה אתם לומדים על עצמכם מהתשובות שכתבתם?
      - say: אז מה שגילית על עצמך זה ___ — הבנתי נכון? מי גילה משהו דומה?
      - ask: האם יש נקודות דמיון בין החוויות של חברי הקבוצה? מהן?

  # ------------------------------------------------------------------ 19′–26′
  - id: sheet
    title: סיכום תהליך אישי
    minutes: 7
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: >-
      כל אחד ממלא דף אישי של חמישה ריבועים — מה למד על עצמו, התנהגויות, מחשבות, כוחות, ומה הוא בוחר לקראת
      החטיבה — ומסמן ריבוע אחד לשתף
    body:
      - slide:
          kicker: עבודה אישית · 6 דקות
          title: סיכום תהליך אישי
          points:
            - התבוננו בדף וקראו את כל חלקיו.
            - מלאו באופן אישי על עצמכם את כל אחד מהריבועים בדף.
            - בחרו איזה ריבוע אתם רוצים להציג בפני הכיתה.
          verbatim: true
          timer: 360
          echo: true
          alt: דף עם שורות, ועיפרון לידו
          art:
            - {use: note, x: 150, y: 40, w: 256}
            - {use: pencil, x: 380, y: 290, w: 200}
      - moves:
          - חלקי את הדף, והציגי את השקף. שש דקות של כתיבה בשקט.
          - הסתובבי בין השולחנות. מי שתקוע — הפני אותו למה שכתב לפני השלשה.
          - דקה לפני הסוף — בקשי מכל אחד לסמן ריבוע אחד, שממנו הוא מוכן לומר משפט לכיתה.
      - say: הדף הזה שלכם, והוא נשאר אצלכם. בסוף כל אחד יסמן ריבוע אחד — שממנו הוא מוכן לומר משפט לכיתה.
      - say: מחשבות מקדמות הן מחשבות שעוזרות לנו להתקדם — למשל ״אם אתאמן, אצליח״.
      - ladder:
          help: התחילו בריבוע שהכי קל לכם, ומלאו לפחות שלושה.
          challenge: בריבוע ״לקראת המעבר לחטיבת הביניים״ — כתבו גם מה או מי יעזור לכם.
      - handout:
          title: סיכום תהליך אישי
          copies: עותק לכל תלמיד
          verbatim: true
          items:
            - דברים חדשים שלמדתי על עצמי....
            - התנהגויות חדשות שלמדתי...
            - מחשבות מקדמות חדשות שיצרתי לעצמי....
            - כוחות שגיליתי שקיימים בי...
            - לקראת המעבר לחטיבת הביניים אני בוחר/ת...

  # ------------------------------------------------------------------ 26′–30′
  - id: round
    title: משפט אחד לכיתה
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: חצי דקה לבחור, ואז סבב — כל אחד אומר משפט אחד מהריבוע שסימן; מותר לעבור
    body:
      - slide:
          kicker: סבב · כל הכיתה
          title: משפט אחד מהריבוע שסימנתם
          sub: בלי הסבר ובלי תגובות — ומותר לעבור.
          echo: true
          alt: ארבעה סביב שולחן עגול, ובועות צ׳אט מעליהם
          art:
            - {use: circle4, x: 60, y: 200, w: 300}
            - {use: chat, x: 360, y: 40, w: 230}
      - moves:
          - חצי דקה של שקט — כל אחד בוחר משפט אחד מהריבוע שסימן.
          - סבב לפי סדר הישיבה. כל אחד אומר רק את המשפט — הנהני לו, בלי תגובות.
          - מי שאומר ״עובר״ — ממשיכים הלאה בלי שאלות.
          - בסוף הסבב — שאלה אחת לכל הכיתה.
      - say: >-
          חצי דקה בשקט — בחרו משפט אחד מהריבוע שסימנתם. בסבב כל אחד אומר רק את המשפט, ומותר לעבור.
      - ask: מה שמעתם בסבב שהפתיע אתכם — או שהזכיר לכם את עצמכם?

  # ------------------------------------------------------------------ +5′
  - id: chosen
    title: השיעורים שבחרנו
    kind: extension
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      נציג מכל שלשה אומר אילו שיעורים בחרו חבריה; רושמים על הלוח ושואלים מה משותף לשיעורים שנבחרו הכי הרבה
    body:
      - slide:
          kicker: אם נשאר זמן · מפת השנה של הכיתה
          title: אילו שיעורים בחרנו — ולמה?
          sub: מה משותף לשיעורים שנבחרו הכי הרבה?
          echo: true
          alt: לוח, ועליו סימן וי
          art:
            - {use: board, x: 80, y: 110, w: 400}
            - {use: check, x: 230, y: 170, w: 100}
      - moves:
          - נציג מכל שלשה אומר אילו שיעורים נבחרו אצלם. רשמי על הלוח, וסמני קו ליד שיעור שחוזר.
          - שאלי מה משותף לשיעורים שנבחרו הכי הרבה, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הזמיני את הכיתה להגיב — ״מי מסכים? מי בחר שיעור אחר, ולמה?״
      - ask: מה משותף לשיעורים שנבחרו הכי הרבה — ולמה, לדעתכם, דווקא הם?
      - say: אז מה שהפך את השיעורים האלה למשמעותיים זה ___ — הבנתי נכון? מי רואה את זה אחרת?

  # ------------------------------------------------------------------ +5′
  - id: clouds
    title: מסכמים שיעור
    kind: extension
    minutes: 5
    practices:
      - זמן חשיבה
