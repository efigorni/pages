src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/6Grade/Mamlachti/Siyum_Shana.pptx
sensitivity: low

sub: >-
  השנה נגמרת, ובשנה הבאה מחכה חטיבת הביניים. בשיעור הזה נזכרים בשיעורים של השנה, בוחרים את השיעור
  שהכי השפיע עלינו, ומסכמים על דף אישי מה לקחנו מהשנה — ומה ניקח איתנו הלאה.
format: כתיבה אישית, שלשות ומליאה
question: מה למדנו השנה על עצמנו — ומה ניקח איתנו לחטיבת הביניים?
takeaways:
  - כשמתבוננים אחורה, מגלים כמה למדנו וכמה השתנינו במהלך השנה.
  - לכל אחד יש דברים חדשים שלמד על עצמו — התנהגויות, מחשבות וכוחות.
  - לקראת חטיבת הביניים, כל אחד יכול לבחור מה לקחת איתו הלאה.
prep:
  - חלוקה מראש לשלשות לפי השולחנות

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 15 דקות ומעלה — שתי ההרחבות; 10–14 דקות — רק ״השיעורים שבחרנו״;
    פחות — ישר לכרטיס היציאה.
  short:
    steps:
      - triads
      - round
    text: >-
      בשלשות מדלגים על הכתיבה המקדימה וכל אחד מספר בקצרה; ובסבב משתפים רק מתנדבים, חמישה–שישה

brain_break:
  signs: תשובות של מילה אחת, ראשים על השולחן, קושי להתחיל לכתוב.
  ideas:
    - name: מחיאות בקצב
      text: מחאי כפיים בקצב קצר, והכיתה חוזרת אחרייך. ארבעה סבבים, ובכל סבב קצב אחר.
    - name: גלגולי כתפיים
      text: קמים, מגלגלים את הכתפיים חמש פעמים קדימה וחמש פעמים אחורה, ומנערים את הידיים.
    - name: ספירה לאחור
      text: עוצמים עיניים וסופרים בלב מעשר עד אחת — נשימה ארוכה אחת בכל מספר.
  from: clouds

