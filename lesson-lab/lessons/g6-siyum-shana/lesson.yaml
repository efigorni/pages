# מתבוננים אחורה וקדימה — כיתה ו׳, סיום וסיכום שנה, שיעור 2 (מקור: sources/text/6/Siyum_Shana.md)
# חלופה ל״המסע שלי השנה״ (g6-sium-shana) באותה משבצת — המורה בוחרת אחד מהשניים.
slug: g6-siyum-shana
title: מתבוננים אחורה וקדימה
grade: 6
grades_served: [6]
month: יוני
section: מיומנויות לחיזוק כוחות וחוסן להתנהלות מיטבית בשגרה ובחירום (יוני)
unit: סיום וסיכום שנה
unit_order: 2
unit_size: 2
