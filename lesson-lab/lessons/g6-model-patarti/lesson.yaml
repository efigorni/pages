sub: >-
  לבקש עזרה זו מיומנות שאפשר ללמוד. בשיעור הזה פוגשים את מאור, לומדים ארבעה צעדים לפנייה — ומתרגלים
  אותם, בשביל מאור ובשבילנו.
format: סרט, כתיבה לפי ארבעה צעדים, זוגות ומליאה
question: איך מבקשים עזרה או התחשבות — בצורה ברורה ומכבדת?
takeaways:
  - ייצוג עצמי הוא מיומנות שאפשר ללמוד ולתרגל — וכל אחד מסוגל לייצג את עצמו.
  - ארבעת הצעדים של פתרת״י — פונים, מתארים את הקושי, מבקשים, ואומרים תודה.
  - כשמזהים קושי, מתארים אותו במילים ומבקשים עזרה — הסיכוי להתמודד איתו גדל.
prep:
  - חלוקה מראש לזוגות לפי השולחנות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — בקשת עזרה, ובסרט ילד עם קושי בקריאה שהסובבים כועסים עליו. שאלי מי בכיתה
      עלול לזהות את עצמו במאור — לקות למידה, קשב, או מבוגרים שכועסים — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שמתקשה בקריאה או בריכוז עלול להרגיש חשוף כשמדברים על מאור — מדברים על מה שמאור צריך, לא על ״מי
      בכיתה כמוהו״. יש תלמידים שקשה להם במיוחד לפנות למבוגר — מצניעות, ביישנות, מבוכה, חינוך או תרבות.
      מותר להם לבקש בדרך שלהם, בקצב שלהם ובסגנון שלהם.
  - head: לא לוחצים לשתף
    text: >-
      כללי השיח של המקור על המסך לפני העבודה בזוגות. בוחרים אירוע שנוח לספר עליו — רצוי גם כזה שלא קשור
      ללימודים; הכתיבה נשארת במחברת. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל מבוגר שפגע, או בקשת עזרה שנענתה בכעס או בהשפלה — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית
      אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״דרכים נוספות
    לייצוג עצמי״; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - appeal
      - mine
    text: >-
      בפנייה למאור רק שניים מקריאים, ובהצלחה מהעבר כותבים רק את הפנייה החדשה ומספרים בזוג — בלי מליאה

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
