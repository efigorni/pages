steps:
  # ------------------------------------------------------------------ 0′–9′
  - id: maor
    title: מאור לא מספר
    minutes: 9
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      צופים בקטע מהסרט ״אני אואב אותך״ — למאור קשה לקרוא, והוא לא מספר לאף אחד; בזוגות חושבים למה, ומה
      יכול לעזור לו
    body:
      - moves:
          - השקף ״לפני שצופים״ על המסך כשהכיתה נכנסת. שאלי, ושמעי שתיים־שלוש תשובות.
          - הפעילי את הסרט מההתחלה, ועצרי בנקודת העצירה לשאלה.
          - אחרי הצפייה — שאלה אחת בזוגות, ואז שלושה–ארבעה זוגות במליאה.
      - video:
          title: אני אואב אותך
          url: https://video.kotar.co.il/VideoContent/convertedflv/beinzilzulim/aniohevotah.mp4#t=0,324
          length: "13:28"
          clip:
            end: "5:24"
          before: למה לפעמים לא מספרים לאף אחד שקשה לנו?
          watch: שימו לב למאור — מה קשה לו, ואיך האנשים סביבו מגיבים.
          pauses:
            - at: "?"
              moment: >-
                הרגע הראשון שבו מישהו כועס על מאור — מורה, אמא או חבר — רגע לפני שמאור עונה. צפי בקטע לפני
                השיעור, ורשמי כאן את הזמן.
              ask: מה מאור מרגיש עכשיו — ומה הוא לא אומר? מילה אחת, בלחישה לשכן.
          alt: דמות יושבת מול ספר פתוח, וענן גשם מעליה
          art:
            - {use: rain-cloud, x: 96, y: 54, w: 150}
            - {use: kid-sit, x: 70, y: 220, w: 190, color: purple}
            - {use: book, x: 300, y: 330, w: 230, color: orange}
      - p: >-
          הקישור פותח את קובץ הסרט, ובדרך כלל הנגן עוצר בו לבד בסוף הקטע. אם הקישור לא נפתח — הסרט נמצא גם
          באתר ״בין הצלצולים״ של מט״ח.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: למה לדעתכם מאור לא מספר לאף אחד שקשה לו?
          echo: true
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          cue: אחרי הצפייה —
          alt: דמות יושבת, ומעליה ענן מחשבה ובתוכו מנעול
          art:
            - {use: thought, x: 60, y: 30, w: 300}
            - {use: lock, x: 160, y: 76, w: 104}
            - {use: kid-sit, x: 390, y: 236, w: 170, color: purple}
      - ladder:
          help: מה מאור מרגיש כשהוא לא מצליח לקרוא — וממה הוא חושש אם יספר?
          challenge: למי מאור יכול לפנות — ומה כדאי שיגיד לו קודם?
      - say: מאור לא מספר — ולכן אף אחד סביבו לא מבין אותו. בואו נלמד ארבעה צעדים שעוזרים לבקש עזרה.

  # ------------------------------------------------------------------ 9′–14′
  - id: model
    title: ארבעה צעדים לפנייה
    minutes: 5
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: >-
      ארבעה צעדים לפנייה — פנייה, תיאור הקושי, בקשה ותודה — עם משפטים לדוגמה; הכיתה מזהה אותם בדוגמה של
      המקור
    body:
      - ask: אם מאור היה ניגש למורה שלו — מה הוא צריך להגיד קודם?
      - slide:
          kicker: עכשיו לומדים — מודל פתרת״י
          title: ארבעה צעדים לפנייה
          points:
            - פנייה — ״יש לך כמה דקות בשבילי?״
            - תיאור הקושי — ״יש לי בעיה…״
            - בקשה — ״מאוד יעזור לי אם…״
            - תודה — ״אני מודה לך שהקשבת לי.״
          echo: true
          alt: מדרגות של ארבעה צעדים, דמות בתחתית ודגל בראש
          art: {file: art/steps.svg}
      - moves:
          - לפני שאת מציגה את הצעדים — שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות. שמעי שתיים־שלוש.
          - חשפי את ארבעת הצעדים אחד־אחד, והקריאי את המשפט לדוגמה של כל צעד. חלקי את דף הצעדים.
          - בשקף הדוגמה — חשפי משפט אחר משפט, ואחרי כל משפט הכיתה אומרת איזה צעד זה.
      - slide:
          title: איזה צעד זה?
          points:
            - אני מבקש/ת לשוחח אתך על העבודה שביקשת להגיש.
            - יש לי בעיה, להגיש את… כי יש לי השבוע הופעה חשובה בחוג ויש הרבה חזרות
            - מאוד יעזור לי, אם תאפשר/י להגיש את העבודה בשבוע הבא
            - אני מודה לך שהקשבת לי.
          verbatim:
            - points
          echo: true
          cue: אחרי ארבעת הצעדים —
          alt: תלמיד ומורה זה מול זה, ומעל התלמיד בועה ובתוכה לוח שנה
          art:
            - {use: teacher, x: 90, y: 214, w: 145, color: moss}
            - {use: kid-stand, x: 390, y: 228, w: 140, color: teal}
            - {use: speech, x: 300, y: 26, w: 230}
            - {use: calendar, x: 368, y: 48, w: 94}
      - handout:
          title: שלבי מודל פתרת״י
          copies: עותק לכל תלמיד — נשאר אצלו
          verbatim: true
          lines: false
          items:
            - >-
              פנייה למורה: אני מבקש/ת לשוחח אתך על… האם תוכל/י להקדיש לי מספר דקות כדי ל…
            - >-
              תיאור הקושי: אני מתקשה ב… יש לי בעיה ש…
            - >-
              תיאור הבקשה: אני מציע/ה ש… אולי ננסה את הדרך… אולי כדאי… מאוד יעזור לי אם…
            - >-
              אמירת תודה: אני מודה לך שהקשבת לי…
            - >-
              דוגמה לסנגור עצמי בנושא לימודי — פנייה למורה: אני רוצה לדבר אתך על שיעורי הבית בשפה. תיאור
              הקושי: כשאני צריכה לחפש בסיפור תשובות לשאלות, אני מתבלבלת וכל המילים קופצות לי מול העיניים.
              תיאור הבקשה: כשאת כותבת לי באילו שורות כדאי לי לחפש רמז לתשובה, זה מאוד עוזר לי. אמירת תודה:
              אני מודה לך מאוד על ההקשבה ועל הנכונות לעזור לי.
      - say: ארבעה צעדים — פונים, מתארים את הקושי, מבקשים, ומודים. עכשיו ננסה אותם — בשביל מאור.

  # ------------------------------------------------------------------ 14′–20′
  - id: appeal
    title: פנייה בשביל מאור
    minutes: 6
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
    summary: >-
      כל אחד בוחר דמות מהסרט שיכולה לעזור למאור, וכותב לה פנייה בשמו לפי ארבעת הצעדים; שניים־שלושה
      מקריאים
    body:
      - slide:
          kicker: תרגול · לבד, בכתב
          title: בחרו דמות שיכולה לעזור למאור
          sub: כתבו לה פנייה בשמו של מאור — משפט לכל צעד.
          points:
            - אמא יקרה…
            - למורה…
            - לחבר שלי…
            - ליועצת…
          verbatim:
            - points
          timer: 180
          echo: true
          alt: דף ועיפרון, ודמות יושבת לידם
          art:
            - {use: note, x: 250, y: 60, w: 210}
            - {use: pencil, x: 420, y: 300, w: 160}
            - {use: kid-sit, x: 40, y: 254, w: 170, color: purple}
      - moves:
          - >-
            כל אחד בוחר דמות אחת וכותב לה במחברת פנייה בשמו של מאור — ארבעה משפטים, משפט לכל צעד. דף הצעדים
            על השולחן.
          - הסתובבי וקראי מעבר לכתפיים. מי שתקוע — הפני אותו למשפטים לדוגמה בדף.
          - שניים־שלושה מקריאים את הפנייה שלהם. אחרי כל הקראה — שאלי את הכיתה איזה צעד הכי חזק בה, ולמה.
      - say: כתבו כאילו אתם מאור — ארבעה משפטים. פונים, מתארים את הקושי, מבקשים, ומודים.
      - task:
          what: >-
            בוחרים דמות מהסרט שיכולה לעזור למאור — אמא, המורה, חבר או היועצת — וכותבים לה פנייה בשמו של מאור,
            לפי ארבעת הצעדים: משפט לכל צעד.
          time: 3 דקות כתיבה, 2 דקות הקראה
          group: לבד
          rules: כותבים בגוף ראשון, כאילו אתם מאור; אפשר להיעזר במשפטים שבדף
          plenary: שניים־שלושה מקריאים, והכיתה אומרת איזה צעד הכי חזק
          help: >-
            השלימו את המשפטים מהדף — ״יש לך כמה דקות בשבילי?״, ״יש לי בעיה…״, ״מאוד יעזור לי אם…״, ״תודה…״
          challenge: כתבו סיום לסרט — מאור פונה לדמות שבחרתם לפי ארבעת הצעדים. מה היא עונה לו?
      - ask: איזה צעד הכי חזק בפנייה ששמענו — ולמה?
      - say: תרגלנו בשביל מאור. עכשיו — בשביל עצמנו.

  # ------------------------------------------------------------------ 20′–27′
  - id: mine
    title: הצלחה מהעבר
    minutes: 7
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: >-
      לפני שמשתפים — כללי השיח; כל אחד נזכר בפעם שביקש עזרה וקיבל, מנסח את הפנייה מחדש לפי ארבעת הצעדים,
      ומספר בזוג
    body:
      - slide:
          kicker: לפני שמשתפים
          title: הנחיות לשיח מיטבי
          sub: שיח מעודד ומקבל
          points:
            - שיתוף מהלב
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
          verbatim: true
          echo: true
          alt: שלוש דמויות, ומעליהן בועת דיבור עם לב
          art:
            - {use: group3, x: 140, y: 268, w: 340}
            - {use: speech, x: 318, y: 28, w: 230}
            - {use: heart, x: 383, y: 58, w: 100}
      - p: הקריאי את הכללים, נקודה אחר נקודה — עכשיו כל אחד מספר על עצמו.
      - slide:
          kicker: מתבוננים לאחור, נזכרים בעצמנו
          title: פעם שביקשתם עזרה — וקיבלתם
          sub: מה רציתם? מה היה קשה? נסחו את הפנייה מחדש לפי ארבעת הצעדים.
          timer: 180
          echo: true
          cue: אחרי הכללים —
          alt: שתי ידיים מושטות זו לזו, ועיגול עם וי
          art:
            - {use: hands-help, x: 140, y: 170, w: 330}
            - {use: check, x: 450, y: 40, w: 130}
      - moves:
          - שלוש דקות לבד — כותבים מה רצו להשיג ומה היה הקושי, ומנסחים את הפנייה מחדש לפי ארבעת הצעדים.
          - הזכירי — אפשר גם אירוע שלא קשור ללימודים, בחוג, בבית או עם חברים.
          - בזוגות — כל אחד מספר למי פנה, מה אמר ואיך הגיבו לו, ומקריא את הפנייה החדשה.
          - שמעי זוג או שניים במליאה — מה היו משנים היום בפנייה שלהם.
      - say: >-
          נזכרים בפעם שביקשתם עזרה — וקיבלתם. כתבו מה רציתם ומה היה קשה, ונסחו את הפנייה מחדש כמו שלמדנו.
      - task:
          what: >-
