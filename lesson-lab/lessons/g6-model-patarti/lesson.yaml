      text: יד אחת מראה אגודל והשנייה זרת, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
    - name: מתיחה בשלוש
      text: קמים, מותחים ידיים למעלה, מתכופפים לימין ולשמאל, ובספירה עד שלוש מתיישבים.
