  # ------------------------------------------------------------------ 25′–30′
  - id: procrustes
    title: המיטה של פרוקרוסטס ואנחנו
    minutes: 5
    practices:
      - זמן חשיבה
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: משל המיטה שמתאימה את האורחים לגודלה — ומה בעצם עושים איתנו טרנדים של יופי
    body:
      - slide:
          kicker: מהמסע בעולם למסע אל עצמנו
          title: המיטה של פרוקרוסטס
          sub: מה הקשר בין הסיפור לתפיסת היופי?
          verbatim: true
          echo: true
          alt: מיטת ברזל אחת, וחץ כפול מעליה — מידה אחת לכולם
          art: {file: art/bed.svg}
      - quote:
          title: הסיפור — להקריא
          text: >-
            המיתולוגיה היוונית מספרת על פרוקרוסטס, שעט על העוברים בדרך לאתונה ופיתה אותם להתארח בפונדק שלו.
            האורחים הוזמנו לארוחה וללינה במיטת הקסם שלו העשויה ברזל. למיטה, כך אמר, יש יכולת להתאים את עצמה
            בדיוק לגודל האדם השוכב עליה. אם אורחיו של פרוקרוסטס היו ארוכים מן המיטה הוא היה קוצץ את חלקיהם
            המיותרים. אם הם היו קטנים ממנה הוא היה מותח אותם עד שיתאימו.
      - moves:
          - הקריאי את הסיפור ושאלי. חכי עשר שניות לפני שאת מזמינה תשובות.
          - >-
            אחרי שתיים־שלוש תשובות — הציגי את השאלה הבאה: חצי דקה לבד, דקה בזוגות, ושניים־שלושה זוגות
            במליאה.
      - whisper: >-
          המשל הוא על כל ניסיון לצמצם אנשים לסטנדרט אחד ולאידיאל גוף אחד. ובכל זאת — לא מבטלים ולא מקטינים
          את הצורך בהשתייכות; רק עוזרים לכל אחד למצוא את הקול שלו.
      - ask: מה הקשר בין הסיפור לתפיסת היופי?
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: למה אנחנו מאמצים טרנדים שאנחנו לא אוהבים?
          sub: היזכרו בכל מיני תפיסות של יופי שפגשתם בשנים האחרונות
          verbatim: [sub]
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי כמה תשובות על הסיפור —
          alt: קבוצה גדולה, ודמות אחת לידה חושבת
          art:
            - {use: crowd, x: 260, y: 280, w: 320}
            - {use: kid-stand, x: 60, y: 220, w: 130, color: teal}
            - {use: thought, x: 150, y: 110, w: 180, flip: true}
            - text: '?'
              x: 250
              y: 180
              size: 64
      - ladder:
          help: חשבו על טרנד אחד — שפתיים, בגד או תסרוקת. למה כל כך הרבה מאמצים אותו?
          challenge: >-
            מה יקרה אם לא תאמצו אותו — ומה אפשר לעשות כשמזהים תפיסת יופי שלא מתאימה לכם?
      - say: >-
          הרצון להיות כמו כולם ולהשתייך מובן, וגם חשוב. החוכמה היא לשלב — להיות מי שאני, וגם להשתייך.

