steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: open
    title: מהו יופי?
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כל אחד כותב הגדרה אישית ליופי; אחרי הנחיות השיח שומעים שלוש הגדרות שונות
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: מהו יופי?
          sub: אם יכולתם להגדיר את המושג יופי בכמה משפטים, איך הייתם מגדירים אותו?
          verbatim: true
          timer: 180
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובו כוכב
          art:
            - {use: kid-desk, x: 300, y: 170, w: 260, color: teal}
            - {use: thought, x: 170, y: 24, w: 220}
            - {use: star, x: 236, y: 66, w: 90}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת. כותבים במחברת, בלי הסבר נוסף ובלי חיפוש ברשת.
          - >-
            בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש הגדרות שונות זו מזו — לא דווקא
            את זו שהכי דומה למילון.
          - לפני ששומעים — הציגי את הנחיות השיח.
          - הזמיני את שלושת הכותבים לשתף, ושאלי מה אפשר ללמוד מכך שיצאו הגדרות שונות כל כך.
      - say: שלוש דקות, לבד ובשקט. אין הגדרה נכונה — רק שלכם. שמרו אותה, נחזור אליה בהמשך השיעור.
      - ladder:
          help: השלימו את המשפט ״אנשים יפים תמיד…״ — ובדקו אם אתם מסכימים איתו.
          challenge: האם יופי הוא משהו שרואים, או משהו שמרגישים? הוסיפו דוגמה שאינה אדם.
      - slide:
          kicker: לפני שמשתפים
          title: הנחיות לשיח מיטבי
          sub: שיח מעודד ומקבל
          points:
            - שיתוף מהלב
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
          verbatim: true
          echo: true
          cue: אחרי שלוש דקות, לפני ששומעים —
          alt: ארבעה סביב שולחן, ושתי בועות צ׳אט מעליהם
          art:
            - {use: circle4, x: 120, y: 210, w: 300}
            - {use: chat, x: 380, y: 30, w: 210}
      - ask: >-
          נשמע שלושה — איך הגדרתם יופי? ומה אפשר ללמוד מזה שיצאו לנו הגדרות שונות כל כך?

  # ------------------------------------------------------------------ 6′–10′
  - id: kintsugi
    title: שבור זה יפה?
    minutes: 4
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: קערה שבורה שתוקנה בזהב — מול הגדרת היופי של ויקיפדיה; האם יפה חייב להיות מושלם?
    body:
      - slide:
          kicker: מה הקשר?
          title: מה הקשר בין קערה שבורה ליופי?
          echo: true
          alt: קערה לבנה, וסדקים מודבקים בזהב
          art: {file: art/kintsugi.svg}
      - moves:
          - הציגי את הקערה ושאלי. חכי חמש שניות לפני שאת מזמינה השערות, ושמעי שתיים־שלוש.
          - הקריאי את קטע המידע על הקינצוגי.
          - >-
            הציגי את ההגדרה של ויקיפדיה כניגוד, ושאלי את השאלה השנייה. הזמיני תלמידים להגיב זה לזה — ״מי
            חושב אחרת?״
      - ask: מה הקשר בין קערה שבורה ליופי?
      - quote:
          title: קינצוגי, ״חיבור מוזהב — שבור זה יפה״ — להקריא
          text: >-
            לפי הפילוסופיה היפנית, מה שנסדק לא הולך לפח. במקום להצניע את קווי התיקון בתקווה שלא יראו אותם,
            משתמשים בדבק צבוע בזהב כדי להבליט את החיבור. הפגמים הופכים ליתרונות אסתטיים מכֻוונים ומספרים
            את סיפורו של החפץ.
      - slide:
          kicker: קינצוגי · מול ויקיפדיה
          title: האם משהו צריך להיות מושלם כדי להיות יפה?
          sub: לפי ויקיפדיה, יופי הוא איזון, סימטריה, פרופורציה והרמוניה.
          echo: true
          cue: אחרי ההקראה —
          alt: מאזניים מאוזנים
          art:
            - {use: scale, x: 140, y: 120, w: 340}
      - quote:
          title: ההגדרה של ויקיפדיה — להקריא
          text: >-
            על פי רוב, היופי מוגדר כמאפיין אובייקט (כולל עצמים חיים) ומבנה שיש בו איזון, סימטריה, פרופורציה
            והרמוניה בין מרכיביו השונים.
      - ask: >-
          האם כדי שמשהו ייחשב יפה הוא צריך להיות מושלם? והאם זה נכון גם לתפיסות של בני הגיל שלכם?

  # ------------------------------------------------------------------ 10′–21′
  - id: journey
    title: מסע בעקבות היופי
    minutes: 11
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      כל קבוצה מקבלת אופנה אחת מתקופה ומקום אחרים, ודנה בה לפי ארבע שאלות; במליאה — המסע לפי סדר הזמנים,
      והתובנות ממנו
    body:
      - say: >-
          דרך הקינצוגי הצצנו לתפיסת היופי ביפן. עכשיו נצא לטיול קצר בזמן ובעולם — כל קבוצה מקבלת אופנה
          אחת.
      - slide:
          kicker: מסע בעקבות היופי · בקבוצות
          title: אופנה שעבר זמנה
          sub: קראו את הכרטיס, ודברו עליו לפי השאלות שעל הלוח.
          timer: 240
          alt: ארבעה סביב שולחן, ודף מידע לידם
          art:
            - {use: circle4, x: 150, y: 170, w: 300}
            - {use: note, x: 460, y: 40, w: 130}
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הכרטיסים; ארבע השאלות כבר על הלוח.
          - חלקי כרטיס אופנה אחד לכל קבוצה. בכיתה עם שש קבוצות — אפשר לוותר על כרטיס שנות ה־2000 במערב.
          - הסתובבי בין הקבוצות. דקה לפני הסוף — בקשי מכל קבוצה לבחור תשובה אחת שהכי הפתיעה אותה.
          - >-
            במליאה — לפי סדר הזמנים, מהמאה ה־15 ועד שנות ה־2000: כל קבוצה אומרת מה האופנה ומה הפתיע אותה,
            ואת מציגה את התמונה שלה מהמצגת המקורית.
      - board:
          - מה לדעתכם היו הגורמים שהשפיעו על התפתחות האופנה הזו במקום ובזמן שבו היא התפתחה?
          - מה דעתכם על האופנה הזו? את מי היא משרתת?
          - מה היא משמרת?
          - האם ניתן לראות גם באופנה של ימינו השפעות דומות?
      - task:
          what: >-
            קוראים בקול את כרטיס האופנה, ודנים בארבע השאלות שעל הלוח. בסוף בוחרים תשובה אחת שהכי הפתיעה
            אתכם.
          time: 4 דקות
          group: קבוצות של 4–5 לפי השולחנות; כרטיס אחד לכל קבוצה
          rules: אחד מקריא, וכולם עונים; מי שמסיים מוקדם — עונה גם על שאלת האתגר
          plenary: נציג מכל קבוצה — מה האופנה, ומה הכי הפתיע אתכם; חצי דקה
          help: מי היה צריך להיראות כך — ומה קרה למי שלא?
          challenge: האם לאופנה הזו הייתה השפעה שווה על גברים ועל נשים? מי הרוויח ממנה, ומי שילם?
      - handout:
          title: כרטיסי אופנה
          copies: עותק אחד, גזור לשבעה כרטיסים — כרטיס לכל קבוצה
          verbatim: true
          lines: false
          items:
            - >-
              המאה ה-15 וה-16 — גברים בני המעמד הגבוה לבושים נעלי עקב, גרביונים, שמלות וחצאיות. מדוע לבשו
              נעלי עקב? בני המעמד הגבוה לבשו זאת, גברים, ונשים על מנת לא להתלכלך מלכלוך ברחוב. (התחיל בשנת
              3500 לפני הספירה במצרים העתיקה אצל כוהני דת לצורך טקסים וכן אצל קצבים להרחיק את הדם של החיה
              מכפות הרגליים).
            - >-
              סוף המאה ה-19 — הכלות המואבסות של תוניס: שתי ביצים בבוקר, חלב, שמן דגים, שמן זית עם עראק,
              דייסת דוחן, אטריות עבות לניפוח הגוף, תבשילי עדשים וקטניות, קמח, שמנים ועוגות - זה היה התפריט של
              הנערות בקהילות היהודיות בטוניסיה, 40 יום לפני שהתחתנו. ״כשמתקרב גיל הנישואין שבו גברים עשירים
              מחפשים אותן, הנערות היהודיות חולמות להשמין. משום שככל שהאישה כבדה יותר, כך היא תביא יותר כבוד
              לבעלה. ויש לה סיכוי רב יותר לבחור בעל לטעמה״
            - >-
              ראשית המאה ה-20 — כריכת רגליים או ״רגלי לוטוס״ (״שאנזו״ - מילולית ״רגליים כרוכות״) הוא שמו של
              מנהג שהיה נפוץ בסין עד ראשית המאה ה-20, בו קשרו רגלי ילדות צעירות (לרוב בגילאי 7-4) על מנת
              למנוע את גדילתן ולהעניק להן מראה שייחשב אידיאל של יופי. כריכת בד סביב הרגל כשהיא מקובצת הביאה
              לשבירת עצמות הרגל, ושמירת גודלה של הרגל כך שלא יעלה על 10 - 15 ס״מ. כריכה זו ניוונה, עיוותה
              ועיקמה את כפות הרגליים.
            - >-
              שנות ה-70 של המאה ה-20 — אופנה שהתאפיינה באנדרוגיניות, צבעוניות ומגדריות פלואידית.
            - >-
              שנות ה-80 של המאה ה-20 — מאלט הוא הכינוי לתסרוקת שבה השיער באחורי הראש נותר ארוך (בדרך כלל עד
              לגובה הכתפיים), ואילו בקדמת הראש, בקודקודו ובצדדיו הוא מקוצץ. המאלט הייתה פופולרית במיוחד בעולם
              המערבי, באמריקה הלטינית ובישראל בסוף שנות השבעים, לאורך שנות השמונים ובתחילת שנות התשעים של
              המאה ה-20. אף שהמאלט צברה פופולריות בשנות השבעים, יש הטוענים שהתסרוקת הייתה קיימת קודם לכן.
              אגדות אורבניות מספרות כי במאה ה-19 דייגים לא קיצצו את אחורי ראשיהם על מנת לחמם את עורפיהם
              בחורף, ומכאן הכינוי ״מאלט״ (באנגלית: מולית, סוג של דג-ים).
            - >-
              2000 — שבט ארוכות הצוואר שנמצא בכפר נאי סוי בצפון תאילנד, הוא שבט הזוכה לביקורי תיירים מידי
              יום, זאת משום שברצונם לחזות בנשות השבט העונדות לצווארן טבעות פליז רבות. מהו אורח החיים של שבט
              ארוכות הצוואר? לפי המסורת, עוד בהיותן ילדות, עונדים לצווארן טבעות פליז בטקס ייחודי בו משתתפים
              בני הכפר. יחד עם התקדמות גילן, כך עולה מספר הטבעות.
            - >-
              שנות ה- 2000 (בעולם המערבי) — האופנה ייצגה תקופה של התנסות ואינדיבידואליות. קיים ערבוב של כל
              הסגנונות. אין סגנון אחד ברור. יש שחזור של טרנדים מהעשורים הקודמים. כל אחד יכול לבטא את עצמו.
              כמו כן, האפנה מטשטשת בין גבריות לנשיות ומציגה נזילות מגדרית. בתקופה נכנסו לאופנה חולצות הבטן
              והג׳ינס בגזרה הנמוכה והסקיני.
      - source_slide:
          slides: [13, 14, 15, 16, 17, 18, 19]
          why: >-
            בשקפים 13–19 של המצגת המקורית יש תמונה לכל אחת משבע האופנות, ולידה המידע שבכרטיס. כשקבוצה
            מציגה — הציגי את התמונה שלה. הכותרות שם אומרות ״שקופית נסתרת״, אבל השקפים מוצגים כרגיל; כדי לקפוץ
            לשקף מסוים, הקלידי את המספר שלו ולחצי על מקש ההזנה.
          alt: מחשב נייד — עוברים למצגת המקורית
      - ask: >-
          אם עוד עשר שנים תתבקשו לתאר את האופנה של ימינו בחברה המערבית, מה הייתם כותבים?
      - slide:
          kicker: בחזרה ממסע היופי
          title: מה התובנות שלנו מהמסע בזמן בנוגע לתפיסת היופי?
          verbatim: [title]
          points:
            - יופי — לא מושג קבוע ומוחלט
            - הוא משתנה לפי תקופה, תרבות, כסף ומגדר
            - אפשר להתבונן באופנה בעין ביקורתית
          echo: true
          cue: כשכל הקבוצות סיימו להציג —
          alt: זכוכית מגדלת, ולוח שנה לידה
          art:
