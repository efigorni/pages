  - id: quotes
    title: צידה לדרך
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
    summary: כל אחד בוחר משפט אחד מתוך שישה, ומכניס אותו להגדרת היופי שלו
    body:
      - slide:
          kicker: אם נשאר זמן · צידה לדרך
          title: בוחרים צידה לדרך...
          sub: הכניסו את המשפט שבחרתם להגדרת היופי שלכם
          verbatim: true
          timer: 120
          echo: true
          alt: דמות, ומעליה בועת דיבור ובה כוכב
          art:
            - {use: speech-l, x: 220, y: 24, w: 300}
            - {use: star, x: 320, y: 70, w: 100}
            - {use: kid-stand, x: 120, y: 270, w: 120, color: teal}
      - moves:
          - חלקי דף משפטים לכל זוג, והקריאי את ששת המשפטים בקול.
          - כל אחד בוחר משפט אחד שהוא מסכים איתו, ומכניס אותו להגדרה שלו — שתי דקות.
          - שניים־שלושה מספרים איזה משפט בחרו, ולמה.
      - handout:
          title: צידה לדרך
          copies: עותק לכל זוג
          verbatim: true
          lines: false
          items:
            - >-
              ״תהיו מאושרים עם עצמכם. תאהבו את הפגמים שלכם. תקבלו את המוזרויות שלכם ותדעו שאתם מושלמים כמו
              כל אחד אחר – בדיוק כפי שאתם״ (אריאנה גרנדה)
            - ״הדרך בה אני נראית היא רק חלק אחד של הזהות שלי״ (מייגן ראמזי)
            - >-
              ״אני חושב שכולנו מוזרים – אולם, אינני חושב שזה דבר שלילי. לדעתי, כולנו צריכים לפאר ולהדגיש את
              האינדיבידואליות שלנו ולא להתבייש בה״ (ג׳וני דפ)
            - >-
              ״אני מאמינה שזה לא משנה איך אנחנו נראים, כל עוד אנחנו מאושרים מכך. אך במידה ועדיין יש משהו
              שהיינו רוצים לשפר – חשוב לעשות זאת רק לאחר שאנחנו באמת מעריכים את עצמנו ואת מי שאנחנו״ (אדל)
            - >-
              ״אני אוהבת את עצמי. אני אוהבת את הסיפור שלי ואת כל המהמורות והפצעים שלי כי זה מה שמייחד אותי״
              (מישל אובמה)
            - >-
              ״שמתי לב כי כולם תמיד רוצים את מה שאין להם. אך, בסופו של יום, מה שיש לנו מבפנים – הרבה יותר
              יפה מאשר מה שיש לנו מבחוץ״ (סלינה גומז)
      - say: >-
          כשמשהו לא מתאים לנו, אנחנו יודעים לעצור ולשאול שאלות. ביופי ובמראה — הרבה פעמים פחות. בחרו משפט
          שיעזור לכם לשאול.
      - ladder:
          help: איזה משפט הייתם רוצים לשמוע ביום שבו אתם לא אוהבים את איך שאתם נראים?
          challenge: עם איזה משפט אתם לא מסכימים — ולמה?

