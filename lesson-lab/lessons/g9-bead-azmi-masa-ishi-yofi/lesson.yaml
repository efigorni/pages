  # D58 — ״והביאה לשיתוקן״ מוגזם; שאר המשפט נשאר
  - from: ועיקמה את כפות הרגליים והביאה לשיתוקן.
    to: ועיקמה את כפות הרגליים.

sub: >-
  יופי נראה לנו מובן מאליו. בשיעור הזה כל אחד מגדיר מהו יופי, יוצא למסע בין אופנות מתקופות ומקומות
  אחרים, ובודק מה מכל זה באמת שלו.
format: כתיבה אישית, קבוצות ומליאה
question: מי קובע מה יפה — ואיך אני בוחר מה מתאים לי?
takeaways:
  - יופי הוא לא דבר אחד וקבוע — הוא משתנה לפי תקופה, תרבות, כסף ומגדר.
  - אפשר להסתכל על טרנד בעין ביקורתית, ולשאול את מי הוא משרת.
  - הרצון להשתייך מובן — ואפשר להשתייך וגם להיות מי שאני.
prep:
  - ארבע השאלות של ״מסע בעקבות היופי״ — כתובות על הלוח לפני השיעור
  - חלוקה מראש לשש–שבע קבוצות לפי השולחנות, ואיזה כרטיס אופנה מקבלת כל קבוצה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — יופי, אופנה ודימוי גוף. שאלי אם יש בכיתה מי שהנושא קרוב אליו מדי: מי
      שמתמודד עם הפרעת אכילה או עם דימוי גוף פגוע, מי שצוחקים עליו בגלל המראה, או מי שעובר שינוי גופני
      בולט. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      שני כרטיסי אופנה קשים — ההשמנה של הכלות בתוניס וכריכת הרגליים בסין. תני אותם לקבוצות שיכולות לשאת
      אותם, ושימי לב לפנים כשמציגים את התמונות. מדברים על אופנות ועל מפורסמים, אף פעם לא על המראה של מישהו
      בכיתה — גם לא כמחמאה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. הגדרת היופי נשארת במחברת — משתפים
      רק מתנדבים, ורק מה שהם בוחרים. מותר לוותר, ולא קוראים בשם למי שלא הצביע. בכרטיס היציאה כותבים רק
      מה שנוח.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל הקנטות קבועות על המראה, דיאטה קיצונית או פגיעה עצמית — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 15 דקות ומעלה — שתי ההרחבות; 10–14 דקות — רק ״צידה לדרך״;
    פחות — ישר לכרטיס היציאה.
  short:
