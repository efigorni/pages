steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: memory
    title: בחרי מסלול — זיכרון מהיסודי
    minutes: 7
    summary: כל אחד בוחר זיכרון אחד מבית הספר היסודי, ומתנדבים משתפים אחרי תזכורת לכללי השיח
    body:
      - tracks:
          - title: תמונות על הרצפה
            text: >-
              כרטיסי תמונות פרושים על הרצפה. כל אחד בוחר תמונה שמזכירה לו חוויה מהיסודי, וחוזר איתה למקום.
            when: >-
              הדפסת מראש את כרטיסי התמונות שבסוף המצגת המקורית, או שהתלמידים הביאו תמונה מהבית — ויש מקום לפרוס.
            practices:
              - מה הקשר?
            spotlights:
              - עניין ורלוונטיות
              - אחריות ובחירה
            prep:
              - >-
                כרטיסי התמונות שבסוף המצגת המקורית (למידה, הפסקות, חברות, טיולים, מסיבת סיום, מורים ועוד) — מודפסים,
                יותר מכרטיס אחד לכל תלמיד, ופרושים על הרצפה לפני השיעור
            body:
              - slide:
                  kicker: תמונות מבית הספר היסודי
                  title: בחרו תמונה שמזכירה לכם חוויה מהיסודי
                  sub: חוויה, שיעור, טיול או יום שיא — שזכורים לכם במיוחד.
                  echo: true
                  alt: שלוש תמונות פרושות — בית ספר, שני חברים ושמש
                  art: {file: art/photos.svg}
              - moves:
                  - הכרטיסים פרושים על הרצפה לפני שהכיתה נכנסת. כל אחד עובר, בוחר כרטיס אחד וחוזר למקום.
                  - מי שהביא תמונה מהבית — מניח אותה ליד הכרטיסים, ובוחר בה.
                  - דקה וחצי להסתכל על התמונה ולחשוב — מה קרה שם, ואיך הרגשתי.
              - ladder:
                  help: מה רואים בתמונה — ומתי היה לכם ביסודי רגע דומה?
                  challenge: מה הייתם רוצים לומר לילד שהייתם אז?
              - ask: מה התמונה שבחרתם מסמלת בשבילכם?
          - title: זיכרון בכתב
            text: >-
              השקף מחכה על המסך כשנכנסים. כל אחד כותב במחברת זיכרון אחד מבית הספר היסודי — ולמה דווקא הוא נשאר.
            when: אין תמונות מוכנות, או שרוצים פתיחה שקטה — מתחילים לכתוב עוד לפני שמדברים.
            practices:
              - קדימה ללמידה
              - כולם כותבים
            spotlights:
              - עניין ורלוונטיות
              - הערכה ורפלקטיביות
            body:
              - slide:
                  kicker: קדימה ללמידה · לבד, בכתב
                  title: זיכרון אחד מבית הספר היסודי
                  sub: חוויה, שיעור, טיול או יום שיא — ולמה דווקא הוא נשאר איתכם.
                  timer: 180
                  echo: true
                  alt: דמות כותבת ליד שולחן, ובענן המחשבה מעליה בית ספר
                  art:
                    - {use: thought, x: 24, y: 20, w: 320}
                    - {use: school, x: 88, y: 80, w: 160}
                    - {use: kid-desk, x: 352, y: 200, w: 240}
              - moves:
                  - השקף על המסך כשהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
                  - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שניים־שלושה זיכרונות שונים זה מזה.
              - ladder:
                  help: חשבו על מקום אחד בבית הספר — החצר, הכיתה, הספרייה. מה קרה שם?
                  challenge: מה הזיכרון הזה מספר על מה שחשוב לכם?
              - say: שלוש דקות, לבד ובשקט. זיכרון אחד — מה קרה, ולמה דווקא הוא נשאר.
      - slide:
          kicker: לפני שמשתפים
          title: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          alt: בועת דיבור גדולה, ובתוכה לב
          art:
            - {use: speech, x: 150, y: 70, w: 320}
            - {use: heart, x: 245, y: 118, w: 130}
      - moves:
          - הציגי את ארבעת הכללים, והדגישי אחד — לא צוחקים ולא מלגלגים על תמונות או סיפורים של אחרים.
          - הזמיני שניים־שלושה מתנדבים לספר על הזיכרון שלהם.
      - say: >-
          לפני שמשתפים — ארבעה כללים שלנו. ואחד חשוב במיוחד היום: לא צוחקים ולא מלגלגים על תמונה או סיפור של אף
          אחד.
      - ask: מי רוצה לספר על הזיכרון שלו — מה קרה שם, ואיך הרגשתם?

  # ------------------------------------------------------------------ 7′–12′
  - id: then
    title: מה אהבתי — ומה השתנה?
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: בזוגות מספרים על הזיכרון, ועונים יחד — מה אהבנו ביסודי, ובמה שונה החטיבה; במליאה — הגעגוע והמעבר
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה אהבתם ביסודי — ובמה שונה החטיבה?
          points:
            - לבד — 20 שניות
            - בזוגות — הזיכרון שלכם, ואז התשובה
            - במליאה
          echo: true
          alt: בית ספר קטן ורחוק, חץ, ובית ספר גדול וקרוב
          art:
            - {use: school, x: 410, y: 50, w: 180}
            - {use: arrow, x: 286, y: 200, w: 132, color: gray}
            - {use: school, x: 30, y: 230, w: 320}
      - moves:
          - דקה וחצי בזוגות, עם השכן — כל אחד מספר על הזיכרון או על התמונה, ואחר כך עונים יחד על השאלה.
          - במליאה — שמעי שלושה־ארבעה זוגות. על כל תשובה — הדהדי, ושאלי מי הרגיש אחרת.
          - סכמי במשפט את המעבר, ותני לגעגוע מקום.
      - ladder:
          help: מה עשיתם בהפסקה ביסודי — ומה אתם עושים עכשיו?
          challenge: מה מהיסודי הייתם רוצים לקחת איתכם לכאן — ולמה דווקא את זה?
      - ask: מה אהבתם בבית הספר היסודי, ולמה אתם מתגעגעים? ובמה שונה כאן?
      - say: >-
          ביסודי הייתם הגדולים, שמכירים כל פינה. כאן אתם הצעירים, ועוד לומדים את המקום ואת הכללים שלו — וגעגוע
          הוא חלק טבעי מזה.
      - say: אז בואו נבדוק — מה מהיסודי שווה לשמור, ומה נרצה שיהיה אחרת.

  # ------------------------------------------------------------------ 12′–23′
  - id: wonders
    title: ארבעת המופלאים
    minutes: 11
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      לבד ואז בקבוצות — מה לשמר, לשפר, לשנות ולחדש בחטיבה; במליאה כל קבוצה מציגה מופלא אחד
    body:
      - slide:
          kicker: הכירו את 4 המופלאים
          title: השומר והשיפוצניק
          points:
            - שימור — משהו שהיה בבית הספר היסודי ואהבתי, הייתי רוצה שיהיה דבר מה דומה גם בחט״ב
            - שיפור — משהו שהיה בבית הספר היסודי והייתי שמח/ה שיהיה טוב יותר בחט״ב
          verbatim: [points]
          echo: true
          alt: לב ונבט בעציץ
          art:
            - {use: heart, x: 330, y: 70, w: 230}
            - {use: sprout, x: 80, y: 226, w: 200}
      - slide:
          kicker: הכירו את 4 המופלאים
          title: הקוסם והיזם
          points:
            - שינוי — משהו שהיה בבית הספר היסודי והייתי רוצה שלא יהיה בחט״ב
            - חידוש — משהו שלא היה בבית הספר היסודי והייתי שמח/ה שיהיה בחט״ב
          verbatim: [points]
          echo: true
          cue: ומיד אחריו —
          alt: עיגול עם איקס, ונורה דולקת
          art:
            - {use: cross, x: 336, y: 70, w: 220, color: purple}
            - {use: bulb, x: 90, y: 226, w: 180}
      - slide:
          kicker: לבד, ואז בקבוצה
          title: מה הייתם רוצים לשמר, לשפר, לשנות ולחדש בחט״ב?
          timer: 360
          echo: true
          cue: כשיוצאים לעבודה —
          alt: ארבע משבצות — השומר עם לב, השיפוצניק עם נבט, הקוסם עם איקס, היזם עם נורה
          art: {file: art/four.svg}
      - moves:
          - הציגי את ארבעת המופלאים, שניים בכל שקף, והקריאי אותם. צייני שמדברים על בית הספר, לא על אנשים.
          - שתי דקות לבד — כל אחד משרטט במחברת ארבע משבצות, וממלא לפחות שתיים.
          - קבוצות של 4–5 לפי השולחנות. לפני העבודה — סבב היכרות קצר, שם ואיפה למדתי ביסודי.
          - ארבע דקות בקבוצה — רעיון אחד לכל מופלא. הסתובבי, ודקה לפני הסוף הודיעי.
          - >-
            במליאה — כל קבוצה מציגה מופלא אחד, בסבב (שימור, שיפור, שינוי, חידוש, ושוב מההתחלה). על כל הצגה —
            הדהדי, ושאלי מי מוסיף.
      - say: >-
          קודם לבד, ואחר כך בקבוצה — מה הייתם רוצים לשמר, לשפר, לשנות ולחדש בחטיבה? בקבוצה בוחרים רעיון אחד לכל
          מופלא.
      - task:
          what: >-
            כל אחד ממלא לבד ארבע משבצות במחברת. אחר כך הקבוצה בוחרת יחד רעיון אחד לכל מופלא — מה לשמר, לשפר,
            לשנות ולחדש בחט״ב — ורושמת על דף אחד.
          time: 2 דקות לבד, 4 דקות בקבוצה
          group: קבוצות של 4–5 לפי השולחנות
          rules: >-
            פותחים בסבב שמות — שם, ואיפה למדתי ביסודי; מדברים על בית הספר, לא על אנשים; אין הסכמה? רושמים שני
            רעיונות
          plenary: כל קבוצה מציגה מופלא אחד — את הרעיון שבחרה, ואיך הגיעה אליו
          help: >-
            חשבו על ההפסקות, על השיעורים ועל הטיולים — מה היה שם טוב, ומה פחות? למשל ״לתת יותר עזרה בשיעורי
            בית״.
          challenge: בחרו רעיון אחד, וכתבו מה צריך לקרות כדי שיתחיל כבר החודש — ומי יכול לעזור.
      - slide:
          kicker: במליאה
          title: כל קבוצה מציגה מופלא אחד
          sub: את הרעיון שבחרתם — ואיך הגעתם אליו.
          echo: true
          cue: אחרי ארבע דקות בקבוצות —
          alt: שלוש דמויות יחד, ובועת דיבור מעליהן
          art:
            - {use: group3, x: 50, y: 250, w: 360}
            - {use: speech-l, x: 380, y: 50, w: 210}
      - ask: עד כמה כל אחד בקבוצה הצליח להביע את עמדתו? והאם היו חילוקי דעות?

  # ------------------------------------------------------------------ 23′–27′
  - id: strong
    title: משפט מחזק לעצמי
    minutes: 4
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: כל אחד כותב לעצמו משפט אופטימי ומחזק לשנה — ושומר אותו
    body:
      - slide:
          kicker: לבד, בכתב · לעצמכם
          title: משפט אופטימי ומחזק לשנה הזאת
          sub: משהו שייתן לכם כוח במסע השנה — ותוכלו לקרוא בכל פעם שתרצו.
          timer: 120
          echo: true
          alt: דרך מתפתלת אל האופק, ושמש מעליה
          art:
            - {use: road, x: 110, y: 200, w: 380}
            - {use: sun, x: 420, y: 36, w: 150}
      - moves:
          - הציגי את השקף. שתי דקות בשקט — כותבים בעמוד האחרון של המחברת, או על פתק ששומרים.
          - אמרי בבירור שהמשפט נשאר אצל מי שכתב אותו, ולא נאסף.
          - מי שרוצה — מקריא את המשפט שלו. שניים־שלושה מספיקים.
      - ladder:
          help: השלימו — ״השנה אצליח ל…״ או ״גם כשיהיה קשה, אזכור ש…״
          challenge: כתבו משפט שיעזור לכם ביום הכי קשה של השנה — ומתי תקראו אותו.
      - say: המשפט הזה שלכם. כתבו אותו במקום שתמצאו גם בעוד חודש.
      - ask: מי רוצה להקריא את המשפט שלו?

