  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלושת המסרים של המקור (״מה המסר שלנו?״), מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          title: מה המסר שלנו?
          items:
            - >-
              בשלבים ראשונים במקום חדש, עולים לעיתים געגועים למקום הקודם. יחד, חשבנו על בית הספר שהיינו בו והעלינו
              זיכרונות.
            - >-
              במהלך השיעור, נזכרנו בבית הספר היסודי וחשבנו אלו דברים היינו שמחים לשמר, לשפר, לשנות ולחדש בחטיבה.
              שינוי מהווה הזדמנות לשמר את הטוב שבנו, לשנות ולשפר דברים שהיו פחות מוצלחים עבורנו, לתכנן ולהמציא
              חידושים לעתיד.
            - >-
              בשיעורי הכ״חות שבדרך נדבר ונלמד על נושאים החשובים לנו כמתבגרים, ונתרגל מיומנויות וכישורים שיסייעו לנו
              לשמר, לשפר, לשנות ולחדש גם דברים בעצמנו, ברמה האישית.
          ask: איזה משפט מהשלושה הכי קרוב למה שעבר עליכם היום? חשבו רגע, ואז הצביעו.
          tip: >-
            הראשון נותן מקום לגעגוע; השני אוסף את ארבעת המופלאים; השלישי מעביר את המבט מבית הספר אל עצמנו — וזה
            בדיוק מה שמבקש כרטיס היציאה.
          alt: דלת פתוחה, ואור בפנים
          art: door

