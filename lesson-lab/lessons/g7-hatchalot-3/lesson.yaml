sub: >-
  לפני שנה חדשה, מסתכלים רגע אחורה. בשיעור הזה נזכרים בבית הספר היסודי, בוחרים מה לשמר, לשפר, לשנות
  ולחדש בחטיבה — ומגדירים יעד אישי לשנה.
format: כתיבה אישית, זוגות, קבוצות ומליאה
question: מה מהיסודי שווה לקחת איתנו — ומה נרצה שיהיה אחרת השנה?
takeaways:
  - געגוע למקום הקודם הוא חלק טבעי מהתחלה חדשה.
  - שינוי הוא הזדמנות — לשמר את הטוב, לשפר ולשנות את מה שפחות הצליח, ולחדש.
  - אפשר לבחור יעד אישי לשנה, ולהתחיל לעבוד עליו כבר עכשיו.
prep:
  - חלוקה מראש לקבוצות של 4–5 לפי השולחנות (לארבעת המופלאים)
  - >-
    פתקיות ונייר דבק ללוח הברכות — או פתקי האיחולים שבסוף המצגת המקורית (להרחבה ״ברכות לחברי הכיתה״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — זיכרונות מבית הספר היסודי והמעבר לחטיבה. שאלי מי בכיתה עבר שנה קשה ביסודי
      (חרם, פגיעה, אובדן, מעבר דירה), ומי הגיע מבית ספר אחר או מארץ אחרת, ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      זיכרון מהיסודי יכול להיות גם זיכרון כואב — פרידה, חבר שנשאר מאחור, חרם. מי שעלה לארץ לא מזמן או עבר כמה
      בתי ספר בוחר זיכרון מכל בית ספר שהיה בו. מי שלא הביא תמונה — בוחר כרטיס, או כותב. ב״שינוי״ מדברים על
      דברים, לא על אנשים — בלי שמות של מורים או של ילדים.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום — ״לא צוחקים ולא מלגלגים על תמונות או סיפורים של אחרים, ומספרים רק על עצמנו״. במליאה
      משתפים רק מתנדבים, ובזוג — רק מה שבוחרים. המשפט המחזק נשאר אצל מי שכתב אותו ולא נאסף.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל זיכרון של חרם או של אובדן — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את
      היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״ברכות לחברי הכיתה״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - memory
      - wonders
    text: >-
      בזיכרון מהיסודי שומעים שני מתנדבים בלבד, ובארבעת המופלאים מדלגים על השלב האישי — הקבוצות מתחילות מיד

brain_break:
  signs: מבטים שנודדים לחלון, ראשים על השולחן, או רעש שלא נרגע אחרי העבודה בקבוצות.
  ideas:
    - name: אף ואוזן
      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: מתיחת חתול
      text: >-
        קמים, משלבים אצבעות ומותחים ידיים קדימה, אחר כך למעלה, ובסוף מתכופפים לאט עד הרצפה. שלוש פעמים.
    - name: צלילים בשקט
      text: >-
        עוצמים עיניים לחצי דקה וסופרים בשקט כמה צלילים שונים שומעים — בכיתה, במסדרון, בחוץ. אחר כך משווים
        עם השכן.
  from: idea

