steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: journey
    title: מסע בזמן
    minutes: 7
    practices:
      - זמן חשיבה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      דמיון מודרך לימים הראשונים בחטיבה ולזיכרון משמעותי אחד; כותרת לזיכרון ומילה שנותנת כוח; במליאה — מתנדבים
      מספרים
    body:
      - slide:
          kicker: זמן חשיבה · בשקט
          title: מסע בזמן — אל הימים הראשונים בחטיבה
          sub: שבו בנוח. מי שרוצה — עוצם עיניים.
          echo: true
          alt: דמות יושבת, ומעליה ענן מחשבה ובו בית ספר
          art:
            - {use: thought, x: 40, y: 20, w: 320}
            - {use: school, x: 115, y: 80, w: 170}
            - {use: kid-sit, x: 360, y: 176, w: 230, color: purple}
      - moves:
          - >-
            הכיתה מתיישבת, והשקף על המסך. בקשי לשבת בנוח — מי שרוצה עוצם עיניים, ומי שלא — מסתכל על נקודה אחת
            בחדר.
          - הקריאי לאט את ההנחיה מהמקור, עם הפסקות. אם יש לך מוזיקה שקטה — השמיעי אותה ברקע.
          - בסוף ההנחיה — דקה במחברת. אחר כך הציגי את הנחיות השיח, ושמעי שלושה־ארבעה מתנדבים.
      - quote:
          title: ההנחיה מהמקור — להקריא לאט
          text: |-
            אתם מוזמנים לשבת בצורה שנוחה לכם, לעצום עיניים, להתרווח בכסא, להרפות ידיים רגליים, ראש, לנשום עמוק ולשאוף... ושוב לנשום... ולשאוף.

            אני מזמין/ה אתכם למסע אחורה בזמן, לימים הראשונים בכיתה ז': איך הרגשתם ביום הראשון? אלו טעמים מזכירים לכם הימים הראשונים בבית הספר? אלו צבעים?

            בואו "נשוטט" קצת במרחבי בית הספר וניזכר בשנה שעברה - חשבו על ימי השיא (לתת זמן להיזכר), טיולים, חוויות לימודיות או חברתיות.

            כעת, עצרו ליד חוויה אחת שזכורה לכם במיוחד: בואו נתבונן בה לעומק. מה הייתה החוויה? מי היה לצדכם? אלו טעמים או ריחות מעוררת בכם החוויה הזו? האם הייתם משנים משהו בהתנהלות שלכם? האם הייתם רוצים לומר משהו לעצמכם בדיעבד?

            חשבו על מילה שנותנת לכם היום כוח - לאט לאט אתם מוזמנים לפקוח עיניים, ובזמנכם החופשי להתייחס למשימה שבשקף.
      - say: >-
          דקה במחברת: כתבו כותרת לזיכרון שבחרתם — כמו כותרת של סיפור — ומילה אחת שנותנת לכם כוח היום.
      - ladder:
          help: חשבו על יום אחד מהחטיבה שאתם זוכרים טוב — טיול, טקס, היום הראשון.
          challenge: האם הייתם רוצים לומר משהו לעצמכם של אז? כתבו אותו במשפט.
      - slide:
          kicker: לפני שמשתפים
          title: הנחיות לשיח מיטבי
          sub: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          cue: אחרי הכתיבה —
          alt: ארבעה סביב שולחן, ובועת דיבור ובה לב
          art:
            - {use: circle4, x: 40, y: 214, w: 300}
            - {use: speech-l, x: 336, y: 36, w: 250}
            - {use: heart, x: 411, y: 68, w: 100}
      - slide:
          kicker: מסע בזמן · שיתוף במליאה
          title: ספרו על האירוע שבו בחרתם.
          sub: מה בו היה משמעותי עבורכם?
          points:
            - אילו רגשות עולים בכם ביחס לאותו אירוע?
            - עד כמה היה לכם נעים להיזכר בו?
          verbatim: true
          echo: true
          cue: אחרי ההנחיות —
          alt: דמות מרימה יד, ומעליה בועת דיבור ובה כוכב
          art:
            - {use: speech-l, x: 260, y: 30, w: 300}
            - {use: star, x: 355, y: 74, w: 110}
            - {use: kid-hand, x: 60, y: 190, w: 160, color: orange}
      - ask: מי רוצה לספר על האירוע שבחר — ומה בו היה משמעותי עבורו?
      - say: >-
          יש חוויות שבזמן אמת הרגשנו בהן דבר אחד, והיום, במבט לאחור, אנחנו מרגישים אחרת. בשנים בחטיבה היו לכולנו
          חוויות טובות יותר וטובות פחות — ועכשיו נאסוף אותן לשקית אחת.

  # ------------------------------------------------------------------ 7′–17′
  - id: bag
    title: בחרי מסלול — מסיבת סיום
    minutes: 10
    summary: כל אחד ממלא שקית בפריטים שמסמלים את השנים שלו, ומציג אותה בקבוצה; במליאה — מה עורר גאווה
    body:
      - tracks:
          - title: כרטיסיות
            text: >-
              על השולחן המרכזי — שקיות, וכרטיסיות עם ההיגדים של המקור. כל אחד בוחר שתיים־שלוש שמסמלות את השנים שלו,
              ושם בשקית.
            when: רוצים פעילות בלי אוכל, או שיש בכיתה אלרגיות; מספיק להדפיס ולגזור.
            practices:
              - הוצאה למשימה
            spotlights:
              - אחריות ובחירה
            body:
              - slide:
                  kicker: מסיבת סיום · כרטיסיות
                  title: מה תכניסו לשקית?
                  sub: שתיים־שלוש כרטיסיות שמסמלות חוויות, רגשות, מחשבות וכישורים מהשנים בחטיבה.
                  timer: 120
                  echo: true
                  alt: שקית הפתעות ושלוש כרטיסיות בולטות ממנה, ודמות שמרימה יד
                  art: {file: art/bag-cards.svg}
              - moves:
                  - הכרטיסיות והשקיות על השולחן המרכזי. הסבירי לפני שקמים — כל אחד בוחר שתיים־שלוש.
                  - ניגשים לשולחן קבוצה אחרי קבוצה, שתי קבוצות בכל פעם, כדי שלא יהיה צפוף.
                  - מי שלא מצא כרטיסייה מתאימה — כותב היגד משלו על פתק.
              - say: >-
                  בחרו שתיים־שלוש כרטיסיות שמספרות משהו על השנים שלכם בחטיבה — חוויה, רגש, מחשבה, או משהו שלמדתם
                  לעשות.
              - task:
                  what: כל אחד בוחר שתיים־שלוש כרטיסיות שמסמלות את השנים שלו בחטיבה, ושם אותן בשקית.
                  time: 2 דקות
                  group: לבד — שתי קבוצות ליד השולחן בכל פעם
                  rules: >-
                    כל בחירה מתאימה — גם כרטיסייה של רגע קשה, וגם רק רגעים טובים; מי שלא מוצא — כותב היגד משלו על
                    פתק
                  plenary: אין — עוברים להציג בקבוצות
                  help: בחרו כרטיסייה אחת לרגע טוב, ואחת לרגע שהיה קשה.
                  challenge: בחרו כרטיסייה שמסמלת משהו שלמדתם על עצמכם — ותכננו מה תספרו עליה.
              - handout:
                  title: כרטיסיות לשקית
                  copies: שלושה־ארבעה עותקים, גזורים לכרטיסיות — כדי שיהיה מבחר
                  verbatim: true
                  lines: false
                  items:
                    - יכולת גמישות והסתגלות שגיליתי בעצמי...
                    - רגעים בהם הייתי זקוק/ה לפסק זמן, והצלחתי לקחת...
                    - נהניתי והיה לי כיף כש...
                    - רגע מתוק של יחד שזכור לי במיוחד...
                    - בעיה שנתקלתי בה והצלחתי לפצח
                    - משהו שלמדתי לעשות אחרת
                    - משהו טוב ומתוק שאקח איתי לשנה הבאה
                    - הצלחה שחוויתי השנה והיתה עבורי ניצחון מתוק
                    - משהו / מישהו שחיזק אותי וגרם לי להרגשה טובה
                    - משהו / מישהו שמילא לי את הלב
                    - משהו מלוח שהצלחתי להמתיק. קושי/אתגר שהיה לי ולמדתי ממנו על עצמי
                    - חבר/ה שרציתי להגיד לו/לה תודה
          - title: ממתקים ופירות
            text: >-
              על השולחן המרכזי — שקיות, וממתקים ופירות בטעמים ובמרקמים שונים. כל אחד בוחר שניים־שלושה שמסמלים את השנים
              שלו, ושם בשקית.
            when: רוצים אווירת מסיבה, ואפשר להביא דברים שמותרים לכל תלמידי הכיתה.
            practices:
              - הוצאה למשימה
            spotlights:
              - אחריות ובחירה
            prep:
              - >-
                ממתקים ופירות בטעמים ובמרקמים שונים — מתוק, מלוח, חמוץ — רק כאלה שמותרים לכל תלמידי הכיתה; בדקי מראש
                אלרגיות וכשרות. אפשר גם לבקש מהתלמידים להביא.
            body:
              - slide:
                  kicker: מסיבת סיום · ממתקים ופירות
                  title: מה תכניסו לשקית?
                  sub: שניים־שלושה פריטים שמסמלים חוויות, רגשות, מחשבות וכישורים מהשנים בחטיבה.
                  timer: 120
                  echo: true
                  alt: שקית הפתעות, ובולטים ממנה סוכרייה על מקל, ממתק עטוף ותפוח
                  art: {file: art/bag-sweets.svg}
              - moves:
                  - הממתקים, הפירות והשקיות על השולחן המרכזי. הסבירי לפני שקמים — כל אחד בוחר שניים־שלושה.
                  - ניגשים לשולחן קבוצה אחרי קבוצה, שתי קבוצות בכל פעם. אוכלים רק בסוף השיעור.
                  - מי שלא אוכל ממתקים — בוחר פרי, או משהו שהוא רק מחזיק ומסביר.
              - say: >-
                  בחרו שניים־שלושה פריטים שמסמלים משהו מהשנים שלכם — למשל משהו מלוח לקושי שהצלחתם ״להמתיק״, או משהו
                  מתוק לרגע של יחד.
              - task:
                  what: >-
                    כל אחד בוחר שניים־שלושה ממתקים או פירות שמסמלים חוויות, רגשות, מחשבות או כישורים מהשנים שלו, ושם
                    בשקית.
                  time: 2 דקות
                  group: לבד — שתי קבוצות ליד השולחן בכל פעם
                  rules: לוקחים שניים־שלושה בלבד; לא אוכלים עד סוף השיעור
                  plenary: אין — עוברים להציג בקבוצות
                  help: חפשו טעם שמתאים לרגע אחד מהחטיבה — מתוק, מלוח או חמוץ.
                  challenge: בחרו פריט שמסמל כישור שפיתחתם בחטיבה — ותכננו איך תסבירו את הבחירה.
      - slide:
          kicker: בקבוצות · 5 דקות
          title: הציגו את השקית שלכם
          sub: למה בחרתם כל פריט — ותהליך אחד שעברתם לאורך השנים.
          timer: 300
          echo: true
          cue: כשכולם חזרו עם שקית מלאה —
          alt: ארבעה סביב שולחן, ובועת דיבור ובה כוכב
          art:
            - {use: circle4, x: 40, y: 220, w: 290}
            - {use: speech-l, x: 360, y: 40, w: 220}
            - {use: star, x: 424, y: 64, w: 90}
      - moves:
