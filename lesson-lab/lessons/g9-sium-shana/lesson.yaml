sub: >-
  השנים בחטיבה נגמרות. בשיעור הזה יוצאים למסע בזמן אל הימים הראשונים בחטיבה, ממלאים שקית בחוויות ובכוחות
  של השנים האלה, נותנים איחול — לעצמנו ולחבר — ואומרים תודה.
format: דמיון מודרך, קבוצות, מעגל ומליאה
question: מה אני לוקח איתי מהשנים בחטיבה — ומה אני מאחל לעצמי לתיכון?
takeaways:
  - התבוננות על השנים כוללת את ההישגים וגם את האכזבות — ושניהם חלק מהסיפור שלנו.
  - מתוך הקשיים שהתמודדנו איתם אפשר לזהות את הכוחות והחוזקות שלנו.
  - בפרידה כדאי לזהות את הטוב, להודות עליו, ולצאת לתיכון עם אמונה בכוחות שלנו.
prep:
  - שולחן מרכזי, ועליו שקית הפתעה קטנה (או מעטפה) לכל תלמיד
  - פתקים קטנים — לאיחול שנכנס לשקית
  - רשות — מוזיקה שקטה ל״מסע בזמן״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פרידה מהחטיבה: דמיון מודרך לימים הראשונים בחטיבה, שקית של חוויות, איחולים
      ומעגל תודה. שאלי מי בכיתה עבר בחטיבה תקופה קשה, מי בודד חברתית, ומי חושש מהמעבר לתיכון. בקשי שתהיה זמינה
      אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהשנים בחטיבה היו לו קשות, ומי שבודד בכיתה. בדמיון המודרך מותר לא לעצום עיניים, ובוחרים זיכרון שנעים
      לספר עליו. האיחול ״למי שיושב מימינכם״ עובר בשרשרת סגורה — כל אחד נותן ומקבל. במעגל התודה אפשר להודות לקבוצה
      או למישהו מחוץ לכיתה, והתודה שלך בסוף — לכל אחד בכיתה. בממתקים — רק מה שמותר לכולם: אלרגיות וכשרות.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בקבוצה מספרים רק על מה שבוחרים; במליאה —
      רק מתנדבים. מותר לוותר, ולא קוראים בשם למי שלא הצביע. במעגל התודה מותר לעבור.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל זיכרון של חרם, השפלה או פגיעה בשנים בחטיבה — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
