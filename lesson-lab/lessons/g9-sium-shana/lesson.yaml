    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״אז ועכשיו״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - journey
      - bag
      - thanks
    text: >-
      ב״מסע בזמן״ שומעים שני מתנדבים בלבד; בשקית כל אחד מציג לקבוצה רק פריט אחד; ובמעגל התודה נשארים במקומות,
      ותודה אחת קצרה מכל אחד

brain_break:
  signs: התרגשות שהופכת לרעש, ראשים על השולחן, קושי לחזור לשקט אחרי התנועה בכיתה.
  ideas:
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: קפיצות בספירה
      text: קמים, ועושים יחד עשר קפיצות קטנות במקום, בספירה לאחור מעשר. אחר כך מתיישבים בשקט.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
  from: talk

