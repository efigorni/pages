sub: >-
  בצ׳אט לא רואים פנים ולא שומעים טון. בשיעור הזה מבררים אילו רגשות קל להביע בכתב ואילו קשה, בודקים מה
  פרצופון באמת אומר, ולומדים מהי אמפתיה — ואיך מראים אותה גם דרך המסך.
format: לבד, רביעיות, זוגות ומליאה
question: איך מבינים מה מישהו מרגיש — כשמדברים איתו דרך מסך?
takeaways:
  - יש רגשות שקל להביע בכתב ויש רגשות שקשה — ובמסך לא רואים את הבעות הפנים ולא שומעים את הטון.
  - אמפתיה היא לנסות להרגיש את מה שהאחר מרגיש, ולהגיב אליו ברגישות — כך הוא לא נשאר לבד.
  - גם בצ׳אט אפשר להראות אמפתיה, כשחושבים רגע על הצד השני ועל הרגשות שלו לפני שעונים.
prep:
  - >-
    דף ״פרצופוני הרגשות״ (24 פרצופונים ממוספרים) — עותק לכל רביעייה. מדפיסים את שקף 25 של המצגת המקורית
    (הקישור בתחתית המערך).
  - חלוקה מראש לרביעיות לפי השולחנות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — רגשות, אמפתיה ותקשורת במסכים, ובהרחבה גם היזכרות בפעם שהיה קשה. שאלי אם
      יש בכיתה מי שמתמודד עכשיו עם קושי רגשי, או מי שנפגע לאחרונה מהודעות בקבוצה של הכיתה, ובקשי שתהיה
      זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שמרגיש שלא מבינים אותו — בבית, בכיתה או בקבוצת הווטסאפ — עלול לזהות את עצמו בשאלות. מדברים על
      פרצופונים ועל הודעות באופן כללי, לא על הודעות אמיתיות מהקבוצה של הכיתה, ובלי שמות. בדף ״הרגשות שלי״
      אין תשובה נכונה, והוא לא נאסף.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בהרחבה חושבים לבד ומספרים לבן הזוג
      רק מה שבוחרים — אפשר לספר רק מה עשה מי שהבין, בלי מה שקרה. מותר לוותר, ולא קוראים בשם למי שלא
      הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל הודעות פוגעות, הרחקה מקבוצה או חרם — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את
      היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת: מוקד 105 — המטה הלאומי להגנה על ילדים ונוער ברשת,
      24/7; ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 13 דקות ומעלה — ההרחבה ״כשמישהו הבין אותי״; פחות — ישר ל״חשוב
