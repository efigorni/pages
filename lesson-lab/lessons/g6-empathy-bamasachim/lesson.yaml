steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: feelings
    title: מבררים עם עצמנו
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      בכניסה, על דף של 85 רגשות — מה לא מוכר, מה קל לכתוב בהודעה ומה קשה; שומעים מה סומן אחרת אצל
      שניים
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, על הדף
          title: אילו רגשות קל לכתוב, ואילו קשה?
          points:
            - עיגול — רגש שאתם לא ממש מכירים
            - ריבוע — רגש שקל לשתף בהודעה כתובה
            - קו מתחת — רגש שקשה להביע בכתב
          timer: 180
          echo: true
          alt: טלפון ועל המסך פנים שמחות, ולידו לב שבור
          art:
            - {use: phone, x: 335, y: 105, w: 190}
            - {use: face-happy, x: 375, y: 200, w: 110}
            - {use: heart-broken, x: 80, y: 250, w: 190}
      - moves:
          - >-
            דף ״הרגשות שלי״ מונח על כל שולחן, והשקף על המסך כשהכיתה נכנסת. מתחילים לסמן בלי הסבר נוסף.
          - >-
            בזמן הסימון — נוכחות, ואז סיבוב בין השולחנות. חפשי רגש שכמה תלמידים הקיפו, ורגש שאחד סימן בריבוע
            ואחר מתח מתחתיו קו.
          - שאלי מי הקיף רגש שהוא לא מכיר, והזמיני תלמיד אחר להסביר אותו.
          - הציגי רגש אחד שסומן אחרת אצל שניים, ושאלי ממה זה נובע.
      - say: שלוש דקות, לבד. מסמנים בדף — אין כאן תשובה נכונה, רק מה שנכון לכם.
      - ladder:
          help: התחילו ברגשות שאתם מרגישים הכי הרבה — שמחה, כעס, שעמום.
          challenge: בחרו רגש אחד שמתחתיו מתחתם קו, וכתבו בשורה אחת — למה דווקא אותו קשה לכתוב?
      - handout:
          title: הרגשות שלי
          copies: עותק לכל תלמיד, מונח על השולחן לפני שהכיתה נכנסת
          verbatim: true
          text: >-
            שמחה · אושר · הנאה · מבוכה · עלבון · הכרת תודה · ביטחון · תקווה · התלהבות · גאווה · אופטימיות ·
            אהבה · חמימות · אשמה · בושה · חיבה · קרבה · רגישות · התרגשות · חמלה · רחמים · מרירות · שלווה ·
            רגיעה · הקלה · סיפוק · נעימות · נוחות · אומץ · בוז · גועל · געגוע · הערצה · ייאוש · בלבול · עייפות ·
            חוסר סבלנות · שעמום · שנאה · קנאה · אי-ודאות · זלזול · תשוקה · נקיפות מצפון · חרטה · רגשי נחיתות ·
            שאננות · טינה · התנשאות · פחד · דאגה · לעג · השפלה · תאווה · קור רוח · שעשוע · תסכול · רוגז ·
            עצבנות · כעס · לחץ · הערכה · פליאה · יראה · סלידה · ספק · חמדנות · חשש · נחת רוח · ניכור · דכדוך ·
            אמפטיה · עצבות · בדידות · אכזבה · כאב · צער · מועקה · נקמה · ריקנות · סקרנות · אימה · מתח · חוסר
            אונים · רוגע
      - ask: >-
          סימנתם רגשות שונים — ממה זה נובע? ומה ההבדל בין להביע רגש בהודעה לבין להביע אותו פנים אל פנים?
      - say: >-
          בהודעה כתובה אין פנים ואין טון, אז לפעמים שולחים פרצופון. בואו נבדוק כמה טוב הוא עובד.

  # ------------------------------------------------------------------ 6′–15′
  - id: emoji
    title: מה אומר האימוג׳י?
    minutes: 9
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      ברביעיות, שני סבבים — כל אחד כותב לבד מה פרצופון אומר, ואז משווים; במליאה — על מה הסכמנו ועל מה לא
    body:
      - moves:
          - הסבירי את הסבבים לפני שמחלקים את הדפים — ההוראות נשארות על המסך.
          - חלקי לכל רביעייה דף ״פרצופוני הרגשות״, ולכל תלמיד שני עותקים של ״התשובות שלי״.
          - >-
            בכל סבב הרביעייה בוחרת פרצופון אחד, כל אחד עונה עליו לבד, ואחרי שתי דקות משווים. הסתובבי בין
            הרביעיות, ודקה לפני המעבר — הודיעי.
          - >-
            אחרי שני סבבים — מליאה: בקשי מכל רביעייה פרצופון שכולם כתבו עליו אותו דבר, ופרצופון שלא הסכימו
            עליו. הזמיני את הכיתה להגיב: ״מי קרא אותו אחרת?״
      - slide:
          kicker: מביעים רגשות · ברביעיות
          title: מה הפרצופון הזה אומר?
          sub: בוחרים פרצופון אחד בקבוצה — וכל אחד עונה עליו לבד, בדף.
          timer: 120
          alt: ארבעה סביב שולחן עגול, ופרצופון ניטרלי מעליהם
          art:
            - {use: circle4, x: 60, y: 190, w: 300}
            - {use: face-meh, x: 400, y: 50, w: 160}
      - say: >-
          בכל סבב בוחרים פרצופון אחד בקבוצה. כל אחד עונה עליו לבד, ורק אחר כך משווים — כתבנו אותו דבר?
      - task:
          what: >-
            כל רביעייה בוחרת פרצופון אחד מהדף, וכל אחד עונה עליו לבד בדף ״התשובות שלי״. אחר כך משווים בקבוצה
            מה כל אחד כתב. שני סבבים — פרצופון אחר בכל סבב.
          time: 2 דקות כתיבה ודקה השוואה, לכל סבב
          group: רביעיות לפי השולחנות
          rules: כל אחד עונה לבד לפני שמשווים; עונים במילה או שתיים לכל שאלה
          plenary: >-
            כל רביעייה מספרת על פרצופון אחד שכולם כתבו עליו אותו דבר, ועל אחד שלא הסכימו עליו
          help: איזה רגש עולה לכם קודם, כשאתם רואים את הפרצופון?
          challenge: מה הייתם צריכים לראות או לשמוע כדי לדעת בדיוק מה הרגיש מי ששלח אותו?
      - handout:
          title: התשובות שלי
          copies: שני עותקים לכל תלמיד — אחד לכל סבב
          verbatim: true
          items:
            - אימוג׳י מספר
            - איזה רגש מביע אימוג׳י זה? מתי אשלח אימוג׳י כזה לחבר או לחברה?
            - >-
              מה ארצה שיבינו או יחשבו עליך החבר או החברה אליהם אשלח אימוג׳י זה בתגובה למשהו שכתבו לי בוואטסאפ?
            - לאיזו תגובה אצפה?
            - >-
              באיזו מידה אימוג׳י זה יכול להביע במדויק את מה שאני מרגיש/ה? במידה רבה = 10, במידה בינונית = 5,
              במידה מועטה = 0
      - slide:
          kicker: שתפו את הכיתה
          title: פרצופון אחד — כמה פירושים?
          sub: האם אפשר להבין בדיוק מה הרגיש מי ששלח אותו?
          echo: true
          cue: אחרי שני הסבבים, כשעוברים למליאה —
          alt: פרצופון ניטרלי, ומעליו שני עננים — באחד פנים שמחות ובשני פנים עצובות
          art:
            - {use: face-meh, x: 210, y: 300, w: 200}
            - {use: thought, x: 30, y: 40, w: 210}
            - {use: face-happy, x: 80, y: 72, w: 100}
            - {use: thought, x: 380, y: 40, w: 210, flip: true}
            - {use: face-sad, x: 440, y: 72, w: 100}
      - ask: >-
          על איזה פרצופון כולכם כתבתם אותו דבר — ועל איזה לא הסכמתם? ופנים אל פנים, הייתם מבינים זה את זה
          טוב יותר?
      - say: >-
          גם כששולחים פרצופון, הצד השני לא תמיד מבין מה אנחנו מרגישים. מה עוזר לנו להבין מישהו אחר? לזה יש
          מילה — אמפתיה.

  # ------------------------------------------------------------------ 15′–23′
  - id: empathy
    title: מהי אמפתיה?
    minutes: 8
    practices:
      - כולם כותבים
      - מה הקשר?
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      כל אחד כותב ניחוש; צופים ב״אמפתיה ברחוב סומסום״ עם עצירה; מדברים על מרק ומורי, ומקריאים את ההגדרה
    body:
      - slide:
          kicker: רגע לחשוב · לבד, בכתב
          title: מהי אמפתיה?
          sub: כתבו ניחוש אחד, במשפט.
          timer: 60
          echo: true
          alt: דמות חושבת, ובענן המחשבה לב
          art:
            - {use: thought, x: 40, y: 24, w: 300}
            - {use: heart, x: 125, y: 95, w: 110}
            - {use: kid-stand, x: 390, y: 228, w: 140, color: teal}
      - moves:
          - שאלי, ותני דקה לכתוב ניחוש במשפט. עוד לא מסבירים — רק אוספים.
          - שמעי שלושה ניחושים, ורשמי מילים מהם על הלוח.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה.
          - אחרי הצפייה — שאלי על מרק ומורי, והזמיני את התלמידים להגיב זה לזה.
          - סיימי בהגדרה — הקריאי אותה, וחברי אליה את המילים שעל הלוח.
      - ladder:
          help: חשבו על פעם שמישהו הבין מה אתם מרגישים — בלי שאמרתם. מה הוא עשה?
          challenge: במה אמפתיה שונה מלרחם על מישהו?
      - video:
          title: אמפתיה ברחוב סומסום
          url: https://www.youtube.com/watch?v=fMHEXXyCn2c
          length: "2:29"
          before: מה עוזר לנו להרגיש שמישהו באמת מבין אותנו?
          watch: שימו לב למרק ולמורי — מה כל אחד עושה כשהשני מספר לו מה הוא מרגיש.
          pauses:
            - at: "?"
              moment: >-
                הרגע הראשון שבו אחד מהשניים מספר לשני מה הוא מרגיש — לפני שהשני עונה. צפי בסרטון לפני השיעור,
                ורשמי כאן את הזמן.
              ask: מה הייתם עונים לו עכשיו, כדי שירגיש שמבינים אותו? מילה או שתיים, בלחישה לשכן.
          alt: שתי דמויות יד ביד, ולב מעליהן
          art:
            - {use: pair, x: 170, y: 210, w: 280}
            - {use: heart, x: 235, y: 40, w: 150}
      - ask: מה עורר בכם הסרטון? איך הגיבו מרק ומורי כשהרגישו מובנים על ידי האחר?
      - slide:
          kicker: מהי אמפתיה?
          title: לנסות להרגיש את מה שהאחר מרגיש
          sub: ולהגיב אליו ברגישות — כך הוא לא נשאר לבד.
          cue: אחרי השאלה על הסרטון —
          alt: שתי ידיים מושטות זו לזו, ולב לידן
          art:
            - {use: hands-help, x: 270, y: 120, w: 310}
            - {use: heart, x: 60, y: 70, w: 160}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: |-
            אמפתיה מוגדרת כיכולת לזהות את מצבו הנפשי של האחר מתוך הבנה כי לכל אדם רגשות ומחשבות עצמאיות.

            לנסות לחוש את מה שהוא חש ומרגיש, לנסות לחשוב את המחשבות שעוברות בראשו, לנסות להתבונן על העולם מנקודת-המבט שלו, ואז להגיב אליו ברגישות ובהתאמה למה שהוא חווה.

            כאשר אנחנו נהיה אמפתיים למישהו, נרגיש כלפיו אכפתיות והזדהות והוא ירגיש שהוא מובן ושלאנשים אכפת ממנו.

  # ------------------------------------------------------------------ 23′–27′
  - id: chat
    title: רשת אמפתית
    minutes: 4
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: לבד, בזוגות ובמליאה — דרך אחת להראות אמפתיה בצ׳אט, כשלא רואים פנים
    body:
      - say: >-
          פנים אל פנים רואים את הפנים ושומעים את הטון. בצ׳אט צריך להתאמץ קצת יותר — כדי להבין, וכדי להראות
          שהבנו.
      - slide:
          kicker: רשת אמפתית · חושבים · בזוגות · משתפים
          title: איך מראים אמפתיה בצ׳אט?
          sub: כשלא רואים פנים — מה עוזר לצד השני להרגיש שמבינים אותו?
          points:
            - לבד — 30 שניות
            - בזוגות — דקה וחצי
            - במליאה
          echo: true
          alt: טלפון ועל המסך לב, ולידו בועות צ׳אט
          art:
            - {use: phone, x: 370, y: 120, w: 190}
            - {use: heart, x: 420, y: 230, w: 90}
            - {use: chat, x: 50, y: 70, w: 260}
      - moves:
          - שאלי, וחכי 30 שניות של שקט.
          - דקה וחצי בזוגות — כל זוג מנסח דרך אחת, מילים שכותבים או משהו שעושים.
          - שמעי ארבעה זוגות, ורשמי את הדרכים על הלוח בשתיים־שלוש מילים.
      - ladder:
          help: חבר כותב לכם שקשה לו. מה הייתם רוצים לקבל בחזרה, אילו אתם הייתם כותבים את זה?
          challenge: מתי עדיף לא לענות בצ׳אט — אלא להתקשר או להיפגש?
      - ask: איזו דרך מהלוח הייתם רוצים שינהגו בה גם כלפיכם — ולמה?

  # ------------------------------------------------------------------ +5′
  - id: understood
    title: כשמישהו הבין אותי
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
    summary: חושבים לבד ומספרים בזוג על פעם שמישהו הבין אותנו — ומה הוא עשה
    body:
      - slide:
          kicker: אם נשאר זמן · חושבים · בזוגות
          title: פעם שמישהו הבין מה הרגשתי
          sub: איך הוא הראה שהבין — ואיך הרגשתם?
          points:
            - לבד — דקה
            - בזוגות — שתי דקות
            - במליאה — רק מה הוא עשה
          echo: true
          alt: שתי דמויות יושבות זו מול זו, ולב ביניהן
          art:
            - {use: kid-sit, x: 60, y: 230, w: 180, color: purple}
            - {use: kid-sit, x: 380, y: 230, w: 180, color: orange, flip: true}
            - {use: heart, x: 250, y: 90, w: 120}
      - moves:
          - דקה לחשוב לבד, בלי לכתוב. בוחרים מקרה שנוח לספר עליו.
          - שתי דקות בזוגות — כל אחד מספר רק מה שהוא רוצה. אפשר לספר רק איך הבינו אותו, בלי מה שקרה.
          - במליאה שאלי רק על מי שהבין — מה הוא עשה? שמעי שלושה.
      - say: >-
          חשבו על פעם שהיה לכם קשה, וחבר או מישהו מהמשפחה הבין אתכם. מספרים רק מה שבוחרים — ומותר לספר רק
          מה הוא עשה.
      - ladder:
          help: מה הוא אמר — או מה הוא עשה בלי מילים?
          challenge: ומתי אתם הייתם כאלה בשביל מישהו אחר?
      - ask: מה עשו מי שהבינו אתכם — ומה מזה אפשר לעשות גם בהודעה?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ארבעת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - מסכים ורשתות החברתיות הם כלים להעברת מסרים בין אישיים.
            - >-
              יש הבדלים בין תקשורת בין אישית פנים אל פנים לבין תקשורת בין אישית במסכים וברשתות החברתיות.
            - >-
              יש חשיבות למודעות למה שקורה לנו בשיח שאינו מתנהל ״פנים אל פנים״. לשיח כזה יש השפעה משמעותית על
              התקשורת בינינו — אנחנו לא רואים את הבעות הפנים, את התגובות שמביעות רגש.
            - צריך להשקיע מחשבה בצד השני וברגשותיו גם בתקשורת בין אישית באמצעות המסכים.
          ask: >-
            איזה משפט מהארבעה תרצו לזכור בפעם הבאה שתכתבו הודעה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהכלי (1), דרך מה שהולך לאיבוד במסך (2–3), אל מה שעושים בכל זאת — לחשוב על הצד השני
            (4).
          alt: רשת של עיגולים מחוברים, ולב לידה
          art:
            - {use: network, x: 150, y: 170, w: 300}
            - {use: heart, x: 430, y: 40, w: 150}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — אמפתיה במסכים
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: רגש שקשה לכתוב ומה עושים במקום, ודרך אחת להראות אמפתיה; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: אמפתיה במסכים
          prompts:
            - רגש אחד שקשה לי להביע בהודעה — ומה אעשה במקום.
            - דרך אחת שבה אראה למישהו שאני מבין אותו — גם בצ׳אט.
            - רשות — משהו שלמדתי על עצמי היום.
          look_for: >-
            חפשי מי שמבין מה הולך לאיבוד במסך (פנים, טון) ודרכים מעשיות להראות אמפתיה, לעומת ״להיות נחמד״.
            פתק שמספר שקשה לכותב להביע את עצמו, או שהודעה פגעה בו — שיחה שקטה השבוע, ומה שנוגע בפגיעה עובר
            ליועצת עוד היום.
          timer: 180
          alt: דלת פתוחה, ודף כתוב לידה
          art:
            - {use: door, x: 330, y: 70, w: 240}
            - {use: note, x: 70, y: 190, w: 180}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
