sub: >-
  כשחבר בסיכון — במסיבה, בחצר או בכל מקום אחר — צריך להחליט מהר אם להתערב. בשיעור הזה בודקים מה מקשה עלינו להתערב,
  מה המחיר של כל בחירה, ומה אפשר לעשות — תוך כדי, בסיום ואחרי.
format: עמידה או זוגות, סרטון, קבוצות ומליאה
question: מה עושים כשחבר בסיכון — ואיך עוזרים לו בלי לוותר על החברות?
takeaways:
  - כשחבר בסיכון, ההתלבטות אם להתערב טבעית — ולשתיקה יש מחיר, בדיוק כמו להתערבות.
  - מי ששתה אלכוהול לא שוקל כמו תמיד — ולכן לפעמים החברים צריכים לעזור.
  - לספר למבוגר כשחבר בסכנה זה דיווח מתוך דאגה, לא הלשנה.
prep:
  - חלוקה מראש לקבוצות לפי השולחנות, וסוג הכרטיס של כל קבוצה — א׳, ב׳ או ג׳, כל סוג לשתי קבוצות לפחות
  - שם היועצת ואיפה מוצאים אותה — לסוף השלב ״מה אפשר לעשות?״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — אלכוהול במסיבות, התערבות כשחבר בסיכון, ופנייה למבוגר. שאלי אם היה לאחרונה
      בשכבה אירוע דומה (מסיבה עם שתייה, קטטה), ואם יש בכיתה מי שהנושא קרוב אליו — שתייה בבית,
      פגיעה מינית, חבר במשבר. בקשי שתהיה זמינה אחרי השיעור, וסכמי איתה מה עושים עם פתק שמספר על מצב שקורה
      עכשיו.
  - head: מי עלול להיפגע
    text: >-
      שניים מהמצבים בפתיחה — החבר השיכור במסיבה, והחברה שמעדיפה להישאר בבית — עלולים לגעת במשהו שקרה באמת. מצב
      שיש לו הד לאירוע אמיתי בשכבה — דלגי עליו. במצב של המסיבה מדברים על הבחירה של החברים, לא על ״מה הוא עשה״ —
      אף פעם לא מאשימים את מי שנפגע.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו״. במסלול ״מקרה שאני מכיר״ הכתיבה נשארת במחברת, מותר לכתוב על מקרה
      ששמעו עליו, ובמליאה מדברים על ההתלבטות — לא על מה שקרה ולא על מי. מותר לוותר, ולא קוראים בשם למי שלא
      הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור
      בסוד. תלמיד שמספר על חבר שבסיכון עכשיו עושה בדיוק את מה שהשיעור מלמד — פועלים לפי מה שסיפר. לצד היועצת: ער״ן
      1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; במצב חירום רפואי — מד״א 101 (למשל חבר ששתה ואיבד הכרה).
  - head: עמידה מול הכיתה
    text: >-
      במסלול ״קמים או נשארים״ העמידה היא על המצב — ״הייתי מתערב״ — ולא הצהרה על מי שקם. מי שמעדיף נשאר לשבת,
      ולא שואלים אותו למה. מסבירים רק מתנדבים, ורק על עצמם, ומי שנשאל יכול להעביר את השאלה למתנדב. הערה או
      צחוק על מי שקם או נשאר — עוצרים מיד.

