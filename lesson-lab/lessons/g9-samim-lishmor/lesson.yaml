  # ------------------------------------------------------------------ 14′–22′
  - id: groups
    title: להתערב או לא להתערב?
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      כל קבוצה בוחנת את ההתלבטות מצד אחד — מתערבים, לא מתערבים, או המחיר והרווח — ונציג מכל סוג כרטיס מציג
    body:
      - slide:
          kicker: במסיבה
          title: אתם חברים של מאיה. במה אתם מתלבטים?
          sub: >-
            אתם מכירים אותה כמי שחשוב לה לשמור על העקרונות שלה, ושומעים ורואים את כל מה שקורה.
          echo: true
          alt: דמות עומדת, ומעליה ענן מחשבה ובתוכו מאזניים
          art:
            - {use: kid-stand, x: 90, y: 230, w: 140, color: teal}
            - {use: thought, x: 240, y: 30, w: 260, flip: true}
            - {use: scale, x: 310, y: 80, w: 120}
      - moves:
          - הקריאי את השקף, ושמעי שתיים־שלוש התלבטויות. רשמי אותן על הלוח.
          - אמרי שאחת ההתלבטויות היא אם להתערב, והסבירי את המשימה לפני שמחלקים כרטיסים.
          - חלקי לכל קבוצה כרטיס אחד — א׳, ב׳ או ג׳, לפי החלוקה שהכנת. הסתובבי בין הקבוצות; דקה לפני הסוף — הודיעי.
          - במליאה — נציג אחד לכל סוג כרטיס, דקה לכל אחד. אחרי כל נציג — הדהדי משפט אחד, וחברי אותו לנקודות שלמטה.
      - say: >-
          כל קבוצה מקבלת כרטיס, ובוחנת את ההתלבטות מהצד שלו — גם אם אתם חושבים אחרת. בסוף נשמע את שלושת הצדדים.
      - slide:
          kicker: בקבוצות · 4 דקות
          title: כל קבוצה — צד אחד
          points:
            - כרטיס א׳ — בחרתם להתערב
            - כרטיס ב׳ — בחרתם לא להתערב
            - כרטיס ג׳ — המחיר והרווח
          timer: 240
          echo: true
          cue: אחרי שהכרטיסים חולקו —
          alt: ארבעה סביב שולחן, ודף לידם
          art:
            - {use: circle4, x: 150, y: 170, w: 320}
            - {use: note, x: 460, y: 40, w: 140}
      - task:
          what: קוראים את הכרטיס ודנים בשאלות שבו — לפחות בשלוש. בסוף בוחרים משפט אחד שהנציג יאמר לכיתה.
          time: 4 דקות
          group: קבוצות של 4–5 לפי השולחנות; כרטיס אחד לכל קבוצה
          rules: מדברים על החברים של מאיה, לא על עצמנו; מי שמסיים מוקדם — עונה גם על השאלה האחרונה בכרטיס
          plenary: נציג אחד לכל סוג כרטיס, דקה; קבוצה אחרת עם אותו כרטיס מוסיפה משפט אחד
          help: התחילו מהשאלה הראשונה בכרטיס, ותנו דוגמה אחת מהסרטון.
          challenge: מה הייתה אומרת קבוצה שקיבלה כרטיס אחר — ואיך הייתם עונים לה?
      - handout:
          title: כרטיסי הקבוצות
          copies: 2–3 עותקים, גזורים לשלושה כרטיסים — כרטיס אחד לכל קבוצה
          verbatim: true
          lines: false
          items:
            - |-
              **בחרתם להתערב!**
              נראה לך שזה הולך להתפתח לכיוון לא מתאים, אולי אף פוגעני.
              מדוע להתערב?
              מה תעשו?
              האם התערבות מסייעת לחברות או פוגעת בה ומדוע?
              אילו השלכות / תוצאות / השפעות יכולות להיות לבחירה שלכם עליכם ועל חברכם?
              חשבו על הטווח הרחוק - איזה חבר אנחנו מעריכים יותר, את זה ששותק או את זה שמתערב ועוזר?
              איך אפשר גם להתערב וגם לשמור על החברות?
            - |-
              **בחרתם לא להתערב!**
              נראה לך שזה הולך להתפתח לכיוון לא מתאים, אולי אף פוגעני.
              מדוע לא כדאי להתערב במקרה כזה?
              אילו השלכות/ תוצאות/ השפעות יכולות להיות לבחירה שלכם – חשבו על מאיה, אמיר, מיכאל, על החברים והחברות וגם על עצמכם.
              חשבו לטווח הרחוק - איזה חבר אנחנו מעריכים יותר, את זה ששותק או את זה שמתערב ועוזר?
            - |-
              **על המחיר והרווח שבבחירה להתערב / לא להתערב**
              נראה לך שזה הולך להתפתח לכיוון לא מתאים, אולי אף פוגעני.
              אילו מחירים גובה התערבות באירוע, ואילו מחירים גובה אי התערבות?
              אילו רווחים מניבה התערבות ואילו אי התערבות?
              מי יכול להרוויח/ להפסיד מההתערבות?
      - p: >-
          **אחרי הנציגים — מה לחבר, מתוך ההערות במקור.**
      - list:
          - >-
            **כרטיס א׳.** מי ששתה לא שוקל כמו לפני השתייה, ולכן יש מקום לחברים לעזור. זה שמצבים כאלה קורים הרבה
            לא הופך אותם לרצויים — ומי שמתערב עושה זאת מאכפתיות, ולפעמים יחד עם עוד מישהו או אחרי התייעצות.
          - >-
            **כרטיס ב׳.** קשה להתערב — מחשש לעימות, לאובדן אמון, ל״אזעקת שווא״, או שיראו בזה הלשנה. את החשש לא
            מבקרים; מבררים מה עומד מאחוריו. התערבות לא אומרת עימות פיזי — פועלים בדרכי נועם.
          - >-
            **כרטיס ג׳.** החברות היא ערך, וגם ההחלטה להתערב נשענת על ערכים. ובטווח הרחוק — איזה חבר אנחנו מעריכים
            יותר?
      - say: שמענו למה כן ולמה לא. נניח שהחלטתם לעזור — מה בדיוק אפשר לעשות?

