  body:
  - slide:
      title: נועם ואייל — שתי נקודות מבט
      sub: נועם חווה הצקות ואייל רואה ושותק. מה עשוי לעבור על כל אחד?
      art: pair
      echo: true
      alt: שתי דמויות יחד
  - p: בסיפור המקור ילדים מציקים לנועם ומשפילים אותו. אייל צופה ואינו אומר דבר. לאחר שגם אייל חווה השפלה, הוא
      מתחיל להבין מה נועם מרגיש וחובר אליו. מתמקדים בהתלבטות ובאפשרות לעזור, בלי להמחיז את ההצקות.
  - moves:
    - קראי את תיאור נועם ואייל; אין מציגים או ממחיזים אלימות.
    - בקשי לחשוב על רגשות שתי הדמויות.
    - הבהירי שהבנת פחדו של העד אינה מצדיקה פגיעה.
    - בתוך זמן העבודה, תני חצי דקה לחשיבה לבד ודקה להשוואה בזוג; בסיום הזמיני שני שיתופים למליאה.
  - say: נועם חווה הצקות ואייל רואה ושותק. מה עשוי לעבור על כל אחד?
  - task:
