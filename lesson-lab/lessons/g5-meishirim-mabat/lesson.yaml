  - p: 'המקרה: ילד מבקש להצטרף למשחק בהפסקה, והמשתתפים מסרבים. הוא נשאר לידם ואינו יודע לאן לפנות. בני הזוג
      מציעים דרכי תמיכה, ובודקים מתי נדרשת התערבות מבוגר.'
  - moves:
    - קראי את מקרה ההצטרפות למשחק.
    - בקשי לבדוק סיכון, צורך ורצון של הנפגע.
    - אספי פעולה אישית ופעולה עם מבוגר.
    - בתוך זמן העבודה, תני חצי דקה לחשיבה לבד ודקה להשוואה בזוג; בסיום הזמיני שני שיתופים למליאה.
