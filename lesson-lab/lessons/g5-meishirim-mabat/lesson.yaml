      rules: משתפים רק מה שנוח; מקשיבים עד סוף המשפט. אפשר לכתוב על דמות דמיונית.
      plenary: שני מתנדבים מציגים רעיון; השאר מוסיפים הבדל או שאלה.
      help: חשבו על פחד להיפגע ועל רצון לעזור.
      challenge: איך מבוגר יכול להפוך התערבות לבטוחה?
