          length: "2:58"
          before: מה מהניחושים שלכן יתברר כנכון?
          watch: שימו לב לתשובות לארבע השאלות — מה דומה למה שניחשתן, ומה חדש לכן.
          pauses:
            - at: "?"
              moment: >-
                בערך באמצע הסרטון, אחרי שהוא עונה על אחת מארבע השאלות שבשקף. צפי בו לפני השיעור, בחרי את הרגע
                ורשמי כאן את הזמן.
              ask: איזו שאלה כבר קיבלה תשובה? בלחישה לשכנה.
          alt: מחשב נייד, ודמות יושבת מולו
          art:
            - {use: laptop, x: 60, y: 180, w: 300}
            - {use: kid-sit, x: 400, y: 230, w: 170, color: teal, flip: true}
      - ask: >-
          האם משהו התחדש לכן בעקבות הצפייה? יש משהו שאתן רוצות לשאול או להגיד? ועכשיו — סרטון קצר על המחזור
          החודשי.

  # ------------------------------------------------------------------ 10′–14′
  - id: period
    title: המחזור החודשי
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: סרטון קצר על המחזור החודשי — שאלה לפני, עצירה אחת, ומקום לשאלות
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ותני כמה שניות לחשוב בשקט. לא עונים בקול.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה. אחרי השאלה — ממשיכים עד הסוף.
          - >-
            אחרי הצפייה — שאלי, ותני מקום לשאלות. מה שאת לא יודעת: ״אבדוק ואחזור אלייך״, והעבירי ליועצת או
            לאחות בית הספר.
      - video:
          title: המחזור החודשי
          url: https://youtu.be/FABAUJH_gqU
          length: "1:46"
          before: מה הייתן רוצות לדעת על המחזור החודשי?
          watch: שימו לב למשהו אחד שלא ידעתן — ולשאלה אחת שעוד נשארה לכן.
          pauses:
            - at: "?"
              moment: >-
                בערך באמצע הסרטון, ברגע שבו הוא עובר מנושא לנושא. צפי בו לפני השיעור, בחרי את הרגע ורשמי כאן את
                הזמן.
              ask: חשבו לעצמכן, בלי לענות בקול — מה מזה כבר ידעתן, ומה חדש?
          alt: לוח שנה עם יום מסומן
          art: calendar
      - ask: >-
          יש משהו שאתן רוצות לשאול או להגיד בעקבות הסרטון? ומהגוף — לרגש: מה מרגישים עם כל השינויים
          האלה?

  # ------------------------------------------------------------------ 14′–20′
  - id: feelings
    title: רגש — מה מרגישות?
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: ארבע שאלות על הרגשות שהשינויים מעוררים, וסרטון של מתבגרים — לאיזו אמירה התחברתן?
    body:
      - slide:
          kicker: רגש · בעקבות השינויים
          title: מה אנו מרגישות?
          points:
            - איך מרגישים כשהגוף מתחיל להשתנות?
            - אלו שינויים גופניים משמחים ומרגשים בנות?
            - ממה חוששות בנות?
            - איך מרגישות בנות כשההתפתחות לא באותו קצב עם כולן?
          verbatim: true
          echo: true
          alt: פנים שמחות, ולידן פנים עצובות
          art:
            - {use: face-happy, x: 330, y: 120, w: 220}
            - {use: face-sad, x: 80, y: 260, w: 170}
      - moves:
          - חשפי את השאלות אחת־אחת. לפני כל תשובה — עשר שניות של שקט.
          - שמעי כמה תשובות לכל שאלה. הדהדי, ושאלי מי מרגישה אחרת — יכולה להיות שונות, וזה בסדר.
          - >-
            בשאלה האחרונה התעכבי. אם לא עלה, הוסיפי שבגיל הזה חשוב להיות דומות לחברות, אבל כל קצב הוא טבעי וכולן
            מגיעות בסוף לאותו מקום; ושיש דאגות שקשה לדבר עליהן (המקור מביא כדוגמה שאלות סביב קבלת המחזור) — כדאי
            לדעת למי פונים: מבוגר שסומכים עליו, או מי שמבין במקצוע, ולא רק חברה.
          - הפעילי את הסרטון ועצרי בנקודת העצירה. אחרי הצפייה — שאלי לאיזו אמירה התחברו.
          - >-
            בסוף — שאלי למה היה חשוב לדבר גם על רגשות. אם לא עלה: ״כדי לדעת שאתן לא לבד, שכל התחושות נורמליות,
            ושכל קצב התפתחות הוא טבעי״.
      - video:
          title: המתבגרים — שינויים, חלק א׳
