steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: על מה נדבר היום?
    minutes: 4
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: שלושה כללים לשיחה, ״מה זו התבגרות מינית?״ לפני ההגדרה, וארבע נקודות המבט של השיעור
    body:
      - slide:
          kicker: לפני שמתחילות
          title: שלושה כללים לשיחה של היום
          points:
            - פרטיות — מדברות על הנושא, לא על אף אחת מאיתנו
            - בלי השוואות — לכל אחת הקצב שלה
            - מילים של מבוגרים — כמו בשיחה עם ההורים
          echo: true
          alt: מגן גדול, ומנעול לידו
          art:
            - {use: shield, x: 220, y: 110, w: 250}
            - {use: lock, x: 60, y: 320, w: 130}
      - moves:
          - הקריאי את שלושת הכללים, ואמרי שמבוכה היא חלק מהשיעור — גם מבוגרים מרגישים אותה.
          - שאלי מה זו התבגרות מינית, תני עשר שניות של שקט, ושמעי שתיים־שלוש תשובות — בלי לתקן.
          - >-
            רק אז הציגי את ההגדרה והקריאי אותה. הצביעי על המשפט האחרון — זו התשובה לשאלה ״למה מתרחשים
            השינויים?״.
          - הציגי את ארבע נקודות המבט — זו מפת השיעור.
      - say: >-
          השיעור הזה מתקיים בנפרד לבנות ולבנים, כדי שתרגישו נוח לשאול. נדבר על מה שקורה בגוף, על הרגשות — וגם על
          המבוכה, שיכולה להופיע כאן בשיעור. זה בסדר.
      - slide:
          kicker: רגע לחשוב
          title: מה זו התבגרות מינית?
          echo: true
          cue: אחרי הכללים —
          alt: דמות, ומעליה ענן מחשבה עם סימן שאלה
          art:
            - {use: thought, x: 60, y: 30, w: 320}
            - text: '?'
              x: 223
              y: 158
              size: 96
            - {use: kid-stand, x: 400, y: 210, w: 150, color: teal}
      - ask: מה זו לדעתכן התבגרות מינית? מילה או משפט — מי מוכנה?
      - slide:
          kicker: התבגרות מינית
          title: תקופת מעבר בין ילדות לבגרות
          sub: השינויים בגוף — מגוף של ילדה לגוף של נערה, ואחר כך לגוף של אישה.
          cue: אחרי שתיים־שלוש תשובות —
          alt: דמות קטנה, חץ, ואותה דמות גבוהה יותר
          art:
            - {use: kid-stand, x: 470, y: 320, w: 90, color: teal}
            - {use: arrow, x: 290, y: 380, w: 150, color: gray}
            - {use: kid-stand, x: 80, y: 180, w: 160, color: teal}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: >-
            גיל ההתבגרות הוא תקופת מעבר בין ילדות לבגרות. כחלק מהמעבר הזה מתרחשת התבגרות מינית. אלו השינויים
            הגופניים המתרחשים כאשר גופך משתנה מגוף של ילדה לגוף של נערה, ואחר כך לגוף של אישה. השינויים והתהליכים
            הביולוגיים והפיסיים המתרחשים בין ילדות לבגרות מכינים את הגוף שלך להתרבות בעתיד.
      - slide:
          kicker: מפת השיעור
          title: ארבע נקודות מבט
          points:
            - גוף — מה משתנה, ומה עוד ישתנה?
            - רגש — מה אנחנו מרגישות?
            - חברה — מה אומרים לנו, ואיך זה משפיע?
            - ערכים — מה מוביל אותנו?
          echo: true
          cue: אחרי ההגדרה —
          alt: יהלום עם ארבע פאות — גוף, רגש, חברה, ערכים
          art: {file: art/diamond.svg}
      - say: כל הנקודות האלה קשורות זו לזו. נתחיל בגוף.

  # ------------------------------------------------------------------ 4′–10′
  - id: body
    title: גוף — מה בעצם קורה?
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
    summary: ארבע שאלות ששאלו בנות בגילן — ניחוש בשקט ובלחישה, וסרטון שעונה עליהן
    body:
      - slide:
          kicker: גוף · שאלות ששאלו בנות בגילכן
          title: מה התשובות?
          points:
            - אלו שינויים מתרחשים בגוף?
            - האם כולם עוברים את השינויים באותו זמן?
            - איך בכלל יודעים שמתחילה ההתבגרות המינית?
            - כמה זמן נמשכת תקופת ההתבגרות המינית?
          verbatim:
            - points
          echo: true
          alt: דמות מרימה יד, ומעליה בועת דיבור עם סימן שאלה
          art:
            - {use: speech, x: 100, y: 40, w: 240}
            - text: '?'
              x: 220
              y: 119
              size: 90
            - {use: kid-hand, x: 340, y: 200, w: 150}
      - moves:
          - הציגי את השאלות. כל אחת בוחרת שאלה אחת ומנחשת את התשובה בשקט — עשרים שניות.
          - לחישה לשכנה — מה כל אחת ניחשה. ואז שמעי שתיים־שלוש השערות, בלי לתקן; התשובות בסרטון.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה. אחרי השאלה — ממשיכים עד הסוף.
          - >-
            אחרי הצפייה — שאלי מה התחדש, ותני מקום לשאלות. מה שאת לא יודעת: ״אבדוק ואחזור אלייך״, והעבירי
            ליועצת או לאחות בית הספר.
      - ladder:
          help: בחרו שאלה אחת, ונחשו את התשובה במילה או שתיים.
          challenge: איזו מהתשובות לדעתכן שונה מבת לבת — ולמה?
      - video:
