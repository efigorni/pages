sub: >-
  שיעור בנפרד לבנות: ההתבגרות המינית מארבע נקודות מבט — גוף, רגש, חברה וערכים — עם סרטונים קצרים, שיחה
  בקבוצות ומקום לשאול.
format: מליאה, סרטונים וקבוצות
question: מה קורה לנו בגיל ההתבגרות — בגוף, ברגש ובחברה — ולמי פונים כשמשהו מדאיג?
takeaways:
  - התבגרות מינית היא חלק מהמעבר מילדות לבגרות, והיא קורית בגוף, ברגש ובחברה.
  - כל אחת מתפתחת בקצב שלה, וכל קצב התפתחות הוא נורמלי.
  - כשמשהו מדאיג, לא נשארים לבד — יש למי לפנות.
prep:
  - חדר נפרד ומורה לשיעור המקביל של הבנים (״בנים״), באותה שעה
  - חלוקה לקבוצות של 4–5 לפי השולחנות, ומספר שאלה (1–3) לכל קבוצה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור — הוא מתקיים בנפרד לבנות ולבנים, ובאותה שעה מעבירים לבנים את השיעור המקביל.
      שאלי מי בכיתה שהנושא קרוב אליה מדי: מי שהתפתחה מוקדם או מאוחר ושומעת על זה הערות, מי שהמראה או האכילה
      מטרידים אותה, מי שעברה פגיעה, ומי שהחלוקה לבנות ולבנים לא פשוטה בשבילה — איתה מחליטים מראש, עם
      היועצת, לאיזו קבוצה היא מצטרפת. בקשי שתהיה זמינה אחרי השיעור, וסכמי איתה, או עם אחות בית הספר, מי עונה
      על שאלות שלא ידעת לענות עליהן.
  - head: מי עלול להיפגע
    text: >-
      בכיתה ז׳ ההבדלים בקצב ההתפתחות גדולים, ובנות דואגות אם הן ״בסדר״. מי שהתפתחה מוקדם, ומי שעוד לא, עלולות
      להרגיש חשופות. לא משווים ולא מצביעים על אף אחת — ״הנה דנה קיבלה כבר מחזור בכיתה ד׳״ הוא בדיוק מה שהמקור
      מבקש למנוע — ומדברים על ״בנות בגילכן״, לא על מי שבחדר. שימי לב גם למבטים ולצחוקים.
  - head: לא לוחצים לשתף
    text: >-
      שלושת הכללים של היום על השקף הראשון: פרטיות (לא חושפים מידע פרטי על אחרות, למשל מי כבר לובשת חזייה), בלי
      השוואות, ומילים של מבוגרים. אף אחת לא נשאלת על הגוף שלה. משתפות רק מתנדבות; מותר לוותר, ולא קוראים בשם
      למי שלא הצביעה. מבוכה וצחוק צפויים — תני להם שם והמשיכי.
  - head: אם מישהי משתפת פגיעה
    text: >-
      למשל נגיעה לא רצויה, הערות קבועות על הגוף, או דאגה שהיא נשארת איתה לבד — עוצרים בעדינות, מודים, וממשיכים
      בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. מחוץ לבית הספר, בכל
      שעה: ער״ן 1201 — עזרה ראשונה נפשית; ובפגיעה מינית — קווי הסיוע 1202 (עונות נשים) ו־1203 (עונים גברים). כל
      הקווים זמינים 24/7.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״ערכים״; פחות — ישר
    ל״חשוב לזכור״.
  short:
    steps: [body, society]
    text: בגוף מדלגים על הניחושים ועוברים ישר לסרטון, ובחברה מציגה רק ראשת קבוצה אחת לכל שאלה

brain_break:
  signs: מבוכה שהופכת לצחוק בלי סוף, ראשים על השולחן, שקט שלא נשבר.
  ideas:
    - name: סופרות עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהי אחרת אומרת מספר אחד, בלי סדר ובלי סימנים. שתיים אומרות יחד?
        מתחילות מאחת.
    - name: קצב בכפיים
      text: את מוחאת קצב קצר, והכיתה חוזרת עליו. בכל סבב הקצב קצת יותר מסובך.
    - name: מתיחה בעמידה
      text: קמות, ידיים למעלה, נמתחות לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
  from: clip

