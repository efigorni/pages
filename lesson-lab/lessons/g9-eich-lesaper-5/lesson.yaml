          - כתבו — מה תאמרו לדמות הזו? איך תספרו לה על האירוע ועל סיבת הפנייה אליה?
          - כתבו — מה אתם מצפים שהדמות תעשה, ומה לא?
      - task:
          what: >-
            כל קבוצה מקבלת כרטיס דמות — יפעת, המחנכת, ההורים של יפעת, ההורים שלכם, היועצת או המנהלת — וכותבת את
            הפתיחה של השיחה איתה: מה מדאיג אתכם, מה תגידו, ומה אתם מצפים שהדמות תעשה ומה לא.
          time: 5 דקות
          group: שש קבוצות לפי השולחנות; כרטיס דמות אחד לכל קבוצה
          rules: כותב אחד, וכולם מציעים משפטים; מדברים על יפעת וליאל, לא על אנשים אמיתיים
