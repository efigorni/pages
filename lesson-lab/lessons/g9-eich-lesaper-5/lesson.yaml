          help: התחילו במשפט — ״יש משהו שחשוב לנו לספר, כי אנחנו דואגים ליפעת…״
          challenge: ומה אם הדמות תגיב ״אולי אתם מגזימים?״ — מה תענו?
      - handout:
          title: הרקע — לכל הקבוצות
          copies: עותק לכל קבוצה
          verbatim: true
          text: >-
            אתם החברים של יפעת. היא נמצאת במצוקה אך היא אינה מעוניינת לקבל עזרה וודאי שהיא אינה מעוניינת שמישהו יידע על
            המצוקה הזו. לפעמים היא בעצמה לא בטוחה שהיא במצוקה, ונדמה לה שהיא יכולה לפתור הכול לבד. אתם רואים את
            ההידרדרות במצבה. יפעת אינה מעוניינת בשיתוף אדם מבוגר וחוששת ממנו מאוד. היא מביעה התנגדות ואף מאיימת בכך
            שהשיתוף עלול להוביל אותה להתנהגות מסוכנת יותר. למרות התנגדותה אתם מזהים שהיא זקוקה להתערבות מקצועית ועזרה.
            אתם לא מוכנים לוותר עליה ומחליטים לפנות עבורה לעזרה.
      - handout:
          title: כרטיסי דמויות
          copies: עותק אחד, גזור לשישה כרטיסים — כרטיס לכל קבוצה
          verbatim: true
          lines: false
          items:
            - >-
              בקבוצה זו אתם מחליטים לפנות ליפעת ולספר לה על כוונתכם לשתף מבוגר בקשייה במטרה לגייס אותו לעזרה והתערבות
              לטובתה
            - >-
              בקבוצה זו אתם מחליטים לפנות למחנך או מחנכת הכיתה ולספר להם על המצוקה והדאגה שלכם ליפעת, במטרה לגייס אותם
              לעזרה והתערבות לטובתה
            - >-
              בקבוצה זו אתם מחליטים לפנות להורים של יפעת ולספר להם על המצוקה והדאגה שלכם ליפעת, במטרה לגייס אותם
              להתערבות
            - >-
              בקבוצה זו אתם מחליטים לפנות להורים שלכם ולספר להם על המצוקה והדאגה שלכם ליפעת, במטרה לגייס אותם להתערבות
              לטובתה
            - >-
              בקבוצה זו אתם מחליטים לפנות ליועצת ביה״ס ולספר לה על המצוקה והדאגה שלכם ליפעת, במטרה לגייס אותה לעזרה
              מיידית והתערבות לטובתה
            - >-
              בקבוצה זו אתם מחליטים לפנות למנהל או מנהלת ביה״ס ולספר להם על המצוקה והדאגה שלכם ליפעת, במטרה לגייס אותם
              לעזרה מיידית והתערבות לטובתה
      - slide:
          kicker: למי נפנה?
          title: את מי ניתן לשתף?
          points:
