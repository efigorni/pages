            - מוקד 105 — המטה הלאומי להגנה על ילדים ברשת
          verbatim: true
          echo: true
          cue: כשהקבוצות סיימו להקריא —
          alt: דלת פתוחה, וטלפון לידה
          art:
            - {use: door, x: 300, y: 130, w: 200, color: teal}
            - {use: phone, x: 90, y: 200, w: 120, color: ink}
