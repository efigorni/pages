sub: >-
  מה עושים כשחבר במצוקה ומבקש לשמור סוד? בשיעור הזה קוראים פוסט אמיתי, נכנסים לראש של ליאל — בין הלשנה
  לאחריות — ומתרגלים איך פונים למבוגר. כי שיתוף מבוגר יכול להציל חיים.
format: מליאה, זוגות וקבוצות
question: מה עושים כשחבר במצוקה — ואיך מספרים למבוגר?
takeaways:
  - כשחבר במצוקה, לספר למבוגר זו לא הלשנה ולא בגידה — זו אחריות, דאגה, ולפעמים הצלת חיים.
  - יש למי לפנות — מחנכת, יועצת, הורים, ובטלפון קול לכולם 6312* וער״ן 1201.
  - כדאי לתרגל מראש מה אומרים — משפט פתיחה ברור עוזר לפנות בזמן אמת.
prep:
  - חלוקה מראש לשש קבוצות לפי השולחנות, ואיזה כרטיס דמות מקבלת כל קבוצה
  - שלוש ההנחיות לקבוצות (״מה תאמרו — ולמי?״) — כתובות על הלוח לפני השיעור
  - פתק קטן לכל תלמיד, לשלב ״הפוסט של ליאל״

safe:
  - head: תיאום עם היועצת
    text: >-
      בשיעור הזה התיאום הוא חובה, כך גם במקור. ספרי לה מתי השיעור ועל מה — פוסט אמיתי על חברה שניסתה להתאבד, ואיך
      ומתי פונים למבוגר. עברו יחד על מיפוי מעגלי הפגיעות של ״בוחרים בחיים״: מי פגע בעצמו בעבר, מי איבד אדם קרוב
      בהתאבדות, מי שמישהו במשפחתו במצב נפשי קשה, ומי שעובר עכשיו משבר. החליטו יחד אם להכין אותם מראש בשיחה אישית,
      ואם היא מצטרפת לשיעור. בקשי שתהיה זמינה אחרי השיעור ובמשך כל היום. צפי בשני הסרטונים לפני השיעור. במצגת
      המקורית יש גם מכתב להורים — החליטו יחד אם לשלוח אותו.
  - head: מי עלול להיפגע
    text: >-
      מי שפגע בעצמו, מי שאיבד אדם קרוב בהתאבדות, ומי שנמצא ממש עכשיו בנעליים של ליאל — שומר סוד של חבר ומרגיש
      אשם. אמרי בשיעור שאף פעם לא מאוחר לספר. לפני הקראת הפוסט אמרי שמי שצריך לצאת לרגע — יוצא, ותאמי מראש לאן
      (לחדר היועצת) ומי בודק מה שלומו. בהצגות את השיחה עם יפעת מקריאים, ואף אחד לא משחק את מי שבמצוקה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. מדברים על ליאל ויפעת,
      לא על אנשים אמיתיים, ובלי שמות. את שאלת המקור ״האם קרה לכם מקרה דומה?״ לא שואלים במליאה — מי שרוצה לספר כותב
      בכרטיס היציאה, או ניגש אלייך אחרי השיעור. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית מיד אחרי השיעור. בשיעור הזה כל רמז לסכנה עכשיו — תלמיד שמספר על
      מחשבות לפגוע בעצמו, או על חבר שאמר דברים כאלה — עובר ליועצת מיד, לא בסוף היום. לא מבטיחים לשמור בסוד: זה בדיוק
      מה שהשיעור מלמד — כשיש סכנה, מבוגר צריך לדעת.

