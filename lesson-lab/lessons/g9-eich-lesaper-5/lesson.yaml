  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ששת ״המסרים לחיים״ של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - say: >-
          עזרה של חבר היא דבר יקר — אבל יש מצבים שהיא לא מספיקה, וצריך מבוגר אחראי. החיים של החבר חשובים יותר מהחברות.
      - messages:
          title: מסרים לחיים
          items:
            - שיתוף מבוגר יכול להציל חיים
            - מבוגרים יכולים להקשיב למצוקות של ילדים ובני נוער ולעזור להם, יש להם הרבה ניסיון חיים וידע
            - אם יש ספק אין ספק
            - >-
              ״החבר חשוב יותר מהחברות״ — השיתוף במצוקתו יכול להציל את חייו
            - כדאי לתרגל דיבור פנימי מחזק ולהכיר מסרים בוני חוסן
            - >-
              לא להסס ובעת מצוקה קשה, לשאול את החבר ישירות את השאלה: ״האם חשבת לפגוע בעצמך?״
          ask: איזה משפט הכי חשוב שכל חבר בכיתה יזכור? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהפנייה למבוגר (1–2), דרך ההכרעה בדילמה (3–4), אל מה שכל אחד יכול לעשות — לעצמו ולחבר (5–6).
          alt: גלגל הצלה
          art:
            - {use: lifebuoy, x: 160, y: 120, w: 300}

