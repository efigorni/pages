sub: מתנסים בדמיון של לימון, מפרקים את המקרה של אדם לרצף מחשבה–רגש–תגובה, ובוחרים מזכרת נעימה שאפשר להיזכר
  בה.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך מחשבה משפיעה על הרגש ועל הפעולה שלנו?
takeaways:
- מחשבה משפיעה על התחושה, על הרגש ועל ההתנהגות שלנו לטובה או לרעה.
- זיכרון נעים עשוי לעזור במתח, לצד בדיקת המציאות ובקשת עזרה.
prep:
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: bulb
    x: 180
    y: 120
    w: 250
  alt: נורה
steps:
- id: part-1
  title: לימון בדמיון
  minutes: 5
  practices:
  - מה הקשר?
  - זמן חשיבה
  spotlights:
  - עניין ורלוונטיות
  summary: לימון בדמיון — האם דמיון יכול לשנות תחושה?
  body:
  - slide:
      title: האם דמיון יכול לשנות תחושה?
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה
      echo: true
  - moves:
    - הציעי לדמיין לימון חתוך וריחו, בעיניים פקוחות או עצומות לפי בחירה.
    - עצרי אחרי חצי דקה ובקשי לתאר שינוי אפשרי, בלי להבטיח שכולם ירגישו אותו דבר.
    - מי שאינו רוצה לדמיין מתבונן בדף.
  - ask: האם דמיון יכול לשנות תחושה?
  - ladder:
      help: האם שמתם לב למשהו בפה או בפנים?
      challenge: למה גם תשובה של לא הרגשתי שינוי חשובה בניסוי?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: המכשיר שלא נדלק
  minutes: 8
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: המכשיר שלא נדלק — מה חשב אדם לפני שבדק את החיבור?
  body:
  - slide:
      title: מה חשב אדם לפני שבדק את החיבור?
      art:
      - use: arrows-fork
        x: 180
        y: 120
        w: 250
      alt: שלושה כיוונים
      echo: true
      sub: ''
  - moves:
    - 'ספרי: אדם ניסה להפעיל את מכשיר המשחק, חשב שהתקלקל, התרגז ודחף אותו.'
    - אז גילה שהחוט לא מחובר.
    - 'בזוגות ציירו שלושה טורים: מחשבה, רגש, פעולה.'
    - הוסיפו מה היה אפשר לבדוק לפני הדחיפה.
  - ask: מה חשב אדם לפני שבדק את החיבור?
  - task:
      what: 'ציירו שלושה טורים: מחשבה, רגש ופעולה. מלאו אותם על אדם והמכשיר, והוסיפו בדיקה שהייתה יכולה
        לעזור.'
      time: 5 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: איזו מחשבה הופיעה לפני הכעס?
      challenge: איך משתנה הרגש אם חושבים שאולי המכשיר רק לא מחובר?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: מזכרת שמזמינה זיכרון
  minutes: 9
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מזכרת שמזמינה זיכרון — איזה פרט עוזר להיזכר ברגע נעים?
  body:
  - slide:
      title: איזה פרט עוזר להיזכר ברגע נעים?
      art:
      - use: heart
        x: 180
        y: 120
        w: 250
      alt: לב
      echo: true
      sub: ''
  - moves:
    - כל אחד מצייר חפץ או מקום הקשור לרגע נעים קטן; אין צורך להביא דבר מהבית.
    - בזוגות משתפים רק במה שבוחרים, או מתארים דוגמה דמיונית.
    - נסו לזכור צבע, קול או פרט אחר.
    - תני שש דקות ליצירה ושתי דקות להקשבה.
  - ask: איזה פרט עוזר להיזכר ברגע נעים?
  - task:
      what: ציירו מזכרת לרגע נעים קטן. בחרו פרט אחד שקל לזכור ושתפו בו רק אם רוצים.
      time: 6 דקות לעבודה ושאר הזמן לשיתוף
      group: יחידים ואחר כך זוגות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: אפשר לבחור משחק, מפגש או צחוק משותף.
      challenge: מה עושה את הזיכרון הזה משמעותי, מעבר לחפץ עצמו?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: מזמינים מחשבה, לא מוחקים קושי
  minutes: 6
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מזמינים מחשבה, לא מוחקים קושי — איך ניעזר בזיכרון כשאנחנו במתח?
  body:
  - slide:
      title: איך ניעזר בזיכרון כשאנחנו במתח?
      art:
      - use: signpost
        x: 180
        y: 120
        w: 250
      alt: שלטי כיוון
      echo: true
      sub: ''
  - moves:
    - הציגי מצב של המתנה לתור בפעילות אהובה.
    - כל זוג מתכנן עצירה, העלאת פרט מהמזכרת ופעולה מתאימה בזמן ההמתנה.
    - הזמיני זוג להדגים.
    - הדגישי שזיכרון נעים אינו פתרון לפגיעה או תחליף לבקשת עזרה.
  - ask: איך ניעזר בזיכרון כשאנחנו במתח?
  - task:
      what: תכננו לדמות שממתינה לתורה עצירה קצרה, זיכרון נעים ופעולה מתאימה בזמן ההמתנה.
      time: 3 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: איזה פרט מהציור תוכלו להעלות בדמיון?
      challenge: מה תעשו אם הזיכרון לא משנה מיד את ההרגשה?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - מחשבה משפיעה על התחושה, על הרגש ועל ההתנהגות שלנו לטובה או לרעה.
      - מחשבות רעות באות לבד והן די נפוצות בראש שלנו. מחשבות טובות יכולות להשפיע לטובה על מצב הרוח שלנו,
        אך אותן יש להזמין בדרך כלל ולדאוג שיופיעו באופן יזום! אפשר לזמן מחשבות טובות בעזרת מזכרות או זיכרונות
        של חוויות טובות, שיעזרו לנו להתמודד עם מצבים מאתגרים.
      - כדאי לי להשתמש בכלי לניהול המחשבות הטובות והרעות, כי הוא יעזור לי לאזן את ההרגשה שלי במצב של מתח
        וקושי, כדי שאוכל לחזור לפעילות הרגילה שלי ולדברים החשובים לי.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - כתבו מחשבה ורגש אפשריים של מי שמחכה לתורו.
      - איזה זיכרון או פעולה יוכלו לעזור לו בזמן ההמתנה?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: אין לדרוש זיכרון משפחתי או חפץ יקר; אפשר לבחור רגע קטן ודמיוני.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
