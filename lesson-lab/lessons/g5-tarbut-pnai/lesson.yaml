slug: g5-tarbut-pnai
title: תרבות הפנאי והתנהגויות סיכון
grade: 5
grades_served:
- 5
slide_kickers: false
month: יוני
section: סיום וסיכום שנה (יוני)
unit: חוסן – יישום הכלים בהקשר החברתי
src_text: sources/text/5/Tarbut_Pnai.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/5Grade/Mamlachti/Tarbut_Pnai.pptx
sensitivity: med
sub: מזהים את האבנים הגדולות שלנו, ממיינים מצבי סיכוי וסיכון ובונים תכנית חופשה קטנה עם גבול פנימי.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך מתכננים זמן פנוי שיש בו בחירה וגבולות?
takeaways:
- מצבי סיכון יכולים להתפתח במהלך זמן פנוי.
- תכנון וגבולות מסייעים לבחירה; מבוגרים שותפים להגנה ולסיוע.
prep:
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: calendar
    x: 180
    y: 120
    w: 250
  alt: לוח שנה
steps:
- id: part-1
  title: האבנים הגדולות
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: האבנים הגדולות — מה חשוב לכם שייכנס לחופשה?
  body:
  - slide:
      title: מה חשוב לכם שייכנס לחופשה?
      art:
      - use: calendar
        x: 180
        y: 120
        w: 250
      alt: לוח שנה
      echo: true
  - moves:
    - תני שלוש דקות לכתיבת שני דברים חשובים שאינם חייבים לעלות כסף.
    - אספי שתי דוגמאות והבדילי בין מה שחשוב לבין מה שפשוט ממלא את הזמן.
  - ask: מה חשוב לכם שייכנס לחופשה?
  - ladder:
      help: אפשר לבחור מנוחה, חבר, יצירה או זמן משפחה.
      challenge: אם הזמן מוגבל, מה תרצו לשמור קודם?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: צנצנת של זמן
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: צנצנת של זמן — למה סדר הבחירה משנה?
  body:
  - slide:
      title: למה סדר הבחירה משנה?
      art:
      - use: scale
        x: 180
        y: 120
        w: 250
      alt: מאזניים
      echo: true
      sub: ''
  - moves:
    - 'ספרי את רעיון ההמחשה במילים שלך: כשממלאים כלי קודם בפרטים קטנים, לא נשאר מקום לדברים הגדולים; כשנותנים
      מקום למה שחשוב, אפשר לסדר סביבו דברים נוספים.'
    - בזוגות ציירו יום דמיוני ובחרו אבן גדולה אחת לפני שאר הפעילויות.
  - ask: למה סדר הבחירה משנה?
  - task:
      what: ציירו יום דמיוני ושבצו קודם דבר אחד שחשוב לכם, ואחריו מנוחה ופעילויות נוספות.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: איפה ייכנס זמן מנוחה בתוך התכנית?
      challenge: האם כל רגע פנוי צריך להיות מלא בפעילות?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: סיכוי וסיכון
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: סיכוי וסיכון — מתי נרצה להציב גבול פנימי?
  body:
  - slide:
      title: מתי נרצה להציב גבול פנימי?
      art:
      - use: traffic-light
        x: 180
        y: 120
        w: 180
      alt: רמזור
      echo: true
      sub: ''
  - moves:
    - 'הציגי מצבים: משחק עד שעה מאוחרת, הזמנה לפעילות יצירה, לחץ לשתף הודעה מעליבה, בילוי עם חבר באזור
      לא מוכר.'
    - 'רביעיות ממיינות בעזרת רמזור: עצירה; בירור עם מבוגר; פעילות מתאימה בתנאים בטוחים.'
    - כל קבוצה מנמקת גבול חיצוני וגבול שהיא בוחרת לעצמה.
  - ask: מתי נרצה להציב גבול פנימי?
  - task:
      what: מיינו את המצבים לרמזור של החלטה ונמקו. בחרו גבול חיצוני וגבול פנימי שיסייעו לשמור על בטיחות.
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה צריך לברר לפני שמסכימים?
      challenge: איך אומרים לא ללחץ חברתי ומציעים פעילות אחרת?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: התכנית שלי
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: התכנית שלי — איך נשאיר מקום גם לכיף וגם לבטיחות?
  body:
  - slide:
      title: איך נשאיר מקום גם לכיף וגם לבטיחות?
      art:
      - use: signpost
        x: 180
        y: 120
        w: 250
      alt: שלטי כיוון
      echo: true
      sub: ''
  - moves:
    - 'כל זוג מתכנן חצי יום לדמות: אבן גדולה, זמן מנוחה, גבול מסך וכתובת לעזרה.'
    - הזמיני שני זוגות להשוות תכניות ולהוסיף חלופה ללא כסף או ציוד.
    - הדגישי שתכנון אינו מבטיח שלא יקרה קושי ושמבוגרים אחראים להגנה.
  - ask: איך נשאיר מקום גם לכיף וגם לבטיחות?
  - task:
      what: תכננו חצי יום עם דבר חשוב, מנוחה, גבול מסך וכתובת לעזרה. הוסיפו חלופה שאינה דורשת כסף או ציוד.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מתי עוצרים ובודקים מחדש את התכנית?
      challenge: מה אפשר לשנות אם החבר או המקום אינם זמינים?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - מצבי סיכון יכולים להתפתח במהלך זמן פנוי.
      - היכולת להגדיר לעצמנו גבול פנימי, היא כוח שלנו !
      - עלינו להיות ערניים לגבול הפנימי שלנו על מנת להימנע מלהיות חשופים לסיכונים בזמן החופשה.
      - לכל אחד אחריות לשמור על עצמו ולתכנן את הזמן הפנוי שלו כך שיחווה אותו כזמן סיכוי.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - כתבו אבן גדולה שתרצו לשמור לה זמן.
      - כתבו גבול פנימי ועם מי תתייעצו כשלא בטוחים.
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: שיח על סיכון ברשת ובזמן פנוי; אין לשאול מי התנסה בסיכון ואין להאשים נפגע שלא תכנן.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; מוקד 105 — המטה הלאומי להגנה על ילדים
    ונוער ברשת, 24/7'
