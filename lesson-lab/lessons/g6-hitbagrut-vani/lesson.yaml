  # ------------------------------------------------------------------ 23′–26′
  - id: talk
    title: מה עזר לכם להחליט?
    minutes: 3
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: במליאה — באיזו סיטואציה התלבטנו, מה הקשה ומה עזר; כוחות ורצונות סותרים
    body:
      - slide:
          kicker: חוזרים למקומות
          title: באיזו סיטואציה הכי התלבטתם?
          points:
            - מה הקשה עליכם?
            - מה — או מי — עזר לכם להחליט?
          echo: true
          alt: מאזניים, ודמות עומדת לידם
          art:
            - {use: scale, x: 270, y: 120, w: 300}
            - {use: kid-stand, x: 90, y: 250, w: 130, color: teal}
      - moves:
