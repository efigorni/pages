# התבגרות ואני — כיתה ו׳, שואפים לבחור נכון, שיעור 1 (מקור: sources/text/6/Hitbagrut_Vani.md)
# כותרת האתר "עברית"; השם מהמצגת. שאר היחידה הם חדרי לומדה ברכזת (פער, D38).
