sub: >-
  בשנה הבאה מחכה לנו חטיבת הביניים, ואיתה מצבים חדשים. בשיעור הזה בודקים מה משתנה אצלנו, מכירים את
  המושג ״קו אדום״, ועומדים על קו אמיתי מול חמש סיטואציות.
format: מליאה, זוגות ועמידה על קו
question: מה הקו האדום שלי — ומה יעזור לי לשמור עליו כשקשה?
takeaways:
  - בגיל ההתבגרות אנחנו מחליטים יותר ויותר בעצמנו — ויש גם מצבים חדשים שמעמידים אותנו בהתלבטות.
  - לכל אחד יש קווים אדומים — חלקם נקבעים מבחוץ, וחלקם לפי הערכים והתחושות שלנו.
  - >-
    ברגע של התלבטות אפשר לעצור ולחשוב, להקשיב לתחושת הבטן, להציע דרך אחרת ולהתייעץ — וכדאי להתכונן לזה
    מראש.
prep:
  - >-
    סרט או חבל אדום ארוך — מודבק לאורך רצפת הכיתה, או ששני תלמידים מותחים אותו; מקום פנוי משני צידיו

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — התבגרות, קווים אדומים ומצבי סיכון, כולל סיגריה אלקטרונית. שאלי אם יש
      בכיתה מי שהנושא קרוב אליו מדי: מי שמעשנים אצלו בבית, מי שכבר ניסה, או מי שחבורה לוחצת עליו עכשיו.
      בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שמעשנים אצלו בבית — מדברים על ההחלטה ועל הלחץ, לא על ״מעשנים״ כאנשים. ב״מה משתנה אצלנו?״ יש בתים
      עם כללים אחרים, ויש מי שלא גדל אצל ההורים — אומרים ״ההורים, או מי שמגדל אתכם״. ובכיתה עלול להיות מי
      שעשו לו מתיחה טלפונית — לא שואלים מי עשה, ולמי.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. ב״מה משתנה אצלנו?״ מרימים יד בעיניים
      עצומות — הכללים בבית הם עניין אישי — ומותר לא להרים. ב״תלמידי כיתה ז׳״
      כותבים על תלמידי כיתה ז׳, לא על עצמנו. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל לחץ לעשן שקורה עכשיו, או ששלח סיסמה למישהו שהכיר במשחק — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת יש קווים: ער״ן —
      1201 (עזרה ראשונה נפשית, 24/7), והמוקד הלאומי לגמילה מעישון של משרד הבריאות — 6800* (א׳–ה׳, 8:00–20:00;
      עונה גם לבני נוער). ספרי עליהם לתלמיד שצריך.
  - head: עמידה מול הכיתה
    text: >-
      על הקו עומדים לפי סיטואציה דמיונית, לא לפי מה שקרה. מותר לעמוד על הקו עצמו; מסבירים רק מתנדבים, ורק
      על עצמם. צחוק או הערה על המקום של מישהו — עוצרים מיד. בסיטואציה של הסיגריה האלקטרונית לא שואלים מי
      ניסה, ומי שמסביר מדבר על ההחלטה — לא על חברים.

