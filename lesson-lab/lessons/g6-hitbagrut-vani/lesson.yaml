          - סכמי בהקראה של המשפט מהמקור.
      - ask: באיזו סיטואציה הכי התלבטתם — ומה, או מי, עזר לכם להחליט?
      - say: אז מה שעזר לך זה ___ — הבנתי נכון? למי עוד זה עוזר?
      - quote:
          title: לסיכום — להקריא
          text: >-
            המצבים בהם עסקנו מעמידים אותנו בדילמה כיוון שלא פעם יש כוחות ורצונות סותרים שמשפיעים עלינו - התפיסות,
            הערכים, החינוך שלנו, החשש ממה יקרה והצורך להשתייך ולהתנהג לפי מה שאנו חושבים שמצפים מאיתנו.

