  # ------------------------------------------------------------------ 36′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שמונת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - say: מה אפשר לעשות כשצריך לבחון מחדש את הקו האדום? שמונה משפטים — אחד־אחד.
      - messages:
          items:
            - לעצור, לחשוב, לא לפעול לפי הטייס האוטומטי שלנו.
            - הקשיבו לתחושת הבטן שלכם. אם משהו מרגיש לא טוב, זה כנראה לא טוב.
            - >-
              אם אתם לא רוצים לעשות משהו, אתם לא צריכים לעשות אותו, הבחירה היא שלכם והאחריות היא שלכם.
            - חשבו על האפשרויות העומדות בפניכם. מה יקרה אם תעברו את הקו האדום ומה יקרה אם לא?
            - אמרו מה שאתם חושבים, הציעו דרך חלופית טובה יותר עבורכם ועבור הסביבה.
            - בלו את זמנכם עם חברים שהבחירות שלהם מאפשרות לכם להרגיש נוח.
            - כדאי להתייעץ עם מישהו שאתם סומכים עליו או בוטחים בו.
            - הכנה, הכנה, הכנה! כמו לפני מבחן, חשוב להתכונן למצבים של התלבטות.
          ask: >-
            איזה משפט מהשמונה הכי יעזור לכם ברגע של התלבטות? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            השמונה הם ארגז כלים: לעצור ולהקשיב לעצמי (1, 2), לבחור ולשקול (3, 4), לומר ולהציע (5), לבחור חברים
            ולהתייעץ (6, 7) — ולהתכונן מראש (8).
          alt: מגן גדול, ודמות עומדת לידו
          art:
            - {use: shield, x: 300, y: 100, w: 280, color: purple}
            - {use: kid-stand, x: 100, y: 220, w: 140, color: teal}

