brain_break:
  signs: עיניים כבדות, ראשים על השולחן, או רעש שלא נרגע אחרי המשחק.
  ideas:
    - name: מראה
      text: >-
        בזוגות, פנים מול פנים. אחד מוביל תנועות ידיים איטיות, והשני משקף אותן כמו מראה; אחרי דקה מתחלפים.
    - name: ניעור לאחור
      text: >-
        עומדים ומנערים יד ימין חמש פעמים, יד שמאל, רגל ימין ורגל שמאל — ואז ארבע פעמים, שלוש, עד אחת.
    - name: אגודל וזרת
      text: יד אחת מראה אגודל, השנייה זרת — ובמחיאת כף מחליפים. כל סבב מהר יותר.
