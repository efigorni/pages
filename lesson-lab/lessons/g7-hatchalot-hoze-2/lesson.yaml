steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: game
    title: זמן משחק — ״שבץ נא״
    minutes: 7
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      כל אחד כותב את שמו על רצועת משבצות, והכיתה בונה לוח שמות שזורים — בלי לדבר, ורק אחד קם בכל פעם
    body:
      - slide:
          kicker: זמן משחק · ״שבץ נא״ · הכנה
          title: כתבו את שמכם על רצועת נייר
          sub: אות בכל ריבוע.
          echo: true
          alt: רצועת נייר מחולקת לריבועים, ובה השם ירדן, ועיפרון לידה
          art: {file: art/strip.svg}
      - moves:
          - חלקי רצועה לכל תלמיד. דקה לכתיבת השם.
          - הציגי את שקף המשחק ואת שקף הכללים, והקריאי אותם. אל תוסיפי שום כלל מעבר למה שעל המסך.
          - >-
            על שאלות כמו ״מי מתחיל?״ או ״איפה שמים?״ — חזרי רק על מה שכתוב. הסתובבי ושימי לב מי מצליח לשבץ,
            מי מוותר, ואיך הכיתה ״לוקחת תור״.
          - אחרי חמש דקות של משחק — עצרי, גם אם לא כולם הספיקו.
      - p: הבלבול הוא המשחק. זה הרגע לשתוק ולהתבונן — הדיון שאחריו נבנה ממה שתראי עכשיו.
      - say: דקה לכתוב את השם. אחר כך — המשחק. כל ההוראות על המסך, ואין מעבר להן.
      - slide:
          kicker: ״שבץ נא״ · המשחק
          title: לוח שמות כיתתי — השמות של כולנו שזורים זה בזה
          sub: ירדן יכולה לשים את שמה בסמוך לשי מכיוון שהאות י׳ היא משותפת אבל לא תוכל להתחבר לדפנה
          verbatim: [sub]
          echo: true
          cue: אחרי שכל אחד כתב את שמו —
          alt: שתי רצועות שמות מצטלבות — ירדן לרוחב ושי לאורך — באות המשותפת י׳
          art: {file: art/names.svg}
      - slide:
          kicker: ״שבץ נא״ · שימו לב
          title: מותר רק לתלמיד/ה אחד/אחת לקום
          sub: אסור לדבר בכלל.
          verbatim: true
          echo: true
          cue: ומיד אחריו —
          alt: דמות אחת עומדת, ומעליה בועת דיבור עם איקס
          art:
            - {use: speech, x: 70, y: 50, w: 250}
            - {use: cross, x: 141, y: 84, w: 108}
            - {use: kid-stand, x: 330, y: 160, w: 170, color: teal}
      - say: עצרו — גם מי שעוד לא הספיק. נשארים במקום.

  # ------------------------------------------------------------------ 7′–12′
  - id: debrief
    title: מה קרה במשחק?
    minutes: 5
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: מילה אחת על איך הרגשתם; דיון — איך נקבע התור, ואילו כללים היו עוזרים
    body:
      - slide:
          kicker: אחרי המשחק · מילה אחת
          title: איך הרגשתם במהלך המשחק?
          sub: כתבו מילה אחת — לפני שמדברים.
          timer: 30
          echo: true
          alt: שלוש פנים — שמחות, ניטרליות ועצובות
          art:
            - {use: face-happy, x: 420, y: 210, w: 150}
            - {use: face-meh, x: 210, y: 160, w: 200}
            - {use: face-sad, x: 50, y: 210, w: 150}
      - moves:
          - חצי דקה לכתיבה בשקט — כך גם מי שלא הצליח לשבץ את שמו מגיע לדיון עם מילה משלו.
          - >-
            שמעי מילים מכמה פינות בכיתה, ואחר כך שאלי איך נקבע התור. תני לתלמידים להגיב זה לזה — ״מי הרגיש אחרת?
            למה?״
          - >-
            סכמי במשפט — הכללים לא היו ברורים, וזה מה שיצר את הבלבול. תני מקום לכל הרגשות — מבוכה, תסכול, חוסר
            אונים.
          - שאלי אילו כללים היו עוזרים, ורק אחרי כמה תשובות — חשפי את הדוגמאות שעל המסך.
      - ladder:
          help: איך הרגשתם כשמישהו אחר קם — ואיך כשאתם רציתם לקום?
          challenge: מה הייתם משנים במשחק, כדי שכולם יצליחו לשבץ את השם?
      - ask: איך נקבע מי קם ומתי? האם התגבשו כללים — ואיך?
      - say: >-
          הכללים לא היו ברורים, וההוראות לא היו מדויקות. מי שהרגיש מבולבל, נבוך או מתוסכל — זה בדיוק מה שקורה
          כשאין כללים.
      - slide:
          kicker: ״שבץ נא״
          title: אלו כללים היו יכולים לעזור לנו?
          points:
            - סדר הכתיבה — מתי התור שלי
            - מיקום הכתיבה — איפה מותר לשים את השם, ולאיזה כיוון
            - שינויים — מותר להזיז שם למקום אחר?
            - כללי השיח — מותר לעזור ולהציע לחברים איפה לשים?
          echo: true
          cue: אחרי כמה תשובות מהכיתה —
          alt: רמזור, ודמות עומדת לידו
          art:
            - {use: traffic-light, x: 340, y: 110, w: 160}
            - {use: kid-stand, x: 130, y: 200, w: 130, color: teal}

  # ------------------------------------------------------------------ 12′–18′
  - id: helps
    title: עוזר ועוצר
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      מהמשחק לכיתה — כל אחד כותב מתי היה לו נעים לדבר בכיתה ומתי לא; בזוגות משווים, ובמליאה בונים שני טורים
    body:
      - slide:
          kicker: ובכיתה?
          title: אלו כללים יסייעו לנו לשוחח ביחד בכיתה?
          verbatim: [title]
          echo: true
          alt: ארבעה סביב שולחן עגול, ובועת דיבור מעליהם
          art:
            - {use: circle4, x: 150, y: 196, w: 320}
            - {use: speech, x: 390, y: 24, w: 200}
      - quote:
          title: מהמקור — להקריא
          text: >-
            בשיעורי ״הכ״חות שבדרך״ אנחנו נוהגים לשוחח על מצבים מהחיים, לשתף בחוויות, ברגשות ובמחשבות ולהקשיב זה
            לזה.
      - say: >-
          במשחק ראינו מה קורה בלי כללים. בשיעורים האלה נדבר גם על דברים אישיים — ולכן חשוב שנחליט יחד מה עוזר
          לנו לדבר, ומה עוצר אותנו.
      - slide:
          kicker: זמן כתיבה · עוזר ועוצר
          title: מתי נעים לדבר בכיתה — ומתי לא?
          points:
            - עוזר — מתי היה לכם נעים לדבר ולהשתתף בשיחה בכיתה? מה אפשר את זה?
            - עוצר — מתי לא היה לכם נעים להביע עמדה? מה עצר?
          timer: 120
          echo: true
          cue: אחרי ההקראה —
          alt: דמות כותבת ליד שולחן, ומעליה וי ואיקס
          art:
            - {use: kid-desk, x: 190, y: 196, w: 246}
            - {use: check, x: 350, y: 30, w: 150}
            - {use: cross, x: 120, y: 30, w: 150}
      - moves:
          - הקריאי את הקטע, והציגי את שאלת הכתיבה. שתי דקות בשקט, במחברת — הכתיבה לא נאספת.
          - דקה וחצי בזוגות, עם השכן — כל אחד משתף רק מה שהוא בוחר, ומחפשים מה דומה אצל שניכם.
          - במליאה — שרטטי על הלוח שני טורים, ״עוזר״ ו״עוצר״. כל זוג אומר תנאי אחד, ואת רושמת.
      - board: עוזר · עוצר
      - whisper: >-
          אם הלוח מתמלא לאט — דוגמאות מהמקור. עוזר — כשמקשיבים לי, לא מתפרצים לדבריי, לא צוחקים על מה שאני
          אומר, ומחליטים שמה שנאמר נשאר בכיתה. עוצר — כשמבקרים, מקטינים או מזלזלים במה שאני אומר ומרגיש, כשמנסים
          להתווכח עם הרגשות שלי, או כשלועגים לי.
      - ladder:
          help: חשבו על שיעור אחד שבו דיברתם בלי לחשוש — מה עשו האחרים?
          challenge: מה הופך ״עוצר״ ל״עוזר״? בחרו תנאי אחד, ונסחו אותו מחדש ככלל.
      - ask: מה עוזר לכם לדבר בכיתה — ומה עוצר אתכם? תנאי אחד מכל זוג.

  # ------------------------------------------------------------------ 18′–27′
  - id: contract
    title: החוזה שלנו
    minutes: 9
    practices:
      - מהלכי שיח
      - זמן חשיבה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: מהטורים על הלוח לכללים — דיון, ארבע ההנחיות של ״שיח מעודד ומקבל״, ובחירה משותפת של החוזה
    body:
      - slide:
          kicker: החוזה שלנו
          title: אלו כללים יסייעו לי להרגיש בטוח יותר בשיעור?
          sub: מה אני מצפה מעצמי? ומהכיתה?
          verbatim: [title, sub]
          echo: true
          alt: דף חוזה, עיפרון וסימן וי
          art:
            - {use: note, x: 200, y: 50, w: 240}
            - {use: pencil, x: 410, y: 300, w: 170}
            - {use: check, x: 50, y: 320, w: 150}
      - moves:
          - >-
            שאלי, וחכי עשר שניות לפני שאת מזמינה תשובות. כל הצעה — הפכי לכלל קצר, ושאלי ״מי מסכים? למה? איך זה
            נראה בפועל?״
          - >-
            חפשי בטור ״עוצר״ — מכל ״עוצר״ אפשר לבנות כלל (״צוחקים עליי״ ← ״לא צוחקים על מה שמישהו אומר״).
          - הציגי את ״שיח מעודד ומקבל״, וחברי כל הנחיה להצעה שכבר עלתה.
          - >-
            הצבעה — אילו שני כללים של הכיתה נכנסים לחוזה, יחד עם ארבע ההנחיות. מתנדב כותב את החוזה על הגיליון, וכל
            מי שרוצה חותם עליו ביציאה.
      - ask: אלו כללים יעזרו לכם להרגיש בטוחים יותר בשיעור — ומה זה אומר בפועל?
      - say: אז הכלל שהצעת הוא ___ — הבנתי נכון? מי מסכים? איך זה ייראה אצלנו?
      - slide:
          kicker: הנחיות לשיח מיטבי
          title: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          cue: אחרי כמה הצעות מהכיתה —
          alt: בועת דיבור גדולה, ובתוכה לב
          art:
            - {use: speech, x: 150, y: 70, w: 320}
            - {use: heart, x: 245, y: 118, w: 130}
      - say: ארבע ההנחיות, ועוד שני כללים שבחרנו — זה החוזה שלנו. מי שרוצה, חותם עליו בדרך החוצה.

  # ------------------------------------------------------------------ +5′
  - id: replay
    title: ״שבץ נא״ עם כללים
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
