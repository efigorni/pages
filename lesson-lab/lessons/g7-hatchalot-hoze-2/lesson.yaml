sub: >-
  בלי כללים קשה לשחק — וגם לדבר. בשיעור הזה משחקים ב״שבץ נא״ של שמות בלי כללים, בודקים מה עוזר לנו
  לדבר בכיתה ומה עוצר אותנו, ומנסחים יחד חוזה כיתתי.
format: משחק, כתיבה אישית, זוגות ומליאה
question: אילו כללים יעזרו לכל אחד מאיתנו להרגיש בטוח לדבר בכיתה?
takeaways:
  - כשהכללים לא ברורים קשה לשתף פעולה, ומרגישים בלבול, מבוכה ותסכול.
  - לדבר בכיתה עוזר כשמקשיבים, מכבדים ולא שופטים — ועוצר כשצוחקים או מזלזלים.
  - חוזה שמחליטים עליו יחד שומר על מקום בטוח לכל אחד, וכל אחד שומר עליו.
prep:
  - >-
    רצועת נייר מחולקת לריבועים לכל תלמיד (אפשר לגזור מדפי משבצות), וחתיכות נייר דבק מוכנות
  - >-
    מקום ללוח השמות — גיליון גדול שתלוי על הקיר, או חלק בלוח שלא יימחק עד סוף השיעור. השאר הלוח פנוי לטורים
    ״עוזר״ ו״עוצר״.
  - גיליון גדול לחוזה הכיתתי, וטוש עבה
  - דפים וטושים צבעוניים (להרחבה ״כלל בדרך יצירתית״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — חוזה כיתתי וכללי שיח, ובמרכזו משחק שנועד לתסכל ושאלה על רגעים שבהם לא
      היה נעים לדבר בכיתה. שאלי אם יש בכיתה מי שחווה לעג, חרם או פגיעה בבית הספר הקודם, ובקשי שתהיה זמינה
      אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      ״שבץ נא״ בנוי כך שלא כולם יצליחו לשבץ את השם — מי ששמו ארוך או בלי אות משותפת, מי שמתבייש לקום, מי
      שנדחק החוצה. אל תצביעי על מי שלא הצליח; ההסבר הוא תמיד הכללים, לא האנשים. ב״עוצר״ עלולים לעלות
      זיכרונות של לעג — מדברים על התנאים, לא על הסיפורים ולא על מי עשה מה.
  - head: לא לוחצים לשתף
    text: >-
      הכתיבה של ״עוזר ועוצר״ נשארת במחברת ולא נאספת. בזוג משתפים רק מה שבוחרים, ובמליאה — רק תנאים, בלי שמות
      ובלי פרטים. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל לעג או חרם שעדיין נמשכים — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את
      היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
