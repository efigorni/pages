steps:
  # ------------------------------------------------------------------ 0′–8′
  - id: names
    title: מתחברים בשמות
    minutes: 8
    practices:
      - מה הקשר?
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
    summary: >-
      כל אחד כותב את אותיות השם שלו על פתקים; בשתי קבוצות מחברים את השמות דרך אות משותפת, כמו בתשבץ —
      ובסוף מחברים גם את שתי הקבוצות
    body:
      - slide:
          kicker: מה הקשר? · מתחברים בשמות
          title: כתבו את השם שלכם — כל אות על פתק
          sub: בגדול, ובטוש.
          timer: 90
          echo: true
          alt: שלושה פתקים, ועל כל אחד אות — ד, נ, ה — ועיפרון מתחתיהם
          art: {file: art/name-tiles.svg}
      - moves:
          - הפתקים והטושים כבר על השולחנות. הציגי את השקף, ותני דקה וחצי לכתוב.
          - חלקי את הכיתה לשתי קבוצות, כל אחת סביב שני שולחנות צמודים — או על הרצפה.
          - >-
            הסבירי את החיבור: הראשון מניח את השם שלו בשורה, וכל מי שמוצא אות משותפת מתחבר אליה, כמו בתשבץ.
            כמה אנשים יכולים להתחבר בבת אחת.
          - הסתובבי בין הקבוצות. מי שלא מוצא אות — הציעי לו להתחבר דרך שם המשפחה.
          - כששתי הקבוצות סיימו — שאלי איזו אות יכולה לחבר את שני התשבצים, וצלמי את התוצר.
      - say: >-
          המטרה של כל הכיתה: שכל השמות יתחברו לתשבץ אחד. אין מנצחים — מצליחים רק כשגם השם האחרון מתחבר.
      - slide:
          kicker: מתחברים בשמות · בשתי קבוצות
          title: מתחברים דרך אות משותפת
          sub: אין אות משותפת? מתחברים דרך שם המשפחה.
          echo: true
          cue: כשכולם כתבו —
          alt: שני שמות על פתקים, נועה לרוחב ועומר לאורך, נפגשים באות ע
          art: {file: art/name-cross.svg}
      - task:
          what: >-
            כל קבוצה בונה תשבץ מהשמות של כולם: כל שם מתחבר לשם אחר דרך אות אחת משותפת. בסוף מחברים גם את
            שני התשבצים.
          time: 4 דקות
          group: שתי קבוצות, כל אחת סביב שני שולחנות צמודים
          rules: >-
            אות סופית נחשבת כמו רגילה (ם כמו מ); מי שלא מוצא אות — מתחבר דרך שם המשפחה; עוזרים זה לזה
            למצוא מקום
          plenary: כולם מסתכלים יחד על התשבץ הגדול
          help: חפשו אות שיש בהרבה שמות — כמו י, ו או ה.
          challenge: נסו להתחבר לשני שמות בבת אחת — אות אחת לכל שם.
      - p: אפשר לתלות את התמונה של התשבץ בכיתה, או לשים אותה כתמונת הנושא בקבוצת הכיתה.
      - ask: מה הקשר בין השמות שלנו — ומה זה אומר על הכיתה?

  # ------------------------------------------------------------------ 8′–11′
  - id: listen
    title: איך מקשיבים בזוג?
    minutes: 3
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
    summary: >-
      ארבעה מכללי השיח של המקור; הכיתה בוחרת את הכלל שהכי חשוב כשנפגשים בזוג עם מי שעוד לא מכירים
    body:
      - slide:
          kicker: לפני שנפגשים בזוגות
          title: הנחיות לשיח מיטבי
          points:
            - שיח מעודד ומקבל
            - שיתוף מהלב
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החברים
          verbatim: true
          echo: true
          alt: שתי דמויות יושבות זו מול זו, ולב ביניהן
          art:
            - {use: kid-sit, x: 50, y: 235, w: 190, color: orange}
            - {use: kid-sit, x: 380, y: 235, w: 190, color: teal, flip: true}
            - {use: heart, x: 235, y: 90, w: 150}
      - moves:
          - חשפי את הכללים אחד־אחד. בינתיים שני תלמידים מחלקים לכל אחד כרטיס משחק ומקרא.
          - שאלי איזה כלל הכי חשוב כשנפגשים בזוג, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - על כל תשובה — הדהדי, ושאלי את הכיתה ״מי מסכים? איך זה נראה בפגישה?״
      - ask: איזה כלל הכי חשוב כשנפגשים בזוג עם מישהו שעוד לא מכירים — ואיך הוא נראה בפגישה?
      - say: >-
          ועוד כלל אחד: מה שנאמר בזוג נשאר בזוג — אפשר לספר לאחרים על הנושא, אבל רק על עצמנו.

  # ------------------------------------------------------------------ 11′–23′
  - id: cards
    title: חיבורים בריבוע
    minutes: 12
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      כל אחד מקבל כרטיס עם איורים; בכל סבב זוג חדש מוצא את האיור היחיד שמשותף לשני הכרטיסים, ושני בני
      הזוג משתפים לפי ההנחיה שלו במקרא — ארבעה סבבים
    body:
      - slide:
          kicker: חיבורים בריבוע · בזוגות מתחלפים
          title: מצאו את האיור המשותף
          points:
            - נפגשים בזוג ומשווים את שני הכרטיסים
            - מוצאים את האיור המשותף — יש בדיוק אחד
            - מחפשים אותו במקרא, ושניכם משתפים לפי ההנחיה
            - ״מחליפים!״ — זוג חדש, ומתחילים שוב
          echo: true
          alt: שני כרטיסים עם איורים, ועל שניהם אותה שמש, מחוברת בקו מנוקד
          art: {file: art/two-cards.svg}
      - moves:
          - >-
            חשפי את ארבעת השלבים, והדגימי מול הכיתה עם מתנדב: שני כרטיסים, האיור המשותף, ההנחיה במקרא, ומשפט
            מכל אחד.
          - בדקי הבנה בשאלה אחת — ״מה עושים כשמוצאים את האיור?״ — ושלחי לסבב הראשון.
          - הסתובבי בין הזוגות ושימי לב שאף אחד לא נשאר לבד. אם צריך — הצטרפי בעצמך, עם כרטיס.
          - כשהטיימר נגמר — קראי ״מחליפים!״ והפעילי אותו שוב. ארבעה סבבים.
      - say: >-
          בין כל שני כרטיסים במשחק יש בדיוק איור אחד משותף. מצאתם? חפשו אותו במקרא, ושניכם משתפים לפי
          ההנחיה.
      - task:
          what: >-
            מסתובבים ונפגשים בזוג, משווים את שני הכרטיסים ומוצאים את האיור היחיד ששניהם חולקים. מחפשים אותו
            במקרא, ושני בני הזוג משתפים לפי ההנחיה שלו. ב״מחליפים!״ — מחפשים בן זוג חדש.
          time: שתי דקות וחצי לכל סבב, ארבעה סבבים
          group: זוגות מתחלפים — בכל סבב בן זוג חדש
          rules: >-
            מי שבלי זוג מרים את הכרטיס למעלה, ומי שפנוי ניגש אליו; מספר אי־זוגי — שלישייה, וכל שניים בתוכה
            מוצאים את האיור שלהם
          plenary: בסוף הסבב הרביעי נשארים עם בן הזוג האחרון
          help: התחילו מהאיור הכי גדול בכרטיס שלכם, וחפשו אותו אצל בן הזוג.
          challenge: אחרי ששניכם משתפים — שאלו שאלה אחת על מה שבן הזוג סיפר.
      - handout:
          title: המקרא — חיבורים בריבוע
          copies: עותק לכל תלמיד, יחד עם הכרטיס
          verbatim: true
          lines: false
          items:
            - המאכל האהוב עליי — פיצה, המבורגר, מרק, גבינה
            - החיה האהובה עליי — כלב, חתול, סוס, פרפר
            - הספורט האהוב עליי — כדורגל, כדורסל, אופניים, שחייה
            - התחביב האהוב עליי — ציור, קריאה, פאזל, צילום
            - יעד הטיול החלומי שלי — מטוס, מזוודה, מפה, קמפינג
            - הקינוח האהוב עליי — עוגה, עוגייה, גלידה, סוכרייה
            - עונת השנה האהובה עליי — קיץ, חורף, סתיו, אביב
            - הסרט או הסדרה האהובים עליי — קולנוע, טלוויזיה, כרטיס
            - המוזיקה האהובה עליי — תו, מיקרופון, אוזניות
            - כוח העל שהייתי רוצה — לעוף לחלל, קסם, לנבא עתיד
            - המשחק האהוב עליי — שלט משחק, אפליקציה, קובייה
            - המקצוע האהוב עליי בבית הספר — מדעים, מתמטיקה, תיאטרון
            - המקום האהוב עליי ביישוב — בית הספר, הפארק, הבריכה
            - המקום האהוב עליי בארץ — חוף הים, הרים, העיר
            - החג האהוב עליי — בלונים, מסיבה, מתנות
            - מזג האוויר האהוב עליי — גשם, ברקים, קשת
      - slide:
          kicker: חיבורים בריבוע · סבב אחרי סבב
          title: מצאתם? שתפו לפי ההנחיה
          sub: ב״מחליפים!״ — זוג חדש.
          timer: 150
          echo: true
          cue: כשהסבב הראשון מתחיל —
          alt: שתי דמויות זו מול זו, ושתי בועות דיבור מעליהן
          art:
            - {use: kid-stand, x: 410, y: 270, w: 120, color: teal}
            - {use: kid-stand, x: 90, y: 270, w: 120, color: orange}
            - {use: speech, x: 330, y: 40, w: 220}
            - {use: speech-l, x: 70, y: 80, w: 220}
      - ask: הסבב הראשון נגמר — מי מצא את האיור המשותף? איזו הנחיה יצאה לכם?

  # ------------------------------------------------------------------ 23′–27′
  - id: reflect
    title: מה גיליתם על הכיתה?
    minutes: 4
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: >-
      משפט אחד להשלים — לבד, עם בן הזוג של הסבב האחרון, ובמליאה: מה הפתיע, מה שמתם לב, מה הבנתם
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: בחרו משפט אחד והשלימו אותו
          points:
            - הפתיע אותי ש…
            - שמתי לב שבכיתה שלנו…
            - היה מעניין לגלות ש…
            - הבנתי שאני…
          verbatim:
            - points
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו נורה דולקת
          art:
            - {use: thought, x: 40, y: 30, w: 280}
            - {use: bulb, x: 133, y: 72, w: 92}
            - {use: kid-stand, x: 400, y: 230, w: 140, color: teal}
      - moves:
          - כולם נשארים עם בן הזוג של הסבב האחרון. חצי דקה לחשוב לבד — ואפשר לכתוב.
          - דקה בזוג — כל אחד משלים משפט אחד.
          - במליאה שמעי שלושה–ארבעה, הדהדי, ושאלי ״למי עוד זה קרה?״
      - ladder:
          help: חשבו על הסבב שהכי נהניתם בו — מה גיליתם שם?
          challenge: מה משותף לכל החיבורים שמצאתם היום — ומה זה אומר על הכיתה שלנו?
      - ask: מה הפתיע אתכם היום? מה שמתם לב בכיתה שלנו?
      - say: כל אחד מאיתנו שונה — ובכל זאת מצאנו היום הרבה חיבורים. הנה מה שכדאי לקחת מזה.

  # ------------------------------------------------------------------ +5′
  - id: more-rounds
    title: סבב אתגר
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: עוד שני סבבים — ואחרי ההנחיה, כל זוג מחפש עוד דבר משותף אחד שאין על הכרטיסים
    body:
      - slide:
          kicker: אם נשאר זמן · סבב אתגר
          title: מצאו עוד דבר משותף — שאין על הכרטיס
          sub: קודם משתפים לפי ההנחיה, ואז ממשיכים לחפש.
          timer: 150
          echo: true
          alt: שתי דמויות יד ביד, וזכוכית מגדלת לידן
          art:
            - {use: pair, x: 320, y: 250, w: 230}
            - {use: magnifier, x: 70, y: 60, w: 200}
      - moves:
          - הציגי את האתגר, וקראי ״מחליפים!״ — שני סבבים נוספים, עם בני זוג חדשים.
          - בסוף כל סבב שאלי שני זוגות מה עוד גילו שמשותף להם.
      - say: הפעם, אחרי ההנחיה — חפשו עוד דבר אחד שמשותף לשניכם, שאין עליו איור בכרטיס.
      - task:
          what: >-
