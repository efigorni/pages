# מחוברים כאן ועכשיו — כיתה ז׳, חיבורים, שיעור 2 (מקור: sources/text/7/Ptichat_Shana_2.md)
slug: g7-ptichat-shana-2
title: מחוברים כאן ועכשיו
grade: 7
grades_served: [7]
month: ספטמבר
section: מיומנויות לחיזוק כוחות וחוסן להתנהלות מיטבית בשגרה ובחירום (ספטמבר)
unit: חיבורים
unit_order: 2
unit_size: 2
src_text: sources/text/7/Ptichat_Shana_2.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/7Grade/Mamlachti/Ptichat_Shana_2.pptx
sensitivity: low

sub: >-
  בתחילת השנה עוד לא מכירים את כולם. בשיעור הזה מחברים את השמות של כל הכיתה לתשבץ אחד, ומשחקים
  ב״חיבורים בריבוע״ — בכל סבב זוג חדש מוצא את האיור המשותף שלו, ומגלה עוד משהו זה על זה.
format: קבוצות, זוגות מתחלפים ומליאה
question: מה מחבר בינינו — ואיך מוצאים חיבור גם עם מי שעוד לא מכירים?
takeaways:
  - כל אחד מאיתנו ייחודי — ובכל זאת יש בינינו הרבה חיבורים.
  - חיבורים מוצאים כששואלים, משתפים ומקשיבים — גם עם מי שעוד לא מכירים.
  - ככל שנכיר טוב יותר, יהיה לנו נעים יותר ללמוד ולבלות יחד בכיתה.
prep:
  - חבילת פתקים (פתקי ממו) וטוש לכל שולחן — למשחק השמות ולהרחבה ״הנחיה משלנו״
  - >-
    כרטיסי ״חיבורים בריבוע״ — 40 כרטיסים עם איורים, להדפסה מהמצגת המקורית (הקישור בתחתית המערך,
    שקפים 16–25, ארבעה כרטיסים בעמוד). גוזרים: כרטיס לכל תלמיד. שם גם המקרא עם האיורים (שקף 11), אם
    רוצים להדפיס אותו במקום המקרא שבמערך.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק סבב האתגר;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - names
      - cards
    text: >-
      במשחק השמות כל קבוצה בונה תשבץ משלה, בלי לחבר בסוף את שתי הקבוצות, וב״חיבורים בריבוע״ — שלושה
      סבבים במקום ארבעה

brain_break:
  signs: ראשים על השולחן ופיהוקים — או להפך, כיתה שקשה לה להירגע אחרי המשחק.
  ideas:
    - name: פרח ונר
      text: שואפים לאט באף, כאילו מריחים פרח, ונושפים לאט בפה, כאילו מכבים נר. חמש פעמים.
    - name: מתיחה בישיבה
      text: ידיים מעל הראש, נמתחים עד התקרה ומשחררים לאט. שלוש פעמים, ובפעם האחרונה — בעיניים עצומות.
    - name: דקה של צלילים
      text: >-
        דקה של שקט מוחלט. כל אחד סופר בלב כמה צלילים שונים הוא שומע מחוץ לכיתה, ובסוף שומעים כמה
        מספרים.
  from: category

cover:
  sub: מוצאים חיבורים — בשמות, במאכלים ובחלומות.
  alt: שלוש דמויות יחד, ומעליהן רשת של עיגולים מחוברים
