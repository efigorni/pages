    <g stroke="#13100e" stroke-width="5" stroke-linejoin="round">
      <rect x="430" y="96" width="132" height="132" rx="14" fill="#fdf0dd" transform="rotate(-5 496 162)"/>
      <rect x="244" y="110" width="132" height="132" rx="14" fill="#e6f2f1" transform="rotate(3 310 176)"/>
      <rect x="58" y="96" width="132" height="132" rx="14" fill="#eeecf7" transform="rotate(-3 124 162)"/>
