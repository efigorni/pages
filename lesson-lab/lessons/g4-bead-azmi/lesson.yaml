safe:
- head: תיאום עם היועצת
  text: תאמי מראש את השיעור ואת האפשרות לשיחה אישית אחריו; בדקי מי מהתלמידים עשוי להזדקק לליווי בנושא.
- head: מי עלול להיפגע
  text: המקור עוסק בדימוי גוף וערך עצמי. אל תבקשי הערכות מראה, משקל, אוכל או הרגלי היגיינה פומביים; אין השוואה בין גופים.
- head: לא לוחצים לשתף
  text: אפשר לכתוב על דמויות המקור, לצייר או לעבור. אין צורך להסביר לכיתה מדוע בוחרים לא לשתף.
- head: אם מישהו משתף פגיעה
  text: 'הקשיבי בלי לחקור מול הכיתה, הודִי על השיתוף ופני ליועצת לפי נוהלי בית הספר. אל תבטיחי לשמור בסוד. לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
