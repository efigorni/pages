  - p: >-
      פולי הוא פיל בעל זיכרון טוב ויכולת הנהגה. צ׳יקיטה היא צ׳יטה מהירה, טובה בספורט ובעלת שמיעה חדה.
      צפי הוא ציפור שמכירה דרכים, עצים ופירות ואוהבת לספר סיפורים. השלושה מוצאים מפה עתיקה ויוצאים יחד לחפש אוצר.
  - moves:
    - הציגי את שלוש הדמויות ואת חיפוש האוצר.
    - הבהירי שזהו מסע קצר שמציג ארבע תחנות, לא כל תרגילי התוכנית.
  - say: הקשיבו לכוחות של פולי, צ׳יקיטה וצפי. בחרו כוח שעוזר לקבוצה לצאת למסע.
  - task:
      what: הקשיבו לכוחות של פולי, צ׳יקיטה וצפי. בחרו כוח שעוזר לקבוצה לצאת למסע.
      time: 2 דקות
      group: זוגות
      rules: אפשר לבחור דמות מהמקור; בלי שמות של תלמידים ובלי חובה לשתף מידע אישי
