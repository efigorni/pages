  spotlights:
  - הערכה ורפלקטיביות
  summary: מסרי המקור, כל מסר בפני עצמו, וחיבור לפעילות
  body:
  - messages:
      items:
      - לכל אחד מהעדים לאירוע פגיעה או אלימות יש תפקיד, שמשפיע על התפתחות האירוע.
      - ניתן לבחור לשנות את התפקיד, ובכך גם אפשר לשנות את התפתחות האירוע. כל אחד יכול לבחור את התפקיד שלו.
      - "מי שמתעלם מאירוע פגיעה או אלימות, מאפשר לה להתרחש. \nלכל אחד ואחת מאיתנו יש את היכולת לחולל שינוי,\
        \ להשפיע, להפסיק פגיעה ולעשות טוב."
      ask: איזה מסר מתחבר להתנסות שלכם היום? חשבו בשקט, ואז הצביעו כשאקרא את המסר שבחרתם.
