safe:
- head: תיאום עם היועצת
  text: תאמי מראש כיצד לפנות לשיחה אישית בעקבות תפקיד לכל תפקיד. הכיני אפשרות לצאת לזמן קצר בליווי מבוגר מוכר.
- head: מי עלול להיפגע
  text: שמות התפקידים עלולים להפוך לתיוג חברים. דברי רק על מעשי הדמויות; אל תבקשי לזהות פוגע או נפגע בכיתה,
    ואל תטילי אשמה על ילד שקפא.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על אדם או על דמות דמיונית, לכתוב במקום לדבר או לעבור. אין מבקשים פרטים אישיים או שמות של
    ילדים.
- head: אם מישהו משתף פגיעה
  text: 'הודי לו על האמון, עצרי שאלות מהכיתה והמשיכי בפרטיות עם היועצת; אל תבטיחי סודיות כשנדרשת הגנה. המבוגרים
    אחראים לטפל בפגיעה. לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; מוקד 105 — המטה הלאומי
    להגנה על ילדים ונוער ברשת, 24/7.'
