  # ------------------------------------------------------------------ 6′–14′
  - id: court
    title: בית המשפט — בעד או נגד?
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      הכיתה הופכת לבית משפט: נציג בעד ונציג נגד, שלושה טיעונים לכל צד, והמושבעים מצביעים בעיניים עצומות
    body:
      - say: היום הכיתה הופכת לבית משפט. אנחנו המושבעים — ולנו כוח גדול, כוח ההצבעה.
      - slide:
          kicker: בית המשפט · הכללים
          title: בעד או נגד?
          points:
            - מציגים טיעונים בכבוד ובשפה נקייה
            - המושבעים — פני פוקר, ושקט
            - שאלה אחת לכל צד
            - ההצבעה היא הכוח של המושבעים
          echo: true
          alt: מאזניים מאוזנים
          art: scale
      - quote:
          title: כללי המשחק מהמקור — להקריא
          text: |-
            על ההגנה והתביעה להציג את הטיעונים בצורה מכבדת, בשפה תקינה ובמקצועיות יתרה!
            עליכם המושבעים לשמור על ארשת פנים חתומה (פני פוקר) ולהיות בשקט בזמן שהטיעונים מוצעים.
            לאחר שלב הטיעונים תתאפשר שאלה אחת לכל צד מהמושבעים.
            בידיכם המושבעים כוח גדול – כוח ההצבעה – זאת הדרך שלכם להצביע ולהשפיע!
      - moves:
          - >-
            הסבירי — לכל אירוע נציג ״בעד״ ונציג ״נגד״, ושלושה טיעונים לכל אחד. מה שהנציג אומר הוא תפקיד, לא
            הדעה שלו.
          - בחרי שני מתנדבים. חצי הכיתה עוזרת לנציג ״בעד״ וחצי לנציג ״נגד״ — דקה של לחישות טיעונים.
          - >-
            שלושה טיעונים לכל צד, שאלה אחת מהמושבעים לכל צד, ואז הצבעה בעיניים עצומות — כך אף אחד לא רואה את היד
            של השכן.
          - אחרי ההצבעה שאלי מה שכנע, ומה הם היו עושים במקרה דומה.
      - slide:
          kicker: אירוע 1 · בעד או נגד?
          title: ללכת עם בגד שלא אוהבים — כי כולם מתלבשים כך
          echo: true
          cue: אחרי הכללים —
          alt: שלוש דמויות יחד, ודמות אחת עומדת בצד
          art:
            - {use: group3, x: 290, y: 260, w: 300}
            - {use: kid-stand, x: 70, y: 260, w: 112, color: teal}
      - task:
          what: >-
            שני נציגים — בעד ונגד — מציגים כל אחד שלושה טיעונים, וחצי הכיתה עוזרת לכל נציג להכין אותם. המושבעים
            שואלים שאלה אחת לכל צד, ומצביעים בעיניים עצומות.
          time: דקה הכנה, שתי דקות טיעונים, דקה לשאלות ולהצבעה
          group: שני נציגים מתנדבים; חצי כיתה מאחורי כל נציג
          rules: הנציג משחק תפקיד — זו לא הדעה שלו; מכבדים, ולא צוחקים על אף אחד
          plenary: אחרי ההצבעה — מה שכנע, ומה הייתם עושים במקרה דומה
          help: בעד — מה מרוויחים כשהולכים עם כולם? נגד — מה מפסידים?
          challenge: חשבו על הטיעון הכי חזק של הצד השני — ואיך הייתם עונים עליו.
      - ask: מה שכנע אתכם?
      - ask: כיצד אתם הייתם פועלים במקרה דומה, ומדוע?

  # ------------------------------------------------------------------ 14′–20′
  - id: round2
    title: אירוע שני — והפעם כותבים
    minutes: 6
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: >-
      אירוע שני באותם כללים — אבל לפני ההצבעה כל מושבע כותב על פתק מה הוא מחליט ולמה; אחר כך — לחץ של חבר אחד
      מול לחץ של כל הכיתה
    body:
      - slide:
          kicker: אירוע 2 · בעד או נגד?
          title: הציעו לי חברות, ואין לי עניין
          sub: וכל הכיתה לוחצת שאסכים.
          echo: true
          alt: קבוצה גדולה קוראת כן! כן!, ודמות אחת עומדת מולה
          art:
            - {use: crowd, x: 300, y: 280, w: 290}
            - {use: speech, x: 330, y: 30, w: 240}
            - text: כן! כן!
              x: 450
              y: 112
              size: 44
            - {use: kid-stand, x: 80, y: 181, w: 140, color: teal}
      - moves:
          - >-
            שני נציגים חדשים ואותם כללים. הפעם, לפני ההצבעה, כל מושבע כותב על פתק את ההחלטה שלו ולמה — במשפט אחד.
          - הצבעה בעיניים עצומות, ואז שמעי שניים–שלושה פתקים בקול — רק של מי שמסכים.
          - שאלי את שאלת ההמשך, והזמיני את הכיתה להגיב זה לזה — מי מסכים? מי חושב אחרת?
      - ladder:
          help: כתבו ״בעד״ או ״נגד״, ומילה אחת — למה.
          challenge: מה הייתם אומרים לכיתה שלוחצת — במשפט אחד שלא פוגע באף אחד?
      - ask: מה ההבדל בין לחץ של חבר אחד לבין לחץ של כל הקבוצה?
      - say: >-
