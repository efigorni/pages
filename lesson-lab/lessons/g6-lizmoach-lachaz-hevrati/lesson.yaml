      שלושה פתקים

brain_break:
  signs: ראשים על השולחן, פיהוקים, ויכוחים שמתחילים לעלות בטון.
  ideas:
    - name: שקט של מושבעים
      text: >-
        כולם ״פני פוקר״: עיניים עצומות, פנים בלי תזוזה, נשימה איטית — שלושים שניות של שקט מוחלט, ואז מתיחה.
    - name: עמוד–שב
      text: >-
        ב״עמוד״ קמים, ב״שב״ מתיישבים — ומי שמתבלבל, צוחק ומצטרף שוב. כל סבב מהר יותר, ולפעמים ״עמוד״ פעמיים.
    - name: מחיאה בשרשרת
      text: מחיאת כף עוברת מתלמיד לתלמיד לאורך הכיתה. בסבב השני — מהר יותר.
  from: discuss

