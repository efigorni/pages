  # ------------------------------------------------------------------ 36′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: אחד־עשר המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - כולם עשויים להיקלע למצב של לחץ קבוצתי.
            - לחץ חברתי מעורר דאגה וחשש.
            - כל אחד שואל את עצמו לפעמים איך אשמור על הייחודיות שבי, ועל הרצונות שלי?
            - >-
              כל אחד דואג מפני המחירים שמשלמים על דבקות בעמדות ובעקרונות או על הליכה ״נגד הזרם״
            - גם ברשתות החברתיות מופעל לחץ חברתי.
            - >-
              לכל אחד ולכל אחת יש תמיד דרך לשמור על עצמם במצבי לחץ חברתי – פשוט אמרו ״לא!״
            - אם קשה לומר לא, צריך להרוויח זמן ולפנות לעזרה.
            - >-
              קבוצת השווים היא המקום הבטוח והמועדף על המתבגרים. יחד עם זאת, השייכות לקבוצת השווים מחייבת אותם
              לעיתים לבחירות לא פשוטות הקשורות להתמקמות שלהם ביחס לנורמות, לסגנונות התנהגות ולהחלטות בנושאים שונים.
            - >-
              המתבגרים לומדים לנוע על הרצף שבין להתפשר ולהסתדר לבין לעמוד על עקרונותיהם, גם במחיר של להיות שונה
              ואחר. משימת ההתמקמות החברתית אינה פשוטה.
            - >-
              ביום יום אנו נעים על רצף בין שני מצבי החיים, הקונפורמיזם והאינדיבידואליזם. אנו שואפים לפתח בתוכנו
              מנגנון פנימי שמאפשר גמישות והסתגלות, ללא ויתור על ערכים או על אמיתות אישיות.
            - >-
              לכל אדם יש חופש בחירה. יש מצבים בהם נדרשת תנועה על רצף – לעיתים אדם בוחר להיות כמו כולם, להתנהג
              באופן דומה ולקבל עליו חוקים, כללים ונורמות, כחלק מהסדר החברתי. לעומת זאת, לעיתים אדם נדרש לעמוד על
              דעתו, להתעקש לפעול בדרכו ולא לוותר על ערכיו או על דעותיו.
          ask: >-
            איזה משפט הייתם רוצים לזכור ברגע שלוחצים עליכם? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהלחץ ומהדאגה (1–5), דרך הדרך החוצה — ׳לא!׳, זמן ועזרה (6–7), אל הרצף שבין להיות כמו כולם
            לבין לעמוד על שלנו (8–11). ״קונפורמיזם״ — ללכת עם כולם; ״אינדיבידואליזם״ — ללכת בדרך שלי.
          alt: מגן גדול, ודמות עומדת לידו
          art:
            - {use: shield, x: 320, y: 90, w: 250, color: purple}
            - {use: kid-stand, x: 100, y: 200, w: 140, color: teal}

