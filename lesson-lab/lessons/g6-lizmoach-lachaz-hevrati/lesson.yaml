sensitivity: med

sub: >-
  כולם רוצים להיות חלק מהקבוצה — ולפעמים הקבוצה דורשת משהו שלא רוצים. בשיעור הזה שומעים ילדים שאמרו ׳לא׳,
  הופכים את הכיתה לבית משפט, ומנסחים שאלות שעוזרות לעצור ולחשוב לפני שמחליטים.
format: סרטון, משחק תפקידים, קבוצות ומליאה
question: למה קשה לעמוד מול לחץ של הקבוצה — ומה עוזר לבחור מה נכון לי?
takeaways:
  - כולנו עלולים להיקלע ללחץ חברתי, וזה מעורר דאגה — גם ברשת.
  - לכל אחד יש דרך לשמור על עצמו — לומר ׳לא׳, להרוויח זמן ולפנות לעזרה.
  - שאלות פשוטות לפני החלטה — מה נכון לי? מה החוק? עם מי אפשר להתייעץ? — עוזרות לא להיגרר.
prep:
  - פתקים קטנים לכל הכיתה — להצבעה הכתובה באירוע השני
  - חלוקה מראש לקבוצות של ארבעה לפי השולחנות, ל״כללי אצבע״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — לחץ חברתי, משחק ״בית משפט״ על אירועים של לחץ (בגד, הצעת חברות, חרם), וכתיבה
      קצרה. שאלי אם יש בכיתה מי שהנושא קרוב אליו עכשיו: מי שחווה חרם או לחץ מהכיתה, מי שהציעו לו ״חברות״ בלחץ,
      או מי שנפגע מ״דירוגים״ בקבוצה הכיתתית. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהאירועים קרובים מדי לחייו. לכן בית המשפט עוסק רק באירועים, לא באנשים מהכיתה — בלי שמות ובלי ״כמו
      ש…״. הנציגים משחקים תפקיד: מי שטען ״בעד״ לא חושב כך בהכרח, וכשהסבב נגמר חוזרים להיות עצמנו, בלי כינויים.
      ההצבעה בעיניים עצומות, כך שאף אחד לא נחשף.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו״. נציגים — רק מתנדבים; פתק מההצבעה הכתובה נקרא בקול רק אם הכותב
      מסכים. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל חרם שקורה עכשיו, לחץ ל״חברות״ או לנגיעה, או לחץ לעשן ולשתות — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 19 דקות ומעלה — שתי ההרחבות; 14–18 דקות — רק ״אירוע שלישי״; פחות —
    ישר ל״חשוב לזכור״.
  short:
