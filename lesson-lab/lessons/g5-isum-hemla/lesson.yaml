sub: מתבוננים ברגע של דן ליד הלוח וברגע של אדם מול הציון, ומתרגמים אכפתיות לצעד מועיל ומכבד.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך חמלה עוזרת לפעול כשאחר מתקשה וכשאני מתקשה?
takeaways:
- רגש החמלה מקרב ומחבר בין ילדים ואנשים.
- חמלה כוללת אכפתיות ופעולה, גם כלפי עצמנו.
prep:
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: hands-help
    x: 180
    y: 120
    w: 250
  alt: ידיים מושטות
steps:
- id: part-1
  title: כשהדרך קשה למישהו
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: כשהדרך קשה למישהו — מה אפשר לעשות כשחבר מתקשה בטיול?
  body:
  - slide:
      title: מה אפשר לעשות כשחבר מתקשה בטיול?
      art:
      - use: hands-help
        x: 180
        y: 120
        w: 250
      alt: ידיים מושטות
      echo: true
  - moves:
    - הציגי דמות שמתקדמת לאט בעלייה.
    - תני שלוש דקות לכתיבה של תגובה אפשרית.
    - אספי שתי הצעות ובדקי אם הן מכבדות את הרצון של מי שמתקשה.
  - ask: מה אפשר לעשות כשחבר מתקשה בטיול?
  - ladder:
      help: אפשר לשאול מה יעזור במקום להחליט עבורו.
      challenge: איך שומרים גם על צרכי הקבוצה וגם על כבוד החבר?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: דן ליד הלוח
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: דן ליד הלוח — מה מרגיש אדם כשהוא רואה את דן?
  body:
  - slide:
      title: מה מרגיש אדם כשהוא רואה את דן?
      art:
      - use: pair
        x: 180
        y: 120
        w: 250
      alt: זוג
      echo: true
      sub: ''
  - source_slide:
      slides:
      - 10
      why: מציגים את התוכן המקורי המתואר בפעילות וקוראים רק את החלק הדרוש לתרגול.
      art:
      - use: pair
        x: 180
        y: 120
        w: 250
      alt: זוג
  - moves:
    - 'ספרי: דן השקט מצייר היטב, אך אינו ממהר לשתף.'
    - כשניגש לפתור תרגיל, הוא נתקע וחוזר למקום.
    - אדם רוצה לשבת לצדו.
    - בזוגות הבחינו בין לגלוג, רחמים וחמלה; חמלה מכירה בקושי ומציעה עזרה בלי להתנשא.
  - ask: מה מרגיש אדם כשהוא רואה את דן?
  - task:
      what: השוו בין לגלוג, רחמים וחמלה ברגע של דן ליד הלוח. הציעו משפט שמאפשר לו לבחור אם לקבל עזרה.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה אפשר לומר לדן בלי לדרוש שיספר?
      challenge: איך נציע עזרה שמאפשרת לו לומר לא?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: חמלה הופכת למעשה
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: חמלה הופכת למעשה — איזו הצעה באמת עשויה להקל?
  body:
  - slide:
      title: איזו הצעה באמת עשויה להקל?
      art:
      - use: umbrella
        x: 180
        y: 120
        w: 250
      alt: מטרייה
      echo: true
      sub: ''
  - moves:
    - 'חלקי שלושה מצבים מהמקור: ילד נתקע מול הכיתה, חבר מאט את הטיול, שחקן מתקשה במשחק קבוצתי.'
    - כל רביעייה כותבת תגובה אוטומטית ותגובה שמכירה בקושי, ואז מציעה עזרה בהסכמה.
    - תני שש דקות עבודה ושלוש לשיתוף.
  - ask: איזו הצעה באמת עשויה להקל?
  - task:
      what: בחרו מצב וכתבו תגובה אוטומטית ותגובה חומלת. הציעו עזרה קטנה ובקשו הסכמה.
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: 'התחילו בהצעה קטנה: תרצה שנעשה יחד?'
      challenge: מתי עזרה טובה היא המתנה או הקשבה ולא פתרון?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: אדם מול הציון
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: אדם מול הציון — האם אפשר לדבר אל עצמנו כמו אל חבר?
  body:
  - slide:
      title: האם אפשר לדבר אל עצמנו כמו אל חבר?
      art:
      - use: sprout
        x: 180
        y: 120
        w: 250
      alt: נבט
      echo: true
      sub: ''
  - moves:
    - ספרי שגם אדם מקבל ציון מאכזב ואומר לעצמו שהוא גרוע.
    - כל זוג מנסח תגובה שיש בה הכרה בקושי וצעד ללמידה.
    - השווי בין ויתור, ביקורת עצמית מכאיבה וחמלה שמאפשרת להמשיך.
  - ask: האם אפשר לדבר אל עצמנו כמו אל חבר?
  - task:
      what: נסחו לאדם תגובה שיש בה הכרה באכזבה וצעד ללמידה. השוו בין חמלה עצמית לבין ויתור.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה הייתם אומרים לחבר באותו מצב?
      challenge: איך אפשר להיות עדינים עם עצמנו ועדיין לתקן טעות?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - רגש החמלה מקרב ומחבר בין ילדים ואנשים.
      - הדרך לפתח חמלה היא על ידי התייחסות לדומה בינינו, לכך שקשיים וכישלונות הם טבעיים ומשותפים לכולם
        גם אם לא כולנו התקשינו באותם הדברים.
      - חמלה לאחר וחמלה עצמית מניעים אותנו להתמודדות ולצמיחה ועל ידי כך אנחנו מחזקים את החוסן שלנו.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - כתבו משפט חומל לחבר שמתקשה.
      - כתבו משפט לעצמכם וצעד קטן שאפשר לעשות אחרי טעות.
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: אין לשאול מי נכשל במבחן או לכפות חשיפה של ציון. המקרים עוסקים בדמויות.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
