# שער לעתיד — כיתה ט׳, מעברים, שיעור 3 (מקור: sources/text/9/Shaar_Laatid.md)
# דגל unit-summary-inside: "מסכמים יחידה" של המקור — הרחבה שעומדת בפני עצמה, עם לחישה על נושאי היחידה (D49)
slug: g9-shaar-laatid
title: שער לעתיד
grade: 9
grades_served: [9]
month: מאי–יוני
section: מיומנויות לחיזוק כוחות, חוסן והתנהלות מיטבית (מאי–יוני)
unit: מעברים
unit_order: 3
