    summary: שאלות ״מסכמים יחידה״ של המקור — מה למדנו מהתבוננות על עצמנו, ולמה המפגשים נקראו ״שער״
    body:
      - whisper: >-
          היחידה ״מעברים״ כללה שלושה מפגשים: ״שער לעבר״ — תמונות זיכרון מהחטיבה, על מה אני גאה ומה הייתי עושה אחרת,
          וגלויה לעצמי; ״שער להווה״ — מעבר משמעותי מהעבר, ״מסרים של קלפים״ ו״מתנות״; ו״שער לעתיד״ — השיעור הזה. מי
          שלא היה באחד המפגשים — עונה מהשיעור הזה, או מהמעבר שלו לחטיבה.
      - slide:
          kicker: אם נשאר זמן · מסכמים יחידה
          title: מה למדתם מהתבוננות על עצמכם?
          sub: ואיך זה יעזור לכם לקראת המעבר לתיכון?
          echo: true
          alt: שלוש דלתות פתוחות זו לצד זו
          art:
            - {use: door, x: 430, y: 250, w: 150, color: teal}
            - {use: door, x: 235, y: 250, w: 150, color: orange}
            - {use: door, x: 40, y: 250, w: 150, color: purple}
      - moves:
          - שאלי את השאלה הראשונה, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הדהדי, והזמיני תגובות — ״למי עוד זה מוכר? מי למד משהו אחר?״
          - סיימי בשאלה על שם המפגשים — ״שער״.
      - ask: מה למדתם מהתבוננות על עצמכם — ואיך זה יעזור לכם לקראת המעבר לתיכון?
      - say: אז מה שלמדת על עצמך זה ___ — הבנתי נכון? למי עוד זה מוכר?
      - ask: למה לדעתכם קראו למפגשים ״שער לעבר״, ״שער להווה״ ו״שער לעתיד״?

