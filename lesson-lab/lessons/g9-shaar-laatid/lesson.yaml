sensitivity: med
latin_ok:
  - WAZE

sub: >-
  המעבר לתיכון קרוב. בשיעור הזה מדברים על חלומות, מתארים במילים ״תמונת עתיד״ — ושואלים מה צריך לעשות, ובמי
  אפשר להיעזר, כדי להגיע אליה.
format: כתיבה אישית, זוגות, קבוצות ומליאה
question: איך נראה העתיד שאני רוצה — ומה אני יכול לעשות כבר עכשיו כדי להתקרב אליו?
takeaways:
  - ״תמונת עתיד״ — מה שאנחנו רואים בעיני רוחנו כשאנחנו חושבים על העתיד המיטבי שלנו — עוזרת לנו לחלום ולכוון.
  - לא מספיק לחלום, צריך גם לעשות — יש לנו אחריות אישית לפעול למען היעדים שלנו.
  - לא חייבים להתמודד לבד — כדאי לשתף אנשים שאנחנו סומכים עליהם, ולבקש עצה ועזרה בדרך.
prep:
  - חלוקה מראש לקבוצות של שלושה–ארבעה לפי השולחנות
  - פתקיות דביקות — ל״מתנה לדרך״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — חלומות, ״תמונת עתיד״ לקראת התיכון, וחששות בדרך אליה. שאלי מי בכיתה נמצא במצב
      רגשי מורכב, בפרידה קשה או במציאות יומיומית קשה, ומי עוד לא יודע לאן הוא ממשיך בשנה הבאה. בקשי שתהיה זמינה
      אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      לא לכל אחד קל לדמיין עתיד — מי שמתמודד עם מצב רגשי מורכב או עם מציאות קשה בבית, ומי שלא התקבל למקום שרצה.
      אמרי מראש שאפשר לבחור נקודת זמן קרובה ותמונה צנועה, ושתמונה גם יכולה להשתנות. מי שלא מצליח לכתוב — אל
      תלחצי עליו; שקלי להזמין אותו לשיחה אישית בהמשך, כמו שממליץ המקור.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בזוגות ובקבוצות משתפים רק במה שבוחרים מתוך
      התמונה; במליאה — רק מתנדבים. מותר לוותר, ולא קוראים בשם למי שלא הצביע. הדף האישי נשאר אצל התלמיד.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל ייאוש, ״אין לי עתיד״, או מצב קשה בבית — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״קוביית המעברים״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - waze
      - zoom
    text: >-
      בשלב ״שימו WAZE״ מוותרים על המליאה — כתיבה וזוגות בלבד; וב״זום אין״ כל אחד עונה על שאלה אחת מתוך שלוש,
      ובקבוצה — טיפ אחד לכל אחד

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: פסלים
      text: תני מילה — עץ, גל, רובוט — וכולם קופאים לשלוש שניות בתנוחה שמתאימה לה. חמש מילים, בלי לדבר.
    - name: כף אל כף
      text: בזוגות — מחיאת כף לעצמי, ואז שתי כפות עם השכן. כל סבב מהר יותר.
    - name: עשר נשימות
      text: עוצמים עיניים, נושמים לאט וסופרים בשקט עשר נשימות. מי שמסיים — פוקח עיניים ומחכה בשקט.
  from: unit

