steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: dream
    title: לחלום
    minutes: 5
    practices:
      - מה הקשר?
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      משפט על המסך — ״אם אתה יכול לחלום את זה, אתה יכול לעשות את זה״: מה דעתכם? ואחר כך — חלום שהגשמתם, וחלום
      שיש לכם היום
    body:
      - slide:
          kicker: מה הקשר?
          title: ״אם אתה יכול לחלום את זה, אתה יכול לעשות את זה״
          sub: מה דעתכם על המשפט? מה משמעותו?
          verbatim: true
          echo: true
          alt: דמות עומדת, ומעליה ענן מחשבה ובו כוכב
          art:
            - {use: thought, x: 40, y: 20, w: 320}
            - {use: star, x: 140, y: 88, w: 120}
            - {use: kid-stand, x: 410, y: 180, w: 170, color: teal}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. הקריאי את המשפט, וחכי עשר שניות של שקט.
          - שמעי שלוש־ארבע תשובות, והזמיני את הכיתה להגיב זה לזה — ״מי מסכים? מי חושב אחרת? למה?״
          - עברי לשקף ״לחלום...״, ושמעי שניים־שלושה מתנדבים.
      - ask: מה דעתכם על המשפט — מי מסכים, ומי חושב אחרת? למה?
      - slide:
          kicker: לחלום...
          title: האם הצלחתם פעם להגשים חלום/יעד שהיה לכם?
          points:
            - איך הרגשתם?
            - מה עזר לכם?
          verbatim: true
          echo: true
          cue: אחרי הדיון במשפט —
          alt: הר ודגל על הפסגה, ודמות עומדת מולו
          art:
            - {use: mountain, x: 40, y: 230, w: 360}
            - {use: flag, x: 253, y: 138, w: 110, color: orange}
            - {use: kid-stand, x: 440, y: 240, w: 130, color: teal}
      - ask: האם כיום יש לכם חלום שהייתם רוצים לממש? מה הוא מעורר בכם?
      - say: >-
          לחלומות יש כוח — הם עוזרים לנו לכוון. היום נתאר במילים ״תמונת עתיד״, ונבדוק איך מתקרבים אליה.

  # ------------------------------------------------------------------ 5′–14′
  - id: waze
    title: >-
      שימו WAZE, היעד: העתיד
    minutes: 9
    practices:
      - Think–Pair–Share
    spotlights:
      - אחריות ובחירה
      - עניין ורלוונטיות
    summary: >-
      מהי ״תמונת עתיד״; כל אחד בוחר נקודת זמן — חודשיים, שנה או שלוש שנים — ומתאר בכתב את התמונה שלו; בזוגות
      ובמליאה — איך הרגשנו לדמיין
    body:
      - slide:
          kicker: שער לעתיד · מה זה?
          title: תמונת עתיד
          sub: תמונה ממשית המתייחסת למה שאנחנו רואים בעיני רוחנו כשאנו חושבים על העתיד המיטבי שלנו
          verbatim: true
          echo: true
          alt: דרך מתפתלת לאופק, ושמש מעליה
          art:
            - {use: road, x: 120, y: 200, w: 380}
            - {use: sun, x: 430, y: 36, w: 150}
      - moves:
          - הקריאי את ההגדרה, ושאלי מה ההבדל בין ״חלום״ ל״תמונה ממשית״.
          - חלקי את הדף. כל אחד בוחר נקודת זמן אחת וכותב בשקט ארבע דקות — כמה שיותר פרטים.
          - הסתובבי בזמן הכתיבה. מי שלא מצליח להתחיל — הציעי לו את שאלת העזר, בלי ללחוץ.
          - הציגי את הנחיות השיח, ושתי דקות בזוגות — כל אחד מספר מה שהוא בוחר מתוך התמונה.
          - במליאה — שאלי איך הרגישו לדמיין. רשמי על הלוח גם חששות והתלבטויות, לא רק חלומות.
      - slide:
          kicker: שימו WAZE · חושבים · בזוגות · משתפים
          title: חודשיים, שנה או 3 שנים מהיום?
          sub: בחרו נקודת זמן אחת, ותארו בפירוט — איפה אתם, מה אתם עושים, איך אתם מרגישים?
          points:
            - לבד, בכתב — 4 דקות
            - בזוגות — 2 דקות
            - במליאה
          timer: 240
          echo: true
          cue: אחרי ההגדרה —
          alt: טלפון ועל המסך דגל — היעד, ושלט הכוונה לידו
          art:
            - {use: phone, x: 300, y: 110, w: 190}
            - {use: flag, x: 355, y: 219, w: 80, color: teal}
            - {use: signpost, x: 60, y: 230, w: 180}
      - say: >-
          בחרו נקודת זמן אחת — חודשיים, שנה או שלוש שנים מהיום — ותארו את התמונה שאתם רואים: איפה אתם, מה אתם
          עושים, מי לצידכם, איך אתם מרגישים.
      - ladder:
          help: התחילו ב״חודשיים מהיום אני…״, והוסיפו בכל שורה פרט אחד — מקום, אנשים, הרגשה.
          challenge: בחרו דווקא שלוש שנים מהיום — ומה מהתמונה הזאת מתחיל כבר בשנה הראשונה בתיכון?
      - handout:
          title: >-
            שימו WAZE, היעד: העתיד
          copies: עותק לכל תלמיד — על צד אחד של הדף, ו״זום אין״ על הצד השני
          text: |-
            בחרו נקודת זמן אחת, והקיפו אותה: חודשיים מהיום · שנה מהיום · 3 שנים מהיום

            תארו בפירוט את תמונת העתיד שלכם: היכן אתם רואים את עצמכם? מה אתם עושים? איך אתם מרגישים? מי לצידכם?

            [מקום לכתיבה — חצי עמוד]
      - slide:
          kicker: לפני שמספרים
          title: הנחיות לשיח מיטבי
          sub: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          cue: לפני השיחה בזוגות —
          alt: ארבעה סביב שולחן, ובועת דיבור ובה לב
          art:
            - {use: circle4, x: 40, y: 214, w: 300}
            - {use: speech-l, x: 336, y: 36, w: 250}
            - {use: heart, x: 411, y: 68, w: 100}
      - ask: איך הרגשתם לדמיין את תמונת העתיד שלכם? מה זה עורר בכם? מה זה מאפשר?
      - say: >-
          היכולת לדמיין תמונת עתיד מרחיבה את טווח החלומות והאפשרויות שלנו. ועכשיו — ״זום אין״: מה צריך כדי שהתמונה
          תתממש?

  # ------------------------------------------------------------------ 14′–22′
  - id: zoom
    title: תמונת עתיד — זום אין
    minutes: 8
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      שלוש שאלות לעצמי — מה עליי לעשות, במי אוכל להיעזר, ומה יכול לעכב אותי; בקבוצות משתפים ונותנים זה לזה
      ״טיפים״; במליאה — מה עוזר לממש תמונת עתיד
    body:
      - slide:
          kicker: זום אין · לבד, בכתב
          title: מה יעזור לתמונה שלכם להתממש?
          sub: שלוש שאלות לעצמכם — על הצד השני של הדף.
          points:
            - מה עליי לעשות?
            - במי או במה אוכל להיעזר?
            - מה יכול לעכב אותי — ומה ביכולתי לעשות?
          timer: 180
          echo: true
          alt: זכוכית מגדלת, ובתוכה מטרה
          art:
            - {use: magnifier, x: 150, y: 110, w: 320}
            - {use: target, x: 227, y: 182, w: 120}
      - quote:
          title: מהמקור — להקריא לפני הכתיבה
          text: >-
            סביר להניח שתמונת העתיד בה בחרת, קשורה למשימות החיים הקרובות שלך. בכל תמונת עתיד טמונים גם ציפיות,
            חששות ולבטים שונים. התעמק/י בתמונת העתיד שבחרת ושאל/י את עצמך את השאלות הבאות:
      - moves:
          - הקריאי את הקטע מהמקור, ושלוש דקות של כתיבה בשקט, על הצד השני של הדף.
          - >-
            בקבוצות של שלושה־ארבעה: כל אחד משתף בקצרה בתמונה ובתשובות, והאחרים מציעים לו ״טיפים״ — רעיונות
            למימוש, ודרכים להתמודד עם קשיים.
          - >-
            במליאה — שמעי שניים־שלושה ״טיפים״ שקיבלו, ורשמי על הלוח ״מה עוזר לממש תמונת עתיד״ — אנשים, מקומות,
            דרכים.
      - handout:
          title: זום אין
          copies: עותק לכל תלמיד — על הצד השני של דף ״שימו WAZE״
          verbatim: true
          items:
            - מה עליי לעשות כדי לעזור לתמונה שלי להתממש כפי שהייתי מאחל/ת לעצמי?
            - במי/במה אוכל להיעזר כדי להתמודד עם החששות, ההתלבטויות שיש לי?
            - מה יכול למנוע ממני להשיג את היעד שלי? מה ביכולתי לעשות?
      - task:
          what: >-
            כל אחד משתף בקצרה בתמונת העתיד שלו ובתשובות לשאלות; חברי הקבוצה מציעים לו ״טיפים״ — רעיונות למימוש,
            ודרכים להתמודד עם קשיים בדרך.
          time: 3 דקות — כל אחד בתורו, בקצרה
          group: שלושה־ארבעה לפי השולחנות
          rules: משתפים רק במה שבוחרים; טיפ אחד לפחות לכל אחד; מקשיבים בלי לבקר
          plenary: שניים־שלושה מספרים איזה ״טיפ״ קיבלו
          help: התחילו ב״מה שעזר לי היה…״ או ב״אפשר לבקש עזרה מ…״.
          challenge: הציעו טיפ למקרה שהתמונה לא מתממשת בדיוק כמו שרציתם — מה עושים אז?
      - slide:
          kicker: ״טיפים״ · גורמי תמיכה בדרך
          title: מה עוזר לממש את תמונת העתיד?
          verbatim:
            - title
          echo: true
          cue: אחרי העבודה בקבוצות —
          alt: שתי ידיים מושטות זו לזו, וגלגל הצלה מעליהן
          art:
            - {use: hands-help, x: 145, y: 180, w: 330}
            - {use: lifebuoy, x: 440, y: 36, w: 140}
      - ask: >-
          האם ידעתם בדיוק מהם הדברים שעליכם לעשות כדי לממש את תמונת העתיד? מה עוזר לממש אותה — ומי?
      - tip: >-
          לא תמיד יודעים מראש מה צריך לעשות — לכן כדאי לבדוק עם חברים, עם אנשים שסומכים עליהם ועם מקורות מידע. תני
          מקום גם לכישלון ולשינוי יעד, כמו שמדגיש המקור: מגמה שלא התקבלו אליה, תחום שלא הצליחו בו — המאמץ והדרך
          ראויים להערכה, גם כשהתמונה לא התממשה בדיוק.

  # ------------------------------------------------------------------ 22′–27′
  - id: gift
    title: לא מספיק לחלום — מתנה לדרך
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: >-
