      - say: שתי דקות, לבד ובשקט. אין תשובה נכונה — נחשו.
      - ladder:
          help: חפשו מילים קרובות — חוזר, חזרה, מחזור. מה משותף להן?
          challenge: מתי לחזור על אותה הזמנה זה נחמד — ומתי זה כבר מטריד?
      - quote:
