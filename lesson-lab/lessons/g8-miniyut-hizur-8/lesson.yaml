    summary: >-
      מה מרגישים יעל ורן — קודם במילים שלנו, ואז עם בנק הרגשות; ברמזור כולם מראים יחד — חיזור או הטרדה?
    body:
      - slide:
          kicker: הסיפור של יעל ורן
          title: כבר חודש שרן מזמין את יעל שוב ושוב
          sub: לצפות איתו יחד בבינג' של סדרות בנטפליקס אצלו בחדר. יעל מסרבת שוב ושוב.
          verbatim: true
          echo: true
          alt: רן מזמין את יעל לצפות בסדרות, ויעל עונה ׳לא׳
          art:
            - {use: kid-stand, x: 40, y: 264, w: 130, color: orange}
            - {use: speech-l, x: 60, y: 40, w: 230}
            - {use: laptop, x: 120, y: 82, w: 110}
            - {use: kid-stand, x: 450, y: 264, w: 130, color: teal}
            - {use: speech, x: 330, y: 80, w: 200}
            - text: לא
              x: 430
              y: 150
              size: 60
      - quote:
          title: הסיפור — להקריא
          text: >-
            רן ויעל ידידים טובים. הם מכירים מאז תחילת בית הספר היסודי. כבר חודש שרן מזמין את יעל שוב ושוב לצפות
            איתו יחד בבינג' של סדרות בנטפליקס אצלו בחדר. יעל מסרבת שוב ושוב.
      - moves:
          - הקריאי את הסיפור.
          - >-
            שאלי איך מרגישה יעל — וכל אחד כותב לעצמו שתי מילים, עוד לפני שרואים את בנק הרגשות. אחר כך — אותו
            דבר על רן.
          - >-
            שמעי כמה תשובות, ובקשי הסבר לכל רגש. רק אז הציגי את בנק הרגשות, והצביעי על רגש אחד בכל פעם — מי בחר
            בו, ולמה? כל רגש לגיטימי, גם רגשות מעורבים.
          - >-
            הציגי את הרמזור. חמש שניות של שקט, ובספירה עד שלוש כולם מראים יחד באצבעות. מתנדב מכל צבע מסביר את
            הבחירה שלו.
      - say: רגע לפני שרואים מילים על המסך — כתבו לבד שתי מילים. מה מרגישה יעל? ומה מרגיש רן?
      - ladder:
          help: חשבו על רגע שבו מישהו ביקש מכם משהו שוב ושוב — מה הרגשתם?
          challenge: כתבו גם רגש מעורב — שני רגשות שיכולים להיות אצל אותה דמות בבת אחת.
      - slide:
          kicker: בנק הרגשות
          title: איך לדעתכם מרגישים יעל ורן?
          sub: מה כל אחד מהם חווה?
          echo: true
          cue: אחרי שכתבו ושיתפו —
          alt: בנק רגשות — אחד־עשר רגשות, מבושה ועד פרפרים בבטן
          art: {file: art/feelings.svg}
      - p: >-
          המילים בבנק — בושה, כעס, מצוקה, מבוכה, תסכול, בלבול, לחץ, מתח, מועקה, התרגשות, פרפרים בבטן. ״בושה״ היא
          מהבנק של יעל, ו״כעס״ מהבנק של רן; ניתן להציע גם רגשות שלא כתובים בבנק.
      - slide:
          kicker: רמזור · כולם יחד
          title: האם לדעתכם מדובר בחיזור לגיטימי או בהטרדה מינית?
          sub: חושבים חמש שניות — ואז מראים באצבעות 1, 2 או 3.
          points:
            - עצור הטרדה לפניך!
            - האט וחשוב שוב
            - אפשר להירגע
          verbatim: [title, points]
          echo: true
          cue: אחרי בנק הרגשות —
          alt: רמזור, ודמות מרימה יד
          art:
            - {use: traffic-light, x: 225, y: 100, w: 170}
            - {use: kid-hand, x: 430, y: 190, w: 130, color: purple}
      - ask: מי בחר צבע אחר? מה בסיפור גרם לכם לבחור בו?
      - whisper: >-
          לפי המקור, הסיפור הזה לא לגמרי הטרדה מינית — אבל הוא יכול להתפרש כך. המטרה היא שיחה שמעלה את כל ההיבטים,
          לפני שנותנים קווים מנחים. שאלות שעוזרות: האם רן קשוב ליעל ולתגובות שלה? מה עומד מאחורי ההצעות שלו? האם
          הוא מודע לאיך ההצעה שלו עלולה להתפרש?
      - say: ראינו שקשה להחליט לפי הסיפור לבד. יש שני כלים שעוזרים — מה שמרגישים, ומה שהחוק אומר.

