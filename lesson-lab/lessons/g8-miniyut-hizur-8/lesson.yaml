      - say: אז חיזור הוא השתדלות שחוזרת על עצמה. ומתי היא כבר עוברת את הגבול? בואו נכיר את רן ויעל.

  # ------------------------------------------------------------------ 4′–10′
  - id: story
    title: רן ויעל
