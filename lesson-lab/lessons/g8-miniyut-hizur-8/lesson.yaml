  # ------------------------------------------------------------------ 17′–24′
  - id: events
    title: תרגיל הרמזור
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      בקבוצות, אירוע אחד לכל קבוצה — צבע ברמזור לפי שני הכלים, ומשפט תגובה; במליאה — מה התחדד לנו
    body:
      - slide:
          kicker: תרגיל הרמזור · בקבוצות
          title: חיזור לגיטימי או הטרדה מינית?
          sub: קראו את האירוע, בחרו צבע, ונסחו משפט תגובה אחד.
          timer: 180
          echo: true
          alt: ארבעה סביב שולחן, ורמזור לידם
          art:
            - {use: circle4, x: 250, y: 150, w: 300}
            - {use: traffic-light, x: 70, y: 110, w: 120}
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הכרטיסים; שלוש השאלות כבר על הלוח.
          - חלקי לכל קבוצה כרטיס אירוע אחד, לפי החלוקה שהכנת.
          - הסתובבי בין הקבוצות. דקה לפני הסוף — הזכירי לבחור צבע ולנסח את משפט התגובה.
          - >-
            במליאה — כל קבוצה אומרת במשפט אחד מה קרה באירוע, איזה צבע בחרה ולמה, ואת משפט התגובה. רשמי על הלוח
            את משפטי התגובה.
      - say: >-
          כל קבוצה מקבלת אירוע אחד. קראו אותו בקול, החליטו יחד על צבע ברמזור — לפי מה שמרגישים ולפי החוק — ונסחו
          משפט תגובה אחד.
      - task:
          what: >-
            קוראים את האירוע, עונים יחד על שלוש השאלות שעל הלוח, בוחרים צבע ברמזור, ומנסחים משפט תגובה אחד — מה
            הדמות יכולה לומר או לעשות.
          time: 3 דקות
          group: קבוצות של 4–5 לפי השולחנות; אירוע אחד לכל קבוצה
          rules: מדברים על הדמויות — בלי שמות ובלי אירועים אמיתיים מבית הספר; כותב אחד רושם את הצבע ואת המשפט
          plenary: כל קבוצה — מה קרה במשפט אחד, הצבע ולמה, ומשפט התגובה
          help: חזרו לטבלה — מה הדמות מרגישה? מתאים ונעים, או לא מתאים ולא נעים?
          challenge: מצאו באירוע את הרגע שבו אפשר היה לעצור את המצב — ומי יכול היה לעצור אותו?
      - board:
          - מה אתם מרגישים וחושבים בעקבות האירוע?
          - חיזור לגיטימי או הטרדה מינית? איך מבחינים? בחרו צבע ברמזור.
          - מה הייתם מציעים לדמות לעשות — מה לומר, ולמי לפנות? נסחו משפט תגובה אחד.
      - handout:
          title: כרטיסי אירוע
          copies: עותק אחד, גזור לשבעה כרטיסים — כרטיס לכל קבוצה
          verbatim: true
          lines: false
          items:
            - >-
              **אירוע א׳** — באמצע שיעור מתמטיקה שלחה אורית פתק ליאיר והציעה לו שייפגשו אחר הצהריים אצלה בבית
              כדי להתכונן יחד למבחן. יאיר הסמיק ונבוך. הוא לא ידע מה לענות.
            - >-
              **אירוע ב׳** — תום, חתיך אמיתי וספורטאי מצטיין, רוב הבנות בשכבה ״דלוקות״ עליו. תום ניסה להתחיל עם
              עדי, אך בניגוד לתגובות להן הוא רגיל בד״כ, נענה בסירוב. לאחרונה כשתום רואה את עדי, הוא עושה לה
              תנועות מגונות עם הלשון, נועץ מבטים בחזה שלה ואומר בקול רם כדי שכולם ישמעו: ״הנה הפרחה הגיעה״...
            - >-
              **אירוע ג׳** — בתחילת כיתה ח׳ הטילה המחנכת על יהלי ונויה שניהם בעלי כישרונות ציור, להקים צוות שיציע
              לכיתה תכנית לקישוט הקירות. הידידות בין השניים התחזקה במהלך השנה והם הפכו לזוג. לקראת סוף השנה היה
              ניתן לראות את שניהם מתחבקים ומתנשקים במהלך ההפסקות. באחת ההפסקות העירה להם המורה התורנית וביקשה מהם
              להפסיק.
            - >-
              **אירוע ד׳** — במשחק חברתי בו השתתפו בנים ובנות מהשכבה, נקבע שעל יואב ולירון להתייחד באחד מחדרי
              הבית ולהתנשק נשיקה צרפתית. לירון הלכה עם יואב לחדר אבל הזהירה אותו שלא ייגע בה. יואב כעס מאוד ואמר
              לה ״אם לא תאפשרי לי לנשק אותך כפי שנקבע, אכתוב בוואטסאפ של הכיתה שלא רק שאפשרת לי להתנשק איתך, אלא
              גם נתת לי לגעת בך במקומות פרטיים ואשלח תמונות״...
            - >-
              **אירוע ה׳** — שכבת ח׳ נסעה לטיול שנתי לצפון הארץ. כאשר התארגנו התלמידים בחדרים אשר באכסנייה, דחפה
              חבורת בנות צוהלות את נועם לחדר שלהן, נעלו אותו ונגעו באיבריו הפרטיים ואמרו לו שהכל בצחוק.
            - >-
              **אירוע ו׳** — דן והילה חברים. דן מבקש מהילה לשלוח לו תמונות עם חזה חשוף. הילה מסרבת ודן מתחנן
              ומסביר לה שאם תשלח היחסים ביניהם רק ישתפרו.
            - >-
              **אירוע ז׳** — עופרי מאוהבת ביוני. היא מחכה לו כל בוקר בפתח הכיתה, שולחת לו הרבה מסרונים עם לבבות
              ונשיקות, יודעת תמיד היכן הוא נמצא ושואלת אותו שוב ושוב אם הוא רוצה תמונות שלה חשופת חזה.
      - whisper: >-
          כיוונים לשיחה, לפי שני הכלים: א׳ ו־ג׳ — הדדיות והסכמה (ההערה בהפסקה היא על כללי בית הספר, לא הטרדה); ב׳
          — ביזוי והשפלה; ד׳ — סחיטה באיומים; ה׳ — מעשה מגונה, גם כשאומרים ״בצחוק״; ו׳ — הצעות חוזרות אחרי סירוב;
          ז׳ — הצעות חוזרות, הפעם מבת לבן: מתי לבבות ונשיקות הופכים להצעה שלא רוצים בה? ואמרי בבירור — תמונה
          חשופה של בני נוער לא שולחים ולא מעבירים, גם כשמציעים אותה מרצון. צהוב היא תשובה לגיטימית כשיש מה לברר.
      - ask: מה התחדד לכם בתרגיל הרמזור — מה עוזר להבחין בין חיזור להטרדה?
      - say: >-
          ראינו שהטרדה יכולה לקרות בכל מקום — בכיתה, בטיול, בוואטסאפ. ומה עושים כשזה קורה לנו, או לחבר?

