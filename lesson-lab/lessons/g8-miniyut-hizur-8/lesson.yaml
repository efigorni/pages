sub: >-
  חיזור הוא השתדלות שחוזרת על עצמה — ולפעמים היא עוברת את הגבול. בשיעור הזה מקשיבים לבטן, מכירים את החוק,
  ממיינים שבעה אירועים ברמזור, ולומדים לא להישאר לבד עם פגיעה.
format: כתיבה, קבוצות ומליאה
question: איך יודעים מתי חיזור הופך להטרדה — ומה עושים כשזה קורה?
takeaways:
  - >-
    חיזור לגיטימי הוא הדדי, רצוי ונעים; הטרדה היא חד־צדדית ולא רצויה, ומשאירה תחושה של לחץ, השפלה או חוסר
    אונים.
  - יש שני כלים להבחין ביניהם — מה שאנחנו מרגישים, והחוק, שמגדיר אילו התנהגויות הן הטרדה מינית.
  - הכי חשוב — לא להישאר לבד עם פגיעה. פונים להורים, למחנכת, ליועצת, לחברים — או למוקד 105.
prep:
  - >-
    חלוקה מראש לשבע קבוצות לפי השולחנות, ואיזה כרטיס אירוע מקבלת כל קבוצה. פחות קבוצות — אירוע אחד יורד,
    בתיאום עם היועצת
  - שלוש השאלות של ״תרגיל הרמזור״ — כתובות על הלוח לפני השיעור

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — ההבדל בין חיזור להטרדה מינית, החוק, ושבעה אירועים שיש בהם גם נגיעה בלי הסכמה,
      איום בהפצת תמונות ובקשה לתמונות חשופות. שאלי אם יש בכיתה מי שנפגע או מי שפגע, ואם היה לאחרונה בשכבה
      אירוע דומה. אם כן, החליטו יחד אם ללמד עכשיו, אם היא מצטרפת לשיעור, ואיזה אירוע להשמיט. בקשי שתהיה זמינה
      אחרי השיעור ובמשך היום.
  - head: מי עלול להיפגע
    text: >-
      כמעט בכל שכבה יש מי שחווה הטרדה — בנים ובנות כאחד — ומי שאולי הטריד בלי לחשוב על זה כך. באירועים יש
      מטרידים ונפגעים משני המינים, ולכן מדברים על מעשים, לא על ״בנים״ או ״בנות״. לא מאשימים אף פעם את מי שנפגע —
      גם לא בשאלה ״למה היא הלכה איתו לחדר?״. ומי שמזהה את עצמו במי שעבר את הגבול — מקבל דרך לתקן, לא תווית.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום, מהמקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. מדברים על
      הדמויות — בלי שמות, ובלי אירועים אמיתיים מבית הספר. הכתיבה בפתיחה ובבנק הרגשות נשארת במחברת. מותר לוותר,
      ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים
      לשמור בסוד — אומרים שזה כדי שאפשר יהיה לעזור. רמז לפגיעה שקורית עכשיו — תמונה שמאיימים להפיץ, מישהו שלא
      מרפה — מטפלים בו עוד היום. לצד היועצת יש קווים שזמינים 24/7: מוקד 105 (פגיעה ברשת), 1202 (עונות נשים)
      ו־1203 (עונים גברים) של מרכזי הסיוע לנפגעות ולנפגעי תקיפה מינית, וער״ן 1201 (עזרה ראשונה נפשית).
  - head: עמידה מול הכיתה
    text: >-
      ברמזור של רן ויעל כולם מראים צבע יחד, באצבעות, אחרי חמש שניות של חשיבה. הצבע הוא על הסיפור, לא על אף אחד
      בכיתה, וצהוב היא תשובה מלאה. מסבירים רק מתנדבים, ורק את הדעה שלהם על הסיפור. הערה או צחוק על הבחירה של
      מישהו — עוצרים מיד.

