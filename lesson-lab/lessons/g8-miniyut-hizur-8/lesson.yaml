            **מעשה מגונה** — כל מעשה מיני שאדם עושה בזולת או בנוכחות הזולת בלי הסכמתו למשל: נגיעה, ליטוף, התחככות, דיבור בעל אופי מיני.
            **ביזוי או השפלה** — התנהגות מבזה או משפילה ביחס למינו, מיניותו או נטייתו המינית של אדם, היא הטרדה מינית גם אם הייתה חד פעמית וגם אם האדם המבוזה לא הראה שאינו מעוניין בה
            **פרסום תצלום סרט או הקלטה** — פרסום תצלום, סרט או הקלטה של אדם, המתמקד במיניותו, בנסיבות שבהן הפרסום עלול להשפיל את האדם או לבזותו, ולא ניתנה הסכמתו לפרסום
