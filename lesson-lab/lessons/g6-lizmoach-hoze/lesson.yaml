# ניסוח חוזה כיתתי — כיתה ו׳, "לצמוח ולגדול", שיעור 2 (מקור: sources/text/6/Lizmoach_Hoze.md)
# אין במקור שקף מסרים, ואין שקף סיכום בסוף השיעור (D50–D51): בלי שלב "חשוב לזכור". רשימת הכללים שהמקור מציע
