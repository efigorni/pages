    summary: ברביעיות — כל רביעייה מנסחת כלל אחד מהחוזה בחריזה, כסלוגן או כסיסמה קליטה, ותולה ליד החוזה
    body:
      - slide:
          kicker: אם נשאר זמן · ברביעיות
          title: כלל אחד — בחריזה או בסלוגן
          sub: משפט קליט שכל הכיתה תזכור.
          timer: 180
          echo: true
          alt: שלוש דמויות, ובועת דיבור עם כוכב מעליהן
          art:
            - {use: group3, x: 130, y: 270, w: 330}
            - {use: speech, x: 330, y: 30, w: 240}
            - {use: star, x: 405, y: 52, w: 92}
      - moves:
          - כל רביעייה מקבלת כלל אחד מהחוזה.
          - שלוש דקות — מנסחים אותו בחריזה, כסלוגן או כסיסמה קליטה, וכותבים על דף.
          - כל רביעייה אומרת את הסלוגן שלה; תולים את הדפים ליד החוזה.
      - say: קחו כלל אחד ותנו לו מנגינה — חרוז, סלוגן או סיסמה.
      - task:
          what: >-
            כל רביעייה מנסחת מחדש כלל אחד מהחוזה — בחריזה, כסלוגן או כסיסמה קליטה — וכותבת אותו על דף.
          time: 3 דקות
          group: רביעיות; כלל אחד לכל רביעייה
          rules: הסלוגן שומר על המשמעות של הכלל; בלי שמות, ובלי בדיחות על מישהו
          plenary: כל רביעייה אומרת את הסלוגן, ותולים ליד החוזה
          help: התחילו במילה אחת מהכלל, וחפשו מילה שמתחרזת איתה.
          challenge: כתבו סלוגן שמובן גם בלי הכלל לידו — שמי שקורא, יבין לבד.
      - ask: איזה סלוגן הכי תפס אתכם — ולמה?

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — סופשי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: ״סופשי״ — משהו חדש על שיתוף ופרטיות, כלל אחד שאשמור עליו, ושורת רשות על ההרגשה; פתקים נאספים בדלת
    body:
      - moves:
          - הציגי את השאלות, והפעילי את הטיימר.
          - עמדי בדלת ואספי את הפתקים אחד־אחד.
      - say: >-
          ״סופשי״ — קיצור של סוף שיעור, הסיום הקבוע של השיעורים האלה. שתי שאלות ושורת רשות, לבד ובשקט. כולם מוסרים
          פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: סופשי
          prompts:
            - משהו חדש שלמדתי — על שיתוף ועל פרטיות.
            - כלל אחד מהחוזה שאשמור עליו — ואיך.
            - רשות — איך הרגשתי במהלך השיעור?
          look_for: >-
            חפשי כללים כלליים מדי (״להיות נחמדים״) לעומת כללים עם מעשה ברור, ופתקים שמספרים על מבוכה גדולה או על פחד
            לשתף. פתק שמרמז שאחד האירועים — פנייה מזר, סרטון, שיימינג — קורה עכשיו: מדברים בשקט עוד היום, ומעדכנים את
            היועצת.
          timer: 180
          alt: דף, ונבט קטן לידו
          art:
            - {use: note, x: 300, y: 100, w: 256}
            - {use: sprout, x: 70, y: 226, w: 180}
