steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: רגע של שיתוף
    minutes: 4
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: כתיבה אישית — רגע שבו שיתפתי מישהו בדילמה או בקושי; במליאה מספרים רק את מי שיתפו ואיך זה היה
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: רגע של שיתוף
          sub: היזכרו ברגע שבו שיתפתם מישהו בדילמה או בקושי. מתי? במה? את מי?
          verbatim:
            - title
          timer: 120
          echo: true
          alt: שתי דמויות יושבות זו מול זו ומדברות
          art:
            - {use: kid-sit, x: 110, y: 220, w: 170, color: teal}
            - {use: kid-sit, x: 340, y: 220, w: 170, color: purple, flip: true}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. כותבים במחברת, בלי הסבר נוסף; הכתיבה נשארת אצלם.
          - בזמן הכתיבה — נוכחות וסיבוב בין השולחנות, בלי להציץ בדפים.
          - הציגי את שתי הדוגמאות, ושמעי שלושה־ארבעה מתנדבים — רק את מי שיתפו ואיך זה היה, לא במה.
      - ladder:
          help: חשבו על משהו קטן — בעיה עם שיעורי בית, ריב עם חבר. למי סיפרתם?
          challenge: למה דווקא האדם הזה? מה גרם לכם לסמוך עליו?
      - slide:
          kicker: רגע של שיתוף · דוגמאות
          title: לפעמים זה עוזר — ולפעמים מאכזב
          points:
            - סיפרתי למורה — והיא עזרה לי מאוד
            - סיפרתי לחבר — והוא סיפר הלאה
          echo: true
          cue: אחרי הכתיבה —
          alt: אגודל למעלה ואגודל למטה
          art:
            - {use: thumb-up, x: 340, y: 150, w: 200}
            - {use: thumb-down, x: 80, y: 190, w: 200}
      - quote:
          title: הדוגמאות מהמקור — להקריא
          text: |-
            פעם סיפרתי למורה על משהו אישי, שהפריע לי ללמוד. היא עזרה לי מאוד!
            שיתפתי חבר במשהו אישי. הוא סיפר את זה לעוד מישהו.
            מאז אני לא מספר כלום, התאכזבתי!
      - ask: את מי שיתפתם — ואיך הרגשתם אחרי ששיתפתם?
      - say: במצבים שונים אנחנו משתפים אנשים שונים. עכשיו נבדוק את מי נשתף — ומתי.

  # ------------------------------------------------------------------ 4′–12′
  - id: circles
    title: מעגלי השיתוף שלי
    minutes: 8
    practices:
      - כולם כותבים
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - אחריות ובחירה
    summary: >-
      שישה מעגלי שיתוף, מ״ביני לבין עצמי״ ועד ״מכרים ברשת״; לכל אחד משמונה אירועים כל אחד בוחר את מי היה משתף,
      ובזוגות משווים
    body:
      - slide:
          kicker: מעגלי השיתוף
          title: את מי משתפים?
          sub: מהמעגל הכי פנימי — ועד המכרים ברשת.
          echo: true
          alt: מעגלים זה בתוך זה — אני, משפחה, חברים קרובים, מבוגר שסומכים עליו, חברים ברשת ומכרים ברשת
          art: {file: art/circles.svg}
      - moves:
          - הציגי את המעגלים, והסבירי כל מעגל במשפט — מ״ביני לבין עצמי״ ועד ״מכרים ברשתות חברתיות״.
          - >-
            חלקי את הדף ״מעגלי השיתוף שלי״. הקריאי את האירועים אחד־אחד, עם המספר; כל אחד כותב את המספר ליד המעגלים
            שאותם היה משתף.
          - >-
            אחרי האירוע השמיני — שתי דקות בזוגות: משווים איפה כל אחד שם כל אירוע, מה דומה ומה שונה. לא חייבים להסביר
            למה.
      - handout:
          title: מעגלי השיתוף שלי
          copies: עותק לכל תלמיד (או שש שורות במחברת, שורה לכל מעגל)
          verbatim: true
          items:
            - ביני לבין עצמי
            - הורים ומשפחה
            - חברים הכי טובים
            - מורה / יועצת / מדריך תנועת נוער (מבוגר שאני סומך עליו)
            - חברים ברשתות החברתיות
            - מכרים ברשתות חברתיות
      - say: >-
          אקריא אירוע, עם המספר שלו. כתבו את המספר ליד כל מעגל שאותו הייתם משתפים — אפשר כמה מעגלים, ואפשר אף אחד.
      - slide:
          kicker: בואו נשחק קצת! · אירועים 1–4
          title: את מי הייתם משתפים?
          points:
            - קנו לי נעליים חדשות
            - הצלחתי במבחן
            - מישהו שאני לא מכיר/ה פנה אלי ברשת והציע לי להיפגש איתו
            - שלחו לי סרטון של אנשים ערומים
          verbatim:
            - points
          echo: true
          cue: אחרי ההסבר —
          alt: עיגולים מחוברים בקווים, ומנעול לידם
          art:
            - {use: network, x: 270, y: 150, w: 300}
            - {use: lock, x: 80, y: 220, w: 140}
      - slide:
          kicker: בואו נשחק קצת! · אירועים 5–8
          title: ועוד ארבעה
          points:
            - עושים שיימינג בקבוצה הכיתתית
            - הציעו לי חברות
            - לכל החברים שלי התחילו לצמוח שערות בגוף ורק לי לא
            - אני מרגיש שאף אחד לא אוהב אותי
          verbatim:
            - points
          echo: true
          cue: אחרי ארבעת האירועים הראשונים —
          alt: עיגולים מחוברים בקווים, ומנעול לידם
          art:
            - {use: network, x: 270, y: 150, w: 300}
            - {use: lock, x: 80, y: 220, w: 140}
      - whisper: >-
          אירועים נוספים מהמקור, אם אחד מאלה לא מתאים לכיתה שלך: חברים שמעשנים בסתר, מעבר דירה, אח שהרביץ, הצעה לשתות
          אלכוהול במפגש הכיתתי, פחד להישאר לבד, אבא שפוטר, התאהבות, כישלון במבחן.
      - slide:
          kicker: בזוגות · 2 דקות
          title: מה דומה, ומה שונה?
          sub: משווים איפה כל אחד שם את האירועים — בלי להסביר למה.
          timer: 120
          echo: true
          cue: אחרי האירוע השמיני —
          alt: זוג, ודף לידו
          art:
            - {use: pair, x: 330, y: 220, w: 250}
            - {use: note, x: 90, y: 110, w: 180}
      - ladder:
          help: התחילו מאירוע שבו שניכם בחרתם אותו מעגל — ואחר כך אחד שבו לא.
          challenge: מצאו אירוע שבו בחרתם מעגלים שונים — מה יכול להסביר את ההבדל?
      - say: משווים, לא שופטים — לכל אחד המעגלים שלו. אחרי שתי הדקות נדבר על זה יחד.

  # ------------------------------------------------------------------ 12′–18′
  - id: discuss
    title: מה מספרים למי?
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      שיחה כיתתית על הבחירות — מה נשאר בינינו לבין עצמנו, מה קורה כשמשהו פרטי נחשף — וההבדל בין פרטי לגלוי
    body:
      - slide:
          kicker: דיון כיתתי · מעגלי השיתוף שלי
          title: מה מאפיין דברים שנשאיר בינינו לבין עצמנו, לבין משפחתנו?
          verbatim:
            - title
          echo: true
          alt: מנעול, ובית לידו
          art:
            - {use: lock, x: 340, y: 120, w: 200}
            - {use: house, x: 80, y: 260, w: 210}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - על כל תשובה — הדהדי, ושאלי את הכיתה מי מסכים, ומי בחר אחרת ולמה.
          - עברי לשאלה על מידע שנחשף, ואחריה לסיכום — הקריאי אותו מהמקור.
      - ask: מה מאפיין דברים שנשאיר בינינו לבין עצמנו, או בתוך המשפחה?
      - slide:
          kicker: דיון כיתתי
          title: מה קורה כשמישהו חושף מידע שבחרנו להשאיר במעגל הכי אישי?
          sub: למשל — קניתי בגד ים, לבשתי, וצילמתי לכל חברי הכיתה.
          verbatim:
            - title
          echo: true
          cue: אחרי כמה תשובות —
          alt: מצלמה, ורשת של עיגולים מחוברים
          art:
            - {use: camera, x: 310, y: 130, w: 270}
            - {use: network, x: 60, y: 260, w: 200}
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי חושב אחרת?
      - slide:
          kicker: פרטי או גלוי?
          title: חשוב לשים לב להבדל בין מידע פרטי לבין מידע גלוי
          points:
            - בנושאים שמביכים אותנו — משתפים רק מי שקרוב ושסומכים עליו
            - מידע פרטי שמגיע רחוק — עלול לפגוע
            - מי ששומע — שומר על הכבוד והפרטיות של מי ששיתף
          verbatim:
            - title
          echo: true
          cue: לסיכום —
          alt: מעטפה סגורה, ורשת של עיגולים מחוברים
          art:
            - {use: envelope, x: 330, y: 130, w: 260}
            - {use: network, x: 60, y: 250, w: 200}
      - quote:
          title: הסיכום מהמקור — להקריא
          text: |-
            בנושאים אישיים ופרטיים שמעוררים בנו ״ביישנות, רגישות, בושה״, כדאי לשתף רק אנשים קרובים שאנו סומכים עליהם ובמיוחד מבוגרים. למשל הורים, מורה, יועצת.
            כשנושאים פרטיים מאוד מגיעים למעגלים רחוקים, הם עלולים להפוך לפוגעניים.
            חשיפת מידע אינטימי ואישי בין אם בהסכמה ובין אם לא, עלולה לגרום לחוסר נוחות ולעיתים גם לפגיעה.
            בידי כל אחד ואחת בכיתה מופקדת האחריות לבחור בקפידה מה הוא משתף במרחב הכיתתי ובאיזה אופן.
            האחריות של מעגל השומעים היא לשמור על הכבוד והפרטיות של המשתף.
      - say: >-
          כדי שנוכל לדבר בכיתה גם על נושאים רגישים, צריך כללים שישמרו על כולנו. בואו ננסח אותם.

  # ------------------------------------------------------------------ 18′–26′
  - id: rules
    title: כללי השיח המוגן
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: בקבוצות — כל קבוצה עונה על שאלה אחת, ומנסחת שניים־שלושה כללים לשיחה מוגנת בשיעורים על גיל ההתבגרות
    body:
      - slide:
          kicker: רגע לפני
          title: זה נורא מביך לדבר על הנושאים האלה מול כולם...
          sub: אני לא יודעת על מה אפשר או אי-אפשר לדבר בכיתה...
          verbatim: true
          echo: true
          alt: דמות עומדת מול קבוצה גדולה, וענן מחשבה מעליה
          art:
            - {use: crowd, x: 280, y: 300, w: 300}
            - {use: kid-stand, x: 80, y: 228, w: 130, color: teal}
            - {use: thought, x: 40, y: 24, w: 210, flip: true}
      - moves:
          - הציגי את שתי ההתלבטויות, ושאלי אם הן מוכרות — בלי לבקש דוגמאות.
          - חלקי לקבוצות לפי השולחנות, ולכל קבוצה שאלה אחת — כל שאלה לשתי קבוצות. השאלות על המסך כל הזמן.
          - הסתובבי בין הקבוצות. דקה לפני הסוף — בקשי מכל קבוצה לסמן את הכלל שהכי חשוב לה.
      - slide:
          kicker: בקבוצות · 4 דקות
          title: כללי השיח המוגן
          points:
            - על אילו כללים חשוב שנקפיד בשיעורים האלה?
            - מה ניתן לעשות כדי להרגיש מוגנים להתבטא בשיחות?
            - מה יעזור לנו להקשיב אחד לשני?
            - מה נבחר לשתף בשיעור? וכיצד נגיב לשיתוף של אחרים?
          timer: 240
          echo: true
          cue: אחרי ההתלבטויות —
          alt: ארבעה סביב שולחן, ודף לידם
          art:
            - {use: circle4, x: 260, y: 150, w: 300}
            - {use: note, x: 70, y: 110, w: 160}
      - say: >-
          כל קבוצה מקבלת שאלה אחת. נסחו שניים־שלושה כללים קצרים — כל כלל במשפט אחד, שכל אחד בכיתה יבין.
      - task:
          what: >-
            כל קבוצה עונה על השאלה שקיבלה, ומנסחת שניים־שלושה כללים קצרים לשיחה מוגנת — כל כלל במשפט אחד.
          time: 4 דקות
          group: קבוצות של 4–5 לפי השולחנות; כל שאלה לשתי קבוצות
          rules: כותב אחד, וכולם מציעים; כלל מתחיל ב״אנחנו…״ או ב״לא…״; מסמנים את הכלל הכי חשוב
          plenary: כל קבוצה מקריאה את הכלל שסימנה
          help: חשבו על רגע שבו היה לכם לא נעים לדבר בכיתה — מה היה עוזר?
          challenge: נסחו כלל ששומר על מי ששיתף גם אחרי שהשיעור נגמר.
      - say: עכשיו נאסוף את הכללים של כל הקבוצות — לחוזה אחד.

  # ------------------------------------------------------------------ 26′–30′
  - id: contract
    title: החוזה שלנו
    minutes: 4
    practices:
      - מהלכי שיח
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: כלל מכל קבוצה עולה לחוזה; משלימים מה שחסר, ומצביעים — מסכימים?
    body:
      - slide:
          kicker: החוזה שלנו
          title: על מה אנחנו מסכימים?
          sub: כלל מכל קבוצה — ומה עוד חסר?
          echo: true
          alt: דף, וסימן וי לידו
          art:
            - {use: note, x: 320, y: 110, w: 240}
            - {use: check, x: 90, y: 230, w: 170}
      - moves:
          - כל קבוצה מקריאה את הכלל שסימנה; רשמי אותו על הגיליון של החוזה. כלל שחוזר — נכתב פעם אחת.
          - >-
            בדקי מול הרשימה שהמקור מציע (למטה) אם חסר היבט חשוב. אם כן — הציעי אותו כשאלה לכיתה, לא ככלל מוכן.
          - הצבעה — מי מסכים לחוזה? מי שרוצה, חותם על הגיליון ביציאה.
      - p: 'הכללים שהמקור מציע לחוזה — להשלים מהם רק מה שלא עלה מהכיתה:'
      - list:
          - ״על נושאים אינטימיים ואישיים מאוד, כדאי לדבר בפרטיות עם היועצת או עם המורה.״
          - ״נכבד את המרחב האישי שלנו ושל אחרים — פיזי ופרטי.״
          - >-
            ״נכבד את דברי האחר: לא נלעג, לא נשפוט ולא נעליב חברים.״
          - ״נדבר על עצמנו, לא נחשוף ילדים, לא נדבר על אחרים, לא ניתן דוגמה על אחרים, לא נדבר בשם מישהו אחר.״
          - ״נתעניין, נקשיב ונגלה אמפתיה ורגישות כלפי האחר.״
          - ״מה שנאמר בכיתה, נשאר בכיתה — לא נעשה עם זה שימוש בהמשך.״
          - ״אפשר לשאול מה שרוצים, אבל המורה תבחר על מה לענות בהרחבה ועל מה לא, בהתאם לגיל.״
          - ״מאגר המילים שנשתמש בהן צריך להיות נוח למביע, אך גם למאזין.״
          - ״לא נעלה נושא מביך הקשור למישהו אחר ללא רשותו, ולא ניגע במישהו אחר ללא הסכמתו.״
          - ״נהיה רגישים למבוכה שתהיה סביב השיעורים, ונתנהג בהתאם.״
          - >-
            ״נהיה רגישים לגבולות של האחר. נזכור כי לכל אדם יש את הגבולות שלו. כדי לתקשר האחד עם השני בלי לפגוע, נברר
            עם האחר אם התקשורת בינינו (מילים, קרבה, הקשר) נוחה לו.״
      - ask: חסר כאן משהו שיעזור לכם להרגיש בטוחים לדבר? מי מסכים — ולמה?
      - say: זה החוזה שלנו לשיחות על גיל ההתבגרות. הוא נשאר על הקיר, וכל אחד יכול להזכיר אותו.

  # ------------------------------------------------------------------ +5′
  - id: upgrade
    title: משדרגים את החוזה
