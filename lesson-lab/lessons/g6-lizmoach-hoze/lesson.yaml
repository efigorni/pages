sub: >-
  לכל אחד יש מעגלים של אנשים שהוא משתף. בשיעור הזה מסמנים את מעגלי השיתוף שלנו, מבחינים בין פרטי לגלוי,
  ומנסחים יחד כללים לשיחה מוגנת בכיתה.
format: לבד, זוגות, קבוצות ומליאה
question: את מי משתפים, ובמה — ואילו כללים ישמרו עלינו כשמדברים בכיתה?
takeaways:
  - במצבים שונים משתפים אנשים שונים — ובנושאים אישיים ורגישים, רק מי שקרוב ושסומכים עליו.
  - מידע פרטי שמגיע למעגלים רחוקים עלול לפגוע, ולכן גם מי ששומע אחראי לשמור על הפרטיות.
  - כללים של שיחה מוגנת עוזרים לכולנו להרגיש בטוחים לדבר ולהקשיב.
prep:
  - >-
    שמונת האירועים של ״בואו נשחק קצת!״ (בשלב ״מעגלי השיתוף שלי״) — ממוספרים וכתובים על הלוח לפני השיעור, כדי שיהיו
    מול העיניים גם בהשוואה בזוגות
  - חלוקה מראש לקבוצות לפי השולחנות, ואיזו שאלה של ״כללי השיח המוגן״ מקבלת כל קבוצה — כל שאלה לשתי קבוצות
  - גיליון גדול (בריסטול) לחוזה, וטוש

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — שיתוף ופרטיות. במשחק המעגלים יש אירועים כמו פנייה מזר ברשת, סרטון של אנשים
      ערומים ושיימינג בקבוצה הכיתתית. שאלי אם יש בכיתה מי שאחד האירועים קרוב אליו מדי, ובקשי שתהיה זמינה אחרי
      השיעור — יש ילדים שיבינו פתאום שמשהו שקרה להם צריך מבוגר.
  - head: מי עלול להיפגע
    text: >-
      מי שחווה אחד האירועים, מי ששיתף פעם ונפגע — כמו בדוגמה ״הוא סיפר את זה לעוד מישהו״ — ומי שאין לו מבוגר
      שאפשר לשתף. בהשוואה בזוגות משווים איפה שמו את האירועים, לא למה: אף אחד לא צריך להסביר את הבחירה שלו.
  - head: לא לוחצים לשתף
    text: >-
      בפתיחה כותבים על רגע של שיתוף, ובמליאה מספרים רק את מי שיתפו ואיך זה היה — לא במה. הדף של המעגלים לא
      נאסף. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים
      לשמור בסוד. אם בזוגות או בפתקים עולה שאחד האירועים קורה עכשיו — פנייה מזר, סרטון, שיימינג — מטפלים בו עוד
      היום.

