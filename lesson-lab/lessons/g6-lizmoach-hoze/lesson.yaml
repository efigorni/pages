    - name: שלוש תנועות
      text: מחאי כף, נקשי על השולחן והרימי ידיים; הכיתה חוזרת על השלוש בסדר — ואז בסדר הפוך, מהר יותר.
    - name: סופרים בשקט
      text: עוצמים עיניים וסופרים בלב עד עשרים. מי שמגיע לעשרים — פותח עיניים ומרים יד, בלי מילה.
  from: upgrade

