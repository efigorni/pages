  alt: בית ספר
steps:
- id: part-1
  title: כשמגיע הצלצול
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: כשמגיע הצלצול — מה יכול להרגיש ילד שחושש מההפסקה?
  body:
  - slide:
      title: מה יכול להרגיש ילד שחושש מההפסקה?
      art:
      - use: school
        x: 180
        y: 120
        w: 250
      alt: בית ספר
      echo: true
  - moves:
    - 'ספרי: דני נמנע ממשחק כדורגל אחרי שצחקו עליו.'
    - כשמגיע הצלצול הוא מתכווץ.
    - תני שלוש דקות לכתיבה על רגש, מחשבה ותחושה אפשריים.
    - אין להניח שהמצב בטוח אם עדיין פוגעים בו.
  - ask: מה יכול להרגיש ילד שחושש מההפסקה?
  - ladder:
      help: מה ההבדל בין חשש לבין פגיעה שמתרחשת עכשיו?
      challenge: איזה מידע צריך מבוגר לברר לפני שמציעים תרגיל הרגעה?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: מפת כלים שאפשר להתחיל איתה
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מפת כלים שאפשר להתחיל איתה — אילו אפשרויות עומדות בפני דני?
  body:
  - slide:
      title: אילו אפשרויות עומדות בפני דני?
      art:
      - use: road
        x: 180
        y: 120
        w: 250
      alt: דרך
      echo: true
      sub: ''
  - source_slide:
      slides:
      - 12
      - 13
      - 14
      why: מציגים את התוכן המקורי המתואר בפעילות וקוראים רק את החלק הדרוש לתרגול.
      art:
      - use: road
        x: 180
        y: 120
        w: 250
      alt: דרך
  - moves:
    - 'הסבירי את הרצף גם למי שלא למד חוסן: עצירה, שחרור גוף נוח, נשימה ללא מאמץ, שיום רגש, בדיקת מחשבה
      ובחירת פעולה.'
    - הציגי את המפה במקור.
    - כל זוג בוחר תחנה ומסביר מה עושים בה, בלי חובה להשתמש בכל התחנות.
  - ask: אילו אפשרויות עומדות בפני דני?
  - task:
      what: בחרו תחנה במפת הכלים והסבירו מה עושים בה. ציינו מתי פונים ישר לעזרת מבוגר.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: אפשר להתחיל בשם לרגש או בבקשת עזרה.
      challenge: מתי נכון לדלג ישר לעזרה של מבוגר?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: מחשבה ופעולה בסיפור דני
  minutes: 9
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מחשבה ופעולה בסיפור דני — מה יכול להיות הצעד הבא שלו?
  body:
  - slide:
      title: מה יכול להיות הצעד הבא שלו?
      art:
      - use: hands-help
        x: 180
        y: 120
        w: 250
      alt: ידיים מושטות
      echo: true
      sub: ''
  - moves:
    - בזוגות פרקו את תמיד אשב בצד למחשבה שניתן לבדוק.
    - 'כתבו מה דני רוצה, ואיזה צעד מתאים: לדבר עם המחנכת, להצטרף למשחק אחר או להזמין חבר.'
    - בקשי נימוק שמכיר בפגיעה ואינו מטיל על דני לבדו לתקן אותה.
  - ask: מה יכול להיות הצעד הבא שלו?
  - task:
      what: בדקו את המחשבה תמיד אשב בצד. כתבו מה חשוב לדני, צעד אפשרי ומי יכול לעזור לו.
      time: 6 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה הוא יכול לבקש מאדם שיכול לעזור?
      challenge: איך פועלים אם ניסיון ההצטרפות אינו מצליח?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: שמש של מצבים
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: שמש של מצבים — איזה כלי מתאים למצב חדש?
  body:
  - slide:
      title: איזה כלי מתאים למצב חדש?
      art:
      - use: arrows-fork
        x: 180
        y: 120
        w: 250
      alt: שלושה כיוונים
      echo: true
      sub: ''
  - moves:
    - 'כתבי שלושה מצבים דמיוניים: הפסד במשחק, קושי במשימה ומחלוקת על תור.'
    - כל רביעייה בוחרת מצב, מסמנת רגש, בוחרת כלי אחד ומנסחת פעולה.
    - הציעי להשוות שתי בחירות שונות לאותו מצב.
  - ask: איזה כלי מתאים למצב חדש?
  - task:
      what: בחרו אחד משלושת המצבים, תנו שם לרגש ובחרו כלי ופעולה. השוו לבחירה אחרת באותו מצב.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: איזה כלי יעזור להאט לפני תגובה?
      challenge: איך תבדקו אם הכלי עזר או שדרושה עזרה נוספת?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-5
  title: מסיימים וחוזרים להווה
  minutes: 4
  practices:
  - מהלכי שיח
  - זמן חשיבה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מסיימים וחוזרים להווה — מה נשאר איתנו אחרי התרגול?
  body:
  - slide:
      title: מה נשאר איתנו אחרי התרגול?
      art:
      - use: sun
        x: 180
        y: 120
        w: 250
      alt: שמש
      echo: true
  - moves:
    - הציעי מבט בחדר, הנחת רגליים בנוחות ודימוי של בלון מתרחק למי שרוצה.
    - הזמיני שיתוף על הכלי ולא על אירוע אישי.
    - הדגישי שהרגש אינו חייב להיעלם, ושהרגעה אינה מבטלת טיפול בבעיה.
  - ask: מה נשאר איתנו אחרי התרגול?
  - ladder:
      help: איזה צעד קטן אתם יכולים לזכור?
      challenge: מה ההבדל בין הפוגה לבין ויתור על פתרון?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - בחרו מצב דמיוני וכלי אחד שמתאים לו.
      - כתבו פעולה ובעל תפקיד שיוכל לעזור אם צריך.
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: דחייה חברתית ופחד מהפסקה; יש לבדוק ולטפל בפגיעה אמיתית, לא להציג אותה כאיום דמיוני בלבד.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
