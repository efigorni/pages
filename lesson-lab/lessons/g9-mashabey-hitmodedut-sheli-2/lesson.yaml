steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: מה עוזר לנו כשקשה?
    minutes: 4
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: השאלה של השיעור, והמסע של סימבה — מה ומי עזר לו כשברח אחרי מות אביו
    body:
      - slide:
          kicker: מה הקשר? · ״מלך האריות״
          title: מה עוזר לנו להתמודד כשקשה לנו?
          sub: נצא למסע הזה עם דמות שאתם בוודאי מכירים — סימבה.
          echo: true
          alt: דרך מתפתלת אל האופק, ושמש מעליה
          art:
            - {use: road, x: 120, y: 200, w: 380}
            - {use: sun, x: 400, y: 36, w: 160}
      - moves:
          - הציגי את השאלה, וספרי בלב עד עשר לפני שאת ממשיכה.
          - שאלי מי זוכר את המסע של סימבה. תני לשניים לספר, והשלימי את מה שחסר.
          - שאלי באילו משאבים סימבה נעזר אצל טימון ופומבה, ורשמי בצד הלוח — חברים טובים, סביבה נינוחה.
      - whisper: >-
          העלילה, בקצרה: סימבה מאבד את אביו, מרגיש עצוב, בודד ואשם — ובורח. אצל טימון ופומבה הוא חי ״אקונה מטטה״:
          מנסה לשכוח ולהדחיק, אבל משהו בפנים לא נותן לו שקט. כשהוא גדל הוא פוגש את נלה, וזו נקודת תפנית. רק כשהוא
          נזכר מי הוא באמת — בעזרת חברים, ובזכות האומץ שבתוכו — הוא חוזר להתמודד עם מה שברח ממנו.
      - ask: באילו משאבי התמודדות סימבה נעזר כשחי עם טימון ופומבה? מה ומי עוזר לו?
      - say: >-
          הוא נעזר בחברים ובחיים נוחים — אבל לא מתמודד עם האובדן ועם הרגשות הקשים. בהמשך הוא פוגש את נלה, ואחר כך
          את רפיקי. בואו נראה מה רפיקי מעורר בו.

  # ------------------------------------------------------------------ 4′–12′
  - id: rafiki
    title: סימבה פוגש את רפיקי
    minutes: 8
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: צופים במפגש עם רפיקי; לבד, בזוגות ובמליאה — אילו כוחות מתעוררים בסימבה, ומה רפיקי נותן לו
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש השערות.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה.
          - אחרי הצפייה — 30 שניות לבד, דקה בזוגות, ואז שמעי שלושה–ארבעה זוגות.
          - חשפי את הרשימה של המקור, ושאלי מה ממנה כבר עלה בזוגות.
      - video:
          title: סימבה מתמודד עם העבר
          url: https://www.youtube.com/watch?v=AUkgMs8vPVE
          length: "3:38"
          before: מה יכול לעזור למי שבורח מכאב — לעצור ולהתמודד?
          watch: שימו לב — אילו כוחות מתעוררים בסימבה במהלך המפגש עם רפיקי?
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו סימבה מבין שיש לו בחירה — להמשיך לברוח או לחזור — לפני שהוא מחליט. צפי בסרטון לפני השיעור,
                ורשמי כאן את הזמן.
              ask: מה סימבה יחליט עכשיו — להמשיך לברוח, או לחזור ולהתמודד? לחשו לשכן.
          alt: מבוגר מדבר אל דמות צעירה, ובבועה שלו כוכב
          art:
            - {use: teacher, x: 400, y: 244, w: 140, color: moss}
            - {use: kid-stand, x: 190, y: 264, w: 130, color: teal}
            - {use: speech, x: 210, y: 24, w: 260}
            - {use: star, x: 292, y: 62, w: 96}
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: אילו כוחות מתעוררים בסימבה במפגש עם רפיקי?
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי הצפייה —
          alt: דמות, ומעליה ענן מחשבה ובתוכו סוללה מלאה
          art:
            - {use: thought, x: 60, y: 30, w: 320}
            - {use: battery-full, x: 158, y: 123, w: 130}
            - {use: kid-stand, x: 380, y: 264, w: 130, color: teal}
      - ladder:
          help: מה רפיקי אומר או עושה — ומה זה משנה אצל סימבה?
          challenge: מה ההבדל בין מה שעזר לסימבה אצל טימון ופומבה, לבין מה שרפיקי נותן לו?
      - slide:
          kicker: מה ראינו
          title: משאבי התמודדות נוספים של סימבה
          points:
            - יכולת להסתייע, להיעזר ולשתף — דמות חיצונית
            - חיבור לזהות ולשורשים שלו
            - ההבנה של סימבה שיש לו בחירה – להמשיך לברוח או לחזור ולהתמודד
          verbatim: true
          echo: true
          cue: אחרי שזוגות שיתפו —
          alt: שתי ידיים מושטות זו לזו, ובית לידן
          art:
            - {use: hands-help, x: 260, y: 150, w: 300}
            - {use: house, x: 50, y: 60, w: 170}
      - say: >-
          רפיקי לא נותן לסימבה לברוח. הוא עוזר לו להסתכל על הכאב ועל הגעגוע, נשאר לצידו, ומזכיר לו מי הוא ומה מקומו
          — למרות האסון. לפעמים צריך מישהו מבחוץ, כדי להתחבר לכוחות שבפנים.

  # ------------------------------------------------------------------ 12′–16′
  - id: define
    title: מהם משאבי התמודדות?
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: ההגדרה של המקור — משאבים פנימיים וחיצוניים; ממיינים את המשאבים של סימבה, ומוסיפים דוגמאות מהחיים
    body:
      - slide:
          kicker: מהם משאבי התמודדות?
          title: כל מה שעוזר לנו ונותן לנו כוח כשקשה
          sub: משאבים פנימיים — בתוכנו; משאבים חיצוניים — סביבנו.
          echo: true
          alt: דמות בתוך עיגול, ומסביבה בית, זוג חברים ומבוגר
          art: {file: art/inner-outer.svg}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: >-
            כל אותם הדברים שעוזרים לנו, נותנים לנו כוח ומחזקים אותנו כשקשה לנו. אלו הם מקורות חוזק אישיותיים,
            התנהגותיים וסביבתיים אשר מסייעים לנו לצלוח אתגרים וקשיים שונים בחיים
      - moves:
          - הקריאי את ההגדרה, והציגי את השקף.
          - שאלי אילו מהמשאבים של סימבה פנימיים ואילו חיצוניים, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הזמיני את הכיתה להגיב זה לזה, והוסיפי דוגמאות מהרשימה של המקור.
      - list:
          - "**פנימיים:** אמונה בעצמי, תחומי עניין ותחביבים, מחשבות מעודדות ומחזקות, הומור, תקווה."
          - "**חיצוניים:** משפחה, חברים, מסגרות (לימודית, חברתית, תחום עניין), אנשי מקצוע."
      - ask: אילו מהמשאבים של סימבה הם פנימיים — ואילו חיצוניים? מי מסכים? למה?
      - say: לכל אחד מאיתנו יש כוחות בפנים, ואנשים ומקומות מסביב. עכשיו נחפש את שלכם.

  # ------------------------------------------------------------------ 16′–22′
  - id: mine
    title: משאבי ההתמודדות שלי
    minutes: 6
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - דיפרנציאליות וגיוון
    summary: >-
      כל אחד חושב על תקופה שבה התמודד עם קושי, וכותב על פתקים נפרדים משאבים פנימיים וחיצוניים — בעזרת בנק הכוחות
    body:
      - slide:
          kicker: כולם כותבים · לבד
          title: מה עזר לכם להתמודד?
          sub: שלושה משאבים פנימיים ושלושה חיצוניים — כל אחד על פתק נפרד.
          timer: 240
          echo: true
          alt: דמות כותבת ליד שולחן, ולידה שני פתקים צבעוניים
          art:
            - {use: kid-desk, x: 280, y: 140, w: 280, color: teal}
            - {use: sticky, x: 60, y: 90, w: 120, color: teal}
            - {use: sticky, x: 110, y: 250, w: 120, color: orange}
      - moves:
          - חלקי לכל אחד שישה פתקים — צבע אחד לפנימיים, צבע שני לחיצוניים.
          - הציגי את בנק הכוחות, והשאירי אותו על המסך כל זמן הכתיבה.
          - >-
            הסתובבי בין השולחנות. מי שנתקע — הזכירי שאפשר לבחור קושי קטן, לכתוב שניים ושניים, או לכתוב על אדם שהוא
            מעריך ועל מה שעוזר לו.
      - say: >-
          חשבו על תקופה שבה התמודדתם עם קושי — גם קושי קטן. מה עזר לכם? אילו כוחות יש בכם? במי נעזרתם? כותבים רק
          את המשאבים, לא את הסיפור.
      - slide:
          kicker: בנק הכוחות
          title: אילו כוחות יש בכם?
          points:
            - יצירתיות · יושר · אומץ
            - אופטימיות · אחריות · חוש הומור
            - נדיבות · התמדה · סקרנות
            - רוגע · חברותיות · שיתוף · נחישות
          echo: true
          cue: כשמתחילים לכתוב —
          alt: כוכב גדול, ולב לידו
          art:
            - {use: star, x: 250, y: 130, w: 280}
            - {use: heart, x: 60, y: 60, w: 150}
      - ladder:
          help: בחרו מבנק הכוחות שתי מילים שמתאימות לכם, ואדם אחד שעזר לכם פעם.
          challenge: בחרו משאב אחד, וכתבו איך תוכלו להיעזר בו בפעם הבאה שיהיה קשה.
      - say: עכשיו נבנה מכל הפתקים לוח אחד — לוח הכוחות של הכיתה.

  # ------------------------------------------------------------------ 22′–27′
  - id: board
    title: לוח הכוחות והמשאבים
    minutes: 5
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: תולים את הפתקים בשני טורים, קוראים את הלוח, וכל אחד בוחר כוח אחד שהוא מוסיף לעצמו
    body:
      - slide:
          kicker: לוח הכוחות והמשאבים
          title: איזה כוח תוסיפו לעצמכם מלוח הכוחות הכיתתי?
          verbatim: true
          timer: 180
          echo: true
          alt: לוח ועליו שני טורים של פתקים צבעוניים
          art:
