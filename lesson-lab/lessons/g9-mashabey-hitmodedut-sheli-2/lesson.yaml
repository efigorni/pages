sub: >-
  מה עוזר לנו להתמודד כשקשה? בשיעור הזה פוגשים את סימבה מ״מלך האריות״, מגדירים משאבי התמודדות פנימיים
  וחיצוניים, וכל אחד מגלה את שלו — ובונים יחד לוח כוחות כיתתי.
format: צפייה, כתיבה אישית ומליאה
question: מה עוזר לי להתמודד כשקשה — בתוכי ומסביבי?
takeaways:
  - לכל אחד יש משאבי התמודדות — פנימיים, כמו הומור ותקווה, וחיצוניים, כמו משפחה וחברים.
  - כשקשה, אפשר לעצור ולהיזכר בכוחות שלנו — ולא חייבים להתמודד לבד.
  - בכיתה יש הרבה כוחות — אפשר ללמוד מהם, לתת מהם וגם לקבל.
prep:
  - פתקים דביקים בשני צבעים — שלושה מכל צבע לכל תלמיד
  - >-
    שני טורים על הלוח, לפני השיעור — ״משאבים פנימיים״ ו״משאבים חיצוניים״ (ללוח הכוחות)

safe:
  - head: תיאום עם היועצת
    text: >-
      השיעור הוא חלק מ״בוחרים בחיים״ — תוכנית למניעת אובדנות ולחיזוק חוסן. ספרי לה מתי השיעור ועל מה, ושאלי על
      תלמידים שאיבדו הורה או אדם קרוב, או שעוברים עכשיו תקופה קשה — הסיפור של סימבה (אב שמת, אשמה, בריחה) עלול
      לגעת בהם. בקשי שתהיה זמינה אחרי השיעור. במצגת המקורית יש מכתב קצר להורים — החליטו יחד אם לשלוח אותו.
  - head: מי עלול להיפגע
    text: >-
      מי שאיבד אדם קרוב עלול לזהות את עצמו בסימבה. לפני הצפייה אמרי בפשטות שהסיפור מתחיל באובדן, ותני מקום לכל מה
      שעולה. בכתיבה על ״תקופה שבה התמודדתי עם קושי״ אפשר לבחור קושי קטן, או לכתוב על אדם מוערך ועל מה שעוזר לו.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. משתפים משאבים, לא
      את הסיפור — על הפתקים כותבים מה עזר, לא מה קרה. הפתקים נתלים בלי שמות, ומי שלא רוצה — לא תולה. מותר לוותר,
      ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור
      בסוד. מי שכותב או אומר שאין לו אף אחד, או ששום דבר לא עוזר — מדברים איתו בשקט עוד היום, ומעדכנים את היועצת.
      לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 12–17 דקות — רק ״למחשבה״; פחות — ישר
    ל״חשוב לזכור״.
  short:
    steps:
      - rafiki
      - board
    text: >-
      אחרי הצפייה ברפיקי מדלגים על הזוגות — שאלה אחת במליאה; ובלוח הכוחות תולים וקוראים, ושני תלמידים בלבד אומרים
      איזה כוח בחרו

brain_break:
  signs: עיניים כבדות, ראשים על השולחן, שקט שלא נשבר גם אחרי שאלה.
  ideas:
    - name: סופרים עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר את המספר הבא, בלי סדר ובלי סימנים. שניים מדברים יחד?
        מתחילים מאחת.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
  from: nala

