      look_for: 'חפשי תשובה שמחברת בין שאלת השיעור לצעד מסוים: איך עוברים מצפייה בפגיעה לפעולה בטוחה לצד מי
        שנפגע? הצעה כללית דורשת דוגמה; תיאור מצוקה או בקשת שיחה דורשים המשך אישי.'
      art: kid-desk
      alt: תלמיד כותב ליד שולחן
      timer: 120
safe:
- head: תיאום עם היועצת
  text: תאמי מראש כיצד לפנות לשיחה אישית בעקבות עומדים מהצד? לא, עומדים לצד!. הכיני אפשרות לצאת לזמן קצר בליווי
    מבוגר מוכר.
- head: מי עלול להיפגע
  text: דחייה מקבוצה והפסד במשחק עלולים להזכיר פגיעה קיימת. אין משחזרים פגיעה אמיתית, מצלמים תגובות או מחלקים
    לילדים תפקידים על פי מעמדם החברתי.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על אדם או על דמות דמיונית, לכתוב במקום לדבר או לעבור. אין מבקשים פרטים אישיים או שמות של
    ילדים.
- head: אם מישהו משתף פגיעה
  text: 'הודי לו על האמון, עצרי שאלות מהכיתה והמשיכי בפרטיות עם היועצת; אל תבטיחי סודיות כשנדרשת הגנה. המבוגרים
    אחראים לטפל בפגיעה. לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; מוקד 105 — המטה הלאומי
    להגנה על ילדים ונוער ברשת, 24/7.'
