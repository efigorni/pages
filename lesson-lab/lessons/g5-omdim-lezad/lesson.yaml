- id: remember
  title: חשוב לזכור
  kind: messages
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: מסרי המקור, כל מסר בפני עצמו, וחיבור לפעילות
  body:
  - messages:
      items:
      - חשוב ביותר שכולנו נתנהל באופן חיובי וחברי ברשת, כך שכולנו נרגיש בה שייכות, קרבה ומוגנות
      - 'כולנו רוצים להרגיש חלק מקבוצה ומחברה ויש מקום לכולנו במארג החברתי.

        חשוב שנעשה זאת באמצעות מעשים חיוביים ומקדמים ולא בדרך שתעצים (תגדיל) אותנו אך תפגע (תקטין) באחרים.'
      - המחקרים מראים כי מספיק שה"צופה מהצד" (פנים אל פנים או ברשת) מתערב באמירה או במעשה סמלי – זה מוביל לעצירת
        הפגיעה ברוב האירועים!
      - תפקידים אינם קבועים! גם אם הייתי בתפקיד מסוים מספר פעמים כמו הפוגע או המתעלם, אני יכול לבחור ולהתנהל
        בתפקיד חברתי אחר בפעם הבאה שאהיה נוכח בפגיעה בחבר. אני יכול לבחור להגן, לעמוד לצד.
      - אם אנחנו חוששים לעמוד לצד הנפגע באופן אקטיבי ולעצור את הפגיעה, או שלא מוצאים את הכוח (הפיסי/הרגשי)
        כדי לעשות זאת- תמיד חשוב לפנות למבוגר, שידע לתת את המענה.
      ask: איזה מסר מתחבר להתנסות שלכם היום? חשבו בשקט, ואז הצביעו כשאקרא את המסר שבחרתם.
      art: bulb
      alt: נורה דולקת
      tip: המשפט המחקרי הוא ציטוט מן המקור, לא הבטחה שהפגיעה תיפסק מיד. אל תטילי על ילדים אחריות לתוצאה; מבוגרים
        אחראים להגנה.
