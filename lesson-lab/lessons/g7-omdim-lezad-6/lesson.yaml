      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      שלוש קבוצות דיון — התלבטויות, מחירים ורווחים, וחברות — ולכל אחת שאלת חובה; במליאה מדברים על ההתלבטות
    body:
      - slide:
          kicker: בקבוצות · 4 דקות
          title: למה קשה להתערב?
          sub: שלוש קבוצות דיון — ולכל אחת שאלת חובה למליאה.
          points:
