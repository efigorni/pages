steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: לצד או מהצד?
    minutes: 4
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: כתיבה אישית קצרה — מה עולה כששומעים ׳עומדים לצד׳ ו׳עומדים מהצד׳; שומעים שלוש תשובות
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: עומדים לצד, עומדים מהצד
          sub: מה עולה לכם כששומעים כל אחד מהביטויים? ומה ההבדל?
          timer: 120
          echo: true
          alt: שני חברים יד ביד, ודמות אחת עומדת רחוק מהם
          art:
            - {use: pair, x: 300, y: 220, w: 240}
            - {use: kid-stand, x: 70, y: 200, w: 100, color: gray}
      - moves:
          - השקף על המסך כשהכיתה נכנסת; מתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש תשובות שונות זו מזו.
          - הזמיני את שלושת הכותבים לשתף רק את מה שכתבו על הביטויים.
      - say: שתי דקות, לבד ובשקט. כתבו מה עולה לכם — אין תשובה נכונה.
      - ladder:
          help: מה עושה מי שעומד ׳לצד׳ חבר? ומה עושה מי שעומד ׳מהצד׳?
          challenge: ואתם — בדרך כלל לצד או מהצד? כתבו רק לעצמכם.
      - ask: מה ההבדל בין מי שעומד לצד לבין מי שעומד מהצד?
      - say: >-
          היום נדבר על רגעים שבהם חברים רואים פגיעה — גם פגיעה מינית, גם ברשת — ועל מה שהם יכולים לעשות. נתחיל
          בסרטון קצר.

  # ------------------------------------------------------------------ 4′–11′
  - id: video
    title: אל תפילו ברשת!
    minutes: 7
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      צופים בחבר שמתערב — מה הוא אמר, ומה שכנע; על הלוח: מה החבר עשה, ואיך זה השפיע; והחוק, בקצרה
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש תשובות.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה.
          - >-
            אחרי הצפייה — אמרי שהאירוע בסרטון הוא פגיעה על פי חוק, ושהיום לא מתמקדים בפגיעה עצמה אלא בחברים: מה הם
            יכולים לעשות.
          - >-
            שאלי מה אמר החבר ומה שכנע, והזמיני את הכיתה להגיב זה לזה. רשמי על הלוח שני טורים — ״מה החבר עשה ואמר״
            ו״איך זה השפיע״.
          - הקריאי את החוק בקצרה, ושאלי אם יש עוד דרך לעזור שלא ראינו בסרטון.
      - video:
          title: אל תפילו ברשת!
          url: https://www.youtube.com/watch?v=WnYNOV6pJWo
          length: "1:08"
          before: מה אפשר להגיד לחבר שעומד לעשות משהו שיפגע במישהו אחר?
          watch: שימו לב לחבר שמתערב — מה הוא אומר, ואיך.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו החבר מתחיל לשכנע את הנער שפגע — לפני שרואים אם הנער משנה את דעתו. צפי בסרטון לפני השיעור,
                ורשמי כאן את הזמן.
              ask: מה הנער יעשה עכשיו? לחשו לשכן.
          alt: חבר אומר ״די!״ לחבר שמחזיק טלפון
          art:
