    summary: שבעת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              אתם תלמידים נמצאים לא פעם בעמדה של ה״עומדים מהצד״ באירועי פגיעה מינית המתרחשים בין בני גילכם, כלומר
              נוכחים בסיטואציה שיש בה סיכון לפגיעה באחר או אפילו פגיעה ממש. אתם נוכחים לא כפוגעים ולא כנפגעים אלא
              כעדים.
            - >-
              יש לכם מקום מיוחד ומשמעותי שאין למבוגרים: אתם עלולים להיות עדים לסימני הסיכון לפגיעה לפני שהיא
              מתרחשת, לראות את הפגיעה מתרחשת או לדעת עליה לאחר מכן.
