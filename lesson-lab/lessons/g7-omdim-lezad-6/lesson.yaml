            - >-
              במפגש זה ראינו שהתערבות אינה פשוטה בכלל, ויכולות להיות התלבטויות רבות ושיקולים אמיתיים וחשובים לפני
              נקיטת עמדה או פעולה. זה מאד טבעי לרצות להשתייך לקבוצה חברתית ולעשות הכל כדי לא לסכן את המקום החברתי.
            - >-
              פגשנו את מודל ההתערבות של חמשת המ״מים: מדברים תכלס, מעבירים נושא, מארגנים משלחת, משהים לרגע, מדווחים
