            - >-
              ההתערבות עוזרת גם למי שנפגע אבל לא פחות מכך גם למי שפוגע וצריך לקבל עזרה על מנת להפסיק לפגוע.
            - >-
              פנייה למבוגר שאתם סומכים עליו כדי להתייעץ עימו יכולה מאד לסייע. הצוות החינוכי בביה״ס קשוב לכם ויודע
              כיצד להתנהל במצבים אלה.
          ask: איזה משפט הייתם רוצים שכל חבר יזכור? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
