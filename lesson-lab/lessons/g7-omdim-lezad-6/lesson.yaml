          - חלקי לכל קבוצה כרטיס דיון. כל כרטיס — לשתי קבוצות.
          - הסתובבי בין הקבוצות. דקה לפני הסוף — הזכירי לנסח את התשובה לשאלת החובה.
          - >-
            במליאה — נציג אחד לכל כרטיס עונה על שאלת החובה, והקבוצה השנייה מוסיפה. תני תוקף לכל קול, ותני מקום גם
            לקולות שאומרים ״יש לי כוח לעמוד ולפעול״.
      - p: זה לב השיעור — תני לשיחה את הזמן שלה.
      - say: >-
          כל קבוצה מקבלת כרטיס עם כמה שאלות ושאלת חובה אחת. דברו על האירוע מהסרטון, או על מצבים שאפשר לדמיין — בלי
          שמות, ובלי אירועים אמיתיים מבית הספר.
      - task:
          what: >-
            כל קבוצה דנה בשאלות שבכרטיס שלה, ומנסחת תשובה אחת לשאלת החובה — לדיווח במליאה.
          time: 4 דקות
          group: שש קבוצות לפי השולחנות; כל כרטיס לשתי קבוצות
          rules: מדברים על הדמויות ועל מצבים מדומיינים — בלי שמות; כותב אחד רושם את התשובה
          plenary: נציג אחד לכל כרטיס עונה על שאלת החובה, והקבוצה השנייה עם אותו כרטיס מוסיפה
          help: מה היה עוזר לכם להחליט להתערב — ומה היה עוצר אתכם?
          challenge: מצאו דרך להתערב שגם עוצרת את הפגיעה וגם לא עולה לכם בחברות.
      - handout:
          title: כרטיסי דיון
          copies: שני עותקים, גזורים לשלושה כרטיסים — כרטיס לכל קבוצה
          verbatim: true
          lines: false
          items:
            - |-
              **קבוצת ההתלבטויות – ״מי צריך את כאב הראש הזה בכלל?״**
              אילו שיקולים יכולים להשפיע על בני נוער שמתלבטים אם להתערב בהתנהגות מינית פוגעת של חברם? מה יכול להכריע את הכף ולעזור בהחלטה לדעתכם?
              **שאלת חובה להצגה במליאה:** מדוע חברים צריכים להתערב כשהם מזהים פגיעה מינית?
            - |-
              **קבוצת המחירים והרווחים – ״אני, מה יוצא לי מזה?״**
              אילו מחירים גובה ההתערבות באירוע? אילו רווחים מניבה ההתערבות? מי יכול להרוויח/ להפסיד מההתערבות?
              **שאלת חובה להצגה במליאה:** באיזו דרך אפשר, לדעתכם, להתערב ולסייע באירוע של פגיעה מינית, ובכל זאת לא לשלם מחיר חברתי?
            - |-
              **התערבות וערך החברות – ״זה לא חבר זה אח״**
              האם התערבות מסייעת לחברות או פוגעת בה? מה דעתכם על האמירה הבאה: חבר שפוגע מינית זקוק לעזרה. לטווח הרחוק, איזה חבר אנחנו מעריכים יותר? את זה ששותק או את זה שמתערב ועוזר?
