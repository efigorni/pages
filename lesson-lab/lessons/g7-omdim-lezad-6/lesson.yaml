sub: >-
  לפעמים חברים רואים פגיעה לפני כל מבוגר. בשיעור הזה צופים בחבר שמתערב, מדברים על מה שקשה בהתערבות,
  ומכירים את חמשת המ״מים: דרכים לעזור בלי להיפגע.
format: צפייה, קבוצות ומליאה
question: מה חברים יכולים לעשות כשהם רואים פגיעה — ואיך עוזרים בלי להיפגע?
takeaways:
  - כחברים, אנחנו לפעמים הראשונים שרואים פגיעה — ויש לנו כוח של ממש לעצור אותה.
  - זה טבעי להתלבט ולחשוש מהתערבות — וההתערבות עוזרת גם למי שנפגע וגם למי שפגע.
  - >-
    חמשת המ״מים — מדברים תכל׳ס, מעבירים נושא, מארגנים משלחת, משהים לרגע, מדווחים ומשתפים — מאפשרים לעזור בלי
    להיפגע, ותמיד אפשר לפנות למבוגר.
prep:
  - >-
    חלוקה מראש לשש קבוצות לפי השולחנות, ואיזה כרטיס דיון ואיזה כרטיס אירוע מקבלת כל קבוצה — כל כרטיס לשתי
    קבוצות
  - דף ריק לכל קבוצה, לתשובה לשאלת החובה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פגיעה מינית, הפצת סרטונים, ומה חברים יכולים לעשות. שאלי אם יש בכיתה מי שנפגע
      או מי שפגע, ואם היה לאחרונה בשכבה אירוע דומה — סרטון שהופץ, הערות על הגוף. אם כן, החליטו יחד אם ללמד עכשיו,
      אם היא מצטרפת לשיעור, ואם לוותר על אחד האירועים. בקשי שתהיה זמינה אחרי השיעור ובמשך היום.
  - head: מי עלול להיפגע
    text: >-
      מי שנפגע — גם ברשת — עלול לזהות את עצמו באירועים; מי שראה פגיעה ושתק עלול להרגיש אשם — אמרי שזה טבעי
      להתלבט, ושאף פעם לא מאוחר לעזור. בשניים מהאירועים הפוגע בן והנפגעת בת: מדברים על מעשים, לא על ״בנים״, כדי
      שאף אחד לא ירגיש מואשם בגלל מי שהוא. ואף פעם לא מאשימים את מי שנפגע.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מדברים על הדמויות ועל הסרטונים — בלי שמות, ובלי אירועים אמיתיים מבית הספר״. הכתיבה בפתיחה
      לא נאספת, והשאלה ״לצד או מהצד?״ נשארת במחברת. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים
      לשמור בסוד — אומרים שזה כדי שאפשר יהיה לעזור. רמז לאירוע שקורה עכשיו — סרטון שמסתובב, חבר שמאיים — מטפלים
      בו עוד היום. מחוץ לבית הספר, בכל שעה: קווי הסיוע לנפגעות ולנפגעי תקיפה מינית — 1202 (עונות נשים) ו־1203
      (עונים גברים); מוקד 105 — לפגיעה ברשת, כמו סרטון שמופץ; וער״ן 1201 — עזרה ראשונה נפשית. כל הקווים זמינים
      24/7, ומופיעים גם בשקף ״למי אפשר לפנות?״.

