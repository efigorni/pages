            - {use: kid-stand, x: 110, y: 200, w: 140, color: orange}
            - {use: phone, x: 226, y: 322, w: 72}
            - {use: speech, x: 220, y: 40, w: 230}
            - text: די!
              x: 335
              y: 116
              size: 60
      - slide:
          kicker: דיון אחרי הצפייה
          title: מה עשה החבר שהתערב?
          points:
            - מה אמר החבר המתערב? באילו טיעונים הוא משתמש?
            - האם הנער הפוגע מקשיב לו?
            - מה לדעתכם היה המשפט ששינה לחלוטין את דעתו של הנער שפגע?
          verbatim:
            - points
          echo: true
          cue: אחרי הצפייה —
          alt: לוח, ודמות עומדת לידו
          art:
            - {use: board, x: 200, y: 130, w: 380}
            - {use: kid-stand, x: 50, y: 230, w: 120, color: teal}
      - quote:
          title: החוק — להקריא בקצרה
          text: >-
            פרסום תצלום, סרט או הקלטה של אדם המתמקד במיניותו בנסיבות שבהן הפרסום עלול להשפיל את האדם או לבזותו ולא
            נתנה הסכמתו לפרסום ייחשבו להטרדה מינית. העונש המקסימלי שניתן לגזור בגין העברה הוא עד 5 שנות מאסר ופיצוי
            של עד 120,000 ₪ לנפגע ללא הוכחת נזק (תיקון מספר 10 לחוק למניעת הטרדה מינית, התשע״ד-2014).
      - whisper: >-
          מה שעולה בדרך כלל: החבר מדגיש ערכים — חברות, מניעת פגיעה ועוולה, מוסר וצדק — ונותן מידע על החוק, שמרתיע.
          דרכים שלא נראו בסרטון: להתייעץ עם חבר אחר ולהגיב אחר כך יחד עם עוד חברים, או לעורר אמפתיה (״ואם היו מפרסמים
          תמונה של אחותך?״).
      - say: בסרטון זה נראה פשוט. האמנם? בואו נדבר על מה שקשה.

  # ------------------------------------------------------------------ 11′–19′
  - id: dilemmas
    title: מי צריך את כאב הראש הזה?
    minutes: 8
    practices:
