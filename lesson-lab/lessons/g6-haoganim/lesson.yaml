steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: hook
    title: עוגן — מה הקשר?
    minutes: 4
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: עוגן על המסך כשנכנסים — מה הקשר בין עוגן למעבר לחטיבה? חושבים בשקט, ושומעים השערות
    body:
      - slide:
          kicker: מה הקשר?
          title: מה הקשר בין עוגן למעבר לחטיבה?
          sub: חשבו רגע בשקט — ואז נשמע השערות.
          echo: true
          alt: עוגן, סימן שאלה ובית ספר
          art: {file: art/hook.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי, וספרי בלב עד עשר לפני שאת מזמינה השערות.
          - שמעי ארבע–חמש השערות, ורשמי בצד הלוח מילים שחוזרות — ״מחזיק״, ״יציב״, ״לא נסחף״.
          - אל תאשרי ואל תפסלי — ההגדרה תגיע בהמשך.
      - ask: מה הקשר בין עוגן למעבר לחטיבה? מה עוגן עושה לספינה?
      - say: נחזור לעוגן עוד מעט. קודם — בואו ניזכר במעברים שכבר עברנו.

  # ------------------------------------------------------------------ 4′–10′
  - id: helped
    title: מה עזר לכם?
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: כל אחד נזכר במעבר שעבר — מה הרגיש בבוקר הראשון, ומה עזר לו; בזוגות ובמליאה — רושמים על הלוח את כל מה שעזר
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה עזר לכם, לדעתכם, במעברים הקודמים?
          sub: מעבר דירה, עלייה לכיתה א׳, חדר חדש, חוג חדש, עיר או ארץ אחרת.
          points:
            - לבד — חצי דקה
            - בזוגות — דקה
            - במליאה
          verbatim: [title]
          echo: true
          alt: שתי ידיים מושטות זו לזו
          art: hands-help
      - moves:
          - הציגי את השקף, וחכי חצי דקה של שקט — כל אחד בוחר מעבר אחד ונזכר מה הרגיש בבוקר הראשון, ומה עזר לו.
          - בזוגות, דקה — כל אחד מספר לשכן מה הרגיש ומה עזר לו. לא צריך לספר את כל הסיפור.
          - במליאה — שמעי ארבעה–חמישה זוגות, ורשמי בצד הלוח, בלי סדר, כל מה שעזר — אנשים, תכונות, דברים שעשו.
      - ladder:
          help: מי היה איתכם ביום הראשון במקום החדש? מה עשיתם כדי להרגיש בבית?
          challenge: מה עזר לכם שלא היה קשור לאף אחד אחר — משהו שבא מכם?
      - ask: מה הרגשתם בבוקר הראשון במקום החדש — ומה עזר לכם?
      - say: >-
          מעבר חשוב מעורר רגשות — אצלנו, וגם אצל האנשים הקרובים אלינו. וטוב לדעת שאנחנו לא לבד: יש מי שמלווה
          אותנו בדרך החדשה.
      - say: תראו כמה דברים עזרו לנו. יש לזה שם — ״עוגן״. בואו נחזור לעוגן.

  # ------------------------------------------------------------------ 10′–14′
  - id: anchor
    title: מהו עוגן?
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: ההגדרה והדימוי של המקור — עוגן שמייצב ספינה בים סוער; דוגמאות לעוגנים — אדם מסוים, תכונה מסוימת
    body:
      - slide:
          kicker: מהו עֹגֶן?
          title: דָּבָר בָּטוּחַ וְיַצִּיב שֶׁאֶפְשָׁר לִסְמֹךְ עָלָיו
          sub: כמו עֹגֶן שמסייע ליציבות הספינה כשהים סוער
          verbatim: [title]
          echo: true
          alt: סירה על הגלים, וחבל ממנה אל עוגן במים
          art: {file: art/ship.svg}
      - moves:
          - הקריאי את ההגדרה ואת הדימוי של הספינה.
          - שאלי אם הם יכולים לתת דוגמאות לעוגנים, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - חברי את ההגדרה להשערות מהפתיחה, ואת הדוגמאות לרשימה שבצד הלוח — ״גם זה עוגן״.
      - quote:
          title: ההגדרה והדימוי מהמקור — להקריא
          text: |-
            מהו עֹגֶן? "דָּבָר בָּטוּחַ וְיַצִּיב שֶׁאֶפְשָׁר לִסְמֹךְ עָלָיו" (מתוך: Oxford Languages)

            כמו עֹגֶן שמסייע ליציבות הספינה כשהים סוער, כך גם אנחנו במעבר - כאשר אנו מתמודדים עם שינוי, אנו זקוקים לעוגנים שיסייעו לנו לשמור על היציבות.
      - slide:
          kicker: מהו עוגן?
          title: האם תוכלו לתת דוגמאות לעוגנים?
          sub: אדם מסוים… תכונה מסוימת…
          echo: true
          cue: אחרי ההגדרה —
          alt: מבוגר עם ספר, וכוכב לידו
          art:
            - {use: teacher, x: 340, y: 160, w: 170, color: moss}
            - {use: star, x: 90, y: 200, w: 200}
      - ask: האם תוכלו לתת דוגמאות לעוגנים? אדם מסוים… תכונה מסוימת…
      - say: אז העוגן שלך הוא ___ — הבנתי נכון? והוא בתוכך, או בסביבה שלך?

  # ------------------------------------------------------------------ 14′–22′
  - id: my-anchors
    title: העוגנים שלי
    minutes: 8
    practices:
      - הוצאה למשימה
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: כל אחד בוחר מעבר אחד, כותב בדף עד ארבעה עוגנים ואיך כל אחד עזר, ומסמן בשני צבעים — עוגן בעצמי או בסביבה
    body:
      - say: בחרו מעבר אחד שעברתם — גדול או קטן. בכל עוגן בדף כתבו מי או מה עזר לכם, ואיך.
      - slide:
          kicker: עבודה אישית · בדף
          title: מי/מה היו העוגנים שלכם, וכיצד סייעו לכם?
          sub: התמקדו באחד המעברים שהיה לכם
          verbatim: [title]
          timer: 240
          echo: true
          alt: ארבעה עוגנים — שניים טורקיז ושניים כתומים
          art: {file: art/four-anchors.svg}
      - moves:
          - חלקי את הדף, והציגי את השקף. ארבע דקות לכתיבה — לא חייבים למלא את כל ארבעת העוגנים.
          - >-
            הסתובבי בין השולחנות. למי שנתקע — הציעי את הדוגמה של המקור: אחות גדולה שגם עברה בית ספר, וליוותה
            בימים הראשונים.
          - אחרי ארבע דקות — הציגי את הדוגמה של המעבר לעיר אחרת, ושאלי על כל עוגן אם הוא בעצמי או בסביבה.
          - כל אחד מסמן בדף שלו, בשני צבעים — עוגן בעצמי ועוגן בסביבה.
      - task:
          what: >-
            כל אחד בוחר מעבר אחד שעבר, וכותב בדף עד ארבעה עוגנים — מי או מה עזרו לו, ואיך. אחר כך מסמן כל
            עוגן בצבע — עוגן בעצמי (תכונה שלי, משהו שעשיתי) או עוגן בסביבה (משפחה, חברים, בית הספר).
          time: 4 דקות לכתיבה, 2 לסימון
          group: לבד
          rules: כותבים בשקט; מותר לבחור מעבר קטן; הדף לא נאסף
          plenary: מתנדבים מספרים על עוגן אחד בשלב הבא
          help: מי היה איתכם? מה עשיתם בעצמכם כדי שיהיה לכם קל יותר?
          challenge: מצאו עוגן שהוא גם בעצמי וגם בסביבה — ואיך תסמנו אותו?
      - handout:
          title: העוגנים שלי
          copies: עותק לכל תלמיד
          verbatim: true
          items:
            - התמקדו באחד המעברים שהיה לכם – מי/מה היו העוגנים שלכם, וכיצד סייעו לכם?
            - "העוגן שלי:"
            - "העוגן שלי:"
            - "העוגן שלי:"
            - "העוגן שלי:"
      - slide:
          kicker: דוגמה · מעבר לעיר אחרת
          title: עוגן בעצמי — או עוגן בסביבה?
          points:
            - התייעצות עם הורים
            - שיתוף אח גדול ברגשות לקראת המעבר
            - סיור במקום החדש
            - תכנון החדר החדש
          verbatim: [points]
          echo: true
          cue: אחרי ארבע דקות של כתיבה —
          alt: דמות, וחץ ממנה אל בית חדש
          art:
            - {use: house, x: 30, y: 250, w: 250}
            - {use: arrow, x: 290, y: 330, w: 132, color: gray}
            - {use: kid-stand, x: 450, y: 250, w: 125, color: teal}
      - whisper: >-
          במקור — בסביבה: התייעצות עם הורים, שיתוף אח גדול. בעצמי: סיור במקום החדש, היכרות עם קווי האוטובוס
          באזור, תכנון החדר החדש — דברים שאני יזמתי.
      - ask: התייעצות עם הורים — עוגן בעצמי או בסביבה? ותכנון החדר החדש?
      - say: עכשיו נאסוף את העוגנים של כולנו ללוח.

  # ------------------------------------------------------------------ 22′–27′
  - id: our-anchors
    title: העוגנים שלנו
    minutes: 5
    practices:
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: מתנדבים משתפים עוגן אחד, והוא נרשם בטור שלו על הלוח; מה עולה מתוך הדברים, ומה גיליתי על עצמי
    body:
      - slide:
          kicker: העוגנים שלנו
          title: מה גיליתם על העוגנים שלכם?
          sub: ומה גיליתם על עצמכם?
          echo: true
          alt: שני טורים — בעצמי ובסביבה — ועוגן בראש כל טור
          art: {file: art/two-columns.svg}
      - moves:
          - שאלי מי רוצה לשתף עוגן אחד. רשמי אותו בטור שלו על הלוח — ״עוגנים בעצמי״ או ״עוגנים בסביבה״.
          - אחרי שש–שבע תשובות — שאלי מה עולה מתוך הלוח, ותני לכיתה להגיב זה לזה.
          - בסוף — שאלי מה גילו על עצמם. רק מתנדבים, במשפט אחד.
      - ask: מה עולה מתוך הלוח? באיזה טור יש יותר עוגנים — ולמה, לדעתכם?
      - say: אז מה שגילית זה ש___ — הבנתי נכון? מי עוד גילה משהו דומה?
      - say: העוגנים שעזרו לנו פעם יכולים לעזור לנו גם במעבר הבא — במעבר לחטיבה.

  # ------------------------------------------------------------------ +5′
  - id: keychain
    title: מחזיק המפתחות
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - עניין ורלוונטיות
    summary: גוזרים את העוגנים מהדף ותולים אותם על חישוק של מחזיק מפתחות; למה דווקא מחזיק מפתחות?
    body:
