# D57: מילים לועזיות בציטוט מילולי מהמקור — נשארות כמו במקור, ורשומות כאן
latin_ok:
  - Oxford Languages

sub: >-
  כשמשהו משתנה, אנחנו מחפשים במה להיאחז. בשיעור הזה מגלים מה הקשר בין עוגן למעבר, נזכרים מה עזר לנו
  במעברים שכבר עברנו, ומוצאים את העוגנים שילוו אותנו גם לחטיבה.
format: מליאה, זוגות ועבודה אישית
question: מי ומה עזרו לנו במעברים שכבר עברנו — ואיך הם יכולים לעזור לנו גם בחטיבה?
takeaways:
  - עוגן הוא דבר בטוח ויציב שאפשר לסמוך עליו — כשמשהו משתנה, הוא עוזר לנו לשמור על יציבות.
  - יש עוגנים בתוכנו — תכונות ודברים שעשינו בעצמנו — ויש עוגנים בסביבה — משפחה, חברים, בית הספר.
  - העוגנים שעזרו לנו במעברים קודמים יכולים לעזור לנו גם במעבר לחטיבה, ואפשר למצוא עוד.
prep:
  - טושים או עפרונות בשני צבעים לכל תלמיד
  - שני טורים על הלוח, לפני השיעור — ״עוגנים בעצמי״ ו״עוגנים בסביבה״
  - >-
    להרחבה ״מחזיק המפתחות״ — חישוק של מחזיק מפתחות לכל תלמיד, כמה מספריים ומנקב

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מה עזר לנו במעברים קודמים, לקראת החטיבה. שאלי מי בכיתה עבר מעבר שעוד כואב
      — פינוי מהבית, עלייה, פרידה של ההורים או מעבר בין שני בתים — ומי לא לומד כרגע עם חבריו מבית הספר
      הקודם. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שבוחר מעבר קשה עלול להיזכר דווקא במה שלא עזר, או במי שלא היה שם. הכתיבה היא על עוגנים — מה כן
      עזר — ומותר לבחור מעבר קטן וקל: חדר חדש, חוג, כיתה חדשה. אצל מי שפונה מביתו — הדגישי את הכוחות שגילה
      בעצמו בתקופה הזאת, כמו שהמקור מבקש.
  - head: לא לוחצים לשתף
    text: >-
      דף העוגנים לא נאסף. במליאה משתפים רק מתנדבים, ורק את העוגן — בלי לספר את סיפור המעבר — ולא קוראים
      בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא
      מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״מחזיק המפתחות״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - helped
      - our-anchors
    text: ״מה עזר לכם?״ נשאר בזוגות בלי מליאה, וב״העוגנים שלנו״ שומעים שניים–שלושה עוגנים בלבד

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: גבוה־נמוך
      text: >-
        כולם עומדים. כשאת אומרת ״גבוה״ — מתמתחים על קצות האצבעות, ״נמוך״ — מתכופפים, ״עצור״ — קופאים במקום. כל
        סבב מהר יותר.
    - name: רגליים על הרצפה
      text: שתי רגליים על הרצפה, יד על הבטן. שואפים לאט עד ארבע ונושפים עד שש. חמש פעמים.
    - name: מחיאות בשרשרת
      text: מחיאת כף אחת עוברת מתלמיד לתלמיד לאורך השורות, כמה שיותר מהר — ואז בכיוון ההפוך.
  from: friend

