sub: >-
  ברשת אנחנו מפרסמים, מגיבים ומשתפים — ולא תמיד עוצרים לשאול למה. בשיעור הזה בודקים מה רוב בני הנוער
  עושים ומה מנחה אותנו, וכותבים יחד קוד אתי לכיתה.
format: מליאה, קבוצות וקוד כיתתי
question: מה מנחה אותנו ברשת — ואילו כללים נבחר לעצמנו, ככיתה?
takeaways:
  - מה שאנחנו מפרסמים, משתפים ומגיבים ברשת משפיע גם עלינו וגם על אחרים.
  - >-
    יש סיבות שמנחות אותנו ברשת — ערכים, התחשבות, ״מה יגידו עליי״, החוק וההורים — וכדאי לשים לב אם אנחנו
    באמת בוחרים, או עושים כמו כולם.
  - כללים שהכיתה בוחרת יחד עוזרים לכולנו להתנהל ברשת בכבוד, בהתחשבות ובביטחון.
prep:
  - חלוקה מראש לקבוצות של 4–5 לפי השולחנות, ואיזו כרטיסיה מקבלת כל קבוצה
  - רצועת נייר וטוש לכל קבוצה, נייר דבק, ובריסטול שכתוב בראשו ״גולשים לשינוי — הקוד האתי הכיתתי שלנו״
  - >-
    להרחבה ״הקוד הארצי״: הקוד ״ביחד גולשים לשינוי״ (PDF) פתוח במחשב הכיתה, עם שלושה–ארבעה עמודים שבחרת
    להציג. הקישור אליו — במצגת המקורית, בשקף ״מנסחים יחד כללי התנהגות ברשת״ (המצגת מקושרת בתחתית המערך).

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — כללי התנהגות ברשת: פרסום תמונות בלי הסכמה, שמועות, עלבונות וקבוצות
      ווטסאפ. שאלי אם יש בכיתה מי שנפגע לאחרונה ברשת, או מי שהיה מעורב בפגיעה, והחליטי איתה אם לתת לקבוצה
      את כרטיסיה 10 (מדבקות ותמונות בעלות אופי מיני) או להשאיר אותה בחוץ. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שנפגע ברשת — תמונה שהופצה, שמועה, עלבון בקבוצה — ומי שפגע. הכרטיסיות מדברות על ״בני נוער״, ושומרים
      על זה: לא מביאים מקרים מהכיתה או מבית הספר, ולא שמות. במסלול ״מי מסכים?״ מראים אגודל צמוד לחזה, כך
      שרק את רואה, ומי שלא רוצה — לא מראה. נבחרו משפטים על נורמות והרגלים, לא כאלה שהתשובה עליהם מסמנת מישהו
      כפגיע.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום, מהמקור: ״אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. מותר לוותר, ולא קוראים בשם למי
      שלא הצביע. בכרטיסיות אומרים מה ״רוב בני הנוער״ עושים — לא מה כל אחד עשה.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל תמונה שלו שמופצת עכשיו, או קבוצה שפוגעים בו בה — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית
      אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. מחוץ לבית הספר, בכל שעה: מוקד 105
      — לפגיעה ברשת שקורה עכשיו; וער״ן 1201 — עזרה ראשונה נפשית. שניהם זמינים 24/7.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״הקוד הארצי״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
