steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: open
    title: בחרי מסלול — מה מנחה אותנו ברשת
    minutes: 7
    summary: פתיחה מעוררת עניין, ושאלה אחת לכולם — האם חשוב שיהיו לנו כללים ברשת?
    body:
      - tracks:
          - title: מי מסכים?
            text: >-
              ארבעה משפטים על התנהלות ברשת. על כל משפט כולם מראים יחד, באגודל צמוד לחזה, אם הם מסכימים — ושניים
              מסבירים.
            when: רוצים פתיחה בלי מסך שכל הכיתה משתתפת בה, ולשמוע מה הכיתה חושבת על כל משפט.
            practices:
              - מה הקשר?
              - זמן חשיבה
              - מהלכי שיח
            spotlights:
              - עניין ורלוונטיות
              - הערכה ורפלקטיביות
            body:
              - slide:
                  kicker: מי מסכים? · אגודל צמוד לחזה
                  title: מסכימים עם המשפט?
                  sub: אגודל למעלה — מסכימים. למטה — לא. באמצע — מתלבטים. אפשר גם לא להראות.
                  echo: true
                  alt: דמות עומדת, אגודל למעלה מצד אחד ואגודל למטה מהצד השני
                  art:
                    - {use: kid-stand, x: 235, y: 170, w: 150, color: teal}
                    - {use: thumb-up, x: 430, y: 300, w: 150}
                    - {use: thumb-down, x: 40, y: 300, w: 150}
              - moves:
                  - >-
                    הציגי את השקף: אגודל צמוד לחזה — למעלה, למטה או באמצע. כך רק את רואה את התשובות.
                  - הקריאי משפט, חכי חמש שניות של שקט, ובספירה עד שלוש כולם מראים יחד.
                  - >-
                    תארי במילים מה את רואה (״רוב האגודלים למעלה…״), והזמיני שני מתנדבים להסביר — אחד מכל צד.
                    ושאלי את הכיתה: ״מי חושב אחרת? למה?״
                  - אחרי ארבעת המשפטים — שאלה אחת על מה שהנחה אותם.
              - say: >-
                  על כל משפט — חושבים לבד חמש שניות, ובספירה עד שלוש מראים יחד באגודל צמוד לחזה. אין תשובה
                  נכונה, ומי שלא רוצה — לא מראה.
              - slide:
                  kicker: מי מסכים? · משפט 1
                  title: מפרסמים תמונות של אחרים גם ללא הסכמתם.
                  verbatim: true
                  echo: true
                  cue: אחרי ההסבר —
                  alt: מצלמה, ודמות עומדת מולה
                  art:
                    - {use: camera, x: 320, y: 170, w: 270}
                    - {use: kid-stand, x: 90, y: 190, w: 140, color: purple}
              - slide:
                  kicker: מי מסכים? · משפט 2
                  title: בזמן מפגש חברתי אנחנו שמים את הטלפון בצד
                  sub: ומקדישים זמן לאדם איתו נפגשנו.
                  verbatim: true
                  echo: true
                  cue: המשפט הבא —
                  alt: שתי דמויות יד ביד, וטלפון מונח בצד
                  art:
                    - {use: pair, x: 230, y: 170, w: 290}
                    - {use: phone, x: 70, y: 330, w: 96}
              - slide:
                  kicker: מי מסכים? · משפט 3
                  title: אם מישהו מעליב אותי ברשת, אני מיד מגיב.
                  verbatim: true
                  echo: true
                  cue: המשפט הבא —
                  alt: טלפון עם התראה, ובועת דיבור עם סימן קריאה
                  art:
                    - {use: phone-notify, x: 330, y: 150, w: 250}
                    - {use: speech, x: 70, y: 50, w: 230}
                    - text: '!'
                      x: 170
                      y: 122
                      size: 96
              - slide:
                  kicker: מי מסכים? · משפט 4
                  title: נפגשים פנים אל פנים רק עם אנשים שמכירים.
                  verbatim: true
                  echo: true
                  cue: המשפט האחרון —
                  alt: שני חברים יד ביד, וטלפון עם התראה לידם
                  art:
                    - {use: pair, x: 250, y: 180, w: 290}
                    - {use: phone-notify, x: 60, y: 120, w: 150}
              - ask: היו משפטים שהתלבטתם לגביהם? על פי מה בחרתם — איזה כלל הנחה אתכם?
          - title: משפחה בהסעה
            text: צופים בקטע קצר מתוך ״משפחה בהסעה״ (כאן 11), ובזוגות חושבים מה מנחה אותנו כשאנחנו ברשת.
            when: יש מחשב ומקרן בכיתה, ורוצים פתיחה עם סרטון.
            practices:
              - מה הקשר?
              - Think–Pair–Share
            spotlights:
              - עניין ורלוונטיות
              - שיתופיות בלמידה
            body:
              - moves:
                  - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש תשובות קצרות.
                  - הפעילי את הקטע, ועצרי בנקודת העצירה לשאלה.
                  - אחרי הצפייה — שאלה אחת בזוגות, ואז שלושה–ארבעה זוגות במליאה.
              - video:
                  title: משפחה בהסעה — פרק 2, הרשת החברתית
                  url: https://www.youtube.com/watch?v=zIKwV5iVVio
                  length: "27:31"
                  clip:
                    start: "1:25"
                    end: "2:10"
                  before: מה הרשת מאפשרת לכם?
                  watch: שימו לב אילו עניינים שקשורים לרשת עולים בקטע — ואילו הזדמנויות.
                  pauses:
                    - at: "?"
                      moment: >-
                        בתוך הקטע, הרגע הראשון שבו עולה עניין שקשור לרשת. צפי בקטע לפני השיעור, ורשמי כאן את הזמן.
                      ask: מה לדעתכם יקרה עכשיו? מילה או שתיים, בלחישה לשכן.
                  alt: שלוש דמויות יחד, ומעליהן בועות צ׳אט
                  art:
                    - {use: group3, x: 130, y: 255, w: 350}
                    - {use: chat, x: 360, y: 30, w: 220}
              - slide:
                  kicker: חושבים · בזוגות · משתפים
                  title: מה מנחה אתכם בעת התנהלות ברשת?
                  echo: true
                  points:
                    - לבד — 30 שניות
                    - בזוגות — דקה
                    - במליאה
                  cue: אחרי הצפייה —
                  alt: שתי דמויות יושבות זו מול זו ומדברות
                  art:
                    - {use: kid-sit, x: 120, y: 220, w: 180, color: purple}
                    - {use: kid-sit, x: 320, y: 220, w: 180, color: orange, flip: true}
              - ladder:
                  help: חשבו על הפעם האחרונה שפרסמתם או שיתפתם משהו — מה גרם לכם להחליט?
                  challenge: אילו גבולות אתם מציבים לעצמכם ברשת — ומי קבע אותם?
              - ask: מה מנחה אתכם ברשת — ואילו גבולות אתם מציבים לעצמכם?
      - say: >-
          עלתה כאן שאלה חשובה — מה מנחה אותנו ברשת. האם חשוב שיהיו כללים להתנהלות שלנו ברשת? בואו נבדוק קודם
          מה בני נוער עושים באמת — ולמה.

  # ------------------------------------------------------------------ 7′–15′
  - id: cards
    title: גם אנחנו גולשים לשינוי
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      בקבוצות, כרטיסיה לכל קבוצה — באיזו אפשרות רוב בני הנוער נוהגים, ולמה; במליאה כל קבוצה אומרת בחירה
      וסיבה
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הכרטיסיות; ההוראה נשארת על המסך כל הזמן.
          - חלקי כרטיסיה אחת לכל קבוצה.
          - הסתובבי בין הקבוצות, וודאי שכל אחד אומר את דעתו לפני ההחלטה. דקה לפני הסוף — הודיעי.
          - >-
            במליאה — נציג מכל קבוצה: מה בכרטיסיה, מה בחרו, וסיבה אחת. רשמי את הסיבות על הלוח, במילה או
            שתיים — מהן יוצא השלב הבא.
      - slide:
          kicker: גם אנחנו גולשים לשינוי · בקבוצות
          title: מה רוב בני הנוער עושים — ולמה?
          sub: בחרו אפשרות אחת, וכתבו מאחורי הכרטיסיה את הסיבות.
          timer: 240
          echo: true
          alt: שלט הכוונה עם שלושה כיוונים, ושלוש דמויות לידו
          art:
            - {use: signpost, x: 320, y: 30, w: 250}
            - {use: group3, x: 40, y: 270, w: 300}
      - say: >-
          לפניכם כרטיסיות שמתארות התנהלות של בני נוער ברשת. דונו בקבוצה — כל אחד אומר מה הוא חושב — ובחרו
          באפשרות שרוב בני הנוער נוהגים לפיה, לדעתכם.
      - task:
          what: >-
            קוראים את הכרטיסיה. כל אחד אומר איזו אפשרות נכונה לדעתו לרוב בני הנוער, ואז הקבוצה בוחרת אחת וכותבת
            מאחורי הכרטיסיה את הסיבות והמניעים. עולה אפשרות אחרת? כותבים אותה כאפשרות 3.
          time: 4 דקות
          group: קבוצות של 4–5 לפי השולחנות; כרטיסיה אחת לכל קבוצה
          rules: כל אחד אומר את דעתו לפני ההחלטה; מדברים על ״בני נוער״, בלי שמות מהכיתה; כותב אחד לקבוצה
          plenary: נציג מכל קבוצה — מה בחרו, וסיבה אחת (חצי דקה לקבוצה)
          help: חשבו על בני נוער שאתם מכירים — מה ראיתם אותם עושים בפעם האחרונה?
          challenge: האם הסיבה של רוב בני הנוער היא גם סיבה טובה? מה הייתם רוצים שיהיה הכלל?
      - handout:
          title: כרטיסיות לדיון — מה רוב בני הנוער עושים?
          copies: עותק אחד, גזור לכרטיסיות — כרטיסיה לכל קבוצה (בחרי לפי הכיתה)
          verbatim: true
          lines: false
          items:
            - |-
              אפשרות 1: ברוב המקרים בני נוער חושבים לפני שהם מגיבים, מעלים ומשתפים בתכנים ברשת.
              אפשרות 2: במקרים רבים בני נוער מפרסמים תכנים ברשת בלי לחשוב יותר מדי.
            - |-
              אפשרות 1: במפגש עם משפחה/חברים, בני נוער שמים את הנייד בצד ומדברים אחד עם השני פנים אל פנים.
              אפשרות 2: במפגש עם משפחה/חברים לא פעם קורה שכל אחד שקוע במסך שלו.
            - |-
              אפשרות 1: חבר = לייק! לכל פוסט שחבר/ה מעלים, בני נוער עושים לייק.
              אפשרות 2: חבר = לייק? בני נוער בוחרים לעשות לייק לפוסט של חבר/ה לפי התוכן שפורסם.
            - |-
              אפשרות 1: בני נוער משתדלים לא לשתף פוסט/הודעה בהם מפיצים שמועה.
              אפשרות 2: בני נוער משתפים במידע מבלי לבדוק את תוכן המידע ואמינותו לעומק.
            - |-
              אפשרות 1: צילמנו־פרסמנו!
              אפשרות 2: צילמנו־פרסמנו?
            - |-
              אפשרות 1: יש מקרים שבהם בני נוער פונים להתייעץ עם מבוגרים לגבי דברים שקורים ברשת.
              אפשרות 2: בדרך כלל בני נוער בוחרים שלא להתייעץ עם מבוגרים לגבי דברים שקורים ברשת.
            - |-
              אפשרות 1: הרשת מאפשרת לבני נוער ליצור קשרי חברות ולהכיר אנשים חדשים.
              אפשרות 2: לרוב, בני נוער נמנעים מליצור קשר עם אנשים שהם לא מכירים ברשת.
            - |-
              אפשרות 1: כל התכנים שבני נוער מפרסמים ברשת מייצגים את המציאות שלהם כמו שהיא.
              אפשרות 2: חלק מהתכנים שבני נוער מציגים ברשת הם הצדדים המוצלחים והנבחרים של המציאות שלהם.
            - |-
              אפשרות 1: בני נוער מצטרפים לקבוצות ווטסאפ דרך קישורים שחברים שולחים להם.
              אפשרות 2: בני נוער נמנעים מלהצטרף לקבוצת ווטסאפ דרך קישורים שחברים שולחים להם.
            - |-
              אפשרות 1: בני נוער מפרסמים מדבקות ותמונות בעלות אופי מיני.
              אפשרות 2: בני נוער מודעים להשלכות החוקיות שיש לשיתוף והפצה של תמונה בעלת אופי מיני לאחרים.
            - |-
              אפשרות 1: בני נוער מקפידים להגדיר את הפרופיל שלהם ברשת החברתית כפרטי.
              אפשרות 2: בני נוער מעדיפים שהפרופיל שלהם ברשת החברתית יהיה ציבורי כדי לצבור לייקים ועוקבים.
      - ask: מה בחרתם — ולמה, לדעתכם, בני נוער מתנהלים כך?
      - say: שמענו הרבה סיבות. בואו נראה מה עומד מאחוריהן — מה בעצם מנחה אותנו ברשת.

