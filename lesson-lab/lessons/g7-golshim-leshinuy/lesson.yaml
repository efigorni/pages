      קבוצות

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: קצב במחיאות
      text: את מוחאת תבנית קצרה, והכיתה חוזרת אחריה. בכל סבב התבנית ארוכה יותר.
    - name: רגל אחת
      text: עומדים על רגל אחת עשר שניות ומחליפים רגל. בסבב השני — בעיניים עצומות.
    - name: נשימת בלון
      text: שואפים לאט וממלאים את הבטן כמו בלון, ונושפים לאט בפה. חמש פעמים.
  from: conflict

