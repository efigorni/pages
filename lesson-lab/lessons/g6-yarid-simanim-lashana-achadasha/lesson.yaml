steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: מלקטים מילים
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: תפזורת על השולחנות כשנכנסים — שלוש מילים ראשונות, כמה שיותר תכונות, ושלוש שמתאימות לי
    body:
      - slide:
          kicker: קדימה ללמידה · תפזורת
          title: אילו תכונות מסתתרות כאן?
          sub: שלושה שלבים — ההוראות על הדף שלפניכם.
          timer: 120
          echo: true
          alt: תפזורת של תשע שורות ותשעה טורים של אותיות
          art: {file: art/wordsearch.svg}
      - moves:
          - הדף והשקף מחכים לפני שהכיתה נכנסת, ומתחילים בלי הסבר — ההוראות כתובות בראש הדף.
          - בזמן העבודה — נוכחות. כשכולם בפנים, הפעילי את הטיימר של שלב ב׳ — שתי דקות.
          - הסתובבי בין השולחנות. מי שלא מוצא אף מילה — הראי לו שורה אחת.
          - >-
            שמעי שלוש–ארבע תשובות, ואמרי שהדף נשאר אצלם — את המילים שהקיפו לוקחים לדוכן הרימונים.
      - say: שלושה שלבים, לבד ובשקט. בשלב השלישי אין תשובה נכונה — רק מילים שמתאימות לכם.
      - ladder:
          help: חפשו קודם בשורות לרוחב, מימין לשמאל — ארבע תכונות מסתתרות שם.
          challenge: ליד מילה אחת שהקפתם, כתבו רגע שבו היא באה לידי ביטוי אצלכם.
      - tip: >-
          המילים שבתפזורת, לפי הערות המקור: גמישות, פירגון, שאפתנות, אדיבות, יוזמה, סבלנות, חריצות, איפוק,
          פתיחות. ״פירגון״ כתובה מלמטה למעלה, בלי יו״ד. מי שמתקשה — גלי לו שתיים מהן.
      - handout:
          title: מלקטים מילים — שלושת השלבים
          copies: עותק לכל תלמיד, על השולחנות לפני שהכיתה נכנסת — בראש הדף, מעל התפזורת
          verbatim: true
          lines: false
          items:
            - >-
              שלב א' - מהן 3 המילים הראשונות ש"קפצו" לעיניכם? רשמו אותן.
            - >-
              שלב ב'- לרשותכם שתי דקות, נסו לזהות כמה שיותר מילים שמבטאות תכונות או כישורים בזמן קצוב זה,
              רשמו את המילים שזיהיתם.
            - >-
              שלב ג' - סמנו בעיגול לפחות שלוש מילים המתאימות לכם/ מאפיינות אתכם מתוך המילים שמצאתם (בסעיפים
              1-2). באפשרותכם להתבונן פעם נוספת בתפזורת וללקט מילים חלופיות שמאפיינות אתכם ושאתם מודים עליהן.
      - handout:
          title: מלקטים מילים — התפזורת
          copies: >-
            על אותו דף, מתחת לשלבים, באות גדולה — כל שורה נקראת מימין לשמאל. אפשר להדפיס אותה גם מהמצגת
            המקורית
          verbatim: true
          text: |-
            ג ר י ו ז מ ה כ א
            מ א ש א ל ס מ ח ו
            י ט א ד י ב ו ת ח
            ש ן פ ב ש ל ה ג ר
            ו ו ת ח ג נ א ע י
            ת ג נ ש ל ו ה ל צ
            ב ר ו נ צ ת נ ה ו
            צ פ ת י ח ו ת ז ת
            ק כ ל א י פ ו ק א
      - ask: אילו תכונות מצאתם? ומי מוכן לומר מילה אחת שהקיף — ולמה היא מתאימה לו?

  # ------------------------------------------------------------------ 5′–9′
  - id: booths
    title: ברוכים הבאים ליריד
    minutes: 4
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: הסימנים שעל שולחן החג, ושלושת הדוכנים — מה עושים בכל אחד, ואיך עוברים ביניהם
    body:
      - slide:
          kicker: יריד הסימנים
          title: ברוכים הבאים ליריד הסימנים
          sub: אילו סימנים יש על שולחן החג שלכם — ומה הם מאחלים?
          verbatim:
            - title
          echo: true
          alt: תפוח וצנצנת דבש, ורימון לידם
          art:
            - {use: apple-honey, x: 220, y: 110, w: 380}
            - {use: pomegranate, x: 24, y: 270, w: 220}
      - ask: אילו סימנים יש על שולחן החג שלכם — ומה כל סימן מאחל?
      - moves:
          - >-
            שמעי שלוש תשובות קצרות. אם לא עולה — הזכירי שתיים: ״שירבו זכויותינו כרימון״, ״שתחדש עלינו שנה
            טובה ומתוקה״. היום כל סימן יהיה דוכן.
          - הציגי את שלושת הדוכנים, שקף לכל דוכן — מה עושים בו, ומה לוקחים ממנו.
          - >-
            הסבירי את הסבב — שש קבוצות, שש עמדות, ארבע דקות בכל עמדה; בצלצול עוברים לעמדה הבאה, עם כיוון
            השעון. בדקי הבנה בשאלה אחת (״מה עושים בדוכן השופרות?״), ורק אז מחלקים לקבוצות.
      - slide:
          kicker: דוכן 1
          title: רימונים – אוספים זכויות
          sub: כל אחד כותב ברימון שלו שלוש תכונות שלו — והחברים ממלאים עוד.
          verbatim:
            - title
          echo: true
          cue: אחרי הסימנים שעל השולחן —
          alt: רימון גדול, ועיפרון לידו
          art:
            - {use: pomegranate, x: 230, y: 90, w: 320}
            - {use: pencil, x: 40, y: 300, w: 180}
      - slide:
          kicker: דוכן 2
          title: תפוח בדבש – ממתיקים חברויות
          sub: רעיון אחד בכל פתק, ומדביקים על הפלקט — איך ממתיקים את השנה בכיתה?
          verbatim:
            - title
          echo: true
          cue: הדוכן הבא —
          alt: תפוח וצנצנת דבש, ושני פתקים לידם
          art:
            - {use: apple-honey, x: 240, y: 170, w: 340}
            - {use: sticky, x: 40, y: 60, w: 140}
            - {use: sticky, x: 60, y: 290, w: 140, color: teal}
      - slide:
          kicker: דוכן 3
          title: שופרות – משפרים עולמות
          sub: באיזה תחום תרצו להשתפר השנה — ומה יעזור לכם להגיע לשם?
          verbatim:
            - title
          echo: true
          cue: הדוכן האחרון —
          alt: שופר — הקצה הצר מימין והרחב משמאל — וכוכב ליד הקצה הרחב
          art: {file: art/shofar.svg}
      - say: בכל דוכן ארבע דקות. בצלצול — כל הקבוצה עוברת יחד לעמדה הבאה.

  # ------------------------------------------------------------------ 9′–22′
  - id: fair
    title: יריד הסימנים
    minutes: 13
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      שש קבוצות עוברות בין שלושה דוכנים, ארבע דקות בכל אחד — ממלאים רימונים, ממתיקים חברויות על פתקים
      וכותבים שופר אישי
    body:
      - slide:
          kicker: יריד הסימנים · סבב
          title: ארבע דקות בכל דוכן
          sub: בצלצול — עוברים יחד לעמדה הבאה, עם כיוון השעון.
          timer: 240
          echo: true
          alt: רימון, שופר ותפוח בדבש על מעגל מנוקד, וחיצים ביניהם
          art: {file: art/rotation.svg}
      - task:
          what: >-
            כל קבוצה עוברת בין שלושת הדוכנים, ובכל דוכן עושה את מה שכתוב בכרטיס שעל העמדה — רימונים, תפוח בדבש
            ושופרות.
          time: ארבע דקות בכל דוכן — שלושה סבבים
          group: שש קבוצות של 5–6, לפי החלוקה; הקבוצה עוברת יחד
          rules: >-
            ברימונים — כותבים רק תכונה טובה שבאמת ראיתם אצל החבר, וכל רימון עובר שלוש פעמים ימינה; בשופרות —
            מספרים רק על עצמנו; קבוצה שסיימה לפני הצלצול קוראת את הפתקים שעל הפלקט
          plenary: אין הצגה — הרימונים והשופרות נשארים אצל כל אחד, והפתקים על הפלקטים
          help: בדוכן הרימונים — היעזרו בבנק התכונות שעל העמדה.
          challenge: בדוכן השופרות — כתבו גם איך תדעו, בעוד חודש, שהתקדמתם.
      - say: כל קבוצה לעמדה שלה, ומתחילים. הרימון והשופר שלכם עוברים איתכם מדוכן לדוכן.
      - moves:
          - הפעילי את הטיימר. בסבב הראשון — עברי בין העמדות, ובדקי שכל קבוצה התחילה.
          - >-
            בעמדות הרימונים — הציצי בגרגרים. תכונה שלא נכתבה בטוב — מוחקים בשקט, והכותב מוסיף תכונה אחרת.
          - >-
            בעמדות השופרות — הזכירי את מבנה השופר: הקצה הצר הוא איפה שאני היום, והקצה הרחב — לאן ארצה להגיע.
          - דקה לפני הצלצול — הודיעי. אחרי הסבב השלישי חוזרים למקומות, עם הרימון ועם השופר.
      - tip: >-
          בעמדות התפוח בדבש, למי שנתקע — דוגמאות מהערות המקור: לתת מחמאות, לעזור לחברים בכיתה, לשתף חברים
          בהפסקות ובפעילויות, לשמור על כללי שיח מכבדים, להשתמש בהומור שעוזר להתמודד.
      - handout:
          title: כרטיסי הדוכנים
          copies: שני עותקים, באות גדולה — כרטיס לכל עמדה
          verbatim: true
          lines: false
          items:
            - >-
              מתמלאים (בזכויות) כרימון — רשמו 3 מהתכונות המאפיינות אתכם מתוך תרגיל הפתיחה. העבירו בינכם את
              הרימונים ומלאו את הרימונים של חברים/ות, בכל גרעין ריק, כתבו תכונה שמאפיינת אותו
            - >-
              ממתיקים חברויות — מה אני יכול/ה לעשות בכדי להמתיק את השנה בכיתה שלנו ובכלל
            - >-
              משפרים עולמות — חשבו וכתבו באיזה תחום הייתם רוצים להשתפר, רשמו אותו על גבי שופר, שתפו בקבוצה,
              העזרו בחברים/ות לחשיבה על דרכי-הפעולה להשגת המטרה
      - handout:
          title: אוספים זכויות — רימון לכל תלמיד
          copies: >-
            עותק לכל תלמיד, בעמדות הרימונים — דף הרימונים מוכן להדפסה במצגת המקורית (שני רימונים בעמוד)
          text: >-
            רימון גדול ובו גרגרים. למעלה ״שמי״. בשלושה גרגרים כתוב ״אני…״ — לשלוש התכונות שהקפתי בתפזורת.
            בגרגרים הריקים — תכונות שהחברים כותבים לי.
      - handout:
          title: השופר שלי השנה — שופר לכל תלמיד
          copies: >-
            עותק לכל תלמיד, בעמדות השופרות — דף השופרות מוכן להדפסה במצגת המקורית (שני שופרות בעמוד). השאלה
            בקצה הרחב של השופר, והמשפט בקצה הצר
          verbatim: true
          items:
            - מה ארצה לשפר ו/או לשנות?
            - זה מתחיל בצעד
      - handout:
          title: בנק התכונות
          copies: שני עותקים — אחד לכל עמדת רימונים
          text: >-
            חברות · חכמה · נתינה · התמדה · רגישות · סדר וארגון · סקרנות · כנות · חוש הומור · מוטיבציה · יצירתיות ·
            גמישות · אחריות · שמחה · הודיה, הכרת הטוב · אופטימיות · אכפתיות · אומץ · צניעות, ענווה · יוזמה ·
            התחשבות · פירגון · ספורטיביות · חריצות · שאפתנות · נועם הליכות · סבלנות · אמונה · מנהיגות · כוח רצון ·
            זריזות · עזרה לזולת · אדיבות · תקווה · חוסן · פתיחות · שלווה · תושייה · מקוריות · דבקות במטרה · מודעות
            עצמית · איפוק — ואפשר גם תכונה טובה שלא ברשימה.
      - say: חוזרים למקומות, עם הרימון ועם השופר. בואו נראה מה אספנו מהיריד.

  # ------------------------------------------------------------------ 22′–27′
  - id: collect
    title: מה אספנו מהיריד?
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: >-
      לבד, בזוגות ובמליאה — מה אספנו מהיריד לקראת השנה החדשה; וסוגרים את היריד בשיר ״סימנים לשנה החדשה״
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה אספנו מהיריד לקראת השנה החדשה?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          verbatim:
            - title
          echo: true
          alt: זוג יד ביד, ומעליו בועת דיבור ובתוכה רימון
          art:
            - {use: pair, x: 60, y: 236, w: 264}
            - {use: speech, x: 290, y: 30, w: 300}
            - {use: pomegranate, x: 382, y: 58, w: 116}
      - moves:
          - שאלי, וחכי 20 שניות של שקט.
          - דקה בזוגות, עם השכן — כל אחד מראה לשני את הרימון שלו, ומספר מה אסף בדוכנים.
          - שמעי שלושה–ארבעה זוגות. הדהדי כל תשובה, והזמיני עוד קולות.
          - סגרי את היריד בשיר — הציגי אותו מהמצגת המקורית, והקריאי אותו לאט, בלי לשאול עליו שאלות.
      - ask: מה אספנו מהיריד לקראת השנה החדשה?
      - ladder:
          help: הסתכלו ברימון שלכם — איזו תכונה שכתבו לכם הפתיעה אתכם?
          challenge: איזה מהדוכנים יעזור לכם הכי הרבה השנה — ולמה דווקא הוא?
      - say: אז מה שאספת זה ___ — הבנתי נכון? מי עוד אסף משהו דומה?
      - source_slide:
          slides: 17
          why: >-
            השיר ״סימנים לשנה החדשה״ של אוריאל בלמס — חמישה ״סימנים״ לדרך: למתיקות, להצלחה, לאהבה, למיוחדות
            ולמחשבה. השיר מוגן בזכויות יוצרים, ולכן מקריאים אותו מהמצגת המקורית.

