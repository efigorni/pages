# "יריד סימנים לשנה החדשה" — כיתה ו׳, ראש השנה (מקור: sources/text/6/Yarid_Simanim_Lashana_Achadasha.md; נכתב לשכבות ה׳–ו׳)
slug: g6-yarid-simanim-lashana-achadasha
title: '"יריד סימנים לשנה החדשה"'
grade: 6
grades_served: [6]
month: ספטמבר
section: בזיקה ללוח השנה – שיעורי הכ"חות שבדרך למועדים מיוחדים
unit: ראש השנה
unit_order: 1
unit_size: 1
src_text: sources/text/6/Yarid_Simanim_Lashana_Achadasha.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/5Grade/Mamlachti/Yarid_Simanim_Lashana_Achadasha.pptx
sensitivity: low-med

sub: >-
  על שולחן החג יש סימנים לשנה טובה. בשיעור הזה מלקטים תכונות טובות, עוברים בין דוכני יריד — רימונים, תפוח
  בדבש ושופרות — וכל אחד בוחר סימן שייקח איתו לשנה החדשה.
format: תפזורת, יריד בקבוצות ומליאה
question: אילו סימנים ניקח איתנו לשנה החדשה — מה טוב בנו, ומה נרצה לשפר?
takeaways:
  - יש בכל אחד מאיתנו תכונות טובות, וחברים יכולים לעזור לנו לראות אותן.
  - כל אחד מאיתנו יכול להמתיק את השנה בכיתה — במעשים קטנים.
  - שינוי מתחיל בצעד אחד — מהמקום שבו אני היום, אל המקום שאליו ארצה להגיע.
prep:
  - >-
    שש עמדות לדוכנים, במעגל סביב הכיתה — רימונים, תפוח בדבש, שופרות, ושוב רימונים, תפוח בדבש, שופרות. בכל
    עמדה הכרטיס שלה, ובעמדות הרימונים גם בנק התכונות
  - חלוקה מראש לשש קבוצות, ובאיזו עמדה כל קבוצה מתחילה
  - אם אפשר — איש צוות נוסף ביריד, שיסתובב בין העמדות (המקור ממליץ על כך)
  - דפי ממו (פתקים) ופלקט ״ממתיקים חברויות״ לכל אחת משתי עמדות התפוח בדבש
  - פלקט ״מפזרים משאלות״ וטושים (להרחבה ״מפזרים משאלות״)
  - פתקים וקופסה סגורה (להרחבה ״מסלקים הרגלים״)

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״מפזרים משאלות״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - fair
      - collect
    text: >-
      ביריד — שלוש דקות בכל דוכן במקום ארבע, וב״מה אספנו מהיריד?״ מוותרים על הזוגות — שאלה אחת במליאה

brain_break:
  signs: התרגשות שלא נרגעת אחרי היריד, או להפך — ראשים על השולחן ותשובות של מילה אחת.
  ideas:
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
    - name: אף ואוזן
      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: ספירה עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר את המספר הבא, בלי סדר ובלי סימנים. שניים מדברים
        יחד? מתחילים מאחת.
  from: wishes

