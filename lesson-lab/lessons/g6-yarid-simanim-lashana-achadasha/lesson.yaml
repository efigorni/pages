      כל אחד כותב לעצמו הרגל אחד שהיה רוצה להפחית; מי שרוצה — מספר לשכן ושומע הצעה; הפתקים נכנסים לקופסה
      סגורה
    body:
      - slide:
          kicker: אם נשאר זמן · דוכן הסלק
          title: מסלקים הרגלים
          sub: הרגל, מחשבה או תכונה שלכם — שהייתם רוצים להפחית השנה.
          verbatim:
            - title
          timer: 180
          echo: true
          alt: סלק עם עלים, ומנעול לידו
          art: {file: art/beet.svg}
      - moves:
          - ספרי שהדוכן הזה נולד מהברכה ״שיסתלקו אויבינו״ — וכאן כל אחד מסלק הרגל שלו, לא אדם אחר.
          - כל אחד כותב על פתק, בלי שם, דבר אחד שהיה רוצה להפחית, לשנות או ״לסלק״.
          - מי שרוצה — מספר לשכן, והשכן מציע דרך אחת להתמודד. מותר לא לספר.
          - הפתקים מקופלים ונכנסים לקופסה סגורה. אף אחד לא קורא אותם — גם לא את.
      - say: כותבים רק על עצמנו, ואף אחד לא יקרא את הפתק. מי שרוצה — יספר לשכן; מי שלא — שומר לעצמו.
      - task:
          what: >-
            כל אחד כותב לעצמו על פתק הרגל, מחשבה או תכונה שהיה רוצה להפחית השנה; מי שרוצה מספר לשכן, והשכן
            מציע דרך אחת לשינוי.
          time: 3 דקות
          group: לבד, ואז בזוגות — רק מי שרוצה
          rules: מספרים רק על עצמנו, לא על אחרים; מותר לא לספר; הפתקים מקופלים ונכנסים לקופסה סגורה
          plenary: אין — הקופסה נסגרת, והפתקים לא נקראים
          help: חשבו על רגע ביום שבו הייתם רוצים להגיב אחרת.
          challenge: כתבו גם מה תעשו במקום ההרגל הזה.
      - ask: מי רוצה לשתף דרך טובה שהציע לו השכן — בלי לספר על איזה הרגל?

