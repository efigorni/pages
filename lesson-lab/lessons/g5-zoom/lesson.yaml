title: זום
grade: 5
grades_served:
- 5
slide_kickers: false
month: פברואר
section: תהליכי למידה (פברואר)
unit: חוסן - ויסות דרך הקוגניציה
src_text: sources/text/5/Zoom.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/5Grade/Mamlachti/Zoom.pptx
sensitivity: med
sub: יוצרים ענן מחשבה, מקרבים ומרחיקים אותו, ומגלים שהקושי יכול להיות חלק מהתמונה בלי למלא את כולה.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך מרחיבים את תשומת הלב כשמחשבה מטרידה תופסת הכול?
takeaways:
- כאשר אנחנו ממוקדים בהרגשה לא נעימה או בבעיה שלא ניתן לפתור אותה כרגע, זה מפריע לנו לעשות דברים אחרים,
  שמעניינים אותנו או שחשובים לנו.
- הרחבת הקשב אינה ביטול הבעיה; חוזרים אליה כשאפשר לקדם אותה.
prep:
- דפי רקע וענני מחשבה מנייר, אחד לכל תלמיד
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: magnifier
    x: 180
    y: 120
    w: 250
  alt: זכוכית מגדלת
steps:
- id: part-1
  title: חלק או הכול?
  minutes: 5
  practices:
  - מה הקשר?
  - זמן חשיבה
  spotlights:
  - עניין ורלוונטיות
  summary: חלק או הכול? — מה רואים כשדף קטן קרוב לעיניים?
  body:
  - slide:
      title: מה רואים כשדף קטן קרוב לעיניים?
      art:
      - use: magnifier
        x: 180
        y: 120
        w: 250
      alt: זכוכית מגדלת
      echo: true
  - moves:
    - הדגימי עם דף ריק במרחק נוח מהפנים ואז הרחיקי אותו.
    - בקשי מהכיתה לתאר מה נוסף לשדה הראייה.
    - אמרי במפורש שזה ניסוי בתשומת לב, לא הודעה על אירוע אמיתי.
  - ask: מה רואים כשדף קטן קרוב לעיניים?
  - ladder:
      help: מה אפשר לראות בצדי הדף כשהוא רחוק?
      challenge: האם הדף נעלם כשמבחינים גם בחדר?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: מחשבה אינה נעלמת בפקודה
  minutes: 6
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מחשבה אינה נעלמת בפקודה — מה קורה כשמנסים לא לחשוב על לימון?
  body:
  - slide:
      title: מה קורה כשמנסים לא לחשוב על לימון?
      art:
      - use: thought
        x: 180
        y: 120
        w: 250
      alt: ענן מחשבה
      echo: true
      sub: ''
  - moves:
    - בקשי לחשוב עשר שניות על לימון, ואחר כך לנסות לא לחשוב עליו.
    - הזמיני שתי תגובות, גם ממי שלא התקשה.
    - 'קשרי למחשבה מטרידה: אין צורך להילחם בה.'
    - כל זוג מנסח הבדל בין מחיקת המחשבה לבין בחירת מוקד נוסף.
  - ask: מה קורה כשמנסים לא לחשוב על לימון?
  - task:
      what: השוו בין ניסיון למחוק מחשבה לבין הפניית תשומת הלב למשהו נוסף. כתבו דוגמה אחת לכל דרך.
      time: 3 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: האם אפשר לשים לב לצליל בחדר גם כשזוכרים את הלימון?
      challenge: למה הניסיון לסלק מחשבה עלול להחזיר את תשומת הלב אליה?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: ענן מחשבות מנייר
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: ענן מחשבות מנייר — אילו דברים נוספים חשובים לי עכשיו?
  body:
  - slide:
      title: אילו דברים נוספים חשובים לי עכשיו?
      art:
      - use: thought
        x: 180
        y: 120
        w: 250
      alt: ענן מחשבה
      echo: true
      sub: ''
  - moves:
    - חלקי ענן מנייר ודף רקע.
    - אפשר לבחור דאגה קטנה של דמות דמיונית, למשל מבחן בשבוע הבא.
    - כתבו אותה בענן, קרבו והרחקו בעדינות.
    - 'על הרקע הוסיפו שלושה עננים: דבר חשוב, אדם תומך ופעולה שאפשר לעשות.'
    - הניחו את הענן הראשון ביניהם; אין צורך לשתף את תוכנו.
  - ask: אילו דברים נוספים חשובים לי עכשיו?
  - task:
      what: כתבו דאגה קטנה או דמיונית בענן. קרבו והרחיקו אותו, והוסיפו ברקע שלושה דברים נוספים שחשובים
        עכשיו.
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: לבד; שיחה על דרך העבודה בלבד היא רשות
      rules: הדף נשאר אישי ולא מחליפים עננים. אפשר לבחור דאגה של דמות דמיונית.
      plenary: שני מתנדבים מתארים מה עזר להרחיב מבט, בלי לקרוא את הדאגה שכתבו.
      help: אפשר להוסיף אוכל, משחק, חבר או משימה שחשובים היום.
      challenge: איך משאירים לקושי מקום בלי לתת לו לתפוס את כל הדף?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: מיקוד או הרחבה?
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מיקוד או הרחבה? — מתי כדאי לפעול על הבעיה ומתי להרחיב מבט?
  body:
  - slide:
      title: מתי כדאי לפעול על הבעיה ומתי להרחיב מבט?
      art:
      - use: arrows-fork
        x: 180
        y: 120
        w: 250
      alt: שלושה כיוונים
      echo: true
      sub: ''
  - moves:
    - 'הציגי שני מצבים: חסר כלי כתיבה עכשיו; מודאגים ממבחן בשבוע הבא באמצע הארוחה.'
    - כל זוג בוחר פעולה אפשרית בכל מצב ומסביר מתי פונים לעזרה.
    - הזמיני שני זוגות להגיב זה לזה.
    - הבהירי שהרחבת הקשב אינה התעלמות מסכנה או מפגיעה.
  - ask: מתי כדאי לפעול על הבעיה ומתי להרחיב מבט?
  - task:
      what: השוו בין כלי כתיבה שחסר עכשיו לבין דאגה למבחן בשבוע הבא. כתבו בכל מצב פעולה אפשרית ומתי לבקש
        עזרה.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: איזו בעיה אפשר לקדם עכשיו בצעד קטן?
      challenge: איך נזכור לחזור לבעיה בזמן מתאים אחרי הרחבת המבט?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - כאשר אנחנו ממוקדים בהרגשה לא נעימה או בבעיה שלא ניתן לפתור אותה כרגע, זה מפריע לנו לעשות דברים
        אחרים, שמעניינים אותנו או שחשובים לנו.
      - כדאי לי להשתמש בכלי "זום" כשאני מרגיש שאני "תקוע" בהרגשה לא נעימה. זה יעזור לי להיזכר בדברים נוספים
        שחשובים לי ולחזור לחיים הרגילים.
      - 'חשוב לציין: גם אם נבחר להתמקד במשהו אחר, הבעיה שלנו עדיין תישאר ואולי תציק לנו מידי פעם. עם זאת,
        אם נוותר על ההתמקדות בה ועל הניסיון הלא יעיל לפתור אותה, נוכל רוב הזמן לפנות את תשומת הלב שלנו
        לדברים אחרים.'
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - כתבו דבר נוסף שדמות מודאגת יכולה להפנות אליו תשומת לב.
      - מתי חשוב להיעזר במבוגר ולא רק להרחיב את המבט?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: בוחרים קושי קל או דמיוני בלבד; פגיעה פעילה מחייבת עזרה ולא תרגיל התעלמות.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
