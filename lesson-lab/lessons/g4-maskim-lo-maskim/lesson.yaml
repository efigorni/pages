  body:
  - messages:
      items:
      - על מנת לקבל הסכמה, יש צורך לוודא שהרצון משותף ומוסכם על שני הצדדים ולא רק על צד אחד.
      - האם תרצה חיבוק? האם אני יכול להחזיק ביד שלך? ואם מישהו לא אומר "כן"- אז הם לא נתנו את ההסכמה שלהם.
      - אמירה של לא באופן ברור
      - אם אין תשובה, זה לא אומר שיש הסכמה
      - יש לוודא הסכמה
      - לשאול בשנית, אם התשובה לא הייתה ברורה דיה
      ask: איזה משפט עוזר לכם להבין את הנושא? חשבו בשקט, ואפשר לשתף מרצון.
      art: shield
