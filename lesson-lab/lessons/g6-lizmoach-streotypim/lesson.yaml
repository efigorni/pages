steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: sort
    title: של בנים, של בנות — או של שניהם?
    minutes: 7
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      כל אחד ממיין 16 תכונות — בנים, בנות או גם וגם; בזוגות מחפשים מחלוקת, ובמליאה רושמים את הפיזור, לא רק את הרוב
    body:
      - slide:
          kicker: מה הקשר? · לבד, ואז בזוגות
          title: של בנים, של בנות — או של שניהם?
          sub: ליד כל תכונה בדף כתבו ב, ת או ג״ו.
          timer: 180
          echo: true
          alt: שני עיגולים חופפים — בנים, בנות, ובאמצע גם וגם
          art: {file: art/venn.svg}
      - moves:
          - הדפים על השולחנות. שתי דקות לבד, ואז דקה בזוגות — כל זוג מוצא שתי תכונות שבהן לא הסכים.
          - >-
            במליאה הקריאי ארבע–חמש תכונות. על כל אחת — שלוש הצבעות בעיניים עצומות (בנים, בנות, גם וגם), ורשמי על
            הלוח את המספרים, לא רק את הרוב.
          - כשהכיתה חלוקה — אל תכריעי. שאלי ״למה?״, והמשיכי.
      - whisper: ״גנדרנות״ — הקפדה רבה על ההופעה, על הבגדים ועל המראה. הסבירי רק אם שואלים.
      - ladder:
          help: חשבו על אנשים שאתם מכירים — בנים ובנות — שיש להם את התכונה.
          challenge: מצאו תכונה ששמתם אצל ״בנים״ או אצל ״בנות״ — ומישהו מהצד השני שיש לו אותה.
      - handout:
          title: תכונות — ב, ת או ג״ו?
          copies: עותק לכל תלמיד, על השולחן — ליד כל תכונה כותבים ב (בנים), ת (בנות) או ג״ו (גם וגם)
          verbatim: true
          lines: false
          items:
            - גנדרנות
            - מנהיגות
            - כוחניות
            - יצירתיות
            - התנדבות
            - ספורטיביות
            - רצינות
            - חברותיות
            - תחרותיות
            - סיוע לזולת
            - רכילות
            - חוזק
            - שקדנות
            - חולשה
            - הצלחה
            - קנאות
      - ask: על איזו תכונה התווכחתם בזוג — ולמה?
      - say: >-
          תראו את המספרים על הלוח — על אותה תכונה ענינו תשובות שונות. אז מי בעצם מחליט מה ״של בנים״ ומה ״של
          בנות״?

  # ------------------------------------------------------------------ 7′–13′
  - id: really
    title: האמנם?
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: הצבעה מהירה על ארבעה תחביבים, ואז השאלות ההפוכות — מכירים גבר או אישה שיש להם את התכונה?
    body:
      - moves:
          - הציגי את התחביבים אחד־אחד. על כל אחד — הצבעה מהירה בעיניים עצומות, ורשמי את המספרים.
          - הצביעי על התכונות שנרשמו אצל ״בנות״ ושאלי מה מתאים גם לבנים — ולהפך.
          - בחרי תכונה אחת ששויכה לבנים או לבנות, ושאלי את השאלה ההפוכה. חכי עשר שניות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב — מי מסכים? מי חושב אחרת?
      - slide:
          kicker: ומה עם תחביבים?
          title: של בנים, של בנות — או של שניהם?
          points:
            - כדורגל
            - בישול
            - ריקוד
            - תכנות
          verbatim: [points]
          echo: true
          alt: שתי דמויות מרימות יד
          art:
            - {use: kid-hand, x: 120, y: 190, w: 160, color: teal}
            - {use: kid-hand, x: 330, y: 190, w: 160, color: orange}
      - whisper: >-
          הכיתה תחפש אצלך את ״התשובה הנכונה״. לעמדה שלך יש מקום, אבל בשלב הזה התפקיד שלך הוא לשאול.
      - ask: האם אתם מכירים גבר או אישה שיש להם את התכונה הזו?
      - ask: למה דווקא התכונה הזאת נחשבת ״נשית״ או ״גברית״, לדעתכם?
      - say: >-
          לקחת תכונה או תחביב ולשייך אותם לכל הבנים או לכל הבנות — לזה יש שם. בואו נראה.

  # ------------------------------------------------------------------ 13′–20′
  - id: video
    title: סטריאוטיפ מיני
    minutes: 7
    practices:
      - מה הקשר?
      - Think–Pair–Share
