              ask: מה הם יעשו עכשיו, לדעתכם?
          alt: שתי דמויות יד ביד, ובועת דיבור ובה סימן שאלה
          art:
            - {use: pair, x: 60, y: 230, w: 260}
            - {use: speech-l, x: 320, y: 40, w: 260}
            - text: '?'
              x: 460
              y: 128
              size: 110
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: אילו מחשבות או תחושות עורר בכם הסרטון?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי הצפייה —
          alt: דמות חושבת, ובענן המחשבה נורה דולקת
          art:
            - {use: thought, x: 60, y: 30, w: 300}
            - {use: bulb, x: 166, y: 76, w: 90}
            - {use: kid-stand, x: 390, y: 226, w: 140, color: teal}
