  # ------------------------------------------------------------------ 20′–25′
  - id: message
    title: המסר שקיבלנו
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
    summary: מה המסר שקיבלנו לאורך השנים על בנים ובנות, למה קיימים סטריאוטיפים — ומה עוזר להיפרד מהם
    body:
      - slide:
          kicker: רגע לחשוב
          title: מה המסר שקיבלתם לאורך השנים?
          sub: על ההבדל בין בנים לבנות — ומאיפה הוא הגיע?
          echo: true
          alt: קבוצה גדולה, וחץ ממנה אל דמות אחת
          art:
            - {use: crowd, x: 296, y: 252, w: 300}
            - {use: arrow, x: 150, y: 290, w: 150, color: gray}
            - {use: kid-stand, x: 30, y: 190, w: 125, color: orange}
      - moves:
          - שאלי, וחכי עשר שניות.
          - הדהדי, ושאלי מאיפה המסר הגיע — מהבית, מהחברים, מפרסומות, מחנויות הצעצועים.
          - הקריאי את ההסבר מהמקור, ושאלי את השאלה השנייה.
      - ask: מה המסר שקיבלתם לאורך השנים בקשר להבדל בין בנים ובנות?
      - quote:
          title: למה יש סטריאוטיפים — מהמקור, להקריא
          text: >-
            "סטריאוטיפים" הם תבניות חשיבה המסייעות לנו להכניס לתבנית גירויים דומים כדי שהמוח שלנו יוכל לחסוך
            במידע. סטריאוטיפים מיניים הם אותם הרעיונות שיש לנו בהקשר לתפקידי מגדר המשויכים למין הביולוגי.
      - ask: מה עוזר להיפרד מהחשיבה הסטריאוטיפית?
      - say: ועכשיו בואו נדמיין עולם שבו אף אחד לא אומר לנו מה ״מתאים״ לבנים או לבנות.

  # ------------------------------------------------------------------ 25′–30′
  - id: ten-years
    title: בעוד עשר שנים
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - עניין ורלוונטיות
    summary: כל אחד מצייר או כותב איפה יהיה בעוד עשר שנים, בעולם בלי מגבלות של מגדר; משתפים רק מי שרוצה
    body:
      - slide:
          kicker: לבד · מציירים או כותבים
          title: איפה תהיו בעוד עשר שנים?
          sub: בעולם שבו ברור לכולם שאין מגבלות אמיתיות של מגדר.
          timer: 240
          echo: true
          alt: דרך מתפתלת אל האופק, וכוכב מעליה
          art:
            - {use: road, x: 120, y: 150, w: 380}
            - {use: star, x: 450, y: 30, w: 130}
      - moves:
          - הציגי את השאלה, ותני ארבע דקות. כל אחד בוחר אם לצייר או לכתוב.
          - >-
            אמרי מראש שלא חייבים להראות. מי שרוצה — מראה או מקריא; מי שרוצה — מוסר לך את הדף בסוף השיעור, רק
