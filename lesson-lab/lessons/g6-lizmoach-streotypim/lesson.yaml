          challenge: מה היה קורה אילו אף אחד לא היה אומר להם מה ״מתאים״ להם?
      - say: >-
          הסרטון הראה שכבר מהלידה מלמדים אותנו מה ״של בנים״ ומה ״של בנות״. אבל כשהילד והילדה התחלפו — שניהם
