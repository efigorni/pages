sub: >-
  ״זה של בנים״, ״זה של בנות״ — מאיפה זה בא? בשיעור הזה ממיינים תכונות ותחביבים, שואלים ״האמנם?״, צופים
  בסרטון על ילד וילדה שמחליפים תפקידים, ומדמיינים את עצמנו בעוד עשר שנים.
format: מיון אישי, זוגות, סרטון ומליאה
question: מי מחליט מה ״של בנים״ ומה ״של בנות״ — ומה זה עושה לנו?
takeaways:
  - סטריאוטיפ מיני הוא הכללה על כל הבנים או על כל הבנות, בלי לראות את ההבדלים בתוך הקבוצה.
  - אף תכונה או תחביב לא שייכים רק לבנים או רק לבנות — ובשאלה ״האמנם?״ אפשר לבדוק כל הכללה.
  - כשלא מגבילים אותנו לפי מגדר, כל אחד יכול לבחור את הדרך שלו.
prep:
  - דף ריק לכל תלמיד לציור או לכתיבה (לשלב ״בעוד עשר שנים״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — סטריאוטיפים של בנים ובנות, מיון תכונות ותחביבים בהצבעה, וציור או כתיבה על
      העתיד. שאלי אם יש בכיתה מי שהנושא קרוב אליו במיוחד: מי שספג הערות על כך שהוא ״לא מתנהג כמו בן״ או ״לא
      מתנהגת כמו בת״, מי שמתלבט בזהות שלו, או מי שבבית שלו הנושא טעון. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהתחביבים, המראה או ההתנהגות שלו לא תואמים את הציפיות. מצביעים בעיניים עצומות, כך שאף אחד לא נחשף
      בדעה שלו; מדברים על תכונות, לא על אנשים — ולא מביאים תלמיד מהכיתה כדוגמה. הכללה כמו ״כל הבנות…״ עוצרים בשאלה ההפוכה (״מכירים מישהו שלא?״), לא בנזיפה.
      ותלמידים מבתים שמרניים צריכים לשמוע שגם העמדה שלהם לגיטימית, כשהיא נאמרת בכבוד.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מדברים על עמדות, לא על אנשים — ומספרים רק על עצמנו״. הציור או הכתיבה על העתיד לא
      חייבים לצאת מהמחברת; מי שרוצה, מוסר לך אותם בפרטיות. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל הצקות, חרם או לעג בגלל ״זה לא לבנים״ או ״זה לא לבנות״ — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 15 דקות ומעלה — שתי ההרחבות; 10–14 דקות — רק ״זה רק לבנים, זה רק
    לבנות״; פחות — ישר לכרטיס היציאה.
  short:
    steps:
      - sort
      - really
    text: >-
      במיון — רק התכונות, ובמליאה רק שלוש מהן; את ההצבעה על התחביבים מדלגים, ועוברים ישר לשאלות ״האמנם?״

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: יד ימין, יד שמאל
      text: >-
        יד ימין מתופפת על השולחן ויד שמאל מסובבת עיגולים באוויר. במחיאת כף מחליפים ידיים. שלושה סבבים.
    - name: חמש נשימות
      text: עיניים עצומות, יד על הבטן. חמש נשימות איטיות — שואפים באף ונושפים בפה.
  from: change

