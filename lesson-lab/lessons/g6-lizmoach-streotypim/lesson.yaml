          - הזמיני שניים–שלושה מתנדבים לשתף.
      - ladder:
          help: התחילו ממשהו שאתם אוהבים לעשות היום — איפה הוא יכול להיות בעוד עשר שנים?
          challenge: הוסיפו דבר אחד שהייתם עושים אם אף אחד לא היה אומר לכם שזה ״לא מתאים״.
      - ask: מי רוצה להראות או להקריא — רק אם בא לכם?
      - say: כל אחד מכם יכול להיות מה שהוא רוצה — בלי ״זה רק לבנים״ ובלי ״זה רק לבנות״.

  # ------------------------------------------------------------------ +5′
  - id: limited
    title: זה רק לבנים, זה רק לבנות
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      בזוגות — רגע שבו הגבילו אותנו כי ״זה רק לבנים״ או ״רק לבנות״; במליאה — באילו תחומים כדאי שההבחנה תישאר
    body:
      - slide:
          kicker: אם נשאר זמן · חושבים · בזוגות · משתפים
          title: ״זה רק לבנים״, ״זה רק לבנות״
          sub: קרה שאמרו לכם את זה? איך הרגשתם?
          echo: true
          alt: דמות עומדת מול קו אדום, ומעבר לקו כוכב
          art:
            - {use: red-line, x: 150, y: 224, w: 320, rotate: 90}
            - {use: kid-stand, x: 420, y: 214, w: 150, color: orange}
            - {use: star, x: 60, y: 190, w: 150}
      - moves:
          - 30 שניות לחשוב לבד, ודקה בזוגות. מספרים רק על עצמנו, ומותר לבחור לא לספר.
          - במליאה — רק מתנדבים, ורק מה שהם בוחרים לספר.
          - סיימי בשאלה השנייה, ותני לכיתה להגיב זה לזה.
      - ladder:
          help: חשבו על משחק, בגד, צבע או חוג.
          challenge: מה הייתם עונים היום למי שאמר לכם ״זה רק ל…״?
      - ask: מי מעוניין לספר על מקרה שבו הגבילו אותו כי ״רק בנים״ או ״רק בנות״ יכולים?
      - ask: באילו תחומים אתם מעדיפים שתישאר הבחנה בין בנים לבנות — ולמה?

  # ------------------------------------------------------------------ +5′
  - id: change
    title: מה נוכל לעשות?
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: כל זוג מציע פעולה אחת שהכיתה יכולה לעשות כדי להפחית סטריאוטיפים מיניים
    body:
      - slide:
          kicker: אם נשאר זמן · בזוגות
          title: מה נוכל לעשות ככיתה?
          sub: פעולה אחת שמפחיתה סטריאוטיפים — כבר השבוע.
          timer: 120
          echo: true
          alt: שלוש דמויות יחד, וכוכב מעליהן
          art:
            - {use: group3, x: 100, y: 220, w: 380}
            - {use: star, x: 460, y: 40, w: 130}
      - moves:
          - הסבירי, ויוצאים לדרך — שתי דקות.
          - שמעי ארבעה–חמישה זוגות, ורשמי את ההצעות על הלוח.
      - task:
          what: >-
            כל זוג כותב פעולה אחת שהכיתה יכולה לעשות כדי להפחית סטריאוטיפים מיניים — משהו שעושים, לא רק חושבים.
          time: 2 דקות
          group: זוגות
          rules: פעולה שאפשר לעשות כבר השבוע; בלי שמות של אנשים
          plenary: ארבעה–חמישה זוגות מקריאים, והפעולות נרשמות על הלוח
          help: חשבו על ההפסקה, על המשחקים ועל המילים שאומרים בכיתה.
          challenge: כתבו גם מה יעזור לנו לעמוד בזה, כשמישהו צוחק.
      - ask: כיצד אנחנו ככיתה או כחברה יכולים לפעול להפחתת סטריאוטיפים מיניים?
      - say: כתבנו פעולות של הכיתה כולה — כל אחד יכול להתחיל באחת מהן כבר מחר.

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — סופשי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלוש שאלות מה״סופשי״ של המקור על הבחירות במיון, על דבר חדש ועל עצמנו; פתקים נאספים בדלת
    body:
      - say: שלוש שאלות קצרות, לבד ובשקט. כולם מוסרים פתק בדלת — גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: סופשי
          prompts:
            - מה חשבתם על הבחירות שלכם במיון בתחילת השיעור?
            - איזה דבר חדש למדתם?
            - מה גיליתם על עצמכם?
          look_for: >-
            חפשי מי שינה את דעתו על המיון ומי עדיין בטוח ש״ככה זה״, ופתקים שמספרים על הגבלה, לעג או חרם בגלל
            ״זה לא לבנים״ או ״זה לא לבנות״ — עם אלה מדברים בשקט השבוע, ומה שנוגע בפגיעה עובר ליועצת עוד היום.
          timer: 180
          alt: דף, ועיפרון לידו
          art:
            - {use: note, x: 210, y: 60, w: 256}
            - {use: pencil, x: 40, y: 300, w: 190}
      - say: >-
          רעיון לבית, רק למי שרוצה — שאלו מישהו מבוגר במשפחה, הורה, אח גדול, סבא או סבתא, אם יש החלטה בחייו
          שהושפעה מהמגדר שלו.
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
