sub: >-
  ״אולי יבוא יום ונהפוך שווים״. בשיעור הזה מקשיבים לשיר, בודקים בכנות את העמדות שלנו, מכירים את
  המושגים — ושואלים מה עושה את בית הספר למקום בטוח לכולם.
format: שיר, כתיבה אישית, זוגות ומליאה
question: מה אני חושב ומרגיש כלפי מי ששונה ממני — ואיך אני מתנהג בכבוד גם כשאני לא מסכים?
takeaways:
  - נטייה מינית היא היבט אחד שבו אנשים שונים זה מזה — והדמיון בינינו רב מהשוני.
  - עמדה כוללת אמונות, רגשות והתנהגות — וידע והיכרות יכולים לשנות אותה.
  - גם כשהעמדות שונות, מתנהגים בכבוד — וכל אחד יכול לעזור שבית הספר יהיה מקום בטוח.
prep:
  - >-
    רשות, להכנה שלך — שני סרטונים לצוות מהמקור: ״מיניות במרחב בטוח: נוער להט״ב במסר לאנשי ונשות
    מקצוע״ (https://www.youtube.com/watch?v=Vc2LOfzyJmw), ו״התמודדות מורה עם מקרה אלימות בכיתה על רקע אמירות
    הומופוביות״ (https://www.youtube.com/watch?v=ov5upS88U0U)

safe:
  - head: תיאום עם היועצת
    text: >-
      המקור עצמו ממליץ: אם ידוע לך על תלמידים להט״בים — שקלי, לפי ההיכרות איתם, להכין אותם לפני השיעור,
      והתייעצי עם יועצת השכבה. ספרי לה מתי השיעור ועל מה, ובקשי שתהיה זמינה אחריו.
  - head: מי עלול להיפגע
    text: >-
      בכיתה עשויים להיות תלמידים להט״בים — גלויים או לא — ותלמידים שבני משפחתם להט״בים, וגם תלמידים שהעמדות
      בבית שלהם שמרניות. אין כוונה לשנות אף אחד; כל עמדה יכולה להיאמר, בכבוד. הבחיני בין רגש, שמותר, לבין
      התנהגות פוגענית, שאסורה. לא מנחשים מי להט״ב, ולא מבקשים מאף אחד לייצג ״את הקהילה״.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״לא לועגים, לא פוגעים, ולא משתמשים בדוגמאות פרטיות״. הבחירות בהיגדים נכתבות
      במחברת, ולא שואלים אף אחד מה בחר או מה הנטייה שלו. כרטיס היציאה בלי שם. מותר לוותר, ולא קוראים בשם
      למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל בריונות, אלימות או הדרה בגלל נטייה או זהות — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. תלמיד שמספר על הזהות שלו — מודים לו
      על האמון, לא מספרים לאחרים בלי הסכמתו, ומתייעצים עם היועצת.

