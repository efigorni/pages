# נטייה מינית וזהות מגדרית — כיתה ט׳, נקודת מבט, שיעור 5 (מקור: sources/text/9/Netya_Minit.md)
# המקור ממליץ על שיעור כפול: ליבה של 35′ ושתי הרחבות (D37). המסרים: שקף 32, ״מה למדנו היום?״ (D51).
# פעילויות הבחירה שנשענות על קישורים חיצוניים (סיפורים אישיים, מילון מושגים) יצאו — ראו דוח החבילה.
