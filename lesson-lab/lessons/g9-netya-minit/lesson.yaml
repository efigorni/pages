          text: >-
            נטייה קבועה יחסית של האדם להגיב בדרך מסוימת בהתייחסותו לאחרים, לסמלים, לאירועים ולתופעות.
      - slide:
          kicker: נכיר את המושגים
          title: ל · ה · ט · ב
          sub: כל אדם מגדיר את עצמו.
          points:
