  # ------------------------------------------------------------------ 18′–23′
  - id: concepts
    title: מהי עמדה, ומה אומרות האותיות
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: עמדה — אמונות, רגשות והתנהגות; ל־ה־ט־ב — נטייה מינית וזהות מגדרית, וכל אדם מגדיר את עצמו
    body:
      - moves:
          - שאלי מהי עמדה, וחכי עשר שניות לפני שאת מזמינה תשובות; אחר כך הציגי את השקף.
          - >-
            שאלי מה הם כבר יודעים על כל אות. הדהדי תשובה, והזמיני תגובות — ״מי רוצה להוסיף? מי חושב אחרת?״ —
