steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: dream
    title: בחרי מסלול — חלום
    minutes: 6
    summary: פתיחה בחלום — ציור במחברת, כללי השיח, ושניים–שלושה מראים ומספרים
    body:
      - tracks:
          - title: יש לי חלום
            text: >-
              מקריאים בקול רגוע את הדמיון המודרך של המקור, וכל אחד מצייר במחברת את מה שחלם.
            when: >-
              הכיתה יכולה לשבת דקה בשקט ולהקשיב — הדמיון המודרך מכניס אותה לחלום לאט.
            practices:
              - מה הקשר?
              - כולם כותבים
            spotlights:
              - עניין ורלוונטיות
            body:
              - slide:
                  kicker: יש לי חלום · דמיון מודרך
                  title: יש לי חלום
                  sub: שבו בנוח בכיסא, התרווחו ונוחו קצת.
                  verbatim: true
                  alt: דמות יושבת בנוח, ומעליה ענן מחשבה ובתוכו כוכב
                  art:
                    - {use: thought, x: 40, y: 30, w: 320}
                    - {use: star, x: 148, y: 103, w: 110}
                    - {use: kid-sit, x: 330, y: 204, w: 200, color: teal}
              - moves:
                  - בקשי מהכיתה להניח את העטים ולשבת בנוח. מי שנוח לו — עוצם עיניים.
                  - הקריאי את הטקסט לאט ובקול רגוע, עם הפסקה קצרה אחרי כל שורה.
                  - אחרי השורה האחרונה — כמה שניות של שקט, ורק אז הציגי את השקף הבא.
                  - שתי דקות לציור. הסתובבי, וסמני לעצמך שניים–שלושה ציורים שונים זה מזה.
              - say: שבו בנוח. אני מקריאה, ואתם רק מקשיבים ונותנים לעצמכם לחלום.
              - quote:
                  title: הדמיון המודרך — להקריא לאט
                  text: |-
                    שבו בנוח בכיסא, התרווחו ונוחו קצת.
                    חייכו לעצמכם בלב
                    (או ממש חיוך רחב על הפנים).
                    אתם מוזמנים לחלום
                    לחלום על משהו שתשמחו שיקרה,
                    לחלום על משהו שאתם רוצים להצליח בו,
                    אולי על משהו שאתם רוצים להשיג,
                    אולי על מישהו שתשמחו לפגוש,
                    פשוט לחלום ובכיף,
                    תנו לחלומכם לשמח את ליבכם.
              - slide:
                  kicker: יש לי חלום · במחברת
                  title: ציירו את החלום שלכם
                  sub: ומתחת — משפט אחד על מה שחלמתם.
                  timer: 120
                  echo: true
                  cue: אחרי ההקראה —
                  alt: דמות מציירת ליד שולחן, ומעליה ענן מחשבה ובתוכו כוכב
                  art:
                    - {use: thought, x: 110, y: 20, w: 260}
                    - {use: star, x: 193, y: 74, w: 100}
                    - {use: kid-desk, x: 300, y: 140, w: 280, color: teal}
              - ladder:
                  help: לא עלה חלום? ציירו משהו שתשמחו שיקרה — מחר, או השנה.
                  challenge: הוסיפו לציור פרט שמראה איך תרגישו כשהחלום יתגשם.
          - title: תמונה לחלום
            text: >-
              השקף מחכה על המסך כשהכיתה נכנסת. כל אחד מצייר במחברת תמונה למילה ׳חלום׳, וכותב מתחת למה בחר בה.
            when: >-
              הכיתה נכנסת בתנועה, וקשה לה לעצור להקשבה — משימה בידיים מושיבה אותה מהר יותר.
            practices:
              - קדימה ללמידה
            spotlights:
              - עניין ורלוונטיות
            body:
              - slide:
                  kicker: קדימה ללמידה · במחברת
                  title: מה אתם רואים כשאתם שומעים ׳חלום׳?
                  sub: ציירו תמונה, וכתבו מתחת משפט אחד — למה דווקא היא.
                  timer: 180
                  echo: true
                  alt: דף, ועליו כוכב מצויר, ועיפרון לידו
                  art:
                    - {use: note, x: 150, y: 50, w: 256}
                    - {use: star, x: 223, y: 165, w: 110}
                    - {use: pencil, x: 390, y: 300, w: 190}
              - moves:
                  - השקף על המסך עוד לפני שהכיתה נכנסת, ומתחילים לצייר בלי הסבר נוסף.
                  - בזמן הציור — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שניים–שלושה ציורים שונים זה מזה.
              - say: שלוש דקות, לבד ובשקט. אין ציור נכון — רק מה שעולה לכם כשאתם שומעים ׳חלום׳.
              - ladder:
                  help: חשבו על משהו שהייתם רוצים שיקרה לכם — וציירו אותו.
                  challenge: ציירו גם איך תרגישו כשהחלום יתגשם.
      - slide:
          kicker: לפני שמשתפים
          title: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          cue: אחרי הציור —
          alt: זוג יד ביד, ומעליו בועת דיבור ובתוכה לב
          art:
            - {use: speech, x: 40, y: 30, w: 300}
            - {use: heart, x: 135, y: 80, w: 110}
            - {use: pair, x: 260, y: 250, w: 250}
      - moves:
          - הזכירי את כללי השיח בקצרה — הם נשארים על המסך בזמן השיתוף.
          - הזמיני את שניים–שלושה הציירים שסימנת להראות את הציור ולספר עליו במשפט.
      - ask: מה ציירתם — ועל מה חלמתם?
      - say: >-
          חלמנו על מה שנשמח שיקרה. ויש גם חלומות שכבר התגשמו לנו — בואו נבדוק מה עזר להם להתגשם.

  # ------------------------------------------------------------------ 6′–11′
  - id: done
    title: חלום שכבר התגשם
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: חלום או משאלה שכבר הגשימו — לבד, בזוגות ובמליאה; על הלוח, מה עזר ומה הקשה
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: חלום או משאלה שכבר הגשמתם
          sub: כתבו לבד, ספרו בזוגות, ואז במליאה.
          points:
            - מה, או מי, עזר לכם להגשים?
            - מה עיכב או הקשה בדרך?
          timer: 60
          echo: true
          alt: הר ודגל על הפסגה, ודמות מרימה יד
          art:
            - {use: mountain, x: 40, y: 260, w: 330}
            - {use: flag, x: 233, y: 165, w: 110}
            - {use: kid-hand, x: 430, y: 272, w: 125, color: teal}
      - say: >-
          חשבו על משהו שרציתם ללמוד או להצליח בו — והצלחתם. כתבו אותו, ומה עזר לכם בדרך.
      - moves:
          - דקה של כתיבה לבד, במחברת — החלום, מה עזר ומה הקשה.
          - דקה וחצי בזוגות עם השכן — כל אחד מספר לשני.
          - >-
            במליאה — שלושה–ארבעה מספרים מה הגשימו ואיך הרגישו. רשמי על הלוח, בשני טורים, מה עזר ומה הקשה.
      - ladder:
          help: חשבו על משהו קטן שרציתם ללמוד — לרכוב על אופניים, לשחות, לסיים ספר.
          challenge: מה מתוך מה שעזר לכם אז הייתם יכולים לעשות שוב, עם חלום חדש?
      - board: מה עזר · מה הקשה
      - ask: מי מוכן לספר — מה הגשמתם, ואיך הרגשתם כשזה קרה?
      - say: >-
          שימו לב לטור ׳מה עזר׳ — הרבה ממה שכתוב שם עשינו בעצמנו. ומה אומרים המחקרים?

  # ------------------------------------------------------------------ 11′–16′
  - id: research
    title: מחקרים אומרים
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      מה קל יותר לומר — מה לא רוצים, או מה כן; מה אומרים המחקרים על הגדרת מטרות; ואז כל אחד כותב חלום אחד
      בענן שבדף
    body:
      - slide:
          kicker: רגע לחשוב
          title: מה קל לכם יותר לומר?
          sub: מה אתם לא רוצים שיקרה — או שלושה דברים ברורים שהייתם רוצים שיקרו לכם השנה?
          echo: true
          alt: קהל של דמויות, ומעליו ענן מחשבה עם סימן שאלה
          art:
            - {use: thought, x: 60, y: 24, w: 240}
            - text: '?'
              x: 182
              y: 118
              size: 110
            - {use: crowd, x: 130, y: 280, w: 380}
      - quote:
          title: מה אומרים המחקרים — להקריא
          text: |-
            מחקרים שבדקו מה הופך אנשים למצליחים ולמשפיעים ביותר בתחומם, מצאו כי אנשים מצליחים יודעים להגדיר לעצמם מטרות בדרך יעילה ומדויקת.
            כולנו מציבים לעצמנו במהלך החיים מטרות "גדולות" כמו: ללמוד באוניברסיטה/במכללה, להתקבל לעבודה נחשקת; ומטרות "קטנות" כמו: להצליח במבחן, להתמיד בספורט.
            הדבר שמקדם את השגת המטרה הוא הגדרה יעילה ומדויקת של המטרה והפעולות.
      - moves:
          - >-
            הציגי את השאלה, וספרי בלב עד עשר. אחר כך שמעי שתיים־שלוש תשובות — רק ממי שרוצה, ורק על עצמו.
          - >-
            הקריאי את המחקר, ושאלי מה דעתם. על כל תשובה — הדהדי, ושאלי את הכיתה מי מסכים ומי חושב אחרת, ולמה.
          - חלקי את הדף ״הופכים חלום למציאות״, והציגי את השקף הבא — דקה וחצי לכתיבה בענן.
      - ask: מה דעתכם על המידע הזה?
      - say: >-
          אז מה שעוזר להגשים הוא לדעת בדיוק מה רוצים, ומה עושים בשבילו. נתחיל מהחלום — כתבו בענן חלום אחד
          לשנה הזאת.
      - slide:
          kicker: הופכים חלום למציאות
          title: בענן ׳חלום׳ — כתבו חלום אחד לשנה הזאת
          sub: משהו שהייתם רוצים להשיג — בחוג, בלימודים, משהו חדש ללמוד או שינוי בהתנהגות.
          timer: 90
          echo: true
          cue: כשהדפים מחולקים —
          alt: ענן ובתוכו המילה ׳חלום׳, ועיפרון לידו
          art:
            - {use: thought, x: 50, y: 40, w: 320}
            - text: חלום
              x: 213
              y: 170
              size: 72
            - {use: pencil, x: 380, y: 290, w: 200}
      - ladder:
          help: בחרו תחום אחד — חוג, לימודים, חברים, בית — ומה הייתם רוצים שיקרה בו השנה?
          challenge: כתבו קודם שלושה דברים ברורים שהייתם רוצים שיקרו לכם השנה, ובחרו אחד מהם לענן.
      - handout:
          title: הופכים חלום למציאות
          copies: עותק לכל תלמיד
          items:
            - חלום — משהו שהייתי רוצה להשיג השנה
            - יעד — מה בדיוק אשיג?
            - חשוב — למה חשוב לי להשיג את היעד?
            - לזמן מוגדר — עד מתי אשיג אותו?
            - ומה עושים — הפעולות שאעשה כדי להשיג את היעד

  # ------------------------------------------------------------------ 16′–20′
  - id: chalom
    title: כל יעד מתחיל בחלו״ם
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: מהו יעד, ושלוש האותיות של חלו״ם — חשוב, לזמן מוגדר, ומה עושים
    body:
      - slide:
          kicker: מהו יעד?
          title: יעד הוא מטרה שאנחנו רוצים להשיג
          sub: משהו שאנחנו שואפים אליו, רוצים עבור עצמנו או עבור אחרים.
          verbatim: true
          echo: true
          alt: מטרה עם חץ במרכז
          art: target
      - say: יש כלי שעוזר להפוך חלום ליעד. קוראים לו חלו״ם — כמו חלום, רק עם תוכנית.
      - slide:
          kicker: כל יעד מתחיל ב…
          title: חלו״ם
          points:
            - >-
              **ח**שוב — למה חשוב לנו להשיג את היעד?
            - >-
              **ל**זמן מוגדר — עד מתי נשיג אותו?
            - >-
              **ומ**ה עושים — אילו פעולות נעשה כדי להשיג אותו?
          echo: true
          cue: אחרי ההגדרה —
          alt: שלושה כרטיסים — לב, שעון ועיפרון — עם האותיות ח, ל, ומ
          art: {file: art/chalom.svg}
      - quote:
          title: חלו״ם מהמקור — להקריא אות אחרי אות
          text: |-
            ח - חשוב – למה חשוב לנו להשיג את היעד הזה?
            ל - לזמן מוגדר – נקבע את מועד השגת היעד. מתי נשיג אותו? הפעולות שנעשה יהיו לפרק זמן מוגדר עד שנשיג את היעד. אם נגדיר זמן להשגת היעד, תהיה לנו המוטיבציה לפעול להשגתו. זה לא יהיה מתישהו, פעם. זה יהיה בעוד חודש, בעוד חצי שנה. אנחנו נדע במדויק מתי נגיד לעצמנו – כל הכבוד! השגנו את היעד.
            ומ - מה עושים – אילו מעשים אנחנו נעשה, פעולות שננקוט בהן כדי להשיג את היעד שלנו?
      - moves:
          - הקריאי את ההגדרה של יעד.
          - חשפי את האותיות אחת־אחת, והקריאי לכל אחת את ההסבר מהמקור.
          - שאלי על ׳לזמן מוגדר׳, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
      - ask: למה לדעתכם חשוב לקבוע עד מתי — ולא ׳מתישהו, פעם׳?
      - say: עכשיו כל אחד הופך את החלום שבענן ליעד — לפי חלו״ם.

