sub: >-
  חלום הוא התחלה טובה, ויעד מדויק עוזר להגשים אותו. בשיעור הזה חולמים, נזכרים בחלום שכבר התגשם, ולומדים
  להפוך חלום ליעד בעזרת חלו״ם.
format: ציור וכתיבה אישית, זוגות ומליאה
question: איך הופכים חלום ליעד שאפשר להגשים?
takeaways:
  - חלום הוא התחלה. כדי להגשים אותו, הופכים אותו ליעד — מטרה שרוצים להשיג.
  - חלו״ם עוזר להגדיר יעד — למה הוא חשוב, עד מתי, ומה עושים בשבילו.
  - תוכנית ופעולה ראשונה מקרבות את החלום, ויש מי שיכול לעזור בדרך.
