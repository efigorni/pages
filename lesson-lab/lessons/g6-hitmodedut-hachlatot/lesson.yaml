# התמודדות עם קבלת החלטה — כיתה ו׳, קבלת החלטות, שיעור 1 (מקור: sources/text/6/Hitmodedut_Hachlatot.md)
slug: g6-hitmodedut-hachlatot
title: התמודדות עם קבלת החלטה
grade: 6
grades_served: [6]
month: מרץ
section: מיומנויות לחיזוק כוחות וחוסן להתנהלות מיטבית בשגרה ובחירום (מרץ)
unit: קבלת החלטות
unit_order: 1
unit_size: 3
