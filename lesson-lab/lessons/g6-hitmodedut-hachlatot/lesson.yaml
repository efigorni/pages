steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: שלוש החלטות מהבוקר
    minutes: 4
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית קצרה — שלוש החלטות שקיבלנו מאז שקמנו; שומעים שלוש תשובות
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: אילו החלטות קיבלתם מאז שקמתם הבוקר?
          sub: כתבו שלוש — קטנות או גדולות.
          timer: 180
          echo: true
          alt: תלמיד כותב ליד שולחן, ושמש של בוקר מעליו
          art:
            - {use: kid-desk, x: 250, y: 150, w: 270, color: teal}
            - {use: sun, x: 50, y: 40, w: 160}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - >-
            בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש החלטות שונות זו מזו: אחת קטנה,
            אחת עם חברים ואחת שהיה קשה להחליט.
          - הזמיני את שלושת הכותבים לשתף, ושאלי כל אחד אם היה לו קל או קשה להחליט.
      - say: שלוש דקות, לבד ובשקט. כל החלטה נחשבת — גם מה לאכול בבוקר.
      - ladder:
          help: מה לבשתם? מה אכלתם? עם מי הלכתם לבית הספר?
          challenge: איזו מהשלוש הייתה הכי קשה להחליט — ולמה?
      - ask: נשמע שלושה — איזו החלטה כתבתם, והיה לכם קל או קשה להחליט?

  # ------------------------------------------------------------------ 4′–11′
  - id: video
    title: הבחירה
    minutes: 7
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      סרטון קצר על יום שלם של החלטות, עד 1:31 — מה הדמות החליטה, ומה אנחנו מרגישים כשצריך להחליט
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש השערות.
          - הפעילי את הסרטון, ועצרי בנקודה שסימנת לשאלת החיזוי.
          - ב־1:31 הדמות מתעוררת בבוקר שלמחרת, אחרי שתואר היום הראשון — שם עוצרים.
          - רשמי על הלוח את ההחלטות שהכיתה מונה, ועברי לשאלה בזוגות.
      - video:
          title: הבחירה — סרטון אנימציה קצר
          url: https://www.youtube.com/watch?v=_HEnohs6yYw
          length: "3:27"
          clip:
            end: "1:31"
          before: כמה החלטות אדם מקבל ביום אחד, לדעתכם?
          watch: ספרו כמה החלטות הדמות מקבלת במהלך היום — גם את הקטנות.
          pauses:
            - at: "?"
              moment: >-
                באמצע היום הראשון, רגע שבו הדמות עומדת לפני בחירה. צפי בסרטון לפני השיעור, ורשמי כאן את
                הזמן.
              ask: מה הדמות תבחר עכשיו — ומה הייתם בוחרים אתם?
          alt: שעון קיר, ולידו גבעול שמתפצל לשלושה חיצים
          art:
            - {use: clock, x: 270, y: 110, w: 300, color: teal}
            - {use: arrows-fork, x: 50, y: 290, w: 200}
      - ask: כמה החלטות ספרתם? מהן ההחלטות שהדמות קיבלה במהלך היום?
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: איך אתם מרגישים כשאתם צריכים לקבל החלטה?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי שההחלטות של הדמות רשומות על הלוח —
          alt: דמות, ומעליה ענן מחשבה ובתוכו פנים מתלבטות
          art:
            - {use: thought, x: 60, y: 30, w: 300}
            - {use: face-meh, x: 150, y: 85, w: 120, color: teal}
            - {use: kid-stand, x: 380, y: 210, w: 150, color: teal}
      - ladder:
          help: חשבו על אחת ההחלטות שכתבתם בבוקר — מה הרגשתם רגע לפני שהחלטתם?
          challenge: למה לדעתכם יש החלטות שמלחיצות אותנו, ואחרות לא?
      - say: >-
          ככל שאנו עולים בגיל, ההחלטות שלנו מורכבות יותר, משמעותיות יותר ובעלות השפעה גדולה יותר על
          עתידנו. ועל מי עוד ההחלטות שלנו משפיעות? בואו נבדוק.

  # ------------------------------------------------------------------ 11′–16′
  - id: circles
    title: מעגלי השפעה
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: ארבעה מעגלים — אני, משפחה, חברים וסביבה — ודוגמה מהכיתה לכל אחד מהם
    body:
      - slide:
          kicker: מעגלי השפעה
          title: על מי ההחלטה שלי משפיעה?
          sub: לפעמים רק עליי — ולפעמים גם על אחרים.
          echo: true
          alt: ארבעה מעגלים זה בתוך זה — אני במרכז, ומסביב משפחה, חברים וסביבה
          art: {file: art/circles.svg}
      - quote:
          title: ההסבר מהמקור — להקריא
          text: >-
            לכל החלטה שלנו יש השפעה. לעיתים ההשפעה היא רק עלינו, לעיתים היא משפיעה על אנשים אחרים:
            משפחה, חברים, סביבה רחבה יותר.
      - moves:
          - הקריאי את ההסבר, ועברי על המעגלים מבפנים החוצה — דוגמה אחת מהרשימה לכל מעגל.
          - שאלי את הכיתה, וספרי בלב עד עשר לפני שאת מזמינה תשובות. נסי לשמוע דוגמה לכל מעגל.
          - על כל דוגמה — שאלי את הכיתה ״על מי עוד זה משפיע?״, ותני לתלמידים להוסיף זה על דברי זה.
      - list:
          - אני — מה אוכל לארוחת בוקר, או מה אלבש.
          - משפחה — האם אעזור בבית, או ארעיש עם מוזיקה.
          - חברים — האם אעזור לחבר בשיעורים, או אפריע לשיעור.
          - סביבה — האם אזרוק את הזבל בפח הגדול ברחוב, או אשאיר אותו מחוץ לפח.
      - ask: >-
          תנו דוגמה להחלטה שמשפיעה רק עליכם — ועכשיו להחלטה שמשפיעה גם על המשפחה, על החברים או על
          הסביבה.
      - say: אז ההחלטה שלך משפיעה גם על ___ — הבנתי נכון? מי רואה עוד מישהו שהיא משפיעה עליו?
      - say: עכשיו כל אחד יתבונן בהחלטה אחת שלו — מה היה בה, ועל מי היא השפיעה.

  # ------------------------------------------------------------------ 16′–24′
  - id: triads
    title: החלטה שקיבלתי
    minutes: 8
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: >-
      כל אחד כותב על החלטה שקיבל לאחרונה, לפי שש שאלות; בשלשות משתפים רק על מי היא השפיעה, איך מרגישים
      איתה היום, ומה היו משנים
    body:
      - slide:
          kicker: החלטה שקיבלתי · קודם לבד
          title: באילו תחומים אנחנו מקבלים החלטות?
          sub: ומה עוד? כל תחום בחיים שלכם נחשב.
          points:
            - להכין שיעורים או לצאת לשחק?
            - האם להציע חברות?
            - באיזה חוג לבחור?
            - למי ומתי למסור את הכדור?
          verbatim: [points]
          echo: true
          alt: עמוד עם שלושה שלטי כיוון, ודמות עומדת לידו
          art:
            - {use: signpost, x: 300, y: 150, w: 250}
            - {use: kid-stand, x: 90, y: 250, w: 130, color: teal}
      - moves:
          - הציגי את התחומים, ושאלי מה עוד אפשר להוסיף — למשל ״מתי לחזור הביתה בערב?״.
          - הסבירי את המשימה לפני שעוברים לשלשות — קודם כותבים לבד, ואז משתפים רק בשאלות 4, 5 ו־6.
          - ארבע דקות של כתיבה בשקט. הסתובבי בין השולחנות, ועזרי למי שלא מוצא החלטה.
          - בשלשות — שלוש דקות. דקה לפני הסוף, הזכירי שכל אחד בשלשה צריך להספיק לדבר.
      - board:
          - מה הסוגיה שעמדה בפניכם?
          - מה היו האפשרויות?
          - מה החלטתם, ובמה בחרתם?
          - על אילו מעגלים ההחלטה השפיעה?
          - איך אתם מרגישים היום עם ההחלטה שלכם?
          - לו יכולתם לחזור אחורה — הייתם בוחרים אחרת?
      - say: >-
          היזכרו בהחלטה שקיבלתם לאחרונה, באחד התחומים שעל המסך. כותבים לבד, וההחלטה עצמה נשארת שלכם —
          בשלשה משתפים רק בשלוש השאלות האחרונות.
      - task:
          what: >-
            כל אחד נזכר בהחלטה שקיבל לאחרונה ועונה במחברת על שש השאלות שעל הלוח. אחר כך, בשלשות, כל אחד
            משתף בתשובות שלו לשאלות 4, 5 ו־6.
          time: 4 דקות כתיבה, 3 דקות בשלשות
          group: לבד ← שלשות לפי השולחנות
          rules: את ההחלטה עצמה לא חייבים לספר; מקשיבים בלי לשפוט, ומספרים רק על עצמנו
          plenary: בשלב הבא — מה למדנו על הדרך שבה אנחנו מחליטים
          help: בחרו החלטה קטנה מהשבוע, מאחד התחומים שעל המסך.
          challenge: מה הייתם משנים בדרך שבה החלטתם — לא רק בהחלטה עצמה?
      - slide:
          kicker: החלטה שקיבלתי · לבד, בכתב
          title: היזכרו בהחלטה שקיבלתם לאחרונה
          sub: ענו במחברת על שש השאלות שעל הלוח.
          timer: 240
          echo: true
          cue: אחרי ההסבר —
          alt: דף עם שורות, ועיפרון לידו
          art:
            - {use: note, x: 150, y: 100, w: 240}
            - {use: pencil, x: 400, y: 300, w: 170}
      - slide:
          kicker: בשלשות · 3 דקות
          title: שתפו בשלוש השאלות האחרונות
          points:
            - על אילו מעגלים ההחלטה השפיעה?
            - איך אתם מרגישים איתה היום?
            - הייתם בוחרים אחרת?
          timer: 180
          echo: true
          cue: אחרי ארבע דקות של כתיבה —
          alt: שלוש דמויות יחד, ובועת דיבור מעליהן
          art:
            - {use: group3, x: 120, y: 225, w: 380}
            - {use: speech, x: 380, y: 30, w: 200}
      - say: עכשיו בשלשות. כל אחד משתף בשלוש השאלות האחרונות, ושאר השלשה מקשיבים — שלוש דקות, וכל אחד מספיק לדבר.

  # ------------------------------------------------------------------ 24′–27′
  - id: reflect
    title: מה למדתי על הדרך שלי?
    minutes: 3
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
    summary: במליאה — מה גילינו על הדרך שבה אנחנו מקבלים החלטות, ומה היינו משנים
    body:
      - slide:
          kicker: חוזרים למליאה
          title: מה למדתם על הדרך שבה אתם מקבלים החלטות?
          sub: יש משהו שהייתם משנים — או כבר שיניתם?
          echo: true
          alt: דמות יושבת וחושבת, ונורה דולקת מולה
          art:
            - {use: kid-sit, x: 120, y: 190, w: 220}
            - {use: bulb, x: 380, y: 60, w: 150}
      - moves:
          - חוזרים למליאה. שאלי, וחכי עשר שניות של שקט לפני שמזמינים תשובות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב — ״למי עוד זה קורה?״, ״מי החליט אחרת?״.
      - ask: מה למדתם על הדרך שבה אתם מקבלים החלטות — ויש משהו שהייתם משנים?
      - say: אז מה שגילית זה ___ — הבנתי נכון? מי עוד מזהה את זה אצלו?

  # ------------------------------------------------------------------ +5′
  - id: auto
    title: אוטומטית או בשיקול דעת?
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
    summary: חוזרים לשלוש ההחלטות מהבוקר — איזו התקבלה אוטומטית, ואיזו בשיקול דעת
    body:
      - slide:
          kicker: אם נשאר זמן · חושבים · בזוגות · משתפים
          title: החלטתם אוטומטית, או בשיקול דעת?
          sub: סמנו ליד כל אחת משלוש ההחלטות מהבוקר.
          echo: true
          alt: רמזור, ודמות עומדת לידו
          art:
            - {use: traffic-light, x: 350, y: 120, w: 150}
            - {use: kid-stand, x: 130, y: 250, w: 130, color: teal}
      - moves:
          - >-
            חוזרים לשלוש ההחלטות שנכתבו בפתיחה. כל אחד מסמן ליד כל החלטה: א׳ — אוטומטית, ש׳ — בשיקול
            דעת.
          - דקה בזוגות — משווים, ובוחרים החלטה אחת שכדאי היה לחשוב עליה יותר.
          - שמעי שלושה זוגות, והדהדי את מה שהם בחרו.
      - ladder:
