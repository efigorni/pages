sensitivity: low

sub: >-
  אנחנו מקבלים החלטות כל היום — קטנות וגדולות. בשיעור הזה סופרים החלטות, בודקים על מי כל החלטה
  משפיעה, ומתבוננים בהחלטה אחת שקיבלנו.
format: לבד, שלשות ומליאה
question: איך אנחנו מקבלים החלטות — ועל מי הן משפיעות?
takeaways:
  - אנחנו מקבלים החלטות כל יום — חלקן קטנות ואוטומטיות, וחלקן משמעותיות ומשפיעות לזמן ארוך.
  - לכל החלטה יש מעגלי השפעה — עליי, על המשפחה, על החברים ועל הסביבה.
  - ככל שנבין איך אנחנו מחליטים, נוכל לבחור בצורה שקולה יותר.
prep:
  - חלוקה מראש לשלשות לפי השולחנות
  - שש השאלות של ״החלטה שקיבלתי״ — כתובות על הלוח לפני השיעור

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; בין 13 ל־17 דקות — רק ״אוטומטית או
    בשיקול דעת?״; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - video
      - triads
    text: >-
      אחרי הסרטון שומעים רק את רשימת ההחלטות, בלי שאלת הזוגות; ובשלשות כל אחד עונה בכתב רק על שאלות 1, 4 ו־6

brain_break:
  after: circles
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: אף ואוזן
      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
  from: ripple

cover:
  alt: פרשת דרכים — גבעול שמתפצל לשלושה חיצים, ודמות עומדת לידו
