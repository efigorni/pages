steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: diary
    title: היומן של יובל
    minutes: 7
    practices:
      - מה הקשר?
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: שלושה כללי שיח, ואז קריאה אישית ביומן של יובל — וכל אחד עונה בכתב, בן או בת, ולמה
    body:
      - slide:
          kicker: לפני שמתחילים
          title: שלושה כללים להיום
          points:
            - לא צוחקים על אף אחד
            - לא שואלים אף אחד על הגוף שלו
            - משתמשים במילים הנכונות
          echo: true
          alt: מגן גדול
          art: shield
      - moves:
          - הציגי את שלושת הכללים, ואמרי שמבוכה וצחוק קטן צפויים — וזה בסדר.
          - חלקי לכל תלמיד את היומן של יובל, והציגי את שלוש השאלות. קוראים לבד ובשקט, ועונים במחברת.
          - >-
            בזמן הכתיבה הסתובבי בין השולחנות. שימי לב לנימוקים שחוזרים — ״רק בנות…״, ״רק בנים…״ — הם יעלו
            בשלב הבא.
      - say: >-
          זה קטע מיומן של מישהו בגילכם, בשם יובל. קראו אותו לבד, ואחר כך ענו במחברת על שלוש השאלות שעל המסך.
      - slide:
          kicker: היומן של יובל · לבד, בכתב
          title: בן או בת?
          points:
            - האם יובל הוא בן או שמא יובל היא בת?
            - האם את/ה בטוח/ה בתשובתך?
            - מה הנימוקים לתשובתך?
          verbatim: [points]
          echo: true
          timer: 300
          cue: אחרי שהיומן חולק —
          alt: דף יומן, ומעליו ענן מחשבה ובו בן? בת?
          art:
            - {use: thought, x: 250, y: 30, w: 320}
            - text: בן? בת?
              x: 415
              y: 158
              size: 52
            - {use: note, x: 60, y: 290, w: 170}
      - ladder:
          help: חפשו ביומן משפט אחד שעזר לכם להחליט, וסמנו אותו.
          challenge: מצאו ביומן משפט שמתאים גם לבן וגם לבת — ומה זה אומר על התשובה שלכם?
      - handout:
          title: היומן של יובל
          copies: עותק לכל תלמיד
          verbatim: true
          text: |-
            שלום , שמי יובל ובאתי הנה כדי לספר לכם על מה שקורה לי.

            לפעמים נדמה לי שכל יום מביא עמו שינוי אחר, כמעט כאילו שגדל לי "גוף חדש"! אומרים לי שהתחלתי את תהליך ההתבגרות שלי?!?

            אחד מהדברים שקורים לי הוא שיער חדש שצומח במקומות שאף פעם לא היה שם: מתחת לבית השחי, למשל. כן, אומרים לי שגם זה טבעי והכל, אבל בכל זאת, צריך להתרגל לזה!

            לא אכפת לי שקורים לי חלק מהדברים. בעצם, כמה מהם אפילו מוצאים חן בעיני - הגובה שלי רב יותר מאשר בשנה שעברה ואני כמעט בגובה של הוריי, נדמה לי שגם השכל שלי התפתח – כי יש לי אפשרות לחשוב ולדבר על מה שעובר עלי עכשיו בצורה גלויה יותר. אבל בכל זאת יש כמה שינויים שאינם כה טובים ונעימים כמו למשל ר.ג.... יודעים מה זה? ריח גוף. בפעם הראשונה שחשתי בו, חשבתי שיש לי איזו מחלה או משהו כזה. אחר כך נוכחתי לדעת שהריח לא כל כך נורא כשמתרחצים או כשמשתמשים בדיאודורנט. או למשל, אקנה (פצעי בגרות). הם התופעה הכי מבאסת. יום אחד כשהתכוונתי ללכת למסיבה, הסתכלתי בראי ופתאום ראיתי פצע בגרות גדול מסתכל עלי. שמתי עליו מגבת חמה ולחה. הפצע ירד קצת, אך לא לגמרי. בכל זאת הלכתי למסיבה. רק מאותו יום שמתי לב שלחלק גדול מהאחרים יש את אותה בעיה ואפילו בצורה גרועה יותר.

            ויש עוד עניין, שמביך אותי וקשה לי קצת לדבר עליו... כשהייתי במסיבה לפני ימים אחדים ורקדתי עם כולם, הרגשתי תחושה חדשה באזור איבר המין שלי... זה היה מוזר אבל יחד עם זאת, נעים. אומרים לי שזה טבעי, שזה נורמלי... האם כך הדבר?

            בקיצור, אומרים לי שההתבגרות שלי החלה. פירושו של דבר שעלי ללכת לבית הספר יחד עם ועל אף פצעי הבגרות שלי, השערות והריחות... אבל – עם גוף גבוה יותר ושכל רב יותר, בתקווה שאעבור זאת בקלות... שלכם, יובל
      - say: כולם החליטו? עכשיו נשמע מה החלטתם — ובעיקר למה.

  # ------------------------------------------------------------------ 7′–13′
  - id: why
    title: בן או בת — ולמה?
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      בזוגות משווים נימוקים; במליאה אוספים אותם על הלוח, ושמים סימן שאלה ליד כל ״רק בנים״ או ״רק בנות״
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: על מה התבססתם?
          points:
            - לבד — כבר כתבתם
            - בזוגות — דקה, משווים נימוקים
            - במליאה
          echo: true
          alt: זוג יד ביד, ולידו שתי בועות צ׳אט
          art:
            - {use: pair, x: 40, y: 260, w: 240}
            - {use: chat, x: 300, y: 60, w: 280}
      - moves:
          - דקה בזוגות — כל אחד מקריא לשכן את הנימוק שלו. מסכימים? מה שונה?
          - >-
            במליאה שאלי מי חשב שבן, מי חשב שבת ומי לא בטוח, ורשמי על הלוח את הנימוקים כמו שהם נאמרים.
          - ליד כל נימוק של ״רק בנות״ או ״רק בנים״ ציירי סימן שאלה גדול, ושאלי את הכיתה אם זה באמת כך.
          - הזמיני תגובות — מי מסכים? מי מכיר מישהו שזה לא נכון לגביו?
      - quote:
          title: נימוקים שצפויים לעלות — מהמקור
          text: |-
            יובל היא בת כי רק לבנות אכפת איך שהן נראות...
            יובל הוא בן כי רק בנים מרגישים תחושה נעימה באיברי המין...
            יובל היא בת כי רק בנות מביעות מה שהן מרגישות..
      - ladder:
          help: קראו שוב את הנימוק שלכם — האם הוא נכון רק לבנים, רק לבנות, או לכולם?
          challenge: מה הנימוק הכי משכנע ששמעתם מהצד השני — ולמה הוא משכנע?
      - ask: האמנם רק לבנות אכפת איך שהן נראות? לבנים לא אכפת?
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי מסכים, ומי חושב אחרת?

  # ------------------------------------------------------------------ 13′–17′
  - id: both
    title: איך זה אפשרי?
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: איך היומן מתאים גם לבן וגם לבת? מסכמים — חלק מהשינויים דומים וחלקם שונים
    body:
      - slide:
          kicker: רגע לחשוב
          title: איך היומן מתאים גם לבן וגם לבת?
          echo: true
          alt: שתי דמויות יד ביד, ודף יומן מעליהן
          art:
            - {use: pair, x: 170, y: 196, w: 300}
            - {use: note, x: 450, y: 30, w: 150}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב לה.
          - שאלי את השאלה השנייה, וסכמי במשפט אחד — הוא הגשר לטבלה.
      - ask: איך זה אפשרי שהסיפור מתאים גם לבנים וגם לבנות?
      - ask: מה דומה בין בנים לבין בנות ומה שונה, בכל הקשור לגיל ההתבגרות?
      - say: >-
          ראינו שהיומן של יובל יכול להיות של בן וגם של בת. גם בנים וגם בנות מתפתחים בגיל ההתבגרות — חלק
          מהשינויים דומים, וחלקם שונים. בואו נבדוק אילו.

  # ------------------------------------------------------------------ 17′–26′
  - id: table
    title: מה דומה ומה שונה?
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
    summary: >-
      בזוגות ממיינים 18 שינויים — אצל בנות, אצל בנים או אצל שניהם; במליאה בונים את הטבלה על הלוח
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הדף. הטבלה הריקה כבר על הלוח.
          - חלקי דף לכל זוג. ארבע דקות למיון; הסתובבי, ועני על מילים לא מוכרות בקצרה ובמילים הנכונות.
          - >-
            במליאה עברי על הרשימה לפי הסדר — כל זוג בתורו אומר לאיזה טור שייך שינוי אחד, ושאלי את הכיתה אם
            היא מסכימה. רשמי בטבלה.
          - בסוף הצביעי על הטור האמצעי — רוב השינויים קורים אצל שניהם.
      - slide:
          kicker: בזוגות · 4 דקות
          title: אצל בנות, אצל בנים — או אצל שניהם?
          sub: כתבו ליד כל שינוי ת, ב או ש.
          timer: 240
          echo: true
          alt: שני עיגולים חופפים — בנות, בנים, ובאמצע שניהם
          art: {file: art/venn.svg}
      - say: >-
          בדף יש שינויים שקורים בגיל ההתבגרות. בזוגות, כתבו ליד כל אחד ת — אצל בנות, ב — אצל בנים, או ש —
          אצל שניהם. מילה לא מוכרת? שאלו אותי.
      - board: אצל בנות · אצל שניהם · אצל בנים
      - task:
          what: >-
            בזוגות קוראים את 18 השינויים שבדף, וכותבים ליד כל אחד ת (אצל בנות), ב (אצל בנים) או ש (אצל שניהם).
          time: 4 דקות
          group: זוגות לפי השולחנות
          rules: מתלבטים? מסמנים סימן שאלה וממשיכים. שואלים על מילה לא מוכרת — בלי לצחוק עליה
          plenary: כל זוג בתורו ממקם שינוי אחד בטבלה שעל הלוח
          help: התחילו מהשינויים שהופיעו ביומן של יובל — שיער, גובה, ריח גוף, פצעי בגרות.
          challenge: מצאו שינוי אחד שקשה להחליט עליו — ונמקו את הבחירה שלכם.
      - handout:
          title: השינויים של גיל ההתבגרות
          copies: עותק לכל זוג
          verbatim: true
          lines: false
          items:
            - שיעור – צמיחת שיער ערווה במפשעה, בבית השחי, בגפיים.
