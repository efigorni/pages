brain_break:
  signs: ראשים על השולחן, פיהוקים, מבטים לחלון.
  ideas:
    - name: גבוה–נמוך
      text: >-
        כולם עומדים. ב״גבוה״ נמתחים על קצות האצבעות, ב״נמוך״ מתכופפים עד הרצפה — וכל סבב מהר יותר.
    - name: נשימת בלון
      text: יד על הבטן. שואפים לאט עד ארבע ומנפחים ״בלון״ בבטן, ונושפים לאט עד שש. חמש פעמים.
    - name: מחיאה בשרשרת
      text: מחיאת כף עוברת מתלמיד לתלמיד לאורך הכיתה. בסבב השני — מהר יותר, ובשלישי — בשתי מחיאות.
  from: letter

