sub: >-
  גוף שמשתנה הוא חלק מהגדילה של כולנו. בשיעור הזה קוראים את היומן של יובל, מנחשים אם נכתב בידי בן או
  בת, וממיינים יחד את השינויים של גיל ההתבגרות — מה דומה ומה שונה.
format: קריאה אישית, זוגות ומליאה
question: מה משתנה בגוף בגיל ההתבגרות — ומה דומה בין בנים לבנות?
takeaways:
  - גם בנים וגם בנות מתפתחים בגיל ההתבגרות — חלק מהשינויים דומים, וחלקם שונים.
  - ״רק בנים״ ו״רק בנות״ הם לא פעם הכללה — כדאי לשים לידם סימן שאלה.
  - מבוכה, סקרנות והתרגשות הן תחושות טבעיות, וכל אחד מתפתח בקצב שלו.
prep:
  - חלוקה מראש לזוגות לפי השולחנות
  - טבלה ריקה על הלוח לפני השיעור — שלושה טורים, ״אצל בנות״ · ״אצל שניהם״ · ״אצל בנים״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — שינויים בגוף בגיל ההתבגרות, כולל איברי המין, וסת וקרי לילה, בכיתה מעורבת.
      שאלי מי בכיתה שהנושא קרוב אליו מדי: מי שהתפתח מוקדם או מאוחר ושומע על זה הערות, מי שעבר פגיעה, ומי
      שהחלוקה לבנים ולבנות לא פשוטה בשבילו. בדקי איתה אם ההורים יודעים שהיחידה מתקיימת, בקשי שתהיה זמינה
      אחרי השיעור, וסכמי איתה מי עונה על שאלות שלא ידעת לענות עליהן.
  - head: מי עלול להיפגע
    text: >-
      בכיתה ו׳ ההבדלים בקצב ההתפתחות גדולים, ומי שמתפתח מוקדם או מאוחר עלול להרגיש חשוף. מדברים על בנים
      ובנות בגיל הזה, אף פעם לא על מי שבחדר, ולא משווים בין תלמידים. הקטע ביומן על תחושה באיבר המין עלול
      לעורר צחקוקים — תני להם שם (״זה מביך, וזה בסדר״) והמשיכי. הערה על הגוף של מישהו — עוצרים מיד.
  - head: לא לוחצים לשתף
    text: >-
      שלושת כללי השיח של היום על השקף הראשון: לא צוחקים על אף אחד, לא שואלים אף אחד על הגוף שלו, ומשתמשים
      במילים הנכונות. אף אחד לא נשאל מה קורה לו. התשובות על היומן נשארות במחברת; משתפים רק מתנדבים, מותר לוותר,
      ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל נגיעה לא רצויה, הצקות קבועות על הגוף, או דאגה גדולה מהשינויים — עוצרים בעדינות, מודים, וממשיכים
      בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

