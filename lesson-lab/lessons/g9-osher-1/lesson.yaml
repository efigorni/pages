steps:
  # ------------------------------------------------------------------ 0′–8′
  - id: song
    title: רגע של אושר
    minutes: 8
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      שומעים את ״אבן על אבן (רגע של אושר)״ של עידן רייכל; לבד, בזוגות ובמליאה — מתי הרגשתי לאחרונה רגע של
      אושר, ומה היה בו
    body:
      - moves:
          - >-
            לפני השיר — שני כללים לשיחות של היום, מתוך ״הנחיות לשיח מיטבי״ של המקור: מקשיבים בסקרנות ובלי לשפוט,
            ומספרים רק על עצמנו.
          - הציגי את השאלה שלפני השיר, והשמיעי אותו. בעצירה — שאלי, ותני לשניים־שלושה לענות; אחר כך עד הסוף.
          - >-
            אחרי השיר — השקף הבא: דקה של כתיבה בשקט, דקה בזוגות, ושניים־שלושה מתנדבים במליאה. הדהדי כל תשובה.
      - video:
          title: אבן על אבן (רגע של אושר) — עידן רייכל
          url: https://www.youtube.com/watch?v=NIi29Qeqlis
          length: "3:17"
          before: מה זה, בשבילכם, ״רגע של אושר״?
          watch: הקשיבו למילים — מה השיר אומר על הדרך אל רגע של אושר?
          pauses:
            - at: "?"
              moment: >-
                סוף הפזמון הראשון — אחרי ״ואל תפחד מהעצב, תמיד הוא ילך ושוב יבוא״. האזיני לשיר לפני השיעור,
                ורשמי כאן את הזמן.
              ask: עד עכשיו — האושר בשיר מגיע לבד, או שבונים אותו? מילה אחת, בלחישה לשכן.
          alt: דמות יושבת מול מחשב נייד, ועל המסך שמש
          art:
            - {use: kid-sit, x: 24, y: 170, w: 200, color: purple}
            - {use: laptop, x: 230, y: 223, w: 370}
            - {use: sun, x: 355, y: 257, w: 120}
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מתי לאחרונה הרגשתם ״רגע של אושר״?
          sub: מה היה בו — ואילו עוד רגשות הרגשתם באותו רגע?
          points:
            - לבד, בכתב — דקה
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי השיר —
          alt: דמות חושבת, ובענן המחשבה שלה כוכב
          art:
            - {use: thought, x: 30, y: 24, w: 320}
            - {use: star, x: 125, y: 97, w: 110}
            - {use: kid-stand, x: 400, y: 236, w: 140, color: teal}
      - ladder:
          help: חשבו על השבוע האחרון — מתי חייכתם או צחקתם באמת? מה קרה שם?
          challenge: הרגע הזה ״קרה לכם״ — או שעשיתם משהו כדי שיקרה?
      - say: >-
          לכל אחד יש רגעים כאלה. אבל מה זה בעצם אושר? כל קבוצה תבדוק את זה עכשיו בדרך אחרת.

  # ------------------------------------------------------------------ 8′–16′
  - id: cards
    title: ארבע דרכים לשאול מהו אושר
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - דיפרנציאליות וגיוון
    summary: >-
      בקבוצות, כרטיס אחד לכל קבוצה — דף מידע, היגדים, ציור או ראיונות — וכל קבוצה מנסחת משפט ״אושר הוא…״
    body:
      - moves:
          - >-
            הסבירי את המשימה לפני שמחלקים את הכרטיסים: כל קבוצה עונה על אותה שאלה בדרך אחרת, ובסוף מנסחת משפט אחד.
          - חלקי לכל קבוצה כרטיס, ולקבוצות של כרטיסים 1–2 גם את הדף שלהן. הטיימר — שש דקות.
          - הסתובבי בין הקבוצות. דקה לפני הסוף — הזכירי לנסח את המשפט ולבחור מי מקריא.
      - whisper: >-
          לפי המקור, כרטיסים 1–2 דורשים יותר ידע ומיומנויות. תני אותם לקבוצות שיצליחו בהם, כדי שאף קבוצה לא
          תתסכל.
      - slide:
          kicker: בקבוצות · 6 דקות
          title: ארבע דרכים לשאול מהו אושר
          sub: מידע · היגדים · ציור · ראיונות — ובסוף משפט אחד, ״אושר הוא…״.
          timer: 360
          alt: ארבעה סביב שולחן עגול, ודף לידם
          art:
            - {use: circle4, x: 140, y: 170, w: 320}
            - {use: note, x: 460, y: 30, w: 140}
      - say: >-
          כל קבוצה מקבלת כרטיס אחר, אבל כולן עונות על אותה שאלה — מהו אושר? בסוף כל קבוצה מנסחת משפט אחד שמתחיל
          ב״אושר הוא…״, ובוחרת מי מקריא אותו.
      - task:
          what: >-
            כל קבוצה עובדת לפי הכרטיס שקיבלה — דף מידע, היגדים, ציור או ראיונות — ומסיימת במשפט אחד: ״אושר הוא…״.
          time: 6 דקות
          group: קבוצות של 3–4 לפי השולחנות; כל כרטיס לשתיים–שלוש קבוצות
          rules: >-
            כותב אחד בקבוצה; כל אחד אומר משהו לפני שמנסחים את המשפט; מי שמסיים מוקדם — מוסיף למשפט דוגמה מהחיים
          plenary: קבוצה אחת מכל כרטיס מקריאה את המשפט שלה
          help: התחילו מדוגמה — מתי ראיתם מישהו מאושר? מה ראו עליו, ומה הוא הרגיש?
          challenge: הוסיפו למשפט שלכם גם מה אושר איננו.
      - handout:
          title: כרטיסי המשימה
          copies: עותק אחד, גזור לארבעה כרטיסים — כרטיס לכל קבוצה, לפי החלוקה שהכנת
          lines: false
          items:
            - >-
              **מידע.** קראו את דף המידע על אושר, וענו יחד: מהו אושר? מהם הסימנים הפנימיים והחיצוניים שלו? מה
              מגביר את תחושת האושר, לפי חוקרי הפסיכולוגיה החיובית? ואיך אתם הייתם מגדירים אושר — ולמה?
            - >-
              **היגדים.** קראו את שבעת ההיגדים על אושר. בחרו שניים־שלושה שהכי התחברתם אליהם, והסבירו דרכם מהו
              אושר.
            - >-
              **ציור.** כל אחד מצייר תמונה אחת שמייצגת בשבילו אושר — או מתאר אותה במילים. הניחו את התמונות יחד על
              דף אחד, ותנו לו כותרת.
            - >-
              **ראיונות.** בזוגות בתוך הקבוצה — ראיינו זה את זה: מה גורם לכם אושר? מה עושה אתכם מאושרים? כתבו את
              התשובות, מצאו מה דומה ביניהן, וחלקו אותן לסוגים.
      - handout:
          title: דף מידע — לקבוצות של כרטיס 1
          copies: עותק לכל קבוצה של כרטיס 1
          verbatim: true
          lines: false
          items:
            - אושר הוא רגש חיובי, הקשור בשמחה, הנאה וסיפוק. רגש של שמחה, שביעות רצון ורוממות רוח.
            - >-
              מאפייני האושר: האושר מתאפיין בהרגשה חזקה של שמחת חיים. הסימנים הפנימיים שלו הם תחושות של התלהבות,
              רוגע או תקווה, והחיצוניים — חיוך או צחוק.
            - אושר נקשר עם הרגשה כללית טובה, בריאות, ביטחון, תענוג, שביעות רצון, שלוות נפש ואהבה.
            - >-
              חוקרי הפסיכולוגיה החיובית מצאו מספר גורמים שמגבירים את תחושת האושר וביניהם התמקדות ושימת לב מכוונת
              על הדברים החיוביים היום־יומיים: בריאות, משפחה, חברים, בית וכו׳. גם מעשים כמו מתן יחס חיובי לאנשים
              אחרים, מפגשים עם חברים, עיסוק בתחביבים והתנדבות — מגבירים את תחושת האושר.
      - handout:
          title: היגדים — לקבוצות של כרטיס 2
          copies: עותק לכל קבוצה של כרטיס 2
          verbatim: true
          lines: false
          items:
            - ״האושר הוא משמעותם ומטרתם של החיים״ — אריסטו
            - ״אושר הוא לא דבר מוכן. הוא מגיע כתוצאה מהמעשים שלך״ — הדלאי למה
            - ״הסוד שבאושר לא טמון בעשיית מה שאנחנו אוהבים, אלא באהבה של מה שאנחנו עושים״ — ג׳יימס ברי
            - >-
              ״כל אחד רוצה להגיע לפסגת ההר, אבל האושר האמיתי, תחושת הסיפוק והקידום מתרחשים בעיקר בזמן הטיפוס״ —
              אנונימי
            - ״אושר אינו כאשר אנו מקבלים מה שאנחנו רוצים, אלא כשאנחנו מרוצים ממה שאנחנו מקבלים״ — רובין שארמה
            - ״העשב הוא תמיד ירוק יותר במקום שבו אתה משקה אותו״ — אנונימי
            - ״לא מה שיש לנו גורם לאושר, אלא הרמה שבה אנו נהנים ממנו״ — צ׳ארלס ספורגאון
      - say: עצרו. נשמע קבוצה מכל כרטיס — האם ארבע הדרכים הובילו לאותו מקום?

  # ------------------------------------------------------------------ 16′–22′
  - id: share
    title: מה גילינו?
    minutes: 6
    practices:
      - מהלכי שיח
      - זמן חשיבה
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: קבוצה מכל כרטיס מקריאה את המשפט שלה; משווים להגדרה של המקור — מה דומה, ומה חסר
    body:
      - slide:
          kicker: מה גילינו? · קבוצה מכל כרטיס
          title: אושר הוא…
          sub: משפט אחד מכל קבוצה — ומה הוביל אתכם אליו.
          echo: true
          alt: שלוש דמויות, ומעליהן בועת דיבור — ״אושר הוא…״
          art:
            - {use: group3, x: 130, y: 246, w: 360}
            - {use: speech, x: 330, y: 20, w: 260}
            - text: אושר הוא…
              x: 460
              y: 122
              size: 40
      - moves:
          - קבוצה אחת מכל כרטיס מקריאה את המשפט שלה. רשמי על הלוח מילה או שתיים מכל משפט.
          - הציגי את ההגדרה של המקור, והקריאי אותה. שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב לה — ״מי מסכים? מי רואה את זה אחרת?״
      - slide:
          kicker: ראינו ש…
          title: אושר הוא רגש חיובי
          sub: הקשור בשמחה, הנאה, סיפוק, שביעות רצון ורוממות רוח.
          verbatim: true
          echo: true
          cue: אחרי המשפטים של הקבוצות —
          alt: פנים מחייכות, ולב לידן
          art:
            - {use: face-happy, x: 290, y: 130, w: 280}
            - {use: heart, x: 70, y: 266, w: 160}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: |-
            אושר הוא רגש חיובי הקשור בשמחה, הנאה, סיפוק, שביעות רצון ורוממות רוח.
            לאושר יש סממנים פנימיים כמו תחושות של התלהבות, רוגע או תקווה, וסממנים חיצוניים כמו חיוך או צחוק.
            האושר ייחודי בכך שהוא נחשב כמטרה בפני עצמה – בני האדם שואפים להיות מאושרים ופועלים כדי ליצור מצבים שבהם ירגישו מאושרים.
      - ask: מה מהמשפטים שלכם מופיע גם בהגדרה — ומה יש אצלכם וחסר בה?
      - say: >-
          ההגדרה אומרת שבני האדם פועלים כדי ליצור מצבים שבהם ירגישו מאושרים. כלומר — אולי אפשר להשפיע על האושר?
          בואו נבדוק.

  # ------------------------------------------------------------------ 22′–27′
  - id: inhands
    title: זה בידנו
    minutes: 5
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      ההסבר של המקור — אפשר להשפיע על תחושת האושר — ותרגול קצר: כל אחד נזכר ברגע ״קטן״ מהיום
    body:
      - slide:
          kicker: שימו לב
          title: אנחנו יכולים להשפיע על תחושת האושר שלנו
          sub: זה בידנו!
          verbatim: true
          echo: true
          alt: דמות מרימה יד אל שמש גדולה
          art:
            - {use: sun, x: 90, y: 50, w: 220}
            - {use: kid-hand, x: 380, y: 216, w: 150, color: teal}
      - quote:
          title: ההסבר מהמקור — להקריא
          text: |-
            אנחנו יכולים להשפיע על תחושת האושר שלנו. זה בידנו!
            אם נתמקד ונשים לב, באופן מכוון, לרגעים ודברים חיוביים, פשוטים, שקורים לנו ביום יום – נגביר את תחושת האושר שלנו.
            גם המעשים שאנו עושים/ות משפיעים על תחושת האושר.
            כשאנחנו מעניקים/ות יחס טוב לאחר, מאירים/ות פנים, מתנדבים/ות, מבלים/ות עם המשפחה והחברים ועוסקים/ות בתחביבים ובתחומי העניין שלנו - אנחנו מגבירים/ות את תחושת האושר שלנו!
      - moves:
          - הקריאי את ההסבר, ועברי לשקף התרגול.
          - >-
            עשרים שניות של שקט — כל אחד מחפש רגע אחד מהיום. אחר כך ״מי מצא?״ — ספרי בקול את הידיים המורמות
            (״אני רואה שלוש… שש…״), וחכי לעוד.
          - שמעי שניים־שלושה רגעים, ושאלי איך הייתה ההתנסות.
      - slide:
          kicker: נתרגל · לבד, בשקט
          title: חשבו על רגע ״קטן״ מהיום
          sub: רגע של סיפוק, נחת, שמחה או גאווה — בבוקר, בדרך, בהפסקה או בשיעור.
          echo: true
          cue: אחרי ההסבר —
          alt: בית ספר, וכוכב קטן מעליו
          art:
            - {use: star, x: 50, y: 60, w: 140}
            - {use: school, x: 200, y: 200, w: 380}
      - ladder:
          help: חשבו על הבוקר — משהו טעים, מילה טובה, שיר ששמעתם בדרך.
          challenge: מה עשיתם אתם, שעזר לרגע הזה לקרות?
      - ask: הצלחתם? איך הייתה ההתנסות הזו בשבילכם?
      - say: זה תרגול קטן — וכמו בכל תרגול, ככל שעושים אותו יותר, מוצאים יותר רגעים כאלה.

