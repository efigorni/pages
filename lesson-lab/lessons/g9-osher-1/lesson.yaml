sub: >-
  מה זה בעצם אושר — ואפשר להשפיע עליו? בשיעור הזה מאזינים לשיר ״רגע של אושר״, מחפשים הגדרה לאושר בארבע
  דרכים שונות, ומתרגלים לשים לב לרגע טוב קטן מהיום.
format: מליאה, זוגות וקבוצות
question: מהו אושר — ואיך אפשר להרגיש אותו יותר?
takeaways:
  - אושר הוא רגש חיובי — שמחה, הנאה, סיפוק — ויש לו סימנים בפנים ובחוץ.
  - כל אחד מגדיר אושר קצת אחרת, ובכל זאת יש בהגדרות שלנו הרבה משותף.
  - אפשר להשפיע על תחושת האושר — כששמים לב לרגעים טובים קטנים, ובמעשים שלנו.
prep:
  - >-
    חלוקה מראש לקבוצות של 3–4 לפי השולחנות, ואיזה כרטיס מקבלת כל קבוצה — כל כרטיס לשתיים–שלוש קבוצות;
    כרטיסים 1–2 לקבוצות שאוהבות לקרוא ולחשוב בהפשטה
  - דף ריק וצבעים לכל קבוצה של כרטיס 3

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״עוד קבוצות מציגות״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - song
      - cards
    text: >-
      אחרי השיר מדלגים על הזוגות — כותבים דקה, ושניים משתפים במליאה; והעבודה בקבוצות מתקצרת ל־5 דקות

brain_break:
  signs: ראשים על השולחן, פיהוקים, שקט כבד אחרי כל שאלה.
  ideas:
    - name: שם באוויר
      text: כל אחד ״כותב״ באוויר את השם שלו — פעם ביד ימין, פעם ביד שמאל ופעם במרפק.
    - name: עשר ועשר
      text: עומדים ליד הכיסא — עשר קפיצות קטנות במקום, עשר טפיחות על הכתפיים, ומתיישבים.
    - name: חמש נשימות
      text: שואפים באף לאט עד ארבע, ונושפים בפה עד שש. חמש פעמים — מי שרוצה, בעיניים עצומות.
  from: week

