grade: 5
grades_served:
- 5
slide_kickers: false
month: מאי
section: חברות, סובלנות ומניעת אלימות (מאי)
unit: הדרך אל האחר מתחילה בי
src_text: sources/text/5/Mitnaschim_Misrey_Ani.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/5Grade/Mamlachti/Mitnaschim_Misrey_Ani.pptx
sensitivity: med
sub: יוצרים זוגות קלפים של ניסוח מאשים וניסוח אישי, משחקים, בודקים ומנסחים בחירה מעשית לשיחה הבאה.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך מתרגלים מסרי אני עד שהם נעשים זמינים בשיחה?
takeaways:
- כשאנחנו בוחרים במסרי "אני" – אנחנו מתארים את הקושי שלנו, את הצורך שלנו או את מה שאנחנו מרגישים – מי
  שמולנו מצליח לשמוע אותנו. הוא לא מותקף ולא מרגיש מואשם.
- תרגול ובדיקה של ניסוח עוזרים להכין בקשה ברורה לשיחה.
prep:
- שישה כרטיסים ריקים לכל רביעייה; רשימת שלושת המצבים על הלוח
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: speech
    x: 180
    y: 120
    w: 250
  alt: בועת דיבור
steps:
- id: part-1
  title: מהו מסר אישי?
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: מהו מסר אישי? — מה כדאי לדעת לפני שמנסחים מסר?
  body:
  - slide:
      title: מה כדאי לדעת לפני שמנסחים מסר?
      art:
      - use: speech
        x: 180
        y: 120
        w: 250
      alt: בועת דיבור
      echo: true
  - moves:
    - 'תני דוגמה קצרה: אני מאוכזב כשהתור שלי עובר, כי חשוב לי להשתתף; אפשר לקבוע תור?'
    - כל תלמיד מזהה בכתב רגש ובקשה.
    - הגדירי במפורש את ארבעת החלקים כדי שלא יהיה צורך בשיעור קודם.
  - ask: מה כדאי לדעת לפני שמנסחים מסר?
  - ladder:
      help: חפשו מילת רגש ופעולה שמבקשים.
      challenge: איזה חלק מתאר עובדה ולא שיפוט על החבר?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: יוצרים זוגות קלפים
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: יוצרים זוגות קלפים — איך משנים האשמה לתיאור צורך?
  body:
  - slide:
      title: איך משנים האשמה לתיאור צורך?
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף
      echo: true
      sub: ''
  - moves:
    - 'חלקי לכל רביעייה שלושה מצבים: הפרעה לעבודה, איחור לפגישה, השתלטות על זמן טלוויזיה.'
    - כתבו לכל מצב קלף בניסוח מאשים וקלף במסר אישי עם רגש, אירוע, צורך ובקשה.
    - עברי בין הקבוצות ובדקי שאיני מרגיש שאתה אינו מסתיר האשמה.
  - ask: איך משנים האשמה לתיאור צורך?
  - task:
      what: 'צרו שלושה זוגות קלפים: בכל זוג ניסוח מאשים ומסר אני לאותו מצב, עם רגש, אירוע, צורך ובקשה.'
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: 'התחילו ברגש: אכזבה, תסכול או דאגה.'
      challenge: איך תנסחו בקשה ברורה בלי להכתיב לאחר מה עליו להרגיש?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: משחק זיכרון עם בדיקה
  minutes: 8
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: משחק זיכרון עם בדיקה — איך יודעים שהקלפים באמת מתאימים?
  body:
  - slide:
      title: איך יודעים שהקלפים באמת מתאימים?
      art:
      - use: puzzle
        x: 180
        y: 120
        w: 250
      alt: חלק פאזל
      echo: true
      sub: ''
  - moves:
    - החליפי את חבילת ששת הקלפים בין קבוצות סמוכות.
    - בכל תור הופכים שניים.
    - זוג נשמר רק אחרי שהשחקן מסביר איזה צורך מחבר ביניהם.
    - אם המסר חסר או מאשים, הקבוצה מציעה תיקון יחד.
    - אין דירוג בין הקבוצות.
  - ask: איך יודעים שהקלפים באמת מתאימים?
  - task:
      what: שחקו בחבילת הקבוצה השכנה. שמרו זוג רק לאחר הסבר ההתאמה; הציעו תיקון למסר שחסר בו חלק.
      time: 5 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות; חבילת שישה קלפים אחת לכל רביעייה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: איזה אירוע חוזר בשני הקלפים?
      challenge: האם יכולים להיות שני מסרי אני מתאימים לאותה האשמה?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: מקלף לשיחה
  minutes: 6
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מקלף לשיחה — מה יעזור להשתמש בניסוח בזמן אמת?
  body:
  - slide:
      title: מה יעזור להשתמש בניסוח בזמן אמת?
      art:
      - use: pair
        x: 180
        y: 120
        w: 250
      alt: זוג
      echo: true
      sub: ''
  - moves:
    - כל זוג בוחר קלף ומתרגל אותו בקול רגוע; בן הזוג משיב בבקשה משלו.
    - שאלי מה יעזור לזכור את הכלי ברגע של כעס.
    - במליאה כתבי שני כללים מעשיים, בלי לדרוש אמנה מחייבת או חשיפה אישית.
  - ask: מה יעזור להשתמש בניסוח בזמן אמת?
  - task:
      what: בחרו זוג קלפים ותרגלו שיחה. כל צד מביע צורך ובקשה; הציעו דרך לזכור את הכלי בזמן כעס.
      time: 3 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: אפשר לעצור ולנסח משפט לפני שעונים.
      challenge: איך תישארו ברורים גם אם הצד השני אינו מסכים?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - tip: הכלי מסייע לבחירה ולהקשבה, אך אינו מבטיח שליטה באחרים או פתרון. האחריות לפגיעה היא של הפוגע;
      כשיש פגיעה או חשש פונים למבוגר.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - כשאנחנו בוחרים במסרי "אני" – אנחנו מתארים את הקושי שלנו, את הצורך שלנו או את מה שאנחנו מרגישים
        – מי שמולנו מצליח לשמוע אותנו. הוא לא מותקף ולא מרגיש מואשם.
      - כשאנחנו בוחרים במסרי "את/ה" – אנחנו מאשימים, תוקפים ומביעים חוסר שביעות רצון ממי שנמצא מולנו וזה
        גורם לו לתקוף אותנו חזרה, או להסתגר ולא לדבר אתנו.
      - במצבים של עימות - מסרי את/ה מובילים להסלמת העימות ואילו 'מסרי אני' מובילים לפתרון העימות. הבחירה
        היא שלנו. לפני שנענה לאחר, נחשוב היטב לאן אנחנו רוצים להוביל את האירוע – עימות או פתרון.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - בחרו מצב חדש ונסחו מסר אני קצר.
      - מה יעזור לכם לעצור לפני תגובה מאשימה?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: תרגול בדמויות דמיוניות; מסר מכבד אינו מבטיח הסכמה ואינו תחליף לעזרת מבוגר בפגיעה.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
