sensitivity: low-med

sub: >-
  בדרך ללמידה יש אור ירוק, פקקים וסיבובי פרסה. בשיעור הזה משחקים בקלפי תמרורים, נזכרים איך יצאנו
  בעבר מ״פקק״, ולומדים ארבע מילים שנותנות כוח כשנתקעים.
format: קבוצות, לבד ומליאה
question: מה עזר לי לצאת מ״פקק״ בלמידה — ואיך אפשר להיעזר בזה היום?
takeaways:
  - לכל אחד יש כוחות שכבר עזרו לו לצאת מ״פקק״ בלמידה — ואפשר להיעזר בהם שוב.
  - אין דרך אחת להתמודד עם קושי, ואפשר ללמוד טיפים זה מזה.
  - >-
    פפ״אא — פרופורציה, פרספקטיבה, אלטרנטיבה ואמונה — עוזרת לראות קושי אחרת ולמצוא דרך להמשיך.
prep:
  - חלוקה מראש לקבוצות של 4–5 לפי השולחנות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה שבשיעור התלמידים מספרים בקבוצות על רגעים שבהם נתקעו בלמידה, וכותבים על קושי לימודי
      שלהם. שאלי מי בכיתה מתמודד עכשיו עם קושי כזה — לקות למידה, ציונים נמוכים או חרדת מבחנים — ובקשי
      שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהלמידה קשה לו, ומי שהדוגמה ״קיבלתי 60 בבחינה״ קרובה אליו מדי — הציגי אותה כמשפט לדוגמה, לא
      כסיפור של מישהו בכיתה. בחפיסה אין קלף שחייבים לענות עליו: מחזירים ולוקחים אחר.
  - head: לא לוחצים לשתף
    text: >-
      בקבוצות מספרים רק מה שרוצים, ומי שמגיב מתייחס למה שנאמר בלי לשפוט. דף התרגול נשאר אצל התלמיד ולא
      נאסף; בזוגות עובדים רק מי ששניהם רוצים. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף מצוקה או פגיעה
    text: >-
      למשל ייאוש מהלימודים, לחץ קשה סביב ציונים או קושי בבית — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 13 דקות ומעלה — ההרחבה; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - cards
      - practice
    text: במשחק כל אחד הופך קלף אחד בלבד, ובתרגול כותבים רק את הקושי ומשפט ״אמונה״ אחד

brain_break:
  after: reflect
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: רמזור
      text: >-
        כשאת אומרת ״ירוק״ — צועדים במקום; ״צהוב״ — לאט; ״אדום״ — קופאים. מי שזז באדום — מתיישב.
    - name: מתיחה בשלוש
      text: קמים, מותחים ידיים למעלה, מתכופפים לימין ולשמאל, ובספירה עד שלוש מתיישבים.
    - name: חמש־ארבע־שלוש
      text: בשקט, כל אחד מוצא חמישה דברים שהוא רואה, ארבעה שהוא שומע ושלושה שהוא מרגיש בגוף.
  from: pairs

