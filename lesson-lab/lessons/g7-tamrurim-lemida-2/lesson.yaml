  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלושת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              כל אחד מתמודד עם אתגרי הלמידה באופן המתאים והנכון עבורו. אין צורת התמודדות אחת. חשוב לא להיות
              שיפוטיים או ביקורתיים כלפי עצמנו או כלפי אחרים.
            - >-
              תהליך הלמידה כולל רגשות חיוביים של הנאה, סיפוק, צמיחה, סקרנות וגם רגשות המתייחסים לקושי,
              תסכול, מאמץ, וחוסר הצלחה. לעיתים יש בנו רגשות סותרים המתקיימים במקביל.
            - >-
              מסע הלמידה — חשוב להתייחס ללמידה כאל תהליך התפתחותי — גם אם בעבר לא הצלחנו — נוכל להצליח
              בעתיד. שום ציון לא מגדיר אותנו, בטח לא ציון בודד. יש לנו הזדמנות לגלות כוחות וכישורים נוספים
              שיש בנו.
          ask: איזה משפט מהשלושה הייתם רוצים לזכור בפעם הבאה שתיתקעו? חשבו רגע, ואז הצביעו.
          tip: >-
            הראשון מחבר לטיפים מהקבוצות — אין דרך אחת להתמודד. השני מנרמל רגשות סותרים. השלישי חוזר
            ל־60: שום ציון לא מגדיר אותנו.
          alt: רמזור, ודמות עומדת לידו
          art:
            - {use: traffic-light, x: 320, y: 110, w: 150}
            - {use: kid-stand, x: 120, y: 236, w: 130, color: teal}

