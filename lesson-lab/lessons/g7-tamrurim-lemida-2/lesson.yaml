steps:
  # ------------------------------------------------------------------ 0′–3′
  - id: hook
    title: אילו תמרורים יש בדרך?
    minutes: 3
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: שאלה אחת על המסך — אם הלמידה היא דרך, אילו תמרורים יש בה? — ושלוש־ארבע תשובות
    body:
      - slide:
          kicker: מה הקשר?
          title: אם הלמידה היא דרך — אילו תמרורים יש בה?
          echo: true
          alt: דרך מתפתלת לאופק, רמזור מצד אחד ותמרור ״אין כניסה״ מהצד השני
          art: {file: art/road-signs.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי, וחכי עשר שניות של שקט לפני שאת מזמינה תשובות.
          - שמעי שלוש־ארבע תשובות, ובקשי לכל תמרור דוגמה מהלמידה (״פקק — כשלא הבנתי שברים״).
      - ask: אם הלמידה היא דרך — אילו תמרורים יש בה? ומתי פגשתם אחד כזה?
      - say: >-
          על זה בדיוק נשחק עכשיו: לכל קבוצה חפיסה של תמרורים, ומאחורי כל תמרור — שאלה על הדרך שלכם
          בלמידה.

  # ------------------------------------------------------------------ 3′–14′
  - id: cards
    title: קלפי תמרורים
    minutes: 11
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      בקבוצות, חפיסת תמרורים הפוכה — כל אחד בתורו הופך קלף ועונה, והבא בתור מגיב לפני שהוא הופך קלף
      משלו
    body:
      - moves:
          - הסבירי את המשחק לפני שמחלקים את החפיסות; הכללים נשארים על המסך כל הזמן.
          - קבוצות של 4–5 לפי השולחנות. כל קבוצה מקבלת חפיסה, והקלפים הפוכים על השולחן.
          - הסתובבי בין הקבוצות והקשיבי. קבוצה שנתקעת — הציעי לה לפתוח את התגובה ב״גם לי קרה…״.
          - דקה לפני הסוף — הודיעי, ובקשי מכל קבוצה לבחור טיפ אחד ששמעה.
      - slide:
          kicker: קלפי תמרורים · בקבוצות
          title: הופכים קלף — עונים — והבא מגיב
          points:
            - הופכים קלף ועונים על השאלה שעליו
            - הבא בתור מגיב למה שנאמר — ואז הופך קלף משלו
            - קלף שלא נוח לענות עליו — מחזירים ולוקחים אחר
          timer: 480
          echo: true
          alt: ארבעה סביב שולחן עגול, ושני קלפים לידם
          art:
            - {use: circle4, x: 60, y: 180, w: 300}
            - {use: note, x: 400, y: 80, w: 120, rotate: -12}
            - {use: note, x: 440, y: 250, w: 120, rotate: 10}
      - say: >-
          לכל קבוצה חפיסה הפוכה. הופכים קלף ועונים על השאלה — והבא בתור מגיב למה שנאמר, לפני שהוא הופך
          קלף משלו. מספרים רק מה שרוצים.
      - task:
          what: >-
            כל אחד בתורו הופך קלף תמרור ועונה על השאלה שעליו. הבא בתור מגיב — לקלף או לחוויה שתוארה — ואז
            הופך קלף משלו.
          time: 8 דקות
          group: קבוצות של 4–5 לפי השולחנות; חפיסה לכל קבוצה
          rules: >-
            מספרים רק מה שרוצים; קלף שלא נוח לענות עליו — מחזירים ולוקחים אחר; מקשיבים עד הסוף לפני
            שמגיבים
          plenary: כל קבוצה בוחרת טיפ אחד ששמעה — לשלב הבא
          help: לא עולה תשובה? ספרו על רגע אחד מהחודש האחרון שהקלף מזכיר לכם.
          challenge: איזה תמרור מתאר הכי טוב את הלמידה שלכם השבוע — ולמה?
      - handout:
          title: קלפי תמרורים
          copies: עותק לכל קבוצה, גזור ל־14 קלפים
          lines: false
          items:
            - >-
              **אור ירוק** — מתי קיבלתי ״אור ירוק״ על רעיון או עבודה שהצגתי?
            - >-
              **סע ישר** — לאן ארצה לנסוע?
            - >-
              **עצור** — מה עוצר אותי? מה מונע ממני להתקדם?
            - >-
              **זכות קדימה** — דוגמא להתקדמות בלימודים
            - >-
              **דרך לא סלולה** — איך אני מרגיש בדרך כזו? מה עוזר לי לצלוח את הדרך הזו?
            - >-
              **ללא מוצא** — האם פעם הרגשתי תחושה דומה בלימודים? מה עזר לי?
            - >-
              **דרך מפותלת** — מתי חוויתי ״פיתול״ בדרך הלימודית שלי? איך ידעתי שהפיתול הסתיים?
            - >-
              **סיבוב פרסה** — מתי בחרתי לעשות ״סיבוב פרסה״? האם בדיעבד זה היה רעיון טוב?
            - >-
              **דרך משובשת** — מתי תכננתי משהו והתכנון השתבש לי? איך התמודדתי?
            - >-
              **דרך מהירה** — איך הרגשתי באחת מההצלחות שלי?
            - >-
              **שדה תעופה** — לאן ארצה ״לעוף״? מה החלום שלי?
            - >-
              **אין כניסה** — ממה אמנע בלמידה? מה לא אעשה?
            - >-
              **עומס תנועה** — מתי הרגשתי שאני תקוע? איך יצאתי מהפקק?
            - >-
              **לימוד נהיגה** — מה אני אוהב ללמוד?
      - say: עצרו. כל קבוצה בוחרת טיפ אחד ששמעה — כזה שיכול להתאים גם למישהו אחר.

  # ------------------------------------------------------------------ 14′–17′
  - id: reflect
    title: טיפ מחבר
    minutes: 3
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: טיפ אחד מכל קבוצה, והכיתה מגיבה — מה מתאים גם לי?
    body:
      - slide:
          kicker: אחרי המשחק
          title: איזה טיפ שמעתם מחבר — שיכול להתאים גם לכם?
          echo: true
          alt: חבר מספר רעיון בבועת דיבור, ודמות מקשיבה
          art:
            - {use: speech, x: 280, y: 30, w: 280}
            - {use: bulb, x: 375, y: 66, w: 90}
            - {use: kid-stand, x: 450, y: 280, w: 115, color: orange}
            - {use: kid-stand, x: 120, y: 262, w: 125, color: teal}
      - moves:
          - חוזרים למקומות. שאלי, וחכי עשר שניות לפני שאת מזמינה תשובות.
          - שמעי טיפ מכל קבוצה. על כל טיפ — הדהדי, ושאלי מי עוד ניסה משהו כזה.
      - ask: איזה טיפ שמעתם מחבר בקבוצה — שיכול להתאים גם לכם?
      - say: אז הטיפ הוא ___ — הבנתי נכון? מי עוד ניסה משהו כזה? מה זה עשה לכם?
      - say: >-
          כל אחד מאיתנו כבר יצא פעם מ״פקק״ בלמידה, כל אחד בדרך שלו. עכשיו נלמד כלי אחד לרגעים שבהם נתקעים.

  # ------------------------------------------------------------------ 17′–21′
  - id: ppaa
    title: ארבע מילים שנותנות כוח
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      ״קיבלתי 60 בבחינה — ואני בחיים לא אצליח״: מפרידים בין נתון לפרשנות, והכיתה מנסחת משפט לכל אחת
      מארבע המילים
    body:
      - slide:
          kicker: רגע לומדים — מה זה פפ״אא?
          title: קיבלתי 60 בבחינה — ואני בחיים לא אצליח.
          sub: מה כאן נתון — ומה כאן פרשנות?
          echo: true
          alt: דף מבחן עם 60, ודמות שמעליה ענן מחשבה ובו ענן גשם
          art:
            - {use: thought, x: 110, y: 30, w: 280, flip: true}
            - {use: rain-cloud, x: 187, y: 82, w: 120}
            - {use: kid-stand, x: 70, y: 250, w: 130, color: teal}
            - {use: note, x: 420, y: 260, w: 150}
            - text: '60'
              x: 486
              y: 300
              size: 52
      - moves:
          - הציגי את המשפט. שאלי מה כאן נתון ומה פרשנות, וחכי עשר שניות.
          - >-
            חשפי את ארבע המילים אחת־אחת. על כל מילה — בקשי מהכיתה משפט על ה־60, ורשמי אחד על הלוח.
      - ask: מה כאן נתון — ומה כאן פרשנות?
      - slide:
          kicker: ארבע מילים שנותנות כוח
          title: פפ״אא
          points:
            - פרופורציה — כמה זה באמת גדול?
            - פרספקטיבה — איך זה ייראה בעוד שנה?
            - אלטרנטיבה — מה עוד אפשר לעשות?
            - אמונה — מה ייתן לי כוח?
          echo: true
          cue: אחרי ״נתון״ ו״פרשנות״ —
          alt: מפתח גדול, ומנעול לידו
          art:
            - {use: key, x: 120, y: 160, w: 320}
            - {use: lock, x: 430, y: 320, w: 130}
      - say: ארבע מילים שנותנות כוח — פרופורציה, פרספקטיבה, אלטרנטיבה ואמונה. ננסה כל אחת על ה־60.
      - p: 'אם הכיתה נתקעת — משפט לדוגמה לכל מילה:'
      - list:
          - >-
            **פרופורציה:** ״זה ציון אחד במבחן אחד — לא כל השנה.״
          - >-
            **פרספקטיבה:** ״בעוד שנה, מה אזכור מהמבחן הזה? כנראה רק מה שלמדתי ממנו.״
          - >-
            **אלטרנטיבה:** ״אפשר לבקש הסבר, ללמוד עם חבר או לתרגל עוד כמה תרגילים.״
          - >-
            **אמונה:** ״כבר הצלחתי בדברים שהיו לי קשים — אצליח גם בזה.״

  # ------------------------------------------------------------------ 21′–27′
  - id: practice
    title: זמן תרגול — הקושי שלי
    minutes: 6
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: כל אחד כותב קושי לימודי אחד שלו ומשפט לכל מילה; מתנדבים מקריאים את משפט ה״אמונה״
    body:
      - say: עכשיו תורכם — קושי לימודי אחד שלכם, ומשפט לכל אחת מארבע המילים.
      - slide:
          kicker: זמן תרגול · לבד
          title: הקושי שלי — ופפ״אא
          sub: כתבו קושי לימודי אחד, ומשפט לכל אחת מארבע המילים.
          timer: 240
          echo: true
          alt: תלמיד כותב ליד שולחן, ונורה דולקת לידו
          art:
            - {use: kid-desk, x: 280, y: 150, w: 260, color: teal}
            - {use: bulb, x: 90, y: 110, w: 130}
      - moves:
          - חלקי את הדף. כל אחד כותב לבד ובשקט; הדף נשאר אצלו ולא נאסף.
          - הסתובבי בין השולחנות. מי שתקוע במילה אחת — עובר לבאה.
          - בסוף — הזמיני שניים־שלושה מתנדבים להקריא רק את משפט ה״אמונה״ שלהם.
      - handout:
          title: זמן תרגול — פפ״אא
          copies: עותק לכל תלמיד
          verbatim: true
          items:
            - תיאור קושי לימודי
            - פרופורציה — איזה משפט יכול לעזור לך להכניס את הקושי לפרופורציה?
            - פרספקטיבה — איזה משפט יכול לעזור לך להסתכל על הקושי מפרספקטיבה רחבה יותר?
            - אלטרנטיבה — מה האפשרויות העומדות בפניך בהתמודדות עם הקושי?
            - אמונה — מה יחזק אותך? חשוב על משפט שיתן לך כח
      - ladder:
          help: התחילו מהמשפטים על ה־60 שעל הלוח, והחליפו בהם את הקושי שלכם.
