steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: join
    title: מצטרפים או לא?
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - עניין ורלוונטיות
    summary: >-
      בכניסה, כל אחד כותב לבד ליד שש קבוצות אם היה מצטרף; סופרים ידיים, ושואלים מה הכריע — ומה אם כבר
      הוסיפו אותנו
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: הזמינו אתכם בקישור. מצטרפים?
          sub: 'כתבו ליד כל שם שעל הלוח: מצטרף או לא.'
          timer: 180
          echo: true
          alt: טלפון עם הזמנה, ושלט כיוונים לידו
          art:
            - {use: phone-notify, x: 330, y: 110, w: 230}
            - {use: signpost, x: 70, y: 220, w: 180}
      - quote:
          title: שמות הקבוצות — כתובים על הלוח לפני השיעור, ולידם מקום לספירה
          text: |-
            עולים לז'!!! כל התלמידים בשכונה!
            השווים/ות של החטיבה הבאה
            ליבי, רעות וירדן - יחד כל הדרך לחטיבה
            כל מי שעולה לכיתת מנהיגות שטח
            #חטיבה- מצטרפים רק עם סלפי
            מי שלא כאן לא קיים!
      - moves:
          - >-
            השקף על המסך ושמות הקבוצות על הלוח כשהכיתה נכנסת. כותבים במחברת, לבד, בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות.
          - קראי שם אחד בכל פעם, ומי שכתב ״מצטרף״ מרים יד. רשמי את המספר ליד השם.
          - >-
            שאלי מה גרם להם להצטרף או לא. אחר כך בחרי קבוצה אחת, ושאלי מה היו עושים אילו כבר הוסיפו אותם
            אליה.
      - say: כל אחד מחליט לבד ובכתב — לפני שרואים מה החברים בוחרים.
      - ladder:
          help: מה השם של הקבוצה מבטיח לכם?
          challenge: על איזו קבוצה התלבטתם הכי הרבה — ומה הכריע?
      - ask: מה גרם לכם להצטרף — או לא להצטרף?
      - ask: >-
          ואם מישהו כבר הוסיף אתכם ל״מי שלא כאן לא קיים!״ — הייתם נשארים או יוצאים? ואיך מרגישים כשיוצאים
