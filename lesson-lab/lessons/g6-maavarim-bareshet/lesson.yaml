      - ask: מה גורם לכם לחשוב כך?
      - say: עכשיו נבדוק מה באמת מצאנו בקבוצה — ונשווה להשערות שעל הלוח.

  # ------------------------------------------------------------------ 10′–17′
  - id: who
    title: מי בקבוצה?
    minutes: 7
    practices:
