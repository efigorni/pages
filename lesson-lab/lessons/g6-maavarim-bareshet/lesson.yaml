      - say: קבוצה בלי כללים, שכל אחד יכול להצטרף אליה. אז מה שולחים בה?

  # ------------------------------------------------------------------ 17′–22′
  - id: sent
    title: מה שולחים בקבוצה?
    minutes: 5
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      שלוש הודעות מהקבוצה — הודעת שרשרת, תמונות מיום הולדת, ומשהו שלא מתאים לגיל — ושאלה אחת על כל אחת
    body:
      - moves:
          - >-
            הקריאי כל הודעה מהמסך בקול שקט, בלי להעצים. אחרי כל אחת — שאלה אחת, וחמש שניות לחשוב לפני
