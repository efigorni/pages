          title: מעיין קפלן
          sub: בן 16, משפיען רשת שאינו גר בשכונת נווה השרון
          verbatim: true
          echo: true
          cue: הדמות האחרונה —
          alt: טלפון עם התראה, וכוכב לידו
          art:
            - {use: phone-notify, x: 340, y: 110, w: 230}
            - {use: star, x: 80, y: 200, w: 180}
      - slide:
          kicker: חושבים ביחד · מי בקבוצה?
          title: אילו יתרונות — ואילו מורכבויות?
          sub: 'כולם באותה קבוצה: תלמידה, אמא, משפיען ואיש בן 42.'
          echo: true
          cue: אחרי ארבע הדמויות —
