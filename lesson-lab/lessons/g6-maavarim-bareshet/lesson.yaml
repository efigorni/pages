          art:
            - {use: teacher, x: 110, y: 170, w: 170, color: gray}
            - {use: laptop, x: 320, y: 120, w: 260}
      - slide:
          kicker: מי בקבוצה? · 3 מתוך 4
          title: מירב שאולי
          sub: >-
            בת 44, אמא של ינאי, תלמיד כיתה ו' בשכונה
          verbatim: true
          echo: true
          cue: הדמות הבאה —
          alt: מבוגרת עומדת, ובית לידה
          art:
            - {use: teacher, x: 110, y: 170, w: 170, color: moss}
