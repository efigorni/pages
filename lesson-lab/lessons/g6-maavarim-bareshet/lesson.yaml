    summary: שאלה אחת לפני שמצטרפים, ומה עושים כשמציעים להיפגש; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: מצטרפים לקבוצה?
          prompts:
            - שאלה אחת שאשאל את עצמי לפני שאצטרף לקבוצה חדשה.
            - מישהו זר מהקבוצה מציע להיפגש. מה אעשה?
            - רשות — משהו שהפתיע אותי היום.
          look_for: >-
            חפשי שאלות בדיקה ממשיות (מי מנהל, מי בקבוצה, מה המטרה) לעומת ״אבדוק אם זה בסדר״, ותשובה ברורה על
            מפגש — לא הולכים, או מתייעצים עם ההורים ואחד מהם מצטרף. פתק שמספר על מפגש שכבר נקבע, על פנייה של
            מבוגר זר, על תוכן מיני או על איום — עובר ליועצת עוד היום.
          timer: 180
          alt: מגן גדול, ודף כתוב לידו
          art:
            - {use: shield, x: 290, y: 90, w: 280}
            - {use: note, x: 60, y: 200, w: 160}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
