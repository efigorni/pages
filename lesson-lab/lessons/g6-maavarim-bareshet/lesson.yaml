  # לשמאל ומלמעלה עם כיוון השעון. התיקונים מוסיפים אותן למקור לפני ההשוואה.
  - from: "## שקף 30"
    to: |-
      ## שקף 30

      כל אחד רוצה להרגיש שייך ולדעת שרואים אותו – בכיתה, בחטיבה החדשה, ברשת. המעבר לחטיבה הוא הזדמנות נהדרת להרחיב את מעגל החברים והחברות!

      הצטרפות לקבוצות חדשות ברשת החברתית, לקראת המעבר לחטיבה היא הזדמנות להתכתב עם עוד תלמידים ותלמידות. אבל... צריך לבדוק טוב טוב מי בקבוצה, ולהימנע מפגישות ומהתכתבויות שיש בהן סיכון.

      מה שחשוב זו איכות הקבוצה ולא כמות המשתתפים בה או כמות הקבוצות בהן אנו משתתפים. יש לכם כלים וכוחות מצוינים להכיר חברות וחברים חדשים בדרכים בטוחות ומשמחות.
  - from: "לפני ההצטרפות לקבוצה אבדוק:"
    to: >-
      לפני ההצטרפות לקבוצה אבדוק: מה שם הקבוצה? מהי מטרת הקבוצה? מי מנהל/ים אותה? מי מאנשי הקשר שלי נמצאים
      בקבוצה? למה חשוב לי להצטרף לקבוצה?
  - from: "אחרי ההצטרפות לקבוצה אבדוק:"
    to: >-
      אחרי ההצטרפות לקבוצה אבדוק: מה משתפים בקבוצה? האם השיח מכבד? האם זמן שליחת ההודעות מתאים לי? כיצד
      אפעל במידה ונחשפתי לתכנים שאינם מתאימים לגיל שלי או לערכים שלי? למה חשוב לי להישאר בקבוצה?

sub: >-
  לפני המעבר לחטיבה מגיעות הרבה הזמנות לקבוצות. בשיעור הזה מחליטים אם להצטרף, מגלים מי ומה נמצא בקבוצה
  גדולה אחת, ולומדים מה בודקים לפני שמצטרפים — ואחרי.
format: לבד, זוגות ומליאה
question: איך מחליטים אם להצטרף לקבוצה גדולה ברשת — ומה בודקים כשכבר בפנים?
takeaways:
  - >-
    קבוצה חדשה לפני המעבר לחטיבה היא הזדמנות להכיר חברים — אבל בקבוצה גדולה יש גם אנשים שאנחנו לא מכירים.
  - >-
    לפני שמצטרפים בודקים מה שם הקבוצה ומה מטרתה, מי מנהל אותה ומי נמצא בה; ואחרי — אם השיח מכבד ומתאים לנו.
  - >-
    לא נפגשים עם מי שהכרנו רק ברשת, ולא מעבירים הודעות שרשרת. נתקלנו בפגיעה? מספרים למבוגר.
prep:
  - >-
    שמות שש הקבוצות (בשלב ״מצטרפים או לא?״) — כתובים על הלוח לפני השיעור, ולידם מקום לספירה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — קבוצות גדולות ברשת לפני המעבר לחטיבה, ובהן מבוגר זר, הודעת שרשרת מאיימת,
      הודעה שרומזת לסרטון מיני, והזמנה למפגש עם מי שלא מכירים. שאלי אם יש בכיתה מי שנפגע לאחרונה בקבוצה,
      מי שהוציאו אותו מקבוצה, או מי שבקשר עם מבוגר שהכיר ברשת. בקשי שתהיה זמינה אחרי השיעור, וסכמי איתה
      מראש מה עושים אם עולה חשד לפגיעה.
  - head: מי עלול להיפגע
    text: >-
      מי שהוציאו אותו מקבוצה, או שלא צירפו אותו, עלול להיפגע מ״מי שלא כאן לא קיים!״ ומהספירה — מדברים על
      השמות ועל ההחלטה, לא על מי בקבוצה של מי. מי שעדיין אין לו טלפון או ווטסאפ (גיל השימוש בווטסאפ הוא 13)
      — חלק מהשיחה בדיוק כמו כולם. את הודעת השרשרת ואת ההודעה על הסרטון מקריאים בשקט, בלי להרחיב.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. כשעולים מקרים דומים מהקבוצות של
      התלמידים — רק באופן כללי, בלי שמות, בלי צילומי מסך ובלי לספר על אחרים. מותר לוותר, ולא קוראים בשם למי
      שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל מבוגר שפונה אליו, מפגש שכבר נקבע, תוכן מיני שנשלח אליו או איום — עוצרים בעדינות, מודים, וממשיכים
      בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. אפשר להזכיר גם את
      ההורים ואת מוקד 105, שמטפל בפגיעה ברשת.

