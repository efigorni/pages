    body:
      - slide:
          kicker: חקר מקרה · משערים
          title: ״שכבות ו׳ נווה השרון״
          sub: כל תלמידי כיתות ו׳ בשכונה הוזמנו להצטרף.
          points:
            - מי לדעתכם נמצא בקבוצה?
            - מה לדעתכם שולחים בקבוצה?
            - כיצד מתנהלת הקבוצה?
          verbatim:
            - points
          echo: true
          alt: קבוצה גדולה של דמויות, ובועות צ׳אט מעליה
