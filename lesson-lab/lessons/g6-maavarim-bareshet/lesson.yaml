  # ------------------------------------------------------------------ 36′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ששת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          title: מה חשוב שנזכור?
          items:
            - |-
              ״איזה כיף להיות שייכים!״
              ״בקבוצה הגדולה יש המון אפשרויות!״
              ״וואו מדהים להיות הבוגרים של בית הספר!״
              ״מרגש שאוטוטו עוברים לחטיבה!״
            - >-
              כל אחד רוצה להרגיש שייך ולדעת שרואים אותו – בכיתה, בחטיבה החדשה, ברשת. המעבר לחטיבה הוא הזדמנות
              נהדרת להרחיב את מעגל החברים והחברות!
            - >-
              הצטרפות לקבוצות חדשות ברשת החברתית, לקראת המעבר לחטיבה היא הזדמנות להתכתב עם עוד תלמידים
              ותלמידות. אבל... צריך לבדוק טוב טוב מי בקבוצה, ולהימנע מפגישות ומהתכתבויות שיש בהן סיכון.
            - >-
              מה שחשוב זו איכות הקבוצה ולא כמות המשתתפים בה או כמות הקבוצות בהן אנו משתתפים. יש לכם כלים
              וכוחות מצוינים להכיר חברות וחברים חדשים בדרכים בטוחות ומשמחות.
            - |-
              מפעילים שיקול דעת וחשיבה ביקורתית לפני הצטרפות והשתתפות בקבוצות רבות משתתפים.
              לפני ההצטרפות לקבוצה אבדוק: מה שם הקבוצה? מהי מטרת הקבוצה? מי מנהל/ים אותה? מי מאנשי הקשר שלי נמצאים בקבוצה? למה חשוב לי להצטרף לקבוצה?
            - |-
              מפעילים שיקול דעת וחשיבה ביקורתית לאחר הצטרפות והשתתפות בקבוצות רבות משתתפים.
              אחרי ההצטרפות לקבוצה אבדוק: מה משתפים בקבוצה? האם השיח מכבד? האם זמן שליחת ההודעות מתאים לי? כיצד אפעל במידה ונחשפתי לתכנים שאינם מתאימים לגיל שלי או לערכים שלי? למה חשוב לי להישאר בקבוצה?
          ask: >-
            איזה משפט תרצו לזכור כשתגיע ההזמנה הבאה לקבוצה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מההתרגשות וההזדמנות (1–2), דרך הזהירות והאיכות (3–4), אל שתי רשימות בדיקה — לפני
            שמצטרפים ואחרי (5–6).
          alt: שלוש דמויות יחד, ועיגול עם וי לידן
          art:
            - {use: group3, x: 30, y: 230, w: 380}
            - {use: check, x: 420, y: 60, w: 170}

