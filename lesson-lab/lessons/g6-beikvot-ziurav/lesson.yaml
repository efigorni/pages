  # ------------------------------------------------------------------ +5′
  - id: hope
    title: תקווה לחיים — מבט שני
    kind: extension
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: חוזרים לציור ״תקווה לחיים״ — אילו חלקים יש בו, ואיך מתבטאים בו גם כאב וגם תקווה
    body:
      - slide:
          kicker: אם נשאר זמן · תקווה לחיים
          title: אילו חלקים יש בציור?
          sub: ומה מבטא כל חלק — כאב או תקווה?
          echo: true
          alt: נבט שצומח, ושמש מעליו
          art:
            - {use: sprout, x: 200, y: 200, w: 230}
            - {use: sun, x: 400, y: 40, w: 170}
      - moves:
          - עברי שוב במצגת המקורית לשקף 28. שאלי, וחכי עשר שניות לפני שאת מזמינה תשובות.
          - על כל חלק שהכיתה מזהה — שאלי מה הוא מבטא, ותני לתלמידים להגיב זה לזה.
          - סיימי בהקראת התיאור מהמקור.
      - ask: אילו חלקים אתם רואים בציור — ומה מבטא כל חלק?
      - quote:
          title: התיאור מהמקור — להקריא בסוף
          text: >-
            הציור מחולק לארבעה חלקים – הבובה בבגדי אסירים ועל הכובע שלה טלאי צהוב. היא נמצאת בעולם שחור ומפנה מבטה
            לקרקע, אל התקווה, אל הניצן שצומח מן האדמה. תקווה לפריחה, סמל האביב. בחלק השלישי, הבובה נעלמת, העשב
            צומח ורק הכובע נשאר כזיכרון. התכלת בחלק הרביעי של התמונה מביע תקווה לחיים. דרך הציור ניתן להביע רגשות
            שונים – של כאב ושל תקווה.
      - say: בציור אחד יש גם כאב וגם תקווה — וכך גם ביום הזיכרון.

