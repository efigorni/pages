sub: >-
  ביום השואה עוצרים כדי לזכור, ועולים בנו רגשות רבים. בשיעור הזה כותבים את מה שבלב, מתבוננים בשלושה ציורים
  של פאול קור, ולומדים מהם מה עוזר כשמשהו מעורר דאגה.
format: כתיבה אישית, זוגות ומליאה
question: מה מספרים לנו הציורים של פאול קור — ומה עוזר לנו להתמודד ברגעים של דאגה?
takeaways:
  - ביום השואה עוצרים כדי לזכור וללמוד על היהודים שחיו אז — וכל רגש שעולה בנו מקבל מקום.
  - גם ברגע קשה, מעשה קטן — כמו ילדה שלוקחת איתה את הבובה שלה — מחזיר קצת תחושת שליטה ונחמה.
  - יש דרכים להתמודד עם דאגה, ואנחנו לא לבד — אפשר לשתף מישהו קרוב.
prep:
  - >-
    לב מנייר לכל תלמיד, מונח על השולחן לפני שהכיתה נכנסת — דף לבבות להדפסה ולגזירה נמצא בשקף האחרון של
    המצגת המקורית
  - נייר דבק — הלבבות נתלים על הלוח
  - >-
    המצגת המקורית (הקישור בתחתית המערך) פתוחה בחלון שני. בה הציורים של פאול קור — שקף 19 (הציור הראשון),
    שקף 24 (הציור השני) ושקף 28 (״תקווה לחיים״)
  - >-
    כללי השיח — כתובים על הלוח לפני השיעור: מקשיבים בלי לשפוט · מכבדים כל מה שנכתב · מספרים רק על עצמנו ·
    מה שנאמר כאן נשאר בינינו

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — יום הזיכרון לשואה ולגבורה, דרך ציורים של משפחה שבורחת ושל ילדה ובובה. מפי
      איתה את מעגלי הפגיעות בכיתה: מי שבמשפחה שלו סיפור שואה כואב, מי שמתמודד עכשיו עם אבדן או עם חרדה, ומי
      שימים כאלה קשים לו. עם מי שצריך — שיחה קצרה לפני השיעור. עדכני את ההורים מראש מתי השיעור ועל מה, ובקשי
      מהיועצת להיות זמינה אחריו.
  - head: מי עלול להיפגע
    text: >-
      ילדים בגיל הזה שואלים לפעמים ״ומה אם זה יקרה שוב?״. עני ישירות וברוגע, כמו שהמקור מציע: היום יש לנו
      מדינה משלנו וצבא שמגן עלינו, השואה קרתה לפני שנים רבות ובארץ רחוקה, ואחריה הצליח העם היהודי להקים מדינה.
      על הציורים מדברים דרך מה שרואים בהם — דאגה, נחמה, תקווה — בלי להוסיף פרטים קשים. מי שקשה לו לכתוב על
      השואה כותב על ימי זיכרון בכלל.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר בינינו״. הלבבות בלי שם, ומותר להשאיר לב ריק.
      את הרגע של דאגה כותבים לעצמם, והכתיבה לא נאספת; בזוגות משתפים רק במה שעזר. לא קוראים בשם למי שלא
      הצביע.
  - head: אם מישהו מוצף או משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, ומשאירים לו מקום — בלי לחקור מול הכיתה. אחרי השיעור — שיחה אישית, והתייעצות עם
      היועצת עוד באותו יום, ובמידת הצורך גם עם הפסיכולוג של בית הספר. לא מבטיחים לשמור בסוד.

time:
