            מופיעה בובה ויש לה תפקיד אמנותי חשוב.
      - moves:
          - הקריאי את שני הקטעים. מי שמכיר את ״כספיון הדג הקטן״ — מרים יד.
          - עברי לחלון של המצגת המקורית, לשקף 19 — הציור הראשון. חצי דקה מתבוננים בשקט.
          - >-
            דקה וחצי כותבים במחברת, לפי שלוש השאלות שעל השקף במצגת המקורית. הסתובבי, ושימי לב למה שהם רואים בעיניים
            ובידיים של ההורים.
          - >-
            שמעי שלושה, והזמיני את הכיתה להגיב זה לזה. אחר כך חזרי למצגת, שאלי למה ההורים דואגים, והקריאי את
            ההסבר מהמקור.
      - say: >-
          התבוננו בציור בשקט, ואז כתבו: אילו רגשות עולים בכם? איך ההורים מרגישים — ומה בציור מראה את זה?
      - ladder:
          help: הסתכלו על העיניים ועל הידיים של ההורים — מה הן אומרות?
          challenge: מה ההורים יודעים, ומה הם עוד לא יודעים — ואיך זה נראה בציור?
      - slide:
          kicker: הציור הראשון
          title: מדוע לדעתכם עיני ההורים מביעות דאגה וחרדה?
          sub: משפחה יהודית נמלטת בעקבות שמועה על פינוי יהודים. חורף, קר, אירופה.
          verbatim: true
          cue: אחרי הכתיבה והשיתוף, בחזרה במצגת —
          echo: true
          alt: דרך מתפתלת אל האופק, וענן מחשבה ובו סימן שאלה
          art:
            - {use: road, x: 40, y: 220, w: 360}
            - {use: thought, x: 384, y: 40, w: 200}
            - text: '?'
              x: 484
              y: 114
              size: 90
      - quote:
          title: ההסבר מהמקור — להקריא
          text: >-
            ההורים דואגים משום שהם חוששים מהשמועות על פינוי היהודים. הם בורחים אל הלא נודע, ואינם יודעים מה יקרה
            ולאן יגיעו... בזמנים של משבר וקושי כאשר אדם נוקט במעשה, חוזרת אליו, ולו במעט, תחושת השליטה במצב.
      - say: >-
          גם הבריחה היא מעשה: כשעושים משהו, אפילו קטן, חוזרת קצת תחושת שליטה. בציור הבא נראה מעשה קטן מאוד — של
          ילדה.

  # ------------------------------------------------------------------ 16′–22′
  - id: doll
    title: הבובה של הילדה
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      בציור השני ילדה לוקחת איתה את הבובה — למה? ובציור ״תקווה לחיים״: דברים קטנים שעזרו להרגיש קצת יותר טוב
    body:
      - moves:
          - >-
            עברי במצגת המקורית לשקף 24 — הציור השני. חצי דקה של התבוננות בשקט, ואז שאלי איך מרגישים בני המשפחה
            ומה בציור מראה את זה. הקריאי את ההסבר על הצבע האדום.
          - חזרי למצגת לשאלה על הבובה. ספרי בלב עד עשר לפני שאת מזמינה תשובות, והדהדי.
          - >-
            אחרי שתיים–שלוש תשובות — הקריאי את ״חפץ אישי״, ועברי במצגת המקורית לשקף 28, ״תקווה לחיים״. שאלי מה
            חושבת הבובה ומה היא מרגישה.
          - חזרי למצגת, וחשפי את הדברים הקטנים שעזרו — אחד־אחד. סיימי בהקראת הקטע מהמקור.
      - quote:
          title: הציור השני — מהמקור, להקריא
          text: >-
            בני המשפחה יוצאים לדרך שאינם מכירים. הם אינם יודעים לאן יגיעו ומה יעלה בגורלם. הצבע האדום מציין את אי
            הוודאות.
      - slide:
          kicker: הציור השני
          title: מדוע לדעתכם הילדה לקחה את הבובה שלה איתה?
          echo: true
          alt: בובה, ולב לידה
          art: {file: art/doll-heart.svg}
      - quote:
          title: חפץ אישי — מהמקור, להקריא
          text: >-
            במצבי לחץ ומשבר חפץ אישי יכול להעניק תחושת ביטחון. הבובה העניקה לילדה תחושת נחמה ובטחון.
      - ask: בציור ״תקווה לחיים״ — מה לדעתכם חושבת הבובה, ומה היא מרגישה?
      - slide:
          kicker: תקווה לחיים
          title: דברים קטנים שעזרו, ולו במעט
          points:
            - לצייר, לדמיין ולחלום
            - להתפלל ולהאמין
            - לחשוב מחשבות מחזקות על המשפחות שלהם
            - או פשוט לחבק בובה
          verbatim: [points]
          cue: אחרי הציור ״תקווה לחיים״, בחזרה במצגת —
          echo: true
          alt: בובה מביטה בנבט שצומח
          art: {file: art/doll-sprout.svg}
      - quote:
          title: תקווה לחיים — מהמקור, להקריא
          text: >-
            בתקופת השואה, כשלא היו אפשרויות לפעול כדי לשנות את המצב, היו שניסו לעשות דברים קטנים שסייעו להם, ולו
            במעט, כדי להרגיש יותר טוב: לצייר, לדמיין ולחלום, להתפלל ולהאמין, לחשוב מחשבות מחזקות על המשפחות שלהם,
            או פשוט לחבק בובה, כפי שעשתה הילדה הקטנה שבציור.
      - say: >-
          כשאי אפשר היה לשנות את המצב, אנשים מצאו דברים קטנים שעזרו להם, ולו במעט. ומה עוזר לנו, כשמשהו מדאיג
          אותנו?

  # ------------------------------------------------------------------ 22′–27′
  - id: coping
    title: מה עוזר כשלא יודעים מה יקרה?
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: לבד, בזוגות ובמליאה — רגע של דאגה, ומה עזר; ובסוף — דרכי ההתמודדות של המקור
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה יכול לעזור במצבים של חוסר ודאות?
          sub: היזכרו ברגע שעורר בכם דאגה — ומה עזר לכם אז.
          points:
            - לבד — כותבים לעצמכם
            - בזוגות — משתפים רק במה שעזר
            - במליאה — רעיונות שקיבלתם
          echo: true
          alt: דמות עומדת מתחת למטרייה, וענן גשם מעליה
          art:
            - {use: rain-cloud, x: 370, y: 20, w: 190}
            - {use: umbrella, x: 180, y: 170, w: 240}
            - {use: kid-stand, x: 232, y: 230, w: 140, color: teal}
      - moves:
          - דקה של כתיבה בשקט, לעצמם — רגע של דאגה או של חוסר ודאות, ומה עזר. הכתיבה לא נאספת.
          - דקה בזוגות עם השכן — כל אחד משתף רק במה שעזר לו; את הרגע עצמו לא חייבים לספר.
          - >-
            במליאה — שמעי ארבעה–חמישה רעיונות, ורשמי אותם על הלוח. אחר כך הציגי את הדרכים מהמקור, וחברי אליהן את
            מה שעלה מהכיתה.
      - ladder:
          help: חשבו על רגע קטן — מבחן, מעבר כיתה, ריב עם חבר. מה עשיתם, או מה אמרתם לעצמכם?
          challenge: מה עוזר לכם כשאי אפשר לשנות את המצב — אלא רק את מה שקורה בתוככם?
      - ask: איזה רעיון שמעתם מבן הזוג — שתרצו לנסות?
      - slide:
          kicker: התמודדות במצבים של חוסר ודאות
          title: מעשים קטנים, ודברים שקורים בתוכנו
          points:
            - לבטא את עצמי בכתיבה ו/או בציור
            - לשתף מישהו ברגשות שלי
            - להגיד לעצמי מילים מעודדות
            - לקוות ולהאמין שיהיה טוב
          verbatim: [points]
          cue: אחרי השיתוף במליאה —
          echo: true
          alt: גלגל הצלה
          art: lifebuoy
      - p: >-
          במקור יש שבע דרכים, ועל המסך ארבע. את השלוש האחרות הוסיפי בעל פה — לדמיין את העתיד, לשמוע מוזיקה, ולשפר
          את ההרגשה דרך עיסוק בספורט.
      - say: יש הרבה דרכים להתמודד — ולכל אחד מתאימה דרך משלו.

