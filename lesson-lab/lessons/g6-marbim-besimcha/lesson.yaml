            - {use: sticky, x: 158, y: 166, w: 128}
            - {use: sticky, x: 326, y: 180, w: 128, color: teal}
      - moves:
          - חלקי שני פתקים בצבעים שונים לכל אחד — צבע אחד לתודה, צבע אחד לנתינה.
          - שתי דקות של כתיבה. מי שמסיים תולה את הפתקים על הלוח, בשני טורים.
          - הקריאי בקול כמה פתקים מכל טור, בלי שמות.
      - say: פתק אחד של תודה ופתק אחד של נתינה. בסוף נקרא כמה — ונראה כמה שמחה יש בלוח אחד.
      - task:
          what: >-
            כל אחד כותב על פתק אחד דבר שהוא מכיר עליו תודה, ועל פתק שני — משהו משמח שעשה למען אדם אחר; תולים
            על הלוח.
          time: 3 דקות
          group: לבד
          rules: בלי שמות; משהו מהשבוע האחרון, או מפעם
          plenary: קוראים בקול כמה פתקים מכל טור
          help: חשבו על אדם אחד שעשה לכם טוב השבוע — ועל מה תרצו להודות לו.
          challenge: כתבו גם מה הרגשתם כשנתתם — ומה לדעתכם הרגיש מי שקיבל.
      - ask: מה משותף לפתקים שעל הלוח?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ארבעת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - שמחה מרחיבה את הלב ומתעוררת אצל כל אדם בנסיבות שונות
            - מנהג משלוח המנות בפורים מכוון להביא לידי שמחה
            - משלוח של מילים טובות — גם הוא משמח ומרחיב את הלב
            - >-
              השמחה בידינו — אנחנו יכולים להוביל לכך שאנחנו ואחרים בסביבתנו נרגיש שמחה באמצעות פעולות יומיומיות
              יזומות
          ask: איזה משפט הכי נכון בשבילכם היום? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהשמחה של כל אחד (1), דרך משלוח המנות והמילים הטובות (2–3), אל השמחה שבידינו (4).
