sub: >-
  משנכנס אדר מרבים בשמחה. בשיעור הזה בודקים מה משמח כל אחד מאיתנו, מגלים שנתינה והכרת תודה מכניסות שמחה
  לחיים — ושולחים זה לזה משלוח מנות של מילים טובות.
format: כתיבה, רביעיות ומליאה
question: מה משמח אותנו — ואיך אפשר להכניס עוד שמחה לחיים שלנו ושל מי שסביבנו?
takeaways:
  - כל אחד מאיתנו שמח מדברים אחרים — וכדאי להכיר את מה שמשמח אותנו.
  - נתינה לאחר והכרת תודה הן שתי דרכים להכניס שמחה לחיים.
  - גם מילים טובות הן משלוח מנות — הן משמחות את מי שמקבל, וגם את מי שנותן.
prep:
  - חלוקה מראש לרביעיות לפי השולחנות
  - שלושה–ארבעה ריבועי נייר או פתקים לכל תלמיד — לכרטיסי ״משלוח של מילים טובות״
  - פתקים בשני צבעים, שניים לכל תלמיד (להרחבה ״תודה ונתינה״)

safe:
  - head: עמידה מול הכיתה
    text: >-
      בהרחבה ״מקורות השמחה״ מרימים יד לפי מה שהקיפו בלוח — וזו חשיפה קטנה מול הכיתה, למשל של מי שלא הקיף
      דבר שקשור למשפחה או לחברים. מרימים רק אם רוצים, ומי שלא מרים לא צריך להסביר. מתארים רק את הכיתה כולה,
      לא מישהו מסוים. מסבירים רק מתנדבים, ורק על עצמם. צחוק על יד מורמת או על יד שלא עלתה — עוצרים מיד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״מקורות השמחה״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - board
      - words
    text: >-
      בלוח השמחה מקריאים רק שמונה היגדים, ובמשלוח המילים הטובות כל אחד כותב שני כרטיסים — לשכנים שלו
      ברביעייה, מימין ומשמאל

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
    - name: מתיחה בשלוש
      text: קמים, מותחים ידיים למעלה, מתכופפים לימין ולשמאל, ובספירה עד שלוש מתיישבים.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
  from: thanks

