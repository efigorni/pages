          art:
            - {use: heart, x: 240, y: 170, w: 320}
            - {use: sun, x: 40, y: 40, w: 190}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — צידה לדרך
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: דבר משמח שאעשה יותר, ומשלוח של מילים טובות שאשלח השבוע; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: צידה לדרך
          prompts:
            - דבר אחד שמשמח אותי, שאעשה יותר השבוע — ומתי?
            - למי אשלח השבוע משלוח של מילים טובות — ומה ארצה לומר?
            - רשות — משהו שלמדתי על עצמי היום.
          look_for: >-
            חפשי כוונות כלליות מדי (״לשמוח יותר״) לעומת פעולה עם זמן, ופתק שכתוב בו שאין דבר שמשמח, או שאין
            למי לשלוח — עם אלה מדברים בשקט השבוע.
          timer: 180
          alt: דף עם שורות, ופנים שמחות לידו
          art:
            - {use: note, x: 290, y: 40, w: 256}
            - {use: face-happy, x: 50, y: 260, w: 210}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד. הכרטיסים של המילים הטובות נשארים אצל התלמידים.
      - tip: >-
          למי שרוצה להמשיך בבית — מכתב תודה אישי לאדם שהם מעריכים: כל הדברים הטובים שהם אוהבים ומעריכים בו, ואז
          להביא לו את המכתב.
