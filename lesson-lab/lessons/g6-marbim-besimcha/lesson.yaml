      - שיתופיות בלמידה
    summary: >-
      פתק אחד — דבר שאני מכיר עליו תודה, ופתק שני — משהו משמח שעשיתי למען אדם אחר; תולים על הלוח וקוראים
    body:
      - slide:
          kicker: אם נשאר זמן · תחושת שמחה בחיים
          title: פתק של תודה, פתק של נתינה
          sub: דבר אחד שאתם מכירים עליו תודה — ודבר משמח שעשיתם למען אדם אחר.
          timer: 180
          echo: true
          alt: לוח, ועליו שני פתקים בשני צבעים
          art:
