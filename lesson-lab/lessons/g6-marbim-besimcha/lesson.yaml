steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: משהו ששימח אותי
    minutes: 4
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
    summary: משנכנס אדר מרבים בשמחה — לבד, בזוגות ובמליאה, על משהו ששימח אותנו השבוע
    body:
      - slide:
          kicker: משנכנס אדר מרבים בשמחה
          title: ספרו על משהו ששימח אתכם במהלך השבוע האחרון
          points:
            - לבד — שלוש מילים על הרגע
            - בזוגות — דקה
            - במליאה
          verbatim:
            - title
          echo: true
          alt: זוג יד ביד, ומעליו בועת דיבור ובתוכה פנים שמחות
          art:
            - {use: pair, x: 60, y: 236, w: 264}
            - {use: speech, x: 290, y: 30, w: 300}
            - {use: face-happy, x: 384, y: 60, w: 112}
      - moves:
          - הציגי את השקף, ואמרי שהיום בודקים מה מרבה אצלנו שמחה.
          - חצי דקה של כתיבה בשקט — שלוש מילים על הרגע המשמח. אחר כך דקה בזוגות.
          - שמעי שלושה. מי שלא עולה לו משהו מהשבוע — אפשר רגע משמח מפעם.
      - say: משנכנס אדר מרבים בשמחה. אז נתחיל בשמחה שכבר הייתה לנו השבוע — כתבו, ואחר כך ספרו לשכן.
      - ladder:
          help: חשבו על רגע קטן — ארוחה, משחק, הודעה, מישהו שחייך אליכם.
          challenge: מה בדיוק ברגע הזה שימח אתכם — ומי היה שם איתכם?
      - ask: מי מוכן לספר על משהו ששימח אותו השבוע?

  # ------------------------------------------------------------------ 4′–13′
  - id: board
    title: לוח השמחה שלי
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: >-
      כל אחד מקיף בלוח של 20 משבצות את מה שמשמח אותו ומוסיף משלו; ברביעיות מחפשים משבצת משותפת ומספרים למה
      היא משמחת
    body:
      - slide:
          kicker: לבד, עם הלוח
          title: לוח השמחה שלי
          sub: הקיפו כל משבצת שמשמחת אתכם — ובמשבצות הריקות כתבו דברים משלכם.
          verbatim:
            - title
          echo: true
          alt: לוח של ארבע על חמש משבצות, חלקן מוקפות בעיגול, ועיפרון לידו
          art: {file: art/joy-board.svg}
      - moves:
          - חלקי את הלוחות, והסבירי לפני שמתחילים — מקריאים היגד, ומי שהוא משמח אותו מקיף את המשבצת.
          - הקריאי את ההיגדים בסדר אקראי — לא לפי הסדר שבלוח — וחכי כמה שניות אחרי כל אחד.
          - >-
            אחרי כל ההיגדים — שתי דקות לארבע המשבצות הריקות: דברים נוספים שמשמחים אותם במיוחד.
          - ברביעיות — מחפשים משבצת מוקפת שמשותפת לשניים לפחות, ומספרים זה לזה למה היא משמחת.
      - say: >-
          אקריא היגדים מהלוח. אם מה שכתוב משמח אתכם — הקיפו את המשבצת. אם לא במיוחד — פשוט ממשיכים הלאה.
      - task:
          what: >-
            ברביעיות — מחפשים משבצת מוקפת שמשותפת לשניים לפחות, ומספרים זה לזה למה היא משמחת. אחר כך כל אחד
            משלים בקול: ״הדבר שהכי משמח אותי הוא…״, ומספר מתי הוא עושה אותו.
          time: 3 דקות
          group: רביעיות לפי השולחנות
          rules: כל אחד מספר; אין משבצת נכונה — מה שמשמח הוא דבר אישי; מספרים רק על עצמנו ומקשיבים עד הסוף
          plenary: שאלה אחת — מה גיליתם על עצמכם? שלוש–ארבע תשובות
          help: התחילו במשבצת שהקפתם ראשונה.
          challenge: מצאו משבצת שרק אחד מכם הקיף — ונסו להבין מה משמח אותו בה.
      - handout:
          title: לוח השמחה שלי
          copies: >-
            עותק לכל תלמיד — לוח של 20 משבצות: 16 ההיגדים, וארבע משבצות ריקות בשורה האחרונה. אפשר להדפיס את
            הלוח גם מהמצגת המקורית
          verbatim: true
          lines: false
          items:
            - לאכול משהו טעים
            - ללטף בע"ח
            - ליצור משהו
            - לגרום לאחר הרגשה טובה
            - להיות עם חברים/ות
            - לתת משלי
            - לרקוד
            - לשמוע מוסיקה
            - להכין אוכל
            - לעזור לחברה
            - להיות במסיבת יום הולדת
            - לקבל מתנה
            - ללבוש בגד חדש
            - לשיר או לנגן
            - לטייל עם המשפחה
            - לעשות פעילות ספורטיבית
      - slide:
          kicker: אחרי הרביעיות
          title: מה גיליתם על עצמכם?
          sub: ומה הרגשתם כשמצאתם חבר שהקיף את אותה משבצת?
          verbatim:
            - title
          echo: true
          cue: כשהרביעיות מסיימות —
          alt: ארבעה סביב שולחן עגול, ולב מעליהם
          art:
            - {use: circle4, x: 120, y: 160, w: 340}
            - {use: heart, x: 430, y: 40, w: 150}
      - ask: מה גיליתם על עצמכם — ומה הרגשתם כשמצאתם חבר שהקיף את אותה משבצת?
      - whisper: >-
          מהערות המקור — עצם הדיבור על מה שמשמח מעורר שמחה, ושמחה היא רגש אישי: מה שמשמח אחד לא חייב לשמח
          את השני.

  # ------------------------------------------------------------------ 13′–18′
  - id: give
    title: לתת או לקבל?
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      שתי הדרכים הנפוצות להכניס שמחה — נתינה לאחר והכרת תודה; לבד, בזוגות ובמליאה: מה משמח יותר, לתת או
      לקבל?
    body:
      - say: >-
          נמצא ששתי הדרכים הנפוצות להכניס שמחה לחיים הן נתינה לאדם אחר, והכרת תודה. אז מה משמח יותר — לתת או
          לקבל?
      - slide:
          kicker: ממה מורכבת השמחה
          title: מה לדעתכם משמח יותר — לתת או לקבל?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          verbatim:
            - title
          echo: true
          alt: מאזניים — מעל כף אחת לב, ומעל השנייה מעטפה
          art:
            - {use: scale, x: 140, y: 214, w: 340}
            - {use: heart, x: 380, y: 80, w: 150}
            - {use: envelope, x: 80, y: 100, w: 190}
      - quote:
          title: הכרת תודה — ההגדרה מהמקור, להקריא
          text: >-
            הכרת תודה — להעריך, לשמוח ולהודות על דברים טובים בחיינו. לא לקחת דברים נחמדים בחיינו כמובנים
            מאליהם.
      - moves:
          - הציגי את שתי הדרכים, והקריאי את ההגדרה של הכרת תודה.
          - >-
            שאלי, וחכי 20 שניות. דקה בזוגות — כל אחד מספר על משהו נחמד שמישהו עשה בשבילו, ועל משהו נחמד שהוא
            עשה בשביל מישהו אחר.
          - במליאה — שמעי שלושה–ארבעה, והקריאי את הסיכום של המקור.
      - ladder:
          help: חשבו על פעם שעזרתם למישהו, ועל פעם שעזרו לכם — מתי חייכתם יותר?
          challenge: אפשר שכשנותנים — גם מקבלים? הסבירו איך.
      - ask: מה לדעתכם משמח יותר — לתת או לקבל? ולמה?
      - quote:
          title: מה למדנו על תחושת השמחה — הסיכום מהמקור, להקריא
          text: >-
            להוקיר את הזולת ולהכיר תודה על דבר משמח שעשו עבורנו מחד גיסא, ולשמח אדם אחר, מאידך גיסא – הם שני
            צדדים שונים של אותה המטבע. לתת ולקבל – הן חוויות חיים מעשירות ומספקות עבור שני הצדדים – הן של הצד
            המקבל והן של הצד הנותן.
      - say: ויש מנהג אחד בפורים שבו כולנו גם נותנים וגם מקבלים — משלוח מנות.

  # ------------------------------------------------------------------ 18′–27′
  - id: words
    title: משלוח של מילים טובות
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      משלוח מנות מאפשר להיות גם נותנים וגם מקבלים; שיר קצר על משלוח מנות של מילים, וכל אחד כותב כרטיס
      של מילים טובות לכל אחד משלושת החברים ברביעייה
    body:
      - slide:
          kicker: פורים
          title: משלוח מנות
          sub: גם בצד הנותן — וגם בצד המקבל.
          verbatim:
            - title
          alt: קופסת מתנה עם סרט, ומסכה לידה
          art: {file: art/gift.svg}
      - quote:
          title: משלוח מנות — מהמקור, להקריא
          text: >-
            אחד המנהגים המרכזיים בחג הפורים הינו משלוח מנות. מנהג זה מעורר רגשות של שמחה מעצם כך שהוא מאפשר לנו
            להיות הן בצד הנותן והן בצד המקבל
      - source_slide:
          slides: 19
          why: >-
            השיר הקצר ״משלוח מנות״ של אוריאל בלמס — על משלוחי מנות של הארת פנים ואהבה, ״מלב אל לב״. במקור הוא
            תמונה, והוא מוגן בזכויות יוצרים — ולכן מקריאים אותו מהמצגת המקורית.
      - ask: מה אפשר להעניק לאחרים — שאינו חומרי?
      - slide:
          kicker: ברביעיות · כרטיס לכל חבר
          title: משלוח של מילים טובות
          sub: לכל אחד משלושת החברים ברביעייה — כרטיס אחד, משלכם או לפי ההתחלות.
          points:
            - אני רוצה להודות לך על…
            - אני מאד מעריכ/ה אצלך…
          verbatim:
            - title
            - points
          timer: 240
          echo: true
          cue: אחרי השיר והתשובות —
          alt: דף ובתוכו לב, ועיפרון לידו
          art:
            - {use: note, x: 290, y: 50, w: 256}
            - {use: heart, x: 354, y: 194, w: 128}
            - {use: pencil, x: 40, y: 300, w: 190}
      - moves:
          - הקריאי את קטע המקור על משלוח מנות, ואחריו את השיר — מהמצגת המקורית.
          - שאלי מה אפשר להעניק שאינו חומרי, ושמעי שתיים–שלוש תשובות.
          - >-
            חלקי שלושה ריבועי נייר לכל אחד, והסבירי — כרטיס לכל אחד משלושת החברים ברביעייה. בראש הכרטיס ״ל…״,
            בתחתית ״ממני…״, וההתחלות על המסך.
          - הסתובבי בין הרביעיות. מי שנתקע — הציעי לו להתחיל ב״אני רוצה להודות לך על…״.
          - בסוף — מוסרים את הכרטיסים, וכל אחד קורא בשקט את המשלוח שלו. שאלי, ושמעי שניים–שלושה.
      - say: כל אחד שולח משלוח לשלושת החברים שלו ברביעייה — וכל אחד גם מקבל משלוח משלושה.
      - task:
          what: >-
            כל אחד כותב כרטיס של מילים טובות לכל אחד מחבריו לרביעייה — תודה, משהו שהוא מעריך אצלו, או מילים
            טובות משלו.
          time: 4 דקות
          group: הרביעיות מלוח השמחה — כל אחד כותב לשלושה, ומקבל משלושה
          rules: >-
            רק מילים טובות ואמיתיות, על משהו שראיתם אצל החבר; כל אחד כותב לכל חבריו לקבוצה (בקבוצה של חמישה —
            לארבעה), כך שאף אחד לא נשאר בלי משלוח
          plenary: קוראים בשקט את הכרטיסים שקיבלו, ושניים–שלושה מספרים איך הרגישו
          help: חשבו על פעם שהחבר עזר לכם, הצחיק אתכם או שיתף אתכם.
          challenge: כתבו משהו טוב שהחבר אולי לא יודע שאתם רואים בו.
      - ask: איך הרגשתם כשקראתם את המילים הטובות שקיבלתם — ואיך היה לכתוב אותן?

  # ------------------------------------------------------------------ +5′
  - id: sources
    title: מקורות השמחה
    kind: extension
    minutes: 5
    stance: true
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - דיפרנציאליות וגיוון
    summary: מרימים יד לפי ארבעה תחומים — גוף, חברה, רגש ומחשבה — ומגלים כמה מגוונים מקורות השמחה שלנו
    body:
      - slide:
          kicker: אם נשאר זמן · מרימים יד
          title: כל מי שבחר/ה...
          sub: לפחות דבר אחד שקשור…
          points:
            - "לתחום הגופני: אוכל, ספורט וכו'"
            - "לחוויות חברתיות עם אנשים משמעותיים, כמו: משפחה וחברים"
            - "לרגשות חיוביים: אופטימיות, תקווה ואמונה שיהיה טוב"
            - למחשבה, המצאה או יוזמה
          verbatim: true
          echo: true
          alt: דמות מרימה יד, וכוכב לידה
          art:
            - {use: kid-hand, x: 250, y: 110, w: 190, color: orange}
            - {use: star, x: 440, y: 60, w: 150}
      - moves:
          - >-
            הלוחות מונחים לפני כל אחד. חשפי תחום אחד בכל פעם, וחכי חמש שניות של שקט — ורק אז מי שהקיף בלוח
            לפחות דבר אחד מהתחום מרים יד. מותר לא להרים.
          - תארי במילים את מה שרואים בכיתה כולה — בלי לומר מי הרים ומי לא.
          - הציגי את ארבעת התחומים, וקראי כמה דוגמאות מכל אחד. אחר כך שאלי, וחכי עשר שניות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב — ״מי מסכים? מי חושב אחרת?״
      - say: >-
          אקריא תחום. חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז מי שהקיף בלוח לפחות דבר אחד ממנו מרים
          יד. מרימים רק אם רוצים, ואין תשובה נכונה.
      - slide:
          kicker: ארבעה תחומים
          title: מקורות השמחה
          sub: גוף, חברה, רגש ומחשבה — ובכל אחד מהם דרכים אחרות לשמוח.
          verbatim:
            - title
          echo: true
          cue: אחרי ההצבעות —
          alt: ארבעה ריבועים — גוף, חברה, רגש ומחשבה — ובכל אחד סמל
          art: {file: art/sources.svg}
      - list:
          - התחום הגופני — לאכול משהו טעים, ללבוש בגד חדש, לרקוד, לקבל מתנה, להתעמל.
          - חברה — להיות עם חברים, מסיבת יום הולדת, לטייל עם המשפחה, לעזור לחבר, לצחוק, להצחיק ולהשתמש בהומור.
          - רגש — חיבוק, שיחת נפש, להביע רגשות בציור או בהצגה, להכין רשימת תודות על 5 דברים טובים מהיום.
          - מחשבה — לפתור תשבץ או לפענח חידות, לקרוא ספר, להמציא או לפתח רעיון חדש, להתעניין בנושא מסקרן.
      - ask: הקפתם דברים מאותו תחום, או מתחומים שונים? מה אפשר ללמוד מזה?
      - tip: >-
          המסר של השאלה, מהערות המקור — אפשר לחוש שמחה דרך מגוון פעילויות, ואפשר להגדיל ולגוון את הדרכים שבהן
          אנחנו חווים שמחה.

  # ------------------------------------------------------------------ +5′
  - id: thanks
    title: תודה ונתינה
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
