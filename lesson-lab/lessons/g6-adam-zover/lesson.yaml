steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: first-day
    title: היום הראשון בכיתה א׳
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה קצרה כשנכנסים — שלושה דברים שאני זוכר מהיום הראשון בכיתה א׳; שומעים שלוש תשובות
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: מה אתם זוכרים מהיום הראשון בכיתה א׳?
          sub: כתבו שלושה דברים — כל מה שעולה.
          timer: 180
          echo: true
          alt: בית ספר, ודמות קטנה בדרך אליו
          art:
            - {use: school, x: 40, y: 60, w: 340}
            - {use: kid-stand, x: 440, y: 270, w: 115, color: teal}
      - moves:
          - השקף על המסך כשהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש תשובות שונות זו מזו.
          - שאלי מי רוצה לשתף; אם מצביע מישהו שסימנת — תני לו קודם. אל תסכמי עדיין — ההבדלים יחזרו בהמשך.
      - say: שלוש דקות, לבד ובשקט. לא זוכרים? כתבו מה כן זכור לכם מכיתה א׳, או מה סיפרו לכם בבית.
      - ladder:
          help: עם מי הגעתם לבית הספר? ליד מי ישבתם? איך נראה הילקוט הראשון שלכם?
          challenge: מה הייתם אומרים היום לילד שהייתם, שנכנס אז לבית הספר?
      - ask: נשמע שלושה — מה כתבתם?
      - say: ועכשיו — בואו נראה איך נראינו אז.

  # ------------------------------------------------------------------ 5′–10′
  - id: photo
    title: כשהיינו ילדים
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: מקרינים את תמונת הכיתה מכיתה א׳; בזוגות משווים את מה שכתבנו בפתיחה — זכרנו את אותם דברים?
    body:
      - slide:
          kicker: ״כשהיינו ילדים״ · כיתה א׳
          title: מה מעוררת בכם התמונה?
          echo: true
          alt: תמונת כיתה ממוסגרת — שורות של ילדים — ומתחתיה ״כיתה א׳״
          art: {file: art/class-photo.svg}
      - moves:
          - הקריני את תמונת הכיתה מכיתה א׳, ותני לכיתה רגע להסתכל בשקט.
          - שאלי מה מעוררת בהם התמונה, ושמעי שתיים–שלוש תגובות.
          - עברי לשקף הזוגות — כל זוג משווה את שלושת הדברים שכתב בפתיחה.
          - במליאה — שמעי שלושה זוגות, ושאלי אם היו מקרים שבהם ילדים זכרו דברים אחרים מאותו אירוע.
      - whisper: התמונה עצמה לא במצגת — פתחי אותה בנפרד, ואחריה חזרי למצגת.
      - ask: מה מעוררת בכם התמונה?
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: זכרתם את אותם דברים?
          sub: השוו בזוגות את מה שכתבתם בפתיחה.
          points:
            - לבד — קראו שוב את מה שכתבתם
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי התגובות לתמונה —
          alt: שתי דמויות יד ביד, ומעל כל אחת ענן מחשבה עם משהו אחר — לב וכוכב
          art:
            - {use: thought, x: 24, y: 40, w: 210}
            - {use: heart, x: 83, y: 81, w: 96}
            - {use: thought, x: 386, y: 40, w: 210, flip: true}
            - {use: star, x: 441, y: 76, w: 96}
            - {use: pair, x: 195, y: 270, w: 230}
      - ladder:
          help: בחרו פרט אחד — הילקוט, המחנכת, מי ישב לידכם — ובדקו מה כל אחד מכם זוכר עליו.
          challenge: למה, לדעתכם, שני ילדים זוכרים דברים שונים מאותו יום?
      - ask: האם היו מקרים בהם ילדים שונים זכרו דברים אחרים מאותו אירוע?
      - say: עברנו את אותו יום — אבל כל אחד חווה אותו אחרת, וזוכר ממנו דברים אחרים.

  # ------------------------------------------------------------------ 10′–14′
  - id: poem
    title: טנא של זכרונות
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: מקריאים את השיר של סמדר שיר; מה זה ״טנא של זכרונות״, ומה הכוונה ״שילך איתי על הגב״?
    body:
      - slide:
          kicker: שיר · סמדר שיר
          title: טנא של זכרונות
          sub: |-
            אֲנִי אוֹסֶפֶת רְגָעִים וּתְמוּנוֹת
            לְטֶנֶא שֶׁל זִכְרוֹנוֹת
            שֶׁיֵּלֵךְ אִתִּי עַל הַגַּב
            שֶׁאָהַבְתִּי וְשֶׁאֹהַב…
          verbatim: true
          echo: true
          alt: סל קלוע, ומתוכו מציצות תמונות ולב
          art: {file: art/basket.svg}
      - moves:
          - הקריאי את השיר פעם אחת, לאט.
          - שאלי במה עוסק השיר, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - שאלי מה זה ״טנא של זכרונות״, ומה הכוונה ״שילך איתי על הגב״. הדהדי, והזמיני עוד קולות.
      - tip: >-
          מההערות של המקור — טנא של זכרונות הוא אוסף הרגעים, החוויות והתמונות שאנחנו חווים לאורך החיים;
          ״שילך איתי על הגב״ — הזיכרונות נשארים איתנו וממשיכים ללוות אותנו. חלק מהרגעים אהבנו, ויש רגעים
          שעם הזמן נלמד לאהוב.
      - ask: במה עוסק השיר? ומה זה, לדעתכם, ״טנא של זכרונות״?
      - say: אז הטנא הוא ___ — הבנתי נכון? מי רוצה להוסיף?
      - say: גם לכיתה שלנו יש טנא — שש שנים של רגעים. בואו נתבונן בו.

  # ------------------------------------------------------------------ 14′–22′
  - id: rope
    title: החבל של הכיתה
    minutes: 8
    practices:
      - הוצאה למשימה
      - כולם כותבים
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: עוברים לאורך החבל, מתבוננים בתמונות, כותבים על פתקים זיכרונות שהתעוררו, ותולים אותם ליד התמונות
    body:
      - say: >-
          על החבל תלויות תמונות מהשנים שלנו כאן. עברו לאורכו, התבוננו, וכתבו על הפתקים זיכרונות שהתמונות
          מעוררות בכם.
      - slide:
          kicker: רגעים כיתתיים · לאורך החבל
          title: אילו זיכרונות מעוררות בכם התמונות?
          sub: כתבו זיכרון על פתק, ותלו אותו ליד התמונה.
          timer: 360
          echo: true
          alt: חבל, ועליו תמונות ופתקים תלויים באטבים
          art: {file: art/rope.svg}
      - moves:
          - חלקי שלושה פתקי זיכרונות לכל אחד, והסבירי את המשימה לפני שקמים.
          - שולחן או שניים בכל פעם עוברים לאורך החבל; מי שמחכה כותב בינתיים זיכרון מהמקום.
          - הסתובבי ועודדי לכתוב פרטים — מי היה שם, מה שמעו, מה הריחו, מה הרגישו.
          - דקה לפני הסוף — כולם תולים את הפתקים שכתבו ליד התמונות, וחוזרים למקומות.
      - task:
          what: >-
            עוברים לאורך החבל, מתבוננים בתמונות, וכותבים על הפתקים זיכרונות שהתעוררו — זיכרון אחד בכל פתק.
            תולים כל פתק ליד התמונה שעוררה אותו.
          time: 6 דקות
          group: לבד; שולחן או שניים בכל פעם ליד החבל
          rules: פתק בלי שם; כותבים רק על עצמנו, ובלי דבר שמביך מישהו; מי שהצטרף מאוחר — כותב זיכרון מהזמן שלו כאן
          plenary: בשלב הבא — מה הרגשנו, ומה זכרנו
          help: בחרו תמונה אחת — מה קרה רגע לפני שצילמו אותה? מי היה שם?
          challenge: כתבו זיכרון שיש בו קול, ריח או טעם — לא רק מה שראיתם.
      - handout:
          title: פתקי זיכרונות
          copies: 3 פתקים לכל תלמיד — כמה פתקים בעמוד, גזורים
          verbatim: true
          text: |-
            אֲנִי אוֹסֶפֶת רְגָעִים וּתְמוּנוֹת
            לְטֶנֶא שֶׁל זִכְרוֹנוֹת
            שֶׁיֵּלֵךְ אִתִּי עַל הַגַּב
            שֶׁאָהַבְתִּי וְשֶׁאֹהַב…
            (סמדר שיר)
      - say: עוד דקה — תלו את הפתקים ליד התמונות, וחזרו למקומות.

  # ------------------------------------------------------------------ 22′–27′
  - id: remember-together
    title: זוכרים יחד
    minutes: 5
    practices:
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: מה הרגשנו כשנזכרנו, איזו תמונה ריגשה, ומה נזכרנו בזכות אחרים; החוויות שלנו בנויות מהרבה היבטים
    body:
      - slide:
          kicker: רגעים כיתתיים · דיון
          title: מה הרגשתם כשנזכרנו בתמונות ובסיפורים?
          sub: האם יש אירועים שלא זכרתם ועכשיו נזכרתם בהם?
          verbatim: true
          echo: true
          alt: מצלמה, ולב לידה
          art:
            - {use: camera, x: 230, y: 170, w: 330}
            - {use: heart, x: 50, y: 60, w: 160}
      - moves:
          - שאלי מה הרגישו, וחכי לשלוש–ארבע ידיים לפני שאת מזמינה.
          - שאלי אם יש תמונה שריגשה אותם במיוחד — ותני לכיתה להגיב זה לזה.
          - שאלי מה נזכרו בזכות פתק של מישהו אחר. כאן מתחבר מה שעלה בזוגות — כל אחד זוכר אחרת.
          - הציגי את השקף על ההיבטים, והצביעי על החבל — איפה יש מראות, קולות, ריחות, דמויות?
      - ask: האם יש תמונה מסוימת שריגשה אתכם במיוחד? מדוע?
      - say: אז מה שנזכרת בו זה ___ — ומי עוד זוכר את זה, אבל אחרת?
      - slide:
          kicker: רגעים כיתתיים
          title: החוויות שלנו לאורך החיים מורכבות מהיבטים רבים ושונים
          sub: כמו ריחות, רגשות, דמויות, מראות…
          verbatim: true
          echo: true
          cue: אחרי שתיים–שלוש תשובות —
          alt: דמות, ומסביבה ענן מחשבה, לב וכוכב
          art:
            - {use: kid-stand, x: 236, y: 180, w: 160, color: teal}
            - {use: thought, x: 24, y: 30, w: 200}
