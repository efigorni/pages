sub: >-
  שש שנים בבית הספר הן הרבה רגעים. בשיעור הזה נזכרים ביום הראשון בכיתה א׳, תולים על חבל זיכרונות מהדרך
  שעברנו יחד, ומגלים שכל אחד זוכר אותה קצת אחרת.
format: עבודה אישית, זוגות ומליאה
question: מה אנחנו זוכרים מהשנים בבית הספר — ולמה כל אחד זוכר אחרת?
takeaways:
  - החוויות שלנו מורכבות מהרבה דברים — מראות, קולות, ריחות, אנשים ורגשות.
  - גם כשעברנו דברים יחד, כל אחד חווה וזוכר אותם בדרך משלו.
  - כשמשתפים זיכרונות, אחרים מזכירים לנו דברים ששכחנו — והזיכרון נעשה רחב יותר.
prep:
  - >-
    שבוע לפני השיעור — בקשי מהתלמידים ומההורים תמונות מאירועים כיתתיים לאורך השנים (טיולים שנתיים, טקסים,
    ימי הולדת), מודפסות או בקובץ להדפסה. עברי עליהן לפני שתולים — ראי ״לפני השיעור״.
  - תמונת הכיתה מכיתה א׳ — מהארכיון של בית הספר או מאחד ההורים — פתוחה במחשב הכיתה
  - >-
    חבל ארוך ואטבים — תלויים לאורך הקיר לפני השיעור, והתמונות עליהם, עם רווח ליד כל תמונה לפתקים

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — זיכרונות משש שנים בבית הספר, כחלק מהפרידה ממנו. שאלי מי בכיתה עבר שנים
      קשות — חרם, בדידות, משבר במשפחה — ומי הצטרף לכיתה מאוחר. ושאלי על אובדן שקשור לתמונות — תלמיד או מורה
      שנפטרו, או תלמיד שעזב בנסיבות קשות. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהשנים כאן היו קשות לו, מי שהצטרף מאוחר ואינו בתמונות, ומי שמהבית שלו לא נשלחו תמונות. לפני שתולים —
      עברי על התמונות: בלי תמונה שמביכה מישהו, ונסי שכל תלמיד יופיע לפחות באחת. מי שהצטרף מאוחר כותב
      זיכרון מהזמן שלו כאן, או מבית הספר הקודם.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח: ״מספרים רק על עצמנו״. מותר לבחור רק זיכרונות טובים; פתק על החבל לא צריך שם, ולא כותבים בו על
      אחרים דבר שעלול להביך אותם. במליאה משתפים רק מתנדבים, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל זיכרון של חרם או של אובדן — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את
      היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״שביל אחד״; פחות — ישר
    ל״חשוב לזכור״.
  short:
