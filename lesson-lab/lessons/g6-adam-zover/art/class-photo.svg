<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540">
  <!-- כשהיינו ילדים: תמונת כיתה ממוסגרת — שורות של ילדים — ומתחתיה "כיתה א׳" (מקור: שקפים 8–9) -->
  <g transform="rotate(-3 310 270)">
    <g filter="url(#rough)">
      <rect x="66" y="56" width="488" height="404" rx="8" fill="#ffffff" stroke="#13100e" stroke-width="5" stroke-linejoin="round"/>
      <rect x="88" y="78" width="444" height="290" rx="4" fill="#e6f2f1"/>
      <use href="#crowd" x="126" y="112" width="368" height="230"/>
    </g>
    <text x="310" y="414" font-family="Secular One, Arial Hebrew, sans-serif" font-size="44" fill="#13100e" text-anchor="middle" dominant-baseline="central">כיתה א׳</text>
  </g>
</svg>
