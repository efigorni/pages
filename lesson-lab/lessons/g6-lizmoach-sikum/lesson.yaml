steps:
  # ------------------------------------------------------------------ 0′–8′
  - id: round1
    title: המתבגר הבא — סיבוב ראשון
    minutes: 8
    practices:
      - תרגילי שליפה
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      חידון בקבוצות לפי השולחנות — שלושה היגדים על השינויים בגוף, ״נכון״ או ״לא נכון״, ואחריהם ההרחבה מהמקור
    body:
      - slide:
          kicker: המתבגר הבא · החידון
          title: מוכנים?
          points:
            - חושבים לבד, ואז מחליטים יחד
            - אגודל למעלה — נכון; למטה — לא נכון
            - תשובה נכונה — 5 נקודות
          echo: true
          alt: שלוש דמויות יחד, ואגודל למעלה לידן
          art:
            - {use: group3, x: 60, y: 240, w: 320}
            - {use: thumb-up, x: 420, y: 70, w: 160}
      - say: >-
          היום — חידון ״המתבגר הבא״. כל שולחן הוא קבוצה. על כל היגד חושבים לבד, מחליטים יחד, ומראים באגודל —
          נכון או לא נכון.
      - moves:
          - הסבירי את החוקים לפני שמתחילים, והראי את טבלת הניקוד על הלוח.
          - >-
            על כל היגד — עשר שניות לחשוב לבד, עשרים שניות להתייעץ, ואז נציג הקבוצה מרים אגודל. רק אחר כך חשפי את
            התשובה (לחיצה על השקף) ורשמי את הנקודות.
          - אחרי כל היגד — קבוצה אחת מסבירה למה בחרה, גם אם טעתה.
          - אחרי ההיגד השלישי — הקריאי את ההרחבה מהמקור.
      - whisper: >-
          התוכנית ״לצמוח ולגדול״ עסקה בשיתוף ובפרטיות, במקורות מידע, בדימוי העצמי, בשינויים בגוף ובלב, בסטריאוטיפים
          ובלחץ חברתי. כל היגד בחידון עומד בפני עצמו — מי שלא היה בשיעור מסוים עונה מתוך מה שהוא חושב, והקבוצה עוזרת.
      - tip: >-
          טעות בחידון היא התלבטות, וזה בדיוק מה שמעניין לשמוע. שאלי ״מה גרם לכם לחשוב כך?״ בסקרנות, בלי ״טעיתם״.
      - task:
          what: >-
            כל קבוצה מחליטה יחד על כל היגד — נכון או לא נכון — ומראה את ההחלטה באגודל.
          time: חצי דקה לכל היגד
          group: קבוצות לפי השולחנות
          rules: קודם חושבים לבד, אחר כך מתייעצים; הנציג מתחלף בכל היגד; לא צוחקים על תשובה של אף קבוצה
          plenary: קבוצה אחת מסבירה כל תשובה, והנקודות נרשמות על הלוח
          help: חפשו בהיגד מילה כמו ״רק״, ״תמיד״ או ״אין״ — האם היא באמת נכונה?
          challenge: מצאו דוגמה אחת שמוכיחה את התשובה שלכם — או שסותרת אותה.
      - slide:
          kicker: המתבגר הבא · היגד 1
          title: הבנות מתפתחות מהר יותר מהבנים
          points:
            - התשובה — נכון
          verbatim: [title]
          echo: true
          cue: אחרי החוקים —
          alt: שתי דמויות בגבהים שונים, ושעון לידן
          art:
            - {use: kid-stand, x: 120, y: 160, w: 150, color: orange}
            - {use: kid-stand, x: 300, y: 250, w: 105, color: teal}
            - {use: clock, x: 430, y: 60, w: 150}
      - whisper: >-
          התשובה במקור — נכון: אצל רוב הבנות השינויים מתחילים מוקדם יותר. אבל זה ״בדרך כלל״, לא ״תמיד״ — יש הבדלים
          גדולים בין אנשים, וכל אחד מתפתח בקצב שלו.
      - slide:
          kicker: המתבגר הבא · היגד 2
          title: השינויים הגופניים מתרחשים גם אצל בנים וגם אצל בנות
          points:
            - התשובה — נכון
          verbatim: [title]
          echo: true
          cue: ההיגד הבא —
          alt: שתי דמויות יד ביד, ונבט בעציץ לידן
          art:
            - {use: pair, x: 60, y: 210, w: 270}
            - {use: sprout, x: 400, y: 120, w: 170}
      - slide:
          kicker: המתבגר הבא · היגד 3
          title: בגיל ההתבגרות חשוב לשמור על אורח חיים בריא
          sub: הכולל שינה, הגיינה ותזונה נכונה
          points:
            - התשובה — נכון
          verbatim: [title, sub]
          echo: true
          cue: ההיגד הבא —
          alt: סוללה מלאה, ונבט בעציץ לידה
          art:
            - {use: battery-full, x: 250, y: 150, w: 320}
            - {use: sprout, x: 60, y: 250, w: 160}
      - quote:
          title: ההרחבה מהמקור — להקריא אחרי ההיגד השלישי
          text: |-
            למדנו כי השינויים הגופניים בגיל ההתבגרות מתרחשים גם אצל בנים וגם אצל בנות.
            למדנו על השונה והדומה בין המינים בכל הנוגע להתפתחות הגופנית.
            ישנה שונות בינינו בקצב ההתפתחות והדבר טבעי.
            עשינו הבחנה בין השינויים וההתפתחות הפיזיולוגית הייחודית למין הפיזיולוגי, לבין ההבנה והתחושות המגדריות שאינן קשורות בהכרח למין הביולוגי.
            בזמן השינה הורמון הגדילה עובד, ולכן חשוב לישון טוב
            תזונה נכונה ופעילות גופנית חשובים בגיל ההתבגרות
            חשוב לשמור על הגיינה בגיל ההתבגרות
      - ask: מה גרם לכם לבחור בתשובה הזאת?
      - say: הגוף משתנה — וגם הלב. בסיבוב הבא — רגשות וחברים.

  # ------------------------------------------------------------------ 8′–14′
  - id: round2
    title: המתבגר הבא — הלב והחברים
    minutes: 6
    practices:
      - תרגילי שליפה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: שלושה היגדים על רגשות ועל קבוצת השווים — הקבוצות מחליטות, מנמקות ומגיבות זו לזו
    body:
      - moves:
          - אותם חוקים. אחרי כל היגד — קבוצה אחת מנמקת, ושאלי את האחרות אם הן מסכימות ולמה.
          - אחרי ההיגד השלישי — הקריאי את ההרחבה מהמקור.
      - slide:
          kicker: המתבגר הבא · היגד 4
          title: עיקר השינוי בגיל ההתבגרות הינו השינוי הגופני
          points:
            - התשובה — לא נכון
          verbatim: [title]
          echo: true
          alt: מאזניים מאוזנים
          art: scale
      - slide:
          kicker: המתבגר הבא · היגד 5
          title: הגדילה וההתפתחות מעוררים רגשות שונים
          sub: ולא בהכרח רק חיוביים
          points:
            - התשובה — נכון
          verbatim: [title, sub]
