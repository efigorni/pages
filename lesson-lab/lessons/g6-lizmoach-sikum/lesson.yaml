sub: >-
  גדלנו, התפתחנו, התבגרנו. בשיעור הזה בודקים בחידון קבוצתי מה אנחנו יודעים על גיל ההתבגרות — בגוף, בלב
  ובחברה — ותולים על החבל משאלות לעצמנו לדרך.
format: חידון בקבוצות, כתיבה אישית ומליאה
question: מה משתנה בנו כשאנחנו גדלים — ואיך שומרים על עצמנו בדרך?
takeaways:
  - גיל ההתבגרות מביא שינויים בגוף, ברגש ובקשרים עם החברים — אצל בנים ובנות, כל אחד בקצב שלו.
  - אף תכונה, תפקיד או התנהגות לא שייכים רק לבנים או רק לבנות.
  - גם במצב של לחץ יש לנו בחירה — ותמיד אפשר להיעזר במבוגר משמעותי.
prep:
  - חלוקה מראש לקבוצות לפי השולחנות, וטבלת ניקוד על הלוח — שורה לכל קבוצה
  - שני חבלים מתוחים לאורך הקיר, אטבי כביסה, ושלושה פתקים קטנים לכל תלמיד (לשלב ״משאלות לעצמנו״)

time:
