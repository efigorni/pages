    summary: חמשת המסרים שחותמים את החידון, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - קבוצת השווים היא המקום הבטוח והמועדף על מתבגרים.
            - הבחירות שלהם לא פשוטות ונעות בין עמידה על העקרונות והתפשרות מול לחץ קבוצת השווים.
            - בבואם לקבל החלטה עליהם לדעת לעמוד בפני הלחץ לצד שמירה על עצמם.
            - >-
              יש להביא בחשבון שיקולי דעת במצבי התלבטות כגון: הרצון הפנימי שלי, חוקים וכללים, ערכים אישיים, חברויות.
            - במצבים קונפליקטואליים ניתן ורצוי להיעזר במבוגר משמעותי.
          ask: איזה משפט מהחמישה הכי חשוב לכם לזכור? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            אלה המסרים שחותמים את החידון במקור — ההרחבה לשני ההיגדים על לחץ חברתי. ״קונפליקטואליים״ — מצבים שבהם רצונות
            מתנגשים.
          alt: שלוש דמויות יחד, ולב מעליהן
          art:
            - {use: group3, x: 120, y: 236, w: 380}
            - {use: heart, x: 220, y: 30, w: 180}

