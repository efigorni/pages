brain_break:
  signs: ראשים על השולחן, פיהוקים, קבוצות שמפסיקות להתייעץ.
  ideas:
    - name: גלים
      text: >-
        גל עובר בכיתה כמו באצטדיון — שולחן אחרי שולחן קמים, מרימים ידיים ומתיישבים. פעם אחת לאט ופעם אחת מהר.
    - name: נשימת בלון
      text: יד על הבטן. שואפים לאט עד ארבע ומנפחים ״בלון״ בבטן, ונושפים לאט עד שש. חמש פעמים.
    - name: ראש, כתפיים
