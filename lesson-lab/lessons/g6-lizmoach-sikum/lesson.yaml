      - slide:
          kicker: המתבגר הבא · היגד 6
          title: בגיל ההתבגרות חלה התרחקות של המתבגר מקבוצת השווים
          points:
            - התשובה — לא נכון
          verbatim: [title]
          echo: true
          cue: ההיגד הבא —
          alt: שלוש דמויות יחד
          art:
            - {use: group3, x: 110, y: 160, w: 400}
      - ladder:
          help: חשבו על מישהו בגילכם שאתם מכירים — מה השתנה אצלו בשנה האחרונה?
          challenge: איזה היגד הייתם משנים במילה אחת, כדי שיהפוך מ״לא נכון״ ל״נכון״?
      - quote:
          title: ההרחבה מהמקור — להקריא אחרי ההיגד השלישי
          text: |-
            למדנו שגיל ההתבגרות עשוי לעורר תחושות שונות ולעיתים סותרות: שמחה, סקרנות, עוררות ויחד עם זאת, בהלה, סלידה ופחד.
            למדנו שההורמונים ותהליך הגדילה עשוי לגרום למצבי רוח משתנים. הדבר נורמלי וטבעי.
            לפעמים מתוך סקרנות טבעית, יש ילדים שרוצים להתנסות בהתנהגויות שאינן תואמות את גילם, הדבר עשוי לגרום לנזק בהווה ולפעמים גם בעתיד, ועל כן רצוי לחכות בסבלנות ולא להקדים את המאוחר.
            חוויית גיל ההתבגרות הינה אישית (בצד האוניברסליות שלה) כולם עוברים את זה במוקדם או במאוחר.
            השינוי המשמעותי בהיבט החברתי בגיל ההתבגרות הוא השפעת קבוצת השווים – לטוב ולרע. עלינו להיות ערים לכך ורגישים האחד כלפי השני.
      - ask: מי מסכים עם הנימוק של הקבוצה? מי חושב אחרת — ולמה?
      - say: עכשיו השלב השני — וכל תשובה נכונה שווה 10 נקודות.

  # ------------------------------------------------------------------ 14′–22′
  - id: round3
    title: המתבגר הבא — 10 נקודות
    minutes: 8
    practices:
      - תרגילי שליפה
      - זמן חשיבה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: ארבעה היגדים על בנים ובנות ועל לחץ חברתי, 10 נקודות לכל תשובה נכונה; ספירת הנקודות
    body:
      - moves:
          - לפני כל היגד — עשר שניות של שקט לחשוב לבד, ורק אז מתייעצים בקבוצה.
          - אחרי ההיגד השני — הקריאי את ההרחבה על סטריאוטיפים.
          - בסוף — ספרי את הנקודות, וכולם מוחאים כפיים לכל הקבוצות.
      - slide:
          kicker: השלב השני · היגד 7
          title: בת אינה יכולה לשחק כדורגל מפני שזהו משחק של בנים
          points:
