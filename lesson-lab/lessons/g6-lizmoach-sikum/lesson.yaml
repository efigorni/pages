          verbatim: [title]
          echo: true
          alt: דמות עומדת ליד כדורגל
          art: {file: art/ball.svg}
      - slide:
          kicker: השלב השני · היגד 8
          title: אף תכונה, תפקיד או התנהגות
          sub: אינם נחלתם הבלעדית של בנים או בנות
          points:
            - התשובה — נכון
          verbatim: [title, sub]
          echo: true
          cue: ההיגד הבא —
          alt: שני עיגולים חופפים — בנים, בנות, ובאמצע גם וגם
          art: {file: art/venn.svg}
      - quote:
          title: ההרחבה מהמקור — להקריא אחרי ההיגד השני
          text: |-
            ״סטריאוטיפ״ הוא הכללה או דעה קדומה על אדם או קבוצה לפי תכונות אופי או מגדר. דימויים אלה נושאים אופי מכליל מוגזם ושקרי.
            סטריאוטיפים מיניים הם אותם הרעיונות שיש לנו בהקשר לתפקידי מגדר המשויכים למין הביולוגי.
            אף תכונה, התנהגות או תחביב אינם נחלתם הבלעדית של בנים או בנות.
            כולם משלמים מחירים אישיים וחברתיים כתוצאה מהסטריאוטיפים המיניים.
            חשוב להסתכל בעין ביקורתית כלפי ההכללות הללו, ולזכור תמיד שקבוצה מורכבת מפרטים.
      - slide:
          kicker: השלב השני · היגד 9
          title: במצב של לחץ חברתי אין לי ברירה אלא להיכנע לתכתיבי הקבוצה
          points:
            - התשובה — לא נכון
          verbatim: [title]
          echo: true
          cue: אחרי ההרחבה —
          alt: קבוצה גדולה, ודמות אחת עומדת מולה
          art:
            - {use: crowd, x: 290, y: 280, w: 300}
            - {use: kid-stand, x: 70, y: 181, w: 140, color: teal}
      - slide:
          kicker: השלב השני · היגד 10
          title: יש לא מעט שיקולי דעת שעלי לקחת בחשבון
          sub: כשאני מקבל החלטה במצב של לחץ חברתי
          points:
            - התשובה — נכון
          verbatim: [title, sub]
          echo: true
          cue: ההיגד האחרון —
          alt: עמוד עם שלושה שלטי כיוון, ודמות לידו
          art:
            - {use: signpost, x: 300, y: 90, w: 220}
            - {use: kid-stand, x: 90, y: 230, w: 130, color: teal}
      - whisper: >-
          את ההרחבה של שני ההיגדים האחרונים — על לחץ חברתי — מקריאים בסוף השיעור, ב״חשוב לזכור״.
      - ladder:
          help: מה הייתם אומרים לחבר שחושב שזה נכון?
          challenge: תנו דוגמה מהחיים שמוכיחה את התשובה שלכם.
      - ask: איזה היגד הכי הפתיע אתכם — ולמה?
      - say: >-
          סיימתם! אלופים ואלופות אתם המתבגרים הבאים! ועכשיו — כל אחד, עם עצמו, יכתוב משאלות לדרך.

