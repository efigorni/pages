steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: summer
    title: הכל אני יכול בחופש הגדול
    minutes: 6
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      עשרה משפטים על החופש — אגודל למעלה או למטה; מה למדנו על עצמנו, ואיך נגוון את הזמן הפנוי
    body:
      - slide:
          kicker: מה הקשר? · אגודל למעלה או למטה
          title: ״הכל אני יכול בחופש הגדול…״
          sub: לייק? אגודל למעלה. לא בשבילי? אגודל למטה.
          echo: true
          alt: שמש, ומתחתיה אגודל למעלה ואגודל למטה
          art:
            - {use: sun, x: 180, y: 40, w: 260}
            - {use: thumb-up, x: 420, y: 330, w: 140}
            - {use: thumb-down, x: 60, y: 330, w: 140}
      - moves:
          - >-
            הסבירי: על כל משפט מרימים אגודל — למעלה אם הוא מתאים, למטה אם לא. מצביעים לפי מה שרוצים, לא לפי
            מה שבטוח יקרה, ואף אחד לא צריך להסביר.
          - >-
            הקריאי את המשפטים אחד־אחד, בקצב. אחרי כל אחד — מבט על הכיתה, ומשפט אחד על מה שאת רואה (״רוב
            הכיתה בעד שינה עד הצהריים״).
          - אחרי המשפט האחרון — שתי שאלות. ספרי בלב עד עשר לפני שאת מזמינה תשובות.
      - slide:
          kicker: בחופש הגדול… · 1 מתוך 3
          title: לייק, או לא בשבילי?
          points:
            - נשלים שעות שינה בחופשה, נישן לפחות עד הצהריים...
            - ניפגש עם חברים כל יום בחופשה...
            - נשחק במשחקי רשת לפחות שלוש שעות ביום...
            - נהיה במסגרת של קייטנה במהלך חלק מחופשת הקיץ...
          verbatim:
            - points
          echo: true
          cue: אחרי ההסבר —
          alt: זוג יד ביד, ושמש מעליו
          art:
            - {use: pair, x: 280, y: 220, w: 270}
            - {use: sun, x: 70, y: 50, w: 170}
      - slide:
          kicker: בחופש הגדול… · 2 מתוך 3
          title: לייק, או לא בשבילי?
          points:
            - נבלה הרבה עם קרובים ובני משפחה בחופשה...
            - ניסע לחופשה משפחתית...
            - נלמד ונתרגל קצת במהלך החופשה...
          verbatim:
            - points
          echo: true
          cue: המשפטים הבאים —
          alt: בית, וספר פתוח לידו
          art:
            - {use: house, x: 250, y: 150, w: 320}
            - {use: book, x: 50, y: 330, w: 190}
      - slide:
          kicker: בחופש הגדול… · 3 מתוך 3
          title: לייק, או לא בשבילי?
          points:
            - נקרא לפחות שני ספרים במהלך החופשה...
            - נשתף ברשתות החברתיות בתמונות וסרטונים שמתעדים את חוויות הקיץ שלנו...
            - נשתעמם בחופשת הקיץ...
          verbatim:
            - points
          echo: true
          cue: המשפטים האחרונים —
          alt: מצלמה, וספר פתוח לידה
          art:
            - {use: camera, x: 270, y: 150, w: 300}
            - {use: book, x: 50, y: 300, w: 190}
      - slide:
          kicker: רגע חושבים…
          title: מה למדתם על עצמכם מתוך ההצבעות?
          sub: ואיך תשלבו בחופש מגוון של פעילויות?
