sub: >-
  הקיץ מתקרב, ויש בו המון זמן פנוי. בשיעור הזה משחקים משחק אחד על המסך ומשחק אחד פנים אל פנים, משווים
  ביניהם, ומתכננים חופש עם מגוון של מפגשים.
format: מליאה, קבוצות ומשחק בחלל
question: במה שונה משחק עם חברים ברשת ממשחק פנים אל פנים — ואיך נשלב את שניהם בחופש?
takeaways:
  - יש משחקים מהנים ומקרבים גם ברשת וגם פנים אל פנים — ולכל סוג יש משהו משלו.
  - פנים אל פנים רואים את העיניים ואת שפת הגוף ומדברים ישירות — את זה המסך לא תמיד מעביר.
  - בחופש כדאי ליזום פעילויות מגוונות עם חברים, ולשמור על זמן מסך מאוזן ובטוח.
prep:
  - חלוקה מראש לקבוצות של 4–5 לפי השולחנות
  - >-
    שתי נקודות בחירה: לפני השיעור בחרי משחק אחד על המסך ומשחק אחד פנים אל פנים, והכיני רק את מה שהם
    צריכים

safe:
  - head: עמידה מול הכיתה
    text: >-
      ב״דג מלוח״ זזים לפי הרגלים אמיתיים, ולכן נשארו רק משפטים על הטלפון, על השינה ועל בית הספר. יצאו
      המשפטים שמראים מי נפגש עם חברים, מי היה במסיבה ומי מכין שיעורים עם חבר — שלא יסמנו את מי שאין לו עם
      מי. מרימים יד רק אם רוצים, ומותר להישאר במקום. מסבירים רק מתנדבים, ורק על עצמם. צחוק על המקום של
      מישהו — עוצרים מיד.
  - head: מי עלול להיפגע
    text: >-
      ב״חבילה מפרגנת עוברת״ — מי שהחבילה לא מגיעה אליו. החבילה עוברת כל פעם למי שעוד לא קיבל אותה, והפתק
      ״למי שהייתם רוצים להיפגש איתם אחר הצהריים״ יצא. בפתיחה מרימים אגודל לפי מה שרוצים, לא לפי מה שיקרה —
      מי שלא נוסע לחופשה או לקייטנה לא צריך לספר את זה.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 13 דקות ומעלה — ״קולאז׳ מפגשי משחק״; פחות — ישר ל״חשוב לזכור״.
  short:
