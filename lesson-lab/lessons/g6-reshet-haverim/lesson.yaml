      - ask: מה למדתם על עצמכם מתוך ההצבעות שלכם?
      - ask: כיצד תנהלו את הזמן הפנוי שלכם ותשלבו מגוון של פעילויות שבחרתם?
      - say: >-
          בחופש יש זמן גם למסך וגם לחברים. היום ננסה שני משחקים — אחד על המסך ואחד פנים אל פנים — ונבדוק מה
          ההבדל.

  # ------------------------------------------------------------------ 6′–14′
  - id: screen
    title: בחרי מסלול — משחק על המסך
    minutes: 8
    summary: בקבוצות, משחק אחד מול המסך
    body:
      - tracks:
          - title: כתב סתרים
            text: >-
              כל קבוצה מפענחת מסר מוצפן בעזרת מפת אותיות שעל המסך, ומגלה את אחד המסרים של השיעור.
            when: רוצים משחק שקט שכל הקבוצות משחקות בו בבת אחת, ואין צורך בחומרים מלבד המצגת.
            practices:
              - הוצאה למשימה
            spotlights:
              - שיתופיות בלמידה
            prep:
              - דף ריק לכל קבוצה
            body:
              - slide:
                  kicker: כתב סתרים · בקבוצות
                  title: פענחו את כתב הסתרים
                  points:
                    - ג=ה, ב=ר, א=ש, ד=ת, י=נ
                    - ו=ח, ז=ע, ט=ל, מ=ק, פ=כ, ס=צ
                    - פנכ טגנכהא חטאומ זק ורבנק **הק** כינק שט כינק.
                    - קכהא פנדדנ רמנס? רבחב! פחטיח קהנזנק!
                  verbatim:
                    - points
                  timer: 300
                  echo: true
                  alt: מפתח גדול, ומנעול לידו
                  art:
                    - {use: key, x: 160, y: 300, w: 300}
                    - {use: lock, x: 410, y: 60, w: 150}
              - moves:
                  - >-
                    הסבירי לפני שמחלקים את הדפים: כל זוג אותיות במפה התחלף — ג במקום ה, וה במקום ג. כותבים את
                    המסר על הדף.
                  - קבוצות של 4–5 לפי השולחנות. הפעילי את הטיימר.
                  - קבוצה שסיימה שולחת נציג ללחוש לך את המסר. אל תגלי אותו לקבוצות האחרות.
                  - בסוף — קבוצה אחת מקריאה, ואת מציגה את המסר. שאלי למה המילה ״גם״ מודגשת.
              - say: >-
                  אלופים! סומכים עליכם שתדעו לפענח את כתב הסתרים — וכך תגלו את אחד המסרים החשובים של השיעור.
              - task:
                  what: >-
                    כל קבוצה מפענחת את כתב הסתרים בעזרת מפת האותיות, וכותבת על הדף את המסר שגילתה.
                  time: 5 דקות
                  group: קבוצות של 4–5 לפי השולחנות
                  rules: כל זוג אותיות במפה מתחלף בשני הכיוונים; קבוצה שסיימה לוחשת לך את המסר
                  plenary: קבוצה אחת מקריאה את המסר, ושואלים למה ״גם״ מודגשת
                  help: התחילו במילה הקצרה ״זק״ — מה יוצא כשמחליפים בה את האותיות?
                  challenge: כתבו בעצמכם משפט קצר בכתב הסתרים, ותנו לקבוצה השכנה לפענח.
              - slide:
                  kicker: כתב סתרים · המסר
                  title: כיף להיפגש ולשחק עם חברים **גם** פנים אל פנים.
                  sub: מפגש כיתתי בקיץ? ברור! כולנו מגיעים!
                  verbatim: true
                  echo: true
                  cue: כשקבוצה ראשונה מפענחת —
                  alt: שלוש דמויות יחד, ושמש מעליהן
                  art:
                    - {use: group3, x: 120, y: 250, w: 360}
                    - {use: sun, x: 420, y: 40, w: 150}
              - ask: למה לדעתכם המילה ״גם״ מודגשת בכתב הסתרים?
          - title: סולמות, משימות וחבלים
            text: >-
              לוח סולמות וחבלים על המסך. כל קבוצה בתורה מטילה קובייה, ומי שנוחתת על כדור ים — מקבלת משימת
              שיתוף.
            when: >-
              רוצים משחק תורות עם הרבה דיבור בקבוצות, ואפשר להקרין את הלוח מקובץ ההנחיות של שפ״י או להדפיס
              אותו.
            practices:
              - הוצאה למשימה
            spotlights:
              - שיתופיות בלמידה
              - עניין ורלוונטיות
            prep:
              - >-
                לוח המשחק — בשקף 17 של המצגת המקורית (הקישור בתחתית המערך). פתחי אותו במחשב הכיתה, או הדפיסי
                לכל קבוצה את הלוח מקובץ ההנחיות שמקושר בשקף 16 שם
              - קובייה, וכלי משחק לכל קבוצה — פקק, מחק או פתק בצבע
            body:
              - slide:
                  kicker: סולמות, משימות וחבלים · בקבוצות
                  title: כדור ים? מקבלים משימה!
                  sub: סולם — עולים. חבל — יורדים. משימה שבוצעה — מתקדמים.
                  timer: 360
                  echo: true
                  alt: סולם, קובייה וחבל מתפתל
                  art: {file: art/ladder-die.svg}
              - moves:
                  - >-
                    הקריני את הלוח, או חלקי עותק לכל קבוצה, והסבירי את החוקים לפני שמתחילים. כל הקבוצות
                    מתחילות במשבצת 1.
                  - כל קבוצה בתורה שולחת נציג להטיל קובייה ולהזיז את כלי המשחק שלה.
                  - >-
                    קבוצה שנוחתת על כדור ים — הקריאי לה כרטיסיית משימה. מבצעת — מתקדמת כמו שכתוב בה. גם קבוצות
                    אחרות יכולות לבצע את המשימה ולהתקדם צעד אחד.
                  - כשהטיימר מצלצל — מנצחת הקבוצה שהגיעה הכי רחוק.
              - say: בזמן המשחק שימו לב גם לעצמכם — איך מדברים בקבוצה, ומי עוזר למי.
              - task:
                  what: >-
                    כל קבוצה בתורה מטילה קובייה ומתקדמת על הלוח. סולם — עולים, חבל — יורדים, כדור ים — מקבלים
                    משימה, ומי שמבצע אותה מתקדם.
                  time: 6 דקות
                  group: 4–5 קבוצות לפי השולחנות
                  rules: בכל תור מטיל נציג אחר; על משימה עונים כמה מבני הקבוצה
                  plenary: כשהטיימר מצלצל — הקבוצה שהגיעה הכי רחוק מנצחת
                  help: במשימה — התחילו במשחק שכולם בקבוצה מכירים.
                  challenge: אחרי כל משימה — מצאו דבר אחד שמשותף לכל הקבוצה.
              - handout:
                  title: כרטיסיות משימה
                  copies: עותק אחד, גזור לשבעה כרטיסים — אצלך
                  verbatim: true
                  lines: false
                  items:
                    - >-
                      שתפו בשני משחקים שאתם אוהבים לשחק פנים אל פנים ביחד עם חברים ו/או בני משפחה. (משחקים
                      לדוגמה: משחקי קופסה, משחקי כדור, קלפים וכדומה). התקדמו שני צעדים.
                    - >-
                      שתפו בשני משחקים שאתם אוהבים לשחק ברשת האינטרנט עם חברים ו/או בני משפחה. התקדמו שני צעדים.
                    - >-
                      שתפו במשחק או פעילות שאתם אוהבים לעשות לבד במרחב הפיזי (כגון: הבית, חצר וכדומה) או ברשת
                      האינטרנט. התקדמו צעד אחד.
                    - שתפו במקרה בו הטלפון הנייד והרשת סייעו לכם. התקדמו צעד אחד.
                    - שתפו במקרה בו סייעתם למישהו אחר ברשת. התקדמו צעד אחד.
                    - שתפו בפעילות אותה אתם מתכננים לעשות בחופשת הקיץ. התקדמו צעד אחד.
                    - שתפו בדבר חיובי אשר למדתם על עצמכם במהלך השנה הזו. התקדמו שני צעדים.
              - ask: איזו משימה הכי נהניתם לענות עליה — ולמה?
      - say: שיחקנו מול המסך. עכשיו — משחק בלי מסך בכלל, פנים אל פנים.

  # ------------------------------------------------------------------ 14′–22′
  - id: face
    title: בחרי מסלול — משחק פנים אל פנים
    minutes: 8
    stance: true
    summary: משחק בלי מסך — בתנועה על קו, או במעגל עם חבילה
    body:
      - tracks:
          - title: 1, 2, 3 דג מלוח
            text: >-
              כולם עומדים על קו. מי שהמשפט נכון לגביו מרים יד — וצועד כמה צעדים קדימה או אחורה.
            when: יש מסדרון, חצר או קיר אחורי פנוי, והכיתה אוהבת לזוז.
            practices:
              - זמן חשיבה
              - מהלכי שיח
            spotlights:
              - עניין ורלוונטיות
              - הערכה ורפלקטיביות
            prep:
              - קו על הרצפה — נייר דבק או קו דמיוני — במסדרון, בחצר או לאורך הקיר האחורי
            body:
              - slide:
                  kicker: 1, 2, 3 דג מלוח · על הקו
                  title: נכון לכם? הרימו יד!
                  sub: וצעדו קדימה או אחורה — כמה שהמורה אומרת.
                  echo: true
                  alt: שתי דמויות על קו — אחת מרימה יד וצעדה קדימה
                  art: {file: art/salty-line.svg}
              - say: >-
                  לפני כל משפט — חמש שניות לחשוב לבד, בלי להסתכל על אף אחד, ורק אז מרימים יד וזזים. מי שלא רוצה
                  להרים — לא מרים.
              - moves:
                  - >-
                    כולם עומדים על הקו, כתף ליד כתף. הסבירי: רק מי שהמשפט נכון לגביו מרים יד, ומי שלא מרים —
                    נשאר במקום.
                  - >-
                    הקריאי משפט, וחכי חמש שניות של שקט. אחר כך מי שמרים יד צועד — כמה צעדים ולאיזה כיוון, לפי
                    מה שכתוב בסוף המשפט.
                  - >-
                    אחרי המשפט האחרון — מי שהכי קדימה ניצח. שאלי מתנדב אחד מקדימה ואחד מאחור מה הזיז אותם,
                    וחוזרים למקומות.
              - handout:
                  title: המשפטים ל״דג מלוח״ — למורה
                  copies: עותק אחד, ביד שלך
                  verbatim: true
                  lines: false
                  items:
                    - >-
                      ירים את ידו מי שנשאר ללא בטרייה בטלפון הסלולארי לפחות פעם אחת בשבוע (למורה- מי שמצביע מתקדם
                      5 צעדים קדימה)
                    - >-
                      ירים את ידו מי שישן כאשר הטלפון הסלולארי שלו מונח לידו (למורה- מי שמצביע שילך לאחור 2 צעדים)
                    - ירים את ידו מי שנרדם פעם בשיעור (למורה- מי שמצביע שיתקדם 3 צעדים)
                    - >-
                      ירים את ידו מי שלא התעורר בזמן והגיע באיחור לביה"ס (למורה- מי שמצביע שילך לאחור 2 צעדים)
                    - >-
                      ירים את ידו מי שמחכה ליום האחרון של שנת הלימודים (למורה- מי שמצביע שיתקדם 3 צעדים)
                    - >-
                      ירים את ידו מי שמחכה לתחילת שנת הלימודים הבאה (למורה מי שמצביע שיתקדם צעד אחד)
                    - ירים את ידו מי שלפעמים משתעמם לשחק ברשת (למורה מי שמצביע שיתקדם 5 צעדים)
              - ask: מה הזיז אתכם הכי הרבה — הטלפון, השינה או בית הספר? מי רוצה להגיב למה שנאמר?
          - title: חבילה מפרגנת עוברת
            text: >-
              יושבים במעגל, מוזיקה מתנגנת והחבילה עוברת מיד ליד. כשהמוזיקה נעצרת — מי שמחזיק פותח פתק,
              ומעביר את החבילה למי שהפתק מתאר.
            when: >-
              אפשר לשבת במעגל בכיתה, ורוצים משחק שקט יותר — שבו מי שמקבל את החבילה שומע משהו טוב על עצמו.
            practices:
              - הוצאה למשימה
            spotlights:
              - שיתופיות בלמידה
            prep:
              - חבילה — קופסה או עיתונים מקופלים — ובתוכה הפתקים
              - מוזיקה במחשב הכיתה
            body:
              - slide:
                  kicker: חבילה מפרגנת עוברת · במעגל
                  title: חבילה מפרגנת עוברת… מוכנים?
                  sub: כשהמוזיקה נעצרת — פותחים פתק, ומעבירים.
                  verbatim:
                    - title
                  echo: true
                  alt: חבילה עטופה ותו מוזיקה, ושתי ידיים מושטות
                  art: {file: art/parcel.svg}
              - say: >-
                  החבילה עוברת כל פעם למי שעוד לא קיבל אותה — ככה בכל סבב מישהו חדש שומע משהו טוב.
              - moves:
                  - >-
                    הכיתה במעגל, והחבילה אצלך. הסבירי: כשהמוזיקה נעצרת, מי שמחזיק פותח פתק אחד, מקריא אותו,
                    ומעביר את החבילה למי שהפתק מתאר.
                  - כלל אחד חשוב — החבילה עוברת רק למי שעוד לא קיבל אותה.
                  - >-
                    עצרי את המוזיקה כל 20–30 שניות. כשהמוזיקה חוזרת, החבילה ממשיכה במעגל ממי שקיבל אותה.
                  - אחרי שמונה־תשעה פתקים — שאלי איך הרגיש לקבל את החבילה, ואיך הרגיש לתת.
              - task:
                  what: >-
                    משחקים במעגל: כשהמוזיקה נעצרת, מי שמחזיק את החבילה פותח פתק, מקריא אותו ומעביר את החבילה למי
                    שהפתק מתאר.
                  time: 6 דקות
                  group: כל הכיתה במעגל
                  rules: החבילה עוברת רק למי שעוד לא קיבל אותה; מקשיבים בשקט לכל פתק
                  plenary: איך הרגיש לקבל את החבילה — ואיך הרגיש לתת
                  help: לא יודעים למי להעביר? חפשו מי שעוד לא קיבל את החבילה — ושהפתק נכון גם לגביו.
                  challenge: כשאתם מעבירים — אמרו במשפט אחד למה דווקא לו.
              - handout:
                  title: פתקים לחבילה
                  copies: עותק אחד, גזור לתשעה פתקים — בתוך החבילה
                  verbatim: true
                  lines: false
                  items:
                    - העבירו את החבילה למי שאוהב לספר בדיחות ולהצחיק בכיתה
                    - העבירו את החבילה למי שגר הכי קרוב אליך
                    - >-
                      העבירו את החבילה למי שאתם אוהבים לשחק עימם יחד במחשב או במשחק ברשת האינטרנט
                    - העבירו את החבילה למי שמהיר בכיתה
                    - העבירו את החבילה למי שמצייר יפה
                    - העבירו את החבילה למי שעוזר לכולם
                    - העבירו את החבילה למי שלובש חולצה בצבע החולצה שלך
                    - העבירו את החבילה למי שאתם אוהבים ללמוד איתם יחד למבחנים
                    - העבירו את החבילה למי שמשחק בצורה הוגנת במשחקי רשת
              - ask: איך הרגיש לקבל את החבילה — ואיך הרגיש לתת אותה?
      - say: שיחקנו פעם על המסך ופעם פנים אל פנים. בואו נשווה.

