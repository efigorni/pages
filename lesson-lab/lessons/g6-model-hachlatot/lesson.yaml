steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: open
    title: קבלת החלטות בשבילי היא כמו…
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      כתיבה אישית קצרה — איזה דימוי מתאר את קבלת ההחלטות שלי, ולמה; במליאה — אילו רגשות עולים כשצריך
      להחליט
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: קבלת החלטות בשבילי היא כמו…
          sub: בחרו דימוי מהתמונה — או המציאו משלכם — וכתבו למה.
          timer: 180
          echo: true
          alt: חמישה דימויים — נורה דולקת, הר, מטרה, ענן גשם, וגבעול שמתפצל לשלושה חיצים
          art: {file: art/images.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. כותבים במחברת בלי הסבר נוסף; בינתיים — נוכחות, וסיבוב בין השולחנות.
          - אחרי שלוש דקות — עברי על הדימויים, ולכל אחד הוסיפי משפט מהרשימה.
          - >-
            הזמיני ארבעה–חמישה לשתף איזה דימוי בחרו ולמה. אחר כך שאלי את הכיתה מה משותף לתשובות, ומה גורם
            לרגשות האלה.
      - list:
          - רעיון שנדלק פתאום — ההחלטה ברורה מייד, בלי התלבטות, כאילו נדלקה נורה בראש.
          - התמודדות עם אירוע מלחיץ — יש בהחלטה אחריות ותוצאות. ומה אם אחליט לא נכון?
          - התמקדות במטרה — ההחלטה מכוונת אותי אל המטרה שלי, בדרך להשיג אותה.
          - מעגל של דאגות — לא בטוחים מה נכון, ואחר כך דואגים שיקרו דברים לא טובים בגלל ההחלטה.
          - התלבטות בלתי פוסקת — כל הזמן מתלבטים מה הכי כדאי. יש המון אפשרויות — איך בוחרים?
      - say: שלוש דקות, לבד. אין דימוי נכון — רק מה שמתאים לכם.
      - ladder:
          help: חשבו על החלטה אחת מהשבוע — איך הרגשתם רגע לפני שהחלטתם?
          challenge: המציאו דימוי משלכם, שלא נמצא על המסך — ומה הוא אומר עליכם?
      - ask: איזה דימוי בחרתם — ואילו רגשות עולים בכם כשאתם צריכים לקבל החלטה?
      - say: >-
          יש החלטות שקל לקבל, ויש כאלה שמלחיצות. כדי שהחלטה חשובה לא תהפוך למעגל של דאגות — אפשר להיעזר
          במודל.

  # ------------------------------------------------------------------ 6′–12′
  - id: model
    title: מודל קבלת החלטות
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      שישה שלבים — קודם המודל כולו, ואז שלב אחרי שלב על אירוע אחד מהמקור: שיעורי בית במתמטיקה או אימון
      כדורסל
    body:
      - slide:
          kicker: מודל קבלת החלטות
          title: שישה שלבים להחלטה שקולה
          alt: שישה שלבים זה מתחת לזה, ובשלב השני שתי אפשרויות זו לצד זו
          art: {file: art/model.svg}
      - moves:
          - הציגי קודם את המודל כולו — מהסוגיה ועד המשוב — ורק אחר כך עברי שלב אחרי שלב.
          - אמרי שיכולות להיות גם יותר משתי אפשרויות, והמודל עובד גם אז.
          - >-
            עברי על השלבים עם האירוע לדוגמה: בכל שלב שאלי את הכיתה, וחכי עשר שניות לפני שמזמינים תשובות.
            הדהדי כל תשובה, ותני לתלמידים להוסיף זה על דברי זה.
      - quote:
          title: אירוע לדוגמה — להקריא
          text: יש לי הרבה שיעורים במתמטיקה למחר, עוד לא התחלתי להכינם ויש אימון כדורסל במגרש. מה לעשות?
      - slide:
          kicker: המודל · שלב אחרי שלב
          title: מתחילים מהסוגיה
          points:
            - מהי הסוגיה העומדת בפניי?
            - מהן האפשרויות ביניהן אני צריך/ה לבחור?
            - מה ידוע לי על כל אחת מהאפשרויות?
          verbatim: [points]
          echo: true
          cue: אחרי שהמודל כולו הוצג —
          alt: זכוכית מגדלת, ודף לידה
          art:
            - {use: magnifier, x: 280, y: 130, w: 290, color: teal}
            - {use: note, x: 70, y: 200, w: 150}
      - slide:
          kicker: המודל · שלב אחרי שלב
          title: שוקלים, מחליטים ובודקים
          points:
            - מהם היתרונות והחסרונות של כל אפשרות?
            - אני מקבל/ת את ההחלטה ומבצע/ת אותה
            - אני בודק/ת אם ההחלטה שקיבלתי הייתה נכונה וטובה עבורי
          verbatim: [points]
          echo: true
          cue: השלבים הבאים —
          alt: מאזניים, ועיגול עם וי לידם
          art:
            - {use: scale, x: 260, y: 110, w: 320}
            - {use: check, x: 70, y: 290, w: 150, color: moss}
      - ask: מה הסוגיה כאן — ומהן האפשרויות? מה ידוע לנו על כל אחת מהן?
      - say: אז הסוגיה היא ___ — הבנתי נכון? מי רואה אפשרות נוספת?
      - say: ככה עובדים עם המודל. עכשיו תורכם — כל שלשה מקבלת אירוע אחר.

  # ------------------------------------------------------------------ 12′–21′
  - id: triads
    title: התנסות בשלשות
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      כל שלשה מקבלת אירוע, עוברת עליו שלב אחרי שלב במודל, ממלאת יתרונות וחסרונות — ומחליטה
    body:
      - moves:
          - >-
            הסבירי את המשימה לפני שמחלקים: שלוש דקות לסוגיה ולאפשרויות, ארבע דקות ליתרונות, לחסרונות
            ולהחלטה. השאלות כבר על הלוח.
          - חלקי לכל שלשה כרטיס אירוע ודף עבודה. כל אירוע מגיע לשתיים–שלוש שלשות.
          - >-
            הסתובבי בין השלשות. שלשה שנתקעת — שאלי אותה את השאלה של השלב שבו היא נמצאת. דקה לפני הסוף —
            הזכירי לכתוב את ההחלטה ואת הנימוק.
      - slide:
          kicker: בשלשות · 7 דקות
          title: מה לעשות?
          sub: קראו את האירוע, ועברו עליו שלב אחרי שלב במודל.
          timer: 420
          echo: true
          alt: המודל — שישה שלבים, מהסוגיה ועד המשוב
          art: {file: art/model.svg}
      - board:
          - נסחו את הסוגיה.
          - אילו אפשרויות קיימות?
          - נתחו כל אפשרות — יתרונות וחסרונות.
          - מה האפשרות שבחרתם? איזו החלטה קיבלתם?
          - מה לדעתכם יהיו התוצאות של ההחלטה שקיבלתם?
      - say: >-
          כל שלשה מקבלת אירוע אחד. קראו אותו בקול, ועברו עליו לפי השלבים — בסוף מחליטים יחד מה לעשות, ולמה.
      - task:
          what: >-
            קוראים את האירוע, מנסחים את הסוגיה ואת האפשרויות, כותבים בדף את היתרונות והחסרונות של כל אפשרות,
            ומחליטים יחד — עם נימוק. בסוף כותבים מה לדעתכם יהיו התוצאות.
          time: 7 דקות
          group: שלשות לפי השולחנות; כל אירוע לשתיים–שלוש שלשות
          rules: כל אחד בשלשה מציע לפחות יתרון או חיסרון אחד; לא מסכימים? מחליטים ברוב, וכותבים גם את הדעה האחרת
          plenary: השלשות עם אותו אירוע מציגות את ההחלטה ואת הנימוק, ומשווים
          help: התחילו מהשאלה ״מה בדיוק צריך להחליט כאן?״ — ואז כתבו את שתי האפשרויות.
          challenge: מצאו אפשרות שלישית, שלא כתובה באירוע — ובדקו גם אותה.
      - handout:
          title: כרטיסי אירוע
          copies: שלושה עותקים, גזורים לכרטיסים — כרטיס אחד לכל שלשה
          verbatim: true
          lines: false
          items:
            - >-
              להורים חשוב שאצטרף אליהם לארוחה בשישי בערב אצל סבא וסבתא, אך החברים מהכיתה נפגשים אצל חבר
              באותה שעה. מה לעשות?
            - >-
              שני חברים מהכיתה מתכננים לעשות חרם על חבר שלישי וביקשו שאתמוך בהם. אין לי שום דבר אישי נגדו,
              אבל אני לא רוצה שהם יכעסו עליי. מה לעשות?
            - >-
              המורה למחול הציעה לי ריקוד סולו במסיבת הסיום. יש לי גם תפקיד משני בהצגה. אני מאוד אוהב/ת לרקוד
              ולשחק. המחנכת הסבירה שכל אחד יכול לבחור רק תפקיד מרכזי אחד. מה לעשות?
            - >-
              עוד יומיים יש מבחן גדול בלשון, עדיין לא התחלתי ללמוד. חבר/ה התקשר/ה והציע/ה לי ללכת לסרט. מה
              לעשות?
      - handout:
          title: דף לעבודה בשלשות
          copies: עותק לכל שלשה
          items:
            - הסוגיה — מה צריך להחליט?
            - אפשרות א׳ — יתרונות
            - אפשרות א׳ — חסרונות
            - אפשרות ב׳ — יתרונות
            - אפשרות ב׳ — חסרונות
            - ההחלטה שקיבלנו, ולמה
            - מה יהיו התוצאות, לדעתנו?

  # ------------------------------------------------------------------ 21′–27′
  - id: compare
    title: משווים החלטות
    minutes: 6
    practices:
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: השלשות עם אותו אירוע מציגות את ההחלטה והנימוק — ממה נבעו ההבדלים, ואיך המודל עזר
    body:
      - slide:
          kicker: משתפים · אירוע אחרי אירוע
          title: הציגו את הסוגיה ואת ההחלטה — ונמקו
          points:
            - ממה נבעו ההבדלים, או הדמיון?
            - איך עזר לכם המודל?
          echo: true
          alt: ארבעה סביב שולחן עגול, ובועות צ׳אט לידם
          art:
            - {use: circle4, x: 270, y: 150, w: 300}
            - {use: chat, x: 60, y: 60, w: 200}
      - moves:
          - >-
            אירוע אחרי אירוע — הקריאי את האירוע, ושתי שלשות שקיבלו אותו מציגות את ההחלטה ואת הנימוק, דקה
            לכל אחת.
          - אחרי כל אירוע — שאלי את הכיתה ממה נבעו ההבדלים או הדמיון, ותני לתלמידים להגיב זה לזה.
          - בסוף — שאלה אחת על המודל עצמו.
      - ask: ממה נבעו ההבדלים בין ההחלטות — ומה כל שלשה שקלה?
      - say: אז מה שהכריע אצלכם זה ___ — הבנתי נכון? מי שקל את זה אחרת?
      - ask: איך עזר לכם המודל — ובאיזה שלב הכי הרבה?

  # ------------------------------------------------------------------ +5′
  - id: teach
