          - הסתובבי בין הזוגות. זוג שנתקע — הציעי לו לבחור שלב אחד במודל.
          - שמעי שלושה זוגות, ושאלי את הכיתה מה ילד בכיתה ג׳ ייקח מזה.
      - say: מי שמלמד לומד פעמיים. מה הייתם מלמדים את כיתה ג׳ — ואיך?
      - task:
