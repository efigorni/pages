            כל זוג בוחר רעיון אחד מהשיעור — שלב במודל, דימוי, או למה שלשות החליטו אחרת — ומתכנן איך ילמד
            אותו ילדים בכיתה ג׳, עם דוגמה מהחיים שלהם.
          time: 3 דקות
          group: זוגות
          rules: דוגמה שילדים בכיתה ג׳ מכירים; משפט אחד שהם ייקחו איתם
          plenary: שלושה זוגות מספרים מה ילמדו, ואיך
          help: בחרו שלב אחד במודל, ותנו לו דוגמה מהחצר של בית הספר.
          challenge: איך תסבירו את כל ששת השלבים בלי להשתמש במילה ״מודל״?
      - ask: מה תלמדו את כיתה ג׳ — ואיך?

  # ------------------------------------------------------------------ +5′
  - id: unit
    title: מסכמים את היחידה
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: כתיבה קצרה וסבב מתנדבים — מה למדנו מהתבוננות בעצמנו, ומה השתנה בדרך שבה אנחנו מחליטים
    body:
      - whisper: >-
          היחידה ״קבלת החלטות״: בשיעור הראשון עסקו בהחלטות של היום־יום ובמעגלי ההשפעה שלהן; בשיעור השני —
          בארבעה סגנונות של קבלת החלטות (הימור, לפי הרגש, שיקול דעת, ניסיון העבר), ובחשיבות ובטווח הזמן
          שעוזרים לבחור ביניהם; והיום — במודל. השאלה כאן היא על הדרך שבה כל אחד מחליט, כך שגם מי שהחסיר
          שיעור יכול לענות.
      - slide:
          kicker: אם נשאר זמן · מסכמים
          title: מה למדתם מהתבוננות על עצמכם?
          sub: על הדרך שבה אתם מקבלים החלטות — ומה השתנה בה.
          echo: true
          alt: נבט בעציץ, ודמות עומדת לידו
          art:
            - {use: sprout, x: 280, y: 120, w: 280}
            - {use: kid-stand, x: 90, y: 250, w: 130, color: teal}
      - moves:
          - דקה וחצי של כתיבה במחברת, לבד.
          - סבב מתנדבים — כל אחד משפט אחד. מותר לוותר.
      - ladder:
          help: חשבו על החלטה אחת מהתקופה האחרונה — החלטתם אחרת ממה שהייתם מחליטים פעם?
          challenge: מה תעשו אחרת בהחלטה הגדולה הבאה שלכם?
      - ask: מה למדתם מהתבוננות על עצמכם — ומה השתנה בדרך שבה אתם מחליטים?

