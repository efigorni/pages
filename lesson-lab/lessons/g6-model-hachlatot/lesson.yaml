            - {use: kid-stand, x: 90, y: 250, w: 130, color: teal}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — המודל שלי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: שלבי המודל מהזיכרון, ומשהו שאני לוקח על עצמי לעשות אחרת; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות, לבד ובשקט — שלוש דקות, מהזיכרון, בלי לחפש במחברת. כולם מוסרים פתק בדלת, גם מי
          שכתב רק שורה אחת.
      - exit:
          form: board
          title: לפני שיוצאים
          prompts:
            - כתבו מהזיכרון את שלבי המודל — כמה שאתם זוכרים.
            - משהו שאני לוקח על עצמי לעשות אחרת בפעם הבאה שאקבל החלטה חשובה.
          look_for: >-
            חפשי מי שזוכר את רוב השלבים, ומי שמדלג על איסוף המידע או על המשוב — אלה השלבים שהכי קל לשכוח. כוונה
            כללית מדי (״לחשוב יותר״) — שאלה אישית בשקט: מה בדיוק, ובאיזו החלטה.
          timer: 180
          alt: דף עם שורות, ועיפרון לידו
          art:
            - {use: note, x: 300, y: 100, w: 256}
            - {use: pencil, x: 80, y: 260, w: 200, color: orange}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
