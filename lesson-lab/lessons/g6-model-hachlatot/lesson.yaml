sub: >-
  יש החלטות שכדאי לעצור ולחשוב עליהן. בשיעור הזה מכירים מודל של שישה שלבים לקבלת החלטות, מתנסים בו
  בשלשות על אירועים מהחיים, ומגלים למה אותו אירוע יכול להוביל להחלטות שונות.
format: מליאה ושלשות
question: איך מקבלים החלטה שקולה — שלב אחרי שלב?
takeaways:
  - יש החלטות שכדאי לעצור ולחשוב עליהן — לא רק לפי התחושה של הרגע.
  - >-
    המודל עוזר: מגדירים את הסוגיה, בודקים את האפשרויות, אוספים מידע, שוקלים יתרונות וחסרונות, מחליטים
    ומבצעים — ובודקים אחר כך.
  - אנשים שונים יכולים להגיע להחלטות שונות על אותו אירוע, והמודל עוזר להבין למה.
prep:
  - חלוקה מראש לשלשות לפי השולחנות, ואיזה אירוע מקבלת כל שלשה — כל אירוע לשתיים–שלוש שלשות
  - חמש השאלות של ״התנסות בשלשות״ — כתובות על הלוח לפני השיעור

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור, ושאחד מכרטיסי האירוע עוסק בחרם. שאלי אם יש עכשיו בכיתה חרם, או ילד שמרגיש בחוץ —
      אם כן, את כרטיס החרם לא מחלקים, והשלשות מקבלות את שלושת האחרים. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהיה בחרם — מכל צד — עלול לזהות את עצמו בכרטיס. מדברים על ההחלטה של מי שמבקשים ממנו לתמוך, לא
      על ילדים מהכיתה, ולא שואלים מי היה בחרם או מי עשה חרם. בהשוואה בין השלשות — הנימוקים הם על הדמות
      שבכרטיס, בלי שמות.
  - head: לא לוחצים לשתף
    text: >-
      בפתיחה כל אחד בוחר דימוי לעצמו; משתפים רק מתנדבים, ומותר לבחור ״מעגל של דאגות״ בלי להסביר למה. גם
      בסיכום היחידה — מספרים רק על עצמנו, ומותר לוותר.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל חרם שקורה עכשיו, עליו או על חבר — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

