steps:
  # ------------------------------------------------------------------ 0′–10′
  - id: evening
    title: עוד ערב רגיל
    minutes: 10
    practices:
      - קדימה ללמידה
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      כתיבה קצרה בכניסה — מה עשיתם אתמול ב־18:00; סיפורה של עלמה, מה קורה בעולמה הפנימי, ומה הייתם
      מציעים לה
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: ומה אתם עשיתם אתמול ב־18:00 בערב?
          sub: מה עשיתם, עם מי — ואיפה היה הטלפון?
          timer: 180
          echo: true
          alt: שעון קיר, ודמות כותבת ליד שולחן
          art:
            - {use: clock, x: 330, y: 60, w: 230}
            - {use: kid-desk, x: 60, y: 250, w: 200, color: teal}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. כותבים שלוש דקות בלי הסבר נוסף; בינתיים — נוכחות.
          - שמעי שתיים־שלוש תשובות קצרות.
          - הציגי את סיפורה של עלמה, ואמרי שזה סיפור דמיוני. הקריאי את שני חלקיו בקול.
          - >-
            שאלי את שאלת המפתח — דקה של כתיבה במחברת, מה הייתם רואים ושומעים בעולמה הפנימי. שמעי שלושה–ארבעה
            מתנדבים.
          - שאלי מה הייתם מציעים לעלמה, והזמיני את הכיתה להגיב זה לזה — ״מי מסכים? מי היה מציע משהו אחר?״
      - ladder:
          help: מה עשיתם אחרי בית הספר — ובאיזה רגע הייתם עם הטלפון?
          challenge: כמה מכל זה קרה מול מסך, וכמה בלעדיו — ומה מזה הייתם משתפים ברשת?
      - slide:
          kicker: סיפור דמיוני
          title: זה החל כעוד ערב רגיל...
          sub: עלמה, תלמידת כיתה ט׳, בדרך הביתה מאימון.
          verbatim:
            - title
          cue: אחרי שתיים־שלוש תשובות —
          alt: טלפון עם התראות, ונערה עומדת לידו
          art:
            - {use: phone-notify, x: 330, y: 100, w: 210}
            - {use: kid-stand, x: 110, y: 200, w: 140, color: purple}
      - quote:
          title: סיפורה של עלמה, חלק א׳ — להקריא
          text: |-
            השעה היתה 18:00 כאשר עלמה, תלמידת כיתה ט׳ בחטיבת ״חבצלות״ יצאה מאולם הספורט בדרכה חזרה הביתה מאימון כדור-עף.

            תוך כדי הצעידה הביתה לקחה עלמה לידיה את הטלפון הנייד על מנת להתקשר לתמר, חברתה הטובה, ונדהמה לגלות כי זו הקדימה אותה ושלחה לה הודעה עם שלושה סימני שאלה, ולצידם תמונה וצילום מסך של התכתבות. בתמונה שצולמה ככל הנראה במהלך האימון נראתה עלמה כשהיא קופצת לכדור וחלק גופה העליון נחשף במקצת.

            עלמה פתחה את צילום המסך והזדעזעה לגלות כי בקבוצת התלמידים בכיתה מספר חברות וחברים שיתפו תמונה זו והגיבו בשלל תגובות כגון ״יפה לך עלמה...״ / ״מה עלמה... החולצה קצת קטנה?״ / ״וואלה עלמה, אצלי קיבלת נקודות״. בנוסף, לצד ההודעות היו מספר הודעות מחברות וחברים אשר ניסו להגן עליה; ״וואי אור, אתה פשוט יצור״ / ״תמחקו את זה מיד הזויים״ ועוד. תמונתה של עלמה הייתה ״הנושא הבוער״ בקבוצה במשך שעה שלמה, מבלי שהיא ידעה על כך דבר.
      - quote:
          title: סיפורה של עלמה, חלק ב׳ — להקריא
          text: |-
            עלמה סגרה מיד את הנייד, מבועתת ממה שראתה זה עתה. היא הרגישה את הדופק שלה מואץ ואת רגליה כושלות ושהיא מתקשה לעמוד או לנשום כמו שצריך. היא הרגישה מסוחררת ולכן התיישבה על המדרכה.

            עלמה הייתה מבוהלת.

            לבסוף היא הצליחה להגיע לביתה אך כל אותו הערב היא הסתגרה בחדרה. להוריה המודאגים לא נידבה עלמה יותר מידי מידע, ורק אמרה להם שכואבת לה הבטן ושהיא מעוניינת לנוח במיטה. הטלפון שלה הוצף בשיחות ובהודעות אך אפילו לתמר לא יכלה לענות, על אף שזו התקשרה אליה מספר פעמים.
      - slide:
          kicker: המפתח לעולמה הפנימי · כולם כותבים
          title: מה הייתם רואים ושומעים בעולמה הפנימי של עלמה?
          sub: דמיינו מפתח לדלת מיוחדת — אל המחשבות והרגשות שלה.
          timer: 60
          echo: true
          cue: אחרי החלק השני של הסיפור —
          alt: נערה יושבת, ומעליה ענן מחשבה ובו מפתח
          art:
            - {use: thought, x: 40, y: 24, w: 300}
            - {use: key, x: 139, y: 114, w: 110}
            - {use: kid-sit, x: 380, y: 230, w: 180, color: purple}
      - ladder:
          help: התחילו ב״אני מרגישה…״ או ב״אני חושבת ש…״ — כאילו אתם עלמה.
          challenge: מה עלמה לא מספרת להוריה ולתמר — ולמה, לדעתכם?
      - ask: >-
          אם היה לכם מפתח להיכנס בדלת מיוחדת אל תוך עולמה הפנימי של עלמה — מה הייתם רואים ושומעים שם?
      - ask: אילו הייתם מכירים את עלמה, מה הייתם מציעים לה לעשות? איזה סיוע יכול היה להתאים לה?
      - say: עלמה נשארה עם זה לבד. עכשיו כל אחד יחשוב רגע על עצמו — בשקט, במחברת.

  # ------------------------------------------------------------------ 10′–17′
  - id: mine
    title: לשת״ף — לא נשארים לבד
    minutes: 7
    practices:
      - כולם כותבים
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: >-
      כתיבה אישית שלא נאספת — אירוע שבו הייתי צריך עזרה; בזוגות — רק מה שבוחרים; במליאה — למה לא תמיד
      קל לבקש עזרה?
    body:
      - slide:
          kicker: לפני שכותבים על עצמנו
          title: הנחיות לשיח מיטבי
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          alt: שתי דמויות יד ביד, ולב מעליהן
          art:
            - {use: pair, x: 170, y: 215, w: 270}
            - {use: heart, x: 240, y: 70, w: 140}
      - moves:
          - הציגי את ההנחיות, והקריאי בקול את השלישית — היא כלל השיח של היום.
          - >-
            אמרי בבירור — הכתיבה לא נאספת, ואף אחד לא יקרא אותה. אפשר לבחור אירוע קטן, או אירוע שנתקלו בו ולא
            קרה להם.
          - שלוש דקות של כתיבה בשקט. הסתובבי בין השולחנות בלי להציץ בדפים.
          - שתי דקות בזוגות — כל אחד מספר רק מה שהוא בוחר. אפשר לספר רק מה עזר, בלי מה שקרה.
          - במליאה לא שואלים מה קרה — שאלי רק על התחושות, ולמה לא תמיד קל לבקש עזרה.
      - slide:
          kicker: לבד, במחברת · ואז בזוגות
          title: לשת״ף — לוודא שלא תישארו פה לבד!
          sub: אירוע קשה שחוויתם, או שנתקלתם בו ברשת.
          points:
            - מה קרה — רק מה שנוח לכם לכתוב
            - מה חשבתם? מה הרגשתם?
            - מה עשיתם — פניתם לעזרה?
            - מה, או מי, עזר?
          verbatim:
            - title
          timer: 180
          echo: true
          cue: אחרי ההנחיות —
          alt: דמות כותבת ליד שולחן, ומנעול לידה
          art:
            - {use: kid-desk, x: 186, y: 170, w: 250, color: teal}
            - {use: lock, x: 456, y: 60, w: 130}
      - say: >-
          כותבים לעצמכם — אף אחד לא יאסוף את זה. בזוג מספרים רק מה שבוחרים, ומותר לספר רק מה עזר.
      - ladder:
          help: התחילו מהשאלה האחרונה — מה, או מי, עזר לכם?
          challenge: האם יכולתם לבקש עזרה מוקדם יותר? מה עצר אתכם?
      - ask: איך הרגשתם כשהתבקשתם להיזכר ולשתף? ולמה לא תמיד קל לבקש עזרה, כשאנחנו זקוקים לה?

  # ------------------------------------------------------------------ 17′–22′
  - id: barriers
    title: אם אדפוק בדלת
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      בזוגות — 11 משפטים שעוצרים בני נוער מלבקש עזרה: מסמנים שניים ומוסיפים אחד; במליאה — מה מהם מיוחד
      לפגיעה ברשת
    body:
      - slide:
          kicker: מה עוצר אותנו? · בזוגות
          title: אם אדפוק בדלת, האם יהיה שם מישהו שיפתח אותה?
          points:
            - אני מתבייש לפנות ולבקש עזרה...
            - מה כבר יוכלו לעזור לי? זה בלתי הפיך, זה כבר הופץ ברשת
            - אם אשתף, בטוח יחרימו לי את הטלפון או יאסרו עלי להכנס לאפליקציה
          verbatim: true
          timer: 120
          echo: true
          alt: דמות מרימה יד ודופקת על דלת
          art:
            - {use: kid-hand, x: 140, y: 170, w: 150, color: teal}
            - {use: door, x: 330, y: 120, w: 210}
      - moves:
          - חלקי לכל זוג את הדף. כל זוג מסמן שני משפטים שנשמעים לו הכי נפוצים אצל בני נוער, ומוסיף משפט משלו.
          - במליאה — שאלי אילו משפטים סומנו הכי הרבה, ורשמי על הלוח את המשפטים שהזוגות הוסיפו.
