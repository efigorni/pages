sensitivity: high

sub: >-
  גם ברשת, כשקורה משהו קשה — לא נשארים עם זה לבד. בשיעור הזה נכנסים לעולמה של עלמה, מזהים מה עוצר
  אותנו מלבקש עזרה, ומוצאים את הדלתות שאפשר לדפוק עליהן.
format: לבד, זוגות ומליאה
question: מה עוצר אותנו מלבקש עזרה כשקורה משהו קשה ברשת — ולמי אפשר לפנות?
takeaways:
  - פנייה לעזרה היא פעולה של כוח — היא יכולה להקל, לעצור את הפגיעה ולפתוח דרך לשינוי.
  - >-
    יש דברים שעוצרים אותנו מלבקש עזרה — בושה, פחד מאכזבה, ״זה כבר הופץ״ — וכדאי להכיר אותם כדי לעבור
    אותם.
  - >-
    יש למי לפנות — הורים, חברים, הצוות בבית הספר ומוקד 105 — וגם אנחנו יכולים להיות דלת פתוחה בשביל
    מישהו אחר.
prep:
  - שיחה עם היועצת לפני השיעור — ראי ״לפני השיעור״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — סיפור דמיוני על תמונה חושפנית של תלמידת ט׳ שהופצה בקבוצת הכיתה, כתיבה
      אישית על אירוע שבו התלמידים היו צריכים עזרה, ומה עוצר בני נוער מלפנות. שאלי אם יש בכיתה מי שתמונה שלו
      הופצה, מי שנפגע לאחרונה ברשת, ואם היה בשכבה אירוע דומה. אם כן — החליטו יחד אם ללמד עכשיו, ואם היא
      מצטרפת לשיעור. בקשי שתהיה זמינה אחרי השיעור ובמשך היום.
  - head: מי עלול להיפגע
    text: >-
      מי שתמונה שלו הופצה, או שקיבל תגובות על הגוף, עלול לזהות את עצמו בעלמה; מי שהפיץ או הגיב — עלול
      להרגיש מואשם. מדברים על מעשים ולא על אנשים בכיתה, ואף פעם לא מאשימים את מי שנפגע — לא את התמונה ולא
      את החולצה. התגובות בסיפור הן הטרדה, ואומרים את זה בפשטות. מי שאין לו למי לפנות עלול להרגיש את זה
      בשלב הדלתות — לא שואלים אף אחד בשמו למי הוא היה פונה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום, מהמקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״.
      הכתיבה האישית לא נאספת, ואפשר לבחור אירוע קטן, או אירוע שנתקלו בו ולא קרה להם. בזוגות מספרים רק מה
      שבוחרים — אפשר לספר רק מה עזר. במליאה לא שואלים מה קרה, בלי שמות ובלי צילומי מסך; לא קוראים בשם למי
      שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל תמונה שלו שמסתובבת עכשיו, סחיטה, הטרדה או חרם — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד — אומרים שזה כדי שאפשר יהיה לעזור. תמונה שמופצת עכשיו
      מטפלים בה עוד היום — עם היועצת ועם ההורים. לצד היועצת: מוקד 105 — המטה הלאומי להגנה על ילדים ונוער ברשת, 24/7;
      ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״הדלת שלי״; פחות —
    ישר ל״חשוב לזכור״.
