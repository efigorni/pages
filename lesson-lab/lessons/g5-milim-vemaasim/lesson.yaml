sub: מתבוננים בנייר שמתקמט ומתיישר, מבדילים בין עוצמת הרגש לבין התגובה ובונים ארגז כלים לרגע של כעס.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך מבטאים כעס בלי להשאיר פגיעה בקשר?
takeaways:
- כעס הוא רגש טבעי ונורמלי וחשוב לבטא אותו.
- אפשר לבטא כעס בלי לפגוע, ולפעול לתיקון כשנפגע קשר.
prep:
- דף נייר לכל תלמיד; מדחום וסרגל תגובות על הלוח
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: face-sad
    x: 180
    y: 120
    w: 250
  alt: פנים עצובות
steps:
- id: part-1
  title: כעס הוא רגש
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: כעס הוא רגש — מה אפשר להרגיש כשמשחק נפסק באמצע?
  body:
  - slide:
      title: מה אפשר להרגיש כשמשחק נפסק באמצע?
      art:
      - use: face-sad
        x: 180
        y: 120
        w: 250
      alt: פנים עצובות
      echo: true
  - moves:
    - תני שלוש דקות לכתיבה על דמות במשחק, לא על מריבה אישית.
    - אספי רגשות שונים והדגישי שמותר לכעוס; השאלה היא איך פועלים.
  - ask: מה אפשר להרגיש כשמשחק נפסק באמצע?
  - ladder:
      help: מה מרגישה דמות שחיכתה זמן רב לתורה?
      challenge: איך שני אנשים יכולים לכעוס ולבחור תגובות שונות?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: מה נשאר על הנייר?
  minutes: 8
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מה נשאר על הנייר? — מה רואים אחרי שמקמטים ומיישרים?
  body:
  - slide:
      title: מה רואים אחרי שמקמטים ומיישרים?
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף
      echo: true
      sub: ''
  - moves:
    - חלקי דף.
    - הזמיני לקמט בעדינות או לצפות בלבד; אין קריעה, זריקה או משחק מלחמה.
    - אחר כך יישרו את הדף והתבוננו בסימנים.
    - בזוגות תארו מה אפשר לתקן ומה נשאר.
    - 'הדגישי שנייר הוא דימוי: קשר אנושי עשוי להשתקם בעזרת תיקון, זמן ועזרה.'
  - ask: מה רואים אחרי שמקמטים ומיישרים?
  - task:
      what: קמטו בעדינות או התבוננו בלבד, ואז יישרו את הדף. השוו בין מה שתוקן לבין מה שנשאר, ובין דף לקשר
        אנושי.
      time: 5 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה השתנה במראה הדף?
      challenge: מה ההבדל בין יישור הנייר לבין התנצלות ותיקון קשר?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - quote:
      title: מסר המקור בהקשר הפעילות
      text: במצבים שונים טבעי שנחוש כעס. עוצמת הכעס והאופן שבו נבטא אותו ישפיעו עלינו ועל הסובבים אותנו.
        ככל שהנייר יותר חתוך ופגוע, יישארו בו יותר סימנים וצלקות שקשה לתקן. ככל שנגיב קשה יותר בשעת כעס
        – כך יהיה קשה יותר להתחבר שוב, לתקן את הקשר ולהתפייס עם החבר או החברה שנפגעו.
- id: part-3
  title: מדחום ותגובה
  minutes: 9
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מדחום ותגובה — איך נבדיל בין כמה כועסים לבין מה שעושים?
  body:
  - slide:
      title: איך נבדיל בין כמה כועסים לבין מה שעושים?
      art:
      - use: scale
        x: 180
        y: 120
        w: 250
      alt: מאזניים
      echo: true
      sub: ''
  - moves:
    - ציירי מדחום כעס וסרגל תגובות על הלוח.
    - 'השתמשי בשתי דמויות מהמקור: רעות שותקת מחשש לכעס חברתה, ואדר צועק ומתחרט.'
    - קבוצות מציעות לכל דמות דרך לבטא צורך בלי לפגוע, ומשוות את הפעולה לרגש.
    - אין לסמן בפומבי הרגל אישי.
  - ask: איך נבדיל בין כמה כועסים לבין מה שעושים?
  - task:
      what: הציעו לרעות ולאדר דרכים לבטא צורך בלי לפגוע. הפרידו בין עוצמת הכעס לבין הבחירה בפעולה.
      time: 6 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: איזו מילה תעזור לרעות לבטא מה מפריע?
      challenge: איך אדר יכול לתקן גם אחרי שכבר צעק?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - quote:
      title: מסר המקור בהקשר הפעילות
      text: ככל שעוצמת הכעס שלנו גבוהה יותר, אנו עלולים לבחור בתגובות פוגעות יותר. ולכן, על מנת שנדע לווסת
        את התגובות שלנו, חשוב שנשים לב גם לעוצמת הכעס שאנחנו חווים וגם לאופן שבו אנחנו מבטאים את הכעס.
- id: part-4
  title: ארגז כלים לכעס
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: ארגז כלים לכעס — איזו פעולה תעזור לפני שהכעס מנהל אותנו?
  body:
  - slide:
      title: איזו פעולה תעזור לפני שהכעס מנהל אותנו?
      art:
      - use: lifebuoy
        x: 180
        y: 120
        w: 250
      alt: גלגל הצלה
      echo: true
      sub: ''
  - moves:
    - 'בזוגות בנו שמש של ארבע פעולות: להתרחק לזמן קצר, לספור, לפנות לעזרה או לדבר על הצורך.'
    - בחרו פעולה אחת לכל דמות ונמקו.
    - במליאה בקשי תגובה להצעת זוג אחר ושאלי מתי יש צורך במבוגר.
  - ask: איזו פעולה תעזור לפני שהכעס מנהל אותנו?
  - task:
      what: בנו שמש של ארבע פעולות לרגע של כעס. בחרו פעולה מתאימה לכל דמות ונמקו מתי לבקש עזרה.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה מאפשר לעצור בלי להשאיר את הבעיה ללא מענה?
      challenge: איך יודעים מתי לחזור לשיחה אחרי התרחקות?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - כעס הוא רגש טבעי ונורמלי וחשוב לבטא אותו.
      - תגובה קשה מדי בשעת כעס עלולה לפגוע בהמשך בסיכוי להתפייס ולתקן את הקשר עם החברים.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - כתבו דרך לבטא כעס בלי לפגוע.
      - כתבו צעד לתיקון אם כבר פגענו.
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: המקור מזמין זיכרון של מריבה קשה; כאן עובדים על דמויות ולא מעוררים מחדש פגיעה אישית.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
