slug: g5-milim-vemaasim
title: מילים ומעשים המשאירים סימנים בלב
grade: 5
grades_served:
- 5
slide_kickers: false
month: מאי
section: חברות, סובלנות ומניעת אלימות (מאי)
unit: הדרך אל האחר מתחילה בי
src_text: sources/text/5/Milim_Vemaasim.md
