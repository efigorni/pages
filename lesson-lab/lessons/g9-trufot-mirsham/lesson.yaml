steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: נכון או לא נכון?
    minutes: 4
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: משפט אחד על תרופות בלי מרשם — כל הכיתה מצביעה באגודל יחד, ואז נחשפות שלוש התשובות של המקור
    body:
      - slide:
          kicker: ידע = כוח · נכון או לא נכון
          title: נכון או לא נכון?
          sub: תרופות ללא מרשם רופא מותר לקחת כמה שרוצים במהלך 24 שעות, מבלי לחשוש מסכנה כלשהי
          points:
            - נכון — הן לא מסוכנות
            - לא נכון — לפי ההוראות בעלון, ובהתייעצות
            - לא נכון — לכל תרופה יש תופעות לוואי
          verbatim: [sub]
          echo: true
          alt: דמות מרימה יד, ולידה וי ואיקס
          art:
            - {use: check, x: 60, y: 90, w: 140}
            - {use: cross, x: 220, y: 90, w: 140}
            - {use: kid-hand, x: 400, y: 170, w: 170, color: teal}
      - quote:
          title: שלוש התשובות מהמקור — להקריא כשחושפים (נכונות 2 ו־3)
          text: |-
            1. נכון תרופות ללא מרשם רופא אינן מסוכנות לכן ניתן לקחת אותן בלי הגבלה
            2. לא נכון – יש להקפיד להשתמש בתרופה על פי הוראות הכתובות בעלון, ולפני שלוקחים אותה יש להיוועץ בהורים, ברוקח או ברופא
            3. לא נכון - לכל תרופה יש תופעות לוואי שעלולות לסכן אותנו - חשוב לקרוא ולהכיר את החסרונות או סיכונים שיש בלקיחת התרופה.
      - moves:
          - הקריאי את המשפט. כל אחד מחליט לבד, בשקט — ובספירה עד שלוש כולם מראים יחד אגודל למעלה (נכון) או למטה (לא נכון).
          - תארי במילים מה רואים — כמה למעלה, כמה למטה — בלי לשאול מי.
          - חשפי את שלוש התשובות, והקריאי כל אחת מהציטוט. נכונות 2 ו־3 — לפני שלוקחים תרופה מתייעצים עם ההורים, עם הרוקח או עם הרופא, ולכל תרופה יש תופעות לוואי.
      - say: חשבו לבד, בלי להסתכל על אף אחד. בספירה עד שלוש — אגודל למעלה או למטה.
      - say: >-
          ידע זה כוח. היום מדברים על תרופות שלוקחים בלי מרשם ובלי מעקב רפואי — לא על תרופה שרופא התאים לנו ושעוזרת
          לנו. בואו נבדוק עוד כמה דברים שכדאי לדעת, לפני שלוקחים כדור.

  # ------------------------------------------------------------------ 4′–11′
  - id: quiz
    title: ידע = כוח
    minutes: 7
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: ארבע שאלות מהחידון של המקור — כל אחד כותב תשובה, מתייעץ עם השכן, ורק אז נחשפת התשובה
    body:
      - moves:
          - בכל שאלה — 10 שניות לבד, וכל אחד כותב על דף את מספר התשובה; 30 שניות עם השכן; בספירה עד שלוש מרימים אצבעות.
          - חשפי את התשובות אחת־אחת והקריאי כל אחת מהציטוט שאחרי השקף — הנכונה כתובה בכותרת שלו. בחלק מהשאלות יש יותר מתשובה נכונה אחת.
          - בשאלה על מקורות המידע — שאלי גם איך מזהים מקור אמין.
      - say: בחלק מהשאלות יש יותר מתשובה נכונה אחת. כתבו את המספר לבד, ורק אז התייעצו עם השכן.
      - slide:
          kicker: ידע = כוח · שאלה 1 מתוך 4
          title: מה זה ״מרשם רופא״?
          points:
            - אישור כתוב מהרופא, לאדם מסוים
            - הסבר כללי של רופאים
            - תרופות סבתא
          verbatim: [title]
          echo: true
          alt: מבוגר עם ספר, ודף לידו
          art:
            - {use: teacher, x: 380, y: 140, w: 170, color: moss}
            - {use: note, x: 90, y: 190, w: 200}
      - quote:
          title: התשובות מהמקור — להקריא כשחושפים (נכונה 1)
          text: |-
            1. אישור כתוב מאת הרופא שניתן לאדם מסוים כדי לקנות תרופה מבית המרקחת וליטול אותה, על פי הנחיות ולאורך הזמן שהרופא קבע
            2. הסבר כללי של רופאים מתי ואיך כדאי להשתמש בתרופות
            3. תרופות סבתא
      - slide:
          kicker: ידע = כוח · שאלה 2 מתוך 4
          title: נכון או לא נכון?
          sub: יש חשיבות בהתאמת תרופה לכל אדם בהתאם להיסטוריה הרפואית שלו, הגיל ומאפיינים נוספים
          points:
            - לא נכון — תרופה מתאימה לכולם
            - נכון — הגיל וההיסטוריה הרפואית חשובים
            - נכון — אנשים שונים, תרופות ומינונים שונים
          verbatim: [sub]
          echo: true
          cue: אחרי התשובה —
          alt: שלוש דמויות שונות זו לצד זו
          art:
            - {use: group3, x: 120, y: 160, w: 380}
      - quote:
          title: התשובות מהמקור — להקריא כשחושפים (נכונות 2 ו־3)
          text: |-
            1. לא נכון, התרופות מיועדות לטפל במחלות/ כאבים/ אחר בלי הבדל בין אנשים
            2. נכון! גיל, והיסטוריה רפואית חשובים מאוד בהתאמת תרופה מסוימת לאדם מסוים (בחומר הפעיל ובמינון)
            3. נכון אנשים שונים עם אותן מחלות יכולים לקבל מרופא תרופות שונות ו/או מינונים שונים של אותה תרופה בהתאם למאפיינים הייחודיים להם.
      - slide:
          kicker: ידע = כוח · שאלה 3 מתוך 4 · בחרו עד 4
          title: מאיפה חשוב לקבל מידע על תרופות?
          sub: רופא · רוקח · הורים · חברים · אינטרנט · אתר משרד הבריאות או קופת חולים
          verbatim: [title]
          echo: true
          cue: אחרי התשובה —
          alt: זכוכית מגדלת מעל ספר פתוח
          art:
            - {use: book, x: 60, y: 250, w: 300}
            - {use: magnifier, x: 330, y: 90, w: 230}
      - whisper: >-
          התשובה — רופא, רוקח, הורים ואתר משרד הבריאות. ומההערות של המקור: מידע מהימן על התרופה לבד לא מספיק — חשוב
          לספר לרופא או לרוקח על כל מה שלוקחים, גם בלי מרשם, כי תרופות יכולות להשפיע זו על זו.
      - slide:
          kicker: ידע = כוח · שאלה 4 מתוך 4
          title: והרופא לא יודע?
          sub: תרופה בלי מרשם, תוסף, אלכוהול או קנביס — והרופא נותן עוד תרופה.
          points:
            - לא נכון — אין קשר
            - נכון — אלה חומרים כימיים
            - לא נכון — תרופות לא משפיעות זו על זו
          echo: true
          cue: אחרי התשובה —
          alt: רמזור, ולידו בקבוק וכוס
          art:
            - {use: traffic-light, x: 380, y: 100, w: 160}
            - {use: bottle, x: 100, y: 260, w: 160}
      - quote:
          title: המשפט והתשובות מהמקור — להקריא (נכונה 2)
          text: |-
            אם מישהו לוקח תרופה ללא מרשם, נוטל תוסף תזונה, שותה אלכוהול ו/או משתמש בקנביס או בסם אחר, והרופא שלו לא יודע על כך, הרופא עלול לתת לאותו אדם תרופה שהחיבור שלה עם מה שהוא לוקח יהיה מזיק, רעיל ומסוכן מאוד
            1. לא נכון. אין קשר בין שתיית אלכוהול או שימוש בסמים לתרופות המטפלות בבריאות
            2. נכון. אלכוהול וסמים הנם חומרים כימיים המשפיעים על מערכות שונות בגוף ולכן חומרים כימיים שנמצאים בתרופות מסוימות יכולים לגרום לתפקוד לקוי של איברים מסוימים וזה מסוכן. למשל פגיעה בראייה
            3. לא נכון. אין קשר בין תרופה לבעיה אחת עם תרופה לבעיה אחרת לגמרי
      - ladder:
          help: חפשו מילה שמשנה את התשובה — ״כמה שרוצים״, ״כל אדם״, ״הרופא לא יודע״.
          challenge: בשאלה עם שתי תשובות נכונות — מה כל אחת מוסיפה?
      - say: >-
          ראינו שתרופה מתאימה לאדם מסוים, בכמות מסוימת. עכשיו נפגוש בני נוער שלקחו תרופות בדרך אחרת — ונבדוק מה
          הסיכון.

  # ------------------------------------------------------------------ 11′–21′
  - id: cases
    title: בחרי מסלול — בודקים במקור מהימן
    minutes: 10
    summary: בקבוצות, תיאור מקרה אחד לכל קבוצה — מה הסיכון בדרך שבה הדמות לוקחת את התרופה, ומה הייתם ממליצים לה כחברים
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים. כל קבוצה בוחרת כרטיס מקרה אחד מהערימה — בכל קבוצה מקרה אחר.
          - הסתובבי בין הקבוצות. שתי דקות לפני הסוף — בקשי מכל קבוצה לבחור נציג ולנסח שתי תובנות.
      - tracks:
          - title: בודקים בעלון ובאתר
            text: >-
              כל קבוצה בודקת את התרופה מהמקרה שלה במקור מהימן — העלון לצרכן או אתר משרד הבריאות — ועונה על השאלות
              שבכרטיס.
            when: יש בכיתה מחשבים או טלפונים, ומותר להשתמש בהם לחיפוש.
            practices:
              - הוצאה למשימה
            spotlights:
              - שיתופיות בלמידה
              - אחריות ובחירה
            prep:
              - מחשב או טלפון לכל קבוצה, עם גישה לאתר משרד הבריאות
            body:
              - slide:
                  kicker: תיאורי מקרה · בקבוצות
                  title: מה הסיכון — ומה הייתם ממליצים?
                  sub: בדקו את התרופה במקור מהימן, וענו על השאלות שבכרטיס.
                  timer: 420
                  echo: true
                  alt: מחשב נייד, וזכוכית מגדלת לידו
                  art:
