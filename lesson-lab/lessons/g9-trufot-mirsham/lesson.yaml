sub: >-
  תרופה עוזרת כשהיא מותאמת לנו ונלקחת לפי ההוראות. בשיעור הזה בודקים מה אנחנו יודעים על תרופות, מנתחים מקרים של
  בני נוער, וחושבים מה עושים כשחבר מבקש תרופה שלא נרשמה לו.
format: זוגות, קבוצות ומליאה
question: למה תרופה שעוזרת לאחד עלולה לסכן אחר — ומה האחריות שלנו, כלפי עצמנו וכלפי החברים?
takeaways:
  - >-
    תרופה מותאמת לאדם מסוים — לגיל, להיסטוריה הרפואית ולמה שהוא כבר לוקח; גם תרופה בלי מרשם לוקחים רק לפי
    ההוראות.
  - מידע על תרופות מקבלים ממקורות אמינים — רופא, רוקח, הורים ואתר משרד הבריאות.
  - כשכואב, בגוף או בנפש, פונים לעזרה; וכשחבר במצוקה — לא מתעלמים, ומתייעצים עם מבוגר.
prep:
  - חלוקה מראש לקבוצות של 4–5 לפי השולחנות
  - >-
    שמות בכרטיסי המקרה: אם יש בכיתה תלמיד בשם של אחת הדמויות — החליפי לשם שאינו ברשימת הכיתה (המלצת המקור)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — שימוש בתרופות בלי מרשם ובלי מעקב רפואי, עם מקרים של חרדת בחינות, דיכאון, כאבי
      מחזור וקשיי שינה. שאלי אם יש בכיתה מי שהנושא קרוב אליו: מי שמתמודד עכשיו עם חרדה או דיכאון, או מי שבן משפחה
      שלו משתמש בתרופות לרעה. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      בכיתה יש תלמידים שלוקחים תרופות קבועות לפי מרשם — לקשב, לחרדה, לאסתמה. השיעור הוא על שימוש בלי מרשם ובלי מעקב,
      לא על מי שמטופל: אמרי את זה כבר בפתיחה, ואל תשאלי מי לוקח תרופות. מי שמתמודד עם חרדה או דיכאון עלול לזהות את
      עצמו בנועה או באלון — מדברים על מה שעוזר, לא על ״מי שבור״. צחוק או הערות על המקרה של רותם (כאבי מחזור) —
      עוצרים מיד.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו״ — ובשיעור הזה מדברים על הדמויות, לא על התרופות של אנשים אמיתיים. במליאה
      מציגים נציגים שהתנדבו; מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל שימוש בתרופות של אחרים שקורה עכשיו, חבר שלוקח כדורים כדי להירגע או להירדם, או תחושות של דיכאון — עוצרים
      בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.
      לצד היועצת — ער״ן (1201): עזרה ראשונה נפשית בטלפון, 24/7, גם בלי לומר שם. ובחשד להרעלה או למנת יתר של תרופה —
      המרכז הארצי למידע בהרעלות (04-7771900), 24 שעות ביממה, כל השנה.

