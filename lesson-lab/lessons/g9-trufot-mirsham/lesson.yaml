              אלון, בן 17, מנסה להתמודד עם תחושות דיכאון באמצעות צמחי מרפא שקרא עליהם באינטרנט. הוא לא מודע להשפעות האפשריות שמתרחשות כשלוקחים תרופה זו עם תרופות אחרות או להשפעות על מצבו הרגשי.
