            - למרות שזאת תרופה, שימוש בה בלי שהותאמה עבורכם, יכול להיות מסוכן
            - במידה שאתם חשים כאב גופני או כאב רגשי פנו לעזרה, מגיע לכם שיעזרו לכם באופן שמתאים לכם.
            - >-
              במידה שאתם יודעים על חבר במצוקה אל תתעלמו, הפנו אותו לקבלת עזרה, והתייעצו עם מבוגר אם אתם מתלבטים כיצד
              לנהוג
          ask: >-
            איזה מסר הכי חשוב לזכור בפעם הבאה שתרצו לקחת כדור — או שחבר יבקש מכם? חשבו רגע, ואז הצביעו כשאקרא את
            המספר שלו.
          tip: >-
            ארבעת הראשונים — על האחריות כלפי עצמנו: מרשם והשגחה, לא תרופות של אחרים, שיקול דעת, ותרופה שלא הותאמה לנו.
            שני האחרונים — על עזרה: לבקש לעצמנו, ולא להתעלם מחבר במצוקה.
          alt: מגן גדול, ודמות עומדת לידו
          art:
