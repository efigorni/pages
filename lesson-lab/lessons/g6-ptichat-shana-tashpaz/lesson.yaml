steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: riddles
    title: מה מסתתר בציור?
    minutes: 6
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: שלוש חידות ציורים — בכל ציור מסתתר ביטוי; ואז, מה משותף לשלושתם
    body:
      - slide:
          kicker: מה מסתתר בציור? · חידה 1
          title: איזה ביטוי מסתתר בציור?
          points:
            - רמז — איך קוראים לרגע שבו מגיעים לקרקע?
            - נחיתה רכה
          echo: true
          alt: ילד עם מצנח נוחת על כרית גדולה
          art: {file: art/parachute.svg}
      - moves:
          - הציגי את הציור הראשון, ואמרי שבכל ציור מסתתר ביטוי שצריך לנחש.
          - חכי חמש שניות של שקט לפני שאת מזמינה ניחושים — כך מצביעים יותר, ולא רק המהירים.
          - אין ניחוש? חשפי את הרמז. כשהביטוי נמצא — חשפי את התשובה, ועברי לציור הבא.
          - אחרי החידה השלישית — שאלי מה משותף לכל הציורים, ושמעי שתיים־שלוש תשובות.
      - say: לפניכם שלושה ציורים, ובכל אחד מסתתר ביטוי. חשבו בשקט, ורק כשאגיד — הרימו יד.
      - slide:
          kicker: מה מסתתר בציור? · חידה 2
          title: ואיזה ביטוי מסתתר כאן?
          points:
            - רמז — מהי הצורה שמסביב לילד? ומה עושה דלת?
            - סגירת מעגל
          echo: true
          cue: אחרי ״נחיתה רכה״ —
          alt: ילד בתוך מעגל פתוח, סוגר את הפתח בדלת
          art: {file: art/circle-door.svg}
      - slide:
          kicker: מה מסתתר בציור? · חידה 3
          title: והביטוי האחרון?
          points:
            - רמז — …של משהו אחר
            - סוף הוא תמיד התחלה
          echo: true
          cue: אחרי ״סגירת מעגל״ —
          alt: ילד מקלף שלט ״סוף״, ומתחתיו מתגלה שלט ״התחלה״
          art: {file: art/end-start.svg}
      - slide:
          kicker: שלוש חידות · ביטוי אחד
          title: מה משותף לכל הציורים?
          cue: אחרי החידה השלישית —
          alt: דרך שמתפתלת אל האופק, ושמש מעליה
          art:
            - {use: sun, x: 235, y: 60, w: 150}
            - {use: road, x: 130, y: 210, w: 360}
      - ask: מה משותף לשלושת הציורים?
      - say: >-
          כל הביטויים מדברים על סיום ועל התחלה. ואתם נמצאים בדיוק שם — בפתח כיתה ו׳, השנה האחרונה ביסודי: שנה של
          סגירת מעגל, ובסופה התחלה חדשה. היום נחשוב יחד איך להתחיל אותה ב״נחיתה רכה״.

  # ------------------------------------------------------------------ 6′–12′
  - id: observe
    title: מתבוננים — השנה האחרונה ביסודי
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: לבד, בזוגות ובמליאה — מה אני מרגיש לקראת השנה האחרונה, ומה יהפוך אותה לשנה טובה
    body:
      - slide:
          kicker: מתבוננים · לבד, בזוג, במליאה
          title: מה אתם מרגישים לקראת השנה האחרונה ביסודי?
          sub: ומה יהפוך אותה לשנה מיוחדת וטובה?
          points:
            - לבד — 30 שניות
            - עם השכן במעגל — דקה וחצי
            - במליאה
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו לב
          art:
            - {use: thought, x: 190, y: 24, w: 300, flip: true}
            - {use: heart, x: 278, y: 70, w: 124}
            - {use: kid-stand, x: 100, y: 214, w: 150, color: teal}
      - moves:
          - הציגי את שתי השאלות, וחכי 30 שניות של שקט. מי שרוצה — רושם מילה או שתיים במחברת.
          - דקה וחצי בזוגות, עם השכן מימין במעגל. מספר אי־זוגי — שלישייה אחת. הסתובבי והקשיבי.
          - במליאה — שמעי שלושה־ארבעה זוגות. הדהדי כל תשובה, ושאלי מי מרגיש דומה ומי אחרת.
      - say: אפשר להרגיש כמה דברים בבת אחת — גם התרגשות וגם קצת עצב. כל תחושה כאן בסדר.
      - ladder:
          help: בחרו מילה אחת שמתארת איך אתם מרגישים — מתרגשים? שמחים? קצת עצובים? סקרנים?
          challenge: אם הייתם מוסיפים ציור שמייצג את כיתה ו׳ — מה הייתם מציירים בו, ולמה?
      - ask: מה יהפוך את השנה הזאת לשנה מיוחדת וטובה — ומה אנחנו יכולים לעשות בשביל זה?
      - say: עכשיו נבדוק את זה בתנועה — מי מאיתנו רוצה מה, השנה.

  # ------------------------------------------------------------------ 12′–23′
  - id: chairs
    title: כיסאות מסתובבים
    minutes: 11
    stance: true
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      ארבעה היגדים על השנה שמתחילה; מי שמזדהה קם ומסתובב לצלילי מוזיקה, ומי שנשאר בלי כיסא עונה על שאלת
      ההמשך — או מעביר אותה למתנדב
    body:
      - slide:
          kicker: כיסאות מסתובבים · במעגל
          title: מזדהים עם המשפט? קמים ומסתובבים
          sub: כשהמוזיקה נעצרת — מוצאים כיסא אחר.
          alt: שתי דמויות יושבות, דמות אחת עומדת ביניהן, ותווי מוזיקה מעליה
          art: {file: art/chairs.svg}
      - moves:
          - הסבירי את הכללים לפני ההיגד הראשון — השקף נשאר על המסך.
          - הקריאי היגד, וחכי חמש שניות של שקט. מי שמזדהה — קם ומסתובב בתוך המעגל לצלילי המוזיקה.
          - >-
            בזמן שהם מסתובבים, הוציאי מהמעגל כיסא אחד מאלה שהתפנו. עצרי את המוזיקה — כל מי שקם מוצא כיסא, ולא
            את הכיסא שלו.
          - >-
            מי שנשאר בלי כיסא עונה על שאלת ההמשך שעל המסך, או מעביר אותה למתנדב. אחר כך שאלי מתנדב אחד ממי
            שנשארו לשבת ״ומה אצלך?״, החזירי את הכיסא למעגל, וממשיכים.
          - אחרי ההיגד הרביעי — שאלת סיכום אחת, וכולם נשארים במעגל.
      - say: >-
          לפני כל משפט חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז קמים. אין תשובה נכונה, מותר לא
          לקום, והולכים ולא רצים. מי שנשאר בלי כיסא — עונה, או מעביר את השאלה למתנדב.
      - slide:
          kicker: כיסאות מסתובבים · היגד 1
          title: עשיתי בחופש משהו שהפתיע אותי
          points:
            - משהו מפתיע ומיוחד שעשית בחופש
          verbatim: true
          echo: true
          cue: אחרי הכללים —
          alt: שמש גדולה, וכוכב לידה
          art:
            - {use: sun, x: 250, y: 60, w: 280}
            - {use: star, x: 80, y: 300, w: 150}
      - slide:
          kicker: כיסאות מסתובבים · היגד 2
          title: השנה בא לי לנסות משהו חדש
          points:
            - מה הדבר שהכי היית רוצה להתנסות בו השנה? באיזה תחום?
          verbatim: true
          echo: true
          cue: ההיגד הבא —
          alt: דלת פתוחה, ודמות עומדת מולה
          art:
            - {use: door, x: 80, y: 80, w: 230}
            - {use: kid-stand, x: 380, y: 112, w: 150, color: teal}
      - slide:
          kicker: כיסאות מסתובבים · היגד 3
          title: השנה יש לי מטרה חדשה שבכוונתי לעמוד בה
          points:
            - באיזה תחום? מה יהיה הצעד הראשון בכיוון?
          verbatim: true
          echo: true
          cue: ההיגד הבא —
          alt: מטרה עם חץ במרכז, ודמות לידה
          art:
            - {use: target, x: 70, y: 110, w: 300}
            - {use: kid-stand, x: 410, y: 230, w: 130, color: teal}
      - slide:
          kicker: כיסאות מסתובבים · היגד 4
          title: חשוב לי שהכיתה תהיה מגובשת
          points:
            - משהו אחד שארצה לעשות כדי שהכיתה תהיה מקום שטוב להיות בו
          verbatim: true
          echo: true
          cue: ההיגד האחרון —
          alt: שלוש דמויות יחד, ולב מעליהן
          art:
            - {use: group3, x: 120, y: 236, w: 380}
            - {use: heart, x: 220, y: 30, w: 180}
      - ask: מי קם יחד איתכם, ומה הפתיע אתכם? מי רוצה להגיב למשהו שנאמר?
      - say: שמענו רצונות ומטרות לשנה. עכשיו כל אחד ייתן להם מקום — בחלק משלו בפאזל הכיתתי.

  # ------------------------------------------------------------------ 23′–27′
  - id: piece
    title: החלק שלי בפאזל
    minutes: 4
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - עניין ורלוונטיות
    summary: כל אחד כותב על חלק פאזל איחול לעצמו ואיחול לכיתה, לקראת השנה האחרונה ביסודי
    body:
      - slide:
          kicker: פאזל כיתתי · לבד
          title: החלק שלי בפאזל הכיתתי
          sub: איחול אחד לעצמי, ואיחול אחד לכיתה — לקראת השנה.
          timer: 180
          echo: true
          alt: חלק פאזל סגול, ועיפרון לידו
          art:
            - {use: puzzle, x: 110, y: 110, w: 300}
            - {use: pencil, x: 400, y: 300, w: 180}
      - moves:
          - חלקי ריבוע אחד — ארבעה חלקים — לכל ארבעה שיושבים זה ליד זה. את החלק שלך שמרי לעצמך.
          - שלוש דקות של כתיבה בשקט, על המחברת שעל הברכיים. הסתובבי בין הכותבים.
          - דקה לפני הסוף — הודיעי. מי שלא סיים, כותב איחול אחד.
      - say: >-
          כל אחד מקבל חלק בפאזל. כתבו עליו איחול אחד לעצמכם ואיחול אחד לכיתה, לקראת השנה האחרונה שלנו ביחד.
      - ladder:
          help: השלימו — ״השנה אני מאחל לעצמי ש…״, ו״לכיתה שלנו אני מאחל ש…״.
          challenge: כתבו איחול שאתם יכולים גם לעזור להגשים — ומה תעשו בשבילו?
      - say: ועכשיו מחברים — כל ארבעה חלקים יוצרים ריבוע.

  # ------------------------------------------------------------------ 27′–30′
  - id: build
    title: מרכיבים פאזל כיתתי
    minutes: 3
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
    summary: כל רביעייה מחברת את החלקים שלה לריבוע, והריבועים נתלים יחד על הלוח
    body:
      - slide:
          kicker: פאזל כיתתי · ברביעיות
          title: כל אחד ואחת מאיתנו מהווה חלק מפאזל כיתתי שנמשיך להרכיב ביחד
          verbatim: [title]
          echo: true
          alt: ארבעה חלקי פאזל צבעוניים מתחברים לריבוע אחד
          art: {file: art/puzzle-square.svg}
      - say: מי שרוצה — הקריאו לרביעייה את האיחול שלכם. אחר כך חברו את החלקים, ותלו את הריבוע.
      - task:
          what: >-
            כל רביעייה מחברת את ארבעת החלקים שלה לריבוע, ונציג אחד תולה אותו על הלוח, צמוד לריבועים של האחרים.
          time: 3 דקות
          group: רביעיות — מי שקיבלו חלקים מאותו ריבוע
