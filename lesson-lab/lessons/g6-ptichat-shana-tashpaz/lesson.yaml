# רגע לפני שמתחילים ומסיימים — כיתה ו׳, פתיחת שנה (מקור: sources/text/6/Ptichat_Shana_Tashpaz.md)
slug: g6-ptichat-shana-tashpaz
title: רגע לפני שמתחילים ומסיימים
grade: 6
grades_served: [6]
month: ספטמבר
section: מיומנויות לחיזוק כוחות וחוסן להתנהלות מיטבית בשגרה ובחירום (ספטמבר)
unit: פתיחת שנה
unit_order: 1
unit_size: 1
src_text: sources/text/6/Ptichat_Shana_Tashpaz.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/6Grade/Mamlachti/Ptichat_Shana_Tashpaz.pptx
sensitivity: low

sub: >-
  כיתה ו׳ היא השנה האחרונה ביסודי — סוף של דבר אחד והתחלה של דבר אחר. בשיעור הזה פותרים חידות ציורים,
  עוצרים להתבונן בשנה שמתחילה, משחקים בכיסאות מסתובבים ומרכיבים יחד פאזל של איחולים.
format: מליאה, זוגות, משחק במעגל ורביעיות
question: מה אני מרגיש לקראת השנה האחרונה ביסודי — ומה יעזור לעשות ממנה שנה טובה, לי ולכיתה?
takeaways:
  - כיתה ו׳ היא גם סיום וגם התחלה — וטבעי להרגיש לקראתה כמה דברים בבת אחת.
  - לכל אחד יש רצונות ומטרות משלו לשנה הזאת, ויש גם הרבה דברים שמשותפים לכולנו.
  - כל אחד הוא חלק בפאזל הכיתתי — ומה שכל אחד מביא עושה את השנה של כולנו.
prep:
  - >-
    מעגל כיסאות בצורת פרסה, פתוח לכיוון המסך — כיסא לכל תלמיד ולך, ומקום פנוי באמצע להסתובב בו. מסדרים לפני
    השיעור, והשיעור כולו מתנהל במעגל: כל אחד מביא איתו עיפרון ומחברת קשיחה להניח עליה דף.
  - מוזיקה קצבית, מוכנה להשמעה ולעצירה, לכיסאות המסתובבים
  - >-
    חלקי פאזל — ארבעה חלקים שמרכיבים ריבוע, חלק לכל תלמיד ועוד אחד לך. מדפיסים את דף הנספח בסוף המצגת
    המקורית (הקישור בתחתית המערך), גוזרים מראש, ושומרים כל ארבעה חלקים יחד.
  - נייר דבק לתליית הפאזל על הלוח

safe:
  - head: עמידה מול הכיתה
    text: >-
      בכיסאות המסתובבים קמים לפי מה שנכון לנו באמת, ולכן נבחרו היגדים שלא מביכים — ההיגד שמבקש לומר שם של
      ילד שרוצים להכיר יותר יצא, כדי שאף אחד לא יגלה שלא בחרו בו. מותר לא לקום. מי שנשאר בלי כיסא עונה רק אם
      הוא רוצה; אם לא — הוא מעביר את השאלה למתנדב, בלי הסבר. הולכים ולא רצים, ולא נאבקים על כיסא. צחוק על מי
      שקם, או על מה שסיפר — עוצרים מיד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 15 דקות ומעלה — שתי ההרחבות; 10–14 דקות — רק ״מקריאים מהפאזל״;
    פחות — ישר לכרטיס היציאה.
  short:
    steps:
      - chairs
      - observe
    text: >-
      בכיסאות המסתובבים משחקים שלושה היגדים בלבד, ובמתבוננים שומעים במליאה שני זוגות
brain_break:
  signs: צחוק שלא נרגע אחרי המשחק וידיים שלא מפסיקות לזוז — או להפך, ראשים כבדים ותשובות של מילה אחת.
  ideas:
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים, בעיניים עצומות.
    - name: חמש־ארבע־שלוש
      text: בשקט, כל אחד מוצא חמישה דברים שהוא רואה, ארבעה שהוא שומע ושלושה שהוא מרגיש בגוף.
    - name: גל במעגל
      text: אחד מרים ידיים, ומיד אחריו השכן שלידו — עד שהגל עובר את כל המעגל. בסבב השני — בשקט מוחלט.
  from: again

