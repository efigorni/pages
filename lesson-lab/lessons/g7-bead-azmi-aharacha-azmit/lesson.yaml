sub: >-
  מה אנחנו מעריכים באנשים אחרים — ומה אנחנו רואים בעצמנו? בשיעור הזה מגלים חוזקות, מקבלים מתנות
  מהקבוצה, ומתאמנים בדיבור פנימי שמרים ולא מוריד.
format: זוגות, רביעיות ומליאה
question: מה אני רואה בעצמי — ואיך הדיבור הפנימי שלי יכול להרים אותי?
takeaways:
  - רוב מה שאנחנו מעריכים באנשים — וגם בעצמנו — הוא אופי והתנהגות, לא מראה.
  - הערכה עצמית קשורה למחשבות שלנו — דיבור פנימי מרים מחזק אותה, ודיבור מוריד מנמיך אותה.
  - כשמגיע דיבור מוריד, אפשר לבחור מה עושים איתו — לנשום, להיזכר בחוזקות שלנו, ולנסח את המשפט מחדש.
prep:
  - חלוקה מראש לזוגות לפי השולחנות, ואילו שני זוגות מתחברים לרביעייה
  - פתקיות — שלוש לכל תלמיד, למתנות בדרכון
  - פתקיות ונייר דבק לקיר (להרחבה ״קיר המשפטים המרימים״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — הערכה עצמית, מחמאות מהחברים לרביעייה, ודיבור פנימי מוריד. שאלי מי בכיתה
      עלול להתקשות: מי שמדבר על עצמו בזלזול, מי שהמראה או האכילה מטרידים אותו, ומי שנמצא עכשיו מחוץ לחברה.
      בקשי שתהיה זמינה אחרי השיעור, וסכמי איתה מה עושים עם כרטיס יציאה שיש בו רק דיבור מוריד.
  - head: מי עלול להיפגע
    text: >-
      מתנות מהקבוצה עלולות לחשוף מי מקובל ומי פחות. לכן כל אחד נותן מתנה לכל אחד משלושת חבריו לרביעייה,
      וכולם מקבלים שלוש. הרכיבי את הרביעיות מראש, והתקרבי לרביעייה שיש בה תלמיד פגיע. המתנות — תכונות של אופי
      והתנהגות, לא של מראה. המצב ״שתי חברות נפגשות בלעדיי״ קרוב למי שמודר עכשיו — מדברים על המצב, לא על
      אנשים מהכיתה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. מה שכל אחד כותב על עצמו בדרכון לא
      מוצג לאף אחד, וההשוואה בין שני הטורים — רק במחשבה. במליאה משתפים רק מתנדבים; מותר לוותר, ולא קוראים
      בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל ״אני שווה כלום״ שנאמר ברצינות, חרם, או פגיעה בגוף או באכילה — עוצרים בעדינות, מודים, וממשיכים
      בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
