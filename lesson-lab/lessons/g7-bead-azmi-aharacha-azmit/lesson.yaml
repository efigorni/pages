steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: open
    title: אדם שאני מעריך
    minutes: 6
    practices:
      - קדימה ללמידה
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה שקטה על אדם מוערך וחמש חוזקות שלו, סיפור לבן הזוג, ובמליאה — כמה מזה קשור למראה
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: אדם שאתם מכירים ומעריכים
          sub: כתבו מי הוא, וחמש חוזקות שלו — אפשר בעזרת בנק התכונות.
          timer: 180
          echo: true
          alt: דמות כותבת ליד שולחן, וכוכב גדול לידה
          art:
            - {use: kid-desk, x: 280, y: 140, w: 280, color: teal}
            - {use: star, x: 70, y: 70, w: 150}
      - moves:
          - השקף על המסך ובנק התכונות על השולחנות עוד לפני שהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. שימי לב אילו חוזקות חוזרות.
          - אחרי שלוש דקות — דקה וחצי בזוגות. כל אחד מספר לבן הזוג על האדם שבחר, ולמה.
          - במליאה — הציגי את שאלת המראה, ובקשי הצבעה. שמעי שניים־שלושה, ושקפי לכיתה מה רובם כתבו.
      - ladder:
          help: מצאו בבנק התכונות שלוש שמתאימות לו — ואם אפשר, עוד שתיים משלכם.
          challenge: ליד כל חוזקה כתבו רגע אחד שבו ראיתם אותה.
      - handout:
          title: בנק התכונות
          copies: עותק לכל זוג, על השולחנות לפני שהכיתה נכנסת
          verbatim: true
          lines: false
          items:
            - נדיבות · פותרים בעיות בקלות · סלחנות · כנות · ספורטיביות · אוהבים ללמוד
            - התמדה · סבלנות · הגינות · יודעים לגשר בין הצדדים · יצירתיות · מנהיגות
            - אומץ לב · רוגע · טוב לב · צדק · סקרנות · אומץ · איפוק · הומור · חוכמה · צנועים
            - אהבה · יודעים לעבוד בשיתוף פעולה · נחישות · מקבלים כל אחד · חברותיות · זהירות
            - לוקחים הכל בקלות · אופטימיות
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: עד כמה המראה החיצוני משפיע?
          sub: כמה מהחוזקות שכתבתם קשורות למראה — וכמה לאופי ולהתנהגות?
          echo: true
          cue: אחרי הסיפור בזוגות —
          alt: זכוכית מגדלת, ובתוכה כוכב
          art:
            - {use: magnifier, x: 150, y: 100, w: 320}
            - {use: star, x: 224, y: 174, w: 120}
      - ask: >-
          עד כמה המראה החיצוני משפיע על ההערכה שלכם לאדם שבחרתם? הרימו יד מי שכתב לפחות חוזקה אחת שקשורה
          למראה.
      - say: >-
          אז רוב מה שאנחנו מעריכים באנשים הוא מי שהם ואיך שהם מתנהגים — לא איך שהם נראים. ומה הייתם כותבים
          על עצמכם?

  # ------------------------------------------------------------------ 6′–14′
  - id: passport
    title: הדרכון שלי
    minutes: 8
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: כל אחד כותב לעצמו את החוזקות שלו, וברביעייה כל אחד מקבל מתנה — תכונה — מכל אחד מחבריו
    body:
      - slide:
          kicker: הדרכון שלי · לבד
          title: אילו חוזקות אתם רואים בעצמכם?
          sub: עמוד במחברת, שני טורים — ״אני על עצמי״ ו״מתנות מהקבוצה״. כותבים בטור הראשון.
          timer: 150
          echo: true
          alt: דף ועליו כוכב, ועיפרון לידו
          art:
            - {use: note, x: 190, y: 110, w: 250}
            - {use: star, x: 245, y: 138, w: 90}
            - {use: pencil, x: 430, y: 300, w: 150}
      - moves:
          - הסבירי את שני השלבים לפני שמתחילים — קודם כל אחד לבד, ואחר כך מתנות ברביעייה.
          - אמרי את כלל השיח של היום — ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״.
          - >-
            שלב ראשון — כל אחד מחלק עמוד במחברת לשני טורים וכותב בטור ״אני על עצמי״ לפחות שלוש חוזקות. מה
            שנכתב שם לא מוצג לאף אחד.
          - >-
            שלב שני — כל זוג מצטרף לזוג שלידו. כל אחד כותב לכל אחד משלושת האחרים תכונה אחת על פתקית, ונותן לו;
            מדביקים בטור ״מתנות מהקבוצה״.
          - הסתובבי בין הרביעיות, וודאי שכל אחד מקבל שלוש מתנות ושכולן תכונות של אופי או התנהגות.
          - במליאה — שאלי איך היה לקבל מחמאות, ושמעי שניים־שלושה מתנדבים.
      - say: >-
          ועכשיו — דרכון משלכם. קודם החוזקות שאתם רואים בעצמכם, ואחר כך מתנות מהקבוצה — תכונה אחת מכל חבר.
      - task:
          what: >-
            כל אחד כותב לעצמו בטור ״אני על עצמי״ לפחות שלוש חוזקות. אחר כך, ברביעייה, כל אחד כותב לכל אחד
            משלושת האחרים תכונה חיובית אחת על פתקית ונותן לו, וכל אחד מדביק את שלוש המתנות בטור ״מתנות
            מהקבוצה״.
          time: 2 דקות וחצי לבד, 3 דקות למתנות
          group: לבד ← רביעיות (כל זוג מצטרף לזוג שלידו)
          rules: >-
            מה שכותבים על עצמנו לא מראים; מתנה היא תכונה של אופי או התנהגות, לא של מראה; אפשר לתת את אותה
            תכונה יותר מפעם אחת
          plenary: מתנדבים מספרים איך הרגישו לקבל מחמאות, ומה הפתיע אותם
          help: בחרו מבנק התכונות. קשה למצוא חוזקה בעצמכם? מה היה אומר עליכם חבר טוב?
          challenge: ליד כל מתנה שאתם נותנים, כתבו רגע שבו ראיתם את התכונה הזאת אצל החבר.
      - slide:
          kicker: הדרכון שלי · ברביעייה
          title: מתנות מהקבוצה
          sub: תכונה אחת לכל אחד משלושת החברים — על פתקית.
          timer: 180
          echo: true
          cue: אחרי הכתיבה האישית —
          alt: ארבעה סביב שולחן, ושני פתקים צבעוניים לידם
          art:
            - {use: circle4, x: 250, y: 150, w: 300}
            - {use: sticky, x: 60, y: 110, w: 110}
            - {use: sticky, x: 110, y: 260, w: 110, color: teal}
      - slide:
          kicker: הדרכון שלי · במליאה
          title: איך הרגשתם לקבל מחמאות?
          sub: הופתעתם ממשהו? משהו התאים למה שכתבתם על עצמכם?
          echo: true
          cue: כשכל אחד קיבל שלוש מתנות —
          alt: פנים שמחות, ולידן פנים ניטרליות
          art:
            - {use: face-happy, x: 320, y: 150, w: 230}
            - {use: face-meh, x: 90, y: 220, w: 150}
      - ask: איך הרגשתם לקבל מחמאות — נעים, מביך, קצת משניהם? מה הפתיע אתכם?
      - say: >-
          יש לכם עכשיו שני טורים — מה אתם חושבים על עצמכם, ומה אחרים רואים בכם. לזה בדיוק קוראים הערכה
          עצמית.

  # ------------------------------------------------------------------ 14′–19′
  - id: concept
    title: הערכה עצמית ודיבור פנימי
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
    summary: >-
      ההגדרה מהמקור, השוואה שקטה בין שני הטורים, ״תמיד קשורה למחשבות שלנו — מסכימים?״, ודיבור פנימי מרים
      ומוריד
    body:
      - slide:
          kicker: הערכה עצמית
          title: מהי בעצם הערכה עצמית?
          sub: איך אני רואה את עצמי — ומה לדעתי אחרים חושבים עליי.
          alt: ענן מחשבה ובתוכו כוכב, דמות מתחתיו, ושלוש דמויות ברקע
          art:
            - {use: thought, x: 60, y: 24, w: 300}
            - {use: star, x: 158, y: 89, w: 110}
            - {use: kid-stand, x: 330, y: 230, w: 140, color: teal}
            - {use: group3, x: 40, y: 320, w: 200}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: |-
            הערכה עצמית היא תפיסה אישית של האדם את עצמו. היא כוללת מאפיינים שקשורים לאישיות שלנו וגם מאפיינים שקשורים למראה החיצוני שלנו.
            ישנם שני מרכיבים: מה האדם חושב על עצמו; מה האדם חושב שאחרים חושבים עליו.
      - moves:
          - הקריאי את ההגדרה.
          - >-
            בקשי מכל אחד להסתכל בשקט בשני הטורים בדרכון ולחשוב, בלי לשתף, אם העריך את עצמו פחות, יותר או כמו
            שהעריכו אותו החברים.
          - הציגי את המשפט, ספרי בלב עד עשר, ושמעי שניים־שלושה. הזמיני את הכיתה להגיב זה לזה.
          - >-
            אם לא עלה, הוסיפי שכולנו שומעים מה אומרים אחרים, אבל למחשבה שלנו יש כוח — אנחנו מחליטים למה
            להקשיב.
      - slide:
          kicker: מסכימים?
          title: הערכה עצמית תמיד קשורה למחשבות שלנו
          echo: true
          cue: אחרי ההשוואה השקטה —
          alt: ענן מחשבה גדול, אגודל למעלה ואגודל למטה
          art:
            - {use: thought, x: 150, y: 30, w: 320}
            - {use: thumb-up, x: 440, y: 360, w: 130}
            - {use: thumb-down, x: 50, y: 360, w: 130}
      - ask: מסכימים עם המשפט? למה? מי חושב אחרת?
      - slide:
          kicker: דיבור פנימי
          title: דיבור פנימי מרים ומוריד
          sub: אלו המחשבות שאנו חושבים לעצמנו ומדברים עם עצמנו ללא קול
          points:
            - מרים — מעלה את הערך העצמי שלנו בעיני עצמנו
            - מוריד — מוריד את הערך העצמי שלנו בעיני עצמנו
          verbatim:
            - title
            - sub
          echo: true
          cue: אחרי הדיון —
          alt: דמות, חץ למעלה מצד אחד וחץ למטה מהצד השני
          art:
            - {use: kid-stand, x: 235, y: 200, w: 150, color: teal}
            - {use: arrow, x: 390, y: 170, w: 220, color: moss, rotate: 90}
            - {use: arrow, x: 10, y: 270, w: 220, color: gray, rotate: -90}
      - say: המחשבות שלנו הן מין דיבור — ואפשר לשמוע אם הן מרימות או מורידות. בואו נתאמן.

  # ------------------------------------------------------------------ 19′–26′
  - id: practice
    title: מרים או מוריד?
    minutes: 7
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      שלושה מצבים מהחיים — כל אחד כותב משפט מוריד ומשפט מרים, ובמליאה מוחאים כפיים לכל משפט מרים
    body:
      - say: >-
          לכל מצב — חצי דקה, שני משפטים במחברת: מה אומר הדיבור המוריד, ומה אומר המרים. ואחרי כל משפט מרים
          שנשמע כאן — מחיאות כפיים.
      - slide:
          kicker: מרים או מוריד? · מצב 1
          title: קיבלתי ציון לא טוב במבחן
          verbatim: true
          echo: true
          timer: 30
          alt: דף עם איקס, ודמות עומדת לידו
          art:
            - {use: note, x: 300, y: 110, w: 230}
            - {use: cross, x: 365, y: 190, w: 100}
            - {use: kid-stand, x: 90, y: 240, w: 130, color: teal}
      - moves:
          - הציגי את המצב. חצי דקה — כל אחד כותב משפט מוריד ומשפט מרים.
          - שמעי משפט מוריד אחד, ואחריו שניים־שלושה מרימים. אחרי כל משפט מרים — הכיתה מוחאת כפיים.
          - על משפט מרים אחד בכל מצב — שאלי את הכיתה אם הוא באמת מרים, ומה היה מחזק אותו.
          - >-
            אותו דבר בשני המצבים הבאים. אם הכיתה נתקעת — הדוגמה מהמקור: מוריד ״אני בחיים לא אקבל ציון טוב״,
            מרים ״במבחן הבא אצליח יותר״.
          - >-
            בסוף — שאלי מה משפט מרים גורם להרגיש ולעשות. אם לא עלה, הוסיפי: מרגישים מסוגלים יותר, מעזים יותר,
            ורואים את זה עלינו. מחשבות מרימות מחזקות את ההערכה העצמית, ומחשבות מורידות מנמיכות אותה.
      - ladder:
          help: התחילו את המשפט המרים ב״גם אם…״ או ב״בפעם הבאה…״.
          challenge: כתבו משפט מרים שבאמת הייתם מאמינים לו — לא רק ״יהיה בסדר״.
      - slide:
          kicker: מרים או מוריד? · מצב 2
          title: שתי חברות שלי שהיו איתי ביסודי נפגשות בלעדיי
          verbatim: true
          echo: true
          timer: 30
          cue: המצב הבא —
          alt: שתי דמויות יחד, ודמות אחת לבד במרחק, עם ענן מחשבה
          art:
            - {use: kid-stand, x: 330, y: 240, w: 130, color: orange}
            - {use: kid-stand, x: 450, y: 240, w: 130, color: purple}
            - {use: kid-stand, x: 60, y: 240, w: 130, color: teal}
            - {use: thought, x: 120, y: 40, w: 200, flip: true}
      - slide:
          kicker: מרים או מוריד? · מצב 3
          title: כתבתי הודעה לחברה טובה והיא עדיין לא ענתה לי
          verbatim: true
          echo: true
          timer: 30
          cue: המצב האחרון —
          alt: טלפון ועל המסך מעטפה, ושעון לידו
          art:
            - {use: phone, x: 330, y: 110, w: 190}
            - {use: envelope, x: 370, y: 228, w: 110}
            - {use: clock, x: 80, y: 190, w: 140}
      - ask: מי מסכים שהמשפט הזה מרים? מה היה עושה אותו מרים עוד יותר?
      - ask: כשאתם אומרים לעצמכם משפט מרים — מה זה גורם לכם להרגיש? ומה זה גורם לכם לעשות?

