steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: open
    title: את מי בחרתם לשתף?
    minutes: 4
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: כתיבה קצרה כשנכנסים — אירוע משמח ואירוע מאתגר, ואת מי שיתפתי; במליאה — רק מעגלי השיתוף
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: אירוע משמח, אירוע מאתגר
          sub: שניהם מהתקופה האחרונה. את מי בחרתם לשתף?
          timer: 120
          echo: true
          alt: שמש וענן גשם, ודמות ביניהם
          art:
            - {use: sun, x: 380, y: 50, w: 170}
            - {use: rain-cloud, x: 70, y: 50, w: 170}
            - {use: kid-stand, x: 250, y: 264, w: 130, color: teal}
      - moves:
          - השקף על המסך כשהכיתה נכנסת; כל אחד כותב לעצמו מילה על כל אירוע, ואת מי שיתף.
          - בזמן הכתיבה — נוכחות, וסיבוב בין השולחנות.
          - >-
            במליאה משתפים רק את מעגלי השיתוף — את מי שיתפו, לא מה קרה, ורק מי שרוצה. רשמי על הלוח את סוגי האנשים
            שעולים: אמא, חבר, אח, מורה… ולא שואלים מי לא שיתף אף אחד.
      - say: שתי דקות, לבד. האירועים נשארים אצלכם — מילה אחת על כל אחד, ואת מי שיתפתם.
      - ladder:
          help: את מי אתם משתפים בדרך כלל כשקורה משהו טוב? ומשהו קשה?
          challenge: במחשבה לאחור — האם הייתם משתפים אדם נוסף? מי, ולמה?
      - ask: את מי בחרתם לשתף? האם שיתפתם יותר מאדם אחד?

  # ------------------------------------------------------------------ 4′–8′
  - id: power
    title: כוחו של שיתוף
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: מה נותן לנו השיתוף? חושבים, מגיבים זה לזה, ומחברים לארבע המילים של המקור
    body:
      - slide:
          kicker: רגע לחשוב
          title: מה נותן לנו השיתוף?
          alt: שתי דמויות יושבות זו מול זו, ולב ביניהן
          art:
            - {use: kid-sit, x: 70, y: 250, w: 150, color: purple}
            - {use: heart, x: 250, y: 150, w: 120}
            - {use: kid-sit, x: 400, y: 250, w: 150, color: orange, flip: true}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הזמיני את הכיתה להגיב זה לזה — מי מסכים, ומי רוצה להוסיף.
          - הציגי את ארבע המילים של המקור, וחברי אליהן מה שנאמר.
      - ask: מה נותן לנו השיתוף — למי שמשתף, וגם למי שמקשיב?
      - slide:
          kicker: כוחו של שיתוף
          title: שיתוף פותח דלת לקשר, להבנה ולעזרה
          points:
            - הקלה ופורקן
            - הגברת הרגש החיובי
            - הזדמנות להתבונן על אירועים ממגוון זוויות ראייה
            - היוועצות וקבלת עזרה
          verbatim:
            - points
          echo: true
          cue: אחרי כמה תשובות —
          alt: דלת פתוחה, ודמות עומדת לידה
          art:
            - {use: door, x: 300, y: 110, w: 220, color: teal}
            - {use: kid-stand, x: 130, y: 213, w: 110, color: orange}
      - quote:
          title: מהמקור — להקריא
          text: >-
            כוחו של השיתוף טמון ביכולת להקל על העומס הפנימי כשאנחנו אומרים בקול את מה שיושב לנו על הלב. כשאנחנו משתפים,
            אנחנו מאפשרים לאחרים להיות שם בשבילנו ולהרגיש שאנחנו לא לבד. שיתוף פותח דלת לקשר, להבנה ולעזרה ומחזק גם את מי
            שמשתף וגם את מי שמקשיב.
      - say: >-
          כשמשתפים, לא רק מורידים משהו מהלב — גם שומעים את עצמנו אחרת. ומתוך השיתוף יכול להיוולד משפט שמחזק אותנו.

  # ------------------------------------------------------------------ 8′–14′
  - id: sentences
    title: משפטים בוני חוסן
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: >-
      שש דוגמאות של המקור למשפטים בוני חוסן; כל אחד בוחר משפט וכותב מתי יזדקק לו, מספר לשכן, ושומעים במליאה
    body:
      - slide:
          kicker: משפטים בוני חוסן
          title: ״אני לא לבד בזה״
          sub: משפטים שאפשר לומר לעצמנו — ולפעמים גם לחבר.
          verbatim:
            - title
          alt: דמות, ומעליה ענן מחשבה ובתוכו מגן
          art:
            - {use: thought, x: 60, y: 30, w: 320}
            - {use: shield, x: 168, y: 96, w: 110, color: teal}
            - {use: kid-stand, x: 380, y: 264, w: 130, color: teal}
      - quote:
          title: הדוגמאות מהמקור — להקריא
          text: >-
            מתוך השיתוף, יכול להיוולד משפט שמחזק אותנו: ״אני לא לבד בזה״, ״כבר עברתי דברים קשים בעבר ואני יכול להתמודד גם
            עם זה״, או ״יש מי שרוצה בטובתי ויכול לעזור לי״. אלו דוגמאות למשפטים בוני חוסן שהמטרה שלהם לתמוך ביכולת שלנו
            להתמודד במצבים שונים ולחזק את התקווה והאמונה שהדברים יסתדרו. את המשפטים האלו ואחרים נוכל לומר לעצמנו במצבים
            שונים ואפילו להזכיר אותם לחברים שמשתפים אותנו בקושי או במצוקה.
      - moves:
          - הקריאי את הדוגמאות, והציגי את ששת המשפטים — שלושה בכל שקף.
          - כל אחד בוחר משפט אחד וכותב לעצמו מתי הוא עלול להזדקק לו. דקה וחצי.
          - דקה בזוגות — כל אחד מספר איזה משפט בחר, ולמה. שמעי שניים־שלושה במליאה.
      - slide:
          kicker: משפטים בוני חוסן · 1
          title: איזה משפט מחזק אתכם?
          points:
            - לזכור להתחבר לכוחות שבי ולהיזכר בדברים שמשמחים אותי
            - לכל בעיה יש יותר מפתרון אחד
            - מצבים שונים בחיים הם זמניים
          verbatim:
            - points
          echo: true
          cue: אחרי הדוגמאות —
          alt: נבט בעציץ, ושמש לידו
          art:
            - {use: sprout, x: 200, y: 150, w: 250}
            - {use: sun, x: 430, y: 40, w: 140}
      - slide:
          kicker: משפטים בוני חוסן · 2
          title: ואולי אחד מאלה?
          points:
            - שיתוף חברים ומבוגרים הוא בעל כוח ריפוי ומסייע באופן ישיר בתהליך ההתמודדות
            - תמיד יש מישהו שמוכן להקשיב, לשמוע ולסייע - אל תישארו לבד!
            - פניה לעזרה היא עדות לכוח נפשי
          verbatim:
            - points
          echo: true
          cue: המשפטים הבאים —
          alt: שתי ידיים מושטות זו לזו
          art:
            - {use: hands-help, x: 160, y: 120, w: 300}
      - say: בחרו משפט אחד שמדבר אליכם, וכתבו מתי תצטרכו אותו. אחר כך — ספרו לשכן.
      - ladder:
          help: איזה משפט הייתם רוצים לשמוע מחבר ביום קשה?
          challenge: נסחו משפט בונה חוסן משלכם — במילים שלכם.
      - ask: איזה משפט בחרתם — ולמה דווקא אותו?

  # ------------------------------------------------------------------ 14′–18′
  - id: video
    title: כרטיס ביטחון — סרטון
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: סרטון קצר של ״בוחרים בחיים״ על כרטיס הביטחון; עוצרים בסוף על מקורות הסיוע
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש תשובות.
          - הפעילי את הסרטון, ועצרי בסוף — על מקורות הסיוע.
          - הסבירי בקצרה על כל מקור סיוע שבסרטון, והציעי לכתוב אותם בכרטיס.
      - video:
          title: בוחרים בחיים — כרטיס ביטחון
          url: https://www.youtube.com/watch?v=w249hGEFhzs
          length: "1:24"
          before: מה הייתם שמים בכרטיס שיזכיר לכם, ביום קשה, מה מחזק אתכם?
          watch: שימו לב — מה יש בכרטיס, ואילו מקורות סיוע מופיעים בסוף הסרטון?
          pauses:
            - at: "?"
              moment: >-
                סוף הסרטון, במסך שבו רשומים מקורות הסיוע — כך מבקש המקור: לעצור בסוף ולהסביר עליהם. צפי בסרטון לפני השיעור,
                ורשמי כאן את הזמן.
              ask: אילו מקורות סיוע אתם רואים כאן — ואיזה מהם הייתם מוסיפים לכרטיס שלכם?
          alt: מחשב נייד, ועל המסך מגן
          art:
            - {use: laptop, x: 145, y: 160, w: 330}
            - {use: shield, x: 265, y: 203, w: 90, color: teal}
      - p: >-
          המקור מציע לתלמידים לצלם את המסך עם מקורות הסיוע. אין טלפונים בשיעור? מעתיקים את המספרים לכרטיס.

  # ------------------------------------------------------------------ 18′–26′
  - id: card
    title: יוצרים את הכרטיס
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - דיפרנציאליות וגיוון
    summary: כל אחד יוצר כרטיס ביטחון אישי — לפחות ארבעה מתוך שמונת המרכיבים, ובהם מי עוזר לי ומספרי טלפון
    body:
      - slide:
          kicker: לבד · 6 דקות
          title: כרטיס הביטחון שלי
          sub: לפחות ארבעה מרכיבים — ובהם מי עוזר לכם, וער״ן 1201, שעונה בכל שעה.
          timer: 360
          echo: true
          alt: כרטיס ובו מגן, לב, שמש וטלפון, ושורות כתיבה ליד כל אחד
          art: {file: art/card.svg}
      - moves:
          - חלקי את דף הכרטיס, והציגי את שמונת המרכיבים. חובה ארבעה — והשאר לבחירה.
          - >-
            הקפידי שבכל כרטיס יהיו ״מה/מי עוזר לי?״ ו״מספרי טלפון חשובים לי״ — ובהם ער״ן 1201, שעונה בכל שעה, ולצידו
