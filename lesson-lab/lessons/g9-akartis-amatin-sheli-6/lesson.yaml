sub: >-
  כשמשתפים — לא נשארים לבד. בשיעור הזה מדברים על כוחו של השיתוף, בוחרים משפט בונה חוסן, ויוצרים את ״כרטיס הביטחון
  שלי״ — תזכורת אישית למה שמחזק אותנו.
format: כתיבה אישית, זוגות ויצירה
question: מה מחזק אותי ברגעים קשים — ולמי אפשר לפנות?
takeaways:
  - לשתף מישהו במה שעובר עלינו מקל, מחזק ופותח דלת לעזרה — זו לא חולשה, זה כוח.
  - משפטים בוני חוסן, כמו ״אני לא לבד בזה״, עוזרים להתמודד — ואפשר לומר אותם גם לחבר.
  - כרטיס הביטחון מזכיר לי מה מחזק אותי ולמי אפשר לפנות — גם ברגע קשה.
prep:
  - צבעים וטושים, ומוזיקה רגועה להשמעה ברקע בזמן היצירה
  - >-
    אפשר במקום הדף להדפיס את הכרטיס המעוצב של שפ״י, בגודל חצי דף — הקישור בהערות לשקף 25 במצגת המקורית

safe:
  - head: תיאום עם היועצת
    text: >-
      השיעור הוא חלק מ״בוחרים בחיים״ — תוכנית למניעת אובדנות ולחיזוק חוסן. ספרי לה מתי השיעור ועל מה, ובדקי איתה אילו
      שמות ומספרים כדאי שיופיעו בכרטיס — היא עצמה והיכן אפשר למצוא אותה, לצד קו הסיוע שבמקור ולצד קו שעונה בכל שעה
      (סעיף 4). בקשי שתהיה זמינה אחרי השיעור. במצגת המקורית יש מכתב קצר להורים — החליטו יחד אם לשלוח אותו.
  - head: מי עלול להיפגע
    text: >-
      מי שאין לו כרגע למי לפנות עלול להיתקע ב״מה/מי עוזר לי?״ — אמרי מראש שאפשר לכתוב אדם שהייתי רוצה לפנות אליו, או
      את היועצת. גם ״אירוע מאתגר״ בפתיחה יכול להיות כבד: מספיקה מילה אחת, והאירוע נשאר אצל הכותב.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. בפתיחה משתפים רק את מי
      שיתפו, לא מה קרה. הכרטיס אישי ולא נאסף, ובזוגות כל אחד בוחר מה לספר. מותר לוותר, ולא קוראים בשם למי שלא
      הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור
      בסוד. מי שכתב ״אף אחד״ ב״מי עוזר לי?״ או בכרטיס היציאה — מדברים איתו בשקט, ומעדכנים את היועצת. לצד היועצת:
      ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; קול לכולם 6312* — מוקד התמיכה הרגשית והחברתית של משרד
      החינוך, א׳–ה׳ 8:00–20:00 ובשישי 8:00–14:00. ער״ן צריך להיות בכל כרטיס, כי קול לכולם לא עונה בערב ובשבת.

