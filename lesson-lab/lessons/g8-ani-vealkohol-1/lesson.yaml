sub: >-
  מסיבות ובילויים הם חלק מהחיים שלנו, ולפעמים יש בהם גם אלכוהול. בשיעור הזה בודקים מה שתייה אומרת לנו ומה
  לדעתנו היא אומרת לחברים, ומתמודדים עם שישה מצבים מהחיים — ממסיבות של בני נוער.
format: כתיבה אישית, קבוצות ומליאה
question: מה אני חושב על שתיית אלכוהול — ומה עושים כשבמסיבה מגיע רגע של סיכון?
takeaways:
  - >-
    שתיית אלכוהול נתפסת לפעמים ככיף ושחרור, אבל היא מזמנת מצבי סיכון — ובגיל ההתבגרות היא מסוכנת ואינה
    מומלצת.
  - מה שאנחנו חושבים שהחברים חושבים על שתייה משפיע על ההחלטות שלנו — כדאי לשים לב לזה.
  - תכנון לפני היציאה לבילוי, ומבוגר שאפשר להתקשר אליו, עוזרים לבלות בלי סיכונים.
prep:
  - חלוקה מראש לשש קבוצות לפי השולחנות, ואיזה מצב חיים מקבלת כל קבוצה
  - >-
    27 המילים של ״שתיית אלכוהול בשבילי…״ — כתובות על הלוח לפני השיעור, עם מקום ליד כל מילה לשני מספרים:
    ״בשבילי״ ו״החברים״
  - שלוש השאלות של ״מצבי חיים״ — כתובות על הלוח לפני השיעור, בפינה שלא נמחקת

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — בילויים, מסיבות ושתיית אלכוהול, בשיעור הראשון של היחידה. שאלי אם יש בכיתה
      מי שהנושא קרוב אליו מדי: מי ששותים אצלו בבית יותר מדי, מי שהוטרד או נפגע במסיבה, או מי שמישהו קרוב אליו
      נהג אחרי שתייה או אושפז. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מצבי החיים כוללים בני נוער שיכורים שמציקים, נער שאיבד הכרה ונסיעה עם נהג ששתה — מי שחווה דבר דומה עלול
      לזהות את עצמו. מדברים על הדמויות ועל ההחלטות שלהן, לא על ״שיכורים״ כאנשים, ולא שואלים מי שתה או מי כבר היה במצב
      כזה. את המילים של ״בשבילי״ סופרים בעיניים עצומות.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. הכתיבה בפתיחה נשארת במחברת, ובמליאה
      משתפים רק מתנדבים. רגעים לא נעימים ממסיבות — מדברים עליהם באופן כללי (״מה יכול להפוך בילוי למאיים?״),
      לא כסיפור אישי. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל הטרדה, שתייה מרובה בבית, או לחץ לשתות שקורה עכשיו — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית,
      24/7, גם בלי לומר שם; במצב חירום רפואי — מד״א 101 (למשל מישהו ששתה ולא מגיב).

