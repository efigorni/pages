steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: תרבות שעות הפנאי
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית כשנכנסים — איך אוהבים לבלות, ומה הופך זיכרון מבילוי לנעים; שומעים שלוש תשובות
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: איך אתם אוהבים לבלות בשעות הפנאי?
          sub: זיכרון נעים אחד מבילוי — ומה הפך אותו לנעים?
          timer: 180
          echo: true
          alt: שלושה חברים יחד, ושמש מעליהם
          art:
            - {use: group3, x: 110, y: 250, w: 350}
            - {use: sun, x: 420, y: 40, w: 160}
      - moves:
          - השקף על המסך כשהכיתה נכנסת; כותבים במחברת בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש תשובות שונות זו מזו.
          - >-
            הזמיני את שלושת הכותבים לשתף. אחר כך שאלי את השאלה הכללית — מה יכול להפוך בילוי ללא נעים — ושמעי
            שתיים־שלוש תשובות, בלי סיפורים אישיים.
      - say: שלוש דקות, לבד ובשקט. אין תשובה נכונה — רק בילוי שהוא שלכם.
      - ladder:
          help: איפה הייתם, ועם מי — ומה עשיתם שם?
          challenge: מה היה צריך לקרות כדי שהבילוי הזה יהפוך ללא נעים?
      - ask: מה במסיבה או במפגש של חברים יכול להפוך בילוי מהנה למאיים?
      - say: >-
          לפעמים במסיבות יש גם אלכוהול. בואו נבדוק מה הוא אומר לנו — ומה לדעתנו הוא אומר לחברים שלנו.

  # ------------------------------------------------------------------ 5′–12′
  - id: words
    title: בשבילי — ובשביל החברים
    minutes: 7
    practices:
      - כולם כותבים
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      כל אחד בוחר שלוש מילים — מה שתיית אלכוהול בשבילו, ומה לדעתו החברים חושבים עליה; סופרים בעיניים עצומות
      ומשווים בין שני הטורים
    body:
      - slide:
          kicker: שתיית אלכוהול · סבב 1
          title: שתיית אלכוהול בשבילי...
          sub: בחרו מהלוח 3 מילים, וכתבו אותן במחברת. אפשר גם מילה משלכם.
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו בקבוק
          art:
            - {use: kid-stand, x: 40, y: 230, w: 140, color: teal}
            - {use: thought, x: 250, y: 24, w: 320, flip: true}
            - {use: bottle, x: 350, y: 80, w: 120}
      - board: >-
          כיף · עזרה · שליטה · רושם · דרך לבלות · פחד · חרדה · יעילות · הוצאות כספיות · מקובלות · הימור · הנאה ·
          עצמאות · ראש טוב · ריגושים · כוח · מעמד חברתי · נטילת סיכונים · אופי · מסורת · חיקוי · השתכרות · ארוחה
          טובה · צרות · בגרות · לא להשתעמם · להרגיש שייך
      - moves:
          - המילים כבר על הלוח. כל אחד כותב במחברת 3 מילים — בשקט, בלי להסתכל על השכנים.
          - >-
            סופרים בעיניים עצומות: הקריאי את המילים אחת־אחת, ומי שבחר מילה מרים יד. ליד כל מילה כתבי את מספר
            הידיים — בטור ״בשבילי״.
          - >-
            הסבב השני — אותו דבר, עם ״החברים שלי חושבים ש…״. את המספרים כתבי בטור שני, ״החברים״, ליד הראשון.
          - כולם פותחים עיניים ומסתכלים על שני הטורים. שאלי מה ההבדל, וחכי חמש שניות לפני שאת מזמינה תשובות.
      - say: >-
          עכשיו סופרים כמה פעמים בחרנו כל מילה — בעיניים עצומות, כדי שכל אחד יענה רק בשביל עצמו.
      - ladder:
          help: קראו רק את השורה הראשונה — איזו מילה בה הכי קרובה למה שאתם חושבים?
          challenge: הוסיפו מילה משלכם שאין ברשימה — ולמה היא חסרה בה?
      - slide:
          kicker: שתיית אלכוהול · סבב 2
          title: שתיית אלכוהול — החברים שלי חושבים ש...
          sub: בחרו מהלוח 3 מילים — כך לדעתכם החברים שלכם מתייחסים לשתייה.
          echo: true
          cue: אחרי הספירה הראשונה —
          alt: שלושה חברים, ומעליהם ענן מחשבה ובתוכו בקבוק
          art:
            - {use: thought, x: 24, y: 24, w: 300}
            - {use: bottle, x: 104, y: 76, w: 120}
            - {use: group3, x: 290, y: 280, w: 300}
      - ask: מה ההבדל בין הטור של ״בשבילי״ לטור של ״החברים״ — ולמה לדעתכם הוא קיים?
      - say: >-
          מה שאנחנו חושבים על החברים משפיע גם על מה שנעשה כשנהיה איתם. בואו נראה מה עושים ברגע האמת.

  # ------------------------------------------------------------------ 12′–23′
  - id: situations
    title: מצבי חיים — מה אני הייתי עושה?
    minutes: 11
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      שש קבוצות, מצב חיים אחד לכל קבוצה — כל אחד כותב לבד מה היה עושה, הקבוצה משוחחת על הבעיה, האפשרויות
      וההשלכות, ונציג מספר במליאה מה החליטו
    body:
      - moves:
          - הסבירי את המשימה לפני שמחלקים את הכרטיסים; שלוש השאלות כבר על הלוח.
          - חלקי לכל קבוצה כרטיס אחד. דקה ראשונה — כל אחד כותב לבד מה הוא היה עושה, ולמה.
          - הסתובבי בין הקבוצות. דקה לפני הסוף — הודיעי, ובקשי מכל קבוצה לבחור נציג.
          - >-
            במליאה — נציג מכל קבוצה מספר את המקרה במשפט אחד, ומה הקבוצה החליטה ולמה. רשמי על הלוח את ההחלטות
            בקצרה.
      - slide:
          kicker: מצבי חיים · בקבוצות · 6 דקות
          title: מה אתם הייתם עושים?
          sub: קראו את המקרה, כתבו לבד — ואז שוחחו לפי השאלות שעל הלוח.
          timer: 360
          alt: ארבעה סביב שולחן עגול, ודף מקרה לידם
          art:
            - {use: circle4, x: 110, y: 160, w: 330}
            - {use: note, x: 450, y: 30, w: 140}
      - board:
          - מה הבעיה של הדמות במקרה?
          - אילו אפשרויות עומדות בפניה?
          - מה יהיו ההשלכות של כל בחירה?
      - say: >-
          כל קבוצה מקבלת מצב אחד מהחיים. קודם כל אחד כותב לבד מה הוא היה עושה — ורק אחר כך מדברים.
      - task:
          what: >-
            קוראים את המקרה בקול. כל אחד כותב לבד, בדקה, מה הוא היה עושה ולמה; אחר כך משתפים בקבוצה, משוחחים לפי
            שלוש השאלות שעל הלוח, ומחליטים יחד מה כדאי לדמות לעשות.
          time: 6 דקות — דקה לכתיבה, חמש לשיחה
          group: שש קבוצות לפי השולחנות; מקרה אחד לכל קבוצה
          rules: כל אחד אומר מה כתב לפני שמחליטים; מותר לא להסכים — ואז מספרים גם על הדעה השנייה
          plenary: נציג מכל קבוצה — המקרה במשפט אחד, ההחלטה, ולמה
          help: מי יכול לעזור לדמות ברגע הזה — ואיך היא יכולה לפנות אליו?
          challenge: מה הדמות הייתה יכולה לעשות עוד לפני המסיבה, כדי שהמצב לא יקרה?
      - handout:
          title: מצבי חיים
          copies: עותק אחד, גזור לשישה כרטיסים — כרטיס לכל קבוצה
          lines: false
          items:
            - >-
              גלית מתכננת לצאת למסיבה במוצאי שבת, והיא יודעת שהאלכוהול יהיה נגיש שם. היא לא נוהגת לשתות, אך יודעת
              שחלק מהנוכחים ישתו ואף ישתכרו. היא מניחה שחבריה יחשבו שגם היא באה לעשות את אותו הדבר. מה עליה לעשות?
            - >-
              הוריה של שני תמיד אמרו לה שאם תיקלע למצב שבו לא יהיה לה איך לחזור הביתה, חשוב שתתקשר אליהם והם יבואו
              לאסוף אותה. והנה זה קרה. היא בילתה במסיבה שבה רוב חברותיה שתו, ושני בני נוער מבוגרים יותר, ששתו הרבה,
              החלו להציק לה ולחברתה לי. היא רצתה להתקשר להוריה, אך חשבה, שאם היא תתקשר אליהם והם יבואו, הם יראו
              כיצד היא מבלה, ולא יתנו לה לצאת יותר למסיבות. מה צריכות שני ולי לעשות?
            - >-
              רותם ויניב, חברים מהשכבה, יצאו יחד למסיבה. יניב שתה כמה פחיות בירה והתחיל להתנהג באופן מוזר — לצחקק,
              לרקוד. רותם הרגישה נבוכה מהתנהגותו, וניסתה לשכנע אותו להפסיק לשתות, אך הוא התעלם ממנה. מה צריכה רותם
              לעשות?
            - >-
              מאור השתתף במסיבה עם חברים מכיתה יא׳. במהלך המסיבה שתו בירה וודקה, וכשהגיע הזמן לחזור הביתה הציע
              חברו דניאל מכיתה יא׳ להסיע את כולם. מאור ראה שהוא שתה, מה עליו לעשות? כיצד עליו לנהוג?
            - >-
              נער מתמוטט חסר הכרה ליד חן כשהוא עוזב את המסיבה. חן מכיר את הנער ויודע ששתה הרבה. מה עליו לעשות?
            - >-
              מקס ומרב, חברים מהכיתה, יצאו יחד למסיבה. מרב שתתה כמות גדולה של אלכוהול והקיאה. חבריהם חושבים שזה
              מצחיק ושמקס צריך להתעלם מזה. מקס מעוצבן מכך ששתתה, והוא נבוך מפני חבריהם. מה צריך מקס לעשות?
      - whisper: >-
          בשלושה מצבים יש תשובה בטוחה אחת — ואם הקבוצה לא הגיעה אליה, אמרי אותה בסוף הסבב: לא עולים לרכב עם נהג
          ששתה, ומתקשרים להורים או למבוגר אחר שיבוא לאסוף; כשמציקים ולא מרפים — מתקשרים להורים, גם אם יכעסו; ומי
          שאיבד הכרה — לא משאירים לבד: קוראים מיד למבוגר ומזמינים אמבולנס, מד״א 101.
      - ask: באיזה מצב הכי קשה היה להחליט — ולמה?
      - say: בכל המצבים מישהו שתה, ומישהו אחר נאלץ להחליט. בואו נחבר את זה למילים שבחרנו בהתחלה.

