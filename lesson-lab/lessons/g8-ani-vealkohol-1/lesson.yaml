    body:
      - messages:
          items:
            - >-
              שתיית אלכוהול היא חלק מתרבות הפנאי, לא פעם היא נתפסת כמהנה ומשחררת, אך יחד עם זאת היא מזמנת מצבי
              סיכון.
            - >-
              המחשבות שלנו לגבי האופן שבו החברים שלנו מתייחסים לשתיית אלכוהול משפיעות על ההתנהגות שלנו, חשוב שנהיה
              מודעים לכך.
            - >-
              יצאתם לבלות: תכנון, התארגנות וקבלת החלטות מושכלת לפני היציאה לבילוי, כולל מה עושים לגבי השתייה וכיצד
              נמנעים ממנה, יכולים להעלות את הסיכוי שהמסיבה תהיה עבורכם מהנה וללא סיכונים.
            - >-
              מומלץ וחשוב להביא בחשבון את התוצאות וההשלכות של ההתנהגויות שלנו. לעיתים קורה שתחת השפעת אלכוהול אנו
              מתנהגים בצורה שלא מאפיינת אותנו ואולי אף נצטער עליה.
            - שתיית אלכוהול בגיל ההתבגרות מסוכנת ואינה מומלצת.
          ask: >-
            איזה משפט מהחמישה הייתם רוצים לזכור לפני היציאה לבילוי? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהתפיסה של שתייה ושל החברים (1–2), דרך התכנון וההשלכות (3–4), אל השורה התחתונה (5).
          alt: עמוד שלטים, ודמות עומדת לידו
          art:
