    w: 180
  alt: דמות יושבת
steps:
- id: part-1
  title: איך נראית הקשבה?
  minutes: 5
  practices:
  - מה הקשר?
  - זמן חשיבה
  spotlights:
  - עניין ורלוונטיות
  summary: איך נראית הקשבה? — מה עוזר לכם להקשיב בנוחות?
  body:
  - slide:
      title: מה עוזר לכם להקשיב בנוחות?
      art:
      - use: kid-sit
        x: 180
        y: 120
        w: 180
      alt: דמות יושבת
      echo: true
  - moves:
    - אמרי שני משפטים על משחק מוכר, ותני לכל תלמיד למצוא תנוחת הקשבה נוחה.
    - הזמיני שתי הצעות למה עזר.
    - אין חובה לקשר עין או לישיבה בתנוחה אחת; גם מבט הצידה יכול ללוות הקשבה.
  - ask: מה עוזר לכם להקשיב בנוחות?
  - ladder:
      help: אפשר לפנות את הגוף, להניח חפץ או לבקש לדבר לאט.
      challenge: איך נדע שהקשבנו בלי להסתמך רק על המראה?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: ההודעה שלא נשמעה
  minutes: 6
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: ההודעה שלא נשמעה — איך אי-הקשבה משנה את השיחה?
  body:
  - slide:
      title: איך אי-הקשבה משנה את השיחה?
      art:
      - use: chat
        x: 180
        y: 120
        w: 250
      alt: בועות שיחה
      echo: true
      sub: ''
  - moves:
    - ספרי על אדם שרוצה להודיע ליובל שהסרט בוטל, ועל הכעס שמקשה להשלים את ההסבר.
    - בזוגות כתבו שתי שאלות שיובל יכול לשאול לפני תגובה.
    - במליאה הבדילי בין הקשבה לבין הסכמה.
  - ask: איך אי-הקשבה משנה את השיחה?
  - task:
      what: כתבו שתי שאלות שיובל יכול לשאול לפני תגובה. הבחינו בין הקשבה להסכמה.
      time: 3 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה עוד צריך לדעת לפני שמחליטים מי אשם?
      challenge: האם אפשר להבין את הסיבה של חבר ועדיין להיות מאוכזבים?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: גלי ונטע מדברות
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: גלי ונטע מדברות — מה צריך כל צד כדי להישמע?
  body:
  - slide:
      title: מה צריך כל צד כדי להישמע?
      art:
      - use: pair
        x: 180
        y: 120
        w: 250
      alt: זוג
      echo: true
      sub: ''
  - source_slide:
      slides:
      - 13
      why: מציגים את התוכן המקורי המתואר בפעילות וקוראים רק את החלק הדרוש לתרגול.
      art:
      - use: pair
        x: 180
        y: 120
        w: 250
      alt: זוג
  - moves:
    - 'ספרי: גלי מזמינה שלוש חברות לפארק מים כי יש מקום מוגבל ברכב.'
    - נטע לא הוזמנה ונעלבת.
    - 'כל זוג מתרגל שיחה עם ארבע תחנות: התארגנות נוחה; הקשבה עד הסוף; ניסיון להבין את הסיבה והרגש; הבעת
      צורך או בקשה.'
    - החליפי תפקידים.
    - אין הכרח להגיע להסכמה.
  - ask: מה צריך כל צד כדי להישמע?
  - task:
      what: 'תרגלו את שיחת גלי ונטע: התארגנות נוחה, הקשבה עד הסוף, ניסיון להבין והבעת בקשה. החליפו תפקידים.'
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: אפשר להתחיל בשמעתי שנפגעת כשלא הוזמנת.
      challenge: איך גלי תסביר מגבלה בלי לבטל את העלבון של נטע?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: בודקים מה השתנה
  minutes: 7
  practices:
  - מהלכי שיח
  - זמן חשיבה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: בודקים מה השתנה — מה אפשר להבין בלי לפתור הכול?
  body:
  - slide:
      title: מה אפשר להבין בלי לפתור הכול?
      art:
      - use: speech
        x: 180
        y: 120
        w: 250
      alt: בועת דיבור
      echo: true
  - moves:
    - הזמיני זוג להציג קטע קצר.
    - הצופים מציינים משפט שהראה הקשבה ומשפט שהביע צורך.
    - שאלי מה נשאר לא פתור ואיזו בקשה נוספת אפשר להציע.
    - אל תדרשי חיבוק או פיוס פומבי.
  - ask: מה אפשר להבין בלי לפתור הכול?
  - ladder:
      help: חפשו שאלה מבררת או חזרה על דברי האחר.
      challenge: איך נשמור על כבוד גם אם הרצונות נשארים שונים?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - לכולנו קשה לעיתים להקשיב, בעיקר בזמן ויכוח עם האחר.
      - בשעת ויכוח או כשאנחנו חושבים שמישהו מתנגד לנו, אנחנו בהרגשה של "איום", שיכול לגרום לנו שלא להקשיב.
      - גם כשאין לנו סבלנות למי שמדבר כי אנחנו עסוקים במשהו אחר, כדאי לשים לב לכך ולעבור למצב של הקשבה,
        כדי לא להגיב בדרך לא מתאימה.
      - ארבעה שלבים פשוטים יכולים לעזור לנו במצב שבו קשה לנו להקשיב, אם זה בזמן עימות או במצב של חוסר
        פניות.
      - כאשר אנחנו פעילים בהקשבה, אנחנו רואים את האחר בלי לבטל את עצמנו. בדרך זו יש סיכוי ששני הצדדים
        ירגישו שהם הרוויחו וכתוצאה מזה, בעיות יכולות להיפתר וקשר בין חברים עשוי להתחזק.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - נסחו משפט שמראה שהבנתם את הצד השני.
      - נסחו בקשה שמבטאת גם את הצורך שלכם.
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: אי-הזמנה ותחושת דחייה. אין לקשר את המקרה למסיבה אמיתית בכיתה או לכפות קשר עין.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
