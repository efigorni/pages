steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: alike
    title: דומים ושונים
    minutes: 5
    practices:
      - מה הקשר?
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: מסתובבים בכיתה ומחפשים מי שדומה לנו ומי ששונה מאיתנו; מה היה קל למצוא, ומה קשה?
    body:
      - slide:
          kicker: משחק · מסתובבים בכיתה
          title: דומים ושונים
          points:
            - מצאו מישהו שהמקצוע האהוב עליו זהה לשלכם
            - מצאו מישהו שיש לו מספר אחים ואחיות כמו לכם
            - מצאו מישהו עם סגנון מוזיקלי שונה משלכם
            - מצאו מישהו שעוסק בפעילות פנאי שונה משלכם
          echo: true
          alt: כיתה מלאה בדמויות, ודמות אחת מרימה יד
          art:
            - {use: crowd, x: 40, y: 300, w: 340}
            - {use: kid-hand, x: 420, y: 212, w: 150, color: orange}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. כל אחד לוקח מחברת ועט, ונעמד.
          - >-
            חשפי משפט אחד בכל פעם, ותני לחיפוש כחצי דקה. על כל משפט רושמים במחברת שם אחד — ובכל פעם של מישהו
            אחר.
          - אחרי המשפט הרביעי חוזרים למקומות.
          - שאלי מה היה קל למצוא ומה קשה, ותני לתלמידים להגיב זה לזה — ״מי מצא דווקא בקלות? למה?״
      - say: על כל משפט — מחפשים מישהו שמתאים לו, ורושמים את השם שלו. בכל משפט — מישהו אחר.
      - ask: איזה משפט היה הכי קל למצוא — ואיזה הכי קשה? למה, לדעתכם?
      - say: >-
          יש בינינו הרבה נקודות דמיון — וגם הרבה שוני, והסיפור של כל אחד לא זהה לשל אף אחד אחר. ומה קורה
          כשאנחנו רואים מישהו רק מבחוץ?

  # ------------------------------------------------------------------ 5′–13′
  - id: who
    title: מי הדמות?
    minutes: 8
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      ארבע דמויות מהמקור — תמונה וארבעה מקצועות; מנחשים באצבעות, אומרים על סמך מה, ורק אז שומעים מי הן
      באמת
    body:
      - slide:
          kicker: מי הדמות?
          title: מה המקצוע של האדם שבתמונה?
          sub: חושבים חמש שניות — ואז כולם מראים באצבעות יחד, 1, 2, 3 או 4.
          echo: true
          alt: דמות עומדת, וזכוכית מגדלת מכוונת אליה
          art:
            - {use: kid-stand, x: 340, y: 170, w: 170, color: purple}
            - {use: magnifier, x: 90, y: 110, w: 200}
      - source_slide:
          slides: [10, 13, 15, 16]
          why: >-
            בכל אחד מהשקפים האלה יש צילום של אדם אמיתי וארבעה מקצועות לבחירה — דמות אחת בכל שקף. הצילומים
            יש רק במצגת המקורית.
          alt: מחשב נייד — עוברים למצגת המקורית לתמונות הדמויות
      - moves:
          - >-
            בכל דמות — הקריאי את ארבעת המקצועות ומספרי אותם בקול, 1 עד 4. חמש שניות של שקט, ובספירה עד שלוש
            כולם מראים באצבעות יחד.
          - >-
            תארי במילים את הפיזור, ושאלי שניים־שלושה על סמך מה ניחשו — ומי ניחש אחרת, ולמה. רק אז אמרי מי
            הדמות באמת.
      - p: >-
          **התשובות**, לפי הסדר במצגת המקורית:
      - list:
          - יהודה סבינר (שקף 10) — רופא.
          - אלאא סולטאני (שקף 13) — מורה ערבייה בבית ספר ביהוד.
          - אדנקו סבחת־חיימוביץ׳ (שקף 15) — שופטת.
          - דניאל היימן (שקף 16) — הסטודנט המבוגר ביותר בארץ.
      - whisper: >-
          כשעולה ניחוש לפי מראה, דת או מוצא — אל תתקני מיד. שאלי ״על סמך מה?״, ותני לתשובה האמיתית לעשות את
          העבודה.
      - ask: על סמך מה ניחשתם? מה בתמונה גרם לכם לבחור דווקא בזה?
      - slide:
          kicker: אחרי החידון
          title: במה צדקתם, ובמה לא?
          sub: מה הפתיע אתכם? אילו רגשות ומחשבות עולים בכם בעקבות החידון?
          echo: true
          cue: אחרי הדמות הרביעית, בחזרה למצגת הזאת —
          alt: דמות חושבת, ובענן המחשבה שלה וי ואיקס
          art:
            - {use: thought, x: 50, y: 30, w: 280}
            - {use: check, x: 95, y: 95, w: 80}
            - {use: cross, x: 205, y: 95, w: 80}
            - {use: kid-stand, x: 340, y: 210, w: 150, color: teal}
      - ask: במה צדקתם, ובמה לא? מה הפתיע אתכם — ומה זה עורר בכם?
      - say: ניחשנו לפי תמונה ושם — ולא פעם טעינו. בואו נבין מה קרה לנו.

  # ------------------------------------------------------------------ 13′–18′
  - id: define
    title: אז מה זה בעצם סטריאוטיפ?
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: בזוגות מנסחים מה קרה לנו בחידון, ומשווים להגדרה של המקור — ולמה הכללה יכולה להזיק
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: במשפט אחד — מה זה סטריאוטיפ?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          alt: שתי דמויות יד ביד, ונורה דולקת לידן
          art:
            - {use: pair, x: 330, y: 238, w: 250}
            - {use: bulb, x: 110, y: 70, w: 150}
      - moves:
          - שאלי, ותני עשרים שניות של חשיבה בשקט.
          - דקה בזוגות — כל זוג מנסח משפט אחד.
          - >-
            שמעי שלושה זוגות, ורשמי על הלוח מילים מהניסוחים שלהם. רק אז הציגי את ההגדרה מהמקור, וחברי אותה
            למילים שעל הלוח.
      - whisper: >-
          כשעולה הכללה על קבוצה שלמה (״כל ה…״), שאלי מה הם יודעים על ההבדלים בתוך הקבוצה הזאת. את הקבוצה
          שלנו אנחנו מכירים מקרוב, ולכן רואים בה כל אחד בנפרד — וקבוצה אחרת נראית לנו ״כולם אותו דבר״.
      - ask: לפי מה שקרה לנו בחידון — מה זה סטריאוטיפ, במשפט אחד?
      - ladder:
          help: חשבו על הניחושים בחידון — מה ידעתם על האדם שבתמונה, ומה רק הנחתם?
          challenge: מתי הכללה עוזרת לנו — ומתי היא כבר סטריאוטיפ?
      - slide:
          kicker: אז מה זה בעצם סטריאוטיפ?
          title: סטריאוטיפ
          sub: סטריאוטיפ הוא הכללת אפיונים ותכונות על קבוצת אנשים השייכים לאותה קטגוריה.
          verbatim:
            - sub
          echo: true
          cue: אחרי שלושה ניסוחים —
          alt: קבוצה של אנשים שונים זה מזה, ומעליה בועה עם המילים ״כולם אותו דבר״
          art:
            - {use: crowd, x: 250, y: 300, w: 330}
            - {use: speech, x: 180, y: 40, w: 280}
            - text: כולם
              x: 320
              y: 110
              size: 40
            - text: אותו דבר
              x: 320
              y: 162
              size: 40
      - say: >-
          כולנו מחזיקים בהכללות, הרבה פעמים בלי לשים לב — ואנחנו צריכים אותן: הן עוזרות לנו להבין מהר מצבים
          ולהגיב מהר. הבעיה מתחילה כשהסטריאוטיפ שלילי, במיוחד כלפי קבוצה ששונה מאיתנו — אז הוא עלול לגרום לנו
          לפעול נגדה. ואיך זה מרגיש מהצד השני? נבדוק בזוגות.

  # ------------------------------------------------------------------ 18′–27′
  - id: interview
    title: שיח בזוגות — לשפוט לפני שמכירים
    minutes: 9
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      ראיון הדדי: כל אחד בוחר שאלה — מתי שפטו אותי לפני שהכירו אותי, או מתי אני ייחסתי למישהו תכונות;
      המראיין רושם ומהדהד. במליאה — מה עוזר לא לשפוט מהר
    body:
      - slide:
          kicker: לפני שמתחילים
          title: כללי הקשבה פעילה
          points:
            - מקשיבים באמת — בלי להיות מוסחים או שקועים בדברים אחרים
            - לא מפריעים ולא קוטעים, ומסתכלים לדובר בעיניים
            - בלי שיפוטיות — גם כשמה שמסופר שונה מעולמנו
            - כותבים את הדברים העיקריים שנאמרים
          echo: true
          alt: דמות יושבת ומקשיבה, וסימן וי לידה
          art:
            - {use: kid-sit, x: 210, y: 180, w: 220, color: purple}
            - {use: check, x: 420, y: 50, w: 150}
      - moves:
          - >-
            הזכירי את כלל השיח — ״מה שנאמר כאן נשאר כאן, ומספרים רק על עצמנו״ — ואת כללי ההקשבה, ועברי לשקף
            השאלות.
          - >-
            זוגות לפי השולחנות. כל אחד בוחר שאלה אחת מהשתיים. המראיין שואל, מקשיב ורושם מילים בולטות, ובסוף
            שלוש הדקות מהדהד: ״שמעתי שסיפרת ש…״. ואז מתחלפים.
          - הסתובבי בין הזוגות בלי להתערב. אחרי שלוש דקות — הודיעי שמחליפים תפקידים.
          - >-
            במליאה — שאלי מה עוזר לא לשפוט מהר, ורשמי על הלוח את הדרכים שעולות. על כל דרך — שאלי מי מסכים,
            ולמה.
      - slide:
          kicker: שיח בזוגות · שלוש דקות לכל אחד
          title: בחרו שאלה אחת
          sub: ואחר כך — איך הרגשתי? מה עשיתי? מה הייתי עושה היום אחרת?
          points:
            - האם הרגשתי פעם שמישהו שופט אותי לפני שהוא הכיר אותי?
            - האם קרה לי פעם שייחסתי תכונות מסוימות לאנשים למרות שלא הכרתי אותם לעומק?
          timer: 180
          echo: true
          cue: אחרי הכללים —
          alt: שתי דמויות יושבות זו מול זו; אחת מספרת על רגע שפגע בה, ולידן דף לרישום
          art:
            - {use: kid-sit, x: 40, y: 255, w: 170, color: purple}
            - {use: kid-sit, x: 410, y: 255, w: 170, color: teal, flip: true}
            - {use: speech, x: 330, y: 36, w: 240}
            - {use: heart-broken, x: 400, y: 72, w: 100}
            - {use: note, x: 230, y: 330, w: 110}
      - say: כל אחד בוחר שאלה אחת. המראיין שואל, מקשיב ורושם — ובסוף אומר ״שמעתי שסיפרת ש…״.
      - task:
          what: >-
            ראיון בזוגות. כל אחד בוחר שאלה אחת מהשתיים שעל המסך. המראיין שואל, מקשיב בלי לקטוע, רושם מילים
            ומשפטים בולטים, ובסוף מהדהד ״שמעתי שסיפרת ש…״. ואז מתחלפים.
          time: 3 דקות לכל ראיון, וחצי דקה להדהוד
          group: זוגות לפי השולחנות
          rules: מספרים רק על עצמנו ורק מה שבוחרים — בלי שמות של אחרים; מותר לבחור את השאלה הקלה יותר
          plenary: לא מספרים את הסיפור של בן הזוג; משתפים רק מה עוזר לא לשפוט מהר
          help: חשבו על רגע קטן — בחוג, במקום חדש, בכיתה. מה חשבו עליכם, ומה היה נכון באמת?
          challenge: מה היה צריך לקרות כדי שההכללה תשתנה — אצלכם, או אצל מי ששפט?
      - ask: מה עוזר לנו לא לשפוט מהר — להכיר את האדם לפני שמחליטים מי הוא?
      - say: >-
          הדרכים שעל הלוח הן שלכם — כל אחת מהן היא דרך להכיר את האדם שמולנו לפני שמחליטים מי הוא.

