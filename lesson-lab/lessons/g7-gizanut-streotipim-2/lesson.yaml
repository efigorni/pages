  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: חמשת מסרי המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - say: >-
          היום הכרנו את המושג סטריאוטיפ, ראינו שהרבה פעמים אנחנו משתמשים בסטריאוטיפים בלי לשים לב, ומצאנו דרכים
          לצמצם את החשיבה הזאת. חמישה משפטים לקחת איתכם:
      - messages:
          items:
            - ראינו כי חשיבה סטריאוטיפית היא אוניברסלית וקיימת אצל כולנו.
            - סטריאוטיפים והכללות מסייעים לנו להבין במהירות סיטואציות ולהגיב במהירות.
            - סטריאוטיפים והכללות עלולים להוביל אותנו להתנהג בצורה שלילית כלפי אנשים מקבוצות שונות.
            - יש מספר דרכים שיעזרו לנו לצמצם את החשיבה הסטריאוטיפית ולקבל את השונות בחברה.
            - >-
              בכיתה שלנו יש מגוון תלמידים. אם ננסה להכיר מתוך סקרנות, כבוד ופתיחות נגלה כי לצד השוני יש גם
              הרבה נקודות דמיון ונוכל להתקרב וליצור קשרים חברתיים איתנים.
          ask: איזה משפט מהחמישה הכי נכון בשבילכם היום? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            החמישה הולכים לפי הקשת: כולנו מכלילים, ההכללה גם עוזרת וגם מזיקה, ויש דרכים — כמו אלה שעל הלוח —
            להכיר את האדם לפני ששופטים אותו.
          alt: שלוש דמויות שונות זו מזו, וזכוכית מגדלת לידן
          art:
