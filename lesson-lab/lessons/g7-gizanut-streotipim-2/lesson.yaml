sub: >-
  כולנו מכלילים — זה עוזר לנו להבין מהר מה קורה סביבנו. אבל לפעמים ההכללה מטעה אותנו לגבי אנשים. בשיעור
  הזה מחפשים דומים ושונים בכיתה, מנחשים ״מי הדמות?״, ומדברים בזוגות על רגע שבו שפטו אותנו — או שאנחנו
  שפטנו.
format: משחק בתנועה, זוגות ומליאה
question: מה זה סטריאוטיפ — ואיך לא נותנים לו להחליט בשבילנו מי האדם שמולנו?
takeaways:
  - >-
    סטריאוטיפ הוא הכללה של תכונות על קבוצת אנשים — וכולנו מחזיקים בהכללות, לפעמים בלי לשים לב.
  - >-
    הכללות עוזרות לנו להבין מהר, אבל סטריאוטיפ שלילי עלול לגרום לנו לפעול לא טוב כלפי אנשים מקבוצה
    אחרת.
  - כשמכירים אדם מתוך סקרנות, כבוד ופתיחות — מגלים לצד השוני גם הרבה דמיון.
prep: []

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — סטריאוטיפים ודעות קדומות: חידון ״מי הדמות?״ עם דמויות מקבוצות שונות
      (חרדי, ערבייה, יוצאת אתיופיה, מבוגר), ושיחה בזוגות על רגע שבו שפטו אותנו. שאלי אם יש בכיתה מי
      שחווה לאחרונה יחס מעליב בגלל המוצא, הדת, הצבע או הגיל שלו, ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      תלמידים מהקבוצות שבחידון — וכל מי שהקבוצה שלו עולה בדיון. לא מבקשים מתלמיד ״להסביר״ את הקבוצה שלו
      או לייצג אותה, ולא מסתכלים עליו כשמדברים עליה. הכללה על קבוצה שלמה עוצרים בשאלה (״על סמך מה?״), לא
      בנזיפה. בשיחה בזוגות כל אחד בוחר שאלה אחת מהשתיים, ומי שחווה פגיעה קשה יכול לבחור את השנייה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מה שנאמר כאן נשאר כאן, ומספרים רק על עצמנו״. הסיפורים מהשיחה בזוגות נשארים
      בזוג; במליאה משתפים רק מתנדבים, ורק מה שהם בוחרים. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל הצקה או השפלה בגלל המוצא, הצבע או הדת — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

