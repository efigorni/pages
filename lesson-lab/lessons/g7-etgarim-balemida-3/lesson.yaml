steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: צימוק ואגוז
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה קצרה — משהו טוב בלמידה השנה (צימוק) ואתגר אחד (אגוז); שומעים כמה מכל סוג
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: צימוק ואגוז
          sub: כתבו במחברת משפט לכל אחד.
          points:
            - צימוק — משהו טוב ונעים בלמידה השנה
            - אגוז — אתגר שאתם חווים בלמידה
          timer: 120
          echo: true
          alt: פתק כתום ״צימוק״, פתק סגול ״אגוז״, ותלמיד כותב ליד שולחן
          art:
            - {use: sticky, x: 40, y: 50, w: 170}
            - text: צימוק
              x: 125
              y: 96
              size: 40
            - {use: sticky, x: 170, y: 270, w: 170, color: purple}
            - text: אגוז
              x: 255
              y: 316
              size: 40
            - {use: kid-desk, x: 360, y: 170, w: 240, color: teal}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. כותבים בשקט, בלי הסבר נוסף; בינתיים — נוכחות.
          - שמעי שלושה־ארבעה ״צימוקים״, ואחריהם שלושה־ארבעה ״אגוזים״. בלי תגובות — רק מקשיבים.
          - >-
            שאלי איך הרגישו כשכתבו כל אחד מהשניים, ושקפי: גם השמחה וגם התסכול טבעיים, ומשותפים לכולנו.
      - ladder:
          help: צימוק — שיעור אחד שנהניתם בו השבוע. אגוז — שיעור אחד שהיה לכם קשה בו.
          challenge: מצאו צימוק שהתחיל בכלל כאגוז — משהו שהיה קשה ונעשה טוב.
      - ask: איך הרגשתם כשכתבתם את הצימוק — ואיך כשכתבתם את האגוז?
      - say: את האגוזים שלכם — האתגרים — ננסה עכשיו לפצח ביחד.
      - tip: >-
          רוצה להוסיף טעם? קערת צימוקים וקערת אגוזים בכניסה, כמו במקור — או שוקולד חלב ומריר. רק אחרי
          שבדקת עם המחנכת שאין בכיתה אלרגיה.

  # ------------------------------------------------------------------ 5′–15′
  - id: pass
    title: מעבירים את זה הלאה
    minutes: 10
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      כל אחד כותב אתגר לימודי על דף, והדף עובר ברביעייה — כל חבר מוסיף טיפ; בסוף כל אחד בוחר טיפ
      לנסות
    body:
      - moves:
          - הסבירי את שלושת הסבבים לפני שמחלקים דפים; השלבים כתובים על הלוח.
          - רביעיות לפי השולחנות. דף לכל אחד — דקה לכתוב את האתגר.
          - כל דקה וחצי — ״מעבירים!״. אחרי שלושה סבבים של טיפים, עוד העברה אחת — והדף חוזר לבעליו.
          - דקה לקריאה. אחר כך — שניים־שלושה מספרים על טיפ שקיבלו ושהם רוצים לנסות.
      - slide:
          kicker: מעבירים את זה הלאה · ברביעיות
          title: אתגר אחד — שלושה טיפים
          sub: כתבו את האגוז שלכם על דף, והעבירו. על כל דף שמגיע — טיפ אחד.
          timer: 90
          echo: true
          alt: ארבעה סביב שולחן, דף, וחץ — הדף עובר הלאה
          art:
            - {use: circle4, x: 150, y: 200, w: 300}
            - {use: note, x: 470, y: 50, w: 110}
            - {use: arrow, x: 440, y: 230, w: 150, color: gray}
      - board:
          - כתבו בראש הדף אתגר לימודי אחד שנוח לכם לשתף.
          - העבירו את הדף לחבר שמימין.
          - על הדף שקיבלתם — כתבו טיפ אחד, מהניסיון שלכם, והעבירו הלאה.
          - כשהדף חוזר אליכם — קראו את הטיפים, וסמנו אחד שתנסו.
      - say: >-
          האגוז שלכם עובר בין החברים, וחוזר אליכם עם ״פיצוחים״ — טיפים מהניסיון שלהם. כך כולנו עוזרים
          לכולנו.
      - task:
          what: >-
            כל אחד כותב בראש דף אתגר לימודי אחד שנוח לו לשתף, ומעביר ימינה. על כל דף שמגיע — טיפ אחד,
            מהניסיון, ומעבירים הלאה. אחרי שלושה סבבים הדף חוזר לבעליו.
          time: דקה לאתגר, ודקה וחצי לכל סבב טיפים
          group: רביעיות לפי השולחנות; הדפים עוברים בתוך הרביעייה
          rules: בלי שמות על הדפים; טיפ שאפשר לעשות — לא ״פשוט תתאמץ״
          plenary: שניים־שלושה מספרים על טיפ שקיבלו ושירצו לנסות
          help: מה עזר לכם כשהיה לכם קושי דומה? כתבו את זה כטיפ.
          challenge: כתבו טיפ שאומר בדיוק מה עושים — ומתי.
      - ask: איזה טיפ קיבלתם — ותרצו לנסות?
      - say: טיפים עוזרים — וגם הדרך שבה אנחנו חושבים על הקושי. בואו נכיר חוקרת אחת.

  # ------------------------------------------------------------------ 15′–22′
  - id: mindset
    title: דפוס חשיבה מתפתח
    minutes: 7
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: שתי ההגדרות של קרול דווק — מקובע ומתפתח — ובזוגות אותו מצב בשני משפטים
    body:
      - slide:
          kicker: קרול דווק
          title: דפוס חשיבה מתפתח
          points:
            - אנשים בעלי דפוס חשיבה מקובע מאמינים שיכולות ואינטליגנציה הן קבועות מראש.
            - אנשים בעלי דפוס חשיבה מתפתח מאמינים שיכולות ואינטליגנציה ניתנות לפיתוח.
          verbatim:
            - points
          echo: true
          alt: נבט שצומח בעציץ, ושמש מעליו
          art:
            - {use: sprout, x: 170, y: 196, w: 250}
            - {use: sun, x: 440, y: 50, w: 130}
      - moves:
          - הציגי את השקף, וחשפי את שתי ההגדרות אחת־אחת.
          - ספרי בקצרה מה דווק גילתה (למטה).
          - >-
            שאלי, וחכי עשרים שניות — כל אחד חושב לבד על משפט ״מקובע״ ששמע או אמר. אחר כך בזוגות: כותבים
            אותו, ולידו את אותו משפט בדפוס מתפתח. דקה וחצי.
          - שמעי שלושה זוגות — קודם המשפט המקובע, ואז המתפתח. על כל זוג — הדהדי מה השתנה.
      - say: >-
          החוקרת קרול דווק בדקה למה אנשים עם יכולת דומה מצליחים אחרת. היא גילתה שמי שחושב ״יש לי את זה
          או שאין לי״ מוותר מהר, כי בעיניו גם מאמץ גדול לא יעזור. מי שחושב שאפשר להשתפר — מתאמץ, מתמיד
          ומגיע רחוק יותר. והחדשה הטובה: אפשר ללמוד לחשוב כך.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: אותו מצב — שני משפטים
          points:
            - מקובע — ״אין לי כישרון לנגן, וזהו.״
            - מתפתח — ״אם אתאמן, אנגן טוב יותר.״
            - כתבו זוג משפטים משלכם, על למידה
          echo: true
          cue: אחרי ההגדרות —
          alt: דמות, ומעליה שני ענני מחשבה — באחד מנעול ובשני נבט
          art:
            - {use: thought, x: 350, y: 40, w: 230, flip: true}
            - {use: lock, x: 430, y: 74, w: 72}
            - {use: thought, x: 40, y: 40, w: 230}
            - {use: sprout, x: 112, y: 70, w: 80}
            - {use: kid-stand, x: 252, y: 290, w: 115, color: teal}
      - ladder:
          help: חשבו על מקצוע אחד שקשה לכם. מה אתם אומרים לעצמכם עליו?
          challenge: מה היה עוזר לכם להאמין במשפט המתפתח — ולא רק לכתוב אותו?
      - ask: איזה משפט מקובע כתבתם — ואיך הוא נשמע בדפוס מתפתח?
      - say: אז במשפט החדש יש ___ — הבנתי נכון? מי כתב משהו דומה?

  # ------------------------------------------------------------------ 22′–27′
  - id: power
    title: כרגע, עדיין וסימן שאלה
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: >-
      כל אחד כותב משפט שלילי על הלמידה שלו ומסייג אותו — ״כרגע״, ״עדיין״ או סימן שאלה; זה פתק הכוח
      שלו
    body:
      - say: לפעמים מספיקה מילה אחת כדי לעבור ממקובע למתפתח. תראו.
      - slide:
          kicker: זמן תרגול
          title: כרגע, עדיין וסימן שאלה
          points:
            - ״השברים לא הולכים לי.״
            - ״**כרגע** השברים לא הולכים לי.״
            - ״השברים **עדיין** לא הולכים לי.״
            - ״השברים לא הולכים לי**?**״
          echo: true
          alt: פתק כתום שכתוב עליו ״עדיין״, ועיפרון לידו
          art:
            - {use: sticky, x: 170, y: 110, w: 260}
            - text: עדיין
              x: 300
              y: 184
              size: 56
            - {use: pencil, x: 420, y: 320, w: 150}
      - moves:
          - חשפי את הדוגמאות אחת־אחת, וקראי כל אחת בקול.
          - >-
            כל אחד כותב לעצמו על פתק משפט שלילי אחד על הלמידה שלו — ומסייג אותו במילה ״כרגע״ או ״עדיין״,
            או בסימן שאלה. שתי דקות.
          - שאלי מי הצליח לכתוב משפט, והזמיני שניים־שלושה מתנדבים לקרוא את המשפט החדש.
      - ladder:
          help: לא רוצים לכתוב על עצמכם? כתבו משפט שאתם שומעים מחברים — ותקנו אותו.
          challenge: הוסיפו למשפט החדש צעד אחד — ״…ולכן אני…״.
      - ask: קראו את המשפט החדש בשקט. איך אתם מרגישים ביחס אליו?
      - say: זה פתק הכוח שלכם — שמרו אותו בקלמר או במחברת.

  # ------------------------------------------------------------------ +5′
  - id: wall
    title: קיר פתקי הכוח
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
    summary: מי שרוצה — מקשט את פתק הכוח ותולה על הקיר; קוראים כמה בקול
    body:
      - slide:
          kicker: אם נשאר זמן · פתקי הכוח
          title: קיר פתקי הכוח
          sub: מי שרוצה — מקשט את הפתק ותולה אותו בכיתה.
          timer: 180
          echo: true
          alt: לוח, ועליו שלושה פתקים צבעוניים
          art:
            - {use: board, x: 102, y: 120, w: 416}
            - {use: sticky, x: 146, y: 172, w: 100, color: teal}
            - {use: sticky, x: 260, y: 186, w: 100}
            - {use: sticky, x: 374, y: 166, w: 100, color: purple}
      - moves:
          - מי שרוצה — מעתיק את המשפט החדש לפתק נקי, מקשט ותולה; מי שלא — שומר את הפתק לעצמו.
          - הקריאי בקול ארבעה־חמישה פתקים מהקיר, בלי שמות.
      - say: מי שרוצה — מקשט את פתק הכוח ותולה אותו על הקיר. מי שלא — שומר אותו לעצמו.
      - task:
