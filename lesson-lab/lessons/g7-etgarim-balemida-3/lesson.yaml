sub: >-
  בלמידה יש צימוקים — וגם אגוזים קשים לפיצוח. בשיעור הזה משתפים בשניהם, מעבירים טיפים מחבר לחבר,
  ומגלים מה משתנה כשמוסיפים למשפט את המילה ״עדיין״.
format: לבד, רביעיות ומליאה
question: איך מתמודדים עם אתגר בלמידה — ומה משתנה כשאומרים לעצמנו ״עדיין״?
takeaways:
  - בלמידה יש רגעים מתוקים וגם אתגרים — וזה טבעי ומשותף לכולנו.
  - יכולות אפשר לפתח במאמץ ובהתמדה — זה ״דפוס חשיבה מתפתח״.
  - מילה קטנה כמו ״עדיין״ או ״כרגע״ הופכת ״אני לא יכול״ ל״אני עוד לומד״.
prep:
  - חלוקה מראש לרביעיות לפי השולחנות
  - דף ריק לכל תלמיד (למעבירים את זה הלאה), ופתק לכל תלמיד לפתק הכוח
  - ארבעת השלבים של ״מעבירים את זה הלאה״ — כתובים על הלוח לפני השיעור
  - פתקים נקיים, טושים לקישוט ונייר דבק — להרחבה ״קיר פתקי הכוח״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה שבשיעור התלמידים כותבים אתגר לימודי שלהם, והדף עובר בין חברי הרביעייה. שאלי מי בכיתה
      מתמודד עם קושי לימודי שלא נוח לו לחשוף — למשל לקות למידה — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהלמידה קשה לו, ומי שכבר צחקו עליו בגלל קושי. האתגר שעובר בין הדפים הוא אתגר ״שנוח לשתף״ — לא
      חייבים לכתוב את הקושי הגדול ביותר. טיפ שמקטין או לועג (״פשוט תלמד״) — עוצרים בעדינות.
  - head: לא לוחצים לשתף
    text: >-
      הדפים בלי שמות, ופתק הכוח נשאר אצל מי שכתב אותו. קוראים בקול רק מתנדבים; מותר לוותר, ולא קוראים
      בשם למי שלא הצביע.
  - head: אם מישהו משתף מצוקה או פגיעה
    text: >-
      למשל ייאוש מהלימודים, ״אני טיפש״ שחוזר שוב ושוב, או קושי בבית — עוצרים בעדינות, מודים, וממשיכים
      בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

