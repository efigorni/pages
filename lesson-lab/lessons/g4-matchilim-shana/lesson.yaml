  - exit:
      form: board
      title: מה ניקח מהשיעור?
      prompts:
      - איזה כלל יעזור לי להשתתף?
      - איך איישם אותו בשיחה הקרובה?
      look_for: חפשי תשובה שמציעה פעולה קונקרטית ולא רק כוונה כללית. שימי לב לבלבול בנושא ולבקשה לשיחה; פני בשקט למי שמבקש עזרה.
      timer: 180
      art: note
  - p: אספי את הדפים באופן פרטי ליד הדלת.
