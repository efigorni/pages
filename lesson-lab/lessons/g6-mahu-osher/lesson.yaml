sub: >-
  מה זה בעצם אושר, ומה מעורר אותו? בשיעור הזה שומעים את האגדה על שני הזאבים, מגלים בקבוצות מה אומרים על
  אושר — דף מידע, היגדים, ציור וראיונות — ומתבוננים ברגעים הטובים של השיעור עצמו.
format: מליאה, קבוצות בבחירה וזוגות
question: מהו אושר — ומה מעורר אותו אצלנו?
takeaways:
  - אושר הוא רגש חיובי של שמחה, הנאה וסיפוק — עם סימנים בפנים (התלהבות, רוגע, תקווה) ובחוץ (חיוך, צחוק).
  - לכל אחד מקורות אושר משלו, ויש גם משותפים לכולם — משפחה, חברים, השגת מטרות ועזרה לזולת.
  - למה שאנחנו עושים יש השפעה על האושר שלנו — כמו בזאב שבוחרים להאכיל.
prep:
  - דוגמה משלך לדברי הסבא — רגע שבו ״האכלת״ את הזאב הטוב, ומה קרה בעקבותיו
  - דף גדול וטושים לקבוצת הציור (כרטיסייה 3)
  - >-
    לכרטיסיות 4–5 (ראיונות): תאמי מראש עם כיתה סמוכה ועם שניים־שלושה אנשי צוות שקבוצה קטנה תבוא לראיין
    אותם לכמה דקות. אין תיאום? מוותרים על הכרטיסיות האלה, וכרטיסיות 1–3 עוברות ליותר קבוצות.

