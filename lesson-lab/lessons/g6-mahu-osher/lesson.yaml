      - moves:
          - >-
            כל קבוצה בתורה: הנציג אומר את המשפט ׳אושר הוא…׳ ומוסיף דוגמה אחת — ההיגד שבחרו, הציור, או מה שגילו
            בראיון. עד דקה לקבוצה.
          - רשמי על הלוח מילים מתוך המשפטים — בשני טורים.
          - אחרי כל הקבוצות — שאלי מה משותף להגדרות, ותני לכיתה להגיב זו לזו.
          - >-
            בסוף — חשפי את נקודות הסיכום אחת־אחת, והקריאי לצד כל נקודה את המשפט שלה מהסיכום. כשמילה שעל הלוח
            כבר אמרה את זה — הצביעי עליה.
      - board: אושר הוא… · מה מעורר אושר
      - ask: מה משותף להגדרות ששמענו? מי מסכים — ומי רוצה להוסיף משהו שחסר?
      - slide:
          kicker: מסכמים את עבודת הקבוצות
          title: מה גילינו על אושר?
          points:
            - רגש חיובי — שמחה, הנאה וסיפוק
            - יש לו סימנים בפנים ובחוץ
            - מטרה שכולנו שואפים אליה
            - יש דברים שמחזקים אותו — וחלקם משותפים לכולם
          echo: true
          cue: אחרי כל הקבוצות —
          alt: שמש גדולה, ומתחתיה שלוש דמויות יחד
          art:
            - {use: sun, x: 230, y: 30, w: 170}
            - {use: group3, x: 150, y: 250, w: 320}
      - quote:
          title: הסיכום מהמקור — להקריא
          text: |-
            אושר הוא רגש חיובי, הקשור בשמחה, הנאה, סיפוק, שביעות רצון ורוממות רוח.
            לאושר יש סממנים פנימיים, כמו תחושות של התלהבות, רוגע או תקווה וסימנים חיצוניים כמו חיוך או צחוק.
            האושר ייחודי בכך שהוא נחשב כמטרה בפני עצמה – בני האדם שואפים להיות מאושרים ופועלים כדי ליצור מצבים שבהם ירגישו מאושרים.
            ישנם גורמים שמייצרים ומחזקים את תחושת האושר: התמקדות בחיובי של "המובן מאליו" (בריאות, משפחה, קורת גג וכו'), גישה חיובית כלפי אנשים ומאורעות המתבטאת בפרשנות חיובית ומכילה כלפיהם, איסוף חוויות חיוביות אותן הפרט יוזם בעצמו, עשיית מעשי חסד ואמונה דתית או רוחנית.
            למרות שיש שונות בקרב אנשים מה גורם להם לאושר, יש דברים משותפים לכולם: משפחה, חברים/ות, השגת מטרות, עזרה לזולת ועוד.
      - say: >-
          שמענו הגדרות שונות. עכשיו נבדוק משהו קרוב יותר — מה הרגשתם אתם, כאן, בשיעור הזה.

