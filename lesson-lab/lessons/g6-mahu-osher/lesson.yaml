steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: wolves
    title: שני הזאבים
    minutes: 6
    practices:
      - מה הקשר?
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: האגדה על שני הזאבים שבתוכנו — מה התכוון הסבא, ודוגמה למצב שבו דבריו נכונים
    body:
      - slide:
          kicker: שני הזאבים · אגדה
          title: סבא מספר לנכדו על החיים
          sub: הקשיבו — ומה הסבא עונה בסוף?
          alt: ספר פתוח, ודמות יושבת ומקשיבה
          art:
            - {use: book, x: 250, y: 150, w: 300}
            - {use: kid-sit, x: 50, y: 230, w: 176, color: purple}
      - moves:
          - >-
            פתחי בשני כללי שיח לשיעור — ״מקשיבים בסקרנות ובלי לשפוט״, ו״מספרים רק על עצמנו״ — והקריאי את
            האגדה.
          - הציגי את דברי הסבא, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב לה. ואז — הדוגמה שלך, ואחריה דוגמאות של הכיתה.
      - quote:
          title: שני הזאבים — להקריא
          text: |-
            אינדיאני זקן מלמד את נכדו על החיים.
            ״מאבק נצחי מתחולל בתוך כל בני האדם״, הוא מסביר לו. ״כמו קרב בין שני זאבים.
            הזאב האחד: זאב הכעס, הקנאה, הצער, החרטה, השנאה, הרחמים העצמיים, יהירות וגאוותנות.
            הזאב השני: זאב האושר, השלום והשלווה, אהבה, תקווה, מוטיבציה, עזרה לזולת, אמת, צניעות, ענווה ומעשים טובים.
            גם אצלך, נכדי, יש מאבק כזה בפנים.״
            הנכד חושב לכמה שניות ושואל את השאלה המתבקשת: ״נו… ומי מנצח? איזה זאב מנצח?״
            הסבא השיב: ״מנצח הזאב אותו אתה מאכיל יותר.״
      - slide:
          kicker: שני הזאבים
          title: ״מנצח הזאב אותו אתה מאכיל יותר״
          sub: למה התכוון הסבא? תנו דוגמה.
          verbatim: [title]
          echo: true
          cue: אחרי ההקראה —
          alt: דמות, ומעליה שני ענני מחשבה — בקטן ענן גשם, בגדול שמש
          art:
            - {use: thought, x: 40, y: 60, w: 180}
            - {use: rain-cloud, x: 86, y: 88, w: 90}
            - {use: thought, x: 350, y: 24, w: 250, flip: true}
            - {use: sun, x: 409, y: 57, w: 130}
            - {use: kid-stand, x: 245, y: 220, w: 130, color: teal}
      - ask: למה התכוון הסבא כשאמר ׳מנצח הזאב אותו אתה מאכיל יותר׳? ומתי זה נכון גם אצלנו?
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי מסכים, ומי חושב אחרת?
      - say: >-
          אחד הזאבים הוא זאב האושר. אבל מהו בעצם אושר? היום נגלה את זה בקבוצות — כל קבוצה מכיוון אחר.

  # ------------------------------------------------------------------ 6′–17′
  - id: groups
    title: מהו אושר? — חמש כרטיסיות
    minutes: 11
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - דיפרנציאליות וגיוון
    summary: >-
      קבוצות שהתלמידים בוחרים בעצמם; כל קבוצה מקבלת כרטיסייה — דף מידע, היגדים, ציור או ראיון — ומסכמת
      במשפט ׳אושר הוא…׳
    body:
      - slide:
          kicker: עבודה בקבוצות · 8 דקות
          title: התחלקו לשלישיות/רביעיות לפי בחירתכם.
          sub: פעלו לפי ההנחיות בכרטיסיית העבודה שקיבלתם.
          verbatim: true
          echo: true
          timer: 480
          alt: ארבעה סביב שולחן עגול, ודף לידם
          art:
            - {use: circle4, x: 150, y: 120, w: 300}
            - {use: note, x: 456, y: 300, w: 130}
      - moves:
          - >-
            הכיתה מתחלקת לבד לשלישיות או לרביעיות — דקה וחצי. הסתובבי ובדקי שלכל אחד יש קבוצה; מי שנשאר —
            צרפי אותו בעצמך, בלי הערה.
          - >-
            חלקי לכל קבוצה כרטיסייה אחת. 1 ו־2 דורשות קריאה ונימוק — לקבוצות שיצליחו בהן; 3 לקבוצה שאוהבת
            לצייר; 4 ו־5 רק אם תיאמת מראש. אותה כרטיסייה יכולה לעבור לשתי קבוצות.
          - הסתובבי בין הקבוצות. שתי דקות לפני הסוף — הזכירי לנסח משפט ׳אושר הוא…׳ ולבחור מי מציג.
      - say: >-
          בחרו קבוצה — שלושה או ארבעה. כל קבוצה מקבלת כרטיסייה אחרת, ובסוף כל קבוצה תאמר לנו משפט אחד: ׳אושר
          הוא…׳.
      - task:
          what: >-
            כל קבוצה עובדת לפי הכרטיסייה שלה — דף מידע, היגדים, ציור או ראיון — ומסכמת במשפט אחד: ׳אושר הוא…׳.
          time: 8 דקות
          group: שלישיות או רביעיות לפי בחירת התלמידים; כרטיסייה אחת לכל קבוצה
          rules: כל אחד אומר משהו לפני שמנסחים את המשפט; קבוצות הראיונות חוזרות לכיתה בסוף הזמן
          plenary: נציג מכל קבוצה אומר את המשפט ׳אושר הוא…׳ ומוסיף דוגמה אחת
          help: התחילו ממה שמשמח כל אחד מכם — מה משותף לכולכם?
          challenge: מה ההבדל בין אושר לבין שמחה של רגע? הכניסו את ההבדל למשפט שלכם.
      - handout:
          title: כרטיסיות עבודה
          copies: כרטיסייה אחת לכל קבוצה — גוזרים לחמש כרטיסיות
          lines: false
          items:
            - >-
              **כרטיסייה 1 — דף מידע.** קראו את דף המידע על האושר, וענו: א. מהו אושר? ב. מהם הסימנים הפנימיים
              והחיצוניים של אושר? ג. מה מגביר את תחושת האושר, לפי חוקרי הפסיכולוגיה החיובית? ד. איך אתם הייתם
              מגדירים אושר — ולמה?
            - >-
              **כרטיסייה 2 — היגדים.** קראו את ההיגדים על אושר. בחרו שניים או שלושה שהתחברתם אליהם מאוד, והסבירו
              דרכם מהו אושר.
            - >-
              **כרטיסייה 3 — ציור.** חשבו על המושג ׳אושר׳. ציירו על הדף הגדול תמונות שמייצגות בשבילכם את המושג,
              ובחרו לציור כותרת מתאימה.
            - >-
              **כרטיסייה 4 — ראיון תלמידים.** ראיינו שלושה־ארבעה תלמידים מכיתות אחרות: ׳מה גורם לכם אושר? מה עושה
              אתכם מאושרים?׳ כתבו את התשובות, מצאו מה דומה ביניהן, וחלקו אותן לפי מאפיינים שאתם מוצאים.
            - >-
              **כרטיסייה 5 — ראיון צוות.** ראיינו שניים־שלושה אנשי צוות: ׳מה גורם לכם אושר? מה עושה אתכם
              מאושרים?׳ כתבו את התשובות, מצאו מה דומה ביניהן, וחלקו אותן לפי מאפיינים שאתם מוצאים.
      - handout:
          title: דף מידע — לכרטיסייה 1
          copies: עותק לכל קבוצה שמקבלת את כרטיסייה 1
          verbatim: true
          lines: false
          items:
            - אושר הוא רגש חיובי, הקשור בשמחה, הנאה וסיפוק. רגש של שמחה ושביעות רצון, תחושת סיפוק ורוממות רוח.
            - >-
              מאפייני האושר — האושר מתאפיין בהרגשה חזקה של שמחת חיים. הסימנים הפנימיים שלו הם: תחושות של
              התלהבות, רוגע או תקווה. הסימנים החיצוניים שלו הם: חיוך או צחוק. אושר נקשר עם הרגשה כללית טובה,
              בריאות, ביטחון, תענוג, שביעות רצון, שלוות נפש ואהבה.
            - >-
              האושר ייחודי בכך שהוא נחשב כמטרה בפני עצמה. כשאדם מציב לעצמו מטרות בחייו, הוא רוצה שבאמצעות השגתן
              הוא יהיה מאושר. מטרות אלו יכולות להיות כסף, כוח, בריאות ויופי. למשל, כאשר אדם עובד למען שכר הוא
              אינו מסתפק בהשגת הכסף בלבד כמטרה סופית למאמציו. על פי רוב הוא משתמש בכסף כדי לממן מוצרים או
              שירותים אשר ישפרו את מצבו ויצרו בתוכו תחושה של אושר.
            - >-
              חוקרי הפסיכולוגיה החיובית מצאו מספר גורמים שמגבירים את תחושת האושר: התמקדות בחיובי של חיי היום יום
              (בריאות, משפחה, בית וכו'), פרשנות חיובית של אירועים שקורים, יחס חיובי לאנשים אחרים, פעולות ומעשים
              שיוצרים תחושה טובה, עזרה לזולת.
      - handout:
          title: היגדים — לכרטיסייה 2
          copies: עותק לכל קבוצה שמקבלת את כרטיסייה 2
          verbatim: true
          lines: false
          items:
            - ״האושר הוא משמעותם ומטרתם של החיים״ ~ אריסטו
            - ״אושר הוא לא דבר מוכן. הוא מגיע כתוצאה מהמעשים שלך״ ~ הדלאי למה
            - ״הסוד שבאושר לא טמון בעשיית מה שאנחנו אוהבים, אלא באהבה של מה שאנחנו עושים״ ~ ג'יימס ברי
            - >-
              ״כל אחד רוצה להגיע לפסגת ההר, אבל האושר האמיתי, תחושת הסיפוק והקידום מתרחשים בעיקר בזמן הטיפוס״
              ~ אנונימי
            - ״אושר אינו כאשר אנו מקבלים מה שאנחנו רוצים, אלא כשאנחנו מרוצים ממה שאנחנו מקבלים״ ~ רובין שארמה
            - ״העשב הוא תמיד ירוק יותר במקום שבו אתה משקה אותו״ ~ אנונימי
            - ״לא מה שיש לנו גורם לאושר, אלא הרמה שבה אנו נהנים ממנו״ ~ צ'ארלס ספורגאון

  # ------------------------------------------------------------------ 17′–23′
  - id: share
    title: אושר הוא…
    minutes: 7
    practices:
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
    summary: >-
      נציג מכל קבוצה אומר את ההגדרה שלה ודוגמה אחת; על הלוח — מה אושר, ומה מעורר אותו; ובסוף, הסיכום של
      המקור
    body:
      - slide:
          kicker: משתפים · נציג מכל קבוצה
          title: אושר הוא…
          sub: משפט אחד מכל קבוצה — ודוגמה אחת.
          echo: true
