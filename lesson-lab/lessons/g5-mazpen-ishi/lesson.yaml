slug: g5-mazpen-ishi
title: המצפן האישי
grade: 5
grades_served:
- 5
slide_kickers: false
month: פברואר
section: תהליכי למידה (פברואר)
unit: חוסן - ויסות דרך הקוגניציה
src_text: sources/text/5/Mazpen_Ishi.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/5Grade/Mamlachti/Mazpen_Ishi.pptx
sensitivity: low-med
sub: מזהים התנהגות שאנחנו מעריכים אצל אחרים ובונים מצפן אישי שמחבר ערך לצעד מעשי.
format: כתיבה, זוגות, קבוצות ומליאה
question: מה חשוב לי, ואיך זה מכוון את הפעולה שלי?
takeaways:
- נוכל להשתמש בכלי המצפן האישי בכל מצב מאתגר או מבלבל הדורש מאיתנו דרך פעולה. כך ניזכר במה שחשוב לנו באמת
  ונתנהג בהתאם.
- ערך מקבל משמעות כשמתרגמים אותו לפעולה קטנה.
prep:
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: star
    x: 180
    y: 120
    w: 250
  alt: כוכב
steps:
- id: part-1
  title: מישהו שאני מעריך
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: מישהו שאני מעריך — איזה מעשה של אדם אחר ראוי בעיניכם?
  body:
  - slide:
      title: איזה מעשה של אדם אחר ראוי בעיניכם?
      art:
      - use: star
        x: 180
        y: 120
        w: 250
      alt: כוכב
      echo: true
  - moves:
    - תני שלוש דקות לכתיבת מעשה של אדם מוכר או דמות מסיפור, בלי חובה לציין שם.
    - אספי שתי דוגמאות והבחיני בין תואר כללי כמו נחמד לבין פעולה שאפשר לראות.
  - ask: איזה מעשה של אדם אחר ראוי בעיניכם?
  - ladder:
      help: מי עודד מישהו, התמיד או עזר?
      challenge: איזו דרך התנהגות חשובה לכם בתוך המעשה?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: כף יד של דרכים
  minutes: 8
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: כף יד של דרכים — מה הייתי רוצה ללמוד מהמעשים האלה?
  body:
  - slide:
      title: מה הייתי רוצה ללמוד מהמעשים האלה?
      art:
      - use: hands-help
        x: 180
        y: 120
        w: 250
      alt: ידיים מושטות
      echo: true
      sub: ''
  - moves:
    - כל תלמיד משרטט כף יד.
    - בשלוש אצבעות כתבו דמות או תיאור, ובצדן פעולה מוערכת.
    - 'בזוגות בחרו מילה שמתארת דרך התנהגות: אומץ, סבלנות, אכפתיות או התמדה.'
    - שאלי כיצד אנשים לומדים לפעול כך.
  - ask: מה הייתי רוצה ללמוד מהמעשים האלה?
  - task:
      what: שרטטו כף יד. בשלוש אצבעות רשמו דמות ומעשה שאתם מעריכים, ובחרו דרך התנהגות שהייתם רוצים ללמוד.
      time: 5 דקות לעבודה ושאר הזמן לשיתוף
      group: יחידים ואחר כך זוגות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: במקום מצליח, כתבו מה הוא עושה כשהוא מתקשה.
      challenge: האם אפשר להעריך באדם מעשה מסוים בלי להסכים לכל מה שהוא עושה?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: אדם והבחירות לוועדת הספורט
  minutes: 9
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: אדם והבחירות לוועדת הספורט — איך מצפן יכול לעזור גם כשמפחדים?
  body:
  - slide:
      title: איך מצפן יכול לעזור גם כשמפחדים?
      art:
      - use: signpost
        x: 180
        y: 120
        w: 250
      alt: שלטי כיוון
      echo: true
      sub: ''
  - moves:
    - 'ספרי: אדם רוצה להתמודד לוועדת הספורט, אך נלחץ כשאיתמר מצטרף.'
    - הוא חושב על ההשקעה של אביו ועל אחיו שהגן על חבר.
    - כל רביעייה מציעה לאדם שני צעדים שמבטאים התמדה ואומץ, בלי להבטיח שייבחר.
    - השווי בין עצה כללית לצעד מעשי.
  - ask: איך מצפן יכול לעזור גם כשמפחדים?
  - task:
      what: הציעו לאדם שני צעדים לקראת הבחירות שמבטאים התמדה או אומץ. הסבירו מה יוכל לעשות גם בלי הבטחה
        שייבחר.
      time: 6 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה הוא יכול להכין או לומר לקראת הבחירות?
      challenge: איך יוכל להתמיד בדרך שלו גם אם לא ייבחר?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: המצפן שלי
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: המצפן שלי — איזו פעולה קטנה תתאים לכיוון שבחרתי?
  body:
  - slide:
      title: איזו פעולה קטנה תתאים לכיוון שבחרתי?
      art:
      - use: target
        x: 180
        y: 120
        w: 250
      alt: מטרה
      echo: true
      sub: ''
  - moves:
    - כל תלמיד בוחר אתגר יומיומי קטן.
    - במרכז דף כתבו את האתגר, מסביב שתי דרכי התנהגות ומהן פעולה אחת שאפשר לבצע.
    - אפשר לעבוד על דמות דמיונית.
    - בזוגות בדקו אם הפעולה באמת מבטאת את הערך.
  - ask: איזו פעולה קטנה תתאים לכיוון שבחרתי?
  - task:
      what: בחרו אתגר קטן, שתי דרכי התנהגות ופעולה אחת שתבטא אותן. בדקו בזוג אם הפעולה מכוונת ליעד.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: יחידים ואחר כך זוגות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: אם הכיוון הוא אכפתיות, מה בדיוק תעשו או תאמרו?
      challenge: איזה מכשול עלול להופיע, ואיך תשמרו על הכיוון למרותו?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - נוכל להשתמש בכלי המצפן האישי בכל מצב מאתגר או מבלבל הדורש מאיתנו דרך פעולה. כך ניזכר במה שחשוב
        לנו באמת ונתנהג בהתאם.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - בחרו ערך או דרך התנהגות שחשובים לכם.
      - כתבו פעולה קטנה שמבטאת אותם במצב מאתגר.
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
pdf_backup: false
