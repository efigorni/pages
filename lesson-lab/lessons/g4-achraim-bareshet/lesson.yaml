safe:
- head: תיאום עם היועצת
  text: תאמי מראש את השיעור ואת האפשרות לשיחה אישית אחריו; בדקי מי מהתלמידים עשוי להזדקק לליווי בנושא.
- head: מי עלול להיפגע
  text: מקרי חרם והסרה מקבוצה עשויים לשקף פגיעה פעילה. אל תציגי קבוצות אמיתיות ואל תבקשי לנקוב במנהלים או בנפגעים.
- head: לא לוחצים לשתף
  text: אפשר לכתוב על דמויות המקור, לצייר או לעבור. אין צורך להסביר לכיתה מדוע בוחרים לא לשתף.
- head: אם מישהו משתף פגיעה
  text: 'הקשיבי בלי לחקור מול הכיתה, הודִי על השיתוף ופני ליועצת לפי נוהלי בית הספר. אל תבטיחי לשמור בסוד. לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; מוקד 105 — המטה הלאומי להגנה על ילדים ונוער ברשת, 24/7'
