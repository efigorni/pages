src_fixes:
  - from: בחטיבת הביינים
    to: בחטיבת הביניים

sub: >-
  כיתה ט׳ מסתיימת, והשנים בחטיבה הן אוסף של רגעים — כל רגע כמו תמונה. בשיעור הזה בוחרים תמונה אחת
  מהחטיבה, מתבוננים במה שמגאה אותנו ובמה שהיינו עושים אחרת, וכותבים גלויה לעצמנו לקראת התיכון.
format: כתיבה אישית, קבוצות, זוגות ומליאה
question: מה ניקח איתנו מהשנים בחטיבה — מהרגעים הטובים וגם מהמורכבים?
takeaways:
  - כל רגש שהמעבר לתיכון מעורר הוא לגיטימי — וכדאי לעצור ולתת לו מקום.
  - אפשר ללמוד גם מהחוויות הטובות וגם מהפחות נעימות, ולבחור במה נתמקד בהמשך.
  - כדאי לשתף מישהו שנוח לנו איתו במה שאנחנו מרגישים לקראת המעבר.
prep:
  - חלוקה מראש לקבוצות של ארבעה לפי השולחנות
  - שלוש השאלות לשיתוף בקבוצות (״גלריית התמונות שלנו מהחטיבה״) — כתובות על הלוח לפני השיעור
  - פתקיות דביקות ונייר דבק לקיר — להרחבה ״גלריה על הקיר״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פרידה מהחטיבה דרך ״תמונות״ זיכרון שהתלמידים בוחרים, גם לא נעימות. שאלי
      מי בכיתה עבר בחטיבה תקופה קשה (חרם, פגיעה, אובדן, משבר בבית), מי הצטרף לכיתה רק לאחרונה, ומי לא ממשיך
      לתיכון עם רוב הכיתה. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהחטיבה הייתה בשבילו תקופה קשה, ומי שעוד אין לו הרבה זיכרונות ממנה. אמרי מראש שתמונה יכולה להיות
      נעימה או לא, ושמותר לבחור גם רגע קטן או מקום. מי שהצטרף מאוחר בוחר תמונה מהזמן שהוא כאן. ב״מה הייתי
      עושה אחרת״ מדברים על מה שאני עשיתי, לא על מה שאחרים עשו לי.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בקבוצה כל אחד משתף בתמונה אחת, ורק במה
      שהוא בוחר לספר; במליאה — רק מתנדבים. מותר לוותר, ולא קוראים בשם למי שלא הצביע. הגלויה לעצמי לא נאספת
      ולא מוקראת.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל זיכרון של חרם, השפלה או פגיעה מתלמיד או ממבוגר — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״גלריה על הקיר״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - gallery
      - proud
    text: >-
      בגלריה משתפים רק בקבוצות, בלי מליאה; ו״על מה אני גאה?״ נגמר בשיחה בזוגות, בלי מליאה — ההקראה מהמקור
      נשארת

brain_break:
  signs: ראשים על השולחן, פיהוקים, שקט כבד אחרי השיתוף.
  ideas:
    - name: מתיחה בשלוש
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ובספירה עד שלוש מתיישבים.
    - name: מחיאות בקצב
      text: מחאי קצב קצר, והכיתה חוזרת אחרייך. כל סבב — קצב קצת יותר מסובך.
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
  from: share

cover:
  alt: דלת פתוחה, ולידה על הקיר מסגרת תמונה ובה בית הספר
  art: {file: art/cover.svg}

steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: frame
    title: כל רגע — תמונה
    minutes: 4
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: מסגרת ריקה על המסך — מה הקשר שלה לסוף כיתה ט׳? אחר כך ״למסגר את הרגע״, והנחיות השיח
    body:
      - slide:
          kicker: מה הקשר?
          title: מסגרת ריקה — מה הקשר לסוף כיתה ט׳?
          sub: חשבו לבד, ואז לחשו לשכן.
          echo: true
          alt: מסגרת תמונה ריקה, תלויה על מסמר
          art: {file: art/empty-frame.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי, וחכי עשר שניות של שקט.
          - חצי דקה של לחישה עם השכן, ואז שמעי שלוש־ארבע השערות — בלי לאשר ובלי לפסול.
          - הקריאי את ״למסגר את הרגע״, והציגי את הנחיות השיח לפני שמתחילים לכתוב.
      - ask: מה הקשר בין מסגרת ריקה לבין הסוף של כיתה ט׳?
      - slide:
          kicker: למסגר את הרגע
          title: כל רגע כזה הוא כמו תמונה
          sub: לכל תמונה סיפור משלה.
          verbatim: true
          cue: אחרי ההשערות —
          alt: אותה מסגרת, ועכשיו יש בה שלושה חברים יחד
          art: {file: art/frame-moment.svg}
      - quote:
          title: ״למסגר את הרגע״ — להקריא
          text: >-
            אתם עומדים לקראת סיום של תקופת הלימודים בחטיבת הביניים. תקופה זו מורכבת מאוסף של רגעים שחוויתם
            ביחד ולחוד. כל רגע כזה הוא כמו תמונה - לכל תמונה סיפור משלה.
      - slide:
          kicker: לפני שמשתפים
          title: הנחיות לשיח מיטבי
          sub: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          cue: אחרי ההקראה —
          alt: ארבעה סביב שולחן, ובועת דיבור ובה לב
          art:
            - {use: circle4, x: 40, y: 214, w: 300}
            - {use: speech-l, x: 336, y: 36, w: 250}
            - {use: heart, x: 411, y: 68, w: 100}
      - say: >-
          היום נמלא את המסגרת. כל אחד יבחר תמונה אחת מהשנים בחטיבה — ויספר עליה רק את מה שהוא רוצה.

  # ------------------------------------------------------------------ 4′–14′
  - id: gallery
    title: גלריית התמונות שלנו מהחטיבה
    minutes: 10
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      כל אחד בוחר תמונה אחת מהחטיבה ומתאר אותה במסגרת שלה בדף; בקבוצות של ארבעה משתפים לפי שלוש שאלות, ובמליאה
      — מתנדבים
    body:
      - slide:
          kicker: גלריית התמונות · לבד, בכתב
          title: תמונה אחת מהחטיבה
          sub: מקום, מורה או מקצוע, חוויה, חברים — בחרו אחת, ותארו אותה במסגרת שלה.
          timer: 180
          echo: true
          alt: ארבע מסגרות — בית ספר, ספר פתוח, כוכב ושתי דמויות יד ביד
          art: {file: art/gallery.svg}
      - moves:
          - חלקי את הדף, והקריאי את ההנחיה שעל השקף.
          - שלוש דקות של כתיבה בשקט. אמרי בקול שהתמונה יכולה להיות זיכרון נעים, וגם זיכרון פחות נעים.
          - הסתובבי בין השולחנות. מי שנתקע — הציעי לו להתחיל במקום אחד בבית הספר.
          - >-
            עוברים לקבוצות לפי השולחנות. הפעילי את הטיימר, ודקה לפני הסוף — הודיעי, כדי שגם האחרון בקבוצה
            יקבל תור.
          - במליאה — שניים־שלושה מתנדבים מספרים על התמונה שלהם. הדהדי, בלי לפרש ובלי להעריך.
      - say: >-
          חשבו על השנים בחטיבה, ובחרו תמונה אחת שעולה לכם בזיכרון — נעימה, או פחות. תארו אותה במסגרת שמתאימה לה:
          מה רואים בה, ומי.
      - handout:
          title: גלריית התמונות שלנו מהחטיבה
          copies: עותק לכל תלמיד — ארבע מסגרות על דף אחד
          verbatim: true
          items:
            - מקום בבית הספר
            - מורה/ מקצוע
            - חוויה
            - חברים/ות
      - ladder:
          help: התחילו ממקום אחד בבית הספר — מה קרה שם, ומי היה איתכם?
          challenge: תארו את התמונה כך שגם מי שלא היה שם יראה אותה — צבעים, קולות, מי עמד איפה.
      - slide:
          kicker: בקבוצות · 4 דקות
          title: ספרו על התמונה שבחרתם
          sub: כל אחד בתורו, לפי השאלות שעל הלוח.
          timer: 240
          echo: true
          cue: אחרי הכתיבה —
          alt: ארבעה סביב שולחן, ומצלמה לידם
          art:
            - {use: circle4, x: 60, y: 210, w: 300}
            - {use: camera, x: 380, y: 60, w: 210}
      - board:
          - שתפו בתמונה שבחרתם להתמקד בה — מה או מי מצולם בתמונה?
          - איזה זיכרון התמונה מייצגת עבורכם?
          - מה הייתם לוקחים איתכם מזיכרון זה?
      - task:
          what: >-
            כל אחד בתורו משתף בתמונה שבחר, לפי שלוש השאלות שעל הלוח; השאר מקשיבים. בסוף כל שיתוף — מישהו
            מהקבוצה אומר משפט אחד על מה ששמע.
          time: 4 דקות — בערך דקה לכל אחד
          group: ארבעה לפי השולחנות
          rules: תמונה אחת לכל אחד; מספרים רק את מה שבוחרים; מקשיבים בלי לשפוט, ומה שנאמר בקבוצה נשאר בה
          plenary: שניים־שלושה מתנדבים מספרים על התמונה שלהם
          help: התחילו ב״בתמונה שלי רואים…״ — ומשם ספרו מי היה שם.
          challenge: מה הייתם לוקחים מהזיכרון הזה לתיכון — ולמה דווקא את זה?
      - ask: מי רוצה לספר לכולנו על התמונה שבחר — מה רואים בה, ומה הוא לוקח ממנה הלאה?

  # ------------------------------------------------------------------ 14′–20′
  - id: proud
    title: על מה אני גאה? מה הייתי עושה אחרת?
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: >-
      שני עיגולים במחברת — משהו שאני גאה בו ורוצה לקחת הלאה, ומשהו שהייתי עושה אחרת; לבד, בזוגות ובמליאה, ואז
      ההקראה של המקור
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: על מה אני גאה? מה הייתי עושה אחרת?
          sub: שני עיגולים במחברת — בימני מה שמגאה אתכם, בשמאלי מה שהייתם משנים.
          points:
            - לבד, בכתב — 2 דקות
            - בזוגות — 2 דקות
            - במליאה
          timer: 120
          echo: true
          alt: שני עיגולים — בימני כוכב, בשמאלי גבעול שמתפצל לשלושה חיצים
          art: {file: art/two-circles.svg}
      - moves:
          - הציגי את השקף, ובקשי לשרטט שני עיגולים בעמוד חדש במחברת.
          - שתי דקות של כתיבה בשקט, ואז שתי דקות בזוגות — כל אחד מספר על שני העיגולים שלו.
          - במליאה — שמעי שניים־שלושה ״גאה״, ושאלי מי מוכן לספר גם על ״אחרת״. הדהדי, בלי לשפוט.
          - הקריאי את הקטע מהמקור, ועברי לגלויה.
      - say: >-
          חשבו על משהו אחד בחוויית הלמידה שלכם בחטיבה שאתם גאים בו ורוצים לקחת הלאה — וכתבו אותו בעיגול הימני.
          בשמאלי — משהו שבמבט לאחור הייתם עושים אחרת.
      - ladder:
          help: השלימו — ״אני גאה בעצמי על ש…״. גם משהו קטן נחשב.
          challenge: מה ממה שאתם גאים בו תרצו לקחת לתיכון — ואיך תשמרו עליו שם?
      - ask: מי רוצה לספר על משהו שהוא גאה בו? ומי מוכן לספר גם על משהו שהיה עושה אחרת?
      - quote:
          title: מהמקור — להקריא אחרי המליאה
          text: >-
            לכל אחד ואחת מאיתנו שזורים זיכרונות נעימים ושמחים וזיכרונות פחות נעימים-כואבים, דברים שאנחנו מתגאים
            בהם, ודברים שאולי היינו עושים אחרת. בבואנו להיפרד ולסיים פרק זמן כל כך משמעותי, חשוב לזכור שיש מקום
            לכל טווח וסוגי הזיכרונות והרגשות – הטובים, הנעימים והפחות נעימים. יש לזכור את מגוון החוויות ולאפשר
            לנו להיפרד באופן מלא ומיטבי יותר, גם מהטוב וגם מהמורכב, ולבחור מתוכם במה נרצה להתמקד בהמשך.
      - say: ועכשיו — נכתוב לעצמנו, רגע לפני התיכון.

  # ------------------------------------------------------------------ 20′–27′
  - id: letter
    title: רגע לפני שמסיימים — גלויה לעצמי
    minutes: 7
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: כל אחד כותב גלויה לעצמו — מה היה אומר לעצמו יום לפני התיכון; הגלויה נשארת אצלו
    body:
      - slide:
          kicker: רגע לפני שמסיימים · לבד, בכתב
          title: יום לפני התיכון — מה תגידו לעצמכם?
          sub: >-
            גלויה ״אל: אני, מאת: אני״ — עם מסר שמחזק.
          timer: 300
          echo: true
          alt: דמות כותבת ליד שולחן, ולידה מעטפה ולב מעליה
          art:
            - {use: kid-desk, x: 320, y: 160, w: 270, color: teal}
            - {use: envelope, x: 40, y: 262, w: 250}
            - {use: heart, x: 103, y: 112, w: 124}
      - moves:
          - חלקי גלויה לכל אחד, והקריאי את השאלה מהמקור.
          - חמש דקות של כתיבה בשקט. מי שרוצה — מצייר בפינה, כמו בגלויה של המקור.
          - בסוף אמרי שהגלויה נשארת אצל הכותב — לא אוספים ולא מקריאים.
      - quote:
          title: השאלה מהמקור — להקריא לפני הכתיבה
          text: >-
            אם הייתה לכם ההזדמנות לפגוש את עצמכם יום לפני היום הראשון שלכם בחטיבה העליונה... מה הייתם
            אומרים/ות לנער הזה? לנערה הזו? איזה מסר הייתם/ן רוצים/ות להעביר לו/לה?
      - say: >-
