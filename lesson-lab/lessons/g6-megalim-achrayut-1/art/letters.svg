    <text x="356" y="193" font-size="54">ר</text>
    <text x="264" y="193" font-size="54">י</text>
    <text x="172" y="193" font-size="54">ו</text>
    <text x="80" y="193" font-size="54">ת</text>
  </g>
</svg>
