              moment: >-
                השיחה שבה אחד הבנים שואל את חברו ״אם אני אומר לך על בת שהיא אוהבת אותך, אתה מעז לנשק אותה?״ — עצרי
                מיד אחרי השאלה, לפני שהחבר עונה. צפי בקטע לפני השיעור, ורשמי כאן את הזמן.
              ask: מה יקרה עכשיו, לדעתכם? לחשו לשכן במשפט אחד.
          alt: בית ספר, ושלושה חברים בחצר
          art:
