sub: >-
  חברים יכולים לעצור פגיעה. בשיעור הזה צופים בקטע מ״ההפסקה הגדולה״, עוצרים את הזמן בעזרת ״השלט המשוכלל״,
  ומכירים את חמש המ״מים — חמש דרכים לפעול כשמישהו עלול להיפגע.
format: צפייה, מליאה וזוגות
question: איך חברים יכולים לעצור פגיעה — רגע לפני, תוך כדי ואחרי?
takeaways:
  - לחברים יש כוח לעצור פגיעה — רגע לפני, תוך כדי ואחרי.
  - כשמשהו מתחיל להסתבך, עוצרים וחושבים — האם זה בסדר? מה עלול לקרות בהמשך?
  - יש חמש דרכים לפעול, ותמיד אפשר לפנות למבוגר שסומכים עליו.
prep:
  - >-
    הסרטון נמצא בתוך המצגת המקורית, בשקף ״צפייה בסרטון מתוך ההפסקה הגדולה״ (הקישור ״המצגת המקורית״ בתחתית
    המערך) — זה פרק שלם, והשיעור משתמש רק בתחילתו. הורידי את המצגת מראש (קובץ כבד, כ־121 מגה־בייט), צפי בקטע לפני השיעור, ובדקי
    שהקול עובד במחשב הכיתה.

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה: קטע מ״ההפסקה הגדולה״ שבו לחץ של חבורה מוביל לפגיעה מסוג הטרדה מינית — נשיקה
      ש״מעזים״ לתת, בזמן שהחבורה קוראת ״נשיקה! נשיקה!״ — ובסוף הקטע תגרה בין שני בנים. שאלי אם יש בכיתה מי
      שנפגע או מי שפגע, ואם היה לאחרונה בשכבה אירוע דומה; אם כן, החליטו יחד אם ללמד עכשיו. בקשי שתהיה זמינה
      אחרי השיעור, וסכמי איתה מה עושים עם פתק שמבקש שיחה.
  - head: מי עלול להיפגע
    text: >-
      מי שנפגע — גם מנשיקה או מנגיעה ״בצחוק״ — עלול לזהות את עצמו בסרטון; מי שעמד פעם מהצד ושתק עלול להרגיש
      אשם — אמרי שאף פעם לא מאוחר לעזור. בסרטון הפוגע בן והנפגעת בת: מדברים על מה שנעשה, לא על ״בנים״ ו״בנות״,
      ואף פעם לא מאשימים את מי שנפגע.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מדברים על הדמויות בסרטון — בלי שמות, ובלי אירועים אמיתיים מבית הספר״. הכתיבה אחרי
      הסרטון נשארת במחברת. מחשבות של דמויות מציגים רק מתנדבים, וכל אחד מציג דמות — לא את עצמו. מותר לוותר, ולא
      קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור
      בסוד — אומרים שזה כדי שאפשר יהיה לעזור. רמז לאירוע שקורה עכשיו — מטפלים בו עוד היום. לצד היועצת: 1202 (עונות
      נשים) או 1203 (עונים גברים) — מרכזי הסיוע לנפגעות ולנפגעי תקיפה מינית, 24/7 (מתחת לגיל 14 — סיוע ראשוני
      והפניה); ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם. ספרי עליהם לתלמיד שצריך לדבר גם אחרי שעות בית
      הספר.

