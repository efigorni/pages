            - {use: group3, x: 40, y: 290, w: 290}
      - slide:
          kicker: בואו נדבר על זה · כולם כותבים
          title: אילו רגשות, שאלות ומחשבות עלו בכם במהלך הצפייה בסרטון?
          sub: בחרו אחד — מחשבה, רגש או שאלה — וכתבו לעצמכם.
          verbatim:
            - title
          timer: 60
          echo: true
          cue: אחרי הצפייה —
          alt: ענן מחשבה, לב, ובועת דיבור עם סימן שאלה
