steps:
  # ------------------------------------------------------------------ 0′–3′
  - id: open
    title: אחריות — מאל״ף עד תי״ו
    minutes: 3
    practices:
      - מה הקשר?
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: משחק מילים — אילו מילים מסתתרות במילה ״אחריות״? — והשרשרת שבתוכה, מ״אני״ ועד ״האחרים״
    body:
      - slide:
          kicker: מה הקשר? · לבד, בכתב
          title: אילו מילים תוכלו להרכיב מהמילה אחריות?
          sub: כתבו כמה שיותר — דקה אחת.
          verbatim:
            - title
          timer: 60
          echo: true
          alt: שש אותיות על אריחים — א, ח, ר, י, ו, ת — ועיפרון
          art: {file: art/letters.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. כותבים במחברת, בלי הסבר נוסף.
          - אחרי דקה — שמעי שלוש־ארבע מילים, ורשמי אותן על הלוח.
          - הציגי את השרשרת שבמילה, והקריאי אותה שורה אחר שורה.
      - ladder:
          help: התחילו בשתי האותיות הראשונות — ומה יוצא כשמוסיפים עוד אות?
          challenge: איזו מהמילים שמצאתם קשורה לחברות — ולמה?
      - slide:
          kicker: אחריות · מאל״ף עד תי״ו
          title: אחריות — מאל״ף עד תי״ו
          sub: אני · אחי · האדם האחר · להוביל · לסמוך גם על האחרים
          echo: true
          cue: אחרי שנשמעו מילים מהכיתה —
          alt: השרשרת שבמילה אחריות — א, אח, אחר, אחרי, אחריו, אחריות
          art: {file: art/word-chain.svg}
      - quote:
          title: השרשרת מהמקור — להקריא
          text: |-
            א– אני
            אח – אחי
            אחר – האדם האחר
            אחרי – להוביל אחרי
            אחריו – לסמוך גם על האחרים
            אחריות – מאל"ף עד תי"ו
      - ask: מה המילים האלה מספרות לנו על אחריות — כלפי עצמנו וכלפי אחרים?
      - say: >-
          ״להיות אדם פירושו לקבל אחריות״ — כך כתוב ב״הנסיך הקטן״. היום נראה רגע שבו חברים יכלו לקחת אחריות.

  # ------------------------------------------------------------------ 3′–15′
  - id: video
    title: ההפסקה הגדולה
    minutes: 12
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      צופים בקטע עד 8:08, עם עצירה אחת לחיזוי; אחר כך כל אחד כותב לעצמו מחשבה, רגש או שאלה, ומתנדבים משתפים
    body:
      - moves:
          - לפני הצפייה — הקריאי את ההקדמה, כדי שאף אחד לא יופתע ממה שיראה.
          - הציגי את השאלה שלפני הצפייה, והפעילי את הסרטון. בנקודת העצירה — עצרי לחיזוי, ואז המשיכי.
          - אחרי הצפייה — דקה של כתיבה בשקט. הכתיבה נשארת במחברת.
          - שמעי שניים־שלושה מתנדבים. על כל אחד — הדהדי במשפט, בלי לשפוט.
      - say: >-
          אתם עומדים לראות עכשיו סרטון מתוך התוכנית ״ההפסקה הגדולה״. הסרטון עוסק באירוע שקרה בין חברים בבית ספר
          במהלך ההפסקה. האירוע התפתח למצב של לחץ חברתי שהוביל לפגיעה מסוג הטרדה מינית.
      - video:
          title: ההפסקה הגדולה — מתוך המצגת המקורית
          url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/6Grade/Mamlachti/Megalim_Achrayut_1.pptx
          length: "26:32"
          clip:
