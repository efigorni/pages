  # ------------------------------------------------------------------ +5′
  - id: choose
    title: שלוש נקודות זמן, חמש דרכים
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: בזוגות — לנקודת זמן אחת מהסרטון בוחרים מ״ם, וכותבים מה אומרים או עושים
    body:
      - slide:
          kicker: אם נשאר זמן · בזוגות
          title: איזה מ״ם הייתם בוחרים?
          sub: רגע לפני, תוך כדי או אחרי — מ״ם אחד ומשפט אחד.
          timer: 180
          echo: true
          alt: זוג, ודף לידו
          art:
            - {use: pair, x: 320, y: 220, w: 250}
            - {use: note, x: 90, y: 110, w: 180}
      - moves:
          - חלקי את שלוש נקודות הזמן בין השולחנות, כך שכל נקודה תקבל כמה זוגות.
          - הסתובבי בין הזוגות. דקה לפני הסוף — הזכירי לכתוב את המשפט.
          - במליאה — זוג אחד לכל נקודת זמן אומר את המ״ם ואת המשפט.
      - say: גם תוך כדי ואחרי — עדיין אפשר לעזור. כתבו משפט שבאמת הייתם יכולים להגיד.
      - task:
          what: >-
            כל זוג מקבל נקודת זמן אחת מהסרטון — רגע לפני, תוך כדי או אחרי — בוחר מ״ם שמתאים לה, וכותב משפט אחד: מה
            אומרים או עושים.
          time: 3 דקות
          group: זוגות לפי השולחנות
          rules: מדברים על הדמויות בסרטון, בלי שמות של אנשים אמיתיים; זוג שמסיים — בוחר נקודת זמן נוספת
          plenary: זוג אחד לכל נקודת זמן אומר את המ״ם שבחר ואת המשפט
          help: התחילו מ״אחרי״ — מה אפשר להגיד למי שנפגע, או למבוגר?
          challenge: בחרו שני מ״מים שונים לאותו רגע — מה היתרון ומה המחיר של כל אחד?
      - ask: איזה משפט הכי שכנע אתכם — ולמה?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ששת משפטי הסיכום של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - לחברים יש יכולת השפעה וכוח לעצור פגיעה באחר.
            - יש לכם כוח להשפיע בשלוש נקודות זמן – רגע לפני האירוע, תוך כדי האירוע ואחריו.
            - >-
              לפני האירוע – עוצרים, מקשיבים פנימה, מריצים קדימה במחשבה ומבינים מה עלול לקרות בהמשך. כבר בהתחלה אפשר
              לזהות מצבי סיכון ולעצור אותם.
            - תוך כדי האירוע ולאחריו – אם יש פגיעה חשוב להתערב. יש לכם יכולת להשפיע.
            - יש דרכים לפעול – הכרנו את חמש המ״מים – חמש דרכים לפעולה.
            - יש לכם יכולת להשפיע על המצב ולבחור באחריות.
          ask: >-
            איזה משפט הייתם רוצים לזכור כשתראו שמישהו עלול להיפגע? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהכוח של חברים (1–2), דרך השלט — לפני (3), תוך כדי ואחרי (4) — אל חמש המ״מים והבחירה
            באחריות (5–6).
          alt: שני חברים יד ביד, ומגן לידם
          art:
            - {use: pair, x: 270, y: 180, w: 290}
            - {use: shield, x: 60, y: 60, w: 170, color: teal}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — מה אקח איתי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
    summary: מ״ם אחד ורגע שבו אשתמש בו, משהו שלמדתי על עצמי, ושורת רשות לשיחה בפרטיות; פתקים נאספים בדלת
    body:
      - moves:
          - הציגי את השאלות, והפעילי את הטיימר.
          - עמדי בדלת ואספי את הפתקים אחד־אחד.
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. מי שרוצה לדבר איתי בפרטיות, כותב את שמו בשורה
          האחרונה. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: מתוך מה שלמדתי — מה אקח איתי הלאה?
          prompts:
            - איזה מ״ם הכי מתאים לי — ובאיזה רגע אשתמש בו?
            - משהו שלמדתי על עצמי היום.
            - רשות — רוצים לדבר איתי בפרטיות? כתבו את השם שלכם.
          look_for: >-
            חפשי פתקים עם שם בשורת הרשות — עם אלה מדברים בפרטיות עוד השבוע, ומה שנוגע בפגיעה עובר ליועצת עוד היום.
            חפשי גם מ״ם בלי רגע ברור, ומי שכתב שלא היה עושה כלום.
          timer: 180
          alt: דף ועיפרון
          art:
            - {use: note, x: 300, y: 90, w: 250}
            - {use: pencil, x: 70, y: 270, w: 190}
