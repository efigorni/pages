              x: 310
              y: 360
              size: 84
      - ladder:
          help: השלימו — ״כשראיתי את ___, הרגשתי ___״.
          challenge: מה הייתם שואלים את אחת הדמויות, אילו יכולתם?
      - say: בסרטון היו כמה רגעים שבהם החברים יכלו לעצור את מה שקרה. בואו נחזור אליהם — אחד־אחד.

  # ------------------------------------------------------------------ 15′–22′
  - id: remote
    title: השלט המשוכלל
    minutes: 7
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      חוזרים לאירוע עם שלט דמיוני — עוצרים רגע לפני, נכנסים למחשבות, מריצים קדימה ומרחפים מעל — ומגלים שבכל שלב
      אפשר להשפיע
    body:
      - slide:
          kicker: אחרי הצפייה · ציר הזמן
          title: בכל שלב אתם יכולים לגלות אחריות ולהשפיע על המצב
          points:
            - לפני — ״אתה מעז לנשק אותה?״
            - תוך כדי — ״נשיקה! נשיקה!״
            - אחרי — ״לא נראה לכם שקצת הגזמתם?״
          verbatim:
            - title
          echo: true
          alt: ציר זמן עם שלוש נקודות — לפני, תוך כדי ואחרי
          art: {file: art/timeline.svg}
      - moves:
          - >-
            הציגי את שלוש נקודות הזמן על הציר — עוד בלי להיכנס לאף אחת מהן. ״לפני״ הוא הרגע שבו שואלים ״אם אני אומר
            לך על בת שהיא אוהבת אותך, אתה מעז לנשק אותה?״
          - הכירי את השלט, והקריאי את שמות הכפתורים. היום משתמשים בארבעה מהם.
          - >-
            **לעצור** (רגע לפני): שאלי, וחכי חמש שניות לפני שאת מזמינה תשובות. תני מקום לכל רגש שעולה.
          - >-
            **להיכנס פנימה**: שלושה מתנדבים, כל אחד בתפקיד דמות אחרת שנמצאת שם, אומרים בקול מה היא חושבת ברגע
            הזה. שאלי את הכיתה מי מסכים — ולמה.
          - >-
            **להריץ קדימה**: מה יקרה בהמשך? אחר כך הצבעה — מי שחושב שכבר כאן אפשר היה להבין שתהיה פגיעה, מרים יד
            בסימן ׳עצור׳. מתנדב אחד מסביר.
          - >-
            **לרחף למעלה** (תוך כדי): מה רואים מלמעלה? הכוונה — החבורה, ההמון, הלחץ של הקבוצה. סכמי בשקף ״השלט
            השולט״.
      - slide:
          kicker: השלט המשוכלל
          title: הכירו את השלט המשוכלל שלנו
          sub: לעצור · להיכנס פנימה · להריץ קדימה · לרחף למעלה · למחוק · להריץ אחורה
          verbatim: true
          echo: true
          cue: אחרי ציר הזמן —
