# לוקחים אחריות – עומדים לצד ולא מהצד — כיתה ו׳, מגלים אחריות, שיעור 1 (מקור: sources/text/6/Megalim_Achrayut_1.md)
# הסרטון מוטמע במצגת המקורית (שקף 11 שם) — אין לו קישור משלו. שמות חמשת המ"מים מופיעים במקור רק בתרשים
# שבתמונה (שקפים 22–27); התיאורים והדוגמאות — בטקסט. ראו יומן החבילה (pkg-g6-04).
