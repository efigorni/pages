          art: {file: art/remote.svg}
      - say: >-
          נדמיין שיש לנו שלט, ויש בו את כל הפעולות. הוא יכול לעצור את הזמן, להריץ אותו קדימה או אחורה, לקרוא מחשבות
          של ילדים — ואפילו לרחף כמו רחפן. נלחץ על ׳עצור׳.
      - slide:
          kicker: השלט · לעצור · רגע לפני
          title: עוצרים רגע!
          sub: למה כדאי לפעמים לעצור לרגע ולחשוב?
          verbatim: true
          echo: true
          cue: הכפתור הראשון —
          alt: רמזור, ודמות עומדת לידו
          art:
            - {use: traffic-light, x: 340, y: 130, w: 150}
            - {use: kid-stand, x: 130, y: 170, w: 130, color: teal}
      - ask: מה אתם מרגישים כאן? ולמה כדאי לפעמים לעצור לרגע ולחשוב?
      - tip: >-
          עצירה מאפשרת לחשוב ולפעול בשיקול דעת — ״סוף מעשה במחשבה תחילה״.
      - whisper: >-
          עוד שאלות של המקור לכפתור הזה, אם יש זמן: ״למה בקבוצה פועלים לפעמים בלי לעצור?״ ״על מה ועל מי כדאי לחשוב
          כבר בשלב הזה?״ ״מה הייתם עושים?״
      - slide:
          kicker: השלט · להיכנס פנימה
          title: נכנסים לתוך המחשבות
          sub: האם יש כאן בעיה? מה הבעיה?
          verbatim: true
