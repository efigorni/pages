sub: >-
  בהודעה לא רואים פנים ולא שומעים טון. בשיעור הזה מזהים רגשות בתמונות, לומדים מהי אמפתיה, ובודקים
  בשלישיות איך מגיבים באמפתיה — בהודעה, ופנים אל פנים.
format: לבד, זוגות, שלישיות ומליאה
question: מה הולך לאיבוד כשמגיבים באמפתיה דרך מסך — ואיך מראים אמפתיה בכל זאת?
takeaways:
  - אנשים שונים מרגישים רגשות שונים, ובעוצמות שונות, באותו מצב — ואפשר להרגיש כמה רגשות בבת אחת.
  - אמפתיה היא לנסות לחוש את מה שהאחר חש, ולהגיב אליו ברגישות — כך הוא מרגיש מובן ולא לבד.
  - פנים אל פנים רואים ושומעים הרבה יותר; בהודעה צריך להתאמץ יותר — ולפעמים עדיף להיפגש.
prep:
  - חלוקה מראש לשלישיות לפי השולחנות, ופתקים לסבב ״בהודעה״ — פתק אחד לכל שלישייה

