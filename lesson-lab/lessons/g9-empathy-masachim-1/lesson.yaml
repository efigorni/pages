          פנים.
      - task:
          what: >-
            כל שלישייה קוראת אירוע אחד. בסבב הראשון מי שמספר כותב הודעה, ומי שמגיב עונה לו באמפתיה בכתב. בסבב
            השני — אותו אירוע בשיחה, ומי שצופה שם לב לשפת הגוף. בסוף שואלים את מי שסיפר: הרגשת שהבינו אותך?
          time: שתי דקות לכל סבב, ודקה לשיחה בשלישייה
          group: שלישיות לפי השולחנות; אירוע אחד לכל שלישייה
