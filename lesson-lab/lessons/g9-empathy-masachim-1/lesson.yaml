          plenary: מי שצפו מספרים מה ראו בשפת הגוף, ומי שסיפרו — מה היה שונה בין הסבבים
          help: התחילו ממה שהדמות מרגישה — ״נשמע ש…״
          challenge: >-
            הגיבו בלי לתת עצה — רק הראו שהבנתם. ואחר כך: מה היה קשה יותר להראות, בכתב או פנים אל פנים?
      - handout:
          title: כרטיסי אירוע
          copies: שלושה עותקים, גזורים לארבעה כרטיסים — כרטיס אחד לכל שלישייה
          verbatim: true
          lines: false
          items:
            - |-
              **יוני ורועי**
              יוני ורועי חברים טובים מכתה א׳. שניהם תלמידים טובים, הם סומכים אחד על השני, עוזרים אחד לשני, מרגישים מאוד קרובים ונוח להם לשתף זה את זה גם ברגשות ובחוויות לא טובות שלהם.
              מאז שהם בחטיבת הביניים יש אצלם ירידה קלה בציונים. היום יוני קיבל נכשל במבחן בפעם הראשונה. הראשון שהוא חשב לשתף בזה הוא רועי....
              יוני כתב לך.. איך רועי יגיב באמפתיה?
              יוני ורועי נפגשים בערב. יוני מספר לרועי — איך רועי יגיב באמפתיה?
            - |-
              **ריבי ואחותה**
              ריבי תמיד משתפת את אחותה הגדולה בכל מה שעובר עליה. אחותה תמיד מפנה לה את הזמן, מתעניינת באמת במה קרה לה, באיך היא הרגישה ומצליחה להרגיע אותה ולתת לה עצות טובות.
              ריבי מספרת לאחותה שאתמול היא רבה עם נועה, החברה הטובה שלה והיום בבוקר כשבאה לדבר איתה נועה הפנתה לה את הגב..
              האחות של ריבי קוראת את ההודעה מריבי — איך האחות תגיב באמפתיה?
              ריבי משתפת את אחותה.. — איך האחות תגיב באמפתיה?
            - |-
              **את ונועה**
              נועה חברה שלך, מאוהבת בירין כבר חצי שנה כמעט. את באמצע הלמידה למבחן שיש לך מחר, והיא מספרת לך בהתרגשות שירין הזמין אותה למסיבה.
              את לא כל כך מחבבת את ירין.
              ראית את ההודעה כשאת באמצע הלמידה. איך תגיבי באמפתיה?
              נועה באה אלייך הביתה לספר לך... איך תגיבי באמפתיה?
            - |-
              **החלום שלי...**
              מאז כתה ד׳ אני חולמת להיות מדריכה. עכשיו, בסוף כתה ט׳ הודיעו לי ששובצתי להדרכה בשנה הבאה.
              נעמה חברה טובה שלי לא בצופים.
              אני מקווה שהיא תצליח להבין את הרגשות והמחשבות שמתרוצצות אצלי...
              כתבתי לנעמה — איך נעמה תגיב באמפתיה?
              אני פוגשת עוד כמה דקות את נעמה — איך נעמה תגיב באמפתיה?
      - ask: היו הבדלים ביכולת להביע אמפתיה בהודעה, לעומת שיחה פנים אל פנים? מהם?

