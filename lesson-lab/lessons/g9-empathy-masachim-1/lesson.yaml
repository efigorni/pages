steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: photos
    title: תמונות מהחיים
    minutes: 7
    practices:
      - מה הקשר?
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      ארבע תמונות מהמצגת המקורית — כל אחד כותב מה מרגישות הדמויות ומה זה מעורר בו; במליאה — רגשות
      שונים, עוצמות שונות, ורגשות סותרים
    body:
      - slide:
          kicker: תמונות מהחיים · כל אחד כותב לעצמו
          title: אילו רגשות מעוררת בכם התמונה?
          sub: כיצד מרגישות הדמויות בתמונה?
          verbatim: true
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובו פנים שמחות ופנים עצובות
          art:
            - {use: thought, x: 40, y: 24, w: 320}
            - {use: face-happy, x: 95, y: 100, w: 100}
            - {use: face-sad, x: 215, y: 100, w: 100}
            - {use: kid-stand, x: 400, y: 220, w: 150, color: teal}
      - moves:
          - דף ״רגשות״ מונח על כל שולחן. הציגי את השאלות שעל המסך.
          - >-
            הציגי את ארבע התמונות, אחת אחרי השנייה, כ־40 שניות כל אחת. לכל תמונה כל אחד כותב במחברת — איך
            מרגישות הדמויות, ומה היא מעוררת בו. מותר לבחור מילים מהדף.
          - על תמונה אחת או שתיים — שמעי כמה תשובות שונות, ורשמי על הלוח את הרגשות.
          - שאלי גם על עוצמה, ועל רגשות סותרים — ״אפשר להרגיש גם פחד וגם התרגשות?״
      - source_slide:
          slides:
            - 22
            - 25
            - 26
            - 27
          why: >-
            ארבע מתוך שמונה ״תמונות מהחיים״: נערה מחבקת כלב וצוחקת, נערה מסתתרת בתוך קפוצ׳ון, שחקן כדורגל
            שוכב על הדשא ומכסה את פניו, ונערה בקפיצת בנג׳י. התמונות נמצאות רק במצגת המקורית; אפשר לבחור
            ארבע אחרות מתוך שקפים 22–29.
      - handout:
          title: רגשות
          copies: עותק לכל זוג, מונח על השולחן לפני שהכיתה נכנסת
          verbatim: true
          text: >-
            שמחה · אושר · הנאה · מבוכה · עלבון · הכרת תודה · ביטחון · תקווה · התלהבות · גאווה · הפתעה ·
            אופטימיות · אהבה · חמימות · אשמה · בושה · חיבה · קרבה · רגישות · התרגשות · חמלה · רחמים · מרירות ·
            שלווה · רגיעה · הקלה · סיפוק · נעימות · נוחות · אומץ · בוז · גועל · געגוע · הערצה · ייאוש · בלבול ·
            עייפות · חוסר סבלנות · שעמום · שנאה · קנאה · אי-ודאות · זלזול · תשוקה · נקיפות מצפון · חרטה · רגשי
            נחיתות · שאננות · טינה · התנשאות · פחד · דאגה · לעג · השפלה · תאווה · קור רוח · שעשוע · תסכול ·
            רוגז · עצבנות · כעס · לחץ · הערכה · פליאה · יראה · סלידה · ספק · חמדנות · חשש · נחת רוח · ניכור ·
            דכדוך · אמפטיה · עצבות · בדידות · אכזבה · כאב · צער · ציפייה · מועקה · מוערך · נקמה · ריקנות ·
            סקרנות · אימה · מתח · חוסר אונים · שביעות רצון · רוגע
      - ladder:
          help: בחרו מהדף ״רגשות״ — אפשר יותר ממילה אחת לכל תמונה.
          challenge: בחרו תמונה אחת — האם כל מי שבה מרגיש אותו דבר? ומה עוד אפשר להרגיש, מתחת לרגש הראשון?
      - ask: באותה תמונה כתבתם רגשות שונים — ממה זה נובע? ומישהו כתב שני רגשות שסותרים זה את זה?
      - quote:
          title: מהמקור — להקריא בקצרה
          text: >-
            רגש הוא חוויה פנימית, סובייקטיבית והוא מסייע לנו לתקשר עם אחרים על החוויה הרגשית הפנימית שלנו.
            הרגשות מתעוררים בתוכנו בעקבות נסיבות ואירועים. הרגשות הם כמו ״תמרורים״ - מספקים לנו מידע חשוב על
            המתרחש בסביבה ובתוכנו.
      - say: >-
          אנשים שונים מרגישים אחרת באותו מצב, ובעוצמה אחרת. לנסות להבין מה מרגיש מישהו אחר — לזה יש שם.

  # ------------------------------------------------------------------ 7′–14′
  - id: empathy
    title: מהי אמפתיה?
    minutes: 7
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      כל אחד כותב ניחוש; צופים ב״כוחה של אמפתיה״ עם עצירה; מדברים על הסרטון, ומקריאים את ההגדרה
    body:
      - slide:
          kicker: רגע לחשוב · לבד, בכתב
          title: מהי אמפתיה?
          sub: כתבו ניחוש אחד, במשפט.
          timer: 60
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובו לב
          art:
            - {use: thought, x: 40, y: 30, w: 240}
            - {use: heart, x: 115, y: 83, w: 96}
            - {use: kid-desk, x: 300, y: 180, w: 250, color: teal}
      - moves:
          - שאלי, ותני דקה לכתוב ניחוש במשפט. עוד לא מסבירים — רק אוספים.
          - שמעי שלושה ניחושים, ורשמי מילים מהם על הלוח.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה.
          - אחרי הצפייה — שאלי, והזמיני את התלמידים להגיב זה לזה.
          - סיימי בהגדרה — הקריאי אותה, וחברי אליה את המילים שעל הלוח.
      - ladder:
          help: חשבו על פעם שמישהו הבין מה אתם מרגישים — בלי שאמרתם. מה הוא עשה?
          challenge: אפשר להיות אמפתיים למי שמרגיש משהו שאתם לא הייתם מרגישים במקומו? איך?
      - video:
          title: כוחה של אמפתיה
          url: https://www.youtube.com/watch?v=BdEqtV8UZ7o
          length: "2:49"
          before: מה עוזר לנו להרגיש שמישהו באמת מבין אותנו?
          watch: שימו לב — מה עושה מי שמנסה לעזור, ומה באמת עוזר?
          pauses:
            - at: "?"
              moment: >-
                הרגע הראשון שבו מישהו מספר שקשה לו — לפני שהדמות השנייה מגיבה. צפי בסרטון לפני השיעור, ורשמי כאן
                את הזמן.
              ask: מה הייתם עונים לו עכשיו, כדי שירגיש שמבינים אותו? מילה או שתיים, בלחישה לשכן.
          alt: שתי דמויות יושבות זו מול זו, ובועת דיבור עם לב ביניהן
          art:
            - {use: kid-sit, x: 60, y: 230, w: 180, color: purple}
            - {use: kid-sit, x: 380, y: 230, w: 180, color: orange, flip: true}
            - {use: speech, x: 210, y: 40, w: 200}
            - {use: heart, x: 265, y: 66, w: 90}
      - ask: מה עורר בכם הסרטון? ומה אמפתיה תורמת לשיחה בין אנשים?
      - slide:
          kicker: מהי אמפתיה?
          title: לנסות לחוש את מה שהאחר חש
          sub: ולהגיב אליו ברגישות — ובהתאמה למה שהוא חווה.
          cue: אחרי השאלה על הסרטון —
          alt: שתי ידיים מושטות זו לזו, ולב לידן
          art:
            - {use: hands-help, x: 270, y: 120, w: 310}
            - {use: heart, x: 60, y: 70, w: 160}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: >-
            אמפתיה הינה היכולת לזהות את מצבו הנפשי של האחר. אמפתיה משמעה להכיר ברגשות ובמחשבות העצמאיות של האחר,
            לנסות לחוש את מה שהוא חש ומרגיש, לנסות לחשוב את המחשבות שעוברות בראשו, לנסות להתבונן על העולם
            מנקודת-המבט שלו, ואז להגיב אליו ברגישות ובהתאמה למה שהוא חווה.
      - say: פנים אל פנים קל יותר לראות מה מישהו מרגיש. ומה קורה כשמדברים דרך מסך?

  # ------------------------------------------------------------------ 14′–19′
  - id: table
    title: פנים אל פנים — ובמסך?
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: בזוגות משלימים טבלה — מה קורה במסך לראייה, לשמיעה, למגע ולשאלות; במליאה — שורה אחרי שורה
    body:
      - slide:
          kicker: בזוגות · משלימים את הטבלה
          title: מה קורה לאמפתיה כשאנחנו מדברים זה עם זה במסכים?
          sub: בכל שורה — מה קורה לזה בהודעה?
          verbatim:
            - title
          timer: 150
          echo: true
          alt: זוג יד ביד, ולידו טלפון ובו בועות צ׳אט
          art:
            - {use: pair, x: 40, y: 250, w: 230}
            - {use: phone, x: 340, y: 100, w: 190}
            - {use: chat, x: 386, y: 190, w: 98}
      - moves:
          - חלקי לכל זוג את הדף. ארבע השורות של ״פנים אל פנים״ כבר כתובות בו.
          - שתי דקות וחצי בזוגות — בכל שורה כותבים מה קורה לזה בהודעה.
          - במליאה עברי שורה אחרי שורה. שמעי זוג אחד לכל שורה, ושאלי מי מסכים ומי רואה אחרת.
          - סיימי בשורה ״אחר״ — מה עוד הוסיפו הזוגות?
      - say: בכל שורה כתבו מה קורה לזה כשמדברים במסך — זה קיים, חלקי, או חסר? ומה בא במקומו?
      - task:
          what: >-
            כל זוג משלים בדף את הטור של המסכים — מה קורה בהודעה לראייה, לשמיעה, למגע ולשאלת שאלות — ומוסיף
            בשורה ״אחר״ עוד הבדל אחד.
          time: שתי דקות וחצי
          group: זוגות
          rules: כותבים בקצרה, ומותר לכתוב ״גם וגם״
          plenary: זוג אחד לכל שורה, והכיתה מסכימה או מוסיפה
          help: חשבו על הודעה שקיבלתם לאחרונה — מה לא ידעתם על מי שכתב אותה?
          challenge: מה אנחנו מוסיפים להודעה כדי לפצות על מה שחסר — ועד כמה זה עובד?
      - handout:
          title: פנים אל פנים — ובמסך?
          copies: עותק לכל זוג
          verbatim: true
          items:
            - ראייה – רואים את הבעות הפנים והעיניים זה של זה
            - שמיעה – מקשיבים לטון וקצב הדיבור זה של זה
            - מגע – יכולים לשלב מגע, קובעים את המרחק הפיזי
            - שאלת שאלות – יכולים לנהל שיח מתמשך הכולל הקשבה התעניינות והבנה עמוקה של מצבו של האחר
            - אחר
      - ask: מה מכל זה הכי חסר בהודעה — דווקא כשמישהו צריך אמפתיה?
      - say: בואו נבדוק את זה בעצמנו — אותו סיפור, פעם בהודעה ופעם פנים אל פנים.

  # ------------------------------------------------------------------ 19′–27′
  - id: roleplay
    title: בהודעה, ופנים אל פנים
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
