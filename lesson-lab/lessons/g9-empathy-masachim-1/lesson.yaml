          title: הגיבו באמפתיה — פעמיים
          points:
            - סבב 1 — בהודעה כתובה, בלי לדבר
            - סבב 2 — פנים אל פנים, בשיחה
            - מי שצופה — שם לב לשפת הגוף
          timer: 300
          echo: true
          alt: שתי דמויות יושבות זו מול זו, ודמות שלישית עומדת וצופה
