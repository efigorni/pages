sub: >-
  חבר טוב שומר סוד — אבל מה עושים כשהסוד מסכן אותו? בשיעור הזה בודקים מה חשוב לנו בחברות, פוגשים את הילי
  ומיכל, ומתלבטים מתי לערב מבוגר.
format: שיר, זוגות ומליאה
question: מה עושה חבר טוב כשחבר שלו בסכנה — שומר על החברות, או שומר על החבר?
takeaways:
  - בחברות יש ערכים שחשובים לנו — נאמנות, אכפתיות, כנות — ולפעמים הם מתנגשים זה בזה.
  - >-
    כשחבר בסיכון יש כמה דרכים לעזור — לדבר איתו, לעודד אותו לפנות לעזרה, ללכת איתו, או להתייעץ עם מבוגר.
  - במצבי סיכון, שיתוף מבוגר הוא הושטת יד לעזרה — לא הלשנה.
prep: []

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — חבר בסיכון, סודות, ומתי משתפים מבוגר. השיעור עלול לעורר אצל מישהו רצון לספר על
      חבר שנמצא עכשיו בסכנה, או על עצמו. סכמי איתה מראש מה עושים במקרה כזה, ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי ששמר סוד של חבר ונשאר עם אשמה, מי ש״הלשינו״ עליו, או מי שחבר שלו נפגע. מדברים על הילי ומיכל ועל הדמויות,
      לא על אנשים מהכיתה, והמילה ״מלשן״ לא מודבקת לאף אחד.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בזוגות דנים במה הייתם עושים במקום מיכל — לא
      בסיפורים על חברים אמיתיים. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל חבר שנמצא עכשיו בסכנה, או סוד כבד שמישהו נושא לבד — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד — בדיוק כמו שהשיעור מלמד.

time:
