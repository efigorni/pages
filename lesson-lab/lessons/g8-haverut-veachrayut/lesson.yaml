# חברות ואחריות חברתית — כיתה ח׳, מתבגרים ומשקאות משכ/קרים, שיעור 4 (מקור: sources/text/8/Haverut_Veachrayut.md)
# סיכום היחידה שבתוך השיעור (unit-summary-inside) — הרחבה שעומדת בפני עצמה, לפי D49.
# השיר: לפי הכתוביות האוטומטיות הבית והפזמון הראשון נגמרים ב־1:20, והבית השני מתחיל ב־1:32 — הקטע עד 1:28.
