steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: song
    title: חברים
    minutes: 4
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: ההתחלה של השיר ״חברים״ — מה נתנו לזמר החברים שלו, ומה נותן לנו חבר קרוב
    body:
      - moves:
          - הציגי את השאלה שלפני השיר, ושמעי שתיים־שלוש תשובות.
          - הפעילי את השיר, ועצרי בסוף הפזמון הראשון.
          - שמעי שלוש–ארבע תשובות, ועברי להיגדים.
      - video:
          title: חברים — שייקה לוי
          url: https://www.youtube.com/watch?v=RT39VXfx80o
          length: "4:17"
          clip:
            end: "1:28"
          before: מה קיבלתם מהחברים שלכם?
          watch: הקשיבו — מה כל חבר נתן לזמר, ומה נתן לו החבר הכי קרוב?
          pauses:
            - at: "1:28"
              moment: סוף הפזמון הראשון — ״את החיוך נתן לי החבר הכי קרוב״, לפני שהבית השני מתחיל.
              ask: ומה נתן לכם חבר קרוב — או מה אתם נותנים לו?
          alt: שלוש דמויות יחד, ולב מעליהן
          art:
            - {use: group3, x: 120, y: 250, w: 360}
            - {use: heart, x: 400, y: 40, w: 170}
      - say: כל אחד נותן ומקבל משהו אחר מהחברים. אז מה זה, בעצם, חבר טוב?

  # ------------------------------------------------------------------ 4′–10′
  - id: friend
    title: מהי חברות?
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: כל אחד בוחר שלושה היגדים על חבר טוב, בזוגות מסכימים על שלושה, ובמליאה — אילו נבחרו הכי הרבה
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה הכי חשוב בחבר טוב?
          sub: בחרו מהדף שלושה היגדים — ואז הסכימו בזוג על שלושה.
          points:
            - לבד — דקה וחצי
            - בזוגות — דקה וחצי
            - במליאה
          echo: true
          alt: דף היגדים, ולב לידו
          art:
            - {use: note, x: 120, y: 120, w: 240}
            - {use: heart, x: 390, y: 290, w: 180}
      - moves:
          - חלקי דף לכל זוג. דקה וחצי — כל אחד בוחר לבד שלושה היגדים ורושם במחברת את המספרים שלהם.
          - דקה וחצי בזוגות — מסכימים על שלושה.
          - במליאה — הקריאי את ההיגדים, וכל זוג מרים יד על השלושה שלו. רשמי על הלוח את שלושת המובילים.
          - שימי לב במיוחד ל״לא מגלה את הסודות שלך״, ״לא מלשין עליך״ ו״דואג לך״ — הם יחזרו בסרטון.
      - ladder:
          help: חשבו על חבר אחד שלכם — מה הוא עושה שגורם לכם להרגיש שהוא חבר טוב?
          challenge: יש בדף שני היגדים שיכולים להתנגש זה בזה? אילו — ומתי?
      - handout:
          title: מהי חברות?
          copies: עותק לכל זוג
          verbatim: true
          lines: false
          items:
            - חבר טוב עוזר
            - חבר טוב לא מגלה את הסודות שלך
            - חבר טוב לא מלשין עליך
            - חבר טוב דואג לך
            - חבר טוב תמיד נאמן
            - לחבר טוב אכפת ממך
            - חבר טוב פתוח אתך
            - חבר טוב כנה אתך
            - חבר טוב נותן לך דברים אם אתה צריך
            - יש לי רגשות נעימים עם חבר טוב
            - עם חבר טוב יש הדדיות ביחסים
            - חבר טוב...
            - אני בוחר את החברים שלי
            - חבר טוב יכבד אותך
      - ask: אילו היגדים בחרתם — ולמה דווקא אותם?
      - say: >-
          לפעמים ״חבר טוב לא מלשין״ ו״חבר טוב דואג לך״ מושכים לכיוונים הפוכים. בואו נפגוש את הילי ומיכל.

  # ------------------------------------------------------------------ 10′–17′
  - id: video
    title: הילי ומיכל
    minutes: 7
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: סרטון ״קשר השתיקה״ — מיכל בין האבא של הילי להילי; עצירה אחת, ואחרי הצפייה — מה הרגשנו ומה הרגישה מיכל
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתיים־שלוש תשובות.
          - הפעילי את הסרטון, ועצרי בנקודה שסימנת.
          - אחרי הצפייה — חכי חמש שניות, ושמעי תגובות. הדהדי כל תשובה, והזמיני את הכיתה להגיב זו לזו.
      - video:
          title: קשר השתיקה — הילי ומיכל
          url: https://www.youtube.com/watch?v=aFm4H1FkkwA
          length: "4:44"
          before: מה עושה חבר טוב, כשהוא דואג לחבר שלו?
          watch: שימו לב למיכל — מה היא מרגישה בכל שיחה, עם האבא ועם הילי.
          pauses:
            - at: "?"
              moment: >-
                אחרי השיחה הראשונה של מיכל עם האבא של הילי: היא עוד לא יודעת מה קורה עם הילי, ובוחרת לשקר לו. צפי
                בסרטון (4:44) לפני השיעור, וסמני כאן את הזמן.
              ask: מה מיכל מרגישה עכשיו?
          alt: נערה, ולידה טלפון שמצלצל ומנעול
          art:
            - {use: kid-stand, x: 60, y: 220, w: 140, color: orange}
            - {use: phone-notify, x: 260, y: 80, w: 170}
            - {use: lock, x: 450, y: 250, w: 130}
      - whisper: >-
          לפי המקור: בפעם הראשונה שהאבא מתקשר, מיכל לא יודעת מה קורה עם הילי ובוחרת לשקר לו. בשיחה עם הילי היא
          מתחילה לדאוג, ומבינה שהילי עושה משהו שמסכן אותה — ובכל זאת ממשיכה לשקר לאב. חדדי את הקונפליקט ונרמלי אותו:
          מיכל מרגישה אחריות גדולה, וגם מחויבות להילי וחשש מהתגובה שלה.
      - ask: מה הרגשתם במהלך הצפייה — ומה הרגישה מיכל בשיחות עם האבא ועם הילי?

  # ------------------------------------------------------------------ 17′–22′
  - id: pairs
    title: מה אתם הייתם עושים?
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: כל אחד כותב מה היה עושה במקום מיכל ואילו ערכים הנחו אותו; בזוגות או בשלשות משווים ומנמקים
    body:
      - slide:
          kicker: לבד · ואז בזוגות
          title: מה הייתם עושים במקום מיכל?
          points:
            - מספר/ת לאבא היכן נמצאת בתו
            - מרגיע/ה את האבא. אך לא הייתי מספר/ת לו.
            - נוהג/ת כמו בסרטון. משקר/ת ומכחיש/ה.
            - נוהג/ת אחרת – איך?
          verbatim:
            - points
          echo: true
          alt: נערה, ומעליה ענן מחשבה ובתוכו מאזניים
          art:
            - {use: kid-stand, x: 60, y: 220, w: 140, color: orange}
            - {use: thought, x: 250, y: 24, w: 320, flip: true}
            - {use: scale, x: 340, y: 70, w: 150}
      - moves:
          - >-
            דקה של כתיבה לבד — מה הייתי עושה, ולמה. אפשר לבחור מהאפשרויות שעל המסך, או דרך אחרת — למשל להתייעץ
            עם חבר או עם ההורים.
          - שתי דקות בזוגות או בשלשות — משווים, ומספרים אילו ערכים הנחו אותנו.
          - הסתובבי והקשיבי — אילו ערכים עולים? נאמנות, דאגה, אחריות? עם אלה פותחים את המליאה.
      - say: קודם כל אחד כותב לבד מה הוא היה עושה — ורק אחר כך מדברים בזוג.
      - ladder:
          help: מה מיכל מפחדת שיקרה אם תספר לאבא — ומה עלול לקרות אם לא תספר?
          challenge: איזו דרך יכולה לשמור גם על הילי וגם על החברות?
      - ask: אילו ערכים הנחו אתכם בבחירה?

  # ------------------------------------------------------------------ 22′–27′
  - id: adult
    title: הלשנה או עזרה?
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      מליאה על שאלות המקור — האם לספר לאבא זו הלשנה, מה ההבדל בין הלשנה ליידוע, ומתי אין ספק שצריך לשתף מבוגר
    body:
      - slide:
          kicker: שאלות לדיון
          title: האם לספר לאבא איפה הילי נמצאת זו הלשנה?
          sub: מה ההבדל בין הלשנה ליידוע?
          echo: true
          alt: נערה מדברת עם מבוגר, ובבועת הדיבור גלגל הצלה
          art:
            - {use: kid-stand, x: 60, y: 220, w: 140, color: orange}
            - {use: speech-l, x: 190, y: 40, w: 230}
            - {use: lifebuoy, x: 255, y: 62, w: 100}
            - {use: teacher, x: 440, y: 220, w: 140, color: moss}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות. פתחי בזוגות ששמעת בהם ערכים שונים.
          - על כל תשובה — הדהדי, ושאלי ״מי מסכים? מי חושב אחרת? למה?״
          - >-
            עברי לשאלה השנייה. אם יש זמן — שאלי אם שתיית אלכוהול של חבר היא מצב שבו הייתם משתפים מבוגר, ולמה כן
            או לא.
          - סיימי באמירה ברורה — במצבי סיכון, גם שיתוף מבוגר הוא הושטת יד לעזרה.
      - ask: וכשחבר טוב מגלה אחריות לחבר שנמצא בסיכון — האם הוא כבר לא חבר?
      - slide:
          kicker: שאלות לדיון
          title: באילו מצבים אין לכם ספק שצריך לשתף מבוגר?
          sub: ומה הייתם אומרים לנער או לנערה בגילכם שמתלבטים?
          echo: true
          cue: אחרי כמה תשובות —
          alt: שתי ידיים מושטות זו לזו
          art:
            - {use: hands-help, x: 170, y: 120, w: 300}
      - whisper: >-
          לפי המקור: הביעי אמפתיה לנאמנות שלהם לחבר, לרגישות ולרצון לסמוך על חברים שלא יסכנו את עצמם. יש מרחב
          התלבטות אם לשתף — וחשוב להיות מודעים להשלכות של כל בחירה. ובסוף — אמירה ברורה: במצבי סיכון, גם שיתוף מבוגר
          הוא הושטת יד לעזרה.
      - say: במצבי סיכון, שיתוף מבוגר הוא הושטת יד לעזרה — לא הלשנה. ואפשר לעשות את זה יחד עם החבר.

  # ------------------------------------------------------------------ +5′
  - id: values
    title: אני מאמין בחברות
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: כל אחד בוחר ארבעה ערכים שמייצגים את ה״אני מאמין״ שלו בחברות, ומדרג אותם לפי החשיבות
    body:
      - slide:
          kicker: אם נשאר זמן · לבד, בכתב
          title: מהם הערכים המנחים בחברות טובה לדעתכם?
          sub: בחרו ארבעה ערכים, ודרגו אותם לפי החשיבות.
          timer: 120
          echo: true
          alt: ענן של ערכי חברות — אכפתיות, נאמנות, כנות ועוד
          art: {file: art/values.svg}
      - moves:
          - שתי דקות — כל אחד בוחר ארבעה ערכים, ורושם אותם במחברת לפי הסדר.
          - שאלי מי שם במקום הראשון את ״נאמנות״, ומי את ״אכפתיות״ או ״אחריות״ — ומה זה אומר על הבחירה של מיכל.
          - שמעי שניים־שלושה, בלי לשפוט — אין דירוג נכון.
      - say: אין דירוג נכון. בחרו ערכים שלא הייתם מוותרים עליהם אצל חבר.
      - ladder:
          help: בחרו ערך אחד שבלעדיו לא תסכימו להיות חברים של מישהו.
          challenge: מה תעשו כששני ערכים שבחרתם מתנגשים — כמו אצל מיכל?
      - ask: איזה ערך שמתם במקום הראשון — ולמה?

  # ------------------------------------------------------------------ +5′
  - id: unit
    title: מסכמים את היחידה
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: מה הייתי מספר לחבר על השיעורים האלה, וכתיבה אישית — משהו שאני לוקח על עצמי לעשות אחרת
    body:
      - whisper: >-
          ביחידה ״מתבגרים ומשקאות משכ/קרים״ — אני, החברים והאלכוהול; מידע על אלכוהול; פיתוי וגבול; והשיעור הזה — חברות
          ואחריות חברתית. לא כולם היו בכל השיעורים: מי שלא היה עונה מתוך השיעור הזה.
      - ask: >-
          דמיינו שאתם נפגשים היום עם חבר טוב מכיתה אחרת. מה הייתם מספרים לו על השיעורים שעסקו בשתיית אלכוהול?
      - moves:
          - שאלי, ושמעי שלוש–ארבע תשובות.
          - דקה וחצי של כתיבה בשקט — כל אחד לעצמו, במחברת.
          - הזמיני שניים־שלושה מתנדבים לשתף במה שכתבו.
      - slide:
          kicker: אם נשאר זמן · כותבים לעצמכם
          title: משהו שאני לוקח/ת על עצמי לעשות אחרת בעקבות המפגשים...
          verbatim:
            - title
          timer: 90
          echo: true
          alt: דמות כותבת ליד שולחן, ועיפרון לידה
          art:
            - {use: kid-desk, x: 230, y: 120, w: 270}
            - {use: pencil, x: 60, y: 300, w: 140}
      - say: הכתיבה הזאת שלכם. מי שרוצה — משתף; מי שלא — שומר לעצמו.
      - ladder:
          help: חשבו על רגע אחד מהשיעור — מהשיר, מהסרטון או מהדיון — שתרצו לזכור.
          challenge: כתבו גם מתי בדיוק תעשו את זה, ומה יעזור לכם לעמוד בזה.

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ששת המסרים של המקור (שני שקפי ״מהם המסרים שלנו?״), מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - אנחנו חפצים בשלום חברינו.
            - >-
              כשחברינו מתמודדים עם מצב מורכב אנו מתלבטים אם להתערב או לערב מבוגר כדי להגן עליהם. ההחלטה אם להתערב או
              להימנע מלהתערב אינה פשוטה.
            - >-
              חשוב שנבין מה מנחה אותנו בהחלטה אם להתערב, לערב מבוגר או לעמוד מהצד. כדאי להתייעץ, להתלבט, לחשוב בקול...
            - >-
              כשאתם חוששים לחבר ומתלבטים האם לשתף/לערב מישהו — בררו לעצמכם... אילו ערכים מנחים אתכם? מה סדרי
              העדיפויות שביניהם? מה חשוב יותר — לשמור על החברות או לשמור על החבר?
            - >-
              מה עוד ניתן לעשות? שקפו לחבר את המצב הסיכוני תוך הבעת אכפתיות והציעו עזרה. עודדו אותו לפנות לעזרה. לוו
              את החבר ויחד שתפו מבוגר.
            - >-
              פנו לעזרה של חבר נוסף. התייעצו עם מבוגר בלי לציין את פרטי החבר. פנו לגורמים נוספים שיוכלו לסייע: ההורים,
              מורה, יועצ/ת, מדריכ/ה בתנועה.
          ask: >-
            איזה משפט הייתם רוצים לזכור כשתחששו לחבר? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            שלושת הראשונים מכירים בהתלבטות; שלושת האחרונים הם רצף של דרכים לעזור — משיחה עם החבר ועד מבוגר שמתערב.
          alt: שתי ידיים מושטות זו לזו, ולב מעליהן
          art:
            - {use: hands-help, x: 170, y: 200, w: 300}
            - {use: heart, x: 240, y: 24, w: 160}

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — חבר בסיכון
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: דבר אחד שאעשה אם אחשוש לחבר, ומבוגר אחד שאוכל להתייעץ איתו; שורת רשות; פתקים נאספים בדלת
    body:
      - moves:
          - הציגי את השאלות, והפעילי את הטיימר.
          - עמדי בדלת ואספי את הפתקים אחד־אחד.
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: חבר בסיכון
          prompts:
            - דבר אחד שאעשה אם אחשוש לחבר.
            - מבוגר אחד שאוכל להתייעץ איתו.
            - רשות — ״רציתי לומר לך ש…״
          look_for: >-
            חפשי פתקים בלי אף מבוגר, ותשובות כמו ״לא מלשינים״ — ובעיקר כל פתק שמספר על חבר שנמצא עכשיו בסכנה או על סוד
            כבד. עם אלה מדברים בשקט עוד היום, ומה שנוגע בסכנה או בפגיעה עובר ליועצת עוד היום.
          timer: 180
          alt: דמות כותבת ליד שולחן, וגלגל הצלה לידה
          art:
            - {use: kid-desk, x: 250, y: 120, w: 288}
            - {use: lifebuoy, x: 40, y: 60, w: 170}
