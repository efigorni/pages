    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה אפשר ללמוד מן ההתנסות שחווינו עכשיו בכיתה?
          sub: האם הזדהיתם עם אחת הדמויות?
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          verbatim: [title, sub]
          echo: true
          alt: שתי דמויות יד ביד, ובועת דיבור ובה נורה דולקת
