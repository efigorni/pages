          items:
            - שיתוף תכנים ברשת תורם לתחושת השייכות, אך חשוב להפעיל שיקול דעת לפני פרסום תכנים ותגובות.
            - יש שוני בין אדם לאדם בתכנים שכל אחד בוחר לשתף ולחשוף, הדבר תלוי אישיות וסגנון.
            - למילים יש כוח! הן מקרבות או מרחיקות.
            - >-
              פרסום תגובות פוגעניות על תכנים שאדם שיתף ברשת, עשוי להוביל לתחושות של לחץ, קושי ופגיעה בקרב הצד
              השני.
            - >-
              חשוב לזכור שכל מידע שאנחנו שומרים/מתעדים/משתפים ברשת (גם אם הוא בנייד שלנו) אינו פרטי יותר.
