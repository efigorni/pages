            - יאללה... את מי אתה מעניין????
            - פחותתתתת... אבל ממש פחות... דחוף להוריד!!!!!!!
          verbatim: [title, points]
          echo: true
          cue: אחרי ההסבר, עם ארבעת המתנדבים הראשונים —
          alt: טלפון ועל המסך הר, ובועות צ׳אט לידו
          art:
            - {use: chat, x: 40, y: 70, w: 240}
            - {use: phone, x: 345, y: 115, w: 190}
            - {use: mountain, x: 375, y: 222, w: 130}
      - slide:
          kicker: קרוב / רחוק? · סטורי 2 · בשבת
          title: היום ממש הגזמתי.... מאממתתתתת
          points:
