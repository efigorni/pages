sub: >-
  כולנו משתפים ברשת — ומגיבים. בשיעור הזה מגלים מה היינו מראים לרובוט מהעתיד, מרגישים בגוף איך תגובה אחת
  מקרבת או מרחיקה, ומדברים על הכוח של המילים.
format: משחק תפקידים, זוגות ומליאה
question: מה אנחנו בוחרים לשתף ברשת — ואיך התגובות שלנו מקרבות או מרחיקות?
takeaways:
  - כל אחד בוחר אחרת מה לשתף ומה להשאיר לעצמו — וכדאי לעצור רגע לפני שמפרסמים.
  - למילים יש כוח — תגובה של שורה אחת יכולה לקרב או להרחיק את מי שקורא אותה.
  - מה שמשתפים ברשת, וגם מה ששומרים בנייד, כבר לא באמת פרטי.
prep:
  - >-
    קלפי הנייד תלויים על הלוח לפני השיעור, כשהשאלות מופנות אל הלוח — ונייר דבק, כדי להדביק כל קלף מחדש
    כשהשאלה גלויה
  - שתי השאלות של משימת הצופים ב״קרוב / רחוק?״ — כתובות על הלוח לפני השיעור
  - מעבר פנוי לאורך הכיתה, מהלוח ועד הקיר האחורי

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מה משתפים ברשת, ותגובות שמקרבות או מרחיקות, כולל תגובה פוגענית על המראה.
      שאלי אם יש בכיתה מי שספג לאחרונה תגובות מעליבות או חרם ברשת, מי שהמראה שלו רגיש אצלו, ואם הופצו לאחרונה
      בשכבה סטורי או תמונה של מישהו. בדקי איתה את מי עדיף לא להזמין לתפקידים, ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שספג תגובות פוגעניות עלול לזהות את עצמו בכותב הסטורי — ובסטורי השני התגובה היא על המראה. הסטוריז
      והתגובות דמיוניים וכתובים מראש: המקריאים לא אומרים אותם בשם עצמם, וכותב הסטורי משחק דמות. מדברים על
      התגובות, לא על מי שכתב או קיבל תגובות כאלה בכיתה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום, מהמקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״.
      בקלפים ״לא נוח לי לענות על זה״ היא תשובה מלאה, והתשובות שבכתב נשארות במחברת. לתפקידים עולים רק
      מתנדבים; מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל תגובות שהוא מקבל עכשיו, תמונה שלו שהופצה, או חרם בקבוצה — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית
      אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד — אומרים שזה כדי שאפשר יהיה לעזור. לצד
      היועצת: מוקד 105 — המטה הלאומי להגנה על ילדים ונוער ברשת, 24/7 (פגיעה, בריונות והפצת תמונות; פתוח גם לבני נוער
      ולהורים); ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם.
  - head: עמידה מול הכיתה
    text: >-
      ב״קרוב / רחוק?״ כותב הסטורי זז מול כולם לפי מה שהתגובה מעוררת בו. עולים רק מתנדבים — לא מי שהיועצת
      המליצה להשאיר בחוץ — ומותר להישאר במקום או לעצור בכל רגע. לסטורי השני מזמינים רק מי שבטוח בעצמו, ואפשר
      גם שאת תעמדי בתפקיד הזה. צחוק או הערה על מי שבתפקיד — עוצרים מיד.

