            איזה משפט הייתם רוצים לזכור רגע לפני שאתם שולחים תגובה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהבחירה מה לשתף (1–2), דרך הכוח של המילים והתגובות (3–4), אל מה שקורה למידע אחרי שהוא
            ברשת (5).
          alt: בועת דיבור גדולה עם לב, ובועה קטנה יותר עם לב שבור
          art:
