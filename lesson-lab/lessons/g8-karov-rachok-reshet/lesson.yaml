steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: future
    title: בחזרה לעתיד
    minutes: 7
    practices:
      - מה הקשר?
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      רובוט משנת 2100 נחשף לנייד שלכם — מתנדבים שולפים קלף ועונים בקול, וכולם כותבים לעצמם; ואז — על אילו
      שאלות היה נוח לענות, ועל אילו לא
    body:
      - slide:
          kicker: בחזרה לעתיד
          title: השנה היא שנת 2100…
          sub: רובוט מוצא את הנייד שלכם — ונחשף לכל מה שיש בו.
          verbatim: [title]
          echo: true
          alt: טלפון שמתעורר עם התראה, וזכוכית מגדלת לידו
          art:
            - {use: phone-notify, x: 290, y: 120, w: 260}
            - {use: magnifier, x: 70, y: 210, w: 210}
      - quote:
          title: הפתיח — להקריא
          text: |-
            השנה היא שנת 2100...
            בתוך מאובן, משנת 2022, נמצא הנייד העתיק שלך.
            דרמוט - רובוט אנושי בעל אינטליגנציה מלאכותית מתקדמת, מרים את הנייד ומקרב אותו לגופו, כשלפתע נשמע צפצוף ארוך והסלולארי מתעורר לחיים...
            דרמוט נחשף כעת לכל התכנים שנמצאים בנייד שלך...
      - moves:
          - הקריאי את הפתיח לאט, כמו סיפור. קלפי הנייד כבר תלויים על הלוח, והשאלות מופנות אל הלוח.
          - >-
            הזמיני מתנדב לשלוף קלף, להקריא את השאלה ולענות — או לומר ״לא נוח לי לענות על זה״. אחר כך הוא מדביק
            את הקלף מחדש, כשהשאלה גלויה.
          - כל השאר עונים על אותה שאלה במחברת, לעצמם. כך ארבעה קלפים.
          - >-
            הציגי את שאלות השיחה. שאלי, וחכי כמה שניות; על כל תשובה — הזמיני את הכיתה להגיב: ״למי זה היה
            אחרת?״
      - say: >-
          דמיינו שזה הנייד שלכם. מי שעונה בקול עונה רק על מה שנוח לו, ובלי שמות של אחרים — ומותר לומר ׳לא נוח לי
          לענות על זה׳. כל השאר כותבים את התשובה שלהם במחברת. אף אחד לא יקרא אותה.
      - ladder:
          help: ענו במילה אחת — או כתבו רק ׳נוח׳ או ׳לא נוח׳ ליד השאלה.
          challenge: כתבו ליד כל תשובה — למי הייתם מוכנים להראות אותה, ולמי לא?
      - handout:
          title: קלפי נייד
          copies: עותק אחד, גזור ל־17 קלפים — שאלה על כל קלף
          verbatim: true
          lines: false
          items:
            - היכן צולם הסלפי האחרון שלכם?
            - האם כל מי שנמצא ברשימת החברים שלכם הוא אדם שהכרתם במציאות?
            - מה התמונה האחרונה שקיבלתם והעברתם הלאה?
            - מי האדם האחרון שעשה לכם עוקב?
            - מהי הקבוצה בוואצאפ בה הייתם הכי פעילים?
            - מהו הפילטר האחרון שהשתמשתם בו?
            - מה כולל הסרטון האחרון שצילמתם?
            - מהי התמונה האחרונה שפרסמתם ברשתות החברתיות?
            - מהן שתי הקבוצות האחרונות שהייתם פעילים בהן?
            - מי האדם האחרון שקיבלתם ממנו הודעה?
            - מהן האפליקציות שניתן למצוא על המסך הראשי שלכם?
            - מהו הדבר האחרון שחיפשתם במנוע חיפוש? (כדוגמת גוגל)
            - איך נראה הסטיקר האחרון ששלחתם?
            - מי הם שלושת האנשים האחרונים ששוחחתם עימם בנייד?
            - מהי האפליקציה האחרונה שהורדתם לנייד?
            - מה הייתה התמונה האחרונה שצילמתם בנייד?
            - הנייד שלכם עומד להיות מוצג לעיני כל במוזאון - האם ישנם דברים שתעדיפו למחוק לפני?
      - slide:
          kicker: בחזרה לעתיד · שיחה
          title: איך הרגשתם בפעילות?
          points:
            - על אילו שאלות הרגשתם נינוחות לענות ועל אילו שאלות הרגשתם אי נוחות?
            - האם, בעקבות הפעילות, יש תכנים בנייד שהייתם מוסיפים / מוחקים / משנים? מדוע?
          verbatim: true
          echo: true
          cue: אחרי ארבעה קלפים —
          alt: טלפון, ומשני צדיו וי ואיקס
          art:
            - {use: phone, x: 225, y: 150, w: 170}
            - {use: check, x: 430, y: 100, w: 140}
            - {use: cross, x: 50, y: 100, w: 140}
      - ask: על איזו שאלה היה הכי קל לענות בקול — ועל איזו הכי קשה? למה?
      - say: >-
          בנייד שלנו יש הרבה ממה שאנחנו בוחרים לשתף. ומה קורה כשאנחנו משתפים — ומישהו מגיב? בואו נבדוק את זה
          בגוף.

  # ------------------------------------------------------------------ 7′–17′
  - id: stories
    title: קרוב / רחוק?
    minutes: 10
    stance: true
    practices:
      - הוצאה למשימה
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      שלושה סטוריז ושלוש תגובות לכל אחד; מתנדב בתפקיד כותב הסטורי מתקרב ללוח או מתרחק ממנו אחרי כל תגובה,
      והצופים רושמים מה ראו
    body:
      - slide:
          kicker: קרוב / רחוק? · איך זה עובד
          title: כל תגובה — צעד קדימה, צעד אחורה, או נשארים
          sub: כותב הסטורי עומד רחוק מהלוח, וזז לפי מה שהתגובה מעוררת בו.
          echo: true
          alt: דמות עומדת באמצע — חץ אחד מוביל אל הלוח, וחץ שני מתרחק ממנו
          art:
            - {use: board, x: 24, y: 60, w: 190}
            - {use: arrow, x: 40, y: 300, w: 170, color: orange}
            - {use: kid-stand, x: 240, y: 210, w: 140, color: teal}
            - {use: arrow, x: 410, y: 300, w: 170, color: gray, flip: true}
      - moves:
          - >-
            הסבירי את התרגיל לפני שמזמינים מתנדבים: הסטוריז והתגובות דמיוניים, ואינם לקוחים מהרשת — כל אחד משחק
            דמות.
          - >-
            לכל סטורי — ארבעה מתנדבים חדשים. ״כותב הסטורי״ נעמד בקצה הכיתה, רחוק מהלוח, ושלושה מקריאים מקבלים
            תגובה אחת כל אחד.
          - >-
            הציגי את הסטורי. כותב הסטורי מקריא אותו מהמסך, ואחריו המקריאים — תגובה אחרי תגובה. חשפי כל תגובה רק
            כשמגיע תורה.
          - אחרי כל תגובה — חמש שניות של שקט, ורק אז כותב הסטורי מתקרב, מתרחק או נשאר במקום.
          - הצופים עובדים לפי המשימה שעל הלוח. אחרי הסטורי השלישי — כל המתנדבים חוזרים למקומות.
      - say: >-
          אחרי כל תגובה, כותב הסטורי חושב לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז זז. מותר גם להישאר
          במקום. כל השאר צופים ורושמים.
      - task:
          what: >-
            כל מי שלא בתפקיד צופה בתרגיל ורושם — תגובה אחת שקירבה את כותב הסטורי, תגובה אחת שהרחיקה, ומה ראה
            בשפת הגוף ובטון הדיבור.
          time: לאורך שלושת הסטוריז
          group: לבד — כל מי שלא בתפקיד
          rules: רושמים על התגובות ועל התרגיל, לא על המתנדבים; בלי הערות בקול בזמן התרגיל
          plenary: בשיחה שאחרי התרגיל
          help: סמנו ליד כל תגובה חץ — קדימה אם היא קירבה, אחורה אם היא הרחיקה.
          challenge: בחרו תגובה שהרחיקה, וחשבו איך אפשר לכתוב אותה אחרת — כך שתקרב.
      - board:
          - רשמו תגובה אחת שקירבה את כותב הסטורי, ותגובה אחת שהרחיקה.
          - מה ראיתם בשפת הגוף ובטון הדיבור?
      - slide:
          kicker: קרוב / רחוק? · סטורי 1 · היום בבוקר
          title: טיפוס זה החיים! חחחחחחחחח
          points:
