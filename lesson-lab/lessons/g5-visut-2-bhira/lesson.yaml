- id: remember
  title: חשוב לזכור
  kind: messages
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: מסרי המקור, כל מסר בפני עצמו, וחיבור לפעילות
  body:
  - messages:
      items:
      - מבחן היד ממחיש לכולנו עד כמה זה לא פשוט לשחרר, גם כשאנחנו מבינים שכך עלינו לנהוג.
      - הסיבה לכך היא שהאוטומט שלנו הוא לרצות שהדברים יהיו כמו שאנחנו רוצים וזה גורם לנו להיות בהיכון שמא משהו
        ישתבש. תחושה זו באה לידי ביטוי בשרירים דרוכים.
      - דריכות כזו אינה מאפשרת גמישות.
      - חוויה של שליטה מושגת, כאשר יש לנו את הגמישות לבחור מתי להחזיק ומתי לשחרר.
      - כאשר אני ניצב בפני בעיה או כאשר אני מגיב בעוצמה, אזכיר לעצמי שאוכל להרגיש שליטה על ידי זה שאבחר אם
        להמשיך להתעקש או לוותר. לא תמיד נדע מראש אם התוצאה תהיה הטובה ביותר, אך כך נרגיש שעשינו כמיטב יכולתנו.
      ask: איזה מסר מתחבר להתנסות שלכם היום? חשבו בשקט, ואז הצביעו כשאקרא את המסר שבחרתם.
      art: bulb
      alt: נורה דולקת
