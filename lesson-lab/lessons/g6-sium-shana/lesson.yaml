    summary: שלושת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              התבוננו יחד בשנה שחלפה, נזכרנו באילו תחומים עסקנו השנה, ומה היו היעדים והחלומות שהצבנו לעצמנו.
              בחנו את כוחות ההתמודדות שלנו, המסייעים לנו להתמיד ולהתפתח בתחומים שונים.
            - >-
              קיבלנו כלים ועקרונות המסייעים לנו להציב מטרות ויעדים אישיים. להתקדם צעד אחר צעד להצלחה, לראות את
              ההישגים שלנו, להאמין בעצמנו ולהכיר בהתקדמות שלנו; ובעת הצורך, להיעזר תוך קבלת עידוד ותמיכה
              מהסביבה.
            - >-
              לאחר שסיכמנו את הנושאים והמיומנויות שנלמדו ונדונו במהלך השנה בכישורי חיים, ועם המבט לעתיד, בדקנו
              אילו יעדים נבקש להציב לעצמנו לשנה הבאה, ומה/מי יוכל לעזור לנו להשיגם.
          ask: איזה משפט מהשלושה הכי מתאים לשנה שלכם? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהמבט אחורה על השנה (1), דרך הכלים שעזרו לנו בדרך (2), אל היעד לשנה הבאה (3).
          alt: הר עם שתי פסגות, ודגל על הפסגה הגבוהה
          art:
            - {use: mountain, x: 118, y: 210, w: 384}
            - {use: flag, x: 343, y: 102, w: 126, color: purple}

