sub: >-
  השנה נגמרת, ובשנה הבאה מחכה חטיבת הביניים. בשיעור הזה צופים באפרוח שמטפס על הר צעד אחר צעד, מגלים
  אילו כוחות עזרו לנו בדרך שלנו השנה, ומציבים יעד לשנה הבאה.
format: מליאה, זוגות מתחלפים בקרוסלה וכתיבה אישית
question: אילו כוחות עזרו לנו בדרך השנה — ואיזה יעד ניקח איתנו לשנה הבאה?
takeaways:
  - גם דרך ארוכה עוברים צעד אחר צעד — ומי שנופל יכול לקום ולהמשיך.
  - יש לנו כוחות שעוזרים בדרך — חלום ויעד, אמונה בעצמנו, שמחה בהצלחות הקטנות, ותמיכה מהסביבה.
  - לשנה הבאה אפשר להציב יעד — ולדעת מה ומי יעזרו לנו להשיג אותו.
prep:
  - >-
    תכנון המעבר לשני מעגלים של כיסאות: מי יושב במעגל הפנימי (למשל שתי השורות הקרובות ללוח), ואיפה עומדים
    הכיסאות — כדי שהמעבר ייקח פחות משתי דקות
  - פתקיות דביקות, אחת לכל תלמיד (להרחבה ״טיפים ואיחולים״)

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״הכוחות שבדרך
    והכוחות שלי״; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - carousel
      - goal
    text: בקרוסלה עושים שלושה סבבים בלבד, ואת היעד לשנה הבאה כותבים בלי שיתוף במליאה

brain_break:
  signs: רעש שעולה אחרי התנועה בקרוסלה, תשובות של מילה אחת, קושי לחזור לשקט.
  ideas:
    - name: אצבעות סופרות
      text: יד ימין סופרת באצבעות מאחת עד חמש, ויד שמאל בו בזמן מחמש עד אחת. שלושה סבבים, כל סבב מהר יותר.
    - name: פסלים
      text: כולם קמים ומתנועעים במקום. כשאת מוחאת כף — קופאים כמו פסל עד שלוש. ארבעה סבבים, בלי לדבר.
    - name: נשימת בלון
      text: שואפים לאט באף ומנפחים את הבטן כמו בלון, ונושפים לאט בפה. חמש נשימות.
  from: wishes

