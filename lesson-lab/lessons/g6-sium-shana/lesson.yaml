# המסע שלי השנה — כיתה ו׳, סיום וסיכום שנה, שיעור 1 (מקור: sources/text/6/Sium_Shana.md)
# חלופה ל״מתבוננים אחורה וקדימה״ (g6-siyum-shana) באותה משבצת — המורה בוחרת אחד מהשניים.
