steps:
  # ------------------------------------------------------------------ 0′–8′
  - id: climb
    title: אלף הצעדים
    minutes: 8
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      סרטון קצר על אפרוח שמטפס על הר צעד אחר צעד, עם עצירה כשהוא נופל; בזוגות — מה עזר לו לקום ולהמשיך
    body:
      - moves:
          - השקף ״לפני שצופים״ על המסך כשהכיתה נכנסת. שאלי את השאלה, ושמעי שתיים־שלוש השערות.
          - הקריני את הסרטון, ועצרי בנקודת העצירה. השיר באנגלית — הסיפור עובר בתמונות.
          - אחרי הצפייה — שאלת הזוגות על המסך. עשרים שניות לבד, דקה עם השכן, ושלושה זוגות במליאה.
          - רשמי בפינת הלוח, במילה או שתיים, את מה שעזר לאפרוח. זה יחזור בשלב הבא.
      - video:
          title: אלף הצעדים — אפרוח מטפס על הר
          url: https://youtu.be/YYb4h8U7Ljw
          length: "2:09"
          before: האפרוח בסרטון רוצה להגיע לפסגה של הר גבוה. מה יעזור לו להגיע?
          watch: שימו לב לרגעים שבהם קשה לאפרוח — ומה עוזר לו להמשיך.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו האפרוח נופל באמצע הטיפוס, לפני שהוא קם. צפי בסרטון לפני השיעור, ורשמי כאן את הזמן.
              ask: מה האפרוח מרגיש עכשיו — ומה יעזור לו לקום? מילה אחת, בלחישה לשכן.
          alt: אפרוח עומד למרגלות מדרגות גבוהות, ודגל בפסגה
          art: {file: art/start.svg}
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה סייע לאפרוח לקום ולהמשיך לטפס?
          echo: true
          points:
            - לבד — 20 שניות
            - עם השכן — דקה
            - במליאה
          cue: אחרי הצפייה —
          alt: אפרוח על מדרגה, ומעליו ענן מחשבה ובו הדגל שבפסגה
          art: {file: art/dream.svg}
      - ladder:
          help: חשבו על מה שהאפרוח ראה, שמע או חשב ברגע שהיה לו קשה.
          challenge: האפרוח התחיל לטפס גם כשלא ראה את הסוף. למה, לדעתכם — ומה זה מלמד על דרך ארוכה?
      - say: >-
          גם לנו הייתה השנה דרך משלנו — עם מדרגות קלות ועם מדרגות קשות. בואו נבדוק מה עזר לנו בה.

  # ------------------------------------------------------------------ 8′–13′
  - id: forces
    title: הכוחות המסייעים לנו בדרך
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      מהאפרוח אלינו — מה עזר לנו השנה לא להתייאש; חושפים את ששת הכוחות של המקור, ומי שמזהה את עצמו נותן
      דוגמה
    body:
      - slide:
          kicker: המסע שלנו השנה
          title: מה עזר לכם השנה לא להתייאש?
          sub: חשבו על רגע אחד שהיה קשה — ומה עזר לכם להמשיך.
          echo: true
          alt: דמות עומדת מתחת למטרייה פתוחה, וענן גשם מעליה
          art:
            - {use: umbrella, x: 90, y: 150, w: 300, color: purple}
            - {use: kid-stand, x: 250, y: 250, w: 130, color: teal}
            - {use: rain-cloud, x: 330, y: 24, w: 150}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - רשמי על הלוח את מה שעולה מהכיתה, ליד מה שעזר לאפרוח.
          - חשפי את ששת הכוחות אחד־אחד, וחברי כל כוח למשהו שכבר כתוב על הלוח.
          - הזמיני מתנדבים שמזהים את עצמם באחד הכוחות לתת דוגמה מהשנה — רק על עצמם.
      - ask: מה עזר לכם השנה לא להתייאש — ואיך התמודדתם ברגעים של קושי?
      - slide:
          kicker: שישה כוחות · 1–3
          title: הכוחות המסייעים לנו בדרך
          points:
            - חלימה והצבת מטרות ויעדים
            - אמונה בעצמי
            - להתקדם צעד צעד בקצב שלי, בלי לחץ
          verbatim: true
          echo: true
          cue: אחרי שעלו דוגמאות מהכיתה —
          alt: מטרה עם חץ במרכז, ודמות עומדת לידה
          art:
            - {use: target, x: 40, y: 120, w: 320}
            - {use: kid-stand, x: 420, y: 250, w: 130, color: teal}
      - slide:
          kicker: שישה כוחות · 4–6
          title: הכוחות המסייעים לנו בדרך
          points:
            - להכיר ולשמוח בהישגים ובניצחונות הקטנים שהשגתי בדרך
            - תמיכה ועידוד מהסביבה שלי
            - ללמוד מניסיון העבר כשהיה קשה ובכל זאת הצלחתי
          verbatim: true
          echo: true
          cue: ועוד שלושה —
          alt: שתי ידיים מושטות זו לזו, וכוכב מעליהן
          art:
            - {use: hands-help, x: 120, y: 190, w: 320}
            - {use: star, x: 420, y: 40, w: 150}
      - say: אז מה שעזר לך זה ___ — הבנתי נכון? למי עוד זה עזר השנה?
      - say: על הכוחות האלה נמשיך לדבר בקרוסלה — בזוגות, ובכל סבב עם חבר אחר.

  # ------------------------------------------------------------------ 13′–22′
  - id: carousel
    title: קרוסלה — להתבונן על השנה שהייתה
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      שני מעגלים, פנים מול פנים; בכל סבב מישהו מושך קלף ומקריא, כל זוג משתף, והמעגל הפנימי זז כיסא אחד;
      במליאה — מה למדתי על עצמי ועל החבר
    body:
      - moves:
          - >-
            הסבירי את כל המהלך לפני שקמים: שני מעגלים, קלף בכל סבב, שיתוף בזוג — ואז המעגל הפנימי זז כיסא
            אחד ימינה.
          - בדקי הבנה בשאלה אחת (״מי זז אחרי כל סבב?״), ויוצאים לשני המעגלים.
          - בכל סבב תלמיד אחר מושך קלף מהערימה ומקריא אותו בקול. אחרי דקה — הזכירי להחליף מי מדבר.
          - ארבעה סבבים. אחר כך נשארים במעגלים לשאלה אחת במליאה.
      - slide:
          kicker: קרוסלה · זוג חדש בכל סבב
          title: להתבונן על השנה שהייתה
          sub: קלף אחד בכל סבב. כל אחד משתף את בן הזוג — ואז המעגל הפנימי זז.
          timer: 90
          echo: true
          alt: מעגל פנימי ומעגל חיצוני של דמויות, קלפים במרכז, וחץ שמראה שהמעגל הפנימי זז
          art: {file: art/carousel.svg}
      - say: >-
          בכל סבב מישהו מושך קלף ומקריא אותו, וכל זוג משתף זה את זה. מספרים רק על עצמנו ומקשיבים בלי לשפוט —
          ומי שהקלף לא מתאים לו, מספר על רגע אחר מהשנה.
      - task:
          what: >-
            בכל סבב תלמיד אחר מושך קלף ומקריא את ההיגד בקול. כל זוג — אחד מהמעגל הפנימי ואחד מהחיצוני — משתף
            זה את זה במה שההיגד מעורר. בסוף הסבב המעגל הפנימי זז כיסא אחד ימינה, ומתחילים סבב חדש עם בן זוג
            חדש.
          time: דקה וחצי לכל סבב — ארבעה סבבים
          group: שני מעגלים, פנים מול פנים; זוג חדש בכל סבב
          rules: >-
            כל אחד מדבר בתורו, בערך חצי דקה; מקשיבים בלי לשפוט, ומה שנאמר בזוג נשאר בזוג; מותר לוותר על קלף
            ולספר על רגע אחר מהשנה
          plenary: שניים־שלושה מספרים מה למדו על עצמם, או על חבר, מתוך השיחות
          help: התחילו ב״השנה…״, ותנו דוגמה אחת — מרגע אחד.
          challenge: שאלו את בן הזוג שאלה אחת על מה שסיפר — ומה זה לימד אותו על עצמו.
      - handout:
          title: קלפים לקרוסלה — להתבונן על השנה שהייתה
          copies: עותק אחד, גזור ל־17 קלפים
          verbatim: true
          lines: false
          items:
            - תפקיד שלקחתי על עצמי בבית או בבית הספר
            - משהו שעשיתי למען חבר/ים מהכיתה
            - מה בחרתי לעשות כשנתקלתי בקושי
            - מה עזר לי להיות אחראי/ת יותר בתחום הלימודי ובכלל?
            - מה אמרתי לעצמי, כדי לעודד את עצמי להמשיך ולהתמיד?
            - מקרה שבו עודדתי אחרים להמשיך לנסות ולא לוותר
            - מה עזר לי להמשיך לנסות כשנתקלתי בקושי באחד המקצועות?
            - מה או מי עזרו לי להתמיד במשימות או ביעדים?
            - מחשבות טובות, בראש ובלב, שנתנו לי כוח במהלך השנה
            - במבט על השנה שחלפה, למי אני רוצה להודות ועל מה?
            - המשאלה שלי לשנה הבאה...
            - השנה, האמנתי שאוכל להצליח ב... ומה שעזר לי...
            - מיהן הדמויות או מהם הדברים שעודדו אותי בעת הצורך במהלך השנה?
            - דברים חדשים שלמדתי והתנסיתי בהם במהלך השנה
            - משהו שאני רגיל/ה לעשות ובשנה הבאה ארצה לעשות אותו בדרך אחרת
            - דברים חדשים שגיליתי על עצמי בשנה שחלפה בתלמיד/ה ויעזרו לי גם בשנה הבאה
            - דברים חדשים שגיליתי על עצמי בשנה שחלפה בחבר/ה ויעזרו לי גם בשנה הבאה
      - slide:
          kicker: קרוסלה · במליאה
          title: מה למדתם על עצמכם מתוך השיחות?
          sub: ומה למדתם על החברים שדיברתם איתם?
          echo: true
          cue: אחרי הסבב הרביעי —
          alt: שתי דמויות יד ביד, ושתי בועות צ׳אט מעליהן
          art:
            - {use: pair, x: 60, y: 200, w: 280}
            - {use: chat, x: 350, y: 40, w: 230}
      - ask: מה למדתם על עצמכם מתוך השיחות — ומה למדתם על חבר?
      - say: הסתכלנו אחורה, על השנה שעברה. עכשיו מסתכלים קדימה — לשנה הבאה, בחטיבה.

  # ------------------------------------------------------------------ 22′–27′
  - id: goal
    title: יעד לשנה הבאה
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: >-
      כל אחד כותב יעד שהשיג השנה, ויעד שהוא בוחר לשנה הבאה בחטיבה — ומה או מי יעזור לו; שניים־שלושה
      משתפים
    body:
      - slide:
          kicker: יעד לשנה הבאה · לבד, בכתב
          title: מה השגתם השנה — ולאן ממשיכים?
          points:
            - יעד חשוב שהשגתי השנה
            - יעד שאני בוחר/ת להציב לעצמי לשנה הבאה - בחטיבה.
            - מה/מי יוכל לעזור לי להשיגו?
          verbatim:
            - points
          timer: 180
          echo: true
          alt: מטרה עם חץ במרכז, ובית ספר לידה
          art:
            - {use: target, x: 30, y: 150, w: 300}
            - {use: school, x: 370, y: 60, w: 220}
      - moves:
          - חוזרים למקומות. הציגי את השקף — שלוש דקות של כתיבה לבד, במחברת או על דף שלוקחים הביתה.
          - הסתובבי בין השולחנות. מי שתקוע — הפני אותו לכוחות שעל הלוח.
          - הזמיני שניים־שלושה לשתף את היעד לשנה הבאה ומי יעזור להם. הדהדי כל יעד, וחברי אותו לכוח מהלוח.
      - say: >-
          שלוש דקות, לבד. כתבו יעד אחד שהשגתם השנה, ויעד שאתם בוחרים לשנה הבאה, בחטיבה — ומה או מי יעזור לכם
          להשיג אותו.
      - ladder:
          help: חשבו על משהו קטן שהצלחתם בו השנה — בלימודים, עם חברים או בחוג. מה הצעד הבא שלו?
          challenge: כתבו גם את הצעד הראשון בדרך ליעד — מה תעשו כבר בשבוע הראשון בחטיבה?
      - ask: מי מוכן לשתף את היעד שלו לשנה הבאה — ומי או מה יעזור לו להשיג אותו?

