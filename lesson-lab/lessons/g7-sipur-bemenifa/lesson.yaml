sub: >-
  לפעמים מסתדרים לבד, ולפעמים צריכים מישהו כדי להרגיש מחוברים. בשיעור הזה נזכרים בילדות, בודקים מה
  מרוקן ומה ממלא את הסוללה הפנימית שלנו, וכותבים יחד מניפה של הצעות לשאלות אמיתיות של בני הגיל.
format: שלישיות, קבוצות ומליאה
question: מה ממלא את הסוללה הפנימית שלנו — ואיך אפשר לעזור למלא אותה זה לזה?
takeaways:
  - >-
    לכל אחד מאיתנו יש סוללה פנימית: היא מתמלאת כשאנחנו מרגישים מחוברים לאנשים סביבנו, ומתרוקנת כשלא
    מצליחים להתחבר.
  - לפעמים מסתדרים לבד, ולפעמים צריכים מישהו או משהו כדי להרגיש מחוברים — וזה טבעי.
  - ביחד ככיתה יש לנו שפע של רעיונות, ויש בכוחנו לעזור ולתמוך זה בזה.
prep:
  - >-
    חלוקה מראש לקבוצות של 4–5 לפי השולחנות, וסדר ההעברה בכל קבוצה (עם כיוון השעון); בכל קבוצה כל אחד
    מקבל דף עם שאלה אחרת
  - פתקים דביקים, כמה לכל קבוצה (להרחבה ״מניפת רעיונות״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — בדידות וקושי להתחבר, בחודשים הראשונים בחטיבה. שאלי אם יש בכיתה מי
      שעוד לא מצא חברים, תלמיד חדש, או מי שנדחה לאחרונה מחבורה — שאלות המניפה, כמו ההרגשה של להיות לבד
      בבית הספר, קרובות אליהם מכולם. בקשי שתהיה זמינה אחרי השיעור, וסכמי איתה מה עושים עם כרטיס יציאה
      שמספר על בדידות.
  - head: מי עלול להיפגע
    text: >-
      מי שבאמת לבד בכיתה עלול לשמוע את שאלות המניפה כאילו נכתבו עליו. אמרי מראש שהן שאלות אמיתיות של בני
      נוער ממקומות אחרים, ושהדפים מחולקים לפי סדר קבוע — לאף אחד אין ״שאלה משלו״. ההצעות מקופלות ובלי
      שמות, ובכל זאת עלולה להופיע הצעה עוקצנית: הסתובבי בזמן הסבבים, ובמליאה הקריאי רק הצעות שקראת
      בעצמך. ובפתיחה — לא לכל אחד היו הורים בשער הגן; אמרי ״ההורים, או מי שהביא אתכם״.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. על הסוללה שמתרוקנת כל אחד חושב
      לעצמו, בלי לשתף. במליאה מדברים רק מתנדבים, ומקריאים הצעות — לא סיפורים ולא שמות. מותר לוותר, גם על
      ההצבעה בפתיחה, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל תלמיד שאומר שאין לו אף חבר או שמחרימים אותו, או הצעה במניפה שפוגעת במישהו מהכיתה — עוצרים
      בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים
      לשמור בסוד.

time:
