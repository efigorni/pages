steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: כשהיינו ילדים
    minutes: 5
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: הצבעה באגודלים על ארבע שאלות מהילדות, החפץ שמלווה אותנו היום, ושלוש השורות של ״לפעמים…״
    body:
      - slide:
          kicker: מה הקשר? · אגודל למעלה — כן, למטה — לא
          title: כשהיינו ילדים…
          points:
            - מי מכם כשהיה בגן, רצה להיכנס לבד לגן?
            - למי היה קשה להיפרד מההורים בבוקר?
            - מי היה בחוג / תנועת נוער עם לפחות חבר/ה אחד?
            - למי מכם היה חפץ אהוב בילדות שליווה אתכם לכל מקום?
          verbatim:
            - points
          echo: true
          alt: ילד קטן בדרך אל דלת פתוחה, ומבוגר מחכה לידה
          art:
            - {use: teacher, x: 24, y: 220, w: 140, color: moss}
            - {use: door, x: 170, y: 206, w: 200}
            - {use: kid-stand, x: 450, y: 300, w: 100, color: teal}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. הסבירי את ההצבעה — ומי שלא בטוח מחזיק את האגודל באמצע.
          - >-
            חשפי את השאלות אחת־אחת והקריאי כל אחת. כולם מצביעים יחד; תארי במילים מה רואים (״הרבה אגודלים
            למעלה!״), בלי לשאול מי ולמה.
          - בשאלה על החפץ של היום — כל אחד לוחש לשכן, ואז שמעי שלוש־ארבע תשובות.
          - הציגי את ״לפעמים…״, והקריאי את שלוש השורות.
      - say: >-
          נתחיל במשחק קצר על הילדות שלכם. אקרא שאלה — אגודל למעלה אם כן, אגודל למטה אם לא. כולם מצביעים
          יחד.
      - slide:
          kicker: ומה היום?
          title: מהו החפץ שמלווה אתכם כיום לכל מקום?
          verbatim:
            - title
          echo: true
          cue: אחרי השאלה הרביעית —
          alt: דמות חושבת, ובענן המחשבה שלה סימן שאלה
          art:
            - {use: thought, x: 40, y: 24, w: 300}
            - text: '?'
              x: 193
              y: 146
              size: 110
            - {use: kid-stand, x: 330, y: 210, w: 150, color: teal}
      - ask: ומה איתכם היום — מהו החפץ שמלווה אתכם לכל מקום? לחשו לשכן.
      - slide:
          kicker: כשהיינו ילדים — וגם היום
          title: לפעמים…
          points:
            - לפעמים אנחנו מסתדרים לבד
            - לפעמים אנחנו צריכים מישהו להיות איתו
            - ולפעמים אנחנו צריכים חפץ או אדם כדי להרגיש מחוברים
          verbatim: true
          echo: true
          cue: אחרי התשובות —
          alt: דמות לבד, זוג יד ביד, וטלפון
          art:
            - {use: kid-stand, x: 470, y: 280, w: 110, color: teal}
            - {use: pair, x: 190, y: 238, w: 240}
            - {use: phone, x: 40, y: 250, w: 100}
      - say: >-
          ולרובנו, החפץ שמלווה אותנו היום הוא הטלפון. אז בואו נדבר עליו — ועל מה שקורה כשהסוללה שלו
          נגמרת.

  # ------------------------------------------------------------------ 5′–9′
  - id: phone
    title: להיות מחוברים
    minutes: 4
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: בשלישיות — מה קורה כשהסוללה בטלפון נגמרת, ולמה כל כך חשוב להיות מחוברים
    body:
      - slide:
          kicker: בשלישיות · 3 דקות
          title: להיות מחוברים
          points:
            - איך אתם מרגישים כשהסוללה נגמרת?
            - מה אתם עושים אם הסוללה נגמרה, ואין לכם דרך להטעין אותה?
            - למה זה חשוב להיות מחובר?
          verbatim: true
          timer: 180
          echo: true
          alt: סוללה כמעט ריקה, ומתחתיה שלוש דמויות
          art:
            - {use: battery-low, x: 135, y: 40, w: 350}
            - {use: group3, x: 185, y: 310, w: 250}
      - moves:
          - הסבירי את המשימה, ורק אז שלחי לשלישיות עם השכנים. חשפי את שלוש השאלות — הן נשארות על המסך.
          - הסתובבי בין השלישיות. דקה לפני הסוף — הודיעי.
          - במליאה — שתי שלישיות מספרות מה היה משותף לכולן.
      - say: >-
          שלוש דקות בשלישיות, עם השכנים. כל אחד עונה — ומי שאין לו טלפון, חשבו על מכשיר אחר שצריך
          להטעין.
      - task:
          what: כל אחד בשלישייה עונה על שלוש השאלות שעל המסך, ושומע את התשובות של השניים האחרים.
          time: 3 דקות
          group: שלישיות עם השכנים
          rules: כל אחד מדבר על עצמו; מי שמסיים מוקדם מחפש מה משותף לשלושה
          plenary: שתי שלישיות מספרות מה היה משותף לכולן
          help: חשבו על הפעם האחרונה שהסוללה נגמרה לכם — איפה הייתם, ומה עשיתם?
          challenge: למה לדעתכם אומרים ״להיות מחובר״ — למה בעצם אנחנו רוצים להיות מחוברים?
      - ask: רובנו מחוברים רוב שעות היום לטלפון שלנו. ואתם?
      - say: ולא רק לטלפון יש סוללה. בואו נבדוק את הסוללה שבתוכנו.

  # ------------------------------------------------------------------ 9′–15′
  - id: inner
    title: הסוללה הפנימית שלי
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      שאלה לחשוב עליה בשקט, שני טורים על הלוח — מה מרוקן אותנו ומה ממלא — וההסבר של המקור על הסוללה
      הפנימית
    body:
      - slide:
          kicker: הסוללה הפנימית שלי · לעצמכם
          title: הרגשתם פעם שהסוללה הפנימית שלכם מתרוקנת?
          sub: איך זה מרגיש? חושבים לבד — בלי לשתף.
          echo: true
          alt: דמות, ובענן המחשבה שלה סוללה כמעט ריקה
          art:
            - {use: thought, x: 36, y: 20, w: 310}
            - {use: battery-low, x: 119, y: 103, w: 150}
            - {use: kid-stand, x: 360, y: 225, w: 140, color: teal}
      - moves:
          - שאלי, וחכי עשר שניות של שקט. על השאלה הזאת לא עונים בקול.
          - >-
            עברי לשקף הבא, ושרטטי על הלוח שני טורים — ״מרוקן״ ו״ממלא״. ספרי בלב עד עשר, ורק אז הזמיני
            דוגמאות לכל טור.
          - >-
            על כל דוגמה — הדהדי (״אז מה שממלא אותך זה ___ — הבנתי נכון?״), ושאלי את הכיתה ״מי מסכים? ולמי
            זה דווקא מרוקן?״
          - בסוף הקריאי את ההסבר מהמקור, וחברי אותו לשני הטורים.
      - ask: חשבו לעצמכם, בלי לשתף — הרגשתם פעם שהסוללה הפנימית שלכם מתרוקנת? איך זה הרגיש?
      - slide:
          kicker: הסוללה הפנימית שלי · שני טורים
          title: מה מרוקן אותנו? מה ממלא אותנו בתחושה טובה?
          verbatim:
            - title
          echo: true
          cue: אחרי עשר שניות של שקט —
          alt: דמות בין סוללה ריקה לסוללה מלאה
          art:
            - {use: battery-low, x: 404, y: 130, w: 196}
            - {use: kid-stand, x: 235, y: 205, w: 150, color: teal}
            - {use: battery-full, x: 20, y: 130, w: 196}
      - ask: מה מרוקן אותנו — ומה ממלא אותנו בתחושה טובה?
      - slide:
          kicker: הסוללה הפנימית שלי
          title: גם לנו יש סוללה פנימית
          sub: כשמרגישים מחוברים לאנשים סביבנו — היא מתמלאת.
          echo: true
          cue: כשמקריאים את ההסבר —
          alt: שלוש דמויות יחד, ומעליהן סוללה מלאה
          art:
            - {use: battery-full, x: 190, y: 50, w: 240}
            - {use: group3, x: 130, y: 235, w: 360}
      - quote:
          title: ההסבר מהמקור — להקריא
          text: >-
            כמו בפלאפון, גם לנו יש סוללה פנימית. כאשר אנו מרגישים מחוברים לאנשים סביבנו, הסוללה שלנו
            מתמלאת באנרגיה, בטחון עצמי ותחושת מסוגלות. כשאנחנו רוצים, אבל לא מצליחים להתחבר לחברים,
            הסוללה שלנו מתרוקנת, ואנחנו מרגישים עייפים, חסרי אנרגיה, מצב הרוח נעשה ירוד ועוד... אנחנו
            רוצים להיות מחוברים, ופועלים לשם כך.
      - say: >-
          כשאנחנו מחוברים לאנשים סביבנו, הסוללה מתמלאת. עכשיו ננסה למלא קצת את הסוללה של אחרים — בכתב.

  # ------------------------------------------------------------------ 15′–23′
  - id: fan
    title: סיפור במניפה
    minutes: 8
    practices:
      - הוצאה למשימה
      - כולם כותבים
    spotlights:
      - שיתופיות בלמידה
    summary: >-
      בקבוצות — כל אחד כותב שורה של הצעה לשאלה של בן הגיל, מקפל ומעביר; בכל סבב דף חדש, עד שהדף חוזר
      למי שהתחיל אותו
    body:
      - moves:
          - >-
            הסבירי את כל המהלך לפני שמחלקים דפים, והדגימי על דף אחד — כותבים שורה, מקפלים אותה אחורה,
            ומעבירים.
          - חלקי את הדפים כך שבכל קבוצה כל אחד מקבל שאלה אחרת, והפעילי את הטיימר — דקה לסבב.
          - בכל סבב — ״מקפלים ומעבירים״, והפעילי את הטיימר מחדש. הסתובבי בין הקבוצות והציצי בשורות שנכתבות.
          - אחרי הסבב האחרון הדפים חוזרים למי שהתחיל אותם — עדיין מקופלים.
      - slide:
          kicker: סיפור במניפה · שאלות אמיתיות של בני הגיל
          title: הצעה אחת — באורך שורה
          points:
            - קראו את השאלה שבראש הדף.
            - כתבו הצעה לפתרון — באורך שורה.
            - קפלו — כך שרק השאלה גלויה.
            - העבירו את הדף לבא אחריכם.
          timer: 60
          echo: true
          alt: דף מקופל כמו מניפה, עיפרון שכותב בשורה האחרונה, וחץ שמעביר אותו הלאה
          art: {file: art/fold.svg}
      - say: >-
          על כל דף יש שאלה אמיתית שכתבו בני נוער בגילכם — לא מישהו מהכיתה. כתבו את ההצעה שהייתם רוצים
          לקבל, באורך שורה, קפלו אותה והעבירו.
      - task:
          what: >-
            כל אחד מקבל דף עם שאלה בראשו, וכותב הצעה אחת לפתרון — באורך שורה. מקפלים את השורה כך שרק השאלה
            גלויה, ומעבירים לבא בתור. בכל סבב — דף חדש ושאלה חדשה.
          time: דקה לכל סבב — סבב לכל אחד בקבוצה
          group: קבוצות של 4–5 לפי השולחנות; מעבירים עם כיוון השעון
          rules: בלי שמות; כותבים הצעה שהייתם רוצים לקבל; לא פותחים קיפולים של אחרים
          plenary: אין — בסוף הדף חוזר למי שהתחיל אותו, ופותחים אותו בשלב הבא
          help: מה עזר לכם פעם, כשהייתם חדשים במקום כלשהו?
          challenge: כתבו הצעה עם צעד ראשון קטן — מה עושים כבר מחר, ואיפה.
      - handout:
          title: דפי המניפה
          copies: >-
            דף לכל תלמיד: שאלה אחת בראש דף ריק (מודפסת או בכתב יד), וכל שאלה בשלושה–ארבעה עותקים
          verbatim: true
          lines: false
          items:
            - אני תלמיד/ה חדש/ה בבית הספר ולא יודע/ת איך להכיר חברים
            - ניסיתי ליצור קשר עם ילדים אבל לא הצלחתי
            - אני רוצה לגשת אבל מתבייש/ת
            - אני מרגיש/ה לבד בבית הספר
            - איפה/איך אפשר להרחיב קצת את מעגל החברים?
            - קשה לי להתחיל לדבר עם אנשים חדשים
            - איך לחדש קשר עם חבר/ה מהעבר?
            - איך מוצאים חברים אמיתיים?
            - איך אפשר לדבר עם חברים על נושא שעלול לפגוע / להרגיז?
            - מה זה חבר/ה טוב/ה?
      - say: מקפלים ומעבירים — דף חדש, שאלה חדשה.
      - say: הדף חוזר עכשיו למי שהתחיל אותו. עוד לא פותחים.

