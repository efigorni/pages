                    למליאה.
                  time: 4 דקות
                  group: מי שעמדו ליד אותו כרטיס, עד חמישה בקבוצה; מי שעמד לבד מצטרף לסיבה קרובה
                  rules: מדברים על בני נוער, לא על מישהו בשם; כל אחד אומר משהו, ומותר לוותר על תור
                  plenary: נציג מכל קבוצה מרים את הכרטיס, אומר את הסיבה ונימוק אחד — חצי דקה לקבוצה
                  help: מתי בני נוער מרגישים את הסיבה הזאת הכי חזק — איפה, ועם מי?
