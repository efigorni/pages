sub: >-
  יש מי שמתחיל לעשן ויש מי שלא — ולכל אחד הסיבות שלו. בשיעור הזה בודקים מה אנחנו מרגישים וחושבים על
  עישון, מה משפיע על הבחירה להתחיל, ומה היינו אומרים לחבר שהתחיל.
format: מליאה, קבוצות לפי בחירה וזוגות
question: מה משפיע על הבחירה להתחיל לעשן — ואיך הבחירה נשארת בידיים שלי?
takeaways:
  - הרבה דברים משפיעים על הבחירה להתחיל לעשן — חברים, סקרנות, הרצון להרגיש שייך, בוגר או מיוחד.
  - כל אחד נותן משקל אחר לכל סיבה, ולכן כדאי לברר עם עצמנו מה אנחנו חושבים ומרגישים.
  - להתחיל לעשן או לא — זו בחירה, ואפשר להתכונן אליה לפני שמגיע הרגע.
prep:
  - >-
    על הלוח, לפני השיעור: טבלה של שני טורים להצבעה על ההיגדים — מספרי ההיגדים 1–9, וטור ריק לספירה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — הסיבות שבגללן בני נוער מתחילים לעשן. שאלי אם יש בכיתה מי שכבר מעשן או
      מתנסה, מי שמעשנים אצלו בבית, או מי שחבר קרוב שלו התחיל לעשן לאחרונה. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שמעשנים אצלו בבית עלול לשמוע בשאלה ״מה אתם מרגישים?״ מילים קשות על אנשים שהוא אוהב — כווני את השיחה
      לרגשות כלפי העשן והמצב, לא כלפי המעשנים. בבחירת הסיבה שואלים מה הכי משפיע על בני נוער, ולא ״למה
      היית מתחיל״ — כך אף אחד לא מסמן את עצמו. ובשאלת החבר שהתחיל לעשן — מדברים על מה היינו אומרים, לא על מי.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. ההצבעה על ההיגדים — בעיניים עצומות,
      והבחירה במחברת לא נאספת. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל שהוא כבר מעשן ולא מצליח להפסיק, שלוחצים עליו לעשן, או שמעשנים לידו בבית והוא סובל — עוצרים
      בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור
      בסוד.
  - head: עמידה מול הכיתה
    text: >-
      במסלול ״כרטיסים על הרצפה״ נעמדים ליד סיבה. העמידה היא על מה שמשפיע על בני נוער, לא על מה שאני עושה —
      אמרי את זה לפני שזזים. מותר לעמוד בין שני כרטיסים; מסבירים רק מתנדבים, ורק על עצמם. צחוק על מקום של
      מישהו — עוצרים מיד.

