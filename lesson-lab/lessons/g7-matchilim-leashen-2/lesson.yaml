                  - >-
                    מי שעומדים ליד אותו כרטיס — מתיישבים יחד לשיחה. מי שעומד לבד ליד כרטיס — בוחר קבוצה של סיבה
                    קרובה.
                  - ארבע דקות של שיחה. הסתובבי בין הקבוצות, ודקה לפני הסוף — הודיעי.
