  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ארבעת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              גורמים שונים משפיעים על קבלת ההחלטה לעשן או לא לעשן. הם מעצבים את המחשבות, הרגשות, העמדות
              וההתנהגות שלנו.
            - >-
              אנשים שונים מייחסים משמעות או חשיבות שונה לגורמים שונים המשפיעים עליהם בבחירה לעשן או לא לעשן.
              (לדוגמה — יש מי שיבחר לא לעשן מתוך מחשבה על הסביבה או על הבריאות האישית).
            - >-
              חשוב לעצור ולברר לעצמנו מה אנו חושבים ומרגישים כלפי התנהגויות או תופעות, במיוחד אם הן כאלה שיכולות
              לסכן אותנו. התהליך שעברנו בשיעור מהווה הזדמנות לעצור ולברר לעצמנו מדוע אנחנו בוחרים לעשן או לא לעשן.
            - >-
              הגברת המודעות תסייע לנו בקבלת החלטות ובהתמודדות במצב עצמו (לדוגמה — סיגריות אלקטרוניות הפכו לסמל
              סטטוס של כל החבר׳ה ה״נחשבים״, גם אם אני מתנגד לעישון, ייתכן שכדי להיות ביניהם ארצה לעשן, לכן כדאי
              שאתכונן מראש לסיטואציה).
          ask: איזה משפט מהארבעה הכי חשוב לכם לזכור? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהגורמים שמשפיעים על כולנו (1–2), אל הבירור עם עצמנו (3), ואל ההכנה מראש לרגע עצמו (4).
          alt: רמזור גדול, ודמות עומדת לידו
          art:
            - {use: traffic-light, x: 330, y: 100, w: 170}
            - {use: kid-stand, x: 110, y: 160, w: 140, color: teal}

