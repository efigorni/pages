steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: feel
    title: מה אני מרגיש?
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית כשנכנסים — מישהו מעשן נכנס לחדר, מה אני מרגיש? אוספים מילות רגש על הלוח
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: מישהו נכנס עכשיו לחדר עם סיגריה דולקת
          sub: מה אתם מרגישים? כתבו שלוש מילים.
          timer: 120
          echo: true
          alt: דמות יושבת ומסתכלת על סיגריה עם עשן, ומעליה ענן מחשבה ובו פנים
          art:
            - {use: kid-sit, x: 70, y: 250, w: 176, color: teal}
            - {use: thought, x: 200, y: 24, w: 270, flip: true}
            - {use: face-meh, x: 290, y: 66, w: 110}
            - {use: cigarette, x: 430, y: 400, w: 150}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת, וכותבים בלי הסבר נוסף. בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות.
          - >-
            שמעי חמש–שש תשובות, ורשמי על הלוח את מילות הרגש. כשעולה תיאור של המעשן (״מגעיל״, ״מסריח״) — כווני
            לרגש: ״ומה זה עושה לך — כעס, דאגה, אכפת?״
          - שאלי מה משותף למילים שעל הלוח, ומה שונה ביניהן.
      - say: שתי דקות, לבד ובשקט. אין תשובה נכונה — רק מה שאתם מרגישים.
      - ladder:
          help: חשבו על פעם שמישהו עישן לידכם — בתחנה, ברחוב או באירוע. מה הרגשתם?
          challenge: יש לכם יותר מרגש אחד, אולי אפילו רגשות הפוכים? כתבו את שניהם.
      - ask: מה משותף לרגשות שעל הלוח — ומה שונה ביניהם?

  # ------------------------------------------------------------------ 5′–11′
  - id: think
    title: מה אני חושב?
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      תשעה היגדים על עישון — כל אחד בוחר בשקט את ההיגד הכי קרוב אליו, מצביעים בעיניים עצומות, ומדברים על
      התמונה של הכיתה
    body:
      - slide:
          kicker: מה אני חושב? · לבד, בשקט
          title: איזה היגד הכי קרוב למה שאתם חושבים?
          sub: קראו את תשעת ההיגדים, ורשמו במחברת את המספר של אחד.
          echo: true
          alt: דף עם שורות, וי גדול בפינתו ועיפרון לידו
          art:
            - {use: note, x: 190, y: 90, w: 230}
            - {use: check, x: 360, y: 300, w: 140}
            - {use: pencil, x: 60, y: 330, w: 150}
      - handout:
          title: מה אני חושב?
          copies: עותק לכל זוג
          verbatim: true
          lines: false
          items:
            - העישון מסכן את הבריאות ולכן יש צורך לאסור אותו על פי חוק.
            - >-
              הנרגילה מחברת בין אנשים ומקרבת אותם אחד לשני, היא בטעם פירות, הם מהווים מרכיב מומלץ לצריכה לכן
              איננה מסוכנת.
            - מי שמעשן הוא in.
            - העישון מאפשר להתמודד עם כעסים ומפחית לחצים.
            - המעשן הוא חלש אופי.
            - המעשן נתפס ע״י החברה כחזק, כמקובל וכמצליח.
            - עישון הוא עניינו האישי של כל אדם ואין לחברה זכות להתערב בכך.
            - העישון הוא סמל לבגרות אמיתית.
            - סיגריה אלקטרונית מוצעת כאמצעי לגמילה מעישון, אז מה הבעיה? היא לא ממכרת.
      - moves:
          - >-
            חלקי דף לכל זוג. כל אחד קורא לבד ורושם במחברת את המספר של ההיגד שהכי קרוב למה שהוא חושב — בשקט, בלי
            להתייעץ.
          - >-
            הצבעה בעיניים עצומות: קראי את המספרים אחד־אחד, ומי שבחר בהיגד מרים יד. רשמי בטבלה שעל הלוח כמה הצביעו
            לכל היגד.
          - פוקחים עיניים. שאלי מה רואים בטבלה, והזמיני את הכיתה להגיב זה לזה — ״מי מסכים? למה?״
          - >-
            בסוף — גם אם אף אחד לא בחר בהם — אמרי בקצרה שהיגדים 2 ו־9 הם מיתוסים: בנרגילה בטעם פירות יש טבק,
            וטעם הפירות הוא חומרי טעם וריח שמטפטפים עליו; ובסיגריה אלקטרונית יש בדרך כלל ניקוטין — והניקוטין ממכר.
      - say: בוחרים לבד, ומצביעים בעיניים עצומות — כדי שאף אחד לא יושפע מהשכנים.
      - ladder:
          help: קראו כל היגד ושאלו את עצמכם — מסכים, לא מסכים, או לא בטוח?
          challenge: בחרו היגד שאתם לא מסכימים איתו, וכתבו משפט אחד שעונה לו.
      - ask: מה אתם רואים בטבלה? מה מפתיע אתכם — ומי רוצה להגיב למה שנאמר?

  # ------------------------------------------------------------------ 11′–22′
  - id: reasons
    title: בחרי מסלול — מה משפיע על הבחירה לעשן?
    minutes: 11
    stance: true
    summary: >-
      כל אחד בוחר סיבה אחת שמשפיעה על בני נוער להתחיל לעשן; מי שבחרו באותה סיבה מדברים יחד, ומציגים נימוק
      אחד למליאה
    body:
      - tracks:
          - title: בוחרים מהלוח
            text: >-
              שלוש־עשרה הסיבות כתובות על הלוח. כל אחד רושם בשקט את המספר של הסיבה שלדעתו הכי משפיעה, ומי שבחרו
              באותה סיבה מתיישבים יחד לשיחה.
            when: הכיתה צפופה מכדי להסתובב, או שרוצים שהבחירה תישאר במחברת עד שמתיישבים.
            practices:
              - כולם כותבים
              - הוצאה למשימה
            spotlights:
              - אחריות ובחירה
              - שיתופיות בלמידה
            prep:
              - שלוש־עשרה הסיבות — כתובות על הלוח לפני השיעור, ממוספרות
            body:
              - slide:
                  kicker: מה משפיע? · לבד, ואז בקבוצות
                  title: מה הכי משפיע על בני נוער להתחיל לעשן?
                  sub: בחרו סיבה אחת מהלוח, ורשמו את המספר שלה ומשפט אחד — למה.
                  timer: 60
                  echo: true
                  alt: לוח גדול, ודמות מרימה יד לידו
                  art:
                    - {use: board, x: 200, y: 60, w: 380}
                    - {use: kid-hand, x: 50, y: 230, w: 140, color: teal}
              - board:
                  - לא עומדים בפיתוי
                  - סקרנות, רצון לנסות את זה
                  - אנשים מבוגרים קרובים אליי מעשנים
                  - להרשים את החבר׳ה
                  - החבר׳ה היותר גדולים
                  - להרגיש שייך
                  - נקלעים לזה… עושים בלי לחשוב
                  - להרגיש בוגר
                  - לעשות מה שבא לי
                  - זה מה שרואים בטלוויזיה וברשתות החברתיות
                  - להרגיש מיוחד
                  - לעשות מה שעושים החברים
                  - לראות מה זה עושה לי
              - moves:
                  - הציגי את השקף ואמרי מה בוחרים — מה הכי משפיע על בני נוער, לא ״למה אני הייתי מתחיל״.
                  - דקה של בחירה בשקט — כל אחד רושם במחברת את המספר, ומשפט אחד על הסיבה.
                  - >-
                    קראי את המספרים מהלוח אחד־אחד; מי שבחר — קם ומצטרף לשולחן שהצבעת עליו. סיבה שבחר בה רק
                    תלמיד אחד — הוא מצטרף לקבוצה של סיבה קרובה, לבחירתו.
                  - ארבע דקות של שיחה. הסתובבי בין הקבוצות, ודקה לפני הסוף — הודיעי.
                  - במליאה — נציג מכל קבוצה אומר את הסיבה ונימוק אחד.
              - say: >-
                  בחרו את הסיבה שלדעתכם הכי משפיעה על בני נוער בגילנו להתחיל לעשן. אפשר לחשוב על עצמכם, על מישהו
                  שאתם מכירים, או על בני נוער בכלל.
              - slide:
                  kicker: בקבוצות · 4 דקות
                  title: למה הסיבה הזאת משפיעה כל כך?
                  sub: ועל מי? סכמו נימוק אחד למליאה.
                  timer: 240
                  cue: כשהקבוצות יושבות —
                  alt: ארבעה סביב שולחן עגול
                  art:
                    - {use: circle4, x: 150, y: 110, w: 320}
              - task:
                  what: >-
                    כל קבוצה מדברת על הסיבה שבחרה — למה היא משפיעה כל כך, ועל מי — ומסכמת נימוק אחד למליאה.
                  time: 4 דקות
                  group: לפי הסיבה שבחרו, עד חמישה בקבוצה; מי שבחר לבד מצטרף לסיבה קרובה
                  rules: מדברים על בני נוער, לא על מישהו בשם; כל אחד אומר משהו, ומותר לוותר על תור
                  plenary: נציג מכל קבוצה אומר את הסיבה ונימוק אחד — חצי דקה לקבוצה
                  help: מתי בני נוער מרגישים את הסיבה הזאת הכי חזק — איפה, ועם מי?
                  challenge: מה יכול להחליש את הסיבה הזאת — מה היה עוזר למישהו לבחור אחרת?
              - ask: למה דווקא הסיבה הזאת — ומה היא נותנת למי שמתחיל לעשן?
          - title: כרטיסים על הרצפה
            text: >-
              שתים־עשרה הסיבות מודפסות על כרטיסים ומפוזרות בכיתה. כל אחד נעמד ליד הסיבה שלדעתו הכי משפיעה, ומי
              שעומדים יחד מתיישבים לשיחה.
            when: הכיתה צריכה לזוז, ויש מקום לפזר כרטיסים — על הרצפה או על שולחנות בצדי הכיתה.
            practices:
              - זמן חשיבה
              - הוצאה למשימה
            spotlights:
              - אחריות ובחירה
              - שיתופיות בלמידה
            prep:
              - הכרטיסים מפוזרים לפני השיעור על הרצפה או על שולחנות בצדי הכיתה, עם מרווח ביניהם
            body:
              - slide:
                  kicker: מה משפיע? · בתנועה
                  title: איזו סיבה הכי משפיעה על בני נוער?
                  sub: עמדו ליד הכרטיס שלה — ושבו לשיחה עם מי שעומד איתכם.
                  echo: true
                  alt: דמות עומדת בין כרטיסים שמפוזרים על הרצפה
                  art:
                    - {use: kid-stand, x: 235, y: 110, w: 150, color: teal}
                    - {use: note, x: 50, y: 360, w: 110}
                    - {use: note, x: 460, y: 360, w: 110}
                    - {use: note, x: 80, y: 120, w: 110}
              - handout:
