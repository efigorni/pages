steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: guy
    title: גיא בשיעור עברית
    minutes: 6
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      צופים בחלק הראשון של הסרטון — גיא מתקשה לספר למורה מה קשה לו; בזוגות חושבים מה יכול לעזור לו
    body:
      - moves:
          - השקף ״לפני שצופים״ על המסך כשהכיתה נכנסת. שאלי, ושמעי שתיים־שלוש השערות.
          - הפעילי את החלק הראשון, ועצרי בנקודת העצירה לחיזוי.
          - אחרי הצפייה — שאלי מה היה הקושי של גיא, ושמעי שתיים־שלוש תשובות. ואז השאלה בזוגות.
      - video:
          title: ייצוג עצמי — החלק הראשון
          url: https://www.youtube.com/watch?v=mo9M-gMTQeA
          length: "6:06"
          clip:
            end: "1:21"
          before: מה עושים כשמשהו קשה לנו בשיעור — ולא קל להגיד את זה?
          watch: שימו לב לגיא — מה קשה לו, ומה הוא עושה עם זה.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו מורת העברית פונה אל גיא, רגע לפני שהוא עונה לה. צפי בחלק הראשון לפני השיעור, ורשמי כאן את
                הזמן.
              ask: מה גיא יענה לה? מילה אחת, בלחישה לשכן.
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובתוכו ענן גשם
          art:
            - {use: thought, x: 40, y: 30, w: 260}
            - {use: rain-cloud, x: 115, y: 74, w: 110}
            - {use: kid-desk, x: 300, y: 160, w: 270, color: teal}
      - p: את ההמשך רואים בשלב ״גיא מנסה שוב״.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה יכול לעזור לגיא לקבל את העזרה שהוא צריך?
          echo: true
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          cue: אחרי שתיים־שלוש תשובות על הקושי של גיא —
          alt: דמות עומדת, וגלגל הצלה גדול לידה
          art:
            - {use: lifebuoy, x: 80, y: 110, w: 270}
            - {use: kid-stand, x: 400, y: 214, w: 150, color: teal}
      - ladder:
          help: למי גיא יכול לפנות — בבית הספר או בבית?
          challenge: מה גיא יכול להגיד, כדי שהמורה תבין מה בדיוק קשה לו?
      - say: לגיא יש אנשים שאפשר לפנות אליהם — וגם לכל אחד מאיתנו. בואו נראה מי הם אצלנו.

  # ------------------------------------------------------------------ 6′–11′
  - id: map
    title: מפת מעגלי תמיכה
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      לפני שמשתפים — כללי השיח; כל אחד ממפה במחברת למי הוא יכול לפנות — משפחה, בית הספר, חברים, שכנים
      ומכרים
    body:
      - slide:
          kicker: לפני שמשתפים
          title: הנחיות לשיח מיטבי
          sub: שיח מעודד ומקבל
          points:
            - שיתוף מהלב
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
          verbatim: true
          echo: true
          alt: שלוש דמויות, ומעליהן בועת דיבור עם לב
          art:
            - {use: group3, x: 140, y: 268, w: 340}
            - {use: speech, x: 318, y: 28, w: 230}
            - {use: heart, x: 383, y: 58, w: 100}
      - moves:
          - הקריאי את הכללים, נקודה אחר נקודה.
          - הראי את המפה של גיא, וחשפי חלק אחר חלק.
          - >-
            כל אחד מצייר במחברת עיגול בארבעה חלקים, ובמרכז את השם שלו. שלוש דקות של כתיבה בשקט; מי שאין לו
            את מי לכתוב בחלק — משאיר אותו ריק.
          - שאלי מתנדבים את מי כתבו בחלק ״אנשים בבית הספר״ — בתפקיד, לא בשם (״המחנכת״, ״היועצת״).
      - slide:
          title: המפה של גיא
          points:
            - משפחה — אבא ואמא, סבא וסבתא, אחי הגדול, אחותי הקטנה
            - בית ספר — קרן (מחנכת), רותי (יועצת), דפנה (מורת שילוב)
            - חברים — יהלי, איתי ועמית (חברים מהכיתה), רן (בן דוד)
            - שכנים — דורון (שכן), אסף (המדריך בצופים), ד״ר כהן (רופא משפחה)
          echo: true
          cue: אחרי הכללים —
          alt: עיגול בארבעה חלקים — משפחה, בית ספר, חברים, שכנים — ובמרכז גיא
          art: {file: art/support-map-guy.svg}
      - slide:
          kicker: מפת מעגלי תמיכה · לבד
          title: למי אתם יכולים לפנות כשקשה?
          sub: ציירו במחברת עיגול בארבעה חלקים, וכתבו שמות בכל חלק.
          timer: 180
          echo: true
          cue: אחרי המפה של גיא —
          alt: עיגול בארבעה חלקים — משפחה, בית ספר, חברים, שכנים — ובמרכז ״אני״
          art: {file: art/support-map.svg}
      - ladder:
          help: התחילו מהמבוגרים שאתם פוגשים כל יום — בבית ובבית הספר.
          challenge: סמנו בכל חלק את מי שהכי קל לכם לפנות אליו — ומה עושה את זה קל.
      - ask: את מי כתבתם בחלק ״אנשים בבית הספר״? ספרו רק את התפקיד — לא את השם.
      - say: יש לנו אנשים לפנות אליהם. אבל איך פונים — כך שבאמת ישמעו אותנו? בואו נבדוק.

  # ------------------------------------------------------------------ 11′–17′
  - id: triads
    title: איך פונים כך שישמעו?
    minutes: 6
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: >-
      בשלשות כל אחד מספר על אירוע של קושי — מה עשה, ומה עוד אפשר; במליאה אוספים על הלוח איך פונים כך
      שהבקשה תישמע
    body:
      - moves:
          - הסבירי את המשימה לפני שעוברים לשלשות. השאלות כבר על הלוח.
          - הזכירי — בוחרים אירוע שנוח לספר עליו, גם קטן — שיעורי בית, ריב עם חבר, משהו בחוג.
          - הסתובבי בין השלשות. דקה לפני הסוף — בקשי מכל שלשה הצעה אחת לשאלה האחרונה.
          - >-
            במליאה — רשמי על הלוח את ההצעות. אם חסר, השלימי מהמקור — עיתוי מתאים, פנייה מנומסת, הסבר מפורט על
            הקושי, הצעת פתרון.
      - slide:
          kicker: בשלשות · 4 דקות
          title: אירוע שבו נתקלתם בקושי
          sub: מה קרה? מה עשיתם? מה עוד אפשר לעשות? — השאלות על הלוח.
          timer: 240
          alt: שלוש דמויות יחד, ובועת דיבור עם ענן גשם מעליהן
          art:
            - {use: group3, x: 120, y: 254, w: 360}
            - {use: speech, x: 372, y: 26, w: 210}
            - {use: rain-cloud, x: 429, y: 50, w: 96}
      - board:
          - מה קרה? מה עשיתם כדי להתמודד עם הקושי?
          - מה עוד אפשר לעשות במצב שתיארתם? רשמו הצעות מחברי הקבוצה.
          - איך כדאי לפנות לאחר — למורה, לחבר, להורה — כך שהבקשה תישמע ותתקבל?
      - say: >-
          בשלשות: כל אחד מספר על קושי אחד — מה קרה ומה עשה. השניים האחרים מציעים מה עוד אפשר. בסוף — הצעה
          אחת: איך פונים כך שישמעו?
      - task:
          what: >-
            כל אחד מספר לשלשה על אירוע שבו נתקל בקושי — מה קרה, ומה עשה. השניים האחרים מציעים מה עוד אפשר
            לעשות. בסוף השלשה מנסחת יחד הצעה אחת: איך פונים כך שהבקשה תישמע ותתקבל.
          time: 4 דקות — דקה לכל אחד, ודקה להצעה
          group: שלשות לפי מקומות הישיבה
          rules: מספרים רק על עצמנו, ובוחרים אירוע שנוח לספר עליו; מציעים, לא שופטים
          plenary: כל שלשה אומרת הצעה אחת, ורושמים על הלוח
          help: חשבו על קושי קטן מהשבוע — שיעורי בית, ריב עם חבר, משהו בחוג.
          challenge: נסחו את המשפט הראשון שהייתם אומרים למורה — כך שהיא תבין מיד מה אתם צריכים.
      - ask: איך כדאי לפנות — למורה, לחבר או להורה — כך שהבקשה תישמע ותתקבל?
      - say: אספנו הצעות משלנו. עכשיו נראה מה גיא עושה כשהוא מנסה שוב.

  # ------------------------------------------------------------------ 17′–24′
  - id: guy2
    title: גיא מנסה שוב
    minutes: 7
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: צופים בהמשך הסרטון — גיא לומד כלי ומצליח לבקש מהמורה; משווים למה שרשמנו על הלוח
    body:
