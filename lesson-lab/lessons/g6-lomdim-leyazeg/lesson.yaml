sub: >-
  לפעמים קשה לנו — ואנחנו לא אומרים. בשיעור הזה פוגשים את גיא, ממפים את מי שאפשר לפנות אליו, ומגלים
  איך מבקשים עזרה כך שישמעו אותנו.
format: סרטון, כתיבה אישית, שלשות ומליאה
question: מה זה לייצג את עצמנו — ואיך מבקשים עזרה כך שישמעו אותנו?
takeaways:
  - ייצוג עצמי הוא להסביר את עצמנו — את היכולות ואת הקשיים — ולבקש את מה שאנחנו צריכים.
  - לכל אחד יש אנשים שאפשר לפנות אליהם — במשפחה, בבית הספר, בין החברים ובשכונה.
  - ככל שגדלים, האחריות לייצג את עצמנו עוברת אלינו — ואפשר ללמוד איך עושים את זה.
prep:
  - חלוקה מראש לשלשות לפי מקומות הישיבה
  - שלוש השאלות של ״איך פונים כך שישמעו?״ — כתובות על הלוח לפני השיעור

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — בקשת עזרה ו״מפת מעגלי תמיכה״ — ושאלי מי בכיתה עלול להתקשות בחלק ״בני
      משפחה״: משפחה במשבר, הורה שאינו בתמונה, אובדן. בקשי שתהיה זמינה אחרי השיעור, ושאלי אם אפשר להזכיר
      אותה בכיתה כמי שאפשר לפנות אליה.
  - head: מי עלול להיפגע
    text: >-
      מי שאין לו את מי לכתוב באחד החלקים של המפה — ובייחוד ב״בני משפחה״ — עלול להרגיש לבד מול הדף. אמרי
      מראש שמשאירים חלק ריק כשאין, ושכל אדם במפה נחשב. גיא מתקשה בשיעור עברית; מי שמתמודד עם לקות למידה
      עלול לזהות את עצמו — מדברים על הקושי של גיא, לא על ״מי בכיתה כמוהו״.
  - head: לא לוחצים לשתף
    text: >-
      כללי השיח של המקור על המסך לפני המפה. המפה נשארת במחברת ולא נאספת; במליאה משתפים רק מתנדבים, ורק
      בתפקיד (״סבתא״, ״המאמן״) — לא בסיפור. בשלשות בוחרים אירוע שנוח לספר עליו, גם קטן; בסימולציה הנושא
      יכול להיות מומצא. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל קושי בבית, הזנחה, או פגיעה מחבר או ממבוגר — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
