            - at: "?"
              moment: >-
                הרגע שבו גיא ניגש שוב אל מורת העברית, רגע לפני שהוא מתחיל לדבר. צפי בחלק השני לפני השיעור, ורשמי כאן
                את הזמן.
              ask: מה גיא יגיד לה הפעם? משפט אחד, בלחישה לשכן.
          alt: תלמיד ומורה זה מול זה, ומעל התלמיד בועת דיבור עם סימן שאלה
          art:
            - {use: teacher, x: 90, y: 214, w: 145, color: moss}
            - {use: kid-stand, x: 390, y: 228, w: 140, color: teal}
            - {use: speech, x: 300, y: 26, w: 230}
            - text: '?'
              x: 415
              y: 112
              size: 90
      - ask: מה גיא עשה הפעם אחרת — ומה מזה כבר רשמנו על הלוח?

  # ------------------------------------------------------------------ 24′–27′
  - id: concept
    title: מהו ייצוג עצמי?
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - שיתופיות בלמידה
    summary: שמש אסוציאציות סביב ״ייצוג עצמי״ על הלוח, ואחריה ההגדרה של המקור
    body:
      - slide:
          kicker: שמש אסוציאציות
          title: מהו ״ייצוג עצמי״?
          sub: כל מה שעולה לכם — מילה או משפט.
          echo: true
          alt: שמש — ״ייצוג עצמי״ במרכז, וקרניים עם עיגולים ריקים
          art: {file: art/assoc-sun.svg}
      - moves:
          - כתבי ״ייצוג עצמי״ במרכז הלוח. שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - רשמי כל מילה כקרן בשמש — בלי לתקן ובלי לשפוט.
          - הקריאי את ההגדרה של המקור, וחברי אליה שתיים־שלוש מילים מהשמש שעל הלוח.
      - ask: בסרטון גיא לומד לייצג את עצמו בפני המורה. מהו ״ייצוג עצמי״?
      - slide:
          kicker: הגדרת ייצוג עצמי
          title: להסביר את עצמנו — ולבקש את מה שאנחנו צריכים
          sub: בתחילה ההורים עושים זאת עבורנו. לאחר מכן האחריות לכך עוברת אלינו.
          verbatim:
            - sub
          echo: true
          cue: אחרי שהשמש מתמלאת —
          alt: מבוגר, חץ, ודמות של ילד — האחריות עוברת אלינו
          art:
            - {use: teacher, x: 420, y: 200, w: 150, color: moss}
            - {use: arrow, x: 222, y: 290, w: 180}
            - {use: kid-stand, x: 60, y: 214, w: 150, color: teal}
      - quote:
          title: ייצוג עצמי — ההגדרה מהמקור, להקריא
          text: |-
            פעולה, בעזרתה אנחנו נסביר את עצמנו, את יכולותינו וקשיינו.
            אנחנו הופכים שותפים בבחירה ובהחלטות הנוגעות לחיינו, ופועלים לקידום מטרותינו.
            מטרת הייצוג העצמי היא לבקש סיוע או התחשבות, לקדם מטרות, להסביר ולנמק מעשים.
            ככל שאנחנו מתבגרים וגדלים, אנחנו לומדים לייצג את עצמנו.
            בתחילה ההורים עושים זאת עבורנו. לאחר מכן האחריות לכך עוברת אלינו.
      - say: ככל שגדלים, האחריות לייצג את עצמנו עוברת אלינו — וכמו גיא, אפשר ללמוד איך עושים את זה.

  # ------------------------------------------------------------------ +5′
  - id: sim
    title: סימולציה — מורה חדש בחטיבה
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: זוג מתנדבים מציג פגישה ראשונה עם מורה חדש בחטיבת הביניים; הכיתה מגיבה לפי שלושה כללים
    body:
      - slide:
          kicker: אם נשאר זמן · סימולציה
          title: פגישה ראשונה עם מורה חדש בחטיבה
          sub: הוא עוד לא מכיר אתכם. מה תספרו לו — ומה תבקשו?
          alt: תלמיד ומורה נפגשים, ומעל התלמיד בועה — נעים מאוד
          art:
            - {use: teacher, x: 90, y: 214, w: 145, color: moss}
            - {use: kid-stand, x: 390, y: 228, w: 140, color: teal}
            - {use: speech, x: 290, y: 26, w: 250}
            - text: נעים מאוד
              x: 415
              y: 118
              size: 40
      - moves:
          - >-
            הזמיני זוג מתנדבים — אחד משחק תלמיד, והשני מורה חדש בחטיבת הביניים. התלמיד בוחר נושא — כישור,
            קושי, או משהו שהוא צריך בשיעורים.
          - לפני ההצגה — הקריאי את שלושת הכללים של הכיתה.
          - אחרי ההצגה — שתי תגובות מהכיתה. אם יש זמן — זוג נוסף.
      - say: >-
          במעבר לחטיבת הביניים תפגשו מורים חדשים, שעוד לא מכירים אתכם. מי מוכן להראות לנו איך מציגים את
          עצמנו?
      - slide:
          kicker: כללים לכיתה
          title: כך מגיבים לסימולציה
          points:
            - בכיתה, נקשיב למקרה ולייצוג העצמי ונגיב לסימולציה.
            - יש להגיב לחברים באופן חיובי ולא שיפוטי
            - נמליץ על דרכים נוספות לפתרון הבעיה.
          verbatim:
            - points
          echo: true
          cue: לפני ההצגה —
          alt: אגודל למעלה, ולב לידו
          art:
            - {use: thumb-up, x: 260, y: 130, w: 240}
            - {use: heart, x: 70, y: 80, w: 160}
      - task:
          what: >-
            זוג מתנדבים מציג פגישה קצרה: תלמיד פונה למורה חדש בחטיבת הביניים, ומסביר לו משהו שחשוב שיידע —
            כישור, קושי או בקשה. הכיתה מקשיבה ומגיבה לפי הכללים.
          time: דקה וחצי להצגה, דקה לתגובות
          group: זוג מציג, כל הכיתה מקשיבה
          rules: מציגים רק מתנדבים; הנושא יכול להיות מומצא; מגיבים באופן חיובי ולא שיפוטי
          plenary: שתי תגובות — מה היה טוב בפנייה, ומה עוד אפשר להציע
          help: התחילו במשפט ׳יש לך כמה דקות? אני רוצה לספר לך משהו על עצמי.׳
          challenge: הציגו את אותה פנייה פעמיים — פעם בזמן לא מתאים ופעם בזמן מתאים. מה השתנה?
      - ask: מה היה טוב בפנייה — ומה עוד אפשר להציע?


  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — בכוונתי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: דבר אחד שבכוונתי לעשות כבר ממחר, ולמי מהמפה אפנה כשקשה; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה
          אחת.
      - exit:
          form: board
          title: מה בכוונתי לעשות ממחר?
          prompts:
            - בכוונתי… — דבר אחד שאעשה כבר ממחר, כדי לייצג את עצמי.
            - אדם אחד מהמפה שלי, שאפנה אליו בפעם הבאה שיהיה לי קשה.
            - רשות — מה הכי קשה לי כשצריך לבקש עזרה?
          look_for: >-
            חפשי כוונות כלליות מדי (״להיות אמיץ״) לעומת כוונות עם מי, מתי ומה; פתקים בלי אף אדם לפנות אליו —
            עם אלה מדברים בשקט השבוע; וכל פתק שמספר על קושי שמחייב עזרה — ליועצת עוד היום.
          timer: 180
          alt: דמות כותבת ליד שולחן, ולוח שנה לידה
          art:
            - {use: kid-desk, x: 240, y: 136, w: 288, color: teal}
            - {use: calendar, x: 50, y: 60, w: 170}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
