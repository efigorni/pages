slug: g5-misrey-ani
title: מסרי אני
grade: 5
grades_served:
- 5
slide_kickers: false
month: מאי
section: חברות, סובלנות ומניעת אלימות (מאי)
unit: הדרך אל האחר מתחילה בי
src_text: sources/text/5/Misrey_Ani.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/5Grade/Mamlachti/Misrey_Ani.pptx
sensitivity: med
sub: משווים ניסוחים, בונים מסר שמחבר רגש, אירוע, צורך ובקשה, ומתרגלים שיחה במצב של מחלוקת.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך מתארים קושי ובקשה בלי לתקוף את האחר?
takeaways:
- למילים שלנו יש כוח - המילים והניסוח שאנחנו בוחרים משפיעים על השיחה.
- מסר אישי מתאר רגש, אירוע, צורך ובקשה מעשית.
prep:
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: speech
    x: 180
    y: 120
    w: 250
  alt: בועת דיבור
steps:
- id: part-1
  title: שתי דרכים לומר
  minutes: 5
  practices:
  - מה הקשר?
  - זמן חשיבה
  spotlights:
  - עניין ורלוונטיות
  summary: שתי דרכים לומר — איזה משפט מזמין יותר הקשבה?
  body:
  - slide:
      title: איזה משפט מזמין יותר הקשבה?
      art:
      - use: speech
        x: 180
        y: 120
        w: 250
      alt: בועת דיבור
      echo: true
  - moves:
    - 'הקריאי שני ניסוחים משלך: אתה משאיר הכול מבולגן; קשה לי למצוא מקום כשחפצים מפוזרים ואני מבקש שנפנה
      יחד.'
    - כל תלמיד כותב מה השתנה, ואז שומעים שתי תגובות.
    - אין מחזיקים תלמיד בתפקיד מואשם.
  - ask: איזה משפט מזמין יותר הקשבה?
  - ladder:
      help: באיזה משפט מתואר צורך של הדובר?
      challenge: האם משפט שמתחיל באני יכול בכל זאת להאשים?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: יהלי מחכה לאגם
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: יהלי מחכה לאגם — מה מסתתר מאחורי הכעס?
  body:
  - slide:
      title: מה מסתתר מאחורי הכעס?
      art:
      - use: heart
        x: 180
        y: 120
        w: 250
      alt: לב
      echo: true
      sub: ''
  - moves:
    - ספרי שיהלי חיכתה לאגם שאיחרה לפגישה.
    - 'בזוגות פרקו את המצב לארבעה: רגש, תיאור מה שקרה, צורך ובקשה.'
    - הבדילי בין כועסת לבין חושבת שלא אכפת לך.
    - כתבי דוגמה על הלוח והשאירי אותה מול הכיתה.
  - ask: מה מסתתר מאחורי הכעס?
  - task:
      what: 'פרקו את המקרה של יהלי לארבעה חלקים: רגש, אירוע, צורך ובקשה. תארו אירוע מסוים בלי תמיד או
        אף פעם.'
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה יהלי יכולה לבקש באופן ברור?
      challenge: איך נמנעים מתמיד ואף פעם כשמדברים על אירוע מסוים?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - quote:
      title: מסר המקור בהקשר הפעילות
      text: למילים שלנו יש כוח - המילים והניסוח שאנחנו בוחרים משפיעים על השיחה.
- id: part-3
  title: מרכיבים מסר
  minutes: 9
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מרכיבים מסר — איך ננסח בקשה שאפשר להבין?
  body:
  - slide:
      title: איך ננסח בקשה שאפשר להבין?
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף
      echo: true
      sub: ''
  - moves:
    - 'כל זוג בוחר מצב: חבר תופס את כל זמן המשחק; קבוצה אינה משתפת; שותף אינו מוסר כדור.'
    - נסחו מסר בארבעה חלקים והחליפו עם זוג אחר לבדיקה.
    - הדובר מבטא רגש וצורך ואינו קובע מה האחר חשב.
  - ask: איך ננסח בקשה שאפשר להבין?
  - task:
      what: בחרו מצב וכתבו מסר בארבעה חלקים. החליפו עם זוג אחר ובדקו שהבקשה ברורה ושאין האשמה מוסתרת.
      time: 6 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: 'השלימו: אני מרגיש... כש... כי חשוב לי... אשמח אם...'
      challenge: איך אפשר להפוך דרישה כללית לבקשה מעשית?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - quote:
      title: מסר המקור בהקשר הפעילות
      text: '"מסרי אני" נעימים לאוזננו, הם רכים יותר ונאמרים ברגישות שמרגיעה.'
  - quote:
      title: מסר המקור בהקשר הפעילות
      text: '"מסרי אתה או את" הם מחממים וגורמים לתוקפנות ולכעס להתעצם.'
  - quote:
      title: מסרי המקור על השיחה
      text: כשאנחנו בוחרים ב"מסרי אני" – אנחנו מדברים על עצמינו - מתארים את הקושי שלנו, את הצורך שלנו
        או את מה שאנחנו מרגישים – מי שמולנו מצליח לשמוע אותנו. הוא לא מותקף ולא מרגיש מואשם. כשאנחנו בוחרים
        ב"מסרי אתה או את" – אנחנו מדברים על הזולת - מאשימים, תוקפים ומביעים חוסר שביעות רצון ממי שנמצא
        מולנו וזה גורם לו להיעלב, לכעוס, לעיתים לתקוף אותנו חזרה, או להסתגר ולא לדבר אתנו.
- id: part-4
  title: מי יוביל את קבוצת המדעים?
  minutes: 7
  practices:
  - מהלכי שיח
  - זמן חשיבה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מי יוביל את קבוצת המדעים? — איך נציע פתרון בלי להסלים את המחלוקת?
  body:
  - slide:
      title: איך נציע פתרון בלי להסלים את המחלוקת?
      art:
      - use: circle4
        x: 180
        y: 120
        w: 250
      alt: ארבעה סביב שולחן
      echo: true
  - moves:
    - ספרי על תלמיד שמתעקש להיות ראש קבוצה כי הוא הכי טוב במדעים.
    - שלושה מתנדבים קוראים הצעות שונות במסרי אני.
    - הצופים מציעים החלפה של משפט, בלי מגע פיזי ובלי ביקורת אישית.
    - בדקי שהבקשה מאפשרת גם לאחר להשיב.
  - ask: איך נציע פתרון בלי להסלים את המחלוקת?
  - ladder:
      help: אפשר לבקש תור או חלוקת תפקידים.
      challenge: מה עושים אם המסר מכבד אבל האחר עדיין מסרב?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - tip: הכלי מסייע לבחירה ולהקשבה, אך אינו מבטיח שליטה באחרים או פתרון. האחריות לפגיעה היא של הפוגע;
      כשיש פגיעה או חשש פונים למבוגר.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - למילים שלנו יש כוח - המילים והניסוח שאנחנו בוחרים משפיעים על השיחה.
      - כשאנחנו בוחרים ב"מסרי אני" – אנחנו מדברים על עצמנו, ומי שמולנו מצליח לשמוע אותנו, משום שהוא לא
        מותקף ולא מרגיש מואשם.
      - '"מסרי אני" הם חלק מתקשורת מקרבת, שמטרתה לשמור על קשרים טובים ותקינים עם אחרים. הם עוזרים לנו
        לשמור על קשר טוב עם חברים.'
      - האחריות למניעת ההסלמה בעימות היא של שני הצדדים. לכן, על שני הצדדים להשתמש במסרי "אני", על מנת
        להימנע מהסלמה.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - נסחו מסר על מקרה של חלוקת זמן משחק.
      - בדקו שיש במסר רגש ובקשה שאפשר לבצע.
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: 'מבדילים בין מחלוקת רגילה לבין פגיעה: אין אחריות משותפת לפגיעה ואין חובה לנהל שיחה עם מי שמאיים.'
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
