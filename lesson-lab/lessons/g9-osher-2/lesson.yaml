          - >-
            שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות. הדהדי, והזמיני את הכיתה להגיב — ״מי מסכים? מי רוצה
            להוסיף?״
          - >-
            הציגי את השקף הבא, והקריאי את ההסבר של המקור. עולה ״איך אפשר לשמוח כשחולים?״ — המשפט האחרון בהסבר
            עונה על זה; שאלי אם מישהו יכול לתת דוגמה.
      - ask: לפי הטקסט — מה כל אחד מאיתנו יכול לעשות כדי שעיגול השמחה של מישהו אחר יגדל?
      - slide:
          kicker: שימו לב
          title: ביכולתנו לגרום לאחרים תחושת אושר
          sub: ובכך להעצים את תחושת האושר שלנו.
          verbatim: true
          echo: true
          cue: אחרי הדיון —
          alt: דמות אחת אומרת לשנייה ״בוקר טוב!״
          art:
            - {use: speech, x: 236, y: 20, w: 270}
            - text: בוקר טוב!
              x: 371
              y: 130
              size: 44
            - {use: kid-stand, x: 370, y: 206, w: 155, color: teal}
            - {use: kid-stand, x: 80, y: 206, w: 155, color: purple}
      - quote:
          title: ההסבר מהמקור — להקריא
          text: >-
            ביכולתנו לגרום לאחרים תחושת אושר ובכך להעצים את תחושת האושר שלנו. האופן שבו אנו בוחרים להתייחס ולראות
            אירועים ודברים בחיינו הוא שישפיע על תחושת האושר שלנו. ניתן לחוות שמחה ובו זמנית רגשות נוספים כמו חשש
            ועצב.
      - say: סוכריה, פרח, ״בוקר טוב״ — דברים קטנים. עכשיו כל אחד יכתוב טיפה משלו.

  # ------------------------------------------------------------------ 23′–27′
  - id: drops
    title: טיפות אושר
    minutes: 4
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      כל אחד כותב שתי טיפות — מעשה שגורם לו אושר, ומה יגביר את האושר בכיתה; הטיפות הכיתתיות עולות ללוח
    body:
      - slide:
          kicker: למדנו, ניישם! · לבד
          title: שתי טיפות אושר
          sub: אחת אישית ואחת כיתתית.
          points:
            - בטיפה האישית — מעשה שגורם לכם אושר
            - בטיפה הכיתתית — מה מגביר את תחושת האושר בכיתה
          verbatim: [sub]
          timer: 120
          echo: true
          alt: טיפה גדולה, ולידה לוח שעליו טיפות קטנות
          art: {file: art/drops.svg}
      - moves:
          - חלקי לכל אחד שתי פתקיות בשני צבעים — צבע אחד לטיפה האישית וצבע אחר לכיתתית.
          - >-
            שתי דקות של כתיבה. הטיפה האישית נשארת במחברת; את הכיתתית כל אחד מדביק על הלוח, תחת הכותרת.
          - הקריאי בקול שלוש־ארבע טיפות מהלוח.
      - quote:
          title: מהמקור — אפשר להקריא לפני הכתיבה
          text: >-
            האושר נמצא בדברים הקטנים: במשהו שהצלחתי לעשות היום ולא הצלחתי בעבר, בהתמקדות במשהו טוב שאמרו לי או
            אמרו עליי, בכך שעשיתי משהו מהנה עם אדם יקר לי וכדומה.
      - ladder:
          help: חפשו בדברים הקטנים — משהו שהצלחתם לעשות היום, או משהו טוב שאמרו לכם.
          challenge: בטיפה הכיתתית — כתבו מעשה שאתם עצמכם תעשו השבוע, לא רק מה שאחרים צריכים לעשות.
      - say: שתי טיפות — אחת שלכם ואחת לכיתה. בכל אחת — משהו שאפשר באמת לעשות.
      - tip: >-
          שלושה רעיונות של המקור להמשך בבית, אם מישהו שואל איך ממשיכים: בסוף כל יום — משתפים בבית ברגע משמעותי
          אחד מהיום; בכל ערב — כותבים חמישה דברים קטנים וספציפיים שרוצים להודות עליהם; ושמים לב מי בכיתה זקוק
          לעזרה, כי כשמסייעים לאחר — גם האושר שלנו גדל.
      - say: כל טיפה קטנה — וביחד הן כבר מתחילות למלא לוח.

  # ------------------------------------------------------------------ +6′
