          before: השיר נכתב בהשראת דסי. מה, לדעתכם, יהיה בו?
          watch: הקשיבו למילים — איפה, לפי השיר, נמצאת השמחה?
          pauses:
            - at: "?"
              moment: סוף הפזמון הראשון. האזיני לשיר לפני השיעור, ורשמי כאן את הזמן.
              ask: מה זה, לדעתכם, ״שמחות קטנות״? דוגמה אחת — בלחישה לשכן.
