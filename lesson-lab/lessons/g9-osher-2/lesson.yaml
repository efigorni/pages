          - אחרי השיר — שאלה אחת, ושניים־שלושה עונים.
      - ask: איזו שורה מהשיר נשארה לכם בראש — ולמה?

  # ------------------------------------------------------------------ +4′
  - id: unit
    title: מבט על היחידה
    kind: extension
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
    summary: סיכום היחידה — מה למדתי מההתבוננות על עצמי, ולמה הנושא נקרא ״מקורות האושר בחיי״
    body:
      - whisper: >-
          היחידה ״מקורות האושר שלי״ כוללת שני שיעורים: ״מהו אושר?״ — מה זה אושר, מה הסימנים שלו, ושאפשר להשפיע
          עליו; ו״להוסיף אושר לחיים״ — השיעור הזה. השאלות כאן עומדות בפני עצמן, גם למי שלא היה בשיעור הראשון.
      - slide:
          kicker: אם נשאר זמן · מסכמים יחידה
          title: מה למדתם מההתבוננות על עצמכם?
          sub: ועל ההתנהגות שלכם כלפי אחרים?
          verbatim: [title]
          echo: true
          alt: דרך מתפתלת לאופק, ודמות בתחילתה
          art:
            - {use: road, x: 230, y: 210, w: 360}
            - {use: kid-stand, x: 80, y: 276, w: 120, color: teal}
      - moves:
          - שאלי, ותני חצי דקה של שקט לפני שמשהו נאמר. שמעי שניים־שלושה, והזמיני את הכיתה להגיב.
          - בסוף — שאלת השם של הנושא.
      - ask: למה, לדעתכם, השם של הנושא הוא ״מקורות האושר בחיי״? מה המילה ״מקורות״ אומרת לכם?
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי רואה את זה אחרת?

