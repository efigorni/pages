      - source_slide:
          slides: 9
          why: >-
            השיר ״עיגולי השמחה״ של דסי רבינוביץ ז״ל — על עיגול השמחה שבלב, ועל מה שכל אחד יכול לעשות כדי שהעיגול
            של מישהו אחר יגדל. הוא מוגן בזכויות יוצרים, ולכן מקריאים אותו מהמצגת המקורית.
      - moves:
