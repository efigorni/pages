    summary: >-
      ליד כל פריט — לבד, עם חברים או עם המשפחה, ואם הוא דורש כסף, תכנון או שהוא חד־פעמי; סופרים, וכותבים מה
      למדתי על עצמי
    body:
      - board:
          - ליד כל פריט ברשימה — עושים אותו לבד, עם חברים או עם המשפחה? כתבו ל, ח או מ.
          - >-
            ליד כל פריט סמנו גם: $ — דורש כסף · # — דורש תכנון מראש · פרצוף מחייך — משהו ייחודי וחד־פעמי.
          - סופרים כמה פריטים יש מכל סוג, וכותבים את המספרים בתחתית הרשימה.
          - מתבוננים ברשימה המסומנת — וכותבים משפט אחד על מה שלמדתם על עצמכם.
      - slide:
          kicker: מזהים את מקורות האושר · לבד
          title: לבד, עם חברים או עם המשפחה?
          sub: >-
            ליד כל פריט כתבו ל, ח או מ — ואחר כך סמנו גם:
          points:
            - $ — דורש כסף
            - "# — דורש תכנון מראש"
            - פרצוף מחייך — משהו ייחודי וחד־פעמי
          timer: 180
          echo: true
          alt: דמות אחת לבד, זוג יד ביד, ובית
          art:
            - {use: kid-stand, x: 472, y: 280, w: 118, color: teal}
            - {use: pair, x: 240, y: 280, w: 216}
            - {use: house, x: 16, y: 320, w: 216}
      - moves:
          - >-
            הראי את ארבע השורות שעל הלוח, והדגימי על פריט אחד מהרשימה שלך — אפשר יותר מסימן אחד ליד אותו פריט.
          - שלוש דקות של סימון וספירה בשקט. הסתובבי בין השולחנות.
          - הציגי את שאלת ההתבוננות, ותני דקה למשפט האישי.
      - say: ממיינים לבד ובשקט. סוג שכמעט לא מופיע אצלכם — גם זו תשובה; רק אתם יודעים מה כל דבר עושה לכם.
      - task:
          what: >-
            ליד כל פריט ברשימה מסמנים ל, ח או מ, ואת הסימנים $, # או פרצוף מחייך; סופרים כמה יש מכל סוג, וכותבים
            משפט אחד: מה מאפיין את הדברים שגורמים לי אושר.
