          plenary: בשלב הבא, בקבוצות — כל אחד משתף רק מה שבחר
          help: התחילו מהפריט הראשון — עושים אותו לבד, או עם מישהו? הוא עולה כסף?
          challenge: השוו בין הסוגים — מה יש לכם הכי הרבה, מה הכי מעט, ומה זה אומר עליכם?
      - slide:
