steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: list
    title: עשרה דברים שגורמים לי אושר
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית כשנכנסים — עשרה דברים שגורמים לי אושר; שלושה מתנדבים מקריאים דבר אחד
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, במחברת
          title: מקורות האושר שלי
          sub: כתבו עשרה דברים שגורמים לכם אושר — גם דברים קטנים נחשבים.
          timer: 240
          echo: true
          alt: דף עם שורות, ועיפרון לידו
          art:
            - {use: note, x: 290, y: 90, w: 256}
            - {use: pencil, x: 70, y: 290, w: 190}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. מי שנתקע אחרי שלושה — הפני אותו לשאלת העזר.
          - בסוף — שלושה מתנדבים מקריאים דבר אחד מהרשימה, בלי הסבר. הרשימות נשארות במחברות, למיון.
      - say: ארבע דקות, לבד ובשקט. אין רשימה נכונה — רק שלכם.
      - ladder:
          help: חשבו על יום אחד מהשבוע האחרון — מה היה טוב בו, אפילו לרגע?
          challenge: כתבו חמישה־עשר — ודאגו שיהיו ביניהם דברים מכמה תחומים שונים בחיים שלכם.
      - ask: שלושה מתנדבים — דבר אחד מהרשימה, בלי הסבר. מי מתחיל?

  # ------------------------------------------------------------------ 5′–11′
  - id: sort
    title: ממיינים וסופרים
    minutes: 6
    practices:
      - הוצאה למשימה
      - כולם כותבים
    spotlights:
