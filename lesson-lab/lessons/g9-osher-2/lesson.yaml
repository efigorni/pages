sub: >-
  מה עושה לנו טוב — ואיך מוסיפים ממנו? בשיעור הזה כל אחד כותב וממיין את מקורות האושר שלו, שומעים את ״עיגולי
  השמחה״ של דסי רבינוביץ ז״ל, ובסוף כותבים שתי טיפות אושר — אחת אישית ואחת לכיתה.
format: כתיבה אישית, קבוצות ומליאה
question: מה גורם לי אושר — ואיך אפשר להוסיף אושר, לי ולאחרים?
takeaways:
  - >-
    למקורות האושר שלנו יש מאפיינים — לבד, עם חברים או עם המשפחה, עם כסף או בלי — וכשמכירים אותם, אפשר להרחיב
    אותם.
  - אפשר לייצר אושר בפעולות יזומות שלנו — וכשמשמחים אחרים, גם האושר שלנו גדל.
  - השמחה נמצאת לרוב בדברים קטנים ופשוטים, שקל לפספס.
prep:
  - חלוקה מראש לקבוצות של 3–4 לפי השולחנות
  - ארבע השורות של ״ממיינים וסופרים״ — כתובות על הלוח לפני השיעור
  - >-
    שתי פתקיות בצבעים שונים לכל תלמיד — אחת לטיפה האישית ואחת לטיפה הכיתתית (או טיפות שגזרת מראש מנייר צבעוני)
  - הכותרת ״טיפות האושר הכיתתיות שלנו״ על חלק פנוי בלוח, ונייר דבק

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — רשימה אישית של מקורות אושר, מיון לפי ״לבד״, ״עם חברים״ ו״עם המשפחה״, והטקסט
      ״עיגולי השמחה״ של דסי רבינוביץ ז״ל, נערה שחלתה בסרטן ונפטרה בגיל 19. שאלי אם יש בכיתה מי שעובר עכשיו תקופה קשה
      — אובדן, מחלה במשפחה, משבר בבית או בדידות — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שאיבד אדם קרוב, או שיש מחלה בבית — הסיפור של דסי עלול לגעת בו. ספרי עליה במשפט, בלי פרטים על המחלה,
      ואל תשאלי ״מי מכיר מישהו ש…״. מי שהבית שלו קשה עכשיו — ייתכן שלא יהיה לו כמעט מה לסמן ״עם המשפחה״; אמרי
      מראש שגם זו תשובה. הסימון $ לא נועד להשוואה — לא שואלים מי סימן הכי הרבה. מי שעובר תקופה עצובה עלול
      להתקשות למצוא עשרה דברים; עשרה הם כיוון, לא מכסה. ולפי המקור, יש בגיל הזה מי שגורם לעצמו אושר תוך לקיחת
      סיכון — אם עולה דוגמה כזו, בלי לשפוט ובלי להתעלם: שאלי מה היא נותנת ומה המחיר שלה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו; אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. הרשימה והמיון
      נשארים במחברת. בקבוצה כל אחד משתף רק מה שבחר מהרשימה, לא את כולה; במליאה — רק מתנדבים, ומותר לוותר. לא
      קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל מקור אושר שיש בו סיכון ממשי, או ״שום דבר כבר לא משמח אותי״ — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 14–17 דקות — רק השיר; 12–13 דקות — רק
    ״מבט על היחידה״; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - sort
      - groups
    text: >-
      במיון מסמנים רק לבד, חברים או משפחה — בלי $, # והפרצוף; ומהקבוצות שומעים במליאה שלוש בלבד

brain_break:
  after: groups
  signs: עיניים כבדות, עטים שלא זזים, תשובות של מילה אחת.
  ideas:
    - name: מראה
      text: בזוגות, פנים מול פנים — אחד מוביל תנועות ידיים איטיות, והשני משקף. אחרי דקה מתחלפים.
    - name: חמישה חושים
      text: בשקט — חמישה דברים שרואים, ארבעה ששומעים, שלושה שמרגישים בגוף, שניים שמריחים ואחד שטועמים.
    - name: מתיחה בשלבים
      text: קמים, משלבים אצבעות ומותחים ידיים קדימה, למעלה ולשני הצדדים — לאט, ונשימה בכל מתיחה.
  from: unit

