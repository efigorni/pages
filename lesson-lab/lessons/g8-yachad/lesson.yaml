steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: wind
    title: הרוח נושבת
    minutes: 5
    stance: true
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: משחק במעגל — מי שהמשפט נכון לגביו קם ומחליף מקום; מתנדבים מוסיפים משפט על עצמם
    body:
      - slide:
          kicker: הרוח נושבת · מי שזה נכון לגביו — מחליף מקום
          title: כל מי ש…
          points:
            - אוהב/ת לישון
            - פיתח/ה תחביב מעניין בחופשה
            - יש לו/לה תוכניות ומטרות למימוש בשנה הקרובה
            - שואף/ת להצליח השנה
          verbatim: [title, points]
          echo: true
          alt: שתי דמויות יושבות, ודמות אחת קמה ועוברת למקום אחר
          art:
            - {use: kid-sit, x: 16, y: 236, w: 180, color: purple}
            - {use: kid-stand, x: 238, y: 206, w: 150, color: orange}
            - {use: kid-sit, x: 424, y: 236, w: 180, color: teal, flip: true}
            - {use: arrow, x: 206, y: 96, w: 210, color: gray}
      - moves:
          - >-
            הכיתה נכנסת ומתיישבת במעגל. הסבירי בשני משפטים — אני מקריאה משפט, וכל מי שהוא נכון לגביו קם
            ומחליף מקום עם מישהו אחר שקם. הולכים, לא רצים.
          - חשפי משפט אחד בכל פעם, והקריאי אותו. חמש שניות של שקט — ורק אז קמים.
          - >-
            כשכולם יושבים, שאלי אם מישהו ממי שקמו רוצה להוסיף משפט על עצמו, ואחר כך מישהו ממי שנשארו לשבת.
            אחד מכל צד מספיק, ומותר לוותר.
          - אחרי המשפט הרביעי — שאלה אחת לכל המעגל, ועוברים לחיפוש.
      - say: >-
          לפני כל משפט חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז קמים. מותר גם להישאר לשבת.
      - ask: האם גיליתם נקודות דמיון חדשות ביניכם לבין חברים מהכיתה?
      - say: מצאנו כמה דברים משותפים בבת אחת. עכשיו נחפש אותם אחד־אחד — כל אחד עם הדף שלו.

  # ------------------------------------------------------------------ 5′–11′
  - id: same
    title: מכנה משותף
    minutes: 6
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: מסתובבים בכיתה ומחפשים מכנה משותף עם חברים — שם ומכנה משותף בכל משבצת; ולמה חיפשנו?
    body:
      - moves:
          - >-
            לפני שקמים, כל אחד מקפל את הדף שלו שלוש פעמים לחצי — שמונה משבצות. הסבירי את המשימה כשהדפים
            עוד ביד, ובדקי הבנה בשאלה אחת (״מותר לכתוב פעמיים ׳שנינו אוהבים כדורגל׳?״).
          - >-
            יוצאים לדרך. הסתובבי בין התלמידים; מי שעומד לבד — צרפי אותו לזוג הקרוב. חצי דקה לפני הסוף —
            הודיעי.
          - >-
            חוזרים למעגל. שמעי שתיים־שלוש דוגמאות, ושאלי למה חיפשנו מכנה משותף. אחרי כמה תשובות — חשפי
            את ארבע המילים, אחת־אחת.
      - slide:
          kicker: מכנה משותף · מסתובבים בכיתה
          title: מה משותף לי ולך?
          sub: בכל משבצת — שם של חבר לכיתה, ומה משותף לשניכם.
          timer: 180
          echo: true
          alt: שתי דמויות יד ביד, וסימן וי לידן
          art:
            - {use: pair, x: 50, y: 180, w: 300}
            - {use: check, x: 396, y: 96, w: 170}
      - task:
          what: >-
            מסתובבים בכיתה ומחפשים מכנה משותף עם חברים לכיתה — למשל ״שנינו אחים בכורים״, ״שנינו באותה תנועת
            נוער״. בכל משבצת כותבים את שם החבר ואת המכנה המשותף.
          time: 3 דקות
          group: כל אחד עם הדף שלו, בזוגות מתחלפים
          rules: >-
            עם כל חבר — מכנה משותף אחד; אסור לחזור על אותו מכנה משותף עם חבר אחר; מנסים למלא כמה שיותר
            משבצות
          plenary: חוזרים למעגל — שתיים־שלוש דוגמאות, ולמה חיפשנו מכנה משותף
          help: שאלו על היום־יום — מה אוכלים בבוקר, איזה שיר אוהבים, מה עושים אחרי בית הספר.
          challenge: מצאו מכנה משותף עם מי שאתם הכי פחות מכירים בכיתה — משהו שלא הייתם מנחשים.
      - ask: תנו דוגמה למכנה משותף מרגש, מצחיק או מפתיע שמצאתם.
      - slide:
          kicker: מכנה משותף
          title: מדוע לדעתכם חיפשנו מכנה משותף?
          points:
            - אווירה טובה
            - היכרות
            - שייכות
            - קשר
          verbatim: true
          echo: true
          cue: אחרי הדוגמאות —
          alt: עיגולים צבעוניים מחוברים בקווים, ולב מעליהם
          art:
            - {use: network, x: 120, y: 170, w: 330}
            - {use: heart, x: 420, y: 36, w: 150}
      - say: מצאנו הרבה דברים שמשותפים לנו. אבל אנחנו גם שונים — ועכשיו נחפש בדיוק את זה.

  # ------------------------------------------------------------------ 11′–17′
  - id: different
    title: מה שונה בינינו?
    minutes: 6
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: אותה פעילות, רק ההפך — מחפשים משהו שהחבר עושה ואני ממש לא; שומעים תגליות שלא ידענו
    body:
      - moves:
          - >-
            הסבירי את ההפך — אותו דף, הצד השני, ומחפשים מה שונה. הדגישי את הכלל: הבדלים בתחביבים ובתחומי
            עניין, לא במראה, בכסף או במשפחה.
          - שלוש דקות, עם חברים אחרים מהסבב הקודם. הסתובבי, ושימי לב שאף ״שוני״ לא נאמר כעקיצה.
          - חוזרים למעגל. שמעי שתיים־שלוש תגליות.
      - slide:
          kicker: מה שונה בינינו? · הצד השני של הדף
          title: מה החבר עושה — ואתם ממש לא?
          sub: תחביב, תחום עניין, הרגל — שם החבר והשוני, בכל משבצת.
          timer: 180
          echo: true
          alt: שתי דמויות — מעל אחת ספר, ומעל השנייה מצלמה
          art:
            - {use: kid-stand, x: 90, y: 232, w: 135, color: teal}
            - {use: book, x: 58, y: 56, w: 200, color: purple}
            - {use: kid-stand, x: 395, y: 232, w: 135, color: orange}
            - {use: camera, x: 362, y: 56, w: 200}
      - task:
          what: >-
            אותה פעילות, רק ההפך — מסתובבים ומחפשים משהו שהחבר עושה ואתם ממש לא, למשל תחביבים שונים או תחומי
            עניין אחרים. בכל משבצת בצד השני של הדף כותבים את שם החבר ואת השוני.
          time: 3 דקות
          group: כל אחד עם הדף שלו, בזוגות מתחלפים — עם חברים אחרים מהסבב הקודם
          rules: מחפשים הבדלים בתחביבים, בתחומי עניין ובהרגלים — לא במראה, בכסף או במשפחה; עם כל חבר — שוני אחד
          plenary: חוזרים למעגל — שתיים־שלוש תגליות שלא ידעתם
          help: שאלו ״מה אתה אוהב לעשות בסוף השבוע?״ — ובדקו מה אצלכם אחרת.
          challenge: מצאו שוני דווקא אצל חבר שאתם דומים לו בהרבה דברים.
      - ask: תנו דוגמה לגילוי מרגש, מצחיק או מפתיע — משהו שלא ידעתם.
      - say: >-
          מצאנו גם מה שמשותף לנו וגם מה ששונה. אז מדוע חיפשנו את השונות שבינינו? הנה תמונה שעוזרת לחשוב על זה.

  # ------------------------------------------------------------------ 17′–21′
  - id: needle
    title: דומים וגם שונים
    minutes: 4
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      חוטים בצבעים שונים עוברים יחד בחור של מחט — איך השונות בינינו קשורה לתמונה, ומה היא תורמת לאווירה
      בכיתה
    body:
      - slide:
          kicker: חושבים · עם השכן · משתפים
          title: כיצד השונות בינינו קשורה לתמונה?
          points:
            - לבד — 10 שניות
            - עם השכן — חצי דקה
            - במליאה
          verbatim: [title]
          echo: true
          alt: מחט, ודרך החור שלה עוברים יחד חוטים בצבעים שונים
          art: {file: art/needle.svg}
      - moves:
          - הציגי את התמונה ושאלי. עשר שניות של שקט, ואז חצי דקה עם השכן במעגל.
          - >-
            שמעי שתיים־שלוש תשובות. הדהדי, וחברי — כל חוט בצבע אחר, וכולם עוברים יחד באותו חור.
          - >-
            שאלי כיצד השונות תורמת לכיתה, ורשמי על הלוח את מה שעולה. רק אחר כך חשפי את המשפטים שעל השקף,
            אחד־אחד.
      - ladder:
          help: מה היה קורה לתמונה אם כל החוטים היו באותו צבע?
          challenge: אם הכיתה שלנו היא התמונה — מה המחט, ומה החוטים?
      - ask: כיצד שונות בין התלמידים בכיתה תורמת לאווירה הכיתתית?
      - slide:
          kicker: מה השונות נותנת לנו?
          title: דומים וגם שונים
          points:
            - שונות יוצרת גיוון ועניין
            - שונות מאפשרת העשרה, פתיחות והרחבת אופקים
            - שונות בכיתה מאפשרת לי לקבל את עצמי כמו שאני
            - שונות מאפשרת לי מרחב צמיחה והתפתחות כדי לגלות את עצמי
          verbatim: true
          echo: true
          cue: אחרי שעלו רעיונות על הלוח —
          alt: שלוש דמויות בשלושה צבעים עומדות יחד, וחלק פאזל לידן
          art:
            - {use: group3, x: 60, y: 250, w: 340}
            - {use: puzzle, x: 420, y: 80, w: 160, color: purple}
      - say: >-
          כאשר כל אחד בכיתה מרגיש מיוחד, אהוב, רצוי ושייך כמו שהוא, הוא יכול לבטא את עצמו בחופשיות. אז מה
          יעזור לנו להרגיש ככה כאן?

  # ------------------------------------------------------------------ 21′–27′
  - id: contract
    title: החוזה הכיתתי שלנו
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      בזוגות — כלל אחד שיעזור לכולם לדבר בחופשיות; משווים לכללי השיח של המקור, ומצביעים על הכללים
      החשובים
    body:
      - say: >-
          כדי שנוכל לדבר כאן בחופשיות, כל אחד צריך להרגיש מוגן. כללי שיח יעזרו לכולנו להרגיש נעים ובטוח.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה יכול לאפשר לנו להיפתח זה לזה
          sub: ולבטא את עצמנו בחופשיות, מתוך כבוד לשונות בינינו?
          points:
            - לבד — 20 שניות
            - בזוג — כלל אחד
            - במליאה
          verbatim: [title, sub]
          echo: true
          alt: שתי דמויות יושבות זו מול זו, ומעליהן בועת דיבור עם לב
          art:
            - {use: kid-sit, x: 30, y: 262, w: 160, color: purple}
            - {use: kid-sit, x: 430, y: 262, w: 160, color: teal, flip: true}
            - {use: speech, x: 200, y: 50, w: 220}
            - {use: heart, x: 262, y: 82, w: 96}
      - moves:
