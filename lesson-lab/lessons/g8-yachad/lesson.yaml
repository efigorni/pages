  - from: נשאר ביננו בין חברי
    to: נשאר בינינו בין חברי
  - from: רק על עצמינו
    to: רק על עצמנו

sub: >-
  חוזרים לכיתה אחרי החופש — ומגלים שיש עוד הרבה מה להכיר. בשיעור הזה מחליפים מקומות במעגל, מחפשים מה
  משותף לנו ומה שונה בינינו, ובוחרים יחד כללי שיח לשנה.
format: מעגל, תנועה בכיתה וזוגות
question: מה משותף לנו, מה מייחד כל אחד — ואיך בונים כיתה שבה כולם יכולים לדבר בחופשיות?
takeaways:
  - בכיתה שלנו יש הרבה מכנים משותפים — וגם שונות, שמעשירה את כולנו.
  - כשכל אחד מרגיש רצוי ושייך כמו שהוא, אפשר לבטא את עצמנו בחופשיות.
  - כללי שיח שבחרנו יחד שומרים על שיחה מוגנת ומכבדת — וזו אחריות של כולנו.
prep:
  - >-
    מעגל כיסאות לפני שהכיתה נכנסת — כיסא לכל תלמיד, והשולחנות לצדדים. אם אי אפשר להזיז שולחנות, את
    ״הרוח נושבת״ משחקים במקום — מי שקם מחליף כיסא עם מישהו אחר שקם.
  - דף ריק ועט לכל תלמיד — בשיעור מקפלים אותו לשמונה משבצות
  - שני בריסטולים לבנים גדולים וטושים צבעוניים (להרחבה ״קיר חתימות כיתתי״)

safe:
  - head: עמידה מול הכיתה
    text: >-
      ב״הרוח נושבת״ קמים לפי עובדות מהחיים, ולכן נבחרו משפטים שלא מביכים. ירדו המשפטים על חופשה מחוץ לבית,
      על ים בקיץ ועל אחים — הם מסמנים מי לא נסע ומי בלי אחים. גם מי שהמשפט נכון לגביו רשאי להישאר לשבת.
      מוסיפים משפט רק מתנדבים, ורק על עצמם; בסבב ההרחבה, מי שנשאר בלי כיסא רשאי להעביר את התור למתנדב.
      צחוק או הערה על מי שקם, או על מי שלא קם — עוצרים מיד.
  - head: מי עלול להיפגע
    text: >-
      בחיפוש ״מה שונה בינינו?״ קל להגיע להבדלים שמסמנים — מראה, כסף, דת, משפחה. לכן הכלל במשימה: מחפשים
      הבדלים בתחביבים ובתחומי עניין בלבד. מי שעומד לבד ולא מוצא עם מי לדבר — הצטרפי אליו בעצמך, בלי להעיר
      על זה.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״קיר חתימות כיתתי״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - same
      - different
      - needle
    text: בשני החיפושים — שתי דקות לכל סבב, ובשאלת התמונה שומעים רק שתי תשובות

brain_break:
  signs: רעש שלא נרגע אחרי החיפושים, או להפך — עיניים כבדות ושקט שלא נשבר.
  ideas:
    - name: פרח ונר
      text: מריחים פרח בדמיון — שואפים לאט באף; מכבים נר — נושפים לאט בפה. חמש פעמים.
    - name: מחיאה במעגל
      text: מחיאת כף אחת עוברת מכיסא לכיסא סביב המעגל, כמה שיותר מהר. בסבב השני — בכיוון ההפוך.
    - name: פסל קפוא
      text: כולם קמים וזזים במקום; במחיאת כף קופאים כמו פסל. שלושה סבבים, ומתיישבים.
  from: wind2

