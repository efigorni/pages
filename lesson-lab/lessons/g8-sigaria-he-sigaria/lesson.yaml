  # ------------------------------------------------------------------ 17′–22′
  - id: facts
    title: מה עוד חשוב לדעת?
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      שלושה שקפי מידע מהמקור — מהי סיגריה אלקטרונית, כמה שאיפות יש בחד־פעמית, ומה ניקוטין עושה למוח המתבגר
    body:
      - slide:
          kicker: מהי סיגריה אלקטרונית?
          title: מתקן אידוי שמדמה את פעולת העישון
          sub: בלי עלי טבק ובלי בעירה — אבל בדרך כלל עם ניקוטין נוזלי, טעמים ותוספים.
          verbatim:
            - title
          echo: true
          alt: ספר פתוח, וזכוכית מגדלת לידו
          art:
            - {use: book, x: 60, y: 260, w: 300}
            - {use: magnifier, x: 370, y: 80, w: 200}
      - moves:
          - הציגי את ההגדרה בקצרה.
          - >-
            בשקף החד־פעמית — שאלי, וחכי חמש שניות. כל אחד מראה באצבעות ניחוש: כמה חפיסות סיגריות? רק אחר כך חשפי את
            המספר, ומשווים יחד: עד 3,000 שאיפות ביחידה אחת, לעומת 200–300 בחפיסה — יחידה אחת יכולה להיות שווה לכמה
            חפיסות.
          - חשפי את ההשפעות על המוח אחת־אחת, ושאלי מה הפתיע. הזמיני את הכיתה להגיב זו לזו.
      - slide:
          kicker: הסיגריה החד־פעמית
          title: כמה שאיפות יש בסיגריה אלקטרונית חד־פעמית?
          sub: בחפיסת סיגריות רגילה — בממוצע כ־200 עד 300 שאיפות.
          points:
            - מ־200 ועד 3,000 שאיפות ביחידה אחת.
          echo: true
          cue: אחרי ההגדרה —
          alt: מאזניים, וסיגריה לידם
          art:
            - {use: scale, x: 220, y: 190, w: 340}
            - {use: cigarette, x: 50, y: 90, w: 150}
      - ask: כמה חפיסות סיגריות יש, לדעתכם, בסיגריה אלקטרונית חד־פעמית אחת? הראו באצבעות.
      - slide:
          kicker: לסיכום
          title: ניקוטין ממכר — כמו בסיגריה רגילה
          points:
            - פגיעה בהתפתחות המוח
            - פגיעה ביכולות למידה וזיכרון
            - הפרעות קשב ולמידה
            - אימפולסיביות והפרעות במצבי רוח
          echo: true
          cue: אחרי הניחושים —
          alt: מוח, ומגן קטן לידו
          art: {file: art/brain.svg}
      - whisper: >-
          המקור מוסיף: היקף הנזקים לטווח הארוך עוד לא נחשף, כי המוצר חדש יחסית — אבל מתחילות להיחשף עדויות על סכנות
          לטווח הקצר והבינוני. מנגנון ההתמכרות לניקוטין דומה למנגנון ההתמכרות לסמים קשים. הסיגריה החד־פעמית זולה
          הרבה יותר, נגישה וקלה לשימוש.
      - ask: מה מהמידע הזה הפתיע אתכם — ולמה?
      - say: ועכשיו — מישהו שיש לו מה להגיד על המוח.

  # ------------------------------------------------------------------ 22′–27′
  - id: rabbit
    title: למוח אין חלקי חילוף
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - אחריות ובחירה
      - עניין ורלוונטיות
    summary: >-
      התשדיר של הארנב; אחריו — שאלות ״מכוונה למעשה״ של המקור, וחוזרים ללוח: על אילו שאלות קיבלנו היום תשובה
    body:
      - moves:
          - הציגי את השאלה שלפני הצפייה, ושמעי שתי השערות.
          - הפעילי את התשדיר, ועצרי לפני המשפט האחרון.
          - >-
            אחרי הצפייה — שאלי מה הם מרגישים וחושבים על דברי הארנב, ואחר כך את שאלת ההחלטה. חכי חמש שניות לפני כל
            תשובה.
          - >-
            חוזרים ללוח: על אילו פתקיות שאלה קיבלנו היום תשובה? על שאלה שנשארה פתוחה — שאלי איפה אפשר לבדוק אותה, ומי
            עומד מאחורי המידע שם.
      - video:
          title: הכירו את הארנב של האגודה למלחמה בסרטן
          url: https://www.youtube.com/watch?v=TVPDqiDmgUQ
          length: "0:55"
          before: ״למוח אין חלקי חילוף״ — למה הכוונה?
          watch: שימו לב לארנב — מה הוא מספר על עצמו, ולמה דווקא ארנב?
          pauses:
            - at: "?"
              moment: רגע לפני המשפט האחרון של התשדיר. צפי בו (0:55) לפני השיעור, וסמני כאן את הזמן.
              ask: מה, לדעתכם, הארנב יגיד בסוף?
          alt: מוח, ומגן קטן לידו
          art: {file: art/brain.svg}
      - ask: מה תיקחו בחשבון כשתתלבטו אם להשתמש בסיגריה אלקטרונית?

  # ------------------------------------------------------------------ +5′
  - id: friends
    title: החברים שלי ואני
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: מה אומרים לחבר טוב שרוצה לעשן סיגריה אלקטרונית, ולמה לדעתנו בני נוער בוחרים לעשן
    body:
      - slide:
          kicker: אם נשאר זמן · חושבים · בזוגות · משתפים
          title: אם חבר טוב שלכם ירצה לעשן סיגריה אלקטרונית — מה תאמרו לו?
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          alt: שני חברים יד ביד, ושתי בועות שיחה מעליהם
          art:
            - {use: pair, x: 50, y: 236, w: 250}
            - {use: chat, x: 300, y: 40, w: 280}
      - moves:
          - שאלי, וחכי 30 שניות. דקה בזוגות — כל אחד מנסח משפט שהיה אומר לחבר.
          - שמעי שלושה–ארבעה משפטים, ושאלי את הכיתה איזה מהם היה עובד עליהם.
      - say: עכשיו כשאנחנו יודעים יותר — מה תגידו לחבר? משפט אחד, כזה שאפשר באמת להגיד.
      - ladder:
          help: התחילו ב״אכפת לי ממך, ולכן…״
          challenge: מה תענו אם החבר יגיד ״זה רק אדים, זה לא כמו סיגריה״?
      - ask: ולמה, לדעתכם, בני נוער בוחרים לעשן סיגריה אלקטרונית?

