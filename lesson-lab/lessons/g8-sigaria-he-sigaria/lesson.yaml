sub: >-
  סיגריה אלקטרונית נראית לפעמים כמו משהו תמים. בשיעור הזה בודקים מה אנחנו חושבים עליה ומה אנחנו יודעים, צופים
  בשני סרטונים קצרים — ושואלים מי עומד מאחורי המידע.
format: פתקיות, זוגות ומליאה
question: מה אני באמת יודע על סיגריה אלקטרונית — ומה יעזור לי להחליט?
takeaways:
  - סיגריה אלקטרונית מכילה בדרך כלל ניקוטין — היא ממכרת כמו סיגריה רגילה, ומסוכנת לבריאות.
  - ניקוטין עלול לפגוע בהתפתחות המוח של מתבגרים — בלמידה, בזיכרון ובקשב.
  - כשנחשפים למידע, חשוב לברר מי עומד מאחוריו — ולבני הנוער יש את הכוח לומר לא.
prep:
  - >-
    פתקיות דביקות בשני צבעים, שתיים לכל תלמיד; ועל הלוח, לפני השיעור, שני טורים: ״מה אנחנו יודעים״ ו״על מה
    רוצים תשובה״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — סיגריות אלקטרוניות. שאלי אם יש בכיתה מי שכבר מעשן, מי שמעשנים אצלו בבית, או מי
      שחבורה לוחצת עליו עכשיו לנסות. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      בהיגדים יש תיוגים, כמו ״מי שמעשן הוא חלש אופי״. מדברים על ההיגד ועל הסיגריה — לא על ״מעשנים״ כאנשים — ולא
      שואלים מי מעשן או מי מכיר מעשנים. מי שמעשנים לידו או אצלו בבית לא צריך להסביר כלום.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בהיגדים מצביעים בעיניים עצומות, על דעה ולא
      על הרגל, ומסבירים רק מתנדבים; את שאלות המקור ״האם יש לך חברים שמעשנים?״ לא שואלים בקול. מותר לוותר, ולא
      קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל לחץ לעשן שקורה עכשיו, חבר שכבר מכור, או עישון בבית שמפריע לו — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת: ער״ן 1201 — עזרה
      ראשונה נפשית, 24/7; ולמי שכבר מעשן ורוצה להפסיק — המוקד הלאומי לגמילה מעישון של משרד הבריאות, 6800* (א׳–ה׳,
      8:00–20:00, ללא תשלום, גם לבני נוער).

