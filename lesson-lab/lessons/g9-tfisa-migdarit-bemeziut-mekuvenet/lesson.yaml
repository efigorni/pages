# תפיסה מגדרית במציאות מקוונת — כיתה ט׳, נקודת מבט, שיעור 2 (מקור: sources/text/9/Tfisa_Migdarit_Bemeziut_Mekuvenet.md)
# הגלישה תלויה במכשירים — לכן שני מסלולים, עם מכשירים ובלי (D56). המסרים: שקף 15, ״סיכום המפגש״ (D51).
slug: g9-tfisa-migdarit-bemeziut-mekuvenet
title: תפיסה מגדרית במציאות מקוונת
grade: 9
grades_served: [9]
month: מרץ
section: מיניות בריאה ומניעת פגיעה מינית (מרץ)
unit: "נקודת מבט: פיתוח ראייה ביקורתית במציאות פוסט מודרנית"
unit_order: 2
