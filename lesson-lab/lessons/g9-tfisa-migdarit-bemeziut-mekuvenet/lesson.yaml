sensitivity: med

sub: >-
  סינדרלה כבר לא מחכה לנסיך. בשיעור הזה מגלים אילו מסרים על גבריות ונשיות עוברים ברשת, בגלוי ובסמוי,
  ומחליטים מה מהם שלנו.
format: זוגות, רביעיות ומליאה
question: אילו מסרים על גבריות ונשיות מגיעים אליי ברשת — ומה אני בוחר לעשות איתם?
takeaways:
  - תפיסות של גבריות ונשיות משתנות, והרשת מעבירה עליהן מסרים — גלויים וסמויים.
  - אפשר לזהות את המסרים האלה, ולשאול מה המחיר ומה הרווח בהם.
  - ביכולתנו לבחור את הקול שלנו — ולפעול לפיו.
prep:
  - >-
    ארבע שאלות הכתיבה של ״מחקרשת אישי״ ושלוש השאלות של ״מחקרשת קבוצתי״ — כתובות על הלוח לפני השיעור
  - >-
    פתקים דביקים בשני צבעים, שניים לכל תלמיד; ועל הלוח שתי כותרות — ״העמדות שלנו״ ו״יוצאים לפעולה״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — גבריות ונשיות, טרנדים ברשת ודימוי גוף. שאלי אם יש בכיתה מי שהנושא קרוב
      אליו מדי: מי שמקניטים אותו כי הוא לא ״מספיק גברי״ או לא ״מספיק נשית״, מי שדורג או הושפל ברשת, או מי
      שמתמודד עם דימוי גוף. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      הנושא נוגע בערכים, ובכיתה יש בתים שונים — מסורתיים יותר ופחות. כל עמדה שנאמרת בכבוד לגיטימית, ואין
      כוונה לשנות אף אחד. בלי הכללות על ״כל הבנים״ או ״כל הבנות״, ובלי חלוקה לקבוצות לפי מין. הכתבה על
      הדירוג בטיקטוק עלולה לגעת במי שדורג — מדברים על הטרנד, לא על מי שהשתתף בו.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. הכתיבה האישית נשארת במחברת, והפתקים
      על הלוח בלי שמות. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל דירוג משפיל, הטרדה ברשת או הקנטות קבועות על המראה או על ״מה מתאים לבן״ — עוצרים בעדינות, מודים,
      וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 13 דקות ומעלה — ההרחבה; פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - collage
      - group
    text: >-
      בקולאז׳ שומעים שתי כותרות בלבד; וברביעיות — רק הפריט שהזדהו איתו, בלי מליאה

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: מתיחה בשלוש
      text: קמים, מותחים ידיים למעלה, מתכופפים לימין ולשמאל, ובספירה עד שלוש מתיישבים.
    - name: חמש־ארבע־שלוש
      text: בשקט, כל אחד מוצא חמישה דברים שהוא רואה, ארבעה שהוא שומע ושלושה שהוא מרגיש בגוף.
    - name: מחיאות בשרשרת
      text: >-
        מחיאת כף אחת עוברת בין השולחנות כמו גל, בלי לדבר. בסבב השני — מהר יותר, ובשלישי — בכיוון ההפוך.
  from: next

cover:
  alt: טלפון, ולידו זוג דמויות עם כתר מעליהן
  art: {file: art/cover.svg}

steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: collage
    title: קולאז׳ — כותרת אחת לשלוש תמונות
    minutes: 7
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      שלוש תמונות שהופכות את האגדה — כותרת אחת בזוגות, ומה משותף להן; שם השיעור, ולמה לדבר על זה היום
    body:
      - slide:
          kicker: קולאז׳ · תרגיל פתיחה
          title: התבוננו בתמונות שלפניכם
          sub: תנו כותרת אחת לשלוש התמונות.
          verbatim: true
          echo: true
          alt: מצלמה, ובועת דיבור עם המילה ״כותרת?״
          art:
            - {use: camera, x: 300, y: 220, w: 260}
            - {use: speech, x: 50, y: 40, w: 230}
            - text: כותרת?
              x: 165
              y: 120
              size: 40
      - source_slide:
          slides: 8
          why: >-
            שלוש התמונות של הקולאז׳ — נסיכה שרוכבת לבד על סוס, נערה שעוזרת לנער לטפס, וילד וילדה בבגדי נסיך
            ונסיכה עם פרח ביניהם. הן נמצאות רק במצגת המקורית.
          alt: מחשב נייד — עוברים למצגת המקורית
      - moves:
          - השקף על המסך כשהכיתה נכנסת. עברי לשקף הקולאז׳, וחצי דקה מתבוננים בשקט.
          - דקה בזוגות — כותרת אחת לשלוש התמונות. שמעי ארבע־חמש כותרות, ורשמי אותן על הלוח.
          - >-
            אחרי הכותרות — עברי איתם על כל תמונה: מה רואים בה, ומה הפוך בה ממה שמקובל באגדות. ואז שאלי מה
            משותף לשלוש.
          - חזרי למצגת שלנו, הציגי את שם השיעור, ואמרי למה מדברים על זה היום.
      - tip: >-
          המטרה היא השיח, לא הכותרת. בתמונה הראשונה הנסיכה רוכבת לבד, ולא הנסיך מרכיב אותה; בשנייה הנערה
          עוזרת לנער לטפס; בשלישית לא ברור מי נותן את הפרח למי.
      - ladder:
          help: תנו לכל תמונה שם של מילה אחת — ואז חפשו מה חוזר בשלוש.
          challenge: איך הייתה נראית כל תמונה באגדה הרגילה — ומה זה אומר על הכותרת שלכם?
      - ask: איזו כותרת אחת הייתם נותנים לשלוש התמונות — ומה משותף להן?
      - slide:
          kicker: שם השיעור
          title: כשסינדרלה והנסיך הגיעו לTik-Tok
          sub: גבריות ונשיות במציאות משתנה
          verbatim: true
          echo: true
          cue: אחרי הכותרות —
          alt: טלפון, ולידו זוג דמויות עם כתר מעליהן
          art: {file: art/cover.svg}
      - say: >-
          פעם היה ברור מה ״של בנים״ ומה ״של בנות״, והמסרים הגיעו מהמשפחה ומהשכונה. היום אין אמת אחת,
          והמסרים מגיעים מכל העולם בכל רגע — ולכן צריך לדעת לסנן, לחשוב בעין ביקורתית, ולבחור מה נכון לנו.

  # ------------------------------------------------------------------ 7′–16′
  - id: research
    title: בחרי מסלול — מחקרשת אישי
    minutes: 9
    summary: כל אחד מחפש מסרים גלויים וסמויים על גבריות ונשיות, וכותב לעצמו עמדה
    body:
      - tracks:
          - title: גולשים בקישורים
            text: >-
              כל זוג גולש בטלפון או במחשב בחמשת הקישורים של המקור, בוחר מה לקרוא ולראות, וכל אחד כותב לעצמו
              מה מצא.
            when: יש לתלמידים טלפונים או מחשבים עם אינטרנט, ומותר להשתמש בהם בשיעור.
            practices:
              - הוצאה למשימה
              - כולם כותבים
            spotlights:
              - אחריות ובחירה
              - עניין ורלוונטיות
            prep:
              - חמשת הקישורים (בגוף המסלול) — נשלחים לקבוצת הכיתה לפני השיעור
            body:
              - slide:
                  kicker: מחקרשת אישי · בזוגות
                  title: אילו מסרים על גבריות ונשיות עוברים — בגלוי ובסמוי?
                  sub: גלשו בין הקישורים, וכתבו לעצמכם לפי השאלות שעל הלוח.
                  timer: 300
                  echo: true
                  alt: טלפון גדול, וזכוכית מגדלת לידו
                  art:
                    - {use: phone, x: 330, y: 130, w: 170}
                    - {use: magnifier, x: 150, y: 230, w: 200}
              - moves:
                  - >-
                    הקישורים כבר אצל התלמידים. הציגי את השקף, ובקשי מכל זוג להתחיל מקישור אחר — כדי שברביעיות
                    יהיה על מה לספר.
                  - >-
                    חמש דקות של גלישה וכתיבה. כל אחד כותב לעצמו, גם כשגולשים בזוג. הסתובבי, ושימי לב אילו
                    מסרים חוזרים.
              - list:
                  - >-
                    ״להפוך את הסלפי״ (סרטון, דקה) — https://www.youtube.com/watch?v=ZD4qpz0YVIs · היופי במראה
                    הטבעי, להיות אני, ומודעות ללחץ חברתי
                  - >-
                    ״משחקי וידאו הופכים נערים לסקסיסטים״ (כתבה) — https://www.israelhayom.co.il/article/465415 ·
                    משחקים עלולים להעביר, גם בסמוי, מסרים לא נכונים על גבריות, נשיות ומיניות פוגענית
                  - >-
                    ״שבוע הנערה הישראלית״ (סרטון, פחות מדקה) — https://youtu.be/cxp4YLQUuPo · דימוי עצמי חיובי
                    ושפת הגוף
                  - >-
                    ״טרנד מדאיג — תלמידים מדרגים מי הכי יפה ומפרסמים בטיקטוק״ (כתבה, 2:55) —
                    https://www.youtube.com/watch?v=6Tk1x_FcPN0 · טרנד שהופך בנים ובנות לחפץ; לעמוד מול לחץ
                    חברתי, ולעצור טרנד פוגע
                  - >-
                    ״למרות המחאה — חלוקה מגדרית בצעצועים״ (כתבה) — https://www.ynet.co.il/article/4895750 ·
                    הסללה מגדרית, והיכולת שלנו לא לשתף איתה פעולה
              - say: >-
                  חמש דקות. גלשו בצורה חופשית בין הקישורים, ותוך כדי כתבו לעצמכם לפי השאלות שעל הלוח.
              - board:
                  - אילו מסרים על גבריות ונשיות עוברים באופן סמוי וגלוי? כתבו את המסרים שאתם מזהים.
                  - מתוך המסרים שמצאתם, מה מדבר אליכם? עם אלו מסרים אתם מסכימים ועם אלו לא?
                  - כתבו לעצמכם מחשבה או עמדה אישית שהגעתם אליה בעקבות הפעילות.
                  - האם יש לעמדה הזו מחירים או רווחים? מהם?
              - task:
                  what: >-
                    גולשים בצורה חופשית בין חמשת הקישורים, וכל אחד כותב לעצמו לפי ארבע השאלות שעל הלוח.
                  time: 5 דקות
                  group: זוגות; כל אחד כותב לעצמו
                  rules: כל זוג מתחיל מקישור אחר משל הזוג הסמוך; כותבים מה מצאנו, לא מה ״נכון״
                  plenary: אין — ממשיכים לרביעיות
                  help: בחרו מסר אחד שראיתם, ושאלו — מי אומר אותו, ולמי?
                  challenge: מצאו מסר סמוי — כזה שלא נאמר במילים, אבל עובר בתמונה, במשחק או בצעצוע.
          - title: צופים יחד
            text: >-
              בלי מכשירים — מקרינים לכל הכיתה כתבת חדשות על טרנד של דירוג בטיקטוק, וכל אחד כותב לעצמו מה
              מצא.
            when: אין מכשירים בכיתה, או שעדיף שהטלפונים יישארו בתיק.
            practices:
              - כולם כותבים
            spotlights:
              - עניין ורלוונטיות
              - הערכה ורפלקטיביות
            body:
              - video:
                  title: טרנד מדאיג — תלמידים מדרגים מי הכי יפה ומפרסמים בטיקטוק
                  url: https://www.youtube.com/watch?v=6Tk1x_FcPN0
                  length: "2:55"
                  before: איזה מסר על בנים ועל בנות עובר בדירוג של ״מי הכי יפה״?
                  watch: שימו לב למה שהתלמידים בכתבה מדרגים — ולמה שלא נכנס לדירוג בכלל.
                  pauses:
                    - at: "?"
                      moment: >-
                        הרגע שבו מוצג לראשונה סרטון הדירוג מטיקטוק. צפי בכתבה לפני השיעור, ורשמי כאן את הזמן.
                      ask: מה עובר עכשיו על מי שמדורג — ועל מי שמדרג?
                  alt: טלפון עם התראות, אגודל למעלה ואגודל למטה
                  art:
                    - {use: phone-notify, x: 330, y: 140, w: 200}
                    - {use: thumb-up, x: 90, y: 100, w: 130}
                    - {use: thumb-down, x: 150, y: 300, w: 130}
              - moves:
                  - הציגי את השאלה שלפני הצפייה, הפעילי את הכתבה, ועצרי בנקודת העצירה.
                  - אחרי הצפייה — שלוש דקות של כתיבה לבד, לפי השאלות שעל הלוח.
              - board:
                  - אילו מסרים על גבריות ונשיות עוברים באופן סמוי וגלוי? כתבו את המסרים שאתם מזהים.
                  - מתוך המסרים שמצאתם, מה מדבר אליכם? עם אלו מסרים אתם מסכימים ועם אלו לא?
                  - כתבו לעצמכם מחשבה או עמדה אישית שהגעתם אליה בעקבות הפעילות.
                  - האם יש לעמדה הזו מחירים או רווחים? מהם?
              - ladder:
                  help: בחרו מסר אחד מהכתבה, ושאלו — מי אומר אותו, ולמי?
                  challenge: מצאו מסר סמוי — כזה שלא נאמר במילים, אבל עובר בדירוג עצמו.
      - say: כל אחד כתב לעצמו מסרים ועמדה. עכשיו נשמע מה מצאו אחרים — ברביעיות.

  # ------------------------------------------------------------------ 16′–22′
  - id: group
    title: מחקרשת קבוצתי
    minutes: 6
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
    summary: ברביעיות — פריט שהזדהיתי איתו או שהתנגדתי לו, ומה מהמסרים משפיע עלינו; במליאה — על מה לא הסכמנו
    body:
      - slide:
          kicker: מחקרשת קבוצתי · ברביעיות
          title: מה מצאנו — ומה זה עושה לנו?
          sub: שתפו ברביעייה לפי השאלות שעל הלוח.
          timer: 240
          alt: ארבעה סביב שולחן, ושתי בועות צ׳אט מעליהם
          art:
            - {use: circle4, x: 120, y: 210, w: 300}
            - {use: chat, x: 380, y: 30, w: 210}
      - moves:
          - >-
            שני זוגות סמוכים מתאחדים לרביעייה. במסלול ״גולשים בקישורים״ — כדאי שבכל רביעייה יהיו זוגות שהתחילו
            בקישורים שונים.
          - הסתובבי והקשיבי. דקה לפני הסוף — הודיעי.
          - במליאה — שמעי שתיים־שלוש רביעיות, והזמיני את הכיתה להגיב — ״מי חושב אחרת?״
      - board:
          - פריט אחד שהזדהיתי איתו, או שעורר בי התנגדות.
          - עם אלו מסרים אתם מסכימים ועם אלו מסרים לא? דברו על זה בקבוצה.
