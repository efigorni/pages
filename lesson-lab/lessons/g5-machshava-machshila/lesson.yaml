  alt: ענן מחשבה
steps:
- id: part-1
  title: מילה אחת, מחשבות שונות
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: מילה אחת, מחשבות שונות — מה המילה משחק מזכירה לכם?
  body:
  - slide:
      title: מה המילה משחק מזכירה לכם?
      art:
      - use: thought
        x: 180
        y: 120
        w: 250
      alt: ענן מחשבה
      echo: true
  - moves:
    - תני שלוש דקות לכתיבת אסוציאציה ומילה של רגש.
    - אספי שלוש תשובות שונות והראי שאותה מילה אינה יוצרת אותה מחשבה אצל כולם.
  - ask: מה המילה משחק מזכירה לכם?
  - ladder:
      help: אפשר לחשוב על חצר, כדור, תור או חבר.
      challenge: איך זיכרון קודם יכול לשנות את האסוציאציה?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: לא סופרים אותי!
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: לא סופרים אותי! — מה אדם יודע, ומה הוא חושב?
  body:
  - slide:
      title: מה אדם יודע, ומה הוא חושב?
      art:
      - use: magnifier
        x: 180
        y: 120
        w: 250
      alt: זכוכית מגדלת
      echo: true
      sub: ''
  - moves:
    - 'ספרי: אדם מתארגן למשחק כדורסל חשוב.'
    - חבריו כבר במעגל העידוד ולא קוראים לו.
    - הוא נפגע, מתקשה להתרכז ומאבד כדור.
    - רשמי בנפרד עובדה ומחשבה אפשרית.
    - בזוגות מצאו מילים מוחלטות כמו תמיד וכולם והציעו שאלה לבדיקה.
  - ask: מה אדם יודע, ומה הוא חושב?
  - task:
      what: הפרידו עובדה ומחשבה בסיפור הכדורסל. חפשו ניסוח מוחלט והפכו אותו לשאלה שאפשר לבדוק.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: האם אנחנו יודעים מדוע לא קראו לו?
      challenge: אפשר להרגיש עלבון גם אם עוד אין תשובה לשאלה?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: ארבעת הצעדים
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: ארבעת הצעדים — איך נותנים למחשבה מקום בלי שתנהל אותנו?
  body:
  - slide:
      title: איך נותנים למחשבה מקום בלי שתנהל אותנו?
      art:
      - use: road
        x: 180
        y: 120
        w: 250
      alt: דרך
      echo: true
      sub: ''
  - source_slide:
      slides:
      - 12
      why: מציגים את התוכן המקורי המתואר בפעילות וקוראים רק את החלק הדרוש לתרגול.
      art:
      - use: road
        x: 180
        y: 120
        w: 250
      alt: דרך
  - moves:
    - 'הציגי ארבע תחנות על הדף: לזהות מחשבה; להפוך סימן קריאה לשאלה; לומר אני חושב כרגע ולתת שם לרגש;
      לבחור פעולה לפי מה שחשוב.'
    - הדגימי על אדם.
    - כל זוג כותב ארבע בועות קצרות; אין צורך להרגיש טוב לפני הצעד האחרון.
  - ask: איך נותנים למחשבה מקום בלי שתנהל אותנו?
  - task:
      what: 'כתבו ארבע בועות לאדם: מחשבה; שאלה; שם לרגש ולמחשבה כרגע; פעולה לפי מה שחשוב לו.'
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: התחילו בלא סופרים אותי, והוסיפו כרגע אני חושב...
      challenge: איזו פעולה אפשר לבחור גם אם עדיין לא יודעים מה חשבו החברים?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: דנה לפני הדיבור בכיתה
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: דנה לפני הדיבור בכיתה — מה תעשה דנה למרות החשש?
  body:
  - slide:
      title: מה תעשה דנה למרות החשש?
      art:
      - use: speech
        x: 180
        y: 120
        w: 250
      alt: בועת דיבור
      echo: true
      sub: ''
  - moves:
    - 'ספרי שדנה נבחרה להציג ונלחצה: היא בטוחה שלא תצליח לדבר.'
    - כל זוג בונה קומיקס קצר של ארבעת הצעדים.
    - אחד מציג את המשפט הפנימי והשני מציע צעד קטן, כמו לתרגל משפט ראשון עם חבר.
    - אפשר לבקש סיוע או התאמה, ולא לכפות הופעה.
  - ask: מה תעשה דנה למרות החשש?
  - task:
      what: בנו קומיקס קצר לדנה שחוששת לדבר בכיתה. תנו מקום לחשש והציעו צעד קטן ותמיכה אפשרית.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה דנה רוצה שיצליח, ומה יעזור לה להתחיל?
      challenge: איך מציעים תמיכה בלי להבטיח שהפחד ייעלם?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - שמנו לב שלפעמים מצב הרוח שלנו משתנה בבת אחת . במצבים האלה כדאי שנשים לב למחשבה שעברה בראשנו באותו
        זמן.
      - הבנו, שהסיבה שהמחשבות האלה מכשילות אותנו היא הצגתן כ"עובדות משכנעות", שמשפיעות על ההתנהגות שלנו
        ועל היחסים שלנו עם אנשים אהובים סביבנו.
      - שימוש בכלי יעזור לנו לבחור כיצד להגיב על פי המטרות החשובות לנו באמת.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - הפכו מחשבה מוחלטת אחת לשאלה שאפשר לבדוק.
      - מהו צעד קטן שאפשר לבחור גם כשההרגשה לא נעימה?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: לא מבקשים לחשוף כישלון אישי ולא מחייבים תלמיד להופיע מול הכיתה.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
