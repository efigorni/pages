  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — בכוונתי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: מהי הסכמה אמיתית, סימן אחד לזיהוי שלה, ומה בכוונתי לעשות ממחר; פתקים נאספים בדלת
    body:
      - say: >-
          שלוש שאלות קצרות, לבד ובשקט — שלוש דקות. כתבו רק מה שנוח לכם. כולם מוסרים פתק בדלת, גם מי שכתב רק
          שורה אחת.
      - exit:
          form: board
          title: בכוונתי…
          prompts:
            - השלימו — הסכמה אמיתית היא…
            - סימן אחד שיעזור לי לזהות אם הסכמה — שלי או של מישהו אחר — אמיתית.
            - מה בכוונתי לעשות ממחר? בכוונתי…
          look_for: >-
            חפשי בלבול בין הסכמה לבין ״לא אמרו לא״ או ״הסכימו פעם אחת״, כוונות כלליות מדי, וכל פתק שמספר על
            לחץ או כפייה שקורים עכשיו. עם אלה מדברים בשקט השבוע — ומה שנוגע בפגיעה עובר ליועצת עוד היום.
          timer: 180
          alt: דמות כותבת ליד שולחן, ווי לידה
          art:
            - {use: kid-desk, x: 240, y: 120, w: 280, color: teal}
            - {use: check, x: 50, y: 60, w: 140}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
