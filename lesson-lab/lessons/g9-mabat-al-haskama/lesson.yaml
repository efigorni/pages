          challenge: כשראש הקבוצה קורא — חפשו מילה שחוזרת בכמה משפטים.

  # ------------------------------------------------------------------ 7′–12′
  - id: talk
    title: מה גיליתם?
    minutes: 5
    practices:
      - הוצאה למשימה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      בקבוצות — מה משותף למשפטים, ולמה אנחנו עושים דברים בניגוד לרצוננו; במליאה — מצבים מחייבים מול לחץ
    body:
      - slide:
          kicker: בקבוצות הקטנות
          title: מה גיליתם?
          points:
            - האם מצאתם קווים משותפים בין התשובות של חברי הקבוצה?
            - מדוע אנחנו לפעמים עושים דברים בניגוד לרצוננו?
            - למה הייתי זקוק/ה כדי שאוכל לפעול בהתאם למה שבאמת רציתי?
          verbatim: true
          timer: 120
          echo: true
          alt: ארבעה סביב שולחן, ונורה דולקת מעליהם
          art:
            - {use: circle4, x: 150, y: 190, w: 300}
            - {use: bulb, x: 450, y: 40, w: 130}
      - moves:
          - שתי דקות בקבוצות, על שלוש השאלות שבשקף.
          - >-
            במליאה — שמעי מכמה קבוצות מה גילו, והזמיני תגובות — ״למי עוד זה מוכר?״. אחר כך הבחיני יחד איתם
            בין מצבים מחייבים לבין לחץ.
      - task:
          what: מדברים בקבוצה על שלוש השאלות שבשקף, לפי המשפטים שנקראו.
          time: 2 דקות
          group: אותן קבוצות
          rules: מדברים על המשפטים, לא מנחשים מי כתב מה
          plenary: נציג מכל קבוצה — קו משותף אחד שמצאו
          help: חפשו מילה שחוזרת במשפטים — ״לא נעים״, ״פחדתי ש…״, ״כולם…״.
          challenge: מה ההבדל בין מצב שבו חייבים להסכים — למשל חוק — לבין מצב שבו רק לוחצים עלינו?
      - ask: מה גיליתם — אילו סיבות חוזרות אצל כולנו?
      - say: >-
          יש מצבים מחייבים, שלא מתווכחים איתם — חוק, כללי המשפחה, מסורת. ויש מצבים שבהם לוחצים עלינו —
          חברים, בן או בת זוג, הרצון לרצות. ושם השאלה היא אם ההסכמה שלנו אמיתית.
      - whisper: >-
          תני לגיטימציה לבלבול: לפעמים קשה לזהות מה אנחנו רוצים — ובוודאי מה רוצה האחר — ויש לנו רצונות
          מנוגדים גם בתוכנו.

  # ------------------------------------------------------------------ 12′–18′
  - id: concept
    title: הסכמה חופשית — והסכמה במסכה
    minutes: 6
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: מהי הסכמה חופשית, מתי זו לא הסכמה חופשית, ומה אומר החוק
    body:
      - moves:
          - שאלי, וחכי עשר שניות לפני שאת מזמינה תשובות. שמעי שתיים־שלוש.
          - הציגי את שני סוגי ההסכמה, והקריאי את ההגדרה.
          - הציגי מתי זו לא הסכמה חופשית, והקריאי מה אומר החוק.
      - ask: אם לא כל הסכמה היא אמיתית — מה הופך הסכמה לאמיתית?
      - slide:
          kicker: ההמשגה
          title: שני סוגים של הסכמה
          sub: לפעמים ניתנת הסכמה שאינה תואמת את הרצון האמיתי שלנו.
          verbatim: [sub]
          echo: true
          alt: וי ומסכה, וקו מנוקד ביניהם — הסכמה חופשית והסכמה במסכה
          art: {file: art/consent.svg}
      - quote:
          title: מהי הסכמה חופשית (אמיתית)? — להקריא
          text: |-
            הסכמה חופשית היא הסכמה שנובעת מרצון הדדי, וניתנת באופן מפורש ונלהב.
            זה מצב בו לא מופעל לחץ, מצב שבו אפשר להסכים אבל אפשר גם לסרב, בלי לחשוש.
            מצב שבו אפשר להגיד כן! ואפשר להגיד לא! ושניהם יכולים להתקבל במידה שווה.
      - slide:
          kicker: מהי הסכמה חופשית?
          title: אפשר להגיד כן! ואפשר להגיד לא!
          sub: ושניהם יכולים להתקבל במידה שווה.
          verbatim: true
          echo: true
          cue: אחרי ההגדרה —
          alt: אגודל למעלה ואגודל למטה, זה לצד זה
          art:
            - {use: thumb-up, x: 340, y: 140, w: 180}
            - {use: thumb-down, x: 100, y: 190, w: 180}
      - slide:
          kicker: ההמשגה
          title: מתי זו לא הסכמה חופשית?
          verbatim: [title]
          points:
            - אלימות, לחץ, סחיטה או איומים
            - חוסר הכרה — למשל אחרי סמים ואלכוהול
            - סמכות — מורה ותלמיד, מדריך וחניך, מעסיק ועובד
          echo: true
          cue: אחר כך —
          alt: סרט אדום — קו אדום, ועיגול עם איקס מעליו
          art:
            - {use: red-line, x: 110, y: 250, w: 400}
            - {use: cross, x: 230, y: 70, w: 160}
      - quote:
          title: מתי זו לא הסכמה חופשית — להקריא
          text: |-
            זאת לא הסכמה חופשית אם היא מושגת באמצעות אלימות, לחץ, סחיטה או איומים.
            זו לא הסכמה חופשית אם מי שאתך נמצא/ת במצב של חוסר הכרה או הכרה מעורפלת למשל בעקבות צריכה מרובה של סמים ואלכוהול.
            זו לא הסכמה חופשית אם לאדם אחד יש סמכות או אחריות על האדם השני למשל מורה- תלמיד/ה, מדריכ/ה – חניכ/ה, הורה-ילד/ה, מעסיק/ה – עובד/ת.
      - quote:
          title: החוק — להקריא
          text: >-
            על פי חוק, הסכמה חופשית קיימת רק מעל גיל 14. יחד עם זאת, בין הגילאים 14-16 קיום יחסי מין גם אם
            היתה הסכמה יחשב עברה על החוק אם פער הגילאים הוא מעל 3 שנים.
      - say: >-
          והסכמה היא לא צ׳ק פתוח: הסכמה למשהו אחד היא לא הסכמה למשהו אחר, הסכמה פעם אחת היא לא הסכמה לתמיד,
          והסכמה עם אדם אחד היא לא הסכמה עם אדם אחר.

  # ------------------------------------------------------------------ 18′–26′
  - id: phones
    title: תרגיל הטלפונים
    minutes: 8
    stance: true
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: חמישה מצבים מהחיים; כל אחד מצביע — הסכמה אמיתית, לא אמיתית או לא בטוחים — ומתנדב מכל צד מסביר
    body:
      - slide:
          kicker: תרגיל הטלפונים
          title: האם זו הסכמה אמיתית?
          verbatim: [title]
          points:
            - פנס דולק — הסכמה אמיתית
            - בלי פנס — לא הסכמה אמיתית
            - הטלפון על השולחן — לא בטוחים
          echo: true
          alt: טלפון מונף, ואלומת אור עולה ממנו
          art: {file: art/flashlight.svg}
      - moves:
          - הציגי את שלושת הסימנים. אם אין טלפונים בשיעור — אגודל למעלה, אגודל למטה, או יד שטוחה על השולחן.
          - לכל מצב — הקריאי אותו, חכי חמש שניות של שקט, ובספירה עד שלוש כולם מצביעים יחד.
          - >-
            שאלי מתנדב אחד מכל צד למה בחר כך, ואז ״מי חושב אחרת?״. מי שנבחר יכול להעביר את השאלה למתנדב.
          - אחרי המצב החמישי — שאלת הסיכום.
      - say: >-
          לפני כל מצב חושבים לבד חמש שניות, בלי להסתכל על אף אחד — ורק אז מצביעים. ״לא בטוחים״ היא תשובה
          מלאה, ומסבירים רק מתנדבים.
      - slide:
          kicker: מצב 1 מתוך 5
          title: אני לא לובשת חצאית מיני למסיבה כי חבר שלי מתנגד לזה..
          verbatim: true
          echo: true
          cue: אחרי ההסבר —
          alt: שתי דמויות, ובועת דיבור עם איקס מעל אחת מהן
          art:
            - {use: kid-stand, x: 380, y: 240, w: 130, color: teal}
            - {use: kid-stand, x: 110, y: 240, w: 130, color: purple}
            - {use: speech-l, x: 170, y: 30, w: 220}
            - {use: cross, x: 235, y: 62, w: 90}
      - slide:
          kicker: מצב 2 מתוך 5
          title: חבר שלי ניתק את הקשר מידידה שלו לכיתה כי ביקשתי ממנו
          verbatim: true
          echo: true
          cue: המצב הבא —
          alt: שתי דמויות רחוקות זו מזו, ועיגול עם איקס ביניהן
          art:
            - {use: kid-stand, x: 400, y: 240, w: 130, color: purple}
            - {use: kid-stand, x: 90, y: 240, w: 130, color: moss}
            - {use: cross, x: 245, y: 150, w: 130}
      - slide:
          kicker: מצב 3 מתוך 5
          title: אנחנו בתחילת קשר וחבר שלי ביקש לנשק אותי לראשונה והסכמתי
          verbatim: true
          echo: true
          cue: המצב הבא —
          alt: שתי דמויות יד ביד, ולב מעליהן
          art:
            - {use: pair, x: 190, y: 250, w: 240}
            - {use: heart, x: 230, y: 40, w: 160}
      - slide:
          kicker: מצב 4 מתוך 5
          title: במשחק אמת או חובה
          sub: קבעו שאני חייבת להתנשק עם יוני נשיקה צרפתית.
          verbatim: true
          echo: true
          cue: המצב הבא —
          alt: שלוש דמויות, ובועת דיבור עם סימן קריאה מעליהן
          art:
            - {use: group3, x: 140, y: 270, w: 320}
            - {use: speech, x: 330, y: 30, w: 210}
            - text: '!'
              x: 435
              y: 112
              size: 90
      - slide:
          kicker: מצב 5 מתוך 5
          title: בפעם הראשונה שיצאנו אכלנו בחוץ
          sub: והיא לא עשתה סימן שהיא מתכוונת לשלם ואני שילמתי עבור שנינו
          verbatim: true
          echo: true
          cue: המצב האחרון —
          alt: שתי דמויות יד ביד, ומאזניים לידן
          art:
            - {use: pair, x: 330, y: 250, w: 230}
            - {use: scale, x: 60, y: 100, w: 240}
      - tip: >-
          אין צורך להכריע בכל מצב. השאלה שמקדמת היא מה היה צריך לקרות כדי שזו תהיה הסכמה אמיתית — האם אפשר
          היה לסרב בלי לחשוש?
      - ask: מה הופך כאן את ההסכמה לאמיתית — או לא? מי חושב אחרת?

  # ------------------------------------------------------------------ 26′–30′
  - id: rules
    title: כללי אצבע לזיהוי הסכמה
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: איך בודקים אם הסכמה אמיתית, ושלושה כללי אצבע — ואיזה מהם הכי קשה ליישם
    body:
      - slide:
          kicker: בודקים
          title: איך נזהה הסכמה אמיתית?
          points:
            - בודקים מה רצון הצד השני? האם זה בסדר מבחינתך?
            - בודקים את שפת הגוף – הגוף לא יכול להתחפש.
            - אם אין תשובה ברורה זו אינה הסכמה .
          verbatim: true
          echo: true
          alt: שתי בועות דיבור, ובאחת מהן וי
          art:
            - {use: speech, x: 330, y: 40, w: 220}
            - {use: check, x: 385, y: 68, w: 110}
            - {use: speech-l, x: 70, y: 200, w: 220}
      - slide:
          kicker: כללי אצבע לזיהוי הסכמה
          title: לזהות · לדבר · לבדוק שוב
          points:
            - לזהות את הרצון שלי- מה מתאים לי כרגע?
            - לדבר עם האדם האחר- להיות קשובה לרצונות שלו
            - להכיר בכך שרצון יכול להשתנות- לבדוק את עצמי ואת האחר מדי פעם.
          verbatim: [points]
          echo: true
          cue: אחר כך —
          alt: רמזור, ושתי דמויות יד ביד לידו
          art:
            - {use: traffic-light, x: 400, y: 120, w: 150}
            - {use: pair, x: 110, y: 250, w: 230}
      - quote:
          title: כללי האצבע — הנוסח המלא מהמקור
          text: |-
            1 . לזהות את הרצון שלי- מה מתאים לי כרגע? האם זה מבטא רצון אמיתי או מושפע מאוד מלחץ של האחר? מלחץ פנימי שאני מרגיש/ה?
            2 . לדבר עם האדם האחר- להיות קשובה לרצונות שלו
            3. להכיר בכך שרצון יכול להשתנות- לבדוק את עצמי ואת האחר מדי פעם. להיות מוכן לשנות את מהלך הדברים אם מישהו מאיתנו שינה את רצונו.
      - moves:
          - הציגי את שלוש הבדיקות, ואחר כך את כללי האצבע.
          - שאלי, וחכי עשר שניות. שמעי שלושה, והזמיני את הכיתה להגיב.
      - ask: איזה כלל הכי קשה ליישם ברגע האמת — ולמה?
      - say: מכל מה שעשינו היום, כל אחד לוקח איתו כלל אחד — בכרטיס היציאה.

  # ------------------------------------------------------------------ +5′
  - id: tea
    title: כוס תה
    kind: extension
    minutes: 5
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: סרטון קצר שמסביר הסכמה בעזרת כוס תה, ואיזה כלל אצבע הוא מדגים
    body:
      - video:
          title: מה הקשר בין סקס לכוס תה?
          url: https://youtu.be/2uHlis2-ioY
          length: "2:54"
          before: מה יכול להיות הקשר בין הסכמה לכוס תה?
          watch: שימו לב לכל הפעמים שבהן התה כבר לא רצוי — ומה עושים אז.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו הסרטון עובר לדוגמה שבה מי שהציעו לו תה כבר לא רוצה אותו. צפי בסרטון לפני השיעור, ורשמי
                כאן את הזמן.
              ask: ומה עושים עכשיו עם התה? מילה אחת, בלחישה לשכן.
          alt: כוס תה מהבילה על תחתית
          art: {file: art/tea.svg}
      - moves:
          - הציגי את השאלה, הפעילי את הסרטון, ועצרי בנקודת העצירה.
          - אחרי הסרטון — שאלה אחת. חכי עשר שניות, ושמעי שתיים־שלוש תשובות.
      - ask: איזה כלל אצבע מהשיעור הסרטון מדגים?

