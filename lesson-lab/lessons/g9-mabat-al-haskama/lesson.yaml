# מבט על הסכמה והדדיות בקשר — כיתה ט׳, נקודת מבט, שיעור 4 (מקור: sources/text/9/Mabat_Al_Haskama.md)
# אין במקור שקף מסרים: כללי האצבע (שקף 25) הם רשימת כלים, והשיעור נסגר במשימות רפלקציה (שקפים 26–27) — לכן אין
# "חשוב לזכור" (D51), וכללי האצבע הם תוכן בשלב האחרון. תרגיל הטלפונים הוא הצבעה גלויה — עמידה פומבית (D54).
