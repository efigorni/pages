sub: >-
  ״נכון שהסכמתי, אבל…״ — כולנו מכירים את זה. בשיעור הזה בודקים מתי הסכמה היא אמיתית ומתי היא במסכה,
  מצביעים על מצבים מהחיים, ולומדים כללי אצבע לזיהוי הסכמה.
format: קבוצות, הצבעה ומליאה
question: איך יודעים שהסכמה — שלי או של מישהו אחר — היא אמיתית?
takeaways:
  - לא כל הסכמה היא אמיתית — יש הסכמה חופשית, ויש הסכמה במסכה.
  - הסכמה אמיתית היא כשאפשר להגיד כן ואפשר להגיד לא — ושניהם מתקבלים.
  - כדי לזהות הסכמה בודקים את הרצון שלי, מדברים עם האחר, וזוכרים שרצון יכול להשתנות.
prep:
  - דף לבן גדול לכל קבוצה, וחלוקה מראש לקבוצות של 5–6 לפי השולחנות
  - >-
    אם מותר טלפונים בשיעור — הם על השולחן לתרגיל הטלפונים; אם לא — מצביעים בידיים

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — הסכמה, לחץ ונשיקה ראשונה, עם הצצה לחוק. שאלי אם יש בכיתה מי שהנושא קרוב
      אליו מדי: מי שעבר פגיעה מינית או כפייה, מי שנמצא בקשר שלוחצים בו עליו, או מי שבבית שלו הגבולות
      נוקשים מאוד. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      ההיזכרות בפתיחה עלולה להעלות זיכרון קשה. הדגישי שאפשר לבחור מצב קטן ויומיומי, ושאיש לא קורא את
      המחברת. המצבים בתרגיל הטלפונים הם של זוג בן ובת — אמרי שהעיקרון זהה בכל קשר. והאחריות על לחץ היא של
      מי שלוחץ, לא של מי שהסכים.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. לא שואלים על פרטי המצב שנזכרו בו;
      על המניפה מותר לכתוב משפט כללי, או לוותר. ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל כפייה, ניצול של מבוגר או לחץ בקשר שקורה עכשיו — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית
      אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.
  - head: עמידה מול הכיתה
    text: >-
      בתרגיל הטלפונים כל אחד מצביע מול הכיתה. ההצבעה היא על מצב מהשקף, לא על החיים של מישהו; ״לא בטוחים״
      היא תשובה מלאה, ומסבירים רק מתנדבים — מי שנבחר יכול להעביר את השאלה הלאה. צחוק על ההצבעה של מישהו —
      עוצרים מיד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 15 דקות ומעלה — שתי ההרחבות; 10–14 דקות — רק ״כוס תה״; פחות — ישר
