sensitivity: med

sub: >-
  כשמחשבה מכשילה קופצת לראש, אפשר להתמודד איתה בארבעה צעדים: מזהים אותה, שמים סימן שאלה, מנסחים אותה
  מחדש — ופועלים. בשיעור הזה לומדים את המודל, רואים הדגמה ומתרגלים בזוגות.
format: כתיבה אישית, מליאה וזוגות
question: מה אפשר לעשות עם מחשבה מכשילה, כשהיא קופצת לראש?
takeaways:
  - מחשבה מכשילה מגיעה עם ״סימן קריאה״ — היא נשמעת כמו עובדה.
  - >-
    ארבעה צעדים עוזרים לא להיתקע בה: מזהים אותה, מחליפים את סימן הקריאה בסימן שאלה, מנסחים אותה כמחשבה
    או הרגשה של עכשיו — ובוחרים פעולה שנכונה לנו.
  - המודל נראה פשוט, אבל כדי שיעבוד צריך לתרגל אותו.
prep:
  - מקום פנוי בלוח לדוגמה ״החבר הכי טוב שלי…״ — ארבע שורות, שורה לכל צעד

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מחשבות מכשילות, ומודל של ארבעה צעדים להתמודדות איתן. שאלי אם יש בכיתה
      מי שמחשבות כמו ״בסוף כולם תמיד בוגדים בי״ או ״תמיד מאשימים אותי״ קרובות אליו מדי עכשיו — חרם,
      פרידה מחבר, מצוקה בבית — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      הדוגמה ״החבר הכי טוב שלי מבלה עם חברים אחרים״ עלולה לגעת במי שחבר התרחק ממנו לאחרונה — מדברים על
      הדמות שבדוגמה, לא על מישהו בכיתה. ומי שבאמת בודד או נפגע לא צריך לשמוע ״זו רק מחשבה״: צעד 3 מכיר
      בהרגשה הלא נעימה, והמודל לא מבקש להעלים אותה. אם צעד 4 נשמע כמו ״תתעלם ותמשיך״ — חזרי להערה של
      המקור: יש פעמים שהפעולה הנכונה היא לדבר עם החבר.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. בפתיחה
      כותבים לעצמנו ומשתפים רק מתנדבים; בזוגות עובדים על מחשבה מהשקף, לא על מחשבה אישית. מותר לוותר,
      ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      מחשבה כמו ״כולם בוגדים בי״ או ״לא שווה לנסות״ שנשמעת כמו מצוקה של עכשיו — עוצרים בעדינות, מודים,
      וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״זוג עם זוג״; פחות
    — ישר ל״חשוב לזכור״.
  short:
    steps:
      - together
      - pairs
    text: >-
      את ״החבר הכי טוב שלי…״ עוברים בעל פה, בלי לכתוב על הלוח; ובמליאה של הזוגות שומעים זוג אחד

brain_break:
  signs: עיניים כבדות, ראשים על השולחן, שקט שלא נשבר גם אחרי שאלה.
  ideas:
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
    - name: חמש־ארבע־שלוש
      text: בשקט, כל אחד מוצא חמישה דברים שהוא רואה, ארבעה שהוא שומע ושלושה שהוא מרגיש בגוף.
    - name: סופרים עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר את המספר הבא, בלי סדר ובלי סימנים. שניים
        מדברים יחד? מתחילים מאחת.
  from: again

