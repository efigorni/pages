steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: פעם שהצלחתי לשנות מחשבה
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: כתיבה אישית קצרה — פעם שהצלחתי לשנות מחשבה מכשילה, ואיך; שומעים שלושה מתנדבים
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: איך שיניתם פעם מחשבה מכשילה?
          sub: מחשבות מכשילות הן מחשבות שמופיעות לנו בראש ומשנות את מצב הרוח שלנו לרעה.
          verbatim:
            - sub
          timer: 180
          echo: true
          alt: ענן מחשבה עם ענן גשם, חץ, וענן מחשבה עם שמש
          art:
            - {use: thought, x: 330, y: 40, w: 260}
            - {use: rain-cloud, x: 408, y: 89, w: 110}
            - {use: arrow, x: 260, y: 330, w: 170, color: orange}
            - {use: thought, x: 30, y: 170, w: 230}
            - {use: sun, x: 97, y: 212, w: 100, color: orange}
      - moves:
          - השקף על המסך כשהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף. בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות.
          - סמני לעצמך שתיים־שלוש דרכים שונות שכתבו — ״דיברתי עם מישהו״, ״בדקתי אם זה נכון״, ״עשיתי משהו אחר״.
          - שמעי שלושה מתנדבים, ורשמי על הלוח רק את מה שעשו — בלי פרטים על המקרה.
      - say: שלוש דקות, לבד ובשקט. לא חייבים מקרה גדול — גם מחשבה קטנה ששיניתם נחשבת.
      - ladder:
          help: חשבו על פעם שהייתם בטוחים שמשהו ייגמר רע — ובסוף לא.
          challenge: למה הוביל השינוי שהצלחתם ליצור — במה שהרגשתם, ובמה שעשיתם אחר כך?
      - ask: מה עשיתם כדי לשנות את המחשבה — ולמה זה הוביל?
      - say: >-
          יש לנו כבר כמה דרכים משלנו. היום נלמד עוד אחת — מודל של ארבעה צעדים להתמודדות עם מחשבות
          מכשילות.

  # ------------------------------------------------------------------ 5′–12′
  - id: model
    title: ארבעה צעדים
    minutes: 7
    practices:
      - Think–Pair–Share
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: מציגים את צעד 1, הזוגות מנחשים מה עושים בצעד 2 — ואז נחשפים צעדים 2, 3 ו־4
    body:
      - slide:
          kicker: ארבעה צעדים · צעד 1
          title: מזהים את המחשבה — ואת סימן הקריאה שלה
          sub: אזהה את המחשבה בראשי אשר מופיע בסופה סימן קריאה המבטא את תפיסתי אותה כעובדה
          verbatim:
            - sub
          echo: true
          alt: ענן מחשבה גדול עם סימן קריאה, וזכוכית מגדלת שבודקת אותו
          art:
            - {use: thought, x: 230, y: 30, w: 320}
            - text: '!'
              x: 393
              y: 156
              size: 130
            - {use: magnifier, x: 50, y: 290, w: 200, color: teal}
      - moves:
          - >-
            הציגי את צעד 1, והסבירי מתוך הערות המקור: המחשבה קופצת לראש כמו עובדה חדשה, בלי שליטה — ומול
            עובדה סגורה אנחנו חסרי אונים.
          - לפני צעד 2 — שאלי, ותני לזוגות חצי דקה לנחש. שמעי שניים־שלושה ניחושים.
          - חשפי את צעד 2, ושאלי איך הוא משפיע. אחר כך הציגי את צעדים 3 ו־4, והקריאי כל אחד.
      - ask: מה אפשר לעשות לסימן הקריאה, כדי שהמחשבה תפסיק להיות עובדה? חצי דקה — לחשו לשכן ניחוש.
      - ladder:
          help: חשבו על סימני פיסוק — איזה סימן משאיר מקום לספק?
          challenge: מה עוד, חוץ מסימן פיסוק, יכול להפוך עובדה למחשבה?
      - slide:
          kicker: ארבעה צעדים · צעד 2
          title: מחליפים את סימן הקריאה בסימן שאלה
          sub: אחליף את סימן הקריאה בסימן שאלה, לצורך יצירת מרחב של ספק
          verbatim:
            - sub
          echo: true
          cue: אחרי הניחושים —
          alt: ענן מחשבה עם סימן קריאה, חץ, וענן מחשבה עם סימן שאלה
          art:
            - {use: thought, x: 330, y: 60, w: 260}
            - text: '!'
              x: 463
              y: 164
              size: 110
            - {use: thought, x: 30, y: 60, w: 260}
            - text: '?'
              x: 163
              y: 164
              size: 110
            - {use: arrow, x: 225, y: 350, w: 170, color: orange}
      - ask: איך, לדעתכם, משפיעה החלפת סימן הקריאה בסימן שאלה?
      - slide:
          kicker: ארבעה צעדים · צעד 3
          title: מה אני חושב ומרגיש — עכשיו
          sub: אנסח את המשפט כהרגשה או מחשבה עכשווית ואכיר בתחושה הלא נעימה שמתעוררת בי
          verbatim:
            - sub
          echo: true
          cue: המשך —
          alt: דמות, ומעליה ענן מחשבה עם לב; שעון לידה
          art:
            - {use: thought, x: 170, y: 30, w: 300}
            - {use: heart, x: 263, y: 96, w: 120}
            - {use: clock, x: 30, y: 300, w: 170}
            - {use: kid-stand, x: 450, y: 260, w: 120, color: teal}
      - p: >-
          **בצעד 3 שלושה דברים, מתוך הערות המקור:** מוסיפים ״אני חושב״ או ״אני מרגיש״ — וכך העובדה נעשית
          מחשבה או הרגשה; מוסיפים ״עכשיו״ או ״כרגע״ — ולא ״תמיד״; ומכירים בהרגשה, בלי להיאבק בה: ״זה באמת
          מאוד מבאס״, ״זה ממש לא נעים״.
      - slide:
          kicker: ארבעה צעדים · צעד 4 · אזדקף ואומר לעצמי
          title: אכוון את עצמי לפעולה הנכונה ביותר עבורי כרגע
          sub: יש לי כרגע מחשבה/ הרגשה לא נעימה אך אני בוחר שלא לתת לה לנהל אותי
          verbatim: true
          echo: true
          cue: המשך —
          alt: דמות זקופה, וחץ ממנה אל מטרה
          art:
            - {use: kid-stand, x: 440, y: 170, w: 140, color: teal}
            - {use: arrow, x: 230, y: 250, w: 190, color: orange}
            - {use: target, x: 40, y: 220, w: 190}
      - p: >-
          **צעד 4, מתוך הערות המקור:** זוקפים את הגוף, ובוחרים לא לתת למחשבה לנהל את ההתנהגות. לפעמים הפעולה
          הנכונה היא לחזור למה שעשינו לפני שהמחשבה קפצה; ואם יש משהו מעשי שאפשר לעשות כדי להתמודד עם הבעיה —
          עושים אותו.
      - say: כל זה פשוט וגם לא פשוט. נדרש אימון כדי להבין ולהשתמש בכלי — ואת זה נעשה עכשיו.

  # ------------------------------------------------------------------ 12′–16′
  - id: demo
    title: הדגמה — ״בטוח אכשל בבחינה!״
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: את מדגימה את ארבעת הצעדים על מחשבה אחת, בקול; הכיתה חושבת מה עושות המילים ״עכשיו״ ו״כרגע״
    body:
      - slide:
          kicker: הדגמה
          title: הדגמת יישום המודל
          points:
            - בטוח אכשל בבחינה!
            - בטוח אכשל בבחינה?
            - אני עכשיו חושב.ת שבטוח אכשל בבחינה וזה גורם לי להרגיש רע.
            - לא אשתף פעולה עם המחשבה המכשילה, אלא אתמקד בללמוד הכי טוב שאני יכול.ה לבחינה
          verbatim: true
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה עם סימן קריאה
          art:
            - {use: thought, x: 40, y: 30, w: 300}
            - text: '!'
              x: 193
              y: 150
              size: 120
            - {use: kid-desk, x: 330, y: 220, w: 220, color: teal}
      - moves:
          - הציגי את המחשבה, ועברי איתה על הצעדים — נקודה אחרי נקודה. בכל צעד אמרי את המשפט בקול, כמו שאומרים לעצמנו.
          - בצעד 4 — הזדקפי באמת, והקריאי את המשפט המלא.
          - אחרי ההדגמה שאלי על המילים ״עכשיו״ ו״כרגע״, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
      - quote:
          title: צעד 4 בהדגמה — להקריא
          text: >-
            אזדקף ואומר לעצמי: ״יש לי כרגע מחשבה לא נעימה אך אני בוחר.ת שלא לתת לה לנהל אותי. אני מחליט.ה
            לכוון לפעולה הנכונה לי כרגע: לא אשתף פעולה עם המחשבה המכשילה, אלא אתמקד בללמוד הכי טוב שאני
            יכול.ה לבחינה״.
      - ask: איך, לדעתכם, משפיעות המילים ״עכשיו״ או ״כרגע״ על ההרגשה או על המחשבה שלנו?
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי מסכים? למה?
      - say: עכשיו נעשה את זה יחד — על מצב אחר.

  # ------------------------------------------------------------------ 16′–21′
  - id: together
    title: עושים יחד — ״החבר הכי טוב שלי…״
    minutes: 5
    practices:
      - מהלכי שיח
      - זמן חשיבה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: הכיתה מחפשת את המחשבה המכשילה במצב אחד, ועוברת איתה את ארבעת הצעדים על הלוח
    body:
      - slide:
          kicker: עושים יחד · על הלוח
          title: החבר הכי טוב שלי מבלה עם חברים אחרים ופחות איתי!
          sub: מהי המחשבה המכשילה — ואיך עוברים איתה את ארבעת הצעדים?
          verbatim:
            - title
          echo: true
          alt: שלוש דמויות יחד, ודמות אחת לבד לידן — ומעליה ענן מחשבה עם סימן קריאה
          art:
            - {use: group3, x: 30, y: 270, w: 300}
            - {use: kid-stand, x: 440, y: 250, w: 120, color: moss}
            - {use: thought, x: 300, y: 30, w: 230}
            - text: '!'
              x: 417
              y: 122
              size: 100
      - moves:
          - הקריאי את המצב, ושאלי מהי המחשבה המכשילה שקופצת לראש. רשמי על הלוח את ההצעה שהכי נשמעת כמו עובדה.
          - >-
            עברי עם הכיתה על הצעדים — בכל צעד תלמיד אחר מציע, ושאלי את הכיתה אם היא מסכימה ולמה, לפני שאת
            רושמת שורה על הלוח.
          - בצעד 4 בקשי שתי פעולות שונות, ורשמי את שתיהן.
      - ask: מהי המחשבה המכשילה שקופצת לראש במצב כזה?
      - quote:
          title: אם הכיתה נתקעת — הנוסח מהערות המקור
          text: |-
            1. בסוף כולם תמיד בוגדים בי !!!
            2. אחליף את סימן הקריאה בסימן שאלה, לצורך יצירת מרחב של ספק: בסוף כולם תמיד בוגדים בי?
            3. אנסח את המשפט כהרגשה או מחשבה עכשווית ואכיר בתחושה הלא נעימה המתעוררת בי:
            אני מרגיש/חושב כרגע שבסוף כולם תמיד בוגדים בי, וזה גורם לי להרגיש רע.
            4. אזדקף ואומר לעצמי: יש לי כרגע מחשבה/הרגשה לא נעימה, אך אני בוחר שלא לתת לה לנהל אותי. ארחיב את מיקוד הקשב שלי, ואכוון את עצמי לפעולה הנכונה ביותר עבורי כרגע, למשל:
            במקום להמשיך ולשתף פעולה עם המחשבה הזאת שרק מחלישה אותי, אחכה עד מחר ואראה מה קורה... בינתיים אלך לצופים כמו שתכננתי. אקבל את זה שיש חברים פחות טובים...
            או...
            אדבר עם אותו חבר, ואבדוק האם התחושה שלי נכונה
      - say: >-
          שימו לב: בצעד 3 לא מעלימים את ההרגשה — אומרים לעצמנו שזה באמת לא נעים. ובצעד 4 בוחרים מה לעשות,
          למרות ההרגשה. עכשיו תורכם — בזוגות.

