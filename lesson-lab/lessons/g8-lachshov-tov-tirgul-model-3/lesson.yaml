sensitivity: med

sub: >-
  ארבעה צעדים מול מחשבה מכשילה — מזהים, שמים סימן שאלה, מנסחים מחדש ופועלים. בשיעור הזה נזכרים במודל,
  מתרגלים אותו יחד, ובקבוצות קטנות עוזרים זה לזה לעבור את הצעדים.
format: כתיבה אישית, מליאה וקבוצות קטנות
question: איך משתמשים בארבעת הצעדים כשמחשבה מכשילה תוקעת אותנו?
takeaways:
  - משתמשים בארבעת הצעדים כשמצב הרוח משתנה פתאום לרעה, כשמוצפים ברגש חזק, או כשמזהים מחשבה מכשילה.
  - כשאומרים ״כרגע אני חושב ומרגיש״, המחשבה כבר לא עובדה — וגם ההרגשה מקבלת מקום.
  - חברים יכולים לעזור לנו לעבור את הצעדים, וכשמתרגלים — זה נעשה קל יותר.
prep:
  - חלוקה מראש לקבוצות של 3–4 לפי השולחנות
  - ארבע ההוראות לעבודה בקבוצות — כתובות על הלוח לפני השיעור
  - דפים גדולים וטושים (להרחבה ״פוסטר לקיר״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — תרגול מודל ארבעת הצעדים, וקבוצות קטנות שבהן כל אחד מביא מחשבה מכשילה.
      שאלי אם יש בכיתה מי שמחשבה כמו ״אני תלמיד גרוע״ או ״בחיים לא אצליח״ כבדה עליו עכשיו — קושי
      בלימודים, לקות למידה, לחץ בבית — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      הדוגמה ״לא קיבלתי ציון טוב במבחן במתמטיקה״ קרובה למי שמתקשה בלימודים — מדברים על הדמות שבדוגמה,
      לא על ציונים של מישהו בכיתה. בקבוצות, מחשבה של חבר שייכת לו: לא מספרים עליה מחוץ לקבוצה. ואם צעד 4
      נשמע כמו ״לא לחשוב על זה״ — חזרי לצעד 3: ההרגשה הלא נעימה מקבלת מקום, ולא נאבקים בה.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. בקבוצות
      מותר להביא מחשבה מוכרת, לא בהכרח אישית, או מחשבה מהשיעור — ואף אחד לא שואל ״זה באמת שלך?״. מותר לוותר
      על התור, ובמליאה מספרים על העבודה, לא על המחשבות של אחרים.
  - head: אם מישהו משתף פגיעה
    text: >-
      מחשבה כמו ״לא שווה לנסות״ או ״כולם נגדי״ שנשמעת כמו מצוקה של עכשיו — בקבוצה או בכרטיס היציאה —
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא
      מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״מסכמים יחידה״; פחות
    — ישר ל״חשוב לזכור״.
  short:
    steps:
      - recall
      - groups
    text: >-
      בשליפה מדלגים על הזוגות — כותבים ומיד בודקים מול השקף; ובקבוצות מספיקים שני סבבים, ומי שלא הגיע
      תורו ממלא את הערכה לבד

brain_break:
  signs: פיהוקים, ראשים על השולחן, רעש שעולה בלי סיבה.
  ideas:
    - name: שמונה באוויר
      text: מציירים באוויר שמונה גדולה ושוכבת — ביד ימין, ביד שמאל, ואז בשתי הידיים יחד.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
    - name: מראה
      text: בזוגות, פנים מול פנים. אחד מוביל תנועות איטיות והשני משקף; אחרי דקה מתחלפים.
  from: poster

