grade: 8
month: נובמבר
section: מיומנויות לחיזוק כוחות וחוסן להתנהלות מיטבית בשגרה ובחירום – התמודדות ממוקדת חשיבה (נובמבר)
unit: לחשוב טוב
unit_order: 3
