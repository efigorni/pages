steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: recall
    title: נזכרים בארבעה צעדים
    minutes: 6
    practices:
      - תרגילי שליפה
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: כותבים מהזיכרון את ארבעת הצעדים, משלימים בזוגות, בודקים מול השקף — ומתי משתמשים במודל
    body:
      - whisper: >-
          בשיעור הקודם ביחידה למדו את מודל ארבעת הצעדים להתמודדות עם מחשבות מכשילות — מחשבות שמופיעות בראש
          ומשנות את מצב הרוח לרעה: 1. מזהים את המחשבה, שמופיעה עם ״סימן קריאה״, כמו עובדה; 2. מחליפים את
          סימן הקריאה בסימן שאלה; 3. מנסחים אותה כמחשבה או הרגשה של עכשיו (״כרגע אני חושב… ומרגיש…״); 4.
          מזדקפים, לא נותנים לה לנהל אותנו, ופונים לפעולה הנכונה עכשיו. מי שלא היה בשיעור — כותב יחד עם
          חבר, והשקף שאחרי השליפה מציג את ארבעת הצעדים במלואם.
      - slide:
          kicker: תרגילי שליפה · בלי עזרים
          title: מה זוכרים מארבעת הצעדים?
          sub: כתבו כל צעד במילים שלכם — גם חצי צעד נחשב.
          timer: 120
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה עם המילים ״4 צעדים״
          art:
            - {use: thought, x: 40, y: 24, w: 280}
            - text: 4 צעדים
              x: 183
              y: 132
              size: 46
            - {use: kid-desk, x: 310, y: 200, w: 240, color: teal}
      - moves:
          - >-
            השקף על המסך כשהכיתה נכנסת. שתי דקות לכתוב מהזיכרון, בלי מחברות ובלי עזרים; מי שלא היה בשיעור
            הקודם — כותב יחד עם חבר.
          - דקה בזוגות — משווים ומשלימים.
          - חשפי את ארבעת הצעדים. כל אחד מסמן מה זכר ומה הוסיף.
          - הציגי את השקף ״מתי נשתמש במודל?״, והקריאי את התשובה.
      - say: טעות או חור בזיכרון הם חלק מהתרגיל — דווקא המאמץ להיזכר הוא מה שמחזק.
      - ladder:
          help: התחילו מהסימנים — מה קורה בצעד 1 לסימן הקריאה, ומה בצעד 2?
          challenge: כתבו ליד כל צעד גם מה הוא מאפשר לנו.
      - slide:
          kicker: בודקים
          title: 4 צעדים להתמודדות עם מחשבות מכשילות
          points:
            - מזהים את המחשבה ואת סימן הקריאה
            - מחליפים אותו בסימן שאלה
            - מנסחים כמחשבה או הרגשה של עכשיו
            - מזדקפים ובוחרים פעולה נכונה
          verbatim:
            - title
          echo: true
          cue: אחרי ההשוואה בזוגות —
          alt: ארבע מדרגות עולות — סימן קריאה, סימן שאלה, לב ומטרה — ודמות זקופה בראש
          art: {file: art/stairs.svg}
      - quote:
          title: ארבעת הצעדים מהמקור — להקריא
          text: |-
            צעד 1: אזהה את המחשבה בראשי אשר מופיע בסופה סימן קריאה המבטא את תפיסתי אותה כעובדה.
            צעד 2: אחליף את סימן הקריאה בסימן שאלה, לצורך יצירת מרחב של ספק.
            צעד 3: אנסח את המשפט כהרגשה או מחשבה עכשווית ואכיר בתחושה הלא נעימה שמתעוררת בי.
            צעד 4: אזדקף ואומר לעצמי: יש לי כרגע מחשבה/ הרגשה לא נעימה אך אני בוחר שלא לתת לה לנהל אותי. ארחיב את מיקוד הקשב שלי ואכוון עצמי לפעולה הנכונה ביותר עבורי כרגע.
      - ask: איזה צעד נשכח הכי הרבה — ולמה, לדעתכם?
      - slide:
          kicker: ארבעת הצעדים
          title: מתי נשתמש במודל ארבעת הצעדים?
          sub: כשההרגשה משתנה פתאום לרעה, כשמוצפים ברגש חזק, או כשמזהים מחשבה מכשילה.
          verbatim:
            - title
          echo: true
          cue: ולפני שמתרגלים —
          alt: דמות עומדת מתחת לענן גשם, ורמזור לידה
          art:
            - {use: rain-cloud, x: 280, y: 40, w: 190}
            - {use: kid-stand, x: 310, y: 250, w: 130, color: teal}
            - {use: traffic-light, x: 70, y: 220, w: 130}
      - quote:
          title: מהמקור — להקריא
          text: >-
            נשתמש בארבעת הצעדים כאשר זיהינו שההרגשה שלנו משתנה לפתע לרעה, כשאנחנו מוצפים ברגש חזק שקשה לנו
            איתו או כאשר זיהינו מחשבה מכשילה.
      - say: עכשיו ננסה את ארבעת הצעדים על מצב אחד — יחד.

  # ------------------------------------------------------------------ 6′–13′
  - id: practice
    title: ועכשיו נתרגל — ״לא קיבלתי ציון טוב…״
    minutes: 7
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: הכיתה מחפשת את המחשבה המכשילה אחרי ציון לא טוב, ועוברת איתה יחד את ארבעת הצעדים
    body:
      - slide:
          kicker: ועכשיו נתרגל · יחד
          title: לא קיבלתי ציון טוב במבחן במתמטיקה!
          sub: מהי המחשבה המכשילה שקופצת לראש?
          verbatim:
            - title
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה עם סימן קריאה
          art:
            - {use: thought, x: 40, y: 30, w: 300}
            - text: '!'
              x: 193
              y: 150
              size: 120
            - {use: kid-desk, x: 330, y: 220, w: 220, color: teal}
      - moves:
          - הקריאי את המצב, ושאלי מהי המחשבה המכשילה. רשמי על הלוח את ההצעה שהכי נשמעת כמו עובדה.
          - >-
            עברי צעד אחרי צעד — בכל צעד הכיתה מציעה קודם ומגיבה להצעות (״מי מסכים? למה?״), ורק אחר כך חשפי
            את הנוסח שעל המסך.
          - בצעד 3 עצרי על ״כרגע״ ועל ״אני מרגיש רע עם זה עכשיו״ — ההרגשה לא נעלמת, היא מקבלת שם.
          - בצעד 4 — הזדקפי באמת, והקריאי את המשפט כמו שאומרים לעצמנו.
      - ask: מהי המחשבה המכשילה שקופצת לראש אחרי ציון כזה?
      - slide:
          kicker: ועכשיו נתרגל · ארבעה צעדים
          title: מה אומרים בכל צעד?
          points:
            - אני תלמיד/ה גרוע/ה!
            - אני תלמיד/ה גרוע/ה?
            - כרגע אני חושב/ה שאני תלמיד/ה גרוע/ה ואני מרגיש/ה רע עם זה עכשיו.
            - אגש למורה למתמטיקה ואבקש שעת תגבור.
          verbatim:
            - points
          echo: true
          cue: אחרי שהמחשבה רשומה על הלוח —
          alt: ארבע מדרגות עולות — סימן קריאה, סימן שאלה, לב ומטרה — ודמות זקופה בראש
          art: {file: art/stairs.svg}
      - p: >-
          **למה צעד 3 עובד, מתוך הערות המקור:** ״אני חושב ומרגיש״ מערער את העובדתיות של המחשבה — היא מחשבה
          או הרגשה, ולאו דווקא עובדה. ״כרגע״ מזכיר שכך מרגישים עכשיו, ועם ה״עכשיו״ הזה מתמודדים. וההכרה
          בהרגשה הלא נעימה אומרת שלא נלחמים בה: זה נורמלי להרגיש כך.
      - quote:
          title: צעד 4 בדוגמה — להקריא
          text: >-
            צעד 4: אזדקף ואומר לעצמי: יש לי כרגע מחשבה/הרגשה שאני תלמיד/ה גרוע/ה. לא אתן למחשבה הזאת ״להחליט״
            עלי. אגש למורה למתמטיקה ואבקש שעת תגבור.
      - tip: >-
          אם המעבר לפעולה קשה לתלמידים, הציעי להם לדמיין קודם את עצמם עושים את מה שבחרו (מתוך הערות
          המקור). ואפשר לבחור פעולה אחרת מהמקור — לפנות לחבר או להורים ולבקש עזרה.
      - say: שימו לב — המחשבה לא נעלמה. אבל עכשיו היא מחשבה של הרגע, ולא עובדה על כל החיים.
      - ask: ומה אפשר לעשות עכשיו, במקום להמשיך עם המחשבה? עוד מעט תעשו את זה בקבוצות — כל אחד עם מחשבה משלו.

  # ------------------------------------------------------------------ 13′–24′
  - id: groups
    title: הערכה שלי — ועבודה בקבוצות
    minutes: 11
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: כל אחד מכין דף צעדים ומצייר את הסימנים; בקבוצות קטנות כל אחד מביא מחשבה, והחברים עוזרים לו לעבור את הצעדים
    body:
      - slide:
          kicker: ערכת הצעדים שלי · 2 דקות
          title: הכנת ערכת הצעדים
          sub: על כל צעד ציירו את הסימן המתאים לפי מודל ארבעת הצעדים
          verbatim: true
          timer: 120
          echo: true
          alt: ארבע עקבות — בשלוש כבר סימן, ועל הרביעית עיפרון מצייר
          art: {file: art/make-kit.svg}
      - handout:
          title: ערכת ארבעת הצעדים שלי
          copies: עותק לכל תלמיד
          items:
            - צעד 1 — המחשבה, כמו שהיא קופצת לראש, עם סימן קריאה
            - צעד 2 — אותה מחשבה, עם סימן שאלה
            - צעד 3 — ״כרגע אני חושב ש… וזה גורם לי להרגיש…״
            - צעד 4 — ״לא אתן למחשבה לנהל אותי. עכשיו אני…״
      - moves:
          - חלקי לכל תלמיד את דף הערכה. שתי דקות לצייר ליד כל צעד את הסימן שלו.
          - הסבירי את הסבב לפני שעוברים לשבת בקבוצות; ההוראות על הלוח כל הזמן.
          - אמרי בבירור שמותר להביא מחשבה מוכרת, לא בהכרח אישית, ושלא שואלים ״זה באמת שלך?״.
          - הסתובבי בין הקבוצות. כל שלוש דקות — הודיעי שעוברים למשתתף הבא.
      - slide:
          kicker: בקבוצות של 3–4 · 8 דקות
          title: כל אחד מביא מחשבה — והקבוצה עוברת איתה את הצעדים
          sub: מי ששיתף רושם בערכה שלו את ההצעות של החברים.
          timer: 480
          echo: true
          cue: כשהערכות מוכנות —
          alt: ארבעה סביב שולחן עגול, ופתק כתום לידם
          art:
            - {use: circle4, x: 120, y: 100, w: 330}
            - {use: sticky, x: 440, y: 330, w: 150, color: orange}
      - board:
