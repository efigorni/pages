    - הזמיני תשובות בכתב.
    - הקריאי שלושה פרטים ללא שמות ובקשי למצוא דמיון.
    - תני מקום גם למי שהתחלה חדשה מעוררת אצלו חשש.
    - בתוך זמן העבודה, תני חצי דקה לחשיבה לבד ודקה להשוואה בזוג; בסיום הזמיני שני שיתופים למליאה.
