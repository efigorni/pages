    - תרגמי את הכלי לרשת והזכירי שגם תמונה שעברה צריכה הסכמה.
  - say: 'בדקו תמונה בשלוש שאלות: האם אמיתית, האם מכבדת והאם נחוצה? חזרו למקרה הנפילה ולברכת ההחלמה.'
  - task:
      what: 'בדקו תמונה בשלוש שאלות: האם אמיתית, האם מכבדת והאם נחוצה? חזרו למקרה הנפילה ולברכת ההחלמה.'
      time: 5 דקות
      group: זוגות
      rules: אפשר לבחור דמות מהמקור; בלי שמות של תלמידים ובלי חובה לשתף מידע אישי
      plenary: משתפים שתי תשובות ומקשיבים להבדלים ביניהן
      help: האם אמת לבדה מספיקה?
      challenge: מה עושים כששתי מסננות עוברות ואחת לא?
  - quote:
      title: מהמקור — להקריא
      text: 'צילום תמונות צריך להתבצע בהסכמה תוך התייחסות לגבול שבין צחוק והנאה לבין פגיעה ועלבון.

        מפעילים שיקול דעת לפני פרסום: האם מה שאנחנו רוצים לפרסם על עצמנו מכבד אותנו? עלול לפגוע בנו? האם נרצה שהאנשים הקרובים לנו יראו את הפרסום?

        התחשבות, רגישות ואכפתיות כלפי הזולת היא מרכז העניין: אל תפרסמו מה שלא הייתם רוצים שיפרסמו עליכם או על חבריכם.

        צילום תמונה ושליחתה לחבר/ה לא מהווים הסכמה להפצתה לאנשים נוספים.

        עדיף להצטער שלא שלחנו מאשר להתחרט ששלחנו.'
  - say: נאמ״נים לעצמנו ולאחרים לפני שיתוף.
