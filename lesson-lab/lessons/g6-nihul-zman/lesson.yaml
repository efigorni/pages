steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: choose
    title: שיעורי בית או חברים?
    minutes: 7
    practices:
      - מה הקשר?
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      שאלת בחירה — שיעורי בית או חברים? — ואחריה כתיבה על יום של עומס; כללי השיח, ושניים–שלושה משתפים
    body:
      - slide:
          kicker: מה הקשר? · מה תבחרו?
          title: להכין שיעורי בית — או לשחק עם חברים?
          sub: הרימו יד — ואז נשמע למה.
          echo: true
          alt: ספר פתוח מצד אחד, שני חברים מהצד השני, ומאזניים ביניהם
          art:
            - {use: book, x: 330, y: 70, w: 180}
            - {use: pair, x: 95, y: 24, w: 190}
            - {use: scale, x: 150, y: 230, w: 320}
      - moves:
          - הציגי את השקף ושאלי. הצבעה מהירה — ואז שמעי שניים–שלושה, למה.
          - >-
            כשעולה ״תלוי״ — שאלי במה. רשמי בפינת הלוח את מה שעולה (מתי צריך להגיש, כמה זמן זה לוקח),
            ושמרי את זה לשלב ״חשוב, דחוף, אוהב״.
          - עברי לשקף הבא — דקה וחצי של כתיבה בשקט, במחברת.
          - הציגי את כללי השיח, והזמיני שניים–שלושה לספר איך התמודדו.
      - ask: מה תבחרו — ולמה?
      - slide:
          kicker: כותבים · לעצמכם
          title: יום שבו היה לכם יותר מדי לעשות
          points:
            - מתי זה היה?
            - מה הרגשתם?
            - איך התמודדתם?
          timer: 90
          echo: true
          cue: אחרי ההצבעה —
          alt: דמות כותבת ליד שולחן, שעון, וסוללה כמעט ריקה
          art:
            - {use: kid-desk, x: 300, y: 172, w: 250, color: teal}
            - {use: clock, x: 60, y: 50, w: 150}
            - {use: battery-low, x: 60, y: 300, w: 180}
      - ladder:
          help: חשבו על יום לפני מבחן, או יום שהיו בו גם חוג, גם שיעורי בית וגם אירוע משפחתי.
          challenge: מה הייתם עושים אחרת, אם היה לכם שוב יום כזה?
      - slide:
          kicker: לפני שמשתפים
          title: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          cue: אחרי הכתיבה —
          alt: זוג יד ביד, ומעליו בועת דיבור ובתוכה לב
          art:
            - {use: speech, x: 40, y: 30, w: 300}
            - {use: heart, x: 135, y: 80, w: 110}
            - {use: pair, x: 260, y: 250, w: 250}
      - ask: מי מוכן לספר — איך התמודדתם עם היום הזה?
      - say: כל אחד התמודד בדרך אחרת. יש לזה שם — ניהול זמן. ומה זה בעצם?

  # ------------------------------------------------------------------ 7′–10′
  - id: what
    title: מהו ניהול זמן?
    minutes: 3
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: ההגדרה של המקור, ושאלה אחת — איך כל אחד מנהל את הזמן שלו, בתכנון או איך שיוצא
    body:
      - slide:
          kicker: ניהול זמן
          title: כיצד אתם מנהלים את הזמן שלכם?
          sub: מתכננים מראש — או איך שיוצא?
          echo: true
          alt: שעון גדול, ודמות עומדת לידו
          art:
            - {use: clock, x: 250, y: 60, w: 300}
            - {use: kid-stand, x: 70, y: 214, w: 148, color: teal}
      - quote:
          title: ניהול זמן — ההגדרה מהמקור, להקריא
          text: |-
            תהליך של תכנון והפעלת שליטה מודעת על זמן, שהוקדש לפעילויות ספציפיות ונועד להגברת היעילות והפרודוקטיביות.
            שימוש יעיל בזמן מעניק לאדם את האפשרות לנהל ולהשקיע את זמנו בפעילויות בהתאם לרצונו.
            ניהול זמן יעיל כולל: קביעת סדרי עדיפויות, ביצוע פעילות בעקבות תיעדוף, צמצום הזמן שמושקע בפעילויות שהתיעדוף שלהן נמוך, כדי לעמוד בלוחות הזמנים.
      - tip: >-
          ההגדרה כבדה לכיתה ו׳? במילים פשוטות — לתכנן על מה הולך הזמן, ולהחליט בעצמנו מה קודם.
      - moves:
          - הקריאי את ההגדרה, ואז שאלי. ספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - שמעי שלושה–ארבעה. על כל תשובה — שאלי את הכיתה מי עושה אחרת, ואיך זה עובד לו.
      - ask: כיצד אתם מנהלים את הזמן שלכם — בתכנון, או איך שיוצא?
      - say: כדי לנהל זמן, קודם צריך לראות על מה הוא הולך. בואו נבדוק את השבוע שלכם.

  # ------------------------------------------------------------------ 10′–16′
  - id: week
    title: השבוע שלי
    minutes: 6
    practices:
      - הוצאה למשימה
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      כל אחד רושם במחברת את כל מה שעשה בשבוע האחרון, וממיין לארבעה ריבועים — אישי, לימודי, חברתי,
      משפחתי
    body:
      - slide:
          kicker: דף משימות ומטלות · לבד, במחברת
          title: כל מה שעשיתם בשבוע האחרון
          sub: משחקים, סדרות, לימודים, מטלות בבית… ה־כ־ל!
          timer: 180
          echo: true
          alt: דף עם שורות, לוח שנה ועיפרון
          art:
            - {use: note, x: 200, y: 40, w: 256}
            - {use: calendar, x: 440, y: 330, w: 150}
            - {use: pencil, x: 36, y: 300, w: 170}
      - say: >-
          רשמו כל מה שעשיתם בשבוע האחרון — גם משחקים וגם סדרות. ה־כ־ל. אין רשימה נכונה, והיא נשארת אצלכם.
      - task:
          what: >-
            כל אחד רושם במחברת את כל מה שעשה בשבוע האחרון. אחר כך משרטט ארבעה ריבועים — אישי, לימודי, חברתי,
            משפחתי — וכותב כל דבר מהרשימה בריבוע שלו.
          time: 3 דקות לרשימה, 2 דקות למיון
          group: לבד
          rules: כותבים בשקט; דבר שמתאים לשני ריבועים — בוחרים אחד; הרשימה נשארת אצלכם
          plenary: הצבעה בעיניים עצומות — באיזה ריבוע יש הכי הרבה
          help: התחילו מאתמול — מה עשיתם מהרגע שקמתם ועד שהלכתם לישון?
          challenge: סמנו בכל ריבוע את הדבר שלקח לכם הכי הרבה זמן השבוע.
      - moves:
          - הציגי את השקף ותני שלוש דקות לרשימה. הסתובבי ועודדי לכתוב גם את מה שנראה קטן.
          - הציגי את ארבעת הריבועים — שתי דקות למיון.
          - קראי בקול את שמות הריבועים אחד־אחד, והכיתה מצביעה בעיניים עצומות; רק את סופרת.
      - slide:
          kicker: דף משימות ומטלות · ממיינים
          title: מיינו את הרשימה לארבעה תחומים
          sub: שרטטו ארבעה ריבועים במחברת, וכתבו כל דבר בריבוע שלו.
          timer: 120
          echo: true
          cue: אחרי שלוש דקות —
          alt: ארבעה ריבועים — אישי, לימודי, חברתי ומשפחתי
          art: {file: art/domains.svg}
      - ask: באיזה ריבוע יש לכם הכי הרבה? עצמו עיניים, והצביעו כשאקרא את שמו.

  # ------------------------------------------------------------------ 16′–22′
  - id: tool
    title: חשוב, דחוף, אוהב
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      כלי לניהול זמן — שלושה סוגים של משימות, ודוגמאות מהכיתה; סדר עדיפויות ומבחן התוצאה, ושוב שאלת
      הבחירה מהפתיחה
    body:
      - say: יש כלי פשוט שעוזר להחליט מה קודם — ממיינים כל משימה לאחד משלושה סוגים.
      - slide:
          kicker: כלי לניהול זמן
          title: שלושה סוגים של משימות
          points:
            - חשוב ודחוף
            - חשוב ולא דחוף
            - דברים שאני רוצה ואוהב/ת לעשות
          verbatim:
            - points
          echo: true
          alt: שעון בעיגול אדום, נבט בעיגול צהוב, ופנים שמחות בעיגול ירוק
          art: {file: art/kinds.svg}
      - moves:
          - >-
            חשפי את הסוגים אחד־אחד. אחרי כל סוג — שאלי את הכיתה לדוגמה אחת משלה, ורק אחר כך הוסיפי מהדוגמאות
            שלמטה.
          - הציגי את ההגדרה של סדר עדיפויות, וחזרי לשאלת הבחירה מהפתיחה — הפעם עם מבחן התוצאה.
          - ספרי בלב עד עשר לפני שאת מזמינה תשובות. על כל תשובה — מי חושב אחרת, ולמה?
      - list:
          - >-
            **חשוב ודחוף** — יש לו מועד סיום קרוב, או חשיבות גדולה, או שהוא משרת מטרה אישית שלנו. למשל למידה
            למבחן, שיעורי בית למחר, טיפולים רפואיים, מסיבה שמתקיימת היום, לנעול את הדלת כשנכנסים הביתה.
          - >-
            **חשוב ולא דחוף** — חשוב לנו, אבל אין לו מועד סיום מחייב; עושה לנו טוב, ומפתח יכולות וקשרים. למשל
            זמן עם המשפחה ועם החברים, להתקשר לקרובי משפחה, כושר, חוג, תחביבים, מטלות בבית.
          - >-
            **רוצים ואוהבים לעשות** — דברים שגורמים לנו הנאה. למשל סדרות, משחקי מחשב, להגיב לווטסאפ, לשלוח
            תמונה או סרטון, להסתובב בקניון.
      - slide:
          kicker: סדר עדיפויות
          title: סדר עדיפויות הוא הבחירה שלנו מה חשוב לנו כרגע
          sub: ומבחן התוצאה — מה יקרה אם לא אעמוד בזמן?
          verbatim:
            - title
          echo: true
          cue: אחרי הדוגמאות —
          alt: שלט הכוונה עם שלושה כיוונים, שעון, ודמות עומדת
          art:
            - {use: signpost, x: 330, y: 200, w: 240}
            - {use: kid-stand, x: 150, y: 230, w: 140, color: teal}
            - {use: clock, x: 60, y: 36, w: 140}
      - ask: ועכשיו — שיעורי בית או חברים? מה תהיה התוצאה אם לא תעמדו בזמן?
      - say: עכשיו נחזור לרשימה שלכם — ונצבע אותה.

  # ------------------------------------------------------------------ 22′–27′
  - id: colors
    title: צובעים את השבוע
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: מקיפים כל דבר ברשימה בצבע של הסוג שלו, ובזוגות — מה הרשימה הצבועה אומרת על השבוע
    body:
      - slide:
          kicker: ועכשיו · עבודה אישית
          title: הקיפו כל דבר ברשימה בצבע שלו
          points:
            - חשוב ודחוף — אדום
            - חשוב ולא דחוף — צהוב
            - מה שאוהבים לעשות — ירוק
          timer: 120
          echo: true
          alt: דף עם שורות, וכמה מהן מוקפות באדום, בצהוב ובירוק
          art: {file: art/circled.svg}
      - moves:
          - שתי דקות להקיף בצבעים. הסתובבי, ושימי לב למי חסר צבע שלם.
          - הציגי את שאלת החשיבה — חצי דקה לבד, ודקה בזוגות.
          - במליאה — שלושה–ארבעה זוגות. הדהדי, ושאלי מי עוד מזהה את זה אצלו.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה הרשימה הצבועה אומרת על השבוע שלכם?
          points:
            - לבד — חצי דקה
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי הצביעה —
          alt: זוג, ולידו שתי בועות צ׳אט
          art:
            - {use: pair, x: 40, y: 260, w: 240}
            - {use: chat, x: 300, y: 60, w: 280}
      - ladder:
          help: יש צבע שחסר אצלכם? יש תחום — אישי, לימודי, חברתי, משפחתי — שלא הופיע בכלל?
          challenge: איך הייתם רוצים שהשבוע שלכם ייראה — ומה הייתם משנים כדי שיהיה בו מכל צבע?
      - ask: מה הרשימה הצבועה אומרת לכם על השבוע שלכם?
      - say: שבוע טוב הוא לא שבוע בלי ירוק — אלא שבוע שיש בו מקום לכל הצבעים.

  # ------------------------------------------------------------------ +5′
  - id: schedule
    title: לוח הזמנים השבועי שלי
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
    summary: הכללים של הלוח השבועי של המקור, וכל אחד מתכנן את מחר — מכל צבע ומכל תחום
    body:
      - slide:
          kicker: אם נשאר זמן · לוח הזמנים השבועי שלי
          title: בכל יום — מכל צבע
          points:
            - לפחות שתי משימות חשובות ודחופות
            - משימה אחת חשובה ולא דחופה
            - לפחות שני דברים שאוהבים לעשות
            - ומשימה אחת לפחות מכל תחום בחיים
          timer: 240
          echo: true
          alt: לוח שבועי מראשון עד שישי, ובכל יום משבצות אדומות, צהובה וירוקות
          art: {file: art/week.svg}
      - say: בואו נהפוך את הכלי לתוכנית. תכננו את מחר — כך שיהיה בו מכל צבע.
      - task:
          what: >-
            כל אחד כותב במחברת ״מחר״, ומתכנן את היום לפי הכללים שעל המסך — מתוך הרשימה הצבועה, או ממה שכבר
            מחכה לו מחר.
          time: 4 דקות
          group: לבד
          rules: יום אחד בכיתה; את שאר השבוע — מי שרוצה, בבית
          plenary: שניים–שלושה מקריאים את התוכנית של מחר
          help: התחילו ממה שכבר קבוע מחר — בית ספר, חוג — והוסיפו סביבו.
          challenge: הוסיפו למחר פעולה אחת שמקדמת יעד שחשוב לכם.
      - moves:
          - הקריאי את הכללים, ותני ארבע דקות לתכנון.
          - הסתובבי, ושימי לב למי שהיום שלו מלא רק באדום — עזרי לו למצוא מקום לירוק.
          - שמעי שניים–שלושה. ובסוף — את הלוח השבועי המלא אפשר להמשיך בבית, למי שרוצה.
      - ask: מה בתוכנית של מחר הכי יעזור לכם — ולמה?

  # ------------------------------------------------------------------ +5′
  - id: unit
    title: מסכמים את היחידה
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: >-
      למה המפגשים נקראו ״הצבת יעדים וניהול זמן להשגתם״, וכתיבה אישית — משהו שאני לוקח על עצמי לעשות
      אחרת
    body:
      - whisper: >-
          ביחידה ״ניהול עצמי״ שני שיעורים — ״כל יעד מתחיל בחלום״, שבו הופכים חלום ליעד לפי חלו״ם (חשוב, לזמן
          מוגדר, ומה עושים), והשיעור הזה, על ניהול זמן. לא כולם היו בשניהם — מי שלא היה עונה מתוך השיעור הזה.
      - slide:
          kicker: אם נשאר זמן · מסכמים את היחידה
          title: למה המפגשים נקראו ״הצבת יעדים וניהול זמן להשגתם״?
          echo: true
          alt: מטרה עם חץ, ושעון לידה
          art:
            - {use: target, x: 270, y: 90, w: 280}
            - {use: clock, x: 60, y: 250, w: 170}
      - moves:
          - שאלי, ושמעי שלוש–ארבע תשובות. אחר כך שאלי את שאלת ההמשך.
          - דקה וחצי של כתיבה בשקט — כל אחד לעצמו, במחברת.
          - הזמיני שניים–שלושה מתנדבים לשתף במה שכתבו.
      - ask: ומה למדתם על עצמכם, כשהסתכלתם היום על השבוע שלכם?
      - slide:
          kicker: כותבים לעצמכם
          title: משהו שאני לוקח/ת על עצמי לעשות אחרת בעקבות המפגשים...
          verbatim:
            - title
          timer: 90
          echo: true
          cue: אחרי כמה תשובות —
          alt: דמות כותבת ליד שולחן, ונבט לידה
          art:
            - {use: kid-desk, x: 290, y: 150, w: 270, color: teal}
            - {use: sprout, x: 60, y: 240, w: 170}
      - say: הכתיבה הזאת שלכם. מי שרוצה — משתף; מי שלא — שומר לעצמו.
      - ladder:
          help: חשבו על רגע אחד מהשיעור — הרשימה, הצבעים או ההצבעה — שתרצו לזכור.
          challenge: כתבו גם מתי בדיוק תתחילו, ומה יעזור לכם להתמיד.

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלושת משפטי הסיכום של המקור, מילה במילה — משפט בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - >-
              למדנו היום כיצד לארגן את הזמן שלנו, כדי שנוכל להקדיש זמן למטלות ולמשימות וגם לתחביבים ולפעילויות
              פנאי.
            - >-
              ארגון הזמן חשוב מאד, כי יש לנו מטלות רבות, ואנחנו רוצים לעשות גם דברים נוספים, המייצרים אצלנו תחושת
              הנאה.
            - >-
              חלוקת זמן מאפשרת לנו לעשות את מה שחייבים לעשות, ועדיין נשאר זמן למה שאנחנו רוצים ואוהבים לעשות.
          ask: איזה משפט מהשלושה הכי נכון בשבילכם השבוע? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המשפט השלישי הוא לב השיעור — חלוקת זמן לא באה על חשבון מה שאוהבים, היא שומרת לו מקום.
          alt: מאזניים מאוזנים
          art: scale

  # ------------------------------------------------------------------ 40′–45′
  - id: exit
    title: כרטיס יציאה — השבוע שלי
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: דוגמה לכל סוג, ושינוי אחד לשבוע — מה ומתי; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות ושורת רשות, לבד ובשקט. כולם מוסרים פתק בדלת — גם מי שכתב רק שורה אחת. הרשימה הצבועה
          נשארת אצלכם.
      - exit:
          form: board
          title: השבוע שלי — בכל הצבעים
          prompts:
            - דוגמה אחת מהשבוע שלי לכל סוג — חשוב ודחוף, חשוב ולא דחוף, ודבר שכיף לי לעשות.
            - שינוי אחד שאנסה השבוע — מה, ומתי?
            - רשות — מה עוזר לי כשיש לי הרבה מה לעשות?
          look_for: >-
            חפשי מי שמבלבל בין ״דחוף״ ל״חשוב״, ומי שכתב שינוי כללי (״להתארגן יותר״) בלי מתי. ופתקים שמספרים על
            עומס כבד או על אחריות גדולה בבית — עם אלה מדברים בשקט השבוע.
          timer: 180
          alt: דמות כותבת ליד שולחן, ולוח שנה לידה
          art:
            - {use: kid-desk, x: 230, y: 130, w: 288, color: teal}
            - {use: calendar, x: 40, y: 60, w: 170}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
