sub: >-
  יש לנו הרבה מה לעשות, והזמן מוגבל. בשיעור הזה בודקים על מה הלך השבוע שלנו, ממיינים משימות לשלושה סוגים,
  ומחפשים מקום גם למה שחייבים וגם למה שאוהבים.
format: כתיבה אישית, זוגות ומליאה
question: איך מנהלים את הזמן כך שיהיה מקום גם למה שחייבים וגם למה שאוהבים?
takeaways:
  - ניהול זמן הוא לבחור מה הכי חשוב לנו עכשיו — ולשאול מה יקרה אם לא נעמוד בזמן.
  - אפשר למיין משימות לשלושה סוגים — חשוב ודחוף, חשוב ולא דחוף, ומה שאנחנו אוהבים לעשות.
  - שבוע טוב הוא שבוע שיש בו מקום לכל הסוגים, גם למה שחייבים וגם למה שאוהבים.
prep:
  - עפרונות צבעוניים או טושים — אדום, צהוב וירוק — לכל שולחן

