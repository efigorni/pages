# ניהול וארגון זמן למידה ופנאי בדרך להשגת יעדים — כיתה ו׳, ניהול עצמי, שיעור 2 (מקור: sources/text/6/Nihul_Zman.md)
# הסרטון של המקור (״לה פמיליה״, youtube 62vMA6doHPg) הוסר מיוטיוב — השיעור נבנה בלעדיו (יומן החבילה).
