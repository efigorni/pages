    w: 250
  alt: פנים שמחות
steps:
- id: part-1
  title: מילון של רגשות
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: מילון של רגשות — אילו רגשות יכולים להופיע ביום הולדת?
  body:
  - slide:
      title: אילו רגשות יכולים להופיע ביום הולדת?
      art:
      - use: face-happy
        x: 180
        y: 120
        w: 250
      alt: פנים שמחות
      echo: true
  - moves:
    - תני שלוש דקות לכתיבת שתי מילים של רגש.
    - אספי מילים שונות ללוח, כולל רגשות לא נעימים; אין תשובה אחת נכונה.
  - ask: אילו רגשות יכולים להופיע ביום הולדת?
  - ladder:
      help: שמחה, חשש או התרגשות יכולים להיות התחלה.
      challenge: האם שני רגשות שונים יכולים להופיע יחד?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: אדם לא הוזמן
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: אדם לא הוזמן — מה משתנה ברגש של אדם לאורך הסיפור?
  body:
  - slide:
      title: מה משתנה ברגש של אדם לאורך הסיפור?
      art:
      - use: heart-broken
        x: 180
        y: 120
        w: 250
      alt: לב סדוק
      echo: true
      sub: ''
  - moves:
    - 'ספרי: אדם חיכה למסיבה של איתמר.'
    - כשהבין שלא הוזמן, נפגע ורצה לשכנע את רועי להפסיק לדבר עם איתמר.
    - קראי כל רגע בנפרד ובקשי מהזוגות להציע שם לרגש ולנמק מתוך הסיפור.
    - רשמי קשת רגשות, בלי לקבוע מה אדם חייב להרגיש.
  - ask: מה משתנה ברגש של אדם לאורך הסיפור?
  - task:
      what: סמנו שלושה רגעים בסיפור אדם. לכל רגע הציעו שם לרגש ונימוק מתוך מה שקרה.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה קיווה שיקרה, ומה קרה בפועל?
      challenge: איך נבדיל בין רגש כמו עלבון לבין מחשבה כמו לא אוהבים אותי?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: הרגש שמאחורי הסיפור
  minutes: 10
  practices:
  - מהלכי שיח
  - זמן חשיבה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: הרגש שמאחורי הסיפור — איזה רגש עשוי להסתתר כאן?
  body:
  - slide:
      title: איזה רגש עשוי להסתתר כאן?
      art:
      - use: magnifier
        x: 180
        y: 120
        w: 250
      alt: זכוכית מגדלת
      echo: true
  - moves:
    - בקשי מתנדב להמתין מחוץ לדלת הפתוחה לפי כללי בית הספר.
    - הכיתה בוחרת רגש, ושניים מתכננים מצב דמיוני שמבטא אותו בלי לומר את שמו.
    - המתנדב חוזר, שואל שאלת בירור ומנחש.
    - ערכי שני סבבים, ואפשרי גם צפייה בלבד.
    - השווי בין שני פירושים אפשריים לאותו מצב.
  - ask: איזה רגש עשוי להסתתר כאן?
  - ladder:
      help: אפשר להתחיל ממצב כמו מפגש ראשון בחוג חדש.
      challenge: איך תבררו אם הרגש שניחשתם הוא באמת הרגש של האדם?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: נותנים שם ובוחרים
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: נותנים שם ובוחרים — מה אפשר לעשות אחרי שמזהים את הרגש?
  body:
  - slide:
      title: מה אפשר לעשות אחרי שמזהים את הרגש?
      art:
      - use: signpost
        x: 180
        y: 120
        w: 250
      alt: שלטי כיוון
      echo: true
      sub: ''
  - moves:
    - 'ספרי את סוף היומן: אדם מזהה כעס, עלבון, עצב ובעיקר אכזבה; הוא מחליט לא להחרים את איתמר ויוצא לשחק
      בכדור.'
    - בזוגות כתבו מה הרגש סיפר ומה הייתה הבחירה.
    - הזמיני תגובה לדברי זוג אחר, והדגישי שאין חובה להרגיש מיד טוב יותר.
  - ask: מה אפשר לעשות אחרי שמזהים את הרגש?
  - task:
      what: כתבו מה סיפרה האכזבה לאדם ומה הוא בחר לעשות. הוסיפו אפשרות נוספת שאינה פוגעת בחבר.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: 'השלימו: אדם התאכזב כי קיווה ש...'
      challenge: איך אפשר לבחור פעולה מיטיבה גם כשהאכזבה עדיין קיימת?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - ישנם רגשות רבים, וכל אחד מהם מספר לנו סיפור ייחודי וחשוב.
      - לתת שם לרגש – זיהוי הרגש מאפשר את הבנת הסיפור ומכוון אותנו לפעולה שהיא יותר טובה לנו.
      - למרות שלא קל להרגיש רגשות לא נעימים, חשוב לא לנסות להיפטר מהם, אלא לראות בהם משהו שמלמד אותי ומכוון
        אותי.
      - אנשים יכולים להרגיש אחרת במצבים דומים.
      - לרוב, מספיק שנעצור ונשאל את עצמנו "מהו הרגש שממלא אותי עכשיו" כדי להירגע מעט ולחוש הקלה. זה לא
        אומר שהקושי נעלם, אבל הוא מוכיח לנו שאנחנו מסוגלים להרגיש כל דבר שמתעורר ולבחור כיצד לפעול.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - תנו שם לרגש אפשרי של ילד שהצטרף לחוג חדש.
      - מה הרגש עשוי לספר, ואיזו פעולה אפשר לבחור?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: אי-הזמנה למסיבה עשויה לגעת בדחייה אישית. עובדים על אדם או על דמות דמיונית.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם'
