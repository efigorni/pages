safe:
- head: תיאום עם היועצת
  text: תאמי מראש כיצד לפנות לשיחה אישית בעקבות מתקוונים ברגישות לאחר – חלק ב. הכיני אפשרות לצאת לזמן קצר בליווי
    מבוגר מוכר.
- head: מי עלול להיפגע
  text: פוסטים על מבחנים, משפחה וספורט עשויים להיות קרובים לחוויה אישית. אין מבקשים לזהות מי בכיתה מרגיש כך
    או לקרוא הודעות פרטיות.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על אדם או על דמות דמיונית, לכתוב במקום לדבר או לעבור. אין מבקשים פרטים אישיים או שמות של
    ילדים.
- head: אם מישהו משתף פגיעה
  text: הודי לו על האמון, עצרי שאלות מהכיתה והמשיכי בפרטיות עם היועצת; אל תבטיחי סודיות כשנדרשת הגנה. המבוגרים
    אחראים לטפל בפגיעה.
unit_order: 3
unit_size: 4
