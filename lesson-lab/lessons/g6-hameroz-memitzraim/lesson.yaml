sub: >-
  בצאת ישראל ממצרים פגשו בני ישראל קשיים רבים בדרך. בשיעור הזה בודקים מה עזר להם — ומה עוזר לנו — ויוצאים
  ל״מירוץ ממצרים״: משחק לוח שיש בו פירמידות, פרחים, נחשים וסולמות.
format: משחק לוח בקבוצות ומליאה
question: אילו ׳פירמידות׳ יש בדרך שלנו — ומה עוזר לנו להתמודד איתן ולהתקדם?
takeaways:
  - גם לנו יש ׳פירמידות׳ בדרך — אתגרים שאנחנו מתמודדים איתם, כמו בני ישראל במסע.
  - יש כוחות, אנשים ודברים שעוזרים לנו להתמודד, לצמוח ולהתקדם.
  - כשמסתכלים אחורה, רואים גם את מה שכבר הצלחנו — ואת מה שעוד מחכה לנו לפרוח.
prep:
  - >-
    חלוקה מראש לקבוצות של 4–5, ולוח משחק לכל קבוצה — הלוח הוא העמוד האחרון במצגת המקורית (הקישור בתחתית
    המערך), עם הפירמידות, הפרחים, הנחשים והסולמות
  - קובייה וכלי משחק לכל קבוצה (פקקים, מחקים או כפתורים בצבעים שונים)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — משחק שבו כל אחד מספר על אתגרים שלו ועל מה שעוזר לו. השיעור נכתב במקור
      לסדרת ״מאגרי כוח״ של תקופת החירום, וקלף ״בזרוע נטויה״ שואל על אתגר של הימים האלה. שאלי מי בכיתה עובר
      עכשיו תקופה קשה — במשפחה, בבריאות או בגלל המצב הביטחוני — ובקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שחווה עכשיו אבדן, מחלה, פרידה בבית או מתח של המצב הביטחוני — קלפי הפירמידה (״קריעת ים סוף״, ״בזרוע
      נטויה״, ״ביעור חמץ״) עלולים לגעת בו בדיוק שם, מול הקבוצה. גם מי שנופל שוב ושוב בנחש עלול להרגיש שהוא
      ״נכשל״ — הזכירי שזה מזל של קובייה, לא הישג.
  - head: לא לוחצים לשתף
    text: >-
      כלל המשחק של היום: מספרים רק מה שבוחרים, ומותר לומר ״דלג״ — ואז שולפים קלף אחר, או עונים במשפט קצר. לא
      מבקשים פרטים, ומה שנאמר בקבוצה נשאר בקבוצה. במליאה מדברים על המשחק — לא על מה שחבר סיפר.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים
      לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 15 דקות ומעלה — שתי ההרחבות; 10–14 דקות — רק ״אז והיום״; פחות — ישר
    לכרטיס היציאה.
  short:
    steps:
      - pyramids
      - play
    text: >-
      את ה׳פירמידה׳ כל אחד כותב לעצמו, בלי שיחה במליאה, והמירוץ נמשך עשר דקות

brain_break:
  signs: אחרי המירוץ — רעש שלא נרגע, או להפך, ראשים על השולחן.
  ideas:
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
    - name: חמש־ארבע־שלוש
      text: בשקט, כל אחד מוצא חמישה דברים שהוא רואה, ארבעה שהוא שומע ושלושה שהוא מרגיש בגוף.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
  from: race

cover:
  alt: שתי פירמידות, שביל מנוקד, ופרח בסוף השביל
  art: {file: art/cover.svg}

steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: בצאת ישראל ממצרים
    minutes: 5
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: מה עזר לבני ישראל לאורך המסע לארץ ישראל? אוספים על הלוח את הכוחות שעזרו להם
    body:
      - slide:
          kicker: לקראת פסח
          title: מה עזר לבני ישראל לאורך המסע לארץ ישראל?
          sub: בצאת ישראל ממצרים...
          verbatim: true
          echo: true
          alt: פירמידות, ודרך מתפתלת שיוצאת מהן אל האופק
          art: {file: art/exodus.svg}
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - >-
            רשמי על הלוח, בטור אחד, את מה שעולה — ועל כל תשובה שאלי ״איזה כוח זה?״. השאירי את הטור על הלוח עד
            סוף השיעור.
          - סכמי במשפט הגשר — מהמסע שלהם אל המסע שלנו.
      - ask: >-
          לאורך המסע לארץ ישראל פגשו בני ישראל קשיים ואתגרים רבים. מה עזר להם להתגבר עליהם — אילו כוחות?
      - say: >-
          גם לנו יש מסע, ויש בו ׳פירמידות׳ — אתגרים שעומדים בדרך. ויש כוחות שעוזרים לנו לעבור אותם.

  # ------------------------------------------------------------------ 5′–10′
  - id: pyramids
    title: הפירמידות שלנו
    minutes: 5
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      כל אחד כותב לעצמו ׳פירמידה׳ אחת ומה עוזר לו מולה; במליאה — אילו אתגרים יש לילדים בגילנו, ומה עוזר
    body:
      - slide:
          kicker: כולם כותבים · לעצמכם
          title: מה עוזר לי להתקדם בחיים?
          points:
            - אילו אתגרים (״פירמידות״) יש לנו בחיים?
            - מה עוזר להתמודד עימם?
          verbatim: true
          timer: 120
          echo: true
          alt: פירמידה גדולה, ודמות קטנה עומדת לידה
          art: {file: art/pyramid-kid.svg}
      - moves:
          - הציגי את השאלות, ואמרי בבירור שהכתיבה לעצמם — היא לא נאספת ולא מוקראת.
          - שתי דקות של כתיבה בשקט — פירמידה אחת, קטנה או גדולה, ומה עוזר מולה.
          - >-
            במליאה מדברים על ילדים בגילנו, לא על עצמנו. שאלי, וחכי עשר שניות; על כל תשובה — הדהדי, ושאלי ״מי
            עוד מכיר את זה?״
      - say: כתבו לעצמכם — אף אחד לא יאסוף את זה. פירמידה אחת, קטנה או גדולה, ומה עוזר לכם מולה.
      - ladder:
          help: חשבו על משהו שקשה לכם עכשיו — בבית הספר, עם חברים או בבית — אפילו משהו קטן.
          challenge: מה עזר לכם פעם מול פירמידה שכבר עברתם — ואיך זה יכול לעזור גם עכשיו?
      - ask: אילו פירמידות יש לילדים בגילנו — ומה עוזר להתמודד איתן?

  # ------------------------------------------------------------------ 10′–13′
  - id: rules
    title: איך משחקים במירוץ?
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - אחריות ובחירה
    summary: כללי המשחק, שני סוגי הקלפים — פירמידה ופרח — והזכות לומר ״דלג״
    body:
      - slide:
          kicker: פעילות קבוצתית לחג הפסח
          title: המירוץ ממצרים
          points:
            - בתורכם — מטילים קובייה ומתקדמים על הלוח
            - פירמידה — שולפים קלף פירמידה ועונים
            - פרח — שולפים קלף פרח ועונים
            - נחש — יורדים לזנב · סולם — עולים לקצה
          verbatim:
            - title
          echo: true
          alt: קטע מלוח משחק — סולם, נחש, משבצת פירמידה ומשבצת פרח — וקובייה
          art: {file: art/board.svg}
      - quote:
          title: כללי המשחק — מהמקור
          text: >-
            מטרת המשחק: לצאת למסע, להתגבר על אתגרים (קלפי פירמידה) ולחוות התקדמות (קלפי פרח). מהלך המשחק: כל
            משתתף בתורו מטיל קובייה ומתקדם על הלוח בהתאם. אם נחת על משבצת ״פירמידה״ – עליו לשלוף קלף פירמידה
            ולהשיב על השאלה. אם נחת על משבצת ״פרח״ – עליו לשלוף קלף פרח ולהשיב על השאלה. אם נחת על נחש – עליו
            לרדת עד לזנב הנחש. אם נחת על סולם – עליו להתקדם עד לקצה הסולם. המשתתף הראשון שמגיע לסוף המסלול –
            מנצח!
      - slide:
          kicker: שני סוגי קלפים
          title: פירמידות ופרחים בדרך
          sub: פירמידה — אתגר שמתגברים עליו. פרח — התקדמות. ובכל קלף מותר לומר ״דלג״.
          echo: true
          cue: אחרי הכללים —
          alt: שני קלפים — על אחד פירמידה, על השני פרח
          art: {file: art/cards.svg}
      - moves:
          - הקריאי את הכללים מהשקף.
          - >-
            שלפי קלף פירמידה אחד וקלף פרח אחד, והקריאי אותם. תני עשר שניות לחשוב בשקט איך הייתם עונים — בלי
            לענות בקול.
          - הסבירי את שני הכללים של היום — ״דלג״, ומספרים רק מה שבוחרים — ובדקי הבנה בשאלה אחת.
      - say: בכל קלף מותר לומר ״דלג״ ולשלוף קלף אחר — ומספרים רק מה שבוחרים לספר.
      - ask: מה עושים כשנוחתים על פרח?

  # ------------------------------------------------------------------ 13′–25′
  - id: play
    title: יוצאים למירוץ
    minutes: 12
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      בקבוצות של 4–5 משחקים ב״מירוץ ממצרים״ — כל פירמידה או פרח הם קלף ושאלה, ובסוף מי שהגיע הכי רחוק מנצח
    body:
      - slide:
          kicker: המירוץ ממצרים · בקבוצות
          title: יוצאים למסע!
          sub: כשהזמן נגמר — מי שהגיע הכי רחוק במסלול, מנצח.
          timer: 720
          echo: true
          alt: ארבעה סביב שולחן, וקובייה לידם
          art: {file: art/play.svg}
      - say: יוצאים למסע! כל אחד בתורו מטיל קובייה. בפירמידה ובפרח — שולפים קלף ועונים.
      - task:
          what: >-
            כל קבוצה משחקת ב״מירוץ ממצרים״. כל אחד בתורו מטיל קובייה ומתקדם; מי שנוחת על פירמידה או על פרח
            שולף קלף מהחפיסה הזאת ועונה עליו; בנחש יורדים, ובסולם עולים.
          time: 12 דקות
          group: קבוצות של 4–5 לפי החלוקה; לוח, קובייה ושתי חפיסות לכל קבוצה
          rules: >-
            מותר לומר ״דלג״ ולשלוף קלף אחר; מספרים רק מה שבוחרים, ובלי פרטים על אחרים; מקשיבים עד הסוף, בלי
            הערות; מה שנאמר בקבוצה נשאר בקבוצה
          plenary: אין הצגה של תשובות — במליאה מדברים על המשחק
          help: התחילו את התשובה ב״פעם…״ או ב״אני…״ — משפט אחד מספיק.
          challenge: בכל קלף פירמידה — ספרו גם מה עזר לכם, או מה יכול לעזור.
      - moves:
          - >-
            חלקי לכל קבוצה לוח, קובייה, כלי משחק ושתי חפיסות — הקלפים הפוכים, בשתי ערימות. הפעילי את הטיימר.
          - הסתובבי בין הקבוצות והקשיבי. מי שנתקע — הזכירי את ״דלג״, או הציעי לענות במשפט אחד.
          - דקה לפני הסוף — הודיעי. כשהזמן נגמר, כל קבוצה בודקת מי הגיע הכי רחוק.
      - handout:
          title: קלפי פירמידה
          copies: >-
            עותק לכל קבוצה, גזור לתשעה קלפים. אפשר להדפיס את הקלפים המעוצבים מהמצגת המקורית — בהם סמל
            הפירמידה בתחתית הקלף
          verbatim: true
          lines: false
          items:
            - '**ביצה קשה** — משהו שהתקשיתי בו והפך קל יותר עם הזמן… כיצד?'
            - סליחה שארצה לבקש מאדם אחר… ואולי מעצמי? — **ביעור חמץ**
            - בעיה/חידה/תעלומה שהצלחתי ״לפצח״ — **אגוזים**
            - משהו שהצלחתי לעשות בו שינוי — **מה נשתנה?**
            - משהו שארצה לעשות בו שינוי חיובי (בהיבט הלימודי, החברתי, ההתנהגותי…) — **מה נשתנה?**
            - תחום שלא פשוט לי בו. מה/מי עשוי לעזור לי? — **קריעת ים סוף**
            - שאלה שהייתי רוצה לשאול — **״זה שאינו יודע לשאול״**
            - משהו ״מתוק״/חיובי שגיליתי בעצמי מתוך התמודדות עם קושי או אתגר — **חרוסת**
            - '**בזרוע נטויה** — אתגר שאני מתמודד/ת עימו בימים אלה… מה מחזק אותי?'
      - handout:
          title: קלפי פרח
          copies: >-
            עותק לכל קבוצה, גזור לתשעה קלפים. אפשר להדפיס את הקלפים המעוצבים מהמצגת המקורית — בהם סמל הפרח
            בתחתית הקלף
          verbatim: true
          lines: false
          items:
            - משהו שממש משמח אותי — **אביב הגיע פסח בא**
            - משהו מרגש שהצלחתי למצוא או להשיג — **אפיקומן**
            - משהו שהפתיע אותי לטובה — **״ומשה היכה בסלע ויצאו ממנו מים…״**
            - שלושה דברים בחיי עליהם אני מודה — התקדמו שלושה צעדים — **דיינו**
            - מישהו שבכל פעם שאני פוגש אותו, גורם לי לחייך — **אליהו הנביא**
            - '**״ניצנים נראו בארץ…״** — ניצן שהנץ בחיי… תחום שהתחלתי לצמוח בו. מה יעזור לי להמשיך לפרוח?'
            - '**אביב** — תחום שארצה להתפתח/להתקדם/ לפרוח בו. הצעד הראשון שאעשה — התקדם צעד אחד'
            - '**הר סיני** — ערך שחשוב לי בחיי / בחברות'
            - '**הגדה** — סיפור או חוויה שמרגשים אותי במיוחד'
      - say: עוצרים את המירוץ. בואו נסתכל על הדרך שעשינו.

  # ------------------------------------------------------------------ 25′–30′
  - id: debrief
    title: מה עזר לנו בדרך?
    minutes: 5
    practices:
      - זמן חשיבה
