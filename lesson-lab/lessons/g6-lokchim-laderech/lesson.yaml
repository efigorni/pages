steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: film
    title: יציאה לדרך חדשה
    minutes: 7
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      שאלה לפני הצפייה — מה לוקחים איתנו כשעוברים? — וסרטון אנימציה על ילד שעובר דירה, עם עצירה ברגע
      הפרידה מהעץ
    body:
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי, ושמעי שתיים־שלוש תשובות מהירות, בלי לסכם.
          - הקריני את הסרטון, ועצרי ברגע הפרידה מהעץ. שמעי שתי תשובות לשאלה, וחזרי לסרטון.
          - >-
            בסוף הסרטון — שאלי מה הרגישו ומה חשבו. מי שהסרטון הזכיר לו מעבר שעבר — מספר רק אם הוא רוצה.
      - video:
          title: Embarked — סרטון אנימציה קצר
          url: https://www.youtube.com/watch?v=y47-gmGvZhI
          length: "4:24"
          before: מה לוקחים איתנו כשעוברים למקום חדש — ומה נשאר מאחור?
          watch: שימו לב למה שהילד לוקח איתו, ולמה שהוא משאיר מאחור.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו הילד נפרד מהעץ ויוצא לדרך, לפני שרואים את המקום החדש. צפי בסרטון לפני השיעור, ורשמי
                כאן את הזמן.
              ask: את העץ אי אפשר לארוז. מה הילד בכל זאת יכול לקחת ממנו?
          alt: ארגז פתוח, ומתוכו מציצים לב וספר
          art: {file: art/box.svg}
      - ask: מהם הרגשות והמחשבות שעלו בכם במהלך הצפייה? האם הסרטון הזכיר לכם חוויה שחוויתם?

  # ------------------------------------------------------------------ 7′–11′
  - id: tree
    title: העץ שהגיע למקום החדש
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      למה מעבר נקרא ״יציאה לדרך חדשה״, ומה פירוש הדבר שהעץ הגיע למקום החדש — הזיכרונות והחוויות שמלווים
      אותנו
    body:
      - slide:
          kicker: שם הסרטון
          title: לסרטון קוראים ״Embarked״
          sub: פירוש המילה — ״יציאה לדרך חדשה / התחלה של דרך חדשה״.
          verbatim: true
          echo: true
          alt: דרך מתפתלת אל האופק, ודמות בתחילתה
          art:
            - {use: road, x: 200, y: 120, w: 360}
            - {use: kid-stand, x: 60, y: 250, w: 110, color: teal}
      - moves:
          - הציגי את שם הסרטון ואת פירוש המילה, ושאלי. ספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - >-
            עברי לשקף העץ ושאלי מה משמעות הדבר. הדהדי כל תשובה, והזמיני את הכיתה להגיב — ״מי מסכים? מי
            רואה את זה אחרת?״
          - סכמי במשפט שבסוף השלב — הוא הגשר לאריזה.
      - ask: למה, לדעתכם, מעבר למקום חדש נקרא גם ״יציאה לדרך חדשה״?
      - slide:
          kicker: ומה עם העץ?
          title: לבסוף, ראינו שהעץ הגיע למקום החדש.
          sub: מה משמעות הדבר?
          verbatim: true
          echo: true
          cue: אחרי כמה תשובות —
          alt: עץ גדול ליד בית
          art: {file: art/tree.svg}
      - say: >-
          לא בהכרח שהעץ הגיע באמת. הזיכרונות והחוויות המשותפות הם שהחיו אותו גם במקום החדש. העץ מייצג את
          החוויות והזיכרונות הנטועים בנו — והם ילוו אותנו גם בדרך החדשה.

  # ------------------------------------------------------------------ 11′–20′
  - id: pack
    title: דברים שאארוז ואקח איתי
    minutes: 9
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: >-
      דברים מוחשיים ולא מוחשיים; כל אחד ממלא את הדף ״אארוז ואקח איתי״, משתף בזוג, ובמליאה — מה אפשר
      באמת לקחת, ואיך
    body:
      - say: >-
          במעבר לחטיבה, כמו בכל מעבר, יש לנו הזדמנות לעצור ולשאול: מה נרצה לקחת איתנו הלאה? חלק מהדברים
          מוחשיים, כמו חפץ משמעותי, וחלק לא — כמו חוויה משמעותית.
      - slide:
          kicker: אורזים לקראת המעבר · לבד
          title: דברים שאארוז ואקח איתי
          sub: בחרו לפחות חמישה פריטים מהדף, וכתבו ליד כל אחד — מה, ולמה.
          timer: 240
          echo: true
          alt: דף עם שורות, ועיפרון לידו
          art:
            - {use: note, x: 150, y: 60, w: 256}
            - {use: pencil, x: 390, y: 290, w: 190}
      - moves:
          - אמרי את המשפט הפותח, ובקשי מהכיתה דוגמה אחת מוחשית ואחת לא.
          - חלקי את הדף. ארבע דקות של כתיבה בשקט; הסתובבי בין השולחנות, ודקה לפני הסוף — הודיעי.
          - שתי דקות בזוגות — כל אחד משתף פריט אחד או שניים שבחר.
          - במליאה — שמעי שלושה־ארבעה, ואז עברי לשאלה על מה שאי אפשר לארוז.
      - task:
          what: >-
            כל אחד ממלא את הדף ״דברים שאארוז ואקח עימי״: בוחר לפחות חמישה פריטים מתוך עשרה, וכותב ליד כל
            אחד מה הוא לוקח — ולמה. אחר כך משתפים בזוג פריט אחד או שניים.
          time: 4 דקות לבד, 2 דקות בזוגות
          group: לבד ← זוגות לפי השולחנות
          rules: לא חייבים למלא את כל הפריטים; בזוג משתפים רק מה שבוחרים; הדף נשאר אצלכם
          plenary: שלושה־ארבעה מספרים מה ייקחו איתם לחטיבה, ולמה
          help: התחילו מהפריט הכי קל — החברים הטובים שלכם, פינה אהובה או מקצוע שאתם אוהבים.
          challenge: איזה פריט בדף הכי ישמש אתכם בחטיבה — ואיך?
      - handout:
          title: דברים שאארוז ואקח עימי...
          copies: עותק לכל תלמיד
          verbatim: true
          items:
            - דמות משמעותית מבית-הספר
            - מקצוע שאני אוהב/ת במיוחד
            - שיר שאני אוהב/ת
            - החברים הטובים שלי
            - הצלחה שהיתה לי
            - פינה אהובה בבית הספר
            - חלום שיש לי
            - יכולות שרכשתי
            - אתגר שהתמודדתי איתו
            - אירוע מרגש שהיה לי
      - slide:
          kicker: בזוגות ← במליאה
          title: מה תרצו לקחת איתכם לחטיבה? מדוע?
          verbatim: [title]
          echo: true
          timer: 120
          cue: אחרי ארבע דקות של כתיבה —
          alt: זוג יד ביד, ולידו שתי בועות צ׳אט
          art:
            - {use: pair, x: 40, y: 250, w: 230}
            - {use: chat, x: 300, y: 60, w: 280}
      - slide:
          kicker: רגע לחשוב
          title: האם את כל הדברים שרשמתם, תוכלו באמת לקחת איתכם?
          sub: באיזה אופן?
          verbatim: true
          echo: true
          cue: אחרי השיתוף במליאה —
          alt: דמות, ומעליה ענן מחשבה ובתוכו לב
          art:
            - {use: thought, x: 250, y: 30, w: 310}
            - {use: heart, x: 345, y: 82, w: 120}
            - {use: kid-stand, x: 90, y: 220, w: 125, color: teal}
      - ask: ואיך מה שצברתם כאן במשך השנים יעזור לכם בפרידה מבית הספר, ובהמשך הדרך?

  # ------------------------------------------------------------------ 20′–27′
  - id: mark
    title: להטביע חותם
    minutes: 7
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      מה הילד השאיר אחריו, ומהו חותם; בקבוצות — רעיון לחותם שהכיתה תשאיר בבית הספר, והכיתה בוחרת אחד
    body:
      - slide:
          kicker: ומה נשאר אחריו?
          title: האם שמתם לב מה השאיר הילד?
          sub: מדוע לדעתכם הוא בחר להשאיר משהו?
          verbatim: true
          echo: true
          alt: עץ, ודמות שהולכת ממנו בשביל מנוקד
          art: {file: art/leave.svg}
      - moves:
          - שאלי מה השאיר הילד, ולמה. מי שלא זוכר — אפשר להקרין שוב את הדקה הראשונה של הסרטון.
          - הציגי את ההגדרה מהמילון והקריאי אותה. שאלי אם מה שהילד השאיר הוא חותם.
          - הסבירי את המשימה לפני שעוברים לקבוצות; שלוש דקות, והשקף עם הטיימר נשאר על המסך.
          - >-
            במליאה — כל קבוצה אומרת רעיון אחד. רשמי את הרעיונות על הלוח, והכיתה מצביעה — כל אחד פעם אחת.
      - whisper: >-
          הוא השאיר את הקסדה שלו — אולי כמזכרת, אולי כי לא חשב שיזדקק לה, ואולי כדי להקל על עצמו את
          הפרידה. קבוצה שנתקעת — דוגמאות מהמקור: ספסל חברות, פינת יישוב סכסוכים, נטיעת עצים, פינת משחקים.
      - slide:
          kicker: להטביע חותם
          title: להשאיר סימנים ועדות לנוכחותי לטווח ארוך
          sub: כמו שמטביעים חותמת אמיתית בחומר רך (מתוך מילון השפה העברית)
          verbatim: true
          echo: true
          cue: אחרי כמה תשובות —
          alt: חותמת מעל חומר רך, ולידה כוכב שכבר הוטבע בו
          art: {file: art/stamp.svg}
      - say: >-
          הדבר שתרצו שיהיה כאן, בבית הספר, ויישאר אחרי שתעברו לחטיבה — הוא חותם. חותם נותן משמעות למי
          שמשאיר אותו, גם אחרי שעזב, ותורם לקהילה. עכשיו כל קבוצה מציעה חותם לכיתה שלנו.
      - slide:
          kicker: בקבוצות · 3 דקות
          title: איזה חותם נשאיר בבית הספר?
          sub: רעיון אחד או שניים — משהו שיישאר כאן גם אחרינו.
          timer: 180
          cue: כשיוצאים לקבוצות —
          alt: ארבעה סביב שולחן עגול, ובית ספר לידם
          art:
            - {use: school, x: 330, y: 60, w: 260}
            - {use: circle4, x: 40, y: 210, w: 300}
      - task:
          what: >-
            כל קבוצה מציעה רעיון אחד או שניים לחותם קבוצתי שהכיתה תשאיר בבית הספר — משהו שיישאר גם אחרי
            שנעבור לחטיבה — וכותבת אותו על הדף.
          time: 3 דקות
          group: קבוצות של 4–5 לפי השולחנות
          rules: רעיון שהכיתה יכולה לעשות בעצמה; כל אחד מציע, והקבוצה בוחרת
          plenary: כל קבוצה אומרת רעיון אחד, הרעיונות נרשמים על הלוח, והכיתה מצביעה על אחד
          help: חשבו על מקום בבית הספר שאתם אוהבים — מה הייתם רוצים להוסיף לו?
          challenge: איזה חותם ייתן משהו גם לתלמידים שיגיעו אחרינו — ואיך?
      - ask: איזה חותם הכי הייתם רוצים שיישאר כאן אחרינו? כל אחד מצביע פעם אחת.

  # ------------------------------------------------------------------ +5′
  - id: plan
    title: מתכננים את החותם
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: כל קבוצה מתכננת חלק אחד בדרך למימוש החותם שנבחר — שלושה צעדים
    body:
      - slide:
          kicker: אם נשאר זמן · בקבוצות
          title: איך החותם שלנו יקרה?
          sub: כל קבוצה מתכננת חלק אחד — ושלושה צעדים.
          timer: 180
          alt: לוח שנה, ועיגול עם וי לידו
          art:
            - {use: calendar, x: 140, y: 100, w: 280}
            - {use: check, x: 420, y: 320, w: 160}
      - moves:
          - חלקי לכל קבוצה שאלה אחת מהלוח, כך שכל שאלה מגיעה לקבוצה אחת לפחות.
          - שלוש דקות של תכנון. הסתובבי בין הקבוצות.
          - כל קבוצה מקריאה את הצעדים שלה; רשמי אותם על הלוח, ליד החותם שנבחר.
      - board:
          - מה צריך כדי שהחותם יקרה — חומרים, מקום וזמן?
          - ממי צריך לבקש רשות או עזרה?
          - מה הצעד הראשון — ומי עושה אותו?
      - task:
          what: כל קבוצה מתכננת חלק אחד בדרך למימוש החותם שנבחר, לפי השאלה שקיבלה, וכותבת שלושה צעדים.
          time: 3 דקות
          group: אותן קבוצות; כל קבוצה עם שאלה אחת מהלוח
          rules: צעדים שהכיתה יכולה לעשות בעצמה; כותב אחד, וכולם מציעים
          plenary: כל קבוצה מקריאה את הצעדים שלה, והם נרשמים על הלוח
          help: התחילו מהשאלה — מה הדבר הראשון שצריך לקרות?
          challenge: מה עלול לעכב את החותם — ואיך תתגברו על זה?
