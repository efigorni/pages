# לוקחים לדרך ומטביעים חותם — כיתה ו׳, המעבר לחטיבת הביניים, שיעור 4 (מקור: sources/text/6/Lokchim_Laderech.md)
# המקור כתוב לשני שיעורים (עד שקף 19 / הטבעת חותם) — כאן מערך אחד: ליבה של 35′ ושתי הרחבות (D37).
