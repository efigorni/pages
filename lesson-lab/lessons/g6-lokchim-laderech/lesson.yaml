sensitivity: low-med
latin_ok:
  - Embarked

sub: >-
  לפני המעבר לחטיבה עוצרים לבחור מה לוקחים איתנו. בשיעור הזה צופים בסרטון על ילד שיוצא לדרך חדשה,
  כל אחד אורז את מה שחשוב לו מבית הספר, והכיתה בוחרת יחד חותם שתשאיר אחריה.
format: סרטון, עבודה אישית, זוגות וקבוצות
question: מה ניקח איתנו לדרך החדשה — ואיזה חותם נשאיר אחרינו?
takeaways:
  - מעבר הוא יציאה לדרך חדשה — ואנחנו בוחרים מה לוקחים איתנו.
  - >-
    חלק ממה שלוקחים מוחשי, וחלק — זיכרונות, חוויות, יכולות וחברים — נמצא בתוכנו ומלווה אותנו גם במקום
    החדש.
  - חותם שמשאירים יחד ממשיך להשפיע, ומחבר אותנו לבית הספר גם אחרי שנעבור.
prep:
  - חלוקה לקבוצות של 4–5 לפי השולחנות, ודף ריק לכל קבוצה לרעיונות לחותם
  - שלוש השאלות של ״מתכננים את החותם״ — כתובות בצד הלוח לפני השיעור (להרחבה)

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״מתכננים את
    החותם״; פחות — ישר ל״חשוב לזכור״.
  short:
    steps: [pack, mark]
    text: >-
      בדף האריזה כל אחד ממלא שלושה פריטים והשיתוף בזוגות יוצא, ואת הרעיונות לחותם מציעים במליאה, בלי
      קבוצות

brain_break:
  signs: ראשים על השולחן, פיהוקים, עיניים שבורחות לחלון.
  ideas:
    - name: ברך ויד
      text: >-
        יד ימין נוגעת בברך שמאל, ויד שמאל בברך ימין — לסירוגין, בקצב שהולך ומתגבר. אחר כך אותו דבר
        עם המרפקים.
    - name: מחיאות בקצב
      text: מחאי קצב קצר, והכיתה חוזרת עליו. כל סבב — קצב קצת יותר מסובך.
    - name: נשימת בלון
      text: ידיים על הבטן. שואפים לאט וממלאים ״בלון״ בבטן, ונושפים לאט. חמש פעמים.
  from: letter

