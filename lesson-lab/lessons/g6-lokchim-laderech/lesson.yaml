title: לוקחים לדרך ומטביעים חותם
grade: 6
grades_served: [6]
month: אפריל
section: מיומנויות לחיזוק כוחות וחוסן להתנהלות מיטבית בשגרה ובחירום (אפריל)
unit: המעבר לחטיבת הביניים
unit_order: 4
unit_size: 6
