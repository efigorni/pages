sub: >-
  לכל משפחה יש דברים שחשובים לה. בשיעור הזה מגלים אילו ערכים חשובים במשפחה שלנו, משחקים ב״בול פגיעה״
  עם הערכים של אחרים, ובוחרים פעולה קטנה אחת לבית.
format: סרטון, כתיבה אישית, רביעיות ומליאה
question: אילו ערכים חשובים במשפחה שלנו — ואיך מבטאים אותם ביום־יום?
takeaways:
  - >-
    ערך הוא דבר שמאמינים בו ומשתדלים לפעול לפיו; כשקובעים שערכים מסוימים חשובים יותר מאחרים — זה סולם
    ערכים.
  - לכל משפחה יש ערכים משלה, ויש ערכים שמשותפים לרבים מאיתנו.
  - את הערכים מבטאים ביום־יום — וגם פעולות קטנות יכולות להיות בעלות משמעות גדולה.
prep:
  - חלוקה מראש לרביעיות לפי השולחנות

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — ערכים במשפחה. שאלי אם יש בכיתה מי שהמשפחה היא כרגע נושא כואב בשבילו:
      פרידה או גירושים, אובדן של הורה או של אח, הורה חולה או רחוק, משפחה שעלתה לא מזמן, מצוקה כלכלית,
      או ילד שגדל מחוץ לבית. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שהמשפחה שלו שונה מזו שבסרטון, או מי שבבית שלו קשה עכשיו. מדברים על ערכים — מה חשוב לנו — ולא על
      איך נראית המשפחה; אין משפחה נכונה ואין ערך נכון יותר. מי שמעדיף — כותב ומשתף ערכים שחשובים לו עצמו,
      בלי לפרט על הבית. שימי לב למי שמתכנס או משתתק, ופני אליו בשקט אחרי השיעור.
  - head: לא לוחצים לשתף
    text: >-
      הכלל של היום, מהמקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. הכתיבה
      האישית לא נאספת; ב״בול פגיעה״ כל אחד מקריא רק את הערכים שהוא בוחר, ובמליאה משתפים רק מתנדבים. מותר
      לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל אלימות או הזנחה בבית, או ״אצלנו אין ערכים״ שנאמר בכאב — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״פעולות קטנות״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - game
      - sulam
    text: >-
      ב״בול פגיעה״ שומעים במליאה רק שלוש קבוצות, ובסולם הערכים שואלים שאלה אחת ועוברים ישר להגדרה

brain_break:
  signs: ראשים על השולחן, פיהוקים, קבוצות שמדברות על הכול חוץ מהמשימה.
  ideas:
    - name: עיגול וריבוע
      text: יד ימין מציירת באוויר עיגול, ויד שמאל — ריבוע, בבת אחת. אחרי חצי דקה מחליפים ידיים.
    - name: שמעון אומר
      text: >-
        הוראות תנועה קצרות — לגעת באף, לקפוץ במקום, להרים יד. מבצעים רק כשההוראה מתחילה ב״שמעון אומר״.
    - name: חמש נשימות
      text: עוצמים עיניים, שואפים לאט דרך האף ונושפים לאט דרך הפה. חמש פעמים, בשקט.
  from: clash

