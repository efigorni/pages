steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: movie
    title: מה חשוב לכל אחד?
    minutes: 6
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      קטע קצר מהטריילר ״משפחה ברשת״ — מה חשוב לכל אחת מהדמויות, ואיך היא מראה את זה; לבד, בזוגות ובמליאה
    body:
      - moves:
          - >-
            שקף ״לפני שצופים״ על המסך כשהכיתה נכנסת. הקריאי את שתי השאלות, וכל אחד בוחר דמות אחת לעקוב
            אחריה.
          - >-
            צופים רק בקטע שבין 0:12 ל־0:40, כמו במקור — הקישור כבר מתחיל ב־0:12. עצרי בנקודת העצירה לשאלה
            בלחישה, המשיכי, ועצרי ב־0:40: שם נגמר הקטע, והמשך הטריילר לא חלק מהשיעור.
          - חושבים לבד 30 שניות, דקה בזוגות, ובמליאה שומעים שלוש־ארבע דמויות שונות.
      - video:
          title: משפחה ברשת — טריילר מדובב
          url: https://www.youtube.com/watch?v=cMfDJVvrW64&t=12s
          length: "1:23"
          before: מה חשוב לכל אחת מהדמויות? ואיך היא מראה את מה שחשוב לה?
          watch: בחרו דמות אחת ועקבו אחריה — מה היא עושה, ומה זה אומר על מה שחשוב לה.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו האב מציע לכל המשפחה להקפיד על קשר עין, כדי להתחבר — בתוך הקטע שבין 0:12 ל־0:40. צפי
                בקטע לפני השיעור, ורשמי כאן את הזמן.
              ask: מה חשוב לאבא, לדעתכם? מילה אחת, בלחישה לשכן.
          alt: משפחה של שלוש דמויות, ומעליה ענן מחשבה ובו לב
          art:
            - {use: group3, x: 244, y: 254, w: 360}
            - {use: thought, x: 24, y: 20, w: 260}
            - {use: heart, x: 104, y: 72, w: 100}
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה חשוב לדמות שבחרתם — ואיך היא מראה את זה?
          echo: true
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          cue: אחרי הצפייה —
          alt: זוג יד ביד, ולידו שתי בועות צ׳אט
          art:
            - {use: pair, x: 334, y: 248, w: 250}
            - {use: chat, x: 36, y: 40, w: 280}
      - ladder:
          help: מה הדמות עושה בסרטון? מה היא מבקשת מהאחרים?
          challenge: האם מה שחשוב לדמות אחת מסתדר עם מה שחשוב לאחרת? מה קורה כשלא?
      - say: >-
          כל התנהגות בסרטון מבטאת משהו שחשוב לדמות — למשל, האב מציע להקפיד על קשר עין משפחתי, כדי שנתחבר.
          ולפעמים, באופן טבעי, מה שחשוב לאחד מתנגש במה שחשוב לאחר. לדברים האלה, שחשובים לנו ומנחים אותנו,
          קוראים ערכים.

  # ------------------------------------------------------------------ 6′–12′
  - id: values
    title: הערכים של המשפחה שלי
    minutes: 6
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - דיפרנציאליות וגיוון
    summary: >-
      מהו ערך, ואז כתיבה אישית — שלושה ערכים שחשובים במשפחה שלי, לפי הסדר, בעזרת עץ הערכים שעל המסך
    body:
      - slide:
          kicker: מהו ערך?
          title: ערך — דבר שמאמינים בו ומשתדלים לפעול לפיו
          sub: כלל שמנחה אותנו, כמו נדיבות לב, אומץ או יושר.
          echo: true
          alt: שלט כיוונים, ודמות עומדת לידו
          art:
            - {use: signpost, x: 110, y: 180, w: 270}
            - {use: kid-stand, x: 430, y: 244, w: 130, color: teal}
      - moves:
          - הקריאי את ההגדרה, ושמעי שתי תשובות לשאלה על הסרטון.
          - >-
            עברי לשקף העץ. כל אחד כותב לבד, במחברת, שלושה ערכים שחשובים במשפחה שלו — לפי הסדר, הכי חשוב
            ראשון.
          - >-
            הסתובבי בין השולחנות. מי שנתקע — הפני אותו לעץ שעל המסך; מי שמעדיף — כותב ערכים שחשובים לו
            עצמו.
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: >-
            ערך הוא דבר שמאמינים בו, כלל שמנחה אותנו כבני אדם, (כמו: נדיבות לב, אומץ או יושר) ומשתדלים לפעול
            על פיו.
      - ask: איזה ערך ראינו אצל המשפחה בסרטון?
      - slide:
          kicker: כולם כותבים · לבד, במחברת
          title: שלושה ערכים שחשובים במשפחה שלכם
          sub: לפי הסדר — הכי חשוב ראשון. אפשר מהעץ, ואפשר ערך משלכם.
          timer: 180
          echo: true
          cue: אחרי ההגדרה —
          alt: עץ ערכים משפחתי — עץ שעל העלווה שלו 22 ערכים, מאדיבות ועד תעוזה
          art: {file: art/tree.svg}
      - p: >-
          בעץ שעל המסך (מהמקור): אדיבות · אכפתיות · ביטוי עצמי · חופש בחירה · גמישות · דוגמה אישית · הגינות ·
          הגשמה · הומור · הכרת תודה · הצלחה · התמדה · התנדבות, עזרה לזולת · חריצות · כבוד · מסורת · נאמנות ·
          סלחנות · עצמאות · צניעות · שאפתנות · תעוזה.
      - say: >-
          כתבו לעצמכם, בשקט: שלושה ערכים שחשובים במשפחה שלכם, לפי הסדר — הכי חשוב ראשון. אפשר לבחור מהעץ,
          ואפשר להוסיף ערך משלכם.
      - ladder:
          help: חשבו על משפט שחוזר אצלכם בבית שוב ושוב — איזה ערך עומד מאחוריו?
          challenge: ואילו ערכים, לדעתכם, חשובים לכל משפחה באשר היא? כתבו אחד — ולמה.

  # ------------------------------------------------------------------ 12′–21′
  - id: game
    title: בול פגיעה
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
    summary: >-
      ברביעיות כל אחד מקריא את שלושת הערכים שלו — אותו ערך הוא ״בול״, ערך דומה הוא ״פגיעה״; בסוף מוצאים
      מה משותף ומה ייחודי
    body:
      - say: >-
          לפני שמתחילים — שני כללים: מקשיבים בלי לשפוט, ומספרים רק על עצמנו. מה שנאמר בקבוצה נשאר בה.
      - slide:
          kicker: בול פגיעה · ברביעיות, 7 דקות
          title: מי כתב כמוני?
          points:
            - כל אחד מקריא את שלושת הערכים שלו
            - אותו ערך — ״בול״, ושם החבר
            - ערך דומה או קרוב — ״פגיעה״, ושם החבר
            - בסוף — מה משותף? ומה ייחודי?
          timer: 420
          echo: true
          alt: מטרה וחץ במרכזה, וארבעה סביב שולחן
          art:
            - {use: target, x: 40, y: 30, w: 320}
            - {use: circle4, x: 370, y: 290, w: 220}
      - moves:
          - >-
            הסבירי את הכללים לפני שמתחילים, וחשפי אותם על המסך אחד־אחד. בדקי הבנה (״מתי רושמים פגיעה?״) —
            ויוצאים לדרך.
          - הסתובבי בין הקבוצות. קבוצה שמתלבטת אם ערך ״דומה״ — מחליטה בעצמה; אין כאן תשובה נכונה.
          - דקה לפני הסוף — הודיעי, ובקשי מכל קבוצה לבחור ערך משותף אחד וערך ייחודי אחד.
          - במליאה — נציג מכל קבוצה אומר את שני הערכים. רשמי על הלוח את הערכים המשותפים.
      - task:
          what: >-
            כל אחד מקריא את שלושת הערכים שלו, לפי הסדר. השאר מסמנים ליד הרשימה שלהם: ׳בול׳ — אם כתבו בדיוק
            אותו ערך, ׳פגיעה׳ — אם כתבו ערך דומה או קרוב, ורושמים את שם החבר. בסוף מדברים: אילו ערכים משותפים
            לכולנו? ואיזה ערך היה רק אצל אחד?
          time: 7 דקות — 4 לסבב, 3 לשיחה
          group: רביעיות לפי השולחנות
          rules: מספרים רק על עצמנו; מותר לוותר על ערך שלא רוצים לשתף; אין ערך נכון יותר
          plenary: נציג מכל קבוצה אומר ערך משותף אחד וערך ייחודי אחד
          help: חפשו ערך שחוזר אצל שניים לפחות — גם אם נכתב במילים אחרות.
          challenge: מה המכנה המשותף לכל הערכים שנכתבו בקבוצה?
      - ask: ערך אחד שמשותף לכל הקבוצה, וערך אחד שהיה רק אצל אחד — מה מצאתם?

  # ------------------------------------------------------------------ 21′–27′
  - id: sulam
    title: סולם ערכים
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: >-
      דיון במליאה — ערך חדש שגילינו אצל אחרים, ואיך הוא נראה ביום־יום; ואז שם לסדר שבנינו: סולם ערכים
    body:
      - slide:
          kicker: במליאה
          title: גיליתם היום ערך חדש — שהייתם רוצים גם במשפחה שלכם?
          echo: true
          alt: זכוכית מגדלת, ובעדשה שלה לב
          art:
            - {use: magnifier, x: 180, y: 70, w: 320}
            - {use: heart, x: 254, y: 156, w: 120}
      - moves:
          - שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - הדהדי כל תשובה, והזמיני את הכיתה להגיב — ״מי מסכים? אצל מי זה נראה אחרת?״
          - בקשי דוגמה של מעשה אחד — איך הערך הזה נראה ביום־יום.
          - אחרי כמה תשובות — הציגי את ״סולם ערכים״ והקריאי את ״מה למדנו״.
      - ask: גיליתם היום ערך חדש — שהייתם רוצים שיהיה גם במשפחה שלכם?
      - say: אז הערך שגילית הוא ___ — הבנתי נכון? מי עוד מצא ערך כזה? איך הוא נראה אצלכם ביום־יום?
      - slide:
          kicker: מה למדנו?
          title: יש ערכים שחשובים לנו יותר מאחרים
          sub: לקביעה הזו קוראים סולם ערכים.
          echo: true
          cue: אחרי כמה תשובות —
          alt: סולם, ועל שלושה שלבים שלו המספרים 1, 2 ו־3
          art: {file: art/ladder.svg}
      - quote:
          title: מה למדנו — להקריא
          text: >-
            בפעילות שערכנו בחרנו את הערכים החשובים לנו במשפחה והכרנו ערכים החשובים למשפחות אחרות. לפעמים אנו
            קובעים שערכים מסוימים חשובים יותר מערכים אחרים. לקביעה הזו אנחנו קוראים סולם ערכים.
      - slide:
          kicker: ובכל משפחה
          title: לכל משפחה יש עץ ערכים משפחתי משלה
          verbatim:
            - title
          echo: true
          cue: ולסיום —
          alt: שלושה עצים שונים, כל אחד בצבע אחר
          art: {file: art/trees.svg}
      - say: >-
