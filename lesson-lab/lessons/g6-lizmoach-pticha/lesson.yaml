      - moves:
          - >-
            הסבירי לפני שקמים — מסתובבים בחופשיות, וכותבים על כל בריסטול מילה, משפט או שאלה, בלי שם. מותר לכתוב שאלה
            שלא נעים לשאול בקול.
          - הפעילי את הטיימר, והסתובבי בין הבריסטולים. מי שמסיים — חוזר למקום.
          - >-
            עברי על הבריסטולים לפני שאת מקריאה. מה שפוגע או לא מתאים לגיל — לא מקריאים; אם יש בו רמז לפגיעה,
            מתייעצים עם היועצת עוד היום.
          - הקריאי שתיים־שלוש תשובות מכל בריסטול, ותני מקום למי שרוצה להוסיף בעל פה.
      - say: >-
          עכשיו כל אחד כותב בלי שם — מחשבה, שאלה, וגם משהו שמביך. אף אחד לא יודע מי כתב מה.
      - task:
          what: מסתובבים בין ארבעת הבריסטולים, וכותבים על כל אחד תשובה — מילה, משפט או שאלה.
          time: 5 דקות
          group: לבד, בתנועה חופשית בכיתה
          rules: כותבים בלי שם; לא מוחקים ולא מגיבים בכתב על תשובה של מישהו אחר; מי שמסיים — חוזר למקום
          plenary: קוראים בקול שתיים־שלוש תשובות מכל בריסטול, ומי שרוצה — מוסיף בעל פה
          help: התחילו בבריסטול שהכי קל לכם לענות עליו.
          challenge: כתבו שאלה שהייתם רוצים לשאול, אבל לא הייתם מעזים לשאול בקול.
      - ask: מה הפתיע אתכם במה שנכתב על הקירות?
      - say: ראינו כמה דברים מסקרנים אותנו, ושלא כולנו מרגישים אותו דבר — וזה בסדר.

