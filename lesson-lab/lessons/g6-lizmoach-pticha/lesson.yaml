sub: >-
  גיל ההתבגרות מביך, וגם מסקרן. בשיעור הזה בודקים בעיניים עצומות איפה כל אחד נמצא, שומעים מה אומרים ילדים
  בכיתה ו׳, וכותבים על ״קירות מדברים״ מה מסקרן אותנו ומה נרצה ללמוד.
format: משחק, זוגות, קירות מדברים ומליאה
question: למה ללמוד בכיתה על גיל ההתבגרות — ומה נרצה ללמוד?
takeaways:
  - בכיתה יש שונות — בידע, בעניין ובמבוכה — וכולנו מכבדים את הקצב של כל אחד.
  - ללמוד על גיל ההתבגרות עוזר להבין מה קורה לנו בגוף, ברגש ובחברה — ולדעת שאנחנו לא לבד.
  - מותר להתבייש, ותמיד אפשר לשאול ולפנות למבוגר שקרוב ללבנו.
prep:
  - >-
    ארבעה בריסטולים או דפים גדולים — על כל אחד שאלה אחת של ״קירות מדברים״ (בשלב ״קירות מדברים״) — תלויים בארבע
    פינות הכיתה לפני השיעור, וטוש ליד כל אחד

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פתיחת היחידה על גיל ההתבגרות ומיניות. שאלי אם יש בכיתה מי שהנושא קרוב אליו
      מדי: מי שגופו כבר משתנה מאוד או עוד לא, מי שעבר פגיעה, מי שבמשפחה שלו מתנגדים לשיחה על הנושא. במצגת
      המקורית יש הצעה למכתב להורים לפני היחידה, בחתימת המחנכת והיועצת — החליטו יחד אם לשלוח אותו לפני השיעור.
      בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מי שבבית לא מדברים על הנושא, או שהמשפחה נבוכה ממנו — המקור אומר שיש משפחות כאלה; מי שכבר נחשף לתכנים לא
      מתאימים לגיל ברשת — לכן ההיגד ״נכנסתי לכל מיני אתרים״ נשאל בעיניים עצומות; ומי שגופו משתנה מוקדם או מאוחר
      מחבריו. צחוק ומבוכה צפויים — אמרי בקול שגם לך זה קצת מביך, ושזה בסדר.
  - head: לא לוחצים לשתף
    text: >-
      ב״הכי כן או הכי לא״ מצביעים בעיניים עצומות, ורק את סופרת. על הקירות כותבים בלי שם. במליאה משתפים רק
      מתנדבים, ורק על עצמם; מותר לוותר, ולא קוראים בשם למי שלא הצביע. בסופשי — השם רק אם רוצים תשובה אישית.
  - head: אם מישהו משתף פגיעה
    text: >-
      עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור
      בסוד. תשובה על הקיר או שאלה בסופשי שמרמזת על פגיעה, או על חשיפה חוזרת לתכנים מיניים — לא מקריאים, ומעבירים
      ליועצת עוד היום. לצד היועצת: מוקד 105 — המטה הלאומי להגנה על ילדים ונוער ברשת, 24/7; 1202 (עונות נשים) או 1203
      (עונים גברים) — מרכזי הסיוע לנפגעות ולנפגעי תקיפה מינית, 24/7 (מתחת לגיל 14 — סיוע ראשוני והפניה); ער״ן 1201 —
      עזרה ראשונה נפשית, 24/7, גם בלי לומר שם. ספרי עליהם לתלמיד שצריך לדבר גם אחרי שעות בית הספר.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 10 דקות ומעלה — ההרחבה; פחות — ישר לכרטיס היציאה.
  short:
