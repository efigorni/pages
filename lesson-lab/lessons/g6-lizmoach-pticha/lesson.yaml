            - {use: pair, x: 60, y: 262, w: 230}
      - moves:
          - הציגי את השקף, ושאלי מי שמע את הביטוי ״גיל ההתבגרות״. שמעי שתיים־שלוש תשובות.
          - הסבירי את המשחק — כולם עוצמים עיניים ומניחים את הראש על הזרועות, ומי שההיגד נכון לגביו מרים יד.
          - הקריאי היגד, חכי חמש שניות, וספרי את הידיים. רשמי על הלוח את מספר ההיגד ואת מספר הידיים.
          - אחרי ששת ההיגדים — עיניים פקוחות. שאלי מה מלמדות התוצאות, ותני לתלמידים להגיב זה לזה.
      - say: >-
          לפני שמתחילים — משחק קצר, ״הכי כן או הכי לא״. אקריא משפט; כולם עוצמים עיניים, ומי שהמשפט נכון לגביו
          מרים יד. אף אחד לא רואה — רק אני סופרת.
