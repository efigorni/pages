steps:
  # ------------------------------------------------------------------ 0′–8′
  - id: video
    title: גברת עם סלים
    minutes: 8
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      צופים בכתבה על בני נוער שעוזרים לסחוב סלים בשוק, ובזוגות חושבים מה כולם מרוויחים — ומה מרוויחים בני
      הנוער עצמם
    body:
      - moves:
          - השקף ״לפני שצופים״ על המסך כשהכיתה נכנסת. שאלי, ושמעי שתיים־שלוש השערות.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה לחיזוי.
          - >-
            אחרי הצפייה — שלוש השאלות על המסך, אחת־אחת. חצי דקה לבד, דקה עם השכן, ואז שומעים זוגות.
          - בסוף — הדהדי את מה שבני הנוער מרוויחים, ועברי להגדרה.
      - video:
          title: גברת עם סלים
          url: https://www.youtube.com/watch?v=u2euIog2I-I
          length: "3:00"
          clip: {start: "0:04"}
          before: למה שבני נוער יסתובבו בשוק ויסחבו סלים של אנשים שהם לא מכירים?
          watch: שימו לב גם לבני הנוער וגם לאנשים שהם עוזרים להם — מה כל צד מקבל?
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו אחד מבני הנוער מתחיל להסביר למה הוא עושה את זה, או מה הוא מקבל בתמורה — עצרי רגע לפני
                שהוא עונה. צפי בכתבה לפני השיעור, ורשמי כאן את הזמן.
              ask: מה הוא יענה? לחשו לשכן תשובה אחת.
          alt: נער סוחב שני סלי קניות
          art: {file: art/market.svg}
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מה כולם מרוויחים?
          points:
            - מדוע בני הנוער התגייסו לפעילות הזו?
            - "מה ״מרוויחה״ הסביבה: האנשים בשוק? האנשים להם הם מסייעים?"
            - מה בני הנוער מרוויחים מהעשייה הזו?
          verbatim: [points]
          echo: true
          cue: אחרי הצפייה —
          alt: מאזניים מאוזנים
          art:
            - {use: scale, x: 140, y: 110, w: 340}
      - ladder:
          help: חשבו על הגברת עם הסלים — איך היא הרגישה בסוף הדרך? ואיך הנער?
          challenge: מי מרוויח יותר — מי שעוזר או מי שמקבל עזרה? נמקו.
      - say: אז מה שבני הנוער מרוויחים זה ___ — הבנתי נכון? מי רוצה להוסיף?

  # ------------------------------------------------------------------ 8′–12′
  - id: value
    title: תחושת משמעותיות וערך
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: ההגדרה של המקור — מתי נוצרת תחושת משמעותיות וערך; מחברים אותה לסרטון ולחיים של הכיתה
    body:
      - slide:
          kicker: המשגה
          title: תחושת משמעותיות וערך
          sub: אנחנו חשובים לאחר ובמעשים שלנו השפענו עליו לטובה.
          verbatim: [title, sub]
          echo: true
          alt: שתי דמויות יד ביד, ולב מעליהן
          art:
            - {use: pair, x: 170, y: 200, w: 280}
            - {use: heart, x: 240, y: 30, w: 140}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: >-
            תחושת משמעותיות ותחושת ערך נוצרות כאשר אנחנו מבצעים תפקיד כלשהו ותורמים למישהו שחשוב לנו (משפחה,
            חברים, קהילה). אנחנו מקבלים תחושה שאנחנו משמעותיים ויש ערך למעשינו: אנחנו חשובים לאחר ובמעשים שלנו
            השפענו עליו לטובה.
      - moves:
          - הקריאי את ההגדרה.
          - >-
            שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות. הזמיני את הכיתה להגיב לתשובות — ״מי מסכים? למה?
            מי רוצה להוסיף?״
          - רשמי על הלוח את המעגלים שעולים — משפחה, חברים, קהילה — ועברי לקבוצות.
      - ask: לפי ההגדרה — במה בני הנוער בסרטון היו משמעותיים? ואיפה עוד אפשר להרגיש ככה?
      - say: ובכיתה שלנו? בואו נחשוב מה אנחנו יכולים לתת לחברים שלנו — כאן, בכיתה.

  # ------------------------------------------------------------------ 12′–22′
  - id: plan
    title: מייצרים ערך ומשמעות — בקבוצות
    minutes: 10
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: >-
      קבוצות של 4–6 בוחרות פעילות למען חברי הכיתה, כותבות מה צריך לעשות, מחלקות תפקידים וקובעות מתי
    body:
      - moves:
          - >-
            הסבירי את המשימה לפני שמתחלקים — בוחרים פעילות, כותבים מה צריך, מחלקים תפקידים וקובעים מתי. דף אחד
            לכל קבוצה.
          - קבוצות לפי החלוקה. אחרי שתי דקות — ודאי שכל קבוצה בחרה, ועברי לשקף התכנון.
          - הסתובבי בין הקבוצות. שימי לב שלכל אחד יש תפקיד — גם לשקטים.
          - >-
            במליאה — שתיים־שלוש קבוצות במשפט אחד. אספי את הדפים; אם הכיתה תקיים את הפעילויות, הן כבר
            מתוכננות.
      - slide:
          kicker: מייצרים ערך ומשמעותיות · בקבוצות
          title: בחרו פעילות אחת למען חברי הכיתה
          sub: ארוחת בוקר, לוח כיתתי, משחק, סרט עם ארוחה, ״בית קפה״, יום תחרויות — או רעיון משלכם.
          timer: 120
          echo: true
          alt: ארבעה סביב שולחן עגול, ונורה דולקת מעליהם
          art:
            - {use: circle4, x: 140, y: 180, w: 320}
            - {use: bulb, x: 450, y: 30, w: 130}
      - say: >-
          כל קבוצה בוחרת פעילות אחת שתשמח את הכיתה, ומתכננת אותה עד הסוף — מה צריך, מי עושה מה, ומתי.
      - slide:
          kicker: מתכננים · 6 דקות
          title: מה צריך לעשות — ומי עושה מה?
          points:
            - כתבו את כל הדברים שיש לעשות
            - חלקו ביניכם את התפקידים
            - קבעו לוח זמנים לעבודה
          verbatim: [points]
          timer: 360
          echo: true
          cue: אחרי שכל קבוצה בחרה —
          alt: דף רשימה, לוח שנה ועיפרון
          art:
            - {use: note, x: 90, y: 110, w: 220}
            - {use: calendar, x: 360, y: 70, w: 180}
            - {use: pencil, x: 360, y: 300, w: 170}
      - task:
          what: >-
            כל קבוצה בוחרת פעילות אחת שהיא רוצה לעשות למען חברי הכיתה, ומכינה תוכנית על דף — כל הדברים שיש
            לעשות, מי עושה מה, ומתי.
          time: 8 דקות — 2 לבחירה, 6 לתכנון
          group: קבוצות של 4–6 לפי השולחנות
          rules: >-
            לכל אחד בקבוצה תפקיד; מתכננים פעילות שאפשר להכין בשעות בית הספר; קבוצה שסיימה — מוסיפה מה יעשו אם
            משהו ישתבש
          plenary: שתיים־שלוש קבוצות אומרות במשפט אחד מה בחרו, ומה התפקידים
          help: התחילו מהפעילות — מה צריך כדי שהיא תקרה? ציוד, מקום, זמן, אנשים.
          challenge: איך תדאגו שכל חברי הכיתה ירגישו שהפעילות גם בשבילם — גם מי שלא בקבוצה שלכם?
      - ask: מה בחרתם — ומה התפקיד של כל אחד?
      - say: תכננו לתת. אבל מי באמת מרוויח מנתינה — רק מי שמקבל? בואו נבדוק מילה אחת.

  # ------------------------------------------------------------------ 22′–27′
  - id: natan
    title: המילה ׳נתן׳
    minutes: 5
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: יד נותנת ויד מקבלת, ותמונת המראה שלהן; ׳נתן׳ נקראת אותו דבר משני הכיוונים — למה?
    body:
      - slide:
          kicker: מה אני נותן ומה אני מקבל?
          title: מה הקשר בין התמונה לפועל ׳נתן׳?
          sub: מה לדעתכם רואים בתמונה?
          verbatim: [title, sub]
          echo: true
          alt: יד נותנת ויד מקבלת, ולצידן תמונת המראה שלהן
          art: {file: art/mirror-hands.svg}
      - moves:
          - >-
            הציגי את התמונה ושאלי. חכי עשר שניות לפני שאת מזמינה תשובות. רמז, אם צריך — התמונה הימנית היא תמונת
            המראה של השמאלית.
          - חשפי את השקף הבא, ושאלי למה ׳נתן׳ היא כזו. ספרי בלב עד עשר.
          - סכמי במשפט אחד, ועברי ל״חשוב לזכור״.
      - ask: מה לדעתכם רואים בתמונה? ומה הקשר בין התמונה לפועל ׳נתן׳?
      - slide:
          kicker: המילה ׳נתן׳
          title: המילה ׳נתן׳ היא מילה פלינדרומית
          sub: מילה שאפשר לקרוא אותה מההתחלה לסופה וההיפך. מדוע היא כזו לדעתכם?
          verbatim: [title, sub]
          echo: true
          cue: אחרי כמה תשובות —
          alt: בועה עם המילה ׳נתן׳, ומתחתיה שני חיצים — אחד לכל כיוון
          art:
            - {use: speech, x: 150, y: 36, w: 320}
            - text: נתן
              x: 310
              y: 142
              size: 104
            - {use: arrow, x: 90, y: 360, w: 200, color: teal}
            - {use: arrow, x: 330, y: 360, w: 200, color: orange, flip: true}
      - ask: למה, לדעתכם, ׳נתן׳ נקראת אותו דבר משני הכיוונים?
      - say: >-
          בנתינה שני הצדדים מרוויחים — גם הנותן וגם המקבל. ולפעמים, כשאנחנו מקבלים, אנחנו נותנים לנותן תחושה של
          ערך.

  # ------------------------------------------------------------------ +5′
  - id: role
    title: התבוננות בתפקיד
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: כל אחד כותב לעצמו על התפקיד שלקח בקבוצה — למה בחר בו, במה יתרום, ומה ירוויח ממנו
    body:
      - slide:
          kicker: אם נשאר זמן · לבד, במחברת
          title: התבוננות בתפקיד
          points:
            - מה הוביל אתכם לבחור בתפקיד שבחרתם?
            - איזו תרומה תביאו למשימה הקבוצתית, שהיא ייחודית לכם?
            - מה תרוויחו ממילוי התפקיד?
          timer: 180
          echo: true
          alt: דמות מרימה יד, וחלק פאזל לידה
          art:
            - {use: kid-hand, x: 360, y: 204, w: 150, color: orange}
            - {use: puzzle, x: 90, y: 150, w: 220, color: purple}
      - moves:
          - הציגי את השאלות. כל אחד כותב במחברת על התפקיד שלקח בקבוצה.
          - שלוש דקות של כתיבה בשקט. הכתיבה לא נאספת.
          - שניים־שלושה מתנדבים משתפים תשובה אחת.
      - say: התפקיד שלכם הוא החלק שלכם בנתינה. כתבו לעצמכם — אף אחד לא יאסוף את זה.
      - ladder:
          help: התחילו מהתפקיד עצמו — מה בדיוק תעשו בפעילות?
          challenge: מה בתפקיד הזה יגרום לכם להרגיש משמעותיים — ולמה דווקא הוא?
      - ask: מי מוכן לשתף — מה הוביל אתכם לבחור בתפקיד שלכם?

  # ------------------------------------------------------------------ +5′
  - id: wider
    title: נתינה במעגל רחב יותר
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - אחריות ובחירה
    summary: ארבעה רעיונות של המקור לנתינה לבית הספר ולקהילה; בזוגות בוחרים רעיון וצעד ראשון, ובמליאה מצביעים
    body:
      - slide:
          kicker: אם נשאר זמן · רעיונות ליישום
          title: לתלמידים אחרים בבית הספר
          points:
            - תכננו פעילות לתלמידי כיתה ז׳ שתסייע להם להרגיש חלק מביה״ס שלנו
            - תכננו פעילות שתעבירו לתלמידי כיתה ו׳ לקראת המעבר לחטיבת הביניים
          verbatim: [points]
          echo: true
          alt: בית ספר, ולידו שתי דמויות יד ביד
          art:
            - {use: school, x: 160, y: 60, w: 340}
            - {use: pair, x: 40, y: 280, w: 200}
      - slide:
          kicker: אם נשאר זמן · רעיונות ליישום
          title: לבית הספר ולקהילה
          points:
            - חשבו על פינה בביה״ס שהייתם רוצים לשפץ לטובת כלל התלמידים
            - תכננו פעילות התנדבותית באחד המוסדות לגיל השלישי בעיר
          verbatim: [points]
          echo: true
          cue: ועוד שני רעיונות —
          alt: בית, ושתי ידיים מושטות זו לזו לידו
          art:
            - {use: house, x: 210, y: 150, w: 330}
            - {use: hands-help, x: 40, y: 50, w: 190}
      - moves:
          - הציגי את ארבעת הרעיונות, אחד־אחד, בשני שקפים.
