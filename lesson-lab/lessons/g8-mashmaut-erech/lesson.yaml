sub: >-
  בני נוער שסוחבים סלים בשוק מגלים שגם הם מקבלים משהו. בשיעור הזה צופים בכתבה, מתכננים בקבוצות פעילות
  למען הכיתה, ומגלים מה מסתתר במילה ׳נתן׳.
format: סרטון, זוגות, קבוצות ומליאה
question: איך נתינה לאחרים נותנת לנו תחושה של ערך ומשמעות?
takeaways:
  - כשאנחנו תורמים למישהו שחשוב לנו, אנחנו מרגישים משמעותיים — ויש ערך למה שאנחנו עושים.
  - בנתינה שני הצדדים מרוויחים — גם הנותן וגם המקבל.
  - גם בכיתה שלנו כל אחד יכול לתת משהו משלו, ולהשפיע לטובה.
prep:
  - חלוקה מראש לקבוצות של 4–6 לפי השולחנות, ודף ריק לכל קבוצה

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״התבוננות בתפקיד״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - video
      - plan
    text: >-
      אחרי הסרטון שומעים רק את השאלה השלישית, ובקבוצות מתכננים רק מה צריך ומי עושה מה — בלי לוח זמנים
brain_break:
  signs: רעש שנשאר מהעבודה בקבוצות, או ראשים כבדים על השולחן.
  ideas:
    - name: שמונה באוויר
      text: עוצמים עיניים ומציירים באצבע שמונה גדולה באוויר — לאט, חמש פעמים, ואז ביד השנייה.
    - name: קפיצות בשקט
      text: קמים ועושים עשר קפיצות קטנות במקום — בלי שום רעש — ומתיישבים.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
  from: wider

