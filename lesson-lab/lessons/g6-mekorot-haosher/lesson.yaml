sub: >-
  מה גורם לנו אושר — ואפשר להוסיף ממנו בעצמנו? בשיעור הזה כותבים רשימה אישית, שומעים את השיר ״אושר״ של
  עוזי חיטמן, ממיינים את מקורות האושר שלנו, ובסוף כל אחד כותב שתי טיפות אושר — לעצמו ולכיתה.
format: כתיבה אישית, זוגות ומליאה
question: מה גורם לי אושר — ואיך אני יכול להוסיף עוד ממנו, לעצמי ולאחרים?
takeaways:
  - לכל אחד מקורות אושר משלו — לבד, עם חברים, עם המשפחה — וכדאי להכיר אותם.
  - האושר נמצא גם בדברים הקטנים, ואפשר לייצר אותו בפעולה יזומה שלנו.
  - כשאנחנו גורמים שמחה לאחרים, גם האושר שלנו גדל.
prep:
  - >-
    המקרא של המיון — כתוב על הלוח לפני השיעור, בצד: ל — עושים לבד · ח — עם חברים · מ — עם המשפחה · כ —
    דורשים כסף · ת — דורשים תכנון מראש · ס — יש בהם מרכיב של סיכון
  - מילות השיר, להקרנה או להדפסה — https://shironet.mako.co.il/artist?type=lyrics&lang=1&prfid=778&wrkid=13633
  - >-
    טיפות אושר — שתיים לכל תלמיד, אישית וכיתתית: דף הטיפות בסוף המצגת המקורית (הקישור בתחתית המערך), או
    פתקיות בשני צבעים
  - הכותרת ״טיפות האושר הכיתתיות שלנו״ על חלק פנוי בלוח, ונייר דבק

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״הטיפות הכיתתיות״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - song
      - sort
    text: >-
      את השיר שומעים עד אמצעו, ושואלים רק את השאלה הראשונה; במיון מסמנים שלושה טורים בלבד — לבד, חברים ומשפחה
brain_break:
  after: sort
  signs: ראשים על השולחן, פיהוקים, עטים שכבר מזמן לא זזים.
  ideas:
    - name: סופרים עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר את המספר הבא, בלי סדר ובלי סימנים. שניים מדברים
        יחד? מתחילים מאחת.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
    - name: נשימה ארוכה
      text: שואפים באף בספירה עד ארבע, ונושפים לאט בפה עד שש. חמש פעמים.
  from: risk

cover:
  alt: נבט בעציץ, ושמש מעליו
  art:
    - {use: sun, x: 340, y: 30, w: 170}
    - {use: sprout, x: 150, y: 150, w: 288}

steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: list
    title: מה גורם לי אושר?
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה אישית כשנכנסים — לפחות עשרה דברים שגורמים לי אושר; שומעים דבר אחד מכמה תלמידים
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, במחברת
          title: מה גורם לכם אושר?
          sub: כתבו במחברת 10–15 דברים — מהגדולים ועד הקטנים.
          timer: 180
          echo: true
          alt: דף עם שורות, ופנים מחייכות לידו
          art:
            - {use: note, x: 290, y: 100, w: 256}
            - {use: face-happy, x: 70, y: 280, w: 170}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. מי שנתקע אחרי שלושה — הפני אותו לשאלת העזר.
          - סבב מהיר — כל מי שרוצה מקריא דבר אחד מהרשימה, בלי הסבר. הרשימות נשארות במחברות, לשלב המיון.
      - say: שלוש דקות, לבד ובשקט. אין רשימה נכונה — רק שלכם. גם דברים קטנים נחשבים.
      - ladder:
          help: חשבו על השבוע האחרון — מתי חייכתם? עם מי? איפה?
          challenge: הוסיפו דבר אחד שעוד לא עשיתם, אבל אתם בטוחים שהיה גורם לכם אושר.
      - ask: מי מוכן להקריא דבר אחד מהרשימה — רק אחד?

  # ------------------------------------------------------------------ 5′–13′
  - id: song
    title: השיר ״אושר״
    minutes: 8
    practices:
      - מה הקשר?
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      שומעים את השיר של עוזי חיטמן; בזוגות — איך השיר מציג את האושר, ומה ממנו מופיע גם ברשימה שלנו
    body:
      - video:
          title: אושר — עוזי חיטמן
          url: https://www.youtube.com/watch?v=ane7Sqv8RVQ
          before: לפי השיר — איפה מוצאים אושר?
          watch: הקשיבו למילים — מה, לפי השיר, צריך לעשות כדי להרגיש אושר?
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו הפזמון נגמר בפעם הראשונה. האזיני לשיר לפני השיעור, ורשמי כאן את הזמן.
              ask: מה שמעתם עד עכשיו — איפה השיר מחפש את האושר?
          alt: מחשב נייד ועל המסך שמש, ותווי מוזיקה מעליו
          art: {file: art/song.svg}
      - moves:
          - הציגי את השאלה שלפני השיר, והשמיעי אותו — אם אפשר, עם המילים על המסך.
          - בעצירה — שאלי, ותני לשניים־שלושה לענות. אחר כך עד הסוף.
          - אחרי השיר — 20 שניות של שקט, דקה בזוגות, ואז שלושה־ארבעה זוגות במליאה.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: איך השיר מציג את האושר?
          sub: ומה מהשיר מופיע גם ברשימה שכתבתם?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          cue: אחרי השיר —
          alt: זוג יד ביד, ובועות צ׳אט מעליו
          art:
            - {use: pair, x: 40, y: 260, w: 240}
            - {use: chat, x: 300, y: 60, w: 280}
      - ladder:
          help: איזו מילה או שורה מהשיר נשארה לכם בראש — ועל מה היא מדברת?
          challenge: לפי השיר, אפשר לייצר אושר בתוכנו? מה צריך לעשות בשביל זה?
      - say: >-
          בשיר כמו בחיים — לכל אחד מקורות אושר משלו. בואו נגלה מה מאפיין את המקורות שלכם.

  # ------------------------------------------------------------------ 13′–18′
  - id: sort
    title: ממיינים את מקורות האושר
    minutes: 5
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: ליד כל דבר ברשימה מסמנים את האותיות של הטורים שלו, סופרים — ומה זה מלמד אותי על עצמי
    body:
      - slide:
          kicker: מזהים את מקורות האושר · לבד
          title: סמנו ליד כל דבר — מאיזה סוג הוא?
          sub: ל לבד · ח חברים · מ משפחה · כ כסף · ת תכנון · ס סיכון
          timer: 180
          echo: true
          alt: דף עם רשימה, ועיפרון לידו
          art:
            - {use: note, x: 300, y: 90, w: 240}
            - {use: pencil, x: 90, y: 260, w: 180}
      - moves:
          - הראי את המקרא שעל הלוח, והדגימי על דבר אחד מהרשימה שלך — אפשר לסמן כמה אותיות ליד אותו דבר.
          - שלוש דקות של סימון וספירה בשקט. הסתובבי, ושימי לב לדברים שסומנו ״ס״.
          - בסוף — כל אחד כותב משפט אחד על מה שמאפיין את הדברים שגורמים לו אושר.
      - say: סמנו, ספרו — ובסוף משפט אחד על עצמכם. אין סימון נכון; רק אתם יודעים מה כל דבר בשבילכם.
      - task:
          what: >-
            ליד כל דבר ברשימה מסמנים את האותיות שמתאימות לו, סופרים כמה יש מכל אות, וכותבים משפט אחד: מה מאפיין
            את הדברים שגורמים לי אושר.
          time: 3 דקות
          group: לבד
          rules: אפשר כמה אותיות ליד אותו דבר; הרשימה נשארת במחברת
          plenary: בשלב הבא, מי שרוצה מספר מה גילה
          help: התחילו מהדבר הראשון ברשימה — עושים אותו לבד, או עם מישהו?
          challenge: בחרו שני טורים, והשוו ביניהם — מה זה מלמד אתכם על עצמכם?
      - say: ועכשיו נשמע מה גיליתם — והאם בכלל אפשר להשפיע על האושר.

  # ------------------------------------------------------------------ 18′–22′
  - id: influence
    title: האושר בידיים שלנו?
    minutes: 4
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
    summary: מה גילינו במיון, והאם אפשר להשפיע על תחושת האושר — ועל כמה פעמים נרגיש אותה
    body:
      - slide:
          kicker: מה גילינו?
          title: האם יש לכם יכולת להשפיע על תחושת האושר בחייכם?
          sub: ואיך? תנו דוגמה מהיום־יום שלכם.
          verbatim: [title]
          echo: true
          alt: דמות מרימה יד, חץ, ופנים מחייכות
          art:
            - {use: kid-hand, x: 440, y: 190, w: 140, color: teal}
            - {use: arrow, x: 260, y: 300, w: 170, color: gray}
            - {use: face-happy, x: 50, y: 250, w: 190}
      - moves:
          - >-
            כלל לשיחה: מספרים רק על עצמנו, ומקשיבים בלי לשפוט. שאלי מה גילו במיון — באיזה טור יצא להם הכי הרבה —
            ושמעי שלושה־ארבעה.
          - הציגי את השאלה, וספרי בלב עד עשר לפני שאת מזמינה תשובות. הדהדי, והזמיני את הכיתה להגיב.
          - >-
            עלה משהו מהטור ״ס״? בלי לשפוט — שאלי מה הוא נותן, ומה המחיר שלו, והאם יש דרך להרגיש אותו דבר
            בלי הסיכון.
      - ask: באיזה טור יצא לכם הכי הרבה — ומה זה אומר עליכם?
      - say: >-
          אז מה שאמרת זה ___ — הבנתי נכון? מי מסכים? ומי חושב שאת האושר אי אפשר לבחור?

  # ------------------------------------------------------------------ 22′–27′
  - id: drops
    title: טיפות אושר
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: כל אחד כותב פעולה אחת בטיפה אישית ופעולה אחת בטיפה כיתתית; הטיפות הכיתתיות עולות ללוח
    body:
      - slide:
          kicker: למדנו, מיישמים · לבד
          title: שתי טיפות אושר — לי ולכיתה
          sub: בכל טיפה — פעולה אחת שאתם עושים, כדי לייצר אושר.
          timer: 180
          echo: true
          alt: שתי טיפות עם המילה אושר — אחת ליד דמות, ואחת ליד קבוצה
          art: {file: art/drops.svg}
      - say: שתי טיפות — אחת בשבילכם ואחת בשביל הכיתה. בכל אחת — פעולה שאתם באמת יכולים לעשות, כבר השבוע.
      - task:
          what: >-
            כל אחד כותב פעולה אחת בטיפה האישית — משהו שהוא עושה כדי לייצר אושר לעצמו — ופעולה אחת בטיפה הכיתתית:
            משהו שיגרום אושר לכיתה.
          time: 3 דקות
          group: לבד
          rules: פעולה שאפשר לעשות כבר השבוע; הטיפה האישית נשארת אצלכם, הכיתתית עולה ללוח
          plenary: הטיפות הכיתתיות נתלות על הלוח, תחת ״טיפות האושר הכיתתיות שלנו״
          help: חזרו לרשימה שלכם — איזה דבר ממנה אתם יכולים ליזום בעצמכם?
          challenge: כתבו לכיתה פעולה שתשמח דווקא מישהו שלא שמים לב אליו הרבה.
      - moves:
          - חלקי שתי טיפות לכל אחד, והסבירי מה כותבים בכל אחת.
          - בסוף — כל אחד ניגש ותולה את הטיפה הכיתתית שלו על הלוח. הקריאי בקול שלוש־ארבע טיפות.
      - say: לפעמים מספיקה טיפה אחת כדי להתחיל. וכשאנחנו משמחים אחרים — גם לנו טוב יותר.

  # ------------------------------------------------------------------ +5′
  - id: board-drops
    title: הטיפות הכיתתיות
    kind: extension
    minutes: 5
    practices:
      - מהלכי שיח
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: קוראים את הטיפות שעל הלוח, ובוחרים יחד פעולה כיתתית אחת לשבוע הזה
    body:
      - slide:
          kicker: אם נשאר זמן · טיפות האושר הכיתתיות שלנו
          title: איזו טיפה נגשים השבוע?
          sub: בוחרים יחד פעולה אחת — כל הכיתה.
          echo: true
          alt: לוח ועליו טיפות צבעוניות, ודמות מרימה יד לידו
          art: {file: art/drops-board.svg}
      - moves:
          - הקריאי עוד כמה טיפות מהלוח, וקבצי יחד עם הכיתה טיפות דומות.
          - הכיתה מצביעה על פעולה אחת לשבוע הזה. סכמי עם הכיתה מי, מתי ואיך.
      - ask: איזו טיפה הכי הייתם רוצים שנגשים השבוע — ולמה? מי מסכים, ומי מציע אחרת?
      - say: כל פעולה כזו היא טיפה של אושר — לנו ולמי שלידנו.

  # ------------------------------------------------------------------ +5′
  - id: risk
    title: אושר בלי סיכון
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
    summary: למה לפעמים מחפשים אושר בדברים מסוכנים — ואיך מרגישים את אותה התרגשות בלי הסיכון
    body:
      - slide:
          kicker: אם נשאר זמן · לבד, בזוג, במליאה
          title: למה לפעמים מחפשים אושר בדברים מסוכנים?
          sub: ומה אפשר לעשות כדי להרגיש את אותה התרגשות — בלי הסיכון?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          echo: true
          alt: רמזור, ופנים מחייכות לידו
          art:
            - {use: traffic-light, x: 340, y: 110, w: 160}
            - {use: face-happy, x: 110, y: 230, w: 170}
      - say: גם דבר מסוכן יכול לשמח לרגע — אבל יש לו מחיר. בואו נחפש דרך אחרת להגיע לאותה תחושה.
      - moves:
          - הציגי את השאלה, וחכי 20 שניות של שקט. דקה בזוגות.
          - במליאה — מדברים על דוגמאות כלליות, לא על מה שמישהו כתב. רשמי על הלוח את החלופות הבטוחות שעולות.
      - ladder:
          help: חשבו על התרגשות שאתם אוהבים — מה גורם לה?
          challenge: מצאו דרך להרגיש את אותה התרגשות — שגם ההורים שלכם היו מסכימים לה.
      - ask: איזו חלופה בטוחה שמעתם, שגם אתם הייתם רוצים לנסות?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: ששת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - whisper: >-
          המסר השלישי מזכיר את האגדה על שני הזאבים (מהשיעור ״מהו אושר?״). למי שלא מכיר — ספרי במשפט: סבא מסביר
          לנכדו שבכל אדם נאבקים שני זאבים, זאב הכעס וזאב האושר, ומנצח הזאב שמאכילים יותר.
      - messages:
          items:
            - >-
              תחושת האושר שלנו היא באחריותנו. אנחנו יכולים לפעול על מנת לחוש אושר בחיינו. ביכולתנו לגרום לאחרים
              תחושת אושר/שמחה ובכך להעצים את תחושת האושר שלנו.
            - >-
              האופן שבו אנו בוחרים להתייחס ולראות אירועים ודברים בחיינו הוא שישפיע על תחושת האושר שלנו – איזה זאב
              נבחר להאכיל?
            - >-
              האושר נמצא בדברים הקטנים: במשהו שהצלחתי לעשות היום ולא הצלחתי בעבר, בעזרה שהגשתי לזולת, בהתמקדות
              במשהו טוב שאמרו לי או אמרו עליי, בכך שעשיתי משהו מהנה עם אדם יקר לי וכדומה.
            - >-
              כשאנחנו מתבוננים על היום / השבוע שחלפו ומחפשים את הטוב ואת האושר, נמצא אותם ונרגיש טוב יותר עם עצמנו
              ועם מה שקורה לנו.
            - >-
              הכרנו את הדברים שגורמים לנו לתחושת אושר. למדנו שאנחנו יכולים לייצר אושר בחיינו על ידי פעולות יזומות
              שלנו.
            - >-
              תחושת האושר היא בידינו – אנחנו יכולים להוביל לכך שאנחנו נרגיש מאושרים באמצעות פעולה יזומה שלנו
          ask: איזה משפט הכי מתאים לטיפות שכתבתם היום? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
          tip: >-
            המסרים הולכים מהאחריות שלנו לאושר (1–2), דרך הדברים הקטנים והמבט על היום (3–4), אל הפעולה היזומה
            (5–6) — מה שהטיפות מתרגלות.
          alt: שתי ידיים מושטות זו לזו, ושמש מעליהן
          art:
            - {use: sun, x: 60, y: 30, w: 170}
            - {use: hands-help, x: 230, y: 170, w: 330}

