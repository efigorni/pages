# מוסיפים אושר לחיים — כיתה ו׳, מקורות האושר, שיעור 2 (מקור: sources/text/6/Mekorot_Haosher.md)
slug: g6-mekorot-haosher
title: מוסיפים אושר לחיים
grade: 6
grades_served: [6]
month: ספטמבר–נובמבר
section: מיומנויות לחיזוק כוחות וחוסן להתנהלות מיטבית בשגרה ובחירום (ספטמבר–נובמבר)
unit: מקורות האושר
unit_order: 2
unit_size: 3
