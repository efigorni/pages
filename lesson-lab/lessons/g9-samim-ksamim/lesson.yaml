sub: >-
  שמות מצחיקים, אריזות צבעוניות והבטחה להרגשה טובה. בשיעור הזה שואלים את דני שאלות, קוראים מה ידוע על
  סמים, ובודקים מה הם עושים באמת למוח — ולמה ה״קסם״ הוא אשליה.
format: לבד, קבוצות, זוגות ומליאה
question: מה סמים עושים באמת למוח — ולמה ההרגשה הטובה היא אשליה?
takeaways:
  - סמים — גם כשהם נראים ״תמימים״, ״טבעיים״ או ״רק שאיפה״ — פועלים על המוח, ועלולים להזיק לו.
  - הסם מפעיל את מערכת התגמול במוח הרבה יותר חזק מהנאה רגילה — ולכן מושך לחזור עליו.
  - ההרגשה הטובה זמנית, והנזק למוח שעוד מתפתח עלול להישאר — למוח אין ״חלקי חילוף״.
prep:
  - חצי דף לכל תלמיד, וסלסלה או קופסה לכל קבוצה
  - חמשת התחומים של השאלות לדני — כתובים על הלוח לפני השיעור
  - חלוקה מראש לקבוצות של 4–6 לפי השולחנות, ואיזה כרטיס מידע מקבלת כל קבוצה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מידע על סמי פיצוציות, חומרים נדיפים וקנאביס. שאלי אם יש בכיתה מי שהנושא
      קרוב אליו: מי שבבית משתמשים, מי שחבר קרוב שלו משתמש, ומי שכבר התנסה. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      דני הוא דמות בדויה — אם יש בכיתה או בשכבה תלמיד בשם הזה, החליפי את השם לפני השיעור. מדברים על החומרים ועל
      המוח, לא על ״מי שמשתמשים״ כאנשים. מי שבמשפחה שלו מטופלים בקנאביס רפואי — השימוש הרפואי הוא במרשם ובמעקב.
      המידע על המוצרים נועד לחשוף את האשליה, לא להסביר איך משיגים או משתמשים.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו״. השאלות לדני והתשובות בלי שמות, והסלסלה מערבבת אותן. מותר לוותר,
      ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל שימוש בחומרים נדיפים או בסמים שקורה עכשיו, אצלו או אצל חבר — עוצרים בעדינות, מודים, וממשיכים בשיחה
      אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת — ער״ן (1201): עזרה
      ראשונה נפשית בטלפון, 24/7, גם בלי לומר שם; ובמצב חירום, כמו מי ששאף חומר נדיף ואיבד הכרה או מפרכס — מד״א,
      101.

