# מסיבת סיום — כיתה ז׳ (משרת גם את ח׳), סיום וסיכום שנה (מקור: sources/text/7/Mesibat_Sium.md)
slug: g7-mesibat-sium
title: >-
  מסיבת סיום: התבוננות רפלקטיבית על השנה שהייתה
grade: 7
grades_served: [7, 8]
month: יוני
section: מיומנויות לחיזוק כוחות וחוסן להתנהלות מיטבית בשגרה ובחירום (יוני)
unit: סיום וסיכום שנה
unit_order: 1
unit_size: 1
src_text: sources/text/7/Mesibat_Sium.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/7Grade/Mamlachti/Mesibat_Sium.pptx
sensitivity: low
src_fixes:
  - from: מקורות הכחות
    to: מקורות הכוחות

sub: >-
  השנה נגמרת, וזה הזמן לעצור ולהסתכל אחורה. בשיעור הזה נזכרים במפגשים של השנה, ממלאים שקית הפתעות
  בחוויות ובכוחות, ונותנים איחול — לעצמנו ולחבר.
format: פתקים על הקיר, זוגות, קבוצות ומליאה
question: מה לקחנו מהשנה הזאת — ומה ניקח איתנו לשנה הבאה?
takeaways:
  - התבוננות על השנה כוללת את ההצלחות וגם את האכזבות — ושתיהן מלמדות אותנו.
  - מהאתגרים שהתמודדנו איתם אפשר לזהות את הכוחות והחוזקות שלנו.
  - בסיום כדאי לזהות את הטוב, להכיר בו, ולצאת לשנה הבאה עם אמונה בכוחות שלנו.
prep:
  - שקית הפתעה קטנה (שקית יום הולדת) או מעטפה לכל תלמיד, על שולחן מרכזי בכיתה
  - פתקיות דביקות בשלושה צבעים — שלוש לכל תלמיד

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״שאלות על השקית״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - recall
      - bag
    text: >-
      בפתיחה מוותרים על הטיול בכיתה — קוראים בקול כמה פתקים מכל פינה; ובשקית כל אחד מציג לקבוצה רק פריט אחד

brain_break:
  signs: התרגשות שהופכת לרעש, תשובות של מילה אחת, קושי לחזור לשקט אחרי התנועה בכיתה.
  ideas:
    - name: פסלים
      text: תני מילה — שמש, עץ, גל — וכולם קופאים לשלוש שניות בתנוחה שמתאימה לה. חמש מילים, בלי לדבר.
    - name: כף אל כף
      text: בזוגות — מחיאת כף לעצמי, ואז שתי כפות עם החבר. כל סבב מהר יותר.
    - name: עשר נשימות
      text: עוצמים עיניים, נושמים לאט וסופרים בשקט עשר נשימות. מי שמסיים — פוקח עיניים ומחכה בשקט.
  from: round

cover:
  alt: שקית הפתעות ובה כרטיסיות, וכוכב לידה
  art: {file: art/bag.svg}

steps:
  # ------------------------------------------------------------------ 0′–7′
  - id: recall
    title: מפגש שזכור לי
    minutes: 7
    practices:
      - תרגילי שליפה
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
    summary: >-
      בלי עזרים, כל אחד כותב על פתקים מפגשים שזכורים לו מהשנה, ומדביק ליד הפתיח המתאים על הקיר; טיול קצר
      בכיתה וקריאה
    body:
      - whisper: >-
          השנה עסקו מפגשי ״הכ״חות שבדרך״, בין השאר, בלמידה, בחברות, בשימוש נכון במסכים ובמניעת שימוש בחומרים
          מסוכנים — וגם במפגשים הראשונים בחטיבת הביניים, במשימות קבוצתיות ובשיח במליאה. מי שלא היה בהרבה
          מפגשים — כותב על רגע מהשנה בחטיבה, או עובד בזוג עם חבר.
      - slide:
          kicker: תרגילי שליפה · לבד, בלי עזרים
          title: מה אתם זוכרים מהמפגשים שלנו השנה?
          sub: פתק לכל פתיח שעל הקיר — כתבו, והדביקו לידו.
          timer: 180
          echo: true
          alt: דמות יושבת, ומעליה ענן מחשבה ובו לוח שנה
          art:
            - {use: thought, x: 40, y: 24, w: 320}
            - {use: calendar, x: 136, y: 70, w: 130}
            - {use: kid-sit, x: 400, y: 250, w: 170, color: purple}
      - moves:
          - שלושת הפתיחים כבר תלויים על הקירות. חלקי שלושה פתקים לכל אחד, והציגי את השקף.
          - >-
            שלוש דקות של כתיבה בלי עזרים — פתק לכל פתיח. אחרי דקה וחצי חשפי את הנושאים, ומי שנזכר בעוד משהו
            מוסיף.
          - מדביקים כל פתק ליד הפתיח שלו, שורה אחרי שורה. אחר כך ״טיול״ של שתי דקות — עוברים בין הפינות וקוראים.
          - חוזרים למקומות. שאלי מה הפתיע אותם, ושמעי שלוש תשובות.
      - say: >-
          כתבו מהזיכרון — עוד לא מסתכלים במחברת ולא בשום מקום אחר. מה שלא זוכרים — זה בסדר; בעוד דקה נחשוף כמה
          נושאים שיעזרו להיזכר.
      - handout:
          title: שלושה פתיחים לקיר
          copies: כל פתיח בדף נפרד, באותיות גדולות — תלויים בשלוש פינות של הכיתה
          verbatim: true
          lines: false
          items:
            - מפגש הזכור לי ביותר...
            - המפגש המרגש ביותר...
            - מפגש ממנו למדתי במיוחד...
      - slide:
          kicker: היזכרו גם בנושאים
          title: הדרך שעברנו ביחד השנה
          points:
            - למידה
            - חברות
            - שימוש נכון במסכים
            - מניעת שימוש בחומרים מסוכנים
          echo: true
          cue: אחרי דקה וחצי של כתיבה —
          alt: דרך מתפתלת לאופק, בין גבעות
          art: road
      - ladder:
          help: חשבו על משימה בקבוצה, על שיחה במליאה או על רגע מצחיק מהשנה — מאיזה מפגש הוא?
          challenge: איזה מפגש השפיע עליכם גם מחוץ לכיתה — ואיך?
      - ask: עברתם בין הפינות — מה הפתיע אתכם בתשובות?

  # ------------------------------------------------------------------ 7′–13′
  - id: learned
    title: מה למדתי על עצמי
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: חוויה אחת שהייתה משמעותית השנה, ומה למדתי על עצמי בעקבותיה — לבד, עם השכן, ובמליאה
    body:
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: חוויה אחת שהייתה משמעותית בשבילכם השנה
          sub: מה למדתם על עצמכם בעקבותיה?
          points:
            - לבד, בכתב — 2 דקות
            - עם מי שיושב לידכם — 2 דקות
            - במליאה
          timer: 120
          echo: true
          alt: הר ודגל על הפסגה, ודמות עומדת מולו
          art:
            - {use: mountain, x: 60, y: 120, w: 384}
            - {use: flag, x: 288, y: 31, w: 110}
            - {use: kid-stand, x: 470, y: 284, w: 110, color: teal}
      - moves:
          - הציגי את השאלה. שתי דקות של כתיבה לבד, במחברת.
          - שתי דקות עם מי שיושב ליד — כל אחד מספר על החוויה, ומה למד ממנה.
          - במליאה — שניים־שלושה מתנדבים מספרים מה למדו על עצמם. הדהדי, והזמיני תגובות.
      - ladder:
          help: חשבו על רגע שבו הצלחתם במשהו — או שהיה קשה, ובכל זאת המשכתם.
          challenge: מה תעשו אחרת בשנה הבאה בזכות מה שלמדתם?
      - say: >-
          בחרו חוויה אחת שהייתה משמעותית בשבילכם השנה — בכיתה, בהפסקה או במפגשים שלנו — וכתבו מה למדתם על
          עצמכם בעקבותיה.
      - ask: מי מוכן לספר מה למד על עצמו?
      - say: אז מה שגילית על עצמך זה ___ — הבנתי נכון? למי עוד קרה משהו דומה?

  # ------------------------------------------------------------------ 13′–22′
  - id: bag
    title: בחרי מסלול — שקית ההפתעות
    minutes: 9
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
    summary: כל אחד ממלא שקית בשלושה פריטים שמסמלים את השנה שלו, ומציג אותה בקבוצה
    body:
      - tracks:
          - title: כרטיסיות
            text: >-
              על השולחן המרכזי — כרטיסיות עם היגדים מהמקור. כל אחד בוחר שלוש שמסמלות את השנה שלו, ושם בשקית.
            when: רוצים פעילות בלי אוכל, או שיש בכיתה אלרגיות; מספיק להדפיס ולגזור.
            practices:
              - הוצאה למשימה
            spotlights:
              - אחריות ובחירה
            body:
              - slide:
                  kicker: מסיבת סיום · כרטיסיות
                  title: מה תכניסו לשקית?
                  sub: שלוש כרטיסיות שמסמלות חוויות, רגשות, מחשבות וכישורים מהשנה שלכם.
                  timer: 120
                  echo: true
                  alt: שקית הפתעות ושלוש כרטיסיות בולטות ממנה, ודמות שמרימה יד
                  art: {file: art/bag-cards.svg}
              - moves:
                  - הכרטיסיות והשקיות על השולחן המרכזי. הסבירי לפני שקמים — כל אחד בוחר שלוש.
                  - ניגשים לשולחן קבוצה אחרי קבוצה, שתי קבוצות בכל פעם, כדי שלא יהיה צפוף.
                  - מי שלא מצא כרטיסייה מתאימה — כותב היגד משלו על פתק.
              - say: >-
                  בחרו שלוש כרטיסיות שמספרות משהו על השנה שלכם — חוויה, רגש, מחשבה, או משהו שלמדתם לעשות.
              - task:
                  what: כל אחד בוחר שלוש כרטיסיות שמסמלות את השנה שלו, ושם אותן בשקית.
                  time: 2 דקות
                  group: לבד — שתי קבוצות ליד השולחן בכל פעם
                  rules: >-
                    כל בחירה מתאימה — גם כרטיסייה של רגע קשה, וגם רק רגעים טובים; מי שלא מוצא — כותב היגד משלו על
                    פתק
                  plenary: אין — עוברים להציג בקבוצות
                  help: בחרו כרטיסייה אחת לרגע טוב, ואחת לרגע שהיה קשה.
                  challenge: בחרו כרטיסייה שמסמלת משהו שלמדתם על עצמכם — ותכננו מה תספרו עליה.
              - handout:
                  title: כרטיסיות לשקית
                  copies: שלושה–ארבעה עותקים, גזורים לכרטיסיות — כדי שיהיה מבחר
                  verbatim: true
                  lines: false
                  items:
                    - יכולת גמישות והסתגלות שגיליתי בעצמי...
                    - רגעים בהם הייתי זקוק/ה לפסק זמן, והצלחתי לקחת...
                    - נהניתי והיה לי כיף כש...
                    - רגע מתוק של יחד שזכור לי במיוחד...
                    - בעיה שנתקלתי בה והצלחתי לפצח
                    - משהו שלמדתי לעשות אחרת
                    - משהו טוב ומתוק שאקח איתי לשנה הבאה
                    - הצלחה שחוויתי השנה והיתה עבורי ניצחון מתוק
                    - משהו / מישהו שחיזק אותי וגרם לי להרגשה טובה
                    - משהו / מישהו שמילא לי את הלב
                    - משהו מלוח שהצלחתי להמתיק. קושי/אתגר שהיה לי ולמדתי ממנו על עצמי
                    - חבר/ה שרציתי להגיד לו/לה תודה
          - title: ממתקים ופירות
            text: >-
              על השולחן המרכזי — ממתקים ופירות בטעמים ובמרקמים שונים. כל אחד בוחר שלושה שמסמלים את השנה שלו, ושם
              בשקית.
            when: רוצים אווירת מסיבה, ואפשר להביא דברים שמותרים לכל תלמידי הכיתה.
            practices:
              - הוצאה למשימה
            spotlights:
              - אחריות ובחירה
            prep:
              - >-
                ממתקים ופירות בטעמים ובמרקמים שונים — מתוק, מלוח, חמוץ — רק כאלה שמותרים לכל תלמידי הכיתה; בדקי
                מראש אלרגיות וכשרות
            body:
              - slide:
                  kicker: מסיבת סיום · ממתקים ופירות
                  title: מה תכניסו לשקית?
                  sub: שלושה פריטים שמסמלים חוויות, רגשות, מחשבות וכישורים מהשנה שלכם.
                  timer: 120
                  echo: true
                  alt: שקית הפתעות, ובולטים ממנה סוכרייה על מקל, ממתק עטוף ותפוח
                  art: {file: art/bag-sweets.svg}
              - moves:
                  - הממתקים, הפירות והשקיות על השולחן המרכזי. הסבירי לפני שקמים — כל אחד בוחר שלושה.
                  - ניגשים לשולחן קבוצה אחרי קבוצה, שתי קבוצות בכל פעם. אוכלים רק בסוף השיעור.
                  - מי שלא אוכל ממתקים — בוחר פרי, או משהו שהוא רק מחזיק ומסביר.
              - say: >-
                  בחרו שלושה פריטים שמסמלים משהו מהשנה שלכם — למשל משהו מלוח לקושי שהצלחתם ״להמתיק״, או משהו מתוק
                  לרגע של יחד.
              - task:
                  what: >-
                    כל אחד בוחר שלושה ממתקים או פירות שמסמלים חוויות, רגשות, מחשבות או כישורים מהשנה שלו, ושם
                    בשקית.
                  time: 2 דקות
                  group: לבד — שתי קבוצות ליד השולחן בכל פעם
                  rules: לוקחים שלושה בלבד; לא אוכלים עד סוף השיעור
                  plenary: אין — עוברים להציג בקבוצות
                  help: חפשו טעם שמתאים לרגע אחד מהשנה — מתוק, מלוח או חמוץ.
                  challenge: בחרו פריט שמסמל כישור שפיתחתם השנה — ותכננו איך תסבירו את הבחירה.
      - slide:
          kicker: בקבוצות · 6 דקות
          title: הציגו את השקית שלכם
          sub: למה בחרתם כל פריט — ותהליך אחד שעברתם השנה.
          timer: 360
          echo: true
          cue: כשכולם חזרו עם שקית מלאה —
          alt: ארבעה סביב שולחן, ובועת דיבור ובה כוכב
          art:
            - {use: circle4, x: 40, y: 220, w: 290}
            - {use: speech-l, x: 360, y: 40, w: 220}
            - {use: star, x: 424, y: 64, w: 90}
      - moves:
          - חוזרים לשולחנות עם השקיות. הציגי את השקף, והפעילי את הטיימר.
          - הסתובבי בין הקבוצות, ובדקי שכל אחד מקבל תור. דקה לפני הסוף — הודיעי.
          - במליאה — שניים־שלושה מתנדבים מספרים איזה פריט עורר בהם גאווה.
      - say: >-
          בקבוצות, כל אחד בתורו מציג את השקית שלו: למה בחר כל פריט — ותהליך אחד שעבר השנה.
      - task:
          what: >-
            כל אחד מציג לקבוצה את שקית ההפתעות שלו: מסביר למה בחר כל פריט, ומשתף בתהליך אחד שעבר לאורך השנה.
          time: 6 דקות — בערך דקה וחצי לכל אחד
          group: ארבעה לפי השולחנות
          rules: מקשיבים בלי לשפוט; מספרים רק על עצמנו; מותר לספר רק על פריט אחד
          plenary: שניים־שלושה מספרים במליאה איזה פריט עורר בהם גאווה
          help: התחילו ב״בחרתי בזה כי השנה…״
          challenge: מה שלושת הפריטים מספרים יחד — איזה סיפור של השנה?
      - ask: מה שמתם בשקית ועורר בכם גאווה?

  # ------------------------------------------------------------------ 22′–27′
  - id: wish
    title: איחול לשנה הבאה
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: כל אחד כותב איחול לעצמו ומוסיף לשקית, ונותן פריט אחד למי שיושב מימינו — עם איחול
    body:
      - slide:
          kicker: לקראת סיום
          title: איחול אחד לעצמכם, לשנה הבאה
          sub: כתבו אותו על פתק, והוסיפו לשקית.
          timer: 90
