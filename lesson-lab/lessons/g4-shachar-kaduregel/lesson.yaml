  - מה הקשר?
  spotlights:
  - עניין ורלוונטיות
  body:
  - slide:
      title: למי מוסרים את הכדור?
      art: hands-help
      echo: true
      sub: 'חשבו על קושי במשחק: מתי כדאי לבקש עזרה וממי? אפשר לענות על דמות דמיונית'
  - p: >-
      שחר נרשם לקייטנת כדורגל וחיכה לשחק עם חבריו. נדב הוא אחיו הגדול; דן, חברו הטוב של נדב ושכן המשפחה,
      הוא המדריך של שחר בקייטנה. יוסי הוא המאמן המבוגר שמרכז את הקבוצה. שחר שמח שדן המוכר לו יהיה המדריך שלו.
  - moves:
    - פתחי בדוגמת כדורגל פשוטה בלי לבקש חוויות פגיעה.
    - הציגי את שחר ואת ציפייתו לקייטנה.
  - say: 'חשבו על קושי במשחק: מתי כדאי לבקש עזרה וממי? אפשר לענות על דמות דמיונית.'
  - task:
      what: 'חשבו על קושי במשחק: מתי כדאי לבקש עזרה וממי? אפשר לענות על דמות דמיונית.'
      time: 2 דקות
      group: זוגות
      rules: אפשר לבחור דמות מהמקור; בלי שמות של תלמידים ובלי חובה לשתף מידע אישי
      plenary: משתפים שתי תשובות ומקשיבים להבדלים ביניהן
      help: מי יכול להסביר כלל שלא הבנתם?
      challenge: האם בקשת עזרה סותרת אומץ?
  - say: גם מי שאוהב ומצליח במשחק עשוי להזדקק לעזרה.
