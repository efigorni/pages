# רגע לפני שמתחילים — כיתה ט׳, פתיחת שנה, שיעור 1 (מקור: sources/text/9/Rega_Lifney_Shematchilim.md)
slug: g9-rega-lifney-shematchilim
title: רגע לפני שמתחילים
grade: 9
grades_served: [9]
month: ספטמבר–אוקטובר
section: מיומנויות לחיזוק כוחות, חוסן והתנהלות מיטבית (ספטמבר–אוקטובר)
unit: פתיחת שנה
unit_order: 1
unit_size: 2
src_text: sources/text/9/Rega_Lifney_Shematchilim.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/9Grade/Mamlachti/Rega_Lifney_Shematchilim.pptx
sensitivity: low

sub: >-
  שנה חדשה מתחילה. בשיעור הזה עוצרים לרגע לפני שמתחילים, משתפים בזוגות מתחלפים במחשבות, בתחושות,
  בחלומות ובשאיפות — ובוחרים יעד, ודרך להתמיד בו.
format: כתיבה אישית, קרוסלה בזוגות מתחלפים ומליאה
question: מה חשוב לי רגע לפני שמתחילים את השנה — ואיך אתמקד בו?
takeaways:
  - רגע לפני התחלה חדשה כדאי לעצור ולשים לב למה שמתעורר בנו — מחשבות, תחושות, חלומות ושאיפות.
  - כשמשתפים ומקשיבים זה לזה, מכירים — וזו התשתית לקשר בינינו.
  - לחשוב מה חשוב לי, ולשתף בזה, עוזר לתכנן ולהתמקד בדברים החשובים — גם כשקשה.
prep:
  - >-
    שני מעגלים של כיסאות, פנימי וחיצוני, פנים מול פנים — או שתי שורות כיסאות זו מול זו, אם אין מקום. החליטי
    מראש מי יושב במעגל הפנימי (למשל שתי השורות הקרובות ללוח), כדי שהמעבר ייקח פחות משתי דקות.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״ניהול זמן״; פחות —
    ישר ל״חשוב לזכור״.
  short:
    steps:
      - carousel
      - persist
    text: >-
      בקרוסלה עושים ארבעה סבבים במקום שישה, ואת הטיפ לעצמי כותבים ומשתפים רק בזוגות, בלי מליאה

brain_break:
  after: reflect
  signs: ראשים על השולחן אחרי החזרה מהמעגלים, פיהוקים, או רעש שלא נרגע.
  ideas:
    - name: נשימה בספירה
      text: שואפים באף עד ארבע, עוצרים עד ארבע, ונושפים לאט בפה עד שש. ארבעה סבבים, בעיניים עצומות.
    - name: עיגול ומשולש
      text: יד ימין מציירת באוויר עיגול, ויד שמאל בו בזמן משולש. אחרי חצי דקה מחליפים ידיים.
    - name: מחיאה בשרשרת
      text: מחיאת כף אחת עוברת מתלמיד לתלמיד לאורך השורות, כמה שיותר מהר. בסבב השני — בכיוון ההפוך.
  from: time

cover:
  alt: דמות עומדת בתחילת דרך שמתפתלת אל האופק, ושמש מעל
  art:
    - {use: sun, x: 420, y: 30, w: 150}
    - {use: road, x: 130, y: 140, w: 390}
    - {use: kid-stand, x: 270, y: 262, w: 125, color: teal}

steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: open
    title: רגע לפני…
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      כתיבה אישית קצרה — מה המילים ״רגע לפני״ אומרות לי, ואיך מרגישים אז; שומעים כמה תשובות, ועוצרים לשים לב
      למחשבות, לתחושות, לחלומות ולשאיפות
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: רגע לפני…
          sub: מה המילים האלה אומרות לכם — ואיך מרגישים ׳רגע לפני׳?
          timer: 180
          echo: true
          alt: דמות עומדת מול דלת פתוחה, רגע לפני שהיא נכנסת
          art:
            - {use: door, x: 320, y: 92, w: 234}
            - {use: kid-stand, x: 110, y: 135, w: 150, color: teal}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף.
          - >-
            בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש תשובות שונות זו מזו — על תחושה, על
            מחשבה ועל תוכנית.
          - הזמיני את שלושת הכותבים לשתף, ואחריהם עוד מתנדב או שניים.
          - >-
            הציגי את השקף ״בודקים ומתכננים״, וחשפי את ארבע המילים אחת־אחת. על כל מילה — שאלי אם מישהו כתב משהו
            כזה.
      - say: שלוש דקות, לבד ובשקט. אין כאן תשובה נכונה — רק מה שעובר עליכם עכשיו.
      - ladder:
          help: חשבו על רגע לפני משהו — משחק, מבחן, הופעה, נסיעה. מה עבר עליכם?
          challenge: ומה חשוב לדעת רגע לפני שמתחילים — ולמה דווקא אז?
      - ask: מה כתבתם — מה המילים ׳רגע לפני׳ אומרות לכם, ואיך מרגישים אז?
      - slide:
          kicker: רגע לפני שמתחילים
          title: בודקים ומתכננים!
          sub: עוצרים ושמים לב ל...
          points:
            - מחשבות
            - תחושות
            - חלומות
            - שאיפות
          verbatim: true
          echo: true
          cue: אחרי התשובות —
          alt: דמות עומדת, ומעליה ענן מחשבה ובתוכו זכוכית מגדלת
          art:
            - {use: thought, x: 250, y: 24, w: 320, flip: true}
            - {use: magnifier, x: 345, y: 75, w: 130}
            - {use: kid-stand, x: 90, y: 230, w: 140, color: teal}
      - say: >-
          בהתחלות שונות בחיים, מה שעוזר הוא לעצור ולשים לב למה שמתעורר בנו: מחשבות, תחושות, חלומות ושאיפות.
          וזה מה שנעשה עכשיו — בזוגות, ובכל סבב עם מישהו אחר.

  # ------------------------------------------------------------------ 6′–18′
  - id: carousel
    title: קרוסלה — רגע לפני שמתחילים
    minutes: 12
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      שני מעגלים, פנים מול פנים; בכל סבב שני משפטים על המסך — כל אחד בוחר אחד ומשתף את בן הזוג, ואז המעגל
      הפנימי זז כיסא אחד
    body:
      - slide:
          kicker: קרוסלה · זוג חדש בכל סבב
          title: אז ככה…
          sub: בוחרים משפט אחד מהשניים שעל המסך, ומשתפים. בסוף הסבב המעגל הפנימי זז כיסא אחד ימינה.
          echo: true
          alt: שני מעגלים של דמויות, פנים מול פנים, וחץ במרכז — המעגל הפנימי זז
          art: {file: art/carousel.svg}
      - moves:
          - >-
            הסבירי את כל המהלך לפני שקמים, ובדקי הבנה בשאלה אחת (״מי זז בסוף כל סבב?״). אחר כך הכיתה מסדרת את
            הכיסאות בשני המעגלים.
          - מי שנשאר בלי בן זוג — יושב מולך בסבב הראשון, ואחר כך נכנס למעגל.
          - >-
            בכל סבב — שקף חדש. אחרי 40 שניות אמרי ״מתחלפים״; אחרי דקה וחצי — מחיאת כף, והמעגל הפנימי זז כיסא
            אחד ימינה.
          - הסתובבי בין הזוגות והקשיבי, בלי להיכנס לשיחות. אחרי הסבב השישי נשארים במעגלים.
      - say: >-
          בכל סבב יהיו על המסך שני משפטים. כל אחד בוחר משפט אחד, משלים אותו לבן הזוג שמולו — ואז מתחלפים.
          מספרים רק על עצמנו, ומה שנאמר בזוג נשאר בזוג.
      - task:
          what: >-
            בכל סבב שני משפטים על המסך. כל אחד בוחר משפט אחד ומשלים אותו בקול לבן הזוג שמולו, ואז מתחלפים. בסוף
            הסבב המעגל הפנימי זז כיסא אחד ימינה, ומתחילים מחדש עם בן זוג חדש.
          time: דקה וחצי לכל סבב — שישה סבבים
          group: שני מעגלים של כיסאות, פנים מול פנים; זוג חדש בכל סבב
          rules: >-
            כל אחד מדבר בתורו, בערך חצי דקה; מקשיבים עד הסוף, בלי לשפוט; מה שנאמר בזוג נשאר בזוג; מותר לענות
            קצר
          plenary: נשארים במעגלים לשאלה אחת — ״גיליתי, הופתעתי, הבנתי״
          help: התחילו במילים שעל המסך, והוסיפו דוגמה אחת מהחיים.
          challenge: לפני שמתחלפים — שאלו את בן הזוג שאלה אחת על מה שסיפר, והקשיבו לתשובה.
      - slide:
          kicker: קרוסלה · סבב 1 · בוחרים משפט אחד
          title: מבט אחורה
          points:
            - הדבר הכי טוב שעשיתי בחופשת הקיץ...
            - רגע לפני שמתחילים, אדם שחשוב לי להודות לו... ועל מה?
          verbatim: [points]
          timer: 90
          echo: true
          cue: סבב 1 —
          alt: שמש של קיץ, ולב לידה
          art:
            - {use: sun, x: 250, y: 60, w: 300}
            - {use: heart, x: 60, y: 310, w: 190}
      - slide:
          kicker: קרוסלה · סבב 2 · בוחרים משפט אחד
          title: תחושות
          points:
            - השנה, כבר ממש מחכה ל...
            - חששות שיש לי, רגע לפני שמתחילים...
          verbatim: [points]
          timer: 90
          echo: true
          cue: סבב 2 —
          alt: פנים שמחות גדולות, ולידן פנים מתלבטות
          art:
            - {use: face-happy, x: 250, y: 90, w: 300}
            - {use: face-meh, x: 60, y: 300, w: 170}
      - slide:
          kicker: קרוסלה · סבב 3 · בוחרים משפט אחד
          title: להמשיך — או לשנות?
          points:
            - השנה, ארצה להמשיך ב...
            - משהו שאני רוצה לעשות אחרת השנה...
          verbatim: [points]
          timer: 90
          echo: true
          cue: סבב 3 —
          alt: חץ שמתפצל לשלושה כיוונים, ודמות עומדת לידו
          art:
            - {use: arrows-fork, x: 230, y: 80, w: 340}
            - {use: kid-stand, x: 70, y: 220, w: 140, color: teal}
      - say: עד עכשיו הסתכלנו על הקיץ ועל מה שאנחנו מרגישים. משם — קדימה, אל השנה.
      - slide:
          kicker: קרוסלה · סבב 4 · בוחרים משפט אחד
          title: שאיפות
          points:
            - יעד לשנה הקרובה
            - משהו שחשוב לי במיוחד להצליח בו השנה
          verbatim: [points]
          timer: 90
          echo: true
          cue: סבב 4 —
          alt: מטרה עם חץ במרכזה, ודמות עומדת מולה
          art:
            - {use: target, x: 270, y: 70, w: 300}
            - {use: kid-stand, x: 80, y: 230, w: 135, color: teal}
      - slide:
          kicker: קרוסלה · סבב 5 · בוחרים משפט אחד
          title: חלומות
          points:
            - המשאלה שלי לשנה החדשה...
            - השנה חשוב לי שיהיה לי זמן ל....
          verbatim: [points]
          timer: 90
          echo: true
          cue: סבב 5 —
          alt: כוכב גדול, ושעון לידו
          art:
            - {use: star, x: 250, y: 50, w: 300}
            - {use: clock, x: 60, y: 300, w: 170}
      - slide:
          kicker: קרוסלה · סבב 6 · בוחרים משפט אחד
          title: אני והאחרים
          points:
            - מישהו שתמיד יהיה שם לצידי בשנה הקרובה
            - משהו שארצה לעשות כדי לתת מעצמי ולתרום לאחרים
          verbatim: [points]
          timer: 90
          echo: true
          cue: סבב 6 —
          alt: שתי ידיים מושטות זו לזו, ולב מעליהן
          art:
            - {use: hands-help, x: 200, y: 160, w: 340}
            - {use: heart, x: 70, y: 40, w: 170}
      - say: עצרו — נשארים במקומות, במעגלים. בואו נשמע מה קרה בשיחות.

  # ------------------------------------------------------------------ 18′–23′
  - id: reflect
    title: גיליתי · הופתעתי · הבנתי
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: עדיין במעגלים — כל אחד משלים משפט על מה שקרה בשיחות, ומה זה אומר על הקשר בינינו
    body:
      - slide:
          kicker: במעגל · משפט אחד
          title: מה לקחתם מהשיחות?
          points:
            - גיליתי ש...
            - הופתעתי מ...
            - הבנתי ש...
          verbatim: [points]
          echo: true
          alt: שלוש דמויות יחד, ונורה דולקת מעליהן
          art:
            - {use: group3, x: 110, y: 220, w: 400}
            - {use: bulb, x: 240, y: 16, w: 140}
      - moves:
          - נשארים במעגלים. שאלי, וספרי בלב עד עשר לפני שאת מזמינה תשובות.
          - >-
            חשפי את שלושת הפתיחים אחד־אחד. כל מי שמשתף משלים אחד מהם — על עצמו או על השיחות, בלי לספר מה מישהו
            אחר סיפר לו.
          - >-
            על כל תשובה — הדהדי, ושאלי מי עוד גילה משהו דומה. אחרי ארבע–חמש תשובות — סכמי, ומחזירים את הכיסאות
            למקום.
      - ask: מה גיליתם, מה הפתיע אתכם, מה הבנתם — על עצמכם, או על השיחות עצמן?
      - say: אז מה שגילית זה ___ — הבנתי נכון? למי עוד זה קרה בשיחות?
      - say: >-
          בקרוסלה שיתפנו והקשבנו — וככה מכירים. זו התשתית לקשר בינינו. עכשיו חוזרים למקומות, ומכל מה שעלה
          בוחרים דבר אחד שחשוב לנו להצליח בו: מה יעזור לנו להתמיד?

  # ------------------------------------------------------------------ 23′–27′
  - id: persist
    title: טיפ לעצמי
    minutes: 4
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: לבד, בזוגות ובמליאה — טיפ אחד לעצמי, איך להתמיד ביעדים גם כשקשה; רשימת טיפים על הלוח
    body:
      - slide:
          kicker: טיפ לעצמי · לבד, בזוגות, במליאה
          title: איך להצליח להתמיד ביעדים ובשאיפות שלי, גם כשקשה...?
          points:
            - לבד — 30 שניות
            - בזוגות — דקה
            - במליאה
          verbatim: [title]
          echo: true
          alt: הר גבוה, ודמות עומדת למרגלותיו
          art:
            - {use: mountain, x: 220, y: 190, w: 370}
            - {use: kid-stand, x: 70, y: 240, w: 130, color: teal}
      - moves:
          - שאלי, ותני 30 שניות לכתוב במחברת טיפ אחד — בשקט.
          - דקה בזוגות, עם השכן — כל אחד מקריא את הטיפ שלו, ויחד מוסיפים עוד אחד.
          - במליאה — שמעי ארבעה–חמישה זוגות, ורשמי את הטיפים על הלוח במילה או שתיים.
      - ladder:
          help: חשבו על פעם שהתמדתם במשהו — אימון, נגינה, משחק. מה עזר לכם להמשיך?
          challenge: כתבו טיפ לרגע שבו כבר רוצים לוותר — מה תגידו לעצמכם אז?
      - ask: מה הטיפ שלכם — מה יעזור לכם להמשיך, גם כשקשה?
      - say: אז מה שעוזר לך להמשיך זה ___ — הבנתי נכון? למי עוד זה עוזר?

  # ------------------------------------------------------------------ +5′
  - id: time
    title: ניהול זמן
    kind: extension
    minutes: 5
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - אחריות ובחירה
    summary: כל אחד כותב שני דברים שיעזרו לו לנהל את הזמן השנה, ובוחר אחד לנסות כבר השבוע
    body:
      - slide:
          kicker: אם נשאר זמן · ניהול זמן
          title: מה יעזור לי לנהל את הזמן שלי בצורה טובה ויעילה?
          sub: כתבו שני דברים — וסמנו אחד שתנסו כבר השבוע.
          verbatim: [title]
          timer: 120
          echo: true
          alt: שעון גדול, ולוח שנה לידו
