# לכל שאלה תשובה – ידע הוא כוח — כיתה ו׳, המעבר לחטיבת הביניים, שיעור 6 (מקור: sources/text/6/Sheela_Tshuva.md)
# המקור כתוב לשיעור כפול, עם יועצת החטיבה כאורחת בחלק השני — כאן מערך אחד: ליבה של 35′ ושתי הרחבות (D37);
# המפגש עם היועצת הוא מסלול, ולצידו מסלול בלי אורחת.
