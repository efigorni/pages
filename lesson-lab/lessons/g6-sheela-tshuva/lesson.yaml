          art:
            - {use: crowd, x: 150, y: 290, w: 320}
            - {use: speech, x: 330, y: 60, w: 200}
            - text: '?'
              x: 430
              y: 128
              size: 64
      - ask: מה הבנתם על עצמכם, כשגיליתם שהשאלות שלכם מעסיקות גם אחרים?
      - say: >-
          אחד הנושאים הבולטים הוא החברים. ברוב המקרים תוכלו לבחור חברים לכיתה בחטיבה — אז בואו נבדוק מה חשוב
          לנו בבחירה.

  # ------------------------------------------------------------------ 12′–18′
  - id: friends
    title: איך אבחר את החברים שלי?
    minutes: 6
    practices:
      - כולם כותבים
      - מהלכי שיח
    spotlights:
      - אחריות ובחירה
      - הערכה ורפלקטיביות
    summary: >-
      שאלון אישי — בוחרים שלושה משפטים ומדרגים אותם; במליאה — מהם השיקולים החשובים, ומאילו כדאי להימנע
    body:
      - whisper: >-
          לפי המקור, ברוב המקרים אפשר לבחור חברים לכיתה בחטיבה — חוץ ממי שמתמיין לכיתה ייחודית. אם לא בררת
          איך זה בחטיבה שאליה עוברים, אמרי שזו שאלה ליועצת החטיבה.
      - slide:
          kicker: שאלון אישי · לבד
          title: איך אבחר את החברים שלי? מה חשוב לי?
          sub: בחרו את שלושת המשפטים החשובים לכם, ודרגו אותם מ־1 (הכי חשוב) עד 3.
          echo: true
          timer: 150
          alt: מאזניים, וזוג יד ביד לידם
          art:
            - {use: scale, x: 320, y: 50, w: 260}
            - {use: pair, x: 60, y: 240, w: 220}
      - moves:
          - חלקי את השאלון, והבהירי שהוא אישי — אף אחד לא יצטרך לשתף, והדף נשאר אצלם.
          - שתי דקות וחצי לבחירה ולדירוג, בשקט.
          - >-
            במליאה — שאלי מה גילו שחשוב להם, ואחר כך אם יש שיקולים שכדאי להימנע מהם. הדהדי, ותני לכיתה להגיב —
            ״מי מסכים? מי חושב אחרת?״
          - >-
            אם זה לא עולה מהכיתה, הוסיפי את השיקולים שכדאי להימנע מהם — אי־נעימות, רצון לרַצות, רצון להיות עם
            מי שמקובל.
      - ladder:
          help: חשבו על חבר שטוב לכם איתו — איזה משפט בשאלון הכי מתאר אותו?
          challenge: כתבו בתחתית הדף שיקול רביעי, שלא מופיע בשאלון ושחשוב לכם.
      - handout:
          title: שאלון — בחרו את שלושת המשפטים החשובים לכם, ודרגו אותם מ־1 עד 3
          copies: עותק לכל תלמיד (אישי, לא נאסף)
          verbatim: true
          text: |-
            "אני ממש יכול/ה לסמוך עליה /עליו"
            "כל השנה רבנו, אבל השבוע השלמנו והתקרבנו וממש היה לנו כיף"
            "אני מרגיש/ה ממש קרוב/ה אליה /אליו"
            "היא / הוא שומר/ת את כל הסודות שלי ואני את שלה / שלו"
            "אנחנו חברות / חברים טובות/ טובים כבר הרבה שנים"
            "היא/הוא בוחר/ת בי, לא נעים לי לא לבחור בו/בה"
            "אנחנו גרים/גרות אחד ליד השני, הוא / היא תמיד מביא/ה לי שיעורי בית."
            "כולם אמרו לי לבחור אותו/ אותה ואין ברירה"
            "אנחנו ביחד בכדורגל / מנגנים ביחד..."
            "אבחר את מי שהכי מקובל/ת בכיתה, אפילו שהוא לא חבר/ה שלי"
            "אני מרגיש/ה שגם לה / לו אכפת ממני בדיוק כפי שלי אכפת ממנה / ממנו"
      - ask: מה גיליתם שחשוב לכם במיוחד בבחירת חברים?
      - slide:
          kicker: במליאה
          title: האם לדעתכם ישנם שיקולים שרצוי להימנע מהם?
          sub: אלו? מדוע?
          verbatim: true
          echo: true
          cue: אחרי השאלון —
          alt: אגודל למעלה ואגודל למטה
          art:
            - {use: thumb-up, x: 340, y: 90, w: 200}
            - {use: thumb-down, x: 80, y: 240, w: 200}
      - say: >-
          שאלות על חברים, על לימודים ועל סדר היום — לחלקן כבר יש תשובה, ולחלקן צריך לשאול מישהו. ידע הוא כוח.

  # ------------------------------------------------------------------ 18′–27′
  - id: answers
    title: בחרי מסלול — מי עונה על השאלות?
    minutes: 9
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: מה פירוש ״ידע הוא כוח״, ומחפשים תשובות לשאלות שעל הלוח — אצל מי שיודע
    body:
      - slide:
          kicker: ידע הוא כוח
          title: ״ידע הוא כוח״ — מה זה אומר?
          sub: מקורות ידע שאנחנו סומכים עליהם מגבירים את הביטחון — ועוזרים לבחור.
          echo: true
          alt: שלושה עיגולים מימין לשמאל — ידע, ואחריו ביטחון, ודאות ורוגע, ובסוף בחירה
          art: {file: art/know.svg}
      - ask: מהי לדעתכם משמעות הביטוי ״ידע הוא כוח״?
      - tracks:
          - title: יועצת החטיבה בכיתה
            text: >-
              יועצת החטיבה עונה על השאלות מהלוח, נושא אחרי נושא. כל צוות שואל שתי שאלות, ושני מתעדים כותבים את
              התשובות.
