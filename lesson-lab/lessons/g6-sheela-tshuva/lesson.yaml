sub: >-
  המעבר לחטיבה מעורר שאלות — וזה טבעי. בשיעור הזה צופים באליס שמחפשת דרך, אוספים וממיינים את השאלות
  שלנו, בודקים מה חשוב לנו בבחירת חברים, ומחפשים תשובות — אצלנו ואצל מי שיודע.
format: סרטון, פתקיות, עבודה אישית וצוותים
question: אילו שאלות מעסיקות אותנו לקראת החטיבה — ואיפה נמצא להן תשובות?
takeaways:
  - טבעי שמעבר למקום חדש מעורר שאלות — והשאלות שלנו מעסיקות גם אחרים.
  - >-
    בבחירת חברים כדאי לשאול על איכות הקשר — הדדי, מחזק, כזה שאפשר להיות בו אני עצמי — ולא לבחור מתוך
    אי־נעימות או לפי מי שמקובל.
  - ידע הוא כוח — תשובות ממקורות שאנחנו סומכים עליהם מגבירות את הביטחון, ועוזרות לבחור טוב יותר.
prep:
  - פתקיות — כמה לכל תלמיד
  - >-
    חמשת הנושאים של ״שאלות ותהיות״ — כתובים על הלוח לפני השיעור, כל נושא בראש טור משלו, עם מקום לפתקיות
    מתחתיו
  - בררי איך משבצים לכיתות בחטיבה שאליה עוברים — האם אפשר לבחור חברים, ולמי זה לא חל

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי ליועצת בית הספר מתי השיעור ועל מה — חששות מהמעבר לחטיבה ובחירת חברים. שאלי מי בכיתה צפוי
      להתקשות במעבר: מי שאין לו חבר קרוב, מי שעובר לחטיבה אחרת מרוב הכיתה, מי שמתמיין לכיתה ייחודית או
      מי שהמעבר כבר מדאיג אותו מאוד. בקשי שתהיה זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      בחירת חברים נוגעת במקובלות — במי שחושש שלא יבחרו בו, או שיישאר לבד. השאלון אישי: לא שואלים ״את
      מי תבחרו״, לא מזכירים שמות, ולא מקריאים מהלוח שאלה שמזהה את מי שכתב אותה.
  - head: לא לוחצים לשתף
    text: >-
      הפתקיות בלי שם; השאלון ועוגת הביטחון אישיים, ואת השאלון לא אוספים. משתפים רק מתנדבים, ורק מה שהם
      בוחרים. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל חבר שהתרחק, חרם או פחד גדול מהמעבר — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי השיעור.
      מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״התבנית שלנו לתהליך
    בחירה״; פחות — ישר ל״חשוב לזכור״. במסלול ״יועצת החטיבה בכיתה״ — את זמן ההרחבות נותנים לעוד שאלות
    ליועצת.
  short:
    steps: [questions, friends]
    text: >-
      את השאלות כותבים ותולים בלי להקריא מכל טור, ובשאלון שומעים רק את השאלה על שיקולים שכדאי להימנע מהם

brain_break:
  signs: ישיבה ארוכה, רעש שעולה, ידיים ששוחקות בפתקיות.
  ideas:
    - name: סופרים עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר את המספר הבא, בלי סדר ובלי סימנים. שניים מדברים
        יחד? מתחילים מאחת.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
  from: choice

