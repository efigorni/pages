steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: alice
    title: באיזו דרך לבחור?
    minutes: 5
    practices:
      - מה הקשר?
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      צופים באליס שמבקשת מהחתול עזרה בבחירת דרך; מה זה מזכיר לנו לקראת החטיבה — ושאלות הן חלק טבעי מכל
      מעבר
    body:
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי, ושמעי שתיים־שלוש תשובות מהירות.
          - הקריני את הסרטון, ועצרי ברגע שבו אליס שואלת את החתול — לפני שהוא עונה.
          - אחרי הסרטון — שאלי את שתי השאלות שעל השקף, ושמעי כמה תשובות לכל אחת.
      - video:
          title: באיזו דרך לבחור? — מתוך אליס בארץ הפלאות (דיסני, 1951)
          url: https://www.youtube.com/watch?v=pt9ND-wZ4W0
          length: "1:37"
          before: כשאתם צריכים לבחור דרך ולא בטוחים לאן — ממי תבקשו עזרה?
          watch: שימו לב מה אליס מרגישה, ואיזו עצה החתול נותן לה.
          pauses:
            - at: "?"
              moment: >-
                הרגע שבו אליס שואלת את החתול באיזו דרך ללכת, לפני שהוא עונה. צפי בסרטון לפני השיעור, ורשמי כאן
                את הזמן.
              ask: מה החתול יענה לה? לחשו לשכן ניחוש אחד.
          alt: עמוד עם שלטי כיוון, ודמות חושבת לידו
          art:
            - {use: signpost, x: 360, y: 120, w: 230}
            - {use: kid-stand, x: 60, y: 230, w: 120, color: purple}
            - {use: thought, x: 150, y: 40, w: 170, flip: true}
            - text: '?'
              x: 238
              y: 104
              size: 64
      - slide:
          kicker: אחרי הצפייה
          title: מה אתם חושבים על העצה של החתול? האם עזר לה?
          sub: כיצד הסרטון מתקשר למעבר לחטיבה?
          verbatim: true
          echo: true
          cue: כשהסרטון נגמר —
          alt: עמוד עם שלטי כיוון, ובית ספר בסוף הדרך
          art:
            - {use: signpost, x: 360, y: 150, w: 220}
            - {use: school, x: 50, y: 250, w: 280}
      - say: >-
          לאליס היו שאלות בנוגע לדרך שעליה לבחור. גם הדרך לחטיבה מעוררת, באופן טבעי, שאלות בנושאים שונים —
          ותשובות עליהן יעזרו לנו להחליט.

  # ------------------------------------------------------------------ 5′–12′
  - id: questions
    title: שאלות ותהיות
    minutes: 7
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      כל אחד כותב את השאלות שלו על פתקיות ותולה אותן על הלוח, בטור של הנושא; מגלים שהשאלות שלנו מעסיקות
      גם אחרים
    body:
      - slide:
          kicker: שאלות ותהיות · לבד
          title: השאלות שלי לקראת המעבר לחטיבה
          sub: כל שאלה על פתקית נפרדת — ותולים אותה על הלוח, בטור של הנושא שלה.
          verbatim: [title]
          echo: true
          timer: 120
          alt: לוח, ועליו שלוש פתקיות עם סימני שאלה
          art:
            - {use: board, x: 102, y: 100, w: 416}
            - {use: sticky, x: 142, y: 150, w: 104}
            - {use: sticky, x: 260, y: 168, w: 104, color: teal}
            - {use: sticky, x: 376, y: 146, w: 104, color: purple}
            - text: '?'
              x: 194
