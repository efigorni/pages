      - moves:
          - חלקי פתקיות. שתי דקות — כל אחד כותב שאלה אחת או יותר, כל שאלה על פתקית נפרדת, בלי שם.
          - >-
            כל אחד תולה את הפתקיות שלו על הלוח, בטור של הנושא שמתאים להן. שאלה שלא מתאימה לשום טור — לטור
            ״שונות״.
          - עמדי ליד הלוח והקריאי שתיים־שלוש שאלות מכל טור. שאלי באיזה טור יש הכי הרבה פתקיות.
      - board:
          - סדרים ונהלים — שעות, הגעה, מספר ילדים בכיתה
          - למידה — תכניות ייחודיות, מגמות, הקבצות, דרכי לימוד
          - חברים — כמה חברים אפשר לבחור? כמה מבטיחים לי?
          - תכנון והתארגנות — יום גיבוש, מבחני מעבר, חלוקה לכיתות, ציוד
          - שונות — שאלות בנושאים נוספים
      - ladder:
