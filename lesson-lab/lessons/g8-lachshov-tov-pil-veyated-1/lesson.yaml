sensitivity: med

sub: >-
  בכל יום חולפות בראש שלנו המון מחשבות, וחלקן נשמעות כמו עובדות. בשיעור הזה לוכדים מחשבות,
  שומעים את משל הפיל והיתד, ומזהים את ה״יתדות״ שלנו.
format: כתיבה אישית, זוגות ומליאה
question: מתי מחשבה תוקעת אותנו — ואיך מזהים שהיא לא עובדה?
takeaways:
  - מחשבה אינה עובדה — גם כשהיא נשמעת בטוחה לגמרי.
  - מחשבה מכשילה משנה את מצב הרוח לרעה, ויכולה לעצור אותנו מלנסות — כמו היתד של הפיל.
  - כשמזהים את ה״יתדות״ שלנו, אפשר לשים לב איך הן גורמות לנו להרגיש ולהתנהג.
prep:
  - פתק קטן לכל תלמיד, לכתיבת ה״יתדות״
  - קופסה או שקית לפתקים מקופלים (להרחבה ״יתדות מהקופסה״)

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — מחשבות מכשילות, וה״יתדות״ שכל אחד כותב לעצמו על פתק. שאלי אם יש בכיתה מי
      שמחשבות כמו ״אין לי אף חבר בכיתה״ או ״אין בכלל מקום בטוח בעולם״ קרובות אליו מדי עכשיו — בדידות,
      משבר בבית, חרדה או אובדן. בקשי שתהיה זמינה אחרי השיעור, וסכמי איתה מה עושים עם פתק מהקופסה שנשמע
      כמו מצוקה.
  - head: מי עלול להיפגע
    text: >-
      שבע המחשבות שעל המסך עוברות בראש של כולנו — מדברים עליהן כעל מחשבות, ולא שואלים מי חושב כך. מי שבאמת
      בודד, או מפחד, עלול לשמוע ״מחשבה אינה עובדה״ כביטול של מה שהוא מרגיש. אמרי בפשטות שההרגשה אמיתית;
      מה שבודקים הוא רק אם ״תמיד״ ו״אף פעם״ הם כל האמת.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של המקור: ״הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי״. ברשת
      ובפתקים כותבים לעצמנו, ובמליאה משתפים רק מתנדבים — ורק מה שהם בוחרים. בקופסה אין שמות, ואת מקריאה
      רק פתק שאין בו פרט מזהה. מותר לוותר, ולא קוראים בשם למי שלא הצביע.
  - head: אם מישהו משתף פגיעה
    text: >-
      יתד כמו ״כולם נגדי״ או ״אין מקום בטוח״ שנשמעת כמו מצוקה של עכשיו — בקול או בפתק — עוצרים בעדינות,
      מודים, וממשיכים בשיחה אישית אחרי השיעור. פתק כזה מהקופסה לא מקריאים, ומעבירים ליועצת. מעדכנים
      את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
