steps:
  # ------------------------------------------------------------------ 0′–4′
  - id: net
    title: רשת ללכידת מחשבות
    minutes: 4
    practices:
      - מה הקשר?
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: הדמיה קצרה של רשת שלוכדת מחשבות, כתיבה לעצמנו — ושומעים איזה סוג מחשבות נלכדו
    body:
      - slide:
          kicker: מה הקשר? · רשת ללכידת מחשבות
          title: אילו מחשבות לכדתם ברשת?
          sub: נעימות, מועילות, מבלבלות — ואיך הן משפיעות על מצב הרוח?
          echo: true
          alt: רשת לפרפרים שלכדה ענן מחשבה עם לב, וענן מחשבה עם ענן גשם עף לידה
          art: {file: art/net.svg}
      - moves:
          - בקשי מכולם להניח את העטים ולשבת בנוח. הקריאי את ההדמיה לאט, ועצרי כמה שניות אחרי כל משפט.
          - >-
            אחרי ההדמיה — דקה של כתיבה בשקט: כל אחד רושם לעצמו שתיים־שלוש מחשבות שלכד, ומסמן ליד כל אחת
            אם היא נעימה, לא נעימה או מבלבלת.
          - שאלי על סוג המחשבות, לא על התוכן שלהן. מי שרוצה מספר — רק מה שהוא בוחר.
      - quote:
          title: ההדמיה מהמקור — להקריא לאט
          text: |-
            קחו לכם נשימה עמוקה ושימו לב למה שקורה כרגע בראשכם...
            שימו לב למחשבות שחולפות בכם ברגע זה.
            דמיינו שיש לכם רשת ללכידת פרפרים.
            נסו ללכוד את המחשבות שלכם ברשת.
            שימו לב לסוג המחשבות שהצלחתם ללכוד –
            האם אלה מחשבות נעימות, מועילות,
            האם אלה מחשבות מבלבלות או אחרות...
            שימו לב – כיצד משפיעות המחשבות על מצב הרוח שלכם?
      - ladder:
          help: חשבו על הרגע שלפני השיעור — מה עבר לכם בראש?
          challenge: איזו מחשבה מהרשת השפיעה הכי חזק על מצב הרוח שלכם — ולמה דווקא היא?
      - ask: איזה סוג מחשבות לכדתם יותר — נעימות, לא נעימות או מבלבלות? ואיך הן השפיעו על מצב הרוח?
      - say: >-
          בכל יום חולפות בראש שלנו המון מחשבות, כל כך מהר שלא תמיד נשים לב אליהן. חלקן גורמות לנו
          להרגיש טוב, וחלקן משנות את מצב הרוח שלנו לרעה. בהן נעסוק היום.

  # ------------------------------------------------------------------ 4′–10′
  - id: fact
    title: מחשבה = עובדה?
    minutes: 6
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: מה היא מחשבה מכשילה; שבע מחשבות שנשמעות כמו עובדות — ובזוגות, מה משותף להן
    body:
      - slide:
          kicker: מחשבות מכשילות
          title: מחשבות מכשילות
          sub: מחשבות שמופיעות לנו בראש ומשנות את מצב הרוח שלנו לרעה.
          verbatim: true
          echo: true
          alt: דמות, ומעליה ענן מחשבה ובתוכו ענן גשם
          art:
            - {use: thought, x: 150, y: 24, w: 300}
            - {use: rain-cloud, x: 228, y: 44, w: 128}
            - {use: kid-stand, x: 420, y: 250, w: 130, color: teal}
      - moves:
          - הציגי את ההגדרה, ושאלי מי זיהה פעם מחשבה כזאת — הרמת יד בעיניים עצומות, בלי לפרט.
          - >-
            עברי לשקף ״מחשבה = עובדה?״ וחשפי את המחשבות אחת־אחת. הקריאי כל אחת בטון בטוח, כמו שמקריאים
            עובדה.
          - חושבים לבד עשרים שניות, דקה עם השכן, ושלושה זוגות במליאה.
          - >-
            סכמי מתוך הערות המקור: המחשבות האלה ״משכנעות״ אותנו שהן עובדות, אבל בעצם הן מבטאות את מה שאנחנו
            מרגישים באותו רגע, חזק מאוד — והן לא בהכרח נכונות.
      - slide:
          kicker: חושבים · בזוגות · משתפים
          title: מחשבה = עובדה?
          points:
            - אף פעם לא יסמכו עלי פה, לא משנה מה אני אעשה!
            - אני בטוח אכשל במבחן
            - אני לא מצליח בכלום ואף פעם גם לא אצליח
            - ההורים שלי אף פעם לא מבינים אותי
          verbatim: true
          echo: true
          cue: אחרי ההגדרה —
          alt: ענן מחשבה גדול עם סימן קריאה, וזכוכית מגדלת שבודקת אותו
          art:
            - {use: thought, x: 230, y: 30, w: 320}
            - text: '!'
              x: 393
              y: 156
              size: 130
            - {use: magnifier, x: 40, y: 300, w: 200, color: teal}
      - slide:
          kicker: מחשבה = עובדה? · עוד שלוש
          title: מחשבה = עובדה?
          points:
            - אין לי אף חבר בכיתה
            - אין בכלל מקום בטוח בעולם
            - תמיד מאשימים אותי!
          verbatim: true
          echo: true
          cue: אחרי ארבע המחשבות הראשונות —
          alt: ענן מחשבה עם סימן קריאה, ודמות עומדת מתחתיו
          art:
            - {use: thought, x: 70, y: 30, w: 320}
            - text: '!'
              x: 233
              y: 156
              size: 130
            - {use: kid-stand, x: 400, y: 250, w: 130, color: teal}
      - ask: מה משותף לכל המחשבות האלה? והן באמת עובדות?
      - ladder:
          help: חפשו מילים שחוזרות — ״תמיד״, ״אף פעם״, ״בטוח״, ״בכלום״.
          challenge: בחרו מחשבה אחת — מה בה אולי קרה באמת, ומה בה הרגשה של הרגע?
      - say: >-
          המחשבות האלה נשמעות בטוחות לגמרי, אבל הן מספרות בעיקר מה אנחנו מרגישים ברגע הזה. ולפעמים,
          כשמתייחסים אליהן כעובדות, הן גם עוצרות אותנו מלעשות משהו שיכול לקדם אותנו. מכירים את משל הפיל
          והיתד?

  # ------------------------------------------------------------------ 10′–16′
  - id: parable
    title: משל הפיל והיתד
    minutes: 6
    practices:
      - זמן חשיבה
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
    summary: >-
      המשל בשלושה חלקים — מהמצגת המקורית, או במילים שלך; אחרי החלק הראשון עוצרים — למה הפיל לא בורח? — וכל אחד
      לוחש ניחוש
    body:
      - slide:
          kicker: משל · מקשיבים
          title: משל הפיל והיתד
          sub: הקשיבו — ונסו לפתור את התעלומה.
          verbatim:
            - title
          alt: פיל גדול ואפור קשור בשרשרת ליתד עץ קטנה
          art: {file: art/cover.svg}
      - moves:
          - >-
            הקריאי את חלק א׳ מהמצגת המקורית — או ספרי אותו במילים שלך, לפי התקציר. עצרי בשאלה ״למה הפיל לא בורח?״.
          - עשר שניות של שקט, ואז כל אחד לוחש לשכן ניחוש אחד. שמעי שניים־שלושה ניחושים — בלי לאשר ובלי לפסול.
          - >-
            הקריאי את ההמשך ואת התשובה (או ספרי אותם). במשפט ״כי הוא מאמין שהוא לא יכול״ — השקף האחרון, ורגע של
            שקט.
      - say: עכשיו משל. הקשיבו טוב — בסוף החלק הראשון יש תעלומה, ואתם תנסו לפתור אותה.
      - source_slide:
          slides: 15
          why: >-
            חלק א׳ של המשל ״הפיל והיתד״ של חורחה בוקאי — פרוזה מוגנת בזכויות יוצרים, ולכן הנוסח המלא מוצג רק מהמצגת
            המקורית, ולא מועתק כאן.
          alt: מעבר למצגת המקורית — חלק א׳ של המשל
      - p: >-
          **אם את מספרת במילים שלך — חלק א׳:** אדם נזכר שכילד אהב מאוד את הקרקס, ויותר מכול את הפיל — חיה ענקית,
          כבדה וחזקה להפליא. בהפסקות בין ההופעות הפיל עמד קשור בשרשרת ליתד עץ קטנה, שרק קצה שלה נעוץ באדמה. לילד היה
          ברור שפיל כזה יכול לתלוש את היתד בתנועה אחת ולברוח — ובכל זאת הוא לא זז. מה מחזיק אותו שם?
      - slide:
          kicker: עוצרים · ניחוש לשכן
          title: למה הפיל לא בורח?
          sub: חשבו לבד עשר שניות — ולחשו לשכן ניחוש אחד.
          verbatim:
            - title
          echo: true
          cue: בסוף חלק א׳ —
          alt: ילד מסתכל על פיל שקשור ליתד קטנה, ובבועת הדיבור שלו סימן שאלה
          art: {file: art/why.svg}
      - ask: למה הפיל לא בורח? ניחוש אחד, בלחישה לשכן.
      - ladder:
          help: השוו — כמה חזק הפיל, וכמה חזקה היתד?
          challenge: אם השרשרת לא באמת מחזיקה אותו — מה כן מחזיק אותו?
      - source_slide:
          slides:
            - 16
            - 17
          why: >-
            ההמשך והתשובה של המשל — בנוסח המלא, מהמצגת המקורית (פרוזה מוגנת בזכויות יוצרים).
          alt: מעבר למצגת המקורית — ההמשך והתשובה של המשל
      - p: >-
          **אם את מספרת במילים שלך — ההמשך:** הילד שאל את המבוגרים סביבו, ואמרו לו שהפיל מאולף. אבל אם הוא מאולף,
          למה קושרים אותו? תשובה של ממש הוא לא קיבל, ועם השנים שכח את השאלה. שנים אחר כך שמע את התשובה: הפיל קשור
          ליתד כזאת מאז שהיה פילון קטן. אז, כשהיה חלש, הוא משך ודחף בכל כוחו, יום אחרי יום — והיתד לא זזה. עד שיום
          אחד הפסיק לנסות. ומאז, גם כשגדל והתחזק, הוא לא בודק שוב את כוחו.
      - slide:
          kicker: המשל · התשובה
          title: הוא מאמין שהוא לא יכול
          sub: והוא אף פעם לא ניסה לבחון את כוחו מחדש.
          verbatim: true
          echo: true
          cue: בסוף המשל —
          alt: פיל קטן מושך בכל כוחו את השרשרת, והיתד הקטנה מחזיקה אותו
          art: {file: art/baby.svg}

  # ------------------------------------------------------------------ 16′–21′
  - id: talk
    title: מה עולה בכם?
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: דיון במליאה על המשל ועל החיים שלנו — ומחשבה מכשילה כמו יתד שתוקעת
    body:
      - slide:
          kicker: אחרי המשל
          title: מה עולה בכם בעקבות המשל?
          sub: איך זה קשור לחיים שלכם?
          verbatim: true
          echo: true
          alt: שלוש דמויות יחד, ומעליהן שתי בועות צ׳אט
          art:
            - {use: group3, x: 100, y: 270, w: 320}
            - {use: chat, x: 340, y: 30, w: 240}
      - moves:
