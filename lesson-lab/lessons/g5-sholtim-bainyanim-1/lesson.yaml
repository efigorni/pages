steps:
- id: part-1
  title: שלט עם כוחות
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: שלט עם כוחות — איזה כפתור הייתם מוסיפים לשלט דמיוני?
  body:
  - slide:
      title: איזה כפתור הייתם מוסיפים לשלט דמיוני?
      art:
      - use: traffic-light
        x: 180
        y: 120
        w: 180
      alt: רמזור
      echo: true
  - moves:
    - תני דקה לדמיון ושתיים לכתיבה או ציור.
    - אספי שני כפתורים שמסייעים לעצור ולבחור, ולא לשלוט באחרים.
    - אפשר לחשוב על משחק לא דיגיטלי.
  - ask: איזה כפתור הייתם מוסיפים לשלט דמיוני?
  - ladder:
      help: מה יעזור לעצור רגע לפני תגובה?
      challenge: מה שלט דמיוני לעולם לא יכול לעשות במקום אדם אחר?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: מכירים את הכפתורים
  minutes: 7
  practices:
  - מהלכי שיח
  - זמן חשיבה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מכירים את הכפתורים — מה יכולים עצור, בטל וסרוק להזכיר לנו?
  body:
  - slide:
      title: מה יכולים עצור, בטל וסרוק להזכיר לנו?
      art:
      - use: signpost
        x: 180
        y: 120
        w: 250
      alt: שלטי כיוון
      echo: true
  - source_slide:
      slides:
      - 12
      why: מציגים את התוכן המקורי המתואר בפעילות וקוראים רק את החלק הדרוש לתרגול.
      art:
      - use: signpost
        x: 180
        y: 120
        w: 250
      alt: שלטי כיוון
  - moves:
    - הציגי את הכפתורים במקור.
    - עצור מזכיר לקחת רגע; בטל מזכיר לתקן פעולה, אך אינו מוחק פגיעה; קדימה ואחורה מזכירים השלכות וניסיון.
    - סרוק הוא דימוי להשערה ולבירור רגשות, לא קריאת מחשבות.
    - הגבר והחלש עוזרים לבחור לאיזה קול להקשיב.
  - ask: מה יכולים עצור, בטל וסרוק להזכיר לנו?
  - ladder:
      help: איזה כפתור יעזור לשמוע קול שקט בקבוצה?
      challenge: מה נשאר באחריותנו גם אחרי שמתנצלים?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: עומר מול הקבוצה
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: עומר מול הקבוצה — איך עומר יכול להשתייך בלי להצטרף לפגיעה?
  body:
  - slide:
      title: איך עומר יכול להשתייך בלי להצטרף לפגיעה?
      art:
      - use: phone-notify
        x: 180
        y: 120
        w: 250
      alt: טלפון עם התראה
      echo: true
      sub: ''
  - moves:
    - 'ספרי: עומר מוזמן לטורניר אצל אדם.'
    - בקבוצת ההודעות צוחקים על גופו של רון, תלמיד חדש, ומחכים שעומר יגיב.
    - 'חלקי רביעיות לשני סוגי משימות: כפתורי זמן בודקים מה יקרה ומה ניתן לשנות; כפתורי קולות משערים רגשות
      ובוחרים איזה קול לחזק.'
    - כל קבוצה כותבת תגובה אחת בטוחה לעומר.
  - ask: איך עומר יכול להשתייך בלי להצטרף לפגיעה?
  - task:
      what: 'קבוצת הזמן: בדקו השלכות ותיקון אפשרי. קבוצת הקולות: הציעו רגשות וקול לחיזוק. כל קבוצה כותבת
        תגובה בטוחה אחת לעומר.'
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה יוכל לומר שלא מוסיף עלבון לרון?
      challenge: איך יגיב אם הקבוצה תלחץ עליו שוב?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - tip: אין ליצור, לחפש או להציג תמונה פוגענית. מדברים על תיאור כללי בלבד.
- id: part-4
  title: עומר מקליד
  minutes: 7
  practices:
  - מהלכי שיח
  - זמן חשיבה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: עומר מקליד — אילו כפתורים עזרו לשנות כיוון?
  body:
  - slide:
      title: אילו כפתורים עזרו לשנות כיוון?
      art:
      - use: chat
        x: 180
        y: 120
        w: 250
      alt: בועות שיחה
      echo: true
  - moves:
    - 'ספרי את פתרון המקור: עומר עוצר ומציע סטיקר אחר, משותף ולא פוגעני, על רגע מצחיק מההפסקה.'
    - הזמיני את שתי קבוצות הכפתורים לנתח את התגובה ולשפר אותה.
    - הדגישי שפנייה למבוגר ותמיכה ברון עשויות להיות נחוצות גם אחרי שינוי הנושא.
  - ask: אילו כפתורים עזרו לשנות כיוון?
  - ladder:
      help: איזה קול פנימי של עומר התחזק?
      challenge: האם שינוי נושא מספיק אם הפגיעה חוזרת?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - tip: הכלי מסייע לבחירה ולהקשבה, אך אינו מבטיח שליטה באחרים או פתרון. האחריות לפגיעה היא של הפוגע;
      כשיש פגיעה או חשש פונים למבוגר.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - ילדים בגילכם פוגשים הרבה מצבים בהם צריך לקבל החלטות.
      - השליטה והפיקוד תמיד בידיים שלכם.
      - בכל רגע אתם יכולים לבחור כיצד לפעול.
      - 'כדי לקבל החלטה נכונה במצבים שונים, תוכלו להשתמש ב''שלט הפיקוד הפנימי'' שלכם: לעצור לחשוב, לשקול
        מה עלול לקרות, להקשיב לקול הפנימי ולקולות אחרים.'
      - כולנו רוצים להיות שייכים ואהובים. נבחר להיות שייכים בדרך שלא תפגע באחר!
      - המראה החיצוני הוא רק חלק קטן ממה שמרכיב אותנו.
      - לכל אחד יש תכונות, כישרונות ואופי שהופכים אותו למיוחד. כולנו שונים ולכולם מגיע להיות אהובים ושייכים!
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - בחרו כפתור וכתבו איך יעזור לפני שליחת הודעה.
      - למי תפנו כשפגיעה נמשכת?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: פגיעה במראה הגוף ולחץ בקבוצות הודעות. הילד שנפגע אינו אשם; אין להציג תוצרים פוגעניים.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; מוקד 105 — המטה הלאומי להגנה על ילדים
    ונוער ברשת, 24/7'
