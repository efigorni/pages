sub: >-
  שיעור בנפרד לבנים: ההתבגרות המינית מארבע נקודות מבט — גוף, רגש, חברה וערכים — עם סרטונים קצרים, שיחה
  בקבוצות ומקום לשאול.
format: מליאה, סרטונים וקבוצות
question: מה קורה לנו בגיל ההתבגרות — בגוף, ברגש ובחברה — ולמי פונים כשמשהו מדאיג?
takeaways:
  - התבגרות מינית היא חלק מהמעבר מילדות לבגרות, והיא קורית בגוף, ברגש ובחברה.
  - כל אחד מתפתח בקצב שלו, וכל קצב התפתחות הוא נורמלי.
  - כשמשהו מדאיג, לא נשארים לבד — יש למי לפנות.
prep:
  - חדר נפרד ומורה לשיעור המקביל של הבנות (״בנות״), באותה שעה
  - חלוקה לקבוצות של 4–5 לפי השולחנות, ומספר שאלה (1–3) לכל קבוצה

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור — הוא מתקיים בנפרד לבנים ולבנות, ובאותה שעה מעבירים לבנות את השיעור המקביל. שאלי מי
      בכיתה שהנושא קרוב אליו מדי: מי שהתפתח מוקדם או מאוחר ושומע על זה הערות, מי שהגוף או המראה מטרידים אותו,
      מי שעבר פגיעה, ומי שהחלוקה לבנים ולבנות לא פשוטה בשבילו — איתו מחליטים מראש, עם היועצת, לאיזו קבוצה הוא
      מצטרף. בקשי שתהיה זמינה אחרי השיעור, וסכמי איתה, או עם אחות בית הספר, מי עונה על שאלות שלא ידעת לענות
      עליהן.
  - head: מי עלול להיפגע
    text: >-
      בכיתה ז׳ ההבדלים בקצב ההתפתחות גדולים: מי שמתפתח מאוחר נתפס לפעמים כ״קטן״, ומי שמתפתח מוקדם זוכה
      לפופולריות — ושניהם עלולים להרגיש חשופים. לא משווים ולא מצביעים על אף אחד — ״הנה גיא נראה בכיתה ט׳ ודני
      נראה בכיתה ג׳״ הוא בדיוק מה שהמקור מבקש למנוע — ומדברים על ״בנים בגילכם״, לא על מי שבחדר. ״נראה אותך
      גבר״, או לעג על קול, גובה או גוף — עוצרים מיד.
  - head: לא לוחצים לשתף
    text: >-
      שלושת הכללים של היום על השקף הראשון: פרטיות (לא חושפים מידע פרטי על אחרים, למשל על אוננות של חבר), בלי
      השוואות, ומילים של מבוגרים. אף אחד לא נשאל על הגוף שלו. משתפים רק מתנדבים; מותר לוותר, ולא קוראים בשם למי
      שלא הצביע. מבוכה וצחוק צפויים — תני להם שם והמשיכי.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל נגיעה לא רצויה, לעג קבוע על הגוף, או דאגה שהוא נשאר איתה לבד — עוצרים בעדינות, מודים, וממשיכים
      בשיחה אישית אחרי השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. מחוץ לבית הספר, בכל
      שעה: ער״ן 1201 — עזרה ראשונה נפשית; ובפגיעה מינית — קווי הסיוע 1203 (עונים גברים) ו־1202 (עונות נשים). כל
      הקווים זמינים 24/7.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״ערכים״; פחות — ישר
    ל״חשוב לזכור״.
  short:
    steps: [body, society]
    text: בגוף מדלגים על הניחושים ועוברים ישר לסרטון, ובחברה מציג רק ראש קבוצה אחד לכל שאלה

brain_break:
  signs: מבוכה שהופכת לצחוק בלי סוף, ראשים על השולחן, שקט שלא נשבר.
  ideas:
    - name: סופרים עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים — בכל פעם מישהו אחר אומר מספר אחד, בלי סדר ובלי סימנים. שניים אומרים יחד?
        מתחילים מאחת.
    - name: קצב בכפיים
      text: את מוחאת קצב קצר, והכיתה חוזרת עליו. בכל סבב הקצב קצת יותר מסובך.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
  from: clip

