steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: על מה נדבר היום?
    minutes: 5
    practices:
      - מה הקשר?
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: שלושה כללים לשיחה, ״מה זו התבגרות מינית?״ לפני ההגדרה, וארבע נקודות המבט של השיעור
    body:
      - slide:
          kicker: לפני שמתחילים
          title: שלושה כללים לשיחה של היום
          points:
            - פרטיות — מדברים על הנושא, לא על אף אחד מאיתנו
            - בלי השוואות — לכל אחד הקצב שלו
            - מילים של מבוגרים — כמו בשיחה עם ההורים
          echo: true
          alt: מגן גדול, ומנעול לידו
          art:
            - {use: shield, x: 220, y: 110, w: 250}
            - {use: lock, x: 60, y: 320, w: 130}
      - moves:
          - הקריאי את שלושת הכללים, ואמרי שמבוכה היא חלק מהשיעור — גם מבוגרים מרגישים אותה.
          - שאלי מה זו התבגרות מינית, תני עשר שניות של שקט, ושמעי שתיים־שלוש תשובות — בלי לתקן.
          - >-
            רק אז הציגי את ההגדרה והקריאי אותה. הצביעי על המשפט האחרון — זו התשובה לשאלה ״למה מתרחשים
            השינויים?״.
          - הציגי את ארבע נקודות המבט — זו מפת השיעור.
      - say: >-
          השיעור הזה מתקיים בנפרד לבנים ולבנות, כדי שתרגישו נוח לשאול. נדבר על מה שקורה בגוף, על הרגשות — וגם על
          המבוכה, שיכולה להופיע כאן בשיעור. זה בסדר.
      - slide:
          kicker: רגע לחשוב
          title: מה זו התבגרות מינית?
          echo: true
          cue: אחרי הכללים —
          alt: דמות, ומעליה ענן מחשבה עם סימן שאלה
          art:
            - {use: thought, x: 60, y: 30, w: 320}
            - text: '?'
              x: 223
              y: 158
              size: 96
            - {use: kid-stand, x: 400, y: 210, w: 150, color: teal}
      - ask: מה זו לדעתכם התבגרות מינית? מילה או משפט — מי מוכן?
      - slide:
          kicker: התבגרות מינית
          title: תקופת מעבר בין ילדות לבגרות
          sub: השינויים בגוף — מגוף של ילד לגוף של נער, ואחר כך לגוף של גבר.
          cue: אחרי שתיים־שלוש תשובות —
          alt: דמות קטנה, חץ, ואותה דמות גבוהה יותר
          art:
            - {use: kid-stand, x: 470, y: 320, w: 90, color: teal}
            - {use: arrow, x: 290, y: 380, w: 150, color: gray}
            - {use: kid-stand, x: 80, y: 180, w: 160, color: teal}
      - quote:
          title: ההגדרה מהמקור — להקריא
          text: >-
            גיל ההתבגרות הוא תקופת מעבר בין ילדות לבגרות. כחלק מהמעבר הזה מתרחשת התבגרות מינית. אלו השינויים
            הגופניים המתרחשים בגיל ההתבגרות כאשר גופך משתנה מגוף של ילד לגוף של נער, ואחר כך לגוף של גבר. השינויים
            והתהליכים הביולוגיים והפיסיים המתרחשים בין ילדות לבגרות מכינים את הגוף שלך להתרבות בעתיד.
      - slide:
          kicker: מפת השיעור
          title: ארבע נקודות מבט
          points:
            - גוף — מה משתנה, ומה עוד ישתנה?
            - רגש — מה אנחנו מרגישים?
            - חברה — מה אומרים לנו, ואיך זה משפיע?
            - ערכים — מה מוביל אותנו?
          echo: true
          cue: אחרי ההגדרה —
          alt: יהלום עם ארבע פאות — גוף, רגש, חברה, ערכים
          art: {file: art/diamond.svg}
      - say: כל הנקודות האלה קשורות זו לזו. נתחיל בגוף.

  # ------------------------------------------------------------------ 5′–12′
  - id: body
    title: גוף — מה בעצם קורה?
    minutes: 7
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
    summary: ארבע שאלות ששאלו בני גילם — ניחוש בשקט ובלחישה, וסרטון שעונה עליהן
    body:
      - slide:
          kicker: גוף · שאלות ששאלו בני גילכם
          title: מה התשובות?
          points:
            - אלו שינויים מתרחשים בגוף?
            - האם כולם עוברים את השינויים באותו זמן?
            - איך בכלל יודעים שמתחילה ההתבגרות המינית?
            - כמה זמן נמשכת תקופת ההתבגרות המינית?
          verbatim:
            - points
          echo: true
          alt: דמות מרימה יד, ומעליה בועת דיבור עם סימן שאלה
          art:
            - {use: speech, x: 100, y: 40, w: 240}
            - text: '?'
              x: 220
              y: 119
              size: 90
            - {use: kid-hand, x: 340, y: 200, w: 150}
      - moves:
          - הציגי את השאלות. כל אחד בוחר שאלה אחת ומנחש את התשובה בשקט — עשרים שניות.
          - לחישה לשכן — מה כל אחד ניחש. ואז שמעי שתיים־שלוש השערות, בלי לתקן; התשובות בסרטון.
          - הפעילי את הסרטון, ועצרי בנקודת העצירה. אחרי השאלה — ממשיכים עד הסוף.
          - >-
            אחרי הצפייה — שאלי מה התחדש, ותני מקום לשאלות. מה שאת לא יודעת: ״אבדוק ואחזור אליך״, והעבירי
            ליועצת או לאחות בית הספר.
      - ladder:
          help: בחרו שאלה אחת, ונחשו את התשובה במילה או שתיים.
          challenge: איזו מהתשובות לדעתכם שונה מנער לנער — ולמה?
      - video:
          title: התבגרות מינית
          url: https://www.youtube.com/watch?v=EQ4YUZlJPVI
          length: "2:58"
          before: מה מהניחושים שלכם יתברר כנכון?
          watch: שימו לב לתשובות לארבע השאלות — מה דומה למה שניחשתם, ומה חדש לכם.
          pauses:
            - at: "?"
              moment: >-
                בערך באמצע הסרטון, אחרי שהוא עונה על אחת מארבע השאלות שבשקף. צפי בו לפני השיעור, בחרי את הרגע
                ורשמי כאן את הזמן.
              ask: איזו שאלה כבר קיבלה תשובה? בלחישה לשכן.
          alt: מחשב נייד, ודמות יושבת מולו
          art:
            - {use: laptop, x: 60, y: 180, w: 300}
            - {use: kid-sit, x: 400, y: 230, w: 170, color: teal, flip: true}
      - ask: >-
          האם משהו התחדש לכם בעקבות הצפייה? יש משהו שאתם רוצים לשאול או להגיד? ומהגוף — לרגש: מה מרגישים עם
          כל השינויים האלה?

  # ------------------------------------------------------------------ 12′–19′
  - id: feelings
    title: רגש — מה מרגישים?
    minutes: 7
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: ארבע שאלות על הרגשות שהשינויים מעוררים, וסרטון של מתבגרים — לאיזו אמירה התחברתם?
    body:
      - slide:
          kicker: רגש · בעקבות השינויים
          title: מה אנו מרגישים?
          points:
            - איך מרגישים כשהגוף מתחיל להשתנות?
            - איך מרגישים בנים כשההתפתחות לא באותו קצב עם כולם?
            - ממה חוששים בנים?
            - אלו שינויים גופניים משמחים ומרגשים בנים?
          verbatim: true
          echo: true
          alt: פנים שמחות, ולידן פנים עצובות
          art:
            - {use: face-happy, x: 330, y: 120, w: 220}
            - {use: face-sad, x: 80, y: 260, w: 170}
      - moves:
          - חשפי את השאלות אחת־אחת. לפני כל תשובה — עשר שניות של שקט.
          - שמעי כמה תשובות לכל שאלה. הדהדי, ושאלי מי מרגיש אחרת — יכולה להיות שונות, וזה בסדר.
          - >-
            בשאלה על הקצב התעכבי. אם לא עלה, הוסיפי שבגיל הזה חשוב להיות דומים לחברים, אבל כל קצב הוא טבעי וכולם
            מגיעים בסוף לאותו מקום; ושיש דאגות שקשה לדבר עליהן (המקור מביא כדוגמה חוסר סימטריה בהתפתחות
            האשכים) — כדאי לדעת למי פונים: מבוגר שסומכים עליו, או מי שמבין במקצוע, ולא רק חבר.
          - הפעילי את הסרטון ועצרי בנקודת העצירה. אחרי הצפייה — שאלי לאיזו אמירה התחברו.
          - >-
            בסוף — שאלי למה היה חשוב לדבר גם על רגשות. אם לא עלה: ״כדי לדעת שאתם לא לבד, שכל התחושות נורמליות,
            ושכל קצב התפתחות הוא טבעי״.
      - video:
          title: המתבגרים — שינויים, חלק א׳
          url: https://youtu.be/rCV0pxlsEPA
          length: "1:37"
          before: מה לדעתכם מרגישים מתבגרים כשהגוף משתנה?
          watch: שימו לב לאמירה אחת שמתאימה גם לבנים בגילכם.
          pauses:
            - at: "?"
              moment: >-
                אחרי אחת האמירות הראשונות של המתבגרים על שינוי שעובר עליהם. צפי בסרטון לפני השיעור, בחרי את הרגע
                ורשמי כאן את הזמן.
              ask: איך לדעתכם מרגישים עם השינוי ששמענו עכשיו? מילה אחת, בלחישה לשכן.
          alt: שלוש דמויות, ובועת דיבור מעליהן
          art:
            - {use: group3, x: 200, y: 260, w: 340}
            - {use: speech, x: 280, y: 50, w: 200}
      - ask: לאיזו אמירה מהסרטון התחברתם במיוחד — ולמה?

  # ------------------------------------------------------------------ 19′–27′
  - id: society
    title: חברה — מה אומרים לנו?
    minutes: 8
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - עניין ורלוונטיות
    summary: בקבוצות, שאלה אחת לכל קבוצה — מה משתנה בחברה, מה מצופה מגבר, ואיך מתייחסים למי שמתפתח מוקדם או מאוחר
    body:
      - say: עכשיו נסתכל על מה שקורה סביבנו — בחברה. כל קבוצה מקבלת שאלה אחת.
      - slide:
          kicker: חברה · בקבוצות · שאלה לכל קבוצה
          title: מה אומרים לנו?
          points:
            - האם משהו משתנה מבחינה חברתית בגיל ההתבגרות? משהו שמשתנה עם העלייה לכיתה ז'?
            - מה זה אומר להיות גבר? מה מצופה מגבר בחברה שלנו?
