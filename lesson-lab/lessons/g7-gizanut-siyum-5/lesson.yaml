steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: open
    title: מה גיליתם על עצמכם?
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: כתיבה אישית קצרה — מה גיליתי על הדרך שבה אני מתייחס למי ששונה ממני; שומעים שלושה
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: מה גיליתם על עצמכם?
          sub: על הדרך שבה אתם מתייחסים לאנשים ששונים מכם.
          timer: 180
          echo: true
          alt: דמות כותבת ליד שולחן, ומעליה ענן מחשבה ובו לב
          art:
            - {use: kid-desk, x: 300, y: 146, w: 280, color: teal}
            - {use: thought, x: 80, y: 36, w: 240}
            - {use: heart, x: 148, y: 76, w: 100}
      - moves:
          - השקף על המסך עוד לפני שהכיתה נכנסת. מתיישבים וכותבים — בלי הסבר נוסף.
          - בזמן הכתיבה — נוכחות, ואז סיבוב בין השולחנות. סמני לעצמך שלוש תשובות שונות זו מזו.
          - הזמיני את שלושת הכותבים לשתף, ושאלי את הכיתה מה משותף לתשובות.
      - whisper: >-
          היחידה ״סובלנות ומניעת גזענות״ עסקה בסיפור האישי ובהקשבה פעילה, בסטריאוטיפים ודעות קדומות, ביחסי רוב
          ומיעוט ובקבוצות השייכות שלנו, ובהיכרות עם מי ששונה מאיתנו. השאלה שעל המסך לא תלויה בשיעור מסוים — גם
          מי שלא היה בשיעורים עונה עליה מהחיים.
      - say: שלוש דקות, לבד ובשקט. אין תשובה נכונה — רק משהו אמיתי עליכם.
      - ladder:
          help: חשבו על פעם אחת שפגשתם מישהו חדש או שונה מכם — מה עשיתם?
          challenge: מה הייתם רוצים לעשות אחרת מעכשיו — ולמה?
      - ask: מי מוכן לשתף משהו שגילה על עצמו?
      - say: >-
          ממה שגיליתם — לעשייה. היום כל קבוצה תתכנן דבר אחד שאפשר לעשות באמת, כדי שנכיר טוב יותר את מי ששונה
          מאיתנו.

  # ------------------------------------------------------------------ 6′–10′
  - id: ideas
    title: רעיונות ליישום
    minutes: 4
    practices:
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - שיתופיות בלמידה
    summary: שישה רעיונות מהמקור — כל קבוצה בוחרת אחד, או רעיון משלה
    body:
      - slide:
          kicker: רעיונות ליישום · 1–3
          title: מה אפשר לעשות?
          points:
            - כרזה בית ספרית — מה תרצו לכתוב? היכן נתלה אותה?
            - ערב גיבוש כיתתי — איך גורמים לכך שכולם ירגישו בנוח?
            - שיעור לכיתות המקבילות — מה חשוב לכם שידעו?
          echo: true
          alt: נורה דולקת, ושני פתקים צבעוניים לידה
          art:
            - {use: bulb, x: 320, y: 120, w: 230}
            - {use: sticky, x: 60, y: 110, w: 150}
            - {use: sticky, x: 110, y: 300, w: 150, color: teal}
      - moves:
          - חשפי את הרעיונות אחד־אחד, והקריאי את השאלה של כל רעיון.
          - כל קבוצה בוחרת רעיון אחד — מהשישה, או רעיון משלה. מותר לשתי קבוצות לבחור אותו רעיון.
          - כל קבוצה אומרת בקול מה בחרה. רשמי על הלוח, ליד שם הקבוצה.
      - say: כל קבוצה בוחרת רעיון אחד — מהשישה, או משלה. שתי דקות, וכל אחד אומר מה הוא מעדיף.
      - slide:
          kicker: רעיונות ליישום · 4–6
          title: ועוד רעיונות
          points:
            - ראיון עם בן משפחה — מה הסיפור של המשפחה שלי?
            - פוסט ברשת החברתית — מה אפשר לעשות כדי לצמצם חשיבה סטריאוטיפית?
            - רעיון משלכם — מה תרצו לומר על סובלנות?
          echo: true
          cue: אחרי שלושת הרעיונות הראשונים —
          alt: עמוד שלטים שמצביעים לכיוונים שונים, ובועות צ׳אט לידו
          art:
            - {use: signpost, x: 320, y: 140, w: 220}
            - {use: chat, x: 60, y: 90, w: 220}
      - task:
          what: כל קבוצה בוחרת רעיון אחד מהשישה — או רעיון משלה — שהיא רוצה לתכנן.
          time: 2 דקות
          group: קבוצות של 4–5 לפי השולחנות
          rules: כל אחד בקבוצה אומר מה הוא מעדיף, ורק אז בוחרים
          plenary: כל קבוצה אומרת בקול מה בחרה
          help: איזה רעיון הייתם רוצים שיקרה בכיתה שלכם?
          challenge: איזה רעיון יגיע גם למי שלא היה בשיעור — ואיך?
      - say: בחרתם? עכשיו מתכננים — עד הפרטים, כך שאפשר יהיה לעשות את זה באמת.

  # ------------------------------------------------------------------ 10′–20′
  - id: plan
    title: מתכננים
    minutes: 10
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: כל קבוצה מתכננת את הרעיון שבחרה לפי חמש שאלות, ומחלקת תפקידים
    body:
      - slide:
          kicker: בקבוצות · 8 דקות
          title: מתכננים — עד הפרטים
          sub: חמש השאלות על הלוח. תוכנית אחת על דף אחד.
          timer: 480
          echo: true
          alt: ארבעה סביב שולחן, ולוח שנה לידם
          art:
            - {use: circle4, x: 280, y: 200, w: 300}
            - {use: calendar, x: 70, y: 70, w: 170}
      - board:
          - מה עושים?
          - בשביל מי?
          - איפה ומתי?
          - מה צריך?
          - מי עושה מה?
      - moves:
          - הסבירי את המשימה לפני שמתחילים; השאלות על הלוח כל הזמן.
          - הסתובבי בין הקבוצות. קבוצה שתקועה — שאלי ״מה בדיוק עושים?״ ותני לה לענות במשפט אחד.
          - דקה לפני הסוף — הודיעי, ובקשי מכל קבוצה לבחור מי מציג.
      - say: >-
          כל קבוצה עונה על חמש השאלות שעל הלוח, ורושמת את התוכנית על דף אחד. בסוף — לכל אחד יש תפקיד.
      - task:
          what: >-
            כל קבוצה מתכננת את הרעיון שבחרה לפי חמש השאלות שעל הלוח, ורושמת את התוכנית על דף אחד.
          time: 8 דקות
          group: אותן קבוצות
          rules: תוכנית שאפשר לעשות באמת, כבר החודש; לכל אחד בקבוצה תפקיד
          plenary: נציג מציג את התוכנית בחצי דקה
          help: התחילו מהשאלה הראשונה — מה בדיוק עושים, במשפט אחד.
          challenge: איך תדעו שהרעיון עבד — מה ישתנה בכיתה אחריו?
      - say: התוכניות מוכנות. בואו נשמע אותן.

  # ------------------------------------------------------------------ 20′–27′
  - id: present
    title: מציגים
    minutes: 7
    practices:
      - מהלכי שיח
    spotlights:
      - שיתופיות בלמידה
      - הערכה ורפלקטיביות
    summary: כל קבוצה מציגה את התוכנית בחצי דקה, והכיתה מציעה דבר אחד שיחזק אותה
    body:
      - slide:
          kicker: מציגים · חצי דקה לכל קבוצה
          title: מה עושים, בשביל מי — ומתי?
          echo: true
          alt: שלוש דמויות יחד, ובועת דיבור עם נורה מעליהן
          art:
            - {use: group3, x: 250, y: 270, w: 320}
            - {use: speech, x: 60, y: 50, w: 220}
            - {use: bulb, x: 133, y: 72, w: 72}
      - moves:
          - כל קבוצה מציגה בתורה, חצי דקה. השאירי את התוכניות על השולחנות.
          - >-
            אחרי כל הצגה — שאלי מה היה מחזק את הרעיון, ותני לתלמידים להגיב זה לזה. רשמי על הלוח את שם הרעיון.
      - ask: מה הייתם מוסיפים לרעיון הזה, כדי שגם מי שמרגיש קצת בחוץ ירצה להשתתף?
      - say: אז מה שאתם מציעים זה ___ — הבנתי נכון? מי מסכים? למי יש רעיון אחר?
      - say: שמענו את כל התוכניות. ועכשיו — בוחרים אחת שתקרה באמת.

  # ------------------------------------------------------------------ 27′–30′
  - id: choose
    title: איזה רעיון יקרה באמת?
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - אחריות ובחירה
    summary: הכיתה בוחרת רעיון אחד שיקרה באמת, ומתנדבים מובילים אותו
    body:
      - slide:
          kicker: בוחרים יחד
          title: איזה רעיון נעשה באמת?
          sub: חושבים רגע — ואז כל אחד מצביע פעמיים.
          echo: true
          alt: שתי דמויות מרימות יד, וכוכב לידן
          art:
            - {use: kid-hand, x: 300, y: 170, w: 150, color: orange}
            - {use: kid-hand, x: 440, y: 190, w: 140, color: teal}
            - {use: star, x: 80, y: 100, w: 170}
      - moves:
          - הקריאי את הרעיונות שעל הלוח, וחכי עשר שניות לפני ההצבעה.
          - כל אחד מצביע פעמיים. סמני את הרעיון שקיבל הכי הרבה ידיים.
          - >-
            שאלי מי מוכן להוביל אותו. רשמי לעצמך את השמות, וסכמי איתם מתי בודקים יחד איך מתקדמים — מחוץ
            לשיעור.
      - ask: איזה רעיון הכי יעזור שנכיר טוב יותר את מי ששונה מאיתנו? חשבו רגע — ואז הצביעו.
      - say: מי מוכן לקחת חלק בהובלה של הרעיון שבחרנו?

  # ------------------------------------------------------------------ +5′
  - id: recall
    title: בואו נזכר
    kind: extension
    minutes: 5
    practices:
      - תרגילי שליפה
    spotlights:
      - הערכה ורפלקטיביות
    summary: כל אחד כותב מה הוא יודע על סטריאוטיפים, רוב ומיעוט והקשבה — לבד ואז בזוג; ואז מה עשינו ביחידה
    body:
      - whisper: >-
          היחידה ״סובלנות ומניעת גזענות״ עסקה בסיפור האישי ובכללי ההקשבה הפעילה, בסטריאוטיפים ודעות קדומות,
          ביחסי רוב ומיעוט ובקבוצות השייכות שלנו, ובהיכרות עם מי ששונה מאיתנו. אין צורך לזכור שיעור מסוים —
          כותבים מה שיודעים.
      - slide:
          kicker: אם נשאר זמן · שליפה, לבד ואז בזוג
          title: מה אתם יודעים על…
          sub: כתבו כל מה שאתם יודעים — מהשיעורים או מהחיים.
          points:
            - סטריאוטיפים ודעות קדומות
            - רוב ומיעוט
            - הקשבה פעילה
          timer: 120
          echo: true
          alt: דמות כותבת ליד שולחן, וספר פתוח לידה
          art:
            - {use: kid-desk, x: 300, y: 160, w: 270, color: teal}
            - {use: book, x: 60, y: 90, w: 200}
      - moves:
          - שתי דקות של כתיבה לבד, בלי מחברת ובלי עזרה.
          - דקה בזוג — משווים, ומשלימים מה שחסר.
          - שמעי שלושה, ואז הקריאי את הסיכום של המקור.
      - say: >-
          כתבו כל מה שאתם יודעים — גם אם לא הייתם בכל השיעורים. אחר כך תשלימו בזוג.
      - ladder:
          help: כתבו מילה אחת לכל נושא — ומשם המשיכו.
          challenge: מה הקשר בין שלושת הנושאים?
      - ask: מה כתבתם, ומה השלמתם מבן הזוג?
      - quote:
          title: אז מה עשינו ביחידה זו? — להקריא בסוף
          text: |
            התחלנו עם השם שלי והסיפור שלי.
            למדנו את כללי ההקשבה ותרגלנו אותם.
            למדנו מה זה בעצם סטריאוטיפים ומה ניתן לעשות כדי לצמצם אותם.
            בדקנו לאלו קבוצות אנו שייכים והבנו את המושגים: ״קבוצת רוב״ ו״קבוצת מיעוט״
            הבנו שחשוב להכיר לעומק אנשים וחברים חדשים ולא למהר לשפוט.
            תכננו פעילות יישומית בעקבות מה שלמדנו.

  # ------------------------------------------------------------------ +5′
  - id: song
    title: ויקיפדיה
    kind: extension
    minutes: 5
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: שומעים את ״ויקיפדיה״ של חנן בן ארי, ובוחרים שורה שמתאימה לרעיון שתכננו
    body:
      - moves:
          - הקריני את השאלה שלפני השיר, ושמעי שתיים־שלוש השערות.
          - הפעילי את השיר. בעצירה — שאלה אחת, בלי דיון, וממשיכים עד הסוף.
          - אחרי השיר — כל אחד מקריא לשכן את השורה שרשם, ואז שמעי שלוש שורות במליאה.
      - video:
          title: ויקיפדיה — חנן בן ארי
          url: https://www.youtube.com/watch?v=ow8_GYK-Ksc
