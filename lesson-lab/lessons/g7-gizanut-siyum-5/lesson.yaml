sensitivity: low

sub: >-
  מדברים על סובלנות — ועכשיו עושים. בשיעור הזה כל קבוצה בוחרת רעיון אחד, מתכננת אותו עד הפרטים ומציגה
  אותו, והכיתה בוחרת רעיון אחד שיקרה באמת.
format: כתיבה אישית, קבוצות ומליאה
question: מה אפשר לעשות באמת — בכיתה, בבית הספר או ברשת — כדי שנכיר את מי ששונה מאיתנו ולא נמהר לשפוט?
takeaways:
  - סובלנות מתחילה בדברים קטנים שעושים — לא רק במה שחושבים.
  - כשמתכננים יחד רעיון אחד עד הפרטים — אפשר להפוך אותו למציאות.
  - כל אחד יכול לקחת על עצמו דבר אחד לעשות אחרת כלפי מי ששונה ממנו.
prep:
  - >-
    חמש שאלות התכנון — כתובות על הלוח לפני השיעור: מה עושים? · בשביל מי? · איפה ומתי? · מה צריך? · מי
    עושה מה?
  - חלוקה לקבוצות של 4–5 לפי השולחנות, ודף ריק לכל קבוצה לתוכנית

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 15 דקות ומעלה — שתי ההרחבות; 10–14 דקות — רק ״בואו נזכר״; פחות —
    ישר לכרטיס היציאה.
  short:
    steps:
      - present
      - choose
    text: מציגות רק שלוש קבוצות, והבחירה ברעיון — בהצבעת ידיים אחת, בלי דיון

brain_break:
  signs: ראשים על השולחן, פיהוקים, קבוצות שהשתתקו באמצע התכנון.
  ideas:
    - name: מחיאה עוברת
      text: >-
        מחיאת כף עוברת בכיתה לפי סדר המקומות — כל אחד מוחא פעם אחת כשמגיע תורו. בסבב השני — מהר יותר.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
    - name: נשימת קופסה
      text: שואפים בספירה עד ארבע, עוצרים עד ארבע, נושפים עד ארבע ועוצרים שוב. ארבעה סבבים.
  from: song

