# סיום יחידה — כיתה ז׳, סובלנות ומניעת גזענות, שיעור 5 (מקור: sources/text/7/Gizanut_Siyum5.md)
slug: g7-gizanut-siyum-5
title: סיום יחידה
grade: 7
grades_served: [7]
month: ינואר
section: חברות, סובלנות ומניעת אלימות (ינואר)
unit: סובלנות ומניעת גזענות
unit_order: 5
unit_size: 5
