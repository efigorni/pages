steps:
- id: part-1
  title: לפני שלוחצים שלח
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: לפני שלוחצים שלח — מה חשוב לברר לפני פרסום תמונה?
  body:
  - slide:
      title: מה חשוב לברר לפני פרסום תמונה?
      art:
      - use: camera
        x: 180
        y: 120
        w: 250
      alt: מצלמה
      echo: true
  - moves:
    - הציגי מצב דמיוני של צילום חברים במסיבה.
    - תני שלוש דקות לכתיבת שאלה שצריך לשאול לפני פרסום.
    - אספי שתי תשובות בלי לדבר על תמונות אמיתיות של ילדי הכיתה.
  - ask: מה חשוב לברר לפני פרסום תמונה?
  - ladder:
      help: האם מי שמצולם יודע ומסכים?
      challenge: האם הסכמה לצילום היא בהכרח הסכמה לכל פרסום?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: הסיפור שבין התמונות
  minutes: 9
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: הסיפור שבין התמונות — מה הדמויות אומרות ומה הן שומרות בלב?
  body:
  - slide:
      title: מה הדמויות אומרות ומה הן שומרות בלב?
      art:
      - use: chat
        x: 180
        y: 120
        w: 250
      alt: בועות שיחה
      echo: true
      sub: ''
  - source_slide:
      slides:
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      why: מציגים את התוכן המקורי המתואר בפעילות וקוראים רק את החלק הדרוש לתרגול.
      art:
      - use: chat
        x: 180
        y: 120
        w: 250
      alt: בועות שיחה
  - moves:
    - הציגי את רצף הקומיקס המקורי.
    - ברביעיות בחרו שתי תמונות וכתבו לכל דמות בועת דיבור ומחשבה.
    - התוצר נשאר על הדף ואינו מתפרסם.
    - תני חמש דקות לכתיבה ושתי דקות להצגת שתי גרסאות.
  - ask: מה הדמויות אומרות ומה הן שומרות בלב?
  - task:
      what: בחרו שתי תמונות בקומיקס המקורי וכתבו בועת דיבור ובועת מחשבה לדמויות. הציעו המשך שמונע פגיעה.
      time: 6 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: הסתכלו בהבעה ובשפת הגוף בלי לקבוע בוודאות מה מרגישים.
      challenge: איך שינוי במחשבה של דמות יכול לשנות את המשך הסיפור?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: מגבירים ומחלישים קולות
  minutes: 8
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מגבירים ומחלישים קולות — לאיזה קול כדאי לתת מקום?
  body:
  - slide:
      title: לאיזה קול כדאי לתת מקום?
      art:
      - use: speech
        x: 180
        y: 120
        w: 250
      alt: בועת דיבור
      echo: true
      sub: ''
  - moves:
    - כתבי על הלוח קול של לחץ לצחוק, קול של אי-נוחות וקול של מבוגר תומך.
    - הסבירי שסרוק הוא דימוי להתבוננות בהבעה ובשפת גוף ולהצעת רגש אפשרי; איננו יכולים לקרוא מחשבות, ולכן צריך גם לשאול.
    - הבהירי שקול פנימי הוא מחשבה; להגביר קול פירושו לתת לו יותר מקום בהחלטה, לא לשנות את עוצמת הדיבור.
    - כל קבוצה מציעה השערה על רגש של דמות, ואז בוחרת מחשבה לחזק ומחשבה שלא לפעול לפיה.
    - בקשי משפט מעשי שעוצר שיתוף או מציע עזרה לנפגע.
  - ask: לאיזה קול כדאי לתת מקום?
  - task:
      what: בחרו קול שכדאי לחזק וקול שלא כדאי לפעול לפיו. כתבו משפט שעוצר שיתוף או מציע עזרה.
      time: 5 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה יכול לומר חבר שמבין שהתמונה פוגעת?
      challenge: מה עושים אם כולם צוחקים אבל אחד שותק?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: עוצרים את השרשרת
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: עוצרים את השרשרת — איך עוזרים בלי להפיץ שוב?
  body:
  - slide:
      title: איך עוזרים בלי להפיץ שוב?
      art:
      - use: shield
        x: 180
        y: 120
        w: 250
      alt: מגן
      echo: true
      sub: ''
  - moves:
    - 'כל זוג כותב שלוש פעולות: לא להעביר; לפנות למבוגר; לתמוך במי שנפגע.'
    - תרגלי פנייה קצרה שאינה מצרפת את התמונה.
    - הזמיני זוגות להגיב להצעות ולבדוק שאינן יוצרות הפצה נוספת.
    - במקרה ממשי את דרך הטיפול והדיווח קובעים עם מבוגר מתאים.
  - ask: איך עוזרים בלי להפיץ שוב?
  - task:
      what: 'כתבו שלוש פעולות: לא להעביר, לפנות למבוגר ולתמוך בנפגע. נסחו פנייה שאינה מצרפת את התמונה.'
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: 'אפשר לומר: ראיתי משהו פוגע ואני צריך עזרה לעצור את ההפצה.'
      challenge: איך תציעו תמיכה בלי להאשים את מי שבתמונה?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - tip: הכלי מסייע לבחירה ולהקשבה, אך אינו מבטיח שליטה באחרים או פתרון. האחריות לפגיעה היא של הפוגע;
      כשיש פגיעה או חשש פונים למבוגר.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - השליטה והפיקוד תמיד בידיים שלכם - בכל רגע אתם יכולים לבחור כיצד לפעול
      - בתוך קולות של לחץ חברתי, חשוב להגביר את הקול הפנימי שלכם שאומר לכם איך נכון לפעול. הקשיבו לו!
      - לפני שמצלמים או מפרסמים תמונה או סרטון של מישהו אחר, חשוב לעצור ולחשוב איך הוא ירגיש ומה עלול
        לקרות.
      - לא מצלמים, לא מעלים ולא משתפים תמונות או סרטונים שמתייחסים לגוף או לאיברים פרטים ועלולים להשפיל
        או לפגוע.
      - חברים טובים יכולים לעצור או למנוע פגיעה באחר!
      - אם אתם מתלבטים - התייעצו עם מבוגר!
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - מה תעשו אם קיבלתם צילום שעלול לפגוע?
      - איך תפנו למבוגר בלי להפיץ את התמונה?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: פגיעה באמצעות תמונות גוף. אין להביא לכיתה תמונות פרטיות או אמיתיות של תלמידים. האחריות לפגיעה
    היא של הפוגע ולא של הנפגע.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; מוקד 105 — המטה הלאומי להגנה על ילדים
    ונוער ברשת, 24/7'
