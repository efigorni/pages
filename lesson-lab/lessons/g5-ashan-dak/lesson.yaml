steps:
- id: part-1
  title: רגע לפני התגובה
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: רגע לפני התגובה — איזה סימן בגוף עשוי להתריע על כעס?
  body:
  - slide:
      title: איזה סימן בגוף עשוי להתריע על כעס?
      art:
      - use: traffic-light
        x: 180
        y: 120
        w: 180
      alt: רמזור
      echo: true
  - moves:
    - תני שלוש דקות לכתיבה על דמות דמיונית שכועסת.
    - אספי סימנים אפשריים בלי לבקש מתלמיד להגדיר את עצמו.
    - הדגישי שאין סימן אחד שמתאים לכולם.
  - ask: איזה סימן בגוף עשוי להתריע על כעס?
  - ladder:
      help: חשבו על אגרופים, כתפיים או דופק.
      challenge: למה כדאי לשים לב לסימן לפני שאומרים או עושים משהו?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: הגביע שנפל
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: הגביע שנפל — מה בין רגש מובן לפעולה פוגעת?
  body:
  - slide:
      title: מה בין רגש מובן לפעולה פוגעת?
      art:
      - use: heart-broken
        x: 180
        y: 120
        w: 250
      alt: לב סדוק
      echo: true
      sub: ''
  - source_slide:
      slides:
      - 10
      why: מציגים את התוכן המקורי המתואר בפעילות וקוראים רק את החלק הדרוש לתרגול.
      art:
      - use: heart-broken
        x: 180
        y: 120
        w: 250
      alt: לב סדוק
  - moves:
    - 'ספרי: יובל עובר ליד השולחן ומפיל בטעות את הגביע של עידו.'
    - עידו צועק ודוחף, ויובל מתיישב בשקט.
    - הציגי את דימויי הסוס, הצב והבלון במקור.
    - בזוגות שוחחו על תגובות אפשריות של הדמויות, בלי להדביק תוויות לילדים.
  - ask: מה בין רגש מובן לפעולה פוגעת?
  - task:
      what: הציעו לדמויות מהסיפור תגובות אפשריות. הבחינו בין רגש מובן לפעולה שפוגעת, בלי לסווג ילדים אמיתיים.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: איזה רגש אפשר להבין בלי להסכים לדחיפה?
      challenge: האם שתיקה אומרת שאין רגש חזק?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
