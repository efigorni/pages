  - moves:
    - 'ספרי: איתמר ביקש לצאת לשתות, התבקש להמתין, ואז ראה תלמידה אחרת יוצאת.'
    - בזוגות כתבו מה עשוי לעבור בראשו, תרגלו את הרצף ובחרו פנייה מכבדת לבירור.
    - אין להמחיז דחיפה או צעקות.
    - השווי שתי תגובות אפשריות.
  - ask: איך נשמעת תגובה אחרי העצירה?
  - task:
      what: כתבו מה איתמר חושב, ובחרו פנייה מכבדת לבירור אחרי העצירה. השוו אותה לתגובה מהירה.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה איתמר יכול לשאול במקום להניח שכבר יודע?
      challenge: איך אפשר לשמור על הבקשה שלו בלי לפגוע באחרים?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - ישנם מצבים שבהם אנחנו מוצפים רגשית, ואנו עלולים להגיב באופן שיפגע בנו או באחרים.
      - לכל אחד יש נטייה להגיב בדרך שונה (סוס בועט, צב או בלון).
      - כלי החוסן עש"ן ד"ק מציע חמישה שלבים, שנזכור בעזרת ראשי התיבות.
      - השלבים יסייעו לנו לזהות את הרגש ולבחור דרך התנהגות שתתאים לנו.
      - כדאי להשתמש בכלי עש"ן ד"ק כעזרה ראשונה, במצבים שבהם אתם חשים רגש מסוים בעוצמה רבה. בדרך זו תהיו
        מסוגלים לדבר אל עצמכם ולבחור את הדרך המתאימה לכם לפעולה.
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
