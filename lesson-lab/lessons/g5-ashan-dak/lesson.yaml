      help: 'אפשר לומר: אני כועס, ואני יכול לבקש עזרה לפני תגובה.'
      challenge: מתי קדימה פירושו להזעיק מבוגר מיד?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
