  - moves:
    - 'הדגימי את הרצף: עצור; שחרור שרירים נוח; נשימה איטית בלי מאמץ; דיבור פנימי; קדימה לפעולה.'
    - כל זוג בוחר משפט פנימי מתאים לעידו ומציע פעולה בטוחה.
    - התרגול הוא רשות; מי שלא נוח לו עם נשימה או כיווץ יכול להתבונן ולשים לב לחדר.
  - ask: איך עוברים מרגש חזק לבחירה?
  - task:
      what: עברו על חמש התחנות של עש״ן ד״ק. בחרו לעידו משפט פנימי ופעולה בטוחה. אפשר לצפות במקום לתרגל
        בגוף.
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
