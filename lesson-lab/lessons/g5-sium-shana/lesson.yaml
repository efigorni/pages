steps:
- id: part-1
  title: צעד קטן בדרך
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: צעד קטן בדרך — איזו התקדמות קטנה ראויה להיזכר?
  body:
  - slide:
      title: איזו התקדמות קטנה ראויה להיזכר?
      art:
      - use: road
        x: 180
        y: 120
        w: 250
      alt: דרך
      echo: true
  - moves:
    - תני שלוש דקות לכתיבת דבר קטן שהשתפר השנה, בלמידה, בחברות או בתחביב.
    - אפשר לבחור דוגמה דמיונית.
    - אספי שתי תשובות בלי השוואת הישגים בין תלמידים.
  - ask: איזו התקדמות קטנה ראויה להיזכר?
  - ladder:
      help: חשבו על משהו שפעם היה קשה ועכשיו מעט קל יותר.
      challenge: מי או מה עזר להתקדמות הזאת?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: המסע של האפרוח
  minutes: 9
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: המסע של האפרוח — מה עוזר להמשיך כשהדרך קשה?
  body:
  - slide:
      title: מה עוזר להמשיך כשהדרך קשה?
      art:
      - use: mountain
        x: 180
        y: 120
        w: 250
      alt: הר
      echo: true
      sub: ''
  - video:
      url: https://www.youtube.com/watch?v=YYb4h8U7Ljw
      title: המסע של האפרוח
      before: מה עוזר לאפרוח להמשיך בדרך?
      watch: שימו לב לרגע של קושי ולמה שעוזר אחריו.
      pauses:
      - at: '?'
        moment: אחרי הנפילה הראשונה ולפני המשך הטיפוס
        ask: מה יוכל לעזור לאפרוח עכשיו?
      art:
      - use: mountain
        x: 180
        y: 120
        w: 250
  - moves:
    - הציגי את סרטון המקור עם שאלת צפייה; הקצי כשלוש דקות לצפייה של כשתי דקות ולעצירה הקצרה, ארבע דקות למשימה ושתי דקות לאיסוף ולמעבר.
    - לאחריו כל תלמיד חושב, משתף בזוג ובוחר רגע שמראה קושי או עזרה.
    - אספי שתי תגובות ובדקי שלא הופכים התמדה לדרישה להסתדר לבד.
  - ask: מה עוזר להמשיך כשהדרך קשה?
  - task:
      what: חשבו לבד על רגע של קושי בסרטון, שתפו בזוג והצביעו על דבר שעזר לאפרוח להמשיך.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: יחידים ואחר כך זוגות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה השתנה בין תחילת המסע לסופו?
      challenge: מתי תמיכה מבחוץ חשובה לא פחות מהתמדה?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
