      - 23
      why: מציגים את התוכן המקורי המתואר בפעילות וקוראים רק את החלק הדרוש לתרגול.
      art:
      - use: pair
        x: 180
        y: 120
        w: 250
      alt: זוג
  - moves:
    - הציגי את קלפי המקור.
    - 'ערכי שלושה סבבים בזוגות: הישג קטן, קושי שלמדנו ממנו, אדם שעזר.'
    - בכל סבב שתי דקות; בסך הכול שש דקות לשיחות, דקה למעבר ודקה לאיסוף תובנה אחת. אפשר להעביר או לדבר על דמות.
    - מחליפים בן זוג אחד בלבד כדי לצמצם זמן מעבר.
    - שיתוף של בן זוג דורש הסכמתו.
  - ask: מה גילינו על הדרך שלנו השנה?
  - task:
      what: 'שתפו בשלושה סבבים: הישג קטן, קושי שלמדתם ממנו ואדם שעזר. אפשר להעביר או לבחור דמות; שיתוף
        של חבר דורש הסכמה.'
      time: 6 דקות לשיחות, דקה למעבר ודקה לסיכום
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: מתנדב אחד משתף תובנה קצרה על הדרך, בלי לספר את סיפורו של בן הזוג.
      help: בחרו רגע קטן, לא בהכרח הישג גדול.
      challenge: איך אותו כוח יכול לעזור בתחום אחר?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: מטרה עם צעד ותמיכה
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מטרה עם צעד ותמיכה — איך נהפוך יעד למשהו שאפשר להתחיל?
  body:
  - slide:
      title: איך נהפוך יעד למשהו שאפשר להתחיל?
      art:
      - use: target
        x: 180
        y: 120
        w: 250
      alt: מטרה
      echo: true
      sub: ''
  - moves:
    - 'כל תלמיד בוחר יעד קטן ומצייר שלושה סימנים: היעד, הצעד הראשון ומקור התמיכה.'
    - בזוגות בדקו אם הצעד אפשרי ואם העזרה נגישה.
    - אין חובת המשך בכיתה אחרת או הבטחה להישג.
  - ask: איך נהפוך יעד למשהו שאפשר להתחיל?
  - task:
      what: בחרו יעד קטן, צעד ראשון ומקור תמיכה. בדקו בזוג אם הצעד נגיש ומה אפשר להקטין אם יהיה קשה.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: יחידים ואחר כך זוגות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה תוכלו לעשות בעשר דקות כדי להתחיל?
      challenge: מה תשנו אם הצעד הראשון יהיה גדול מדי?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
