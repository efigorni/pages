sub: >-
  לכל אחד מאיתנו יש קווי סיום משלו — גם קטנים. בשיעור הזה פוגשים שני ספורטאים על קו הסיום, נזכרים בהצלחה
  שלנו, כותבים משפטים שמדרבנים אותנו קדימה, ושואלים — עד כמה ההצלחה תלויה בנו?
format: כתיבה אישית, זוגות ומליאה
question: מה עזר לי להצליח בעבר — ואיך המשפטים שאני אומר לעצמי עוזרים לי להצליח שוב?
takeaways:
  - לכל אחד יש כוחות וחוזקות — וגם הצלחה קטנה היא הצלחה.
  - מאמץ, התמדה ומשפטים מדרבנים שאנחנו אומרים לעצמנו עוזרים לנו להשיג מטרות.
  - כל הצלחה מחזקת את האמונה שנצליח גם בפעם הבאה.
prep:
  - דוגמה קטנה משלך — הצלחה, ומה אמרת לעצמך בדרך אליה — להדגמה במסלול

