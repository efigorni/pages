steps:
  # ------------------------------------------------------------------ 0′–6′
  - id: finish
    title: על קו הסיום
    minutes: 6
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כתיבה כשנכנסים — איך הרגישו שני ספורטאים על קו הסיום; ואז מקריאים מה הם עצמם סיפרו
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, במחברת
          title: דור וחנית הגיעו לקו הסיום!
          sub: אחרי שנה של אימונים — איך הם הרגישו על קו הסיום? כתבו שלוש מילים.
          verbatim: [title]
          timer: 180
          echo: true
          alt: שער סיום, ומתחתיו שתי דמויות מרימות יד
          art: {file: art/finish.svg}
      - whisper: >-
          ״איש הברזל״ היא תחרות סבולת ארוכה — שחייה, רכיבה על אופניים וריצה, ברצף. חנית התאמנה לה שנה ארוכה; לדור
          זה היה המרוץ הראשון. אם שואלים — זה מספיק.
      - moves:
          - השקף על המסך כשהכיתה נכנסת, ומתחילים לכתוב בלי הסבר נוסף. בינתיים — נוכחות.
          - אחרי שלוש דקות — שמעי מילים מכמה תלמידים, ורשמי אותן על הלוח.
          - >-
            הקריאי את דברי חנית ואחריהם את דברי דור, או בקשי מתלמידים להקריא. אחרי כל אחד — מי כתב מילה שמופיעה
            בדבריו?
      - say: שלוש מילים, לבד ובשקט — מה הם הרגישו ברגע הזה, אחרי שנה של אימונים?
      - ladder:
          help: חשבו על רגע שבו סיימתם משהו קשה — מה הרגשתם?
          challenge: ומה הם הרגישו באמצע הדרך — בבוקר של אימון, כשקשה?
      - quote:
          title: חנית — להקריא
          text: |-
            ״כשהגעתי לקו הסיום הרגשתי שזה רגע מדהים.
            הרגשתי שטיפסתי והגעתי לפסגה גבוהה, פסגת חלומותיי, שמיציתי את היכולות שלי.
            באותו רגע ידעתי שהדרך שעברתי והמאמץ שהשקעתי היו שווים את זה. התרגשתי מאד.
            חשתי גאווה ענקית בעצמי על כל הימים שקמתי מוקדם בבוקר כדי להתאמן, על שלמדתי בגיל מבוגר לרכוב על אופניים.
            אם עשיתי את כל הדברים הללו, אני יכולה לעשות הכל!
            גיליתי שכשיש לי מטרה אני אמצא בתוכי כוחות להשיג אותה.״
      - slide:
          kicker: חנית · על קו הסיום
          title: מה היא הרגישה וחשבה?
          points:
            - ״גיליתי שכשיש לי מטרה אני אמצא בתוכי כוחות להשיג אותה.״
          verbatim: true
          echo: true
          cue: כשמקריאים את דברי חנית —
          alt: הר עם דגל על הפסגה, ודמות מרימה יד לידו
          art:
            - {use: mountain, x: 230, y: 250, w: 330}
            - {use: flag, x: 421, y: 143, w: 120, color: orange}
            - {use: kid-hand, x: 60, y: 216, w: 140, color: teal}
      - quote:
          title: דור — להקריא
          text: |-
            ״על קו הסיום הציף אותי אושר עצום. תחושת ניצחון אדירה! הרגשתי גאווה גדולה מאד על מה שהצלחתי להשיג.
            התרגשתי - אני! אני דור ואני איש ברזל!
            הוכחתי לעצמי שאני יכול לנצח, להצליח, להשיג מטרות.
            זה היה מסע של אימונים מפרכים והרבה מאמץ.
            הצבתי לעצמי מטרה - לעמוד על קו הסיום של תחרות איש הברזל - והקדשתי את השנה הזו להשגתה.
            על קו הסיום ידעתי בכל ליבי שהמאמצים היו שווים בשביל הרגע הזה ממש.״
      - slide:
          kicker: דור · על קו הסיום
          title: מה הוא הרגיש וחשב?
          points:
            - ״הוכחתי לעצמי שאני יכול לנצח, להצליח, להשיג מטרות.״
          verbatim: true
          echo: true
          cue: כשמקריאים את דברי דור —
          alt: מטרה עם חץ במרכז, ודמות מרימה יד לידה
          art:
            - {use: target, x: 280, y: 130, w: 280}
            - {use: kid-hand, x: 60, y: 216, w: 140, color: orange}
      - ask: אילו מילים שכתבתם מופיעות בדבריהם? ומה הם עשו כדי להגיע לרגע הזה?
      - say: >-
          חנית ודור הגיעו לקו הסיום של מרוץ ענק. אבל לכל אחד מאיתנו יש קווי סיום משלו — גם קטנים. בואו ניזכר באחד.

  # ------------------------------------------------------------------ 6′–14′
  - id: success
    title: הצלחה שלי
    minutes: 8
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: >-
      כל אחד כותב הצלחה אחת שהייתה לו, ועונה עליה בכתב — מה עשה, מה ומי עזר, ומה אמר לעצמו; מתנדבים מספרים
      על הדרך
    body:
      - slide:
          kicker: הצלחות מהעבר · לבד, במחברת
          title: היזכרו ורשמו לפניכם — הצלחה שהייתה לכם
          sub: בספורט, בלימודים, בתחביב, במשפחה, עם חברים — גם הצלחה קטנה נחשבת.
          verbatim: [title]
          timer: 120
          echo: true
          alt: דמות כותבת ליד שולחן, וכוכב לידה
          art:
            - {use: kid-desk, x: 230, y: 130, w: 288, color: teal}
            - {use: star, x: 50, y: 60, w: 170}
      - moves:
          - >-
            שאלי מה חנית ודור עשו כדי להצליח, ושמעי שתיים־שלוש תשובות — כך לכולם יש רעיון מה יכולה להיות ״הצלחה״.
          - >-
            שתי דקות לכתוב הצלחה אחת. הסתובבי; מי שלא מוצא — עזרי לו לחפש בתחום אחר, גם במשהו שנראה קטן: להגיע לבד
            למקום חדש, לשמור על אח צעיר, להתמיד בתחביב.
          - עברי לשקף השאלות — שלוש דקות של כתיבה בשקט.
          - בסוף — שניים־שלושה מתנדבים מספרים מה עשו כדי להצליח. לא חייבים לספר על ההצלחה עצמה.
      - say: חשבו על משהו שרציתם להשיג — והשגתם. בכל תחום, וגם אם הוא נראה לכם קטן.
      - task:
          what: >-
            כל אחד כותב במחברת הצלחה אחת שהייתה לו, ועונה עליה על שלוש השאלות שעל המסך.
          time: 5 דקות — 2 להצלחה, 3 לשאלות
          group: לבד
          rules: כותבים לעצמכם, והמחברת לא נאספת; מי שלא מוצא הצלחה — בוחר משהו קטן
          plenary: שניים־שלושה מתנדבים מספרים מה עשו כדי להצליח
          help: חשבו על משהו שפעם לא ידעתם לעשות, והיום אתם יודעים — רכיבה, שחייה, מתכון, משחק.
          challenge: במה הדרך שלכם להצלחה דומה לדרך של חנית ודור — ובמה היא שונה?
      - slide:
          kicker: מתבוננים לאחור, נזכרים בעצמנו
          title: התבוננו בהצלחה שכתבתם.
          points:
            - מה עשיתם כדי להצליח?
            - מה ומי עזר לכם להשיג את המטרה?
            - מה אמרתם לעצמכם כדי להתמיד ולהצליח?
          verbatim: true
          timer: 180
          echo: true
          cue: אחרי שכתבו את ההצלחה —
          alt: דמות, ומעליה ענן מחשבה ובתוכו כוכב
          art:
            - {use: thought, x: 200, y: 24, w: 300, flip: true}
            - {use: star, x: 290, y: 60, w: 120}
            - {use: kid-stand, x: 100, y: 214, w: 150, color: teal}
      - ask: מי מוכן לספר מה עשה כדי להצליח? אפשר לספר רק על הדרך, בלי ההצלחה עצמה.
      - say: >-
          שמעתי מאמץ, התמדה, עזרה מאחרים — וגם משפטים שאמרתם לעצמכם. על המשפטים האלה נעבוד עכשיו.

  # ------------------------------------------------------------------ 14′–21′
  - id: path
    title: משפטים מדרבנים קדימה
    minutes: 7
    practices:
      - כולם כותבים
      - הוצאה למשימה
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: מסלול של הצלחות במחברת — בכל תחנה הצלחה, ומתחתיה משפט מדרבן שאמרתי לעצמי או שאני יכול לומר היום
    body:
      - slide:
          kicker: מה אומרים לעצמנו בדרך?
          title: משפטים מדרבנים קדימה
          points:
            - וואו הצלחתי!!
            - אולי הצלחתי במקרה? היה לי מזל
            - כבר הוכחתי לעצמי שאני יכול/ה
            - אם הצלחתי קודם, בטוח אצליח עכשיו
          verbatim: true
          echo: true
          alt: דרך מתפתלת עם תחנות של הצלחה, וכוכב בסופה
          art: {file: art/path.svg}
      - moves:
          - >-
            ספרי על המסלול שבשקף, וחשפי את המשפטים אחד־אחד: בהצלחה הראשונה אולי אמרנו ״היה לי מזל״; ככל שהצלחנו
            עוד — המשפטים השתנו.
          - הדגימי בקצרה מסלול משלך — הצלחה קטנה, ומה אמרת לעצמך בדרך אליה.
          - ארבע דקות של עבודה בשקט. מי שנתקע — מתחיל מההצלחה שכתב קודם.
          - בסוף — שניים־שלושה מקריאים משפט מדרבן אחד שכתבו.
      - say: >-
          בהצלחה הראשונה אולי אמרנו לעצמנו ׳היה לי מזל׳. ככל שהצלחנו עוד ועוד — המשפטים שאמרנו לעצמנו השתנו.
      - slide:
          kicker: המסלול שלי · לבד, במחברת
          title: ציירו מסלול עם שלוש תחנות לפחות
          sub: בכל תחנה — הצלחה, ומתחתיה משפט מדרבן.
          timer: 240
          echo: true
          cue: אחרי ההדגמה —
          alt: דף, ועיפרון לידו
          art:
            - {use: note, x: 300, y: 90, w: 240}
            - {use: pencil, x: 90, y: 270, w: 170}
      - task:
          what: >-
            מציירים במחברת מסלול עם שלוש תחנות לפחות. בכל תחנה — הצלחה אחת, ומתחתיה משפט מחזק שאמרתם לעצמכם, או
            שאתם יכולים לומר לעצמכם היום.
          time: 4 דקות
          group: לבד
          rules: גם הצלחות קטנות נחשבות; המסלול נשאר אצלכם
          plenary: שניים־שלושה מקריאים משפט מדרבן אחד שכתבו
          help: התחילו מההצלחה שכתבתם קודם — מה אמרתם לעצמכם אז?
          challenge: הוסיפו תחנה של מטרה שעוד לא השגתם — מה תגידו לעצמכם בדרך אליה?
      - ask: מי מוכן להקריא משפט מדרבן אחד שכתב?
      - say: ואם המשפטים שלנו משפיעים עלינו — אולי גם אנחנו משפיעים על מה שקורה בחיים שלנו? בואו נבדוק.

  # ------------------------------------------------------------------ 21′–27′
  - id: creator
    title: אני היוצר של חיי?
    minutes: 7
    practices:
      - Think–Pair–Share
    spotlights:
      - הערכה ורפלקטיביות
      - עניין ורלוונטיות
    summary: לבד, בזוגות ובמליאה — עד כמה אנחנו משפיעים על מה שקורה בחיינו, ומה בכל זאת לא תלוי בנו
    body:
      - slide:
          kicker: דיון במשפט · לבד, בזוג, במליאה
          title: אני היוצר/ת של חיי
          sub: מה דעתכם על המשפט - עד כמה אנחנו משפיעים על דברים שקורים בחיינו?
          points:
            - לבד — 20 שניות
            - בזוגות — דקה
            - במליאה
          verbatim:
            - title
            - sub
          echo: true
          alt: דרך שמתפתלת אל האופק, דמות בתחילתה ועיפרון גדול
          art:
            - {use: pencil, x: 30, y: 40, w: 180}
            - {use: road, x: 190, y: 196, w: 400}
            - {use: kid-stand, x: 335, y: 290, w: 110, color: teal}
      - moves:
          - >-
            כלל לשיחה: מספרים רק על עצמנו, ומקשיבים בלי לשפוט. הציגי את המשפט, וחכי 20 שניות של שקט. דקה בזוגות,
            עם השכן לשולחן.
          - >-
            במליאה — שמעי שלושה־ארבעה זוגות, הדהדי, והזמיני את מי שחושב אחרת. שימי לב שהשיח לא הופך ל״מי שלא
            מצליח — אשם״: יש דברים שלא בשליטתנו, והשאלה היא מה כן.
          - בסוף — חשפי את נקודות הסיכום אחת־אחת, והקריאי לצד כל נקודה את המשפט שלה מהסיכום.
      - ladder:
          help: חשבו על ההצלחה שכתבתם — כמה ממנה בזכותכם, וכמה מזל או עזרה?
          challenge: איך ההצלחה שלכם השפיעה על המחשבות והרגשות שלכם, כשעמדתם מול מטרה חדשה?
      - ask: עד כמה אנחנו אחראים להשגת המטרות שלנו — ומה בכל זאת לא תלוי בנו?
      - say: אז מה שאמרת זה ___ — הבנתי נכון? מי מסכים, ומי חושב שיש גם מזל?
      - slide:
          kicker: מסכמים את השיחה
          title: מה גילינו על ההצלחות שלנו?
          points:
            - לכל אחד יש כוחות וחוזקות
            - גם הצלחות קטנות הן הצלחות
            - כל ניסיון מחזק את האמונה בעצמנו
          echo: true
          cue: אחרי השיחה —
          alt: כוכב גדול, ושתי דמויות לידו
          art:
            - {use: star, x: 185, y: 24, w: 250}
            - {use: kid-stand, x: 100, y: 300, w: 110, color: teal}
            - {use: kid-hand, x: 410, y: 300, w: 110, color: orange}
      - quote:
          title: הסיכום מהמקור — להקריא
          text: |-
            לכל אדם יש כוחות וחוזקות שעוזרים לו להתמודד ולהתקדם.
            חוזקות אינן כוחות של גיבורי-על, אלא כוחות שיש לכל אחד ואחת מאיתנו.
            גם הצלחות קטנות הן הצלחות.
            ככל שאנחנו מנסים להשיג את מטרותינו, אנחנו משפיעים על עצמנו לטובה – אנחנו מאמינים בעצמנו ואז מנסים להשיג עוד ועוד מטרות.

