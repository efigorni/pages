      - slide:
          kicker: אנו לא לבד!
          title: את מי תבחרו לשתף?
          sub: התכנים, המראות והסיפורים עלולים להציף מחשבות ורגשות.
          points:
            - בני משפחה, מורים או חברים
            - ער״ן — 1201, בכל שעה
          verbatim:
            - title
            - sub
          cue: אחרי הקראת הפתקים —
          echo: true
          alt: שתי דמויות יושבות זו מול זו ומשוחחות
          art:
            - {use: kid-sit, x: 60, y: 220, w: 180, color: teal}
            - {use: kid-sit, x: 360, y: 220, w: 180, color: orange, flip: true}
      - say: >-
          אנו תמיד יכולים לשתף במחשבות וברגשות האלה בני משפחה, מורים או חברים. חשבו בשקט על אדם אחד — לא צריך לומר
          את שמו.
      - say: >-
          אחת הדרכים לזכור את הנופלים ולתת להם מקום היא להכיר את סיפורי החיים שלהם, ואת השירים שנכתבו עליהם. עכשיו
