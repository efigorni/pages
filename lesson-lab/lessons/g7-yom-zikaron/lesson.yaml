          alt: נר זיכרון
          art: candle
      - quote:
          title: מהמקור — להקריא
          text: >-
            יום הזיכרון החל בד׳ באייר, הוא יום אבל לאומי במדינת ישראל להנצחת זכרם של חללי מערכות ישראל ופעולות
            האיבה מתקופת טרום המדינה ועד ימינו.
      - moves:
          - הקריאי את ההגדרה, וחלקי לכל תלמיד פתק קטן.
          - >-
            כל אחד כותב מילה או משפט, בלי שם, מקפל ומוסר לסלסלה — גם מי שהשאיר את הפתק ריק. קראי את הפתקים
