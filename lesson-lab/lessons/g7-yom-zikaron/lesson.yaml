sub: >-
  יום הזיכרון ויום העצמאות צמודים זה לזה. בשיעור הזה מכירים את סיפורם של שני חיילים, מקשיבים לשיר שנכתב
  עליהם, ומדברים על מה שעוזר לנו כשרגשות מציפים.
format: מליאה, כתיבה אישית וזוגות
question: איך זוכרים את הנופלים — ומה עוזר לנו כשרגשות מציפים?
takeaways:
  - ביום הזיכרון זוכרים את הנופלים, גם דרך סיפורי החיים שלהם — ולמחרתו חוגגים את העצמאות שהם שילמו עליה.
  - ימי הזיכרון והעצמאות מעוררים רגשות שונים, לפעמים יחד — כאב ועצב לצד גאווה ושמחה.
  - אנחנו לא לבד — יש עם מי לשתף, ולכל אחד דרך משלו להתמודד.
prep:
  - פתקים קטנים לכל תלמיד, וסלסלה לאיסוף — לשלב ״מה עולה בנו״

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה, ובקשי שתהיה זמינה אחריו. מפי איתה את מעגלי הפגיעות בכיתה: מי במשפחה שכולה, מי
      איבד אדם קרוב במערכות ישראל או בפעולות איבה, ומי איבד את יקירו בדרך אחרת — האבל הציבורי מעורר לא פעם את
      האבל הפרטי. עם תלמידים כאלה שוחחי לפני השיעור: אם וכיצד ירצו לשתף, ומה יעזור להם בשיעור עצמו.
  - head: מי עלול להיפגע
    text: >-
      מעבר למשפחות השכולות — מי שבן משפחה שלו משרת עכשיו, ומי שימים כאלה מעוררים אצלו חרדה. הסיפור על שתי
      ההודעות למשפחת הראל קשה במיוחד: הקריאי אותו לאט, בקול רגוע ובלי להעצים. אף אחד לא מתבקש לספר על אבדן
      אישי, והשיח נשען על ביטחון, על תקווה ועל ערבות הדדית.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. הפתקים בפתיחה בלי שם, וכל אחד מוסר פתק —
      גם ריק. מותר לוותר על כל שאלה, ולא קוראים בשם למי שלא הצביע. מי שצריך לצאת לרגע — יוצא, ואת מעדכנת את
      היועצת.
  - head: אם מישהו מוצף או משתף אבדן
    text: >-
      עוצרים בעדינות, מודים, ומשאירים לו מקום — בלי לחקור מול הכיתה. אחרי השיעור — שיחה אישית, והתייעצות עם
      היועצת עוד באותו יום, ובמידת הצורך גם עם הפסיכולוג של בית הספר. לא מבטיחים לשמור בסוד. מחוץ לבית הספר, בכל
      שעה: ער״ן 1201 — עזרה ראשונה נפשית; ונט״ל 1-800-363-363 — קו סיוע לנפגעי טראומה על רקע לאומי, מלחמה וטרור.
      שניהם זמינים 24/7, וער״ן מופיע גם בשקף ״אנו לא לבד!״.

