  # ------------------------------------------------------------------ 10′–21′
  - id: story
    title: יובלים והראלים
    minutes: 11
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
      - הערכה ורפלקטיביות
    summary: >-
      סיפורם של שני חיילים צעירים בשם יובל הראל; מקשיבים לשיר ״על דעת המקום״ שנכתב בעקבותיו, ומי שרוצה משתף שורה
      שנגעה בו
    body:
      - slide:
          kicker: סיפור אחד אישי של שני חיילים צעירים
          title: ״יובלים והראלים״
          sub: לשניהם קראו יובל הראל, ושניהם גרו בשכונת תלפיות בירושלים.
          points:
            - יובל הראל ז״ל — בנם של חיה ויוסף
            - יובל הראל ז״ל — בנם של מרים ויחזקאל
          verbatim:
            - sub
            - points
          echo: true
          alt: שני נרות זיכרון זה לצד זה
          art:
            - {use: candle, x: 100, y: 160, w: 190}
            - {use: candle, x: 330, y: 160, w: 190}
      - moves:
          - הציגי את השקף, והקריאי את הסיפור לאט, בקול רגוע. אחרי הסיפור — רגע של שקט, בלי שאלות.
          - ספרי בקצרה על השיר (למטה), הציגי את השאלה שלפני ההאזנה, והפעילי את השיר.
          - >-
            אחרי השיר — זמן חשיבה, ואז הזמיני מי שרוצה לשתף שורה או מחשבה. הדהדי בעדינות (״אז השורה שנגעה בך היא ___
            — הבנתי נכון?״), ושאלי למי עוד נגעה השורה הזאת — או שורה אחרת.
      - quote:
          title: הסיפור — להקריא
          text: >-
            בזמן מלחמת לבנון הראשונה היה טוראי יובל הראל משכונת תלפיות בירושלים, לוחם בגדוד 50 של הנח״ל. ב־8 ביוני
            1982 הודיעו להוריו של יובל, חיה ויוסף, כי בנם נפל חלל בלבנון. באותה מלחמה לחם גם טוראי יובל הראל משכונת
            תלפיות בירושלים. הוא היה לוחם בחיל השיריון. 12 שעות לאחר שהודיעו לחיה ויוסף כי בנם אינו בין החיים, הגיעה
            הודעת התנצלות והתברר כי מי שנפגע מטיל נ״ט ונפל חלל ליד צידון הוא השכן, יובל הראל, בנם של מרים ויחזקאל.
            ההודעה נמסרה למשפחתו של החלל.
      - quote:
          text: >-
            יומיים לאחר מכן, ב־10 ביוני 1982, שוב נשמעה דפיקה בבית משפחת הראל. יוסף וחיה פתחו כדי לשמוע את אותה הודעה
            בפעם השנייה תוך שלושה ימים. הם סירבו להאמין להודעה והסבירו כי מדובר בטעות וביובל הראל אחר, אך הפעם הייתה
            זו האמת, גם בנם יובל נפל חלל בלבנון. באופן אקראי ומצמרר, בהפרש של יומיים, נקברו שני החללים זה לצד זה בהר
            הרצל: שתי מצבות של טוראי יובל הראל משכונת תלפיות בירושלים, 50 ס״מ מפרידים ביניהן.
      - quote:
          title: על השיר — מהמקור
          text: >-
            השיר שנכתב לזכרם של ״יובלים והראלים״ על ידי עמנואל צבר, נקרא גם בשם ״ברית דמים״, הולחן בידי יאיר רוזנבלום
            והושר במקור על ידי מירי אלוני. המוטיב החוזר בשיר: ״עוד זה מדבר וזה בא״ — במקור, ביטוי חוזר בספר איוב לפני
            בשורה על אסון נוסף.
      - video:
          title: על דעת המקום
          url: https://www.youtube.com/watch?v=TGMY6a_JzCQ
          length: "4:35"
          before: איזו שורה בשיר תיגע בכם?
          watch: הקשיבו למילים, ושימו לב למשפט שחוזר בשיר — ״עוד זה מדבר וזה בא״.
          pauses:
            - at: "?"
              moment: מיד אחרי הפעם הראשונה שנשמע ״עוד זה מדבר וזה בא״. עוצרים לרגע של שקט, וממשיכים.
              ask: חשבו בשקט, בלי לענות — למה דווקא המשפט הזה חוזר בשיר?
          alt: נר זיכרון, ותווים לידו
          art: {file: art/song-candle.svg}
      - slide:
          kicker: אחרי השיר
          title: איזו שורה בשיר נגעה בכם?
          sub: ואילו מחשבות ורגשות מתעוררים בעקבות הסיפור והשיר?
          cue: כשהשיר נגמר, אחרי רגע של שקט —
          echo: true
          alt: דמות יושבת מול דף עם שורות
          art:
            - {use: kid-sit, x: 50, y: 200, w: 200, color: teal}
            - {use: note, x: 330, y: 100, w: 200}
      - ask: מי רוצה לשתף שורה מהשיר שנגעה בו — או מחשבה שהסיפור עורר?

  # ------------------------------------------------------------------ 21′–30′
  - id: resilience
    title: חוסן אישי
    minutes: 9
    practices:
      - Think–Pair–Share
      - כולם כותבים
    spotlights:
      - הערכה ורפלקטיביות
      - שיתופיות בלמידה
    summary: >-
      לבד, בזוגות ובמליאה — מה נותן לנו כוח וחוסן כשרגשות מציפים, ואילו רעיונות קיבלנו זה מזה; ובסוף — דרכי
      ההתמודדות של המקור
    body:
      - quote:
          title: מהמקור — להקריא
          text: >-
            יום הזיכרון ולאחריו יום העצמאות הינם מועדים המציפים אצל כולנו רגשות שונים: כאב, עצב, חמלה ודאגה, לצד
            גאווה, שמחה, תחושת סולידריות והוקרה על הקיים.
      - say: >-
          עם צאת יום הזיכרון חוגגת ישראל את עצמאותה, את קיומה ואת החוסן שלה. ומה נותן כוח וחוסן לכל אחד מאיתנו?
      - slide:
          kicker: חוסן אישי · חושבים · בזוגות · משתפים
          title: מה נותן לכם כוח וחוסן?
          sub: כשמצבים מורכבים מציפים רגשות שונים.
          points:
            - לבד — כותבים לעצמכם
            - בזוגות — משתפים במה שבוחרים
            - במליאה — אילו רעיונות קיבלתם?
          echo: true
          alt: דמות עומדת מתחת למטרייה, וענן גשם מעליה
          art:
            - {use: rain-cloud, x: 360, y: 20, w: 190}
            - {use: umbrella, x: 200, y: 170, w: 230}
            - {use: kid-stand, x: 250, y: 240, w: 140, color: teal}
      - moves:
          - הקריאי את המשפט מהמקור — הוא מחבר בין כל הרגשות שעלו היום לבין השאלה מה נותן לנו כוח.
          - דקה וחצי של כתיבה בשקט, לעצמם. הכתיבה לא נאספת.
          - שתי דקות בזוגות עם השכן — כל אחד משתף רק במה שהוא בוחר.
          - במליאה — שאלי אילו רעיונות קיבלו זה מזה, ורשמי אותם על הלוח.
          - הציגי את דרכי ההתמודדות שבמקור, וחברי אליהן את מה שעלה מהכיתה. סיימי בהקראת הדפוסים.
      - ladder:
          help: חשבו על אדם, על מקום או על פעילות שאחריהם אתם מרגישים טוב יותר.
          challenge: מה מהדברים שכתבתם תוכלו לעשות גם ביום הזיכרון עצמו?
      - ask: אילו רעיונות קיבלתם זה מזה?
      - slide:
          kicker: חוסן אישי
          title: לכל אחד ואחת מאיתנו דרך התמודדות שונה
          sub: אין דפוס התמודדות אחד שהוא טוב לכולם.
          verbatim: true
          cue: אחרי השיתוף במליאה —
          echo: true
          alt: שש דרכים סביב ״חוסן״ — אמונה, שיתוף, ספורט, חיפוש מידע, משפחה וחברים
          art: {file: art/coping-ways.svg}
      - quote:
          title: דפוסי התמודדות במצבי קושי — מהמקור, להקריא
          text: >-
            יש אנשים שמגיבים בהתגייסות לעשייה ובפעילות פיזית. יש אנשים שמבטאים את עצמם באמצעות יצירה ודמיון. אחרים
            ירצו לבלות בקרב חברים ומשפחה ולהיעזר ברשת החברתית לביסוס תחושת הביטחון. ישנם הבוחרים להתפלל, לקוות,
            להאמין שיהיה טוב.
      - quote:
          text: >-
            אין דפוס התמודדות אחד שהוא טוב לכולם, ואין דפוסים טובים יותר מאחרים. כל אחד מהדפוסים המשרת את האדם ברגע
            נתון, הוא הנכון עבורו.

  # ------------------------------------------------------------------ +5′
  - id: hareut
    title: שיר הרעות
    kind: extension
    minutes: 5
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - עניין ורלוונטיות
    summary: מקשיבים לשיר הרעות — ״אך נזכור את כולם״ — ושואלים באלו דרכים נזכור את הנופלים
    body:
      - moves:
          - >-
            ספרי בקצרה על השיר (למטה) — מילים: חיים גורי, לחן: סשה ארגוב — הציגי את השאלה, והפעילי את השיר.
          - >-
            אחרי השיר — שאלי את השאלה שעל המסך, וחכי עשר שניות לפני שאת מזמינה תשובות. רשמי על הלוח את הדרכים
            שעולות.
      - quote:
          title: על השיר — מהמקור
          text: >-
            שיר הרעות נכתב בשלהי מלחמת העצמאות, כשנה לאחר פרוץ הקרבות, ועוסק בזכר הנופלים הישראלים במלחמה על הקמת
            המדינה.
      - video:
          title: שיר הרעות
          url: https://youtu.be/XSRBg7OUDig
          length: "3:54"
          before: ״אך נזכור את כולם״ — באלו דרכים נזכור את הנופלים?
          watch: הקשיבו למילים, ושימו לב את מי ואת מה השיר מבקש לזכור.
          pauses:
            - at: "?"
              moment: מיד אחרי השורה ״אך נזכור את כולם״ בפעם הראשונה. עוצרים לרגע, וממשיכים.
              ask: חשבו בשקט — מה השיר מבקש שנזכור?
          alt: דגל ישראל, ותווים לידו
          art: {file: art/song-flag.svg}
      - say: נזכור את הנופלים בדרכים שונות — דרך שירים, סיפורים אישיים, טקסים ועוד.

  # ------------------------------------------------------------------ 40′–45′
  # אין שלב ״חשוב לזכור״: שקף 21 של המקור (״מה למדנו היום?״) הוא רשימת פעילויות — ״הדגשנו… הכרנו… דנו… שוחחנו…״ —
  # ולא תובנות לתלמידים (D51, D65). המשפט שיש בו תובנה מוקרא בשלב ״חוסן אישי״.
  - id: exit
    title: כרטיס יציאה — אנו לא לבד
    kind: exit
    minutes: 5
    practices:
      - כרטיס יציאה
    spotlights:
      - הערכה ורפלקטיביות
      - אחריות ובחירה
    summary: אדם אחד לשתף, דרך התמודדות אחת, ושורת רשות; פתקים נאספים בדלת
    body:
      - say: >-
          שתי שאלות קצרות ושורת רשות — לבד ובשקט, שלוש דקות. כולם מוסרים פתק בדלת, גם מי שכתב רק שורה אחת.
      - exit:
          form: board
          title: לפני שיוצאים
          prompts:
            - אדם אחד שאוכל לשתף במחשבות וברגשות שעולים בי.
            - דרך התמודדות אחת שמחזקת אותי — או שאנסה.
            - רשות — משהו שריגש אותי היום.
          look_for: >-
            חפשי פתק בלי אדם לשתף, פתק שמספר על אבדן או על חרדה, ופתק שנשמע מוצף. עם אלה מדברים בשקט עוד השבוע, ומה
            שמדאיג עובר ליועצת עוד היום.
          timer: 180
          alt: דמות כותבת ליד שולחן, ושתי ידיים מושטות לידה
          art:
            - {use: kid-desk, x: 290, y: 130, w: 288}
            - {use: hands-help, x: 40, y: 80, w: 200}
      - p: עמדי בדלת ואספי את הפתקים אחד־אחד.
