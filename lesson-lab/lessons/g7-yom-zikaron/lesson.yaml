          - פתק שמספר על אבדן אישי או על מצוקה — לא מוקרא. הראי אותו ליועצת אחרי השיעור.
          - הציגי את ״אנו לא לבד!״, ותני לכל אחד רגע לחשוב בשקט על אדם אחד. לא משתפים בשמות.
      - slide:
          kicker: כולם כותבים · בלי שם
          title: אילו מחשבות ורגשות עולים בכם?
          sub: כשמדברים על יום הזיכרון — מילה או משפט על פתק.
