    summary: יום הזיכרון ויום העצמאות צמודים — למה, ומה מעורר בנו הקשר ביניהם?
    body:
      - slide:
          kicker: מה הקשר?
          title: יום עצוב… ולמחרת יום שמחה?
          sub: יום הזיכרון — ולמחרתו, יום העצמאות.
          echo: true
          alt: נר זיכרון, חץ, ודגל ישראל
          art:
            - {use: candle, x: 410, y: 140, w: 180}
            - {use: arrow, x: 238, y: 230, w: 160, color: gray}
            - {use: flag-il, x: 30, y: 184, w: 200}
      - moves:
          - >-
            השקף על המסך כשהכיתה נכנסת. שאלי למה לדעתם שני הימים צמודים, וחכי עשר שניות של שקט לפני שאת מזמינה
            תשובות.
          - שמעי שתיים–שלוש השערות, והקריאי את ההסבר מהמקור.
          - שאלי מה מעורר בהם הקשר הזה. הדהדי כל תשובה, ואל תמהרי לסכם.
      - ask: למה לדעתכם יום הזיכרון צמוד ליום העצמאות?
      - quote:
          title: ההסבר מהמקור — להקריא
          text: >-
            יום הזיכרון לחללי מערכות ישראל ולחללי פעולות האיבה נקבע יום לפני יום העצמאות, בכדי להדגיש את הקשר בין
            עצמאות ישראל ובין מחירהּ הכבד.
      - ask: מה מעורר בכם הקשר בין יום הזיכרון ליום העצמאות?
      - say: לפני שנגיע לשמחה, נעצור ביום הזיכרון עצמו — מה הוא, ומה הוא מעורר בנו.

  # ------------------------------------------------------------------ 4′–10′
  - id: feelings
    title: מה עולה בנו
    minutes: 6
    practices:
