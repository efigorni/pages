grade: 5
grades_served:
- 5
slide_kickers: false
month: ינואר
section: חברות, סובלנות ומניעת אלימות (ינואר)
unit: 'במבט רחב: פיתוח רגישות למצבי פגיעה בין חברים'
src_text: sources/text/5/Sipuru_Shel_Hagibor.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/5Grade/Mamlachti/Sipuru_Shel_Hagibor.pptx
sensitivity: med
sub: בוחנים את כוחם של העומדים מהצד, מנתחים מצבים חברתיים ומתכננים צעד קטן ובטוח לטובת חבר.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך מעשה קטן יכול לשנות מצב של פגיעה חברתית?
takeaways:
- תפעלו לעשות שינוי, גם כצופים מן הצד
- אפשר לעזור בלי להתעמת או להסתכן, ולהיעזר במבוגר.
prep:
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: heart
    x: 180
    y: 120
    w: 250
  alt: לב
steps:
- id: part-1
  title: מעשה קטן, השפעה גדולה
  minutes: 4
  practices:
  - קדימה ללמידה
  - כולם כותבים
  spotlights:
  - עניין ורלוונטיות
  summary: מעשה קטן, השפעה גדולה — איזה מעשה קטן יכול לשמח מישהו?
  body:
  - slide:
      title: איזה מעשה קטן יכול לשמח מישהו?
      art:
      - use: heart
        x: 180
        y: 120
        w: 250
      alt: לב
      echo: true
  - moves:
    - הציגי את השאלה לפני הכניסה.
    - תני שלוש דקות לכתיבה של מעשה דמיוני אחד.
    - אספי שתי דוגמאות, בלי שמות ובלי בקשת חשיפה.
  - ask: איזה מעשה קטן יכול לשמח מישהו?
  - ladder:
      help: 'התחילו במילים: אפשר להזמין, לעזור או לומר...'
      challenge: כיצד אותו מעשה עשוי להשפיע גם על מי שרואה אותו?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: כוכב ים אחד
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: כוכב ים אחד — האם עזרה לאחד משנה משהו?
  body:
  - slide:
      title: האם עזרה לאחד משנה משהו?
      art:
      - use: hands-help
        x: 180
        y: 120
        w: 250
      alt: ידיים מושטות
      echo: true
      sub: ''
  - moves:
    - 'ספרי במילים שלך: ילדה מחזירה לים כוכבי ים שנשטפו לחוף.'
    - עובר אורח שואל מה טעם לעזור כשיש רבים כל כך.
    - לילדה חשוב לעזור גם לכוכב הים האחד שבידה.
    - תני דקה לחשיבה, שתי דקות בזוגות ואספי שתי תשובות.
    - כל זוג כותב פתק לילדה ופתק לעובר האורח.
  - ask: האם עזרה לאחד משנה משהו?
  - task:
      what: 'כתבו פתק לילדה ופתק לעובר האורח: מה הייתם רוצים לומר לכל אחד על עזרה לכוכב ים אחד?'
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: למי השתנה המצב בעקבות הפעולה?
      challenge: מה אפשר להשיב למי שאומר שאין טעם אם אי אפשר לעזור לכולם?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - tip: הסיפור מסופר מחדש בקצרה, בלי להעתיק את המשל או להציג סרטון שלא נבדק.
- id: part-3
  title: מיכל והעומדים מהצד
  minutes: 10
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מיכל והעומדים מהצד — מה אפשר לעשות בלי לסכן את עצמנו?
  body:
  - slide:
      title: מה אפשר לעשות בלי לסכן את עצמנו?
      art:
      - use: shield
        x: 180
        y: 120
        w: 250
      alt: מגן
      echo: true
      sub: ''
  - moves:
    - 'הדגימי את המקרה: מיה מבקשת מהקבוצה להפסיק לדבר עם אלה; מיכל מתלבטת.'
    - 'חלקי לרביעיות שלושה מקרים: בדיחה פוגעת בקבוצת הודעות; חבר שלא מוזמן לסרט; ילד שנשאר אחרון בבחירת
      קבוצות.'
    - כל קבוצה מנסחת שתי דרכי עזרה ובוחרת פעולה אחת בטוחה.
    - תני שש דקות עבודה ושלוש דקות לשיתוף.
  - ask: מה אפשר לעשות בלי לסכן את עצמנו?
  - task:
      what: קראו את המקרה שקיבלתם. הציעו שתי דרכי עזרה, בחרו אחת בטוחה וכתבו משפט פנייה לחבר או למבוגר.
      time: 7 דקות לעבודה ושאר הזמן לשיתוף
      group: רביעיות לפי השולחנות
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: למי אפשר לפנות לעזרה, ומה אפשר לומר לילד שנפגע?
      challenge: איזו פעולה יכולה לחזק את הנפגע גם אם הפוגע אינו מקשיב?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - tip: אין להפוך ילדים ליחידת חילוץ. כשיש חשש לפגיעה פונים למבוגר; לא מתעמתים פיזית ולא מעבירים צילום
      פוגעני הלאה.
- id: part-4
  title: הכוח שמאפשר לפעול
  minutes: 7
  practices:
  - מהלכי שיח
  - זמן חשיבה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: הכוח שמאפשר לפעול — איזה כוח צריך כדי לעשות את הצעד?
  body:
  - slide:
      title: איזה כוח צריך כדי לעשות את הצעד?
      art:
      - use: star
        x: 180
        y: 120
        w: 250
      alt: כוכב
      echo: true
  - moves:
    - 'כל זוג בוחר באחת הפעולות שעלו ומוסיף לה יכולת: אומץ, אכפתיות, בחירה או פתרון בעיות.'
    - הזמיני זוג להסביר, בקשי מזוג אחר להוסיף או לחלוק בנימוק.
    - סיימי בתכנון משפט פנייה למבוגר.
  - ask: איזה כוח צריך כדי לעשות את הצעד?
  - ladder:
      help: מי יכול לעמוד לצדכם כשקשה לפעול לבד?
      challenge: איך הופכים כוונה טובה לפעולה שאפשר לבצע כבר בהפסקה?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - תפעלו לעשות שינוי, גם כצופים מן הצד
      - כוונות טובות, זיהוי הכחות שלכם ולמידת מיומנויות יסייעו לכם להתערב ולהשפיע
      - לא לפחד להשמיע קול, לשנות את המצב לטובה
      - 'סוף לפגיעה החברתית: בהפסקה, בהסעה, ברשת ובבית'
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - כתבו צעד קטן ובטוח שיעזור לילד שנשאר בחוץ.
      - למי תפנו אם לא תוכלו לעצור את הפגיעה לבד?
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: חרם, דחייה ופגיעה ברשת; אין לזהות תלמידים במקרים ואין לבקש סיפור אישי.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; מוקד 105 — המטה הלאומי להגנה על ילדים
    ונוער ברשת, 24/7'
unit_order: 3
unit_size: 3
