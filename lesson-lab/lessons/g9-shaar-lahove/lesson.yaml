sub: >-
  פרידה היא גם תודה, גם געגוע וגם התחלה חדשה. בשיעור הזה נזכרים במעבר שכבר עברנו, מוצאים משפט שמדבר אלינו
  לקראת התיכון, ומגלים ״מתנה״ — כוח שקיבלנו מהמעברים שלנו.
format: כתיבה אישית, זוגות, מעגל ומליאה
question: מה למדנו ממעברים שכבר עברנו — ואיך זה יכול לעזור לנו עכשיו, לקראת התיכון?
takeaways:
  - מכל מעבר אפשר ללמוד משהו על עצמנו — ולגלות כוחות שלא ידענו שיש לנו.
  - מה שעזר לנו במעברים קודמים יכול לעזור לנו גם במעבר לתיכון.
  - כל אחד חווה מעברים אחרת — ויש מקום לכל הרגשות.
prep:
  - שתי השאלות לזוגות (״מבט אל העבר״) — כתובות על הלוח לפני השיעור
  - נייר דבק — לתליית ״המתנות״ על הקיר

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — פרידה מהחטיבה, והיזכרות במעבר משמעותי מהעבר. שאלי מי בכיתה עבר מעבר קשה —
      גירושין, מעבר דירה או ארץ, אובדן, עזיבת בית ספר בגלל קושי — ומי מתקשה עכשיו עם המעבר לתיכון. בקשי שתהיה
      זמינה אחרי השיעור.
  - head: מי עלול להיפגע
    text: >-
      מעבר משמעותי יכול להיות גם כואב — גירושין, מעבר דירה או ארץ, מוות של קרוב. אמרי מראש שבוחרים מעבר שנוח
      לספר עליו, גם מעבר קטן כמו כיתה חדשה או חוג, ושאפשר לספר רק מה עזר, בלי פרטים. קלף אקראי עלול לגעת במקום
      רגיש — מותר להחליף אותו.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״. בזוגות מספרים רק מה שבוחרים; במעגל ובמליאה
      — רק מתנדבים. מותר לוותר, ולא קוראים בשם למי שלא הצביע. ״המתנה״ נתלית על הקיר בלי שם.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל מעבר שנכפה בגלל פגיעה, אובדן טרי או מצב קשה בבית — עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד.

time:
  clock: >-
    כאן מסתכלים בשעון. נשארו עד הצלצול 18 דקות ומעלה — שתי ההרחבות; 13–17 דקות — רק ״קיר המתנות״;
    פחות — ישר ל״חשוב לזכור״.
  short:
    steps:
      - past
      - cards
    text: >-
      ב״מבט אל העבר״ מוותרים על המליאה — רק כתיבה וזוגות; ובקלפים משתפים רק עם השכן, בלי סבב מתנדבים

brain_break:
  signs: ראשים על השולחן, פיהוקים, תשובות של מילה אחת.
  ideas:
    - name: אף ואוזן
      text: יד שמאל על האוזן הימנית, יד ימין על האף, ובמחיאת כף מחליפים. כל סבב מהר יותר.
    - name: ספירה עד עשרים
      text: >-
        הכיתה סופרת בקול עד עשרים, ובכל פעם מישהו אחר אומר מספר אחד, בלי סדר. אם שניים אומרים יחד — מתחילים
        מאחת.
    - name: מתיחה בעמידה
      text: קמים, ידיים למעלה, נמתחים לאט לצד אחד ולצד השני, ושלושה גלגולי כתפיים לאחור.
  from: insight

