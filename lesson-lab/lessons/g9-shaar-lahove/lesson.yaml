steps:
  # ------------------------------------------------------------------ 0′–5′
  - id: open
    title: פרידה עבורי היא...
    minutes: 5
    practices:
      - קדימה ללמידה
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: השלמת משפט בכתב כשנכנסים — ״פרידה עבורי היא...״; שומעים כמה משפטים, ומחברים אותם לשקף של המקור
    body:
      - slide:
          kicker: קדימה ללמידה · לבד, בכתב
          title: פרידה עבורי היא...
          sub: השלימו במשפט, או בכמה מילים — מה המילה ״פרידה״ מעוררת בכם?
          verbatim:
            - title
          timer: 120
          echo: true
          alt: דמות יושבת, ומעליה ענן מחשבה ובו דלת פתוחה
          art:
            - {use: thought, x: 30, y: 20, w: 320}
            - {use: door, x: 146, y: 84, w: 88}
            - {use: kid-sit, x: 360, y: 176, w: 230, color: purple}
      - moves:
          - השקף על המסך כשהכיתה נכנסת, וכותבים בלי הסבר נוסף. בינתיים — נוכחות.
          - אחרי שתי דקות, שמעי ארבעה־חמישה משפטים. רשמי על הלוח מילים מתוכם.
          - הציגי את השקף של המקור, והקריאי אותו. חברי אליו את המילים שעל הלוח.
      - ladder:
          help: חשבו על פרידה אחת שכבר הייתה לכם — מגן, מחבר, ממקום. מה הרגשתם?
          challenge: האם פרידה יכולה להיות גם טובה? כתבו גם את הצד השני של אותה פרידה.
      - ask: מי מוכן לקרוא את המשפט שלו?
      - slide:
          kicker: פרידה עבורי היא...
          title: מה יש בפרידה?
          points:
            - הוקרת תודה
            - חלומות שהתגשמו — וכאלה שעדיין לא
            - דמעות וכאב
            - וגם — הזדמנות להתחלה חדשה
          echo: true
          cue: אחרי המשפטים —
          alt: ענן גשם מעל נבט בעציץ
          art:
            - {use: rain-cloud, x: 200, y: 20, w: 220}
            - {use: sprout, x: 185, y: 230, w: 250}
      - quote:
          title: מהמקור — להקריא
          text: >-
            פרידות בחיים כוללות הוקרת תודה, התבוננות על חלומות שהתגשמו (וכאלה שעדיין לא), דמעות וכאב וגם...
            הזדמנות להתחלה חדשה...
      - say: >-
          פרידה היא גם סוף וגם התחלה. ואת זה כבר עשינו — כל אחד מאיתנו עבר מעברים. בואו ניזכר באחד מהם.

  # ------------------------------------------------------------------ 5′–13′
  - id: past
    title: מבט אל העבר — מעבר שזכור לי
    minutes: 8
    practices:
      - Think–Pair–Share
    spotlights:
      - עניין ורלוונטיות
      - שיתופיות בלמידה
    summary: >-
      כל אחד נזכר במעבר משמעותי שעבר — לבד, בכתב; בזוגות לפי שאלות המקור; במליאה — מה עזר לנו במעברים, ומה
      הקשר לתיכון
    body:
      - slide:
          kicker: מבט אל העבר · חושבים · בזוגות · משתפים
          title: היזכרו במעבר משמעותי שחוויתם
          sub: לכיתה א׳, לחטיבה, דירה חדשה — בחרו מעבר אחד שנוח לכם לספר עליו.
          points:
            - לבד, בכתב — דקה
            - בזוגות — 3 דקות
            - במליאה
          timer: 60
          echo: true
          alt: גשר מעל מים, ודמות עומדת בתחילתו
          art:
            - {use: bridge, x: 36, y: 230, w: 380}
            - {use: kid-stand, x: 440, y: 180, w: 150, color: teal}
      - moves:
          - הציגי את השקף. דקה של כתיבה בשקט — איזה מעבר, ומה הרגשתם בו.
          - הציגי את הנחיות השיח, ושלחי לזוגות — כל אחד מספר על המעבר שלו, לפי שתי השאלות שעל הלוח.
          - במליאה — שאלי מה עזר להם במעברים קודמים, ורשמי על הלוח ״מה עזר לנו במעברים״.
          - סיימי בשאלה על הקשר בין המעבר שלהם לבין המעבר לתיכון.
      - say: >-
          היזכרו במעבר משמעותי שחוויתם עד היום — לכיתה א׳, לחטיבה, לדירה חדשה. בחרו אחד שנוח לכם לספר עליו,
          וכתבו מה הרגשתם אז.
      - slide:
          kicker: לפני שמספרים
          title: הנחיות לשיח מיטבי
          sub: שיח מעודד ומקבל
          points:
            - הקשבה ממקום מתעניין ולא שיפוטי
            - כבוד לדברי החבר/ה
            - הנאמר בשיח נשאר בינינו, אפשר לשתף אחרים בנושא, אך לספר רק על עצמי
            - שיתוף מהלב
          verbatim: true
          echo: true
          cue: לפני השיחה בזוגות —
          alt: ארבעה סביב שולחן, ובועת דיבור ובה לב
          art:
            - {use: circle4, x: 40, y: 214, w: 300}
            - {use: speech-l, x: 336, y: 36, w: 250}
            - {use: heart, x: 411, y: 68, w: 100}
      - board:
          - חשבו ושתפו בתובנה אחת שעלתה בכם בעקבות המעבר.
          - אלו דברים סייעו לכם במעברים קודמים שהיו לכם בחיים?
      - ladder:
          help: חשבו על היום הראשון אחרי המעבר — מי או מה עזר לכם באותו יום?
          challenge: מה הייתם אומרים היום לעצמכם של אז, ביום הראשון אחרי המעבר?
      - ask: >-
          מה לדעתכם הקשר בין המעבר שחוויתם בעברכם לבין המעבר שאתם עומדים לחוות עם העלייה לתיכון?

  # ------------------------------------------------------------------ 13′–22′
  - id: cards
    title: בחרי מסלול — מסרים של קלפים
    minutes: 9
    summary: מבט אל ההווה — כל אחד מוצא קלף עם משפט על התחלות וסיומים, ומספר איזה מסר בו יעזור לו במעבר לתיכון
    body:
      - p: >-
          בשני המסלולים — אותם 16 קלפים מהנספח של המקור: משפטים על התחלות וסיומים, רובם עם שם האומר. ההבדל הוא איך
          כל אחד מקבל את הקלף שלו.
      - handout:
          title: מסרים של קלפים
          copies: שניים־שלושה עותקים, גזורים לקלפים — יותר קלפים מתלמידים, כדי שיהיה מבחר
          verbatim: true
          lines: false
          items:
            - ״זו גישתנו בתחילתה של משימה קשה, יותר מכל דבר אחר, שתשפיע על תוצאה מוצלחת״ — ווילאם ג׳ימס, פילוסוף
            - ״העבר שלך לא קובע את העתיד שלך, רק הבחירות שלך״ — אנתוני רובינס
            - ״אומץ הוא ההחלטה להתמודד עם הבלתי צפוי״ — אגאתה כריסטי
            - ״היצמדות לדברים היא האמונה שיש רק עבר. שיחרור הוא הידיעה שישנו גם עתיד.״ — דפני רוז קינגמה
            - ״אל תחכה שהחוויה תהיה טובה, עשה שהיא תהיה טובה״ — עדנה מימון
            - ״זה לא הסוף, זה אפילו לא ההתחלה של הסוף אבל זה אולי, הסוף של ההתחלה״ — ווינסטון צ׳רצ׳יל
            - ״אני לא יודע לאן אני ממשיך מכאן, אבל אני מבטיח שזה לא יהיה משעמם״ — דיויד בואי
            - ״אם אתם חושבים שתצליחו, או אם אתם חושבים שתיכשלו – אתם צודקים בשני המקרים״ — הנרי פורד
            - ״המסע, לא היעד – הוא העיקר״
            - ״עשו מה שאתם יכולים, עם מה שיש לכם, איפה שלא תהיו״ — ת׳יאודור רוזוולט
            - ״לא תמיד צריך תכנית. לפעמים צריך רק לנשום, לבטוח, להרפות, ולראות מה קורה״ — מנדי הייל
            - ״החיים הם כמו רכיבה על אופניים, כדי לשמור על איזון, חייבים להמשיך לנוע״ — אלברט איינשטיין
            - ״כל התחלה חדשה מגיעה מסופה של התחלה אחרת״
            - ״מחר הוא הדף הראשון של ספר עם 365 עמודים. כתוב ספר טוב״ — בראד פייזלי
            - ״יש בהמשך דברים טובים בהרבה מאלו שאנו משאירים מאחור״ — ק.ס. לואיס
            - ״סוף הוא לא סיום או התחלה, אלא המשכיות, עם כל החוכמה שהניסיון החדיר בנו״ — האל בורלנד
      - tracks:
          - title: בוחרים קלף
            text: >-
              הקלפים על הרצפה במרכז המעגל, הכתוב כלפי מעלה. כל אחד בוחר קלף שמבטא עמדה שהוא מאמין בה, או מסר שהוא
              צריך לקראת התיכון.
            when: אפשר לשבת במעגל ולהניח את הקלפים במרכזו, ויש זמן שכולם יעברו ויקראו.
            practices:
              - Think–Pair–Share
            spotlights:
              - אחריות ובחירה
              - עניין ורלוונטיות
            prep:
              - הכיסאות במעגל, והקלפים על הרצפה במרכזו — הכתוב כלפי מעלה
            body:
              - slide:
                  kicker: מבט אל ההווה · בוחרים קלף
                  title: איזה משפט אתם צריכים עכשיו?
                  sub: בחרו קלף אחד — עמדה שאתם מאמינים בה, או מסר שיעזור לכם במעבר לתיכון.
                  timer: 180
                  echo: true
                  alt: מניפה של קלפים גלויים, והקלף האמצעי מורם
                  art: {file: art/cards-up.svg}
              - moves:
                  - הכיתה יושבת במעגל, והקלפים במרכזו. שתי דקות — כל אחד עובר, קורא ובוחר קלף אחד.
                  - בחזרה למקום — דקה לספר לשכן איזה קלף בחר, ולמה.
                  - >-
                    במעגל — מתנדבים מקריאים את הקלף ומספרים איך הוא מתקשר למעבר שלהם לתיכון. מותר שכמה יבחרו את
                    אותו קלף.
              - say: בחרו משפט אחד שאתם מאמינים בו, או שאתם צריכים עכשיו — לקראת התיכון.
              - task:
                  what: כל אחד בוחר קלף אחד מהמרכז, מספר לשכן למה בחר בו, ומי שרוצה — משתף במעגל.
                  time: 2 דקות לבחירה, דקה עם השכן, 3 דקות במעגל
                  group: לבד, ואז עם השכן במעגל
                  rules: מותר לבחור קלף שכבר נבחר; מספרים רק על עצמנו; במעגל משתפים רק מתנדבים
                  plenary: מתנדבים מקריאים את הקלף, ואומרים איך הוא יעזור להם במעבר לתיכון
                  help: חפשו משפט שאתם מסכימים איתו — ומשם, איפה הוא פוגש אתכם.
                  challenge: בחרו דווקא משפט שאתם לא בטוחים שאתם מסכימים איתו — מה הייתם משנים בו?
              - ask: איזה קלף בחרתם — ואיך הוא קשור למעבר שלכם לתיכון?
          - title: קלף אקראי
            text: >-
              כל אחד מקבל קלף אקראי, הפוך. הופכים יחד, קוראים, ובודקים אם יש בקלף מסר שמתחברים אליו לקראת
              התיכון.
            when: אין מקום למעגל או זמן לסיבוב סביב הקלפים — או שרוצים שכל אחד יפגוש משפט שלא בחר.
            practices:
              - Think–Pair–Share
            spotlights:
              - הערכה ורפלקטיביות
              - שיתופיות בלמידה
            prep:
