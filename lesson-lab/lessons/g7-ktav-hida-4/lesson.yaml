steps:
  # ------------------------------------------------------------------ 0′–12′
  - id: riddle
    title: כתב חידה
    minutes: 12
    practices:
      - מה הקשר?
      - הוצאה למשימה
    spotlights:
      - אחריות ובחירה
      - דיפרנציאליות וגיוון
    summary: >-
      משפט בכתב סתרים מחכה על המסך; כל אחד בוחר רמה — בינונית או מאתגרת — ואם לפתור לבד או בזוג,
      ומפענח
    body:
      - slide:
          kicker: כתב חידה
          title: מה כתוב כאן?
          sub: '1ם מצ1ת2 31ף 4רכ2ם ש13 5וב4ות…'
          verbatim:
            - sub
          echo: true
          alt: זכוכית מגדלת גדולה
          art: magnifier
      - moves:
          - השקף על המסך כשהכיתה נכנסת. שאלי מה כתוב כאן, ושמעי שתיים־שלוש השערות — בלי לגלות.
          - >-
            הסבירי לפני שמחלקים: שתי רמות, בינונית ומאתגרת. כל אחד בוחר רמה, ובוחר אם לפתור לבד או בזוג.
            מותר לבקש ממך רמז — פעם אחת בלבד.
          - חלקי את הדף. אל תתערבי בבחירה — לא ברמה ולא בזוגות.
          - >-
            הסתובבי בין השולחנות. רמז אחד לכל מי שמבקש — למשל אות אחת מהמפתח (למטה). דקה לפני הסוף —
            הודיעי.
      - ask: מה כתוב כאן, לדעתכם?
      - say: >-
          יש לכם שתי רמות ושתי דרכים לעבוד — לבד או בזוג. הבחירה שלכם. מותר לבקש ממני רמז אחד בלבד, אז
          שמרו אותו לרגע שבאמת צריך.
      - slide:
          kicker: כתב חידה · 8 דקות
          title: בחרו רמה — ובחרו עם מי
          points:
            - בינונית או מאתגרת
            - לבד או בזוג
            - רמז מהמורה — פעם אחת בלבד
          timer: 480
          echo: true
          cue: אחרי ההשערות —
          alt: חץ שמתפצל לשלושה כיוונים, ודמות לידו
          art:
            - {use: arrows-fork, x: 240, y: 110, w: 300}
            - {use: kid-stand, x: 70, y: 256, w: 125, color: teal}
      - task:
          what: >-
            מפענחים משפט שמסתתר בכתב סתרים — כל ספרה מחליפה אות. בוחרים רמה, ומנסים, טועים, מוחקים ומנסים
            שוב.
          time: 8 דקות
          group: לבד או בזוג — לבחירתכם
          rules: רמז מהמורה — פעם אחת בלבד; מי שפתר ממשיך לשאלת האתגר
          plenary: לא מגלים את הפתרון — קודם מדברים על הדרך
          help: התחילו מהמילים הקצרות. איזו מילה בת שתי אותיות יכולה לפתוח משפט?
          challenge: פתרתם? נסו את הרמה השנייה — או כתבו מילה משלכם בכתב חידה, ותנו לשכן לפענח.
      - handout:
          title: כתב חידה
          copies: עותק לכל תלמיד — שתי הרמות בדף אחד
          verbatim: true
          items:
            - >-
              גרסה ברמה בינונית: ״1ם מצ1ת2 31ף 4רכ2ם ש13 5וב4ות 13 7כש3ת2. כ3 7ס2ו7 ש7כש3 9ו1 5ו4 צ45
              248מ9״. תומאס אדיסון
            - >-
              גרסה מאתגרת: ״21 2צ1ת5 31ף 9ר250 134 ע6ב69ת, 13 3407ת5. 30 57ס765 34074 168 ע96 צע9
              ק8259״. ת126ס 591ס76
      - whisper: |-
          המפתח, לבדיקה ולרמז:
          **בינונית** — 1=א · 2=י · 3=ל · 4=ד · 5=ע · 7=נ · 8=ק · 9=ה
          **מאתגרת** — 1=א · 2=מ · 3=ל · 4=ש · 5=י · 6=ו · 7=נ · 8=ה · 9=ד · 0=כ
      - p: החידה והשיחה שאחריה מבוססות על עבודה של יובל נבו, מבית הספר תבל רמות בירושלים.
      - say: עצרו — גם מי שלא סיים. לפני שנגלה את הפתרון, נדבר על הדרך.

  # ------------------------------------------------------------------ 12′–18′
  - id: talk
    title: מה קרה לכם בדרך?
    minutes: 6
    practices:
      - זמן חשיבה
      - מהלכי שיח
    spotlights:
      - הערכה ורפלקטיביות
    summary: >-
      עוצרים — גם מי שלא סיים — ומדברים על הבחירה, על הרגשות שבדרך, ועל מה שהחידה מזכירה בלמידה
    body:
      - slide:
          kicker: רגע לפני הפתרון
          title: מה קרה לכם בדרך?
          points:
            - איך בחרתם רמה — ולמה?
            - אילו רגשות עלו בזמן הפתרון? מה היה קל, ומה מתסכל?
            - במה החידה דומה ללמידה בבית הספר?
          echo: true
          alt: דמות יושבת, ומעליה ענן מחשבה ובו פנים שמחות ופנים עצובות
          art:
            - {use: thought, x: 230, y: 30, w: 320}
            - {use: face-happy, x: 285, y: 100, w: 100}
            - {use: face-sad, x: 405, y: 100, w: 100}
            - {use: kid-sit, x: 440, y: 300, w: 148, color: teal}
      - moves:
          - עוצרים — גם מי שלא סיים. הפתרון יגיע מיד אחרי השיחה.
          - >-
            חשפי את השאלה הראשונה, וספרי בלב עד עשר לפני שאת מזמינה תשובות. שמעי מי בחר כל רמה — בלי
            לשפוט אף בחירה.
          - בשאלה השנייה — על כל תשובה הדהדי, ושאלי ״למי עוד זה קרה?״.
          - השאלה השלישית היא הגשר אל הפתרון.
      - tip: >-
          שיקולים שעשויים לעלות: ״רציתי לוודא שאני מצליח״ מול ״רציתי לאתגר את עצמי״. אין בחירה נכונה —
          אפשר לשאול מתי כל אחד בוחר במשימה קלה, ומתי במאתגרת.
      - ask: איך בחרתם רמה — ומה היו השיקולים שלכם?
      - say: אז מה שהניע אותך זה ___ — הבנתי נכון? מי בחר אחרת? למה?
      - ask: ובמה החידה דומה ללמידה בבית הספר?

  # ------------------------------------------------------------------ 18′–22′
  - id: answer
    title: ומה התשובה?
    minutes: 4
    practices:
      - זמן חשיבה
    spotlights:
      - עניין ורלוונטיות
    summary: הפתרון — משפט של תומאס אדיסון — וסיפור הנורה; למה דווקא המשפט הזה?
    body:
      - slide:
          kicker: ומה התשובה לחידה?
          title: אם מצאתי אלף דרכים שלא עובדות — לא נכשלתי.
          sub: כל נסיון שנכשל הוא עוד צעד קדימה. — תומאס אדיסון
          verbatim: true
          echo: true
          alt: נורה דולקת
          art: bulb
      - moves:
          - הציגי את התשובה, והקריאי אותה בקול. מי שפתר — בודק את עצמו.
          - ספרי את סיפור הנורה, בקצרה.
          - שאלי, וחכי עשר שניות לפני שאת מזמינה תשובות.
      - say: >-
          אדיסון רצה לייצר נורה שתחזיק מעמד מאות שעות, ופעם אחר פעם הוא נכשל — הנורה נשרפה תוך זמן קצר.
          הוא ועוזריו ניסו יותר מאלפיים חומרים שונים, במשך כשנתיים, עד שמצאו חומר שמחזיק מעמד: סיב במבוק
          שהפך לפחם.
      - ask: למה, לדעתכם, בחרו דווקא במשפט הזה לחידה?
      - say: גם בחידה ניסינו, טעינו, מחקנו וניסינו שוב. ככה נראית למידה.

  # ------------------------------------------------------------------ 22′–27′
  - id: motto
    title: המוטו שלנו
    minutes: 5
    practices:
      - כולם כותבים
    spotlights:
      - עניין ורלוונטיות
    summary: כל אחד כותב על פתקית משפט אחד שנותן כוח בלמידה; מי שרוצה מדביק על הלוח, ושומעים כמה
    body:
      - say: >-
          התחלנו את השיעור בכתב חידה, ובו המשפט של אדיסון. עכשיו תורכם — משפט אחד שייתן לכם כוח בלמידה.
      - slide:
          kicker: המוטו שלנו — נותנים כוח
          title: מה המוטו שלכם?
          sub: כתבו משפט אחד מעורר השראה — על למידה.
          timer: 120
          echo: true
          alt: דגל מתנופף, ודמות מרימה יד לידו
          art:
            - {use: flag, x: 300, y: 90, w: 250}
            - {use: kid-hand, x: 110, y: 236, w: 130, color: teal}
      - moves:
          - כל אחד כותב לבד את המוטו שלו על פתקית — שתי דקות.
          - מי שרוצה — מדביק את הפתקית על הלוח. הקריאי בקול ארבע־חמש.
      - ladder:
          help: התחילו ב״כשקשה לי, אני…״ או ב״טעות היא…״.
          challenge: כתבו מוטו שיתאים גם לחבר שמתייאש מהר.
      - ask: מי מוכן להקריא את המוטו שלו?

  # ------------------------------------------------------------------ +5′
  - id: tour
    title: סיור במוטו
    kind: extension
    minutes: 5
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: עוברים ליד הלוח, קוראים את המוטו של כולם, וכל אחד מאמץ מוטו נוסף של מישהו אחר
    body:
      - slide:
          kicker: אם נשאר זמן · סיור במוטו
          title: איזה מוטו של מישהו אחר הייתם מאמצים?
          timer: 180
          echo: true
          alt: שלוש דמויות מול לוח עם פתקים
          art:
            - {use: board, x: 250, y: 50, w: 330}
            - {use: sticky, x: 300, y: 92, w: 90}
            - {use: sticky, x: 430, y: 104, w: 90, color: teal}
            - {use: group3, x: 40, y: 290, w: 300}
      - moves:
          - שורה אחרי שורה — עוברים ליד הלוח וקוראים את הפתקיות. שתי דקות.
          - כל אחד מעתיק למחברת מוטו אחד של מישהו אחר, שהיה רוצה לאמץ.
          - שמעי שלושה — איזה מוטו בחרו, ולמה.
      - say: עוברים ליד הלוח בשקט, שורה אחרי שורה. מעתיקים מוטו אחד — של מישהו אחר.
      - task:
          what: >-
            עוברים ליד הלוח, קוראים את המוטו של כולם, ומעתיקים למחברת אחד — של מישהו אחר — שהייתם רוצים
            לאמץ.
          time: 3 דקות
          group: לבד, שורה אחרי שורה
          rules: קוראים בשקט; לא מעירים על פתקיות
          plenary: שלושה מספרים איזה מוטו אימצו, ולמה
          help: חפשו מוטו שהייתם רוצים לשמוע ביום של מבחן.
          challenge: מצאו שני מוטו שונים מאוד — מה משותף להם?
      - ask: איזה מוטו אימצתם — ולמה דווקא אותו?

  # ------------------------------------------------------------------ 37′–40′
  - id: remember
    title: חשוב לזכור
    kind: messages
    minutes: 3
    practices:
      - זמן חשיבה
    spotlights:
      - הערכה ורפלקטיביות
    summary: שלושת המסרים של המקור, מילה במילה — מסר בכל שקף — ושאלה אחת לחשוב עליה
    body:
      - messages:
          items:
            - למידה היא תהליך. אי אפשר ללמוד בלי לנסות ולטעות.
            - >-
              תהליך הלמידה מעורר בנו רגשות מעורבים — סיפוק לצד יאוש, שמחה, חוסר אונים ועוד. הקושי הוא חלק
