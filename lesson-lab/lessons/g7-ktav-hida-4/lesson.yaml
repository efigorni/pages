question: מה אפשר ללמוד מניסיון שלא הצליח — ולמה כדאי לנסות שוב?
takeaways:
  - אי אפשר ללמוד בלי לנסות ולטעות — כל ניסיון שלא הצליח הוא עוד צעד קדימה.
  - בדרך לפתרון עולים רגשות מעורבים, תסכול לצד שמחה — וזה חלק מהלמידה.
  - גם הבחירה ברמת האתגר מלמדת אותנו משהו על עצמנו כלומדים.
