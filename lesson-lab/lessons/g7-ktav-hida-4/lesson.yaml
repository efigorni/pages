sub: >-
  משפט בכתב סתרים, ושתי רמות לבחירה. בשיעור הזה מפענחים, עוצרים לשאול מה הרגשנו בדרך, ומגלים מה
  אמר אדיסון על אלף דרכים שלא עובדות.
