            - אם נתאמץ וננסה — בסוף נצליח!
          ask: >-
            איזה משפט מהשלושה הייתם רוצים לזכור בפעם הבאה שמשהו לא יצליח לכם? חשבו רגע, ואז הצביעו.
          tip: >-
            הראשון והשלישי הם המשפט של אדיסון במילים של כולנו; השני מחזיר לרגשות שעלו בזמן הפתרון.
          alt: נבט בעציץ, ושעון לידו
          art:
