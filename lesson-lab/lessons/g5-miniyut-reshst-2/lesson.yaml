slug: g5-miniyut-reshst-2
title: חשיפה לתכנים לא מותאמים ברשת
grade: 5
grades_served:
- 5
slide_kickers: false
month: מרץ
section: מיניות בריאה ומניעת פגיעה מינית (מרץ)
unit: מיניות בריאה ומניעת פגיעה מינית
src_text: sources/text/5/Miniyut_Reshst_2.md
src_url: https://meyda.education.gov.il/files/shefi/kishurey_chayim/Hakochot_Shebaderech/5Grade/Mamlachti/Miniyut_Reshst_2.pptx
sensitivity: med-high
sub: מבחינים בין סקרנות לבחירה, מתרגלים סימני עצירה ומנסחים בקשת עזרה ממבוגר שסומכים עליו.
format: כתיבה, זוגות, קבוצות ומליאה
question: איך פועלים כשנתקלים בתוכן שאינו מתאים לגיל?
takeaways:
- חשיפה לתכנים לא מותאמים ברשת יכולה לקרות לילדים בגילכם גם בלי שהתכוונתם לכך.
- חשיפה לא רצויה אינה אשמת הילד; אפשר להתרחק ולבקש עזרה.
prep:
- קופסה ריקה וסימון גיל כתוב; הקופסה נשארת סגורה
- דפים וכלי כתיבה; השאלות וכרטיסי המקרים המתוארים בשלבים מוכנים על הלוח לפני השיעור
time:
  clock: כאן מסתכלים בשעון. נשארו שבע דקות — עוברים למסרים ולכרטיס היציאה; בלי מסרים נשארות ארבע דקות
    לכרטיס.
  short:
    steps:
    - part-3
    text: בקבוצות בוחרים מקרה אחד, ובמליאה שומעים שתי תשובות עם נימוק
brain_break:
  signs: הקשב מתפזר, התשובות מתקצרות או נראית עייפות.
  ideas:
  - name: מתיחה נוחה
    text: מי שרוצה מותח ידיים בעדינות ומשחרר כתפיים; אפשר גם בישיבה.
  - name: חיפוש צבע
    text: מסתכלים בחדר ומוצאים בשקט שלושה דברים באותו צבע.
  from: part-3
cover:
  art:
  - use: lock
    x: 180
    y: 120
    w: 250
  alt: מנעול
steps:
- id: part-1
  title: קופסת מסתורין
  minutes: 5
  practices:
  - מה הקשר?
  - זמן חשיבה
  spotlights:
  - עניין ורלוונטיות
  summary: קופסת מסתורין — איך סימון גיל משנה את הבחירה?
  body:
  - slide:
      title: איך סימון גיל משנה את הבחירה?
      art:
      - use: lock
        x: 180
        y: 120
        w: 250
      alt: מנעול
      echo: true
  - moves:
    - הציגי קופסה סגורה וריקה.
    - כל אחד כותב מה היה רוצה לברר לפני הפתיחה.
    - הוסיפי סימון גיל גבוה מגיל הכיתה ושאלי מה השתנה.
    - לא מבקשים לקום לפי חוויות צפייה ולא מבטיחים לחשוף תוכן מסקרן.
  - ask: איך סימון גיל משנה את הבחירה?
  - ladder:
      help: מה אפשר לשאול מבוגר על הסימון?
      challenge: האם סקרנות מחייבת לפתוח את הקופסה?
  - say: אפשר לכתוב או לצייר. אין צורך לחשוף דבר אישי; אפשר לבחור דמות דמיונית.
- id: part-2
  title: ארבעה סימני בדיקה
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: ארבעה סימני בדיקה — מה יאותת שכדאי לעצור ולהתייעץ?
  body:
  - slide:
      title: מה יאותת שכדאי לעצור ולהתייעץ?
      art:
      - use: shield
        x: 180
        y: 120
        w: 250
      alt: מגן
      echo: true
      sub: ''
  - moves:
    - רשמי על הלוח גיל, רגשות, מחשבות והתנהגות.
    - 'בזוגות מציעים סימן בכל תחום: הגבלת גיל, אי-נוחות, שאלה למבוגר או רצון להסתיר.'
    - הדגישי שגם בלי תחושת פחד סימון הגיל חשוב, ושאין צורך להמשיך לצפות כדי לבדוק.
  - ask: מה יאותת שכדאי לעצור ולהתייעץ?
  - task:
      what: 'כתבו סימן עצירה בכל תחום: גיל, רגש, מחשבה והתנהגות. הוסיפו עם מי אפשר להתייעץ.'
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: מה תעשו אם לא מופיע סימון ברור?
      challenge: איך תדעו עם מי להתייעץ לפני פתיחת תוכן חדש?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-3
  title: שלט הפיקוד פועל
  minutes: 9
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: שלט הפיקוד פועל — איזו תגובה תגן על הדמויות?
  body:
  - slide:
      title: איזו תגובה תגן על הדמויות?
      art:
      - use: traffic-light
        x: 180
        y: 120
        w: 180
      alt: רמזור
      echo: true
      sub: ''
  - moves:
    - 'חלקי שלושה תיאורים כלליים מהמקור: חבר מציע גרסת משחק לא מתאימה עם שמות ילדי הכיתה; חברות שוקלות
      סרטון חושפני; אח גדול מציע שיחת מצלמה עם זרים.'
    - 'כל זוג מפעיל עצור וקדימה: מזהה סימן, צופה השלכה ובוחר התרחקות והתייעצות.'
    - לא מדגימים את האתרים ולא מבקשים דוגמאות אישיות.
  - ask: איזו תגובה תגן על הדמויות?
  - task:
      what: 'בחרו מקרה והפעילו עצור וקדימה: זהו סימן, חשבו על השלכה ונסחו התרחקות והתייעצות.'
      time: 6 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: 'אפשר לומר: אני לא ממשיך, בוא נשאל מבוגר.'
      challenge: מה עושים אם החבר אומר שכולם כבר ראו?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
- id: part-4
  title: מבקשים עזרה
  minutes: 7
  practices:
  - הוצאה למשימה
  spotlights:
  - שיתופיות בלמידה
  - דיפרנציאליות וגיוון
  summary: מבקשים עזרה — מה אפשר לומר גם כשמביך לדבר?
  body:
  - slide:
      title: מה אפשר לומר גם כשמביך לדבר?
      art:
      - use: teacher
        x: 180
        y: 120
        w: 180
      alt: מבוגר עם ספר
      echo: true
      sub: ''
  - moves:
    - 'כל זוג מתרגל משפט קצר למבוגר: נתקלתי בתוכן שלא מתאים לי ואני צריך עזרה.'
    - הצד המקשיב עונה בלי האשמה.
    - החליפי תפקידים, ושאלי מה אפשר לעשות אם המבוגר הראשון אינו זמין.
    - אין צורך לתאר או לשחזר את התוכן.
  - ask: מה אפשר לומר גם כשמביך לדבר?
  - task:
      what: תרגלו משפט בקשת עזרה ללא תיאור התוכן. החליפו תפקידים והוסיפו מבוגר נוסף שאפשר לפנות אליו.
      time: 4 דקות לעבודה ושאר הזמן לשיתוף
      group: זוגות לפי מקומות הישיבה
      rules: כל אחד מציע רעיון; אפשר לבחור דוגמה דמיונית. התוצר נשאר בקבוצה אלא אם מסכימים לשתף.
      plenary: שתי קבוצות מציגות תשובה עם נימוק; שאר הכיתה מוסיפה או שואלת.
      help: בחרו מבוגר נוסף בבית או בבית הספר.
      challenge: איך תעזרו לחבר לפנות בלי להעביר את התוכן ביניכם?
  - say: אפשר לחשוב אחרת. הקשיבו להסבר, והוסיפו נימוק מתוך הדוגמה שעבדנו עליה.
  - tip: הכלי מסייע לבחירה ולהקשבה, אך אינו מבטיח שליטה באחרים או פתרון. האחריות לפגיעה היא של הפוגע;
      כשיש פגיעה או חשש פונים למבוגר.
- id: messages
  kind: messages
  title: חשוב לזכור
  minutes: 3
  practices:
  - זמן חשיבה
  spotlights:
  - הערכה ורפלקטיביות
  summary: קוראים את מסרי המקור, מסר בכל שקף
  body:
  - moves:
    - הקריאי את המסרים אחד־אחד. תני רגע לחשיבה לפני ההצבעה על מסר נבחר.
  - messages:
      items:
      - חשיפה לתכנים לא מותאמים ברשת יכולה לקרות לילדים בגילכם גם בלי שהתכוונתם לכך.
      - תכנים כאלה עשויים לעורר סקרנות וזה טבעי ונורמלי, אך חשוב לזכור שהם עלולים גם לפגוע ולהזיק.
      - 'שלט הפיקוד בידיים שלכם! הוא מאפשר לכם לעצור, לחשוב ולהחליט: אם התוכן מוגדר כלא מתאים לגילכם,
        הוא עלול לפגוע בכם. אם לא ברור לכם - חשוב להתייעץ!'
      - 'לא תמיד תוכלו למנוע את עצם החשיפה, אבל תמיד תוכלו לבחור איך להגיב: לעצור, להתייעץ או להתרחק מהתוכן.'
      ask: איזה מסר מתאים במיוחד לדוגמה שעבדנו עליה? חשבו רגע, ואז הצביעו כשאקרא את המספר שלו.
      art:
      - use: bulb
        x: 180
        y: 120
        w: 250
      alt: נורה דולקת
- id: exit
  kind: exit
  title: כרטיס יציאה
  minutes: 4
  practices:
  - כרטיס יציאה
  spotlights:
  - הערכה ורפלקטיביות
  summary: תשובה אישית קצרה ובחירת צעד מעשי
  body:
  - moves:
    - הציגי את השאלות ובקשי לענות בכתב בשקט. אספי את הפתקים בלי הקראה פומבית.
  - exit:
      form: board
      title: מה לוקחים איתנו?
      prompts:
      - כתבו סימן אחד שמזכיר לעצור.
      - נסחו משפט בקשת עזרה ממבוגר.
      look_for: חפשי חיבור בין הרעיון של השיעור לבין פעולה אפשרית, והבחנה בין בחירה אישית לבין צורך בעזרה.
      art:
      - use: note
        x: 180
        y: 120
        w: 250
      alt: דף לכתיבה
      timer: 180
safe:
- head: תיאום עם היועצת
  text: עדכני את היועצת בנושא השיעור ובדקי יחד התאמות לילדים שהנושא נוגע בהם כעת. בקשי שתהיה זמינה לפנייה
    אישית.
- head: מי עלול להיפגע
  text: חשיפה לתוכן מיני לא מותאם; אין להראות תוכן כזה, לשחזרו, לתארו בפירוט או לבקש גילוי אישי. חשיפה
    לא רצויה אינה אשמת הילד.
- head: לא לוחצים לשתף
  text: אפשר לעבוד על דמות דמיונית, לצפות בלבד או להעביר שאלה. לא מבקשים שמות של ילדים מהכיתה ולא מפרסמים
    דף אישי.
- head: אם מישהו משתף פגיעה
  text: 'עצרי בעדינות, הודי על השיתוף והמשיכי בשיחה אישית. פני ליועצת עוד באותו יום; אל תבטיחי סודיות.
    לצד היועצת: ער״ן 1201 — עזרה ראשונה נפשית, 24/7, גם בלי לומר שם; מוקד 105 — המטה הלאומי להגנה על ילדים
    ונוער ברשת, 24/7'
