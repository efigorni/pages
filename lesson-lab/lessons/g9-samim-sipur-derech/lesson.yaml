  # ------------------------------------------------------------------ 7′–17′
  - id: groups
    title: מתבגר אחד, שלב אחד
    minutes: 10
    practices:
      - הוצאה למשימה
    spotlights:
      - שיתופיות בלמידה
      - אחריות ובחירה
    summary: >-
      שש קבוצות, ולכל אחת תיאור של מתבגר בשלב אחד (בלי מספר השלב): כותבים עליו סיפור, נותנים לו שם, מנחשים את מקומו
      על הרצף ובוחרים פרצופון
    body:
      - moves:
          - הסבירי את המשימה לכל הכיתה לפני שמחלקים — ההוראות על הלוח, והפרצופונים על המסך כל הזמן.
          - חלקי כרטיס שלב אחד לכל קבוצה. על הכרטיסים אין מספר שלב — את זה הקבוצות מנחשות.
          - הסתובבי בין הקבוצות. שתי דקות לפני הסוף — הזכירי לתת שם, לנחש מספר ולבחור פרצופון.
          - קבוצה שמסיימת מוקדם — כותבת גם מה היה יכול לעצור את המתבגר בשלב הזה.
      - say: כל קבוצה מקבלת מתבגר אחד, בשלב אחד של הדרך. איזה שלב — את זה תנחשו בעצמכם.
      - slide:
          kicker: סיפור דרך · בקבוצות
          title: מתבגר אחד, שלב אחד
          sub: כתבו את הסיפור שלו, תנו לו שם, ובחרו פרצופון שמתאים לו.
          timer: 420
          echo: true
          alt: שישה פרצופונים בסדר מעורבב — צוחק, מחייך, אדיש, מודאג, עצוב ובוכה
          art: {file: art/faces.svg}
      - board:
          - קראו את התיאור בקול.
          - כתבו סיפור, אירוע או משחק תפקידים על המתבגר — מה הוא מרגיש, חושב וחווה.
          - תנו ליצירה שם שממחיש את השלב.
          - נחשו איפה השלב על הרצף, מ־1 עד 6 — ובחרו פרצופון שמתאים לו.
      - task:
          what: >-
            כל קבוצה קוראת תיאור של מתבגר בשלב אחד מתוך שישה, וכותבת עליו סיפור, אירוע או משחק תפקידים — מה הוא מרגיש,
            חושב וחווה. בסוף נותנים ליצירה שם, מנחשים איפה השלב על הרצף (1–6), ומציירים בפינת הדף את הפרצופון שמתאים לו.
          time: 7 דקות
          group: שש קבוצות לפי השולחנות; כרטיס שלב אחד לכל קבוצה
          rules: כותב אחד וכולם מציעים; שם בדוי בלבד — לא של מישהו מהכיתה או מבית הספר
          plenary: נציג אומר את שם היצירה ומשפט אחד ממנה, ומניח את הדף על הקו שעל הלוח
          help: התחילו כך — ״זה קרה בסוף שבוע, כש…״. ומה הוא מרגיש אחרי?
          challenge: מה היה יכול לעצור אותו בשלב הזה — ומי היה יכול לשים לב?
      - whisper: >-
          המפתח (כמו במקור, הכרטיסים לא מסודרים לפי השלבים): כרטיס 1 — שלב 5; כרטיס 2 — שלב 6; כרטיס 3 — שלב 1;
          כרטיס 4 — שלב 2; כרטיס 5 — שלב 3; כרטיס 6 — שלב 4.
      - handout:
          title: כרטיסי שלב לקבוצות
          copies: עותק אחד, גזור לשישה כרטיסים — כרטיס לכל קבוצה (המספר הוא של הקבוצה, לא של השלב)
          verbatim: true
          lines: false
          items:
            - >-
              עלייה בתדירות השימוש, במשך השימוש ובכמות הסמים. הצורך והרצון להשתמש פעמים רבות ותכופות גובר. השימוש
              בסמים נעשה במגוון דרכים ושיטות, גם שימוש עצמי, כשנמצאים לבד. המשתמש או המשתמשת מתחילים להרגיש רע וקשה להם
              להסביר את התחושה. חווים מעין פחד בלתי מוסבר, שמלווה ברגש של שעמום, דיכאון, אדישות, פאסיביות ותחושה שאין
              מוצא מהמצב. יוזמים ונוקטים פעולות להשגת הסמים וזה מלווה במגע עם סביבה עוברת חוק. לעיתים המשתמש מגוון את
              הסמים בהם הוא משתמש כדי להשיג השפעה חזקה יותר. הסם הופך מרכז החיים בשלב זה והשפעת השימוש מתרחבת וגובה מחיר
              בכל תחומי החיים. יש קשיים בזיכרון לטווח קצר, קושי להתרכז ולהקשיב, פגיעה במערכת העיכול, אימפולסיביות,
              (פעילות ללא מחשבה). לעיתים המשתמש מכיר בבעיה, ולעיתים הוא חושב שהוא שולט במצב.
            - >-
              המשתמש או המשתמשת משתמשים שוב ושוב בסמים בלי יכולת לשלוט בדחף לצרוך אותם. הם מצויים בחשיבה אובססיבית על
              השגת הסמים ונוקטים פעולות כפייתיות חוזרות ונשנות להשגתם. יש קושי להפסיק את השימוש בסמים בכוחות עצמם למרות
              המודעות לנזק ולסכנה. אי תפקוד במגוון תחומי החיים. הסם משתלט על החיים. המשתמש או המשתמשת תלויים בסם באופן
              מוחלט. הם חייבים להשתמש בו כדי לתפקד באופן נורמלי. הם אינם מסוגלים לבצע דבר בלי החומר. המשתמש או המשתמשת
              ״יוצאים״ ממעגל החיים הרגיל וכל עולמם סובב סביב הסם. אין הנאה. יש פחד מתחושות ורגשות אם וכאשר הסם יחסר או
              כשמנסים להפסיק. גם בשלב זה, לעיתים יש התכחשות לקיום הבעיה והמשתמש או המשתמשת אינם מודים שהם מכורים ושהם
              חולים במחלת ההתמכרות.
            - >-
              התנסויות מעטות, מזדמנות ומקריות שמתרחשות במהלך מפגשים חברתיים. הנער או הנערה מתנסים בשימוש בסמים (קנאביס)
              מסיבות וממניעים מגוונים — סקרנות (אינטלקטואלית ורגשית), השפעת חברים, רצון להרגיש חלק מהקבוצה, צורך בשייכות,
              חיפוש אחר תחושת כיף, צורך בהתנסות, בהפגת תחושת שעמום, בחיפוש ריגושים וסיכונים, חוסר בטחון, ״מרד״ במבוגרים –
              יציאה לעצמאות, רצון להקהות ולהפחית רגשות לא נעימים בשל קשיים אישיים/ חברתיים / משפחתיים. ההרגשה וההתנהגות
              בעקבות ההתנסות בשימוש בסמים היא אישית ושונה מהאחד לשני, החל מהיעדר השפעה ועד להנאה וכיף. הוא או היא
              מתנסים ומחליטים מיד להפסיק, בין אם נהנו ובין אם התאכזבו. יחד עם זאת, לעיתים ההתנסות לא מסתיימת בניסיון
              אחד בלבד ואחרי הראשונה יהיו עוד התנסויות.
            - >-
              הנער או הנערה משתמשים בסמים כשהם בין חברים, כחלק ממפגש וכבילוי בשעות הפנאי, ובדרך כלל רובם מרגישים טוב.
              המשתמש או המשתמשת אינם יוזמים את השגת החומרים אך בוחרים להגיע למפגשים אלה בידיעה שיהיה בהם ״חומר״. זהו
              שלב שבו המשתמש או המשתמשת מרגישים משוחררים ובטוחים בעצמם ונדמה להם כי הרגשתם הטובה תימשך כך לעולם. הם
              משוכנעים שכל הסיפורים על נזקים והתמכרות לא שייכים אליהם — ״לי זה לא יקרה״. יחד עם זאת יש כבר גם כמה דברים
              לא נעימים כמו חשש פן ההורים יגלו, פחד, התרחקות של החברים הקודמים, רצון שהדבר לא יתגלה בבית הספר ועוד. בשלב
              זה המשתמש או המשתמשת לא מעוניינים כלל להפסיק, השימוש עונה על הצרכים שלהם גם אם לא תמיד הם מודעים לקשר
              הזה. המשתמש או המשתמשת לומדים שהסם עוזר להשיג מטרות. הם משקיעים זמן ואנרגיה כדי להיות במקום ובזמן בו
              משתמשים ולהשיג כסף כדי לקבל את הסם.
            - >-
              המשתמש או המשתמשת נוקטים בחיפוש יזום של סמים, בתדירות שאינה קבועה. לרוב השימוש הוא חלק מפעילות שימוש של
              החברים ואיתם במפגשים, בבילויים. השימוש מתקיים כהרגל קבוע — בסופ״ש, אחת לכמה ימים או שבועות, מלווה את המפגש
              החברתי ומתבצע בדרך כלל עם אותם אנשים. המשתמש או המשתמשת אינם מעוניינים לוותר על השימוש בסמים כי ברוב
              המקרים הם נהנים. יחד עם זה הסביבה מתחילה לזהות בהם שינויים מדאיגים — שינוי בלבוש ובמראה החיצוני. שינויים
              קיצוניים במצבי הרוח. ירידה בתפקוד הלימודי ובהישגים הלימודיים. מריבות במשפחה ולפעמים ניתוק הקשרים. שינוי
              בקבוצת החברים (או התווספות חברים).
            - >-
              המשתמש או המשתמשת משתמשים בסמים בכוונה תחילה, שימוש תכוף, לרוב עם חברים, גם במהלך השבוע. השימוש הוא שגרת
              הבילוי הקבועה, המפגשים החברתיים מתוכננים סביבו והוא המטרה שלהם. קבוצת המשתמשים הופכת להיות קבוצת השייכות
              וההשתייכות ויש ריחוק מחברים קודמים או אחרים. ההנאה מהשימוש והקשיים שהשימוש גורם למשתמש או למשתמשת, מתחילים
              להשתוות. הם נהנים מעצם השימוש בסמים כי נדמה להם שהשימוש פותר גם את הבעיות שהוא גורם להן. המשתמש או המשתמשת
              ״מטשטשים״ את הבעיות על ידי השימוש ואז הם מרגישים טוב, אך למעשה זו רק אשליה, זו בריחה לזמן קצר ממצב הרוח
              הקשה ומהבעיות. בעצם, הבעיות לא נפתרות, הן רק מעמיקות. זהו שלב בו המשתמש או המשתמשת מכחישים שיש להם בעיות
              ועדיין מאמינים באמת ובתמים שהם שולטים בעניינים ויכולים להפסיק להשתמש בסמים כשרק ירצו. כשעוברת השפעת השימוש
              בסמים, ההרגשה הרעה חוזרת. הבעיה מחריפה והמשתמש או המשתמשת שוב מחפשים סמים כדי להרגיש טוב יותר. התנהגות זו
              חוזרת על עצמה…
      - say: עצרו. כל קבוצה — שם היצירה, משפט אחד ממנה, ואיפה מיקמתם אותה על הקו.

