    to: יותר.

sub: >-
  התנסות ״רק פעם אחת״ יכולה להפוך לדרך ארוכה — ואי אפשר לדעת מראש אצל מי. בשיעור הזה צופים בכתבה, כל קבוצה
  כותבת סיפור על מתבגר בשלב אחד, ויחד מרכיבים את רצף השימוש בסמים.
format: קבוצות ומליאה
question: איך התנסות מזדמנת בסמים יכולה להפוך לתלות — ולמה אי אפשר לדעת מראש אצל מי?
takeaways:
  - שימוש בסמים הוא תהליך — מהתנסות מזדמנת, דרך שימוש קבוע, ועד תלות והתמכרות.
  - התהליך שונה מאדם לאדם, והגבולות בין השלבים לא חדים — ואין דרך ודאית לדעת מראש מי יתמכר.
  - בתחילת הדרך קל להאמין ש״לי זה לא יקרה״ — ודווקא אז חשוב לעצור ולראות את כל הדרך.
prep:
  - חלוקה מראש לשש קבוצות לפי השולחנות
  - >-
    ארבע ההוראות לקבוצות (״מתבגר אחד, שלב אחד״) — כתובות על הלוח לפני השיעור, ולידן קו ארוך עם המספרים 1–6
  - נייר דבק או מגנטים, לתליית דפי הקבוצות על הקו

safe:
  - head: תיאום עם היועצת
    text: >-
      ספרי לה מתי השיעור ועל מה — רצף השימוש בסמים, מהתנסות ועד התמכרות, עם כתבה על בני נוער שמעשנים קנאביס.
      שאלי אם יש בכיתה מי שהנושא קרוב אליו מדי: מי שכבר משתמש, מי שבן משפחה או חבר קרוב שלו מכור או בטיפול, או
      מי שאיבד מישהו. בקשי שתהיה זמינה אחרי השיעור, ושאלי אותה למי מפנים תלמיד שמבקש עזרה.
  - head: מי עלול להיפגע
    text: >-
      מי שמישהו קרוב אליו מכור עלול לזהות אותו בכרטיסי השלבים. מדברים על המתבגר שבסיפור ועל התהליך, לא על
      ״נרקומנים״ כאנשים, ולא שואלים מי ניסה או מי מכיר מישהו. בסיפורים — שמות בדויים בלבד. תלמיד שאומר ש״לא כל מי
      שמשתמש נפגע״ — לא מתווכחים איתו; זה נכון, ובדיוק לכן חשוב המסר שאי אפשר לדעת מראש מי ייפגע.
  - head: לא לוחצים לשתף
    text: >-
      כלל השיח של היום: ״מספרים רק על עצמנו, ומה שנאמר כאן נשאר כאן״ — הוא גם על השקף הראשון. במליאה משתפים רק
      מתנדבים; מותר לוותר, ולא קוראים בשם למי שלא הצביע. בקבוצה כל אחד בוחר את החלק שלו — כותב, מציע או מציג.
  - head: אם מישהו משתף פגיעה
    text: >-
      למשל שימוש שקורה עכשיו — אצלו או אצל חבר — או בן משפחה מכור: עוצרים בעדינות, מודים, וממשיכים בשיחה אישית אחרי
      השיעור. מעדכנים את היועצת עוד באותו יום, ולא מבטיחים לשמור בסוד. לצד היועצת — ער״ן (1201): עזרה ראשונה נפשית
      בטלפון, 24/7, גם בלי לומר שם.

