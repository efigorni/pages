<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="{{theme_color}}">
<meta name="color-scheme" content="{{scheme}}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="{{status_bar}}">
<meta name="apple-mobile-web-app-title" content="{{short_name}}">
<title>{{name}}</title>
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{name}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_alt}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  if (location.protocol !== 'file:') {
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.webmanifest';
    document.head.appendChild(link);
  }
</script>
<style>
{{style}}</style>
<style id="base">
{{base}}</style>
</head>
<body data-progress="{{progress}}">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-memory" viewBox="0 0 48 48">
    <path fill-rule="evenodd" fill="currentColor" transform="translate(12.5 24) rotate(-5)" d="M-6.5-14H6.5A3 3 0 0 1 9.5-11V11A3 3 0 0 1 6.5 14H-6.5A3 3 0 0 1-9.5 11V-11A3 3 0 0 1-6.5-14ZM0-6.5 1.6-2.2 6.2-2 2.6.85 3.8 5.3 0 2.75-3.8 5.3-2.6.85-6.2-2-1.6-2.2Z"/>
    <path fill-rule="evenodd" fill="currentColor" transform="translate(35.5 24) rotate(5)" d="M-6.5-14H6.5A3 3 0 0 1 9.5-11V11A3 3 0 0 1 6.5 14H-6.5A3 3 0 0 1-9.5 11V-11A3 3 0 0 1-6.5-14ZM0-6.5 1.6-2.2 6.2-2 2.6.85 3.8 5.3 0 2.75-3.8 5.3-2.6.85-6.2-2-1.6-2.2Z"/>
  </symbol>
  <symbol id="i-quiz" viewBox="0 0 48 48">
    <circle cx="24" cy="16.5" r="12" fill="currentColor"/>
    <path d="M4 46.5C4 36.5 12.5 31 24 31S44 36.5 44 46.5Z" fill="currentColor"/>
    <path class="cut" d="M20.1 12.6A4 4 0 1 1 26.9 15.2C25.2 16.4 24 17.3 24 19.6" fill="none" stroke-width="3.2" stroke-linecap="round"/>
    <circle class="cut" cx="24" cy="24" r="1.9"/>
  </symbol>
  <symbol id="i-cards" viewBox="0 0 48 48">
    <rect x="25.5" y="4.5" width="18" height="18" rx="4" fill="currentColor"/>
    <rect x="4.5" y="4.5" width="18" height="18" rx="4" fill="currentColor"/>
    <rect x="25.5" y="25.5" width="18" height="18" rx="4" fill="currentColor"/>
    <rect x="6" y="27" width="15" height="15" rx="2.6" fill="none" stroke="currentColor" stroke-width="3"/>
    <path class="cut" d="M29.6 13.9l3.4 3.3 6.4-7M8.6 13.9l3.4 3.3 6.4-7M29.6 34.9l3.4 3.3 6.4-7" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24">
    <path d="M7.5 10.5V8a4.5 4.5 0 0 1 9 0v2.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="4.5" y="10" width="15" height="11.5" rx="2.6" fill="currentColor"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24">
    <path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l10.8-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2Z" fill="currentColor"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path d="M19.5 12H6M11.5 5.5 5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-star" viewBox="0 0 24 24">
    <path d="M12 2.6l2.75 5.95 6.5.73-4.83 4.4 1.35 6.4L12 16.8l-5.77 3.28 1.35-6.4-4.83-4.4 6.5-.73Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>
</svg>
<div class="app" id="app" data-phase="start" data-mode="memory" data-found="0">
  <header class="hud">
    <div class="pips" id="pips" aria-hidden="true"></div>
    <button class="icon-btn" id="mute" type="button" aria-label="קול" aria-pressed="false">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.1v13.8l-4.7-4.1H3.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.4a8 8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.1v13.8l-4.7-4.1H3.5z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="again" type="button" aria-label="משחק חדש">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5A8 8 0 1 1 17.3 5.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M18.8 2.6v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <main class="board" id="board"></main>
  <section class="quiz" id="quiz">
    <div class="prompt">
      <button class="big say bubble" id="say" type="button" aria-label="לשמוע שוב"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <p class="question" id="question" aria-live="polite"></p>
    </div>
    <div class="picks" id="picks"></div>
  </section>
  <section class="cards" id="cards">
    <div class="prompt shelf-bar">
      <button class="big say next-new" id="next-new" type="button" aria-label="לכרטיס החדש הבא"><svg aria-hidden="true"><use href="#i-play"/></svg><span class="new-dot" aria-hidden="true"></span></button>
      <p class="shelf-count"><svg aria-hidden="true"><use href="#i-star"/></svg><span id="shelf-count" dir="ltr"></span></p>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>
</div>

<section class="overlay start show" id="start">
  <div class="start-stage">
    <h1 class="title">{{title}}</h1>
    <div class="fan" id="fan" data-face="band" aria-hidden="true"></div>
    <div class="modes">
      <button class="mode" id="play" type="button" aria-label="משחק זיכרון"><span class="big play"><svg aria-hidden="true"><use href="#i-memory"/></svg></span><span class="mode-label">זיכרון</span></button>
      <button class="mode" id="play-quiz" type="button" aria-label="חידון: {{ask}}"><span class="big play"><svg aria-hidden="true"><use href="#i-quiz"/></svg><span class="lock" aria-hidden="true"><svg><use href="#i-lock"/></svg></span></span><span class="mode-label">{{ask}}</span></button>
      <button class="mode" id="play-cards" type="button" aria-label="כרטיסיות"><span class="big play"><svg aria-hidden="true"><use href="#i-cards"/></svg></span><span class="mode-label">כרטיסיות</span></button>
    </div>
  </div>
  <button class="install" id="install" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v7M8.8 11.6 12 14.8l3.2-3.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>הוספה למסך הבית</span>
  </button>
</section>

<section class="overlay confirm" id="confirm" inert>
  <div class="confirm-box">
    <div class="modes">
      <button class="mode" id="yes" type="button" aria-label="משחק זיכרון חדש"><span class="big"><svg aria-hidden="true"><use href="#i-memory"/></svg></span><span class="mode-label">זיכרון</span></button>
      <button class="mode" id="yes-quiz" type="button" aria-label="חידון חדש: {{ask}}"><span class="big"><svg aria-hidden="true"><use href="#i-quiz"/></svg><span class="lock" aria-hidden="true"><svg><use href="#i-lock"/></svg></span></span><span class="mode-label">{{ask}}</span></button>
      <button class="mode" id="yes-cards" type="button" aria-label="כרטיסיות"><span class="big"><svg aria-hidden="true"><use href="#i-cards"/></svg></span><span class="mode-label">כרטיסיות</span></button>
    </div>
    <button class="big no" id="no" type="button" aria-label="לא, להמשיך לשחק">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
  </div>
</section>

<section class="overlay win" id="win" inert>
  <div class="win-stage">
    <svg class="trophy" viewBox="0 0 120 120" aria-hidden="true">
{{trophy}}    </svg>
    <div class="modes">
      <button class="mode" id="replay" type="button" aria-label="משחק זיכרון חדש"><span class="big"><svg aria-hidden="true"><use href="#i-memory"/></svg></span><span class="mode-label">זיכרון</span></button>
      <button class="mode" id="replay-quiz" type="button" aria-label="חידון חדש: {{ask}}"><span class="big"><svg aria-hidden="true"><use href="#i-quiz"/></svg><span class="lock" aria-hidden="true"><svg><use href="#i-lock"/></svg></span></span><span class="mode-label">{{ask}}</span></button>
      <button class="mode" id="replay-cards" type="button" aria-label="כרטיסיות"><span class="big"><svg aria-hidden="true"><use href="#i-cards"/></svg></span><span class="mode-label">כרטיסיות</span></button>
    </div>
  </div>
</section>

<section class="overlay flash" id="flash" inert>
  <div class="flash-stage">
    <div class="flash-slot" id="flash-slot" data-face="band"></div>
    <div class="flash-nav">
      <button class="big" id="prev" type="button" aria-label="הכרטיס הקודם"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
      <button class="big say bubble" id="hear" type="button" aria-label="לשמוע שוב"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <button class="big" id="next" type="button" aria-label="הכרטיס הבא"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </div>
  </div>
  <button class="icon-btn close" id="close" type="button" aria-label="חזרה לכל הכרטיסים">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
  </button>
</section>

<div class="progress" id="progress" role="progressbar" aria-label="מה שכבר למדת" aria-valuemin="0" aria-valuenow="0">
  <svg class="progress-star" aria-hidden="true"><use href="#i-star"/></svg>
  <span class="progress-track"><span class="progress-fill"></span></span>
  <span class="progress-count" id="progress-count" dir="ltr"></span>
</div>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<script id="data">
{{data}}
</script>
<script id="club">
{{club}}</script>
<script id="engine">
{{engine}}</script>
</body>
</html>
